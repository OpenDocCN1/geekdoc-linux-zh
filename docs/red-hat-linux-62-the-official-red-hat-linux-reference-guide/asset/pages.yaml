- pgno: 160
  md: '# 7 Gnome-RPM


    One of the most convenient package manipulation tools available is Gnome-RPM,
    a graphical tool which runs under the X Window System. Gnome-RPM was written by
    James Hendrickridge (james@daa.com.au); RPM 3.0 support was written by Red Hat
    and additional rpmfind code was written by Daniel Veillard.


    Gnome-RPM (which is also referred to as gnrpm) allows the end-user to easily work
    with RPM technology; it is fast, powerful and features a friendly interface.


    To learn more about RPM technology, turn to Chapter 6, Package Management with
    RPM.


    Gnome-RPM is "GNOME-compliant," meaning that it seamlessly integrates into GNOME,
    the X Window System desktop environment.


    With Gnome-RPM, you can easily


    +   - install RPM packages

    - uninstall RPM packages

    - upgrade RPM packages

    - find new RPM packages

    - query RPM packages

    - verify RPM packages


    The interface features a menu, a toolbar, a tree and a display window of currently
    installed packages.


    Operations are often performed in Gnome-RPM by finding and selecting packages,
    choosing the type of operation to perform via push-button on the toolbar, through
    the menu or by right-clicking with the mouse.


    +   - Installing a package places all of the components of that package on your
    system in the correct locations.

    - Uninstalling a package removes all traces of the package except for configuration
    files you have modified.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '• Upgrading a package installs the newly available version and uninstalls all
    versions that were previously installed. This allows quick upgrading to the latest
    releases of packages. Refer to Section 7.4, Configuration for information on how
    to alter the default settings for installing and uninstalling packages.


    You can also use the Web find option to search the Internet for newly released
    packages. You can direct Gnome-RPM to search for particular distributions when
    you want to look for new packages. (If you have a slow connection, this option
    can take some time to fully execute.) See Section 7.4, Configuration for more
    information about this feature.


    # Please Note


    Exercise caution if you choose to use the Web find option, since there is no way
    to verify the integrity of the many packages which are available at numerous repositories.
    Before installing packages, you should perform a query on that package to help
    you determine whether it can be trusted. Packages not produced by Red Hat are
    not supported in any way by Red Hat.


    Gnome-RPM to perform all of these and many other operations are the same as using
    rpm from the prompt. However, the graphical nature of Gnome-RPM often makes these
    operations easier to perform.


    The usual way to work with Gnome-RPM is to display the available packages, select
    the package(s) you want to operate on, and select an option from the toolbar or
    menu which performs the operation. However, Gnome-RPM is flexible enough to display
    packages in a variety of views, thanks the use of filters. Refer to Section 7.3,
    Installing New Packages for more information on using filters to identify packages.


    You can install, upgrade or uninstall several packages with a few button clicks.
    Similarly, you can query and verify more than one package at a time. Because of
    Gnome-RPM''s integration with GNOME, you can also perform installation, query
    and verification on packages from within the GNOME File Manager.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 7.1 Starting Gnome-RPM


    You can start Gnome-RPM from either an Xterm window or from the GNOME desktop
    Panel (Main Menu Button => System => GnoRPM).


    To start Gnome-RPM from an Xterm window, at simply type


    ```

    gnorpm &

    ```


    That will bring up the main Gnome-RPM window (as shown in Figure 7–1, Main Gnome-RPM
    Window).


    # Please Note


    > If you would like to install, upgrade or uninstall packages, you must be in
    root. The easiest way to do this is to type to become root, and then type the
    root password at a shell prompt. However, it isn''t necessary to be root in order
    to query and verify packages.


    There are several parts to the Gnome-RPM interface.


    +   Package Panel - On the left; allows you to browse and select packages on your
    system.


    +   Display window - To the right of the package panel; shows you contents of
    folders in the panel.


    +   Toolbar - Above the display and panel; a graphical display of package tools.


    +   Menu - Above the toolbar; contains text-based commands, as well as help info,
    preferences and other settings.


    +   Status bar - Beneath the panel and display windows; shows the total number
    of selected packages.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Chapter 7:Gnome-RPM


    # Figure 7–1 Main Gnome-RPM Window


    ![](img/a62cd8edb5919f938a546de403f602c6_163_0.png)


    Packages Selected: 0


    # 7.2 The Package Display


    Each folder icon in the tree view at represents a group of packages. Each group
    can contain subgroups. Groups are used to place packages that perform similar
    functions in locations. For example, the folder Editors contains text editors
    such as ed, vim and Edit. From the tree view you might find another folder beneath
    Editors Emacs, which would contain both emacs and emacs-X11.


    The tree view is also arranged in an expandable and collapsible manner, which
    helps you to easily navigate through the packages. A folder that appears with
    a + next to it indicates that there are subfolders within that category.


    To view the packages and subgroups within a group, click on a folder or a + with
    your left mouse button. The display window will then show the contents of that
    folder. By default, you will be presented with icons to represent the packages.
    You can change that view to a list view by selecting View as list from the Interface
    tab'
  merge: -1
