- pgno: 242
  md: '# Section 10.11:Installing LILO


    > WARNING


    To create a dual-boot environment on a system that currently has NT, you must
    install LILO on the first sector of the root partition, not the MBR. Please be
    sure to create a boot disk. In a case as this, you will either need to use the
    boot disk, or configure the NT system loader to boot LILO from the first sector
    of the root partition. Be sure to check out http://www.linux-uxdoc.org/HOWTO/mini+NT-Loader.html
    for more information on setting up LILO and NT.


    # The Master Record (MBR)


    The recommended place to install LILO, unless the MBR already starts another OS
    loader, such System Commander or OS/2’s Boot Manager. The MBR is a special area
    on your hard drive that is automatically loaded by your computer’s BIOS, and is
    the earliest point at which LILO can take control of the boot process. If you
    install LILO in the MBR, when your machine boots, LILO will present a boot: prompt.
    You can then boot Red Hat Linux or any other operating system you configure LILO
    to boot.


    # The first sector of your boot partition


    Recommended if you are already using another boot loader on your system (such
    as OS/2’s Boot Manager), your other boot loader will take control first. You can
    then configure that boot loader to start LILO (which will then boot Red Hat Linux).


    The location where you wish to install LILO and press OK.


    Finally the installation program lets you set the default operating system and
    specify boot labels, as in Figure 10–25, Selecting Bootable Partitions in LILO
    Configuration Dialog.'
  merge: -1
  img_proc: true
