- pgno: 354
  md: '# Section F.5:Kickstart Commands


    ```

    --gateway

    Default gateway as an IP address.

    --nameserver

    Primary name server, as an IP address.

    --netmask

    Netmask for the installed system

    ```


    There are three different methods of network configuration:


    +   - DHCP

    - BOOTP

    - static


    The DHCP method uses a DHCP server system to obtain its networking configuration.
    As you might guess, the BOOTP method is similar, requiring a BOOTP server to supply
    the networking configuration.


    The static method requires that you enter all the required networking information
    in the kickstart file. As the name implies, this information is static, and will
    be used during the installation, and after the installation as well.


    To direct a system to use DHCP to obtain its networking configuration, use the
    following line:


    ```

    network --bootproto dhcp

    ```


    To direct a machine to use BOOTP to obtain its networking configuration, use the
    line in the kickstart file:


    ```

    network --bootproto bootp

    ```


    The line for static networking is more complex, as you must include all network
    configuration information on one line. You’ll need to specify:


    +   - IP address'
  merge: -1
  img_proc: true
- pgno: 355
  md: '+   - netmask

    - gateway IP address

    - name server IP address


    Here’s an example static line:


    ```

    network --bootstrap static

    --ip 10.0.2.15

    --netmask 255.255.255.0

    --gateway 10.0.2.254

    --nameserver 10.0.2.1

    ```


    # Please Note


    The entire network configuration must appear on one line! We’ve wrapped it here
    to make it easier to read.


    There are two restrictions you must keep in mind should you use the static method:


    +   - All static networking configuration information must be specified on one
    line; you cannot wrap lines using a backslash, for example.

    - You can only specify one name server here. However, you can use the kickstart
    file’s %post section (described in Section F.5.23, %post --Post-Installation Configuration
    Section) to add more name servers, if needed.


    # F.5.13 partition


    part (required for installs, ignored for upgrades)


    Create a partition on the system. Partition requests are of the:


    ```

    part <mntpoint> --size <size> [--grow] [--onpart <partc>] [--ondisk <disk>

    ```'
