    # Countermeasure of Password Cracking


    To prevent password cracking, your computer password should have at least twelve
    characters. However, if you have a good memory, a sixteen-character password is
    highly recommended because it is quite hard to crack. Here are some of the things
    you need to know about a secure computer password:'
