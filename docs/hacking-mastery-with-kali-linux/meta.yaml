    \nNow, let's narrow our result by applying a display filter.\n\nAs we can see,\
    \ I applied a TCP display filter and now I can see only TCP packets.\n\n## Wireshark\
    \ Top Filters\n\n- 1. Protocol Filter\n\nWe can use a display filter or capture\
    \ filter to capture packets from a specific **protocol**. Just specify the **protocol**\
