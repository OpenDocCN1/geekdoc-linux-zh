    # **Copying Files From a Directory**


    In this section, we are going to learn, how to copy a file or directory form one
    place to another using terminals. We will also cover few interesting options which
    will make our work easier.


    Before learning about copy command and its options, let us under it''s structure.


    “Cp” stands for copy, and we use this command to copy files and directories. It
    works the same as it would in Windows, but here we use a terminal instead of graphical
    user interface.


    ```

    ```

    cp [options] destination path

