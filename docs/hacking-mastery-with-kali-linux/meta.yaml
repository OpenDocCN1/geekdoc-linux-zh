    Before understanding the basic terminal commands, we need to understand what a
    terminal is and how it works.


    # What is a Terminal?


    A terminal is a display that returns the output of any command that you use or
    execute. Its main function is to process your input and display an output. There
    is a program running in the background which helps the program to understand what
    you are typing and what the output will be.


