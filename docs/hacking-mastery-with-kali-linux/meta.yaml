    在这里，您会看到许多选项。使用下箭头选择“Graphical Installation”并点击继续。


    - **15.** 选择语言。我们建议使用您的母语或任何您能流畅交流的语言，这样您就不会遇到任何困难。


    ## 选择一种语言


    选择安装过程中使用的语言。所选语言也将作为安装系统的默认语言。


    语言：

    - Chinese (Simplified) - 中文(简体)

    - Chinese (Traditional) - 中文(繁體)

    - Croatian - Hrvatski

    - Czech - Čeština

    - Danish - Dansk

