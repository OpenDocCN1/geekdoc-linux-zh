    \ (Quick lookup) done (from entity \"maltego.000webhostapp.com\")\n```\n\nMaltego\
    \ is very fast, so it takes a few seconds to complete basic scans.\n\n![](img/1c2536675428833ea4f129c9e6fbc137_135_0.png)\n\
    \nFrom the screenshot above, you can verify that the scan is complete, and we\
