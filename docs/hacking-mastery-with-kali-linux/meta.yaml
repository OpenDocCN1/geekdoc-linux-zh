- md: "## Moving files from a directory\n\nThe difference between copying and moving\
    \ is that copying creates a file that is same to the selected file or folder and\
    \ places the duplicate in a different drive or folder. Moving, on the other hand,\
    \ transfers the original files from one location to another. The \"move\" command\
    \ deletes the original files and preserves them when copying. With Kali Linux,\
    \ the \"move\" option is also used to rename the file or directory because there\
    \ is no rename option. Let us go ahead and see how it works.\n\nI have created\
    \ a file in the desktop and named it \"**test**.\" Now let's move the file from\
    \ the Desktop folder to Documents.\n\n```\nroot@kali:/home/anon/Downloads# mv\
    \ test /home/anon/Desktop/\nroot@kali:/home/anon/Downloads# cd ..\nroot@kali:/home/anon#\
    \ cd Desktop\nroot@kali:/home/anon/Desktop# ls\nEvil-Droid  payload.exe  test\
    \  test.txt  Veil\nroot@kali:/home/anon/Desktop#\n```\n\nAgain, if you want a\
    \ confirmation while copying, then you can use the \"-i\" option. It will prompt\
    \ before overwriting any file or directory.\n\n## Deleting files & directory\n\
    \nSo far, we have learned how to create files and directories, list the content\
    \ of a directory and to list the content of the file. What if we want to delete\
    \ these files? We can do so using rm command. Let us go ahead and see how you\
    \ can use this command to remove the files & directory.\n\n### rm [file name]\n\
    \n```\nroot@kali:/home/anon/Desktop# ls\nEvil-Droid  payload.exe  test.txt  Veil\n\
    root@kali:/home/anon/Desktop# rm test.txt\nroot@kali:/home/anon/Desktop# ls\n\
    Evil-Droid  payload.exe  Veil\nroot@kali:/home/anon/Desktop#\n```\n\nNow, we can\
    \ see test file is removed from the desktop directory.\n\n### rmdir [file name]\n\
    \n```\nroot@kali:/home/anon/Desktop# ls\nEvil-Droid payload.exe test Veil\nroot@kali:/home/anon/Desktop#\
    \ rmdir test\nroot@kali:/home/anon/Desktop# ls\nEvil-Droid payload.exe Veil\n\
    root@kali:/home/anon/Desktop#\n```\n\nWe can use rmdir command to remove empty\
    \ directories.\n\n### -r\n\n```\nroot@kali:/home/anon/Desktop# rm -r test\nroot@kali:/home/anon/Desktop#\n\
    ```\n\nWe can use the \"-r\" option with rm to remove a directory including its\
    \ content.\n\n## Package management\n\nKali Linux packages are very similar to\
    \ Windows OS. We can install any package at any time using the apt command. Apt\
    \ stands for Advanced Packaging Tool. In addition, there are a number of different\
    \ commands we can use with apt.\n\nFor example, if I want to connect the client\
