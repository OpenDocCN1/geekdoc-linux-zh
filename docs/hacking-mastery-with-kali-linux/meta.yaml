    ## Linux basics


    ### Basic overview


    Once have installed Kali Linux 20.3 on the virtual machine, we can go ahead and
    explore its functions. However, before you start, you should know that Kali Linux
    releases a new version every few months or quarters. In the last few years, however,
    there have been no significant changes that attract much attention. As such, what
    we will learn in this book applies to all versions of Kali Linux regardless of
    the version. Note that only a few cosmetic changes have occurred, but we will
    deal with all these changes in a moment. Before getting into it, if you have not
    yet updated your Kali Linux version, consider updating it. You can do so by typing
    "apt update & apt-full upgrade"


    ### What changes in Kali Linux 2020.3?


    As I said before, there has been no significant change that would attract so much
    attention. So, everything will be learned in this course, will be implemented
    in the 2018 and 2019 editions. There is a possibility for new versions in the
    coming years.


    ### Terminal basic


    Before understanding the basic terminal commands, we need to understand what a
    terminal is and how it works.


    #### What is a Terminal?


    A terminal is a display that returns the output of any command that you use or
    execute. Its main function is to process your input and display an output. There
    is a program running in the background which helps the program to understand what
    you are typing and what the output will be.


    #### Shortcuts of terminal


    Before learning some basic Kali Linux commands and shortcuts, I would like to
    make it clear that Kali Linux is a very case sensitive operating system, so be
    careful while typing commands. Due to a single wrong capitalization, your commands
    can fail to execute.


    - **1. Ctrl + c** (Kill or Suspend process)

    At some points, you will be running a process or program that you want to interrupt
    or kill. For such a situation, you can use Ctrl + c shortcut key to kill the program.


    ```bash

    root@kali:/home/anon# apt-get update

    Hit:1 http://ftp.harukasan.org/kali kali-rolling InRelease

    ^Cading package lists... 35%

    root@kali:/home/anon#

    ```


    - **2. Ctrl + z** (suspend command)

    Sometimes, when we are running a process, we need to stop it without having to
    kill the program in this situation, you can use this shortcut key.


    ```bash

    root@kali:/home/anon# apt-get update && upgrade

    Get:1 http://ftp.harukasan.org/kali kali-rolling InRelease [30.5 kB]

    Get:2 http://ftp.harukasan.org/kali kali-rolling/main i386 Packages [16.9 MB]

    19% [2 Packages 1,176 kB/16.9 MB 7%]            73.3 kB/s 7min 33s^Z

    [1]+ Stopped                  apt-get update

    root@kali:/home/anon#

    ```


    - **3. bg** – Background

    To continue your stopped process in the background, you can use this command.


    ```bash

    root@kali:/home/anon# bg

    [2]+ apt-get update &

    Reading package lists... Done

    E: Could not get lock /var/lib/apt/lists/lock. It is held by process 1799 (apt-get)

    N: Be aware that removing the lock file is not a solution and may break your system.

    E: Unable to lock directory /var/lib/apt/lists/

    ```


    - **4. clear** (clear the screen)

    For cases where you wish to clear the screen, use the following command:


    ```bash

    root@kali:/home/anon# clear

    ```'
