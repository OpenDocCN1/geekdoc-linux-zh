    ```\n\n同样，如果你希望在复制时获得确认，可以使用 `-i` 选项。它在覆盖任何文件或目录之前会弹出提示。\n\n## 删除文件和目录\n\n到目前为止，我们已经学习了如何创建文件和目录、列出目录的内容以及列出文件的内容。如果我们想删除这些文件怎么办？我们可以使用\
    \ `rm` 命令。让我们继续看看如何使用该命令来删除文件和目录。\n\n### rm [文件名]\n\n```\nroot@kali:/home/anon/Desktop#\
