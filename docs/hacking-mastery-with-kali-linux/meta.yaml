    # # Active Footprinting


    # ## Email Footprinting


    Information gained through footprinting can be used by a hacker, who wishes to
    gain access into an organization''s data, or by the organization to addresses
    weaknesses and security gaps. Email footprinting is used by individuals to learn
    more about the network and user information of an organization.


    Study of emails can reveal valuable and actionable information which can include:


    +   - Sender email address

    - Sender name

    - Possible physical location

    - Path of the email

    - Sender IP address

    - Active Ports


    # ## What is email footprinting, and how is it useful?


    Email footprinting implements two common methods. Tracing email is the process
    used to determine the origin of the email. Study of the path can help someone
    who wants to glean individual, organizational, and contact information. Through
    analysis of the email header, information about the mail server, internal IP addressing
    scheme, and possible network architecture can be learned. Basic header information
    contains common elements such as from, to, subject, and date information. More
    in-depth analysis reveals time stamps from all mail transfer agents, which includes
    routing information about the server that aided in the transfer of the email.


    All of that information, when put together, may allow someone to target individuals
    for social engineering attacks or organizational networks that may be dated and
    full of security flaws.'
