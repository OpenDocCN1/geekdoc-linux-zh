    Wireshark，它会捕获大量数据包，这可能会让情况变得混乱，因此我们使用过滤器来限制结果。显示过滤器用于在捕获所有流量后对其进行筛选，但如果我们使用捕获过滤器，Wireshark
    将仅捕获我们指定的过滤流量。


    在捕获过滤器下，我们可以选择按网络接口捕获流量。如果我们不使用任何过滤器，Wireshark 默认将捕获所有流量。让我们在不指定任何过滤器的情况下捕获 `wlan0`
    数据包。

