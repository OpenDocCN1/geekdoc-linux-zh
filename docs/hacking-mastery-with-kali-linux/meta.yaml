    ## Active Footprinting


    ### Email Footprinting


    Information gained through footprinting can be used by a hacker, who wishes to
    gain access into an organization''s data, or by the organization to address weaknesses
    and security gaps. Email footprinting is used by individuals to learn more about
    the network and user information of an organization.


    Study of emails can reveal valuable and actionable information which can include:


    - Sender email address

    - Sender name

    - Possible physical location

    - Path of the email

    - Sender IP address

    - Active Ports


    ### What is email footprinting, and how is it useful?


    Email footprinting implements two common methods. Tracing email is the process
    used to determine the origin of the email. Study of the path can help someone
    who wants to glean individual, organizational, and contact information. Through
    analysis of the email header, information about the mail server, internal IP addressing
    scheme, and possible network architecture can be learned. Basic header information
    contains common elements such as from, to, subject, and date information. More
    in-depth analysis reveals time stamps from all mail transfer agents, which includes
    routing information about the server that aided in the transfer of the email.


    All of that information, when put together, may allow someone to target individuals
    for social engineering attacks or organizational networks that may be dated and
    full of security flaws.


    In addition to tracing emails, hackers can send an email and track it. Through
    email tracking, information about email addresses and when someone received and
    opened an email can be obtained. Using techniques used to send a response back,
    hackers can learn that an email was received and opened. They can then resort
    to tracking to learn about the route and path.


    Understanding how emails are routed and what information is contained is valuable
    for hackers and organizations alike. Gaining a more in-depth picture of the network
    allows for hackers to select targets that are weaker and less secure. Organizations
    can learn to minimize information that may be learned through footprinting and
    can then take steps to protect the network and data better.


    ### What information will we get by email footprinting?


    - Date and time of reading

    - Location

    - Weather

    - IP address

    - System information

    - ISP

    - Proxy IP


    ### Practical sessions:


    In this practice session, you will learn how to collect information from your
    victim just by sending them an email. Follow the given steps to perform email
    footprinting.


    ## DNS Enumeration


    ### What is DNS?


    DNS is an acronym for Domain Name System. You could think of DNS as an internet
    phone book. When we access things on the internet, we do so via domain names.
    Domain names are web addresses such as NBC.com or nytimes.com.


    When trying to access information online, web browsers interact using IP addresses.
    The DNS converts domain names into IP addresses so that the browser can load them.


    If DNS servers never existed, we would have to memorize IP addresses for everything
    we wanted to find on the internet. On a web browser, the DNS lookup happens without
    any human interaction or knowledge – it is an automated process.


    ### Practical Session


    Before starting the practical session, let''s first understand the meaning of
    some of the shortcuts that we will use:


    - DNS integration tools (Dnsstuff.com, Network-tool.com)

    - MX - Point to Domains mail server

    - QNS - Points to a hostname server

    - QNAME - Canonical naming allows aliases for a host

    - QSOA - Indicates authority for the domain

    - QSRV - Service card

    - QPTR - Maps IP address to a hostname


