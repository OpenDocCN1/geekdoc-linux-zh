    - Georgian - ქართული

    - German - Deutsch


    ### 16. Select a Location


    In this dialog box, you will be asked to select the location you are in so that
    you can continue. This option determines the location of the Kali Linux operating
    system. Later, you will have to determine the time zone based on the location
    you chose.


    ## KALI - Select your location


    The selected location will be used to set your time zone and also for example
    to help select the system locale. Normally this should be the country where you
    live.


    This is a shortlist of locations based on the language you selected. Choose "other"
    if your location is not listed.


    Country, territory or area:

    - Hong Kong

    - India

    - Ireland

    - Israel

    - New Zealand

    - Nigeria

    - Philippines

    - Singapore

    - South Africa

    - United Kingdom

    - United States

    - Zambia

    - Zimbabwe

    - other


    ### 17. Configure the Keyboard


    This dialog box requires you to select the keyboard layout. To select the keyboard
    layout, use the arrow keys and click Next. This option configures your keyboard
    under the Kali Linux operating system. By default, it is configured in American
    English.


    After you click Next, the installation progress will be displayed and you will
    see the Network Configuration dialog box.


    ### 18. Configure the Network – Enter Hostname


    In this dialog box, you will be prompted to enter the hostname for your system.
    This is a home network so you can set anything. Once you have entered the name,
    click Continue.


    - 19. Configure the Network – Enter a domain name


    This dialog box asks you to enter the domain name for your system. Being a home
    network, we can set something like homenetwork.com or anything else.


    ### 20. Set User and password


    In this dialog, you will be asked to enter a password for the root user account.
    Enter a password of your choice and click Continue. This user password is the
    password for the root with which you will log in at the end of the installation.


    ## Set up users and passwords


    You need to set a password for ''root'', the system administrative account. A
    malicious or unqualified user with root access can have disastrous results, so
    you should take care to choose a root password that is not easy to guess. It should
    not be a word found in dictionaries, or a word that could be easily associated
    with you.


    A good password will contain a mixture of letters, numbers and punctuation and
    should be changed at regular intervals.


    The root user should not have an empty password. If you leave this empty, the
    root account will be disabled and the system''s initial user account will be given
    the power to become root using the ''sudo'' command.


    You will only be asked to set up a user if you leave the root password blank in
    the screen above. If you set a password, the following screens are not displayed.
    In this case, you will have to log in as root using the password that you have
    set above.


    In this screen, on the other hand, you ought to enter the username of the account
    in lowercase. This account must be used for general non-administrative activities.
    Click Continue.


    For the screen that comes up next, you must enter the full name of the user except
    the root. This account should be used for general non-administrative activities.
    Click Continue.


    ## Set up users and passwords


    A user account will be created for you to use instead of the root account for
    non-administrative activities.


    *Please enter the real name of this user. This information will be used for instance
    as default origin for emails sent by this user as well as any program which displays
    or uses the user''s real name. Your full name is a reasonable choice.*


    *Full name for the new user: * __________________________________________________


    **[Screenshot]** | **[Go Back]** | **[Continue]**


    ### Kali Linux Installation – Set Up User


    For this screen, you must enter the username of the account, in small letters.
    This is important when you want to login as a non-root user. This account should
    be used for non-administrative general activities. Once you''re done, click Continue.


    ## Kali Linux installation – Set Up User Account


    In the screen above, you must enter the password for the newly created user. Keep
    in mind that this is not the root password. Once you have entered the password,
    click Next.


    ### Kali Linux Installation – Set up User Password


    ### 21. Configure Clock


    This dialog box asks for a time zone based on the selected location. Please enter
    the time zone of your choice and click Next.


    ### 22. Partition Disk


    This dialog asks how you wish to partition your hard drive. Select Direct - Use
    the entire disk and click Next. This is the default option.


    ### 23. Select the Partition Plan


    This dialog prompts you to select a disk partitioning plan. By default, select
    all files in a partition and click Next.


    ## Kali - Partition disks


    Selected for partitioning: SCSI33 (0,0,0) (sda) - VMware, VMware Virtual S: 64.4
    GB


    The disk can be partitioned using one of several different schemes. If you are
