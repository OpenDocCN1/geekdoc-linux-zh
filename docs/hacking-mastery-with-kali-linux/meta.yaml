  md: '# Introduction


    ![](img/1c2536675428833ea4f129c9e6fbc137_6_0.png)


    # What is hacking?


    Hacking is the process of identifying weaknesses in a computer system or network
    and exploiting the weaknesses to gain access. Hacking is done through cracking
    passwords, Manipulating system, etc. that give access to a particular system.


    An individual who performs hacking is referred to as an hacker. Hacking can be
    done on a single system or a group of systems, an entire local area network, website,
    email accounts, or social media. Access to passwords is accomplished using password
    cracking algorithm programs. However, it is worthy to note that hacking may not
    always be for malicious gains.


    # Who is a hacker?


    Hackers are people who discover vulnerabilities in computer systems and networks
    and exploit them to gain access. They are mostly experienced programmers who are
    familiar with computer security. These experts are classified according to the
    purpose of their actions. The following list categorizes hackers according to
    their intent


    # Type of Hackers


    +   - **Non-ethical hackers:** Non ethical hackers are also known as black hat
    hackers are criminals who gain access to computer networks with malicious intentions.
    They intend to steal business data, violate the right to privacy, transfer funds
    from bank accounts, etc.

    - **Ethical Hacker:** An Ethical Hacker, also known as a White Hat Hacker, is
    a skilled computer expert who systematically uses programming skills to break
    into a computer system, application, network, or other computing resources. They
    do so on behalf of a company, having been granted permission so that they can
    find security flaws and vulnerabilities that a malicious hacker can exploit.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '**Grey hat:** A hacker between ethics and black hat hackers. They gain unauthorized
    access to computer systems by identifying weaknesses. They may decide to reveal
    these weaknesses to the owners for appropriate action or use them for their own
    gain.


    # **What is Ethical Hacking?**


    The main importance of ethical hacking is to evaluate the security of a system
    by identifying any vulnerabilities of the system infrastructure. Ethical hacking
    revolves around exploiting the flaws in a system, if any, to determine whether
    malicious activities can be performed. Ethical hackers use their knowledge and
    skills to bypass an organization''s system security. Ethical hackers must, however,
    adhere to the following rules.


    +   - Obtain written authorization from the computer system and/or computer network
    owner before hacking.

    - Protect the privacy of the organization.

    - Report all identified vulnerabilities in the computer system so that they are
    transparent.

    - Notify the hardware and/or software vendors of identified vulnerabilities.


    # **Why Ethical Hacking?**


    Information is one of the organization''s most valuable resources. Information
    security can preserve an organization''s image and save a lot of cash. Hacking
    is considered a threat against any company, especially those whose main activity
    is cash transaction business. Take, for example, a company like PayPal. They stand
    to make serious losses if someone hacks any of their crucial systems. As such,
    ethical hacking enables companies to be a step ahead of cybercriminals that would
    damage or ruin the operations of a company.


    # **The legality of Ethical Hacking**


    Ethical hackers are hired to carry out penetration testing. They use their computing
    skills to determine the security level of a company''s system. Grading a company''s
    system security is a necessity for business. If ethical'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'hackers don''t perform penetration testing, how else can a company identify
    potential flaws and put in place effective defence measures against real criminals?


    Most organizations believe that authorizing an ethical hacker to test the company''s
    defences is enough legal protection. The act of hiring a hacker is justified by
    the belief that they have the company''s best interests at heart. However, hacking
    may require the use of social engineering. For this reason, ethical hackers end
    up logging into the company''s systems using illegally acquired credentials. When
    such a situation occurs, then the action can be considered illegal.


    # ## History of hacking


    Hacking is not a new term for most people, especially in the technological era.
    Many have fallen prey to this activity, and the experience is usually detrimental,
    but how did hacking come into existence? The term, "hacking," was coined at MIT
    and has been in use for around sixty-four years. The act itself started over a
    century ago.


    In 1878, a group of teenage boys ran the switchboards of Bell Telephone was fired
    for misdirecting and disconnecting incoming calls instead of connecting them to
    the intended receivers. Hacking started as a way of learning how systems worked
    as well as finding ways to fix and improve the performance of computer operating
    systems. Over time, this evolved into ways of exploiting vulnerabilities and breaking
    into computer systems or webs to obtain sensitive information as the world advanced
    technologically.


    In the late ''50s and early ''60s, hackers, who were mostly students, were fascinated
    by the large mainframe computer systems which were common at that time. They developed
    programming shortcuts that would improve the computing task capabilities of the
    mainframes. A good example is the creation of BASIC by Thomas E. Kurtz and John
    G. Kemeny as a way to help people with no programming background to be able to
    use computers.


    By 1969, The Advanced Research Projects Agency (ARPA) founded ARPANET, the precursor
    to today''s internet. ARPANET built a network between the University of Utah,
    University of California Santa Barbara, University of California Los Angeles,
    and Stanford Research Institute.


    The modern-day understanding of hacking came about in the 1970s when a'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'phone phreak called John Draper figured out a way to make free phone calls.
    He did it by building the blue box that was able to exploit hidden codes that
    could not be dialled using the standard phone line. By 1978, Ward Christiansen
    and Randy Seuss developed the first bulletin board system.


    In the ''80s, computer use became more popular thanks to IBM''s mass production
    and marketing of the personal computer. The number of computer units rose to ten
    million in the US alone as more people were accessing the ARPANET. Hacking began
    gaining traction to the extent that a popular hacking movie called War Games was
    released in 1983. It was the first movie to give the general audience an experience
    of the hacking world. In the same era, the 414s hackers hacked several high-profile
    computer systems such as Security Pacific Bank and Los Alamos National Laboratory.
    In the same period, a hacker, Ian Murphy was sentenced for hacking into AT&T''s
    computer systems.


    In the ''90s, a group called Masters of Deception (MOD) had a conflict with another
    group dubbed the Legion of Doom (LOD). The conflict was infamously known as The
    Great Hacker War. Ever since, there have been several cases of individuals such
    as Kevin Mitnick and groups such as Anonymous breaking into computer systems and
    networks.


    What started as pure curiosity and a need to understand and solve computer systems
    evolved into criminal attacks on institutions, networks, and personal computer
    systems to gain unauthorized access. This led to the creation of cybersecurity
    to combat illegal access to systems.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Setting up a lab


    # Basic overview & software required


    There are two ways to set up a hacking lab


    +   1) Using a virtual machine

    2) Setting up a lab using a bootable pen drive.


    In this section, I am going to show you the most common and the best method of
    installing Kali Linux into your system without changing the operating system.
    Before setting up a hacking lab, let''s first understand what a Kali Linux operating
    system is and why cybersecurity specialists and hackers use it.


    # What is Kali Linux?


    Kali Linux is a Debian-based Linux distribution. It runs on a wide spectrum of
    devices. Also, Kali Linux is open source, meaning it is free and legal to use
    in a wide range of scenarios. Most experts, however, discourage using Kali Linux
    if you are a beginner who is interested in cybersecurity. They encourage you to
    take advantage of the ease that comes with using other Linux distributions. In
    addition, it is worthy to note that Kali Linux offers a single root user design.
    The technique here is to let you handle privileges. The feature is especially
    helpful for penetration testing and data forensics that can be used to determine
    a company''s weak point in a risk mitigation project.


    # Installing Kali Linux


    There is a lot of software available through which we can run virtual machines
    into the system without changing our current operating system. Today, in this
    section, we are going to use virtual box because it is open source and free to
    use. We can run multiple machines at a time. Visit the Virtual Box official site
    to download the setup.


    To install Kali Linux into a virtual machine, you need to have an ISO disk'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'image. You can easily download it from the Kali Linux official site.


    Follow the steps below to install Kali Linux into a virtual machine:


    +   1. Open Virtual Box and click on the "New" button.


    ![](img/1c2536675428833ea4f129c9e6fbc137_11_0.png)


    +   2. Give a name and specify the operating system.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Create Virtual Machine


    # Name and operating system


    Please choose a descriptive name and destination folder for the new virtual machine
    and select the type of operating system you intend to install on it. The name
    you choose will be used throughout VirtualBox to identify this machine.


    | Field | Value |

    |-------|-------|

    | Name | Kali Os |

    | Machine Folder | C:\Users\Shekhar\VirtualBox VMs |

    | Type | Linux |

    | Version | Debian (64-bit) |


    Here, you will see four tabs labelled "Name," "Machine Folder," "Type," and "Version."
    On the Name tab, you have to give a name to your virtual machine. On the Machine
    tab, you have to specify where you want to store the files of the virtual machine.
    On the Type tab, you need to tell the virtual box which operating system you are
    going to install. On the Version tab, you need to specify the version of operating
    you are installing.


    +   3. Allocate ram to the virtual machine.'
