    \ triggers for mime-support (3.64) ...\nProcessing triggers for gnome-menus (3.36.0-1)\
    \ ...\nProcessing triggers for libc-bin (2.31-4) ...\nProcessing triggers for\
    \ man-db (2.9.3-2) ...\nProcessing triggers for kali-menu (2020.4.0) ...\nroot@kali:/home/anon/Desktop#\n\
    ```\n\nNow, filezilla is removed from our system without any issue.\n\n## Internet\
    \ protocol\n\n![](img/1c2536675428833ea4f129c9e6fbc137_60_0.png)\n\n### What is\
    \ an IP address?\n\nAn IP address represents the Internet Protocol address which\
    \ is a unique identification number of any system connected to a network. There\
    \ are two versions of the IP address, IPv4 and IPv6. IPv4 is thirty-two bits long\
    \ and a maximum of 4,294,967,296 ($2^{32}$) addresses can be uniquely addressed.\
    \ An IP address is divided into four sections. Each section can contain one to\
    \ three digits. These numbers are separated by a single period (.). These four\
    \ sections should contain numbers that must be between zero and 255. For example,\
    \ 1.160.10.240 can be an IP address. IPv6 is 128 bits long and enables $3.4 \\\
    times 10^{38}$ ($2^{128}$) unique addresses written in hexadecimal and separated\
    \ by colons. An example of IPv6 is: 3ffe:1900:4545:3:200:f8ff:fe21:67cf.\n\n###\
    \ Types of IP address\n\nThere are four types of IP addresses:\n\n- Local IP address\n\
    - Public IP address\n- Static IP address\n- Dynamic IP address\n\n### Local IP\
    \ Address\n\nA local IP address is assigned to your computer when it is connected\
    \ to a router with default settings. It's normally used to locate devices and\
    \ computers connected to a private network. The local IP address doesn't have\
    \ to remain as it is at all times. It can change depending on the other devices\
    \ on the private network and whether those devices are turned on or not.\n\nLet's\
    \ suppose you have a private network with a laptop, computer, tablet, and phone\
    \ on it. If you turn the phone on first, then your router would give your phone\
    \ the first local IP address. Network routers normally assign local IP addresses.\
    \ Every device is then allocated an address when it connects to the network.\n\
    \n### Public IP Address\n\nYour Public IP address can be compared to a telephone\
    \ number for your device. It's also called an External IP address, and you are\
    \ assigned one when you go online. Your internet service provider uses it to identify\
    \ the customer and device requesting a specific web page."
  mdcn: "\n## 从目录移动文件\n\n复制（copying）和移动（moving）的区别在于，复制会创建一个与所选文件或文件夹相同的文件，并将副本放置在不同的驱动器或文件夹中。而移动则是将原始文件从一个位置传输到另一个位置。“move”命令在移动时会删除原始文件，而在复制时则会保留它们。在\
    \ Kali Linux 中，“move”选项还用于重命名文件或目录，因为系统没有单独的重命名选项。让我们继续看看它是如何工作的。\n\n我在桌面上创建了一个名为“**test**”的文件。现在让我们将该文件从\
