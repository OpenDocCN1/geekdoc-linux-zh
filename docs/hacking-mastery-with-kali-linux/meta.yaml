    # Information Gathering


    ![](img/1c2536675428833ea4f129c9e6fbc137_116_0.png)


    # What is Information Gathering?


    Information Gathering is also known as footprinting. It is the art of collecting
    information from a given device using various tools. Footprinting is the first
    and critical phase of hacking for all types of hackers. Without it, a hacker cannot
    perform any attack.


    # Types of Footprinting


    There are basically two types of footprinting, namely:


    +   1. Passive footprinting

    2. Active footprinting


    # Passive footprinting


    With passive footprinting, hackers gather information knowing something about
    the target. In other words, we can say that hackers already know who their target
    is in passive footprinting. They gather information by mirroring websites, email
    tracking, and others.


    # Active footprinting


    With active footprinting, hackers gather information without knowing anything
    about the target. In other words, we can say that active footprinting is all about
    trying to attack a target without having any information about them beforehand.
    Hackers can collect the information they need from Google, an IP address search,
    DNS search, etc.


    # Passive Footprinting


    # Website Footprinting


    White hat hackers use a variety of techniques to identify weaknesses in a system
    so that they can take the necessary precautions to create a more secure'
  - '[PAGE 117]


    environment. Many of these are passive, legal, and common tools through which
    websites can easily provide organizational information without invading their
    systems.


    # **What is website footprinting?**


    Website footprinting is a technique used to discover organizational information
    from specific websites. Learning more about an organization''s structure and systems
    can provide valuable insights for potential targets. Common pieces of information
    that can be obtained include the following.


    +   - Domain name

    - IP Addresses

    - Namespaces

    - Employee information

    - Phone numbers

    - E-mails

    - Job Information


    Websites such as Whois (https://www.whois.com/whois) or IP2Location (https://www.ip2location.com/)
    are easily assessable and provide starting points for further footprinting. These
    are solid starting points for hackers to get information that can be the foundation
    for further analysis and potential attacks.


    Command line tools, such as "ping" are easy to use and require little programming
    or scripting skills. Pinging an IP address can be applied when one wants to check
    the validity of information and to determine that a device is active online. The
    "tracert" command can allow individuals to see the route of a request, how information
    is forwarded, and the devices it''s forwarded to.


    # **How is website footprinting useful?**


    Website footprinting can be useful for many reasons. Someone wishing to hack into
    an organization''s systems and websites can achieve a lot using these practices.
    This type of information-gathering can provide a baseline for possible targets,
    whether technical or social engineering. On the other side, certified ethical
    hackers can work with an organization to improve defense'
  - '[PAGE 118]


    techniques against attacks.


    Identification of weaknesses is the start for creating an effective defense against
    attacks. Through effective website footprinting, organizations can protect themselves
    better from hackers and establish safer and more secure information systems.


