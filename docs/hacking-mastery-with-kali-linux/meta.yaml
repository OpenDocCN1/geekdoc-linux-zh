    ### 9. Enable extended features


    Kali Linux needs some extra features, so we have to enable extended features.
    Go to the system tab.


    Under System, we can see an option named **"Extended Features,"** enable it and
    click the OK button. Virtual Box assigns 1 core cpu by default which is too low,
