    ## Introduction


    ### What is hacking?


    Hacking is the process of identifying weaknesses in a computer system or network
    and exploiting the weaknesses to gain access. Hacking is done through cracking
    passwords, manipulating systems, etc. that give access to a particular system.


    An individual who performs hacking is referred to as a hacker. Hacking can be
    done on a single system or a group of systems, an entire local area network, website,
    email accounts, or social media. Access to passwords is accomplished using password
    cracking algorithm programs. However, it is worthy to note that hacking may not
    always be for malicious gains.


    ### Who is a hacker?


    Hackers are people who discover vulnerabilities in computer systems and networks
    and exploit them to gain access. They are mostly experienced programmers who are
    familiar with computer security. These experts are classified according to the
    purpose of their actions. The following list categorizes hackers according to
    their intent:


    - **Non-ethical hackers:** Non-ethical hackers are also known as black hat hackers;
    they are criminals who gain access to computer networks with malicious intentions.
    They intend to steal business data, violate the right to privacy, transfer funds
    from bank accounts, etc.

    - **Ethical Hacker:** An Ethical Hacker, also known as a White Hat Hacker, is
    a skilled computer expert who systematically uses programming skills to break
    into a computer system, application, network, or other computing resources. They
    do so on behalf of a company, having been granted permission so that they can
    find security flaws and vulnerabilities that a malicious hacker can exploit.

    - **Grey hat:** A hacker between ethics and black hat hackers. They gain unauthorized
    access to computer systems by identifying weaknesses. They may decide to reveal
    these weaknesses to the owners for appropriate action or use them for their own
    gain.


    ### What is Ethical Hacking?


    The main importance of ethical hacking is to evaluate the security of a system
    by identifying any vulnerabilities of the system infrastructure. Ethical hacking
    revolves around exploiting the flaws in a system, if any, to determine whether
    malicious activities can be performed. Ethical hackers use their knowledge and
    skills to bypass an organization''s system security. Ethical hackers must, however,
    adhere to the following rules:


    - Obtain written authorization from the computer system and/or computer network
    owner before hacking.

    - Protect the privacy of the organization.

    - Report all identified vulnerabilities in the computer system so that they are
    transparent.

    - Notify the hardware and/or software vendors of identified vulnerabilities.


    ### Why Ethical Hacking?


    Information is one of the organization''s most valuable resources. Information
    security can preserve an organization''s image and save a lot of cash. Hacking
    is considered a threat against any company, especially those whose main activity
    is cash transaction business. Take, for example, a company like PayPal. They stand
    to make serious losses if someone hacks any of their crucial systems. As such,
    ethical hacking enables companies to be a step ahead of cybercriminals that would
    damage or ruin the operations of a company.


    ### The legality of Ethical Hacking


    Ethical hackers are hired to carry out penetration testing. They use their computing
    skills to determine the security level of a company''s system. Grading a company''s
    system security is a necessity for business. If ethical hackers don''t perform
    penetration testing, how else can a company identify potential flaws and put in
    place effective defence measures against real criminals?


    Most organizations believe that authorizing an ethical hacker to test the company''s
    defences is enough legal protection. The act of hiring a hacker is justified by
    the belief that they have the company''s best interests at heart. However, hacking
    may require the use of social engineering. For this reason, ethical hackers end
    up logging into the company''s systems using illegally acquired credentials. When
    such a situation occurs, then the action can be considered illegal.


    ## History of hacking


    Hacking is not a new term for most people, especially in the technological era.
    Many have fallen prey to this activity, and the experience is usually detrimental,
    but how did hacking come into existence? The term, "hacking," was coined at MIT
    and has been in use for around sixty-four years. The act itself started over a
    century ago.


    In 1878, a group of teenage boys who ran the switchboards of Bell Telephone were
    fired for misdirecting and disconnecting incoming calls instead of connecting
    them to the intended receivers. Hacking started as a way of learning how systems
    worked as well as finding ways to fix and improve the performance of computer
    operating systems. Over time, this evolved into ways of exploiting vulnerabilities
    and breaking into computer systems or webs to obtain sensitive information as
    the world advanced technologically.


    In the late ''50s and early ''60s, hackers, who were mostly students, were fascinated
    by the large mainframe computer systems which were common at that time. They developed
    programming shortcuts that would improve the computing task capabilities of the
    mainframes. A good example is the creation of BASIC by Thomas E. Kurtz and John
    G. Kemeny as a way to help people with no programming background to be able to
    use computers.


    By 1969, The Advanced Research Projects Agency (ARPA) founded ARPANET, the precursor
    to today''s internet. ARPANET built a network between the University of Utah,
    University of California Santa Barbara, University of California Los Angeles,
    and Stanford Research Institute.


