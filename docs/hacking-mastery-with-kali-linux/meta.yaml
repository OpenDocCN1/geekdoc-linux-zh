  - '[PAGE 61]


    An IP address represents the Internet Protocol address which is a unique identification
    number of any system connected to a network. There are two versions of the IP
    address, IPv4 and IPv6. IPv4 is thirty-two bits long and a maximum of 4,294,967,296
    (232) addresses can be uniquely addressed. An IP address is divided into four
    sections. Each section can contain one to three digits. These numbers are separated
    by a single period (.). These four sections should contain numbers that must be
    between zero and 255. For example, 1.160. 10.240 can be an IP address. IPv6 is
    128 bits long and enables 3.4x1038 (2128) unique addresses written in hexadecimal
    and separated by colons. An example of IPv6 is: 3ffe: 1900: 4545: 3: 200: f8ff:
    fe21: 67cf.


    # **Types of IP address**


    There are four types of IP addresses:


    +   - Local IP address

    - Public IP address

    - Static IP address

    - Dynamic IP address


    # **Local IP Address**


    A local IP address is assigned to your computer when it is connected to a router
    with default settings. It''s normally used to locate devices and computers connected
    to a private network. The local IP address doesn''t have to remain as it is at
    all times. It can change depending on the other devices on the private network
    and whether those devices are turned on or not.


    Let''s suppose you have a private network with a laptop, computer, tablet, and
    phone on it. If you turn the phone on first, then your router would give your
    phone the first local IP address. Network routers normally assign local IP addresses.
    Every device is then allocated an address when it connects to the network.


    # **Public IP Address**


    Your Public IP address can be compared to a telephone number for your device.
    It''s also called an External IP address, and you are assigned one when you go
    online. Your internet service provider uses it to identify the customer and device
    requesting a specific web page.'
- md: 'The public IP is required for any public network and differentiates every device
    connected to the internet. Your public IP is unique to you so that your requests
    online don''t go to someone else. The requests are supposed to come back to your
    device given that it''s the only one with that IP address.


    ## Static IP Address


    Your Static IP Address was manually created for a specific device by a dynamic
    host configuration protocol (DHCP). The DHCP is normally used to set up an IP
    address quickly and automatically. Your static IP address does not change.


    Any router, phone, tablet, laptop, etc. that can house an IP address can be set
    up to have a static IP address. These types of IP addresses are usually used to
    remotely access programs, servers, and hosting websites from home. You''d normally
    use a static IP address to make a device easier to find. Once you know the static
    IP, then it won''t change.


    ## Dynamic IP Address


    A dynamic IP address is automatically assigned to each connection in a network.
    For example, your tablet, phone, laptop, and iPad would be considered different
    connections. This is important because the dynamic host configuration protocol
    (DHCP) automatically configures the dynamic IP address.


    This means that the next time the connection happens with the device, there will
    most likely be a different dynamic IP address. The biggest advantage of a dynamic
    IP is the flexibility and ease of use. An example is a laptop. It has an active
    dynamic IP address while being used to access the internet.


    The same person shuts down the laptop and that IP is free for use again. This
    person pulls out a tablet and gets the same dynamic IP even though it''s a different
    device. That''s the advantage of a dynamic IP address.


    You can change a dynamic IP address to a static IP address in minutes with port
    forwarding, which is the simplest and most cost-effective way to get a static
    IP address functions in a dynamic IP address.


    ## Port Number


    ![](img/1c2536675428833ea4f129c9e6fbc137_63_0.png)


    Many of us may have never heard of port forwarding before. One thing we all know,
    however, is that computers are advancing a lot as far as the internet and everything
    related to it is concerned. As a lot of careers in the technological field open
    up, it may be useful for a person to understand port forwarding and what it really
    does.


    ### What is a port?


    A port is the logical address of any application or process that a network or
    Internet uses to communicate. When two applications send and receive data, there
    is an endpoint. This endpoint of the network is referred to as a port.


    ### Types of ports


    There are two types of ports.


    - (1) **TCP** - TCP or the transmission control protocol is a connection-oriented
    protocol. This means that if two devices want to communicate with each other via
    TCP, they must send formal messages to configure the connection before they can
    transfer any information. TCP is a reliable protocol considering that when you
    send data to another device with TCP, the other device will recognize the data.
    This way, both parties can ensure that they have received the correct information
    since TCP keeps track of what is sent and in what order. Anything that is received
    outside the border on the other side is something that can be packaged together
    in its common form.


    - (2) **UDP** - User Datagram Protocol is completely different from TCP. UDP is
    connectionless, and there is no formal startup process for establishing communication
    with the other device. There is no specific way in which data should flow from
    one device to the other. UDP simply sends information without any warning to the
    other device. UDP is, as such, considered to be an unreliable protocol.


    However, this does not mean that UDP is worse than other protocols or considering
    that it works exceptionally well. What does it mean, however, when one says that
    there is no confirmation of data being sent to the other device? Well, the originating
    station has no idea whether information comes from another page, and it does not
    matter to the applications that use UDP. The stations receiving the data does
    not also send any confirmation feedback. Since there is no confirmation or tracking
    in UDP, there is no way to reorder or retransmit the information over the network.


    ## What is port forwarding?


    Port forwarding is also referred to as port mapping in computer networking. It
    is the application of a Network Address Translation (NAT) to redirect a communication
    request from one address and port number combination to another while the packets
    are traversing a network gateway. A network gateway can be a router or a firewall.
    Port forwarding is typically used to make host services on an internal network
    accessible to an external network. This is accomplished by remapping the destination
    IP address and port number of the communication to the internal host. To understand
    port forwarding better, compare it to having a translator for someone who does
    not speak English. Port forwarding puts the desired communication into a form
    that the external network recognizes and can access.


    ## How does port forwarding work?


    Port forwarding on your router makes it possible for you to access a port number
    or even a combination of numbers depending on the router being used, as well as
    an IP address. After you have entered your desired port number or numbers, and
    the IP address, all incoming connections that have matching port numbers are automatically
    forwarded to the internal computer with that IP address. This process ultimately
    makes it easier to be sure that any given data and information goes to the intended
    location.


    ## Port forwarding using router


    Port forwarding also known as port mapping is an innovative technique that allows
    us to use the IP address from our local host for all external communication over
    the World Area Network (WAN). This segment explains how you can forward your device
    port using a router.


    **Determine your gateway IP-** The gateway IP can be found on the back of your
    router or by typing `ifconfig` and `ipconfig` in Linux and Windows respectively.


    ```

    Ethernet adapter Ethernet:


    Connection-specific DNS Suffix . :

    Link-local IPv6 Address . . . . . : fe80::9dc3:212c:f8d7:125e%7

    IPv4 Address. . . . . . . . . . . : 192.168.1.7

    Subnet Mask . . . . . . . . . . . : 255.255.255.0

    Default Gateway . . . . . . . . . : 192.168.1.1          This is the Default Gateway
    on my router.

    ```


    ```

    Ethernet adapter VirtualBox Host-Only Network:


    Connection-specific DNS Suffix . :

    Link-local IPv6 Address . . . . . : fe80::a946:8d10:a39:24f2%17

    IPv4 Address. . . . . . . . . . . : 192.168.56.1

    Subnet Mask . . . . . . . . . . . : 255.255.255.0

    Default Gateway . . . . . . . . . :

    ```


    Type the IP determined above into the browser''s search bar to access the router
    setting page.


    ![](img/1c2536675428833ea4f129c9e6fbc137_65_0.png)


