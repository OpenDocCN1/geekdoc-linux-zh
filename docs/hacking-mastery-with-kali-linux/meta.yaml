- md: "## GPON Home Gateway\n\nLogout\n\n### Status > Device Information\n\n![](img/1c2536675428833ea4f129c9e6fbc137_67_0.png)\n\
    \n- Status\n- Device Information\n- LAN Status\n- WAN Status\n- WAN Status IPv6\n\
    - Home Networking\n- Optics Module Status\n- Statistics\n- Voice Information\n\
    - Airtel Status\n- Network\n- Security\n- Application\n- Maintenance\n\n| Property\
    \ | Value |\n|----------|-------|\n| Device Name | G-2425G-A |\n| Vendor | Nokia\
    \ |\n| Serial Number | ALCLB3ADC38C |\n| Hardware Version | 4FE47269DBAA |\n|\
    \ Boot Version | U-Boot Dec-31-2016--12:00:00 |\n| Software Version | 3FEFH90J5BLKB12\
    \ |\n| Device Running Time | 4 hours 16 minutes 1 second |\n\nRefresh\n\nIt is\
    \ evident from my router setting page that I am using a Nokia router. While the\
    \ user interface can be changed based on the company you are using, the concept\
    \ remains the same.\n\n**Get the forwarding options** - These can be accessed\
    \ by exploring all the sections or tabs in your router. I specifically used the\
    \ application tab for my router, but as you can see from the screenshot, there\
    \ are seven tabs.\n\n![](img/1c2536675428833ea4f129c9e6fbc137_68_0.png)\n\nLet's\
    \ have a look at each of them.\n\n![](img/1c2536675428833ea4f129c9e6fbc137_68_1.png)\n\
    \n- 1. **Application name** - This tab is used to specify the application for\
    \ which we want to forward the port. Since we don't require that at the moment,\
    \ we will leave it as it is.\n\n![](img/1c2536675428833ea4f129c9e6fbc137_69_0.png)\n\
    \n- 2. **WAN port** - Here you choose a port for WAN (Wide Area Network). I use\
    \ 8080 because it is used by websites and applications so it can bypass firewalls.\n\
    \n- 3. **LAN port** - This is where we enter the Local Area Network (LAN) port\
    \ we want to forward. Again, I used 8080, but you can use the LAN port of your\
    \ preference.\n\n![](img/1c2536675428833ea4f129c9e6fbc137_69_1.png)\n\n- 4. **Internal\
    \ client** - In this tab, we input the IP address of the device(s) whose port\
    \ we want to forward to. The custom setting tab can also be used to choose the\
    \ devices.\n\n![](img/1c2536675428833ea4f129c9e6fbc137_69_2.png)\n\n- 5. **Protocol**\
    \ - Here we select the traffic we will use to accept traffic. You can choose Transmission\
    \ Control Protocol (TCP), User Datagram Protocol (UDP), or both.\n\n- 6. **Enable\
    \ mapping** - You should tick this section if you are adding a new record for\
    \ a server. If you are port forwarding for a specific application, there is no\
    \ need to mark this section.\n\n![](img/1c2536675428833ea4f129c9e6fbc137_70_0.png)\n\
    \n- 7. **WAN connection list** - Here, you select the WAN connection list. If\
    \ you only have one list as in my case, you should consider keeping it default\
    \ and adding a new rule.\n\n![](img/1c2536675428833ea4f129c9e6fbc137_70_1.png)\n\
    \nWhen everything is done, click on the \"Add\" button and a new rule will be\
    \ added. Every request on our public IP with an 8080 port number will be forwarded\
    \ to my local IP.\n\n## Port Forwarding Over WAN\n\nWe have learned how to forward\
    \ our local port using a router to access our local host over Wide Area Network\
    \ (WAN), but the problem is that everyone does not have a router at their home.\
    \ In this section, we are going to forward our WAN IP using a website.\n\nThe\
    \ website we will use to forward our WAN IP is called ngrok. There are lots of\
    \ other website and tools are also available, but for now we will go with ngrok.\
    \ We are using ngrok because it comes with two plans. One is free and the other\
    \ is paid. We will use the free plan because it will fill our needs.\n\nFollow\
    \ the given steps to forward WAN IP using ngrok.\n\nTo forward a port using ngrok,\
    \ we need to create an account in ngrok. Go to [www.ngrok.com](www.ngrok.com)\
    \ to create a new account.\n\n![](img/1c2536675428833ea4f129c9e6fbc137_71_0.png)\n\
    \nOnce you log in after creating your account, download the software based on\
    \ your operating system. We are using Kali Linux so we will download a Linux version.\n\
    \n```bash\nanon@kali:~/Downloads$ sudo unzip ngrok-stable-linux-amd64.zip\n[sudo]\
    \ password for anon:\nArchive:  ngrok-stable-linux-amd64.zip\n  inflating: ngrok\n\
    ```\n\n```bash\nanon@kali:~/Downloads$\n```\n\nAfter Downloading the setup, we\
    \ need to unzip the file because it is in the zip format. We can unzip the file\
    \ using unzip command so we will type \"sudo unzip (File name)\" if you are in\
    \ the directory where the file is downloaded. If you are not in the directory\
    \ where the file is downloaded, then you have to give the path where file is stored.\n\
    \nExample: **Sudo** (Because we are not a root user. If you are a root user, you\
    \ can leave this command) **unzip** (Command is used to unzip the zip files) **file\
    \ path** (where the file is stored) **Filename**\n\n```bash\nanon@kali:~$ sudo\
    \ unzip /home/anon/Downloads/ngrok-stable-linux-amd64.zip\n```\n\nAfter unzipping\
    \ the file, we have to run a command which will add your authorization token to\
    \ the default ngrok.yml configuration file. This will grant you access to more\
    \ features and longer session times.\n\nGo to the directory where the unzipped\
    \ file is stored and type the following command.\n\n```bash\n./ngrok authtoken\
    \ (authtoken Key)\n```\n\n```bash\n$ ./ngrok authtoken 1jRzeTv3nTmkH5d5do7sxpyRZor_2qengGg33ph35xRyXYLKW\n\
    ```\n\n### How to get an ngrok auth token?\n\nTo get your auth token login to\
    \ your ngrok account, click on the authentication tab on left hand corner. Click\
    \ on \"**Your Authtoken**\" in the authtoken tab.\n\n![](img/1c2536675428833ea4f129c9e6fbc137_73_0.png)\n\
    \nAfter going to the authtoken page, just copy the authtoken or you can also copy\
    \ the command and paste it in the terminal.\n\n![](img/1c2536675428833ea4f129c9e6fbc137_73_1.png)\n\
    \nAfter authentication, you will see a message Authtoken saved to configuration\
    \ file: **/home/anon/.ngrok2/ngrok.yml**. If authentication is failed, try again\
    \ or restart your PC.\n\n```bash\nanon@kali: ~/Downloads$ ./ngrok authtoken 1jRzeTv3nTmkH5d5do7sbpyBZor_2qengGs33pz35xRH\n\
    Authtoken saved to configuration file: /home/anon/.ngrok2/ngrok.yml\n```\n\nAfter\
    \ authentication you can connect your ngrok and use their services. To connect\
    \ the ngrok type the following command into your terminal.\n\n```bash\n$ ngrok\
    \ (protocol name) (Port number which you want to forward)\n```\n\nExample: **ngrok\
    \ tcp 4444**\n\n![](img/1c2536675428833ea4f129c9e6fbc137_74_0.png)\n\nNow, we\
    \ can use **0.tcp.ngrok.io** as our public IP and **10714** as a port. Every request\
    \ on this port will be forwarded to my local port which is 4444.\n\n## Trojan,\
    \ Virus, and Worms\n\n![](img/1c2536675428833ea4f129c9e6fbc137_75_0.png)\n\n###\
    \ What is a Trojan?\n\nConsidered as one of the most popular viruses, the Trojan\
    \ horse is a highly infectious program that can severely damage the health of\
    \ a computer. A Trojan horse is a flawed computer program that can infect remote\
    \ computers either by deleting your important files or by making vital changes.\
    \ A Trojan horse can be disguised as legitimate software or file from a reliable\
    \ source.\n\nAfter opening it, all your crucial files get infected, and in some\
    \ cases, you can lose some vital functionality of your system. A simple way to\
    \ know that a system is infected is when you see suspicious files that begin with\
    \ \"HKEY\" for the file name. The best way to combat Trojans is to install a reliable\
    \ antivirus program and ensure that it stays updated at all times. This is in\
    \ consideration that there are individuals out there who are constantly creating\
    \ new Trojan programs to create a mess online.\n\n### What is a virus?\n\nA computer\
    \ virus is a software program that is developed to make a computer run erratically.\
    \ These virus programs are often self-duplicating which means they can produce\
    \ copies of themselves to spread through your computer or other computers connected\
    \ by a network.\n\nThey can be completely unnoticeable if a computer antivirus\
    \ software is not installed. Most of them can be attached to other programs, especially\
    \ those that are downloaded by Internet users. Downloads are one of the most common\
    \ ways in which computer viruses find their way into users' computers, but they\
    \ are not the only ones.\n\nViruses can also negatively affect the performance\
    \ of a computer system, taking into consideration that they use most of your system\
    \ resources. One may not immediately realize that their computer is slowing down\
    \ as a result of viruses, but their presence is more than likely to be felt with\
    \ time."
  mdcn: "\n## GPON 家庭网关\n\n登出\n\n### 状态 > 设备信息\n\n![](img/1c2536675428833ea4f129c9e6fbc137_67_0.png)\n\
    \n- 状态\n- 设备信息\n- LAN 状态\n- WAN 状态\n- WAN 状态 IPv6\n- 家庭网络\n- 光模块状态\n- 统计信息\n-\
    \ 语音信息\n- Airtel 状态\n- 网络\n- 安全\n- 应用\n- 维护\n\n| 属性 | 值 |\n|----------|-------|\n\
    | 设备名称 | G-2425G-A |\n| 厂商 | Nokia |\n| 序列号 | ALCLB3ADC38C |\n| 硬件版本 | 4FE47269DBAA\
    \ |\n| 启动版本 | U-Boot Dec-31-2016--12:00:00 |\n| 软件版本 | 3FEFH90J5BLKB12 |\n| 设备运行时间\
    \ | 4 小时 16 分钟 1 秒 |\n\n刷新\n\n从我的路由器设置页面可以明显看出，我使用的是 Nokia 路由器。虽然用户界面可能会根据您使用的公司而有所不同，但基本概念是一样的。\n\
    \n**获取转发选项** —— 这些可以通过探索路由器的所有部分或选项卡来访问。在我的路由器中，我具体使用了“应用”选项卡，但如截图所示，这里共有七个选项卡。\n\
    \n![](img/1c2536675428833ea4f129c9e6fbc137_68_0.png)\n\n让我们逐一来看。\n\n![](img/1c2536675428833ea4f129c9e6fbc137_68_1.png)\n\
    \n- 1. **应用名称** —— 此选项卡用于指定我们想要进行端口转发的应用。由于目前不需要，我们将保持原样。\n\n![](img/1c2536675428833ea4f129c9e6fbc137_69_0.png)\n\
    \n- 2. **WAN 端口** —— 在这里为您选择 WAN（广域网）端口。我使用 8080，因为网站和应用程序经常使用它，这样可以绕过防火墙。\n\n\
    - 3. **LAN 端口** —— 这里输入我们想要转发的本地局域网 (LAN) 端口。同样，我使用了 8080，但您可以使用您偏好的 LAN 端口。\n\
    \n![](img/1c2536675428833ea4f129c9e6fbc137_69_1.png)\n\n- 4. **内部客户端** —— 在此选项卡中，我们输入想要转发端口到的设备\
    \ IP 地址。也可以使用自定义设置选项卡来选择设备。\n\n![](img/1c2536675428833ea4f129c9e6fbc137_69_2.png)\n\
    \n- 5. **协议** —— 在这里我们选择用于接收流量的协议。您可以选择传输控制协议 (TCP)、用户数据报协议 (UDP) 或两者兼有。\n\n-\
    \ 6. **启用映射** —— 如果您是在为服务器添加新记录，则应勾选此部分。如果您是为特定应用程序进行端口转发，则无需标记此部分。\n\n![](img/1c2536675428833ea4f129c9e6fbc137_70_0.png)\n\
    \n- 7. **WAN 连接列表** —— 在这里，您选择 WAN 连接列表。如果您像我一样只有一个列表，建议保持默认并添加新规则。\n\n![](img/1c2536675428833ea4f129c9e6fbc137_70_1.png)\n\
    \n一切完成后，点击“添加”按钮，新规则将被添加。所有发送到我们公网 IP 且端口号为 8080 的请求都将被转发到我的本地 IP。\n\n## 通过 WAN\
    \ 进行端口转发\n\n我们已经学习了如何使用路由器转发本地端口，以便通过广域网 (WAN) 访问本地主机，但问题是并非每个人的家中都有路由器。在本节中，我们将通过一个网站来转发我们的\
    \ WAN IP。\n\n我们将用于转发 WAN IP 的网站名为 ngrok。虽然还有很多其他网站和工具可用，但目前我们将使用 ngrok。我们选择 ngrok\
    \ 是因为它提供两种方案：一种是免费的，另一种是付费的。我们将使用免费方案，因为它能满足我们的需求。\n\n请按照以下步骤使用 ngrok 转发 WAN IP。\n\
    \n要使用 ngrok 转发端口，我们需要在 ngrok 创建一个账户。请访问 [www.ngrok.com](www.ngrok.com) 创建新账户。\n\
    \n![](img/1c2536675428833ea4f129c9e6fbc137_71_0.png)\n\n创建账户并登录后，根据您的操作系统下载软件。我们使用的是\
    \ Kali Linux，因此我们将下载 Linux 版本。\n\n```bash\nanon@kali:~/Downloads$ sudo unzip ngrok-stable-linux-amd64.zip\n\
    [sudo] password for anon:\nArchive:  ngrok-stable-linux-amd64.zip\n  inflating:\
    \ ngrok\n```\n\n```bash\nanon@kali:~/Downloads$\n```\n\n下载安装包后，我们需要解压文件，因为它处于\
    \ zip 格式。我们可以使用 `unzip` 命令解压，如果您在文件下载的目录中，请输入 `sudo unzip (文件名)`。如果您不在该目录下，则必须提供文件存储的路径。\n\
    \n示例：**Sudo**（因为我们不是 root 用户。如果您是 root 用户，可以省略此命令）**unzip**（用于解压 zip 文件的命令）**文件路径**（文件存储的位置）**文件名**\n\
    \n```bash\nanon@kali:~$ sudo unzip /home/anon/Downloads/ngrok-stable-linux-amd64.zip\n\
    ```\n\n解压文件后，我们需要运行一条命令，将您的授权令牌 (auth token) 添加到默认的 `ngrok.yml` 配置文件中。这将使您能够访问更多功能并延长会话时间。\n\
    \n进入解压文件所在的目录并输入以下命令：\n\n```bash\n./ngrok authtoken (authtoken Key)\n```\n\n```bash\n\
    $ ./ngrok authtoken 1jRzeTv3nTmkH5d5do7sxpyRZor_2qengGg33ph35xRyXYLKW\n```\n\n\
    ### 如何获取 ngrok 授权令牌？\n\n要获取授权令牌，请登录您的 ngrok 账户，点击左上角的 authentication 选项卡。在 authtoken\
    \ 选项卡中点击“**Your Authtoken**”。\n\n![](img/1c2536675428833ea4f129c9e6fbc137_73_0.png)\n\
    \n进入 authtoken 页面后，直接复制该令牌，或者您也可以复制整条命令并将其粘贴到终端中。\n\n![](img/1c2536675428833ea4f129c9e6fbc137_73_1.png)\n\
    \n认证后，您将看到一条消息：`Authtoken saved to configuration file: /home/anon/.ngrok2/ngrok.yml`。如果认证失败，请重试或重启电脑。\n\
    \n```bash\nanon@kali: ~/Downloads$ ./ngrok authtoken 1jRzeTv3nTmkH5d5do7sbpyBZor_2qengGs33pz35xRH\n\
    Authtoken saved to configuration file: /home/anon/.ngrok2/ngrok.yml\n```\n\n认证完成后，您可以连接\
    \ ngrok 并使用其服务。要在终端连接 ngrok，请输入以下命令：\n\n```bash\n$ ngrok (protocol name) (Port\
    \ number which you want to forward)\n```\n\n示例：**ngrok tcp 4444**\n\n![](img/1c2536675428833ea4f129c9e6fbc137_74_0.png)\n\
    \n现在，我们可以将 **0.tcp.ngrok.io** 作为我们的公网 IP，将 **10714** 作为端口。所有发送到此端口的请求都将被转发到我的本地端口\
    \ 4444。\n\n## 特洛伊木马、病毒与蠕虫\n\n![](img/1c2536675428833ea4f129c9e6fbc137_75_0.png)\n\
    \n### 什么是特洛伊木马？\n\n特洛伊木马被认为是流传最广的病毒之一，是一种具有高度传染性的程序，会对计算机健康造成严重损害。特洛伊木马是一种缺陷计算机程序，可以通过删除重要文件或进行关键更改来感染远程计算机。特洛伊木马可以伪装成来自可靠来源的合法软件或文件。\n\
    \n一旦运行，所有关键文件都会被感染，在某些情况下，您可能会失去系统的某些核心功能。判断系统是否被感染的一个简单方法是查看文件名以“HKEY”开头的可疑文件。对抗木马的最佳方法是安装可靠的杀毒软件并确保其始终处于最新状态。这是因为有些人一直在不断创建新的木马程序来在网络上制造混乱。\n\
    \n### 什么是病毒？\n\n计算机病毒是一种旨在使计算机运行异常的软件程序。这些病毒程序通常具有自我复制能力，这意味着它们可以产生副本，从而在您的计算机或通过网络连接的其他计算机中传播。\n\
    \n如果没有安装计算机杀毒软件，它们可能完全不被察觉。大多数病毒可以附加到其他程序中，尤其是那些由互联网用户下载的程序。下载是计算机病毒进入用户电脑最常见的途径之一，但并非唯一途径。\n\
    \n考虑到病毒会占用大部分系统资源，它们还会对计算机系统的性能产生负面影响。人们可能不会立即意识到计算机因为病毒而变慢，但随着时间的推移，其存在感会变得非常明显。\n"
