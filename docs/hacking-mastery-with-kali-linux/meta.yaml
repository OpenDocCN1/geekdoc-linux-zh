    ```\n\n现在，`filezilla` 已从我们的系统中顺利删除。\n\n## 互联网协议\n\n![](img/1c2536675428833ea4f129c9e6fbc137_60_0.png)\n\
    \n### 什么是 IP 地址？\n\nIP 地址代表互联网协议（Internet Protocol）地址，它是连接到网络的任何系统的唯一识别号码。IP 地址有两个版本：IPv4\
    \ 和 IPv6。IPv4 的长度为 32 位，最多可以唯一标识 4,294,967,296 ($2^{32}$) 个地址。一个 IP 地址被分为四个部分，每个部分可以包含\
    \ 1 到 3 位数字，这些数字由单个点 (.) 分隔。这四个部分中的数字必须在 0 到 255 之间。例如，1.160.10.240 可以是一个 IP 地址。IPv6\
    \ 的长度为 128 位，可以使用十六进制编写并由冒号分隔，可实现 $3.4 \\times 10^{38}$ ($2^{128}$) 个唯一地址。IPv6\
    \ 的一个示例是：3ffe:1900:4545:3:200:f8ff:fe21:67cf。\n\n### IP 地址的类型\n\nIP 地址有四种类型：\n\
    \n- 本地 IP 地址 (Local IP address)\n- 公网 IP 地址 (Public IP address)\n- 静态 IP 地址 (Static\
    \ IP address)\n- 动态 IP 地址 (Dynamic IP address)\n\n### 本地 IP 地址\n\n当你的计算机连接到具有默认设置的路由器时，会被分配一个本地\
    \ IP 地址。它通常用于定位连接到私有网络中的设备和计算机。本地 IP 地址不必始终保持不变，它可能会根据私有网络上的其他设备以及这些设备是否开启而改变。\n\
    \n假设你有一个私有网络，其中包含一台笔记本电脑、一台计算机、一台平板电脑和一部手机。如果你先开启手机，那么路由器会给你的手机分配第一个本地 IP 地址。网络路由器通常负责分配本地\
    \ IP 地址。每台设备在连接到网络时都会被分配一个地址。\n\n### 公网 IP 地址\n\n你的公网 IP 地址可以比作你设备的电话号码。它也被称为外部\
    \ IP 地址，当你上网时会被分配一个。你的互联网服务提供商（ISP）使用它来识别请求特定网页的客户和设备。\n"
