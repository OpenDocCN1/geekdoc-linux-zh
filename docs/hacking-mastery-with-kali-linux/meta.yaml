    \ IP 地址的数据包。\n\n![](img/1c2536675428833ea4f129c9e6fbc137_92_1.png)\n\n### 5. 多协议显示过滤器\n\
    \n如果我们想要筛选来自多个协议的数据包，可以使用 **or** 语法。输入 `(第一个协议) or (第二个协议)` 来筛选来自多个协议的流量。\n\n\
