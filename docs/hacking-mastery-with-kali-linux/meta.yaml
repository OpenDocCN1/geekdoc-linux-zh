    ## Changing your MAC address


    ### What is a MAC address?


    MAC is an acronym for Media Access Control. Contrary to what many people believe,
    MAC addresses are in no way related to Macintosh from Apple Inc. A MAC address
    is a set of hardware identification digits that are meant to distinguish any device
    connected to a network uniquely.


    ### Why we need to change MAC address


    Changing your MAC address is meant to enhance privacy by protecting the identity
    of a user connected to a network. In short, it is a way of ensuring anonymity.
    However, changing your MAC address is only effective in local area network or
    WiFi networks. It is not very powerful when you are connected to the internet.


    ### Practical Session


    We are going to change our MAC address using macchanger, so let us go ahead and
    see what this tool does:


    - 1. Open terminal and type `macchanger --help`.


    ![](img/1c2536675428833ea4f129c9e6fbc137_113_0.png)


    You can see that -h is used to help, -v to identify the version, -s to show current
    MAC address, -e for editing, -a for another, -p for permanent, -r for random,
    -l for list keyword, -b for bia, and -m to change the MAC address.


    Let''s check our MAC address.


    - 2. Open terminal and type `ifconfig`.


    ![](img/1c2536675428833ea4f129c9e6fbc137_114_0.png)


    Here, you can see that I highlighted two words – the first is eth0, and the other
    one is WLAN. Eth0 means Ethernet (Wired Network) and WLAN means Wireless Local
    Area Network.


    - 3. Type `macchanger -s eth0` to see your current MAC address if you are using
    the wired network. For someone using the local area network, however, type `macchanger
    -s wlan0` to view the MAC address.


    ![](img/1c2536675428833ea4f129c9e6fbc137_114_1.png)


    As you can see, we have two MAC addresses. The first is the current MAC address
    and the second is a permanent MAC address. The current MAC address is the current
    MAC address of our network and can be changed, but the permanent MAC address cannot
    be changed. That''s because it is not a MAC address of the network I am using.
    Rather, it is the address of our Network Interface Card that belongs to the computer
    I am using.


    Also, you can see that I highlighted the first three digits. These three digits
    have a meaning. They are used to identify the manufacturer of the network card.


    ## How can your MAC address be used in a network?


    If a system administrator wants to identify a certain device, they can use the
    MAC address to find the name of the device. As such, a MAC address is typically
    important when one wants to identify a specific device on the network. That aside,
    let''s go ahead and try to change the MAC address using the steps listed below.


    - 1. Open terminal and type `macchanger -a eth0`.


    ![](img/1c2536675428833ea4f129c9e6fbc137_115_0.png)


    As you can see, our MAC address has changed, and you can verify that by typing
    `macchanger -s eth0`.


