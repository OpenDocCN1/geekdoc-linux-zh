    # What is MITM (Man In the middle) attack?


    Man in the middle or MITM attacks take place when a hacker successfully intercepts
    your communication systems and monitors all communications between a company and
    its clients.


    Once inside this network, the hackers can intercept communications and reroute
    the transaction request to their own accounts. No internet communication is safe
    as the MITM attacks can access e-mails, social media conversations and a lot more.


    They can also get between you and the online shopping sites you like to frequent
    and capture all your login details and other information. WiFi connections are
    a favoured target for hackers using MITM style attacks.


