    # **2. Port Filter**


    We can use a port filter to filter packets from specific port numbers. First,
    we have specified a protocol, then **port** to tell Wireshark that you want to
    filter packets from a specific port number, and then == (port number).i.g.


    ```

    tcp.port == 80

