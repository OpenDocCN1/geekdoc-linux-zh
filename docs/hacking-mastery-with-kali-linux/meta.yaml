    \ openjdk-8-jre\n  python3-chameleon python3-flask-restless python3-mimeparse\n\
    \  python3-mimerender python3-waitress python3-webtest python3-zope.component\n\
    \  python3-zope.event python3-zope.hookable snmp testdisk tftp\nUse 'sudo apt\
