  md: '# ← Create Virtual Hard Disk


    # Storage on physical hard disk


    Please choose whether the new virtual hard disk file should grow as it is used
    (dynamically allocated) or if it should be created at its maximum size (fixed
    size).


    A **dynamically allocated** hard disk file will only use space on your physical
    hard disk as it fills up (up to a maximum **fixed size**), although it will not
    shrink again automatically when space on it is freed.


    A **fixed size** hard disk file may take longer to create on some systems but
    is often faster to use.


    +   - ● Dynamically allocated

    - ○ Fixed size


    In this section, we have to specify whether we want to use a dynamically allocated
    hard disk or a fixed size hard disk. If we choose a dynamically allocated hard
    disk, the file will only use space on your physical hard disk as it fills up.
    A fixed size hard disk is the opposite in that the space is specified is automatically
    allocated to the disk and, as such, does not expand with use.


    We will go with the dynamically allocated hard disk. So, select it and click on
    the Next button.


    +   7. Select file location and size'
