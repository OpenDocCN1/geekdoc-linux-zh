    \    0 Nov 25 00:43 test1.txt\ndrwxr-xr-x 6 anon anon 4096 Nov 24 05:20 Evil-Droid\n\
    -rw-r--r-- 1 anon anon 4063 Nov 23 08:20 payload.exe\ndrwxr-xr-x 7 root root 4096\
    \ Nov 22 03:48 Veil\nroot@kali:/home/anon/Desktop#\n```\n\n#### VI. -rtl\n\n```bash\n\
    root@kali:/home/anon/Desktop# ls -rtl\ntotal 12\ndrwxr-xr-x 7 root root 4096 Nov\
    \ 22 03:48 Veil\n-rw-r--r-- 1 anon anon 4063 Nov 23 08:20 payload.exe\ndrwxr-xr-x\
    \ 6 anon anon 4096 Nov 24 05:20 Evil-Droid\n-rw-r--r-- 1 root root 0 Nov 25 00:43\
    \ test1.txt\nroot@kali:/home/anon/Desktop#\n```\n\nWe can use the “-r,” “-l” and\
    \ “-t” options together to list old files first.\n\n## Copying Files From a Directory\n\
    \nIn this section, we are going to learn how to copy a file or directory from\
    \ one place to another using terminals. We will also cover few interesting options\
    \ which will make our work easier.\n\nBefore learning about copy command and its\
    \ options, let us understand its structure.\n\n“Cp” stands for copy, and we use\
    \ this command to copy files and directories. It works the same as it would in\
    \ Windows, but here we use a terminal instead of graphical user interface.\n\n\
    `cp [options] destination path`\n\n```bash\nroot@kali:/home/anon/Downloads# cp\
    \ test.txt /home/anon/Desktop/\nroot@kali:/home/anon/Downloads# cd ..; cd Desktop\n\
    root@kali:/home/anon/Desktop# ls\nEvil-Droid payload.exe test.txt Veil\nroot@kali:/home/anon/Desktop#\n\
    ```\n\nNow, we can see that the test.txt file is copied from the Downloads folder\
    \ to the Desktop. Let’s explore few options.\n\n### -r\n\nIf we want to copy a\
