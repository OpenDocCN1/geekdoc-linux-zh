    ## 密码破解的应对措施


    为了防止密码被破解，您的计算机密码应至少包含 12 个字符。然而，如果您记忆力良好，强烈建议使用 16 位密码，因为这种密码极难破解。以下是关于安全计算机密码需要了解的一些事项：


    - i. 密码应同时包含小写字母和大写字母。您还需要包含数字和特殊字符。这并不意味着每个密码都必须包含上述所有内容。小写字母和数字的组合就足以让您的计算机相当安全——这完全取决于您希望系统达到什么样的安全级别。

