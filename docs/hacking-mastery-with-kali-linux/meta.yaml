    # What is a password cracking?


    Password cracking is the process that''s used to expose computer passwords. Cracking
    a computer password can be done by guessing the password repeatedly or using an
    algorithm to generate the password. This process is usually done for good or bad
    reasons. If you forget your computer password, password cracking can help you
    recover your data. A system administrator can also do password cracking for non-malicious
    reasons such as trying to determine the strength of the passwords used. On the
    other hand, this process can be done for malicious reasons e.g. accessing other
    people''s information without their consent. Password cracking is related to cybercrimes
    where a third party steals other people''s confidential information to benefit
    themselves.


    # Best Password Cracking Techniques


    There are lots of techniques that are used in password cracking, but, we are going
    to look at the best five that are commonly used. We shall also use these techniques
    in upcoming practice lessons


    +   1. Social Engineering


    Social engineering is the term used for a wide range of malicious activities carried
    out through human interactions. Basically, it is the art of manipulating/tricking
    the human brain using various hacking tools and techniques. This is the next step
    of hacking after footprinting wherein the hacker tries to get some important information
    about the target.


    +   2. Phishing


    Phishing is also a small part of social engineering. In this attack, the hacker
    makes a fake replica of the site or page and sends it to his victim instead of
    the real one, and when the victim enters his username and password, the attacker
    will get a copy of the data. These attacks are used to hack only those'
  - '[PAGE 79]


    sites that need any input to login.


    # 3. Rainbow Table Attack


    Is probably one of the fastest ways to find a password and hack into someone’s
    computer or secured systems. What the hackers do is use a pre-computed hash table
    that is already pre-matched to possible passwords.


    Then, the rainbow attack gives hackers the option to reverse the hashing function
    and find the correct password. After the hacker gains access to the password database,
    they compare hashed passwords against potential plain text words on the table.


    Common security systems that protect passwords are very ineffective against a
    rainbow attack. Using the rainbow attack, a hacker can break a fourteen-digit
    password in less than three minutes.


    # 4. Brute Force Attack?


    This may be the simplest and easiest way to hack into a computer. The brute force
    method of attacking a protected computer means that the hacker continues trying
    various combinations of usernames and passwords until they get the right password.


    Alternatively, the hacker may use a bot to get them the power they need to perform
    this attack. To carry out a brute force attack, you would need a supercomputer
    that can handle millions of combinations every second for an eight-digit password.


    If the password has nine digits, the supercomputer may take a few more seconds
    to find the right combination of username and password.


    # 5. Dictionary Attack?


    As you may have guessed, the dictionary attack uses words from the dictionary
    to help discover the right password for the system under attack. This is done
    in a systematic method.


    The dictionary attack can as well be used to find the decryption key using the
    same methodology. What makes this attack so popular for hackers is that businesses
    and individuals use simple names or words as their passwords.


    What the dictionary attack cannot do is break multi-word passwords. Nor can'
