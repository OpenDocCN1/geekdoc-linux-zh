    \ other people's confidential information to benefit themselves.\n\n### Best Password\
    \ Cracking Techniques\n\nThere are lots of techniques that are used in password\
    \ cracking, but we are going to look at the best five that are commonly used.\
    \ We shall also use these techniques in upcoming practice lessons:\n\n- 1. Social\
    \ Engineering\nSocial engineering is the term used for a wide range of malicious\
