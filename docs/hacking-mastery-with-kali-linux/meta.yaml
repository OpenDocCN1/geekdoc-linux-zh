    ## Staying Anonymous Online


    Many people do not believe in online anonymity, mainly because it is associated
    with the ability to promote and encourage unwanted behaviour. If this is true,
    we should ask ourselves: is it worth sacrificing the privacy of many people to
    prevent some people from staying anonymous? This is a difficult question, but
    probably not depending on how you view it.


    Many examples explain the need for online anonymity, and we do not even talk about
    the inconvenience (e.g., "certain websites annoy me") or the theory ("I deserve
    privacy"). In this chapter, you will learn how to keep your identity and privacy
    anonymous to protect yourself. There are several ways to stay anonymous online,
    and we will learn each one of them step by step.


    ## DNS (Domain Name System)


    Before understanding anything about VPNs and proxy, you need to understand what
    a DNS is, how it works, and why it''s important.


    ### What is DNS?


    DNS stands for Domain Name System. You could think of DNS as a phone book on the
    internet. When we access things on the internet, we do so via domain names. Domain
    names are web addresses such as NBC.com or nytimes.com.


    When trying to access information online, web browsers interact using IP addresses.
    The DNS converts domain names into IP addresses so that the browser can load them.


    If not for DNS servers, we would have to memorize or note down IP addresses for
    everything we wanted to find on the internet. On a web browser, the DNS lookup
    process is carried out without human interaction or knowledge. It is an automatic
    process.


    ### Why DNS is important?


    If you do not change the DNS configuration, then you will use the default DNS
    provided by your ISP which means that your traffic can be registered and be identified
    in your country. That''s why it''s vital to change the DNS using a reputable and
    reliable source that does not register your request and guarantees anonymity.


    Open terminal and type:


    ```

    cat /etc/resolv.conf

    ```


    So, here you can see that my service name is 192.168.0.1 and my entire network
    will be routed through this DNS. By using a proxy, however, you can direct your
    traffic to another country. For example, you could be in France, but using a proxy
    from Germany. In such a case, it will seem like you are based in Germany, but
    when they check the DNS, it will still be located in France. That way, someone
    will easily get to the conclusion that you are in France which defeats the purpose
    of having to use a proxy. For this reason, you have to change the DNS to look
    like you are in a different place.


    ### How to change DNS?


    Changing the DNS is quite simple. All you need to do is follow the steps given
    below:


    - 1. Open terminal and type this following command:


    ```

    nano /etc/dhcp/dhclient.conf

    ```


    Here, you can see before the text, there are # symbols which mean they are commented
    and not active. The System will ignore those commands until we remove the hash
    symbol, but we do not need to change anything here, so scroll down.


    We do, however, need to make changes to the prepend domain-name service, so remove
    the hash symbol and change the DNS number. I am using an open DNS which is what
    you should do for practice.


    Here, you can see that I''m using two DNS, 208.67.222.222 and 208.67.220.220.
    All you need to do to use two DNS is put a comma after writing the first DNS number
    and then typing the other one as shown in the screenshot.


    After this, hit Ctrl + O and then hit enter, then hit Ctrl + X to exit.


    After that, we have to restart your service network manager. To do so, type the
    following command:


    ```

    service network-manager restart

    ```


    That way, you will have successfully changed your DNS and restarted the network
    manager. The next step should be to verify that everything is okay. To do so,
    consider using the command: `cat /etc/resolv.conf`


    As you can see, we are using three DNS. You can be 99% sure that all your traffic
    will be routed through the first DNS. If it fails to work, then the traffic will
    be routed through the second DNS. That should mean that you are an anonymous internet
    user.


    In the next chapter, we are going to learn how to connect our device with tor
    proxies for complete anonymity.


    ## Tor proxy


    ### What is a proxy?


    Every time we connect with someone online or visit a website, the computer we
    use is sharing its "address" or Internet Protocol (IP) with that other person
    or site. This is the address through which people can reach you and communicate.
    It''s what connects you to the online world. An IP address can reveal a lot of
    information about you such as your city, country, internet service provider, server,
    etc. However, depending on the destination, they can gather much more sensitive
    information, such as your operating system, web browser, and browsing history.
    A proxy server allows you to navigate online using a different or substitute IP
    address. Usually, your information gets sent from your computer to your service
    provider and then to your destination, but a proxy adds an additional step where
    your IP address is masked before being delivered to the destination. Proxies are
    very easy to find with a simple web search and require a small amount of research
    to implement correctly but are very accessible for an average home web user.


    ### How does proxy work?


    A proxy server acts as a doorway between you and the internet. It is an intermediary
    server separating users from the websites they browse.'
