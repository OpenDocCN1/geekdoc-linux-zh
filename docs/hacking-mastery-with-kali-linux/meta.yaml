    # Tor proxy


    # What is a proxy?


    Every time we connect with someone online or visit a website, the computer we
    use is sharing its "address" or Internet Protocol (IP) with that other person
    or site. This is the address through which people can reach you and communicate.
    It''s what connects you to the online world. An IP address can reveal a lot of
    information about you such as your city, country, internet service provider, server,
    etc. However, depending on the destination, they can gather much more sensitive
    information, such as your operating system, web browser, and browsing history.
    A proxy server allows you to navigate online using a different or substitute IP
    address. Usually, your information gets sent from your computer to your service
    provider and then to your destination, but a proxy adds an additional step where
    your IP address is masked before being delivered to the destination. Proxies are
    very easy to find with a simple web search and require a small amount of research
    to implement correctly but are very accessible for an average home web user.


    # How does proxy work?


    A proxy server acts as a doorway between you and the internet. It is an intermediary
    server separating users from the websites they browse.'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'Proxy servers also act as a firewall and a web filter. They provide a shared
    network connection as well as cache data to speed up common requests.


    When you are using a proxy server, internet traffic flows through the proxy to
    the address you input. That request will then come back through the proxy server.
    Then, that proxy server will forward the website information to you.


    It may seem simpler to just go to your desired website directly, but modern proxy
    servers do much more than pass along data. Proxies provide a type of security
    and can play a huge role in your online privacy. Any worthwhile proxy server protects
    you and your computer from almost every malicious item in the cyber world.


    # How can a proxy help us to stay anonymous?


    Lots of sensitive information is tied to your IP address. In many cases, your
    IP address can reveal your location down to the street level. Proxies can mask
    that location data, giving you privacy. Proxies also hide other sensitive information
    such as the operating system and browsing history that can be used to manipulate
    your browsing experience. Using this information, you can be targeted and shown
    biased advertisements or information. By withholding this information, your web
    anonymity is enhanced. Proxies can also modify or falsify information, allowing
    you to change what information the receiving entity sees about you. The most common
    use for this is to change your disclosed location to access content outside of
    your country that would otherwise be inaccessible. You are also able to hide additional
    information about you, providing anonymity. Some proxies can, however, disclose
    to websites that you''re masking your IP address which may prevent you from access
    to information. High-level anonymous proxy sites do not disclose that the user
    is using a proxy server. That way, you can have all your information protected
    without the destination website being aware that you are using a proxy.


