    - **14.** Select the Graphic Installation option from the Boot menu.


    Here, you will see many options. Use the down arrow to select the Graphical Installation
    and click Continue.


    - **15.** Select a language. We recommend using your native language or any other
    language that you are conversational in so that you won''t face any difficulties.


    ## Select a language


    Choose the language to be used for the installation process. The selected language
    will also be the default language for the installed system.


    Language:

    - Chinese (Simplified) - 中文(简体)

    - Chinese (Traditional) - 中文(繁體)

    - Croatian - Hrvatski

