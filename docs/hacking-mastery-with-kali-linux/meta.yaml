    \n### 安装 Kali Linux\n\n目前有许多软件可以让我们在不更改当前操作系统的情况下在系统中运行虚拟机。今天在这个章节中，我们将使用 VirtualBox，因为它是开源且免费使用的。我们可以同时运行多台机器。请访问\
