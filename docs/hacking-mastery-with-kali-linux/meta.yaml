    \ going to use to carry this out is Bettercap. Following the steps laid down here\
    \ will let us execute the MITM effectively.\n\n- 1. Set up the Bettercap\n\nOur\
    \ first step is to set up Bettercap. It does not come pre-installed in Kali Linux\
