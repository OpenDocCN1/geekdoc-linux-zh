  md: 'Many examples explain the need for online anonymity, and we do not even talk
    about the inconvenience (e.g., "certain websites annoy me") or the theory ("I
    deserve privacy"). In this chapter, you will learn how to keep your identity and
    privacy anonymous to protect yourself. There are several ways to stay anonymous
