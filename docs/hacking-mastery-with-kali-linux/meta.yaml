  md: '# **Trojan, Virus, and Worms**


    ![](img/1c2536675428833ea4f129c9e6fbc137_75_0.png)


    # **What is a Trojan?**


    Considered as one of the most popular viruses, the Trojan horse is a highly infectious
    program that can severely damage the health of a computer. A Trojan horse is a
    flawed computer program that can infect remote computers either by deleting your
    important files or by making vital changes. A Trojan horse can be disguised as
    legitimate software or file from a reliable source.


    After opening it, all your crucial files get infected, and in some cases, you
    can lose some vital functionality of your system. A simple way to know that a
    system is infected is when you see suspicious files that begin with "HKEY" for
    the file name. The best way to combat Trojans is to install a reliable antivirus
    program and ensure that it stays updated at all times. This is in consideration
    that there are individuals out there who are constantly creating new Trojan programs
    to create a mess online.


    # **What is a virus?**


    A computer virus is a software program that is developed to make a computer run
    erratically. These virus programs are often self-duplicating which means they
    can produce copies of themselves to spread through your computer or other computers
    connected by a network.


    They can be completely unnoticeable if a computer antivirus software is not installed.
    Most of them can be attached to other programs, especially those that are downloaded
    by Internet users. Downloads are one of the most common ways in which computer
    viruses find their way into users'' computers, but they are not the only ones.


    Viruses can also negatively affect the performance of a computer system, taking
    into consideration that they use most of your system resources. One may not immediately
    realize that their computer is slowing down as a result of viruses, but their
    presence is more than likely to be felt with time.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# **What is a worm?**


    A worm is a form of a virus that is attached to a file but is different from a
    virus. A worm can replicate itself and spread throughout the computer without
    your knowledge. Not only does it spread to all different parts but files on your
    computer, but a worm can easily find its way through emails as well.


    You should keep in mind that the longer a worm stays on your computer, the greater
    the damages and interruptions it causes. Luckily, there are lots of antivirus
    programs out there that should greatly enhance protection. One thing, however,
    that you need to consider is that even if an antivirus improves protection, it
    does not guarantee the full defense of the system as a whole.


    | | Trojan | Virus | Worm |

    |:---|:---|:---|:---|

    | **Definition** | A Malicious program that can be used to control a victim''s
    computer system from a remote location. | A self-replicating program that attaches
    itself to programs and Files. | An illegal program that spreads through a network
    into computer systems. |

    | **Purpose** | Sensitive Data theft, spying the victim''s computer, etc.. | Slow
    computer system performance, Corrupt user Data, etc. | Install backdoors on the
    victim''s computer, Slow the user Network, etc. |

    | **Counter Measures** | Update patch for the use of antivirus software Security
    policy for the use of operating systems Internet and external storage media, etc.
    | | |


    # **Countermeasure**


    There are different sources of Trojans, viruses, and worms with the internet being
    the leading source. If you access the internet often or share files with other
    people who do, there is a high probability of coming into contact with'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'computer viruses. That, however, should not be a cause for concern since there
    is a myriad of software meant to protect your computer. They come in free as well
    as paid versions with their effectiveness and prices varying depending on the
    antivirus program you have chosen. Here are several ways you can protect your
    computer against virus attacks:


    +   1. Avoid downloading unnecessary files from the internet. This includes spam
    attachments, games, and programs that seem to offer “too good to be true” deals.


    +   2. Install an antivirus program. The program should be updated regularly to
    stay at par with the newer versions of Trojans.


    +   3. Scan external storages on a different computer before using them.


    +   4. Back up vital information on external storage, e.g., a read-only media
    such as CDs and DVDs, just in case malware or Trojans cripple your computer.


    +   5. Update your operating system to reduce infections and virus replications.


    +   6. Scan attachments before downloading them.'
