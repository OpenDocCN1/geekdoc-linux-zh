    电子邮件足迹分析采用了两种常用方法。追踪电子邮件（Tracing email）是用于确定电子邮件来源的过程。研究路径可以帮助想要搜集个人、组织和联系信息的人。通过分析电子邮件标头，可以了解有关邮件服务器、内部
