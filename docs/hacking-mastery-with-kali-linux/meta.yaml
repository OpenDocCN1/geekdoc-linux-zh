    be seen on GUI and other devices. It also has very powerful display filters and
    supports a variety of protocols including WPA and WPA2. You can read all about
    it on this [website](website) and download it from there as well.


    +   2. Smartsniff- is a free sniffing tool that captures TCP/IP data flowing over
    your computer and lets you see it through simulated conversations. This sniffer
    is compatible with Windows 2000/XP or higher.


