    # Countermeasure of Password Cracking


    To prevent password cracking, your computer password should have at least twelve
    characters. However, if you have a good memory, a sixteen-character password is
    highly recommended because it is quite hard to crack. Here are some of the things
    you need to know about a secure computer password:'
  - '[PAGE 86]


    +   i. It should have both lower and upper-case characters. You also need to include
    numbers and special characters. This does not mean that every password should
    have all the above. A combination of lower-case characters and numbers should
    be enough to make your computer quite secure – it all depends on how secure you
    want your system to be.


    ii. You should avoid using the same password over an extended period. Have several
    computers passwords to avoid unauthorized people from accessing your information.


    iii. If possible, generate the passwords randomly.


    iv. A good password should not have any user''s elements. This includes things
    like birth dates, pet names, social security numbers, address, age, etc.


    v. They should not contain a simple combination of words unless these words are
    randomly selected


    vi. Finally, it is not advisable to write your passwords down unless you can keep
    them away from other people, e.g. in a safe. You can use a password manager software
    but using a cloud-based password manager is not a good idea.


    # Network sniffing & spoofing


    # What is network sniffing?


    Network sniffing monitors the flow of data over different computer lines using
    a software tool that is referred to as a network sniffer. This sniffer can be
    a closed software package or a hardware device that is governed by the'
  - '[PAGE 87]


    appropriate software.


    As data flows past the sniffer, the tool takes a picture of the data but does
    not alter or redirect that data. It is a tool that is also used by hackers to
    gain vital information. It is possible for a network sniffer to capture passwords
    as they flow by.


    # **What is network spoofing?**


    The boiled down definition of network spoofing is getting access to computer data
    that you have not been authorized to access. To correctly perform network spoofing,
    the hacker or unauthorized user needs to assume the identity of another computer
    or computer program.


    There are different types of spoofing including e-mail spoofing, network spoofing,
    and IP spoofing. A hacker who wished to use the spoofing method must find the
    identity of a trusted computer or program, assume that identity, and gain access
    to private information. Since the spoofed ID is trusted, the hacker usually has
    no trouble entering restricted areas.


    # **Top Three Network Sniffing and Spoofing Tools**


    To get to the best sniffing and spoofing tools, you will have to consider the
    type of operating system that you use. Some may be designed specifically for Windows,
    others for Linux, and so on.


    +   1. Wireshark- This is a sniffing tool that is compatible with Windows, Linux,
    and other operating systems. Its specialty is going deep to monitor the lower
    levels of your computer.


    You can use it to get live captures and offline analysis that captured data can
    be seen on GUI and other devices. It also has very powerful display filters and
    supports a variety of protocols including WPA and WPA2. You can read all about
    it on this [website](website) and download it from there as well.


    +   2. Smartsniff- is a free sniffing tool that captures TCP/IP data flowing over
    your computer and lets you see it through simulated conversations. This sniffer
    is compatible with Windows 2000/XP or higher.


    The only exception is its WinPcapture Driver, which can be used with all Windows
    operating systems. One strong feature this sniffing tool comes with is that it
    allows you to view the captured data in ASCII mode. An alternative'
  - '[PAGE 88]


    viewing mode is the hex dump function. [Click here] to go to their website.


    # **3. Mailinator-**


    This is a spoofing tool that is special in various ways. It allows you to be anonymous
    while using it. In addition, you can create a new e-mail account using its domain.


    On top of it all, it gives you access to email accounts that already exist. You
    just have to type in the e-mail address and this tool grants you access. You can
    use [this link] to access their website and get all the information you need.


    # Network Sniffing with Wireshark


    In this section, we are going learn how to sniff network using Wireshark. This
    tool comes with graphical user interface which make it easy to use.


    +   1. Open Wireshark by going to the applications menu and under "Sniffing and
    Spoofing," click on the Wireshark.


    ![](img/1c2536675428833ea4f129c9e6fbc137_88_0.png)


    There are two filters on the home screen of Wireshark. The first is the display
    filter and the second is the capture filter. If we run Wireshark as default, it
    captures a lot of packets which can make things a bit confusing, so we use filters
    to limit our result. The display filter is used to filter traffic after capturing
    all the traffic, but if we use a capture filter, then Wireshark captures the only
    filter which we specify.


    Under capture filter, we have options to capture traffic by the network interface.
    If we do not use any filter, then Wireshark will capture all the traffic by default.
    Let''s capture wlan0 packets without specifying any filter.'
