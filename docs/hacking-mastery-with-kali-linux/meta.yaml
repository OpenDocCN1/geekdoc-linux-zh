    \ command.\n\n```bash\nroot@kali:/home/anon/Desktop# ls\nEvil-Droid payload.exe\
    \ test.txt Veil\nroot@kali:/home/anon/Desktop# cp -r test /home/anon/Downloads/\n\
    root@kali:/home/anon/Desktop#\n```\n\n### -i\n\nIf you want a confirmation while\
    \ copying, then you can use the “-i” option. It will prompt before overwriting\
    \ any file or directory."
