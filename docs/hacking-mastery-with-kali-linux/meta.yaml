    ```\n\n## Creating files & directories\n\nIn this section, we are going to learn\
    \ how to create directories using terminals.\n\n### 1. mkdir\n\n`mkdir (file name)`\n\
    \nmkdir stands for make directory. We can use this command to create a new directory.\n\
    \n```\nroot@kali:/home/anon/Desktop# mkdir test\nroot@kali:/home/anon/Desktop#\
    \ ls\nEvil-Droid exe_name payload.exe test Veil\nroot@kali:/home/anon/Desktop#\n\
    ```\n\nAs you can see.\n\nOptions:\n- `-p`: we can use **-p** option with mkdir\
    \ to create multiple directories at a time. e.g. I want to create a directory\
    \ name test, and inside that directory I want to create two more directories named\
    \ \"dir1\" and \"dir2.\" in this case, I can use -p option and it will save a\
    \ lot of time.\n\n### 2. Touch\n\nThe touch command is used to create txt files.\n\
    \n```\nroot@kali:/home/anon/Desktop# touch test1.txt\nroot@kali:/home/anon/Desktop#\
    \ ls\nEvil-Droid payload.exe test1.txt Veil\nroot@kali:/home/anon/Desktop#\n```\n\
    \nAs you can see, we have created a txt file name \"test1.txt\" in the current\
    \ directory.\n\n### 3. Ls\n\nWe can use **ls** command to list the content of\
    \ the directory. There are many more options we can explore.\n\nOptions:\n\n####\
    \ I. -l\n\nTo see the contents of the directory with a long list, we can use -l\
    \ option.\n\n```bash\nroot@kali:/home/anon/Desktop# ls -l\ntotal 12\ndrwxr-xr-x\
