    | 9 | Asus | http://192.168.1.1 | admin | admin |

    | 10 | Synology | http://192.168.1.1 | admin | Admin |

    | 11 | Arris | http://192.168.0.1 | admin | password |

    | 12 | Apple iphoneIOS4.X | http://10.0.1.1 | root | alpine |

    | 13 | DELL | http://192.168.1.1 | admin | password |

    | 14 | Huawei ADSL2+ | http://192.168.0.1 | admin | admin |

    | 15 | Netcomm | http://192.168.1.1 | admin | password |

    | 16 | Netstar | http://192.168.0.1 | admin | password |

    | 17 | SAMSUNG | http://192.168.0.1 | admin | password |

    | 18 | Sigma | http://192.168.0.1 | admin | admin |

    | 19 | SUN | http://192.168.0.1 | admin | admin |

    | 20 | Telco systems | http://192.168.0.1 | telco | telco |

    | 21 | TENDA | http://192.168.0.1 | admin | admin |

    | 22 | ZCOM | http://192.168.0.1 | root | admin |

    | 23 | ZTE | http://192.168.0.1 | admin | Admin |

    | 24 | Nokia | http://192.168.1.1 | admin | admin |


    Input your logins to access your router page. Here, you need to input your most
    recent username and password. In case you are accessing the page for the first
    time or have not changed the login details, you can use the default login details
    given by the company. Again, the default username and password which can be found
    on the back of your router. You can also check in the list given above.'
  mdcn: '

    公网 IP 是任何公共网络所必需的，它用于区分连接到互联网的每一个设备。您的公网 IP 是唯一的，这样您的在线请求就不会发送给其他人。由于您的设备是唯一拥有该
    IP 地址的设备，因此请求理应返回到您的设备上。


    ## 静态 IP 地址


    您的静态 IP 地址是由动态主机配置协议 (DHCP) 为特定设备手动创建的。DHCP 通常用于快速且自动地设置 IP 地址。您的静态 IP 地址不会改变。


    任何能够承载 IP 地址的路由器、手机、平板电脑、笔记本电脑等都可以被设置为拥有静态 IP 地址。这类 IP 地址通常用于从家中远程访问程序、服务器和托管网站。您通常会使用静态
    IP 地址使设备更容易被找到。一旦知道了静态 IP，它就不会改变。


    ## 动态 IP 地址


    动态 IP 地址是自动分配给网络中每个连接的。例如，您的平板电脑、手机、笔记本电脑和 iPad 将被视为不同的连接。这很重要，因为动态主机配置协议 (DHCP)
    协议会自动配置动态 IP 地址。


    这意味着下次设备建立连接时，很可能会获得一个不同的动态 IP 地址。动态 IP 的最大优势在于灵活性和易用性。例如笔记本电脑，在被用于访问互联网时，它拥有一个激活的动态
    IP 地址。


    当同一用户关闭笔记本电脑后，该 IP 再次变为可用状态。该用户取出平板电脑，即便它是不同的设备，也可能会获得同一个动态 IP。这就是动态 IP 地址的优势。


    您可以通过端口转发在几分钟内将动态 IP 地址更改为静态 IP 地址，这是在动态 IP 地址环境下实现静态 IP 功能最简单且最具成本效益的方法。


    ## 端口号


    ![](img/1c2536675428833ea4f129c9e6fbc137_63_0.png)


    我们中的许多人可能以前从未听说过端口转发。然而，我们都知道，在互联网及相关领域，计算机正在飞速发展。随着技术领域出现大量职业机会，了解端口转发及其真实作用对一个人来说可能会很有用。


    ### 什么是端口？


    端口是网络或互联网用于通信的任何应用程序或进程的逻辑地址。当两个应用程序发送和接收数据时，会存在一个端点。这个网络端点就被称为端口。


    ### 端口类型


    端口分为两种类型。


    - (1) **TCP** - TCP 或传输控制协议是一种面向连接的协议。这意味着如果两个设备想通过 TCP 相互通信，它们在传输任何信息之前必须发送正式消息来配置连接。TCP
    是一种可靠的协议，因为当您使用 TCP 向另一个设备发送数据时，对方设备会确认收到该数据。通过这种方式，双方都可以确保接收到了正确的信息，因为 TCP 会跟踪发送的内容及其顺序。任何在对方边界之外接收到的内容都可以被打包成其通用形式。


    - (2) **UDP** - 用户数据报协议与 TCP 完全不同。UDP 是无连接的，在与另一个设备建立通信时没有正式的启动过程。数据从一个设备流向另一个设备没有特定方式。UDP
    只是在没有任何预警的情况下向另一个设备发送信息。因此，UDP 被认为是一种不可靠的协议。


    然而，这并不意味着 UDP 比其他协议差，或者它运行得异常出色。那么，当人们说向另一个设备发送数据没有确认时，这意味着什么？简单来说，源站不知道信息是否来自另一个页面，而使用
    UDP 的应用程序并不在意这一点。接收数据的站端也不会发送任何确认反馈。由于 UDP 中没有确认或跟踪机制，因此无法在网络上对信息进行重新排序或重新传输。


    ## 什么是端口转发？


    端口转发在计算机网络中也被称为端口映射。它是网络地址转换 (NAT) 的一种应用，用于在数据包穿过网络网关时，将通信请求从一个“地址和端口号组合”重定向到另一个组合。网络网关可以是路由器或防火墙。端口转发通常用于使内部网络上的主机服务能够被外部网络访问。这是通过将通信的目标
    IP 地址和端口号重新映射到内部主机来实现的。为了更好地理解端口转发，可以将其类比为给不懂英语的人配备一名翻译。端口转发将所需的通信转换为外部网络能够识别并访问的形式。


    ## 端口转发如何工作？


    路由器上的端口转发使您能够访问一个端口号，或者根据所用路由器的不同，访问一组端口号组合以及一个 IP 地址。在您输入所需的端口号和 IP 地址后，所有具有匹配端口号的入站连接都会自动转发到具有该
    IP 地址的内部计算机。这个过程最终使得确保任何给定数据和信息到达预定位置变得更加容易。


    ## 使用路由器进行端口转发


    端口转发（也称为端口映射）是一种创新技术，允许我们使用本地主机的 IP 地址进行所有通过广域网 (WAN) 的外部通信。本节将解释如何使用路由器转发设备端口。


    **确定您的网关 IP-** 网关 IP 可以在路由器的背面找到，或者分别在 Linux 和 Windows 中输入 `ifconfig` 和 `ipconfig`
    来查看。


    ```

    Ethernet adapter Ethernet:


    Connection-specific DNS Suffix . :

    Link-local IPv6 Address . . . . . : fe80::9dc3:212c:f8d7:125e%7

    IPv4 Address. . . . . . . . . . . : 192.168.1.7

    Subnet Mask . . . . . . . . . . . : 255.255.255.0

    Default Gateway . . . . . . . . . : 192.168.1.1          This is the Default Gateway
    on my router.

    ```


    ```

    Ethernet adapter VirtualBox Host-Only Network:


    Connection-specific DNS Suffix . :

    Link-local IPv6 Address . . . . . : fe80::a946:8d10:a39:24f2%17

    IPv4 Address. . . . . . . . . . . : 192.168.56.1

    Subnet Mask . . . . . . . . . . . : 255.255.255.0

    Default Gateway . . . . . . . . . :

    ```


    将上述确定的 IP 输入到浏览器的搜索栏中，以进入路由器设置页面。


    ![](img/1c2536675428833ea4f129c9e6fbc137_65_0.png)


    | # | 品牌 | IP 地址 | 用户名 | 密码 |

    |---|---|---|---|---|

    | 1 | 3Com | http://192.168.1.1 | admin | Admin |

    | 2 | Belkin | http://192.168.2.1 | admin | admin |

    | 3 | BenQ | http://192.168.1.1 | admin | Admin |

    | 4 | D-Link | http://192.168.0.1 | admin | Admin |

    | 5 | Digicom | http://192.168.1.254 | admin | Michelangelo |

    | 6 | Linksys | http://192.168.1.1 | admin | Admin |

    | 7 | Netgear | http://192.168.0.1 | admin | password |

    | 8 | Sitecom | http://192.168.0.1 | sitecom | Admin |

    | 9 | Asus | http://192.168.1.1 | admin | admin |

    | 10 | Synology | http://192.168.1.1 | admin | Admin |

    | 11 | Arris | http://192.168.0.1 | admin | password |

    | 12 | Apple iphoneIOS4.X | http://10.0.1.1 | root | alpine |

    | 13 | DELL | http://192.168.1.1 | admin | password |

    | 14 | Huawei ADSL2+ | http://192.168.0.1 | admin | admin |

    | 15 | Netcomm | http://192.168.1.1 | admin | password |

    | 16 | Netstar | http://192.168.0.1 | admin | password |

    | 17 | SAMSUNG | http://192.168.0.1 | admin | password |

    | 18 | Sigma | http://192.168.0.1 | admin | admin |

    | 19 | SUN | http://192.168.0.1 | admin | admin |

    | 20 | Telco systems | http://192.168.0.1 | telco | telco |

    | 21 | TENDA | http://192.168.0.1 | admin | admin |

    | 22 | ZCOM | http://192.168.0.1 | root | admin |

    | 23 | ZTE | http://192.168.0.1 | admin | Admin |

    | 24 | Nokia | http://192.168.1.1 | admin | admin |


    输入登录信息以访问您的路由器页面。在这里，您需要输入最新的用户名和密码。如果您是第一次访问该页面或尚未更改登录详情，可以使用公司提供的默认登录详情。同样，默认的用户名和密码可以在路由器的背面找到。您也可以查看上方提供的列表。

    '
