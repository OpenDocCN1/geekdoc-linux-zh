    - 2. https://web.archive.org


    ![](img/1c2536675428833ea4f129c9e6fbc137_121_0.png)


    Wayback machine Web.Archive.org is a website that shows the complete change history
    of any site in screenshot form. All that is required of you is simply typing the
    domain name into the search bar.


    Suppose I want to see the change history of youtube.com. In such a case, I only
    have to type `www.youtube.com` in the search bar and press "Enter," as shown on
    the next page.


    ![](img/1c2536675428833ea4f129c9e6fbc137_121_1.png)


