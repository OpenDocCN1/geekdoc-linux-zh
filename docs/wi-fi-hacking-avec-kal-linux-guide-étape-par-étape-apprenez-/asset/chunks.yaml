    Ces attaques sont très répandues et très efficaces. La situation s’aggrave toujours
    plus à cause de l’utilisation des technologies sans prendre conscience des risques
    encourus.


    Et comme tu viens de le voir, un pirate peut récupérer le mot de passe du réseau
    et peut aussi récupérer (avec un peu plus de créativité) des informations plus
    confidentielles, comme les coordonnées de la carte de crédit par exemple.


    ## “HUMANS ARE THE WEAKEST LINK”

    Robert Willis


    ### sslstrip : adieu le cryptage !


    L’utilisateur d’un réseau est principalement protégé par deux boucliers, le premier
    étant le chiffrement du protocole WPA que nous avons pu casser dans les chapitres
    précédents.


    Cependant, il nous reste une deuxième barrière de défense : le chiffrement `SSL`.


    Tout d’abord, il va falloir répondre à quelques questions fondamentales à la compréhension
    de l’attaque que l’on verra par la suite.


    #### Qu’est-ce-que SSL ?


    `SSL` (Secure socket layer) récemment appelé “TLS” est un protocole qui permet
    la sécurisation des données échangées entre le navigateur et le serveur en satisfaisant
    les objectifs de sécurité :


    - Authentification

    - Confidentialité

    - Intégrité


    #### Comment fonctionne le certificat SSL ?


    Il agit en veillant à ce que les données transférées entre les utilisateurs et
    les sites restent difficiles à lire. `SSL` utilise l''algorithme de chiffrement
    pour brouiller les données en transit, empêchant les pirates de les lire lorsqu''elles
    sont envoyées via la connexion.


    Un certificat `SSL` est installé sur le côté serveur, mais il y a des indices
    visuels sur le navigateur qui peuvent dire aux utilisateurs qu''ils sont protégés
    par `SSL`. Tout d''abord, si `SSL` est présent sur le site, les utilisateurs verront
    `https://` au début de l''adresse web au lieu du `http://` comme le montre la
    figure suivante :


    ![site-http-https-exemple-login-chrome.v636573289323980081](Images/image-NUNY5EVT.png)


    Lors de l’échange des informations, le certificat `SSL` déclenche le protocole
    `SSL` qui va chiffrer les informations en agissant directement comme une couverture
    pour le protocole `TCP`. Il permet aux couches supérieures du protocole de rester
    inchangées tout en offrant une connexion sécurisée.


    Ce chiffrement des informations fait qu’un hacker qui s’est mis au milieu de la
    connexion ne pourra intercepter aucune information.


    Maintenant que tu as compris le principe du protocole `SSL`, à nous de voir comment
    bipasser cette mesure de sécurité afin de pouvoir intercepter les paquets envoyés
    par l’utilisateur.


    `sslstrip` est un outil qui permet de détourner le trafic sécurisé `HTTPS` en
    le redirigeant vers du `HTTP` tout en jouant le rôle d’un proxy entre le navigateur
    et le serveur.


    Pour expliquer en détails cette attaque, voici une illustration qui schématise
    cette dernière :


    ![74c4193e-b33e-41e2-921a-6f2916e9075b](Images/image-R9639IF3.jpg)


    Tout d’abord, la vicitme va ouvrir son navigateur et essayer de se connecter à
    un site web via `HTTPS`.


    `Arpsoof` est un utilitaire que le hacker va utiliser afin que le routeur redirige
    vers lui tout le trafic provenant de la victime.


    Le hacker va convertir la requête en `HTTP` avec `sslstrip`.


    Puis il renvoie la nouvelle requête `HTTP` vers le routeur.


    Le routeur prend la requête et l’envoie au serveur.


    Enfin, le serveur reçoit la requête et répond en établissant une connexion `HTTP`.


    Voilà, nous avons accompli notre objectif en obligeant la victime à se connecter
    via `HTTP`. De cette façon, nous pourrons lire les informations échangées.


    Voyons tout de suite comment nous pouvons appliquer cette attaque avec `Kali`.


    Nous devons tout d’abord déterminer l''interface que nous utilisertons pour nous
    connecter au réseau. Pour se faire, nous pouvons utiliser la commande `ifconfig`
    sur notre machine `Kali`.


    ![ifconfig_sslstrip](Images/image-8LOOBMP6.png)


    Une fois que nous avons déterminé l''interface que nous utilisons, nous devons
    exécuter le processus de transfert IP pour lequel nous tapons la commande suivante
    :


    ```

    root@kali:~# echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    ![image](Images/image-9YA7R9PA.png)

    ![image](Images/image-RQXVY2TM.png)![sslstrip_echo](Images/image-ZOU5TCTA.png)


    Configurons note pare-feu pour qu’il puisse rediriger le trafic :


    ![image](Images/image-55JPHGB2.png)


    ```

    root@kali:~# iptables -t nat -A PREROUTING -p TCP—destination-port 80 -j REDIRECT—to-port
    8080

    ```


    ![image](Images/image-FZLM1ILH.png)![sslstrip_iptables](Images/image-OYDRAETX.png)


    Comme nous avons configuré le trafic pour qu''il soit routé via notre machine,
    nous devons maintenant trouver l''adresse IP du routeur. Exécute donc la commande
    suivante :


    ![image](Images/image-3DDPML9Q.png)


    ```

    root@kali:~# route -n

    ```


    ![image](Images/image-3M4LL9I9.png)![sslstrip_gateway](Images/image-9WSUUSY0.png)


    Pour te montrer cette attaque, je vais utiliser une machine sous Windows comme
    victime avec l’adresse IP suivante :


    ![sslstrip_vicitme](Images/image-7R40FURN.png)


    Une fois que nous avons déterminé l’adresse IP du routeur et de la machine cible,
    nous pouvons mener à bien le processus de arpsoofing, où le trafic provenant du
    serveur et destiné au système de la victime nous sera redirigé et nous le transmettrons
    à son tour au système de la victime.


    ![image](Images/image-R8LQAALA.png)


    ```

    root@kali:~# arpspoof -i wlp5s0 -t 10.20.32.191 10.20.30.1

    ```


    ![image](Images/image-R8LQAALA.png)

    ```

    [/

    ]

    ![sslstrip_arpsoof](Images/image-P4L1K.png)


    Dès que nous exécutons cette commande, le trafic sera redirigé vers la machine
    du hacker. Simultanément, nous devons ouvrir un terminal, où nous taper cette
    commande :


    ```

    root@kali:~# sslstrip -l 8080

    ```


    ![image](Images/image-29V1NF0.png)

    ![sslstrip_8080](Images/image-A4O88T7.png)


    Cela convertira les sites `Web` en `HTTP` et nous initions un écouteur sur le
    port `8080`. Nous sommes donc prêts à partir. À chaque fois que la victime ouvre
    son navigateur et navigue sur Internet, le trafic nous est redirigé.


    Sur la machine cible, j’ouvre le navigateur et je connecte à Facebook :


    ![sslstrip_detection](Images/image-TE6SM576.png)


    ![image](Images/image-D660.png)


    Instantanément, le navigateur détecte qu’il y a une redirection de traffic. Mais
    ce qui est intéressant, c’est que cet avertissement n’apporte pas d’informations
    sur ce qui passe derrière les coulisses, il y a simplement une redirection vers
    Facebook.


    L’utilisateur n’a que deux choix : soit il continue vers le site ou il revient
    à la page précédente.


    Sachant qu’il y a de fortes chances que l’utilisateur cliquera sur le lien de
    redirection, le site web s’affichera le plus normalement possible :


    ![sslstrip_facebook](Images/image-P692P2BQ.png)


    Jusque-là, c’est assez bien joué. Prête attention au protocole utilisé dans le
    transfert de données, c’est du `HTTP` et non pas du `HTTPS`. La victime va entrer
    ses informations en cliquant sur Login et elle se connectera normalement. Cependant,
    l’attaquant peut lui aussi se loguer avec ses informations personnelles.


    ![sslstrip_login](Images/image-9YLU5XF6.png)


    DONE !


    Arrête `arpsoof` et `sslstrip` en appuyant sur Ctrl+c. Les informations capturées
    seront stockées dans un fichier `sslstrip.log` que tu trouveras au même endroit
    où tu as lancé `sslstrip`. Pour cela, exécute la commande suivante :


    ```

    root@kali:~# cat sslstrip.log | grep "pass"

    ```


    ![image](Images/image-K75A7AO9.png)![sslstrip_hacked](Images/image-8J2FVRZJ.png)


    Note : le “%40” est l’encodage URL de “@”.

