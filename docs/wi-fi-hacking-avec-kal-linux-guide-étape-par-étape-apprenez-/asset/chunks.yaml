    Le hacker peut créer des requêtes d’authentification et de dissociation qui sont
    utilisées dans un réseau sans fil pour fermer des connexions autorisées ou pour
    inonder le réseau et empêcher les utilisateurs légitimes de maintenir leur connexion
    à un point d’accès sans fil.


    Bombarder le réseau d’un flot de paquets de données pour le rendre indisponible
    pour l’utilisation. Par exemple, une attaque par inondation HTTP faisant des milliers
    de requêtes à un serveur web peut épuiser sa capacité de traitement, même chose
    pour le réseau Wi-Fi.


    Certains appareils et applications peuvent reconnaître qu’une attaque est en cours
    et désactivent automatiquement le reseau. Cependant, un hacker peut lancer une
    attaque évidente puis laisser la cible créer le Dos elle-même.


    En fait, le protocole sans fil 802.11 a été créé dans le but de prendre en charge
    la désauthentification à la reception d’un paquet de sorte que l’utilisateur puisse
    rompre une connexion quand elle n’est plus nécessaire.


    Comme tu peux le constater, envoyer des paquets de désauthentification dans le
    réseau est conforme à la norme, ce qui rend l’attaque Dos dévastatrice et il n’y
    a aucun moyen de l’empêcher de se produire.


    Pour démontrer ce point, nous allons utiliser `aireplay-ng` pour déconnecter tous
    les utilisateurs du point d’accès.


    Tout d’abord, mets ton adapteur en mode moniteur afin qu’il puisse injecter les
    paquets de désauthentification :


    ![DOS_monitor](Images/image-A9QJYXCS.png)


    Puis lance `airodump-ng` pour repérer le point d’accès cible :


    ![image](Images/image-U6MQUAT6.png)


    ```

    root@kali:~# airodump-ng wlan0mon

    ```


    ![image](Images/image-0LCLMJ97.png)![DOS_cible](Images/image-I19A92B9.png)


    Voyons les utilisateurs qui sont déjà connectés au point d’accès avec la commande
    suivante :


    ![image](Images/image-U2AQQK4R.png)


    ```

    root@kali:~# airodump-ng—bssid <AP MAC>—channel <canal> wlan0mon

    ```


    ![image](Images/image-GZ01EDY3.png)![DOs-clients](Images/image-AI1UY4FI.png)


    Et voici le résultat :


    ![DOs_smartphone](Images/image-VGODDKS2.png)


    Voilà, un utilisateur est connecté (et il ne le sera plus après le lancement de
    notre attaque Dos !)


    Exécute la commande suivante pour lancer l’attaque :


    ![image](Images/image-J8KLTQKX.png)


    ```

    root@kali:~# aireplay-ng -0 0 -a <AP MAC>—ignore-negative-one “interface-moniteur”

    ```


    ![image](Images/image-WZI75L4N.png)![DOS](Images/image-VW6YT27V.png)


    Le point d’accès n’est plus disponible à ses utilisateurs et le smartphone ne
    peut plus se connecter.


    ![Screenshot_2019-03-22-18-46-35](Images/image-90RBOJJP.png)


    Note : DDos (l’attaque par déni de service destribué) est tout simplement une
    attaque Dos effectuée depuis plusieurs machines (BOT) rendant l’attaque beaucoup
    plus efficace et dont l’origine est plus complexe à localizer.


    ## Chapiter 11


    ![image](Images/image-4RML5381.png)


    ## Maintenir l’accès


    Dans les chapitres précédents, nous avons vu comment briser/bypasser les protocoles
    de sécurité des réseaux Wi-Fi en capturant les paquets échangés entre le point
    d’accès et ses clients légitimes.


    Une fois le mot de passe dans la poche, nous allons pousser un peu plus loin ton
    test d’intrusion en mettant en place un mécanisme qui te permettra d’avoir le
    mot de passe sans avoir à le recracker.


    Cependant, la démarche que je vais te présenter ici n’est pas applicable à tous
    les points d’accès, car tout dépendra de plusieurs facteurs dont le type de routeurs,
    le fabricant, ou encore le firmware..


    Dans tous les cas, c’est une technique dont tu auras besoin un jour dans ton processus
    de hacking. N’oublie pas que c’est entre “savoir” et “ne pas savoir” que réside
    toute la différence.


    J’ai utilisé cette méthode avec un routeur D-Link DSL-2750U lors d’un test d’intrusion
    afin de maintenir mon accès au routeur même après que le changement du mot de
    passe du Wi-Fi.


    Après avoir cracké le mot de passe, je me suis mis sur l’interface de configuration
    :


    ![Dlink_login](Images/image-6GNI3JR5.png)


    ### Premier challenge...


    ou pas ! En effet, une petite recherche “default D-link routeur username and pasword”
    sur Google m’a donné instantanément la réponse : “admin”:”admin” étant donné que
    l’administrateur a laissé les valeurs par défaut (une mauvaise habitude très répandue
    et qu’il ne faut pas négliger).


    Note : même si les paramètres (username et password) ont été changés, tu détiens
    toujours la capacité de brute-forcer les deux champs avec un outil comme `hydra`.


    Après avoir atterri sur l’interface de configuration, je me déplace vers l’onglet
    “Advanced puis Dynamic DNS”.


    ––––––––


    ![dynamic_dns](Images/image-MY31FC.png)


    Après avoir atterri sur l’interface de configuration, je me déplace vers l’onglet
    “Advanced puis Dynamic DNS”.

