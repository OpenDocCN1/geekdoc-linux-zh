    ### Chapitre 2


    ![image](Images/image-4RML5381.png)


    ### préparation du lab


    Il est essentiel de rester dans le cadre de la loi.


    En tant que white hat hacker tu dois obligatoirement avoir un laboratoire sur
    lequel tu as un contrôle et une liberté d’exercer.


    Dans cette partie, nous allons créer un environnement de test Wi-Fi propice. De
