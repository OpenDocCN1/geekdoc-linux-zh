    Sachant qu’il y a de fortes chances que l’utilisateur cliquera sur le lien de
    redirection, le site web s’affichera le plus normalement possible :


    ![sslstrip_facebook](Images/image-P692P2BQ.png)


    Jusque-là, c’est assez bien joué.


    Prête attention au protocole utilisé dans le transfert de données, c’est du HTTP
    et non pas du HTTPS.


    La victime va entrer ses informations en cliquant sur Login et elle se connectera
    normalement. Cependant, l’attaquant peut lui aussi se loguer avec ses informations
    personnelles.


    ![sslstrip_login](Images/image-9YLU5XF6.png)


    DONE !


    Arrête arpsoof et Sslstrip en appuyant sur Ctrl+c.


    Les informations capturées seront stockées dans un fichier sslstrip.log que tu
    trouveras au même endroit où tu as lancé sslstrip. Pour cela, exécute la commande
    suivante :


    ![image](Images/image-GF8RMQDX.png)


    root@kali:~# cat sslstrip.log | grep "pass"


    ![image](Images/image-K75A7AO9.png)![sslstrip_hacked](Images/image-8J2FVRZJ.png)


    Note : le “%40” est l’encodage URL de “@”.


