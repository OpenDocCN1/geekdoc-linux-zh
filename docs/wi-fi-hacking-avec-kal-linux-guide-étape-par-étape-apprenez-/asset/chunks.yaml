    Jusque-ici, tout se passe bien.


    ## Commençons maintenant notre attaque


    Tout d’abord, mets ton adaptateur en mode moniteur :


    ![image](Images/image-56JTM2UD.png)


    ```bash

    root@kali:~# airmon-ng start “interface”

    ```


    ![image](Images/image-4VR3QTSA.png)![airmong-ng_WEP](Images/image-OHBKZWVS.png)


    Jete un coup d’œil sur ce qui se passe autour de toi pour capturer les paramètres
    dont nous aurons besoin :


    ![airodump-WEP](Images/image-DORFRBJ4.png)


    Oups ! Je viens de découvrir qu’il n’y a pas que mon lab qui est sous WEP ! Tu
    vois donc que même en 2019, ces zombies existent toujours, mettant tout le réseau
    en danger, car cette attaque n’est pas compliquée à exécuter au point qu’un script
    kiddie peut le faire (je ne parle pas de toi bien sûr, haha !). Je vais essayer
    de résister à la tentation de le cracker.


    Attention : dans certains cas, l’on utilise des protocoles obsolètes afin de créer
    des pièges pour les pirates. L’on appelle ces pièges “honeypot” (littéralement,
    “pot de miel”)


    ## Deuxième étape, tu dois capturer un nombre suffisant de paquets avec `airodump-ng`
    et les stocker dans des fichiers intitulés `WEP_HACK` pour les crackers en offline.
    Pour cela, utilise la commande suivante :


    ![image](Images/image-Q5OJ5ZZ4.png)


    ```bash

    root@kali:~# airodump-ng—bssid <AP MAC>—channel <canal>—write WEP_HACK “interface-monitor”

    ```


    ![image](Images/image-HWKWC67I.png)![airodump-ng_capture_WEP](Images/image-0CRYZZIV.png)


    En exécutant cette commande, tu viens de démarrer la capture de paquets. Cependant,
    afin que l’on parvienne à notre objectif, il faut capturer une quantité suffisante
    de données chiffrés avec la même clé.


    Dans le cas où tu stagnes, tu peux forcer le réseau à produire plus de paquets
    avec `aireplay-ng` vus précédemment :


    ![image](Images/image-U02SHTT3.png)


    ```bash

    root@kali:~# aireplay-ng -3 -b <AP MAC> -h <CLIENT MAC>—ignore-negative-one wlan0mon

    ```


    ![image](Images/image-4VJXXWA4.png)


    Voici l’explication des arguments utilisés :


    - `-3` : pour le `ARP replay`

    - `-b` : l’adresse MAC du point d’accès

    - `-h` : l’adresse MAC d’un client connecté au réseau

    - `—ignore-negative-one` : pour éviter les problèmes de canal

    - `wlan0mon` : adaptateur en mode moniteur


    Une fois cette commande exécutée, tu vas constater une augmentation considérable
    dans la quantité de `#Data` reçus :


    ![aireplay-ng_Wep](Images/image-CA947158.png)


    Let’s the hack begin !


    Laisse ces deux terminales faire leur travail et ouvres-en un troisième pour cracker
    la clé avec `airckrack-ng`.


    En s’appuyant sur les paquets captures qui sont dans les fichiers `WEP_HACK*`,
    `airckrack-ng` peut (tout en étant en mode hors ligne) récupérer facilement la
    clé juste en exécutant la commande suivante :


    ![image](Images/image-SY0X4ZB2.png)


    ```bash

    root@kali:~# aircrack-ng WEP_HACK-0*

    ```


    ![image](Images/image-656JICPI.png)


    Note : les fichiers `WEP_HACK` sont dans le même chemin où tu as lancé `airodump-ng`.


    ––––––––


    ![WEP_FOUND](Images/image-QVIAFA2Y.png)


    Voilà, en une fraction de seconde, il a pu cracker la clé.


    Dans cette partie dédiée au hacking d’une clé WEP, nous avons vu que le WEP est
    très facile à cracker, peu importe la complexité de la clé, et que ce processus
    ne demande que quelques minutes, le temps de capturer suffisamment de paquets
    contenant les IVs.


    Et le plus important, c’est que nous avons vu que le WEP est toujours vivant !


    ### Comment se défendre ?


    - Ne jamais utiliser le protocole WEP


    ## Wi-Fi protected access(WPA)


    Le protocole WPA utilise principalement le cryptage `TKIP`. Il a été créé dans
    le but de renforcer le protocole WEP que nous avons vu précédemment sans apporter
    de changements aux infrastructures des réseaux.


    Tandis que le WPA2 (deuxième version de WPA) est basé sur l’utilisation de l’algorithme
    `AES-CCMP` pour le cryptage de données, ce qui est plus puissant par rapport au
    TKIP.


    Cependant, tous les deux permettent l’authentification basée sur `EAP` en utilisant
    des clés prépartagées, des `PSK` (personnel) ou bien des serveurs `RADIUS` (entreprise).


    Heureusement (ou malheureusement), WPA/WPA2 est vulnérable à l’attaque par dictionnaire.
    Tout ce dont tu as besoin pour mener l’attaque est :


    - Le `four-way handshake` (paquets échangés pour établir la connexion entre un
    client)

    - Un dictionnaire robuste

    - Un outil comme `airckrack-ng`


    Voici le schéma du mécanisme WPA :


    ![four-handshake](Images/image-RDDICE.png)


    - **Étape 1** : le point d''accès envoie un nombre aléatoire `Nonce`.

    - **Étape 2** : le client crée un nombre aléatoire `SNonce`.

    - **Étape 3** : le point d''accès crée le `MIC`.

    - **Étape 4** : le client accepte la clé.


    Le `PTK` (Pairwise Transient Key) est ensuite dérivé de ces éléments.


    ![WPA_HACK_CAP](Images/image-5RVJ9SBG.png)

