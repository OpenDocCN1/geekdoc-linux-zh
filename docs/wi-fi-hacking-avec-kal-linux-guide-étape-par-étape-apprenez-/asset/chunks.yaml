    ##### Chapiter 11


    ![image](Images/image-4RML5381.png)


    ##### Maintenir l’accès


    Dans les chapitres précédents, nous avons vu comment briser/bypasser les protocoles
    de sécurité des réseaux Wi-Fi en capturant les paquets échangés entre le point
    d’accès et ses clients légitimes.


    Une fois le mot de passe dans la poche, nous allons pousser un peu plus loin ton
    test d’intrusion en mettant en place un mécanisme qui te permettra d’avoir le
    mot de passe sans avoir à le recracker.


    Cependant, la démarche que je vais te présenter ici n’est pas applicable à tous
    les points d’accès, car tout dépendra de plusieurs facteurs dont le type de routeurs,
    le fabricant, ou encore le firmware..


    Dans tous les cas, c’est une technique dont tu auras besoin un jour dans ton processus
    de hacking. N’oublie pas que c’est entre “savoir” et “ne pas savoir” que réside
    toute la différence.


    J’ai utilisé cette méthode avec un routeur D-Link DSL-2750U lors d’un test d’intrusion
    afin de maintenir mon accès au routeur même après que le changement du mot de
    passe du Wi-Fi.


    Après avoir cracké le mot de passe, je me suis mis sur l’interface de configuration
    :


    ![Dlink_login](Images/image-6GNI3JR5.png)


    Premier challenge...


    ou pas ! En effet, une petite recherche “default D-link routeur username and pasword”
    sur Google m’a donné instantanément la réponse : “admin”:”admin” étant donné que
    l’administrateur a laissé les valeurs par défaut (une mauvaise habitude très répandue
    et qu’il ne faut pas négliger).


    Note : même si les paramètres (username et password) ont été changés, tu détiens
    toujours la capacité de brute-forcer les deux champs avec un outil comme hydra.


    Après avoir atterri sur l’interface de configuration, je me déplace vers l’onglet
    “Advanced puis Dynamic DNS”.


    ––––––––


    ![dynamic_dns](Images/image-MY31MOJF.png)


    Après avoir atterri sur l’interface de configuration, je me déplace vers l’onglet
    “Advanced puis Dynamic DNS”.


    Tu vas voir apparaître une liste de fournisseurs DDNS. Personnellement, je préfère
    utiliser noip.com, donc rends-toi sur leur site et crée un compte (c''est gratuit
    !).


    ![NOIP](Images/image-FEBIXNG6.png)


    Voilà, maintenant clique sur “Active hostnames”, puis crée “un nom d’hôte” :


    ![create-hostname](Images/image-XHLSLRBP.png)


    Mets le nom d’hôte de ton choix et change le domaine à “hopto.org”. Clique enfin
    sur “create hostname”.


    ![host-name-created](Images/image-MHU7EZ22.png)


    Il ne te reste plus qu’à configurer le nom d’hôte.


    Clique sur l’écriture en jaune pour commencer avec la configuration et mets les
    informations nécessaires :


    ![web_server_config](Images/image-OHCIPQV2.png)


    Ils te demanderont le port que tu souhaites utiliser afin de te connecter au serveur
    :


    ![port_80](Images/image-K2031FCJ.png)


    Là, on arrête !


    Je pense que ton sixième sens t’a prévenu, Noip vient de nous demander d’ouvrir
    l’un des deux ports le 80 ou bien le 443.


    Ouvrir un port sur un routeur de n’importe quelle infrastructure la rend FORTEMENT
    vulnérable, car l’on donne un accès direct du réseau à tout le monde (y compris
    les gens malintentionnés).


    Il faut donc réfléchir deux fois avant de faire un tel geste. L’essentiel est
    d’avoir conscience de ce que tu es en train de faire et comme dit précédemment,
    c’est le savoir qui compte (et l’action aussi !).


    Revenons donc à notre interface de configuration.


    Voici comment ouvrir un port sur WAN (Wide area network) :


    ![open_80](Images/image-W1RQ9GIC.png)


    Voilà, avec le port 80 (service http) ouvert, on est prêt a continuer la configuration
    de notre hostname.


    ![open_80_check](Images/image-55SNDDPH.png)


    DONE !


    ![hosname_done](Images/image-WP602XL1.png)


    Maintenant, si tu fais une recherche sur le nom de domaine “pentest-lab.hopto.org”,
    tu tomberas sur la page de login du routeur :


    ![pentest-lab_online](Images/image-Y6QTP88D.png)


    C’est fort, n’est-ce-pas ?


    Maintenant, tu as accès au routeur à n’importe quel moment, dès que tu en auras
    besoin. N’oublie cependant pas ce que je t’ai dit plus haut, “les risques du confort”
    !


    Note : Tu peux aussi créer un autre compte administrateur pour perfectionner ton
    maintien d’accès


    ![ADMIN](Images/image-F4QL144I.png)


    Pas la peine d’essayer de connecter, je vais le retirer dès  le chapitre terminé


    N’oublie pas de noter le code PIN du point d’accès, tu en auras sûrement besoin


    #### “NO REAL EXPERT I KNOW CALLS


    #### THEMSELVES AN EXPERT”


    Robert M. Lee


    #### Autres Livres De B.Anass


    [DARK PYTHON : Apprenez à créer vos propres outils de Hacking](https://amzn.to/2vxyNhF)


    ––––––––


    ![1580303538](Images/image-URI0DUUW.png)


    #### Python, pourquoi l’apprendre? 


    Il est évident que ce n''est pas possible de devenir un hacker respectable sans
    avoir la compétence de programmer, à savoir, la chose la plus effrayante pour
    les débutants en hacking !


    La programmation t’offre la flexibilité, la souplesse, et le raisonnement pour
    que tu puisses t’adapter aux différentes situations dans lesquelles les outils
    proposés par d’autres programmeurs sur le web ne répondent pas à tes besoins. 
    Tu serras donc obligé de créer l’outil adéquat toi-même et ainsi mettre tes compétences
    de programmation en pratique.'
