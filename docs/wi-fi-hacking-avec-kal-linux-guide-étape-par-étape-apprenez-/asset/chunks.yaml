  raw: 'Relance la capture, et tu devrais voir que le SSID de ton point d’accès a
    disparu et est remplacé par le string “Wildcard(broadcast)” comme suit :


    ![hidden_ssid](Images/image-A2YR1RDA.png)


    Dans ce cas-là nous devons provoquer une reconnexion d’un utilisateur légitime
    avec le point d’accès. Grâce à ce processus, il y aura sûrement un échange de
    SSID dans le paquet de requête et celui de la réponse.


    C’est ainsi que tu vas procéder : avec aireplay-ng, tu vas envoyer des paquets
    (injections) de désauthentification à toutes les stations du point d’accès “Pentest-Lab”
    ce qui va déclencher une tentative de reconnexion des dispositifs ayant déjà reconnu
    le vrai SSID.


    Voici la commande à utiliser :


    ![image](Images/image-NO6S3N7G.png)


    root@kali:~# aireplay-ng -0 10 -a <AP MAC> <interface>


    ![image](Images/image-237A2M9B.png)


    ›  -0 : pour la désauthentification


    ›  10 : nombre de paquets à injecter dans le réseau.


    ›  -a <AP MAC> : l’adresse MAC du point d’accès


    ![aireplay-ng](Images/image-FW1ZGRV6.png)


    Cela va forcer la déconnexion des hôtes déjà connectés.


    Ensuite, et d’une manière automatique, il y aura une tentarive de rétablir la
    connexion avec le point d’accès en envoyant le SSID (qui sera non-chiffré). Notre
    carte en mode moniteur le capture immédiatement.


    ![ssid_trouvé](Images/image-OOJXPX6H.png)


    Utilise le filtre “wlan,bssid == MAC” afin de faciliter la recherche.


    Tu viens de voir que même si le SSID du point d’accès n’est pas diffusé (pas visible)
    et que même si les communications ne sont pas chiffrées, nous avons réussi à capturer
    le SSID sans aucune difficulté.


    ##### Bypasser le filtrage MAC


    L’adresse MAC (Media access control) est un identifiant physique unique stocké
    dans chaque carte réseau.


    En se basant sur l’unicité de cet identifiant, l’on a créé un mécanisme de défense
    basé sur le filtrage des adresses MAC.


    L’administrateur du réseau va créer, au niveau de la configuration du point d’accès,
    une liste de MAC adresses autorisées (ou interdites) à se connecter. Ainsi, à
    chaque fois, un dispositif envoie une requête d’authentification au point d’accès.
    Ce dernier va juger l’authentification en se basant sur la liste des MAC autorisés.


    Par définition, l’adresse MAC doit être unique et ne peut pas être modifiée par
    l’utilisateur. Néanmoins, ce n’est pas réellement le cas.


    Pour commencer, configurons notre routeur pour qu’il n’accepte qu’une seule adresse
    MAC (celle de mon smartphone).


    Rends-toi sur l’interface de configuration et entre une (ou plusieurs) adresse
    MAC autorisée :


    ![MAC_router](Images/image-78BDRR2W.png)


    Maintenant, seul mon smartphone est autorisé à se connecter au routeur, et toute
    autre requête (avec MAC différée) est rejetée.


    Pour battre cette barrière de défense, nous devons sniffer.


    En utilisant airodump-ng, on peut trouver les adresses MAC qui sont connectées
    (et donc autorisées) au point d’accès. Voici la commande à utiliser :


    ![image](Images/image-NDGPKX35.png)


    root@kali:~# airodump-ng -c <channel> -a—bssid <mac> “interface-mon”


    ![image](Images/image-RXZPDYD8.png)


    Où :


    ›  -c : pour définir le canal du point d’accès


    ›  -a—bssid : pour définir l’adresse MAC du point d’accès


    ›  Interface-mon : ta carte réseau en mode moniteur


    Et si je ne connais ni le canal ni l’adresse MAC du point d’accès ?


    Très bonne question !


    Pour récupérer l’adresse MAC du point d’accès ainsi que le canal dans lequel il
    est actif, il suffit d’utiliser une simple commande qui fera tout le travail pour
    nous, la voici :


    ![image](Images/image-CIO5LXMM.png)


    root@kali:~# airodump-ng “interface-monitor”


    ![image](Images/image-OER7O58N.png)![airodump-ng](Images/image-4WSQSCR1.png)


    Comme tu peux le voir, en capturant les paquets circulant autour de moi, j’ai
    pu récupérer les informations suivantes :


    ›  Le réseau cible : “Pentest-Lab”.


    ›  Le BSSID du réseau cible : c’est l’adresse MAC du point d’accès “Pentest-Lab”.


    ›  Le numéro du canal : “6”


    Maintenant, pour révéler les utilisateurs connectés au point d’accès exécute la
    commande suivante :


    ![image](Images/image-JGEICGX9.png)


    root@kali:~# airodump-ng -c <canal> -a—bssid <mac> “interface”


    ![image](Images/image-LXRL7JFV.png)


    Exemple :


    ![image](Images/image-5ZF1IY8W.png)


    root@kali:~# airodump-ng -c 1 -a—bssid 00:9A:CD:2E:DE:7A wlan0mon


    ![image](Images/image-2QF167J5.png)![doogee_airodump](Images/image-4IETEJZZ.png)


    Une fois l’adresse MAC autorisée est repérée, nous pouvons spoofer notre MAC adresse
    (si si, on peut !) en utilisant l’outil macchanger qui est installé par défaut
    sur Kali.


    D’abord, désactive l’interface réseau avec la commande (sinon, les changements
    ne peuvent pas être appliqués) :


    ![image](Images/image-60STII76.png)


    root@kali:~# ifconfig “interface” down


    ![image](Images/image-YG1CSFKC.png)![ifconfig_down](Images/image-51TGZ1WD.png)


    Puis spoof l’adresse MAC connectée au point d’accès :


    ![image](Images/image-8LXY47V3.png)


    root@kali:~# macchanger -m <MAC> “interface”


    ![image](Images/image-HV76LVE3.png)![MACCHANGER](Images/image-L87QROC3.png)


    Maintenant, réactive l’interface avec la commande :


    ![image](Images/image-2KCDXCVF.png)


    root@kali:~# ifconfig wlan0mon up


    ![image](Images/image-PGKUL4S2.png)


    Voilà, tu disposes d’une toute nouvelle adresse MAC qui te permettra de te connecter
    au point d’accès le plus normalement possible.


    Note : Pour éviter les problèmes de collision avec d’autres utilisateurs essayant
    de se reconnecter, utilise aireplay-ng pour couper toute tentative de connexion
    (cf. le chapitre Dos attaque). À toi de jouer !


    Cette méthode est aussi valable pour les réseaux sans fil cryptés (WEP, WPA...).
    Le raisonnement est donc le même.


    #### Comment se defendre ?


    ❖  Comme tu peux le constater, l’utilisation de ce type de filtrage n’offre presque
    aucune protection réelle à un réseau sans fil.


    #### “IF YOU WANT SOMETHING


    #### TO HAPPEN, YOU DON’T


    #### NEED TO WAIT FOR


    #### PERMISSION”


    Ian Coldwater


    ##### Chapiter 7


    ![image](Images/image-4RML5381.png)


    ##### WLAN ET CHIFFREMENT


    Comme tu dois le savoir, les WLANs (Wireless local area network) transmettent
    les données par voie aérienne, et au vu de leur sensibilité aux écoutes clandestines,
    il est devenu indispensable de créer une solution afin de renforcer la sécurité
    de ces mêmes réseaux.


    IEEE 802.11 est un ensemble de normes qui concerne les réseaux sans fil locaux
    (Wi-Fi). Ce comité, en s’appuyant sur la cryptographie, a créé des protocoles
    afin de renforcer la sécurité des WLANs. Les voici :


    ›  Wired equivalent privacy (WEP)


    ›  Wi-Fi protected access (WPA)


    ›  Wi-Fi protected access version 2 (WPA2)


    Dans ce chapitre, nous allons voir les points faibles de ces protocoles de cryptage
    et les différentes façons de les exploiter.


    ##### WIRED EQUIVALENT PRIVACY (WEP)


    Il est apparu en 1999 et a été cracké en 2000\. De ce fait, l’on a tendance à
    le nommer “Weak encryption protocole”.


    Il existe plusieurs faiblesses dans ce protocole que l’on ne va cependant pas
    détailler ici, carcela requiert des connaissances approfondies en mathématiques.


    WEP n’a pas été conçu pour être un protocole de confidentialité. Cependant, nous
    allons voir comment briser ce cryptage en utilisant des outils disponibles sur
    Kali.


    La faille majeure de ce protocole étant son utilisation des IVs (Initialisation
    verctor). Voici en quoi cela consiste : quelle que soit la taille de la clé, dans
    tous les cas, 24 bit seront alloués aux IVs. Le problème est que ces mêmes IVs
    contiennent des informations sur le restant de la clé de chiffrement.


    Ainsi, pour trouver la clé, il suffit de capturer un nombre suffisant de paquets
    puis de les soumettre à un traitement adéquat afin de récupérer la clé.


    Pour démontrer l’attaque, change la configuration de ton point d’accès à WEP et
    mets une clé de ton choix :


    ![XEP](Images/image-EOAH523S.png)


    Maintenant, tu vas être déconnecté du réseau ainsi qu’à tous les autres dispositifs
    connectés. Dès maintenant, tu dois t’authentifier avec la clé définie précédemment
