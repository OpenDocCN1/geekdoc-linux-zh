    dans le livre.


    Voici ce que nous allons voir :


    ›  Préparation du matériel et du logiciel


    ›  Lancement de Kali Linux


    ›  Configuration du point d’accès


    ## Matériel


    Pour exercer avec moi, tu auras besoin de :


    ◆  Un laptop avec un minimum de 4Gb de RAM et 2.2Ghz de CPU, doté d’une carte
    réseau interne


    ◆  Un adaptateur Wi-Fi : indispensable pour appliquer les attaques sur les réseaux
    sans fil. Cependant, il faut avoir un adaptateur qui supporte l’injection de paquets
    (nous allons voir plus tard de quoi il s’agit). Idéalement, opte pour l''alfa
    awus036h ou le TP-link-WN722N qui sont tous les deux supportés par Kali


    ![awus036h-carte-wifi-usb-alfa-network-1000-mw-et-antenne-5-dbi](Images/image-4M59MCK8.png)


    ––––––––


    ◆  Un point d’accès : n’importe quel point d’accès qui supporte le chiffrement
     WEP/WPA/WPA2 fera l’affaire. Personnellement, je vais utiliser celui-là :


    ![Huawei-B310-Main](Images/image-09QPUBL8.jpg)


    #### Logiciels


    En ce qui concerne le software tout ce dont tu auras besoin c’est :


    [D’une image de Kali Linux : si tu n’utilises pas Kali comme sytème d''exploitation
    primaire, il suffit de télécharger le fichier ISO depuis le site officiel et de
    le lancer comme machine virtuelle avec VirtualBox](https://www.kali.org/downloads/)


    [De VirtualBox : un logiciel qui te permet de virtualiser Kali Linux si tu ne
    veux pas l’installer ou le lancer depuis un disque d’amorçage](https://www.virtualbox.org/wiki/Downloads)


    Pour installer VirtualBox, il suffit de télécharger l’exécutable depuis le site
    officiel et de l’installer (installation standard).


    Si tu es un Linuxien, tu peux l’installer avec la commande suivante :


    ![image](Images/image-WLWKPUON.png)


    root@kali:~# sudo apt-get install virtualbox


    ![image](Images/image-0Y16SR3H.png)


    #### Chapitre 3


    ![image](Images/image-4RML5381.png)


    #### Configuration du lab


    ### Lancement de  kali :


    Voyons maintenant comment lancer Kali.


    Il y a plusieurs façons de le faire :


    ›  La première façon est de l’utiliser comme machine virtuelle : télécharge l’image
    depuis le site officiel de Kali. Cette image est préconfigurée, donc double-clique
    dessus et Kali sera lancé


    ›  La deuxième méthode est de booter Kali depuis un flash disque. Cette méthode
    est intéressante pour ceux qui n’ont pas de matériel assez puissant pour lancer
    Kali en virtuel.


    Dans le deuxième cas, télécharge le fichier ISO et brûle-le sur un flash disque
    de 8Gb d’espace (minimum) en utilisant un logiciel comme Linux USB creator (pour
    Windows) ou Rosa (pour GNU/Linux), puis redémarre ton PC et, avant de booter,
    appuie sur la touche qui te permet de choisir ton flash disque comme plateforme
    d’amorçage.


    CONFIGURATION DU POINT D’ACCÈS


    Allume ton point d’accès car nous allons réaliser quelques modifications sur sa
    configuration afin de clarifier quelques concepts.


    Connecte ton routeur en entrant son adresse IP dans le champ de recherche de ton
    navigateur. Tu trouveras l’adresse IP et les paramètres de connexion dans le manuel
    d’utilisation ou sur le site officiel du fabricant.


    ![192.168.8.1](Images/image-DR9WK0Q2.png)


    Une page de login (ou pop-up) s’affiche. Le nom d’utilisateur et le mot de passe
    varient en fonction du fabricant du routeur.


    Dans mon cas, c’est admin : admin :


    ![pop-up_login](Images/image-PVBM9500.png)


    Fais une petite balade et découvre les différentes configurations afin que tu
    t’habitues à cette même interface.


    Ce qui nous intéresse maintenant, c’est de changer le SSID (le nom du réseau Wi-Fi)
    à “Pentest-Lab” et de désactiver le chiffrement (Wi-Fi ouvert) :


    ![pentest-lab](Images/image-TNU5835H.png)


    Sauvegarde les changements effectués, et redémarre le routeur afin de les appliquer.


    Vérifie ton network manager pour voir si les modifications ont été appliquées
    avec succès :


    ![network-manaer-pentest-lab](Images/image-QRN5JLEK.png)


    La raison pour laquelle nous avons mis le point d’accès en mode “ouvert”, c’est
    pour t’initier à quelques concepts fondamentaux concernant les reseaux.


    Au fur et à mesure de notre progression, nous allons augmenter le niveau de sécurité,
    étudier ses points forts et ses points faibles puis l’exploiter.


    ### CHAPITRE 4


    ![image](Images/image-4RML5381.png)


    ### Wi-Fi HACKING... NIVEAU : 0


    #### Connexion au point d’accès


    Après avoir préparé notre environnement de test, voyons voir comment nous pouvons
    connecter notre carte réseau externe avec le point d’accès via le terminal (ligne
    de commande).


    L’avantage d’utiliser les cartes réseaux sus-citées (notamment la alfa awus036h),
    c’est qu’elles sont supportées par Kali avec des périphériques préinstallés, ce
    qui veut dire que tu dois juste brancher ta carte et tu seras prêt.


    Tout d''abord, je vais te montrer quelques commandes qui te seront utiles lors
    de la configuration de ton adaptateur en ligne de commande.


    La première commande que tu dois connaître est ifconfig :


    ![ifconfig](Images/image-K74J8EZY.png)


    Comme tu peux le voir, wlx00e04c8e263e est l’interface Wi-Fi que mon système a
    créé pour ma carte alfa.


    Pour étudier ses détails séparément, entre la commande ifconfig suivie du nom
    de l’interface :


    ![ifconfig_interface](Images/image-G59VO1AT.png)


    Tu peux voir l’adresse MAC de la carte et la comparer avec celle qui est marquée
    sur le dos de la carte (pour t’assurer que tu as une carte originelle et non pas
    une copie). Puisqu''elle n’est pas encore connectée à un réseau, il n''y a pas
    grand chose à expliquer.


    Tout d’abord, voyons les réseaux Wi-Fi que notre carte alfa a pu détecter. Pour
    cela, entre la commande iwlist “interface” scanning et tu auras la liste des réseaux
    qui sont à portée de votre antenne :


    ![iwlist](Images/image-27IIQPSM.png)


    Fais défiler les résultats vers le bas et tu devrais apercevoir notre point d’accès
    “Pentest-Lab” dans le champ ESSID :


    ![iwlist_pentstlab](Images/image-D40OP0L8.png)


    Ensuite, pour connecter à notre réseau “Pentest-Lab” nous devons exécuter la commande
    :iwconfig “interface” essid “Pentest-Lab”, ou tout simplement via notre network-manager
    :


    ![iwconfig_connect](Images/image-FA818HP7.png)


    Bien. Maintenant, assure-toi que le DHCP t’a attribué une adresse IP en exécutant
    la commande ifconfig :


    ![ifconfig_alfa](Images/image-OVANGCO1.png)


    Ifconfig nous permet d’avoir les informations suivantes :


    Inet_addr est l’adresse IP de notre machine dans le réseau “Pentest-Lab”


    Bcast est l’adresse de diffusion du réseau, autrement dit, si une machine dans
    un réseau veut diffuser une information qui intéresse toutes les machines connectées
    au même réseau, elle va l’envoyer à cette adresse


    Mask est l’adresse qui nous permet de classer un réseau selon son nombre d’hôtes.
    Dans notre cas le réseau peut accepter jusuqu’à 254 hôtes


    Dernière chose, vérifie la connexion entre toi et le routeur en envoyant des paquets
    ICMP avec la commande ping :


    ![ping](Images/image-WQF27AMQ.png)'
