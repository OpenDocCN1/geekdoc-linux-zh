    ## Disclaimer


    Toute action ou activité liée au contenu de ce livre relève de votre entière responsabilité.
    L''usage abusif des informations contenues dans ce livre peut donner lieu à des
    poursuites pénales contre les personnes en question, donc veillez à créer un environnement
    propice afin de tester les connaissances que je vais vous présenter dans ce livre.
    Et surtout, n’hésitez pas : Virtualbox est à votre disposition.


    Une autre chose importante : les connaissances fournies dans ce livre ne sont
    pas garanties et ce domaine est en évolution continue. Donc si vous trouvez que
    certaines informations ne sont plus valables, n’hésitez pas à me le signaler en
    me contactant. Je serais ravi de corriger ce qui est nécessaire et de vous remercier
    par la même occasion.


    Ma chaîne YouTube : youtube.com/HackinGeeK


    Mon site web : https://hackingeek.com/


    Mon adresse e-mail : anass@hackingeek.com


    Notre page Facebook : hackingeek0x/


    #### Introduction


    ![image](Images/image-4RML5381.png)


    Un pirate qui arrive à pénétrer un réseau, quel qu’il soit : le réseau d’une entreprise,
    d’une banque, ou d’une organisation gouvernementale a de lourdes conséquences,
    car tout simplement, le réseau est en sa possession.


    Et avec l’augmentation exponentielle des réseaux sans fil (Wi-Fi) et leur omniprésence
    dans notre vie quotidienne ainsi que la simplicité qu’ils apportent à notre façon
    de traiter l’information et de la partager, les hackers travaillent avec acharnement
    pour les sécuriser. De l’autre côté, l’on a aussi les black hat qui font de leur
    mieux pour les exploiter.


    Il existe plusieurs attaques efficaces contre les réseaux Wi-Fi, qui cependant,
    causent le vol de données, l’intrusion des réseaux, des dénis de service et beaucoup
    d’autres attaques.


    Cette approche d’attaque et de défense contre le bien et le mal (entre hackers
    et pirates) est éternelle et il n’y a aucun moyen de s’en débarrasser. En revanche,
    la seule solution que je te propose dans ce livre afin de diminuer les risques
    au maximum est : le savoir.


    Malheureusement, même un script kiddie peut exécuter ces attaques en utilisant
    des outils preinstallés sur Kali Linux sans connaître le fonctionnement interne
    de ces outils-là (et c’est pour cette raison que l’on les appelle “script kiddies”).


    Cependant, ce que nous allons faire ensemble dans ce livre, c’est  comprendre
    le fonctionnement des réseaux (en simplifiant les concepts le plus possible).
    Nous allons également apprendre à exploiter leur vulnérabilité afin de mieux se
    défendre contre les pirates.


    En tant que hacker, tu dois disposer d’un savoir approfondi sur les réseaux (dont
    le Wi-Fi), les stratégies d’attaque et de défense, car c’est notre arène et notre
    combat !


    Wi-Fi HACKING avec KALI LINUX est destiné au débutant hacker dans le but de l’aider
    à comprendre les failles communes des réseaux Wi-Fi et comment procéder un test
    d’intrusion pour les exploiter. J’ai veillé à ce que le livre soit un guide étape
    par étape couvrant la théorie et la pratique.


