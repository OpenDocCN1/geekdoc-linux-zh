  trans: "\n正如你所见，连接已成功建立。\n\n为了让你应对接下来的章节，简单的热身准备已经结束。\n\n现在我们将进入正题：理解网络的工作原理，旨在揭示其漏洞并利用它们。\n\
    \n现在，让我们开始黑客之旅！\n\n#### “为了跟上进度\n\n#### 并保持竞争力，你\n\n#### 必须努力工作” \n\nMing Chow\n\
    \n### 第 5 章\n\n![image](img/image-4RML5381.png)\n\n### 网络解剖：wireshark\n\n我们刚刚禁用了接入点的加密，这意味着用户与路由器之间的所有通信将不再是加密的。任何黑客（或攻击者）都可以使用合适的网卡嗅探网络，并获取路由器与客户端之间交换的信息。\n\
    \n#### Wireshark 是什么呢？\n\nWireshark 是一个开源且免费的数据包分析器，允许我们读取和记录在特定网络中流传输的数据包。它主要用于网络故障排除和协议开发。\n\
    \n然而，作为黑客，我们感兴趣的是通过嗅探网络来收集尽可能的信息。\n\n请注意，你也可以使用 `tcpdump` 或 `tashark` 等工具实现相同的目标。尽管如此，要知道\
    \ `wireshark` 是最受欢迎的数据包分析器。\n\n#### 监听模式\n\n在开始攻击之前，要做的第一件事是创建一个监听模式接口。这种模式允许我们捕获并读取我们空气空间中的所有数据包。这种模式通常被称为“混杂模式”（promiscous\
    \ mode）。\n\n为了将网卡切换到监听模式，我们需要使用 `airmon-ng` 工具。执行命令 `airmon-ng` 来检查网卡是否仍然可用：\n\
    \n![airmon-ng](img/image-B9UE42WK.png)\n\n然后，为了切换到监听模式，输入命令 `airmon-ng start “interface\"\
    `。这将导致模式变为监听模式，接口名称也会发生变化：\n\n![wlanmon0](img/image-J8TCTNWE.png)\n\n如你在上面的截图中所示，网卡名称已变为\
    \ `wlan0mon`。你可以通过 `iwconfig` 命令进行确认：\n\n![iwconfig_monitor](img/image-62RMOVUV.png)\n\
    \n很好。我们现在准备好扫描空气了（哈哈！）。\n\n注意：如果你使用的适配器不是 `alfa awus036h`，请执行以下命令以确保它支持数据包注入：\n\
    \n![image](img/image-LCZX4EAH.png)\n\n```\nroot@kali:~# aireplay-ng -9 “interface-monitor”\n\
    ```\n\n![image](img/image-W7O0E9VR.png)![injection](img/image-KUSTH7RS.png)\n\n\
    有时某些进程会阻止网卡进入监听模式。在这种情况下，你必须使用以下命令杀死（KILL）这些进程：\n\n![image](img/image-NUSAJRR4.png)\n\
    \n```\nroot@kali:~# airmong-ng check kill\n```\n\n![image](img/image-I3A7R2Q6.png)\n\
    \n要重新激活这些进程，只需执行以下命令：\n\n![image](img/image-QHYJP407.png)\n\n```\nroot@kali:~#\
    \ service networking restart\nroot@kali:~# service network-manager restart\n```\n\
    \n![image](img/image-QZGH1N6D.png)\n\n#### 嗅探网络\n\n在终端输入 `wireshark` 启动 `wireshark`：\n\
    \n![wireshark](img/image-2MM9A2KN.png)\n\n注意：`wireshark` 默认将网络接口置为混杂模式。\n\n启动\
    \ `wireshark` 后，双击你的接口名称开始捕获。你会看到大量信息在屏幕上滚动，如下：\n\n![wireshark-sniff](img/image-U9OZAII5.png)\n\
    \n所有这些数据包在我们周围持续流动的信息。我们的网卡可以捕获并以可读的形式呈现它们。\n\n`wireshark` 的界面非常直观。事实上，在结果字段中，你可以看到数据包的源和地、通信使用的协议以及其他信息。\n\
    \n在上方，`wireshark` 为每个捕获的数据包提供了更高级的细节。这些是关于帧（frames）以及 OSI 模型模型的详细信息。\n\n注意蓝色的数据包。这些是非加密数据包，这就是为什么我们能看到它们的明文内容（实际上这并不正常）。\n\
    \n当用户访问未使用 SSL 加密的网站时，巨大的危险就会显现。换句话说，不是 HTTPS 的网站，这意味着所有的通信（包括敏感信息）都是明文传输的。\n\n\
    这是一个例子：连接到你的接入点 “Pentest-Lab”，然后启动 `wireshark` 并进入接口。\n"
- fmt: '

    Relance la capture, et tu devrais voir que le SSID de ton point d’accès a disparu
    et est remplacé par le string“`Wildcard(broadcast)`” comme suit :


    ![hidden_ssid](Images/image-A2YR1RDA.png)


    Dans ce cas-là--nous devons provoquer une reconnexion d’un utilisateur légitime
    avec le point d’accès. Grâce à ce processus, il y aura sûrement un échange de
    SSID dans le paquet de requête et celui de la réponse.


    C’est ainsi que tu vas procéder : avec `aireplay-ng`, tu vas envoyer des paquets
    (injections) de désauthentification à toutes les stations du point d’accès “Pentest-Lab”
    ce qui va déclencher une tentative de reconnexion des dispositifs ayant déjà reconnu
    le vrai SSID.


    Voici la commande à utiliser :


    ![image](Images/image-NO6S3N7G.png)


    ```bash

    root@kali:~# aireplay-ng -0 10 -a <AP MAC> <interface>

    ```


    ![image](Images/image-237A2M9B.png)


    › `-0` : pour la désauthentification


    › `10` : nombre de paquets à injecter dans le réseau.


    › `-a <AP MAC>` : l’adresse MAC du point d’accès


    ![aireplay-ng](Images/image-FW1ZGRV6.png)


    Cela va forcer la déconnexion des hôtes déjà connectés.


    Ensuite, et d’une manière automatique, il y aura une tentarive de rétablir la
    connexion avec le point d’accès en envoyant le SSID (qui sera non-chiffré). Notre
    carte en mode moniteur le capture immédiatement.


    ![ssid_trouvé](Images/image-OOJXPX6H.png)


    Utilise le filtre“`wlan,bssid == MAC`” afin de faciliter la recherche. Tu viens
    de voir que même si le SSID du point d’accès n’est pas diffusé (pas visible) et
    que même si les communications ne sont pas chifrées, nous avons réussi à capturer
    le SSID sans aucune difficulté.


    ## Bypasser le filtrage MAC


    L’adresse MAC (Media access control) est un identifiant physique unique stocké
    dans chaque carte réseau. En se basant sur l’unicité de cet identifiant, l’on
    a créé un mécanisme de défense basé sur le filtrage des adresses MAC.


    L’administrateur du réseau va créer, au niveau de la configuration du point d’accès,
    une liste de MAC adresses autorisées (ou interdites) à se connecter. Ainsi, à
    chaque fois, un dispositif envoie une requête d’authentification au point d’accès.
    Ce dernier va juger l’authentification en se basant sur la liste des MAC autorisés.


    Par définition, l’adresse MAC doit être unique et ne peut pas être modifiée par
    l’utilisateur. Néanmoins, ce n’est pas réellement le cas.


    Pour commencer, configurons notre routeur pour qu’il n’accepte qu’une seule adresse
    MAC (celle de mon smartphone). Rends-toi sur l’interface de configuration et entre
    une (ou plusieurs) adresse MAC autorisée :


    ![MAC_router](Images/image-78BDRR2W.png)


    Maintenant, seul mon smartphone est autorisé à se connecter au routeur, et toute
    autre requête (avec MAC différée) est rejetée. Pour battre cette barrière de défense,
    nous devons sniffer.


    En utilisant `airodump-ng`, on peut trouver les adresses MAC qui sont connectées
    (et donc autorisées) au point d’accès. Voici la commande à utiliser :


    ![image](Images/image-NDGPKX35.png)


    ```bash

    root@kali:~# airodump-ng -c <channel> -a—bssid <mac> “interface-mon”

    ```


    ![image](Images/image-RXZPDYD8.png)


    Où :


    › `-c` : pour définir le canal du point d’accès


    › `-a—bssid` : pour définir l’adresse MAC du point d’accès


    › `Interface-mon` : ta carte réseau en mode moniteur


    Et si je ne connais ni le canal ni l’adresse MAC du point d’accès ? Très bonne
    question ! Pour récupérer l’adresse MAC du point d’accès ainsi que le canal dans
