- fmt: '

    Comme nous le voyons, l’évolution du web est en accélération de jour en jour,
    ce qui fait que ce qui marche aujourd’hui ne marchera peut-être plus demain. Le
    vrai hacker ne reste pas coincé avec des outils périmés pour effectuer ses hacks,
    car attaquer un système sophistiqué à l’aide de vieux outils ou de méthodes inefficaces
    ne fait qu''accélérer ton processus d’échec et peut être d’emprisonnement (je
    parle bien sûr aux black hat).


    Ainsi, si tu sais programmer, cela augmente tes chances de réussite dans un hack,
    en bipassant toutes les mesures de sécurité que tu rencontreras, que ce soit des
    `IDS` (Intrusion detection system), antivirus ou autres outils de défense. En
    tant que programmeur, tu es au courant de comment tout cela fonctionne, rendant
    tes attaques plus pertinentes tout en restant sur tes gardes.


    Un atout pour ceux qui savent programmer est qu’ils connaissent le mode de fonctionnement
    des outils qu’ils utilisent durant leur processus de hacking. Certes, il n’est
    pas nécessaire de créer tous ses outils pour être hacker, mais utiliser un outil
    dont tu ne connais pas le fonctionnement ne fait de toi qu’un “script-kiddie”.


    Souvent, tu n’auras qu’à modifier un script écrit par d’autres hackers pour l’adapter
    à ta situation (ce qui pour moi, est une opportunité qui ne s’offre qu’aux programmeurs,
    car cela fait gagner un temps fou). Tu vas certainement te retrouver dans des
    situations où tu n’auras pas ce luxe. Alors, la seule solution serait d’écrire
    son propre programme de A à Z, puis de le partager avec la communauté des programmeurs
    (c’est une communauté géniale, je te l’assure !). Le partage permet de voir de
    quelle manière d’autres cerveaux peuvent résoudre le même challenge par différentes
    stratégies. Leurs feed-back vont aussi te faire passer à un niveau supérieur et
    tu vas te retrouver entouré de bonnes personnes.


    ## Python, c’est quoi ?


    Python est un langage de programmation de haut niveau, objet interprété, multi-plate-forme
    et open source, impliquant donc que son interpréteur avec ses librairies sont
    disponibles au téléchargement gratuit pour les différents systèmes d’exploitation
    (Windows, Linux, iOS...).


    C’est un langage de haut niveau, c''est-à-dire que tu peux comprendre ses syntaxes
    facilement, ce qui fait la différence avec les langages de bas niveau qui sont
    proches du langage machine tel que `Assembly` que seules les machines peuvent
    comprendre.


    Python a été créé aux environs des années 1980 par Guido Van ossum (son nom a
    l’odeur de la programmation) et il a pris de l’ampleur petit à petit jusqu’à devenir
    l’un des plus populaires langages de programmation.


    La propagation de ce langage est due à sa syntaxe explicite et sa puissance, l’on
    peut pratiquement tout créer avec Python (GUI, application web, jeux... Etc.).


    Si tu programmes avec d’autres langages de haut niveau, tu ne trouveras aucune
    difficulté à comprendre ses syntaxes, et même, au contraire tu constateras que
    les commandes sont plus courtes (comparé à `Java` par exemple), ameliorant donc
    la lisibilité des lignes de codes.


    Python vient avec une pile de librairies et modules intégrés, donnant à l’utilisateur
    un large spectre de possibilités et de flexibilité, faisant de lui l’une des meilleures
    armes des hackers.


    Voici un exemple :


    Si tu veux écrire un programme classique qui affiche “Hello, world !” en utilisant
    le `C++`, tu seras obligé de procéder comme ce qui suit :


    ```cpp

    #include <iostream> int main() { std::cout << "Hello, new world!" << std::endl;
    return 0;}

    ```


    Relativement long, non ?


    Par contre, je peux obtenir le même résultat en utilisant une seule ligne en Python
    :


    ```python

    print("Hello, world!")

    ```


    C’est juste une petite démonstration de la simplicité de Python comparé à d’autres
    langages de script de haut niveau.


    Note : `print` veut dire “imprime” en anglais. En Python l’on utilise ce même
    terme pour l’affichage.


    Si tu es nouveau dans le dojo de la programmation, tu apprécierais sa simplicité,
    ainsi que sa portabilité, car tu pourras utiliser tes programmes dans quasiment
    tous les systèmes de programmation.


    Du point de vue du hacking, tu auras la capacité de contrôler n’importe quel microcontrôleur
    qui marche sous un OS quelconque. Ces microcontrôleurs sont présents un peu partout
    : dans les jouets, les caméras, les ordinateurs et même les voitures.


    ## Une dernière chose ...


    ### Si tu as apprécié ce livre ou si tu l’as trouvé utile, je te serais reconnaissant
    de poster un court commentaire sur Amazon. Le soutien de mes lecteurs fait vraiment
    une différence et je lirai tous les commentaires personnellement afin de pouvoir
    obtenir tous les feed-back et améliorer ce même livre.


    ––––––––


    ### Merci encore pour ton soutien !


    ![image](Images/image-J6J7DQGV.png)


    ## Don''t miss out!


    Click the button below and you can sign up to receive emails whenever B. Anass
    publishes a new book. There''s no charge and no obligation.


    ![Sign Me Up](Images/image-81EQGQQ5.png)


    [https://books2read.com/r/B-A-JUUP-TFDRB](https://books2read.com/r/B-A-JUUP-TFDRB)


    ![books2read](Images/image-J6J7DQGV.png)

