    m’assurer, avec la commande suivante, qu’il n’y est plus associé :


    ![image](Images/image-5CTM7U0A.png)


    root@kali:~# airodump-ng—bssid <AP MAC>—channel<numero du canal> wlan0mon


    ![image](Images/image-T8DZG35D.png)![airodump-NOone](Images/image-9HMTO35T.png)


    Comme tu peux le constater, aucun dispositif n’est associé au point d’accès “Pentest-Lab”.


    L’étape suivante est de créer le faux point d’accès avec l’utilitaire airbase-ng
    avec un ESSID“Pentest-Lab” :


    ![image](Images/image-6FXKIIRI.png)


    root@kali:~# airbase-ng  -c 3 -e “Pentest-Lab” wlan0mon


    ![image](Images/image-YHKQUFOA.png)![airbase-ng](Images/image-CMU67J8F.png)


    Quelques secondes plus tard, le smartphone est automatiquement associé à mon faux
    point d’accès (sans avoir d’adresse IP).


    ––––––––


    ![airbase-ng-assi](Images/image-10BZ3JXX.jpg)


    Parfait. Maintenant, que ferais-tu dans le cas où le client est déjà associé au
    point d’accès ?


    Tu l’as deviné, n’est-ce-pas ?


    En effet, tu vas le désauthentifier avec aireplay-ng.


    Voyons un exemple concret.


    Arrête le faux point d’accès et connecte ta machine victime au point d’accès légitime.


    Une fois fait, recrée le faux point d’accès avec la commande précédente et attends
    un petit moment :


    ![airbase-ng](Images/image-CMU67J8F.png)


    Rien ne se passe ! Pourtant le signal du faux point d’accès est plus fort que
    celui du vrai point d’accès.


    Effectivement, car le client a établi la connexion avec son point d’accès, et
    si tu souhaites détourner ce mécanisme tu n’as qu’à le désauthentifier.


    Voici la commande que je vais utiliser pour envoyer une boucle infinie de messages
    de désauthentification, laissant au client aucune chance de reconnexion :


    ![image](Images/image-3MF3XPW4.png)


    root@kali:~# aireplay-ng—deauth 0 -a <AP MAC>—ignore-negative-one wlan0mon


    ![image](Images/image-0XCEMK8N.png)![airbase-and-airepaly](Images/image-6DI93UOI.png)


    Et voilà !


    Nous avons pu forcer le client à se connecter à notre faux point d’accès.


    Note : le client n’aura pas d’adresse IP tant que notre DHCP et le pare-feu ne
    sont pas configures.


    ##### Attaque de l’homme du milieu (MITM)


    L’attaque de l’homme du milieu est l’une des attaques les plus répandues et les
    plus puissantes sur les réseaux WLANs.


    Cette attaque peut prendre plusieurs forms. Nous allons cependant voir ensemble
    uniquement la forme la plus commune :


    Le hacker est connecté à Internet à l’aide d’un réseau local filaire. En utilisant
    son adaptateur externe, il va créer un faux point d’accès (Rogue Acess point),
    puis relier les deux interfaces (filaire et non filiare).


    Le faux point d’accès diffuse un SSID identique à celui auquel la victime sera
    connectée (ou déjà connectée).


    Voyons voir comment nous pouvons effectuer cette attaque dans notre propre lab.


    ![74c4193e-b33e-41e2-921a-6f2916e9075b (2)](Images/image-LHIH9P8H.png)


    Optimisons un peu l’attaque de la partie précédente en ajoutant une configuration
    qui permet au client d’obtenir une adresse IP et de pouvoir se connecter à Internet
    le plus normalement possible.


    Crée un faux point d’accès avec le même ESSID que celle de ta cible :


    ![image](Images/image-2WD52B26.png)


    root@kali:~# airbase-ng -e “Pentest-Lab” -c 10 wlan0mon


    ![image](Images/image-BTFPDNUW.png)![at0](Images/image-XYPX1XCH.png)


    Comme tu peux le voir, airbase-ng a crée une interface virtuelle at0. C’est en
    quelque sorte l’interface filiaire de notre point d’accès créé par airbase-ng.


    ![ifconfig_at0](Images/image-XW1LNJZ9.png)


    Pour que le client puisse connecter à Internet, il va devoir passer par le routeur,
    autrement dit, il me faut (en tant que hacker) relier l’interface at0 créée par
    airbase-ng avec l’interface filiaire de mon routeur. C’est tout simplement un
    pont de trafic.


    La première chose à faire est de brancher le câble RJ45 à ton routeur, car l’on
    ne peut pas ponter deux interfaces sans fil. C’est, en revanche, faisable avec
    une interface filiaire et une non-filiaire.


    Voici la succession de commandes à utiliser pour appliquer ce concept de pontage
    :


    ![image](Images/image-9KDK9H6J.png)


    root@kali:~# apt-get install bridge-utils


    root@kali:~#  brctl addbr PentestLab-bridge


    root@kali:~#  brctl addif PentestLab-bridge enp0s10


    root@kali:~#  brctl addif PentestLab-bridge at0


    root@kali:~#  ifconfig enp0s10 0.0.0.0 up


    root@kali:~#  ifconfig at0 0.0.0.0 up


    ![image](Images/image-GHCPA4JZ.png)


    Note : pour mon cas, l’interface ethernet est appelée “enp0s10”. Pour trouver
    la tienne, exécute ifconfig et tu la trouveras ormalement en tout premier :


    ![Ethernet](Images/image-8K6KEV4O.png)'
