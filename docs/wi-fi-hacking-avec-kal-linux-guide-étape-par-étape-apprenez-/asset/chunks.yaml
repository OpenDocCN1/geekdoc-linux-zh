    Le 17 octobre 2017, Mathy Vanhoef, un chercheur en sécurité informatique publie
    une recherche qui dévoile une vulnérabilité qui touche presque tous les réseaux
    Wi-Fi utilisant le protocole `WPA`. C''est l’attaque “KRACK” (Key reinstallation
    attack).


    Bien sûr, Mathy n’a pas publié le script qui permet l’exploitation de cette faille
    (sinon ça aurait été la catastrophe !), cependant, il a réalisé une vidéo de preuve
    du concept ainsi qu’un article détaillé qui démontre comment l’on peut exploiter
    les appareils basés sur Android, iOS, Linux, Windows et d’autres systèmes d’exploitation
    pour accéder à toutes les informations que l’utilisateur télécharge ou met en
    ligne.


    En créant un faux point d’accès, l’attaquant va cibler la troisième étape du processus
    du `4-way handshake`. La clé de chiffrement peut être renvoyée plusieurs fois
    au cours de la troisième étape. Si les attaquants collectent et rejouent ces retransmissions
    de manière particulière, le chiffrement de sécurité Wi-Fi peut être rompu.


    Une fois l’attaque établie, l’attaquant peut accéder aux noms d''utilisateur,
    aux mots de passe et aux données stockées sur les appareils. Le pirate peut lire
    les e-mails et voir des photos des données transmises, puis utiliser ces informations
    pour faire du chantage aux utilisateurs ou les vendre sur le Dark Web.


    ### Comment se défendre ?


    ❖ Savoir que ces attaques existent


    ❖ Être vigilant


    ### “DEFENSIVE NEEDS TO SECURE EVERYTHING, WHEREAS AN ATTACKER ONLY NEEDS TO FIND
    THAT ONE OPENING”


    Jennifer Havermann


    ##### Chapiter 9


    ![image](Images/image-4RML5381.png)


    ##### WPS CRACKING


    `Wireless protected setup` (`WPS`) a été introduit en 2006 pour aider les utilisateurs
    non-geeks (à savoir, ayant peu de connaissances en technologies) à mieux configurer
    et sécuriser leurs réseaux.


    L’idée derrière le `WPS` était que les appareils Wi-Fi n’aient qu’une seule valeur
    codée en dur sur le routeur, à savoir un `PIN`. Ce dernier permettrait un accès
    au réseau sans être obligé d''entrer la clé de ce réseau (souvent longue et complexe).


    Autrement dit, les appareils qui veulent accès au réseau doivent obligirement
    disposer du `PIN` et de l’accès physique. L’utilisateur voulant se connecter doit
    juste entrer le `PIN` et appuyer sur le bouton `WPS` qui se trouve sur la box.
    Suite à cette action, le routeur va générer un mot de passe et l’envoyer à l’appareil
    qui envoie la requête d’authentification, lui permettant de se connecter instantanément.


    Ce standard fait que les personnes qui n’ont pas d’accès au point d’accès ne peuvent
    pas se connecter. Malheureusement (ou heureusement pour black hat), ce n’est pas
    le cas.


    En effet en 2011, le chercheur Stefan Weber a découvert une vulnérabilité qui
    permet d’exploiter ce protocole. Le fait que le `PIN` ne soit composé que de 8
    caractères entre 0 et 9 donne un nombre de 100 000 000 de possibilités en comparaison
    avec un mot de passe de 8 caractères ayant 218 340 104 896 combinaisons (je parle
    de `WPA`). Cela facilite drastiquement l’attaque.


    Cependant, ce nombre restreint de possibilités n’est pas la seule faiblesse de
    ce protocole :


    - Première faille : il n’y a que 7 chiffres significatifs dans le `PIN`. Le huitième
    chiffre est une somme de contrôle que l’attaquant peut calculer. On passe donc
    à 10 000 possibilités.

    - La seconde faille (plus gênante) : l’appareil vérifie le code en deux fois.
    Concrètement, il est possible de vérifier si les 4 premiers chiffres sont bons
    ensuite de vérifier si les quatre suivants sont bons. Au lieu de 100 000 000 de
    possibilités, on passe à 10 000 + 10 000, soit 20 000 possibilités.


    Voyons comment nous pouvons cracker la clé en exploitant toutes ces vulnabilités
    en même temps. Comme d’habitude, rends-toi sur l’interface de configuration de
    ta box et active le standard `WPS` si ce n’est pas encore fait. En ce qui me concerne,
    le `WPS` est désactivé par défaut donc je vais l’activer pour te montrer l’attaque
    :


    ![image](Images/image-SBZJXE1A.png) Comme tu peux le voir, le `PIN` de mon routeur
    est écrit d’une manière visible. Très bien, notre environnement de test est prêt.


    `wash` est un outil qui permet de scanner l’environnement à la recherche de réseaux
    ayant le protocole `WPS` activé. Mets ta carte réseau en mode moniteur pour pouvoir
    lancer `wash` :


    ![image](Images/image-SASZJWKA.png)


    ```bash

    root@kali:~# airmon-ng start "interface"

    ```


    ![image](Images/image-PZO5Q9S7.png) ![image](Images/image-DRCIQA2.png) Avec la
    carte réseau en mode moniteur tu peux maintenant lancer `wash` à la recherche
    de réseaux ayant un `WPS` actif. Exécute la commande suivante :


    ![image](Images/image-G59LW6EA.png)


    ```bash

    root@kali:~# wash -i "interface-monitor"

    ```


    ![image](Images/image-ROS9UVF6.png) ![image](Images/image-ICYE3R9A.png) Oups !
    Une erreur ! En vérité, je ne sais pas à quoi est due cette erreur, mais le fait
    d’exécuter la commande `ifconfig wlan0 up` fera tout rentrer dans l’ordre :


    ![image](Images/image-UK7BVQR4.png) Réexecuteute la commande `wash -i wlan0mon`.
    Cette fois-ci, tu devrais avoir un résultat comme celui-là :


    ![image](Images/image-TAIB5807.png) Très intéressant ! Je vois que je ne suis
    pas le seul qui est en train d’étudier le protocole `WPS` ! Même s’il est connu
    que ce standard soit très vulnérable, les constructeurs de point d’accès vendent
    toujours des points d''accès avec un `WPS` activé par défaut, ce qui rend le réseau
    et ses utilisateurs sans défense.


    `wash` nous dévoile les réseaux avec un `WPS` activé, sa version, et s’il est
    verrouillé ou non. Maintenant, c’est à `reaver` de brute forcer le `PIN`. Pour
    cela, entre cette commande dans ton terminal :


    ![image](Images/image-KIJSY7YS.png)


    ```bash

    root@kali:~# reaver -i "interface-monitor" -b <AP MAC> -vv

    ```


    ![image](Images/image-PP554BXX.png) `-vv` : pour le mode verbeux


    ![image](Images/image-19PJPX5.png) Après quelques tentatives de brute force, le
    routeur a détecté l’attaque et a imposé un temps d’attente de 60 secondes ce augmente
    considérablement le temps de calcul :


    ![image](Images/image-H3E2W6PR.png) Etant donné que je n''ai pas pu hacker, je
    me dois de te démontrer une attaque réussie sur le réseau d’un ami :


    ![image](Images/image-GFH6HFX6.png) En exécutant la commande `reaver -i wlan0mon
    -b 74:DA:DA:BD:70:69 -vv` j’ai pu cracker le `PIN` et récupérer le mot de passe
    du Wi-Fi en quelques secondes :


    ![image](Images/image-O16N0BYD.png)

