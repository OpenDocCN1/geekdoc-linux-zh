    Voulez-vous devenir hacker même si vous n''avez jamais touché à un clavier ! Faire
    partie d''une communauté de hackers talentueux et motivés et obtenir en plus de
    tout ça une formation vidéo gratuite ?


    Laissez-moi d''abord vous raconter une histoire :


    Je me réveille le matin, je mets mon laptop dans le sac à dos, la destination
    la fac où j''ai cours toute la mâtiné. Le problème, c''est que j''ai pas envie
    de perdre 4 heures à entendre des choses que je connaisse déjà, je décide de m''amuser
    !


    Le prof parle sans arrêt et je commence à m''ennuyer, je lance ma distribution
    préféré : Kali Linux, et en bidouillant quelques instants j''arrive à exploiter
    le laptop du prof .... Hum, que puis-je faire maintenant !Je me balade un peu
    dans les différents dossiers, peut-être, je trouverai le sujet de mon prochain
    examen ! Aha, très intéressant son navigateur enregistre tous ses mots de passe
    allant du compte Gmail, compte Facebook, carte de crédit .... Mais tout cela m''intéresse
    peu, car je veux juste m''amuser (en plus, je ne suis pas si méchant que ça!). Allez,
    j''en ai marre de ce cours, je supprime la diapo qu''utilise le prof et je redémarre
    l''ordinateur après avoir changé le mot de passe d''utilisateur.....Ouf enfin,
    il panique et nous laisse partir. 


    Ça vous dit d''avoir un tel pouvoir ? 


    La capacité de pénétrer les systèmes informatiques et de manipuler leurs utilisateurs
    pour avoir les informations que vous en avez besoin...... je vais VOUS aider à
    le faire.


    Attention, je vais vous révéler ma propre stratégie pour devenir hacker éthique
    !


    J''ai galéré longtemps pour acquérir un tel pouvoir, et peut-être, c''est votre
    cas aussi, vous ne trouvez pas les ressources qui vous permettent d''apprendre
    le hacking en partant de zéro, les livres de hacking que vous avez acheter ou
    télécharger ne sont pas destiné aux débutants, et les vidéos sur YouTube sont
    en anglais et vous ne maîtrisez pas l''anglais pour le moment !.Vous avez toujours
    voulu pirater un compte Facebook, ou apprendre à utiliser Kali Linux.J''étais
    comme vous, il y a quelques années de cela, et aujourd''hui je vais vous accompagner
    et vous montrer comment le faire pas à pas.


    Vous pouvez utiliser l''option "Feuilleter" pour découvrir ce que vous allez apprendre
    dans le livre.


    À la fin de ce livre :'
