    ![bidge_commands](Images/image-17UOVCGL.png)


    La deuxième étape consiste à attribuer une adresse IP à ce pont. Note que la meilleure
    (et la plus facile) solution est d’utiliser DHCP en exécutant une seule commande
    :


    ![image](Images/image-OAWBS2P4.png)


    ```

    root@kali:~# ifconfig PentestLab-bridge 192.168.8.10 up

    ```


    ![image](Images/image-QCGRF8TV.png)![ifconfig____192.168.0.2](Images/image-GCV8JCA5.png)


    Note : l’adresse IP du pont devrait appartenir au réseau filaire.


    Vérifie la connectivité avec le pont en envoyant des paquets ICMP avec `ping`.
    Normalement tu disposeras d’une réponse comme celle-ci :


    ![ping_192.168.8.10](Images/image-JIXJMPYX.png)


    Dernière chose, pour t’assurer que le noyau du système gère correctement le transfert
    et le routage des paquets, exécute la commande suivante :


    ![image](Images/image-MNMU59R6.png)


    ```

    root@kali:~# echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    ![image](Images/image-KJCA64TR.png)![firewal](Images/image-MKVXJTFE.png)


    Excellent, nous sommes donc prêts à lancer l’attaque !


    Mon smartphone est connecté au vrai “Pentest-Lab”. Dès maintenant, tu sais comment
    traiter cette situation : désauthentification !


    Je le désauthentifie violement avec `aireplay-ng` sans lui donner aucune chance
    de se reconnecter, sachant que l’interface utilisée pour la désauthentification
    est autre que celle que j’ai utilisé pour créer le faux point d’accès, car le
    canal d’émission n’est pas le même.


    Pour désauthentifier le client, je vais donc utiliser ma carte réseau interne
    en la mettant bien sûr en mode moniteur d’abord :


    ![image](Images/image-AERQP63D.png)


    ```

    root@kali:~# airmon-ng start wlp5s0

    ```


    ![image](Images/image-IZ0NB0OP.png)


    Puis je lance `airepaly-ng` en même temps que `airbase-ng` :


    ![allinONE_evil](Images/image-ON31Q070.png)


    Le client tombe sur le faux “Pentest-Lab” et il se connecte naïvement. Une fois
    fait, le DHCP du routeur lui attribue gentillement une adresse IP et il devient
    NOTRE VICTIME.


    Je démarre mon service `apache` et je vérifie que ma victime y a accès :


    ![image](Images/image-WA409KG9.png)


    ```

    root@kali:~# service apache2 start

    ```


    ![image](Images/image-QU00AJIP.png)


    Maintenant, sur le navigateur du smartphone, j’entre l’adresse IP du pont :


    ![Screenshot_2019-03-18-18-55-16](Images/image-P7NVU7S8.png)


    Bingo ! Nous l’avons attrapé !


    Cette attaque est très puissante au point qu’elle nous permet de voir tout le
    trafic transmis par la machine victime et de l’intercepter facilement.


    La raison pour laquelle cela est possible se résume dans le fait que nous sommes
    l’intermédiaire entre la victime et Internet, c’est ce qu’on appelle “MAN-IN-THE-MIDDLE-ATTACK”
    (l’attaque de l’homme du milieu).


    ![MITJMIDDEL](Images/image-J1KWW3BM.png)


    Mais la question qui se pose est : comment peut-on exploiter cette technique pour
    avoir le mot de passe d’un réseau Wi-Fi ?


    > ‘COMPERS AND THE INTERNET WERE BUILT WITHOUT THE IDEA THAT THEY WOULD ONE DAY
    BE ATTACKED’

    > Daniel Crowley


    ## ATTAque EVIL TWIN (jumeau maléfique)


    Il est évident que tu peux utiliser le scénario précédent pour demander à l’utilisateur
    de te donner un mot de passe (oui, tu as bien lu, il suffit de demander et tu
    peux l’auras !).


    La puissance derrière cette attaque réside dans le fait que la victime a baissé
    toutes ses gardes. Elle croit qu’elle est sur un réseau de confiance, mais un
    hacker peut exploiter cette faille humaine.


    Le principe est simple : en s’appuyant sur le MITM (Man in the middle), le hacker
    va rediriger toutes les requêtes de sa victime vers un site truqué qui demande
    une confirmation de mot de passe pour une raison ou une autre. Face à cette réalité,
    la victime va entrer ses coordonnées qui seront tombées directement dans la main
    du hacker (ou pirate). c’est le « phishing ».


    Je vais donc te montrer une attaque qui s’appelle « Wi-Fi PHISHING ». Pour cela,
    je n’ai besoin que d’une page qui contient un formulaire et un peu de design pour
    convaincre la victime d’entrer le mot de passe de son réseau Wi-Fi.


    Par contre, l’utilisation d’un outil qui automatise ce que nous avons réalisé
    jusqu’à maintenant avec la possibilité de nous fournir des pages préécrites va
    nous faire gagner du temps.


    C’est la raison pour laquelle je souhaite te présenter : `Wifiphisher`, a.k.a
    l’outil ultime. `Wifiphisher` est un outil capable de monter des attaques.


    D’abord, installe l’outil avec la commande suivante :


    ![image](Images/image-R56.png)


    ```

    root@kali:~# apt-install wifiphisher

    ```


    Une fois installé, tu peux le lancer en tapant :


    ```

    root@kali:~# wifiphisher

    ```

