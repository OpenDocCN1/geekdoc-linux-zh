    #### Sniffer le réseau


    Lance wireshark en entrant wireshark dans le terminal :


    ![wireshark](Images/image-2MM9A2KN.png)


    Note : wireshark met par défaut les interfaces réseaux en mode promiscous.


    Une fois wireshark lancé, double-clique sur le nom de ton interface pour commencer
    la capture. Tu verras un tas d’informations défiler sur ton écran comme suit :


    ![wireshark-sniff](Images/image-U9OZAII5.png)


    Tous ces paquets sont des informations qui circulent en permanence autour de nous.
    Notre carte peut les capturer et les présenter sous une forme lisible.


    L’interface de wireshark est assez intuitive. En effet, le champ des résultats,
    tu peux voir que l’on dispose de la source du paquet ainsi que sa destination,
    le protocole utilisé dans la communication ainsi que d’autres informations.


    Au-dessus, des détails plus avancés sont fournis par wireshark concernant chaque
    paquet capture. Ce sontt des informations détaillées sur les frames et le modèle
    OSI de façon générale.


    Prête attention aux paquets en bleu. Ce sont des paquets non chiffrés et c’est
    la raison pour laquelle nous voyons leurs contenus en clair (ce qui n’est pas
    normal d’ailleurs).


    Le grand danger se manifeste quand l’utilisateur visite des sites web qui n’utilisent
    pas le cryptage SSL. Autrement dit, des sites qui ne sont pas HTTPS, ce qui implique
    que toutes les communications se passent (même les informations confidentielles).


    Voici un exemple : connecte-toi à ton point d’accès “Pentest-Lab”, puis lance
    wireshark et accede à l’interface de configuration : un nom d’utilisateur et un
    mot de passe sont exigés pour se loguer :


    ![router_login](Images/image-O88EN15Q.png)


    Maintenant, entre le nom d’utilisateur et le mot de passe puis clique sur connexion.


    Reviens à wireshark et arrête la capture, puis filtre les paquets http dans la
    barre qui est en vert :


    ![http_filter](Images/image-E5AGBPAM.png)


    Les paquets HTTP vont alors apparaître dans le champ de résultats, ce qui va nous
    faciliter la recherche du paquet contenant le nom d’utilisateur et le mot de passe.


    Comme tu le sais, les paramètres entrés précédement sont envoyés par la méthode
    POST !. Tu peux donc tout de suite identifier le paquet en question.


    ![admin_admin](Images/image-46JZUGFD.png)


    Maintenant, sélectionne le paquet, puis dans le champ en dessous, sélectionne
    hypertext transfer protocol :


    Username et password sur un plateau d’argent !


    Tu viens donc de voir les énormes risques de passer à côté du chiffrement Heureusement
    que la majorité écrasante des sites web utilisent le protocole SSL (HTTPS) dans
    leurs transferts de données.


    Même cela peut être hacké !.


    ##### Real hacking !


    Les aéroports, les hotels et coffee shop sont les grandes victimes de ce type
    d’attaque. Dans mon livre DARK PYTHON l’on y retrouve la scenario suivant : un
    hôtel qui dispose d’un point d’accès sans aucun protocole de chiffrement. Le terms
    et les conditions nous révèlent que le mot de passe est composé de 6 numéros.
    C’est à nous de jouer !


    Voici à quoi ressemble l’interface de login pour accéder à internet :


    ![rais](Images/image-VG8XOV5W.png)


    Tu vois donc qu’il n''y a pas de chiffrement SSL.


    La méthode la plus facile est de simplement capturer le mot de passe.


    Je lance wireshark puis je filtre les paquets http et j’attends.


    Le fait qu’un utilisateur s’authentifie avec le bon mot de passe, wireshark me
    présente les paquets contenant tous les paramètres d’authentification dont le
    mot de passe :


    ![raiswifi](Images/image-7J4BYOOT.png)


    Done !


    #### Comment se defendre ?


    ❖  utiliser le chiffrement dans tous les réseaux sans exception


    ##### Chapiter 6


    ![image](Images/image-4RML5381.png)


    ##### Wi-Fi hacking... niveau : 1


    ##### Dévoiler les SSID cachés


    Par défaut, les points d’accès diffusent leur SSID (nom du réseau Wi-Fi) en envoyant
    des trames nommées “beacons”. Cela permet au dispositive, qui est dans le champ
    de transmission, de détecter le point d’accès et d’éventuellement se connecter.


    Cependant, une des mesures de “sécurité” est de cacher le SSID du point d’accès,
    impliquant que le routeur ne diffuse plus de trames beacons et que seuls ceux
    qui connaissent le vrai SSID peuvent s’y connecter.


    Voyons voir le cas typique où le point d’accès diffuse son SSID.


    Mets ta carte réseau en mode moniteur avec la commande airmong-ng start ‘interface’
    puis lance la capture avec wireshark :


    ![SSID](Images/image-TU1RPAF9.png)


    Comme tu peux le voir, le SSID de notre point d’accès est diffusé en clair.


    Maintenant, désactive la diffusion SSID depuis l’interface de configuration de
    ton routeur (la démarche diffère selon le type de point d’accès). Voici la mienne
    :


    ![desactivate_ssid](Images/image-7QYZFHYL.png)'
