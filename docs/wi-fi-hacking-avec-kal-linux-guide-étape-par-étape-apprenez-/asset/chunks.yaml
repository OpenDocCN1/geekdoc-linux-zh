    Voici l’explication des arguments utilisés :


    ›  -3 : pour le ARP replay


    ›  -b : l’adresse MAC du point d’accès


    ›  -h : l’adresse MAC d’un client connecté au réseau


    ›  —ignore-negative-one : pour éviter les problèmes de canal


    ›  wlan0mon : adaptateur en mode moniteur


    Une fois cette commande exécutée, tu vas constater une augmentation considérable
    dans la quantité de #Data reçus :


    ![aireplay-ng_WEp](Images/image-CA947158.png)


    Let’s the hack begin !


    Laisse ces deux terminales faire leur travail et ouvres-en un troisième pour cracker
    la clé avec airckrack-ng.


    En s’appuyant sur les paquets captures qui sont dans les fichiers WEP_HACK*, airckrack-ng
    peut (tout en étant en mode hors ligne) récupérer facilement la clé juste en exécutant
    la commande suivante :


    ![image](Images/image-SY0X4ZB2.png)


    root@kali:~# aircrack-ng WEP_HACK-0*


    ![image](Images/image-656JICPI.png)


    Note : les fichiers WEP_HACK sont dans le même chemin où tu as lancé airodump-ng.


    ––––––––


    ![WEP_FOUND](Images/image-QVIAFA2Y.png)


    Voilà, en une fraction de seconde, il a pu cracker la clé.


    Dans cette partie dédiée au hacking d’une clé WEP, nous avons vu que le WEP est
    très facile à cracker, peu importe la complexité de la clé, et que ce processus
    ne demande que quelques minutes, le temps de capturer suffisamment de paquets
    contenant les IVs.


    Et le plus important, c’est que nous avons vu que le WEP est toujours vivant !


    #### Comment se défendre ?


    ❖  Ne jamais utiliser le protocole WEP


    #### Wi-Fi protected access(WPA)


    Le protocole WPA utilise principalement le cryptage TKIP. Il a été créé dans le
    but de renforcer le protocole WEP que nous avons vu précédemment sans apporter
    de changements aux infrastructures des réseaux.


    Tandis que le WPA2 (deuxième version de WPA) est basé sur l’utilisation de l’algorithme
    AES-CCMP pour le cryptage de données, ce qui est plus puissant par rapport au
    TKIP.


    Cependant, tous les deux permettent l’authentification basée sur EAP en utilisant
    des clés prépartagées, des PSK (personnel) ou bien des serveurs RADIUS (entreprise).


    Heureusement (ou malheureusement), WPA/WPA2 est vulnérable à l’attaque par dictionnaire.
    Tout ce dont tu as besoin pour mener l’attaque est :


    ›  Le four-way handshake (paquets échangés pour établir la connexion entre un
    client et un point d’accès sous WPA en passant par 4 étapes)


    ›  Un dictionnaire robuste qui contient les mots de passe fréquemment utilisés
    ou que tu juges être utilisés par ta cible après avoir fait la collecte d’informations


    ›  Un outil comme airckrack-ng qui va tenter de casser le WPA/WPA2 passphrase
    (phrase secrète)


    Voici un schéma illustrant le mécanisme d’échange de données dans le protocole
    WPA :


    ![fourwayhandshake](Images/image-RDDVEICE.png)


    ›  Étape 1 : le point d''accès envoie un nombre aléatoire au client : c''est le
    ANonce


    ›  Étape 2 : le client crée un autre nombre aléatoire appelé “SNonce”. La combinaison
    de SNonce+ANonce+le mot de passe entré par l''utilisateur crée ce qu''on appelle
    MIC (Message integrity check). Le MIC et SNonce sont envoyés au point d''accès.


    ›  Étape 3 : le point d''accès hash le ANonce, SNonce et le mot de passe et si
    ça fonctionne, le client sera authentifié et va envoyer la clé chiffrée


    ›  Étape 4 : le client accepte la clé de chiffrement


    Tu vas cependant me dire “comment la clé de prépartage est créée ?”


    Bonne question. En fait la clé de prépartage est la combinaison entre le WPA-passphrase
    (fourni par l’utilisaeur) et le SSID (nom du réseau Wi-Fi), le résultat étant
    envoyé sous forme de PBKDF2 (Password -based key derivation function) qui forme
    une clé de 256-bit .


    Les choses vont maintenant se corser...


    Tout ce qui nous intéresse en tant que pentesters (hackers) est le four-way handshake,
    autrement dit ces 4 messages dessinés sur le schéma.


    Aicrack-ng va dériver la clé prépartagée 256-bit de chaque mot contenu dans notre
    dictionnaire puis l’utiliser avec les paramètres que nous avons pu capturer pour
    créer le PTK (Pairwise transient key). Ce dernier va être utilisé pour vérifier
    le MIC (Message integrity check) dans l’un des paquets du handshake. Si cela correspond,
    le mot de passe du dictionnaire est correct.


    Voici un schéma qui simplifie le processus de l’attaque :


    ![sheemaa_WPA](Images/image-24UI16S9.png)


    Voyons voir comment le faire d’un point de vue pratique.


    Comme d’habitude, pivote vers le mode WPA dans la configuration de ton point d’accès,
    puis mets “manchester” comme mot de passe :


    ![manchester](Images/image-6JYF7EUJ.png)


    Commence la capture de paquets avec airodump-ng en redirigeant les outputs vers
    des fichiers nommés “WPA_HACK” avec la commande :


    ![image](Images/image-H96CCB49.png)


    root@kali:~# airodump-ng—bssid <AP MAC>—channel <numéro du canal>—write WPA_HACK
    “interface-monitor”


    ![image](Images/image-49P721LH.png)![wpa_airodump](Images/image-7T2TQQ01.png)


    Et on commence la capture :


    ![wpa_capture](Images/image-KVKTFRF1.png)


    Très bien. Maintenant nous avons besoin du 4-way handshake. Comme expliqué plus
    haut, ces paquets sont échangés au moment d’établir la connexion entre l’utilisateur
    et le point d’accès. Cependant, nous sommes en présence (dans la capture ci-dessus)
    avec des clients déjà connectés.


    Pour forcer une reconnexion, nous allons devoir désauthentifer les clients avec
    aireplay-ng.


    ![image](Images/image-YYGRN9MD.png)


    root@kali:~# aireplay-ng—deauth 10 -a <AP MAC> “interface-monitor”—ignore-negative-one


    ![image](Images/image-E23HXZS2.png)


    Ou :


    ›  —deauth 10 : envoyer 10 requêtes de désauthentification


    ![wpa_deauthentication](Images/image-6SNQX33H.png)


    Une fois le 4-way handshake capture, tu auras une indication en haut du terminal
    suivie du BSSID du point d’accès cible (comme le montre la capture ci-dessus).


    Arrête airodump-ng et ouvre le fichier WPA_HACK-01.cap avec wireshark. Voici les
    paquets que nous sommes en train de chercher :


    ![WPA_HACK_CAP](Images/image-5RVJ9SBG.png)


    Les paquets que airckrack-ng aura besoin pour cracker le passphase sont en vert.'
