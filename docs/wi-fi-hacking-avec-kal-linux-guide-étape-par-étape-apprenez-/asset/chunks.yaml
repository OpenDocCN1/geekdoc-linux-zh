    C’est la raison pour laquelle je souhaite te présenter : Wifiphisher, a.k.a l’outil
    ultime du Wi-Fi phishing.


    Wifiphisher est un outil de sécurité capable de monter des attaques phishing rapides
    et automatisées contre les réseaux Wi-Fi pour obtenir les identifiants sans brute
    force.


    Tout d’abord, installe l’outil avec la commnde suivante :


    ![image](Images/image-R5OCLQ7B.png)


    root@kali:~# apt-install wifiphisher


    ![image](Images/image-KYH67O1C.png)


    Une fois installé, tu peux le lancer en tapant wifiphisher dans le terminal :


    ![wifiphisher](Images/image-PK75064G.png)


    Il chargera les dépendances dont il aura besoin, puis il débutera la découverte
    des réseaux :


    ![wifiphser_decouverte](Images/image-UIOMX5UN.png)


    Note : petit rappel, le nombre de réseaux découverts dépend de la puissance de
    ton adaptateur. Ici, c’est le résultat d’un scan de ma carte alfa awus036h.


    Sélectionne ton point d’accès et appuie sur Entrée. Plusieurs scénarios s’offrent
    à toi, utilise donc les flèches du clavier pour en choisir un.


    Ce qui nous intéresse ici, c’est le deuxième scénario “firmware upgrade page”
    :


    ![wifiphisher_upgrade](Images/image-YGNXXR1X.png)


    Appuie sur Entrée.


    Si tu as eu une erreur comme celle-ci... :


    ![wifipihsier_error](Images/image-IVEPVLUO.png)


    Cela veut dire que Roguehostapd (outil qui permet de créer de faux point d’accès)
    n’est pas installé sur ton système. Dans ce cas-là, tu disposes de deux solutions
    :


    La première solution : installer Roguehostapd


    La deuxième solution : ne pas utiliser Roguehostapd pour créer le faux point d’accès


    Je vais continuer mon attaque sans avoir besoin d’utiliser Roguehostapd en utilisant
    simplement l’argument —force-hostapd comme il est indiqué dans le message d’erreur
    :


    ![image](Images/image-AABYFX3M.png)


    root@kali:~# wifiphisher—force-hostapd


    ![image](Images/image-8PPQJCWS.png)


    Puis suis les mêmes étapes que précédemment. Wifiphisher va automatiser ce que
    nous avons fait manuellement, en commençant par la création du point d’accès maléfique.
    Puis, elle continuera avec l’attribution d’une adresse IP aux victimes et enfin
    avec la redirection vers la page de phishing.


    Premièrement, la victime est déconnectée de son point d’accès et automatiquement
    connectée au faux (si le signal est assez fort). L’on voit du coup que Wifiphisher
    a commencé à envoyer ses pages de phishing, comme le montre la capture suivante
    :


    ![wifiphisher_capting](Images/image-UTD0OC2N.png)


    Plusieurs victimes, ont été déconnectées, mais seulement un seul client a pu joindre
    notre réseau.


    Du côté de la victime, un pop-up d’authentification s’affiche :


    ![Screenshot_2019-03-19-17-20-45](Images/image-QNRFBIR5.png)


    La victime, curieuse, clique dessus pour voir ce qui vient l''interrompre au milieu
    de son travail. Une page de mise à jour s’affiche alors :


    ![Screenshot_2019-03-19-17-21-03](Images/image-BS0ED56G.png)


    La victime (sans réfléchir et anticiper) entre le mot de passe du Wi-Fi et clique
    sur “Upgrade”.


    YOU HAVE BEEN HACKED !


    Le hacker reçoit le mot de passe directement :


    ![wifiphisher_passw](Images/image-XZH6UNOU.png)


    Note : bien sûr, tu peux jouer avec le code html/css de la page de phishing comme
    tu le veux. Dans ce cas, il faut juste apporter les modifications aux fichiers
    qui se trouvent dans le chemin suivant :


    ![image](Images/image-5L741O0F.png)


    root@kali:~# /usr/local/lib/python2.7/dist-packages/Wi-Fiphisher-1.3-py2.7.egg/Wi-Fiphisher/data/phishing-pages/firmware-upgrade


    ![image](Images/image-OG7W05EC.png)


    Pour ne pas réveiller plus de soupçons la victime est redirigée vers une page
    de chargement en attendant que le hacker se retire.


    ![Screenshot_2019-03-19-17-22-24](Images/image-AN6405P5.png)'
