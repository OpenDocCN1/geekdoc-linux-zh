    Dans cette attaque, sache que toi-même tu es aussi bon que ton dictionnaire.


    Bien sûr, `Kali` met à notre disposition une multitude de wordlists destinées
    aux attaques de brute force dont le fameux `rockyou.txt` et d’autres dictionnaires
    propres à Metasploit, mais souvent tout ne se déroule pas comme prévu.


    L’intrusion d’un réseau fait partie d’un test d’intrusion mené par un expert en
    sécurité. Cela veut donc dire que cracker le passphrase n’est qu’une étape précédée
    et suivie par d’autres étapes et qui vont au final permettre de compromettre un
    système.


    Cela dit, tu comprends que c’est une mauvaise idée d’effectuer ce genre d’attaque
    avec n’importe quel dictionnaire sur n’importe quelle cible parce que ça varie.


    En effet, un réseau qui appartient à un ingénieur en sécurité informatique n’aura
    pas le même “style” de mot de passe qu’un réseau d’un médecin (et je pense que
    tu es d’accord avec moi sur ce point).


    Donc, veille à récolter le maximum d’informations sur ta cible. C’est d’ailleurs
    une étape cruciale pour la réussite de tout test d’intrusion que tu entamas.


    Par exemple : j’ai imaginé que l’admin du réseau “Pentest-Lab” est un fan de Manchester,
    car il porte souvent des t-shirts de cette équipe et parce qu’il parle beaucoup
    des joueurs sur les réseaux sociaux. Je m’assure donc que mon dictionnaire contient
    ce genre de mots : “football”, “Manchester united”, “Diogo”... etc., bref, un
    jargon approprié.


    Voilà, je pense que tu as compris ce que je veux dire. La quête d’un dictionnaire
    robuste n’est pas compliquée : une petite recherche sur Google et tu tomberas
    sur un dictionnaire qui contient 1,5 BILLION de mots.


    Note : si tu as une idée précise sur les caractères du mot de passe, tu peux utiliser
    `crunch` pour créer tes propres dictionnaires


    Let’s go ! En se basant sur le dictionnaire, `aircrack-ng` va essayer les différentes
    combinaisons de mots de passe dans le but de cracker la clé. Voici la commande
    à utiliser :


    ![wpa_airckrack](Images/image-8C85EWN8.png)


    Et si tu es assez chanceux (oui, il faut l’accepter) tu auras une belle vue comme
    celle-ci :


    ![WPA_CRACKED](Images/image-YNC9IRMX.png)


    Note : les attaques de brute force sont coûteuses en termes de temps et de ressources.
    Tu peux réduire le temps de l’attaque en augmentant la puissance du CPU effectuant
    les calculs ou en précalculant le PMK.


    ## Comment se défendre ?


    ❖ Utiliser des mots de passe complexes


    ## ‘THERE IS NO PERFECT SECURITY, AND MAKING PERFECTION YOUR GOAL RESULTS IN A
    BRITTLE SECURITY STRATEGY’


    Dan Cornell


    ## Chapitre 8


    ![image](Images/image-4RML5381.png)


    ## ATTAQUER LE COTÉ CLIENT


    ### Attaque honeypot


    Quand tu allumeras ton laptop, il va automatiquement rechercher les réseaux avec
    lesquels il a déjà été connecté.


    Sous Windows, ces réseaux sont stockés dans une liste appelée “PNL” (Preffered
    network list). De cette façon, dès’il reconnaît un réseau (ou plusieurs) il va
    se connecter avec celui qui dispose du signal le fort. En exploitant ce mécanisme,
    nous pouvons créer un faux point d’accès avec le même ESSID que le client est
    en train de rechercher, poussant le client à se connecter pensant que c’est le
    réseau légitime. Ce type d’attaque est communément appelé “attaque Honeypot” (piège).


    Let’s see how to do it ! Tout d’abord, je vais déconnecter mon smartphone du réseau
    “Pentest-Lab”, puis m’assurer avec la commande suivante, qu’il n’y est plus :


    ```

    root@kali:~# airodump-ng --bssid <AP MAC> --channel <numero du canal> wlan0

    ```

    (airodump-image)


    Comme tu peux le constater, aucun dispositif n’est associé au point d’accès “Pentest-Lab”.
    L’étape suivante est de créer le faux point d’accès avec l’utilitaire `airbase-ng`
    avec un ESSID “Pentest-Lab” :


    ```

    root@kali:~# airbase-ng -c 3 -e “Pentest-Lab” wlan0

    ```


    Quelques secondes plus tard, le smartphone est automatiquement associé au faux
    point d’accès (sans avoir d’adresse IP). Parfait. Maintenant, que ferais-tu le
    cas où le client est déjà associé au point’accès ? Tu l’as deviné, n’est-pas ?
    En effet, tu vas le désauthentifier avec `aireplay-ng`.


    Voyons un exemple. Arrête le faux point d’accès et connecte ta machine au point
    d’accès légitime. Une fois fait, recrée le faux point d’accès avec la commande
    précédente et attends un moment : rien ne passe ! Pourtant le signal du faux point
    d’accès est plus fort que celui du vrai point d’accès. Effectivement, car le client
    a établi la connexion avec son point d’accès, si tu souhaites détourner ce mécanisme
    tu n’as qu’à le désauthentifier. Voici la commande que je vais utiliser pour envoyer
    une boucle infinie de messages de désauthentification, laissant au client aucune
    chance de reconnexion :


    ```

    root@kali:~# aireplay-ng --deauth 0 -a <AP MAC> --ignore-none wlan0

    ```


    Et voilà ! Nous avons pu forcer le client à se connecter à notre faux point d’accès.
    Note : le client n’aura pas d’adresse IP tant que notre DHCP et le pare-feu ne
    sont pas configurés.


    ### Attaque de l’homme du milieu (MITM)


    L’attaque de l’homme du milieu est l’une des attaques les plus répandues et les
    plus puissantes sur les réseaux WLAN. Cette attaque peut prendre plusieurs formes.
    Nous allons cependant voir ensemble la forme la plus commune :


    Le hacker est connecté à Internet à l’aide d’un réseau local filaire. En utilisant
    son adaptateur externe, il va créer un faux point d’accès (Rogue Access point),
    puis relier les deux interfaces (filaire et non filaire). Le faux point d’accès
    diffuse un SSID identique à celui auquel la victime sera connectée (ou déjà connectée).
    Voyons comment nous pouvons effectuer cette attaque dans notre propre lab.


    Optimisons un peu l’attaque de la partie précédente en ajoutant une configuration
    qui permet au client d’obtenir une adresse IP et de pouvoir se connecter à Internet
    le plus normalement possible. Crée un faux point d’accès avec le même ESSID que
    celle de ta cible :


    ```

    root@kali:~# airbase-ng -e “Pentest-Lab” -c 10 wlan0

    ```


    Comme tu peux le voir, `airbase-ng` a créé une interface virtuelle `at0`. C’est
    en quelque sorte l’interface filaire de notre point d’accès créé par `airbase-ng`.
    Pour que le client puisse connecter à Internet, il va devoir passer par le routeur,
    autrement dit, il me faut (en tant que hacker) relier l’interface `at0` créée
    par `airbase-ng` avec l’interface filaire de mon routeur. C’est tout simplement
    un pont de trafic. La première chose à faire est de brancher le câble RJ45 à ton
    routeur, car l’on ne peut ponter deux interfaces sans fil. C’est, en revanche,
    faisable avec une interface filaire et une non-filaire. Voici la succession de
    commandes pour appliquer ce concept de pontage :


    ```

    root@kali:~# apt-get install bridge-utils

    root@kali:~# brctl addbr Pentest-bridge

    root@kali:~# brctl addif Pentest-bridge enp0s10

    root@kali:~# brctl addif Pentest-bridge at0

    root@kali:~# ifconfig enp0s10 0.0.0.0 up

    root@kali:~# ifconfig at0 0.0.0.0 up

    ```

