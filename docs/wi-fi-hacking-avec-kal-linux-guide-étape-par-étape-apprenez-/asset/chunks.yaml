    Comme tu peux le voir, la connexion s’est bien établie.


    Le petit échauffement pour te préparer aux chapitres qui vont suivre est terminé.


    Nous allons maintenant entamer les choses sérieuses : comprendre le fonctionnement
    du réseau dans le but de révéler ses vulnérabilités et les exploiter.


    Now, let’s the hack begin !


    #### ‘IN ORDER TO KEEP UP


    #### AND BE RELEVANT, YOU


    #### HAVE TO WORK HARD’


    Ming Chow


    ### Chapitre 5


    ![image](Images/image-4RML5381.png)


    ### Anatomie du réseau : wireshark


    Nous venons de désactiver le cryptage de notre point d’accès, ce qui fait que
    toutes les communications entre les utilisateurs et le routeur ne seront pas cryptées.
    N’importe quel hacker (ou pirate) peut sniffer le réseau et avoir les informations
    échangées entre le routeur et les clients avec la carte réseau adequate.


    #### Wireshark, kesako ?


    Wireshark est un analyseur de paquets libre et gratuit qui nous permet de lire
    et d’enregistrer les paquets circulant dans un réseau donné. Il est principalement
    utilisé dans le dépannage de réseaux et le développement de protocoles.


    Cependant, ce qui nous intéresse en tant que hackers, c’est de sniffer le réseau
    pour récolter le plus d’informations.


    Note aussi que tu peux accomplir le même objectif en utilisant d’autres outils
    tels que `tcpdump` ou encore `tashark`. Néanmois, sache que `wireshark` est le
    plus populaire des analyseurs de paquets.


    #### Le mode moniteur


    La première chose à faire avant d’entamer notre attaque, c’est de créer une interface
    en mode moniteur. Ce mode va nous permettre de capturer et lire tous les paquets
    dans notre champ aérien. L’on appelle plus communément ce mode “le mode promiscous".


    Pour mettre notre carte dans le mode moniteur, nous aurons besoin de l’utilitaire
    `airmon-ng`. Exécute la commande `airmon-ng` pour vérifier que la carte est toujours
    disponible :


    ![airmon-ng](Images/image-B9UE42WK.png)


    Ensuite, pour commuter vers le mode moniteur, entre la commande `airmon-ng start
    “interface"`. Cela va faire en sorte que le mode change en mode moniteur et que
    le nom de l’interface change également :


    ![wlanmon0](Images/image-J8TCTNWE.png)


    Comme tu le vois dans la capture ci-dessus, le nom de la carte s’est transformé
    en `wlan0mon`. Tu peux confirmer avec la commande `iwconfig` :


    ![iwconfig_monitor](Images/image-62RMOVUV.png)


    Bien. Nous sommes maintenant prêts à balayer l’air (haha !).


    Note : Dans le cas où tu as un adaptateur autre que `alfa awus036h`, exécute la
    commande suivante afin de t’assurer qu’il supporte l’injection de paquets :


    ![image](Images/image-LCZX4EAH.png)


    ```

    root@kali:~# aireplay-ng -9 “interface-monitor”

    ```


    ![image](Images/image-W7O0E9VR.png)![injection](Images/image-KUSTH7RS.png)


    Il arrive que certains processus empêchent de mettre la carte réseau en mode moniteur.
    Dans ce cas present, tu dois TUER ces processus avec la commande suivante :


    ![image](Images/image-NUSAJRR4.png)


    ```

    root@kali:~# airmong-ng check kill

    ```


    ![image](Images/image-I3A7R2Q6.png)


    Pour réactiver ces processus, il suffit d’exécuter ces commandes :


    ![image](Images/image-QHYJP407.png)


    ```

    root@kali:~# service networking restart

    root@kali:~# service network-manager restart

    ```


    ![image](Images/image-QZGH1N6D.png)


    #### Sniffer le réseau


    Lance `wireshark` en entrant `wireshark` dans le terminal :


    ![wireshark](Images/image-2MM9A2KN.png)


    Note : `wireshark` met par défaut les interfaces réseaux en mode promiscous.


    Une fois `wireshark` lancé, double-clique sur le nom de ton interface pour commencer
    la capture. Tu verras un tas d’informations défiler sur ton écran comme suit :


    ![wireshark-sniff](Images/image-U9OZAII5.png)


    Tous ces paquets sont des informations qui circulent en permanence autour de nous.
    Notre carte peut les capturer et les présenter sous une forme lisible.


    L’interface de `wireshark` est assez intuitive. En effet, le champ des résultats,
    tu peux voir que l’on dispose de la source du paquet ainsi que sa destination,
    le protocole utilisé dans la communication ainsi que d’autres informations.


    Au-dessus, des détails plus avancés sont fournis par `wireshark` concernant chaque
    paquet capture. Ce sont des informations détaillées sur les frames et le modèle
    OSI de façon générale.


    Prête attention aux paquets en bleu. Ce sont des paquets non chiffrés et c’est
    la raison pour laquelle nous voyons leurs contenus en clair (ce qui n’est pas
    normal d’ailleurs).


    Le grand danger se manifeste quand l’utilisateur visite des sites web qui n’utilisent
    pas le cryptage SSL. Autrement dit, des sites qui ne sont pas HTTPS, ce qui implique
    que toutes les communications se passent (même les informations confidentielles).


    Voici un exemple : connecte-toi à ton point d’accès “Pentest-Lab”, puis lance
    `wireshark` et accede à l’interface.

    '
