    ## 7. ugetty


    ### 7.1 Setting up ugetty


    Make sure that you have an outgoing and incoming device for the serial port your
    modem is on. If you have your modem on ttyS3 you need the /dev/cua3, and /dev/ttyS3
    devices. If you don''t have the correct devices see section Creating Devices In
    /dev on how to create devices, and create the devices. If you want to be able
    to dial out with your modem ugetty is watching the port for logins, use the /dev/cuaN
    device instead of the /dev/ttyN device [One wouldn''t need cua if the software
    was written to avoid it.]


    ugetty does important lock file checking. Update /etc/getdefs to include an entry
    for your modem. When you are done editing /etc/getdefs you can verify that the
    syntax is correct by watching the port doing:


    ```

    linux# -c /etc/getdefs

    ```


    ## Modern Modems


    If you have a 9600 bps or faster modem with data compression, you can lock your
    serial port to one speed. For example:


    ```

    # 115200 fixed speed

    F115200# B115200 CS8 # B115200 SANE -ISTRIP HUPCL ##S OL @L@B login:

    #F115200

    ```


    If you have your modem set up to RTS/CTS hardware flow control, you can add CRTSCTS
    to the entries:


    ```

    # 115200 fixed speed with hardware flow control

    F115200# B115200 CS8 CRTSCTS # B115200 SANE -ISTRIP HUPCL CRTSCTS ##S @L@B login:#F115200

    ```


    ## Old slow modems


    If you have a slow modem (under 9600 bps) Then, instead of one line for a single
    speed, you need several lines to try a number of speeds. Note the lines lines
    are linked to each other by the last “word” in the line such as #38400. Blank
    lines are needed between each entry.


    ## The Linux Serial HOWTO


    ```

    # Modem entries

    115200# B115200 CS8 # B115200 SANE -ISTRIP HUPCL @@S @L @B login: #57600

    57600# B57600 CS8 # B57600 SANE -ISTRIP HUPCL @@S @L @B login: #38400

    38400# B38400 CS8 # B38400 SANE -ISTRIP HUPCL @@S @L @B login: #19200

    19200# B19200 CS8 # B19200 SANE -ISTRIP HUPCL @@S @L @B login: #9600

    9600# B9600 CS8 # B9600 SANE -ISTRIP HUPCL @@S @L @B login: #2400

    2400# B2400 CS8 # B2400 SANE -ISTRIP HUPCL @@S @L @B login: #115200

    ```


    ## Login Banner


    If you want, you can make uugetty print interesting things in the login banner.
    In my examples, I have the system name, the serial line, and the current bps rate.
    You can add other things:


    ```

    @B The current (evaluated at the time the @B is) bps rate.

    @D The current date, in MM/DD/YY.

    @L The serial line to which uugetty is attached.

    @S The system name.

    @T The current time, in HH:MM:SS (24-hour).

