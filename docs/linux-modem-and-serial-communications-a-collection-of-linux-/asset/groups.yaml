  - '[PAGE 55]


    # Linux Modem and Serial Communications


    # About getty_ps


    getty_ps contains two programs: getty is used for console and terminal devices,
    and uugetty for modems. Greg Hanks (former author of Serial-HOWTO) wrote uugetty
    so his writings about it are included here. See Uugetty. The other gettyys are
    well covered by the documentation that comes with them.


    # About getty and metingetty


    getty is the third variation of getty. It''s a simple, completely functional implementation
    of getty which is best suited for virtual consoles or terminals rather than modems.
    But it works fine with modems under favorable conditions.


    mingetty is a small getty that will work only for consoles (monitors). While the
    previous 3 variations of getty will work for both real terminals and dial-in modems,
    metingetty will not do this.


    # 6.2 What is seterial?


    # Introduction


    seterial is a program which allows you to tell the device driver software the
    I/O address of the serial port, IRQ is set in the port''s hardware, we. With appropriate
    options, it can also probe (at a given I/O address) for a serial port but you
    must guess the I/O address (or it may use whatever address the driver thinks /dev/ttyS
    is). Seterial does not set IRQ''s nor I/O address in the serial port hardware
    itself. You must tell seterial the identical values that have been set in the
    hardware. It''s set in the hardware either by jumpers or plug-and-play. Do not
    just insert values that you think would be nice to use. However, if you know the
    I/O address but not command seterial to attempt to determine it.


    You can see a list of possible commands to use (but not the one-letter options
    as -v for verbose—which you should normally use when troubleshooting) by typing
    seterial with no arguments. Note seterial calls an I/O address a "port". If the
    argument seterial is for example /dev/tty1, then you''ll see some info about how
    device driver is configured for that port. But this doesn''t tell you if the hardware
    actually has the values set in. If fact, you can run seterial and a purely fictitious
    I/O address, any IRQ, and whatever uart type you would like to have. Then the
    next time you type "seterial..." it will display these bogus values without complaint.
    Note that assignments made by seterial are lost when the PC is powered down so
    it is usually automatically each time that Linux is booted.'
  - '[PAGE 56]


    # Probing


    In order to find out if you have a certain piece of serial hardware must first
    know its I/O address (the device driver may have for it, likely previously set
    by seterial). To try to detect the physical hardware use the -v (verbose) and
    autoconfig command to seterial. If the resulting message shows a uart type such
    as 1650A, you''re OK. If it stands “unknown” for the uart type, then there is
    no serial port at all at that I/O address. Some cheap serial ports don''t identify
    themselves correctly so you see “unknown” you might still have something there.
    The file in which “seterial” is run at boot-time. Auto-probing for uart type,
    seterial auto-probe for ttyS- doesn''t work right either.


    # Boot-time Configuration


    There is usually a file somewhere that runs at boot-time. If it''s not run at
    boot-time then your Linux system will automatically configure only ttyS{0-3} using
    the default IRQs of 4 and 3 (with the IRQ conflicts). In 1998 it (temporarily)
    changed to only ttyS{0-1}. If you have more than 2 serial ports, or want to control
    over how the ports are configured should use seterial. In fact, your distribution
    may have set things so that the seterial program runs automatically at boot-time.


    The file that runs at boot-time is likely somewhere in the /etc-directory. You
    might use “locate” to find a file named: rc.serial, or seterial (Debian), This
    supplied file which runs at start-up may contain a number of commented-out examples.
    By uncommenting some of these and/ modifying them, you may be able to set things
    correctly or run some tests. You could copy a few of them to another file and
    execute it as a shell script but don''t forget to also copy any definitions needed
    as SETERIAL=/bin/serial.


    If you use seterial it will execute on the command line first, and when you run
    it at boot-time: /etc/rc.d/rc.serial or /etc/rc.boot/setserial that it is run
    at startup. If those files do not exist /etc/rc.d/rc.local (some reported that
    with one kernel, rc.local was executed too after the serial port had already been
    opened). Or you could just edit one of the above files and cross your fingers.
    Make sure that you are using a valid path for seterial, and a valid device name.


    # IRQs


    By default, both ttyS0 and ttyS2 share IRQ 4, while ttyS0 and ttyS3 share IRQ
    3. But sharing serial interrupts is not permitted unless you have kernel 2.2 or
    better. If you don''t have this modern kernel'
  - '[PAGE 57]


    # 34 Linux Modem and Serial Communications


    but only have two serial ports ttyS0 and tty1 you''re still OK IRQ sharing conflicts
    don''t exist for non-existent devices.


    If you do have more than 2 serial ports, then for kernels < 2.2 sharing may be
    dangerous if the two devices with IRQ are being used at the same time. If you
    add an internal modem and retain ttyS0 and tty1, then you should attempt to find
    an unused IRQ and set it both on your modem card (or serial port) and then use
    serial to assign it to your device driver. If IRQ 5 is not being used for a sound
    card, this may be one you can use for a modem. To set the IRQ in hardware you
    may need to use isapp, a PnP BIOS (See Using PnP BIOS to 10-IRQ Configure) or
    patch Linux to make it PnP. To help you determine which spare IRQ''s you might
    have, type “man setserial” and search for:IRQ 11”.


    # 6.3 What is isapnp?


    isapnp is a program to configure Plug-and-Play (PnP) devices on the ISA bus including
    internal modems. It comes in a package called “isapnptools” and includes another
    program, “pnpdump” which finds all your ISA PnP devices and shows you options
    for configuring them in a format which may be added to the PnP configuration file:/etc/isapnp.conf.
    The isapnp command may be put into a startup file so that it runs each time you
    start the computer and thus configure ISA PnP devices. It is able to do this if
    your BIOS doesn''t support PnP. Plug-and-Play-HOWTO.


    # 7. Trying Out Your Modem (Dialing Out)


    # 7.1 Are You Ready to Dial Out?


    Once you''ve plugged in your modem and know which serial port it''s on you''re
    ready to try using it. Before you try to get the Internet on or have people call
    in to, try something simpler like dialing out to some number to see if your modem
    is working OK. Find a phone number that is connected to a modem. You don''t know
    what to call, ask at computer stores for such phone numbers of bulletin boards,
    etc. or see if a local library has a number for their on-line catalog.


    Then make sure you are ready to phone. Do know what serial port (such as tty2)
    your modem is on? You should have found out when you io-irq configured your serial
    ports. Have decided what speed you are going to use for this port? See Speed Table
    for a quick selection or What Speed I Should Use for more details. If you have
    no idea what speed to set, just set it a few times faster than the advertised
    speed of your modem. Also remember that if you see a menu where an option is “hard-flow
    control” and/or “RTS/CTS” or the like, select it. It is a live telephone cable
    plugged in to'
  - '[PAGE 58]


    Your modem? You may want to connect the cable to a real telephone to make sure
    that it can produce a dial tone.


    Now you need to select a communication (dialing) program to use dial out. Dialing
    programs include: minicom, seyon (X-windows), and kerm. See section Communications
    Programs about some communications programs. Two examples are presented: Dialing
    Out with Minicom and Dialing Out with Kermit


    # 7.2 Dialing Out with Minicom


    Minicom comes with most Linux distributions. To configure it you should be the
    root user. Type “minicom -s” this will take you directly to the configuration
    (set-up) menus. Alternatively you could just run “minicom” and then type ^A to
    the bottom status line. This shows to type ^A Z for (you''ve already typed ^A
    so just type z). From the help menu go to the Configuration menu.


    Most of the options don''t need to be set for your dialing out. To configure you
    have to supply a few basics: the name of the serial port your dialing is on as
    /dev/ttyS2 and the speed such as 115200. These are set at the serial port menu.
    Go to it and set them. Also (if possible) set hardware flow control (RTS/CTS).
    Then save. When typing in the speed, you should also see something like “8N1”
    which you should leave alone. It means 8-bit bytes, No parity, 1 stop-bit appended
    to each byte. If you can''t find the speed you want, a lower speed will always
    work for a test. Exit (hit return) when done and save the configuration as default
    (dfl) using the modem. You may want to exit minicom and start again it can now
    find the serial port and initialize the modem, or you could go to help and tell
    minicom to initialize the modem.


    Now you are ready to dial. But first at the main screen you get after you first
    type “minicom” make there''s a modem by typing ^A and then hit the “enter/return”
    key. It should display OK. If it doesn''t something is wrong and there is no point
    of trying to dial.


    If you get the “OK” go back to help and select the dialing directory. You may
    edit it and type in a phone number, etc. into the directory and then select “dial”
    to dial it. Alternatively, you may just dial manually (by selecting “manual” and
    then type the number at the keyboard). If it doesn''t work, carefully note any
    error messages and try to figure out what went wrong.'
