    \ upgrade them. See section What Are UARTS? about UARTS.\n\n#  14.8 On Startup,\
    \ Linux Doesn't Report The Serial Devices The Way I Have Them Configured\n\nThis\
    \ is done, partly true. Linux does not do any IRQ detection on startup, it only\
    \ does serial device detection. Thus, disregard what it says about the IRQ, because\
    \ it's just assuming the standard IRQs. This is done, IRQ detection is unreliable,\
    \ and can be fooled. When serserial changes the IRQs, you should see this on the\
    \ startup screen.\n\nSo, even though I have tty2 set at IRQ 5, I still see\n\n\
    ```\nJan 23 22:25:28 misfits vunix: tty02 at 0x03e8 (irq = 4) is a 16550A\nat\
    \ first when Linux boots. You have to use serial to tell Linux the IRQ you are\
    \ using.\n```\n\n# 14.9 rz And/or sz Don't Work When I Call My Linux Box On A\
    \ Modem\n\nIf Linux looks for /dev/modem when you try to transfer files, look\
    \ at /etc/profile or\n/etc/csh.csh. There may be a bunch of aliases defined there\
    \ on some distributions, most notably Slackware. These aliases use the zmod programs.\
    \ Take them out, or correct them.\n\n# 14.10 My Screen Is Displaying Funny Looking\
