    \ except that when you try to use it, it will return a \"device-busy\" error.\
    \ Check the interrupts on all of your boards (serial, ethernet, SCSI, etc.). Look\
    \ for IRQ conflicts.\n\n## 12.8 I Keep Getting Getty respawning too fast: disabled\
    \ for some minutes\n\nMake sure your modem is configured correctly. Look at registers.\
    \ This can occur when your modem is chatting with getty. Make sure you are calling\
