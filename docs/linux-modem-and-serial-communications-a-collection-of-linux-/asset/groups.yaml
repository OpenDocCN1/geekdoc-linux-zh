    \n一旦你下载了驱动文件，你需要运行它们并禁用网卡的 PNP 模式。\n\n你所做的操作会使你的以太网卡在 Windows 95 中显示“损坏”。你需要进入控制面板、网络，并移除网卡和适配器。重启电脑，然后回到控制面板。进入“添加/删除硬件”，并让其自动检测。它会自动为你设置好正确的\
