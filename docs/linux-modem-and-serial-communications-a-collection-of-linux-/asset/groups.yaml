    for Akron, Ohio and http://people.qualcomm.com/karn/rr/index.html for San Diego,
    California. It might help solve your problem.


    Information about RoadRunner Service can be found at http://www.rr.com.


    # 3.4 Rogers Wave


    The hardware setup consists of a cable modem produced by LanCity which plugs into
    an ethernet card using a 10BaseT (UTP-45) cable.


    When the cable modem is installed by Rogers Wave technicians you are assigned
    a static IP address. They should also provide you with information on your subnet
    mask, router (gateway) numbers and DNS numbers. For additional information please
    visit http://home.on.rogers.wave.ca/mreid/rogwave/index.html.


    Other information about Rogers Wave Service can be found at http://www.rogerswave.ca.'
  - '[PAGE 151]


    128 Linux Modem and Serial Communications


    # 3.5 Sunflower Cablevision


    This information is provided by Andrew Novik:


    “I recently saw your cable howto and I have an addition. Sunflower Cable is a
    company strictly in Lawrence KS, however we have a rather large Linux community
    because of the University of Kansas. On our local LUG mailing list, we are starting
    to get more and more questions on how to configure your linux machine for the
    cable modem. It is just regular static addressing, and the modem is made by Zenith.”


    To configure your Linux box make sure you get all the pertinent information from
    the Cablevision tech support or use these.


    +   * IP address: Assigned by Sunflower Cablevision

    * Subnet mask: 255.255.255.00

    * Gateway (router) address: 24.124.11.254

    * Hostname: Assigned by Sunflower Cablevision

    * Domain name: lawrence.ks.us

    * Primary DNS server (nameserver): 24.124.0.1

    * Secondary DNS server (nameserver): 24.124.0.52


    Have all those numbers written down before you proceed. To register visit http://www.sunflower.com


    To register in the lawrence.ks.us domain contact Stephen Spencer at gladiatr@artorius.sunflower.com


    Under RedHat use Control Panel and Network Configuration to put in these numbers.
    Just say Add Interface, Device type=Ethernet, Device name=eth0 (this is zero not
    O in eth0) then fill out all the fields. Then click activate.


    In Slackware type netconfig. When you are finished reboot and you should be up
    and running.


    If this doesn''t work make sure you do network card troubleshooting from the beginning
    of this document.'
  - '[PAGE 152]


    # 3.6 Jones Intercable


    This information is provided by Bob Kimble:


    Jones Internet Cable supplies a Hybrid cable modem that connects to your machine
    / network via T0Base Ethernet. They provide you with a static IP address for your
    machine, and another static IP address for the modem. The modem acts as a gateway
    to their network. Your IP address and the modem IP address are on the same network
    and have the same network mask (in my case 255.255.255.250—24 bits). They also
    provide two DNS IP addresses which you enter into your configuration. I just entered
    the numbers when I installed Red Hat Linux 5 and it worked like a champ from the
    beginning. Since then I have configured my Linux machine to enable IP masquerading
    and domain name services, and it now acts as a router for my entire private network.
    My other machines are connected via a private network using the addresses 192.168.0.x.
    They are running Windows 95, Windows NT (Intel and Alpha) and OS/2. Linux machine
    has two IP addresses—the one from the cable company and one from the 192.168.0.x
    private network. Everything works like a champ. All six machines can browse the
    web simultaneously. My kids are even able to connect to their favorite game site,
    “The Realm” from Sierra.


    # 3.7 GTE Worldwind


    This information is provided by Mike Hughes:


    The information you provided for Rogers Wave works for GTE WorldWind cable modem
    services also. However, GTE’s service is EXTREMELY slow, barely faster than ISDN.
    More information at


    http://www.psilord.com


    # 3.8 SpeedChoice, Phoenix, Arizona


    According to Micah peenchenee@asu.edu:


    I just wanted to let you know in my area (Phoenix, AZ, usa) there is a company
    called speedchoice that provides cable modem service. The service uses a hybrid
    cable modem and the set up is almost identical to that of Jones intercable described
    in the howto. See Jones Cable. For any other issues mail Micah.'
  - '[PAGE 153]


    # 3.9 Cedar Falls Cybernet, Iowa


    This information is provided thanks to Joe Breu breu@cfu


    We are an ISP in Cedar Falls, Iowa that uses the Zenith HomeWorks Universal over
    our own Hybrid Fiber/Coax system. Our system uses no proprietary connection software
    and is straight TCP/IP connections. We do use DHCP, but will offer static IP addresses
    to customers requesting them because they cannot use DHCP.


    # 3.10 Telstra Bigpond Cable, Australia


    This information is provided by Geoff Conway gconway@vic.bigpond.net.au


    Disclaimer:


    The information contained herein is in no way the responsibility of Big Pond Cable,
    Telstra Multimedia, Telstra, IBM Global Services Australia or any related company.
    Any loss or consequence damage associated with the attempted installation of the
    Big Pond Cable Linux software is the PERSONAL responsibility of whomsoever follows
    these instructions.


    Big Pond Cable does not currently support Linux—so do not report faults to them
    regarding any aspect of the Linux installation and/or operation.


    # Big Pond Cable Linux Installation Notes. V 1.1 (12/03/98)


    Change Note 1.1 12/3/98—Corrected spelling of dhcpcd & rdhcpcd


    Linux is not officially supported by Big Pond Cable. However, the TMM cable infrastructure
    does allow Linux to be used—with the appropriate logic client. The following installation
    notes should allow you to install the Linux software without too many difficulties.


    The full client distribution of rclientd obtained from:


    ftp://ftp.vortex.net/pub/rlinux/rclientd-1.3.tar.gz


    I am running RedHat version 5 of Linux—but the documentation indicates that it
    will work with other releases.


    Note that there is more information in the rclientd release than is documented
    here.'
- md: "\nProcedure:\n\n- Copy the distribution file rrclientd-1.3.tar.gz to your Linux\
    \ PC.\n- Login as root for all of the following :-\n  - Expand the distribution\
    \ (with gunzip) & then untar it.\n  - In directory rrclientd-1.3/bin you will\
    \ find all the executables that you need: fetchmail (not used) kdestroy kinit\
    \ rdate rrelclientd rdhcpd rpasswd\n  - Rename /sbin/dhcpd to /sbin/dhcpd.org.\
    \ Copy & rename rdhcpd to /sbin/dhcpd\n  - Copy kdestroy,kinit,rdate,rrelclientd,rrpasswd\
    \ to /usr/local/bin\n  - Set up your ethernet card to use dhcp & restart the system.\
    \ If the dhcp configuration is ok—an IP address will be assigned—with the details\
    \ being placed in /etc/dhcp/hostinfo-eth0 & /etc/dhcp/resolv.conf\n\nYou may see\
    \ a startup warning about not finding dhcp.conf—this doesn’t seem to be.\n\n**\
    \ At this point you should be able to ping proxy-server successfully.\n\n(If you\
    \ can’t then you won’t be able to login later)\n\n- Copy the krb5.ini file (from\
    \ your Win95 etmanag directory) to /etc/krb5.conf\n\nYou will need to make the\
    \ following changes (adding 2 new sections)\n\nThe example shown is for the Melbourne\
    \ krb5.ini file - Sydney users will need to substitute appropriately.\n\nThis\
    \ is also documented in the distribution’s examples/ sub-directories.\n\n```\n\
    [libdefaults]\nticket_lifetime = 600\ndefault_realm = c3.telstra-mm.net.au\n```\n\
    \n```\n** new *\nkdc_req_checksum_type = 2\nap_req_checksum_type = 2\nsafe_req_checksum_type\
    \ = 3\nccache_type = 2\n** end of new *\n```\n\n```\n[realms]\nc3.telstra-mm.net.au\
    \ = {\n  kdc = dce-server\n  admin_server = dce-server\n  default_domain = c3.telstra-mm.net.au\n\
    }\n\nwfh.c3.telstra-mm.net.au = {\n  kdc = wfh.c3.telstra-mm.net.au\n  admin_server\
    \ = wfh.c3.telstra-mm.net.au\n  default_domain = c3.telstra-mm.net.au\n}\n\nwfh1.c3.telstra-mm.net.au\
    \ = {\n  kdc = wfh1.c3.telstra-mm.net.au\n  admin_server = wfh1.c3.telstra-mm.net.au\n\
    \  default_domain = c3.telstra-mm.net.au\n}\n\nwfh2.c3.telstra-mm.net.au = {\n\
    \  kdc = wfh2.c3.telstra-mm.net.au\n  admin_server = wfh2.c3.telstra-mm.net.au\n\
    \  default_domain = c3.telstra-mm.net.au\n}\n\nwfh3.c3.telstra-mm.net.au = {\n\
    \  kdc = wfh3.c3.telstra-mm.net.au\n  admin_server = wfh3.c3.telstra-mm.net.au\n\
    \  default_domain = c3.telstra-mm.net.au\n}\n\nwfh4.c3.telstra-mm.net.au = {\n\
    \  kdc = wfh4.c3.telstra-mm.net.au\n  admin_server = wfh4.c3.telstra-mm.net.au\n\
    \  default_domain = c3.telstra-mm.net.au\n}\n\nwfh5.c3.telstra-mm.net.au = {\n\
    \  kdc = wfh5.c3.telstra-mm.net.au\n  admin_server = wfh5.c3.telstra-mm.net.au\n\
    \  default_domain = c3.telstra-mm.net.au\n}\n)\n```\n\n```\n** new *2\n[domain_realm]\n\
    nc3.telstra-mm.net.au = c3.telstra-mm.net.au\n** end *2\n```\n\n- Save your existing\
    \ services from /etc/services to /etc/services.orig\n- Copy the services file\
    \ from examples/Nassau/services to /etc/services\n- Create a new file /etc/rrpasswd—with\
    \ the contents being your current BPC password\n- Change the PATH environment\
    \ variable as follows\n\n  PATH=$PATH:/usr/local/bin ; export PATH (This is most\
    \ likely not necessary)\n\n- Login to BPC as follows\n  rrclientd -u <username>\
    \ /etc/rrpasswd dce-server\n  so if you're username jsmith\n  rrclientd -u jsmith\
    \ /etc/rrpasswd dce-server\n\nIf this is successful you'll see a message in /var/log/messages\
    \ indicating it was ok.\ntail /var/log/messages will display the end of the file.\n\
    \n- Logout of BPC by entering rrclientd -k\n- To make this automatic—you'll need\
    \ to set the PATH & invoke rrclientd each time the system boots.\n- The rrpasswd\
    \ command has NOT been tried.\n- That's—setup your Linux Netscape proxies & go\
    \ for it !!\n- According to the documentation the client will logout & then login\
    \ automatically at boot. \n\n## Problems\n\nIf you don't setup the PATH properly—then\
    \ the login will fail with GSS-API complaints about non-supported checksum type.\n\
    \nIf you don't make the needed changes to krb5.conf you'll also get a similar\
    \ error.\n\nIf you are using your PC to dual/triple boot between W95/NT/Linux—the\
    \ PC's CMOS clock will be altered by Linux—giving continual Kerberos errors if\
    \ you try. Need to login using Win95 first (which will fix the CMOS clock), then\
    \ you can get in via NT. Make sure you setup your PC time correctly in Linux.\
    \ Note also that the /var/log/messages timestamps are a bit strange (possibly\
    \ referenced to GMT).\n\n## Fibertel, Buenos Aires\n\nThis information provided\
    \ by Pablo Godel My name is Pablo Godel and want to report that I'm using the\
    \ cable service of Fibertel in Buenos Aires and it works perfectly. They gave\
    \ me a static IP. The brand of the cable modem is COM and the model is Port. I\
    \ connect to the nic properly, configured in Linux and it worked perfectly. More\
    \ information about Fibertel can be found at http://www.fibertel.com\n\n## Videotron,\
    \ Canada\n\nAdditional information by Mihai Petre (mihaip@videotron.ca): I don't\
    \ have much information about Videotron except the fact that they use DHCP for\
    \ the assignment of IP addresses and other networking information. Just read the\
    \ DHCP mini-HOWTO (http://sunsite.unc.edu/LDP/HOWTO/mini/DHCP) and configure your\
    \ system appropriately. There is no other necessary configuration. Yes they are\
    \ using DHCP for the settings. They have also included dhcpd on their server at\
    \ ftp://ftp.videotron.ca/pub/linux/. Of course don't allow setup of any kind of\
    \ servers on your machine (on ports 80,21,110,25) so the thing is to use some\
    \ \"exotic\" ports. Cable-Modem mini-HOWTO Information about Videotron can be\
    \ found at http://www.videotron.ca\n\n## Teleweb, Austria\n\nAccording to Andreas\
    \ Kostyrka:\n\n- You may want to mention, that the Austrian Babel (Teleweb) ISP\
    \ works with Linux. It seems quite similar to MediaOne Express (3c59+dhcp, etc.)\n\
    - Second there are 3COM configuration utilities for Linux (But don't fool around\
    \ with them on a busy system, 3c59 may lock the bus if touched the wrong way):\
    \ http://ftp.redhat.com/pub/contrib/hurricane/SRPMS/3c59utils-1.0.src.rpm ftp://ftp.redhat.com/pub/contrib/readmes/3c59utils-1.0-README\
    \ Information about Babel can be found at http://www.teleabel.at\n\n## Tebais,\
    \ Netherlands\n\nAccording to Frodo Looenaar:\n\nTebais is yet another provider\
    \ which uses a LANCity cable modem connected to a 10BaseT ethernet card. DHCP\
    \ is used for configuration (see the DHCP mini-HOWTO at http://ssite.unc/LDP/HOWTO/mini/DHCP.html).\
    \ A step-by-step guide to install the cable modem under Linux can be found at\
    \ http://huizen.de/-frodol (in dutch), but it is really straightforward. You must\
    \ only remember that your IP-address is not visible from the Internet (it is on\
    \ the private 10.x,y.z subnet), so you can not setup a publicly accessible server.\
    \ Information about Tebais can be found at http://www.tebenet.net (in dutch only).\n\
    \n## A2000, Netherlands\n\nThis information is provided by Johan List J.A.List@speed.A2000.nl:\n\
    \nBasically the way to go is the same as Tebais. A2000 provides cable internet\
    \ access by means of a LANCity cable modem, connected to an 10BaseT ethernet card.\
    \ This also works for the net “Vortex/Boomerang” cards are done by 3COM (I've\
    \ got a 3COM Boomerang Fast Ethernetlink XL 10/100Mb TX Ethernet Adapter), providing\
    \ you compile the Vortex/Boomerang drivers. (See the Linux Ethernet-HOWTO) Setting\
    \ up access can be done with DHCP (See the DHCP-Mini-HOWTO). A Dutch guide to\
    \ setting up Internet access for A2000 is available at http://ayvk.a2000.nl/LINUX/index.html.\
    \ Contrary to Tebais, your IP-number *is* visible from the Internet, so note that\
    \ your precautions security and safety when setting up a Linux.\n\n## Shaw Cable,\
    \ Canada\n\nAccording to Peng F. Mok pmok@shaw.ca:\n\nI recently signed up for\
    \ cable modem service from Shaw here in Canada, which they have christened ‘Shaw\
    \ Wave’. They also appear to have another service called ‘Shaw@Home’ which they\
    \ are using in some locations. I thought I would just drop a line to inform you\
    \ that DHCP mini-HOWTO, (http://ssite.unc.edu/LDP/HOWTO/mini/DHCP was very useful\
    \ in helping me set up Linux with my cable-modem service, and that you might want\
    \ to add ‘Shaw Wave’ (and perhaps ‘@Home’) to your Cable-Modem-HOWTO. I do not\
    \ have specific information on the ‘Shaw@Home’ service yet, but from conversations\
    \ I've had with Shaw technical support it seems that ‘Shaw@Home’ is a partnership\
    \ with ‘Home’ which involves the features and set procedure as already described\
    \ for ‘Home’ in the Cable-Modem-HOWTO\n"
  mdcn: "\n步骤：\n\n- 将发行包文件 `rrclientd-1.3.tar.gz` 拷贝到你的 Linux PC 上。\n- 以下所有操作请以 root\
    \ 身份登录：\n  - 解压缩发行包（使用 `gunzip`）然后解压它。\n  - 在 `rrclientd-1.3/bin` 目录下，你将找到所需的所有可执行文件：`fetchmail`（未使用）`kdestroy`\
    \ `kinit` `rdate` `rrelclientd` `rdcpd` `rpasswd`\n  - 将 `/sbin/dhcpd` 重命名为 `/sbin/dhcpd.org`。复制并重命名\
    \ `rdcpd` 为 `/sbin/dhcpd`。\n  - 将 `kdestroy`、`kinit`、`rdate`、`rrelclientd`、`rrpasswd`\
    \ 拷贝到 `/usr/local/bin`。\n  - 设置你的网卡使用 dhcp 并重启系统。如果 dhcp 配置正确——将分配一个 IP 地址——详情将存放在\
    \ `/etc/dhcp/hostinfo-eth0` 和 `/etc/dhcp/resolv.conf` 中。\n\n你可能会看到关于找不到 `dhcp.conf`\
    \ 的启动警告——这似乎并不是问题。\n\n** 在此之后，你应该能够成功 ping 通 proxy-server。\n\n（如果你无法连接，稍后将无法登录）\n\
    \n- 将 `krb5.ini` 文件（来自你的 Win95 `etmanag` 目录）拷贝到 `/etc/krb5.conf`。\n\n你需要进行以下更改（添加\
    \ 2 个新段落）\n\n显示的示例是针对墨尔本 `krb5.ini` 文件的——悉尼的用户需要进行相应的替换。\n\n在发行包的 `examples/`\
    \ 子目录中也有相关记录。\n\n```\n[libdefaults]\nticket_lifetime = 600\ndefault_realm = c3.telstra-mm.net.au\n\
    ```\n\n```\n** new *\nkdc_req_checksum_type = 2\nap_req_checksum_type = 2\nsafe_req_checksum_type\
    \ = 3\nccache_type = 2\n** end of new *\n```\n\n```\n[realms]\nc3.telstra-mm.net.au\
    \ = {\n  kdc = dce-server\n  admin_server = dce-server\n  default_domain = c3.telstra-mm.net.au\n\
    }\n\nwfh.c3.telstra-mm.net.au = {\n  kdc = wfh.c3.telstra-mm.net.au\n  admin_server\
    \ = wfh.c3.telstra-mm.net.au\n  default_domain = c3.telstra-mm.net.au\n}\n\nwfh1.c3.telstra-mm.net.au\
    \ = {\n  kdc = wfh1.c3.telstra-mm.net.au\n  admin_server = wfh1.c3.telstra-mm.net.au\n\
    \  default_domain = c3.telstra-mm.net.au\n}\n\nwfh2.c3.telstra-mm.net.au = {\n\
    \  kdc = wfh2.c3.telstra-mm.net.au\n  admin_server = wfh2.c3.telstra-mm.net.au\n\
    \  default_domain = c3.telstra-mm.net.au\n}\n\nwfh3.c3.telstra-mm.net.au = {\n\
    \  kdc = wfh3.c3.telstra-mm.net.au\n  admin_server = wfh3.c3.telstra-mm.net.au\n\
    \  default_domain = c3.telstra-mm.net.au\n}\n\nwfh4.c3.telstra-mm.net.au = {\n\
    \  kdc = wfh4.c3.telstra-mm.net.au\n  admin_server = wfh4.c3.telstra-mm.net.au\n\
    \  default_domain = c3.telstra-mm.net.au\n}\n\nwfh5.c3.telstra-mm.net.au = {\n\
    \  kdc = wfh5.c3.telstra-mm.net.au\n  admin_server = wfh5.c3.telstra-mm.net.au\n\
    \  default_domain = c3.telstra-mm.net.au\n}\n)\n```\n\n```\n** new *2\n[domain_realm]\n\
    nc3.telstra-mm.net.au = c3.telstra-mm.net.au\n** end *2\n```\n\n- 将现有的服务从 `/etc/services`\
    \ 备份到 `/etc/services.orig`\n- 从 `examples/Nassau/services` 拷贝 `services` 文件到 `/etc/services`\n\
    - 创建一个新文件 `/etc/rrpasswd`——内容为你当前的 BPC 密码\n- 如下所示更改 `PATH` 环境变量\n\n  `PATH=$PATH:/usr/local/bin\
    \ ; export PATH` （这可能不是必要的）\n\n- 按照以下方式登录 BPC：\n  `rrclientd -u <username> /etc/rrpasswd\
    \ dce-server`\n  如果你的用户名是 jsmith\n  `rrclientd -u jsmith /etc/rrpasswd dce-server`\n\
    \n如果执行成功，你将在 `/var/log/messages` 中看到指示操作正常的消息。\n`tail /var/log/messages` 将显示文件的末尾。\n\
    \n- 输入 `rrclientd -k` 退出 BPC。\n- 要实现自动化——你需要设置 `PATH` 并在每次系统启动时调用 `rrclientd`。\n\
    - `rrpasswd` 命令尚未经过尝试。\n- 也就是说——设置好你的环境。\n"
