    # 9. What Speed Should I Use with My Modem?


    By “speed” we really mean the “data flow rate” but almost everybody incorrectly
    calls it speed. For all modems you have no choice of the speed that the modem
    uses on the telephone line since it will automatically choose the highest possible
    speed that is possible under your circumstances. But you do have a choice as to
    what speed will be used between your modem and your computer. It is sometimes
    called “DTE speed” where DTE stands for Data Terminal Equipment (Your computer
    is a DTE). You need to set this speed high enough so part of the signal path will
    not be a bottleneck. The setting for the DTE speed is the maximum speed of this
    link. Most of the time it will likely operate at lower speeds.


    For an external modem, DTE speed is the (in bits/sec) of the flow over the cable
    between modem and PC. For an internal modem, it’s the same idea since the modem
    also emulates a serial port. It may seem ridiculous having a speed limit on communication
    between a computer and a modem card that is directly connected inside the computer
    to a much higher speed bus. But it’s that since the modem card probably includes
    a dedicated serial port which does have speed limits (and settable speeds).


    # 9.1 Speed and Data Compression


    What speed do you choose? If it were not for “data compression” one might try
    to choose a DTE speed exactly as the modem speed. Data compression takes the bytes
    sent to the modem from your computer and encodes them into a fewer number of bytes.
    For example, if the flow (speed) from the PC to the modem was 20,000 bytes/sec
    (bps) and the compression ratio was 2 to 1, then only 10,000 bytes/sec would flow
    over the telephone line. Thus for a 2:1 compression ratio you need to set the
    speed double the maximum modem speed on the phone line. If compression ratio is
    3 to 1 you need to set it 3 times faster.


    # 9.2 Where do I Set Speed?


    DCE speed is normally set by a menu in your communications program or by an option
    given to getty command if someone is dialing in. You can''t set modem-to-modem
    speed.


    # 9.3 Can’t Set a High Speed


    You need to find the highest speed supported by your hardware. As of late 1998
    most hardware only supported speeds to 115.2K. A few 56K internal modems support
    230.4K. If you have communications programs that don''t show enough speeds in
    its menu, there are options you can give to setserial command so that a low speed
    from communication program will result in a higher speed. With these options,
    when you set the speed for 38400 the actual speed will be much higher. See the
    man page for “setserial” and search for sp_hi, sp_di, sp_cust, baud_base, and
    divisor. Note that you must set baud_base to the actual maximum speed of hardware.
    This speed is usually lower than frequency of crystal oscillator in the hardware
    where the crystal frequency is often divided by 16 to get the actual speed. To
    get a speed of 23400 (if this is what your serial port uses) on tty2 you could:


    ```

    setserial /dev/tty2 baud_base 23400 divisor 1

    ```


    In some cases this with “stty 23400” doesn’t. If you used sp_cust you’ll have
    to claim the speed is 38400 somewhere else. This method of setting speed is sort
    of a hack and when applications catch up to higher speeds it might not be needed


    # 9.4 Speed Table


    It''s best to have at least 16550 UART for 56K modem but few modems support it.
    Second best is 1550 that has been tweaked to give 230400 bps. Here are some suggested
    speeds to set your serial line if your modem speed is:


    | Speed | Suggested Setting |

    | :--- | :--- |

    | 56K (V.90) | 115200 bps or 230400 bps |

    | 28.8K (V.34), 33.6K (V.34) | 115200 bps |

    | 14400 bps (V.32bis), with V42bis data compression | 57600 bps |

    | 9600 bps (V.32), with V42bis data compression | 38400 bps |

    | slower than 9600 bps (V.32) | set speed to the highest modem ports |


    # 10. Communications Programs And Utilities


    PPP is by far the most used. It''s used for Internet access. For dialing out to
    public libraries, bulletin boards, et. minicom is the most popular followed by
    Seyon (X-Windows only) and Kermit.


    # 10.1 Minicom vs. Kermit


    Minicom is only a communications program while Kermit is both a communications
    program and a file transfer protocol. But one may use the Kermit protocol from
    Minicom (provided one has Kermit installed on one PC). Minicom is menu based while
    Kermit is command line based (interactive at the serial prompt). While the Kermit
    program is free software, the documentation is not all free. There is no detailed
    manual supplied and it is suggested that you purchase a book as the manual. However
    Kermit has interactive help which tells all but lacks tutorial explanations for
    beginner. Commands may be put in a script file so you don''t have to type them
    each time. Kermit (as a communications program) is more powerful than Minicom.


    Although all Minicom documentation is free, it''s not as extensive as Kermit''s.
    Since permission is required to include Kermit in a commercial distribution, and
    since the documentation is not entirely free, some distributions don''t include
    Kermit. In my opinion it''s easier to set up Minicom and there is less to learn.


    # 10.2 Lists of Programs


    There is a list of some communication software you can choose from, available
    via FTP, if they didn''t come with your distribution. I would like comparative
    comments on the dialout programs. Are the least popular ones obsolete?


    Least Popular Dialout:

    - ecu—a communications program

    - pcomm-procomm—like communications program with modem

    - xc—xcomm communication package


    Most Popular Dialout:

    - minicom-telix-like communications program. Supports scripts, modem, kermit

    - C-Kermit—portable, scriptable, serial and TCP/IP communications including file
    transfer, character-set translation, and modem support

    - seyon—X based communication program


    Fax:

    - efax a small fax program

    - hylafax a large fax program based on the client-server model.

    - mgetty+fax handles fax stuff and login for dial-ins


    Voicemail:

    - mvm is a Minimal VoiceMail for Linux

    - vgetty is an extension of mgetty that handles voicemail


    Modem-HOWTO (for Linux)


    # Dial-in (uses getty)


    - mgetty+fax is for modems and is well documented. It handles fax stuff and provides
    an alternative to uugetty. It incorporates callback and voicemail (using vgetty)
    features. See mgetty


    - uugetty is for modems. It comes as a part of ps_getty package. See getty_ps


    # Other


    - callback is where you dial out to remote modem then then hangs up and calls
    you back (to save on phone bills).


    - SLIRP and term provide a PPP-like service that you can run in user space on
    a remote computer. See term and SLIRP for more details


    - ZyXEL is a control program for ZyXEL U-1496 modems. It handles dialin, dialout,
    dial back, FAXING and voice mailbox functions.


    - SLIP and PPP software can be found at ftp://sunsite.unc.edu/pub/Linux/system/network/serial.


    - Other things can be found at http://sunsite.unc.edu/pub/Linux/system/serial
    and ftp://sunsite.unc.edu/pub/apps/serialcomm or one of the many mirrors. These
    are the directories where serial programs are kept.


    # SLIRP and term


    SLIRP and term are programs which are of use if you only have a dial-up shell
    account on a Unixlike machine and to get the equivalent of a PPP account (or the
    like) without being authorized to have it (possibly because you don''t pay extra
    for it, etc). SLIP is more popular than term which is almost obsolete.


    To use SLIP you install it in your shell account on the remote computer. Then
    you dial up the account and run SLIRP on the remote and PPP on your local PC.
    You now have a PPP connection over which you may run a web browser on your local
    PC such as Netscape, etc. There may be problems as SLIRP is not as good as a real
    PPP account. Some accounts may provide SLIRP since it saves on IP addresses (You
    have no IP address while using SLIRP).

