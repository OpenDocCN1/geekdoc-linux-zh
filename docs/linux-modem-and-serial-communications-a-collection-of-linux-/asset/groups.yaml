    ## 4.5 Which Internal Modems are Best to Avoid?


    - Avoid: winmodems or the like. They will NOT work at all

    - PCI Modems often don’t work under Linux

    - MWave and DSP Modems might work, but only if you first start Windows/Dos each
    time you power on your PC

    - Modems with RPI (Rockwell) drivers work with reduced performance


    ## MWave and DSP Modems


    Such modems use DSP’s (Digital Signal Processors) which are programmed by algorithms
    which must be downloaded from the hard disk to the DSP’s memory just before using
    the modem. Unfortunately, the downloading is done by Dos/Windows programs so one
    can’t do it from Linux. Ordinary modems that work with Linux often have a DSP
    too (and may mention this on the packaging), but the program that runs it is stored
    inside the modem. This is not a “DSP modem” in the sense of this section and should
    work OK Linux.


    If a DSP modem simulates a serial port, then it is usable with Linux which communicates
    modems via the serial port. If you also have Dos/Windows on the same PC you may
    be able to use the modem: First start Dos/Windows (make sure the modem gets initialized)
    and then without turning off the computer, go into Linux. One way to do this may
    be to press CTRL-ALT-DEL. An example of a DSP modem is IBM’s Aptiva MWAVE.


    ## Rockwell (RPI) Drivers


    Modems that require Rockwell RPI drivers are not fully usable since the driver
    software doesn’t work on Linux. The RPI does compression and error correction
    using MS Windows software on your computer’s CPU. If you are willing to operate
    the modem without using the RPI (and have no compression nor error correction)
    then you may easily disable RPI by sending the modem (via the initialization string)
    a command to do so each time you power on your modem. On this command we have
    +H0. Having data compression available may not be much of a handicap since most
    long files which you download from the Internet are already compressed and attempts
    at further compression may only slow down a bit.


    ## PCI Modems


    A PCI modem is one which inserts into a PCI-bus slot on the motherboard of a PC.
    Unfortunately, it seems that most PCI modems will not work under Linux. But since
    some people have gotten PCI modems to work under Linux it seems that a small minority
    of such modems work under Linux.


    After you install a PCI modem, look at /proc/pci. If you see a high main memory
    (address 0xfbff00), it works by shared memory which is not supported by Linux.
    If there is no such high memory address and the only address you see is an I/O
    address under 0xffff then it might work OK. I''m not sure of the /proc/pci signature
    to look for to determine whether or not the modem will work under Linux. If this
    request is still in the latest version of this HOWTO, please send me info on what
    /proc/pci looks like for modems that work under Linux or let me know what signatures
    to look for in /proc/pci to determine whether or not the modem will work with
    Linux.


    ## 5. Serial Port Devices: /dev/ttySN


    ### 5.1 Serial Device Names & Numbers


    Devices in Linux have major and minor numbers. Each serial port may have 4 possible
    names, only 2 of which are official and found in the /dev directory: ttyS is deprecated
    and may not be used in the future. See The cuA Device. Dos/Windows use the COM
    name or the set-program uses tty00, tty01, etc. Don''t confuse dev/tty0, dev/tty1,
    etc. which are used for the console (your PC) but are not serial ports.


    | set- | major | minor | major | minor | address |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | COM1 tty00 | /dev/ttyS0 | 4, 64 | /dev/cua0 | 5, 64 | 3F8 |

    | COM2 tty01 | /dev/ttyS1 | 4, 65 | /dev/cua1 | 5, 65 | 2F8 |

    | COM3 tty02 | /dev/ttyS2 | 4, 66 | /dev/cua2 | 5, 66 | 3E8 |

    | COM4 tty03 | /dev/ttyS3 | 4, 67 | /dev/cua3 | 5, 67 | 2E8 |


    ## Linux Modem and Serial Communications


    Note that all distributions should come with ttyS devices (and cua devices) and
    should be made correctly. You can verify this by typing:


    ```bash

    ls /dev/ttyS*

    ls /dev/cua*

    ```


    ### 5.2 Creating Devices


    In the /dev directory if you don''t have a device you will have to create it with
    mknod. For example, suppose you needed to make devices you would use:


    ```bash

    cd /dev

    mknod /dev/ttyS0 c 4 64

    ```


    ### 5.3 Link ttySN


    What''s the difference? The main difference between cua and ttyS has to do with
    what happens an ordinary "open" command. In some installations you may use:


    ```bash

    ln -s /dev/cua0 /dev/ttyS0

    ```


    ### 5.4 The cuA Device


    Each ttyS device has a corresponding cua device. It is planned to eventually abolish
    cua so it''s best to use ttyS.


    Starting with Linux kernel 2.2, a warning message will be put in the kernel log
    when one uses cua. This is an omen that cua will disappear.


    ## 6. Interesting Programs You Should Know About


    ### 6.1 What is getty?


    "getty" is a program that handles the login process when you log into a Linux
    box. You will need to use some type of "getty" if you want to be able to dial
    in your Linux PC with a modem. You do not need to use getty if you only want to
    dial out with your modem. There are three getty versions that modems may use with
    Linux: getty, getty_ps, and aget. getty is the simplest (and weakest) of the three
    and consider it mainly for text-terminals. The syntax for these programs differs,
    be sure to check that you are using the correct syntax for whatever getty you
    use. If this sentence appears in the latest version of this howto, then if you
    can write a few paragraphs comparing getty with getty_ps, etc. please submit it
    so that it can be included here. Getty is only a few years old and seems to be
    more popular for new installations than the older getty_ps.


    ### About mget


    mget is a version of getty mainly for use with modems. It may be used for hard-wired
    terminals but the documentation is about 99% related to modems. In addition to
    allowing dial logins, also provides FAX support and auto PPP detection. There
    is a supplemental program called vgetty which handles voicemail for some modems.
    mget documentation (supplied in textinfo format) is good, and does not need supplementing.
    Please refer to for installation instructions. You can find the latest information
    on mgetty at http://www.leo.org/~doering/mgetty/ and http://alpha.green.nic/mgetty

