    # Linux Modem and Serial Communications


    ```

    #

    # alternate lock file to check... if this lock file exists, then uugetty is

    # restarted so that the modem is re-initialized

    ALTLOCK=cua3

    ALTLINE=cua3

    # line to initialize

    INITLINE=cua3

    # timeout to disconnect if idle...

    TIMEOUT=60

    # modem initialization string...

    # format: <send ... (chat sequence)

    INIT="" AT\r OK\r n


    WAITFOR=RING

    CONNECT="" ATA\r CONNECT\sA

    # this line sets the time to delay before sending the login banner

    DELAY=1

    #DEBUG=010

    ```


    Add the following line to your /etc/inittab, so that uugetty is run on your serial
    port (substitut- in the correct information for your environment—config file location,
    port, speed, and default ter- m type):


    ```

    S3:456:respawn:/sbin/uugetty -d /etc/default/uugetty.ttyS3 ttyS3 F115200 vt10

    ```


    Restart init:


    ```

    linux# init q

    ```


    For the speed parameter in your /etc/inittab, you want to use the highest bps
    rate that your modem supports.


    Now Linux will be watching your serial port for connections. Dial in from another
    machine and login to you Linux system.


