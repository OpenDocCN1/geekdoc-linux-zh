    # Linux Modem and Serial Communications


    in it starts to drop. When almost no bytes are left in the buffer, the modem sends
    a start signal to the serial port and the 115.2k flow from the computer to the
    modem resumes. In effect, flow control creates an average flow rate (in this case
    33.6k) which is significantly less than the “on” flow rate of 115.2 bps. This
    is “start-stop” flow control.


