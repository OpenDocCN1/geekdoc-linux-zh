    版本来完成此工作。该网站上有一个网页解释了如何配置你的 Courier 用于租线。然而，如果你遵循这些指令，你将得到一个完全失效的调制调器，你的 pppd
    无法对其进行控制或监控。USR Courier 可以通过拨开关配置，但你首先需要向它输入配置字符串。确保它使用正确的配置文件。与其他大多数调制调器不同，它有三个：&F0、&F1
    和 &F2。默认（也是你应该使用的）是 &F1。然而，如果你向它发送 AT&F，它将加载出厂配置 &F0！


