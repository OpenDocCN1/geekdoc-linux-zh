    fine as non-PnP modems. Since you usually plug the modem into a serial port which
    has its own IRQ number and I/O address, the modem needs no PnP features to set
    these up. However, the serial port itself may need to be configured (IRQ number
    and I/O address) unless the default configuration is OK.


