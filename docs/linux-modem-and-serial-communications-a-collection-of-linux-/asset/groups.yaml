    \ http://www.columbia.edu/k/ 找到适用于所有系统的 Kermit 预编译版本。其他流行的 DOS 程序（如 telix 和 procomm）效果同样良好。请确保在终端的设置中输入正确的串口口信息。\n\
    \n## 9. 我可以使用两个以上的的串口设备吗？\n\n除非你想使用三个或更多串口设备（假设你没有多端口板卡），否则你不需要阅读这一节。\n\n只要你还有另一个串口，是的，你可以的。你使用的串口数量受限于我们必须使用的中断请求（IRQs）和端口\
    \ I/O 地址的数量。这不是 Linux 的限制，而是 PC 总线的限制。每个串口设备都必须分配其自己的中断。如果两个设备共享同一个中断，只要这两个设备不同时运行，它们可能运行得良好（在大多数情况下，这些程序不能同时运行）。串口设备可以是内部调制解调器，也可以是多端口串口卡。\n\
    \n多端口串口卡专门设计为具有多个串口，且板卡上的所有端口共享同一个 IRQ。Linux 通过为板卡上的每个端口使用不同的 I/O 地址从它们获取数据。\n\
    \n### 9.1 选择串口设备中断\n\n你的 PC 通常带有带有 IRQ 4 的 tty0 和 tty2，以及带有 IRQ 3 的 tty1 和 tty3。你可以通过输入\
    \ /dev/tty2 查看哪些 IRQ 正在使用。查看 /proc/interrupts 将显示其中一些。要使用两个以上的串口设备，你必须重新分配中断。一个很好的选择是从你的并行口重新分配中断。你的\
