    - Using isapnp for a PnP internal modem (non-PCI)

    - Letting a PnP BIOS automatically configure a PnP internal modem (but it may
    be difficult to determine just what that configuration is). See Using a PnP BIOS
    to 10-IRQ Configure

    - Using a setup program which comes with the modem (run under MS Windows) that
