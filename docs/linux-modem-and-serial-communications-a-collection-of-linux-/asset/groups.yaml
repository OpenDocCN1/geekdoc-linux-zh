    这些信息由 jedi jedi@penguin.lvcm.com 提供：


    我们使用 Com21，它可以直接连接到你的 10baseT 输入端，或插入路由器的下行输入。静态 ISA 的价格每月 10 美元，通常的地址分配通过 DHCP（http://sunsite.nc.edu/LDP/HOWTO/mini/DHCP.html）进行。


    更多信息可以从 http://penguin.lvcm.com 获取。


    ## 3.22 比利 TVD


    这些信息由 Pierre-Yves Keldermans pykeldermans@usa.net 提供：


    在家，我的电缆电视公司是“TVD”，它是比利时第一家在电缆上提供服务的的公司。


    硬件：LanCity 电缆调制器 & 10-Base-T 网卡（如果你从 TVD 购买，则是 DLink ISA）


    配置：DHCP (http://sunsite.nc.edu/LDP/HOWTO/mini/DHCP.html)


    ### 价格：


    - 便宜：家庭使用，真实 IP 地址但是动态的，DHCP 每 10 分钟过期一次，仅限 1 个用户（理论上……），防火墙没有问题，电脑上的 Web 服务器甚至可以外部访问……从互联网下载的速度快，上传互联网的速度慢。


    - 不便宜：小型办公室使用，与 1) 相同，但不限于 1 个用户，且上传互联网的速度更快。


    - 昂贵：用于 WWW 服务器……静态 IP 地址和保留的互联网带宽。


    ### 速度：


    来自 TVD 镜像站点：高达 250Kbytes/sec，非常棒（而且是的，他们有一些红帽镜像 :))）。来自互联网：如果远程服务器没有过载，速度尚可。


