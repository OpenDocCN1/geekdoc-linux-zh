    UART 本身无法对数据进行任何操作，它只是负责发送和接收。对于原始的 UART，每当发送或接收一个字节时，CPU 都会收到来自串口设备的中断。CPU 将接收到的字节从
    UART 缓冲区移到内存的某处，或者给 UART 另一个要发送的字节。8250 和 16450 UART 只有 1 字节缓冲区。这意味着每发送或接收 1 个字节，CPU
    就会被中断一次。在低比特率下，这没有问题。但在高传输速率下，CPU 忙于处理 UART，以至于没有时间兼顾其他任务。在某些情况下，CPU 无法及时处理中断，由于数据进入得太快，导致字节被覆盖。


    这正是 16550 UART 发挥用用场。。这些芯片配备了 16 字节的 FIFO（先进先出队列）。这意味着在必须中断 CPU 之前，它可以接收或传输多达
    14 个字节。它不仅可以等待，而且 CPU 也可以一次性传输 14 个字节。虽然中断阈值并不总是设置为 14，但与那些只有 1 字节缓冲器的其他 UART
    相比，这是一个显著优势。CPU 接收到的中断减少了，数据没有丢失，大家都很开心。（还有一种 1650 UART，但如果它坏了，会被视为 16450 处理。）


    通常情况下，8250 和 16450 UART 在最高 38400 bps 的速度下运行良好。在超过 38400 bps 的速率下，可能会看到数据丢失。其他
    PC 操作系统（这里的定义较松）如 DOS 并不是多任务操作的，因此它们可能更好地应对 8250 和 16450。这就是为什么某些人在切换到 Linux 之前没有看到数据丢失。


    非 UART 和智能多端口板卡使用 DSP 芯片进行额外的缓冲和控制，进一步减轻了 CPU 的负担。例如，Cycles Cyclom 和 Stallion
    EasyIO 板卡使用 Sirius Logic CD1400 RISC UART，许多板卡使用 80186 CPU 或特殊的 RISC CPU 来处理 I/O。


    请记住，这些“哑”UART 类型并不坏，它们只是不适合高速。我们连接终端或鼠标到这些 UART 应该没有问题。但对于高速调制解器，16550A 绝对是必须的。


    大多数新的 PC（486、奔腾或更高）都配备了 16550A。如果你足够好，可能可以通过使用 16550A 芯片并替换现有的 16450 UART 来升级。如果你运气不佳，功能已经被放置在另一种类型的芯片上；如果
    UART 是插座式的，那么升级就很容易（如果你能找到替代品的话）。新旧芯片在引脚上兼容兼容。直接从网上购买串口卡可能更可行（现在很少有零售商店备货了）。


    ## 14. 故障排除


    ### 14.1 我一直收到“line NNN of inittab invalid”


    确保你正在使用的语法与你的 init 版本匹配。市面上不同的 init 在 `/etc/inittab` 文件中使用不同的语法。确保你使用的语法与你的 getty
    版本匹配。


    ### 14.2 当我尝试拨号拨出时，显示“dev/cuAn: Device or resource busy”


    这个问题出现在 DCD 或 DTR 未被正确设置时。只有在存在实际连接（即已拨入）时才应设置 DCD，而不是在 getty 监控端口时。检查并确保你的调制解器配置为仅在
    getty 连接时设置 DCD。每当有程序在使用或监控线路（如 getty、kermit 或其他通信程序）时，都应该设置 DTR。


    “设备忙”错误的另一个常见原因是，你设置串口端口时，其中断已经被其他东西占用。每个设备在初始化时，都会向 Linux 请求使用其硬件中断的权限。Linux
    会跟踪哪个中断被分配给了谁，如果你的中断已被占用，你的设备将无法正常初始化。设备本身实际上并没有什么方法可以告诉你发生了这种情况，只有当你尝试使用它时，它才会返回“device-busy”错误。检查你所有板卡（串口、以太网、SCSI
    等）的中断。寻找 IRQ 冲突。


    ### 14.3 我一直收到“Getty respawning too fast: for 5 minutes”


    确保你的调制解器配置正确。查看 寄存器 E 和 Q。这可能发生在你的调制解器与 getty 聊天时。


    确保你从 `/etc/inittab` 正确地调用了 getty。使用错误的语法或设备名称会导致严重问题。


    通过以下操作验证你的 `/etc/gettydefs` 语法是否正确：


    ```

    linux# getty -c /etc/gettydefs

    ```


    这也发生在 ugetty 初始化失败时。请参见“getty Or uugetty Still Doesn''t Work”章节。


    ### 14.4 串口设备很慢，或者串口设备只能单向发送


    ### 14.5 有人挂断后我的调制解器坏了，或者 ugetty 不重新启动


    这可能发生在 DTR 掉落时调制解器没有重置时。我看到这种情况在我身上发生，RD 和 SD 指灯疯狂闪烁。你需要使用兼容 Hayes 的调制解器来做到这一点。


    ### 14.6 在连接了终端后，我的调制解器一直显示忙


    这发生在 DCD 没有正确设置时。检查你的调制解器。设置 DCD 只有在实际连接时。在 `/etc/inittab` 中，确保只有在 getty 连接时才设置
    DCD。DTR 应该在任何在使用或监控线路（如 getty、kermit 或其他通信程序）时设置。


    另一个常见的“设备忙”错误原因是，你设置串口端口时，中断已经被其他东西占用。每个设备在初始化时，都会向 Linux 请求使用其硬件中断的权限。Linux 会跟踪哪个中断被分配给了谁，如果你的中断已被占用，你的设备将无法正常初始化。设备本身实际上并没有什么方法可以告诉你发生了这种情况，只有当你尝试使用它时，它才会返回“device-busy”错误。检查你所有板卡（串口、以太网、SCSI
    等）的中断。寻找 IRQ 冲突。


    ### 14.7 高速下，串口设备丢失数据


    通常情况下，8250 和 16450 UART 在最高 38400 bps 的速度下运行良好。在超过 38400 bps 的速率下，可能会看到数据丢失。其他
    PC 操作系统（这里的定义较松）如 DOS 并不是多任务操作的，因此它们可能更好地应对 8250 和 16450。这就是为什么某些人在切换到 Linux 之前没有看到数据丢失。


    ### 14.8 启动时，我的串口设备没有报告


    确保你的调制解器配置正确。查看 寄存器 E 和 Q。这可能发生在你的调制解器与 getty 聊天时。


    确保你从 `/etc/inittab` 正确地调用了 getty。使用错误的语法或设备名称会导致严重问题。


    通过以下操作验证你的 `/etc/gettydefs` 语法是否正确：


    ```

    linux# getty -c /etc/gettydefs

    ```


    这也发生在 ugetty 初始化失败时。请参见“getty Or uugetty Still Doesn''t Work”章节。


    ### 14.9 拨入后 rz 和/or 不工作


    这发生在虚拟控制台上发送二进制数据时。解决办法是输入：


    ```

    linux$ echo

    ```


    ### 14.10 屏幕显示奇怪字符


    这发生在你向屏幕发送二进制数据时，有时在串口连接上。解决办法是输入：


    ```

    linux$ echo

    ```


    ### 14.11 uugetty 仍然无法工作


    确保你的调制解器配置正确。编辑 `/etc/conf.(uugetty.tty` 并添加 DEBUG=NNN。


    ## 100 Linux 调制解器与串口通信


    | 字段 | 值 | 描述 |

    |---|---|---|

    | D_OPT | 001 | 设置 |

    | D_DEF | 002 | 默认值处理 |

    | D_UTMP | 004 | utmp/wtmp 处理 |

    | D_INIT | 010 | 初始化 (INIT) |

    | D_GTAB | 020 | gettab 文件处理 |

    | D_RUN | 040 | 其他运行时诊断 |

    | D_RB | 100 | 回拨调试 |

    | D_LOCK | 200 | getty 锁文件处理 |

    | D_SCH | 400 | 调度处理 |

    | D_ALL | 777 | 所有 |


    设置 DEBUG=010 是一个很好的开始。


    如果你正在运行 syslogd，调试信息将出现在你的日志文件中。如果你没有运行 syslog，信息将出现在 /tmp/getty:ttyN 和 /tmp/uugetty:ttyN，以及
    /var/adm/getty.log 中。查看调试信息并查看发生了什么。你可能需要调整配置文件中的某些参数，并重新配置调制解器。


    你也可以尝试 mgetty。有些人用它运气更好。


    ## 15. 其他信息来源


    - * 以下命令的手页：agetty(8), getty(1m), gettydefs(5), init(1), login(1), mgetty(8),
    setserial(8)

    * 你的调制解器或终端手册

    * NET-3 HOWTO: 关于网络的一切，包括 SLIP、CSLIP 和 PPP

    * PPP HOWTO: 关于 PPP 的帮助

    * Printing HOWTO: 设置串口打印机

    * Serial-Programming-HOWTO: 关于串口编程的某些方面

    * Term HOWTO: 关于 term 程序你想的一切

    * Text-Terminal-HOWTO: 它们如何工作以及如何安装和配置

    * UPS HOWTO: 设置连接到串口端口的 UPS 传感器


