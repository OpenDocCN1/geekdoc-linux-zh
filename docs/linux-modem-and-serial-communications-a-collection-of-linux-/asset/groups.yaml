- md: '

    # Modem Configuration


    A note on modem configuration and init strings in general:


    Configure your modem software such as minicom or (m)getty to use the highest possible
    speed; 57600 bps for 144k and 115200 bps for faster modems.


    Lots of people use very long and complicated init strings, often starting with
    AT&F and containing lots of modem brand and -type specific commands. This however
    is needlessly complicated. Most programs feel happy with the same modem settings,
    why why not write these settings in the non-volatile memory of all your modems,
    and only use ''ATZ'' as an init string in all your programs. This way you can
    swap or upgrade your modems without ever having to reconfigure any of your software.


    Most programs require you to use the following settings:


    - Fixed baud rate (no auto baud)

    - Hardware bidirectional RTS-RTS flow control (no x-on/x-off)

    - 8 Bits, no parity, 1 stopbit

    - The modem should produce the TRUE DCD status (&C1)

    - The modem should NOT ignore the DTR status (&D2 or &D3)


    Check this with AT&V or AT&Ix (consult your modem documentation)


    These settings are not necessarily the same as the default factory profile (&F),
    so starting an init string with AT&F is probably not a good idea in the first
    place. The smart thing to do is probably use AT&F only when you have reason to
    believe that the modem setup stored in the non-volatile memory is screwed up.


    If you think you have found the right setup for your modems, write it to non-volatile
    memory with AT&W and test it thoroughly with Z-modem file transfers of both ASCII
    text and binary files. Only if all of this works perfectly should you configure
    your modems for leased line.


    Find out how to put your modem into dumb mode and, more importantly, how to get
    it out of dumb mode; The modem can only be reconfigured when it is not in dumb
    mode.


    Make sure you actually configure your modems at the highest possible speed. Once
    in dumb mode it will ignore all ''AT'' commands and consequently will not adjust
    its speed to that of the com port, but will use the speed at which it was configured
    instead (this speed is stored in a S-register by the AT&W command).


    Now configure your modem as follows:


    - Reset on DTR toggle (&D3,D1, this is sometimes S register). This setting is
    required by some ISP''s

    - Leased line mode (&L1&L2), consult your modem documentation

    - The remote modem auto answer (S0=1), the local originate (S0=0)

    - Disable result codes (Q1, sometimes the dumb mode does for this

    - Dumb mode (\D1 or %D1, the modem will ignore all AT commands (sometimes you
    need to disable the ESC char as well).


    Write the configuration to non-volatile memory (&W).


    # Test


    Now connect the modems to 2 computers using the RS232 cables and connect the modems
    to each other using a RJ11 lead. Use a modem program such as Minicom (Linux),
    modem (DOS) on both computers to test the modems. You should be able to type text
    from one computer to the other and vice versa. If the screen produces garbage
    check your com port speed and other settings. Now disconnect and reconnect the
    RJ11 cord. Wait for the connection to reestablish itself. Disconnect and reconnect
    the RS232 cables, switch the modems on and off, stop and restart minicom. The
    modems should always reconnect at the highest possible speed (some modems have
    speed indicator). Check whether the modems actually ignore the ESC (+++) character.
    If necessary disable the character. If all of this works you may want to reconfigure
    your modems, switch off the remote modem (M0) and put local modem at low (L1).


    # Examples


    ### Hi-Tech

    Originate (local): ATL1&C1&D3&L2%D1&W

    Answer (remote): ATM0&C1&D3&L2%D1S0=1&W


    ### DF

    The ESC char should be disabled by setting S2>1;

    Originate: ATL1&L1QC1&D3S2=17\D1&W

    Answer: ATM0&L2QC1&D3S0=17\D1&W


    ### US Robotics-Everything

    The following is based on information supplied by Rolf Raar. The USR Sportster
    and USR Courier do not support leased line. You need the Courier-everything version
    for this job. There is a webpage on the site explaining how to set up your Courier
    for leased line. However, if you follow these instructions you will end up with
    a completely dead modem, which cannot be controlled or monitored by your pppd.
    The USR Courier can be configured with dip switches, however you need to feed
    it the config string first. Make sure it uses the right profile. Unlike most other
    modems it has three: &F0, &F1 and &F2. The default, which is also the one you
    should use, is &F1. If you send it AT&F, however will load the factory profile
    &F0!


    ### Leased line

    For the reset on DTR toggle you set bit 0 of S register 13. This means you have
    to set S13 to 1. Furthermore you need it to leased mode with &L1; ATS13=1&L1&W.
    The dip switches are all except for the following:

    - OFF Disable result codes

    - ON Disable commands

    - ON For originate, OFF For answer

    - OFF Dumb mode


    # PPPD

    You need pppd (Point to Point Protocol Daemon) and a reasonable knowledge of how
    it works. Consult the relevant RFCs or PPP HOWTO if necessary. Since you are not
    going to use a login procedure, you don''t (m)getty and you don''t need (fake)
    user associated with pppd controlling your link. You are not going to dial so
    you don''t need any scripts either. In fact, the modem circuit and configuration
    you just built are rather like a fully wired modem cable. This means you have
    to configure your pppd the same way you would with a null modem cable. For a reliable
    link, your setup should meet the following criteria:


    - Shortly after booting your system, pppd should raise the DTR signal in your
    RS232 port, wait for DCD to go up, and negotiate the link.

    - If the remote system is down, pppd should wait until it is up again.

    - If the link is up and then goes down, pppd should reset the modem (it does this
    by dropping and then raising DTR), and then try to reconnect.

    - If the quality of the link deteriorates too much, pppd should reset the modem
    and then re-establish the link.

    - If the process controlling the link, that is pppd, dies, a watchdog should restart
    the pppd.


    # Configuration


    Suppose the modem is connected to COM2, the local IP address is ''Loc_Ip'' and
    the remote IP address is ''Rem_Ip''. We want to use 576 as our MTU. The /etc/ppp/options.ttyS1
    would be:


    ```

    crcts

    mru 576

    mtu 576

    passive

    Loc_Ip:Rem_Ip

    -chap

    modem

    -pap

    persist

    ```


    So, if the local system is 192.168.1.1 and the remote system is 10.1.1.1, then
    /etc/options.ttyS1 on the local system would be:


    ```

    crcts

    mru 576

    mtu 576

    passive

    192.168.1.1:10.1.1.1

    -chap

    modem

    -pap

    persist

    ```


    The options.ttyS1 on the remote system would be:


    ```

    crtscts

    mru 576

    mtu 576

    passive

    10.1.1.1:192.168.1.1

    -chap

    modem

    -pap

    persist

    ```


    The passive option limits the number of (re)connection attempts. The persist option
    will keep pppd alive in case of a disconnect or when it can''t connect in the
    first place. If you telnet while doing file transfers (FTP or web browsing) at
    the same time, you might want to use a smaller MTU and MRU such as 296. This will
    make the remote system more responsive. If you don''t care about telting during
    FTP, you could set the MTU and MRU to 1500.


    # Scripts


    Starting the pppd and keeping it alive

    The script /usr/local/sbin/PRem_Host.sh shown below starts the pppd. You have
    to start it after the com ports are configured (substitute Rem_Host with the remote
    host''s name).


    ```bash

    #!/bin/bash

    # Optional sleep

    # /usr/bin/sleep 30

    ( /usr/sbin/pppd /dev/ttyS1 115200 ) &

    ```


    It could be the script which configures your networkcard (/etc/init.d/network
    on Debian systems), in which case you will have to uncomment the sleep, to make
    sure the com ports are configured first. If you use retails, you could call it
    from there. Another way is to call it from rc.local. On Debian systems, there
    is a directory /etc/rc.boot/. According to Rolf Raar, the scripts in this Directory
    are executed in alphabetical order. The seterial script is called 0seterial. If
    you call your script from a script called 2leased-lines, it will be executed after
    0seterial.

    '
  mdcn: '


    # 调制调器配置


    关于调制调器配置和初始化字符串（init strings）的说明：


    配置你的调制调器软件（如 minicom 或 (m)getty）使用最高可能的速度；144k 使用 57600 bps，更快的调制调器使用 115200 bps。


    许多人使用非常长且复杂的初始化字符串，通常以 AT&F 开头，并包含许多特定调制调器品牌和类型的命令。然而这增加了必要的复杂性。大多数程序对相同的调制调器设置都很满意，为什么不将这些设置写入你所有调制调器的非易失性内存中，并在所有程序中仅使用
    ''ATZ'' 作为初始化字符串呢？这样，你就可以更换或升级调制调器，而无需重新配置任何软件。


    大多数程序要求你使用以下设置：


    - 固定波特率（无自动波特率）

    - 硬件双向 RTS-RTS 流量控制（无 x-on/x-off）

    - 8 位，无校验位，1 停止停止位

    - 调制调器应产生真实的 DCD 状态 (&C1)

    - 调制调器不应忽略 DTR 状态 (&D2 或 &D3)


    通过 AT&V 或 AT&Ix 检查（请咨询你的调制调器文档）


    这些设置并不一定与出厂默认配置 (&F) 相同，因此从从 AT&F 开始初始化字符串可能不是一个好主意。明智的做法可能是只有当你有理由相信存储非易失性内存中的调制调器设置出错时，才使用
    AT&F。


    如果你认为你已经为调制调器找到了正确的设置，请使用 AT&W 将写入非易失性内存，并使用 Z-modem 传输 ASCII 文本和二进制文件进行彻底测试。只有当所有这些都完美工作时，你才应该为调制调器配置租线（leased
    line）。


    了解如何将调制调器置于盲模式（dumb mode），更重要的是，如何将其退出盲模式；调制调器只有在不在盲模式时才能被重新配置。


    确保你确实以最高可能的速度配置了调制调器。一旦进入盲模式，它将忽略所有的 ''AT'' 命令，因此不会将其速度调整为串口速度，而是将使用它被配置时的速度（此速度存储在
    S 寄存器中，通过 AT&W 命令存储）。


    现在按照如下配置你的调制调器：


    - DTR 切换时重置 (&D3,D1，有时是 S 寄存器）。某些 ISP 要求此设置

    - 租线模式 (&L1&L2)，咨询你的调制调器文档

    - 远程调制调器自动应答 (S0=1)，本地发起 (S0=0)

    - 禁用结果代码 (Q1，有时盲模式为此执行)

    - 盲模式 (\D1 或 %D1，调制调器将忽略所有的 AT 命令（有时你还需要禁用 ESC 字符）。


    将配置写入非易失性内存 (&W)。


    # 测试


    现在使用 RS232 线缆将调制调器连接到两台电脑，并使用 RJ11 线将调制调器相互连接。在两台电脑上都使用如 Minicom (Linux) 或 modem
    (DOS) 等调制调器程序来测试调制调器。你应该能够从一台电脑向另一台电脑输入文本，反之亦然。如果屏幕出现乱码，检查你的串口速度和其他设置。现在断开并重新连接
    RJ11 线。等待连接重新建立。断开并重新连接 RS232 线缆，切换调制调器的开关，停止并重启 minicom。调制调器应该始终以最高可能的速度重新连接（某些调制调器带有速度指示）。检查调制调器是否实际上忽略了
    ESC (+++) 字符。如有必要，禁用该字符。如果所有这些运行正常，你可能想要重新配置你的调制调器，关闭远程调制调器 (M0) 并本地调制调器设置为低速
    (L1)。


    # 示例


    ### 高科技

    发起（本地）：ATL1&C1&D3&L2%D1&W

    应答（远程）：ATM0&C1&D3&L2%D1S0=1&W


    ### DF

    应通过设置 S2>1 来禁用 ESC 字符；

    发起：ATL1&L1QC1&D3S2=17\D1&W

    应答：ATM0&L2QC1&D3S0=17\D1&W


    ### US Robotics-全功能型

