    # 38 Linux Modem and Serial Communications


    getty_ps can also use syslog to log messages. See the man pages for syslogd(1)
    and sys-log.conf(5) for setting up syslog, if you don''t have it running already.
    Messages are logged with priority LOG_AUTH, errors use LOG_ERR, and debugging
    uses LOG_DEBUG. If you don''t want to use syslog you can edit tune.h in the getty_ps
    source files to use a log file for messages, namely /var/adm/getty.log by default.


    Decide on if you want FSSTNDT compliance and syslog capability. You can also choose
    a combina-tion of the two. Edit Makefile, tune.h and config.h to reflect your
    decisions. Then compile and install according to the instructions included with
    the package.


