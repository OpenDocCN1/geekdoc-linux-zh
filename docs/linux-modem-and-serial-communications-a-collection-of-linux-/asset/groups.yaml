    \ Then go back to the communication program (type fg at the command prompt in\
    \ minicom).\n\n## 14 Problems Explained\n\nWhile the section Troubleshooting lists\
    \ problems by symptom, this section explains what will happen if something is\
    \ set incorrectly. This section helps you understand what caused the symptom and\
    \ other symptoms might be due to the same problem.\n\n### 14.1 Interrupt Misset\n\
    \nIf you do not understand what an interrupt does see Interrupts. If a serial\
