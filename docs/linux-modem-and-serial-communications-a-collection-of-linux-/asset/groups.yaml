    # Linux 调制解器与串口通信


    各项设置并不一致。换句话说，这意味着驱动程序获取的串口信息错误的。如果驱动程序具有错误的 I/O 地址，它将尝试将数据发送到不存在的串口——更糟糕的是，发送到某个并非串口的实际设备。如果它具有错误的
    IRQ（中断请求），它将无法获取来自串口的中断服务请求，导致串口缓冲区可能溢出，并且响应非常缓慢（因为回退到了非常慢的“轮询”方法而不是中断）。如果 UART
    型号错误，也可能出现问题。


    ## 设备驱动程序是如何认为的？


    你如何确保驱动程序拥有正确的信息？嗯，如果一切正常，就不需要检查这一项。但在其他情况下，很容易看出驱动程序的想法。一种方法是直接输入 `serial-g /dev/ttyS*`。在启动时，控制台上的一个消息会显示此内容。你可以查看
    `/proc/ioports`；它只显示串口“设置”的相同 I/O 地址，但不一定是硬件中的实际方式。查看当前运行进程（已打开设备的进程）所使用的 IRQ，查看
    `/proc/interrupts`。它还显示了已发出的中断次数（通常是数千次）。上述测试均不能显示设备中实际设置的内容。但如果一切运行正常，设备设置可能与硬件中的设置是一的。


    ## 我们的串口硬件中包含什么？


