    In addition, you will have to play with the jumpers on your boards, check the
    docs for your board. Set the jumpers to the IRQ you want for each port.


    You should set things up so that there is one, and only one interrupt for each
    serial device. Here is Greg set his up in /etc/rc.d/local—you should do it in
    a file which runs startup:


    ```

    /bin/setserial /dev/ttyS0 irq 3      # serial mouse

    /bin/setserial /dev/ttyS1 irq 4      # my Wyse dumb terminal

    /bin/setserial /dev/ttyS2 irq 5      # my Zoom modem

    /bin/setserial /dev/ttyS3 irq 9      # my USR modem

    ```


    IRQ assignments:


    | IRQ 0 | Timer channel 0 |

    | IRQ 1 | Keyboard |

    | IRQ 2 | Cascade for controller 2 |

    | IRQ 3 | Serial port 2 |

    | IRQ 4 | Serial port 1 |

    | IRQ 5 | Parallel port 2 |

    | IRQ 6 | Floppy diskette |

    | IRQ 7 | Parallel port 1 |

    | IRQ 8 | Real-time clock |

    | IRQ 9 | Redirected to IRQ2 |

    | IRQ 10 | not assigned |

    | IRQ 11 | not assigned |

    | IRQ 12 | not assigned |

    | IRQ 13 | Math coprocessor |

    | IRQ 14 | Hard disk controller 1 |

    | IRQ 15 | Hard disk controller 2 |


    There is really no Right Thing to do when choosing interrupts. Just make sure
    it isn''t being used by the motherboard, or any other boards, 2, 3, 4, 5, or 7
    is a good choice. "not assigned" means that currently standard uses these IRQs.
    Also note that IRQ 2 is the same as IRQ 9. You can call it either 2 or 9, the
    serial driver is very understanding. If you have a serial board with a 16-bit
    bus connector, you can also use IRQ 10, 11, 12 or 15.'
  - '[PAGE 113]


    Just make sure you don''t use IRQ 0, 1, 6, 8, 13 or 14! These are used by your
    mother board. You will make her very unhappy by taking her IRQs. When you are,
    double-check /proc/interrupts and make sure there are no conflicts.


    # 9.2 Setting Serial Device Addresses


    Next, you must set the port address. Check the manual on your board for the jumper
    settings. Like interrupts, there can only be one serial device at each address.
    Your ports will usually come configured as follows:


    ```

    ttyS0 address 0x3f8

    ttyS1 address 0x2f8

    ttyS2 address 0x3e8

    ttyS3 address 0x2e8

    ```


    Choose which serial device you want to have and set the jumpers accordingly. I
    have my modem on ttyS3, my mouse on ttyS0, and my terminal on ttyS2.


    When you reboot, Linux should give your serial ports at the address you set. The
    Linux ques may not correspond to the IRQ you set with the jumpers. Do not worry
    about this. Linux does not give any IRQ detection when it boots, because IRQ detection
    is dicey and can be fooled. Use setserial to tell Linux which IRQ you are using.
    You can check /proc/ioports to see what I/O port addresses are in after Linux
    boots.


    # 10. How Do I Set Up My Serial Ports For Higher Speeds? What Speed Should I Use
    With My Modem?


    This section should help figure out what speed to use when using your modem with
    a communications program, or with a getty program. Normally you just set the speed
    by a parameter given to getty or by a menu in your communications program (or
    for some reason doesn''t work for high speeds, there is a workaround by giving
    special options to setserial: With the spd_hi or spd_vhi options to setserial,
    38400 will actually set the speed to 57600 (spd_hi) or 115200 (spd_vhi).


    Make sure you have at least 16550A UARTS for higher speeds. Here are some suggested
    speeds:


    +   - If you have a 28.8K (V.34), 33.6K (V.34), or 56K (V.90) modem use 115200
    bps.'
