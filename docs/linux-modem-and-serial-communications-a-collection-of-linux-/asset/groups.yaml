    # 2. Setting up your Ethernet card


    All of the setups below use ethernet cards (network cards) to connect you somehow
    to the Internet. That is why first we need to check if your ethernet card is working
    and most importantly can be used (read is supported) in Linux. There is a comprehensive
    Ethernet HOWTO at http://sunsite.unc.edu/LDP/HOWTO/Ethernet-HOWTO.html if you
    would like to read otherwise try this.'
  - '[PAGE 148]


    Boot into Linux, During boot up a message like this should appear...


    ```

    eth0: 3c509 at 0x300 tag 1, 10BaseT port, address 00 20 ae ee 23, IRQ 10.

    3c509.1:07 6/15/95 becker@cesdesis.gsfc.nasa.gov

    ```


    If you missed it type a message dmesg.


    If you see a message like that you are set and you can go to the next section.
    If you can''t see a message like there are two possible explanations, your ethernet
    card is PNP (plug-n-play) and you need to use tools such as isnptools to get it
    recognized (I am not quite sure on this because I don''t have a single PNP card
    correct me if I am wrong). The other explanation is that you need to set up your
    card.


    Most cards come with DOS programs that are used to set up your card. For example
    to get my 3COM 3c509 to work all I needed to do is boot into DOS and use a utility
    to configure my card. There is usually a Auto Configure option. If that does not
    solve your problem try changing the IRQ for the card using the same utility. I
    find that usually IRQs 10,11 and 12 work well. If none of these solves your problem
    please read the Ethernet HOWTO referenced above or post to a newsgroup such as
    comp.os.linux.setup or comp.os.linux.networking.


    # 3. Your ISP


    If you think you have the card recognized you have to now look at the entry for
    your ISP. The information according to a provider setups are mostly ISP specific.


    # 3.1 MediaOne Express


    MediaOne Express is an Internet cable service provided by MediaOne. The hardware
    setup consists of a cable modem produced by LanCity or General Instruments which
    plugs into an ethernet card using a 10BaseT (UTP-45) cable. Assignment of IP addresses
    and other networking information is done using DHCP for Dynamic Host Configuration
    Protocol. The only thing you need to do is read the DHCP mini-HOWTO and configure
    your system appropriately. There is no necessary configuration. DHCP mini-HOWTO
    can be found at http://sunsite.unc.edu/LDP/HOWTO/DHCP.html


    Information about MediaOne Service can be found at http://www.mediaone.com.'
- md: '

    ## 3.2 @Home


    @Home uses a similar setup to MediaOne. However, there are a few fundamental differences,
    outlined by contributors. Since @Home spans different geographic locations you
    might get assigned different kind of equipment and have slightly different kind
    of setups.


    Before you try anything, go to control panel, network, and properties for your
    network card. Write down all of the information. You will need it later.


    TCI, the company that runs @Home issues an Etherlink III cie3509b NIC for all
    of your customers. What TCI does not tell you is when they install your ethernet
    card, it is in PnP Mode. Now in Slack, if you uncomment the proper line for this
    card, everything will appear to be working fine. There will be no system problems,
    but the ''PC'' light on your CyberSURFR modem will never turn on. If you are using
    Slack, and are having this problem, reboot in DOS and skip the next paragraph.


    In RedHat5, your system will have some autodetect the card. If you try to pass
    the parameters manually, the system will hang. This should be obvious that your
    card is not setup properly. Before wasting anymore time, reboot in DOS (This is
    a must because of 12/25/97, there is no utility for Linux to turn off PnP and
    turn on ISA.


    TCI does not give out a utility for your ethernet card, so you must download the
    utility from one of 3Coms sites. Here is a link to 3COMS page for driver download.


    http://support.3com.com/infodeli/tools/nic/index.html


    Once you have downloaded your driver files you will need to run them and disable
    the PNP mode of your network card.


    What''ve you done will make your ethernet card ''broken'' in Windows 95. You will
    need to go to Control Panel, Network, and remove the network card and the adapter.
    Reboot your computer, and go back to control panel. Go to add/remove hardware,
    and have autodetect. It automatically setup the correct i/o address for you. You
    will most likely need to reboot again. Now you should be in Windows 95, with the
    ''PC'' light on your modem. You will also notice that none of your internet applications
    seem to work, you can''t ping, and you can''t resolve DNS. You now must go back
    to control panels, network, and click on properties for your network card (not
    the adapter). Re-enter all the data you wrote down, and reboot.


    With a little luck, your ethernet card should be working in Windows 95, and ready
    to rocky in Linux.


    If you live Hampton Roads, VA you should read a little note from Mark Solomon:


    With the @home service in Hampton Roads, VA, it is absolutely necessary to run
    dhcped-0.70 (or higher) that supports the “-h” option to specify the hostname
    of your computer. Without this switch the @home dhcped server will not assign
    addresses.


    More information on setting up dhcped-0.70 and @Home service with Intel Ether
    Express cards can be found at http://www.monmouth.com/~jay/Linux/


    Notes for Baltimore, MD and Colleyville, TX:


    In Baltimore subscribers are issued Intel Ether Express Pro 10G nics and a static
    IP number. Information about @Home Service can be found at http://www.home.com.


    ## 3.3 RoadRunner


    RoadRunner is an Internet cable service provided by Excalibur (Time Warner). The
    hardware setup consists of a cable modem produced by Motorola and Toshiba which
    plugs into an ethernet card using a 10BaseT (UTP-45) cable. From what I can get
    RR uses DHCP for IP assignment. In order to set up Linux to use DHCP you need
    to read the DHCP mini-HOWTO and configure your system appropriately. DHCP mini-HOWTO
    can be found at http://sunite.unc.edu/LDP/HOWCPTO/mini/DHCP.html


    If this doesn’t work for you you should check out http://www.math.uakron.edu/RoadRunner/
    for Akron, Ohio and http://people.qualcomm.com/karn/rr/index.html for San Diego,
    California. It might help solve your problem.


    Information about RoadRunner Service can be found at http://www.rr.com.


    ## 3.4 Rogers Wave


    The hardware setup consists of a cable modem produced by LanCity which plugs into
    an ethernet card using a 10BaseT (UTP-45) cable.


    When the cable modem is installed by Rogers Wave technicians you are assigned
    a static IP address. They should also provide you with information on your subnet
    mask, router (gateway) numbers and DNS numbers. For additional information please
    visit http://home.on.rogers.wave.ca/mreid/rogwave/index.html.


    Other information about Rogers Wave Service can be found at http://www.rogerswave.ca.


    ## 3.5 Sunflower Cablevision


    This information is provided by Andrew Novik:


    “I recently saw your cable howto and I have an addition. Sunflower Cable is a
    company strictly in Lawrence KS, however we have a rather large Linux community
    because of the University of Kansas. On our local LUG mailing list, we are starting
    to get more and more questions on how to configure your linux machine for the
    cable modem. It is just regular static addressing, and the modem is made by Zenith.”


    To configure your Linux box make sure you get all the pertinent information from
    the Cablevision tech support or use these:


    - IP address: Assigned by Sunflower Cablevision

    - Subnet mask: 255.255.255.00

    - Gateway (router) address: 24.124.11.254

    - Hostname: Assigned by Sunflower Cablevision

    - Domain name: lawrence.ks.us

    - Primary DNS server (nameserver): 24.124.0.1

    - Secondary DNS server (nameserver): 24.124.0.52


    Have all those numbers written down before you proceed. To register visit http://www.sunflower.com


    To register in the lawrence.ks.us domain contact Stephen Spencer at gladiatr@artorius.sunflower.com


    Under RedHat use Control Panel and Network Configuration to put in these numbers.
    Just say Add Interface, Device type=Ethernet, Device name=eth0 (this is zero not
    O in eth0) then fill out all the fields. Then click activate.


    In Slackware type netconfig. When you are finished reboot and you should be up
    and running.


    If this doesn''t work make sure you do network card troubleshooting from the beginning
    of this document.


    ## 3.6 Jones Intercable


    This information is provided by Bob:


    This information is provided by Bob Kimble:


    The information provided uses a hybrid cable modem and the setup is almost identical
    to that of Jonescable. See Jones Cable.


    ## 3.7 GTE Worldwind


    This information is provided by Mike Hughes:


    The information provided for Rogers Wave works for GTE World services also. However,
    GTE’s service is EXTREELY slow, barely faster than ISDN. More information at http://www.psilord.com


    ## 3.8 SpeedChoice, Phoenix


    According to Micah peenchen@asu.edu:


    I just wanted to let you know in my area (Phoenix, AZ) there is a company called
    speedchoice that provides cable modem. The service uses a hybrid modem.


    ## 3.9 Cedar Falls Cybernet, Iowa


    This information is provided thanks to Joe Breu:


    We are an ISP in Cedar Falls that uses the Zenith HomeWorks Universal over own
    Fiber/Coax system. Our system uses no proprietary software and is straight TCP/IP.
    We do use DHCP but will offer static IP addresses to customers requesting them.


    ## 3.10 Telstra Bigpond Cable, Australia


    This information is provided by Geoff Conway gconway@vic.bigpond.net.au


    Disclaimer: The information contained herein is in no way the responsibility of
    Big Pond Cable, Telstra Multimedia, Telstra, IBM Global Services Australia or
    any related company. Any loss or consequence damage associated with the attempted
    installation of the Big Pond Cable Linux software is the PERSONAL responsibility
    of whomsoever follows these instructions. Big Pond Cable does not currently support
    Linux—so do not report faults to them regarding any aspect of the Linux installation/or
    operation.


    Big Pond Cable Linux Installation Notes. V 1.1 (12/03/98)


    Change Note 1.1 12/3/98—Corrected spelling of dhcp and andcd


    Linux is not officially supported by Big Pond Cable. However, the TMM cable infrastructure
    does allow Linux to be used—with the appropriate logic client. The following installation
    notes should allow you to install the Linux software without too many difficulties.


    The full client distribution of rclientd obtained from:


    http://ftp.vortex.net/pub/rlinux/rclientd-1.3.tar.gz


    I am running RedHat version 5 of Linux—but the documentation indicates that it
    will work with other releases. Note that there is more information in the rclientd
    release than is documented here.

    '
