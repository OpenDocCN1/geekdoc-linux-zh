    \ 56k！在其他国家可能会略高一些。\n\n因此，在美国，56k 是使用普通电话电路数字部分的绝对最高速度，该部分设计用于发送人声的数字编码。为了使用 56k，调制调器必须精确知道电话公司是如何进行数字编码的。\n\
    \n 附录 B：“波特率 (baud)”与“比特率 (bps)”\n\n“baud”和“bps”可能是计算和电信领域最常被误用的术语之一。许多人交替使用这两个术语，但实际上\
    \ bps 是每秒比特数。波特率衡量的是信号每秒变化（或转换）的次数。对于典型的串口，1 位表示为 -12 伏特，0 位为 +12 伏特。如果 bps 为\
    \ 38,400，那么序列 010101 也将是 38,400 波特，因为电压在正负之间来回波动……每秒切换 38,400 次。对于另一个序列 11100011，切换次数将少于\
    \ 38,400，因为电压一直保持在 -12 伏特。我们说每秒变化的次数实际上是 64k bit/sec，但只有 56k 可以由用户控制。\n\n调制调器使用什么来编码模拟信号？以每秒\
    \ 8000 次的速率对模拟信号进行采样的方法。每个幅度被编码为一个 7 位的字节（注意：7 x 8000 = 56000）。这被称为脉冲编码调制 = PCM。这些字节随后发送到电话公司的数字电路上，在这些中，许多通话共享一个被称为“时分复用”的单一电路。最后在你家附近的本地电话局，数字信号被解复用，产生与最初由\
    \ PCM 创建相同的信号。该信号随后被转换回模拟信号并发送到你家中。你的调制调器的任务是根据幅度精确确定是种数字信号。这（某种意义上）是“幅度调制”，但并非真正如此。\n\
    \n## 实际示例\n\n上面的例子过于简单。实际示例更为复杂，但基于相同的原理。这解释了运行在 2400 波特的调制调器如何能发送 14400 bps 或更高的速率。调制调器通过在每次信号变化（或转换）中编码许多比特来实现大于波特率的\
    \ bps 率。当每个波特编码两个或多个比特时，bps 超过波特率。如果你的调制调器器连接为 14400 bps，它将在 2400 波特下每次信号传输发送\
    \ 6 位。28800 bps 的速度是通过 3200 波特/波特获得的。当人们误用“波特”这个词时，他们可能指的是速度（例如 33.6K）。常见的 bps\
    \ 速率曾为 50, 75, 110, 300, 1200, 2400, 9600。这些是串口到调制器电缆上的 bps 速率。如今，串口到调制器的速率为 14.4K、28.8K、33.6K\
    \ 和 56K，但串口到调制器电缆的速率并非 19.2K、38.4K、57.6K 和 115.2K。使用带有 V.42bis 压缩（最大 4:1）的调制调器，33.6K\
    \ 调制调器可以达到 115.2K bps 的速率（56K 调制调器可以达到 230.4K）。\n\n除 56k 调制调器外，大多数调制调器运行在2400、3000\
    \ 或 3200 波特。由于语音级电话线的带宽限制，大于 2400 的波特率难以实现，且只有在电话线路质量完美的条件下才能工作。\n\nbps 和 baud\
    \ 之间的混淆是如何开始的？嗯，当老式的低速调制调器是高速的时，bps 率实际上等于波特率。每个相位变化编码一个比特。人们会交替使用 bps 和 baud，因为它们的值是相同的。例如，一个\
    \ 300 bps 的调制调器的波特率也是 300。当更快的调制调器出现且比特率超过波特率时，这一切都改变了。“baud”是以异步电报打印机发明者 Emile\
    \ Baudot 命名的。\n\n## 附录 C：终端服务器连接\n\n本节改编自 Text-Terminal-HOWTO。\n\n终端服务器类似于智能交换机，可以将许多调制调器（或终端）连接到一台或多台计算机。它不是机械开关，因为它可以改变通过它的数据流的速度和协议。许多公司制造终端服务器：Xplex,\
    \ Cisco, 3Com, Computone, Livingston 等。它们有许多不同的类型和功能。还需要另一个 HOWTO 来完善和描述它们（包括使用\
    \ Linux PC 创建你自己的终端服务器的可能性）。大多数用于调制调器连接，而不是直接连接终端。\n\n它们的一个用途是将许多调制调器（或终端）连接到连接到主机计算机的高速网络上。当然，终端服务器必须具有运行网络协议的计算能力和软件，因此它在某些方面像一台计算机。终端服务器可能会与用户交互并询问连接到哪台计算机，也可能在不询问的情况下连接。有时作业发送到打印机，然后是终端服务器。\n\
    \n现在的 PC 拥有足够的计算能力来充当终端服务器，但每个串口应该有自己的硬件中断。PC 仅有此目的目的空闲中断，由于它们是硬接线的，你无法通过软件创建更多。解决方案是使用高级的多端口串口卡，它有自己的中断系统（或者在低成本型号上，在多个端口之间共享\
    \ PC 的一个中断）。更多信息请参阅 Serial-HOWTO。\n\n"
