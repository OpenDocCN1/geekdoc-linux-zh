    # Cabling & Installation


    Connecting an external modem is simple compared to connecting most other devices
    to a serial port that require various types of "null modem" cables. Modems use
    straight through cable, with no pins crossed over. Most computer stores should
    have these. Make sure you get the correct gender. If you are using the DB9 or
    DB25 serial port at your computer, it will always be male. Hook up your modem
    to one of your serial ports. If you are willing to accept the default IRQ and
    I/O address of the port you connect to, then you are ready to start your communication
    program and configure it.


    # What the Lights (LED''s) Mean


    +   * TM Test Modem

    * AA Auto Answer (If on, your modem will answer an incoming call)

    * RD Receive Data line = RxD

    * SD Send Data line = TxD

    * TR data Terminal Ready = DTR (set by your PC)

    * RI Ring Indicator (If on, someone is “ringing” your modem)

    * OH Off Hook (If off, your modem has hung up the phone line)

    * MR Modem Ready = DSR ??

    * EC Error Correction

    * DC Data Compression

    * HS High Speed


    # 4.3 Internal Modems


    An internal modem is installed in a PC by taking off the cover of the PC and inserting
    the modem into a vacant slot on the motherboard. There are modems for the ISA
    slots and others for the PCI slots. While external modems plug into the serial
    port (via a short cable), the internal modems have the serial port built into
    the modem. In other words, the modem card is both a serial port and a modem.'
