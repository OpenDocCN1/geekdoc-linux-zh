    This can also happen when getty initialization is failing.\n\n## 12.9 My Modem\
    \ is Hosed after Someone Hangs Up, or DTR is dropped\n\n LEDs go crazy when this\
    \ happened. You need to have your modem reset. Most Hayes-compatible modems do\
