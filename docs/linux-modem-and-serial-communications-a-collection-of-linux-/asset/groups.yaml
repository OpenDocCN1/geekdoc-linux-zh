    # 1.4 What is a Modem?


    A modem is a device that lets one send digital signals over ordinary telephone
    lines not designed for digital signals. If telephone lines were all digital then
    you wouldn''t need a modem. It permits your computer to connect and communicate
    with the rest of the world. When you use a communication program or web browser
    (which includes such a program) to utilize the modem and dial-out on a telephone
    line. Advanced modem users can set things so that others phone in to and use their
    computer. This is called "dial-in".


    There are two basic types of modems for PC: external and internal. The external
    sets outside the PC while the internal is not visible since it''s inside the PC.
    The external modem plugs into a connector on the PC known as a "serial port".
    The internal modem is a card that is inserted inside the computer and has an (invisible)
    serial port built into it. For a more detailed comparison see External vs. Internal.
    Thus when you get an internal modem, you also get a dedicated serial port (which
    can only be used with the modem and not with anything else as another modem or
    a printer). In Linux, the serial ports are named ttyS0, ttyS1, etc. (corresponding
    respectively to COM1, COM2, etc in Dos/Windows).


    The serial port is not to be confused with the "Universal Serial Bus" (USB) which
    uses a special connector and may be used with modems in the future. See Modem
    & Serial Port Basics for details on modems and serial ports.


    # 1.5 Quick Install


    External Modem


    With a straight-thru or modem cable, connect the modem to an unused serial port
    on the PC. Make sure you know the name of the serial port: COM1 is ttyS0, COM2
    is ttyS1. You may need to check the BIOS to determine this. Plug in the power
    cord to provide power to the modem. See All Modems for further instructions.


    Internal Modems (on ISA bus)


    (See PCI Modems for the PCI bus) If the modem says it will only work under MS
    Windows, you are out of luck. If you already have 2 serial ports, make this the
    3rd serial port (ttyS2 = COM). Find an unused IRQ number to use. An unused one
    is often IRQ5 for the 2nd parallel port or a sound card (which you may not have).
    Then set the jumpers (or the like) on the internal modem to the unused IRQ and
    I/O address 3E8 (ttyS2).'
