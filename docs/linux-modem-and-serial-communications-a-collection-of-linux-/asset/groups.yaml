    如果终端服务器通过网络连接到其他 PC，且其主要工作是透传数据并处理每 14（或左右）字节的串口中断，则它被称为终端服务器。有时会使用名为“radius”的软件。


    如今真正的终端服务器的服务不仅仅是终端。它们还为模拟终端的 PC 服务，并且有时连接到连接电话线的调制调器阵组。某些设备甚至内置了调制调器。如果终端（或模拟终端的
    PC）直接连接到调制调器，那么线路另一端的调制调器可以连接到终端服务器。在某些情况下，终端服务器默认期望呼叫者使用 PPP 包，而真实的终端并不会产生此类包。


    ## 19. 附录 D：其他类型的调制调器


    本 HOWTO 目前处理用于将 PC 连接到普通电话线的调制调器。还有其他类型的调制调器，包括被称为调制调器但实际上不是调制调器的设备。


    ## 19.1 数字转数字“调制调器”


    调制器的标准定义有时会扩大到包含“数字”调制调器。如今，许多家庭和办公室已提供直接的数字服务，因此计算机向电话线发送数字信号（准确说是几乎如此）。但仍然需要设备将计算机数字信号转换为电话电路允许的类型，这种设备有时被称为调制调器。接下来的两个小节：ISDN
    和 DSL 涉及数字转数字“调制调器”。


    ## 19.2 ISDN “调制调器”


    “modem”实际上是一个终端适配器 (TA)。提供一个 Debian 包“isdnutils”。有一份德语版的 ISDN Howto 带有英语翻译：http://www.suse.de/Support/sdb_e/isdn.html。它由
    SuSE Linux 发行版发布，很可能是该发行版中可用的驱动程序。有一个 isdn4linux 包和一个新闻组：de.alt.comm.isdn4linux。许多帖子是德语编写的。你可以尝试使用搜索引擎（如
    DejaNews）来查找“isdn4linux”。


    ## 19.3 数字用户线路 (DSL)


    DSL 使用你家（等等）现有的双绞线线路连接到本地电话交换局。如果你的电话线可以接受比普通调制调器（例如 56k）发送的更快的速度，就可以使用它。它将本地电话交换局的模拟数字转换器替换为可以接受更快数据流的转换器（当然，是不同的格式）。将你的计算机数字信号转换为本地电话线路上表示数字数据信号的设备也称为调制调器。本文目前未涵盖这些调制调器的特殊方面。


    # Linux 串口 HOWTO


    由 David S.Lawyer 修订，邮箱 bf347@lafn.org；原作者为 Greg Hankins


