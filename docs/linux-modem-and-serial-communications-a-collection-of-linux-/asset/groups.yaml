    # Linux Modem and Serial Communications


    "Or the like" (in the previous sentence) may be a bit tricky. If the modem is
    a Plug and Play (PnP) for the ISA bus, the equivalent probably can be using the
    “isapnp” program which comes with “isapntools”. “man isapnp”. Another possible
    way to set the IRQ and 3E8 is (if possible) to configure it under Windows. If
    you have a PnP BIOS, then configuring under Windows should put the configuration
    into the PnP BIOS so that it will be used at boot-time for Linux (provided you
    tell CMOS that you don''t have a PnP operating system when you use Linux). For
    Windows 3.x use the ICU utility. There may be a way to disable PnP using software
    that came with the modem.


    Finally you must also find the file where “setserial” is run and add a line something
    like: “setserial /dev/tty2 irq5”. See All Modems for further instructions.


    # All Modems


    # 2. Modem & Serial Port Basics


    You don''t have to understand the basics to use and install a modem. But understanding
    it may help determine what is is wrong if you run into problems. After reading
    this section, if you want to see How Modems Work in this document (not yet complete).
    A future version of Serial-HOWTO (expected by Feb. 1999) should cover more on
    the serial port itself.


    # 2 Modem Converts Digital to Analog (and conversely)


    Most telephone main lines are digital but the lines leading to your house (or
    business) are usually analog which means that they were designed to transmit a
    voltage wave which is an exact quality of the sound wave coming out of your mouth.
    A voltage wave is called “analog”. If viewed on an oscilloscope it looks like
    a sine wave of varying frequency and amplitude. A digital signal is like a square
    wave. For example 3 v (volts) might be a 1-bit and 0 v could be a 0-bit. For most
    serial ports (used by external modems) +12 v is a 0-bit and -12 v is a 1-bit (some
    are + or - 5 v).


    # Modem-HOWTO (for Linux)


    To send data from your computer over the phone line, the modem takes the digital
    signal from your computer and converts it to “analog”. It does this by creating
    an analog sine wave and then “MODulating” it. Since the result still represents
    digital data, it could also be called a digital signal instead of analog. It looks
    something like an analog signal and almost everyone calls it analog. At the other
    end of the phone line another modem “DEModulates” this signal and the pure digital
    is recovered. Put together the “mod” and “dem” parts of the two words above you
    get what “modem” (if you drop one of the two d''s). A “modem” is thus a MODulator-DEModulator.
    Just what modulation is be found in the section Modulation Details.


    # 2.2 What is a Serial Port?


    # Introduction


    Since modems have a serial port between them and the computer, it’s necessary
    to understand the serial port as well as the modem. The serial port is an I/O
    (Input/Output) device. Most PC''s have two serial ports. Each has a 9-pin connector
    on the back of the computer. Computer programs can send data (bytes) to the transmit
    pin (output) and receive bytes from the receive pin (input). The other pins are
    for control purposes and ground.


    The serial port is much more than just a connector. It converts the data from
    parallel to serial and changes the electrical representation of the data. Inside
    the computer, data bits flow in parallel (using many wires at the same time).
    Serial flow is a stream of bits over a single wire (such as the transmit or receive
    pin of the serial connector). For the serial port to create such a flow, it must
    convert data from parallel (inside the computer) to serial on the transmit pin
    (and conversely).


    Most of the electronics of the serial port is found in a computer chip (or a section
    of a chip) known as a UART. For more details on UARTs see the section What UARTs?
    How Do They Affect Performance? But you may want to find this first section so
    that you will hopefully understand how the UART fits into the overall scheme of
    things.


    # Pins and Wires


    Old PC''s used 25 pin connectors but only about 9 pins were actually used, so
    today most connectors are only 9-pin. Each of the 9 pins connects to a wire. Besides
    the two wires used for transmitting and receiving data, another pin (wire) is
    signal ground. The voltage on any wire is measured with respect to this ground.
    There are still more wires which are for control purposes (signalling) only and
    not for sending bytes. All of these signals could have been sent on a single wire,
    but instead, there is a separate dedicated wire for every type of signal. Some
    (or all) these wires are called “modem con-


    # Internal Modems


    For an internal modem there is no 9-pin connector but the behavior is exactly
    as the above mentioned cable wires exist. Instead of a 12 volt signal in a wire
    giving the state of a modem control line, the internal modem may use a status
    bit in its memory (a register) to determine the state of this non-existent "wire".
    The internal modem''s serial port looks just like a real serial port to the computer.
    It even the speed limits that one may set at ordinary serial ports as 115200 bits/sec.
    Unfortunately, many internal modems do not work exactly like this but use MS Windows
    software to help do job and will not work under Linux. See Avoid: winmodems.


    # 2.3 Address & IRQ


    Since the computer needs to communicate with each serial port, the operating system
    (OS) must know the serial port exists, where it is (its I/O address) and what
    wire (IRQ number) the serial port to use to request service from the computer''s
    CPU. Each serial port device must store in its non-volatile memory both its I/O
    address and its Interrupt ReQuest number: IRQ. The IRQ determines what wire is
    used to request service using interrupt signals. See Interrupts.


    The serial ports are labeled ttyS0, ttyS1, etc. (corresponding to COM1, COM2,
    etc. in DOS). There is also an obsolete set of names: cua0, cua1 which are almost
    the same as ttyS0, ttyS1, etc. The Qua device. Which of these names refers to
    certain physical serial port is determined (in part) by the I/O address stored
    inside the hardware chip of the physical port. This mapping of names (such as
    tty1) to I/O addresses and IRQ''s may be set by the "setserial" command. What
    is Serial. This does not set the I/O address and IRQ on the hardware itself (which
    is set by jumpers or plug-and-play).


    # 2.4 Interrupts


    Bytes come in over the phone line to the modem, are converted from analog to digital
    by the modem passed along to the serial port on their way to their destination
    inside your computer. When the serial port gets say8 bytes from the modem (may
    be set to 1, 4, 8, or 14) it signals the CPU to fetch them by sending an electrical
    signal known as an interrupt on a dedicated conductor. Old serial ports would
    always send an interrupt for every byte received.


    Each interrupt (inside the computer) has a number (IRQ) and the serial port must
    know which conductor to use to signal on. For example, ttyS0 normally uses IRQ
    number 4 known as IRQ4 (or IRQ 4). A list of them and more will be found in “man
    serial” (search for “Configuring Serial Ports”). Interrupts are issued whenever
    the serial port needs the CPU’s attention. It''s important to do this in a timely
    manner since the buffer inside the serial port can hold only 16 (in modems) incoming
    bytes. If the CPU fails to receive such bytes promptly, then there will not be
    any space left for more bytes and the small buffer may eventually overrun. Bytes
    will be lost. For an external modem, there is no way to stop the flow rapidly
    enough to prevent this. For an internal modem, the 16-byte buffer is on the same
    card and a good modem will not write to it if it is full. A good modem will not
    overrun the buffers and this is one advantage of an internal modem.


    Interrupts are also issued when the serial port has just sent all its bytes from
    its small transmit buffer to the modem. The interrupt is to notify the CPU of
    that so that it may put more bytes in the transmit buffer.


    The buffers mentioned above are all hardware buffers. The serial port also has
    large buffers in main memory. This will be explained later


    Interrupts convey a lot of information but only indirectly. The interrupt itself
    just tells a chip called the interrupt controller that a certain serial port needs
    attention. The interrupt controller then signals the CPU. The CPU runs a special
    program to serve the serial port. That program is called an interrupt routine
    (part of the serial driver software). It tries to find out what has happened at
    the serial port and then deals with transferring bytes from (or to) the serial
    port’s hardware buffer. This program can easily find out what has happened since
    the serial port has registers at I/O addresses known to the driver software. These
    registers contain status information about the serial port.


    # 2.5 Data Compression (by the Modem)


    Before continuing with the basics of the serial port, one needs to understand
    about something done by the modem: data compression. In some cases this task is
    actually done by software run on the computer’s CPU but unfortunately at present,
    such software only works for MS Windows.

