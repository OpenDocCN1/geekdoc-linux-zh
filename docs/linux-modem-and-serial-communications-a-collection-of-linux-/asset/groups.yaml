    # # How Do I Set Up A Terminal Connected To My PC?


    See Text-HOWTO for a more detailed (but still incomplete) discussion of terminals.
    The instructions in this section will work for connecting terminals, as well as
    other computers to the serial port on your Linux box.


    # ## 8.1 Hardware Requirements


    Make sure you have the right kind of cable. A null modem cable bought at a computer
    store may do it, but it probably will not work for hardware flow control. But
    it must be a null modem cable! Many computer stores advertise this kind of cable
    as a serial printer cable. Make sure you are using your serial port, the male
    DB25 or the DB9, and not your parallel port (female DB25 or centronics).


    For a DB25 connector, you need a minimum of:


    | PC male DB25 | | Terminal DB25 |

    |---|---|---|

    | TxD | Transmit Data | 2-3 | Receive Data |

    | RxD | Receive Data | 3 <-2 | TxD Transmit Data |

    | SG | Signal Ground | 7--7 | SG Signal Ground |


    This null modem cable works over two computers using RTS/CTS hardware harnessing
    signals, but many terminals use DTR handshaking which cannot be set in linux with
    "sty". A workaround is to stct and connect terminal 20 (DTR) with the PC pin 5
    (CTS).


    | PC male DB25 | | Terminal DB25 |

    |---|---|---|

    | TxD | Transmit Data | 2–3 | RxD Receive Data |

    | RxD | Receive Data | 3 <--2 | TxD Transmit Data |

    | RTS | Request To Send | 4–5 | CTS Clear To Send |

    | CTS | Clear To Send | 5 <--4 | RTS Request To Send |

    | DSR | Data Set Ready | 6 | |


    | DCD | Carrier Detect | 8 <--20 | DTR Data Terminal Ready |

    | SG | Signal Ground | 7--7 | SG Signal Ground |

    | DSR | Data Set Ready | |


    DTR Data Terminal Ready 20 - 8 DCD Carrier Detect'
- md: "\nIf you have a DB9 connector on your serial port, try the following:\n\n|\
    \ DB9 | | Terminal DB25 | | |\n|---|---|---|---|---|\n| RxD | Receive Data | 2\
    \ <-- | TxD | Transmit Data |\n| TxD | Transmit Data | 3--3 | RxD | Receive Data\
    \ |\n| SG | Signal Ground | 5--7 | SG | Signal Ground |\n\nAlternatively, a full\
    \ DB9-DB25 null modem cable (Not likely to work with terminal hardware handshaking;\
    \ see above):\n\n| DB9 | | Terminal DB25 | | |\n|---|---|---|---|---|\n| RxD |\
    \ Receive Data | 2 <-- | TxD | Transmit Data |\n| TxD | Transmit Data | 3--3 |\
    \ RxD | Receive Data |\n| | | 6 | DSR | Data Set Ready |\n| DTR | Data Terminal\
    \ Ready | 4--8 | DCD | Carrier Detect |\n| GND | Signal Ground | 5--7 | GND |\
    \ Signal Ground |\n| DCD | Carrier Detect | 1 | | |\n| DSR | Data Set Ready |\
    \ 6 <--20 | DTR | Data Terminal Ready |\n| RTS | Request To Send | 7--5 | CTS\
    \ | Clear To Send |\n| CTS | Clear To Send | 8 <--4 | RTS | Request To Send |\n\
    | (RI) | Ring Indicator | 9 not needed | | |\n\n(Yes, the pins 2 and 3 *really*\
    \ do the opposite meanings in DB9 connectors than in DB25 connectors!\n\nIf you\
    \ are not using a null modem cable, you might have to do the following trick:\
    \ on your side of the connector, connect RTS and CTS together, and also connect\
    \ DSR, DCD and DTR together. This way, when the computer wants a certain handshaking\
    \ signal, it will get it (from itself).\n\nNow that you have the right kind of\
    \ cable, connect your terminal to your computer. If you can, tell the terminal\
    \ to ignore modem control signals. Try using 9600 bps, 8 data bits, 1 stop bit,\
    \ no parity bits for the terminal's setup (or enable parity if you want to be\
    \ more sophisticated).\n\n## 8.2 Setting up getty (part of getty_ps)\n\nConsult\
    \ your getty manual for other getty programs such as getty. Add entries for getty\
    \ to use for your terminal in /etc/getdefs if there aren't already there:\n\n\
    # # 38400 bps Dumb Terminal entry\nDT38400# B38400 CS8 CLOCAL # B38400 SANE -ISTRIP\
    \ CLOCAL ##S @L login:\n#DT38400\n\n# 19200 bps Dumb Terminal entry\nDT19200#\
    \ B19200 CS8 CLOCAL # B19200 SANE -ISTRIP CLOCAL ##S @L login:\n#DT19200\n\n#\
    \ 9600 bps Dumb Terminal entry\nDT9600# B9600 CS8 CLOCAL # B9600 SANE -ISTRIP\
    \ CLOCAL ##S @L login:\n#DT9600\n\nIf you want, you can make getty print interesting\
    \ things in the login banner. In my examples I have the system name and the serial\
    \ line printed. You can add others:\n\n- @B The current bps (evaluated at the\
    \ time seen)\n- @D The current date, in MM/DD/YY.\n- @L The serial line to which\
    \ getty is attached.\n- @S The system name.\n- @T The current time, in HH:MM:SS\
    \ (24-hour).\n- @U The number of currently signed-on users\n- @V The value of\
    \ VERSION, as given in the defaults\n- @ character or '@'.\n\nWhen you are editing\
    \ /etc/getdefs, you can verify that the syntax is correct by doing:\n\n```\nlinux#\
    \ -c /etc/getdefs\n```\n\nMake sure there is no getty config for the serial port\
    \ that your terminal is attached to (/etc/default/tty or /etc/conf/tty), as this\
    \ will probably interfere with running on a terminal. Remove the file if it exists.\
    \ Edit your /etc/init to run getty on the serial port (substituting port for speed,\
    \ and default terminal type):\n\n```\nS1:4,respawn:/bin/getty ttyS19600\n```\n\
    \nRestart init:\n\n```\nlinux# q\n```\n\n 88 Modem and Serial Communications\n\
    \nAt this point, you should see a login prompt on your terminal. You may have\
    \ to hit return to get the terminal's attention.\n\n## 8.3 Notes On Setting Up\
    \ A PC As A Terminal\n\nMany people set up other PCs as terminals connected to\
    \ Linux boxes. For example, old 8088 or 8086 PCs are perfect for this purpose.\
    \ All you need is a boot disk containing a version of DOS suitable for your terminal,\
    \ and a communications program for your terminal PC to run. Kermit works well\
    \ for this purpose. You can find pre-compiled versions of Kermit for every OS\
    \ at http://www.columbia.edu/k/. Other popular DOS programs such as telix and\
    \ procomm will work equally well. Be sure to input correct serial port information\
    \ into your terminal's setup.\n\n## 9. Can I Use More Than Two Serial Devices?\n\
    \nYou don't need to read this section unless you want to use three or more serial\
    \ devices (assuming you don't have a multiport board).\n\nProviding you have another\
    \ serial port, yes you can. The number of serial ports you use is limited by the\
    \ number of interrupts (IRQs) and port I/O addresses we have to use. This is not\
    \ a Linux limitation, but a limitation of the PC bus. Each serial device must\
    \ be assigned its own interrupt. If two devices share the same interrupt, it may\
    \ work OK provided the two devices are not operating at the same time (in most\
    \ cases, the programs must not be running at the same time). A serial device can\
    \ be an internal modem, or a multiport serial board.\n\nMultiport serial boards\
    \ are specially designed to have multiple serial ports that share the same IRQ\
    \ for all ports on the board. Linux gets data from them by using a different I/O\
    \ address for each port on the board.\n\n### 9.1 Choosing Serial Device Interrupts\n\
    \nYour PC will normally come with tty0 and tty2 at IRQ 4, and tty1 and tty3 at\
    \ IRQ 3. You can see what IRQs are in use by typing: /dev/tty2. Looking at /proc/interrupts\
    \ will show some of them. To use more than two serial devices, you will have to\
    \ reassign an interrupt. A good choice is to reassign an interrupt from your parallel\
    \ port. Your PC normally comes with IRQ 5 and IRQ 7 set up as interrupts for your\
    \ parallel ports, but few people use two parallel ports. You can reassign one\
    \ of the interrupts to a serial device, and still happily use a parallel port.\
    \ You will need the setserial program to do this. In addition, you will have to\
    \ play with the jumpers on your boards; check the docs for your board. Set the\
    \ jumpers to the IRQ you want for each port.\n\nYou should set things up so that\
    \ there is one, and only one interrupt for each serial device. Here is how Greg\
    \ set his up in /etc/rc.d/local—you should do it in a file which runs startup:\n\
    \n```\n/bin/setserial /dev/ttyS0 irq 3      # serial mouse\n/bin/setserial /dev/ttyS1\
    \ irq 4      # my Wyse dumb terminal\n/bin/setserial /dev/ttyS2 irq 5      # my\
    \ Zoom modem\n/bin/setserial /dev/ttyS3 irq 9      # my USR modem\n```\n\nIRQ\
    \ assignments:\n\n| IRQ | |\n|---|---|\n| IRQ 0 | Timer channel 0 |\n| IRQ 1 |\
    \ Keyboard |\n| IRQ 2 | Cascade for controller 2 |\n| IRQ 3 | Serial port 2 |\n\
    | IRQ 4 | Serial port 1 |\n| IRQ 5 | Parallel port 2 |\n| IRQ 6 | Floppy diskette\
    \ |\n| IRQ 7 | Parallel port 1 |\n| IRQ 8 | Real-time clock |\n| IRQ 9 | Redirected\
    \ |\n| IRQ 10 | not assigned |\n| IRQ 11 | not assigned |\n| IRQ 12 | not assigned\
    \ |\n| IRQ 13 | Math coprocessor |\n| IRQ 14 | Hard controller 1 |\n| IRQ 15 |\
    \ Hard controller 2 |\n\nThere is really no thing to do when choosing interrupts.\
    \ Just make sure it isn't used by the motherboard, 2, 3, 4, 5, 7, 8, 13, or 14!\
    \ Also note that IRQ 2 is the same as IRQ 9. If you have a 16-bit bus, you can\
    \ also use IRQ 10, 11, 12, or 15.\n\nThe Linux Serial HOWTO\n\n### 9.2 Setting\
    \ Serial Device Addresses\n\nNext, you must set the port address. Check the manual\
    \ on your board for the jumper settings. Like interrupts, there can only be one\
    \ serial device at each address. Your ports will usually come configured as follows:\n\
    \n```\nttyS0 address 0x3f8\nttyS1 address 0x2f8\nttyS2 address 0x3e8\nttyS3 address\
    \ 0x2e8\n```\n\nChoose which serial device you want to have and set the jumpers\
    \ accordingly. I have my modem on ttyS3, my mouse on ttyS0, and my terminal on\
    \ ttyS2.\n\nWhen you reboot, Linux should give your serial ports at the address\
    \ you set. The Linux ques may not correspond to the IRQ you set with the jumpers.\
    \ Linux does not give any IRQ detection when it boots because IRQ detection is\
    \ dicey and can be fooled. Use setserial to tell Linux which IRQ you are using.\
    \ You can check /proc/ioports to see what I/O port addresses are after Linux boots.\n\
    \n 10. How Do I Set Up My Serial Ports For Higher Speeds? What Speed Should I\
    \ Use With My Modem?\n\nThis section should help figure out what speed to use\
    \ when using your modem with a communications program, or with a getty program.\
    \ Normally you just set the speed by a parameter given to getty or by a menu in\
    \ your communications program (or for some reason doesn't work for high speeds,\
    \ there is a workaround by giving special options to setserial: With the spd_hi\
    \ or spd_vhi options to setserial, 38400 will actually set the speed to 57600\
    \ (spd_hi) or 115200 (spd_vhi)).\n"
