    这里将适用于由调制解器本身进行压缩的情况，因为为了让调制解器在 Linux 下工作，必须这样做。


    为了通过电话线更快地发送数据，可以使用自定义的编码方案进行压缩（编码），该方案本身取决于数据内容。编码后的数据比原始数据小（字节数更少），可以在更短的时间内通过互联网发送。这个过程被称为“数据压缩”。


    如果你从互联网下载文件，它们很可能已经过压缩，调制解器对其进行进一步压缩是不可行的。你的调制解器可能会提示通过你的数据已经过压缩，并停止尝试再次压缩。如果你接收到由另一个调制解器压缩的数据，你的调制解器将将其解压，产生的字节比通过电话线发送的更多。因此，从你的调制解器到电脑的数据流将高于通过电话线传输给你的数据流。这种流的比例被称为压缩率。压缩率可以达到
    4，但并不常见。


    ## 2.6 错误纠正


    与数据压缩类似，调制解器可以设置为进行错误纠正。虽然会有开销成本降低字节/秒的传输速率，但错误纠正会剥离起始位和停止位，这实际上增加了数据字节/秒的传输速率。


    对于串口与外部世界的接口，每个 8 位字节都会额外增加 2 位：一个起始位和一个停止位。在没有错误纠正的情况下，这些额外的起始和停止位通常会直接通过调制解器并通过电话线。当启用错误纠正时，这些额外位会被剥离，8
    位字节被放入数据包中。这种方式更有效，尽管为了数据包头和纠正目的又增加了一些字节，但它能带来更高的字节/秒传输率。


    ## 2.7 数据流（速度）


    数据（代表字母、图片等的字节）从你的电脑流向调制解器，然后传到电话线（反之亦然）。流速率（如 56k (56000) bits/sec）被（错误地）称为“速度”。但几乎每个人都说“速度”而不是“流速率”。如果没有数据压缩，从电脑到调制解器的流速率将与电话线上的流速率相同。


    实际上，在你的电话线端有两种不同的速度需要考虑：


    - 电话线本身的速度（DCE 速度）：调制解器到调制解器

    - 从你的电脑串口到调制解器的速度（DTE 速度）


    ## 调制解器使用指南（针对 Linux）


    当你拨号并连接电话线另一端的调制解器时，你的调制解器通常会向你发送类似“CONNECT 28800”或“CONNECT 115200”的消息。这些是什么意思？嗯是
    DCE 速度或 DTE 速度。如果它高于广告的调制解器速度，它必须是 DTE 调制解器到电脑的速度。上面的 115200 就是这种情况。28800 必须是
    DCE（调制解器到调制解器）速度，因为串口没有这种速度。人们可以配置调制解器报告每种速度 ??


    如果你有一个内置调制解器，你可能不会预计调制解器到电脑的 DTE 速度会有任何限制，因为调制解器在电脑内部，几乎是电脑的一部分。但事实确实如此，因为调制解器内部包含一个专用的串口。


    重要的是，平均速度小于指定的速度，特别是在较短的 DTE 电脑到调制解器线路上。等待（或空闲时间）会导致平均速度。这些等待可能包括由于流控制（Flow Control）导致的可能一秒等待。在极端情况下，可能会几微秒的极短等待（空闲时间），分隔一个字节的结束和下一个字节的开始。此外，如果电话线状况较差，调制解器将回退到较低速度。


    当你拨号并连接电话线另一端的调制解器时，你的调制解器通常会向你发送类似“CONNECT 28800”或“CONNECT 115200”的消息。这些是什么意思？嗯是
    DCE 速度或 DTE 速度。如果它高于广告的调制解器速度，它必须是 DTE 调制解器到电脑的速度。上面的 115200 就是这种情况。28800 必须是
    DCE（调制解器到调制解器）速度，因为串口没有这种速度。人们可以配置调制解器报告每种速度 ??


    如果你有一个内置调制解器，你可能不会预计调制解器到电脑的 DTE 速度会有任何限制，因为调制解器在电脑内部，几乎是电脑的一部分。但事实确实如此，因为调制解器内部包含一个专用的串口。


    重要的是，平均速度小于指定的速度，特别是在较短的 DTE 电脑到调制解器线路上。等待（空闲时间）会导致平均速度。这些等待可能包括由于流控制（Flow Control）导致的可能一秒等待。在极端情况下，可能会几微秒的极短等待（空闲时间），分隔一个字节的结束和下一个字节的开始。此外，如果电话线状况较差，调制解器将回退到较低速度。


    ## 2.8 流控制


    流控制意味着在不丢失数据的情况下停止流。


    ### 流控制解释


    例如，考虑使用 ASCII 控制字符 DC1（开始）和 DC3（停止）来实现此目的。由于编码后的数据比原始数据小（字节数更少），可以在更短的时间内通过互联网发送。这种方法更有效。软件流控制不仅反应较慢，而且除非采取特殊措施，否则也不允许通过调制解器传输二进制数据。由于二进制数据可能包含
    DC1 和 DC3，必须采取特殊措施来区分属于二进制代码一部分的 DC3。对于 DC1 也是如此。要让软件流控制对二进制数据生效，需要调制解器（硬件）和软件的支持。

