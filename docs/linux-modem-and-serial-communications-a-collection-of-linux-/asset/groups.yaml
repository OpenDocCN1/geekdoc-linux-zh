    ## 11. What Are UARTs? How Do They Affect Performance?


    UARTs (Universal Asynchronous Receiver Transmitter) are serial chips on your PC
    motherboard (or on an internal modem card). The UART function may also be done
    on a chip that does other things like order. On older computers like 486s, the
    chips are on the disk I/O controller card. Still older computer have dedicated
    boards.


    The UART''s purpose is to convert bytes from the PC''s parallel bus to a serial
    bitstream. The cable going out of the serial port has only one wire for each direction
    of flow. The port sends out a stream of bits, one bit at a time. Conversely, the
    bit that enters the serial port via the external cable is converted to parallel
    bytes that the computer can understand. UARTs deal with data in sized pieces,
    which conveniently also the size of ASCII characters.


    Say you have a terminal hooked up to your PC. When you type a character, the terminal
    gives that character to transmitter (also a UART). The transmitter sends that
    byte onto the serial line, one bit at a time, at a specific rate. On the PC end,
    the receiving UART takes all the bits and rebuilds the (parallel) byte and puts
    it in a buffer.


    There are two basic types of UARTs: dumb UART and FIFO UARTs. Dumb UARTs are the
    8250, 16450, early 16550, and early 16650. They are obsolete but if you understand
    how they work it''s easy to understand how the modern works with FIFO UARTs (late
    16550, 16550A, 16c552, late 16650, 16750, and 16950).


    There is some confusion regarding 16550. Early models had a bug and worked properly
    only as 16450''s. Later models with the bug fixed were named 16550A but many manufacturers
    did not accept the name change and continued calling it 16550. Most 16550s in
    use today are like 16550AS. Linux will report it as being a 16550A even when your
    hardware (or a label note) says it''s a 16550. A similar situation exists for
    the 16650 (it''s only since the manufacturer allegedly didn''t admit anything
    was wrong). Linux will report a late 16650 as being a 16650V2. If it reports as
    16500 it is bad news and used as if it has a one-byte buffer.


    To understand the differences between dumb and FIFO (First In, First Out queue
    discipline) let''s examine what happens when a UART has sent or received a byte.
    The UART itself can''t do anything with the data passing thru it, it just receives
    and sends it. For the original dumb UARTS, the CPU gets an interrupt from the
    serial device every time a byte has been sent or received. The CPU moves the received
    byte out of the UART''s buffer and into memory somewhere, or gives the UART another
    byte to send. The 8250 and 16450 UARTS have only a 1 byte buffer. That means,
    every time a byte is sent or received, the CPU is interrupted. At low transfer
    rates this is OK. But at high rates, the CPU gets busy dealing with the UART,
    that doesn''t have time to adequately tend to other tasks. In some cases, the
    CPU does not get around to servicing the interrupt in time, and the UART is overwritten,
    because they are coming in so fast. This is called an "overrun" or "overflow".


    That''s where the FIFO UARTS are useful. The 16550 FIFO chip comes with 16 byte
    buffers. This means it can receive or send (16 bytes) before it [re-interrupts]
    the CPU. Not only can it wait but the CPU can then receive 14 (or more) bytes
    at a time. Although the interrupt threshold (trigger level) may be set at 8 instead
    of 14, this is still a significant advantage over the other UARTS, which have
    only 1 byte buffer. The CPU receives more interrupts, and is free to do other
    things. Data is lost, and everyone is happy.


    While most PC''s have a 16550 with 16-byte buffers, better UARTS have even larger
    buffers. Note that the interrupt is issued slightly before the buffer get full
    (say a "trigger level" of 14 bytes for a 16-byte buffer). This allows for a few
    more bytes to be received during the time that the interrupt is being serviced.
    The trigger level may be set to various permitted values by kernel software. The
    trigger level of 1 will almost like a dumb UART (except that it still has room
    for 15 more bytes after it issues the interrupt).


    If you type something while visiting a BBS, the characters you type out thru the
    serial port. Your typed characters that you see on the screen were echoed back
    thru the phone line your modem and then your serial port to the screen. If you
    had a 16-byte buffer on the serial port which held back characters until it had
    14 of them, you would need to type many characters before you see what you typed
    (before they appeared on the screen). This would be very confusing but there is
    a "timeout" to prevent this. You normally just see a character on the screen just
    as you type it.


    The "timeout" works like this for the UART buffer: If characters arrive one after
    another, then an interrupt is issued only when the 14th character reaches the
    buffer. But if a character arrives and the next character doesn''t arrive soon
    thereafter, then an interrupt is issued. This happens even though there are not
    14 characters in the buffer (there may only be one character in it). Then what
    you type goes thru this buffer, it acts like a 1-byte buffer even when it actually
    actually (unless your typing is a hundred times faster than normal). There is
    also "timeout" for the transmit buffer as well.


    # Linux Modem and Serial Communications


    Here''s a list of UARTs. TL is Trigger Level


    | UART Type | Description |

    | :--- | :--- |

    | 8250, 16450, early 16550 | Obsolete with extra buffers, TL=1,4,8,14 |

    | 16550, 16550A, 16c552 | 16-byte buffers, TL=1,4,8,14 |

    | 16650 | 32-byte buffers. Speed up to 460.8 Kbps |

    | 16750 | 64-byte buffer for send, 56-byte for receive. Speed up to 921.6 Kbps
    |

    | Hayes ESP | 1K-byte buffers |


    The obsolete ones are only good for modems no higher than 14.4k (DTE speeds up
    to 38400 bps). For modern modems you need at least a 16550 (and not an early 16550).
    For V.90 modems it may be several percent faster with a 16550 (especially if you
    are downloading uncompressed files). The main advantage of the 16550 is its larger
    buffer size as the extra speed isn''t needed unless the modem compression ratio
    is high. Some 56k internal modems may come with a 16550?


    Non-UART, and intelligent multiport boards use DSP chips to additional buffering
    and control, relieving the CPU even more. For example, the Cyclades, Cirrus Logic,
    and others.


    Most PC''s have a 16550 with 16-byte buffers, better UARTS have even larger buffers.
    Note that the interrupt is issued slightly before the buffer get full (say a "trigger
    level" of 14 bytes for a 16-byte buffer). This allows for a few more bytes to
    be received during the time that the interrupt is serviced.


    ## 12. Troubleshooting


    ### 12.1 Software


    - modemstat show the current state of various signal lines (such as DTR, CTS)

    - irqt will give serial higher priority

    - hdparm for hard-disk may help


    ### 12.2 My Modem is Physically There but Can''t be Found


    For the PCI bus look at /proc/pci. Otherwise see What is the I/O? Here are some
    common mistakes:


    - setserial: They run it (without the "autoconfig" option) and see it displayed
    on the screen at boot time and erroneously think that hardware is configured.

    - /proc/interrupts: When their modem isn''t in use they don''t see their modem''s
    interrupt there and erroneously conclude that modem can''t be found.

    - /proc/ports: People think this hardware configuration when it only shows the
    same data (possibly erroneously) as setserial.


    ### 12.3 "Operation not supported by device" (error message) for tSx


    This means that an operation requested by serial, etc. couldn''t be done because
    the kernel doesn''t supporting it. A common reason is that the "serial" module
    wasn''t loaded at the time. Ismod will show you if it''s now loaded but sometimes
    it is automatically loaded when needed so it may be loaded but wasn''t when you
    got the error message. The "serial" module should be listed in the file: /etc/modules.conf.
    The actual module should reside in: /lib/modules/.../misc/serial.o


    ### 12.4 Slow: Text appears on the screen slowly after long delays


    This will happen from the very start of using the modem. One symptom happens when
    you are manually typing to your modem: You type but the screen remains blank (until
    after several seconds you finally see what you typed). Another symptom is that
    only a few words at a time appear on the screen (possibly with missing text).


    This may be due to a mis-set IRQ. This means that the IRQ used by the device driver
    does not correct the IRQ set in hardware (IRQ mis-set). With a mis-set IRQ you
    may lose received data and get "input overrun" error messages (or find them in
    logs).

