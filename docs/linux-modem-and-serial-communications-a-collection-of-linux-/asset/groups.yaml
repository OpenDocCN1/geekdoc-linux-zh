    # # 1. Introduction


    This is the Linux Serial HOWTO. This covers info on the Serial Port that is not
    available in other HOWTO''s. It includes how to set up modems under Linux, some
    serial tips, and troubleshooting advice. Another HOWTO exists for terminals (see
    Related HOWTO''s). This HOWTO addresses Linux running on Intel x86 hardware, although
    it might work for other architectures.


    # ## 1.1 Copyright


    Copyright (c) 1993–1997 by Greg Hanks, 1998 by David Lawyer. This document may
    be distributed under the terms set forth in the LDP at http://sunsite.unc.edu/LDP/COPYRIGHT.html.
    This document may not be distributed in modified form without consent of the author.


    # ## 1.2 Related HOWTO''s re: the Serial Port


    +   - Serial-Programming-HOWTO helps you write C programs (or parts of them) that
    handle the serial port. You may not be the equivalent of "stty...", open ports
    in various modes,

    - Text-Terminal-HOWTO is all about character-cell terminals (dumb terminals)?


    # ## 1.3 Release Notes


    I, David Lawyer, am the new maintainer (Greg Hanks was the original author and
    maintainer). This is a minor revision and I haven''t checked out much of the info
    to see if it''s up-to-date. There is much work to do on this. I know what''s wrong
    or missing. In the future, I may do a 3-way split on this HOWTO: 1. Info on terminals
    into Text-Terminal-HOWTO. 2. Info on modems into a new HowTO: Modem-HOWTO. 3.
    More on the Serial Port added to this HowTO. Thus look for major new versions
    in Aug, or Sept 1998.


    # ## 1.4 New Versions Of This Document


    New versions of the Serial HOWTO will be available at ftp://sunsite.unc.edu/pub/Linux/docs/H-OWTO/Serial-HOWTO
    and mirror sites. There are other formats, such as Postscript and DVI versions
    in the other-formats directory. The Serial HOWTO is also available at http://sunsite.unc.edu/u/LDP/HOWTO/Serial-HOWTO.html
    and will be posted to comp.os.linux.answers monthly.'
  - '[PAGE 91]


    68 Linux Modem and Serial Communications


    # 1.5 Feedback


    Please send me any questions, comments, suggestions, or additional material. I''m
    always eager to hear about what you think about this HOWTO. I''m always on the
    lookout for improvements! Tell me exactly what you don''t understand, or what
    could be clearer. You can reach me at bf347@lafn.org (David Lawyer) via email.


    # 1.6 Disclaimer


    Your mileage may vary. The answers given may not work for all systems and all
    setup combinations.


    # 2. Supported Serial Hardware


    Linux is known to work with the following serial hardware.


    # 2.1 Standard PC Serial Boards


    +   - standard PC serial boards (COM1–COM4), to which external serial devices
    (modems, serial mice, etc...) can be connected. Since PC''s no longer come with
    them (but have the chips for this purpose mounted on the motherboard), they are
    hard to find in retail stores.

    - standard PC internal models (COM1–COM4)

    - Quickpath Systems Port-Folio 550e (allows IRQs of 3, 4, 5, 9, 10, 11, 12, and
    15)


    Note: due to address conflicts, you cannot use COM4 and IBM8514 board simultaneously.
    This is due to a bug in the IBM8514 board.


    # 2.2 Plug And Play (PnP) Modes


    Most modernos today are PnP and will (with some effort) work with Linux. It''s
    best to get one that has jumpers (shunts) to disable PnP. In many cases, if you
    simply set the jumpers for a certain COM number and IRQ number, this will disable
    PnP. You may also want (need ??) to disable PnP in your computer''s BIOS. If you
    can''t disable PnP then you may try:


    +   - Boot Win95/98, configure the modem, and see if the settings are preserved
    when you boot Linux. If not, then:'
