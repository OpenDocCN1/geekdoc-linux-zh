    ## 1.4 什么是调制解调器？


    调制解调器是一种通过电话线传输数字信号的设备。如果电话线全是数字信号，你就不需要调制解调器了。它允许你的电脑与外部世界连接并通信。PC 的调制解调器有两种基本类型：外部和内部。外部位于电脑外部，内部位于电脑内部。外部调制解调器插入电脑上称为“串口”的接口。内部调制解调器是一块插入电脑内部的卡。


    如果电话线全是数字信号，你就不需要调制解调器了。它允许你的电脑与外部世界连接并通信。PC 的调制解调器有两种基本类型：外部和内部。外部位于电脑外部，内部位于电脑内部。外部调制解调器插入电脑上称为“串口”的接口。


    串口不应与“通用串行总线”（USB）混淆，后者使用特殊的接口，未来可能用于调制解调器。有关调制解调器和串口的细节请参见“调制解调器与串口基础”。


    ## 1.5 快速安装


    外部调制解调器


    使用直连线或调制线将调制解调器连接到 PC 上空闲的串口。确保你知道串口名称：COM1 是 ttyS0，COM2 是 ttyS1。你可能需要检查 BIOS
    来确定这一点。插上电源线为调制解调器供电。进一步说明请参见“所有调制解调器”。


    内部调制解调器（在 ISA 总线上）


    （PCI 总线请参阅 PCI 调制解调器）如果调制解调器说它只能在 MS Windows 下工作，那么你就没戏了。如果你已经有两个串口，请将此设置为第三个串口（ttyS2
    = COM）。找到一个可以使用的空闲 IRQ 编号。通常，一个空闲的编号是用于第二个并行端口或声卡的 IRQ5（你可能没有这些）。然后将内部调制解调器上的跳线帽（或类似设置）设置为空闲的
    IRQ 和 I/O 地址 3E8 (ttyS2)。


