    By default, getty_ps will be configured to be Linux FSSTND (File System Standard)
    compliant, which means that the binaries will be in /sbin, and the config files
    will be named /etc/conf.[u]getty.ttyN. This is not apparent from the documentation!
    It will also expect lock files to go in /var/lock. Make sure you have the /var/lock
    directory.


