    # 16. Appendix A: How Modems Work (technical) (unfinished)


    # 16.1 Modulation Details


    Introduction


    Modulation is the conversion of a digital signal represented by binary bits (0
    or 1) into an analog something like a sine wave. The modulated signal consists
    pure sine wave "carrier" signal which is modified to convey information. A pure
    carrier sine wave, unchanging in frequency and voltage, pro- vides no flow of
    information at all (except that a carrier is present). To make it convey information
    we modify by frequency. There are 3 basic types of modulation: frequency, amplitude,
    and phase. They will be explained next.


    Frequency Modulation


    The simplest modulation method is frequency modulation. Frequency is measured
    in cycles per sec- ond (of a sine wave). It''s the count of the number of times
    the sine wave repeats itself in a sec- ond. This is the same as the number of
    times it reaches peak value in a second. The word "Hertz" (abbreviated Hz) is
    used to mean "cycles per second".


    A simple example of frequency modulation is where one frequency means a 0 and
    another means a 1. For example, for some obsolete 300 baud modems 1070 Hz meant
    a binary 0 while 1270 Hz meant a binary 1. This was called "frequency shift keying".
    Instead of just two frequencies, more could be used to allow more information
    to be transmitted. If we had 4 different frequencies (call A, B, C, and D) then
    each frequency could stand for a pair of bits. For example, to send 00 one would
    use frequency A. To send 01 use frequency B; for 10 use C; for 11 use D. In this
    manner, by using 8 different frequencies we could send 3 bits with each shift
    in frequency. Each time we double the number of possible frequencies we increase
    the number of bits it can represent by 1.


    Amplitude Modulation


    Once one understands frequency modulation example also including the possibilities
    of represent- a few bits by a single shift in frequency, it''s easier to understand
    both amplitude modulation and phase modulation. For amplitude modulation, one
    just changes the height (voltage) of the sine wave analogous to changing the frequency
    of the sine wave. For a simple case there could only be 2 allowed amplitude levels,
    one representing a 0-bit and another representing a 1-bit. As explained for the
    case of frequency modulation, having more possible amplitudes will result in more
    information being transmitted.'
  - '[PAGE 81]


    # Phase Modulation


    To change the phase of a sine wave at a certain instant of time, we stop sending
    this old sine wave and immediately begin sending a new sine wave of the same frequency
    and amplitude. If we started sending the new sine wave at the same voltage level
    (and slope) as existed when we stopped sending the old sine wave, there would
    be no change in phase (and no detectable change at all). But suppose that we started
    the new sine wave at a different point in the time where the old sine wave stopped
    and the new wave began. This is a phase shift and it''s measured in degrees (deg).
    A 0 deg, (or a 360 deg.) phase shift means no change at all while a 180 deg, phase
    shift just reverses the voltage (and slope) of the sine wave. Put another way,
    a 180 deg, phase shift just skips over a half-period (180 deg) at the point of
    transition. Of course we could just skip over 90 deg, or 135 deg, etc. As in the
    example for frequency modulation, the more possible phase shifts, the more bits
    a single shift in phase can represent.


    # Combination Modulation


    Instead of just selecting frequency, amplitude, or phase modulation, we might
    choose to combine modulation methods. Suppose we have 256 possible frequencies
    and thus can send a byte (8 bits) for each shift in frequency (since 2 to the
    8 is 256). Suppose also that we have another 256 different amplitudes so that
    each shift in amplitude represents a byte. Also suppose there are 256 possible
    shifts. Then at certain points in time we make a shift in all 3 things: frequency,
    amplitude and phase. This would send out 3 bytes for each such transition.


    No modulation in use today actually does this. It''s not practical due to the
    relatively long time it would take to detect all3 types of changes. But what is
    common is the simultaneous change in both phase and amplitude. This is called
    phase-amplitude modulation (sometimes called quadrature amplitude modulation =
    QAM). This method is used for the common speeds of 14.4k, 28.8k, and 33.6k. The
    only significant case where this modulation is not used today is for 56k modems.
    Even 56k modems exclusively use QAM (phase-amplitude modulation) in the direction
    from your PC out the telephone line. Sometimes even the other direction will also
    fall back to QAM when line conditions are not good enough. Thus QAM (phase-amplitude
    modulation) remains the most widely used method on ordinary telephone lines.


    # 56k Modems (v.90)


    The modulation method used above 33.6k is entirely different from the common phase-amplitude
    modulation. The details of exactly how it works seem to obscure and I couldn''t
    find them on the Internet as of late 1998. The basic idea behind it is easy to
    understand. Since ordinary telephone'
- md: '

    Calls are converted to digital signals at the local offices of the telephone company.
    The fastest speed that you can send digital data by an ordinary telephone call
    is the same speed that the telephone company uses over its digital portion of
    the phone call transmission. What is this speed? Well, in the USA it''s exactly
    56k! In other countries it may be slightly higher.


    Thus in the USA 56k is the absolute top speed for an ordinary telephone call using
    the digital portion of the circuit that was designed to send digital encodings
    of the human voice. In order to use 56k, the modem must know exactly how the telephone
    company is doing its digital encoding.


    ## Appendix B: "baud" vs. "bps"


    "baud" and "bps" are perhaps one of the most misused terms in computing and telecommunications.
    Many people use these terms interchangeably when in fact bps is the number of
    bits per second. Baud rate is a measure of how many times per second signal changes
    (or transitions). For a typical serial port a 1-bit is -12 volts and a 0-bit is
    +12 volts. If the bps is 38,400 a sequence of 010101 would also be 38,400 baud
    since the voltage shifts back and forth from positive to negative... and are 38,400
    shifts per second. For another sequence 11100011 there will be fewer shifts of
    38,400 because the voltage just stays at -12 volts. We say that the number of
    changes per second is actually 64k bit/sec only 56k can be controlled by the user.


    What does the modem use to encode analog signals? A method of sampling the analog
    signal at a rate of 8000 samples per second. Each amplitude is encoded as a 7-bit
    byte (Note: 7 x 8000 = 56000). This is called Pulse Code Modulation = PCM. These
    bytes are then sent on the telephone company''s digital circuits where many calls
    share a single circuit known as time division multiplexing. Finally at the local
    telephone office near your home, the digital signal is de-multiplexed resulting
    in the same signal as originally created by PCM. This signal is then converted
    back to analog and sent to your home. Your modem''s task is to figure out exactly
    what digital signal was based on the amplitude. This is (sort of) "amplitude modulation"
    but not really.


    ## Real examples


    The example above is overly simple. Real examples are more complicated but based
    on the same idea. This explains how a modem running at 2400 baud can send 14400
    bps or higher. The modem achieves a bps rate greater than baud by encoding many
    bits in each signal change (or transition). When two or more bits are encoded
    per baud, the bps exceeds the baud rate. If your modem-to-modem connection is
    at 14400 bps, it''s going to be sending 6 bits per signal transmission at 2400
    baud. A speed of 28800 bps is obtained by 3200 baud/baud. When people misuse the
    baud word, they may mean the speed (such as 33.6K). Common bps rates were formerly
    50, 75, 110, 300, 1200, 2400, 9600. These were the bps rates over serial-port-to-modem
    cables. Today the bps-to-modem rates are 14.4K, 28.8K, 33.6K, and 56K, but the
    rates over serial-port-to-modem cables are not the same as 19.2K, 38.4K, 57.6K
    and 115.2K. Using modems with V.42bis compression (max 4:1), rates up to 115.2K
    bps are possible for 33.6K modems (230.4K is possible for 56K modems).


    Except for the 56k modems, most modems run at 2400, 3000, or 3200 baud. Because
    of the bandwidth limitations on voice-grade phone lines, baud rates greater than
    2400 are harder to achieve and only work under conditions of pristine phone line
    quality.


    How did this confusion between bps and baud start? Well, when antique low speed
    modems were high speed, the bps rate actually did equal the baud rate. One bit
    was encoded per phase change. People would use bps and baud interchangeably because
    they were the same number. For example, a 300 bps modem also had a baud rate of
    300. This all changed when faster modems came around and the bit rate exceeded
    the baud rate. "baud" is named after Emile Baudot, the inventor of the asynchronous
    telegraph printer.


    ## Appendix C: Terminal Server Connection


    This section was adapted from Text-Terminal-HOWTO.


    A terminal server is something like an intelligent switch that can connect many
    modems (or terminals) to one or more computers. It''s not a mechanical switch
    as it may change the speeds and protocols of the streams of data that go thru
    it. A number of companies make terminal servers: Xplex, Cisco, 3Com, Computone,
    Livingston, etc. There are many different types and capabilities. Another HOWTO
    is needed to complete and describe them (including the possibility of creating
    your own terminal server with a Linux PC). Most are used for modem connections
    rather than directly connected terminals.


    One use for them is to connect many modems (or terminals) to a high speed network
    which connects to host computers. Of course the terminal server must have computing
    power and software to run network protocols so it is in some ways like a computer.
    The terminal server may interact with the user and ask what computer to connect
    to, or it may connect without asking. Some times end jobs to a printer then a
    terminal server.


    A PC today has enough computing power to act like a terminal server except that
    each serial port should have its own hardware interrupt. PCs only have a few spare
    interrupts for this purpose and since they are hard-wired you can''t create more
    by software. A solution is to use an advanced multi-port serial card which has
    its own system of interrupts (or on lower cost models, shares one of the PC''s
    interrupts between a number of ports). See Serial-HOWTO for more info.

