  - '[PAGE 157]


    # Problems


    If you don''t setup the PATH properly—then the login will fail with GSS_API complaints
    about non-supported checksum type.


    If you don''t make the needed changes to krb5.conf you''ll also get a similar
    error.


    If you are using your PC to dual/triple boot between W95/NT/Linux—the PC''s CMOS
    clock will be altered by Linux—giving continual Kerberos errors if you try & login
    using NT. You need to login using Win95 first (which will fix the CMOS clock settings),
    then you can get in via NT.


    Make sure you setup your PC time correctly in Linux. Note also that the /var/log/messages
    timestamps are a bit strange :) (possibly referenced to (GMT))


    # 3.11 Fibertel, Buenos Aires, Argentina


    This information is provided by Pablo Godel


    My name is Pablo Godel and want report that I''m using the cable service of Fibertel
    in Buenos Aires, Argentina and it works perfectly with Linux.


    They gave me a static IP. The brand of the cablemodem is COM21 and the model is
    ComPort.


    I connect to the nic properly, configured in Linux and it worked perfectly.


    More information about Fibertel can be found at http://www.fibertel.com.ar


    # 3.12 Videotron, Canada


