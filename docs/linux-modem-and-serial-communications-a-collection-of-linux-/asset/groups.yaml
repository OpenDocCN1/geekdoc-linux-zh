  - '[PAGE 130]


    # 3. The Client Side


    At this time, only Windows client setups are described here. On the client PC,
    a COM-port redirection for TCP/IP is required. The best program for this purpose
    I have found is ''DialOut/IP'' from ''Tactical Software'' for Windows 3.1 and
    Windows 95. (The Windows 3.1 version can be used under Windows NT for 16-bit applications
    only. A 32-bit version for Windows NT is due late summer 1997.)


    DialOut/IP presents the shared model on a new virtual COM port that adds to Windows.
    This virtual COM port can be used by Windows programs as if the shared model is
    directly connected. Most client applications (including Windows 95 dial-up networking)
    accept this and as if there were a real COM port and modem, with the exception
    being fax applications or any others that need to UART control lines. DialOut/IP
    can be configured to provide Telnet protocol processing, but that feature allows
    certain modem pool products and not to the Linux setup described in this file.
    Note that, despite its name, DialOut/IP can be used also by applications that
    wait for incoming calls.


    On www.sw.com there is a page for downloading a fully functional evaluation version
    that times out in 1-2 weeks. Installation and configuration is handled by a setup
    program, with installation details in the README.TXT file. When you run DialOut/IP,
    you enter the IP address and port number of the shared modem.


    DialOut/IP is a commercial product that is licensed on a per-modem basis, that
    is, the price depends on the number of modems that you are sharing. The license
    states that you can install the software on any number of PCs'' that access the
    shared modems.


    # 4. Security Considerations


    If you have only one modem for all your hosts in your local area network, there
    is probably no reason to worry about security here. However, if one or more of
    the hosts in your LAN are connected to the internet by other means using the modem
    we have just as a modem server, then security considerations are required, otherwise
    anybody can do a ''telnet your_host modem'' and dial long distance or even international
    calls at his will.


    I suggest to install and configure tcp-wrappers in order to protect the modem
    server against unauthorized access.'
  - '[PAGE 131]


    # 5. Examples


    I am using the setup as described in (2) and (3) to run Quicken on my Windows
    95 ThinkPad and homebanking with the modem attached to my Linux machine. The ''modem''
    in my case is not even a real modem, it is an emulated modem on an ISDN-So card.
    Quicken just sees COM port, it doesn''t know that the device attached to the COM
    port is actually at the other end of my Ethernet LAN, nor does it know that it
    is not a standard analog modem but an ISDN device which happens to understand
    ''AT'' commands.'
