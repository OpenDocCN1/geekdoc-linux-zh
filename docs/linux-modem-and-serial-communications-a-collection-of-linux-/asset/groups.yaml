    ### 1.2 关于串口的相关 HOWTO


    - Serial-Programming-HOWTO 帮助你编写处理串口的 C 程序（或其部分）。你可能不需要等同于 "stty..." 的操作，以各种模式打开端口。

    - Text-Terminal-HOWTO 都是关于字符单元终端（哑终端）的吗？


    ### 1.3 发布说明


    我，David Lawyer，是新的维护者（Greg Hanks 是原作者和维护者）。这是一次小幅修订，我没有仔细检查大部分信息以确认其为最新。这方面还有很多工作要做。我知道哪里有错或缺失了内容。在未来，我可能会对本
    HOWTO 进行三分拆：1. 将终端信息移入 Text-Terminal-HOWTO。2. 将调制调器信息移入新的 HowTO：Modem-HOWTO。3.
    将更多关于串口的内容添加到本 HOWTO 中。因此，请关注 1998 年 8 月或 9 月的重大新版本。


    ### 1.4 本档的新版本


    Serial HOWTO 的新版本将在 ftp://sunsite.unc.edu/pub/Linux/docs/H-OWTO/Serial-HOWTO 和镜像站点可用。还有其他格式，例如
    other-formats 目录下的 Postscript 和 DVI 版本。Serial HOWTO 也可以 http://sunsite.unc.edu/u/LDP/HOWTO/Serial-HOWTO.html
    获取，并每月发布到 comp.os.linux.answers。


    68 Linux 调制调器与串口通信


    ## 1.5 反馈


    请向我发送任何问题、意见、建议或额外材料。我总是渴望听听你对这个 HOWTO 的看法。我一直在寻找改进之处！告诉我你哪里不明白，或者哪里可以更清楚。你可以通过电子邮件
    bf347@lafn.org (David Lawyer) 联系我。


    ## 1.6 免责声明


    视情况而异。所提供的答案可能并不适用于所有系统和组合。


    ## 2. 支持的串口硬件


    Linux 已证明支持以下串口硬件。


    ### 2.1 标准 PC 串口卡


    - 标准 PC 串口卡 (COM1–COM4)，可以连接外部串口设备（调制调器、串口鼠标等）。由于 PC 不再配备这些卡（但主板上集成了此功能的芯片），在零售商店很难找到。

    - 标准 PC 内部 (COM1–COM4)

    - Quickpath Systems Port-Folio 550e（允许 IRQ 3, 4, 5, 9, 10, 11, 12 和 15）


    注意：由于地址冲突。


    ### 2.2 即插即用 (PnP)


    大多数都是 PnP，但在某些情况下，终端服务器默认期望呼叫者使用 PPP 包，而真实的终端并不会产生此类包。


    ### 2.3 哑串口


    - 标准 PC 串口卡 (COM1–COM4)

    - 标准 PC 内部 (COM1–COM4)


    ### 2.4 智能多端口卡


    Linux 调制调器与串口通信


    - 标准 PC 串口卡 (COM1–COM4)

    - 标准 PC 内部 (COM1–COM4)


