    ## 12.6 拨号时：我一直收到 "line of inittab invalid"


    确保你使用的是适用于你的 init 版本的正确语法。目前使用的不同的 init 在 /etc/inittab 文件中使用着不同的语法。


    ## 12.7 当我尝试拨出时，显示 "/dev/ttyS: Device or resource busy"


    当 DCD 或 DTR 实现不正确时，可能会出现此问题。只有在存在实际连接（如果有人拨入）时，DCD 才应该是开启的（断言），而不是在 getty 监听端口时开启。确保你的调制调器配置为：仅当有
    getty、kermit 或其他程序使用串口时才断言 DCD。“设备忙”（"device busy"）错误的另一个常见原因是你在设置串口端口时，其中断已被其他程序占用。当每个设备初始化时，Linux
    都会请求使用其硬件的权限，如果该权限已在占用，你的设备将无法正常初始化。设备本身并没有太好的方法来告诉你发生了这种情况，除了在你尝试使用它时，它会返回“device-busy”错误。检查你所有板卡的中（串口、以太网、SCSI
    等）。查找 IRQ 冲突。


    ## 12.8 我一直收到 Getty respawning too fast: 已禁用几分钟


    确保你的调制调器配置正确。查看寄存器。这可能发生当调制调器正与 getty 通信时。确保你从 /etc/inittab 正确地调用了 getty。使用错误的语法或设备名称会导致严重问题。对于
    getty，请通过以下操作验证你的 /etc/gettydefs 语法是否正确：


    ```bash

    linux -c /etc/gettydefs

    ```


    当 getty 初始化失败时也会发生这种情况。


    ## 12.9 有人挂断后，我的调制调器挂了，或者 DTR 掉掉了


    发生这种情况时，LED 灯会狂闪。你需要重置调制调器。大多数兼容 Hayes 的调制调器通过 &D3 实现这一点，但在 Courier 上他必须设置 &D2
    和 &S=1。请检查你的调制调器手册（如果有的话）。


    ## 12.10 getty 仍然无法工作


    getty 自带一个 DEBUG 选项。编辑你的配置文件 /etc/inittab 并添加 DEBUG=NNN。其中 NNN 是你尝试调试的以下组合之一：


    | 选项 | 值 | 描述 |

    | :--- | :--- | :--- |

    | D_OFT | 001 | 设置 |

    | D_DEF | 002 | 默认处理 |

    | D_UTMP | 004 | utmp/wtmp 处理 |

    | D_INIT | 010 | 行初始化 (INIT) |

    | D_GTAB | 020 | getty 文件处理 |

    | D_RUN | 040 | 运行时诊断 |

    | D_RB | 160 | 环回调试 |

    | D_LOCK | 200 | 锁文件处理 |

    | D_SCH | 400 | 调度处理 |

    | D_ALL | 777 | 所有 |


    设置 DEBUG=010 是一个很好的开始点。如果你正在运行 syslogd，调试信息将出现在你的日志文件中。如果你没有运行 syslog，信息将出现在 /tmp/ttySN（用于调试
    getty）和 /tmp/ttySN（用于 getty），以及 /var/log 中。查看调试信息并观察发生了什么。你你可能需要调整配置文件中的参数并重新配置调制调器。你也可以尝试直接运行
    getty。有些人这样做效果更好。


    ## 13 闪存升级


    许多调制调器可以通过从互联网获取升级程序并对其进行重新编程来升级。通过通过串口向调制调器发送此“程序”，调制调器会将该程序存储在它的非易失性内存中（断电后仍然存在）。安装过程通常取决于在
    Windows 中如何操作，你需要弄如何在 Linux 下实现等效操作（除非你想在 Windows 下安装升级）。如果本 HOWTO 的最新版本包含此请求（参见“本
    HOWTO 的新版本”），请发送你安装此类升级的经验，这对他人将帮助。


    如果你需要向调制调器发送文件（程序），你应该如何做？首先，你可能需要向调制调器发送一个命令，告诉它后面是闪存升级。接下来，你需要直接将文件发送到调制调器。通信程序通常使用
    zmodem 或 kermit 将文件发送到调制调器（以及之后）；这些程序将文件放入数据包并添加头部，你得到的是原始文件而不是修改后的文件。但 Kermit
    程序有一个“transmit”命令可以直接发送文件（不使用数据包），因此这是直接发送文件的一种方法。另一种方法是从通信程序转到 shell（在 minicom
    中是 Ctrl-A E），然后执行：


    `cat upgrade_file_name /dev/ttyS`。然后返回通信程序（在 minicom 的命令行提示符处输入 fg）。


    ## 14 问题说明


    虽然“故障排除”（Troubleshooting）章节按症状列出了问题，但本节解释了如果某些设置不当会发生什么。本节帮助你理解导致症状的原因，以及其他症状可能是由同一个问题引起的。


    ### 14.1 中断设置错误


    如果你不懂中断的作用，请参见“中断”（Interrupts）。如果一个串口在硬件中设置了一个 IRQ，但在设备驱动程序中设置了另一个，则设备驱动程序将接收不到串口发送的任何中断。由于串口使用中断来告知驱动程序何时需要服务（从其
    16 字节缓冲区中获取字节或向其发送缓冲区中放入另一个 16 字节），你可能认为串口将完全无法工作。


    但它仍然可能运行——某种程度上如此。为什么呢？除了使用中断处理端口的方法，还有一种不需要中断的轮询（polling）方法。其工作原理是：设备驱动定期检查串口，看它是否需要什么（例如是否有字节需要从接收缓冲区中获取）。如果中断正常工作，串口驱动程序就会退回到这种轮询方法。但这种轮询方法并不是设计作为中断的替代品。它太慢了，并不实际，并可能导致缓冲区溢出。它的目的是当单个中断丢失或执行不当时，让事情重新运行。它也有助于显示中断已失败。


