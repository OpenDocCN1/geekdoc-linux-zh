    如果你的调制解调器不支持存储配置，你可以通过配置文件（或类似文件）中的 INIT 字符串来设置这些。带有 DIP 开关的老旧调制解调器可能会影响寄存器设置。请确保这些也设置正确。


    Greg Hankins 拥有一组针对不同类型调制解调器的设置。如果你想发送你的工作配置，请发送邮件至：mailto:gregh@cc.gatech.edu。你可以在此处获取这些设置：http://ftp.cc.gatech.edu/pub/people/gregh/modem-configs。


    注意：为了让他的 USR Courier V.34 调制解调器在 DTR 落时正确重置，Greg Hankins 必须设置 D2 和 S13=1（这设置了寄存器
    S13 的第 0 位）。这已证实在 USR Sportster V.34 调制解调器上同样有效。


    注意：某些 Supra 调制解调器处理 DCD 的方式与其他解调器不同。如果你使用的是 Supra，请设置 C0 而不是 C1。你必须设置 D2 以正确处理
    DTR。


    ## 4. Linux PC 调制解调器


    ### 4.1 外部 vs 内部


    PC 调制解调器可以是内部的或外部的。内部的位于 PC 内部（你必须拆除螺丝才能安装），外部的只需插入 PC 上的串口连接器。内部调制解调器价格更便宜，不容易发生溢出，通常耗电更少，且不占用桌面空间。外部调制解调器更容易安装，需要的配置较少，并且带有指示灯，可以提示你正在发生什么。外部调制解调器很容易移动到另一台电脑。大多数外部调制解调器在不使用没有关闭电源开关，即使在关闭时也可能消耗少量电力（除非从墙座上拔掉电源）。它们每消耗一瓦每年大约花费你
    1 美元。外部设备的另一个缺点是，你被迫使用现有的串口，而该串口可能不支持超过 115,200 k 的速度（尽管截至 1998 年底大多数内部调制解调器也不支持——但有些支持）。如果新的内部调制解调器带有
    16650 UART，它将减轻 CPU 的负载（但截至 1998 年几乎没有这样的）。


    内部调制解调器为 Linux 带来了一个特殊问题，但只要你避开那些仅支持 MS Windows 的大部分型号，它们的工作原理和外部一样良好，并且只要你花时间（有时是很长的时间）来正确配置它们。某些仅在
    MS Windows 下运行的调制解调器遗憾的是并没有被这样标注。如果你买新的，请确保如果它在 Linux 下无法工作，你可以退款。


    虽然大多数新调制解调器都是即插即用的，但你有多种方法处理它们：


    - 使用 "isapnp" 程序

    - 让 PnP BIOS 进行配置

    - 补补内核以创建一个 PnP Linux


    上述每种方法都有缺点。Isapnp 的文档难以理解，尽管阅读《Plug-and-Play-HOWTO》（目前尚完整）有助于理解它。如果你想让 PnP BIOS
    进行配置，你只需要确保它知道你没有使用 PnP 操作系统。你可能会在确定它如何设置时遇到困难。参见《我的串口硬件中有什么》。补补内核也可能很复杂。有很多设备驱动不与补丁配合（因此你需要对它们进行配置）。


    有些 Linux 用户说买一个外部调制解调器并插上要简单得多。但由于现在的新外设都是 PnP 的，你最终可能需要处理它，那么为什么不在现在处理呢？将来在 Linux
    下处理 PnP 将变得更容易，但尽管有句古话说“先驱者不获报酬”，今天仍需要先驱来开辟道路路。


    ## 4 外部调制解调器


    ### PnP 外部调制解调器


    许多外部调制解调器被标记为“即插即用”（PnP），它们作为非 PnP 调制解调器应该都能正常工作。由于你通常将调制解调器插入具有独立 IRQ 号和 I/O
    地址的串口，调制解调器不需要 PnP 功能来设置这些项。然而，串口本身可能需要配置（IRQ 号和 I/O 地址），除非默认配置是正确的。


    既然外部调制解调器无法通过 PnP 配置，它为什么能被称为 PnP 呢？嗯，它内置了一个特殊的 PnP 标识，PnP 操作系统可以（通过串口）读取。这种操作系统就会知道你在某个端口上有一个调制解调器，并且知道型号数字。这样，你可能就不需要通过告诉应用程序调制解调器在哪个端口（例如
    /dev/tty2 或 COM3）来配置应用程序了。但如果你没有这种 PnP 操作系统，你将需要通过给程序 /dev id（例如 /dev/ttyS2）来手动配置你的应用程序。


    ## 布线与安装


    与连接大多数其他需要各种类型“回环调制”缆到串口的设备相比，连接外部调制解调器非常简单。调制解调器使用直通线，没有引脚交叉。大多数电脑商店应该有这种线。确保你拿到正确的插头。如果你使用的是
    DB9 或 DB25，你可能需要母头转头。


    ## 指示灯（LED）含义


    | 标签 | 含义 |

    | :--- | :--- |

    | TM | 测试 |

    | RD | 接收数据 |

    | SD | 发送数据 |

    | TR | 就绪 |

    | RI | 摘号 |

    | OH | 关闭 |

    | MR | 调制解调器就绪 |

    | EC | 错误 |

    | HS | 高速 |


    ### 4.3 内部调制解调器


