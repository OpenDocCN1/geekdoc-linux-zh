    calls are converted to digital signals at the local offices of the telephone company,
    the fastest speed that you can send digital data by an ordinary telephone call
    is the same speed that the telephone company uses over its digital portion of
    the phone call transmission. What is this speed? Well, in the USA it''s exactly
    56k! In other countries it may be slightly higher.


    Thus in the USA 56k is the absolute top speed for an ordinary telephone call using
    the digital portion of the circuit that was designed to send digital encodings
    of the human voice. In order to use 56k, the modem must know exactly how the telephone
    company is doing its digital encoding of the analog signals. This task is far
    too complicated if both sides of a telephone call have only one analog interface
    to the telephone company. But if one side has a digital interface, then it''s
    possible (at least in one direction). Thus if your ISP has a digital interface
    to the phone company, the ISP may send out a certain digital signal over the phone
    lines toward your PC. Digital signal from the ISP gets converted to analog at
    the local telephone office near your PC''s location (perhaps near home). Then
    your modem''s task is to figure out exactly what that digital signal was. If it
    can do this transmission at 56k (the speed of the telephone company''s digital
    signal) is possible in this direction.


    What does the modem use to encode analog signals? A method of sampling the analog
    signal at a rate of 8000 samples per second. Each amplitude is encoded as a 7-bit
    (ASCII-like) byte. (Note: 7 x 8000 = 56k) This is called Pulse Code Modulation
    = PCM. These bytes are then sent on on the telephone company''s digital circuits
    where many calls share a single circuit using a time-sharing scheme known as “time
    division multiplexing”. Then finally at the local telephone office near your home,
    the digital signal is de-multiplexed resulting in the same signal as was originally
    created by PCM. This signal is then converted back to analog and sent to your
    home. Your modem''s task is to determine which PCM 7-bit byte was created based
    on the amplitude it detects.


    This is (sort of) “amplitude demodulation” but not really. It'' not amplitude
    demodulation because there is no carrier. Actually, it''s called “modulus conversion”
    which is the inverse of PCM. In order to determine the digital code the Co to
    create the analog signal, the modem must sample this analog signal amplitude at
    exactly the same points in the time Co. When used it created the analog signal.
    In order to get the modem to do this correctly the modem must go thru “training”
    periods where the ISP''s modem sends out known digital signals and the modem trains
    itself to recognize signals. (At least that the way I think it ??)


    Note that the digital part of the telephone network is bidirectional. Two such
    circuits are used for a phone call, one in each direction. while 7 bits are used
    to encode the amplitude, the bytes are 8-bit with the extra bit used by the telephone
    company for its signalling purposes. The telephone users have no control over
    this extra bit. While that the digital signal is actually 64k bit/sec, only 56k
    can be controlled by the user.'
