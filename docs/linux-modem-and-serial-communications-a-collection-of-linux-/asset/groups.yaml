    it. If you want the PnP BIOS to do the configuring, all you need to do is make
    sure that it knows you don''t have a PnP operating system. You may have trouble
    determining how it sets up. See What is in my serial port hardware. Patching the
    kernel can be complicated too. There are a lot of device drivers that don''t cooperate
    with the patch (so you will need to configure them).


    There are Linux users who say that there''s a lot simpler to get an external modem
    and plug it in. But since new peripherals are all PnP today, you may eventually
    need to deal with it, so why not now? It will be easier to deal with PnP under
    Linux in the future but pioneers are needed to lead the way today in spite of
    the old adage "Pioneering doesn''t pay".


    ### 4.4 Internal Modems You Must Avoid: winmodems, etc.


    In 1998, the majority of internal modems don''t work with Linux since they are
    "winmodems" or the like, although they often don''t state it like. Such modems
    turn over (or almost all) the work of the modem to the main processor (CPU) chip
    of your computer.


    HSP (Host Signal Processor) means that the host processor (your CPU chip) creates
    the code needed to produce the electrical signal on the phone line. In contrast
    to this, a "controllerless" modem can create the electrical signals (but can''t
    control the modem). It has no facilities to deal with bytes being sent and received.
    It can compress strings of bytes; it can''t check for errors; it can''t put them
    into packets. In other words it can''t control the modem instead the CPU can do
    this work using a program for Windows. If such programs could be ported to Linux
    then there wouldn''t be this problem. Besides the above, a modem which doesn''t
    simulate a serial port will not work under Linux.


    How do you determine if internal modem works under Linux? It''s not always easy.
    If you can look at the package it comes in (or a manual) find the section in the
    package that says something like "Minimum System Requirements" or just "System
    Requirements". It may be in fine print Read it closely. If Windows is listed as
    one of the requirements then it will likely not work under Linux. Also check out
    modem list which lists modems which do and do not work under Linux.


    Otherwise, it may work under Linux if it fails to state explicitly that you must
    have Windows. By saying it''s "designed for Windows" it may only mean that it
    fully supports Microsoft''s plug-and-play

