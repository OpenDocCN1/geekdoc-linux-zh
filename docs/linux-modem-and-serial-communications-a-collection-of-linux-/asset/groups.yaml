    # Modem-HOWTO (for Linnx)


    To send data from your computer over the phone line, the modem takes the digital
    signal from your computer and converts it to “analog”. It does this by creating
    an analog sine wave and then “MODulating” it. Since the result still represents
    digital data, it could also be called a digital signal instead of analog. It looks
    something like an analog signal and almost everyone calls it analog. At the other
    end of the phone line another modem “DEModulates” this signal and the pure digital
    is recovered. Put together the “mod” and “dem” parts of the two words above you
    get what “modem” (if you drop one of the two d''s). A “modem” is thus a MODulator-DEModulator.
    Just what modulation is be found in the section Modulation Details.


    # 2.2 What is a Serial Port?


    # Introduction


    Since modems have a serial port between them and the computer, it’s necessary
    to understand the serial port as well as the modem. The serial port is an I/O
    (Input/Output) device. Most PC''s have two serial ports. Each has a 9-pin connector
    on the back of the computer. Computer programs can send data (bytes) to the transmit
    pin (output) and receive bytes from the receive pin (input). The other pins are
    for control purposes and ground.


    The serial port is much more than just a connector. It converts the data from
    parallel to serial and changes the electrical representation of the data. Inside
    the computer, data bits flow in parallel (using many wires at the same time).
    Serial flow is a stream of bits over a single wire (such as the transmit or receive
    pin of the serial connector). For the serial port to create such a flow, it must
    convert data from parallel (inside the computer) to serial on the transmit pin
    (and conversely).


    Most of the electronics of the serial port is found in a computer chip (or a section
    of a chip) known as a UART. For more details on UARTs see the section What UARTs?
    How Do They Affect Performance? But you may want to find this first section so
    that you will hopefully understand how the UART fits into the overall scheme of
    things.


