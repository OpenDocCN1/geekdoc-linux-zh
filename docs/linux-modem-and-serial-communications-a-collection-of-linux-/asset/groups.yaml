    +   2. "setserial": Assigns ttyS2 to an I/O address and IRQ number. Except that
    you probably don’t need to run it if you have only1 or 2 serial ports total or
    if you use a PnP operating system.


    # Avoiding I/O Address Conflicts: IBM 8514 Video Board


    The I/O address of the IBM 8514 video board (and it’s) is allegedly 0x2e8, the
    same as the I/O address of ttyS3. bad news if you try to use ttyS3 at this I/O
