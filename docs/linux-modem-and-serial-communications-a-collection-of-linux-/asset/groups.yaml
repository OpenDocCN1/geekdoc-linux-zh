    or Serial-Programming-HOWTO. It covers mostly getty, multiport serial cards and
    modems.


    ## 1. Introduction


    This is the Linux Serial HOWTO. This covers info on the Serial Port that is not
    available in other HOWTO''s. It includes how to set up modems under Linux, some
    serial tips, and troubleshooting advice. Another HOWTO exists for terminals (see
    Related HOWTO''s). This HOWTO addresses Linux running on Intel x86 hardware, although
    it might work for other architectures.


