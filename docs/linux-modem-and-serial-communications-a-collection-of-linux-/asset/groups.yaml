    \n根据 Micah peenchen@asu.edu 提供：\n\n我想告诉大家，在我的地区（亚利桑州凤凰）有一家名为 speedchoice 的公司提供电缆接入。服务使用混合调制解器。\n\
    \n## 3.9 Cedar Falls Cybernet\n\n信息由 Joe Breu 提供：\n\n我们是爱荷华州 Cedar Falls 的一家 ISP，使用\
    \ Zenith HomeWorks 系统。我们的系统不使用专有软件，是标准的 TCP/IP。我们确实使用 DHCP，但会根据要求提供静态 IP 地址。\n\
    \n## 3.10 Telstra Bigpond, Australia\n\n信息由 Geoff Conway gconway@vic.bigpond.net.au\
    \ 提供：\n\n免责声明：此处包含的信息与 Big Pond Cable、Telstra Multimedia、Telstra、IBM Global Services\
    \ Australia 或任何相关公司无关。尝试安装软件相关的任何损失或损害由遵循这些指令的人个人负责。Big Pond 目前不支持 Linux——因此不要向他们报告有关\
    \ Linux 安装或运行的故障。\n\nBig Pond Linux 安装说明。版本 1.1 (12/03/98)\n\n更改说明 1.1 12/3/98——修正了\
    \ dhcp 和 andcd 的拼写。\n\nBig Pond 并不官方支持 Linux。但是，TMM 电缆基础设施允许使用 Linux——配合相应的逻辑客户端。以下安装说明应该帮助你无大困难地安装软件。\n\
    \n从以下地址获取 rclientd 的完整客户端发行：\n\nhttp://ftp.vortex.net/pub/rlinux/rclientd-1.3.tar.gz\n\
