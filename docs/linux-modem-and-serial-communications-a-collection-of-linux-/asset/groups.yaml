    to find out. See What is set in my serial port-hardware?


    # External Modems


    If you use an external modem and plug it into say the ttyS1 connector, then there''s
    (usually) no io-irq configuring to do ttyS1 has likely already been io-irq configured.
    Your CMOS BIOS may have a menu to do this for COM1 and COM2.


    # More Than 2 Serial Ports


    Normally you don''t need to configure the first two serial ports that your computer
    comes with since the default configuration works fine. The Linux distribution
    you probably have these defaults built into it so you have nothing to do. Everything
    is different when you want to add a third serial port. The io-irq configuring
    of it uses the same principles as for the first two serial ports but this time
    (unless you use a plug-and-play operating system) you have to do it yourself.
    To do this (as already mentioned) you''ll need to run setserial: What is serial
    and also set the io-irq data into the modem card by PnP methods (or by physical
