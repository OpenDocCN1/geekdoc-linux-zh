    # Modem-HOWTO (for Linux)


    Otherwise, you must establish the serial port identification and assign it an
    IRQ number. This is done by putting two values (an IRQ number and I/O address)
    into two places:


    +   1. A memory register of the serial port hardware itself


    +   2. the device driver (often by running “seterial” at boot-time)


    Both of the above are supposed to be done by a plug-and-play operating system
    (OS). For item 1, setting these numbers in a modem card (for the serial port in
    the case of an external modem) was formerly done by users. Today it''s supposed
    to be done at boot-time by plug-and-play (PnP).


    For item 2. if you accept the default settings there is no need to use seterial.
    But if you use “seterial the IRQ and IO address you tell it must be exactly the
    same as what is inside the serial port hardware (or will be set via PnP). We might
    call all this “io-irq” configuring for short. In the Windows world, the I/O address
    and IRQ are called “resources” and we are thus configuring certain resources.


    # Plug-and-Play


    Plug-and-Play was designed to automate this io-irq configuring, but for Linux
    it has made life more complicated. The standard kernels for Linux don''t support
    plug-and-play. If you use a patch to the Linux kernel to covert it to a plug-and-play
    operating system, then all of the above should be handled automatically by the
    OS. But when you want to use this automate configuring devices other than the
    serial port, you may find that you will still have to configure the drivers manually
    since many Linux drivers are not written to support a PnP OS. If you use isapntools
    or the BIOS for configuring plug-and-play this will only put the two values into
    the serial port section of the modem card and you will likely still need to set
    up serial. None of this is easy or very well documented as of 1999. See Plug-and-Play-HOWTO.


    # Using a PnP BIOS to I0-IRQ Configure


    While the explanation of how to use a PnP OS or isapntools for io-irq configuring
    could come with such software, this is not the case if you want to let a PnP BIOS
    do configuring. The BIOS usually has a CMOS menu for setting up the first two
    serial ports. There is often little to choose from. Unless otherwise indicated
    in the manual, standard I/O addresses and IRQ’s should be used by the BIOS. See
    Serial Port Device Names & Numbers


    Whether you like it or not, when you start up a PnP BIOS starts to do PnP (io-irq)
    configuring of hardware devices. It may do the job partially and turn the rest
    over to a PnP OS (which you don''t have) or if you don''t have a PnP OS it may
    fully configure all the PnP devices but not'
