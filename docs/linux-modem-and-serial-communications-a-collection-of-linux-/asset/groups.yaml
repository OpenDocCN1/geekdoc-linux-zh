    [content]

    I have started a collection of modem setups for different types of modems. So
    far, I only have a few of them, if you would like to send me your working configuration,
    please do so! You can get them at http://ftp.cc.gatech.edu/pub/people/gregh/modem-configs.


    Note: to get my US Courier V.34 modem to reset correctly when DTR drops, I had
    to set D2 and S13=1 (this sets bit 0 of register S13). This has been confirmed
    to work on USR Sportster V.34 modems as well.


    Note: some Supra modems treat DCD differently than other modems. If you are using
    a Supra, try setting &C0 and not &C1. You must also set &D2 to handle DTR correctly.


    ## 6.2 Installing getty_ps


    Get the latest version from sunsite.unc.edu/pub/Linux/system/serial. In particular,
    if you want to use high speeds (57600 and 115200 baud), you must get version 2.0.7j
    or later. You must also have libc 5.x or greater.


    By default, getty_ps will be configured to Linux FSTND (File System Standard)
    compliant, which means the binaries will be in /sbin, and the config files will
    be named /etc/config.[ugetty].ttyN. This is not apparent from the documentation!
    It will also expect lock files to go in /var/lock. Make sure you have the /var/lock
    directory.


    If you don''t use FSTND compliance, binaries will go in /etc, config files will
    go in /etc/default/[ugetty].ttyS, and lock files will go in /usr/spool/uuc. I
    recommend doing this way if you are using UOCP, because UOCP will have problems
    if you move the lock files to where it isn''t located.


    get_ps can also use syslog to log messages. See the man pages for syslog(1) and
    syslog.conf(5) for setting up syslog, if you don''t running it already. Messages
    are logged with priority LOG_AUTH, errors using LOG_ERR, and debugging using LOG_DEBUG.
    If you don''t want to use syslog can edit tune.h in the getty_ps source files
    to use a log file for messages instead, namely /var/adm/getty.log by default.


    Decide on if you want FSTND compliance and syslog capability. You can also choose
    a combination of the two. Edit the Makefile, tune.h and config.h to reflect your
    decisions. Then compile and install according to instructions included with the
    package.


    From this point on, all references to getty will refer to getty_ps. References
    to ugetty will refer to the ugetty that comes with the getty_ps package. These
    instructions will not work for mgetty or aty.


    ## 7. ugetty


    ### 7.1 Setting up ugetty


    Make sure that you have an outgoing and incoming device for the serial port your
    modem is on. If you have your modem on ttyS3 you need the /dev/cua3, and /dev/ttyS3
    devices. If you don''t have the correct devices see section Creating Devices In
    /dev on how to create devices, and create the devices. If you want to be able
    to dial out with your modem ugetty is watching the port for logins, use the /dev/cuaN
    device instead of the /dev/ttyN device [One wouldn''t need cua if the software
    was written to avoid it.]


    ugetty does important lock file checking. Update /etc/getdefs to include an entry
    for your modem. When you are done editing /etc/getdefs you can verify that the
    syntax is correct by watching the port doing:


    ```

    linux# -c /etc/getdefs

    ```


    ## Modern Modems


    If you have a 9600 bps or faster modem with data compression, you can lock your
    serial port to one speed. For example:


    ```

    # 115200 fixed speed

    F115200# B115200 CS8 # B115200 SANE -ISTRIP HUPCL ##S @L@B login:

    #F115200

    ```


    If you have your modem set up to RTS/CTS hardware flow control, you can add CRTSCTS
    to the entries:


    ```

    # 115200 fixed speed with hardware flow control

    F115200# B115200 CS8 CRTSCTS # B115200 SANE -ISTRIP HUPCL CRTSCTS ##S @L@B login:#F115200

    ```


    ## Old slow modems


    If you have a slow modem (under 9600 bps) Then, instead of one line for a single
    speed, you need several lines to try a number of speeds. Note the lines lines
    are linked to each other by the last “word” in the line such as #38400. Blank
    lines are needed between each entry.


    ## The Linux Serial HOWTO


    ```

    # Modem entries

    115200# B115200 CS8 # B115200 SANE -ISTRIP HUPCL @@S @L @B login: #57600

    57600# B57600 CS8 # B57600 SANE -ISTRIP HUPCL @@S @L @B login: #38400

    38400# B38400 CS8 # B38400 SANE -ISTRIP HUPCL @@S @L @B login: #19200

    19200# B19200 CS8 # B19200 SANE -ISTRIP HUPCL @@S @L @B login: #9600

    9600# B9600 CS8 # B9600 SANE -ISTRIP HUPCL @@S @L @B login: #2400

    2400# B2400 CS8 # B2400 SANE -ISTRIP HUPCL @@S @L @B login: #115200

    ```


    ## Login Banner


    If you want, you can make uugetty print interesting things in the login banner.
    In my examples, I have the system name, the serial line, and the current bps rate.
    You can add other things:


    ```

    @B The current (evaluated at the time the @B is) bps rate.

    @D The current date, in MM/DD/YY.

    @L The serial line to which uugetty is attached.

    @S The system name.

    @T The current time, in HH:MM:SS (24-hour).

    @U The number of currently signed-on users. This is a

    count of the number of entries in the /etc/utm file

    that have a non-null name field.

    @V The value of VERSION, as given in the defaults file.

    To display a ''@'' character, use either ''\@'' or ''@@''.

    ```


