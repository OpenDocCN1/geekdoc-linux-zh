    # Linux 调制解调器与串口通信


    “或类似内容”（上文）可能有点复杂。如果调制解调器是 ISA 总线的即插即用（PnP）设备，对应的程序可能可以使用带有“isapntools”附带的“isapnp”程序。执行`man
    isapnp`。设置 IRQ 和 3E8 的另一种可能方法是（如果可能的话）在 Windows 下进行配置。如果你有一个 PnP BIOS，那么在 Windows
    下的配置会将该设置写入 PnP BIOS，以便在 Linux 启动时供其使用（前提是你在使用 Linux 时告诉 CMOS 你没有使用 PnP 操作系统）。对于
    Windows 3.x 使用 ICU 实用。可能有一种方法使用调制解调器自带的软件来禁用 PnP。


    最后，你必须找到运行 `setserial` 的文件并添加类似如 `setserial /dev/tty2 irq5` 的行。更多指令请参见“所有调制解调器”。


    # 所有调制解调器


    # 2. 调制解调器与串口基础


    使用和安装调制解调器并不需要理解基础知识。但了解它可能有助于在你遇到问题时确定哪里出了错。读完本节后，如果你想查看本文中的“调制解调器如何工作”（该部分尚未完成）。Serial-HOWTO
    的未来版本（预计 1999 年 2 月）将涵盖更多关于串口本身的内容。


    # 2 调制解调器将数字转换为模拟信号（反之亦然）


    大多数电话主线是数字信号的，但通往你家（或公司）的线路通常是模拟的，这意味着它们的设计是为了传输电压波，这种电压波与你口中发出的声波特性相同。电压波被称为“模拟信号”。在示波器上查看，它看起来像频率和幅度变化的正弦波。数字信号则像方波。例如，3
    v（伏特）可能代表 1 位，而 0 v 可能代表 0 位。对于大多数串口（外部调制解调器使用），+12 v 是 0 位，-12 v 是 1 位（有些是 +
    或 - 5 v）。


    # 调制解调器 调制解调器指南（适用于 Linux）


    要通过电话线从你的电脑发送数据，调制解调器接收电脑的数字信号并将其转换为“模拟信号”。它通过创建一个模拟正弦波并对其进行“调制（Modulating）来实现。由于结果仍然代表数字数据，它也可以被称为数字信号而非模拟信号。它看起来像模拟信号，几乎每个人都称其为模拟信号。在电话线的另一端，另一个调制解调器对该信号进行“解调（DEModulating）”，从而恢复出纯数字信号。将上述两个词的“mod”和“dem”部分结合起来就得到了“modem”（如果你去掉了两个
    d 中的一个）。因此，“modem”就是一个调制器-解调器（MODulator-DEModulator）。关于什么是调制，请参见“调制细节”章节。


    # 2.2 什么是串口？


    # 引言


    由于调制解调器与电脑之间有一个串口，因此有理解串口以及调制解调器是很有的。串口是一个 I/O（输入/输出）设备。大多数 PC 都有两个串口。每个串口在电脑后面有一个
    9 针连接器。电脑程序可以将数据（字节）发送到发送引脚（输出），从接收引脚（输入）接收字节。其他引脚用于控制和接地。


    串口不仅仅是一个连接器。它将数据从并行转换为串行并改变数据的电气表示。在电脑内部，数据位是并行流动的（同时使用许多电线）。串行流是单根电线上的位流（例如串口连接器的发送或接收引脚）。为了让串口创建这样的流，它必须在发送引脚上将数据从并行（电脑内部）转换为串行（反之亦然）。


    串口的大部分元件位于一个名为 UART 的电脑芯片（或芯片区域）中。有关 UART 的更多详细信息，请参见“什么是 UART？它们如何影响性能？”章节。但你可能想先看这一节，以便你希望能够理解
    UART 是如何融入整体方案之中的。


    # 引脚与导线


    旧的 PC 使用 25 针连接器，但实际上只使用了约 9 个引脚，因此现在大多数连接器只有 9 针。9 个引脚中的每一个都连接到一根导线上。除了传输和接收数据的两根线外，另一个引脚（线）是信号地。任何导线上的电压都是相对于此地测量的。仍然有更多导线仅用于控制（信号），而不用于发送字节。所有这些信号本都可以在单根导线上发送，但相反，每种类型的信号都有一条独立的专用导线。有些（或全部）这些导线被称为“调制”。


    # 内部调制解调器


    对于内部调制解调器，没有 9 针连接器，但其行为与上述电线完全相同。导线中的 12 伏信号提供调制解调器控制线的状态，内部调制解调器可能使用其内存（寄存器）中的状态位来确定这个不存在的“线”的状态。内部调制解调器的串口对电脑来说就像真实的串口一样。它甚至允许设置普通串口上设置的速度限制，如
    115200 bits/sec。遗憾的是，许多内部调制解调器的工作原理并非如此，而是使用 MS Windows 软件协助工作，且在 Linux 下无法工作。参见“避免：winmodems”。


    # 2.3 地址与 IRQ


    由于电脑需要与调制解调器通信。串口是一个 I/O（输入/输出）设备。大多数 PC 都有两个串口。每个串口在电脑后面有一个 9 针连接器。电脑程序可以将数据（字节）发送到发送引脚（输出），从接收引脚（输入）接收字节。其他引脚用于控制和接地。


    由于电脑需要与调制解调器通信。串口是一个 I/O（输入/输出）设备。大多数 PC 都有两个串口。每个串口在电脑后面有一个 9 针连接器。电脑程序可以将数据（字节）发送到发送引脚（输出），从接收引脚（输入）接收字节。其他引脚用于控制和接地。


    （注：原文中存在大量重复，此处已根据逻辑进行去重）


    # 2.4 中断


    数据通过电话线进入调制解调器，由调制解调器从模拟转换为数字，并传输到电脑。当调制解调器接收到数据时，它向 CPU 发送中断信号。


    中断传递了大量信息，但只是间接的。中断本身只是告诉一个名为中断控制器的芯片，某个串口需要注意。中断控制器随后信号 CPU。CPU 运行一个特殊程序来服务串口。该程序被称为中断例程（串口驱动软件的一部分）。它尝试查明串口发生了什么，然后处理从（或向）串口硬件缓冲区的字节传输。


    上述缓冲区都是硬件缓冲区。串口在主内存中也有大型缓冲区。这部分稍后解释。


    每个通常通常使用一个中断号（IRQ）。


    # 2.5 数据压缩（由调制解调器完成）


    在继续学习串口基础之前，需要了解一些由调制解调器完成的事情：数据压缩。

