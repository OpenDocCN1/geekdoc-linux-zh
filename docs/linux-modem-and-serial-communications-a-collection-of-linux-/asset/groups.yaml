    http://www.ssc.com/lj/issue14 查看。


    ## 2.5 不支持的串口硬件


    ### Winmodems 无法工作


    声称为“Winmodems”的调制器（例如 USR Sportster Winmodem 和 IBM Aptiva MWAVE）在 Linux 下不支持。这些调制器使用专有设计，需要特殊的
    Windows 驱动。请避免此类型号。


    ### Rockwell (RPI) 驱动可能可用


    需要 Rockwell RPI 驱动的调制器无法完全使用，因为该驱动软件在 Linux 上无法运行。RPI 使用电脑 CPU 上的 软件进行压缩和纠错。如果你愿意在不使用
    RPI 的情况下操作调制器（因此没有压缩或纠错），你可以通过向调制器（通过初始化字符串）发送 RPI 禁用命令 +H0 来轻松禁用 RPI。


    ## 串口的名称是什么？


    I/O 端口是数据进出计算机的一种。有很多类型的 I/O 端口，例如串口、并行口、磁盘驱动控制器、以太网卡等。我们将处理串口，因为调制调器和终端都是串口设备。每个串口都有一个名称。


    | 端口名称 | 地址 | IRQ |

    | :--- | :--- | :--- |

    | ttyS0 (COM1) | 0x3F | 4 |

    | ttyS1 (COM2) | 0x2F | 3 |

    | ttyS2 (COM3) | 0x27 | 4 |

    | ttyS3 (COM4) | 0x2B | 3 |

    | ttyS4 (COM5) | 0x2D | 5 |

    | ttyS5 (COM6) | 0x29 | 3 |

    | ttyS6 (COM7) | 0x2D | 5 |

    | ttyS7 (COM8) | 0x27 | 4 |


    如果你使用超过八个串口，它们将被命名为 ttyS9、ttyS10 等以此此类推。某些端口可能被命名为 ttyUSB0、ttyUSB1 等。你可以通过查看 /dev
    来查看系统上的可用端口。

