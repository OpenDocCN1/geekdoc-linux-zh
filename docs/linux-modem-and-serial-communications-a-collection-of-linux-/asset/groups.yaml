    # About getty_ps


    Most distributions come with the getty_ps package installed. (Debian used getty
    but now uses mgetty). It contains two programs: getty is used for console and
    terminal devices, and gettyget for modems. I use this version of getty, so that
    is what I will focus on.


    # About mgetty


    mgetty is a version of getty mainly for use with modems. It may be used for hard-wired
    terminals but the documentation is about 99% related to modems. In addition to
    allowing dialup logins, mget also provides FAX support and auto PPP detection.
    The mgetty documentation (supplied in text format) is good, and does not need
    supplementing. Please refer to it for installation instructions. You can find
    the latest information on mgetty at http://www.lco.org/~doering/mgetty/.


    # About getty


    agty is the third variation of getty. It''s a simple, completely functional implementation
    of getty which is best suited for virtual consoles or terminals rather than modems.


    # 4.2 What is setserial?


    setserial is a program which allows you to look at and change various attributes
    of a serial device, including its port address, its interrupt, and other serial
    port options. You can find out what version you have by running setserial with
    no arguments. If the argument is /dev/ttyS1, then you will see some info about
    that port.


    When your Linux system boots, only ttyS(0-3) are configured, using the default
    IRQs of 4 and 3. So, if you have any other serial ports provided by other boards
    or if ttyS(0-3) have a non-standard IRQ, you must use setserial in order to configure
    those serial ports. For the full listing of options, consult the main page.


    # 5. How Do I Dial Out With My Modem?


    # 5.1 Hardware Requirements


    You may use either an external or internal modem. The internal costs less and
    takes up no space on the desk or table. But the external is easy to "install"
    and have lights to give you a clue as to what is happening. But externals need
    to be switched off when not in use and are likely to consume a little electricity
    even when turned off.


    # External Modems


    First, make sure you have the right cable. Your modem requires a straight through
    cable, with no pins crossed. Any computer store should have these. Make sure you
    get the correct gender. If you are using the DB25 serial port, it will always
    be the male DB25. Do not confuse it with the parallel port, which is the female
    DB25. Hook up your modem to one of your serial ports. Consult your modem manual
    how to do this if you need help.


    # Internal Modems


    For an internal modem, you will not need a cable. An internal modem does not need
    a serial port, it has one built in. All you need to do is configure it to use
    an interrupt that is not being used, and configure the I/O address. Consult your
    modem manual if you get stuck. Also, see Can I More Than Two Serial Devices? if
    you need help choosing interrupts or addresses.


    On some motherboards you will have to disable the serial port that the modem is
    replacing in order to avoid conflicts. This may be done with jumpers or in the
    BIOS settings, depending on your motherboard. Consult your motherboard manual.


    If you have an IBM8514 video board, then there is a bug that you should know about.
    You may encounter problems if you use your internal modem to be tty3. If Linux
    does not detect your internal modem on tty3, you can use setserial and the modem
    will work fine. Internal modems on ttyS(0-2) should not have any problems being
    detected. Linux does not do any autoconfiguration tty3 due to this video board
    bus.


    # 5.2 Talking To Your Modem


    Use minicom or some other communications program to test the setup, before you
    go jump into complex things SLIP or PPP. You can find the latest version of kermit
    at http://www.columbia.edu/kermit/. For example, say your modem is on tty3, and
    it''s speed 115200 bps. You would do the following:


    ```

    linux# kermit

    C-Kermit 6.0.192, 6 Sep 96, for Linux


    Copyright (C) 1985, 1996,


    Trustees of Columbia University in the City of New York.

    ```


    # Linux Modem and Serial Communications


    Default file-transfer mode is BINARY

    Type ? or HELP for help.

    C-Kermit set /dev/ttyS3

    C-Kermit set carrier-watch off

    C-Kermit speed 115200

    /dev/ttyS3, 115200 bps

    C-Kermitc

    Connecting to /dev/ttyS3, speed 115200.

    The escape character is Ctrl-\ (ASCII 28, FS)

    Type the escape character followed by C to get back,

    or followed by ? to see other options.


    +   ATE1Q0V1 ; you type this and then the Enter key

    OK ; should respond with this


    If your modem responds to AT commands, you can assume your modem is working correctly
    on the Linux side. Now calling another modem by typing:


    ```

    ATDT7654321

    ```


    where 7654321 is a phone number. Use ADTP instead of ATDT if you have a pulse
    line. If the call goes through, your modem is working.


    To get back to the kit prompt, hold down the Ctrl key, press the backslash key,
    then let go of the Ctrl key, press the C key:


    ```

    Ctrl-\

    (Back at tty)

    C-Kermitquit

    kermit#

    ```


    This was a test using the primitive "by-hand" dialing method. The normal method
    is to let it dial for you with its built-in modem database and automatic dialing
    features, for example using a US Robotics (USR) modem:


    ```

    kermit# kermit

    C-Kermit 6.0.192, 6 Sep 1997, for Linux

    Copyright (C) 1985, 1996,

    Trustees of Columbia University in the City of New York.

    Default file-transfer mode is BINARY

    Type ? or HELP for help

    ```


    # The Linux Serial HOWTO


    C-Kermit set modem type usr ; Select modem type

    C-Kermit set line /dev/ttyS3 ; Select communication device

    C-Kermit speed 115200 ; Set the dialing speed

    C-Kermitdial 7654321 ; Dial


    Number: 7654321

    Device=/dev/ttyS3, modem=usr, speed=115200

    Call completed.<BEEP

    Connecting to /dev/ttyS3, speed 115200

    The escape character is Ctrl-\ (ASCII 28, FS).

    Type the escape character followed by C to get back,

    or followed by ? to see other options.


    Welcome to ...

    login:


    See Communications Programs about communications programs if you need some pointers.

    When you dial out your modem, set the speed to the highest serial port speed that
    your modem supports (provided it''s not over 115200 bps). This is not the same
    as the "advertised" speed of the modem such as 56K. Versions of Linux with a libc
    version greater than 5.x have support for speeds up to 115200. Even higher speeds
    than this are in works for Linux.


    # 5.3 Dial Out Modem Configuration


    For dial out only, you can configure your modem however you want. If you intend
    to use your modem for dialin, you must configure your modem at the same speed
    that you intend to run getty. However, most modems set their speed automatically
    to the same speed that modem commands use. Thus having getty at 115,200 will automatically
    set the modem at the speed when getty gets an int string to the serial port where
    the modem is. In general, factory defaults that enable error correction and hardware
    flow control are the best setting for dial out modems, consult your modem manual
    for these settings.


    # 5.4 Hardware Flow Control


    If your modem supports hardware flow control (RTS/CTS), I highly recommend you
    use it. This is particularly important for modems that support data compression.
    First, you have to enable RTS/CTS flow control on the serial port itself. This
    is best done on startup, like in /etc/rc.d/rc.local or /etc/rc.d/rc.serial. Make
    sure that these files are being run from the main rc.sysinit file! You need to
    do the following for each serial port you want to enable flow control:


    +   - stty crtscts < /dev/ttyS3


    If its not enabled by default, you must also enable RTS/CTS flow control on your
    modem. Your communication program may enable it. Consult your modem manual if
    needed and then save your modem configuration if your modem supports stored profiles.


    # 6. How Do Dial In And Out With My Modem Using getty_ps


    Get your modem to dial out correctly. If you haven''t read section How Do I Dial
    Out With My modem go it now! It contains very important setup information. You
    do not need to read this section if you only want to dial out with your modem.


    # 6.1 Dial In And Out Modem Configuration


    For dialin and dialout use, you have to set up your modem a certain way (again,
    using AT commands on your modem):


    ```

    E1 command echo ON

    Q0 result codes are reported

    V1 verbose ON

    S=0 never answer (uugty handles this with the WAITFOR option)

    ```


    If you don''t set these correctly, your INIT string in your config file may fail,
    hosing the whole process. But, more on config files below...


    ```

    &C1 DCD is after connect only

    &S0 DSR is always on

    DTR on/off resets modem (depends on manufacturer-RTFM)

    ```


    These affect your modem when it starts and end.


    If your modem does not support a stored profile, you can set these through the
    INIT string in your config file. See below. Some modems come with DIP switches
    that affect register settings. Be sure these are set correctly, too.

