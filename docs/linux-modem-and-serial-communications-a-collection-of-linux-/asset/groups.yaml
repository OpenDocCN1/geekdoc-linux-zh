    \ |\n| D_DEF | 002 | defaults processing |\n| D_UTMP | 004 | utmp/wtmp processing\
    \ |\n| D_INIT | 010 | line initialization (INIT) |\n| D_GTAB | 020 | getty file\
    \ processing |\n| D_RUN | 040 | runtime diagnostics |\n| D_RB | 160 | ringback\
    \ debugging |\n| D_LOCK | 200 | lockfile processing |\n| D_SCH | 400 | schedule\
    \ processing |\n| D_ALL | 777 | everything |\n\nSetting DEBUG=010 is a good place\
    \ to start. If you are running syslogd, debugging info will appear in your log\
