    If you have a 14400 bps (V.32bis) modem, with V.42bis data compression, use 57600
    bps.


    If you have a 9600 bps (V.32) modem, with V.42bis data compression, use 38400
    bps.


    If you have something slower than a 9600 bps (V.32) modem, set your speed to the
    highest speed your modem supports. For example 300 bps (V.21/Bell 103), 1200 bps
    (V.22/Bell 212A), or 2400 bps (V.22bis).


    If you use setserial test on the command line first, and then when you have them
    working, put them into /etc/rc.d/rc.serial /etc/rc.d/rc.local or /etc/rc.boot/0setserial
    so they are run at startup. Make sure you are using a valid path for setserial,
    and a valid device name. You can check the settings of serial port by running:


    ```

    setserial -a /dev/tty3

    ```


    ## 11. Communications Programs And Utilities


    Here is a list of some communication software you can choose from, available via
    FTP, if they didn''t come with your distribution.


    - ecu—a communications program

    - C-Kermit—portable, scriptable, serial and TCP/IP communications including file
    transfer and character-set translation

    - minicom—telix-like communications program

    - procomm—procomm-like communication program with zmodem

    - seyon—X based communication program

    - xc—xcomm communication package

    - Other useful programs are term and SLIP. They offer TCP/IP functionality using
    a shell account.

    - screen is another multi-session program. This one behaves like the virtual consoles.

    - callback is a program that will have your modem call you back.

    - mgetty+fax handles FAX stuff, and provides an alternate ps_getty.


    ZYEL is a control program for ZYEL U-1496 modems. It handles dialin, dialout,
    dial back security, FAXING, and voice mailbox functions.


    SLIP and PPP software can be found at http://sunsite.unc.edu/pub/Linux/system/network/serial.


    Other things can be found on ftp://sunsite.unc.edu/pub/Linux/system/serial and
    ftp://sunsite.unc.edu/pub/Linux/apps/serialcomm or one of the mirrors. These are
    the directories where serial programs are kept.


    ## 12. Serial Tips And Miscellany


    Here are some serial tips you might find helpful...


    ### 12.1 kermit and zmodem


    To use zmodem with kermit, add the following to your .kermrc:


    ```

    define rz !rz < /dev/ttyS3 /dev/ttyS3

    define sz !sz \0 /dev/ttyS3 < /dev/ttyS3

    ```


    Be sure to put in the correct port your modem is. Then, to use it, just type rz
    or sz <filename> at the kermit prompt.


    ### 12.2 Setting Terminal Types Automically


    To set your terminal type automatically when you log in, add the terminal type
    to the entry in /etc/inittab. If I have a vt100 terminal on tty1, I would add
    "vt100" to the getty command:


    ```

    sl:456:respawn:/sbin/getty ttyS1 DT9600 vt100

    ```


    Other getys have similar options. You can also use tset, which can establish terminal
    characteristics when you log in, and doesn''t depend on any defaults.


    ### 12.3 Color ls On Serial Connections


    If ls is screwing up your terminal emulation with the color feature, turn it off.
    ls -color, and ls -colour all use the color feature. Some installations have ls
    set to use color by default. Check /etc/profile and /etc/csh.cshrc for ls aliases.
    You can also alias ls to ls -no-color, if you don''t want to change the system
    defaults.


    ### 12.4 Printing To A Printer Connected To A Terminal


    There is a program called vtprint, available from ftp://fip.sdsu.edu/pub/vtprint,
    and from http://www.sdsu.edu/~garrett


    Another program that will do this is called xprt. It can be found at ftp://sunsite.unc.edu/pub/Linux/system/printing.


    ### 12.5 Can Linux Configure The Serial Devices Automically?


    If yes, not already set up (close to it) you may set Linux to detect and set up
    the serial devices automatically by startup. Needed add the following line:


    ```

    /sbin/setserial3 /dev/tty3 skip_irq_test autoconfig

    ```


    to your /etc/rc.d/rc.local or /etc/rc.d/rc.serial or /etc/rc.boot/0setserial file.
    Do this for every serial port you want to configure. Be sure to give a device
    name that really does exist on your machine.


    #### Notes For Multiport Boards


    For board addresses, and IRQs, look at the rc.serial or /etc/rc.boot/0setserial
    that comes with the setserial program. It has a lot of detail on multiport boards,
    including I/O addresses and device names.


    ### 12.6 Using A Serial Console


    There is an article in issue 36 of the Linux Journal, http://www.ssc.com/ij/issue36/index.html
    that explains how to use a serial console. See Text-Terminal-HOWTO.


    ### 12.7 Higher Serial Throughput


    If you are seeing throughput and serial port overruns on a system with IDE drives
    you can get hdparm. This is a utility that can modify IDE parameters, including
    masking other IRQs. This will improve responsiveness and help eliminate overruns.
    Be sure to read the man page very carefully, since some controller combinations
    don''t like this and may corrupt the filesystem. Also have a look at a utility
    called irqtune that will change the priority of the serial port that your modem
    is on. This may improve the throughput on your system.


    ## 13. One Step Further...


    This section is not required, but may give you further insight into the world
    of telecommunications.


    ### 13.1 What Are Lock Files?


    Lock files are simply a file saying that a particular device is in use. They are
    kept in /usr/spool/uuc or /var/lock named LCK..name where name is either a PID
    or processes create these locks so that they can have exclusive access to devices.
    For instance if you dial out on your modem, a lock will appear telling other processes
    that someone is using the modem. Most programs look at the lock and try to determine
    if that lock is still valid by checking the process table for the device. If it
    is not, some programs remove the stale lock and create their own.


    ### 13.2 "baud" Vs. "bps"


    "baud" and "bps" are perhaps one of the most misused terms in the computing and
    telecommunications field. Many people use these terms interchangeably, when in
    fact they are not! The baud is a measure of how many times per second, for instance
    one signal change sent by a modem (modulator-demodulator). Common baud rates are
    50, 75, 110, 300, 600, 1200, and 2400. Today they are in addition to the old modem
    bps rates (50-9600): 19.2K, 38.4K, 57K and 115.2K. Using modems with V42bis compression
    (max 4:1), rates up to 115.2K bps are possible. This is what most people mean
    when they misuse the word "baud".


    So, if high speed modems are running at 2400 baud, how can they send 1400 bps
    (or higher)? The modems achieve a bps rate greater than baud rate by encoding
    many bits in each signal change, or phase change. Thus, when 2 or more bits are
    encoded per baud, the bps rate exceeds the baud rate. If your modem connects to
    14400 bps, it''s going to be 6 bits per phase, at 2400 baud. Because of the bandwidth
    limitations on voice-grade phone lines, baud rates greater than 2400 are harder
    to achieve and only work over pristine line quality. Multiple bits can be encoded
    per baud to get bit rates that exceed the baud rate. "baud" is named after Emile
    Baudot, the inventor of the asynchronous telegraph printer. bps rate is a measure
    of how many bits per second are transmitted. Common bps rates were 50, 75, 110,
    300, 1200, 2400, 9600. Today they are 14.4K, 28.8K, 33.6K, and 56K.


    ### 13.3 What Are UARTs? How Do They Affect Performance?


    UARTs (Universal Asynchronous Receiver Transmitter) are chips on your PC serial
    board (if you have one) or on the motherboard. The UART function may be done on
    a chip that does other things as well. The UART''s purpose is to convert data
    to bits, send the bits down the serial line, and rebuild the data on the other
    end. UARTs deal with data in byte sized, which is conveniently the size of ASCII
    characters.


    Say you have a terminal hooked up to your PC. When you type a character, the terminal
    gives that character to its transmitter (also a UART). The transmitter sends byte
    out onto the serial line, one bit at a time, at a specific rate. On the PC, the
    receiving UART takes all the bits and rebuilds the byte and puts it in a buffer.

