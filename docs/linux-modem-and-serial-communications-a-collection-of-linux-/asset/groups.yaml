    # Modem-to-Modem Flow Control


    This is the flow control of the data sent over the telephone lines between two
    modems. Practically speaking, it only exists when you have error correction set.
    Actually, even without error correction it''s possible to enable flow control
    between modems but it may interfere with sending binary data so it''s not often
    used.


    # 2.9 Data Flow Path; Buffers


    Although much has been explained about this including flow control, a pair of
    16-byte serial port (in the hardware), and a pair of larger buffers inside the
    modem, there is still another pair of buffers. These are large buffers (perhaps
    8k) in main memory also known as serial port buffers. When an application sends
    bytes to the serial port (and modem), they first get stashed in the transmit serial
    port buffer in main memory. The pair consists of both this transmit buffer and
    a receiver buffer for the opposite direction of byte-flow.


    The serial device drives out 16 bytes from this transmit buffer, one byte at a
    time and puts them into the 16-byte transmit buffer in the serial hardware for
    transmission. In that transmit buffer, there is no way to stop them from being
    transmitted. They are then transmitted to the modem which also has a fair sized
    (say 1k) buffer. When the device driver (on orders from flow control) stops the
    flow of outgoing bytes from the computer, what it actually stops is the flow of
    outgoing bytes from the large transmit buffer in main memory. Even after this
    has happened and to the modem has stopped, an application program may keep sending
    bytes to the 8k transmit buffer until it becomes full. When it fills, the application
    program cannot send any bytes to it (a “write” statement in a C program blocks)
    and the application program temporarily stops running and waits until some buffer
    becomes available. This flow “stop” is ultimately to stop the program that is
    sending the bytes. Even though this program stops, the computer not necessarily
    computing. It may switch to running other processes while it''s waiting at a flow
    stop. The above was a little oversimplified if there is another alternative of
    having the application program itself do something else while it is waiting to
    “write”.


    # 2.10 Complex Flow Control Example


    For many situations, there is a transmit path involving several links, each with
    its own flow control. For example, I type at a text-terminal connected to a PC.
    Inside the PC is a modem to access a BBS. For this I use the application program
    “minicom” which deals with 2 serial ports: one connected to the modem and another
    connected to the text-terminal. What I type at the text terminal goes into the'
  - '[PAGE 37]


    first serial port to minicom, then from minicom the second serial port to the
    modem, and then onto the telephone line to the BBS. The text-terminal has a limit
    to the speed at which bytes can be displayed on its screen and issues a flow control
    “stop” from time to slow down the flow. What happens when such a “stop” is issued?
    Let’s consider a case where the “stop” is long enough to get thru to the BBS and
    stop the program at the BBS which is sending out the bytes.


    Let’s trace the out of this “stop” (which may be “hardware”) on some links and
    “software” on others). First, suppose I’m “capturing” a long file from the BBS
    which is being sent simultaneously to both my text-terminal and a file on my hard-disk.
    The bytes are coming faster than the terminal can handle so it sends a “stop”
    out its serial port to the first serial port on my PC. The device driver detects
    it and stops sending bytes from the 8k buffer (in main memory) to the terminal.
    Now minicom keeps sending out bytes for the terminal into this 8k buffer.


    When this 8k transmit buffer (on the first serial port) is full, minicom must
    stop writing to it. Minicom stops and waits. But this also causes minicom to reading
    from the 8k receive buffer on the 2nd serial port connected to the modem. From
    the modem the modem buffer fills until this 8k buffer fills up and sends a different
    “stop” to the modem. The modem (assuming error correction is enabled) sends a
    “stop signal” to the other modem at the BBS. This modem stops sending bytes out
    of its buffer and when its buffer gets full, another stop signal is sent to the
    serial port of the BBS. At the BBS, the 8-k (or whatever) buffer fills up and
    the program at the BBS can’t write to it and temporarily halts.


    Thus a stop signal from a text terminal has halted a programs on a BBS computer.
    A Wube Goldberg sequence of events! (minicom). Note that the stop signal passed
    4 serial ports, 2 modems, and one application program the serial port attached
    to the terminal. Each serial port has 2 buffers (in one direction of flow): the
    8k and the hardware 16-byte one. The application program may have a buffer in
    main memory as specified in its C-code. This adds up to 11 buffers the data is
    passing thru. Note that the small serial hardware buffers do not participate-directly
    in flow control.


    If the terminal speed limitation is the bottleneck in the flow from the BBS to
    the terminal, then its flow control “stop” is actually stopping the program that
    is sending from the BBS as explained above. But you may ask, how can a “stop”
    last so long that 11 buffers (some of them large) get filled up? It actually happen
    this way if all the buffers are near their limits when the terminal sends out
    the “stop”.


    But if you were to run a simulation on it some links you would discover that it’s
    usually more complicated than this. At an instant some links are flowing and others
    are stopped (due to flow control). A “stop” from the terminal seldom propagates
    back to the BBS nearly as described above. It may take'
  - '[PAGE 38]


    a few "stops" from the terminal to result in a "stop" at the BBS. To understand
    what is going on you really need to observe a simulation which can be done for
    a simple case with coins on a table. Use only a few buffers and the upper level
    for each buffer at a few coins.


    Does one really need to understand all this? Well, understanding this explained
    to me why capturing text from a BBS was loosing text. The situation was exactly
    the above example but modem-to-modem flow control was disabled. Captured of text
    that were supposed to go to the hard-disk never got there because of an overflow
    (overrun) at the modem buffer due to flow control "stops" from the terminal. Even
    though the BBS had a flow path to the hard-disk without bottlenecks, the overflow
    due to the terminal happened on this path and chunks of text were lost.


    # 2.11 Modem Commands


    Commands to the modem are sent to it from the communication software over the
    same conductor used to send data. The commands are all ASCII strings. Examples
    are "AT&K3" for enabling hardware flow control (RTS/CTS) between your computer
    and modem; and "ATDT5393401 for Dialing the number 5393401. All commands are preceded
    by "AT". Some commands as enabling flow control help configure the modem. Other
    commands such as dialing a number do something. There are about a hundred or so
    different possible commands. When your communication software starts running,
    it first sends an "init" string of commands to the modem to configure it. All
    commands are sent on the ordinary data line before the modem dials (or receives
    a call).


    Once the modem is connected to another modem (on-line mode), everything that is
    sent from your computer goes directly to the other modem and is not interpreted
    by the modem as a command. There is a way to "escape" from this mode of operation
    and go back to command mode where everything sent to the modem will be interpreted
    as a command. The computer just sends "++++" with a specified time spacing before
    after it. If this time spacing is correct, the modem reverts to command mode.
    Another way to do this is by a signal on a certain modem control line.


    There are a number of lists of modem commands on the Internet. The Web Sites has
    links to a couple of such web-sites. Different models and brands of modems do
    not use exactly the same set of commands. What works for one modem might not work
    for another. Some common command (not guaranteed to work on all modems) are listed
    in this HOWTO in the section Configuration'
