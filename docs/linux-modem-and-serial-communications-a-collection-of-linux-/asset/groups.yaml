    比 term 更流行，后者已几乎过时。


    要使用 SLIP，你需要在远程计算机的 shell 账户中安装它。然后你拨入账户，并在远程运行 SLIRP，在本地 PC 上运行 PPP。你现在有了一个 PPP
    连接，通过它可以在本地 PC 上运行如 Netscape 等网络浏览器。可能会出现问题，因为 SLIRP 不如真正的 PPP 账户那样。某些账户可能会提供
    SLIRP，因为可以节省 IP 地址（在使用 SLIRP 时你没有 IP 地址）。


