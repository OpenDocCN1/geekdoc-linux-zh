    # 12. Troubleshooting


    # 12.1 Software


    +   - modemstat and statserial show the current state of various modem signal
    lines (such as DTR, CTS, etc.)

    - irqtune will give serial port interrupts higher priority to improve performance.

    - hdparm for hard-disk tuning may help some more.'
  - '[PAGE 72]


    # 12.2 My Modem is Physically There but Can''t be Found


    For the PCI bus look at /proc/pci. Otherwise see What is the current I/O address
    and IRQ of my Serial Port?


    Here are some common mistakes people:


    +   - setserial: They run it (without the "autoconfig" option) or see it displayed
    on the screen at boottime, and erroneously think that the result shows how their
    hardware is actually configured.

    - /proc/interrupts: When their modem isn''t in use they don''t see their modem''s
    interrupt there, and erroneously conclude that their modem can''t be found (or
    doesn''t have an interrupt set).

    - /proc/ports: People think this hardware configuration when it only shows the
    same data (possibly erroneously) as setserial.


    You may probe the modem''s serial port using "setserial" the "autoconfig" argument
    at the I/O address you think the modem is at. If it shows "unknown" for UART type
    there may be nothing here. What is Setserial. Your problem could be due to a winodem
    (or the like) which can''t be used with Linux. Avoid: winmods.


    # 12.3 "Operation not supported by device" (error message) for tlySx


    This means that an operation requested by serial, getty, etc. couldn''t be done
    because the kernel doesn''t supporting it. A common reason is that the "serial"
    module wasn''t loaded at the time. Ismod will show you if it''s now loaded but
    sometimes it is automatically loaded when needed so it may be loaded but wasn''t
    loaded when you got the error message. The "serial" module should be listed in
    the file: /etc/modules.conf. The actual module should reside in: /lib/modules/.../misc/serial.o.


    # 12.4 Slow: Text appears on the screen slowly after long delays


    This will happen from the very start of using the modem. One symptom happens when
    you are manually typing to your modem: You type but the screen remains blank (until
    after several seconds you finally see what you typed). Another symptom is that
    only a few words at a time appear on the screen (possibly with missing text).


    This may be due to a mis-set IRQ. This means that the IRQ used by the device driver
    does not correct the IRQ set in hardware (IRQ mis-set). With a mis-set IRQ you
    may loose received data and get "input overrun" error messages (or find them in
    logs). See Interrupt Mis-set for more details.'
