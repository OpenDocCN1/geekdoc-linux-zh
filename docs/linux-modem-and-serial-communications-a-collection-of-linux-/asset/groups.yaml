    # About getty_ps


    Most distributions come with the getty_ps package installed. (Debian used getty
    but now uses mgetty). It contains two programs: getty is used for console and
    terminal devices, and gettyget for modems. I use this version of getty, so that
    is what I will focus on.


    # About mgetty


    mgetty is a version of getty mainly for use with modems. It may be used for hard-wired
    terminals but the documentation is about 99% related to modems. In addition to
    allowing dialup logins, mget also provides FAX support and auto PPP detection.
    The mgetty documentation (supplied in text format) is good, and does not need
    supplementing. Please refer to it for installation instructions. You can find
    the latest information on mgetty at http://www.lco.org/~doering/mgetty/.


    # About getty


    agty is the third variation of getty. It''s a simple, completely functional implementation
    of getty which is best suited for virtual consoles or terminals rather than modems.


    # 4.2 What is setserial?


    setserial is a program which allows you to look at and change various attributes
    of a serial device, including its port address, its interrupt, and other serial
    port options. You can find out what version you have by running setserial with
    no arguments. If the argument is /dev/ttyS1, then you will see some info about
    that port.


    When your Linux system boots, only ttyS(0-3) are configured, using the default
    IRQs of 4 and 3. So, if you have any other serial ports provided by other boards
    or if ttyS(0-3) have a non-standard IRQ, you must use setserial in order to configure
    those serial ports. For the full listing of options, consult the main page.


    # 5. How Do I Dial Out With My Modem?


    # 5.1 Hardware Requirements


    You may use either an external or internal modem. The internal costs less and
    takes up no space on the desk or table. But the external is easy to "install"
    and have lights to give you a clue as to what'
  - '[PAGE 100]


    is happening. But externals need to be switched off when not in use and are likely
    to consume a lit-

    tle electricity even when turned off.


    # External Modems


    First, make sure you have the right cable. Your modem requires a straight through
    cable, with no pins

    crossed. Any computer store should have these. Make sure you get the correct gender.
    If you are using

    the DB25 serial port, it will always be the male DB25. Do not confuse it with
    the parallel port, which

    is the female DB25. Hook up your modem to one of your serial ports. Consult your
    modem manual

    how how to do this if you need help.


    # Internal Modems


    For an internal modem, you will not need a cable. An internal modem does not need
    a serial port, it

    has one built in. All you need to do is configure it to use an interrupt that
    is not being used, and con-

    figure the I/O address. Consult your modem manual if you get stuck. Also, see
    Can I

    More Than Two Serial Devices? if you need help choosing interrupts or addresses.


    On some motherboards you will have to disable the serial port that the modem is
    replacing in order

    to avoid conflicts. This may be done with jumpers or in the BIOS settings, depending
    on your moth-

    erboard. Consult your motherboard manual.


    If you have an IBM8514 video board, then there is a bug that you should know about.
    You may encounter

    problems if you use your internal modem to be tty3. If Linux does not detect your
    internal

    modem on tty3, you can use setserial and the modem will work fine. Internal modems
    on

    ttyS(0-2) should not have any problems being detected. Linux does not do any autoconfiguration

    tty3 due to this video board bus.


