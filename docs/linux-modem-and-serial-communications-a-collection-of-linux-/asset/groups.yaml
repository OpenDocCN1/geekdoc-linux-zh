    # 2.5 Unsupported Serial Hardware


    # Winmodems Don’t Work


    Modems that claim to be “Winmodems”, for example the USR Sportster Winmodem and
    IBM Aptiva MWAVE, are not supported under Linux. These modems use proprietary
    designs that require special Windows drivers. Avoid these types of models.


    # Rockwell (RPI) Drivers May Work


    Modems that require Rockwell RPI drivers are not fully usable since the driver
    software doesn’t work on Linux. The RPI does compression and error correction
    using MS software on your computer’s CPU. If you are willing to operate the modem
    without using the RPI (and thus have no compression or error correction) then
    you may easily disable RPI by sending the modem (via the initialization string)
    a RPI disable command: +H0'
  - '[PAGE 96]


    # # What Are The Names Of The Serial Ports?


    An I/O port is a way to get data into and out of a computer. There are many types
    of I/O ports such as serial ports, parallel ports, disk drive controllers, ethernet
    boards, etc. We will be dealing with serial ports since modems and terminals are
    serial devices. Each serial port must have an I/O address, and an interrupt (IRQ).
    There are the four serial ports corresponding to COM1–COM4:


    ```

    ttyS0 (COM1) address 0x3f IRQ 4

    ttyS1 (COM2) address 0x2f IRQ 3

    ttyS2 (COM3) address 0x3e IRQ 4

    tty3 (COM4) address 0x2e IRQ 3

    ```


    If Linux does not detect any serial ports when it boots, make sure that serial
    support is enabled and compiled into the kernel. In this, I refer to COM1 as ttyS0,
    COM2 as ttyS1, COM3 as tt2, and COM4 as tty3. Notice that by default these devices
    have overlapping IRQs. You cannot use all of the ports in this default configuration,
    and you must resign different IRQs. See section Can Use More Than Two Serial Devices?
    on setting IRQs.


    # ## 3.1 Devices: modem, mouse


    On some installations, two extra devices will be created, /dev/modem for your
    modem and /dev/mouse for your mouse. Both of these are symbolic links to the appropriate
    device in /dev which you specified during the installation (unless you have a
    bus mouse, /dev/mouse will point to the bus mouse device).


    There has been some discussion on the merits of /dev/mouse and /dev/modem. I strongly
    discourage the use of these links. In particular, if you are planning on using
    your modem for dial out you may run into problems because the lock files may not
    work correctly if you use /dev/mouse. Use them if you like, but be sure they point
    to the right device. However, if you change or remove this link, some applications
    (minicom example) might need reconfiguration.


    # ## 3.2 The cuja Device


    Each ttyS has a corresponding cui device. There has been some talk about abolishing
    so perhaps it''s best to use ttyS. The main difference between cui and ttyS is
    that for an ordinary “open” command (without certain flags) in an application
    program, cui will open the port even if the modem control signals (such as DCD)
    say not to. (tty must have been set to check modem control signals).'
  - '[PAGE 97]


    # Linux Modem and Serial Communications


    A tty port may refuse to open in such a case, but it can be forced to open by
    giving a certain flag to the “open” command.


    Thus a tty port can do everything a cua port can. Except that a “forced” open
    results in read statements in the program behaving in a certain way but the programmer
    may prevent this by adding some other statements to the program. Eliminating cua
    brings Linux more into compliance with the Posix standard and avoids certain problems
    with lock files.


    # 3.3 Serial Port Devices and Numbers In /dev


    | /dev/tty0 major 4, minor 64 | /dev/cua0 major 5, minor 64 |

    | /dev/tty1 major 4, minor 65 | /dev/cual major 5, minor 65 |

    | /dev/tty2 major 4, minor 66 | /dev/cua2 major 5, minor 66 |

    | /dev/tty3 major 4, minor 67 | /dev/cua3 major 5, minor 67 |


    Note that all distributions should come with these devices already made correctly
    (unless cua is absolute). You can verify this by typing:


    ```

    linux$ ls -l /dev/cua*

    linux$ ls -l /dev/ttyS*

    ```


    # Creating Devices In /dev


    If you don''t have a device, you will have to create it with the mknod command.
    Example, suppose you need to create devices for tty0:


    ```

    linux# mknod -m 666 /dev/cua0 c 5 64

    linux# mknod -m 666 /dev/tty0 c 4 64

    ```


    You can use the MAKDEV script, which lives in /dev. This simplifies the making
    of devices. For example, if you needed to make the devices for tty0 you would
    type:


    ```

    linux# cd /dev

    linux# ./MAKDEV tty0

    ```


    This handles the devices creation for the incoming and outgoing devices, and should
    set the permissions.'
