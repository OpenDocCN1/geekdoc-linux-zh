    # Linux Documentation Project

    "Manifesto"


    Last Revision 21 September 1998, by Michael K. Johnson


    This file describes the goals and current status of the Linux Documentation Project,
    including names of projects, volunteers, FTP sites, and so on.


    ## Overview


    The Linux Documentation Project is working on developing good, reliable docs for
    the Linux operating system. The overall goal of the LDP is to collaborate in taking
    care of all of the issues of Linux documentation, ranging from online docs (man
    pages, texinfo docs) to printed manuals covering topics such as installing, using,
    and running Linux. The LDP is essentially a loose team of volunteers with little
    central organization; anyone who is interested in helping is welcome to join in
    the effort. We feel that working together and agreeing on the direction and scope
    of Linux documentation is the best way to go, to reduce problems with conflicting
    efforts—two people writing two books on the same aspect of Linux wastes someone''s
    time all long.


    The LDP is set to produce the canonical set of Linux online and printed documentation.
    Because our docs will be freely available (like software licensed under the terms
    of the GNU GPL) and distributed on the net, we are able to easily update the documentation
    to stay on top of the many changes in the Linux world. If you are interested in
    publishing any of the LDP works, see the section “Publishing LDP Manuals”, below.


    ## Getting Involved


    Send mail to: linux-howto@metalab.unc.edu


    Of course, you''ll also need to get in touch with the coordinator of whatever
    LDP projects you''re interested in working on; see the next section.


    ## Current Projects


    For a list of current projects, see the LDP Homepage. The best way to get involved
    with one of these projects is to pick up the current version of the manual and
    send revisions, editions, or suggestions to the coordinator. You probably want
    to coordinate with the author before sending revisions so that you know you are
    working together.


    ## FTP sites for LDP works


    LDP works can be found on metalab.unc.edu in the directory /pub/Linux/docs. LDP
    manuals are found in /pub/Linux/docs/LDP, HOWTOs and other documentation found
    in /pub/Linux/docs/HOWTO.


    ## Documentation Conventions


    Here are the conventions that are currently used by LDP manuals. If you are interested
    in writing another manual using different conventions, please let us know of your
    plans first.


    The man pages—the Unix standard for online manuals—are created with the Unix standard
    nroff man (or BSD mdoc) macros.


    The guides—full books produced by the LDP—have historically been done in LaTeX,
    as their primary goal has to be printed documentation. However, guide authors
    have been moving towards SGML, with the DocBook DTD, it allows them to create
    more kinds of output, both printed and on-line. If you use LaTeX, we have a style
    file you can use to keep your look consistent with other LDP documents, and we
    suggest you use it.


    The HOWTOs are all required to be in SGML format. Currently, we use the linuxdoc
    DTD, which is quite simple. There is a move afford switch to the DocBook DTD over
    time.


    LDP documents must be freely redistributable without fees to the authors. It is
    not required that the text be modifiable, but it is encouraged. You can come up
    with your own license terms that satisfy this constraint, or you can use a previously
    prepared license. The LDP provides a boilerplate license that you can use, some
    people like to use the GPL, and others write their own.


    The copyright for each manual should be in the name of the head writer or coordinator
    for the project. “The Linux Documentation Project”


    ## Linux Documentation Project Copying License


    Last modified 6 January 1997


    The Linux Documentation Project allows you to copy, distribute, and modify any
    of its manuals, subject to the following conditions:


    - The copyright notice mentioned above must be preserved on all copies.

    - The copyright for each manual should be in the name of the head writer or coordinator
    for the project.

    - The Linux Documentation Project Copying License must be printed in its entirety
    in the Linux Documentation Project "Manifesto" that follows.

    - The Linux Documentation Project manuals are freely available via the GNU archive
    site.

    - We encourage Linux software distributors to distribute the LDP manuals (such
    as the Installation and Getting Started Guide) with their software. The LDP manuals
    are intended to be used as the "official" Linux documentation, and we''d like
    to see mail-order distributors bundling the LDP manuals with software.

    - ... etc.

    - If you have any questions, please ask the author, mdw@metalab.unc.edu.


    ## Publishing LDP Manuals


    If you''re a publishing company interested in distributing any of the LDP manuals,
    read on.


    By the license given in the previous section, anyone is allowed to publish and
    distribute verbatim copies of the LDP manuals. You don''t need our explicit permission
    for this. However, if you would like to distribute a translation or derivative
    work based on any of the LDP manuals, you must obtain permission from the author,
    in writing, before doing so.


    All translations and derivative works of LDP manuals must be placed under the
    Linux Documentation License in the previous section. That is, if you plan to release
    a translation of one of the manuals, it must be freely distributable.


    You may, of course, sell the LDP manuals for profit. We encourage you to do so.
    Keep in mind, however, because the LDP manuals are freely distributable, anyone
    may photocopy or distribute printed copies free of charge, if you wish to do so.


    We do not require to pay royalties for any profit from selling LDP manuals. However,
    we would like to suggest that if you sell LDP manuals for profit, that you offer
    the author royalties, or donate a portion of your earnings to the author, the
    LDP as a whole, or to the Linux development community. You may also wish to send
    one or more free copies of the LDP manual that you are distributing to the author.
    Your show of support for the LDP and the Linux community will be very appreciated.


    We would like to be informed of any plans to publish or distribute LDP manuals,
    just so we know how they''re becoming available. If you are publishing or planning
    to publish any LDP manuals, please send email to Matt Welsh (mdw@metalab.unc.edu).


    Matt Welsh, mdw@metalab.unc.edu

