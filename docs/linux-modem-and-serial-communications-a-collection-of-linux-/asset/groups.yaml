    # 3.3 What is the current I/O address and IRQ of my Serial Port?


    There are two answers to this question: 1. What the device driver has set (This
    is what setserial “sets”). 2. What is actually set in the hardware. Both should
    be the same. If you’ve-having trouble (including communication programs that can’t
    communicate) it may mean these two'
- md: '

    # Linux Modem and Serial Communications


    items are not set the same. In other words, this means the driver has incorrect
    info on the serial port. If the driver has the wrong I/O address it will try to
    send data to a non-existing serial port—or even worse, to an actual device that
    is not a serial port. If it has the wrong IRQ it will not get interrupt service
    requests from the serial port, resulting in the possible overflow of the serial
    port’s buffer and in very slow response (due to fallback to very slow “polling”
    methods instead of interrupts). If it has the wrong model of UART there is also
    apt to be trouble.


    ## What does the device driver think?


    How do you insure that the driver has the correct info? Well, if everything OK
    then there’s no need to look into this. But otherwise, it’s easy to see what the
    driver thinks. One way is to just type “serial-g /dev/ttyS*”. At boot-time, a
    message on the console would show this. You may look at /proc/ioports; it only
    shows the same I/O address which serial has “set” but not necessarily the way
    in the hardware. See the IRQs used by currently running processes (that have devices
    open) look at /proc/interrupts. It also shows how many interrupts have been issued
    (often thousands). None of the above tests show what is actually set in the device.
    But if everything works, the devices are likely set up what is in the hardware.


    ## What is in our serial port hardware?


    But how do you find out I/O address and IRQ are actually set in the device hardware?
    If the modem is PCI look at /proc/pei. If it’s ISA, then this is not always easy
    to do. Formerly one did this by checking how the jumpers were set on a modem card,
    serial card, or motherboard. One crude method is try probing with serserial using
    the “autoconfig” option. You’ll need to guess the addresses to probe. See what
    is Setserial.


    Plug-and-Play (PnP) modes (or PnP serial ports) on the ISA bus one may try the
    pnpdummy program (part of isapntools). pnpdummy will “find” the port and show
    various configuration options, but will not tell you its actual I/O address and
    IRQ. The address it “tries” is not the device’s I/O address, but a special read-port
    used only for PnP purposes. After getting some info using pnpdummy, this info
    may be used in isapnp command the “PEEK” keyword to find the I/O and IRQ. The
    command in isapnp-configuration file might look something like this (for vendor
    GVC1601, serial number 1): (CONFIGURE GVC1601/1 IO 0 (PEEK)). You need more than
    just this command and it isn’t foolproof (see the man page for isapnp). I know
    the above is not really adequate but if you succeeded in doing it you could write
    it up and see for the latest version of this HOWTO.


    Another approach is to see how it''s configured under MS-Windows (if you have
    it on the same machine). How it''s configured under MS-Windows may not be the
    same as for Linux, but it''s likely the same if you let PnP operating system do
    the configuring when you start (and have told BIOS).


    ## 3.4 Configuring


    ### Configuring Flow Control (RTS/CTS)


    See Flow Control for an explanation of it. You should always use flow control
    if possible. Your communication program or "getty" should have an option for setting
    it (and if you''re in luck it might be enabled by default). It needs to be set
    inside your modem (by init string or default) and in the device driver. If none
    of the above will fully enable flow control then you must do it yourself. For
    the modem, make sure it''s either by the init string or default. If you need to
    tell the device driver to do it is best done on startup by putting the following
    to such a file for each serial port (example is ttyS2):


    ```bash

    stty crcts < /dev/ttyS2

    ```


    If you want to see if flow control is enabled do the following: Minicom (or the
    like) type AT&V to see how the modem is configured and look for &K3. Then see
    if the device driver knows about it by typing: `stty -a < /dev/ttyS2`.


    ## 3.5 Modem Configuration (excluding serial port)


    ### AT Commands


    While the serial port on which modem resides configuring, so does the modem itself.
    The modem is configured by sending AT commands (or the like) to it on the same
    line that is used to send data. Most modems use an AT command set. These are cryptic
    and short ASCII commands where all command strings are prefaced by the letters
    AT. For example: ATZ&K3 There are two commands here:


    - Z0: Recalls user-profile 0 and resets (hang up)

    - &F0: Recalls factory 0

    - &W0: Saves the current configuration to user-profile


    Unfortunately there are many different variations of the AT command set so what
    works for one modem may or not work for another. Thus there is no guarantee that
    the AT commands given in this section will work on your modem. Another point is
    to get the modem to act on the AT command string, a return character must be sent
    at the end of the string. Sometimes the AT is preceded by a return character and
    sometimes there are symbols added to the string (such as) which only tell the
    communication program to pause for a tiny interval of time.


    If you have a manual for your modem you can quickly lookup the AT command set
    in it. Otherwise you may try to find it on the Internet. You may use a search
    engine and include actual commands in the search terms to avoid finding sites
    that just talk about commands but fail to list them. You may also try a few of
    the sites listed in the subsection.


    ### The Init String


    The examples given in this subsection are from the Hayes modem command set. All
    command strings must be preceded by the two letters AT. When a modem is powered
    on it automatically configures itself with one of the configurations stored in
    its non-volatile memory. If this configuration is satisfactory then there is nothing
    to do.


    If it''s not satisfactory, then one may alter it or reconfigure the modem by sending
    it a string of commands known as an "init string" (= initialization string). Most
    of the time, an init string is automatically sent to the modem when you start
    communication program (will depend on how you configured the program or what script
    you wrote for it if you use Kermit). You can usually edit the init string and
    change it to whatever you want. Sometimes the communications program will let
    you select the model of your and then use an init string that it thinks is best
    for modem.


    So there is both a default string (called a profile) stored inside the modem and
    another (the init string) that the communications program sends it. The modem
    will wind up like the default set except that it will be modified by the commands
    included in the init string. If the init string is empty then it will of course
    use the default configuration.


    Actually there is more than one "default" configuration (or profile) stored in
    the modem''s non-volatile memory (it''s still there when you turn it off). In
    my modem there are two profiles (0 and 1, neither of which can be changed) and
    two user-defined profiles (0 and 1) that the user may set and store. Your modem
    may have more. Which of these user-defined profiles is used at power-up depends
    on another item stored in the profile. If the command Y00 is given then in the
    future profile 0 will be used at power-on. If it''s a 1 instead of 0 profile 1
    will be used at power-on.


    There are also commands to recall (use it now) any of the 4 stored profiles. One
    may put such a command in an init string. Of course if it recalls the same profile
    as was loaded at powerup, nothing is changed (unless the init string is sent after
    the modem has been used for a while and had its configuration changed by software,
    etc.). It''s a good idea to use some kind of init string so that it may be reset.


    ### Other Modem Commands


    Future editions of Modem-HOWTO may contain more AT commands but the rest of this
    section is what was in the old Serial-HOWTO. All strings must start with AT. Here''s
    a few Hayes codes that should be in the string (if they are not set using a factory
    default or by a saved configuration).


    ```

    E1 command echo ON

    Q0 result codes are reported

    V1 verbose ON

    SO=0 never answer (ugetty does this with the WAITFOR option)

    ```

