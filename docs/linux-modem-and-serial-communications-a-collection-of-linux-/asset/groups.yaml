    Ted T''so 回答了关于串口驱动程序的问题，感谢曾维护 getty_ps 的 Kris Gleason 以及维护 mgetty 的 Gert Döring。”


    # Linux 调制解调器共享迷你指南 (mini-HOWTO)


    Friedemann Baitinger, baiti@topplink.net


    最后更新：


    V1.01, 97/02/11 源码现为 HTML 格式，添加了关于获取 ''cu'' 的引用，还添加了关于获取 mserver 的引用。在 ''cu''
    示例中添加了 ''-s'' 参数。


    V1.00, 97/12/06 初始发布


    # 引言


    本迷你指南 描述了如何设置 Linux 系统，以便通过 TCP/IP 网络共享连接到该系统的调制解调器与其他系统共享。


    # 服务器端


    假设服务器是一个 Linux 系统，并具有：


    - a) 连接到 /dev/ttySx 设备的调制解调器

    - b) 映射到 /dev/ttyIx 设备的 ‘isdn4linux’ 模拟调制解调器


    我能想的最简单设置是使用五行 perl 脚本来实现一个“调制解调器守护进程”（modem demon）：


    ```

    $ cat !/usr/bin/perl

    select((select(STDOUT), $) = 1) [$];

    select((select(STDIN), $) = 1) [$]);

    exec `cu -s 115200 -1 /dev/ttyS1`;

    die ''$00: Cant exec cu: $\n'';

    ```


    当客户端连接到如下合适的端口时，INETD 进程启动调制解调器守护进程。“modem modify”只需将 socket 连接到 cu 命令的 STDIN
    和 STDOUT，让‘cu’处理实际的调制解调器设备。如果你的系统中没有‘cu’，安装‘UUCCP’包，它通常是‘UUCCP’的一部分。


    必须通过更新其配置文件（通常是 /etc/inetd.conf）让 INETD 进程知道调制解调器守护进程的存在，如下：


    ```

    #

    # modem daemon

    #

    modem stream tcp nowait root /usr/sbin/tcp /usr/sbin/modem /dev/ttyS1

    ```


    为了使其生效，需要在 /etc/services 中添加如下条目：


    ```

    modem          2006/tcp          modemd

    ```


    106 Linux 调制解调器与串口通信


    这将符号名称与显式端口（示例中的 2006）关联。端口可以是任何未分配给现有服务的数字。完成这些更改后，必须向 inetd 进程发送信号，让 inetd 重新读取并处理配置文件：


    ```

    $ ps |lgrep inetd

    194 ? S 0:00 /usr/sbin/inetd


    kill -HUP 194

    ```


    现在服务器端已准备好接受客户端的请求。可以通过以下方式验证正确的功能：


    ```

    $ telnet localhost modem


    Trying 127.0.0.1...

    Connected to localhost.

    Escape character is ''^]''.

    ```


    你现在已连接到调制解调器。你现在可以发出 ''AT'' 命令来验证设置：


    ```

    atz

    at

    OK


    atil

    atil

    Linux ISD

    OK


    ]

    telnetquit

    $

    ```


    除了使用 Perl 脚本作为调制解调器服务器外，http://ftp.inetc.be/pub/staff/carl/ 上还有一个程序 ''mserver''可用。如果它已不存在，你可能想使用
    ''archie'' 或任何其他搜索引擎来定位 mserver 存档。我还没有机会安装和使用 mserver。


    # 3. 客户端


    此时，此处描述了 Windows 客户端设置。在客户端 PC 上，需要 TCP/IP 的 COM 端口重定向。我发现用于此目的的最佳程序是来自 ''Tactical
    Software'' 适用于 Windows 3.1 和 Windows 95 的 ''DialOut/IP。（Windows 3.1 版本可以在 Windows
    NT 下仅用于 16 位应用程序。适用于 Windows 的 32 位版本）。


    '
