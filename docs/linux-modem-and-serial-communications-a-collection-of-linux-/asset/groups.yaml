    ```

    define rz !rz < /dev/ttyS3 /dev/ttyS3

    define sz !sz \0 /dev/ttyS3 < /dev/ttyS3

    ```


    请确保填写你的调制解调器所在的正确端口。然后，只需在 kermit 提示符下输入 `rz` 或 `sz <filename>` 即可使用。


    ### 12.2 自动设置终端类型


    要在登录时自动设置终端类型，请将终端类型添加到 `/etc/inittab` 的条目中。如果我在 tty1 上有一个 vt100 终端，我会在 getty
    命令中添加 "vt100"：


    ```

    sl:456:respawn:/sbin/getty ttyS1 DT9600 vt100

    ```


    其他的 getty 也有类似的选项。你也可以使用 `tset`，它可以在登录时建立终端特性，且不依赖于任何默认值。


    ### 12.3 在串口连接上开启 ls 颜色


    如果 `ls` 的颜色功能搞乱了你的终端仿真，请将其关闭。`ls -color` 和 `ls -colour` 都使用颜色功能。某些安装将 `ls` 设置为默认使用颜色。检查
    `/etc/profile` 和 `/etc/csh.cshrc` 中的 `ls` 别名。如果你不想更改系统默认设置，也可以将 `ls` 别名为 `ls -no-color`。


    ### 12.4 打印到连接终端的打印机


    有一个名为 `vtprint` 的程序，可以在 ftp://fip.sdsu.edu/pub/vtprint 和 http://www.sdsu.edu/~garrett
    获取。


    另一个可以实现此功能的程序叫做 `xprt`。可以在 ftp://sunsite.unc.edu/pub/Linux/system/printing 找到。


    ### 12.5 Linux 能自动配置串口设备吗？


    如果是，且尚未设置（或接近设置），你可以让 Linux 在启动时自动检测并设置串口设备。需要添加以下行：


    ```

    /sbin/setserial3 /dev/tty3 skip_irq_test autoconfig

    ```


    将其添加到你的 `/etc/rc.d/rc.local` 或 `/etc/rc.d/rc.serial` 或 `/etc/rc.boot/0setserial`
    文件中。对你想要配置的每一个串口都执行此操作。确保给出一个在你的机器上真实存在的设备名称。


    #### 多端口板的注意事项


    对于板地址和 IRQ，请查看与 setserial 程序附带的 `rc.serial` 或 `/etc/rc.boot/0setserial`。它包含了关于多端口板的详细信息，包括
    I/O 地址和设备名称。


    ### 12.6 使用串口控制台


    《Linux Journal》第 36 期中有一篇关于串口控制台的文章。


    ### 12.7 串口上更高的吞吐量


    如果 `ls` 的颜色功能搞乱了你的终端仿真，请将其关闭……

