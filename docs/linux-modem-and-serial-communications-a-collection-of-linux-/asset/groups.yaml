    ## 3. Configuring Modems (including the serial port)


    If you want to use a modem only for MS Windows/Dos, then you can install almost
    any modem and it will work OK. With a Linux PC it''s not usually this easy unless
    you use an external modem. All external modems should work OK (even if they are
    labeled “Plug and Play”) But most internal modems are Plug-and-Play (PnP) and
    have PnP serial ports. You may need to use the Linux “isapnp” program to configure
    these PnP serial ports. See the Plug-and-Play-HOWTO for more information.


    ### 3.1 Configuring Overview


    - Configuring the modem itself: Done by the communication program

    - Configuring the modem''s serial port: Done only by the communication program


    Most of the above configuring (but not necessarily most of the effort) is done
    by the communication program that you use with the modem such as minicom or seyon,
    or by the PPP part of your Web Browser. If you use the modem for dial-in, then
    the getty program you use to present outsiders with a login-prompt, will help
    configure. Thus to configure the modem (and much of the serial port) you need
    to configure the communication program (or PPP or getty). The documentation for
    these programs and/or the PPP-HOWTO should be helpful.


    But note that not all of the configuration of the serial port is done by the communication
    program (or getty). The remaining configuring is simple to state (but sometimes
    difficult to do). It mainly consists of setting the I/O address of the port and
    its IRQ number. In fact, plug-and-play could set these without doing a thing.
    Linux (as of early 1999) doesn''t support plug-and-play very well. This may create
    a difficult problem for you.


    ### 3.2 Configuring the IRQ and IO-Address of the Serial Port


    Prior to firing up (and configuring) your communication program, you must do the
    configuring that your communication program can''t do. Oversimplified, this consists
    only of identifying the serial port on which the modem resides. It is ttyS2 (=COM3)
    or ttyS1 (=COM2) etc.? If you know the answer for sure (and there are no IRQ conflicts),
    then there is nothing to do and you may start your communication program.


    ## Modem-HOWTO (for Linux)


    Otherwise, you must establish the serial port identification and assign it an
    IRQ number. This is done by putting two values (an IRQ number and I/O address)
    into two places:


    - 1. A memory register of the serial port hardware itself

    - 2. the device driver (often by running “seterial” at boot-time)


    Both of the above are supposed to be done by a plug-and-play operating system
    (OS). For item 1, setting these numbers in a modem card (for the serial port in
    the case of an external modem) was formerly done by users. Today it''s supposed
    to be done at boot-time by plug-and-play (PnP).


    For item 2. if you accept the default settings there is no need to use seterial.
    But if you use “seterial the IRQ and IO address you tell it must be exactly the
    same as what is inside the serial port hardware (or will be set via PnP). We might
    call all this “io-irq” configuring for short. In the Windows world, the I/O address
    and IRQ are called “resources” and we are thus configuring certain resources.


    ## Plug-and-Play


    Plug-and-Play was designed to automate this io-irq configuring, but for Linux
    it has made life more complicated. The standard kernels for Linux don''t support
    plug-and-play. If you use a patch to the Linux kernel to covert it to a plug-and-play
    operating system, then all of the above should be handled automatically by the
    OS. But when you want to use this automate configuring devices other than the
    serial port, you may find that you will still have to configure the drivers manually
    since many Linux drivers are not written to support a PnP OS. If you use isapntools
    or the BIOS for configuring plug-and-play this will only put the two values into
    the serial port section of the modem card and you will likely still need to set
    up serial. None of this is easy or very well documented as of 1999. See Plug-and-Play-HOWTO.


    ## Using a PnP BIOS to I0-IRQ Configure


    While the explanation of how to use a PnP OS or isapntools for io-irq configuring
    could come with such software, this is not the case if you want to let a PnP BIOS
    do configuring. The BIOS usually has a CMOS menu for setting up the first two
    serial ports. There is often little to choose from. Unless otherwise indicated
    in the manual, standard I/O addresses and IRQ’s should be used by the BIOS. See
    Serial Port Device Names & Numbers


    Whether you like it or not, when you start up a PnP BIOS starts to do PnP (io-irq)
    configuring of hardware devices. It may do the job partially and turn the rest
    over to a PnP OS (which you don''t have) or if you don''t have a PnP OS it may
    fully configure all the PnP devices but not


    ## Linux Modem and Serial Communications


    ## Linux Modem and Serial Communications


    configure the device drivers. This is what you want but it''s not always easy
    to figure out exactly what the PnP BIOS has done.


    If you tell the BIOS that you don''t have a PnP OS, the PnP BIOS should do the
    configuring of all PnP serial ports—not just the first two. If you have MS Windows
    on the same PC, the BIOS should have saved the io-irq configuration used for MS
    Windows in its non-volatile memory and use the same configuration for Linux. In
    this case if you can find out how MS Windows has set its io-irq then it should
    be the same under Linux.


    If you add a new PnP device, the BIOS should change its PnP configuration to accommodate
    it. It could even change the io-irq of existing devices to avoid any conflicts.
    For this purpose, it keeps a list of non-PnP devices provided that you have told
    the BIOS these non-PnP devices are io-irq configured. One way to tell the BIOS
    is by running a program ICU under MS Windows.


    But how do you find out what the BIOS has done so that you set up the device drivers
    with this info? It would be nice the BIOS''s CMOS menus provided this info but
    they probably don''t (except for COM1 and COM2). So it might be quite a hassle
    to find out. See What is set in my serial port-hardware?


    ## External Modems


    If you use an external modem and plug it into say the ttyS1 connector, then there''s
    (usually) no io-irq configuring to do ttyS1 has likely been configured. Your CMOS
    setup may have to do this for COM1 and COM2.


    ## More Than 2 Serial Ports


    Normally you don''t need to configure the first two serial ports since the Linux
    distribution built into it you have nothing to do. Everything is different when
    you want to add a third port. Unless you use a plug-and-play operating system
    you have to do it yourself. To do this (as already mentioned) you''ll need to
    run seterial: Assigns ttyS2 to an I/O address and IRQ number.


    ## Methods for Setting I/O Addresses and IRQs


    Here’s a summary of what was just discussed (and more). The modem is entirely
    configured by sending commands to it from the communication program (such as the
    baud rate and hardware control). For more details on PnP see Plug-and-Play-HOWTO.
    You configure the io-irq of the serial port by:


    - Setting the IRQ number and I/O address in the port hardware (io-irq) by doing
    one of the following:

    - Doing nothing for an external modem where the existing io-irq is OK

    - Using a PnP setup menu for an external modem (usually only for ttyS0 (Com1)
    and ttyS1 (Com2))

    - Doing nothing if you have both a PnP internal modem and a PnP Linux operating
    system.

    - Setting jumpers (if they exist) on internal modem, old serial card, or old motherboard

    - Using isapnp for a PnP internal modem (non-PCI)

    - Letting a PnP BIOS automatically configure PnP internal modem (but it may be
    difficult to determine just what that configuration is).

    - Using a setup program which comes with the modem (run under MS Windows) that
    disables PnP


    - 2. "seterial": Assigns ttyS2 to an I/O address and IRQ number. Except that you
    probably don’t need to run it if you have only1 or 2 serial ports total or if
    you use a PnP operating system.


    ## Avoiding I/O Address Conflicts: IBM 8514 Video Board


    The I/O address of the IBM 8514 board (and it’s) is allegedly 0x2e8, the same
    as the I/O address of ttyS3. bad news if you try to use ttyS3 at this I/O address.


    ## 3.3 What is the current I/O address and IRQ of my Serial Port?


    There are two answers to this question: 1. What the device driver has set (This
    is what setserial “sets”). 2. What is actually set in the hardware. If you’ve-having
    trouble (including communication programs that can’t communicate) it may mean
