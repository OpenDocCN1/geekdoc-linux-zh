    # 9. 我的调制调器应该使用什么种速度？


    我们所说的“速度”实际上是指“数据流速率”，但几乎每个人都错误地称其为速度。对于所有调制调器，你无法选择调制调器在电话线上的使用速度，因为它会根据你的环境自动选择可能的最高速度。但你可以选择调制调器和计算机之间使用什么速度。这有时被称为“DTE
    速度”，其中 DTE 代表数据终端设备（你的电脑就是 DTE）。你需要将此速度设置得足够高，以免信号路径的一部分成为瓶颈。DTE 速度的设置是该链路的最大速度。大多数时候，它可能会以较低的速度运行。


    对于外部调制调器，DTE 速度是经过调制调器和 PC 之间电缆的流量（比特/秒）。对于内部调制调器，原理是一样的，因为调制调器也模拟了串口。在计算机和直接连接到计算机内部更高速总线上的调制调器卡之间设置速度限制似乎很荒谬。但这是因为调制调器卡可能包含一个专用串口，该串口是有速度限制的（并且可以设置速度）。


    # 9.1 速度与数据压缩


    你选择什么速度？如果没有“数据压缩”，人们可能会尝试选择与调制调器速度完全相同的 DTE 速度。数据压缩会将计算机发送到调制调器的字节，并将其编码为更少的字节。例如，如果
    PC 到调制调器的流量（速度）为 20,000 字节/秒 (bps)，而压缩比为 2:1，那么电话线上的流量将只有 10,000 字节/秒。因此，对于 2:1
    的压缩比，你需要将速度设置为电话线上调制调器最大速度的两倍。如果压缩比为 3:1，你需要将其设置为快 3 倍。


    # 9.2 我在该处设置速度？


    DCE 速度通常通过你的通信程序中的菜单设置，或者在有人拨号时通过提供给 getty 命令的选项设置。无法无法调制调器到调制调器之间的速度。


    # 9.3 无法设置高速度


    你需要找到硬件支持的最高速度。截至 1998 年底，大多数硬件仅支持 115.2K 以下的速度。少数 56K 内部调制调器支持 230.4K。如果你使用的通信程序在其菜单中没有显示足够的速度，你可以提供给
    `setserial` 命令的选项，以便通信程序中的低速度能产生较高的速度。通过这些选项，当你将速度设置为 38400 时，实际速度将高得多。请参阅“setserial”的手册页并搜索
    `sp_hi`、`sp_di`、`sp_cust`、`baud_base` 和 `divisor`。注意，你必须将 `baud_base` 设置为硬件的实际最大速度。此速度通常低于硬件中晶体振荡器的频率，晶体频率通常除以
    16 得到实际速度。要在 tty2 上获得 23400 的速度（如果你的串口使用的是该速度），你可以：


    ```

    setserial /dev/tty2 baud_base 23400 divisor 1

    ```


    在某些情况下，使用“stty 23400” 是无效的。如果你使用了 `sp_cust`，你必须在其他地方声明速度为 38400。这种设置速度的方法是一种黑客手段（hack），当应用程序跟上更高速度时，可能就不需要了。


    # 9.4 速度表


    对于 56K 调制调器，最好是至少拥有 16550 UART，但很少调制调器支持它。次优是 1550，它经过调整可以达到 230400 bps。如果你的调制调器速度如下，这里是设置你的串口线路的一些建议速度：


    | 速度 | 建议设置 |

    | :--- | :--- |

    | 56K (V.90) | 115200 bps 或 230400 bps |

    | 28.8K (V.34), 33.6K (V.34) | 115200 bps |

    | 14400 bps (V.32bis)，带有 V42bis 数据压缩 | 57600 bps |

    | 9600 bps (V.32)，带有 V42bis 数据压缩 | 38400 bps |

    | 低于 9600 bps (V.32) | 将速度设置为最高的调制调器端口 |


