    \ If you send \"help\" in the message body, you get a help message. The server\
    \ also serves many other Linux lists. Send the \"lists\" command for a list of\
    \ mailing lists.\n\n- A white paper discussing serial communications and multiport\
    \ serial boards is available at Cyclades at http://www.cyclades.com.\n\n- Modem\
    \ FAQs:\nNavas 28800 Modem FAQ\nCurt's High Speed Modem Page\n\n# 16. Contributions\n\
    \nMost of the original HOWTO was written by Greg Hankins, greg.hankins@cc.gatech.edu\
    \ He also rewrite many contributions by others in order to maintain continuity\
    \ in the writing style and flow wrote: \"Thanks to everyone who has contributed\
    \ or commented, the list of people has gotten too long to list (somewhere over\
    \ one hundred). Special thanks to Ted T'so for answering questions about the serial\
    \ drivers, Kris Gleason who used to maintain getty_ps, and Gert Döring who maintains\
    \ mgetty.\n\n# Linux Modem sharing mini-HOWTO\n\nFriedemann Baitinger, baiti@topplink.net\n\
    \nlast update: \n\nV1.01, 11/02/97 source now in HTML format, added a reference\
    \ on where to get 'cu', also added a reference on where to get mserver. '-s' parameter\
    \ added to 'cu' example.\n\nV1.00, 06/12/97 Initial release\n\n# Introduction\n\
    \nThis mini-HOWTO describes how to setup a Linux system in order to share a modem\
    \ attached this system with other systems over a TCP/IP network.\n\n# The Server\
    \ Side\n\nIt is assumed that the server is a Linux system with either:\n\n- a)\
    \ a modem attached to a /dev/ttySx device\n- b) an ‘isdn4linux’-emulated modem\
    \ mapped to a /dev/ttyIx device\n\nThe easiest setup I can think of uses a five\
    \ lines perl script to implement a ‘modem demon’:\n\n```\n$ cat !/usr/bin/perl\n\
    select((select(STDOUT), $) = 1) [$];\nselect((select(STDIN), $) = 1) [$]);\nexec\
    \ `cu -s 115200 -1 /dev/ttyS1`;\ndie '$00: Cant exec cu: $\\n';\n```\n\nThe modem\
    \ demon is started by the INETD process if a client connects to the appropriate\
    \ port as described below. The ‘modem modify’ simply connects the socket to STDIN\
    \ and STDOUT of the cu’ command and lets ‘cu’ handle the actual modem device.\
    \ In case you don’t have ‘cu’ on your system, install the ‘UUCCP’ package, which\
    \ is usually part of ‘UUCCP’.\n\nThe existence of the modem demon must be made\
    \ known to the INETD process by updating its-figuration file, usually /etc/inetd.conf\
    \ like:\n\n```\n#\n# modem daemon\n#\nmodem stream tcp nowait root /usr/sbin/tcp\
    \ /usr/sbin/modem /dev/ttyS1\n```\n\nIn order to make this work, an entry to /etc/services’\
    \ needs to be added like:\n\n```\nmodem          2006/tcp          modemd\n```\n\
    \n106 Linux Modem and Serial Communications\n\nThis associates a symbolic name\
    \ with an explicit port, 2006 in the example. The portnumber could be any number\
    \ not already assigned to an existing service. After these changes have been made,\
    \ a sig-nal must be set to the inetd process in order to let inetd re-read and\
    \ process its configuration file:\n\n```\n$ ps |lgrep inetd\n194 ? S 0:00 /usr/sbin/inetd\n\
    \nkill -HUP 194\n```\n\nNow the server side is ready to accept requests from clients.\
    \ The correct function can be verified by:\n\n```\n$ telnet localhost modem\n\n\
    Trying 127.0.0.1...\nConnected to localhost.\nEscape character is '^]'.\n```\n\
    \nYou are now connected to the modem. You can now issue 'AT' command in order\
    \ to verify the setup:\n\n```\natz\nat\nOK\n\natil\natil\nLinux ISD\nOK\n\n]\n\
    telnetquit\n$\n```\n\nInstead of using the Perl script as a modem server, there\
    \ is also a program 'mserver' avail-able on http://://ftp.inetc.be/pub/staff/carl/.\
    \ In case it is not there anymore, you may want to use 'archie' or any other search\
    \ engine in order to locate the mserver archive. I haven't had the oppor-unity\
    \ yet to install and use mserver.\n\n# 3. The Client Side\n\nAt this time, only\
    \ Windows client setups are described here. On the client PC, a COM-port redirection\
    \ for TCP/IP is required. The best program for this purpose I have found is 'DialOut/IP'\
    \ from 'Tactical Software' for Windows 3.1 and Windows 95. (The Windows 3.1 version\
    \ can be used under Windows NT for 16-bit applications only. A 32-bit version\
    \ for Windows NT is due late summer 1997.)\n\nDialOut/IP presents the shared model\
    \ on a new virtual COM port that adds to Windows. This virtual COM port can be\
    \ used by Windows programs as if the shared model is directly connected. Most\
    \ client applications (including Windows 95 dial-up networking) accept this and\
    \ as if there were a real COM port and modem, with the exception being fax applications\
    \ or any others that need UART control lines. DialOut/IP can be configured to\
    \ provide Telnet protocol processing, but that feature allows certain modem pool\
    \ products and not to the Linux setup described in this file. Note that, despite\
    \ its name, DialOut/IP can be used also by applications that wait for incoming\
    \ calls.\n\nOn www.sw.com there is a page for downloading a fully functional evaluation\
    \ version that times out in 1-2 weeks. Installation and configuration is handled\
    \ by a setup program, with installation details in the README.TXT file. When you\
    \ run DialOut/IP, you enter the IP address and port number of the shared modem.\n\
    \nDialOut/IP is a commercial product that is licensed on a per-modem basis, that\
    \ is, the price depends on the number of modems that you are sharing. The license\
    \ states that you can install the software on any number of PCs' that access the\
    \ shared modems.\n\n# 4. Security Considerations\n\nIf you have only one modem\
    \ for all your hosts in your local area network, there is probably no reason to\
    \ worry about security here. However, if one or more of the hosts in your LAN\
    \ are connected to the internet by other means using the modem we have just as\
    \ a modem server, then security considerations are required, otherwise anybody\
    \ can do a 'telnet your_host modem' and dial long distance or even international\
    \ calls at his will.\n\nI suggest to install and configure tcp-wrappers in order\
    \ to protect the modem server against unauthorized access.\n\n# 5. Examples\n\n\
    I am using the setup as described in (2) and (3) to run Quicken on my Windows\
    \ 95 ThinkPad and homebanking with the modem attached to my Linux machine. The\
    \ 'modem' in my case is not even a modem, it is an ISDN-So card. Quicken just\
    \ sees COM port, it doesn't know that the device attached to the port is actually\
    \ at the other end of my Ethernet LAN, nor does it know that it is not a standard\
    \ modem but an ISDN device which happens to understand 'AT' commands.\n\n# Leased\
    \ line Mini HOWTO\n\nRob van Putten , rob@sput.web.nl\nv14.4, 5 July 1998\n\n\
    The most recent (beta) version of this HOWTO can be found at: www.sput.web.nl\n\
    \n# What is a leased line\n\nAny fixed, that is permanent, point to point data\
    \ communications link, which is leased from a telco or similar organisation. point\
    \ data communications link, which is leased from a telco or similar organisation.\n\
    The leased line involves cables, such as twisted pair, coax or fiber optic, and\
    \ may involve all sorts of other hardware such as (pupin) coils, transformers,\
    \ amplifiers and regenerators.\n\nThis document deals with:\n\n- Configuring your\
    \ modem and pppd to use a 2 wire twisted pair leased line.\n\nThis document does\
    \ NOT deal with:\n\n- SLIP, getting or installing pppd, synchronous data communication,\
    \ baseband modems.\n\n# Assumptions\n\nYou should already have a working pppd\
    \ on your system.nYou also need Minicom or a similar program to configure your\
    \ modems.\n\n# Modem\n\nA leased line is not connected to a telephone exchange\
    \ and does not provide DC power, dial tone, busy tone or ring signal. This means\
    \ your modems are on their own and have to be able to deal with this situation.\n\
    You should have 2 identical external modems supporting both leased line and dumb\
    \ mode. Make your modems can actually do this! You also need:\n\n- 2 wired shielded\
    \ RS232 cables. The shield should be connected to the connector shell (not pin\
    \ 1) at both ends (not at one end).\n- A RS232 test plug may be handy for test\
    \ purposes.\n- 2 RJ11 cords, one for each end of the leased line.\n- A basic understanding\
    \ of 'AT' commands.\n"
