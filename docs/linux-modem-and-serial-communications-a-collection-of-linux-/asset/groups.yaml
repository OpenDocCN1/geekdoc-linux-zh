    the DHCP mini-HOWTO (http://sunsite.unc.edu/LDP/HOWTO/mini/DHCP.html) and configure
    your system appropriately-ly. There is no other necessary configuration.


    Additional information by Mihai Petre (mihaip@videotron.ca):


    Yes they are using DHCP for the tep settings. They have also included dhcped on
    their ftp server at (ftp://ftp.videotron.ca/pub/linux/). Of course that the tech.
    support cannot help u for the linux related stuff.'
