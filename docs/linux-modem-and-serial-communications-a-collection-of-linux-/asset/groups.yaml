    SLiRP 一样。有一份不再维护的 Term HOWTO。


    ## 11. 什么是 UART？它们如何影响性能？


    UART（通用异步收发传输器）是你的 PC 主板上（或内部调制解调器卡上）的串行芯片。UART 功能也可以在执行其他任务（如排序）的芯片上完成。在像 486
    这样较旧的电脑上，芯片位于磁盘 I/O 控制器卡上。更旧的电脑仍有专用的板卡。


    UART 的作用是将来自 PC 并总线的字节转换为串行位流。从串口引出的电缆每个流向方向只有一根线。端口向外发送位流，一次发送一个位。相反，通过外部电缆进入串口的位会被转换为计算机可以理解的并行字节。UART
    以分块的大小处理数据，而块的大小恰好也是 ASCII 字符的大小。


    假设你有一个终端连接到你的 PC。当你输入一个字符时，终端会将该字符交给发送器（也是一个 UART）。发送器以特定的速率将该字节发送到串行线上，一次发送一个位。在
    PC 端，接收 UART 获取所有位并重构出（并行）字节，然后将其放入缓冲区。


    UART 有两种基本类型：哑 UART（dumb UART）和 FIFO UART。哑 UART 指的是 8250、16450、早期的 16550 和早期的
    16650。它们已经过时了，但如果你理解它们的工作原理，就很容易理解现代的带有 FIFO 功能的 UART（晚期的 16550、16550A、16c552、晚期的
    16650、16750 和 16950）是如何工作的。


    关于 16550 存在一些误解。早期型号有一个 bug，只有作为 16450 才能正常工作。后来修复了 bug 的型号被命名为 16550A，但许多制造商不接受更更改，继续称其为
    16550。今天使用的大多数 16550 都像 16550AS。即使你的硬件（或标签注释）显示它是 16550，Linux 也会报告其为 16550A。16650
    也存在类似的情况（据称直到制造商没有承认有任何问题后才是如此）。Linux 会将晚期的 16650 报告为 16550V2。如果它报告为 16500，那就是坏消息，它被使用时就像只有一个
    1 字节缓冲区一样。


    为了理解哑 UART 和 FIFO（先进先出队列调度）之间的区别，让我们看看当 UART 发送或接收字节时发生了什么。UART 本身无法对通过它的数据做任何操作，它只是负责接收和发送。对于原始的哑
    UART，每当发送或接收一个字节时，CPU 都会收到来自串口设备的设备的中断。CPU 将接收到的字节从 UART 缓冲区移到内存的某处，或者给 UART 另一个字节进行发送。8250
    和 16450 UART 只有 1 字节缓冲区。这意味着每当发送或接收一个字节时，CPU 都会被中断。在低传输速率下这是没问题的。但在高速率下，CPU 会忙于处理
    UART，没有时间充分地处理其他任务。在某些情况下，CPU 无法及时处理中断，UART 就会被覆盖，因为数据来得太快了。这被称为“溢出”（overrun）或“越界”（overflow）。


    这正是 FIFO UART 发挥作用的地方。16550 FIFO 芯片带有 16 字节缓冲区。这意味着在它重新中断 CPU 之前，它可以接收或发送（16 个字节）。它不仅可以等待，CPU
    随后还可以一次接收 14 个（或更多）字节。虽然中断阈值（触发电平）可能被设置为 8 而不是 14，但与那些只有 1 字节缓冲区的其他 UART 相比，这仍然是一个巨大的优势。CPU
    接收到更多的中断，从而空闲去做其他事情。数据丢失了，大家都很开心。


    虽然大多数 PC 拥有带有 16 字节缓冲区的 16550，但更好的 UART 具有更大的缓冲区。注意，中断是在缓冲区填满稍前发出的（例如对于 16 字节缓冲区设置“触发电平”为
    14 字节）。这允许在处理中断期间多接收几个字节。内核软件可以将触发电平设置为各种允许的值。触发电平设为 1 几乎就像哑  UART（不同于它在发出中断后仍有空间容纳另外
    15 个字节）。


    如果你在访问 BBS 时输入内容，你通过串口输入的字符。你在屏幕上看到的输入字符是通过电话线经过你的调制解调器，然后通过串口回传到屏幕上的。如果串口上有一个
