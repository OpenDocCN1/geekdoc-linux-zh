    Linux 下运行，同时暗示另一个型号则不行。


    据作者所知，Linux 几乎没有支持 winmodems 的努力。你可以要求调制解调器制造商将他们的代码移植到 Linux（或类似的操作）。


    ## 4.5 应该避免哪些内置调制解调器？


    - 避免：winmodems 或类似设备。它们**完全无法工作**

    - PCI 调制解调器在 Linux 下通常无法工作

    - MWave 和 DSP 调制解调器可能工作，但前提是你每次启动电脑时都先启动 Windows/Dos

    - 带有 RPI (Rockwell) 程序的调制解调器性能会降低


    ## MWave 和 DSP 调制解调器


    这类调制解调器使用 DSP（数字信号处理器），通过算法编程，这些算法必须在使用调制解调器之前从硬盘下载到 DSP 内存中。遗憾的是，下载是由 Dos/Windows
    程序完成的，因此无法在 Linux 下完成。可以在 Linux 下工作的普通调制解调器通常也有 DSP（可能在包装上注明），但运行它的程序存储在调制解调器内部。这并不是本节意义上的“DSP
    调制解调器”，在 Linux 下应该运行正常。


    如果 DSP 调制解调器模拟串口，那么它就可以配合通过串口进行通信的 Linux 使用。如果你在同一台电脑上也有安装 Dos/Windows，你可能可以使用该调制解调器：首先启动
    Dos/Windows（确保调制解调器已初始化），然后在不关闭电脑的情况下进入 Linux。一种方法可能是按下 CTRL-ALT-DEL。DSP 调制解调器的示例是
    IBM 的 Aptiva MWAVE。


    ## Rockwell (RPI) 驱动


    需要 Rockwell RPI 驱动的调制调器无法无法使用，因为驱动软件在 Linux 上无效。RPI 使用电脑 CPU 上的 MS Windows 软件进行压缩和纠错。如果你愿意不使用
    RPI 而操作调制解调器（既没有压缩也没有纠错），你可以在每次启动调制解调器时，通过初始化字符串向其发送一个命令来轻松禁用 RPI。该命令是 +H0。拥有数据压缩功能可能并不是什么障碍，因为你从互联网下载的大多数长文件已经压缩过了，进一步尝试压缩可能稍微变慢。


    ## PCI 调制解调器


    PCI 调制解调器是插入 PC 主板上 PCI 总线槽的设备。遗憾的是，大多数 PCI 调制解调器在 Linux 下无法工作。但由于已经有人让 PCI 调制解调器在
    Linux 下运行，似乎极少数此类调制解调器是在 Linux 下可以工作的。


    安装 PCI 调制解调器后，查看 `/proc/pci`。如果你看到高主内存地址（地址 0xfbff0），它是通过共享内存工作的，而 Linux 不支持这种。如果没有这种高内存地址，且你看到的唯一地址是
    0xffff 下的 I/O 地址，那么它可能运行正常。我不确定应该为了查找什么样的 `/proc/pci` 特征来判断调制解调器是否能在 Linux 下工作。如果此请求仍出现在此
    HOWTO 的最新版本中，请向我提供可以在 Linux 下运行的调制解调器的 `/proc/pci` 是什么样的信息，或者告诉我在 `/proc/pci`
    中应该寻找哪些特征来确定调制解调器是否能与 Linux 工作。


    ## 5. 串口设备：/dev/ttySN


    ### 5.1 串口设备名称与编号


    Linux 中的设备具有主号和次号。每个串口可能有 4 种可能的名称，其中只有 2 个是官方的并位于 `/dev` 目录中：ttyS 已弃用，未来可能不再使用。查看
    cuA 设备。Dos/Windows 使用 COM 名称，或设置程序使用 tty00、tty01 等。不要混淆 `dev/tty0`、`dev/tty1`
    等，这些用于控制台（你的 PC），但不是串口。


    | set- | major | minor | major | minor | address |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | COM1 tty00 | /dev/ttyS0 | 4, 64 | /dev/cua0 | 5, 64 | 3F8 |

    | COM2 tty01 | /dev/ttyS1 | 4, 65 | /dev/cua1 | 5, 65 | 2F8 |

    | COM3 tty02 | /dev/ttyS2 | 4, 66 | /dev/cua2 | 5, 66 | 3E8 |

    | COM4 tty03 | /dev/ttyS3 | 4, 67 | /dev/cua3 | 5, 67 | 2E8 |


    ## Linux 调制解调器与串口


    注意，所有的发行版都带有 ttyS 设备（以及 cua 设备），并且应该是正确的。你可以通过输入以下命令验证这一点：


    ```bash

    ls /dev/ttyS*

    ls /dev/cua*

    ```


    ### 5.2 创建设备


    在 `/dev` 目录，如果没有设备，你需要用 `mknod` 创建。例如，假设你需要制作设备，你会使用：


    ```bash

    cd /dev

    mknod /dev/ttyS0 c 4 64

    ```


    ### 5.3 连接 ttySN


    区别是什么？cua 和 ttyS 的区别在于普通的“open”命令。在某些安装中，你可以使用：


    ```bash

    ln -s /dev/cua0 /dev/ttyS0

    ```


    ### 5.4 cuA 设备


    每个 ttyS 设备都有一个对应的 cua 设备。计划最终废除 cua，因此最好使用 ttyS。


    从 Linux 内核 2.2 开始，使用 cua 时内核日志中会出现一条警告信息。这是 cua 将消失的预兆。


    ## 6. 你应该了解的程序


    ### 6.1 什么是 getty？


    “getty”是一个在登录 Linux 时处理登录过程的程序。如果你想通过调制解调器拨入你的 Linux PC，你需要使用某种类型的 getty。如果你只想通过调制解调器拨出，则不需要
    getty。有三种 getty 版本可以在 Linux 下配合调制解调器工作：getty、getty_ps 和 aget。getty 是最简单中最弱的，主要用于文本终端。这些程序的语法不同，请确保你使用的
    getty 具有正确的语法。如果这个句子出现在此 howto 的最新版本中，那么如果你能写几段比较 getty 和 getty_ps 等的文字，请提交给我以便包含在这里。getty
    只有几年历史，似乎比旧的 getty_ps 更受欢迎。


    ### 关于 mget


    mget 是一个主要用于调制解调器的 getty 版本。它可以用于硬接终端，但文档 99% 是关于调制解调器的。除了允许拨号登录外，它还提供了 FAX 支持和自动
    PPP 检测。还有一个名为 vgetty 的补充程序可以处理某些调制解调器的语音箱。mget 文档（textinfo 格式）很好，不需要补充。请参阅安装说明。

    '
