    modem cable.


    For a reliable link, your setup should meet the following criteria:


    +   - Shortly after booting your system, pppd should raise the DTR signal in your
    RS232 port, wait

    for DCD to go up, and negotiate the link.


    +   - If the remote system is down, pppd should wait until it is up again.'
  - '[PAGE 139]


    +   - If the link is up and then goes down, pppd should reset the modem (it does
    this by dropping and then raising DTR), and then try to reconnect


    +   - If the quality of the link deteriorates too much, pppd should reset the
    modem and then re-establish the link.


    +   - If the process controlling the link, that is the pppd, dies, a watchdog
    should restart the pppd.


    # Configuration


    Suppose the modem is connected to COM2, the local IP address is ‘Loc_Ip’ and the
    remote IP address is ‘Rem_Ip’. We want to use 576 as our MTU. The /etc/ppp/options.ttyS1
    would be:


    ```

    crcts

    mru 576

    mtu 576

    passive

    Loc_Ip:Rem_Ip

    -chap

    modem

    -pap

    ppersist

    ```


    So, if the local system is 192.168.1.1 and the remote system is 10.1.1.1, then
    /etc/options.ttyS1 on the local system would be:


    ```

    crcts

    mru 576

    mtu 576

    passive

    192.168.1.1:10.1.1.1

    -chap

    modem

    -pap

    ppersist

    ```'
  - "[PAGE 140]\n\nThe options.ttyS1 on the remote system would be:\n\n```\ncrtscts\n\
    mru 576\nmtu 576\npassive\n10.1.1.1:192.168.1.1\n-chap\nmodem\n-pap\npersist\n\
    ```\n\nThe passive option limits the number of (re)connection attempts.\nThe persist\
    \ option will keep pppp alive in case of a disconnect or when it can't connect\
    \ in the first place.\nIf you telnet a while doing filetransfers (FTP or webbrowsing)\
    \ at the same time, you might want to use a smaller MTU and MRU such as 296. This\
    \ will make the remote system more responsive.\n you don't care about telnetting\
    \ during FTP, you could set the MTU and MRU to 1500.\n\n# Scripts\n\nStarting\
    \ the pppd and keeping it alive\nThe script /usr/local/sbin/PRem_Host.sh shown\
    \ below starts the pppd. You have to start it after the com ports are configured\
    \ (substitute Rem_Host with the remote host's name).\n\n```\n#!/bin/bash\n# Optional\
    \ sleep\n# /usr/bin/sleep 30\n( /usr/sbin/pppd /dev/ttyS1 115200 ) &\n```\n\n\
    It could be the script which configures your networkcard (/etc/init.d/network\
    \ on Debian systems), in which case you will have to uncomment the sleep, to make\
    \ sure the com ports are configured first.\nIf you use retails, you could call\
    \ it from there. Another way is to call it from rc.local.\nOn Debian systems,\
    \ there is a directory /etc/rc.boot/. According to Rolf Raar, the scripts in this\
    \ Directory are executed in alphabetical order. The seterial script is called\
    \ 0seterial. If you call your script from a script called 2leased-lines, it will\
    \ be executed after 0seterial."
- md: "\n118 Linux Modem and Serial Communications\n\nThough persist option should\
    \ make this superfluous, the pppd can also be restarted using ip-down,\n\n```bash\n\
    #!/bin/bash\ncase $s in\n  /dev/ttyS)\n    /usr/bin/sleep 30\n    /usr/local/sbin/PRem_Host.sh\
    \ &\n  esac\n```\n\nIf the pppd dies should be restarted by the persist option\
    \ or the ip-up script (optional). If this doesn't happen the script /usr/local/sbin/Test-Rem-Host-pppd\
    \ restarts for you. This script checks if the remote interface exists and will\
    \ try to start the pppd if it doesn’t,\n\n```bash\n#!/bin/bash\nif ! ( /sbin/ifconfig\
    \ | grep Rem_Ip / / /dev/null )\nthen\n  # PPP gone\n  logger \"Rem_Host PPP gone\
    \ ; restarted\"\n  /usr/local/sbin/PRem_Host.sh &\nfi\n```\n\nThe following line\
    \ in crontab runs the above script every 5 minutes. You could run the script often\
    \ if you like but I would not run it more often once every two minutes.\n\n```\n\
    5 * * * * /usr/local/sbin/test-Rem-Host-pppd\n```\n\nYou can edit the crontab\
    \ with ‘crontab -e’. This will restart cron after editing. It uses the editor\
    \ specified by the ‘EDITOR’ environment variable, which may be set by /etc/profile\
    \ or ~/.profile (export EDITOR=Your_Favourite_Editor).\n\nSome people run pppd\
    \ from /etc/init.d, but I never tested this.\n\n## Setting the routes\n\nThe default\
    \ route can be set with the defaultroute option or with the /etc/ppp/ip-up script,\n\
    \n```bash\n#!/bin/bash\ncase $2 in\n  /dev/ttyS1)\n    /sbin/route add -net 0.0.0.0\
    \ gw Rem_Ip netmask 0.0.0.0\n;;\nesac\n```\n\nIp-up can also be used to sync your\
    \ clock using ntp.\n\nOf course the route set in ip-up is not necessarily the\
    \ default route. Your ip-up sets the route to the remote network while the ip-up\
    \ script on the remote system sets the route to your network. If your network\
    \ is 192.168.1.0 and your ppp interface 192.168.1.1, the ip-up script on the remote\
    \ machine looks like this:\n\n```bash\n#!/bin/bash\ncase $2 in\n  /dev/ttyS1)\n\
    \    /sbin/route add -net 192.168.1.0 gw 192.168.1.1 netmask 255.255.255.0\n \
    \ ;;\nesac\n```\n\nThe 'case $2' and '/dev/ttyS1)' bits are there in case you\
    \ use more than one ppp link. Ip-up will run each time a link comes up, but only\
    \ the part between '/dev/ttySx' and ';;' will be executed, setting the right route\
    \ for the right ttyS.\n\nYou can find more about routing in the NET-3-HOWTO section\
    \ on routing.\n\n## Test\n\nTest the whole thing just like the modem test. If\
    \ it works, get on your bike and bring the remote modem to the remote side of\
    \ your link.\n\n# Cable-Modem-mini-HOWTO\n\nVladimir Vuksan, vuksan@veus.hr\n\n\
    v3.15, 6 December 1998\n\nThis document attempts to answer basic questions on\
    \ how to connect your Linux box: to cable modem or cable Internet provider.\n\n\
    ## 1. Introduction\n\nThe main goal of this document is to get your system running\
    \ with your cable modem, and cable internet provider. Unfortunately, many ISPs\
    \ provide cable modem services, give you Windows and Macintosh software only.\n\
    \nThis document attempts to explain how to setup some cable modems and internet\
    \ providers in Linux, the tricks to get them working correctly, and the traps\
    \ not to fall down. It is hoped that this document will assist you, however we\
    \ make no claims for the validity of the information contained.\n\n### 1.1 New\
    \ Versions of this Document\n\nNew versions of this document will be periodically\
    \ posted to comp.os.linux.answers. They will also be added to the various anonymous\
    \ FTP sites which archive such information, including:\n\nhttp://sunsite.unc.edu/pub/Linux/docs/HOWTO\n\
    \nIn addition, you should generally be able to find this document on the Linux\
    \ Documentation Project page via:\n\nhttp://sunsite.unc.edu/LDP/\n\n### 1.2 Feedback\n\
    \nFeedback is most certainly welcome for this document. Without your submissions\
    \ and input, the document wouldn't exist. So, please post your additions, comments\
    \ and criticisms to vuksan@veus.hr.\n\n### 1.3 Contributors\n\nThe following people\
    \ have contributed to this mini-HOWTO.\n\n- Dan Sullivan, dsulli@home.com\n- Andrew\
    \ Novick\n- Michael Strates\n\n### 1.4 Standard Disclaimer\n\nNo liability for\
    \ the contents of this documents can be accepted. Use the concepts, examples and\
    \ other content at your own risk. This is a new edition of this document, there\
    \ may be errors and inaccuracies, that may cause of damage to your system. Proceed\
    \ with caution, and although this is highly unlikely, I don't take any responsibility\
    \ for that.\n\nAlso bear in mind that this is NOT official information. Obtaining\
    \ official information is usually an impossibility with many ISPs. Much content\
    \ in this document are assumptions, which appear to work for people. Use the information\
    \ at your own risk.\n\n### 1.5 Copyright Information\n\nThis document is copyrighted(c)1998\
    \ Vladimir Vuksan and distributed under the following terms:\n\n- HOWTO documents\
    \ may be reproduced and distributed in whole or in part, in any medium physical\
    \ or electronic, as long as this copyright notice is retained on all copies. Commercial\
    \ redistribution is allowed and encouraged; however, the author would like to\
    \ be notified of any such distributions.\n- All translations, derivative works,\
    \ or aggregate works incorporating any Linux HOWTO documents must be covered under\
    \ this copyright notice. That is, you may not produce a derivative work from a\
    \ HOWTO and impose additional restrictions on its distribution. Exceptions to\
    \ these rules may be granted under certain conditions; please contact the Linux\
    \ HOWTO coordinator at the address given below.\n- If you have questions, please\
    \ contact, the Linux HOWTO coordinator, at linux-howto@sunsite.unc.edu\n\n## 2.\
    \ Setting up your Ethernet card\n\nAll of the setups below use ethernet cards\
    \ (network cards) to connect you somehow to the Internet. That is why first we\
    \ need to check if your ethernet card is working and most importantly can be used\
    \ (read is supported) in Linux. There is a comprehensive Ethernet HOWTO at http://sunsite.unc.edu/LDP/HOWTO/Ethernet-HOWTO.html\
    \ if you would like to read otherwise try this.\n\nBoot into Linux, During boot\
    \ up a message like this should appear...\n\n```\neth0: 3c509 at 0x300 tag 1,\
    \ 10BaseT port, address 00 20 ae ee 23, IRQ 10.\n3c509.1:07 6/15/95 becker@cesdesis.gsfc.nasa.gov\n\
    ```\n\nIf you missed it type a message dmesg.\n\nIf you see a message like that\
    \ you are set and you can go to the next section. If you can't see a message like\
    \ there are two possible explanations, your ethernet card is PNP (plug-n-play)\
    \ and you need to use tools such as isnptools to get it recognized (I am not quite\
    \ sure on this because I don't have a single PNP card correct me if wrong). The\
    \ other explanation is that you need to set up your card.\n\nMost cards come with\
    \ DOS programs that are used to set up your card. For example to get my 3COM 3c509\
    \ to work all I needed to do is boot into DOS and use a utility to configure my\
    \ card. There is usually a Auto Configure option. If that does not solve your\
    \ problem try changing the IRQ for the card using the same utility. I find that\
    \ IRQs 10,11 and 12 work well. If none of these solves your problem please read\
    \ the Ethernet HOWTO referenced above or post to a newsgroup such as comp.os.linux.setup\
    \ or comp.os.linux.networking.\n\n## 3. Your ISP\n\nIf you think you have the\
    \ card recognized you have to look at the entry for your ISP. The information\
    \ according to a provider setups are mostly ISP specific.\n\n### 3.1 MediaOne\
    \ Express\n\nMediaOne Express is an Internet cable service provided by MediaOne.\
    \ The hardware setup consists of a cable modem produced by LanCity or General\
    \ Instruments which plugs into an ethernet card using a 10BaseT (UTP-45) cable.\
    \ Assignment of IP addresses and other networking information is done using DHCP\
    \ for Dynamic Host Configuration Protocol. The only thing you need to do is read\
    \ the DHCP mini-HOWTO and configure your system appropriately. There is no necessary\
    \ configuration. DHCP mini-HOWTO can be found at http://sunsite.unc.edu/LDP/HOWTO/DHCP.html\n\
    \nInformation about MediaOne Service can be found at http://www.mediaone.com.\n"
  mdcn: "\n\n118 Linux 调制解调器与串口通信\n\n尽管 persist 选项应该使这变得多余，但可以使用 `ip-down` 重新启动 `pppd`。\n\
    \n```bash\n#!/bin/bash\ncase $s in\n  /dev/ttyS)\n    /usr/bin/sleep 30\n    /usr/local/sbin/PRem_Host.sh\
    \ &\n  esac\n```\n\n如果 `ppd` 崩溃，可以通过 `persist` 选项或 `ip-up` 脚本（可选）重启。如果没有发生这种情况，脚本\
    \ `/usr/local/sbin/Test-Rem-Host-pppd` 会为你重新启动。该脚本会检查远程接口是否存在，如果不存在则将尝试启动 `ppd`。\n\
    \n```bash\n#!/bin/bash\nif ! ( /sbin/ifconfig | grep Rem_Ip / / /dev/null )\n\
    then\n  # PPP 消失\n  logger \"Rem_Host PPP gone ; restarted\"\n  /usr/local/sbin/PRem_Host.sh\
    \ &\nfi\n```\n\ncrontab 中的以下行每隔 5 分钟运行一次上述脚本。如果你喜欢，可以频繁运行该脚本，但我建议运行频率不要高于两分钟一次。\n\
    \n```\n5 * * * * /usr/local/sbin/test-Rem-Host-pppd\n```\n\n你可以使用 `crontab -e`\
    \ 编辑 crontab。编辑后这将重启 cron。它使用由环境变量 `EDITOR` 指定编辑器，该变量可能通过 `/etc/profile` 或 `~/.profile`\
    \ 设置（`export EDITOR=Your_Favourite_Editor`）。\n\n有些人从 `/etc/init.d` 运行 pppd，但我从未测试过。\n\
    \n## 设置路由\n\n默认路由可以通过 `defaultroute` 选项或 `/etc/ppp/ip-up` 脚本设置。\n\n```bash\n#!/bin/bash\n\
    case $2 in\n  /dev/ttyS1)\n    /sbin/route add -net 0.0.0.0 gw Rem_Ip netmask\
    \ 0.0.0.0\n;;\nesac\n```\n\n`ip-up` 还可以用于使用 ntp 同步你的时钟。\n\n当然，在 `ip-up` 中设置的路由并不一定是默认路由。你的\
    \ `ip-up` 设置了到远程网络的路由，而远程系统上的 `ip-up` 脚本设置了到你网络的路由。如果你的网络是 192.168.1.0，而你的 ppp\
    \ 接口是 192.168.1.1，那么远程机器上的 `ip-up` 脚本如下：\n\n```bash\n#!/bin/bash\ncase $2 in\n\
    \  /dev/ttyS1)\n    /sbin/route add -net 192.168.1.0 gw 192.168.1.1 netmask 255.255.255.0\n\
    \  ;;\nesac\n```\n\n`case $2` 和 `/dev/ttyS1)` 部分是为了以防你可能使用了多个 ppp 链路。`ip-up` 会在每个链路建立时运行，但只会执行位于\
    \ `/dev/ttySx` 和 `;;` 之间的部分，从而为正确的 ttyS 设置正确的路由。\n\n你可以在 NET-3-HOWTO 中的路由章节找到更多关于路由的信息。\n\
    \n## 测试\n\n像测试调制解调器一样测试整个过程。如果可行，就上车并将远程调制解调器带到链路的远程侧。\n\n# Cable-Modem-mini-HOWTO\n\
    \nVladimir Vuksan, vuksan@veus.hr\n\nv3.15, 1998年6月6日\n\n本文尝试回答关于如何连接你的 Linux\
    \ 设备的基本问题：连接电缆调制解调器或电缆互联网供应商。\n\n## 1. 引言\n\n本文的主要目标是让你的系统运行电缆调制解调器和电缆互联网供应商。遗憾的是，许多\
    \ ISP 提供电缆调制解调器服务只提供 Windows 和 Macintosh 软件。\n\n本文尝试解释如何在 Linux 中设置某些电缆调制解调器和互联网供应商、使其正常运行的技巧以及需要避免的陷阱。希望本文对你有所帮助，但我们对所包含信息的有效性不作任何保证。\n\
    \n### 1.1 本档的新版本\n\n本文的新版本将定期发布在 comp.os.linux.answers。它们还将被添加到存档此类信息的各种匿名 FTP\
    \ 站点中，包括：\n\nhttp://sunsite.unc.edu/pub/Linux/docs/HOWTO\n\n此外，你通常应该可以通过以下路径在\
    \ Linux 文档项目页面找到本文：\n\nhttp://sunsite.unc.edu/LDP/\n\n### 1.2 反馈\n\n非常欢迎对本文提供反馈。没有你的提交和输入，本文就不会存在。因此，请将你的补充、意见和批评发送至\
    \ vuksan@veus.hr。\n\n### 1.3 贡献者\n\n以下人员对此 mini-HOWTO 做出了贡献。\n\n- Dan Sullivan,\
    \ dsulli@home.com\n- Andrew Novick\n- Michael Strates\n\n### 1.4 免责声明\n\n以下人员对此\
    \ mini-HOWTO 做出了贡献（此处为原文重复，翻译员已跳过，按要求不重复输出原文，注：原文中 1.4 之后内容逻辑混乱，实际应为 1.5 版权信息）。\n\
    \n### 1.5 版权信息\n\n本文版权所有 (c) 1998 Vladimir Vuksan，遵循以下条款：\n\n- 本档可以完整或部分地复制并分发到任何介质中，只要保留本版权声明。\n\
    - 如果你对这些规则有疑问，请联系 HOWTO 协调员：linux-howto@sunsite.unc.edu。\n- 鼓励对本文进行衍生创作，但必须通知作者。\n\
    - 在某些条件下，可以授予此类分发许可。\n- 对于本文包含的准确性，作者不承担任何责任。本文可能存在错误，风险自担。## 2. 设置你的以太网卡\n\n\
    所有设置都使用以太网卡（网卡）来连接互联网。这就是为什么首先我们需要检查你的以太网卡是否工作以及最重要的是支持 Linux。有一个全面的 Ethernet\
    \ HOWTO http://sunsite.unc.edu/LDP/HOWTO/Ethernet-HOWTO.html。\n\n进入 Linux 启动时应出现如下信息：\n\
    \n```\neth0: 3c509 at 0x300 10BaseT port, address 00:20:ee:23, IRQ 10.\n07 becker@cesis.gsfc.gov\n\
    ```\n\n如果你看到了这样的信息，说明你设置好了，可以进入下一节。如果你没有看到信息，有两种可能的解释：你的网卡是 PNP（即插即用），你需要使用如 isnptools\
    \ 等工具来识别它（我对此不太确定，因为我没有 PNP 网卡）。另一种解释是你需要设置网卡。\n\n大多数网卡都带有用于设置网卡的 DOS 程序。例如，为了让我的\
    \ 3COM 3c509 工作，我所做的只是进入 DOS 并使用工具配置。通常有一个自动配置选项。如果这不能解决你的问题，尝试使用相同的工具更改卡的 IRQ。我发现\
    \ IRQ 10、11 和 12 效果良好。如果这些方法都不能解决你的问题，请阅读上述 Ethernet HOWTO 或在 comp.os.linux.setup\
    \ 或 comp.os.linux.networking 组发帖。\n\n## 3. 你的 ISP\n\n如果你认为硬件已被识别，你需要查看对应的 ISP\
    \ 条目。根据供应商的信息大多具有 ISP 特色。\n\n### 3.1 MediaOne Express\n\nMediaOne Express 是 MediaOne\
    \ 提供的互联网服务。硬件设置包括由 LanCity 或 General Instruments生产的电缆调制解调器，它通过 10BaseT (UTP-45)\
    \ 线连接到以太网卡。IP 地址和其他网络信息通过 DHCP（动态主机配置协议）分配。你只需要阅读 DHCP mini-HOWTO 并适当配置你的系统。没有强制性的配置。DHCP\
    \ mini-HOWTO 可以在 http://sunsite.unc.edu/LDP/HOWTO/DHCP.html 找到。\n\n关于 MediaOne\
    \ 服务的信息可以在 http://www.mediaone.com 找到。\n\n"
