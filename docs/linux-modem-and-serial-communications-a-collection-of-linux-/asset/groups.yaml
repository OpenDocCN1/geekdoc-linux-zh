    them by sending an electrical signal known as an interrupt on a dedicated conductor.
    Old serial ports would always send an interrupt for every byte received.


    Each interrupt (inside the computer) has a number (IRQ) and the serial port must
    know which conductor to use to signal on. For example, ttyS0 normally uses IRQ
    number 4 known as IRQ4 (or IRQ 4). A list of them and more will be found in “man
    serial” (search for “Configuring Serial Ports”). Interrupts are issued whenever
    the serial port needs to get the CPU’s attention. It''s important to do this in
    a timely manner since the buffer inside the serial port can hold only 16 (in old
    modems) incoming bytes. If the CPU fails to receive such bytes promptly, then
    there will not be any space left for more incoming bytes and the small buffer
    may eventually overflow (overrun). Bytes will be lost. For an external modem,
    there is no way to stop the flow rapidly enough to prevent this. For an internal
    modem, the 16-byte buffer is on the same card and a good modem will not write
    to it if it is full. A good modem will not overrun the 16-byte buffers and this
    is one advantage of an internal modem.


    Interrupts are also issued when the serial port has just sent all 16 of it bytes
    from its small transmit buffer to the modem. The interrupt is to notify the CPU
    of that so that it may put more bytes in the small transmit buffer to be transmitted.
    Also, when a modem control line changes state an interrupt is issued.


    The buffers mentioned above are all hardware buffers. The serial port also has
    large buffers in main memory. This will be explained later


    Interrupts convey a lot of information but only indirectly. The interrupt itself
    just tells a chip called the interrupt controller that a certain serial port needs
    attention. The interrupt controller then signals the CPU. The CPU runs a special
    program to serve the serial port. That program is called an interrupt routine
    (part of the serial driver software). It tries to find out what has happened at
    the serial port and then deals with transferring bytes from (or to) the serial
    port’s hardware buffer. This program can easily find out what has happened since
    the serial port has registers at I/O addresses known to the driver software. These
    registers contain status information about the serial port. The software reads
    these registers and by inspecting the contents, finds out what has happened and
    takes appropriate action.


    # 2.5 Data Compression (by the Modem)


    Before continuing with the basics of the serial port, one needs to understand
    about something done by the modem: data compression. In some cases this task is
    actually done by software run on the computer’s CPU but unfortunately at present,
    such software only works for MS Windows.'
- md: '

    here will be for the case where the modem itself does the compression since this
    is what must happen-in order for the modem to work under Linux.


    In order to send data faster over the phone line, one may compress (encode it)
    using a custom encoding scheme which itself depends on the data. The encoded data
    is smaller than the original (less bytes) and can be sent over the Internet in
    less time. This process is called “data compression”.


    If you download files from the Internet, they are likely already compressed and
    it is not feasible for the modem to compress them further. Your modem may say
    what is passing thru you has already been compressed and refrain from trying to
    compress it any more. If you are receiving data which has been compressed by the
    other modem, your modem will decompress it and create many bytes than were sent
    over the phone line. Thus the flow of data from your modem into your computer
    will be higher than the flow over the phone line to you. The ratio of flow is
    called the compression ratio. Compression ratios as high as 4 are possible, but
    not very likely.


    ## 2.6 Error Correction


    Similar to data compression, modems may be set to do error correction. While there
    is overhead cost which slows down the byte/sec flow rate, the fact that error
    correction strips off start and stop bits actually increases the data byte/sec
    flow rate.


    For the serial port''s interface with the external world, each 8-bit byte has
    2 extra bits added to it: a start-bit and a stop-bit. Without error correction,
    these extra stop and stop bits usually go right through the modem and over the
    phone lines. When error correction is enabled, these extra bits are stripped off
    and the 8-bit bytes are put into packets. This is more efficient and results in
    higher byte/sec flow in spite of the fact that there are a few more bytes added
    for packet headers and correction purposes.


    ## 2.7 Data Flow (Speeds)


    Data (bytes representing letters, pictures, etc.) flows from your computer to
    your modem and then out on the telephone line (and conversely). Flow rates (such
    as 56k (56000) bits/sec) are (incorrectly) called “speed”. But almost everyone
    says “speed” instead of “flow rate”. If there were no data compression the flow
    rate from the computer to the modem would be the same as the flow rate over the
    telephone line.


    Actually there are two different speeds to consider at your end of the phone line:


    - The speed on the phone line itself (DCE speed) modem-to-modem

    - The speed from your computer''s serial port to your modem (DTE speed)


    ## Modem-HOWTO (for Linux)


    When you dial out and connect to another modem on the other end of the phone line,
    your modem often sends you a message like “CONNECT 28800” or “CONNECT 115200”.
    What do these mean? Well, either the DCE speed or the DTE speed. If it''s higher
    than the advertised modem speed it must be the DTE modem-to-computer speed. This
    is the case for the 115200 shown above. The 28800 must be a DCE (modem-to-modem)
    speed since the serial port has no such speed. One may configure the modem to
    report each speed ??


    If you have an internal modem you would not expect that there would be any speed
    limit on the DTE speed from your modem to your computer since modem is inside
    your computer and almost part of your computer. But there is since modem contains
    a dedicated serial port within.


    It''s important to understand that the average speed is less than the specified
    speed, especially on the short DTE computer-to-modem line. Waits (or idle time)
    result in a average speed. These waits may include waits of perhaps a second due
    to Flow Control. At the extreme there may be very short waits (idle time) of several
    micro-seconds separating the end of one byte and the start of the next byte. In
    addition, modems will fallback to lower speeds if the telephone line conditions
    are less pristine.


    For a discussion of what DTE speed is best to use section What Speed Should I
    Use.


    ## 2.8 Flow Control


    Flow control means the ability to stop the flow of bytes in a wire. It also includes
    provisions to restart the flow without any loss of bytes. Flow control is needed
    for modems to allow a jump in flow rates.


    ### Flow Control Explained by an Example


    For example, consider the case where 33.6k modem is not doing any data compression
    or error correction. You have set the serial port speed to 115,200 bits/sec (bps).
    We are sending data from your computer to the phone line. Then the flow from the
    computer to your modem is at 115.2k bps. A faster flow from your modem out the
    phone line is at only 33.6k bps. Since 115.2k is going into your modem than coming
    out of it, the modem is storing the excess flow (115.2k-33.6k = 81.6k) in one
    of its buffers. This buffer would eventually overrun (run out of storage space)
    unless the 115.2k bps is halted.


    But now flow control comes to the rescue. When the modem''s buffer is almost full,
    the modem sends a stop signal to the serial port. The serial port passes on the
    device driver and the 115.2k bps is halted. Then the modem continues to out data
    at 33.6k bps drawing the data it previous accumulated in its buffer. Since nothing
    is coming into the buffer, the level of bytes in it starts to drop.


    ## Linux Modem and Serial Communications


    When almost no bytes are left in the buffer, the modem sends a start signal to
    the serial port and the 115.2k flow from the computer to the modem resumes. In
    effect, flow control creates an average flow rate (in this case 33.6k) which is
    significantly less than the “on” flow rate of 115.2 bps. This is “start-stop”
    flow control.


    The above is an example of flow control from the computer to the modem, but there
    is also flow control which is used for the opposite direction of flow: from a
    modem to a computer. You don’t often need it in this direction (for flow from
    a modem to PC), but for a complex example of a case where it’s needed see Complex
    Flow Control Example. If you don’t have a high enough speed set between the modem
    and the computer (serial port speed) then you need to slow down the flow from
    the modem to the PC. To do this you must stop the flow of bytes over the telephone
    line. Your modem must tell the other modem stop sending. See Modem-to-Modem Flow
    Control Details on flow control may eventually be put into the Serial-HOWTO.


    ## Symptoms of No Flow Control


    Understanding flow-control theory can be of practical use. For example I used
    my modem to access the Internet and it worked fine. But after a few months I tried
    to send long files from my PC to an ISP and a huge amount of retries and errors
    resulted (but eventually Kermit could send a long file after many tries). Receiving
    in the other direction (from my ISP to me) worked fine. The problem turned out
    to be a hardware defect in my modem that had disabling flow control. My modem’s
    buffer was overflowing (overrunning) on outgoing files since no “stop” signal
    was sent to the computer by halting the modem. There was no problem in the direction
    from the modem to my computer since the capacity (say 115.2k) was always higher
    than the flow over the telephone line. The fix was to enable flow control by putting
    an enable-flow control command for the modem last in the init string.


    ## Hardware vs. Software Flow Control


    For modems, it’s best to use “hardware” flow control that uses two dedicated “modem
    control” wires to send the “stop” and “start” signals. Software flow control uses
    the main receive and transmit wires to send the start and stop signals. It uses
    the ASCII control characters DC1 (start) and DC3 (stop) for this purpose. They
    are just inserted into the regular stream of data. Software flow control is not
    only slower in reacting but also does not allow the sending of binary data thru
    the modem unless special precautions are taken. Since binary data likely contain
    DC1 and DC3, special means must be taken to distinguish between a DC3 that is
    a DC3 that is part of the binary code. Likewise for DC1. To get software flow
    control to work for binary data requires both modem (hardware) and software support.

