    PPP 是目前最使用的。它用于访问 Internet。对于拨入公共图书馆、公告板（BBS）等，minicom 是最流行的，其次是 Seyon（仅限 X-Windows）和
    Kermit。


    # 10.1 Minicom 与 Kermit


    Minicom 仅仅是一个通信程序，而 Kermit 既是通信程序也是文件传输协议。但人们可以在 Minicom 中使用 Kermit 协议（前提是其中一台
    PC 上安装了 Kermit）。Minicom 是基于菜单的，而 Kermit 是基于命令行的（在串口提示符处交互）。虽然 Kermit 程序是免费软件，但其文档并非完全免费。它没有提供详细的手册，建议你购买一本书作为手册。然而，Kermit
    有交互式帮助，可以告诉你很多信息，但缺乏针对初学者的教程说明。命令可以放在脚本文件中，这样你就不需要每次都输入它们。Kermit（作为通信程序）比 Minicom
    更强大。


    尽管所有 Minicom 文档都是免费的，但它们没有 Kermit 那么详尽。由于在商业发行版中包含 Kermit 需要许可，而且由于文档并非完全免费，某些发行版不包含
    Kermit。在我看来，设置 Minicom 更容易，要学习的内容也少。


    # 10.2 程序列表


    有一份你可以选择的通信软件列表，如果它们没有随你的发行版一起，可以通过 FTP 获取。我想听听对拨出（dialout）程序的比较性评论。那些最不流行的已经过时了吗？


    最不流行的拨出程序：

    - ecu—一个通信程序

    - pcomm-procomm—类似调制调制器的通信程序

    - xc—xcomm 通信包


    最流行的拨出程序：

    - minicom-telix—类似的通信程序。支持脚本、调制调器、kermit

    - C-Kermit—便、可脚本、串口和 TCP/IP 通信，包括文件传输、字符集翻译和调制调器支持

    - seyon—基于 X 的通信程序


    传真：

    - efax 一个小型传真程序

    - hylafax 一个基于客户端-服务器模型的大型传真程序

    - mgetty+fax 处理传真事务和拨入登录


    语音邮箱：

    - mvm 是适用于 Linux 的极简语音邮箱（Minimal VoiceMail）

    - vgetty 是 mgetty 的扩展，用于处理语音邮箱


