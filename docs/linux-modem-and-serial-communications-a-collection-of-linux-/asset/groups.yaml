    The Linux Serial HOWTO 75


    # 3.4 Notes For Dumb Multiport Boards


    The devices your board uses depends on what kind of board you have. Some of these
    are listed in detail in rc.serial or in 0setserial which comes with the setserial
    package. I highly recommend getting the latest version of setserial if you are
    trying to use multiport boards. Either use the mknod command, or the MAKEDEV script.
    Devices for multiport boards are made by adding "64 + port number". So, if you
    wanted to create devices for tty17, you would:


    ```

    linux# mknod -m 666 /dev/cua1 c 5 81

    linux# mknod -m 666 /dev/tty17 c 4 81

    ```


    Note that "64 + 17 = 81". Using the MAKEDEV script, if you would to:


    ```

    linux# cd /dev

    linux# ./MAKEDEV tty17

    ```


    Note: the SIG manual for the IO1812 listing for COM5-COM8 is wrong. They should
    be COM5=0x250, COM6=0x258, COM7=0x260, and COM8=0x268.


    Note: the Digi PC/8 Interrupt Status Register is at 0x140.


    Note: for an AST Fourport, you might need to specify skip_test in rc.serial.


    # 3.5 Notes For Intelligent Multiport Boards


    The information that comes with the driver. These boards use special devices,
    and not the standard ones. This information varies depending on your hardware.


    # 4. Iting Programs You Should Know About


    # 4.1 What is getty?


    getty is a program that handles the login process when you log onto a Unix box.
    You will need to use getty if you want to be able to dial in your Linux machine
    with a modem. You do not need to use getty if you only want to dial out with your
    modem. There are three versions that are commonly used with Linux: getty_ps, mgetty
    and getty. The syntax for these programs differs, so be sure to check and make
    sure that you are using the correct syntax for whatever getty you use.'
