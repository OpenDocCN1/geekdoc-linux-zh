    Setting the I/O address and IRQ for a serial port was formerly done on the card.
    These are little black rectangular "cubes" about 5x42 mm in size which push over
    pins on the card. Plug-and-Play modems (actually the serial port part of the modems)
    don''t use jumpers for setting these but are configured by sending configuration
    commands to them (via I/O address space inside the computer). Such configuration
    commands can be sent by a PnP BIOS, the isapnp program (for the ISA bus only)
    or a PnP operating system. The configuring of them is built into Windows 95/98
    OS. Under Linux you have a choice of ways (none of which is easy) to io-irq configure
    them:


    +   1. Use "isapnp" which may run at every boot-time

    2. Use a PnP BIOS alone (which runs at every boot-time)

    3. Patch Linux to make it a PnP operating system


    # 4.4 Internal Modems You Must Avoid: winmodems, etc.


    In 1998, the majority of internal modems don''t work with Linux since they are
    "winmodems" or the like, although they often don''t state it like this. Such modems
    turn over (or even almost all) the work of the modem to the main processor (CPU)
    chip of your computer (such as a Pentium...). Since only Windows (and not Linux)
    software is provided to do this, it will not work under Linux.


    There are other more precise names than "winmod". HSP (Host Signal Processor)
    means that the host processor (your CPU chip) creates the code needed to produce
    the electrical signal on the phone line. In contrast to this, a "controllerless"
    modem can create the electrical signals (but can''t control the modem). It has
    no facilities to deal with bytes being sent and received. It can compress strings
    of bytes; it can''t check for errors; it can''t put them into packets. In other
    words it can''t control the modem instead the CPU can do this work using a program
    for Windows. If such programs could be ported to Linux then there wouldn''t be
    this problem. Besides the above, a modem which doesn''t simulate a serial port
    will not work under Linux.


    How do you determine if an internal modem works under Linux? It''s not always
    easy. If you can look at the package it comes in (or a manual) find the section
    in the package that says something like "Minimum System Requirements" or just
    "System Requirements". It may be in fine print Read it closely. If Windows is
    listed as one of the requirements then it will likely not work under Linux. Also
    check out modem list which lists modems which do and do not work under Linux.


    Otherwise, it may work under Linux if it fails to state explicitly that you must
    have Windows. By saying it''s "designed for Windows" it may only mean that it
    fully supports Microsoft''s plug-and-play'
