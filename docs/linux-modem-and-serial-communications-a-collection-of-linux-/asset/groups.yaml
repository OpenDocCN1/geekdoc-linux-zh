    # Linux 调制调器与串口通信


    这也可能是中断冲突。请参见“中断冲突”（Interrupt Conflicts）。确保没有共享的 IRQ。检查你所有的板卡（串口、以太网、SCSI 等）。确保你所有串口设备的跳线设置（或
    PnP 设置）以及串口参数都是正确的。同时检查 /proc/ioports、/proc/interrupts 和 /proc/pci 是否存在冲突。


    ## 12.5 上传（下载）文件损坏或速度极慢


    流控（在 PC 端和调制调器端均如此）可能未启用。如果你设置了高 DTE 速度（如 115200），那么从调制调器到 PC 的流量传输是正常的，但反方向的大量流量将无法通过。这将导致许多错误和数据包重传。这可能导致花费过长的时间。在某些情况下，文件无法传输。如果你正在下载未压缩的文件或网页（且你的调制调器使用数据模式），或者你设置了低
