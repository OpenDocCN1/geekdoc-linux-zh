    ## 4. Modems for a Linux PC


    ### 4.1 External vs. Internal


    A modem for a PC may be either internal or external. The internal one is installed
    inside of your PC (you must remove screws, to install it) and the external one
    just plugs into a serial port connector on a PC. Internal modems are less expensive,
    are less likely to overrun, usually use less electricity, and use no space on
    your desk. External modems are easier to install, require less configuration,
    and have lights which may give you a clue as what is happening. External modems
    are easy to move to another computer. Most external modems have no switch to turn
    off the power supply when not in use and are likely to consume a little electricity
    even when turned off (unless you unplug the power supply from the wall). Each
    watt they draw you about $1/yr. Another disadvantage of an external is that you
    will be forced to use an existing serial port which may not support a speed of
    over 115,200 k (although as of late 1998 most internal modems don''t either—but
    some do). If a new internal modem had a 16650 UART it would put less load on the
    CPU (but almost none do as of 1998).


    Internal modems present a special problem for Linux, but will work just well as
    external modems provided you avoid the high percentage of them that will work
    only for MS Windows, and also provided that you spend time (sometimes a lot of
    time) to configure them correctly. Some of the modems which will work only under
    MS Windows are unfortunately, not labeled as such. If you buy a new one, make
    sure that you can return it for a refund if it will not work under Linux.


    While most new modems are plug-and-play you have various ways to deal with them:


    - Use the "isapnp" program

    - Have a PnP BIOS do the configuring

    - Patch the kernel to create a PnP Linux


    Each of the above has shortcomings. Isapnp documentation is difficult to understand
    although reading the Plug-and-Play-HOWTO (at present incomplete) will aid in understanding
    it. If you want the PnP BIOS to do the configuring, all you need to do is make
    sure that it knows you don''t have a PnP operating system. You may have trouble
    determining how it sets up. See What is in my serial port hardware. Patching the
    kernel can be complicated too. There are a lot of device drivers that don''t cooperate
    with the patch (so you will need to configure them).


    There are Linux users who say that there''s a lot simpler to get an external modem
    and plug it in. But since new peripherals are all PnP today, you may eventually
    need to deal with it, so why not now? It will be easier to deal with PnP under
    Linux in the future but pioneers are needed to lead the way today in spite of
    the old adage "Pioneering doesn''t pay".


    ## 4 External Modems


    ### PnP External Modems


    Many external modems are labeled "Plug and Play" (PnP) and they should all work
    fine as non--PnP modems. Since you usually plug the modem into a serial port which
    has its own IRQ number and I/O address, the modem needs no PnP features to set
    these up. However, the serial port itself may need to be configured (IRQ number
    and I/O address) unless the default configuration is OK.


    How can an external modem be called PnP since it cannot be configured by PnP?
    Well, it has a special PnP identification built into it that can be read (thru
    the serial port) by a PnP operating system. Such an operating system would then
    know that you have a modem on a certain port and would also know the model number.
    Then you might not need to configure application programs by telling them what
    port the modem is on (such as /dev/tty2 or COM3). But if you don''t have such
    a PnP operating system you will need to configure your application program manually
    by giving it the /dev id (such as /dev/ttyS2).


    ## Cabling & Installation


    Connecting an external modem is simple compared to connecting most other devices
    to a serial port that require various types of "null modem" cables. Modems use
    straight through cable, with no pins crossed over. Most computer stores should
    have these. Make sure you get the correct gender. If you are using a DB9 or DB25,
    you may need a male-to-female or female-to-female adapter.


    ## What the Lights (LED) Mean


    | Label | Meaning |

    | :--- | :--- |

    | TM | Test Modem |

    | RD | Receive Data |

    | SD | Send Data |

    | TR | Terminal Ready |

    | RI | Ring Indicator |

    | OH | Off Hook |

    | MR | Modem Ready |

    | EC | Error Correction |

    | HS | High Speed |


    ### 4.3 Internal Modems


    An internal modem is installed inside of your PC (you must remove screws, to install
    it) and the external one just plugs into a serial port connector on a PC. Internal
    modems are less expensive, are less likely to overrun, usually use less electricity,
