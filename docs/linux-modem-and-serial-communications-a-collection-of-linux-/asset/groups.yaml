    ## 3. 配置调制解调器（包括串口）


    如果你只想为 MS Windows/Dos 使用调制解调器，那么你可以安装任何调制调器，它可以正常工作。对于 Linux PC，情况通常没那么简单，除非你使用外部调制调器。所有外部调制调器都应该工作正常（即使它们标记为“即插即用”）。但大多数内部调制调器都是即插即用（PnP）并带有
    PnP 串口。你可能需要使用 Linux 的“isapnp”程序来配置这些 PnP 串口。更多信息请参见 Plug-and-Play-HOWTO。


    ### 3.1 配置概述


    - 配置调制调器本身：由通信程序完成

    - 配置调制调器的串口：仅由通信程序完成


    上述的大部分配置（但不一定是大部分工作量）是由你配合调制调器一起使用的通信程序（例如 minicom 或 seyon）或由你的 Web 浏览器的 PPP 部分完成。如果你使用调制解调器进行拨号，那么你用于向外部用户显示登录提示的
    getty 程序将帮助配置。因此，要配置调制解调器（以及大部分串口），你需要配置通信程序（或 PPP 或 getty）。这些程序的文档和/或 PPP-HOWTO
    会很有帮助。


    但请注意，并不是所有的串口配置都是由通信程序（或 getty）完成的。剩余配置描述起来很简单（但有时很难实现）。它主要涉及设置端口的 I/O 地址和其 IRQ
    号。事实上，即插即用可以在不进行任何操作的情况下设置这些内容。Linux（截至 1999 年初）对即插即用的支持并不很好。这可能会给你带来一个困难的问题。


    ### 3.2 配置串口的 IRQ 和 IO-地址


    在启动（并配置）你的通信程序之前，你必须完成通信程序无法完成的配置。简单来说，这只包括识别调制解调器所处的串口。是 ttyS2 (=COM3) 还是 ttyS1
    (=COM2) 等？如果你确定知道答案（且没有 IRQ 冲突），那么就什么都不需要做，你可以启动通信程序了。


    ## 调制解调器-HOWTO（适用于 Linux）


    否则，你必须建立串口识别并为其分配一个 IRQ 号。这是通过将两个值（一个 IRQ 号和一个 I/O 地址）放入两个地方来实现的：


    - 1. 串口硬件本身的内存寄存器

    - 2. 设备驱动程序（通常通过启动时运行“seterial”来实现）


    上述两项都应该由即插即用操作系统（OS）完成。对于第 1 项，以前在调制调器卡中设置这些数字（对于外部调制调器而言即为串口）是由用户完成的。现在，这应该在启动时由即插即用（PnP）完成。


    对于第 2 项，如果你接受默认设置，则不需要使用 seterial。但如果你使用“seterial”，那么你告诉它的 IRQ 和 IO 地址必须与串口硬件内部的设置（或通过
    PnP 设置的设置）完全相同。我们可能把这一切简称为“io-irq”配置。在 Windows 世界中，I/O 地址和 IRQ 被称为“资源”（resources），因此我们正在配置某些资源。


    ## 即插即用（Plug-and-Play）


    即插即用的设计是为了自动化这种 io-irq 配置，但对于 Linux 来说，它让生活变得更加复杂。Linux 标准内核不支持即插即用。如果你使用 Linux
    内核补丁将其转换为即插即用操作系统，那么上述所有内容都应该由操作系统自动处理。但当你想要使用这种自动化配置串口以外的设备时，可能会发现你仍然必须手动配置驱动程序，因为许多
    Linux 驱动程序的编写时并没有支持 PnP 操作系统。如果你使用 isapntools 或 BIOS 配置即插即用，这只会将两个值放入调制调器卡的串口部分，你可能仍然需要设置
    serial。截至 1999 年，这些内容中没有一个是容易的，文档也不够详尽。参见 Plug-and-Play-HOWTO。


    ## 使用 PnP BIOS 进行 I0-IRQ 配置


    虽然如何使用 PnP 操作系统或 isapntools 进行 io-irq 配置的说明可以随软件一起提供，但如果你想让 PnP BIOS 来完成配置，情况并非如此。BIOS
    通常有一个用于设置前两个串口的 CMOS 菜单。通常可选择的很少。除非手册中另有说明，否则 BIOS 应该使用标准的 I/O 地址和 IRQ。参见 Serial
    Port Device Names & Numbers


    无论你喜不喜欢，当你启动电脑时，PnP BIOS 会开始对硬件设备进行 PnP (io-irq) 配置。它可能部分完成工作并将剩余交给 PnP 操作系统（而你并没有），或者如果你没有
    PnP 操作系统，它可能会完全配置所有 PnP 设备，但不会


    ## Linux 调制解调器与串口通信


    ## Linux 调制解调器与串口通信


    配置设备驱动。这是你想要的，但并不总是容易准确判断 PnP BIOS 到底做了什么。


    如果你告诉 BIOS 你没有 PnP 操作系统，PnP BIOS 应该对所有 PnP 串口进行配置——而不只是前两个。如果你在同一台 PC 上安装了 MS
    Windows，BIOS 应该已经将 MS Windows 使用的 io-irq 配置保存在非易失性内存中，并为 Linux 使用相同的配置。在这种情况下，如果你能找到
    MS Windows 如何设置其 io-irq 的，那么在 Linux 下它也应该是相同的。


    如果你添加了新的 PnP 设备，BIOS 应该更改其 PnP 配置以适应它。它甚至可以更改现有设备的 io-irq 以避免任何冲突。为了这一目的，它会维护一个非
    PnP 设备的列表，前提是你已经告诉了 BIOS 这些非 PnP 设备已经过过 io-irq 配置。告诉 BIOS 的一种方法是在 MS Windows 下运行
    ICU 程序。


    但你如何发现 BIOS 做了什么，以便根据这些信息设置设备驱动呢？如果 BIOS 的 CMOS 菜单能提供这些信息就太好了，但它们可能没有（COM1 和 COM2
    除外）。因此，发现这些可能非常麻烦。参见 What is set in my serial port-hardware?


    ## 外部调制调器


    如果你使用外部调制调器并接入 ttyS1 连接器，那么（通常）没有 io-irq 配置需要做了，ttyS1 可能已经配置好了。你的 CMOS 设置可能需要为
    COM1 和 COM2 执行此操作。


    ## 超过 2 个串口


    通常你不需要配置前两个串口，因为内置在 Linux 发行版中的已经处理好了，你无需操作。当你想要添加第三个端口时，一切都不同了。除非你使用即插即用操作系统，否则你必须自己完成。要做到这一点（如前所述），你需要运行
    seterial：为 ttyS2 分配 I/O 地址和 IRQ 号。## 设置 I/O 地址和 IRQ 的方法


    这里是对上述讨论内容（以及更多）的总结。调制调器的配置完全通过通信程序向其发送命令来完成（例如波特率和硬件控制）。关于 PnP 的更多细节请参见 Plug-and-Play-HOWTO。你通过以下方式配置串口的
    io-irq：


    - 通过执行以下操作在端口硬件中设置 IRQ 号和 I/O 地址 (io-irq)：

    - 对于现有 io-irq 正常的外部调制调器，什么都不做

    - 为外部调制调器使用 PnP 设置菜单（通常仅用于 ttyS0 (Com1) 和 ttyS1 (Com2))

    - 如果你同时拥有 PnP 内部调制调器和 PnP Linux 操作系统，则什么都不做

    - 在调制调器、旧串口卡或旧主板上设置跳线（如果存在）

    - 为非 PCI PnP 内部调制调器使用 isapnp

    - 让 PnP BIOS 自动配置 PnP 内部调制调器（但可能很难确定具体的配置）。

    - 使用调制调器自带的设置程序（在 MS Windows 下运行）禁用 PnP


    - 2. "seterial"：为 ttyS2 分配 I/O 地址和 IRQ 号。除非你总共只有 1 或 2 个串口，或者你使用 PnP 操作系统，否则你可能不需要运行它。


    ## 避免 I/O 地址冲突：IBM 8514 显卡


    IBM 8514 板板的 I/O 地址据称是 0x2e8，这与 ttyS3 的 I/O 地址相同。如果你尝试在这个 I/O 地址上使用 ttyS3，那就是坏消息。


    ## 3.3 我的串口当前 I/O 地址和 IRQ 是什么？


    关于这个问题有两个答案：1. 设备程序设置的设置（这就是 seterial “设置”的内容）。2. 硬件中实际设置的设置。如果你遇到问题（包括无法通信的通信程序），可能意味着这两个值不同


