    SCV 提供通过 UTP 线缆连接到网卡的 Motorola Cybersurfer 调制器。IP 设置很简单，因为他们使用 DHCP，你只需要安装 dhcp
    守护进程（http://sun-site.nc.edu/LDP/HOWTO/mini/DHCP.html）。如果第一次无法访问，请关闭调制器再开启。


    ## 3.20 法国 Wanadoo


    这些信息由 Jerome SAUTRET (Jerome.Sautret@wanadoo.fr) 提供：


    我刚读了你们的电缆调制器教程。我住在法国，使用的是 Cable Wanadoo，这是法国电信的电缆业务，它是法国主要的电信运营商。目前它在法国的几个城市可用，如昂热和梅斯。该服务通过
    DHCP 提供动态 IP 地址。它使用一个插入 10BaseT 以太网卡的 COM 21 调制器。IP 设置很简单，只需阅读 DHCP 微型教程（http://sunsite.nc.edu/LDP/HOWTO/mini/DHCP.html）。


