    # Methods for Setting I/O Addresses and IRQs


    Here’s a summary of what was just discussed (and more). The modem is entirely
    configured by sending commands to it from the computer (via the communication
    program) is as much as the serial port (such as the baud rate and hardware flow
    control). For more details on the PnP options see Plug-and-Play-HOWTO. You configure
