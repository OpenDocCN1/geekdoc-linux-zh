    ## 7. ugetty


    ### 7.1 设置 ugetty


    确保你为调制调器所在的串口端口准备了一个输出和一个输入设备。如果你的调制调器在 ttyS3 上，你需要 /dev/cua3 和 /dev/ttyS3 设备。如果你没有正确的设备，请查看“在
