    \ 9600 bps 哑终端项\nDT9600# B9600 CS8 CLOCAL # B9600 SANE -ISTRIP CLOCAL ##S @L login:\n\
    #DT9600\n\n如果你愿意，可以让 getty 在登录横幅中打印一些有趣的内容。在我的示例中，我打印了系统名称和串口号。你可以添加其他的：\n\n-\
    \ @B 当前的 bps（在显示时评估）\n- @D 当前日期，格式为 MM/DD/YY。\n- @L getty 挂载的串口。\n- @S 系统名称。\n\
