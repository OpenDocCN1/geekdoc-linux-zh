    # Linux Modem and Serial Communications


    A Collection of Linux HOWTOs


    +   - Collection of howto articles on using modems and

    serial communications with Linux.


    +   - Written by the world''s leading Linux experts.


    +   - Includes detailed information on choosing and setting

    up modems, specifying serial ports, and more.


    This book provides detailed information on how to use

    modems and serial communications with the Linux

    operating system. Inside you will find numerous howto

    articles written by Linux experts from around the world,

    including selecting, connecting, configuring, trouble-\shooting, and understanding
    modems for a PC. This book

    also describes serial port features using getty, multiport

    serial cards, and modems. For more information on the

    Linux Documentation Project, see


    http://metalab.unc.edu/LDP/


    This volume is designed to be a handy desktop

    companion, saving you the time and expense of printing

    the documentation yourself. It is also useful when

    viewing the online version of these howto articles are

    inconvenient.


