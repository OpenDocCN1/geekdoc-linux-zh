    # 拨入 (使用 getty)


    - mgetty+fax 用于调制调器且文档详尽。它处理传真事务并提供 uugetty 的替代方案。它包含了回拨（callback）和语音邮箱（使用 vgetty）功能。请参阅
    mgetty


    - uugetty 用于调制调器。它作为 ps_getty 软件包的一部分提供。请参阅 getty_ps


