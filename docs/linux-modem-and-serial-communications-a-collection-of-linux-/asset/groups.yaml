    Old PC''s used 25 pin connectors but only about 9 pins were actually used, so
    today most connectors are only 9-pin. Each of the 9 pins connects to a wire. Besides
    the two wires used for transmitting and receiving data, another pin (wire) is
    signal ground. The voltage on any wire is measured with respect to this ground.
    There are still more wires which are for control purposes (signalling) only and
    not for sending bytes. All of these signals could have been sent on a single wire,
    but instead, there is a separate dedicated wire for every type of signal. Some
