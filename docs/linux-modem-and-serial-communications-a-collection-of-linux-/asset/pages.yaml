  md: '# 136 Linux Modem and Serial Communications


    “Vortex/Boomerang” cards are done by 3COM (I''ve got a 3COM Boomerang Fast Ethernetlink
    XL 10/100Mb TX Ethernet Adapter), providing you compile the Vortex/Boomerang drivers.
    (See the Linux Ethernet-HOWTO)


    Setting up access can be done with DHCP (See the DHCP-Mini-HOWTO). A Dutch guide
    to setting up Internet access for A2000 is available at http://ayvk.a2000.nl/LINUX/index.html.


    Contrary to Tebecai, your IP-number *is* visible from the Internet, so note that
    your precautions security and safety when setting up a Linux machine using A2000
    Internet access!!


    # 3.16 Shaw Cable, Canada


    According to Peng F. Mok pmok@shaw.wave.ca:


    I recently signed up for a cable modem service from Shaw here in Canada, which
    they have christened ‘Shaw Wave’. They also appear to have another service called
    ‘Shaw@Home’ which they are using in some locations. Shaw has upgrading their cable
    network for a year and a half now, and offer cable-modem service to a number of
    locations across Canada. Information about the ‘Shaw Wave’ service can be found
    at http://www.shaw.wave.ca while information about the ‘Shaw@Home’ service can
    be found at http://shawhome.com General information about Shaw Cable can be found
    at http://www.shaw.ca


    I thought I would just drop a line to inform you that DHCP mini-HOWTO, (http://sunsite.unc.edu/LDP/HOWTO/mini/DHCPhtml)
    was very useful in helping me set up Linux with my cable-modem service, and that
    you might want to add ‘Shaw Wave’ (and perhaps ‘Shaw@Home’) to your Cable-Modem
    mini-HOWTO as another explaining how to set up Linux with the service. I do not
    have specific information on the ‘Shaw@Home’ service yet, but from conversations
    I''ve had with Shaw technical support it seems that ‘Shaw@Home’ is a partnership
    with ‘Home’ which involves the features and set procedure as that already described
    for ‘Home’ in the Cable-Modem mini-HOWTO


    In services Shaw Cable techs come over and bring you two pieces of hardware—a
    Motorola CyberSUR card and a 3COM Ethernet 16-Bit ISA 3C59B-TPO NIC or an Ethernet
    Link PCI 3C900-TPO NIC. You have your choice of either an ISA or a PCI card depending
    on your needs, and these models have only the RJ-45 (UTP) connectors. The ISA
    cards come with PnP-mode enabled by default, so it may be necessary to boot into
    DOS, disable PnP operation, and configure the card to some base I/O and IRQ setting
    which are available. Once this is done Linux has no problems detecting the NIC
    at boot-time. But I am not sure about what needs to be done in the case of a PCI
    card since I don''t currently have a PC which supports PCI or PnP.'
