    and IRQ 7 set up as interrupts for your parallel ports, but few people use two
    parallel ports. You can reassign one of the interrupts to a serial device, and
    still happily use a parallel port. You will need the setserial program to do this.
    In addition, you will have to play with the jumpers on your boards, check the
    docs for your board. Set the jumpers to the IRQ you want for each port.


    You should set things up so that there is one, and only one interrupt for each
    serial device. Here is Greg set his up in /etc/rc.d/local—you should do it in
    a file which runs startup:


    ```

    /bin/setserial /dev/ttyS0 irq 3      # serial mouse

    /bin/setserial /dev/ttyS1 irq 4      # my Wyse dumb terminal

    /bin/setserial /dev/ttyS2 irq 5      # my Zoom modem

    /bin/setserial /dev/ttyS3 irq 9      # my USR modem

    ```


    IRQ assignments:


    | IRQ 0 | Timer channel 0 |

    | IRQ 1 | Keyboard |

    | IRQ 2 | Cascade for controller 2 |

    | IRQ 3 | Serial port 2 |

    | IRQ 4 | Serial port 1 |

    | IRQ 5 | Parallel port 2 |

    | IRQ 6 | Floppy diskette |

    | IRQ 7 | Parallel port 1 |

    | IRQ 8 | Real-time clock |

    | IRQ 9 | Redirected to IRQ2 |

    | IRQ 10 | not assigned |

    | IRQ 11 | not assigned |

    | IRQ 12 | not assigned |

    | IRQ 13 | Math coprocessor |

    | IRQ 14 | Hard disk controller 1 |

    | IRQ 15 | Hard disk controller 2 |


    There is really no Right Thing to do when choosing interrupts. Just make sure
    it isn''t being used by the motherboard, or any other boards, 2, 3, 4, 5, or 7
    is a good choice. "not assigned" means that currently standard uses these IRQs.
    Also note that IRQ 2 is the same as IRQ 9. You can call it either 2 or 9, the
    serial driver is very understanding. If you have a serial board with a 16-bit
