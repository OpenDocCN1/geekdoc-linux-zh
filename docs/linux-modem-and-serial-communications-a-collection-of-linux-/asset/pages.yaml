    # 3.4 Other Configuring


    # Configuring Hardware Flow Control (RTS/CTS)


    See Flow Control for an explanation of it. You should always use hardware flow
    control if possible. Your communication program or "getty" should have an option
    for setting it (and if you''re in luck it might be enabled by default). It needs
    to be set inside your modem (by an init string or default) and in the device driver.
    Your communication program should set both of these (if you configure right).


    If none of the above will fully enable hardware flow control Then you must do
    it yourself. For the modem, make sure it''s either by the init string or is by
    default. If you need to tell the device driver to do it is best done on startup
    by putting a file that runs at boot-time. The subsection Boot-time Configuration
    You need to add the following to such a file for each serial port (example is
    ttyS2) you need to enable hardware flow control:


    ```

    tty crtscts < /dev/ttyS2

    ```


    If you want to see if flow control is enabled do the following: Minicom (or the
    like) type AT&V to see how the modem is configured and look for &K3 which means
    hardware flow control. Then see if the device driver knows about it by typing:
    sty -a < /dev/ttyS2 Look for "crtscts" (without a minus sign).


