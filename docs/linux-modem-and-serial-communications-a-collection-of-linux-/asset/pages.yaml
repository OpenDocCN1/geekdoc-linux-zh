  md: '# Linux Modem and Serial Communications


    Note that all distributions should come with ttyS devices (and cua devices until
    cua is finally abolished) already made correctly. You can verify this by typing:


    ```

    linux% ls -1 /dev/cua*

    linux% ls -1 /dev/ttyS*

    ```


    # 5.2 Creating Devices In the /dev directory


    If you don''t have a device, you will have to create it with the mknod command.
    Example, suppose you needed to create devices for ttyS0:


    ```

    linux# mknod -m 666 /dev/cua0 c 5 64

    linux# mknod -m 666 /dev/ttyS0 c 5 64

    ```


    You can use the MAKEDEV script, which lives in /dev. See the man page for it.
    This simplifies the making of devices. For example, if you needed to make the
    devices for ttyS0 you would type:


    ```

    linux# cd /dev

    linux# ./MAKEDEV ttyS0

    ```


    This handles the devices creation and should set the correct permissions.


    # 5.3 Link ttySN to /dev/modem?


    On some installations, two extra devices will be created, /dev/modem for your
    modem and /dev/mouse for your mouse. Both of devices are symbolic links to the
    appropriate device in /dev which you specified during the installation (unless
    you have a bus mouse, then /dev/mouse will point to the bus mouse).


    There has been some discussion on the merits of /dev/mouse and /dev/modem. The
    use of these links is discouraged. In particular, if you are planning on using
    your modem for dialin you may run into problems because the lock files may not
    work correctly if you use /dev/modem. Use them if you like, but be sure they point
    to the right device. However, if you change or remove this link, some applications
    might need reconfiguration.


    # 5.4 The cua Device


    Each ttyS device has a corresponding cua device. It is planned to eventually abolish
    cua so it''s best to use ttyS (unless cua is required). There is a difference
    between cua and ttyS but a savvy programmer'
