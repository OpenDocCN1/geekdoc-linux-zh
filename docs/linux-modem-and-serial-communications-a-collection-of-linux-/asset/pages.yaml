  md: '# Introduction


    This mini-HOWTO describes how to setup a Linux system in order to share a modem
    attached

    this system with other systems over a TCP/IP network.


    # The Server Side


    It is assumed that the server is a Linux system with either:


    +   a) a modem attached to a /dev/ttySx device

    b) an ‘isdn4linux’-emulated modem mapped to a /dev/ttyIx device


    The easiest setup I can think of uses a five lines perl script to implement a
    ‘modem demon’:


    ```

    $ cat !/usr/bin/perl

    select((select(STDOUT), $) = 1) [$];

    select((select(STDIN), $) = 1) [$]);

    exec `cu -s 115200 -1 /dev/ttyS1`;

    die ''$00: Cant exec cu: $\n'';

    ```


    The modem demon is started by the INETD process if a client connects to the appropriate
    port as

    described below. The ‘modem modify’ simply connects the socket to STDIN and STDOUT
    of the

    cu’ command and lets ‘cu’ handle the actual modem device. In case you don’t have
    ‘cu’ on your

    system, install the ‘UUCCP’ package, which is usually part of ‘UUCCP’.


    The existence of the modem demon must be made known to the INETD process by updating
    its-

    figuration file, usually /etc/inetd.conf like:


    ```

    #

    # modem daemon

    #

    modem stream tcp nowait root /usr/sbin/tcp /usr/sbin/modem /dev/ttyS1

    ```


    In order to make this work, an entry to /etc/services’ needs to be added like:


    ```

    modem          2006/tcp          modemd

    ```'
  merge: -1
  pgno: 128
- img_proc: true
  md: '106 Linux Modem and Serial Communications


    This associates a symbolic name with an explicit port, 2006 in the example. The
    portnumber could

    be any number not already assigned to an existing service. After these changes
    have been made, a sig-

    nal must be set to the inetd process in order to let inetd re-read and process
    its configuration file:


    ```

    $ ps |lgrep inetd

    194 ? S 0:00 /usr/sbin/inetd


    kill -HUP 194

    ```


    Now the server side is ready to accept requests from clients. The correct function
    can be verified

    by:


    ```

    $ telnet localhost modem


    Trying 127.0.0.1...

    Connected to localhost.

    Escape character is ''^]''.

    ```


    You are now connected to the modem. You can now issue ''AT'' command in order
    to verify the

    setup:


    ```

    atz

    at

    OK


    atil

    atil

    Linux ISD

    OK


    ]

    telnetquit

    $

    ```


    Instead of using the Perl script as a modem server, there is also a program ''mserver''
    avail-

    able on http://://ftp.inetc.be/pub/staff/carl/. In case it is not there anymore,
    you may want to use

    ''archie'' or any other search engine in order to locate the mserver archive.
    I haven''t had the oppor-

    tunity yet to install and use mserver.'
