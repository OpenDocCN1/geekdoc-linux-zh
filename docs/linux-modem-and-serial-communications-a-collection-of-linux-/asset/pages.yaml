  md: '# 8.3 Customizing uugetty


    There are lots of parameters you can tweak for each port you have. These are implemented
    in separa-rate config files for each port. The file /etc/conf.uugetty will be
    used by all instances of uuget-ty, and /etc/conf.uugetty.ttyN will only be used
    by that one port. Sample default config files can be found with the getty_ps source
    files, which come with most Linux distributions. Due to space concerns, they are
    not listed here. Note that if you are using older versions of getty (older than
    2.0.7c), or not using FSSTND, then the default file will be /etc/default/uugetty.ttyN.
    Greg''s /etc/conf.uugetty.tty3 looked like this:


    ```

    # sample uugetty configuration file for a Hayes compatible modem to allow

    # incoming modem connections


    # alternate lock file to check... if this lock file exists, then uugetty is

    # restarted so that the modem is re-initialized

    ALTLOCK=cu3

    ALTLINE=cu3

    # line to initialize

    INITLINE=cu3

    # timeout to disconnect if idle...

    TIMEOUT=60

    # modem initialization string...

    # format: <<expect <send ... (chat sequence)

    INIT=""" AT\r OK\r\n

    WAITFOR=RING

    CONNECT=""" ATA\r CONNECT\sA

    # this line sets the time to delay before sending the login banner

    DELAY=1

    #DEBUG=010

    ```


    Add the following line to your /etc/ittab, so that uugetty is run on your serial
    port (substit-ing in the correct information for your environment—config file
    location, port, speed, and default term type):


    ```

    S3:456:respawn:/sbin/uugetty -d /etc/default/uugetty.tty3 tty3 F115200 vt10

    ```


    Restart init:


    ```

    linux# init q

    ```'
