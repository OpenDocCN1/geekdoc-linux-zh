  md: '# 17. Appendix B: "baud" Vs. "bps"


    # 17.1 A simple example


    “baud” and “bps” are perhaps one of the most misused terms in the computing and
    telecommunications fields. Many people use these terms interchangeably, when in
    fact they are not! bps is the number of bits per second. Baud rate is a measure
    of how many times per second signal changes (or could change). For a typical serial
    port a 1-bit is -12 volts and a 0-bit is +12 volts (volts). If the bps is 38,400
    a sequence of 010101... would also be 38,400 baud since the voltage shifts back
    and forth from positive to negative... and there are 38,400 shifts per second.
    For another sequence 11100011... there will be fewer shifts of voltage for there
    1''s in sequence voltage just stays at -12 volts we say that there is 38,400 baud
    since there is a possibility that the number of changes per second will be that
    high.


    Looked at another way, put an imaginary tick marking each bit (even though the
    voltage may not change). 38,400 baud tic marks per second. The tic marks at the
    instants of permitted change and are actually marked by a synchronized clock signal
    generated in the hardware but not over the external cable.


    Suppose that a “change” may have more than the two possible outcomes of the previous
    example (of +12 v). Suppose it has 4 possible outcomes, each represented by a
    unique voltage level. Each level may represent a pair of bits (such as 01). For
    example, -12v would be 00, -6v 01, +6v 10 and +12v 11. Here the bit rate is double
    the baud rate. 3000 changes per second will generate 2 bits for each change resulting
    in 6000 bits per second (bps). In other words 3000 baud results in 6000 bps.


    # 17.2 Real examples


    The example above is overly simple. Real examples are more complicated but based
    on the same idea. This explains how a modem running at 2400 baud, can send 14400
    bps (or higher). The modem achieves a bps rate greater than baud rate by encoding
    many bits in each signal change (or transition). When, 2 or more bits are encoded
    per baud, the bps exceeds the baud rate. If your modem-to-modem connection is
    at 14400 bps, it’s going to be sending 6 bits per signal transmission at 2400
    baud. A speed of 28800 bps is obtained by 3200 baud at 9 bits/baud. When people
    misuse the baud word, they may mean the speed (such as 33.6K).


    Common bps rates were formerly 50, 75, 110, 300, 1200, 2400, 9600. These were
    the bps rates over the serial_port-to-modem cables. Today the bps-to-modem rates
    are 14.4K, 28.8K, 33.6K, and 56K, but the rates over the serialPort-to-modem cables
    are not the same as: 19.2K'
