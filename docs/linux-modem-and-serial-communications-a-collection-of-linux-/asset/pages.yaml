    +   - 8250, 16450, early 16550: Obsolete with extra buffers, TL=1,4,8,14

    - 16550, 16550A, 16c552: 16-byte buffers, TL=1,4,8,14

    - 16650: 32-byte buffers. Speed up to 460.8 Kbps

