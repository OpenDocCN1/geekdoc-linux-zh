  md: '# Modem-HOWTO (for Linux) 23


    There are also commands to recall (use it now) any of the 4 stored profiles. One
    may put such a command in an init string. Of course if it recalls the same profile
    as was automatically loaded at powerup, nothing is changed (unless the init string
    is sent after the modem has been in use for a while and had it''s configuration
    changed by software, etc.) It''s a good idea to use some kind of init string so
    that it may be reset by sending the init string after it''s been in use for a
    while (and may have had its configuration modified).


    Recalling a saved profile (use 1 instead of 0 for profile 1): Z0 recalls user-defined
    profile 0 and resets (hang up, etc.) &F0 recalls factory profile 0


    Once you have the modem to configure the way you want (including recalling a factory
    profile and modifying it a little) you may save this as a user-defined profile:
    &W0 saves the current configuration to user-profile


    Many people don''t bother saving a good configuration in their modem, but instead,
    the modem longer init string each time the modem is used. Another method is to
    restore the factory default at the start of the init string and modify it by adding
    a few other commands to the end of the init string. This way no one can cause
