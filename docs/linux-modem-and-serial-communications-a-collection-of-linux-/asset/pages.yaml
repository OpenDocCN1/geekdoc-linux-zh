  md: 'Modem-HOWTO (for Linux)


    61


    38.4K, 57.6K and 115.2K. Using modems with V.42bis compression (max 4:1 compression),
    rates up to 115.2K bps are possible for 33.6K modems (230.4K is possible for 56K
    modems).


    Except for the 56k modems, most modems run at 2400, 3000, or 3200 baud. Because
    of the bandwidth limitations on voice-grade phone lines, baud rates greater than
    2400 are harder to achieve, and only work under conditions of pristine phone line
    quality.


    How did this confusion between bps and baud start? Well, when antique low speed
    modems were high speed, the bps rate actually did equal the baud rate. One would
    be encoded per phase change. People would use bps and baud interchangeably, because
    they were the same number. For example, a 300 bps modem also had a baud rate of
    300. This all changed when faster modems came around, and the bit rate exceeded
    the baud rate."baud" is named after Emile Baudot, the inventor of the asynchronous
    telegraph printer.


    # 18. Appendix C: Terminal Server Connection


    This section was adapted from Text-Terminal-HOWTO.


    A terminal server is something like an intelligent switch that can connect many
    modems (or terminals) to one or more computers. It''s not a mechanical switch
    that it may change the speeds and protocols of the streams of data that go thru
    it. A number of companies make terminal servers: Xplex, Cisco, 3Com, Computone,
    Livingston, etc. There are many different types and capabilities. Another HOWTO
    is needed to complete and describe themincluding the possibility of creating your
    own terminal server with a Linux PC). Most are used for modem connections rather
    than directly connected terminals.


    One use for them is to connect many modems (or terminals) to a high speed network
    which connects to host computers. Of course the terminal server must have computing
    power and software to run network protocols so it is in some ways like a computer.
    The terminal server may interact with the user and ask what computer to connect
    to, or it may connect without asking. Some times end jobs to a printer then a
    terminal server.


    A PC today has enough computing power to act like a terminal server except that
    each serial port should have its own hardware interrupt. PCs only have a few spare
    interrupts for this purpose and since they are hard-wired you can''t create more
    by software. A solution is to use an advanced multi-port serial card which has
    its own system of interrupts (or on lower cost models, shares one of the PC''s
    interrupts between a number of ports). See Serial-HOWTO for more info. If such
    a PC Linux with getty running on many serial ports might be thought of as a terminal
    server. It is in effect'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'a terminal server if it''s linked to other PC''s over a network and if its
    job is mainly to pass thru data and handle the serial port interrupts every 14
    (or so) bytes. Software called “radius” is sometimes used.


    Today real terminal servers serve more than just terminals. They also serve PC''s
    which emulate terminals, and are sometimes connected to a bank of modems connected
    to phone lines. Some include built-in modems. If a terminal (or PC emulating one)
    is connected directly to a modem, the modem at the other end of the line could
    be connected to a terminal server. In some cases the terminal server by default
    expects the callers to use PPP packets, something that real terminals don''t generate.


    # 19. Appendix D: Other Types of Modems


    This HOWTO currently deals with the common type of modem used to connect PC''s
    to ordinary telephone lines. There are various other types of modems, including
    devices called modems that are not really modems.


    # 19.1 Digital-to-Digital “Modems”


    The standard definition of a modem is sometimes broadened to include “digital”
    modems. Today direct digital service is now being provided to many homes and offices
    so a computer sends out digital signals (well almost) into the telephone lines.
    But a device is still needed to convert the computer digital signal into type
    allowed on telephone circuits circuits and this device is sometimes called a modem.
    The next 2 sections: ISDN and DSL concern digital-to-digital “modems”.


    # 19.2 ISDN “Modems”


    “modem” is really a Terminal Adapter (TA). A Debian package “isdnutils” is available.
    There is a ISDN Howto in German with an English translation: http://www.suse.de/Support/sdb_e/isdn.html.
    It''s put out by the SuSE distribution of Linux and likely is drivers available
    in that distribution. There is an isdn4linux package and a newsgroup: de.alt.comm.isdn4linux.
    Many of the postings are in German. You might try using a search engine (such
    as DejaNews) to find “isdn4linux”.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# 19.3 Digital Subscriber Line (DSL)


    DSL uses the existing twisted pair line from your home (etc.) to the local telephone
    office. This can be used if your telephone line can accept higher speeds than
    an ordinary modem (say 56k) sends over it. It replaces the analog-to-digital converter
    at the local telephone office with a converter which can accept a much faster
    flow of data (in a different format of course). The device which converts the
    digital signals from your computer to the signal used to represent digital data
    on the local telephone line is also called a modem. This document presently does
    not cover the special aspects of these modems.'
