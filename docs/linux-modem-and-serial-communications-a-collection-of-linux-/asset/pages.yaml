  md: '# Linux Modem and Serial Communications


    items are not set the same. In other words, this means the driver has incorrect
    info on the serial port. If the driver has the wrong I/O address it will try to
    send data to a non-existing serial port—or even worse, to an actual device that
    is not a serial port. If it has the wrong IRQ it will not get interrupt service
    requests from the serial port, resulting in the possible overflow of the serial
    port’s buffer and in very slow response (due to fallback to very slow “polling”
    methods instead of interrupts). If it has the wrong model of UART there is also
    apt to be trouble.


    # What does the device driver think?


    How do you insure that the driver has the correct info? Well, if everything OK
    then there’s no need to look into this. But otherwise, it’s easy to see what the
    driver thinks. One way is to just type “serial-g /dev/ttyS*. At boot-time, a message
    on the console would show this. You may look at /proc/ioports it only shows the
    same I/O address which sercial has “set” but not necessarily the way in the hardware.
    See the IRQs used by currently running processes (that have devices open) look
    at /proc/interrupts. It also shows how many interrupts have been issued (often
    thousands). None of the above tests show what is actually set in the device. But
    if everything works, the devices are likely set up what is in the hardware.


    # What is in our serial port hardware?


    But how do you find out I/O address and IRQ are actually set in the device hardware?
    If the modem is PCI look at /proc/pei. If it’s ISA, then this is not always easy
    to do. Formerly one did this by checking how the jumpers were set on a modem card,
    serial card, or motherboard. One crude method is try probing with serserial using
    the “autoconfig” option. You’ll need to guess the addresses to probe. See what
    is Setserial.


    Plug-and-Play (PnP) modes (or PnP serial ports) on the ISA bus one may try the
    pnpdummy program (part of isapntools). Pnpdump will “find” the port and show various
    configuration options, but will not tell you its actual I/O address and IRQ. The
    address it “tries” is not the device’s I/O address, but a special read-port used
    only for PnP purposes. After getting some info using pnpdummy, this info may be
    used in isapnp command the “PEEK” keyword to find the I/O and IRQ The command
    in isapnp-configuration file might look something like this (for vendor GVC1601,
    serial number 1): (CONFIGURE GVC1601/1 LD (IO 0 (PEEK))(INT 0 (PEEK))) You need
    more than just this command and it isn’t foolproof (see the man page for isapnp.conf).
    I know the above is not really adequate but if you succeeded in doing it you could
    write it up and see it for me inclusion. Do only if you see this request in the
    latest version of this HOWTO.'
