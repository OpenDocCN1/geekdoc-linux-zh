    can make a ttyS port behave just like a cua port so there is no real need for
    the cua anymore. Except some older programs may need to use the cua.


    What''s the difference? The main difference between cua and ttyS has to do with
    what happens in a C-program when an ordinary "open" command tries to open the
    port. If a cua port has been set to check modem control signals, the port can
    be opened even if the DCD modem control signal not to. Astute programming (by
    adding additional lines to the program) can force a ttyS port to behave way also.
    But a cua port can be more easily programmed for dialing out on a modem when the
    modem fails to assert DCD (since no one has called into it and there''s no carrier).
    That''s why cua was once used for dial-out and ttyS used for dial-in.


    Starting with Linux kernel 2.2, a warning message will be put in the kernel log
    when one uses cua. This is an omen that cua will disappear.


    # ## 6. Interesting Programs You Should Know About


