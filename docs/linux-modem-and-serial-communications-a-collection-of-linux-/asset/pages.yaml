    | CTS | Clear To Send | 5 <--4 | RTS Request To Send |

    | DSR | Data Set Ready | 6 | |


    | DCD | Carrier Detect | 8 <--20 | DTR Data Terminal Ready |

    | SG | Signal Ground | 7--7 | SG Signal Ground |

    | DSR | Data Set Ready | |


