    There is usually a file somewhere that runs at boot-time. If it''s not run at
    boot-time then your Linux system will automatically configure only ttyS{0-3} using
    the default IRQs of 4 and 3 (with the IRQ conflicts). In 1998 it (temporarily)
    changed to only ttyS{0-1}. If you have more than 2 serial ports, or want to control
    over how the ports are configured should use seterial. In fact, your distribution
    may have set things so that the seterial program runs automatically at boot-time.


    The file that runs at boot-time is likely somewhere in the /etc-directory. You
    might use “locate” to find a file named: rc.serial, or seterial (Debian), This
    supplied file which runs at start-up may contain a number of commented-out examples.
    By uncommenting some of these and/ modifying them, you may be able to set things
    correctly or run some tests. You could copy a few of them to another file and
    execute it as a shell script but don''t forget to also copy any definitions needed
    as SETERIAL=/bin/serial.


    If you use seterial it will execute on the command line first, and when you run
    it at boot-time: /etc/rc.d/rc.serial or /etc/rc.boot/setserial that it is run
    at startup. If those files do not exist /etc/rc.d/rc.local (some reported that
