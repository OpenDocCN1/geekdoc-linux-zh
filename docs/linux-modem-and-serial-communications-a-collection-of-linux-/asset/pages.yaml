    There is a DEBUG option that comes with getty_ps. Edit your config file /etc/conf.[ugetty].ttySN
    and add DEBUG=NNN. Where NNN is one of the following combination of numbers to
    what you are trying to debug:


    | D_OFT | 001 | option settings |

    | D_DEF | 002 | defaults file processing |

    | D_UTMP | 004 | utmp/wtmp processing |

    | D_INIT | 010 | line initialization (INIT) |

    | D_GTAB | 020 | gettyab file processing |

    | D_RUN | 040 | other runtime diagnostics |

    | D_RB | 160 | ringback debugging |

    | D_LOCK | 200 | ugetty lockfile processing |

    | D_SCH | 400 | schedule processing |

    | D_ALL | 777 | everything |


    Setting DEBUG=010 is a good place to start.'
