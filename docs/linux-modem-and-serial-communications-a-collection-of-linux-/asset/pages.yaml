    there when the power is turned off). Installing it is usually all on how to do
    it in Windows you''ll need to figure-out how to do the equivalent under Linux
    (unless you want to install the upgrade under Windows).


    If the latest version of this HOWTO contains this request (see New Versions of
    this HOWTO) please send me your experiences with installing such upgrades will
    be helpful to others.


    If you need to send a file (program) to your modem, how do you do it? First, there
    may be a com-mand that you need to send your modem to tell it what follows is
    a flash ROM upgrade. In one case was AT** Next, you need to send the file directly
    to the modem. Communication programs often use zmodem or kermit to send files
    to the modem (and beyond) these put the file into pack-ets which append headers
    and you get the exact file, not a modified one. But the Kermit program has a “transmit”
    command that will send the file directly (without using the packet)) so this is
    one way to send a file directly. Another way would be to escape from the communication
    program to the shell (in minicom is ^^) and then: cat upgrade_file_name /dev/tty2.
    Then go back to the communication program (type fg at the command line prompt
    in minicom) to see what happened.


    # 14. Problems Explained


    While the section Troubleshooting lists problems by symptom, this section explains
    what will happen if something is set incorrectly. This section helps you understand
    what caused the symptom and other symptoms might be due to the same problem.'
