    easy. If you can look at the package it comes in (or a manual) find the section
    in the package that says something like "Minimum System Requirements" or just
    "System Requirements". It may be in fine print Read it closely. If Windows is
    listed as one of the requirements then it will likely not work under Linux. Also
    check out modem list which lists modems which do and do not work under Linux.


