- img_proc: true
  md: '# Linux Modem and Serial Communications


    It could also be an interrupt conflict. See Interrupt Conflicts Make sure there
    are no IRQs shared. Check all your boards (serial, ethernet, SCSI, etc..). Make
    sure the jumper (or PnP) settings, and the seterial parameters are correct for
    all your serial devices. Also check /proc/ioports and /proc/interrupts and /proc/pci
    for conflicts.


    # 12.5 Uploading (downloading) files is broken/slow


    Flow control (both at your PC and or modem) may not be enabled. If you have set
    a high DTE speed (like 115.2K) then flow from your modem to your PC work OK but
    a lot of flow in the direction will not all get thru through the telephone line
    bottleneck. This will result in many errors and the resounding of packets. This
    may take far too long to send a file. In some cases, files don''t thru at. If
    you''re downloading long uncompressed files or web pages (and your modem uses
    data compression) or you''ve set a low DTE speed, then downloading may also be
    broken due to no flow control.


    # 12.6 For Dial-in: I Keep Getting "line NNN of inittab invalid"


    Make sure you are using the correct syntax for your version of init. The different
    init''s that are out use different syntax in the /etc/inittab file. Make sure
    you are using the correct syntax for your version of getty.


    # 12.7 When I Try To Dial Out, It Says "/dev/ttyS: Device or resource busy"


    This problem can arise when DCD or DTR are not implemented correctly. DCD should
    only be on (asserted) when there is an actual connection (if someone has dialed),
    not when getty is watching the port. Check to make sure your modem is configured
    to only assert DCD when there is a connection. DTR should be on (asserted) whenever
    something is using, or watching the line, like getty, kermit, or some other program.


    Another common cause of "device busy" errors, is that you set up your serial port
    with an interrupt already taken by something else. As each device initializes,
    it asks Linux for permission to use its hardware interrupt. Linux keeps track
    of which interrupt is assigned to, whom, and if your interrupt is already taken,
    your device won''t be able to initialize properly. The device really doesn''t
    have much of any way to tell you that this happened, except that when you try
    to use it, it will return a "device-busy" error. Check the interrupts on all of
    your boards (serial, ethernet, SCSI, etc.). Look for IRQ conflicts.'
