    (Com1) and ttyS1 (Com2))

    - Doing nothing if you have both a PnP internal modem and a PnP Linux operating
    system.

    - Setting jumpers (if they exist) on an internal modem, old serial card, or old
    motherboard

    - Using isapnp for a PnP internal modem (non-PCI)

    - Letting a PnP BIOS automatically configure a PnP internal modem (but it may
    be difficult to determine just what that configuration is). See Using a PnP BIOS
    to 10-IRQ Configure

    - Using a setup program which comes with the modem (run under MS Windows) that
    disables PnP


    +   2. "setserial": Assigns ttyS2 to an I/O address and IRQ number. Except that
    you probably don’t need to run it if you have only1 or 2 serial ports total or
    if you use a PnP operating system.


    # Avoiding I/O Address Conflicts: IBM 8514 Video Board


    The I/O address of the IBM 8514 video board (and it’s) is allegedly 0x2e8, the
    same as the I/O address of ttyS3. bad news if you try to use ttyS3 at this I/O
    address.


    # 3.3 What is the current I/O address and IRQ of my Serial Port?


    There are two answers to this question: 1. What the device driver has set (This
    is what setserial “sets”). 2. What is actually set in the hardware. Both should
    be the same. If you’ve-having trouble (including communication programs that can’t
    communicate) it may mean these two'
