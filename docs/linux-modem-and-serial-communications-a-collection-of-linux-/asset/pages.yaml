    See Communications Programs about communications programs if you need some pointers.

    When you dial out your modem, set the speed to the highest serial port speed that
    your modem supports (provided it''s not over 115200 bps). This is not the same
    as the "advertised" speed of the modem such as 56K. Versions of Linux with a libc
    version greater than 5.x have support for speeds up to 115200. Even higher speeds
    than this are in works for Linux.


    # 5.3 Dial Out Modem Configuration


    For dial out only, you can configure your modem however you want. If you intend
    to use your modem for dialin, you must configure your modem at the same speed
    that you intend to run getty. However, most modems set their speed automatically
    to the same speed that modem commands use. Thus having getty at 115,200 will automatically
    set the modem at the speed when getty gets an int string to the serial port where
    the modem is. In general, factory defaults that enable error correction and hardware
    flow control are the best setting for dial out modems, consult your modem manual
    for these settings.


    # 5.4 Hardware Flow Control


    If your modem supports hardware flow control (RTS/CTS), I highly recommend you
    use it. This is particularly important for modems that support data compression.
    First, you have to enable RTS/CTS flow control on the serial port itself. This
    is best done on startup, like in /etc/rc.d/'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'rc.local or /etc/rc.d/rc.serial. Make sure that these files are being run from
    the main rc.sysinitif file! You need to do the following for each serial port
    you want to enable hardware flow control:


    +   - stty crtscts < /dev/ttyS3


    If its not enabled by default, you must also enable RTS/CTS flow control on your
    modem. Your communication program may enable it. Consult your modem manual if
    needed and then save your modem configuration if your modem supports stored profiles.


    # 6. How Do Dial In And Out With My Modem Using getty_ps


    Get your modem to dial out correctly. If you haven''t read section How Do I Dial
    Out With My Modem go it now! It contains very important setup information. You
    do not need to read this section if you only want to dial out with your modem.


    # 6.1 Dial In And Out Modem Configuration


    For dialin and dialout use, you have to set up your modem a certain way (again,
    using AT commands on your modem):


    ```

    E1 command echo ON

    Q0 result codes are reported

    V1 verbose ON

    S=0 never answer (uuggetty handles this with the WAITFOR option)

    ```


    If you don''t set these correctly, your INIT string in your config file may fail,
    hosing the whole process. But, more on config files below...


    ```

    &C1 DCD is after connect only

    &S0 DSR is always on

    DTR on/off resets modem (depends on manufacturer-RTFM)

    ```


    These affect your modem when it starts and end.


    If your modem does not support a stored profile, you can set these through the
    INIT string in your config file. See below. Some modems come with DIP switches
    that affect register settings. Be sure these are set correctly, too.'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'I have started a collection of modem setups for different types of modems.
    So far, I only have a of them, if you would like to send me your working configuration,
    please do so! You can get them at http://ftp.cc.gatech.edu/pub/people/gregh/modem-configs.


    Note: to get my US Courier V.34 modem to reset correctly when DTR drops, I had
    to set D2 and S13=1 (this sets bit 0 of register S13). This has been confirmed
    to work on USR Sportster V.34 modems as well.


    Note: some Supra modems treat DCD differently than other modems. If you are using
    a Supra, try setting &C0 and not &C1. You must also set &D2 to handle DTR correctly.


    # 6.2 Installing getty_ps


    Get the latest version from sunsite.unc.edu/pub/Linux/system/serial. In particular,
    if you want to use high speeds (57600 and 115200 baud), you must get version 2.0.7j
    or later. You must also have libc 5.x or greater.


    By default, getty_ps will be configured to Linux FSTND (File System Standard)
    compliant, which means the binaries will be in /sbin, and the config files will
    be named /etc/config.[ugetty].ttyN This is not apparent from the documentation!
    It will also expect lock files to go in /var/lock. Make sure you have the /var/lock
    directory.


    If you don''t use FSTND compliance, binaries will go in /etc, config files will
    go in /etc/default/[ugetty].ttyS, and lock files will go in /usr/spool/uuc. I
    recommend doing this way if you are using UOCP, because UOCP will have problems
