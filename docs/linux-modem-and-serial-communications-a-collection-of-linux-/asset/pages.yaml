    # 10. Communications Programs And Utilities


    PPP is by far the most widely used. It''s used for Internet access. For dialing
    out to public libraries, bulletin boards, et. minicom is the most popular followed
    by Seyon (X-Windows only) and Kermit.


    # 10.1 Minicom vs. Kermit


    Minicom is only a communications program while Kermit is both a communications
    program and a file transfer protocol. But one may use the Kermit protocol from
    Minicom (provided one has Kermit installed on one PC. Minicom is menu based while
    Kermit is command line based (interactive at the serial prompt). While the Kermit
    program is free software, the documentation is not all free. There is no detailed
    manual supplied and it is suggested that you purchase a book as the manual. However
    Kermit has interactive help which tells all but lacks tutorial explanations for
    the beginner. Commands may be put in a script file so you don''t have to type
    them again each time. Kermit (as a communications program) is more powerful than
    Minicom.


    Although all Minicom documentation is free, it''s not as extensive as Kermit''s.
    Since permission is required to include Kermit in a commercial distribution, and
    since the documentation is not entirely free, some distributions don''t include
    Kermit. In my opinion it''s easier to set up Minicom and there is less to learn.'
