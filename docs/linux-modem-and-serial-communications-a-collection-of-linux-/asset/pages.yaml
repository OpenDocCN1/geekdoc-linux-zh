- img_proc: true
  md: '# FIFO Modem-HOWTO (for Linux) 47


    with the data passing thru it, it just receives and sends it. For the original
    dumb UARTS, the CPU gets an interrupt from the serial device every time a byte
    has been sent or received. The CPU moves the received byte out of the UART''s
    buffer and into memory somewhere, or gives the UART another byte to send. The
    8250 and 16450 UARTS have only a 1 byte buffer. That means, every time a byte
    is sent or received, the CPU is interrupted. At low transfer rates this is OK.
    But at high rates, the CPU gets busy dealing with the UART, that doesn''t have
    time to adequately tend to other tasks. In some cases, the CPU does not get around
    to servicing the interrupt in time, and the UART is overwritten, because they
    are coming in so fast. This is called an "overrun" or "overflow"


    That''s where the FIFO UARTS are useful. The 16550 (or 16550) FIFO chip comes
    with 16 byte buffers. This means it can receive or send (16 bytes) before it the
    CPU. Not only can it wait but the CPU can then receive 14 (or more) bytes at a
    time. Although the interrupt threshold (trigger level) may be set at 8 instead
    of 14, this is still a significant advantage over the other UARTS, which have
    only 1 byte buffer. The CPU receives more interrupts, and is free to do other
    things. Data is lost, and everyone is happy.


    While most PC''s have a 16550 with 16-byte buffers, better UARTS have even larger
    buffers. Note that the interrupt is issued slightly before the buffer get full
    (say a "trigger level" of 14 bytes for a 16-byte buffer). This allows for a few
    more bytes to be received during the time that the interrupt is being serviced.
    The trigger level may be set to various permitted values by kernel software. The
    trigger level of 1 will almost like a dumb UART (except that it still has room
    for 15 more bytes after it issues the interrupt).


    If you type something while visiting a BBS, the characters you type out thru the
    serial port. Your typed characters that you see on the screen were echoed back
    thru the phone line your modem and then your serial port to the screen. If you
    had a 16-byte buffer on the serial port which held back characters until it had
    14 of them, you would need to type many characters before you see what you typed
    (before they appeared on the screen). This would be very confusing but there is
    a "timeout" to prevent this. You normally just see a character on the screen just
    as you type it.


    The "timeout" works like this for the UART buffer: If characters arrive one after
    another, then an interrupt is issued only when the 14th character reaches the
    buffer. But if a character arrives and the next character doesn''t arrive soon
    thereafter, then an interrupt is issued. This happens even though there are not
    14 characters in the buffer (there may only be one character in it). Then what
    you type goes thru this buffer, it acts like a 1-byte buffer even when it actually
    actually (unless your typing is a hundred times faster than normal). There is
    also "timeout" for the transmit buffer as well.'
