  md: '# Cable-Modem-mini-HOWTO


    Vladimir Vuksan, vuksan@veus.hr


    v3.15, 6 December 1998


    This document attempts to answer basic questions on how to connect your Linux
    box: to cable modem or cable Internet provider.'
  merge: -1
  pgno: 144
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 145
- img_proc: true
  md: '# # 1. Introduction


    The main goal of this document is to get your system running with your cable modem,
    and cable internet provider. Unfortunately, many ISPs provide cable modem services,
    give you Windows and Macintosh software only.


    This document attempts to explain how to setup some cable modems and internet
    providers in Linux, the tricks to get them working correctly, and the traps not
    to fall down. It is hoped that this document will assist you, however we make
    no claims for the validity of the information contained.


    # # 1.1 New Versions of this Document


    New versions of this document will be periodically posted to comp.os.linux.answers.
    They will also be added to the various anonymous FTP sites which archive such
    information, including:


    http://sunsite.unc.edu/pub/Linux/docs/HOWTO


    In addition, you should generally be able to find this document on the Linux Documentation
    Project page via:


    http://sunsite.unc.edu/LDP/


    # # 1.2 Feedback


    Feedback is most certainly welcome for this document. Without your submissions
    and input, the document wouldn''t exist. So, please post your additions, comments
    and criticisms to vuksan@veus.hr.


    # # 1.3 Contributors


    The following people have contributed to this mini-HOWTO.


    +   - Dan Sullivan, dsulli@home.com

    - Andrew Novick

    - Michael Strates'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# 1.4 Standard Disclaimer


    No liability for the contents of this documents can be accepted. Use the concepts,
    examples and other content at your own risk. This is a new edition of this document,
    there may be errors and inaccuracies, that may cause of damage to your system.
    Proceed with caution, and although this is highly unlikely, I don''t take any
    responsibility for that.


    Also bear in mind that this is NOT official information. Obtaining official information
    is usually an impossibility with many ISPs. Much content in this document are
    assumptions, which appear to work for people. Use the information at your own
    risk.


    # 1.5 Copyright Information


