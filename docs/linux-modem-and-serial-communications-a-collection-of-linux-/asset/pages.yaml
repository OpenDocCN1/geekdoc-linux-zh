  md: '# Linux Modem and Serial Communications


    "Or the like" (in the previous sentence) may be a bit tricky. If the modem is
    a Plug and Play (PnP) for the ISA bus, the equivalent probably can be using the
    “isapnp” program which comes with “isapntools”. “man isapnp”. Another possible
    way to set the IRQ and 3E8 is (if poss-ible) to configure it under Windows. If
    you have a PnP BIOS, then configuring under Windows should put the configuration
    into the PnP BIOS so that it will be used at boot-time for Linux (pro-vied you
    tell CMOS that you don''t have a PnP operating system when you use Linux). For
    Windows 3.x use the ICU utility. There may be a way to disable PnP using software
    that came with the modem.


    Finally you must also find the file where “setserial” is run and add a line something
    like: “setserial /dev/tty2 irq5”. See All Modems for further instructions.


    # All Modems


    # 2. Modem & Serial Port Basics


    You don''t have to understand the basics to use and install a modem. But understanding
    it may help determine what is is wrong if you run into problems. After reading
    this section, if you want to see How Modems Work in this document (not yet complete).
    A future version of Serial-HOWTO (expected by Feb. 1999) should cover more on
    the serial port itself.


    # 2 Modem Converts Digital to Analog (and conversely)


    Most telephone main lines are digital but the lines leading to your house (or
    business) are usually analog which means that they were designed to transmit a
    voltage wave which is an exact quali-ca of the sound wave coming out of your mouth.
    A voltage wave is called “analog”. If viewed on an oscilloscope it looks like
    a sine wave of varying frequency and amplitude. A digital signal is like a square
    wave. For example 3 v (volts) might be a 1-bit and 0 v could be a 0-bit. For most
    serial ports (used by external modems) +12 v is a 0-bit and -12 v is a 1-bit (some
    are + or - 5 v).'
