  md: "# # What is a leased line\n\nAny fixed, that is permanent, point to point data\
    \ communications link, which is leased from a telco or similar organisation. point\
    \ data communications link, which is leased from a telco or similar organisation.\
    \ \nThe leased line involves cables, such as twisted pair, coax or fiber optic,\
    \ and may involve all sorts of other hardware such as (pupin) coils, transformers,\
    \ amplifiers and regenerators.\n\nThis document deals with:\n\n+   - Configuring\
    \ your modem and pppd to use a 2 wire twisted pair leased line.\n\nThis document\
    \ does NOT deal with:\n\n+   - SLIP, getting or installing pppd, synchronous data\
    \ communication, baseband modems.\n\n# # Assumptions\n\nYou should already have\
    \ a working pppd on your system.\nnYou also need Minicom or a similar program\
    \ to configure your modems.\n\n# # Modem\n\nA leased line is not connected to\
    \ a telephone exchange and does not provide DC power, dial tone, busy tone or\
    \ ring signal. This means your modems are on their own and have to be able to\
    \ deal with this situation.\nYou should have 2 identical external modems supporting\
    \ both leased line and dumb mode. Make your modems can actually do this! Also\
    \ make sure your modem is properly documented. You also need:\n\n+   - 2 wired\
    \ shielded RS232 cables. The shield should be connected to the connector shell\
    \ (not pin 1) at both ends (not at one end).\n- A RS232 test plug may be handy\
    \ for test purposes.\n- 2 RJ11 cords, one for each end of the leased line.\n-\
    \ A basic understanding of 'AT' commands."
  merge: -1
  pgno: 134
- img_proc: true
  md: '# Modem Configuration


    A note on modem configuration and init strings in general:


    Configure your modem software such as minicom or (m)getty to use the highest possible
    speed; 57600 bps for 144k and 115200 bps for faster modems.


    Lots of people use very long and complicated init strings, often starting with
    AT&F and containing lots of modem brand and -type specific commands. This however
    is needlessly complicated. Most programs feel happy with the same modem settings,
    why why not write these settings in the non volatile memory of all your modems,
    and only use ''ATZ'' as an init string in all your programs. This way you can
    swap or upgrade your modems without ever having to reconfigure any of your software.


    Most programs require you to use the following settings:


    +   - Fixed baud rate (no auto baud)


    +   - Hardware bidirectional RTS-RTS flow control (no x-on/x-off)


    +   - 8 Bits, no parity, 1 stopbit


    +   - The modem should produce the TRUE DCD status (&C1)


    +   - The modem should NOT ignore the DTR status (&D2 or &D3)


    Check this with AT&V or AT&Ix (consult your modem documentation)


    These settings are not necessarily the same as the default factory profile (&F),
    so starting an init string with AT&F is probably not a good idea in the first
    place. The smart thing to do is probably use AT&F only when you have reason to
    believe that the modem setup stored in the non volatile memory is screwed up.


    If you think you have found the right setup for your modems, write it to non volatile
    memory with AT&W and test it thoroughly with Z-modem file transfers of both ASCII
    text and binary files. Only if all of this works perfectly should you configure
    your modems for leased line.


    Find out how to put your modem into dumb mode and, more importantly, how to get
    it out of dumb mode; The modem can only be reconfigured when it is not in dumb
    mode.


    Make sure you actually configure your modems at the highest possible speed. Once
    in dumb mode it will ignore all ''AT'' commands and consequently will not adjust
    its speed to that of the com port, but will use the speed at which it was configured
    instead (this speed is stored in a S-register by the AT&W command).'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'Now configure your modem as follows:


    +   - Reset on DTR toggle (\&D3,D1, this is sometimes a S register). This setting
    is required by some ISP''s


    +   - Leased line mode (&L1&L2), consult your modem documentation


    +   - The remote modem auto answer (S0=1), the local originate (S0=0)


    +   - Disable result codes (Q1, sometimes the dumb mode does for this


    +   - Dumb mode (\D1 or %D1, this is sometimes a jumper

    In the modem will ignore all AT commands (sometimes you need to disable the ESC
    char as well).


    Write the configuration to non-volatile memory (&W).


    # Test


    Now connect the modems to 2 computers using the RS232 cables and connect the modems
    to each other using a RJ11 lead. Use a modem program such as Minicom (Linux),
    procom or telix (DOS) on both computers to test the modems.


    You should be able to type text from one computer to the other and vice versa.
    If the screen produces garbage check your com port speed and other settings.


    Now disconnect and reconnect the RJ11 cord. Wait for the connection to reestablishish
    itself. Disconnect and reconnect the RS232 cables, switch the modems on and off,
    stop and restart mini-com.


    The modems should always reconnect at the highest possible speed (some modems
    have speed indicator le).


    Check whether the modems actually ignores the ESC (+++) character. If necessary
    disable the character.


    If all of this works you may want to reconfigure your modems,


    Switch off the sound at the remote modem (M0) and put the local modem at low volume
    (L1).'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# Examples


    # Hi-Tech


    Originate (local):


    ATL1&C1&D3&L2%D1&W1


    Answer (remote):


    ATM0&C1&D3&L2%D1S0=1&W&W1


    # Tron DF


    The ESC char should be disabled by setting S2 > 127;


    Originate:


    ATL1&L1Q&C1&D3S2=171\D1&W


    Answer:


    ATM0&L2Q&C1&D3S0=1S2=171\D1&W


    # US Robotics Courier V-Everything


    The following is based on information supplied by Rolf Raar.

    The USR Sportster and USR Courier-I do not support leased line. You need the Courier-everything
    version for this job.

    There is a webpage on the US site ''explaining'' how to set-up your Courier for
    leased line. However, if you follow these instructions you will end up with a
    completely brain dead modem, which can not be controlled or monitored by your
    pppd.


    The US Courier can be configured with dip switches, however you need to feed it
    the config string first.


    First make sure it uses the right factory profile. Unlike most other modems it
    has three; &F0, &F1 and &F2. The default, which is also the one you should use,
    is &F1. If you send it an AT&F, how-ever it will load the factory profile &F0!'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'Leased line Mini HOWTO 115


    For the reset on DTR toggle you set bit 0 of S register 13. This means you have
    to set S13 to 1.\ Furthermore you need it to leased line mode with &L1;

    ATS13=1&L1&W


    The dip switches are all default except for the following:


    3


    OFF Disable result codes


    4


    ON Disable offline commands


    5


    ON For originate, OFF For answer


    8


    OFF Dumb mode


    # PPPD


    You need a pppd (Point to Point Protocol Daemon) and a reasonable knowledge of
    how it works.

    Consult the relevant RFC''s or the PPP HOWTO if necessary.


    Since you are not going to use a login procedure, you don''t (m)getty and you
    don''t need a

    (fake) user associated with the pppd controlling your link. You are not going
    to dial so you don''t

    eed any chat scripts either.


    In fact, the modem circuit and configuration you have just build, are rather like
    a fully wired null

    modem cable. This means you have to configure your pppd the same way as you would
    with a null

    modem cable.


    For a reliable link, your setup should meet the following criteria:


    +   - Shortly after booting your system, pppd should raise the DTR signal in your
    RS232 port, wait

    for DCD to go up, and negotiate the link.


    +   - If the remote system is down, pppd should wait until it is up again.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '+   - If the link is up and then goes down, pppd should reset the modem (it
    does this by dropping and then raising DTR), and then try to reconnect


    +   - If the quality of the link deteriorates too much, pppd should reset the
    modem and then re-establish the link.


    +   - If the process controlling the link, that is the pppd, dies, a watchdog
    should restart the pppd.


    # Configuration


    Suppose the modem is connected to COM2, the local IP address is ‘Loc_Ip’ and the
    remote IP address is ‘Rem_Ip’. We want to use 576 as our MTU. The /etc/ppp/options.ttyS1
    would be:


    ```

    crcts

    mru 576

    mtu 576

    passive

    Loc_Ip:Rem_Ip

    -chap

    modem

    -pap

    ppersist

    ```


    So, if the local system is 192.168.1.1 and the remote system is 10.1.1.1, then
    /etc/options.ttyS1 on the local system would be:


    ```

    crcts

    mru 576

    mtu 576

    passive

    192.168.1.1:10.1.1.1

    -chap

    modem

    -pap

    ppersist

    ```'
  merge: -1
  pgno: 139
- img_proc: true
  md: "The options.ttyS1 on the remote system would be:\n\n```\ncrtscts\nmru 576\n\
    mtu 576\npassive\n10.1.1.1:192.168.1.1\n-chap\nmodem\n-pap\npersist\n```\n\nThe\
    \ passive option limits the number of (re)connection attempts.\nThe persist option\
    \ will keep pppp alive in case of a disconnect or when it can't connect in the\
    \ first place.\nIf you telnet a while doing filetransfers (FTP or webbrowsing)\
    \ at the same time, you might want to use a smaller MTU and MRU such as 296. This\
    \ will make the remote system more responsive.\n you don't care about telnetting\
    \ during FTP, you could set the MTU and MRU to 1500.\n\n# Scripts\n\nStarting\
    \ the pppd and keeping it alive\nThe script /usr/local/sbin/PRem_Host.sh shown\
    \ below starts the pppd. You have to start it after the com ports are configured\
    \ (substitute Rem_Host with the remote host's name).\n\n```\n#!/bin/bash\n# Optional\
    \ sleep\n# /usr/bin/sleep 30\n( /usr/sbin/pppd /dev/ttyS1 115200 ) &\n```\n\n\
    It could be the script which configures your networkcard (/etc/init.d/network\
    \ on Debian systems), in which case you will have to uncomment the sleep, to make\
    \ sure the com ports are configured first.\nIf you use retails, you could call\
    \ it from there. Another way is to call it from rc.local.\nOn Debian systems,\
    \ there is a directory /etc/rc.boot/. According to Rolf Raar, the scripts in this\
    \ Directory are executed in alphabetical order. The seterial script is called\
    \ 0seterial. If you call your script from a script called 2leased-lines, it will\
    \ be executed after 0seterial."
  merge: -1
  pgno: 140
- img_proc: true
  md: "118 Linux Modem and Serial Communications\n\nThough persist option should make\
    \ this superfluous, the pppd can also be restarted using ip-down,\n\n```\n#!/bin/bash\n\
    case $s in\n  /dev/ttyS)\n    /usr/bin/sleep 30\n    /usr/local/sbin/PRem_Host.sh\
    \ &\n  esac\n```\n\nIf the pppd dies should be restarted by the persist option\
    \ or the ip-up script (optional). If this doesn't happen the script /usr/local/sbin/Test-Rem-Host-pppd\
    \ restarts for you. This script checks the remote interface exists and will try\
    \ to start the pppd if it doesn’t,\n\n```\n#!/bin/bash\nif ! ( /sbin/ifconfig\
    \ | grep Rem_Ip / /dev/null )\nthen\n  # PPP gone\n  logger \"Rem_Host PPP gone\
    \ ; restarted\"\n  /usr/local/sbin/PRem_Host.sh &\nnfi\n```\n\nThe following line\
    \ in crontab runs the above script every 5 minutes. You could run the script often\
    \ if you like but I would not run it more often once every two minutes.\n\n*5\
    \ * * * /usr/local/sbin/test-Rem-Host-pppd\n\nYou can edit the crontab with ‘crontab\
    \ -e’. This will restart cron after editing. It uses the editor specified by the\
    \ ‘EDITOR’ environment variable, which may be set by /etc/profile or ~/.profile\
    \ (export EDITOR=Your_Favourite_Editor).\n\nSome people run pppd from /etc/initab,\
    \ but I never tested this.\n\n# Setting the routes\n\nThe default route can be\
    \ set with the defaultroute option or with the /etc/ppp/ip-up script,\n\n```\n\
    #!/bin/bash\ncase $2 in\n  /dev/ttyS1)\n```"
  merge: -1
  pgno: 141
- img_proc: true
  md: "/sbin/route add -net 0.0.0.0 gw Rem_Ip netmask 0.0.0.0\n;;\n\nesac\n\nIp-up\
    \ can also be used to sync your clock using netctde.\n\nOf course the route set\
    \ in ip-up is not necessarily the default route.\nYour ip-up sets the route to\
    \ the remote network while the ip-up script on the remote system sets\nthe route\
    \ to your network. If your network is 192.168.1.0 and your ppp interface 192.168.1.1,\
    \ the\nip-up script on the remote machine looks like this:\n\n```\n#!/bin/bash\n\
    case $2 in\n  /dev/ttyS1)\n    /sbin/route add -net 192.168.1.0 gw 192.168.1.1\
    \ netmask 255.255.255.0\n  ;;\n```\n\nesac\n\nThe 'case $2' and '/dev/ttyS1)'\
    \ bits are there in case you use more than one ppp link. Ip-up will run\neach\
    \ time a link comes up, but only the part between '/dev/ttySx' and ';;' will be\
    \ executed, setting\nthe right route for the right ttyS.\n\nYou can find more\
    \ about routing in the NET-3-HOWTO section on routing\n\n# Test\n\nTest the whole\
    \ thing just like the modem test.\n\nIf it works, get on your bike and bring the\
    \ remote modem to the remote side of your link."
