    # 3.14 Tebecai, Netherlands


    According to Frodo Looenaar:


    Tebecai is yet another provider which uses a LANCity cable modem connected to
    a 10BaseT ethernet card. DHCP is used for configuration (see the DHCP mini-HOWTO
    at http://sunsite.unc/LDP/HOWTO/mini/DHCP.html). A step-by-step guide to install
    the cable modem under Linux can be found at http://huizen.de/-frodol


    (in dutch), but it is really straightforward. You must only remember that your
    IP-address is not visible from the Internet (it is on the private 10.x,y.z subnet),
    so you can not setup a publicly accessible server.


    Information about Tebecat can be found at http://www.tebenet.net (in dutch only).


