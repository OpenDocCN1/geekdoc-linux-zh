    Now you need to select a communication (dialing) program to use dial out. Dialing
    programs include: minicom, seyon (X-windows), and kerm. See section Communications
    Programs about some communications programs. Two examples are presented: Dialing
    Out with Minicom and Dialing Out with Kermit


    # 7.2 Dialing Out with Minicom


    Minicom comes with most Linux distributions. To configure it you should be the
    root user. Type “minicom -s” this will take you directly to the configuration
    (set-up) menus. Alternatively you could just run “minicom” and then type ^A to
    the bottom status line. This shows to type ^A Z for (you''ve already typed ^A
    so just type z). From the help menu go to the Configuration menu.


    Most of the options don''t need to be set for your dialing out. To configure you
    have to supply a few basics: the name of the serial port your dialing is on as
    /dev/ttyS2 and the speed such as 115200. These are set at the serial port menu.
    Go to it and set them. Also (if possible) set hardware flow control (RTS/CTS).
    Then save. When typing in the speed, you should also see something like “8N1”
    which you should leave alone. It means 8-bit bytes, No parity, 1 stop-bit appended
    to each byte. If you can''t find the speed you want, a lower speed will always
    work for a test. Exit (hit return) when done and save the configuration as default
    (dfl) using the modem. You may want to exit minicom and start again it can now
    find the serial port and initialize the modem, or you could go to help and tell
    minicom to initialize the modem.


    Now you are ready to dial. But first at the main screen you get after you first
    type “minicom” make there''s a modem by typing ^A and then hit the “enter/return”
    key. It should display OK. If it doesn''t something is wrong and there is no point
    of trying to dial.


    If you get the “OK” go back to help and select the dialing directory. You may
    edit it and type in a phone number, etc. into the directory and then select “dial”
    to dial it. Alternatively, you may just dial manually (by selecting “manual” and
    then type the number at the keyboard). If it doesn''t work, carefully note any
    error messages and try to figure out what went wrong.'
