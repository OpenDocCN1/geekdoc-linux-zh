  md: '# 22 Linux Modem and Serial Communications


    Z and &K3. Unfortunately there are many different variations of the AT command
    set so that works for one modem may or may not work for another modem. Thus there
    is no guarantee that the AT commands given in this section will work on your modem.
    Another point is to get the modem to act on the AT command string, a return character
    must be sent at the end of the string. Sometimes the AT is preceded by a return
    character and sometimes there are symbols added to the string (such as) which
    only tell the communication program to pause for a tiny interval of time at that.


    If you have a manual for your modem you can quickly look up the AT command set
    in it. Otherwise you may try to find it on the Internet. You may use a search
    engine and include actual commands in the search terms to avoid finding sites
    that just talk about commands but fail to list them. You may also try a few of
    the sites listed in the subsection Web Sites


    # The Init String


    The examples given in this subsection are from the Hayes modem command set. All
    commands strings must be preceded by the two letters AT. When a modem is powered
    on, it automatically configures itself with one of the configurations it stored
    in its non-volatile memory. If this configuration is satisfactory then there is
    nothing to do.


    If it''s not satisfactory, then one may alter it or reconfigure the modem by sending
    it a string of commands known as an "init string" (= initialization string). Most
    of the time, an init string is automatically sent to the modem when you start
    up communication program (will depend on how you configured the program or what
    script you wrote for it if you use Kermit). You can usually edit the init string
    and change it to whatever you want. Sometimes the communications program will
    let you select the model of your and then use an init string that it thinks is
    best for modem.


    So there is both a default "string" (called a profile) stored inside the modem
    and another (the init string) that the communications program sends it. The modem
    will wind up like the default set it except that it will be modified by the commands
    included in the init string. If the init string is empty then it will of course
    use the default configuration.


    Actually there is more than one "default" configuration (or profile) stored in
    the modem''s non-volatile memory (it''s still there when you turn it off). In
    my modem there are two profiles (0 and 1, neither of which can be changed) and
    two user defined profiles (0 and 1) that the user may set and store. Your modem
    may have more. Which of these user-defined profiles is used at power-up depends
    on another item stored in the profile. If the command Y00 is given then in the
    future file 0 will be used at power-on. If it''s a 1 instead of a 0 profile 1
    will be used at power-on.'
