    # # 13. One Step Further...


    This section is not required reading, but may give you some further insight into
    Unix, and the world of telecommunications.


    # ## 13.1 What Are Lock Files?


    Lock file are simply a file saying that a particular device is in use. They are
    kept in /usr/spool/uuc, or /var/lock. Linux lock files are named LCK..name, where
    name is either a device name, or UUCP site name. Certain processes create these
    locks so that they can have exclusive access to devices. For instance if you dial
    out on your modem, a lock will appear telling other processes that someone is
    using the modem already. Locks mainly contain the PID of the process that has
    locked the device. Most programs look at the lock, and try to determine if that
    lock is still valid by checking the process table for the process that has locked
    the device. If it is not, some programs remove the stale lock, and use the device,
    creating their own lock in the process. Other programs just exit and tell you
    that the device is in use.


    # ## 13.2 "baud" Vs. "bps"


    "baud" and "bps" are perhaps one of the most misused terms in the computing and
    telecommunications field. Many people use these terms interchangeably, when in
    fact they are not!


    baud


    The baud is a measure of how many times per second, for instance one sent by a
    modem (modulator-demodulator) changes. For example, a baud rate of 1200 implies
    one signal change every 833 microseconds. Common baud rates are 50, 75, 110, 300,
    600, 1200, and 2400. Most high speed modems at 2400 baud. Because of the bandwidth
    limitations on voice-grade phone lines, baud rates greater than 2400 are harder
    to achieve, and only work very'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'pristine line quality. Multiple bits can be encoded per baud, to get bit rates
    that exceed the baud rate. "baud" is named after Emile Baudot, the inventor of
    the asynchronous telegraph printer.


    bps baud rate is a measure of how many bits per second are transmitted. Common
    bps rates were 50, 75, 110, 300, 1200, 2400, 9600. Today they are 14.4K, 28.8K,
    33.6K, and 56K (these do not correspond to the rates over the serial-to-modem
    cable which are in addition to the old modem bps rates (50-9600): 19.2K, 38.4K,
    57K and 115.2K). Using modems with V42bias compression (max 4:1 compression),
    rates up to 115.2K bps are possible. This is what most people mean when they misuse
    the word "baud".


    So, if high speed modems are running at 2400 baud, how can they send 1400 bps
    (or higher)? The modems achieve a bps rate greater than baud rate by encoding
    many bits in each signal change, or phase change. Thus, when 2 or more bits are
    encoded per baud, the bps rate exceeds the baud rate. If your modem connects to
    14400 bps, it''s going to be 6 bits per phase, at 2400 baud.


    How did this confusion start? Well, back when low speed modems were high speed
    modems, the bps rate actually equal the baud rate. One bit was encoded per phase
    change. People would use bps and baud interchangeably, because they were the same
    number. For example, a 300 bps modem also had a baud rate of 300. This all changed
    when faster modems came around, and the bit exceeded the baud rate.


    # 13.3 What Are UARTs? How Do They Affect Performance?


    UARTs (Universal Asynchronous Receiver Transmitter) are chips on your PC serial
    board (if you have one) or on the motherboard. The UART function may be done on
    a chip that does other things as well. The UART''s purpose is to convert data
    to bits, send the bits down the serial line, and rebuild the data on the other
    end. UARTs deal with data in byte sized, which is conveniently the size of ASCII
    characters.


    Say you have a terminal hooked up to your PC. When you type a character, the terminal
    gives that character to its transmitter (also a UART). The transmitter sends byte
    out onto the serial line, one bit at a time, at a specific rate. On the PC, the
    receiving UART takes all the bits and rebuilds the byte and puts it in a buffer.


    There are two types of UARTs. You have probably heard of dumb UARTs—the 8250 and
    16450, and FIFO UARTs—16550A. To understand their differences, first let''s examine
    what happens when a UART has sent or received a byte.'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'The UART itself can''t do anything with the data, it just sends and receives
    it. For the original UARTS, the CPU gets an interrupt from the serial device every
    time a byte has been sent or received. The CPU moves the received byte out of
    the UART''s buffer and into memory somewhere, or gives the UART another byte to
    send. The 8250 and 16450 UARTS have only a 1 byte buffer. That means, every time
    1 byte is sent or received, the CPU is interrupted. At low rates, this is OK.
    But, at high transfer rates, the CPU gets so busy dealing with the UART, that
    it doesn''t have time to tend to other tasks. In some cases, the CPU does not
    get around to servicing the interrupt in time, and the byte is overwritten, and
    is coming in so fast.


    That''s where 16550 UARTS are useful. These chips come with 16 byte FIFOs. That
    it can receive or transmit up to 14 bytes before it has to interrupt the CPU.
    Not only can it wait, but the CPU can then transfer 14 bytes at a time. Although
    the interrupt threshold is not always set at 14, this is a significant advantage
    over the other UARTS, which only have the 1 byte buffer. The CPU receives less
    interrupts, and data is not lost, and everyone is happy. (There is also a 1650
    UART, but it is treated as a 16450 if it is broken.)


    In general, the 8250 and 16450 UARTS should be fine for speeds up to 38400 bps.
    At speeds greater than 38400 bps, you might start seeing data loss. Other PC operating
    systems (definition loose here), like DOS arent multitasking, so they might be
    able to cope better with 8250 and 16450s. That''s why some people don''t see data
    loss, until they switch to Linux.


    Non-UART, and intelligent multiport boards use DSP chips to do additional buffering
    and control, relieving the CPU even more. For example, the Cycles Cyclom, and
    Stallion EasyIO boards use a Sirius Logic CD1400 RISC UART, and many boards use
    80186 CPUs or special RISC CPUs, to handle the I/O.


    Keep in mind that these dumb UART types are not bad, they just aren''t good for
    high speeds. We should have no problem connecting a terminal, or a mouse to these
    UARTS. But, for a high speed modem, the 16550A is definitely a must.


    Most newer PC''s (486''s, Pentiums, or better) come with 16550A''s. If you have
    really you may be able to upgrade it by using 16550A chips and replacing your
    existing 16450 UARTS. You are out of luck. The functionality has been put on another
    type of chip, if the UART is socketed, then upgrading is easy (if you can find
    a replacement). The new and old are pin-to-pin compatible. It may be more feasible
    to just buy a serial board from the Internet (few retail stores stock them today).'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# 14. Troubleshooting


    # 14.1 I Keep Getting “line NNN of inittab invalid”


    Make sure you are using the correct syntax for your version of init. The different
    init''s that out there use different syntax in the /etc/inittab file. Make sure
    you are using the correct syntax for your version of getty.


    # 14.2 When I Try To Dial Out, It Says “dev/cuAn: Device or resource busy”


    This problem arise when DCD or DTR are not set correctly. DCD should only be set
    when there is an actual connection (ie somewhen dialed in), not getty is watching
    the port. Check to make sure your modem is configured to only set DCD when getty
    is connection. DTR should be set whenever something is using, or watching the
    line, like getty, kermit, or other comm program.


    Another common cause of “device busy” errors, is that you set up your serial port
    with an interrupt already taken by something else. As each device initializes,
    it asks Linux for permission to use its hardware interrupt. Linux keeps track
    of which interrupt is assigned to whom, and if your interrupt is already taken,
    your device won''t be able to initialize properly. The device really doesn''t
    have much of any way to tell you that this happened, except when you try to use
    it, it will return a “device-busy” error. Check the interrupts on all of your
    boards (serial, ethernet, SCSI, etc.). Look for IRQ conflicts.


    # 14.3 I Keep Getting “Getty respawning too fast: for 5 minutes


    Make sure your modem is configured correctly. Look at registers E and Q. This
    can occur when your modem is chatting with getty.


    Make sure you are calling getty correctly from your /etc/inittab. Using the wrong
    syntax or device names will cause serious problems.


    Verify that your /etc/gettydefs syntax is correct by doing the following:


    ```

    linux# getty -c /etc/gettydefs

    ```


    This can also happen when the ugetty initialization is failing. See section getty
    Or uugetty Still Doesn''t Work.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# 14.4 Serial Devices Are Slow, Or Serial Devices Can Only Send In One Direction


    # 14.5 My Modem Is Hosed After Someone Hangs Up, or ugetty doesn''t respawn


    This can happen when your modem doesn''t reset when DTR is dropped. I saw my RD
    and SD LEDs go crazy when this happened to me. You need to have Hayes compatible
    modems to do this with d3, but on your USR Courier, I had to set dD2 and S13=1.
    Check your modem manual.


    # 14.6 I Have My Terminal Connected To My PC, But After I Type In A Login Name,
    It Just Locks


    +   - If you are using getty: You probably don''t have CLOCAL in /etc/gettydefs
    entry for the terminal, and you''re probably not using a full numb modem. You
    need CLOCAL, which tells Linux to ignore modem control signals. Here is what it
    should look like:

    ```bash

    # 38400 bps Dump Terminal entry

    DT38400# B38400 CS8 CLOCAL # B38400 SANE -ISTRIP CLOCAL

    ## L login: #DT38400


    # 19200 bps Dump Terminal entry

    DT19200# B19200 CS8 CLOCAL # B19200 SANE -ISTRIP CLOCAL

    ## L login: #DT19200

    ```


    Next, kill the getty process so a new one will be spawned with the new entry.


    +   - If you are using getty: Add the -L flag to the getty line in your /etc/inittab.
    This will make it ignore modem control signals. Then restart it by typing q. The
    entry should look like this:

    ```bash

    s1:345:respawn:/sbin/agetty -L 9600 ttyS1 vt100

    ```'
  merge: -1
  pgno: 121
