- img_proc: true
  md: 'Exceptions to these rules may be granted for academic purposes: Write to the
    author and ask. These restrictions are here to protect us as authors, not to restrict
    you as educators and learners. All source code in Linux Installation and Getting
    Started is placed under the GNU General Public License, available via anonymous
    FTP from the GNU archive site.


    # Publishing LDP Manuals


    If you''re a publishing company interested in distributing any of the LDP manuals,
    read on.


    By the license given in the previous section, anyone is allowed to publish and
    distribute verbatim copies of the Linux Documentation Project manuals. You don''t
    need our explicit permission for this. However, if you would like to distribute
    a translation or derivative work based on any of the LDP manuals, you must obtain
    permission from the author, in writing, before doing so.


    All translations and derivative works of LDP manuals must be placed under the
    Linux Documentation License given in the previous section. That is, if you plan
    to release a translation of one of the manuals, it must be freely distributable
    by the above terms.


    You may, of course, sell the LDP manuals for profit. We encourage you to do so.
    Keep in mind, however, because the LDP manuals are freely distributable, anyone
    may photocopy or distribute printed copies free of charge, if you wish to do so.


    We do not require to pay royalties for any profit earned from selling LDP manuals.
    However, we would like to suggest that if you sell LDP manuals for profit, that
    you either offer the author royalties, or donate a portion of your earnings to
    the author, the LDP as a whole, or to the Linux development community. You may
    also wish to send one or more free copies of the LDP manual that you are distributing
    to the author. Your show of support for the LDP and the Linux community will be
    very appreciated.


    We would like to be informed of any plans to publish or distribute LDP manuals,
    just so we know how they''re becoming available. If you are publishing or planning
    to publish any LDP manuals, please send email to Matt Welsh (mdw@metalab.unc.edu).


    We encourage Linux software distributors to distribute the LDP manuals (such as
    the Installation and Getting Started Guide) with their software. The LDP manuals
    are intended to be used as the "official" Linux documentation, and we''d like
    to see mail-order distributors bundling the LDP manuals with software. As the
    LDP manuals match, hopefully they will fulfill this goal adequately.


    Matt Welsh, mdw@metalab.unc.edu'
