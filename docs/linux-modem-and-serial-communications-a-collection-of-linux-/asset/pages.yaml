    # 8.3 Notes On Setting Up A PC As A Terminal


    Many people set up other PCs as terminals connected to Linux boxes. For example,
    old 8088 or 80286 PCs are perfect for this purpose. All you need a DOS boot disk
    containing a version of DOS suitable for your terminal-PC, and a communications
    program for your terminal-PC to run. kermit works well for this purpose. You can
    find pre-compiled versions of kermit for every OS in existence at http://www.columbia.edu/k/.
    Other popular DOS comm programs such as telix and procomm will work equally well.
    Be sure to input correct serial port information into your terminal-PC''s setup.


    # 9. Can I Use More Than Two Serial Devices?


    You don''t need to read this section, unless you want to use three or more serial
    devices... (assuming you don''t have a multiport board).


    Providing you have another spare serial port, yes you can. The number of serial
    ports you can use is limited by the number of interrupts (IRQs) and port I/O addresses
    we have to use. This is not a Linux limitation, but a limitation of the PC bus.
    Each serial device must be assigned its own interrupt. If two devices share the
    same interrupt, it may work OK provided the two devices are not operating at the
    same time. (In most cases, the programs must not be running at the same time.)
    A serial device can be an internal modem, or a multiport serial board.


    Multipro serial boards are specially designed to have multiple serial ports that
    share the same IRQ for all serial ports on the board. Linux gets data from them
    by using a different I/O address for each port on the board.


    # 9.1 Choosing Serial Device Interrupts


    Your PC will normally come with tty0 and tty2 at IRQ 4, and tty1 and tty3 at IRQ
    3. You can see what IRQs are in use by typing: /dev/tty2, Looking at /proc/interrupts
    will show some of them. To use more than two serial devices, you will have to
    reassign an interrupt. A good choice is to reassign an interrupt from your parallel
    port. Your PC normally comes with IRQ 5'
