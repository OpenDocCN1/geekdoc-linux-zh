  md: '# NetBIOS


    You can gather Windows information by poking around with NetBIOS (Network Basic
    Input/Output System) functions and programs. NetBIOS allows applications to make
    networking calls and communicate with other hosts within a LAN.


    These NetBIOS ports can be compromised if they aren''t secured properly:


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_222_0.png)


    +   UDP ports for network browsing:


    +   - Port 137 (NetBIOS name services, also known as WINS)

    - Port 138 (NetBIOS datagram services)


    +   TCP ports for Server Message Block (SMB):

    - Port 139 (NetBIOS session services, also known as CIFS)

    - Port 445 (runs SMB over TCP/IP without NetBIOS)


    # Hacks


    The hacks described in the following two sections can be carried out on unprotected
    systems running NetBIOS.


    # UNAUTHENTICATED ENUMERATION


    When you''re performing your unauthenticated enumeration tests, you can gather
    configuration information about the local or remote systems in your ways:


    +   Using all-in-one scanners, such as LanGuard or Nexpose.


    +   Using the nbstat program that''s built into Windows. (nbstat stands for NetBIOS
    over TCP/IP Statistics).


    Figure 12-4 shows information that you can gather from a Windows 7 system with
    a simple nbstat query.


    nbstat shows the remote computer''s NetBIOS name, which you gather by using the
    nbstat -A command. This command displays the computer name, the domain name, and
    the computer''s media access control (MAC) address.


    An advanced program as Nexpose isn''t necessary to gather this basic information
    from a Windows system. The graphical interface offered by commercial software
    as Nexpose, presents its findings in a pretty fashion that''s easy to use. Additionally,
    you have the benefit of gathering the information you need with one.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_222_1.png)


