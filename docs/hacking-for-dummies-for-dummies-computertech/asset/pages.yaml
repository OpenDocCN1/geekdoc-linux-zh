    # Chapter 2

    Cracking the Hacker Mindset


    Before you start assessing the security of your systems, it''s good to know a
    few things about the people you''re against. Many security product-vendors and
    security professionals claim that you should protect all of your systems from
    the bad guys — both internal and external. But what does this mean? How do you
    know these people think and what are their attacks?


    Knowing what hackers and malicious users want you understand how they work. Understanding
    how they work helps you look at information systems in a whole new way. In this
    chapter, I describe the challenges you face from the people who actually do the
    misdeeds, as well as their motivations and methods. This understanding best prepares
    you for your security tests.


    # What You''re Up Against


    Thanks to sensationalism in the media, public perception of hacker has trans-from
    harmless tinkerer to malicious criminal. Nevertheless, hackers often state that
    the public understands them, which is mostly true. It''s easy to prejudice what
