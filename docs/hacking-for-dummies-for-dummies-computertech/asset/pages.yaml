  md: '# WINDOWS 10 SECURITY


    With all the vulnerabilities in Windows, it’s sometimes tempting to jump ship
    and move to Linux or macOS, but not so fast. Microsoft made great strides with
    security in Windows 7 and Windows 8.x, both of which laid the groundwork for the
    much-more-secure Windows 10.


    Building on Windows 8.x, Microsoft made improvements in Windows 10 beyond the
    restored Start button and Start menu, including the following:


    +   - Windows Update for Business, which provides greater control of enterprise
    Windows patch management


    +   - Scheduled restarts for Windows Patches to nudge users along


    +   - A more enterpriseworthy version of Windows BitLocker for full-disk encryption
    as well as BitLocker To Go for removable devices


    +   - Better malware protection with the built-in Windows Defender which includes
    Advanced Threat Protection, Credential Guard, Device Guard, Device Health Attestation,
    and Exploit Guard


    +   - Windows Hello for user authentication supporting fingerprint scanners and
    other biometric devices, such as face and iris scanners


    Finally, Windows 10 is really fast, which is really nice, especially if you use
    the OS for security testing. Its efficiency may be just what you need to stop
    users from disabling (or trying to disable) their antivirus software to speed
    their computers, which happens quite often. Well, and that not providing them
    with administrator privileges.


    Having run various scans and attacks against Windows 10 systems, I’ve found that
    its damn secure default installation, starting with the original release-to-manufacturing
    version and all the way up to the present. But Windows 10 isn’t immune to attack
    and attack. As long as the human element is involved in software development,
    network administration, and end-user functions, people will continue to make mistakes
    that leave windows open (pun intended for the bad guys to sneak through and carry
    out their attacks). Yep, even Windows 10 is vulnerable to various ransomware attacks.
    The keys are to make sure that you never let your guard down and to have good
    endpoint security (malware protection) working in your favor.'
