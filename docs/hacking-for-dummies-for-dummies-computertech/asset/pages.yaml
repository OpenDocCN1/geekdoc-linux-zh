  md: '# Vulnerable wireless workstations


    Wireless workstations such as Windows-based laptops can have tons of security
    vulnerabilities, from weak passwords to unpatched security holes to the storage
    of WEP and WPA encryption keys locally. Most of the well-known wireless client
    vulnerabilities have been patched by their respective vendors, but you never know
    whether all your wireless systems are running the latest (and usually safest)
    versions of operating systems, wireless client software, and other software applications.


    In addition to using the wireless client, stumbling, and network analysis I mention
    earlier in this chapter, you should search for wireless client vulnerabilities
    by performing authenticated scans with various vulnerability testing tools, such
    as GFI LangGuard, Nexpose, and Acunetex Web Vulnerability Scanner.


    These programs aren''t wireless-specific, but they may turn up vulnerabilities
    in your wireless computers that you might not have discovered or thought about
    otherwise. I cover operating-system and application vulnerabilities as well as
    using the tools in the preceding list in Parts 4 and 5 of this book.


    # Countermeasures against wireless workstations


    You can implement the following countermeasures to keep your workstations from
    being used as entry points into your wireless network:


    +   * Regularly perform vulnerability assessments on your wireless workstations,
    in addition to other network hosts.

    * Apply the latest vendor security patches and enforce strong user passwords.

    * Use personal firewalls (such as Windows Firewall) and endpoint security software
    on all wireless systems where possible, including phones and tablets, to keep
    malicious intruders off those systems and out of your network.

    * Install antimalware software.


    # Default configuration settings


    Similar to wireless workstations, wireless APs and routers have many known vulnerabilities.
    The most common ones are default SSIDs and admin passwords. The more specific
    ones occur only on certain hardware and software versions that are posted in in
    vulnerability databases and vendor websites. Some wireless systems'
