    # Chapter 7


    # Physical Security


    strongly believe that information security is more dependent on nontechnical aspects
    of IT and security than on the technical hardware and software solutions that
    many people and vendors swear by. Physical security, which is the protection of
    physical property, encompasses both technical and nontechnical components, both
    of which must be addressed.


    Physical security is an often-overlooked but critical aspect of an information
    security program. Your ability to secure your information depends on your ability
    to physically secure your office, building, or campus. In this chapter, I cover
    common physical security weaknesses as they relate to computers and information
    security that you must seek out and resolve. I also outline free and low-cost
    countermeasures you can implement to minimize your business''s physical vulnerabilities.


    > I don''t recommend breaking and entering, which would be necessary to fully
    test physical security vulnerabilities. I don''t want you to get shot or go to
    jail! Instead, approach those areas to see how far you can get. Take a fresh look
    from an outsider''s perspective — at the physical vulnerabilities covered in this
    chapter. You may discover holes in your physical security that you previously
    overlooked.'
