  md: '# Compliance and regulatory concerns


    Your internal policies may dictate how management views security testing, but
    you also need to consider the state, federal, and international laws and regulations
    that affect your business. In particular, the Digital Millennium Copyright Act
    (DMCA) sends chills down the spines of legitimate researchers. See www.eff.org/issues/dmca
    for everything that the DMCA has to offer.


    Many federal laws in the United States — such as HIPAA and the associated Health
    Information Technology for Economic and Clinical Health (HITECH) Act, Gramm-Leach-Bliley
    Act (GLBA), North American Electric Reliability Protection (NERC) Critical Infrastructure
    Protection (CIP) requirements, and PCI DSS — require security controls and consistent
    security evaluations. Related international laws — such as the Canadian Personal
    Information Protection and Electronic Documents Act (PIPEDA), the European Union''s
    General Data Protection Regulation (GDPR), and''s Personal Information Protection
    Act (JPIPA) — are different. Incorporating your security tests into these compliance
    requirements is a great way to meet state and federal regulations and to beef
    your overall information security and privacy program.


    # Understanding the Need to Hack Your Own Systems


    To catch a thief, you must think like a thief. That adage is the basis of vulnerability
    and penetration testing. Knowing your enemy is critical. The law of averages works
    against security. With the increased number of hackers and their expanding knowledge,
    and the growing number of system vulnerabilities and unknowns, all computer systems
    and applications will eventually be hacked or compromised in some way. Protecting
    your systems from the bad guys — not just addressing general security practices
    is critical. When you know how vulnerable your systems really are:


    Hacking prey on weak security practices and undisclosed vulnerabilities. More
    and research, using the annual Verizon Data Breach Investigations Report (www.verizon.com/verizon-insights-lab/dbir),
    shows that longstanding, known vulnerabilities are also being targeted. Firewalls,
    encryption, and other fancy (and expensive) security technologies often create
    a false feeling of safety. These security systems tend to focus on high-level
    vulnerabilities, such as access control and protecting information in transit,
    without affecting how the'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'bad guys work. Attacking your own systems to discover vulnerabilities — especially
    the low-hanging fruit that gets so many people into trouble — helps make them
    more secure. Vulnerability and penetration testing is a proven method for greatly
    hardening your systems from attack. If you don''t identify weaknesses, it''s only
    a matter of time before the vulnerabilities are exploited.


    As hackers expand their knowledge, so you should. You must think like them and
    work like them to protect your systems from them. As an ethical hacker, you must
    know the activities that unethical hackers carry out, as well as how to stop their
    efforts. Knowing what to look for and how to use that information helps thwart
    hackers.


    You don''t have to protect your systems from everything. You can''t. The only
    protection against everything is unplugging your computer systems and locking
    away so no one can touch them — not even you. Doing so is not the best approach
    to security, and it''s certainly not good for business! What''s important is protecting
    your systems from known vulnerabilities and common attacks — the 20 percent of
    the issues that cause 80 percent of the risks, which happen to be some of the
    most overlooked weaknesses in most organizations.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_27_0.png)


    Anticipating all the possible vulnerabilities you''ll have in your systems and
    business processes is impossible. You certainly can''t plan for all of attacks
    — especially the unknown ones. But the more combinations you try and the more
    you test whole systems instead of individual units, the better your chances are
    of discovering vulnerabilities that affect your information systems in their entirety.


    Don''t waste your security testing too far, though; hardening your systems from
    unlikely (or even likely) attacks makes little sense.


    Your overall goals for security testing are to:


    +   - Prioritize your systems so that you can focus your efforts on what matters.

    - Test your systems in a nondestructive fashion.

    - Enumerate vulnerabilities and, if necessary, prove to management that business
    risks exist.

    - Apply results to address the vulnerabilities and better secure your systems.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_27_1.png)


    # CHAPTER 1 Introduction to Vulnerability and Penetration Testing 13'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Understanding the Dangers

    Your Systems Face


    It''s one to know generally that your systems are under fire from hackers around
    the world and malicious users around the office; it''s another to understand-specific
    potential attacks against your systems. This section discusses well-known attacks
    but is by no means a comprehensive listing.


    Many security vulnerabilities aren''t critical by themselves, exploiting several
    vulnerabilities at the same time can take their toll on a system or network environment.
    A default Windows operating system (OS) configuration, a weak SQL Server administrator
    password, or a server on a wireless network may not be a major security concern
    by itself. But someone who exploits all of these vulnerabilities at the same time
    could enable unauthorized remote access and close sensitive information (among
    other things).


    Complexity is the enemy of security.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_28_0.png)


    Vulnerabilities and attacks have grown enormously in recent years because virtualization,
    cloud computing, and even social media. These three things alone add immeasurable
    complexity to your environment.


    # Nontechnical attacks


    Exploits that involve manipulating people end users and even you are the greatest
    vulnerability in any computer or network infrastructure. Humans are by nature,
    which can lead to social-engineering exploits. Social engineering is exploiting
    the trusting nature of human beings to gain information (often via email phishing
    — for malicious purposes). Check Chapter 6 for more information about social engineering
    and how to guard your systems against.


    Other common, effective attacks against information systems are physical. Hacks
    break into buildings, computer rooms, or other areas that contain critical information
    or property to steal computers, servers, and other valuable equipment. Physical
    attacks can also include dumpster diving — rummaging through trash cans and bins
    for intellectual property, passwords, network diagrams, and other information.


    14 PART 1 Building the Foundation for Security Testing'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Network infrastructure attacks


    Attacks on network infrastructures can be easy to accomplish because many net-works
    can be reached from anywhere in the world via the Internet. Examples of network
    infrastructure attacks include the following:


    +   >> Connecting to a network through an unsecured wireless access point attached
    behind a firewall.


    +   >> Exploiting weaknesses in network protocols, such as File Transfer Protocol
    (FTP) and Secure Sockets (SSL).


    +   >> Flooding a network with too many requests, creating denial of service (DoS)
    for legitimate requests.


    +   >> Installing a network analyzer on a network segment and capturing every
    packet that travels across it, revealing confidential information in clear text.


    # Operating system attacks


    Hacking an OS is a preferred method of the bad guys. OS attacks make up a large
    portion of attacks simply because every computer has an operating system. They
    are susceptible to many well-known exploits, including vulnerabilities that remained
    years later.


    Occasionally, some OSes that tend to be more secure out of the box — such as the
    old-but-still-out-there Novell NetWare, OpenBSD, and IBM Series i — are attacked,
    and vulnerabilities turn up. But hackers tend to prefer attacking Windows, Linux,
    and Mac because they are more widely used.


    Here are some examples of attacks on operating systems:


    +   >> Exploiting missing patches


    +   >> Attacking built-in authentication systems


    +   >> Breaking file system security


    +   >> Cracking passwords and weak encryption implementations


    # Application and other specialized attacks


