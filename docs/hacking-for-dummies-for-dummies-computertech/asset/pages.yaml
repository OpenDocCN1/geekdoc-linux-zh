  md: '# CHKCONFIG


    If you don''t have an inetd.conf file (or if it''s empty), your version of Linux
    is probably running the xinetd program — a more-secure replacement for inetd to
    listen for incoming network application requests. You can edit the /etc/xinetd.conf
    file in this case. For more information on the use of xinetd and xinetd.conf,
    enter man xinetd or man xinetd at a Linux command prompt. If you are running Red
    Hat 7.0 or later, you can run the /sbin/chkconfig program to turn off the daemons
    you don''t want to load.


    You can also enter chkconfig --list at a command prompt to see what services are
    enabled in xinetd.conf file.


    If you want to disable a specific service, such as snmp, enter the following:


    ```

    chkconfig --del snmpd

    ```


    You can use the chkconfig program to disable other services, such as FTP, Telnet,
    and web server.


    # Access control


    TCP Wrappers can control access to critical services that you run, such as FTP
    and HTTP. This program controls access for TCP services and logs their use, helping
    you control access via host name or IP address and track malicious activities.


    You can find more information about TCP Wrappers at ftp://ftp.porcupine.org/pub/security/index.html.


    Always make sure that your OS and the applications running aren''t open to the
    world (or your internal network where that might matter) by ensuring that reasonable
    password requirements are in place. Don''t forget to disable anonymous FTP you
    absolutely need it. Even if you do, limiting system access to those who have a
    business need to access sensitive information can help, if there''s a possibility.


    # Securing the .hosts and hosts.equiv Files


    Linux and all the flavors of Unix are file-based OSes. Practically everything
    that''s done on the system involves the manipulation of files, which is why so
    many attacks against Linux are at the file level.


    238 PART 4 Hacking Operating Systems'
