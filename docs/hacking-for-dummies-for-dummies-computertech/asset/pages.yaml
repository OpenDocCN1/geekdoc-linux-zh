  md: '# Blind SQL Injection


    VULNERABILITY DETAILS


    | PARAMETER | VALUE |

    | --- | --- |

    | PARAMETER TYPE | int |

    | PARAMETER NAME | id |


    Blind SQL injection occurs when an attack is triggered by a query that is interpreted
    as an SQL command, rather as normal data for the database query.


    The attacker can infer information from the database by observing the response
    of the application, such as the time taken to respond.


    IMPACT


    +   - The attacker can extract sensitive data from the database, the operating
    system and take control of the database server.


    ACTIONS TO TAKE


    +   - Use parameterized queries to prevent SQL injection.


    | CWE | SCORE |

    | --- | -- |

    | PCI 3.1 | 7.5 |

    | CWE-89 | 9.8 |

    | CWE-20 | 6.1 |

    | CWE-943 | 7.5 |

    | CWE-50 | 5.9 |

    | CAPEC | - |

    | CVSS:3.1 | 9.8 (Critical) |


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_303_0.png)


    When discover SQL vulnerabilities, you may be inclined to stop without trying
    to exploit the weakness. That''s fine. But far to see how into the database system
    I can get. I recommend using SQL injection capabilities built into your vulnerability
    scanner if possible so that you can demonstrate the flow to management.


    If your budget is limited, consider using a free SQL tool such as SQL Power Inject
    (https://sqlpowerinjector.com) or the Firefox add-on SQL Inject Me (https://addons.mozilla.org/en-us/firefox/addon/sql-inject-me).


    I cover database security in depth in Chapter 16.


    # Cross-site scripting


    Cross-site scripting (XSS) is perhaps the best-known and most-widespread vulnerability
    that occurs when a web page displays user input JavaScript that is not properly
    validated. An attacker can take advantage of the absence of input filtering and
    cause a web page to execute malicious code on any computer that views the page.


    An XSS attack can display the user ID and password login form from another website,
    for example if users unknowingly enter their user IDs and passwords are stored
    in the hacker''s server log file. Other malicious code can be sent to a victim''s
    computer and run with the same security privileges as the browser or email application
    that viewing it on the system. The malicious code could provide a hacker full
    read/write access to cookies or browser history files, or even permit to download
    or install malware.


    CHAPTER 15 Web Applications and Mobile Apps 289'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'A simple test shows whether your web application is vulnerable to XSS. Look
    for any fields in the application that accept user input (such as in a login or
    search form), and enter the following JavaScript statement:




    If a window pops up that reads XSS, as shown in Figure 15-5, the application is
    vulnerable. The XSS-Me Firefox Add-on (https://addons.mozilla.org/en-US/firefox/addon/xss-me)
    is a novel way to test for this vulnerability well.


    ```

    &lt;script&gt;alert(''XSS'')&lt;/script&gt;

    ```


    FIGURE 15-5:

    Script code reflected in the browser.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_304_0.png)


    There are many ways to exploit XSS, such as requiring user interaction via the
    JavaScript onmouseover function. as with SQL injection, you really need to use
    an automated scanner to check for XSS. Both Netsparker and Acunet Vulnerability
    Scanner do a great job of finding XSS, but they tend to find different XSS issues
    — a detail that highlights the importance of using multiple scanners when you
    can. Figure 15-6 shows some sample XSS findings in Acunet Web Vulnerability Scanner.


    Another vulnerability scanner that''s good at uncovering XSS that many scanners
    won''t find is AppSpider (formerly NTSpider) from Rapid7 (https://www.rapid7.com/products/appspider).
    In my experience, AppSpider works better than other scanners at performing authenticated
    scans against applications that use multifactor authentication systems. AppSpider
    should be on your radar. Never forget: when it comes to web vulnerabilities, the
    more scanners, the better! If anything, someone else might use one of the scanners
    that you don''t.


    # Countermeasures against input attack


    Web and applications must filter incoming data. The sites and applications must
    ensure that the data entered fits within the parameters that the application is
    expecting. If the data doesn''t match, the application should generate an error
    or return to the previous page. Under no circumstances should the application
    accept the junk data, process it, and reflect it to the user.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# FIGURE 15-6: Using Acunix Web Vulnerability Scanner to find cross-site scripting
    in a web application.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_305_0.png)


    Secure coding practices can eliminate all these issues if they''re critical parts
    of the development process. Developers should know and implement these best practices:


    +   - Never prevent static values that the web browser and the user don''t need
    to see. Instead, this data should be implemented within the web application or
    retrieved from a database only when needed.

    - Filter out <script> tags from input fields.

    - Disable detailed web server and database-related error messages if possible.


    # Default script attacks


    Poorly written web programs, as Hypertext Preprocessor (PHP) and Active Server
    Pages (ASP) scripts, can allow hackers to view and manipulate files on a web server
    and do other things they''re not authorized to do. These flaws are also common
    in the content management systems that developers, IT staff, and marketing professionals
    use to maintain a website''s content. Default script attacks are common because
    so poorly written code is freely accessible on websites. Hackers can take advantage
    of various sample scripts that install on servers, especially older versions of
    Microsoft''s IIS web server.


    CHAPTER 15 Web Applications and Mobile Apps 291'
