    # Code injection and SQL injection


    Similar to UBL manipulation attacks, code-injection attacks manipulate system
    variables. Here''s an example:


    ```

    http://www.your_web_app.com/script.php?info=X

    ```


    Attackers who see this variable can start entering different data in the info-variable
    field, changing X to something like of the following lines:


    ```

    http://www.your_web_app.com/script.php?info-variable=Y

    http://www.your_web_app.com/script.php?info_variable=123XYZ

    ```


    This is rudimentary. Nonetheless, the web application may respond in a way that
    gives attackers more information than they want, such as detailed errors or access
    to data fields that they''re not authorized to access. The invalid input may also
    cause the application or the server to hang. Attack can use this information to
    find out more about the web application and its inner workings, which can lead
    to a serious system compromise.


    CHAPTER 15 Web Applications and Mobile Apps 287'
  merge: -1
  pgno: 301
- img_proc: true
  md: '![](img/6f4b05e27c5ed3644d5304cc1cefc73c_302_0.png)


    If HTTP variables are passed in the URL and are easily accessible, it''s only
    a matter of time before someone exploits your web application.


    I once used a "name" web application to manage some personal information that
    just did this. Because a "name" parameter was part of the URL, anyone could gain
    access to other people''s personal information by changing the "name" value. The
    URL included "name=kbeaver", a simple change to "name=jsmith" would bring up J.
    Smith''s address, Social Security number, and so on. Ouch! I alerted the system
    administrator to this vulnerability. After a few minutes of delay, he agreed it
    was indeed a problem and proceed to work with the developers to fix it.


    Code injection can be carried out with back-end SQL databases in an attack known
    as SQL injection. Malicious attackers insert SQL statements such as CONNECT, SELECT,
    and UNION INTO SQL results to attempt to connect and extract information from
    the SQL database that the web application interacts with. SQL injection is made
    possible by applications'' failure to validate input properly combined with informative
    errors returned from database servers and web servers.


    Two general types of SQL injection are called error-based and blind. Error-based
    SQL injection is exploited on error messages returned from the application when
    invalid input is injected into the system. Blind SQL injection happens when error
    messages are disabled, requiring the hacker or automated tool to guess what the
    database is returning and how it''s responding to injection attacks.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_302_1.png)


    A quick (not always reliable) way to determine whether your application is vulnerable
    to SQL injection is to enter a single apostrophe ('''') in your web form fields
    or at the end of the URL. If a SQL error is returned, injection is present.


    You''re definitely going to get what you pay for when it comes to scanning for
    uncovering SQL injection with a web vulnerability scanner. With URL manipulation,
    you''re much better off running a vulnerability scanner to check for SQL injection,
    which allows an attacker to inject database queries and commands through the vulnerable
    page to the back-end database. Figure 15-4 shows numerous SQL injection vulnerabilities
    discovered by the Netspark vulnerability scanner.


    The thing neat about Netspark is that after it encounters SQL injection, you can
    use the built-in tool Execute SQL Commands to further demonstrate the weakness.
    A screens hot of SQL injection in action is about as good as vulnerability and
    penetration testing tests!


    # PART 5 Hacking Applications'
