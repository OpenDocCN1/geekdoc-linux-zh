  md: '>> Proactive Password Auditor (https://www.elcomsoft.com/ppa.html) runs brute-force,
    dictionary, and rainbow cracks against extracted LM and NTLM password hashes.


    >> Proactive System Password Recovery (https://www.elcomsoft.com/pspr.html) recovers
    practically any locally stored Windows passwords, as logon passwords, WEP/WPA
    passphrases, SYSKEY passwords, and RAS/dialup/VPN passwords.


    >> pwdump3 (www://openwall.com/passwords/windows-pwdump) extracts Windows passwords
    from the SAM (Security Accounts Manager) database.


    >> RainbowCrash (http://project-rainbowcrack.com/) crashes LanManager (LM) and
    MD5 hashes quickly by using rainbow tables.


    >> THC-Hydra (https://tools.kali.org/password-attacks/hydra) cracks logins for
    HTTP, FTP, IMAP, SMTP, VNC, and many more.


    Some of these tools require physical access to the systems. You are testing, by
    demanding value physical access to password cracking. If a hacker can obtain physical
    access to your systems and passwords, you have more than just basic information
    security problems to worry about, right? True, but this kind of access is entirely
    possible! What about a summer intern, a disgruntled employee, or an outside contractor
    with malicious intent? The risk of an unencrypted laptop being lost or stolen
    and falling into the hands of someone with ill intent should be reason enough.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_117_0.png)


    To understand how the preceding password-cracking programs work generally, you
    need to understand how passwords are encrypted. Passwords are typically encrypted
    when they''re stored on a computer, using an encryption or one-way hash algorithm
    as SHA2 or MD5. Then hashes are represented as fixed-length encrypted strings
    that always represent the same passwords with exactly the same strings. These
    hashes are irreversible for all practical purposes, so in theory, passwords can
    never be decrypted. Furthermore, certain passwords, such as those in Linux, have
    a random value called a salt to create a degree of randomness. This value prevents
    the password used by two people from having the same hash value.


    In Windows, after the password hashes are obtained, attackers can leverage an
    attack called pass hash to send the hash rather than the actual password to the
    system for authentication. You can find a good article on Metasploit and the pspexec
    module for this purpose at https://www.offensive-security.com/metasploit-unleashed/psexec-pass-hash/


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_117_1.png)


    # CHAPTER 8 Passwords 103'
