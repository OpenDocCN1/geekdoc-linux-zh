  md: 'Would it be easy for doors open? (A simple kick near the doorknob is usually
    enough for standard doors.)


    What is the building or data center made of (steel, wood, concrete), and how sturdy
    are the walls and entryways? Determine how resilient the material is to earthquakes,
    tornadoes, strong winds, heavy rains, and vehicles driving into the building.
    Also determine whether these disasters would leave the building exposed, so that
    looters and others with malicious intent could gain access to the computer room
    or other critical areas.


    Are any doors or windows made of glass, and is this glass clear, shatterproof,
    or bulletproof?


    Do hinges on the outside make it easy for intruders to unlock them?


    Are doors, windows, and other entry points wired to an alarm system?


    Does the building have drop ceilings with tiles that can be pushed up?


    Does the building have slab-to-slab walls? (If not, someone could easily scale
    the walls, bypassing any door or window access controls.)


    # Countermeasures


    Many physical security countermeasures for building vulnerabilities require other
    maintenance, construction, or operations experts. If infrastructure isn''t your
    forte, you can hire outside experts during the design, assessment, and retrofitting
    stages to ensure you have adequate controls. Here are some of the best ways to
    solidify building security:


    +   Strong doors and locks.


    +   Motion detectors.


    +   Cameras to discourage criminal activity, to catch perpetrators in real time,
    or to provide evidence of what happened after the fact.


    +   Windowless walls around data centers.


    +   Signage that makes it clear what''s where and who''s allowed.


    +   A continuously monitored alarm system with network-based cameras at all access
    areas.


    +   Lighting (especially around entry and exit points).


    +   Entrances that allow only one person at a time to pass through a door.


    +   Fences (with barbed wire or razor wire if necessary).'
