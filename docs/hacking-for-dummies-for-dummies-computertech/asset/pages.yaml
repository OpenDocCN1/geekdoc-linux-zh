    # Chapter 15


    # Web Applications and Mobile Apps


    Websites and web applications are common targets for attack because they''re everywhere
    and may be open for anyone to poke and prod. Basic websites used for marketing,
    contact information, document downloads, and so on are especially easy for the
    bad guys to play around. Commonly used web platforms as WordPress and related
    content management systems are especially vulnerable to attack because of their
    presence and lack of testing and patching. For criminal hackers, especially attractive
    websites provide a front to complex applications and databases that store valuable
    information, such as credit card and Social Security numbers. These sites are
    where the money is, literally and figuratively.


    Why are websites and applications so vulnerable? The consensus is that they''re
    vulnerable because of poor software development and testing practices. Sound familiar?
    It should; this problem affects operating systems and practically all aspects
    of computer systems, including automobiles and related Internet of Things systems.
    This situation is the side effect of relying on compilers'
  merge: -1
  pgno: 291
- img_proc: true
  md: 'to perform error checking, questionable user demand for higher-quality software,
    and emphasizing time to market and usability over security.


    This chapter presents security tests to run on your websites, applications, and
    mobile apps. Given all the custom configuration possibilities and system complexities,
    I focus on the vulnerabilities I see most when I use automated scanners and manual
    analysis. I also outline countermeasures that minimize the chance that someone
    with ill intent can carry out attacks against what are likely your most critical
    business systems.


    I want to point out that this chapter skips the surface of all possible software
    security flaws and ways to test for them. Additional sources for building your
    web security testing skills include the Top 10 Web Application Risks and Top 10
    Mobile Risks, provided by the Open Web Application Security Project https://www.owasp.org/index.php/Main_Page.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_292_0.png)


    # Choosing Web Security Testing Tools


    Good web security testing tools can ensure that you get the most from your work.
    With many things in life, I find that what you get pay for when it comes to testing
    for web security holes. For this reason, I mostly use commercial tools to test
    websites and web applications for vulnerabilities.


    These are my favorite web testing tools:


    +   ** Vulnerability Scanner (https://www.acunetix.com) for all-in-one web security
    testing, including a port scanner and an HTTP stripper.

    ** BURP process (https://portswigger.net/burp/communitydownload) for HTTP proxy
    capture and analysis.

    ** Netsparker (https://www.netsparker.com) for all-in-one security testing that
    often uncovers vulnerabilities the others may miss.

    ** Web Developer (http://chrispderick.com/work/web-developer) for manual analysis
    and manipulation of web pages.


    There are various other web-centric tools for Firefox and Chrome worth checking
    out http://resources.infosecinstitute.com/use-firefox-browser-as-a-penetration-testing-tool-with-these-addons
    and http://resources.infosecinstitute.com/19-extensions-to-turn-google-chrome-into-penetration-tool.


    PART 5 Hacking Applications'
