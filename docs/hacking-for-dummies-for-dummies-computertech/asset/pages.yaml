- img_proc: true
  md: '# Applying countermeasures


    The best safeguard against a hacker using a password reset program against your
    systems is encrypted hard drives. You can use BitLocker in Windows, WinMagic SecureDoc
    (https://www.wimagic.com/products), or other preferred end-point security product
    for the platform you are running on.


    Power-on passwords set in the BIOS can be helpful as well, but they''re often
    bumps in the road. Any criminal has to do is reset the BIOS password or, better,
    remove the hard drive from your lost system and access it from another machine.
    You also need to ensure that people can''t gain unauthorized physical access to
    your computers. When a hacker has physical access and your drives aren''t encrypted,
    all bets are off. That said, full-disk encryption isn''t foolproof; see the nearby
    sidebar "The fallacy of full-disk encryption." The good news is that more recent
    computers with Unified Extensible Firmware Interface (UEFI) are more resilient
    to these types of attacks.


    # Cracking Phones and Tablets


    I don''t envy IT administrators and information security managers for many reasons,
    but especially when it comes to bringing your own device (BYOD) movement taking
    place in business today. With BYOD, you have to trust that your users are making
    decisions about security, and you have to figure out how to manage every device,
    platform, and app. This management task is arguably the greatest challenge that
    IT professionals have to face. Further complicating matters, criminal hackers,
    thieves, and other hooligans are doing their best to exploit this complexity,
    creating serious business risks. The reality is that few — individuals — have
    phones and tablets properly secured.


    Plenty of vendors claim that their mobile device management (MDM), enterprise
    mobility management (EMM), or unified endpoint management (UEM) solutions are
    able to wisely mobile devices. They''re right ... to an extent. These systems
    have controls that separate personal information from business information and
    ensure that the proper security controls are enabled at all times, which is a
    leap toward locking down the mobile enterprise.


    One of the best things you can do to protect phones and tablets from unauthorized
    use is implement this nifty security control that dates back to the beginning
    of computers: passwords. Yep, your phone and tablet users should employ good old-fashioned
    passwords (technically, passphrases) that are easy to remember but hard to guess.
    Passwords are the best controls you can have, yet there are plenty of mobile devices
    with no passwords or passwords that are easily cracked.'
