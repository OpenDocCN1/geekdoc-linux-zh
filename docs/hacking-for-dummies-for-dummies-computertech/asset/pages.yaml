    # # Encrypted traffic


    Wireless traffic can be captured directly out of the airways, making this communications
    medium susceptible to eavesdropping. Unless the traffic is encrypted, it is sent
    and received in clear text, just as on a standard wired network. The 802.11 encryption
    protocols, Wired Equivalent Privacy (WEP) — yep, it is still around and Wi-Fi
    Protected Access (WPA and WPA2) have their weaknesses that allows attackers to
    crack the encryption keys and decrypt the captured traffic. This vulnerability
    has helped Wi-Fi on the map, to speak.


    WEP, in a sense, always lived up to its name: It provides privacy equivalent to
    that of a wired network and somewhat. It wasn''t intended to be easily, WEP uses
    a fairly symmetric (shared-key) encryption algorithm called RC4. Hackers can observe
    encrypted wireless traffic and recover the WEP key because of a flaw in the way
    the RC4 Initialization vector (IV) is implemented in the protocol. This weakness
    occurs because the IV is only 24 bits, which causes it to repeat every 16.7 million
    packets — even sooner in many, based on the number of wireless clients entering
    and leaving the network.


    Most WEP implementations initialize wireless hardware with an IV of 0 and increment
    it by 1 for each packet sent, which can lead to the IVs restarting (starting over
    o) approximately every five hours. This behavior, Wi-Fi networks that have a lower
    amount of use can be more secure than large Wi-Fi environments that transmit a
    lot of wireless data because there''s not enough traffic being generated.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_181_0.png)


    Using WEPrack (`https://sourceforge.org/projects/weprack`) or Aircrack-ng (`https://aircrack-ng.org`),
    attackers need to collect only a few minutes'' or a few days'' worth of packets
    (depending on how much wireless traffic is on the network) to break the WEP key.
    Figure 10–5 shows airodump-ng (which is part of the Aircrack-ng suite) cracking
    WEP initialization vectors, and Figure 10 shows aircrack''s airodump at work cracking
    the WEP key of most.


