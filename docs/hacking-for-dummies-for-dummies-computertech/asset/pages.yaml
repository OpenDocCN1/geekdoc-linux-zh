  md: 'to generate thousands, if not millions, of emails. It pays to be prepared and
    to let those involved know that the risk exists. I cover web application security
    in Chapter 15.


    # Automated email security controls


    You can implement the following countermeasures as an additional layer of security
    for your email systems:


    +   **Tarpiting:** *Tarpiting* detects inbound messages destined for unknown users.
    If your server supports tarpiting, it can help prevent spam or DoS attacks against
    your server. If a predefined threshold is exceeded — say, more than 100 messages
    in one minute — the tarpiting function effectively shunts traffic from the sending
    IP address for a given period.


    +   **Email firewalls:** Email firewalls and content-filtering applications from
    vendors such as Symantec and Barracuda Networks can go a long way toward preventing
    various email attacks. These tools protect practically every aspect of an email
    system.


    +   **Perimeter protection:** Although not email-specific, many firewall and intrusion
    prevention systems can detect various email attacks and shut off the attacker
    in real time, which can come in handy during an attack.


    +   **CAPTCHA:** Using CAPTCHA with web-based email forms can help minimize the
    impact of automated attacks and lessen your chances of email flooding and DoS,
    even when you''re protecting seemingly benign vulnerability scans. These benefits
    really come in handy when you test your websites and applications, as I discuss
    in Chapter 15.


    # Banners


    When hacking an email server, a hacker''s first order of business is performing
    a basic banner grab to see whether he can discover what email server software
    is running. This test is one of the most critical tests to find out what the world
    knows about your SMTP, POP3, and IMAP servers.


    # Gathering information


    Figure 14-2 shows the banner displayed on an email server when a basic Telnet
    connection is made on port 25 (SMTP). To do this, a command prompt, simply `telnet
    ip or_hostname_of_your_server 25`. This command opens a Telnet session on TCP
    port 25.'
