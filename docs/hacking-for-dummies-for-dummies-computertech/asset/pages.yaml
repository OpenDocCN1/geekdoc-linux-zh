    # Cracking passwords the old-fashioned way


    A hacker can use low-tech methods to crack passwords. These methods include using
    social engineering techniques such as phishing, shoulder surfing, and guessing
    passwords from information that he knows about the user.


    # Social engineering


    The most popular low-tech method for gathering passwords is social engineering,
    which I cover in detail in Chapter 6. Social engineering takes advantage of the
    trusting nature of human beings to gain information that later can be used maliciously.
    A common social engineering technique is coming people into divulging their passwords.
    A well-crafted email using a phishing platform such as LUCY is all it takes to
    get people to provide their login credentials. It sounds ridiculous, but I see
    it all the time.


    # TECHNIQUES


    To obtain a password through social engineering, ask for it. You can simply call
    a user and tell him that he has important-looking emails stuck in the mail queue,
    and you need his password to log in and free them. Many hackers and rogue insiders
    use this technique to try to get information.


    Another way to get users to divulge their passwords is to send a phishing email
    requesting that information. I''ve found asking users to confirm their understanding
    of compliance with internal security policies by submitting their login credentials
    to a phishing website is all it takes. I cover phishing in Chapter 6.


    If you give them your passwords during your testing, make sure that passwords
    are changed. An easy way is to force password changes for all users through the
    Windows domain. You don''t want to be held accountable if something goes awry
    after the password has been disclosed.


    A common weakness that can facilitate social engineering when staff members''
    names, phone numbers, and email addresses are posted on your company website.
    Social media sites such as LinkedIn, Facebook, and Twitter can be used against
    a company because these sites can reveal employees'' names and contact information.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_113_0.png)'
