    # # Exploiting Missing Patches


    It''s one thing to poke and prod Windows to find vulnerabilities that may eventually
    lead to some good information or maybe even system access. It''s quite another
    thing to stumble across a vulnerability that could give an attacker complete system
    access within 10 minutes. It''s not an empty threat for someone to run arbitrary
    code on a system that may lead to a vulnerability exploitation. With such tools
    as Metasploit, all you need is one missing patch on system to gain access and
    demonstrate how the entire network can be compromised. A missing patch is a criminal
    hacker''s pot of gold.


    > Even with all written security policies and fancy patch management tools, on
    every network I come across, numerous Windows systems don''t have the patches
    applied. The reason may be false positives from vulnerability scanners or missing
    patches that are deemed acceptable risks. Even if you think that all your systems
    have the latest patches installed, be to sure. In security assessments, trust
    verify.


