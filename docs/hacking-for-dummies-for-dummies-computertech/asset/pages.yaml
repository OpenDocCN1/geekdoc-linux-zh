  md: '+   >> Block ICMP traffic inbound to your network unless you specifically

    need it. Even then, you should allow it to come in only to specific hosts.


    +   >> Disable all unneeded TCP/UDP small services, such as echo and charger.


    Establish a baseline of your network protocols and traffic patterns before a DoS

    attack occurs. That way, you know what to look for. For also, periodically scan
    for

    such potential DoS vulnerabilities as rogue Dos software installed on network

    hosts.


    If you get yourself in a real bind and end up direct Dos assault, you can

    reached to managed service vendors like Imperva Incapsula (https://www.

    incapsula.com/), CloudFlare (https://www.cloudflare.com/), and DosArrest

    (https://www.dosarrest.com/).


    Work with a minimum necessary mentality (not to be confused with having

    many craft beers) when configuring your network devices, such as firewalls and

    routers. Identify traffic that''s necessary for approved network usage. Allow
    the

    traffic that''s needed. Deny all other traffic.


    If most comes to worst, ask your Internet service provider whether it can block

    Dos attacks from its end.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_169_0.png)


    # # Detecting Common Router, Switch,

    and Firewall Weaknesses


    In addition to the technical exploits that I cover in this chapter, some high-level

    security vulnerabilities commonly found on network devices can create many

    problems.


    # ## Finding unsecured interfaces


    You want to ensure that HTTP and Telnet interfaces to your routers, switches,
    and

    firewall aren''t configured with a blank, default, or otherwise easy-to-guess
    pass-

    word. This sounds like a no-brainer, but it''s one of the most common

    weaknesses. When a malicious insider or other attacker gains access to your net-

    work devices, he owns the network. Then he can lock out administrative access,

    set up backdoor user accounts, reconfigure ports, and even bring down the entire

    network without your ever knowing.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'Once found a simple password that a systems integrator configured a Cisco ASA
    firewall and was able to log in to the firewall with full administrative rights.
    Just imagine what could happen in this situation if someone with malicious intent
    came across this password. Lesson learned: The little things get you. Know what
    your vendors are doing, and keep an eye on them!


    Another weakness is related to HTTP, FTP, and Telnet being enabled and used on
    many network devices. Care to guess why this situation is a problem? Well, anyone
    with some free tools and a few minutes of time can scan the network and capture
    credentials for these systems when they''re being sent in clear text. When that
    happens, anything goes.


    # Uncovering issues with SSL and TLS


    Secure Sockets Layer (SSL) and Transport Layer Security (TLS) were long touted
    as the solutions for securing network communications. Recently, however, SSL and
    TLS have come under fire from demonstrable exploits such as Heartbleed, Padding
    Oracle: On downgraded Legacy Encryption (POODLE), and Factoring Attack on RSA-EXPORT
    Keys (FREAK).


    General security vulnerabilities related to SSL and TLS are often uncovered by
    vulnerability scanners such as Nexpose and Netsparker. In addition to SSL/TLS
    vulnerabilities, be on the lookout for the following:


    +   - SSL versions 2.0 and 3 and TLS versions 1.0 or 1.1 in use

    - Weak encryption ciphers such as RC4 and SHA-1


    If you''re unsure about existing SSL and TLS vulnerabilities on your systems,
    don''t have to use a vulnerability scanner. Qualys has a nice website called SSL
    Labs (https://www.ssllabs.com/) that can scan these vulnerabilities for you.


    I didn''t used to be too concerned about SSL- and TLS-related vulnerabilities,
    but as researchers and criminal hackers have demonstrating, the threat is real
    and needs to be addressed.


    # Putting Up General Network Defenses


    Regardless of specific attacks against your system, a few good practices can prevent
    many network problems:


    156 PART 3 Hacking Network Hosts'
  merge: -1
  pgno: 170
- img_proc: true
  md: '+   Use stateful inspection rules that monitor traffic sessions for firewalls.

    This practice can help ensure that all traffic traversing the firewall is legitimate
    and can prevent DoS attacks and other spoofing attacks.


    +   Implement rules to perform packet filtering based on traffic type, TCP/UDP
    ports, IP addresses, and even specific interfaces on your routers before the traffic
    is allowed to enter your network.


    +   Use proxy filtering and Network Address Translation (NAT) or Port Address
    Translation (PAT).


    +   Find and eliminate fragmented packets entering your network (from Fraggle
    or another type of attack) via an IPS.


    +   Include your network devices in your vulnerability scans.


    +   Ensure that your network devices have the latest vendor firmware and patches
    applied.


    +   Set strong passwords (or, better, passphrases) on all network systems.

    I cover passwords in detail in Chapter 8.


    +   Don''t use Internet Key Exchange (IKE) aggressive mode for your virtual private
    network. If you must, ensure that the passphrase is strong and changed periodically
    (such as every 6 to 12 months).


    +   Always use TLS (via HTTPS and so on) or SSH when connecting to network devices.


    +   Disable SSL and weak ciphers, and use TLS version 1.2 and strong ciphers such
    as SHA-2 where possible.


    +   Segment the network, and use a firewall on the following:

    - The DMZ

    - The internal network

    - Critical subnets broken down by business function or department, such as accounting,
    finance, human resources, and research'
