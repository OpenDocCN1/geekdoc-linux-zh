- img_proc: true
  md: 'As negative as breaking into computer systems often can be, hackers and researchers
    play key roles in the advancement of technology. In a world without these people,
    odds are good that the latest intrusion prevention technology, data loss prevention
    (DLP), or vulnerability scanning and exploit tools would likely be different,
    if they existed at all. Such a world might not be bad, but technology keeps security
    professionals employed and the field moving forward. Unfortunately, the technical
    security solutions can''t ward off malicious attacks and unauthorized use, because
    hackers and (sometimes) malicious users are usually a few steps ahead of the technology
    designed to protect against their wayactions.


    However you view the stereotypical hacker or malicious one, one thing is clear:
    Somebody will always try to take down your computer systems and compromise information
    by poking and prodding where or she shouldn''t, through denial of service (DoS)
    attacks or by creating and launching malware. You must take the appropriate steps
    to protect your systems against this kind of intrusion.


    # Who Breaks into Computer Systems


    Computer hackers have been around for decades. Since the Internet became used
    in the 1990s, the mainstream public has started to hear more about hacking. Certain
    hackers, such as John Draper (also known as Captain Crunch) and Kevin Mitnick,
    are well known. Many unknown hackers are looking to make names for themselves,
    and they''re the ones you have to look out for.


    In a world of black and white, describing the typical hacker is easy. The historical
    stereotype of a hacker is an antisocial, pimply teenager boy. The world has many
    shades of gray, and many types of people do hacking. Hackers are unique people,
    so a profile is hard to outline. The best broad description of hackers is that
    all hackers aren''t equal. Each hacker has unique motives, methods, and skills.


    # Hacker skill levels


    Hacker skill levels fall into three general categories:


    +   >> Script kiddies: These are computer novices who take advantage of the exploit
    tools, vulnerability scanners, and documentation available free from the Internet
    but who don''t have any real knowledge of what''s going behind the scenes. They
    know just enough to cause you headaches but are very sloppy in their actions,
    leaving all sorts of digital fingerprints behind. Even though these guys are the
    stereotypical hackers that you hear about in news media, they need only minimal
    skills to carry out their attacks.'
