  md: 'You can get started with a tool such as NetStumbler (www.netstumbler.com/downloads).
    NetStumbler can discover SSIDs and other detailed information about wireless APs,
    including the following:


    +   * Name

    * Radio channel in use

    * Vendor name

    * Whether encryption is on or off

    * RF signal strength (signal-to-noise ratio)


    NetStumbler is old and no longer maintained, but it still works. Another tool
    option is inSSider (https://www.metageek.com/products/inssider).


    Figure 10-3 shows an example of what you might see when running NetStumbler in
    your environment. The information you see here is what others can see as long
    as they are in range of your AP''s radio signals. NetStumbler and most other tools
    work by sending a probe-request signal from the client. Any APs within range must
    respond to the request with their SSIDs — that is, if they are configured to broadcast
    their SSIDs upon request.


    FIGURE 10-3:

    NetStumbler displays detailed data on APs.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_178_0.png)


    When you''re using network analyzers, including Omnipeek and CommView for WiFi,
    your adapter may enter passive monitoring mode, and you can no longer communicate
    with other wireless hosts or APs while the program is loaded, which is a good
    thing.


