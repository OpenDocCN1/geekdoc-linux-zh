- img_proc: true
  md: '# COUNTERMEASURES


    The best defense against the installation of keystroke-logging software on your
    systems is to use an antimware program or a similar endpoint protection software
    that monitors the host. It''s not foolproof but can help. With physical keyloggers,
    you''ll need to inspect each system visually.


    The potential for hackers to install keystroke-logging software is another reason
    to ensure that your users aren''t downloading and installing ransomware or openings
    in unsolicited emails. Consider looking your desktops by setting the appropriate
    user rights through local or group security policy in Windows. Alternatively,
    you could use a commercial lockdown program, such as Fortries 101 (www.fortisrand.com)
    for Windows or Deep Freeze Enterprise (www.faronics.com/products/deep-freeze/enterprise)
    for Windows, Linux, and macOS X. A different technology that still falls into
    this is Carbon Black''s "positive security" whitelisting application, called CB
    Protection (https://www.carbonblack.com/products/cb-protection), which allows
    you to configure which executables can run on any given system. It''s intended
    to fight off malware but could certainly be used in this.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_127_0.png)


    # Weak password storage


    Many legacy and stand-alone applications — such as email, dial-network connections,
    and accounting software — store passwords locally, which makes them vulnerable
    to password hacking. By performing a basic text search, I''ve found passwords
    stored in clear text on the local hard drives of machines. You can automate the
    process even by using a program called FileLocator Pro (https://www.mythisoft.com).
    I cover file and related storage vulnerabilities in Chapter 16.


    # SEARCHING


    You can try using your favorite text-searching utility — such as the Windows search
    function, `findstr`, or `grep` — to search for `password` or `passwd` on your
    computer''s drives. You may be shocked to find what''s on your systems. Some programs
    write even passwords to disk or leave them stored in memory.


    Weak password storage is a criminal hacker''s dream. Head it off if you can. I
    don''t mean you should immediately run off and start using a cloud-based password
    manager, however. As we''ve all seen over the years, those systems get hacked
    as well!


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_127_1.png)


    CHAPTER 8 Passwords 113'
