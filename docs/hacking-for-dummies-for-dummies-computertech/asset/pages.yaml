  md: '# ATTACK-TREE ANALYSIS


    Attack-tree analysis is the process of creating a flow-chart-type mapping of how
    malicious attackers would attack a system. Attack trees are used in higher-level
    information risk analyses; they''re also used by security-savvy development teams
    for planning new software projects. If you want to take your security testing
    to the next level by thoroughly planning your attacks, working methodically, and
    becoming more professional, attack-tree analysis is the tool you need.


    The only drawback is that attack trees can take considerable time to draw and
    require a fair amount of expertise. Why sweat the process, though, when a computer
    can do the lot for you? A commercial tool called SecurTree, by Amenaza Technologies
    Ltd. (www.amenaza.com), specializes in attack-tree analysis. You could also use
    Microsoft Visio (https://products.office.com/en-us/visio/visio-online) or SmartDraw
    (www.smartdraw.com). The following figure shows a sample SecurTree attack analysis.


