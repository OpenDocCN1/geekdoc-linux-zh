  md: 'Many hackers get a kick out of outsmarting corporate and government IT security
    administrators. They thrive on making headlines and being notorious. Defeating
    an entity or possessing knowledge that few other people have makes them feel better
    about themselves, building their self-esteem. Many of these hackers feed off the
    instant gratification of exploiting a computer system. They become obsessed with
    this feeling. Some hackers can''t resist the adrenaline rush they get from breaking
    into someone''s systems. The more difficult the job is, the more the thrill for
    them.


    It''s a bit ironic, given their collective tendencies, but hackers often promote
    individualism — or at the decentralization of information — because many of believe
    that all information should be free. They think their attacks are different from
    attacks in the real world. Hackers ignore or misunderstand their victims and the
    consequences of hacking. They don''t think about the long-term effects of the
    choices they''re making today. Many hackers say that they don''t intend to harm
    or profit through their bad deeds, and this belief helps them justify their work.
    Others don''t want for tangible payoffs; proving a point is often a sufficient
    reward for them. The word *sociopath* comes to mind when many such people.


    The knowledge that malicious attackers gain and the self-esteem boost comes from
    successful hacking may become an addiction and a way of life. Some attackers want
    to make your life miserable, and simply want to be seen or heard. Some motives
    are revenge, bragging rights, curiosity, boredom, challenge, vandalism, theft
    for financial gain, sabotage, blackmail, extortion, corporate espionage, and just
    generally speaking out against "the man." Hacker regularly cite these motives
    to explain their behavior, but they tend to cite these motions more during difficult
    economic conditions.


    Malicious users inside your network may be looking to gain information to help
    them with personal financial problems, to give them a leg up on a competitor,
    to seek revenge on their employers, to satisfy their curiosity, or to relieve
    boredom.


    Many business owners and managers — even some network and security administrators
    — believe that they don''t have a hacker that can''t do much if they break. These
    beliefs are sorely mistaken. This dismissive way of thinking helps support the
    bad guys and promote their interests. Hackers can compromise a seemingly unimportant
    system to access the network and use it as a launching pad for attacks on other
    systems, and many people would be none the wiser because they don''t have the
    proper controls to prevent and detect malicious use.


    Hackers often hack simply because they can. Some hackers go for high-profile systems,
    but hacking into anyone''s systems helps them fit into hacker circles.


