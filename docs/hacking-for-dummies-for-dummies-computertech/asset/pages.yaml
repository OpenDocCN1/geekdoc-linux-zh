  md: '# Countermeasures against firewall rulebase vulnerabilities


    The following countermeasures can prevent a hacker from testing your firewall:


    +   - Perform a firewall rulebase audit. I''m always saying that you can''t secure
    what you don''t acknowledge, and there''s no better example than your firewall
    rulesbase. No matter how simplistic your rulebase is, it never hurts to verify
    your work with an automated tool.


    +   - Limit traffic to what''s needed. Set rules on your firewall (router, if
    needed) to pass only traffic that absolutely must pass. You might have rules in
    place that allow HTTP inbound traffic to an internal web server, SMTP traffic
    to an email server, and HTTP outbound traffic for external web access.


    Rules are the best defense against someone who''s poking at your firewall.


    +   - Block ICMP.


    This will help prevent an external attacker from poking and prodding your network
    to see which hosts are alive.


    +   - Enable state packet inspection on the firewall.


    This will block unsolicited network requests.


    # Analyzing network data


    A network analyzer allows you to look into a network and analyze data going across
    the wire for network optimization, security, and/or troubleshooting purposes.
    Like a microscope for a lab scientist, a network analyzer is must-have tool for
    any security professional.


    Network analyzers are often generically referred to as sniffers, though that term
    is actually the name and trademark of a specific product: Network Associates''
    sniffer analysis tool.


    A network analyzer is handy for sniffing packets on the network. A network analyzer
    is software that runs on a computer with a network card. By placing the network
    card in promiscuous mode, enables the card to see all the traffic on the network,
    even traffic that isn''t destined for the network analyzer''s host. The network
    analyzer performs the following functions:


    +   - Captures all traffic.


    +   - Interprets or decodes what it finds into human-readable format.


    +   - Displays the content in chronological order (or however you choose to see
    it).'
