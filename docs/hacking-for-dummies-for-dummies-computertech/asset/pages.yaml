    An outsider to the organization might perform certain social engineering techniques
    as physical intrusion tests. If you perform these tests against your own organization,
    acting as an outsider might be difficult if everyone knows you. This risk of recognition
    might not be a problem in larger organizations, but if you have a small, close–knit
    company, people may catch on.


    You can outsource social engineering testing to attend an outside firm or even
    a trusted colleague perform the tests for you. I cover the topic of outsourcing
    security and testing in Chapter 19.


    # Knowing Why Attackers Use Social Engineering


    People use social engineering to break into systems and attain information because
    it''s the simplest way for them to get what they''re looking for. They''d rather
    have someone open the door to the organization than physically break in and in
    risk being caught. Security technologies such as firewalls and access controls
    won''t stop a determined social engineer.


