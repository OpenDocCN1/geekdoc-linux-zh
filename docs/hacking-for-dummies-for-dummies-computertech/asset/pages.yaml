    of the average firewall or intrusion prevention systems (IPS), especially malicious
    users whose actions aren’t monitored yet who have full access to the very environment
    they can exploit.


    +   Most network and security administrators can’t keep up with the new vulnerabilities
    and attack methods. These people have too many tasks to stay on top of and too
    many filters to put out. Network and security administrators may fail to respond
    or security events because of poor time and goal management. I provide resources
    on time and goal management for IT and security professionals in the appendix.


    +   Information systems grow more every year. This fact is yet another reason
    why overwhelmed administrators find it difficult to know what’s happening across
    the wire and on the hard drives of all their systems. Virtualization, cloud services,
