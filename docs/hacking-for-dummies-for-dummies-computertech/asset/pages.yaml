    # Relay


    SMTP relay lets users send emails through external servers. Open email relays
    aren''t the problem they use to, but you still need to check for. Spammers and
    criminal hackers can use an email server to send spam or malware under the guise
    of the unsuspecting open-relay owner.


    Be sure to test open relay both outside and inside your network. If you test your
    internal systems, you may get false positives because email relaying may be configured
    and necessary for your internal clients to send messages to the outside world.
    If a client system is compromised, however, that situation could be just what
    the bad guys need to use your systems to launch an outbound spam or malware attack.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_277_0.png)


    # AUTOMATIC TESTING


    Here are a couple of ways to test your server for SMTP relay:


    +   >> Vulnerability scanners: Many vulnerability scanners, such as Nexpose and
    QualysGuard, can find open relay vulnerabilities.


    +   >> Windows-based tools: One example is NetScanTools Pro (www.netscools.com).
    You can run an SMTP Relay check on your email server with NetScanTools Pro, as
    shown in Figure 14-9.


    Some SMTP servers accept inbound relay connections and make relay appear to, this
    situation isn''t always the case, because the initial connection may be allowed,
    but the filtering actually takes place before the scenes. Check whether the email
    made it by checking the account to which you sent the relay message.


    In NetScanTools Pro, enter for the SMTP mail server name and Your Sending Domain
    Name. Inside Test Message Settings, the Recipient Email Address and Sender''s
    Email Address. If the test is successful, NetScanTools Pro opens a window that
    says Message Sent successfully.


