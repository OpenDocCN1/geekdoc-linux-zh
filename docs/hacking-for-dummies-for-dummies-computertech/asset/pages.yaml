- img_proc: true
  md: 'administrators ignore recommended hardening practices from such organizations
    as the National Institute of Standards and Technology Computer Security Center
    (http://csrc.nist.gov/publications/PubsSps.html) and the Center for Internet Security
    (www.ciscurity.org), leaving many security holes open. I believe, however, that
    hardening against malicious attack is not foolproof either. Because every system
    and every organization''s needs are different, there is no one-size-fits-all solution,
    so you have to strike a balance without relying on any option too much.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_341_0.png)


    REMEMBER


    After you apply patches, it''s a good idea to rescan your systems for vulnerabilities
    to confirm that the patches touch.


    This book presents hardening countermeasures that you can implement for your network,
    computers, and even physical systems and people. I find that these countermeasures
    work best.


    Implementing at least basic security practices is critical. Whether you''re installing
    a firewall on the network or requiring users to have strong passwords via a Windows
    Active Directory GPO, you must address the basics if you want any medium of security.
    Beyond patching, if you follow the countermeasures I document, add other well-known
    security practices for network systems (routers, servers, workstations, and so
    on) that are freely available on the internet, and perform ongoing security tests,
    you can rest assured you''re doing your best to keep your organization''s information
    secure.


    # PAYING THE PIPER


    I was once involved in an incident-response project that involved more than 10,000
    Windows servers and workstations infected with targeted malware. Advanced malware
    had a foothold. The business found the infection early and thought that the IT
    team had it under. Time passed, and the business realized a year or so later that
    it hadn''t not the entire mess. The malware came back with a vengeance, to the
    point that their entire network was essentially under surveillance by foreign,
    state-sponsored, criminal hackers.


    After dozens of people spent hours getting to the root of the problem, it was
    determined that the IT department didn''t do what it''ve done in terms of patching
    and hardening its systems. Also, a serious communication breakdown had occurred
    between IT and other departments, including security, the help desk, and business
    operations. This case of "too little, too late" got a large business into a large
    bind. The lesson is that improperly secured systems can create a tremendous burden
    for your business.


    CHAPTER 18 Plugging Your Security Holes 327'
