- img_proc: true
  md: 'Hackers can be classified by both their abilities and their underlying motivations.
    Some are skilled, and their motivations are benign; they''re merely seeking knowledge.
    Still, other hackers may have malicious intent and seek some form of personal,
    political, or economic gain. Unfortunately, the negative aspects of hacking-usually
    overshadow the positive aspects and promote the negative stereotypes.


    Historically, hackers hacked for the pursuit of knowledge and the thrill of the
    challenge. Script kiddies (hacker wannabes with limited skills) aside, traditional
    hackers are adventurous and innovative thinkers who are devising new ways to exploit
    computer vulnerabilities (For more on script kiddies, see the section "What Breaks
    into Computer Systems" in this chapter). Hackers who overlook are very ignorant
    and have good situational awareness. They wonder what happens if a cable was unplugged,
    a switch was flipped, or lines of code were changed in a program. They do these
    things and notice what happens. Old-school hackers are like Tim "The Tool Man"
    Taylor — Tim Allen''s character on the sitcom Home Improvement—thinking that they
    can improve electronic and mechanical devices by "rewiring them."


    When they were growing up, hackers'' rivals were monsters and villains on video
    games. Hackers who now see their electronic foes only that: electronic who perform
    malicious actions don''t really think about the fact that human beings are behind
    the firewalls, wireless networks, and web applications they''re attacking. They
    ignore the fact that their actions often affect those humans in negative ways,
    such as jeopardizing their job security and putting personal safety at risk. Government-backed
    hacking? Well, that''s a different story, so these hackers are making calculated
    decisions to do these things.


    On the flip side, odds are that you have a few employees, contractors, interns
    or consultants who intend to compromise sensitive information on your network
    for malicious purposes. These people don''t have in the way that people normally
    suppose. Instead, they root around in server shares; delve into databases they
    know shouldn''t be in; and sometimes steal, modify, and delete sensitive information
    to which they have access. This behavior can be very hard to detect, especially
    given the widespread belief among management that users can and be trusted to
    do the right things. This activity is perpetuated if these users passed their
    criminal background and credit checks before they were hired. Past behavior is
    often the best predictor of future behavior, but just because someone has a clean
    record and authorization to access sensitive systems doesn''t mean that he or
    she won''t do anything bad. Criminal behavior has to start somewhere!


