    # # Checking Share Permissions


    Windows shares are the available network drives that show up when users browse
    the network via the Network option in Windows. Windows shares are often configured,
    allowing more people to access them than they should. The casual browser can exploit
    this vulnerability, but a malicious insider who gains unauthorized access to a
    Windows system can create serious and compliance consequences, including leaking
    sensitive information and deleting files.


    CHAPTER 12 Windows 215'
