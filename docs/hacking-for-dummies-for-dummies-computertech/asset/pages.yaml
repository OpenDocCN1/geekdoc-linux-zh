  md: 'It pays to know your network environment. Knowing what your surroundings should
    look like makes it easier to spot potential problems.


    A good way to determine whether an AP you discover is attached to your wired network
    is to perform reverse ARPs (RARPs) to map IP addresses to MAC addresses. You can
    do this test at a command prompt using the arp -a command and comparing IP addresses
    with the corresponding MAC address to see whether you have a match.


    Keep in mind that Wi-Fi authenticates the wireless devices, not the users. Criminal
    hackers use this fact to their advantage by gaining access to a wire-client via
    remote-access software, such as Telnet or SSH, or by exploiting a known application
    or operating-system vulnerability. Then they potentially have full access to your
    network, and you would be the wiser.


    # # Countermeasures against rogue wireless devices


    The only way to detect rogue APs and hosts on your network is to monitor your
    wireless network proactively (in real time, if possible), looking for indicators
    that wireless clients or rogue APs may exist. A wireless intrusion prevention
    system is perfect for such monitoring. But if rogue APs or clients don''t show
    up, it doesn''t mean you''re off the hook. You may also need to break out the
    wireless network analyzer or other network management application.


    Use personal firewall software, such as Windows Firewall, on all wireless hosts
    to prevent unauthorized access to your hosts and, subsequently, your network.


    Finally, don''t forget about user education. Education isn''t foolproof, but it
    can serve as an additional layer or defense. Ensure that security is always at
    the top of everyone''s mind. Chapter 19 contains additional information about
    user awareness-ness and training.


    # # MAC spoofing


    A common defense for wireless networks is MAC address controls. These controls
    involve configuring your APs to allow only wireless clients with known MAC addresses
    to connect to the network. Consequently, a common hack against wireless-networks
    is MAC address spoofing.


    The bad guys can easily spoof MAC addresses in Linux using the ifconfig command
    and in Windows using the SMAC utility, as I describe in Chapter 9.'
