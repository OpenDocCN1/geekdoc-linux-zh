    # # HACKING THE INTERNET OF THINGS


    No chapter on mobile devices would be complete without some coverage of the Internet
    of Things (IoT). Computer systems that fall into this IoT include everything from
    home alarm systems to manufacturing equipment to coffeepots and pretty much anything
    in between, including automobiles.


    Cisco estimates that the IoT will grow to 50 billion devices by 2020! Perhaps
    this is why all IPv4 addresses are gone. I''m not sure that this is a good thing
    for most people, but it sounds secure for those of us working in this industry.
    If you''re going to knock down IoT systems, you must first understand how they''re
    vulnerable. Given that IoT systems aren''t unlike other network systems (they
    have IP addresses and/ a web interface), you''ll be able to use standard scanners
    to uncover flaws. Security questions that you should ask about IoT systems include
    the following:


    +   * Information is stored on the system (such as sensitive customer information,
    intellectual property, or biodata from devices such as Fitbit and Apple Watches?)
    If they are lost or stolen, will that create business risks?

    * Information is communicated to and from each system, and is it encrypted?

    * Are passwords required? What are the default password complexity standards,
    and can they be changed? Does intruder lockout exist to help password cracking?

    * What patches are missing that facilitate security exploits? Are software updates
    available?

    * How do the systems stand up under vulnerability scans and simulated denial-of-service
    attacks?

    * What additional security policies need to be put in place to address IoT systems?


    Like all other systems'
