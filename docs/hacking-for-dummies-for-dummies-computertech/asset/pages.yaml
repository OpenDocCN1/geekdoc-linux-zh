    # Using the Vulnerability and Penetration Testing Process


    With practically any IT or security project, you need to plan security testing.
    It has been said that action without planning is the root of every failure. Strategic
    and tactical issues in vulnerability and penetration testing need to be determined
    and agreed upon in advance. To ensure the success of your efforts, spend time
    planning for any amount of testing, from a simple OS password-cracking test a
    few servers to a penetration test of a complex environment.


    If you choose to a “reformed” hacker to work with your testing or to obtain an
    independent perspective, be careful. I cover the pros and cons of the do’s and
    don’s associated with hiring security resources in Chapter 19.


    # Formulating your plan


    Getting approval for security testing is essential. Make sure that what you require
    is known and visible — at least to the decision-makers. Sponsoring of the project
    is the first step. This is how your testing objectives are defined. Sponsorship
    could come from your manager, an executive, your client, or even yourself if you’re
    the boss. You need someone to back you and sign off on your plan. Otherwise, your
    testing may be called off unexpectedly if someone (including third parties like
    cloud service and hosting providers) claims that you were never authorized to
    perform the tests. Worse, you could be fired or charged with criminal activity.


    The authorization can be as simple as an internal memo or an email from your boss
    when you perform these tests on your own systems. If you’re testing for a client,
    have a signed contract stating the client’s support and authorization. Get written
    approval of this sponsorship as soon as possible to ensure that none of your time
    or effort is wasted. This documentation is your “Get Out of Jail Free” card if
    anyone — such as your Internet service provider (ISP), cloud provider, or a related
    vendor — questions what you’re doing or if the authorities call. Don’t laugh —
    it wouldn’t be the first time it has happened.'
