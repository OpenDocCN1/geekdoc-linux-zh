    # Why They Do It


    Hackers hack because they can. Period. Okay, the reason gets a little deeper.
    Hacking is a hobby for some hackers; they hack to see what they can and can''t
    break into, using testing only their own systems. These folks aren''t the ones
    I write about in this book. Instead, I focus on those hackers who are obsessive
    about gaining notoriety or defeating computer systems and those who have criminal
    intentions.


