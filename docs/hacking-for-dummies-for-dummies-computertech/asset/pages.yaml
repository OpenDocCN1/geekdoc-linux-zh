  md: 'and is highly dependent on your personality and overall knowledge of the organization.


    If social engineering isn''t natural for you, consider using the information in
    this chapter for educational purposes so that you can find out how to defend against
    it. Don''t hesitate to hire a third party to perform this testing if doing so
    makes the best business sense for now.


    Social engineering can harm people''s goals and reputations, and confidential
    information could be leaked, especially when phishing tests are performed. Plan
    things, and proceed with caution.


    You can perform social engineering attacks in millions of ways. From walking through
    the front door portant to someone you''re not to launching an all-out phishing
    campaign, the world is your oyster. For this reason, and because training specific
    behaviors in a single chapter is next to impossible, I don''t provide how-to instructions
