  md: '# Social media


    Social media sites are the new means for businesses to interact online. Perusing
    the following sites can provide untold details on any business and its people:


    +   - Facebook (https://www.facebook.com)

    - LinkedIn (https://www.linkedin.com)

    - Twitter (https://www.twitter.com)

    - YouTube (https://www.youtube.com)


    As we''ve witnessed, employees are often very forthcoming about what they do for
    work, details about their business, and what they think about their bosses — especially
    after throwing back a few when their social filters go off track! I have also
    found interesting insights about what people say about their former employers
    at Glassdoor (www.glassdoor.com/Reviews/index.htm).


    # Web search


    Performing a web search or simply browsing your organization''s website can turn
    up the following information:


    +   - Employee names and contact information

    - Important company dates

    - Incorporation filings

    - Securities and Exchange Commission (SEC) filings (for public companies)

    - Press releases about physical moves, organizational changes, and new products

    - Mergers and acquisitions

    - Patents and trademarks

    - Presentations, articles, webcasts, or webinars (which often reveal sensitive
    information — ironically labeled confidential)


    > Bing (https://www.bing.com) and Google (https://www.google.com) ferret out everything
    from word processing documents to graphics files on any publicly accessible computer.
    They''re free. Google is my favorite. Entire books have been written using Google,
    so expect any criminal hacker to be quite experienced in using this tool, including
    against you. (See Chapter 15 for more about Google hacking.)


