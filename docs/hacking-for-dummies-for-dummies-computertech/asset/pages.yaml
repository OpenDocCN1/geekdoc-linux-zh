  md: 'This chapter demonstrates how easily the bad guys can gather password information
    from your network and computer systems. I outline common password vulnerabilities
    and describe countermeasures that help prevent these vulnerabilities from being
    exploited on your systems. If you perform the tests and implement the countermeasures
    outlined in this chapter, you''ll be on your way to securing your systems'' passwords.


    # Understanding Password Vulnerabilities


    When you balance the cost of security and the value of the protected information,
    the combination of a user ID and a secret password is usually adequate. Passwords
    create a false sense of security, however, as the bad guys know, and they attempt
    to crack passwords as a step toward breaking into computer systems.


    One big problem with relying solely on passwords for security is that more than
    one person can know them. Sometimes, multiple people knowing a password is intentional;
    often, it''s not. The tough part is that there''s no way of knowing who, besides
    the password''s owner, knows.


    Knowing a password doesn''t make someone an authorized user.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_110_0.png)


    Here are the two general types of password vulnerabilities:


    +   - Organizational or user vulnerabilities: Include lack of password policies
    that are enforced within the organization and lack of security awareness on the
    part of users


    +   - Technical vulnerabilities: Include weak encryption methods and insecure
    storage of passwords on computer systems


    I explore these classifications in more detail in the following sections.


    Before computer networks and the internet, the user''s physical environment was
    an additional layer of password security that worked pretty well. Now that most
    computers have network connectivity, that protection is gone. Chapter 7 provides
    details on managing physical security in this age of networked computers and mobile
    devices.'
