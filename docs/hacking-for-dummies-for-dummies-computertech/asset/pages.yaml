    # Chapter 12

    Windows


    Microsoft Windows (with such versions as Windows 7; Windows Server 2012 and 2016;
    Windows 8.1; and the newest flavor, Windows 10) is the most widely used operating
    system (OS) in the world. It''s also the widely abused. This is because Microsoft
    doesn''t care as much about security as other OS vendors? The short answer is
    no. Mere security flaws are overlooked — especially in the Windows NT days — but
    Microsoft products are pervasive throughout your networks that Microsoft is the
    easiest vendor to pick on. Therefore, Microsoft products often end up in the bad
    guys''hairs. The positive about criminal hackers is that they''re driving the
    requirement for better security!


    Many of the security flaws in the headlines aren''t new; they''re variants of
    vulnerabilities that have been around for a long time. You''ve heard saying "The
    more things change, the more they stay the same." That saying applies to security,
    too. Most Windows attacks are preventable if the patches are applied properly.
    Thus, poor security management is often the real reason why Windows attacks are
    successful, yet Microsoft takes the blame and must carry the burden.


    In addition to the password attacks I cover in Chapter 8, many attacks against
    a Windows-based system are possible. Tons of information can be extracted from
    Windows by connecting to the system across a network and using tools to extract
    the information. Many of these tests don''t even require the attacker to be authenticated
    to the remote system. Someone with malicious intent needs to


