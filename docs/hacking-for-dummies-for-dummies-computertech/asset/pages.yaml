    them all during your testing. Don''t make any guarantees that you''ll find all
    the security vulnerabilities in a system. You''ll be starting something that you
    can''t finish.


    Stick to the following tenets:


    +   - Be realistic.

    - Use good tools.

    - Get to know your systems, and practice honing your techniques.

    - Improve over time.


    I cover these rules in various ways in chapters 5 through 16.


    # Assuming That You Can Eliminate

    All Vulnerabilities


    When it comes to networks, computers, and applications, ironclad security isn''t
    attainable. You can''t possibly prevent all security vulnerabilities, but you''ll
    do fine if you uncover the low-hanging fruit that creates most of the risk and
    accomplish these tasks:


    +   - Follow solid practices. The security essentials have been around for decades.

    - Patch and harden your systems.

    - Apply reasonable security countermeasures where you can, based on your budget
    and your business needs.


    Many chapters, such as the operating system (OS) chapters in Part 4, cover these
    areas.


    It''s also important to remember that you''ll have unplanned costs. You may find
    lots of security problems and need the budget to plug the holes. Perhaps you now


