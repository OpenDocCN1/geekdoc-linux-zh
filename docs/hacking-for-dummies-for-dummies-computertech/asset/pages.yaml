  md: '# Questionable usage, as such:


    +   - Many lost or oversize packets, indicating that hacking tools or malware
    are present.


    +   - High-bandwidth consumption that might point to a web or FTP server that
    doesn''t belong.


    # Reconnaissance probes and system profiling from port scanners and vulnerability
    assessment tools, such as a significant amount of inbound traffic from unknown
    hosts — especially over ports that are not used, such as FTP or Telnet.


    # Hacking in progress, as tons of inbound UDP or ICMP requests, SYN floods, or
    excessive broadcasts.


    # Nonstandard host names on your network. If your systems are named Computer1,
    Computer2 and so on, a computer named GEEKz4evUR should raise a red flag.


    # Hidden services (especially well, SMTP, FTP, DNS, and DHCP) that might be eating
    network bandwidth, serving illegal software, or accessing your network hosts.


    # Attacks on specific applications that show commands as /bin/rm, /bin/ls, echo,
    and .cmd exe as well as SQL queries and JavaScript injection, which I cover in
    Chapter 15.


    You may need to let your network analyzer for a while — several hours to several
    days, depending on what you''re looking for. Before starting, configure your network
    analyzer to capture and store the most relevant data:


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_157_0.png)


    # If your network analyzer permits you to do so, first-in-first-out buffer. This
    configuration overwrites the oldest data when the buffer fills, but it may be
    your only option if memory and hard drive space are limited on your network analysis
    computer.


    # If your network analyzer permits you to do so, record all the traffic into a
    capture file and save to the drive. This scenario is ideal, especially if you
    have a large hard drive (4TB or larger).


    You can easily fill several gigabytes'' worth of hard drive space in a short period.
    I highly recommend running your network analyzer in what Omnipeek calls monitor
    mode. This allows the analyzer to keep track of what''s happening, such as network
    use and protocols, but not to capture and store every single packet. If you analyzer
    supports monitor mode, this tool is beneficial and often all you need.


