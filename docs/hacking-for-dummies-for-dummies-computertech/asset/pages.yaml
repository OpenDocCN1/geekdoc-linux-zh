    # Chapter 10

    Wireless Networks


    Wireless local area networks (or Wi-Fi) — specifically, the ones based on the
    IEEE 802.11 standard — are deployed in many business and home network. Wi-Fi was
    the poster child for weak security and network attacks since the inception of
    802.11. The stigma of insecure Wi-Fi is starting to wane, but isn''t the time
    to lower your defenses.


    Wi-Fi offers a ton of business value, from convenience to reduced network deployment.
    Whether or not your organization allows wireless network access, you probably
    have it, so testing for Wi-Fi security vulnerabilities is critical.


    In this chapter, I cover some common wireless network security vulnerabilities
    that you should test for, and I discuss some cheap, easy countermeasures that
    you can implement to ensure that Wi-Fi isn''t more of a risk to your organization
    than


    # Understanding the Implications of Wireless Network Vulnerabilities


    Wi-Fi is susceptible to attack — sometimes even more than so wired networks (discussed
    in Chapter 9) if it''s not configured and deployed properly. Wireless networks
    can have long-standing vulnerabilities that can enable an attacker to


    CHAPTER 10 Wireless Networks 159'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'bring your network to its knees or allow your sensitive information to be extracted

    out of thin air. If your wireless network is compromised, you can experience the

    following problems:


    +   - Loss of network access, including email, web, and other services that can

    cause business down time.


    +   - Loss of sensitive information, including passwords, customer data, and

    intellectual property.


    +   - Regulatory consequences and legal liabilities associated with unauthorized

    users gaining access to your business systems.


    Most of these vulnerabilities are in the implementation of the 802.11 stan-

    dard. Wireless access points (routers) and wireless endpoint systems can have

    vulnerabilities as well.


    Various fixes for these vulnerabilities have come along in recent years, but many
    of

    the haven''t been applied properly or aren''t enabled by default. Also, your

    ememployees might install rogue equipment on your network without

    y knowledge. There''s the problem of "free" Wi-Fi everywhere

    your workforce forces. From coffee shops to conference centers to

    ,, Internet connections can be serious threats to your overall inform-

    mation security, and I must say, pretty ones to fight. Even when W-Fi is

    hardened and all the latest patches have been applied, you may still have security

    problems, such as denial of service (DoS), man-in-the-middle attacks, and

    encryption key weaknesses (as those on wired networks; see Chapter 9), that

    are likely to be around for a while.


    # Choosing Your Tools


    Several great security tools are available for both the Windows and Linux

    platforms. Earlier, Linux wireless tools were a bear to configure and run properly,

    possibly because I''m not smart. That problem has changed in recent years

    with programs such as Kismet (https://www.kismetwireless.net),

    (https://sourceforge.net/projects/wellenreiter), and Kali Linux (https://

    kali.org).


    If you want the power of the security tools that run on Linux, but you''re

    interested in installing and finding out about Linux or don''t have the time

    to download and set up many of its popular security tools, I highly recommend

    checking out Kali Linux. The bootable Debian-based security testing suite


