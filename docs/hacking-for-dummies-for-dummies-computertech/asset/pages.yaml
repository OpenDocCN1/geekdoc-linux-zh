  md: 'Hackers exploit many people''s false sense of security and go for almost any
    system they think they can compromise. Electronic information can be in more one
    place at the same time, so if hackers merely copy information from the systems
    they break into, it''s tough to prove that hackers possess information, and it''s
    impossible to get the information back.


    Similarly, hackers know that a simple defaced web page — however easily attacked
    — isn’t good for someone else''s. It takes a large-scale data breach or an email
    phishing attack that spawns the unauthorized wire transfer of a large sum of money
    to get the attention of business executives. But hacked sites can often persuade
    and other nonbelievers to address information threats and vulnerabilities.


    Many recent studies have revealed that most security flaws are basic in nature,
    which is exactly what I see in my security assessments. I call these basic *low-hanging
    fruit* of the network, just waiting to be exploited. Computer breaches continue
    to get easier to execute yet harder to prevent for several reasons:


    +   * Widespread use of networks and Internet connectivity.

    * Anonymity by computer systems on the Internet and often on internal networks
    (because proper and effective logging, monitoring, and alerting rarely take place).

    * Greater number of open wireless networks that help criminals cover their tracks.

    * Complexity of networks and codebases in the applications and databases being
    developed today.

    * Naive yet-savvy children who are eager to give up privacy (which they''ve never
    experienced) for free stuff.

    * Likelihood that attackers will be investigated or prosecuted if caught.


    A malicious hacker needs to find only one security hole, whereas IT and security
    professionals and business owners must find and resolve all of them!


    Although many attacks go unnoticed or unreported, criminals who are discovered
    may not be put or prosecuted. When they''re caught, hackers often rationalize
    their services as being altruistic and a benefit to society: They’re merely pointing
    out vulnerabilities before someone else does. Regardless, if hackers are caught
    and prosecuted, the “fame and glory” reward system that hackers thrive on is threatened.


