  md: '# Countermeasures against ping sweeping and port scanning


    Enable only the traffic you need to access internal hosts — preferably as far
    possible from the hosts you''re trying to protect — and denying everything else.
    This guideline goes for standard ports, such as TCP 80 for HTTP and ICMP for ping
    requests.


    Configure firewalls to look for potentially malicious behavior over time (such
    as the number of packets received in a certain period), and have rules to cut
    off attacks if a certain threshold is reached, such as 10 scanned ports in 100
    or consecutive ping (ICMP) requests.


    Most firewalls and IPSes can detect scanning and cut it off in real time.


    You can break applications on your network by restricting network traffic, make
    sure that you analyze what''s going on and understand how applications and protocols
    are working before you disable any type of network traffic.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_149_0.png)


    # Scanning SNMP


    Simple Network Management Protocol (SNMP) is built into virtually every network
    device. Network management programs (such as HP OpenView and Landesk) use SNMP
    for remote host management. Unfortunately, SNMP also presents security vulnerabilities.


    # Vulnerabilities


    The problem is that most hosts run SNMP enabled with the default read/write community
    strings of public/private. The majority of network devices that I come across
    have SNMP enabled and don''t need it.


    If SNMP is compromised, a hacker may be able to gather network information as
    ARP tables, usernames, and TCP connections to attack your systems further. If
    SNMP shows up in port scans, you can bet that a malicious attacker will try to
    compromise the system.


    Here are some utilities for SNMP enumeration:


    +   - The commercial tools NetScanTools Pro and Essential NetTools.

    - Free Windows GUI-based Getif.

    - Free Windows text-based SNMPUTIL (www.wtcs.org/snmp4tpc/FILES/Tools/SNMPUTIL/SNMPUTIL.zip).'
