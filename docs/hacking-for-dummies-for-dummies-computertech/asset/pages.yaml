  md: '# Countermeasures against directory traversals


    You can employ three main countermeasures against having files compromised via
    malicious directory traversals:


    +   Don''t store old, sensitive, or otherwise nonpublic files on your web server.

    The only files that should be in your /docs or DocumentRoot folder are those that
    are needed for the site to function. These files shouldn''t contain confidential
    information that you don''t want to see.


    +   Configure your robots.txt file.

    This will help prevent search engines, such as Google, from crawling the more
    sensitive areas of your site.


    +   Ensure that your server is configured to allow public access to only those
    directories that are needed for the site to function. Minimum privileges are,
    provide access to the files and directories needed for the web application to
    perform properly.


    Check your server''s documentation for instructions on controlling public access.
    Depending on your web-server version, these access controls are set in the httpd.conf
    file and the .htaccess files for Apache (see http://httpd.apache.org/docs/current/configuring.html)
    and Internet Security Managers for IIS. The latest versions of these web servers
    have good security by default, so make sure that you''re running the latest.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_297_0.png)


    +   Consider using a search engine honeypot. A honeypot draws malicious users
    so you can see how the bad guys are working against your site. Then you can use
    the knowledge you gain to keep them at bay. One example is the Google Hack Honeypot
    (http://gh.sourceforge.net).


    # Input-filtering attacks


    Websites and applications are notorious for taking practically any type of input,
    mistakenly assuming that it''s valid, and processing it. Not validating input
    is one of the greatest mistakes that developers can make.


    Several attacks insert malformed data — often, too much at one time — can run
    against a website or application, which can confuse the system and make it divulge
    much information to the attacker. Input attacks can also make it easy for the
    bad guys to get sensitive information from the web browsers of unsuspecting users.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Buffer overflows


    One of the most serious attacks is a buffer overflow that specifically targets
    input fields in web applications. A credit-reporting application, for example,
    might authenticate users before they''re allowed to submit data or pull reports.
    The login form uses the following code to guard user IDs with a maximum input
    of 12 characters, as denoted by the maxsize variable:


    ```

    &lt;form name="Webauthenticate" action="www.your_web_app.com/login.cgi" method="POST"&gt;

    &lt;input type="text" name="inputname maxsize="12"&gt;

    ```


    A typical login session allows a valid login name of 12 characters or fewer, the
    maxsize variable can be changed to something huge, such as 100 or 1,000. Then
    an attacker can enter bogus data in the login field. What happens next is anyone''s
    call. The application might hang, overwrite other data in memory, or crash the
    server.


    A simple way to manipulate a variable is to step through the page submission using
    a web proxy, as those built into the commercial web vulnerability scanners I in
    this chapter or the free proxy.


    Web proxies sit between your browser and the server you''re testing and allow
    you to manipulate information sent to the server. To begin, you must configure
    your web proxy to use the local address of 127.0.0.1 on port 8080. To access this
    in Mozilla Firefox, click Tools>Options, scroll to the bottom of the Options dialog
    box, and select Settings in the Network Proxy section. Next, select the Manual
    Proxy Configuration radio button. In Internet Explorer, click the gear icon and
    choose Options from the drop-down menu; in the resulting dialog box, click the
    LAN Settings in the Connections section, select the proxy for your LAN radio button,
    and enter the appropriate name/IP address and port number.


    All you have to do is change the length of the variable before your browser submits
    the page, and the page is submitted using whatever length you give. You can use
    Firefox Web Developer add-on to remove maximum field-length limits in web forms,
    as shown in Figure 15–2.


    # URL manipulation


    An input attack populates a URL and sends it back to the server, telling the web
    application to do various things, such as redirect to third-party sites or load
    sensitive files from the server. Local file inclusion is one vulnerability. This
    vulnerability occurs when the web application accepts


    PART 5 Hacking Applications'
