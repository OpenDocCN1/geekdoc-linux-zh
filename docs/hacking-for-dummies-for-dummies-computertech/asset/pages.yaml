    >> Looking at security in a new light


    # Chapter 18

    Plugging Your Security Holes


    After you complete your tests, you want to head down the road to greater security.
    But you found some security vulnerabilities — things that need to be addressed
    (I hope not too many ones, though!) Plugging these holes before someone exploits
    them is going to require a little elbow grease. You may need to come up with your
    game plan and decide which security vulnerabilities to address first. A few patches
    may be in order, possibly even system hardening. You may need to purchase some
    new security technologies and may want to reevaluate your network design and security
    infrastructure as well. I touch on some of these critical areas in this chapter.


    # Turning Your Reports into Action


    It may seem the security vulnerability to address first would be obvious, but
    the answer may not be clear. When reviewing the vulnerabilities that you find,
    consider the following variables:


    +   - How critical the vulnerable system is

    - What sensitive information or business processes are at stake


    CHAPTER 18 Plugging Your Security Holes 323'
  merge: -1
  pgno: 337
- img_proc: true
  md: '+   >> Whether the vulnerability can be fixed


    +   >> How easy the vulnerability is to fix


    +   >> Whether you can take the system offline to fix the problem


    +   >> What time, money, and effort would be involved in purchasing new hardware
    or software or reing business processes to plug the holes


    In Chapter 17, I cover the basic issues of determining how important and urgent
    a security problem is. You should also look at security from a time-management
    perspective and address the issues that are both important (high-impact) and urgent
    (high-likelihood). You probably don''t want to try to fix the vulnerabilities
    that are only high-impact or only high-likelihood. You may have high-impact vulnerabilities
    that will likely never be exploited. Likewise, you probably have some vulnerabilities
    with a high likelihood of exploited that wouldn''t make a big difference in your
    business or your job if they were exploited. Type of human analysis and perspective
    helps many people stand out from the scan-and-run assessments (often in the name
    of compliance regulation) and keeps you employed for some time to come!


    Focus on tasks with the highest payoff first — those that are high-impact and
    high-likelihood. These tasks are likely to be the minority of your vulnerabilities.
    After you plug the most critical security holes, you can go after the least important,
    less urgent tasks when time and money permit. After you plug critical holes as
    SQL injection in web applications and missing patches on important servers, you
    may want to reconfigure your backups with passwords (if not strong encryption)
    to keep trying eyes away in case your backups fall into the wrong hands.


    # Patching for Perfection


    Do you ever feel that you do patch your systems to fix security vulnerabilities?
    If your answer is yes, good for you; at least you''re doing the work! If you feel
    sure to patch your systems the right way but cant see time to find, the work is
    on your radar. Many IT professionals and their managers don''t think about patching
    your systems until a breach occurs. (Look at the research in the Verizon Breach
    Investigations Report (https://www.verizonenterprise.com/verizon-insights-lab/dbir/,
    for example.) Patch management is a huge security failure for organizations in
    all industries. If you''re reading this book, you''re obviously concerned about
    security and are (I hope) past inadequate patch management.


    PART 6 Security Testing Aftermath'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'Whatever you do, whatever tool you choose, and whatever procedures work best
    in your environment, keep your systems patched! This rule goes for operating systems;
    web servers; databases; mobile applications; and even firmware on your network
    firewalls, routers, and switches. Especially important are third-party software
    patches from vendors such as Oracle (Java) and Adobe (Reader, Flash, and so on).
    These patches are overlooked more than most, they create- risks that go unaddressed.


    Patching is avoidable but inevitable. The only way to eliminate the need for patches
    is to develop secure software in the first place, but that''s not going to happen
    any soon, if ever. Software is too complex to be perfect. A large portion of security
    incidents can be prevented by some good patching practices, so you simply have
    no reason to have a solid patch-management process in place.


    # Patch management


    If you can''t keep up with the deluge of security patches for all your systems,
    don''t despair; you can still get a handle on the problem. Here are my basics
    for applying patches to keep your systems secure:


    +   Make sure all the people and departments involved in applying patches on your
    organization''s systems are on the same page and follow the same procedures.


    +   Have documented procedures in place for these critical processes:

    - Obtaining alerts from your vendors, including third-party patches

    - Assessing which patches affect your systems

    - Determining when to apply patches


    +   Make a policy and have procedures in place for testing patches before you
    apply them to your production servers. Testing patches after you apply them is
    not as big deal on workstations, but servers are a different story. Many patches
    have undocumented features and subsequent unintended side effects, which I''ve
    experienced. An untested patch is an invitation to system termination.


    # Patch automation


    The following sections describe the various patch deployment tools you can use
    to lessen the burden of keeping up with patches.'
  merge: -1
