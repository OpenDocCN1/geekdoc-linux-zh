  md: 'find on your network is a vulnerable Windows computer with a default configuration
    that''s not protected by such measures as a personal firewall and the latest security
    patches.


    When you start poking around your network, you may be surprised by how many of
    your Windows-based computers have security vulnerabilities. You''ll be even more
    surprised by how easy it is to exploit vulnerabilities to gain complete remote
    control of Windows by using a tool such Metasploit. After you connect to a Windows
    system and have a valid username and password (by knowing it or deriving it by
