- img_proc: true
  md: '# Hacks using the hosts.equiv and .hosts files


    If hackers can capture a user ID and password by using a network analyzer or can
    crash an application and gain access via a buffer overflow, one thing they look
    for is what users are trusted by the local system. For that reason, it''s critical
    to assess these files yourself. The /etc/hosts.equiv and .hosts files list this
    information.


    # hosts.equiv


    The /etc/hosts.equiv file won''t give away root information, but it does specify
    which accounts on the system can access services on the local host. If tribe were
    listed in this file, for example, all users on the system would be allowed access.
    With the .hosts file, external hackers can read this file and spoof their IP address
    and host name to gain unauthorized access to the local system. Attackers can also
    use the names located in the .hosts and hosts.equiv files to look for the names
    of other computers to exploit.


    # .hosts


    The highly $home/.hosts files in Linux which removes remote users can access the
    Berkeley Software Distribution (BSD) r-commands (such as rsh, rcp, and login)
    on the local system without a password. This file is in a specific user''s (including
    root''s) home directory, such as /home/jsmith. A .hosts file may look like this:


    ```

    tribe scott

    tribe eddie

    +tribe geoff

    ```


    This file allows users Scott and Eddie on the remote-system to log into the local
    host with the same privileges as the local user. If a plus sign (+) is entered
    in the remote-host and user fields, any user from any host could log in the local
    system. The hacker can add entries into this file by using either of these tricks:


    +   - Manipulating the file manually.

    - Running a script that exploits an unsecured Common Gateway Interface (CGI) script
    on a web-server application that''s running on the system.


    This configuration file is a prime target for a malicious attack. On most Linux
    systems I''ve tested, these files aren''t enabled by default. But a user can create
    one'
