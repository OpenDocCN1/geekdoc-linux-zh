  md: '# Social Engineering Countermeasures


    You have only a few lines of defense against social engineering. Social engineering
    puts your layered defenses to the true test. With strong security controls, a
    naive or untrained user can let a social engineer into the network. Never underestimate
    the power of social engineers — and the gullibility of users in helping them get
    their way.


    Specific policies help ward off social engineering in the long term in the following
    areas:


    +   * Classifying information so that users don''t have access to certain levels
    of information they don''t need

    * Setting up user IDs when hiring employees or contractors

    * Establishing acceptable computer use that employees agree to in writing

    * Removing user IDs for employees, contractors, and consultants who no longer
    work for the organization

    * Setting and resetting strong passphrases

    * Responding quickly to security incidents, such as suspicious behavior and known
    malware infections

    * Properly handling proprietary and confidential information

    * Escorting guests around your building(s)


    These policies must be enforceable and enforced for everyone within the organization.
    Keep them up to date, tell users about them, and (most important) test them.


    # User awareness and training


    One of the best lines of defense against social engineering is training employees
    to identify and respond to social engineering attacks. User awareness begins with
    initial training for everyone and follows with security awareness initiatives
    to keep social defenses fresh in everyone''s mind. Align training and awareness
    with specific security policies. You may also want to have a dedicated security
    training and awareness policy.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'Consider outsourcing security training to a seasoned security trainer. Employees
    often take training more seriously if it comes from an outsider, just as a family
    member or spouse may ignore what you have to say but takes the same words to heart
    if someone else says. Outsourcing security training is worth the investment for
    reason alone.


    While you approach ongoing training and awareness in your organization, the following
    tips can help combat social engineering in the long term:


    +   - Treat security awareness and training as a business investment.

    - Train users on an ongoing basis to keep security fresh in their minds.

    - Include information privacy and security tasks and responsibilities in every-one''s
    job descriptions.

    - Tailor your content to your audience whenever possible.

    - Create a social engineering awareness program for your business functions and
    user roles.

    - Keep your messages as nontechnical as possible.

    - Develop incentive programs for preventing and reporting incidents.

    - Lead by example.


    Share the following tips with your users to help prevent social engineering attacks:


    +   - Never divulge any information unless you validate that the people requesting
    the information need it and are who they say. If a request is made over the phone,
    verify the caller''s identity, and call back.

    - Never click an email link that supposedly loads a page with that needs updating.
    This caution is especially true for unsolicited emails, which can be especially
    tricky on mobile devices because users don''t have the benefit of seeing where
    the link would them.

    - Encourage your users to use shortened URLs from bitly, ow.ly, etc., if they''re
    unsure of their safety or legitimacy. Websites such as www.checkurl.com and http://wheredoesthislink.com
    offer this service.

    - Be careful when sharing personal information on social networking sites, such
    as Facebook or LinkedIn. Also, be on the lookout for people claiming to know you
    or wanting to be your friend. Their intentions might be malicious.'
