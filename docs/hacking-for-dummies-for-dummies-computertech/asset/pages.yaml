  md: '+   Escort all guests within the building. This may not match your company''s
    culture or be realistic, but it can certainly help minimize social engineering
    risks.


    +   Never open email attachments or other files from strangers, and be very careful
    if they come from people you know. This measure alone could prevent untold security
    incidents and breaches.


    +   Never give out passwords or other sensitive information. Even your own colleagues
    don''t need to know unless there''s an otherwise compelling business reason behind
    it.


    A few other general suggestions can ward off social engineering attacks:


    +   Never let a stranger connect to one of your network jacks or wireless networks,
    even for a few seconds. Someone with ill intent can place a network analyzer or
    install malware, or set up a backdoor that can be accessed remotely when they
    leave.


    +   Classify your assets, both hard-copy and electronic. Train all employees to
    handle each asset type.


    +   Develop and enforce media-destruction policies. These policies (for computer
    media and documents) help ensure data is handled carefully and stays where it
    should be. A good source of information on destruction policies is www.pdaconsulting.com/datadp.htm.


    +   Use cross-cut shredders. Better still, hire a document-shredding company that
    specializes in confidential document destruction.


    The following techniques reinforce the content of formal training:


    +   New employee orientation, training lunches, emails, and newsletters.


    +   Social engineering survival brochure with tips and FAQs.


    +   Trinkets and doodads as screen savers, mouse pads, sticky notes, pens, and
    office posters bearing messages that reinforce security principles.


    The appendix lists my favorite training trinkets and tool vendors to improve security
    awareness and education in your organization.


