    # Google


    You can use Google for directory traversal. In fact, Google''s advanced queries
    are so powerful that you can use them to root out sensitive information, critical
    web server files and directories, credit card numbers, we — anything that Google
    has discovered on your site without having to mirror your site and sift through
    everything. The data is already sitting in Google''s cache, waiting to be viewed.


    CHAPTER 15 Web Applications and Mobile Apps 281'
