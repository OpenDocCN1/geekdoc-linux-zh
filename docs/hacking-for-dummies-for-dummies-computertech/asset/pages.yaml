  md: '# Creating Testing Standards


    One miscommunication or slip-up can send systems crashing during your security
    testing. No one wants that to happen. To prevent mishaps, develop and document
    testing standards. These standards should include:


    +   - When the tests are performed, along with the overall timeline.

    - Which tests are performed.

    - How much knowledge of the systems you acquire in advance.

    - How the tests are performed and from which IP address expectations (if performed
    via an external source via the Internet).

    - What to do when a major vulnerability is discovered.


    This list is general best practices; you can apply more standards for your situation.
    Following sections describe these best practices in more detail.


    # Timing your tests


    They say that “it''s all in the timing,” especially when performing security tests.
    Make sure that the tests you perform minimize disruption to business processes,
    information systems, and people. You want to avoid harmful situations as miscommunicating
    the timing of tests and causing a denial of service (DoS) against a high-traffic
    e-commerce site in the middle of the day or performing password-cracking tests
    in the middle of the night. It’s amazing how a 12-hour time difference (2 p.m.
    during major production versus 2 a.m. during a slower period) can make testing
    your systems fail! Having people in different time zones can create issues. Everyone,
    Having team members’ agreement puts everyone on the same page and corrects expectations.


    > If possible and practical, notify your internet service providers, cloud service
    providers, and hosting co-location providers. Many companies require such notification
    in advance before they approve your testing. These companies have firewalls or
    intrusion prevention systems (IPS) in place to detect malicious behavior. If your
    provider knows you''re conducting tests, it may be less likely that they block
    your traffic, and you''ll get better results.


