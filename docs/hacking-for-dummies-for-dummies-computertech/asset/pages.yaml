- img_proc: true
  md: 'commonly referenced SSAE18 Service Organizational Controls (SOC) 2 standard
    for data center security audits. The only way to definitively know where things
    stand is to use the methods and tools I cover in this book.


    # # The Law of Averages Works Against Businesses


    Information systems are becoming more complex by the day. Literally. With the
    cloud, virtualization, and mobile being front and center in most enterprises,
    keeping up is getting more difficult for IT and security managers. It''s a matter
    of time before these complexities work against you and in the bad guys'' favour.
    A malicious hacker needs to find only one critical flaw to be successful. Or (and
    fix) all the flaws, or at least one that creates the greatest vulnerabilities.


    If you''re going to stay informed and ensure that your critical business systems
    (and the sensitive information they process and store) stay secure, you have to
    look at things with a malicious mindset and do so periodically and consistently
    over time, not just once, but every now and then.


    # # Security Assessments Improve Understanding of Business Threats


    You can say that passwords are weak or patches are missing, exploiting such flaws
    and showing the outcome are different matters. There''s no better way to prove
    the existence of a problem and motivate management to do something about it than
    show the outcomes of the testing methods that I outline in this book.


    # # If a Breach Occurs, You Have Something to Fall Back On


    In the event that a malicious insider or external attacker breaches your security,
    your business is sued, or your business falls out of compliance with laws or regulations,
    the management team can at least demonstrate that it was performing its due diligence
    to uncover security risks through proper testing. You just have to make sure that
    proper testing is actually taking place!


