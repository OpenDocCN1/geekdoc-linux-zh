  md: '# WHAT YOU NEED TO KNOW ABOUT ADVANCED MALWARE


    Advanced malware (also known as advanced persistent threat (APT)) has been all
    the rage lately, especially as it relates to ransomware. Such targeted attacks
    are highly sophisticated and extremely difficult to detect — unless you have the
    proper controls and the network andor hosts. One worked on a project in a large
    enterprise was targeted by a nation-state (presumably because of the work of the
    enterprise) and ended up having 10,000 Windows servers and workstations infected
    by malware. The enterprise’s traditional, bigbox antivirus software was nowhere.
    The project turned out to be an extensive incident response and forensics. The
    infection was traced back to a phishing attack that subsequently spread to all
    the systems while using password-cracking tools that enabled to crack the local
    SAM (security accounts manager) file on each Windows machine.


    This malware infection is one of countless examples of advanced malware that organizations
    are not prepared to prevent. The obvious solution to prevent such attacks is to
    keep users from clicking links and preventing malware from being dropped onto
    the system. These attacks are tough, if not impossible, to prevent. The next-best
    thing is to use technology to your advantage. Great ways to fight this threat
    using advanced malware monitoring and threat protection tools such as Windows
    Defender, Cylance (https://www.cylance.com), next-generation firewalls such as
    those by Palo Alto Networks (https://www.palaltonetworks.com/), and whitelisting
    (positive security) technologies such as CB Protection (https://www.carbonblack.com/products/cb-protection/)
    that help protect the host. Still, don''t run traditional antivirus products as
    as Malware and Webroot, which are now offering controls that fight this threat.


    The bottom line: Don''t underestimate the risk and power of targeted malware attacks.


    # Testing denial of service attacks


    Denial of service (DoS) attacks are among the most common hacker attacks. A hacker
    initiates so many invalid requests to a network host that the host uses all its
    resources to respond to the invalid requests and ignores the legitimate requests.


    # DoS attacks


    DoS attacks against your network and hosts can cause systems to crash, data to
    be lost, and every user to jump on your case wondering when Internet access will
    be restored.'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'Here are some common Dos attacks that target an individual computer or network
    device:


    +   - **SYN floods:** The attacker floods a host with TCP SYN packets.


    +   - **Ping of Death:** The attacker sends IP packets that exceed the maximum
    length of 65,535 bytes, which can crash the TCP/IP stack on many operating systems.


    +   - **WinLuke:** This attack can disable networking on older Windows 95 and
    Windows NT computers.


    Distributed denial of service (DDoS) attacks have an exponentially greater effect
    on their victims. One of the most famous attacks of this type was the DDoS attack
    against eBay, Yahoo!, CNN, and dozens of other websites by a hacker known as MafiaBoy.
    There have also been highly publicized DDoS attack Twitter by one user from Georgia
    (the former Soviet country, not the state where I live), but it affected everyone
    who used these sites. I couldn''t tweet, and many of my friends and family members
    couldn''t see what everyone was blabbing on Facebook (oh, the humanity!). Numerous
    highly publicized DDoS attacks have occurred since then. Think about this: when
    hundreds of people can be taken offline by one targeted DDoS attack, you can see
    why understanding the dangers of Dos attacks against your business''s systems
    and applications is important.


    # Testing


    Dos testing is one of the most difficult security checks you can run. There aren''t
    enough of you and your computers to go around. Don''t fret. You can run a few
    tests to see where you''re weak. Your first test should be for Dos vulnerabilities
    from a vulnerability-scanning perspective. By using scanners such as Nexpose (https://www.rapid.com/products/nexpose)
    and AppSpider (https://www.rapid.com/products/appspider), you can find patches
    and configuration weaknesses that lead to Dos. A Cisco-related tool called Synful
    Knock Scanner (http://talosintel.com/scanner) can test systems for any SYNful
    Knock malware that was discovered in 2015.


    Whichever one you use, good scanners and exploitation tools will save you a tone
    of time and effort that you can spend on other, more important things, such as
    Facebook and Twitter.


    Don''t test for Dos unless you have test systems or can perform tests with the
    proper tools. Poorly planned Dos is a job in making. Running an improper Dos test
    is like trying to delete data from a network share and hoping that the access
    controls in place are going to prevent it.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_167_0.png)'
  merge: -1
