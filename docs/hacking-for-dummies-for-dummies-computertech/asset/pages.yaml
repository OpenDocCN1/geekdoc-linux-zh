- img_proc: true
  md: '# COUNTERMEASURES


    User awareness and consistent security training are great defenses against social
    engineering. Security tools are a good fail-safe if they monitor for such these
    emails and web browsing at the host level, on the network perimeter, or in the
    cloud. Train users to spot attacks (such as suspicious phone calls or deceitful
    phishing emails) and to respond effectively. The best response is to refuse to
    give out any information and alert the appropriate information security manager
    in the organization. Also, take that staff off your website or at least remove
    IT staff members'' information.


    # Shoulder surfing


    *Shoulder surfing* (the act of looking over someone''s shoulder to see what they
    is typing) is an effective, low-tech password hack.


    # TECHNIQUES


    To mount this, the bad guys must be near their victims (or with binoculars or
    similar sitting tool) and not obvious. They simply collect the password by watching
    the user''s keyboard or screen when he logs in. An attacker with a good eye might
    even watch whether the user is glancing around his desk for a reminder of the
    password or the password itself. Security cameras or a webcam can be used for
    such attacks. Coffee shops and airplanes provide ideal conditions for shoulder
    surfing.


    You can try shoulder-surfing yourself. Walk around the office, and perform random
    spot checks. Go to users'' desks, and ask them to log in their computers, the
    network, or even their email applications. Don''t tell them what you''re doing
    beforehand, because they may attempt to hide what they''re typing or where they''re
    looking for their password — two things that they''ve been doing all long! Just
    be careful this test, and respect other people''s privacy.


    # COUNTERMEASURES


    Encourage users to be aware of their surroundings, and tell them not to enter
    their passwords when they suspect someone is looking over their shoulders. Instruct
    users that if they suspect someone is looking over their shoulders while they''re
    logging in, they should politely ask the person to look away or, when necessary,
    use an appropriate epithet to show that they''re offended. It may be easiest to
    lean out the shoulder surfer''s line of sight to keep him from seeing any typing
    and/or the screen itself. 3M Privacy Filters (https://www.3m.com/3M/en_US/privacy-screen-protectors-us)
    work well, but surprisingly, rarely them being used.


    100 PART 2 Putting Security Testing in Motion'
