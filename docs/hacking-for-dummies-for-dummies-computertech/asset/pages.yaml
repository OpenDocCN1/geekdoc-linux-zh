    +   4. Click the Refresh button in the SMAC interface.


    You should see your original MAC address again.


    # Countermeasures against ARP poisoning and MAC address Spoofing attacks


    A few countermeasures on your network can minimize the effects of the attack against
    ARP and MAC addresses:


    +   **Prevention:** You can prevent MAC address spoofing if your switches can
    enable port security to prevent automatic changes in the MAC address tables.


    No realistic countermeasures for ARP poisoning exist exist. The only way to prevent
    ARP poisoning is to create and maintain static ARP entries in your switches every
    host on the network—something that hardly any administrator has time to do in
    today—s rat race.


    +   **Detection:** You can detect these two types of hacks through an IPS or a
    stand-alone MAC address-monitoring utility.'
