  md: '# Don’t Be a FUDdy-Duddy


    Sherlock Holmes said, "It is a capital mistake to theorize before one has data."
    To make a good case for information security and the need for proper testing,
    support your case with relevant data. But don''t blow stuff out of proportion
    for the sake of stirring up fear, uncertainty, and doubt (FUD). Business leaders
    can see right through that tactic. Focus on educating management with practical
    advice. Discussing rational fears that are proportional to the threat is fine.
    Don''t take the Chicken Little route, claiming that the sky is falling all the
    time. That''s tiring to those outside IT and security, and will only hurt you
    over the long haul.


    # Demonstrate That the Organization Can’t Afford to Be Hacked


    Show how dependent the organization is on its information systems. Create what-if
    scenarios (forms of business-impact assessments) to show what can happen; how
    the organization’s reputation can be damaged; and how long the organization can
    go without using its network, computers, and data. Ask business leaders what they’d
    do without their computer systems and IT personnel and what they’d if their sensitive
    business or client information was compromised. Show real-world evidence of breaches,
    including malware, physical security, and social engineering issues.


    At the same time, be positive. Don''t approach management negatively with FUD,
    but keep them informed on serious security happenings. Odds are they''re already
    reading about these things in major business magazines and newspapers. Figure
    out what you can do to apply those stories to your situation. To help management
    relate, find stories regarding similar businesses, competitors, or industries.


    # RESEARCH RESOURCES


    A good resource is the Privacy Rights Clearinghouse Chronology of Data Breaches
    (https://www.privacyrights.org/data-breaches). Another is the annual Verizon Data
    Breach Investigations Report (https://www.verizonenterprise.com/verizon-insights-lab/dbir/).


    Google and Bing are also great tools for finding everything you need to know about
    information security breaches.'
