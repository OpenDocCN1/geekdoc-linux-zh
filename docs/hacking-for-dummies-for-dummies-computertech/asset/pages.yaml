- img_proc: true
  md: '# File permission hacks


    By default, rogue programs that run with root privileges can be easily hidden.
    An external attacker or malicious insider might do this to hide files, such as
    rootkits, on the system. This can be done with SetUID and SetGID coding in hacking
    programs.


    # Countermeasures against file permission attacks


    You can test for rogue programs by using both manual and automated testing methods.


    # Manual testing


    The following commands can identify and print to the screen SetUID and SetGID
    programs:


    +   Programs that are configured for SetUID:


    ```

    find /perm -4000 -print

    ```


    +   Programs that are configured for SetGID:


    ```

    find /perm -2000 -print

    ```


    +   Files that are readable by anyone in the world:


    ```

    find /perm -2 -type f -print

    ```


    +   Hidden files:


    ```

    find /name ".**

    ```


    You have hundreds of files in each of these categories, so don''t be alarmed.
    When you discover files with these attributes set, you need to make sure that
    they''re supposed to have those attributes by researching in your documentation
    or on the Internet or by comparing them with a known-secure system data backup.


    Keep an eye on your systems to detect any new SetUID or SetGID files that suddenly
    appear.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_257_0.png)


    CHAPTER 13 Linux and macOS 243'
  merge: -1
