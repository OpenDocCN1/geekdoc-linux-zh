    This chapter shows you how to test for some of the low-hanging fruit in Windows
    (the flaws that get people into trouble most often) and outlines countermeasures
    to secure your Windows systems.


    # Introducing Windows Vulnerabilities


    When Windows and other Microsoft software is attacked, especially by a wide-Internet-based
    worm or virus, hundreds of thousands of organizations and millions of computers
    are affected. Many well-known attacks can lead to the following problems:


    +   - Leaks of sensitive information, including files containing health-care information
    and credit-card numbers.

    - Passwords being cracked and used to carry out other attacks.

    - Systems taken down by denial of service (DoS) attacks.

    - Entire databases being copied or deleted.'
