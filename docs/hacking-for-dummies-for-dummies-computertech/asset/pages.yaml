  md: '# Discovering Wireless Network Attacks and Taking Countermeasures


    Various malicious hacks — including Dos attacks — can be carried out against your
    wireless network, forcing APs to reveal their SSIDs during the process of disassociated
    from the network and rejoining, hackers can jam the signal of an AP — especially
    in 802.11b and 802.11g systems — and force the wireless clients to reassociate
    with a rogue AP masquerading as the victim.


    Hackers can create man-in-the-middle attacks using a tool such as the WiFi Pineapple
    (https://www.wifineapple.com). They can also flood your network with thousands
    of packets per second using the raw-packet-generation tools Nping (https://nmap.org/ping)
    and NetScanTools Pro (www.netscantools.com) — enough to bring the network to its
    knees. Even so than with wired networks, this type of attack is very difficult
    to prevent on Wi-Fi.


    You can carry out attacks against your wireless network. The associated countermeasures
    help protect your network from these vulnerabilities as well as from the malicious
    attacks I mentioned above. When testing your wireless network''s security, look
    out for the following weaknesses:


    +   - Unencrypted wireless traffic

    - Weak WEP, WPA, and WPA2 presared keys

    - Crackable Wi-Fi Protected Setup (WPS) PINs

    - Unauthorized APs

    - Easily circumvented MAC address controls

    - Wireless equipment that''s physically accessible

    - Default configuration settings


    A good starting point for testing is to attach to your network as an outsider
    and running a general vulnerability scanner tool, such as LangGuard or Nexpos.
    This test enables you to see what others can see on your network, including information
    on the operating-system version, open ports on your AP, and even network shares
    on wireless clients. Figure 10–4 shows the type of information that can be revealed
    about an AP on your network, including a missing administrator password, an outdated
    operating system, and open ports and shares that can be exploited.'
