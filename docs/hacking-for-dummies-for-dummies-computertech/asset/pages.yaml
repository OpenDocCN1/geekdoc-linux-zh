  md: 'This line says that anyone can mount the root partition remotely in a read-write

    ashion. The following conditions must also be true:


    +   >> NFS daemon (nfsd) must be running, along with the portmap daemon

    that map NFS to RPC.


    +   >> The firewall must allow NFS traffic through.


    +   >> The remote systems that are allowed into the server running the NFS daemon

    must be placed in the /etc/hosts.allow file.


    This remote-mounting capability is easy to misconfigure. It''s often related to

    Linux administrator''s misunderstanding of what it takes to share NFS mounts

    resorting to the easiest way to get it working. If someone can gain remote access,

    the system is theirs.


    # Countermeasures against NFS attacks


    The best defense against NFS hacking depends on whether you need the service

    running.


    +   >> If you don''t need NFS, disable it.


    +   >> If you need NFS, implement the following countermeasures:

    - Filter NFS traffic at the firewall — typically UDP port 111 (the port-mapper

    port) if you want to filter all RPC traffic

    - Add network access controls to limit access to specific hosts.

    - Make sure that your /etc/exports and /etc/hosts.allow files are

    configured properly to keep the world outside your network.


    # Checking File Permissions


    In Linux, special file types allow programs to run with the file owner''s rights:

    SetUID (for user IDs) and SetGID (for group IDs).


    SetUID and SetGID are required when a user runs a program that needs access

    to the system to perform its tasks. When a user invokes the passwd program to

    change his or her password, for example, the program is loaded and run without

    root''s or any other user''s privileges. This is done so that the user can run
    the pro-

    gram and the program can update the password database without the root

    account''s being involved in the process.


    242 PART 4 Hacking Operating Systems'
