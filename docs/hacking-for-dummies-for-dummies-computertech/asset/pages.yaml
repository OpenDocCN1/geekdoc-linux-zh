  md: 'in system log files). You can document other security issues you observe, such
    as how quickly IT staff members or managed service providers respond to your tests
    and whether they respond at all. Following the root-cause analysis approach, any
    missing, incomplete, or unfollowed procedures need to be documented.


    > > Guard the final report to keep it from from people who aren''t authorized
    to see it. A security assessment report and the associated data and supporting
    files in the hands of a competitor, hacker, or malicious insider could spell trouble
    for the organization. Here are some ways to prevent this type of access from happening:


    +   - Deliver the report and associated documentation and files only to those
    who have a business need to know.

    - If you''re sending the final report electronically, encrypt all attachments
    or send the report via a secure cloud file-sharing service such as OneDrive Business,
