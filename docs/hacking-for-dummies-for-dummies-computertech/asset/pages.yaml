  md: 'Exhaustive password cracking attempts usually aren''t necessary. Most passwords
    are fairly weak. Even minimum password requirements, such as a password length,
    can help you in your testing. You may be able to discover security-policy information
    using other tools or via your web browser. (See Part 4 for tools and techniques
    for testing the security of operating systems, and Chapter 15 for information
    on testing websites and applications.) If you find this password policy information,
    you can configure your cracking programs with more well-defined cracking parameters,
    which often generate faster results.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_121_0.png)


    TIP


    # Rainbow attacks


    A rainbow password attack uses cracking to crack various password hashes for LM,
    NTLM, Cisco PIX, and MD5 much more quickly and with extremely high success rates
    (near 100 percent). Password cracking speed is increased in a rainbow attack because
    the hashes are precalculated; they don''t have to be generated individually on
    the fly, as they are in dictionary and brute-force methods.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_121_1.png)


    WARNING


    Unlike dictionary and brute-force attacks, rainbow attacks can''t be used to crack
    password hashes of unlimited length. The current maximum for LM hashes is 14 characters,
    and the maximum is 16 characters (dictionary-based) for Windows Vista and 7 (also
    known as NT). The rainbow tables are available for purchase and download via the
    ophcrack site at http://ophcrack.sourceforge.net. There''s a length limitation
    because with enough time, a sufficient number of tables will be created. By then,
    of course, computers and hashing standards will likely have different authentication
    mechanisms and hashing standards including a new set of vulnerabilities to contend
    with. Job security for IT professionals in this area never ceases to grow.


    If you have a good set of rainbow tables, such as those offered by the ophcrack
    site and Project RainbowCrack (http://project-rainbow.com), you can crack passwords
    in seconds, minutes, or hours versus the days, weeks, or years required by dictionary
    and brute-force methods.


