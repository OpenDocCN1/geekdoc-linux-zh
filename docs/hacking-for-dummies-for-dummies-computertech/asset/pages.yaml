  md: 'These steps don''t include specific information on the methods that you use
    for social engineering and assessing physical security, but the techniques are
    the same. I cover social engineering and physical security in more detail in chapters
    6 and 7, respectively.


    If you''re performing a security assessment for a client, you may go the blind
    assessment route, which means that you start with just the company name and no
    other information. This blind assessment approach allows you to start from the
    ground up and gives you a better sense of the information and systems that malicious
    attackers can access publicly. Whether you choose to assess blindly (covertly)
    or overtly, keep in mind that the way of testing can take longer, and you may
    have an increased chance of missing some (or many) security vulnerabilities. Blind
    assessment isn''t preferred testing method, but most people insist on it.


    As a security professional, you may not have to worry about covering your tracks
    or evading IPSes or related security controls because everything you do is legitimate,
    but you may want to test systems stealthily. In this book, I discuss techniques
    that hackers use to conceal their actions and outline some countermeasures for
    concealment techniques.


    # # Seeing What Others See


    Getting an outside look can turn up a ton of information about your organization
    and systems that others can see, and you do so through a process called *footprinting*.
    Here''s how to gather the information:


    +   - Use a web browser to search for information about your organization. Search
    engines, such as Google and Bing, are great places to start.


    +   - Run network scanners, probe open ports, and seek out vulnerabilities to
    determine specific information about your systems. As an insider, you can use
    scanners, network discovery tools, and vulnerability scanners (such as Nmap, SoftPerfect
    Network Scanner, and GFI LanGuard) to see what''s accessible and to whom.


    Whether you generally gather or probe more technically, limit the amount of information
    you gather based on what''s reasonable for you. You might spend an hour, a day,
    or a week gathering this information. How much time you spend depends on the size
    of your organization and the complexity of the information systems you''re testing.


    TIP'
