  md: 'You should look for the following security vulnerabilities when testing your
    systems:


    +   - APs mounted on the outside of a building and accessible to the public.


    +   - Poorly mounted antennas — or the wrong types of antennas — that broadcast
    too strong signal and are accessible to the public. You can view the signal strength
    in NetStumbler, your wireless client manager, or one of the commercial tools I
    mention earlier in this chapter.


    A related wireless exploit is to connect to a guest or test wireless network and
    then attempt to get into your production environment. Common approaches to solving
    physical separation of the wireless network from everything else and using a separate
    Internet connection or setting up your guest network on a unique network segment.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_198_0.png)


    These issues are often overlooked because of rushed installations, improper planning,
    and lack of technical knowledge, but they can come back to haunt you. The book
    Wireless Networks For Dummies (Wiley) provides more details.


    # Countermeasures against physical security problems


    Ensure that APs, antennas, and other wireless and network infrastructure are locked
    away in secure closets, ceilings, or other places that are difficult for a would-be
    intruder to access physically. Terminate your APs outside any firewall or other
    network perimeter security devices — at least in a demilitarized zone (DMZ) —
    whenever possible. If you place unsecured equipment inside your secure network,
    it can negate any benefits you get from your perimeter security devices, such
    as your firewall.


    If wireless signals are propagating outside your building where they don''t belong,
    do one of the following things:


    +   - Turn down the transmit power setting of your AP.


    +   - Use a smaller or different antenna (semidirectional or directional) to decrease
    the signal.


    Some basic planning helps prevent these vulnerabilities.


    184 PART 3 Hacking Network Hosts'
