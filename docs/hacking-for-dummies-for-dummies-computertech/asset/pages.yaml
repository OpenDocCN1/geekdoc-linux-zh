    # Understanding other ways to crack passwords


    Over the years, I''ve found other ways to crack (or capture) passwords technically
    and through social engineering.


    # Keystroke logging


    One of the best techniques for capturing passwords is remote keystroke logging
    — the use of software or hardware to record keystrokes as they''re typed.


    > Beware with keystroke logging. Even with good intentions, monitoring employees
    raises various legal issues if it''s not done correctly. Discuss with your legal
    counsel what you''ll be doing, ask for her guidance, and get approval from upper
    management.


    # LOGGING TOOLS


    Keystroke-logging tools, you can assess the log files of your application to see
    what people are using:


    +   - Keystroke-logging applications can be installed on the monitored computer.
    I recommend that you check out Spectre 360 by SpectorSoft (www.spect360.com).
    Dozens of such tools are available on the Internet.

    - Hardware-based tools, such as KeyGhost (www.keyghost.com), fit between the keyboard
    and the computer or replace the keyboard.


    > A keystroke-logging tool installed on a shared computer can capture the passwords
    of every user who logs in.'
