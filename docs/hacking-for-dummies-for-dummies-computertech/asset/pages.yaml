- img_proc: true
  md: '# Countermeasures against banner attacks


    There isn''t a 100 percent secure way to disguise banner information. I suggest
    these banner security tips for your SMTP, POP3, and IMAP servers:


    +   - Change your default banners to conceal the details.

    - Make sure you''re always running the latest software patches.

    - Harden your server as much as possible by using well-known best practices from
    resources as the Center for Internet Security (https://www.cisec.org) and NIST
    (https://csrc.nist.gov).


    # SMTP attacks


    Some attacks exploit weaknesses in SMTP. This email communication protocol, was
    more than three decades old, was designed for functionality, not security.


    # Account enumeration


    A clear way that attackers can verify email account exists on a server is to Telnet
    to the server on port 25 and run the VRFY command. The VRFY (short for verify)
    makes a server check whether a specific user ID exists. Spammers automate this
    method to perform a directory harvest attack (DHA), which is a way of gleaming
    valid email addresses from a server or domain so that hackers know whom to send
    spam, phishing, or malware-infected messages to.


    # ATTACKS USING ACCOUNT ENUMERATION


    Figure 14-5 shows how easy it is to verify an email address on a server with the
    VRFY command enabled. Scripting this attack can test thousands of email address
    combinations.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_274_0.png)


    260 PART 5 Hacking Applications'
