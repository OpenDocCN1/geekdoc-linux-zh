  md: '# DO YOU NEED INSURANCE?


    If you''re an independent consultant or have a business with a team of security
    assessment-professionals, consider getting professional liability insurance (also
    known as errors and omissions insurance) from an agent who specializes in business
    insurance coverage. This kind of insurance can be expensive but worth the expense
    if it goes awry and you need protection. Many customers require the insurance
