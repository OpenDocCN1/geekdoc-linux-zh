    # Countermeasures against system scanning


    Although you can''t prevent system scanning, you can implement the following countermeasures
    to keep the bad guys from gleaming too much information about your systems and
    using it against you somehow:


    +   Protect the systems with:

    - A firewall, using iptables, that''s built into the OS

    - A host-based intrusion prevention system (IPS) such as PortSentry (https://sourceforge.net/projects/sentrytools/),
    a local agent such as Snare (https://www.snaresolutions.com/products/snare-agents/),
    or McAfee Host Intrusion Prevention for Server (https://www.mcafee.com/us/products/host-ips-server.aspx)
    that ties into a larger security incident and event management system that monitors
    and correlates network events, anomalies, and breaches.

    - Disable the services you don''t need, including RPC, HTTP, FTP, Telnet, and
    small UDP and TCP services — anything for which you don''t have a true business
    need. This practice keeps the services from showing up in a port


