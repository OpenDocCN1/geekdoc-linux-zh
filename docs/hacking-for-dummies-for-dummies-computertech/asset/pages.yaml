  md: '# Be a good guy by thinking like a bad guy


    Tosmart a hacker, you must think like a hacker. Security expert Kevin Beaver shows
    you what motivates hackers and what they''re looking for. It lets you in on the
    secrets of vulnerability and penetration testing, security best practices, and
    everything else you need to stop attackers before they cause problems for your
    business. Learn how to protect your servers and desktops, web applications, mobile
    devices, or your entire network.


    # Inside...


    +   * Identify Windows 10, Linux, and macOS vulnerabilities

    * Prevent web application hacking

    * Defend your databases

    * Secure your mobile devices

    * Eliminate vulnerabilities in Vol

    * Browse a list of free and commercial testing tools

    * Check out resources for locking your network


    Kevin Beaver is an independent information security consultant with more than
    three decades of experience. Kevin specializes in performing vulnerability and
    penetration testing and security consulting work for Fortune 1000 corporations,
    product vendors, developers, universities, and government organizations. He has
    appeared on CNN and has been quoted in The Wolf Street Journal.


    Go to dummies.com*

    for videos, step-by-step examples, how-to-articles, or to shop!


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_0_0.png)


    6th Edition


    # LEARNING MADE EASY


    # 6th Edition


    # Hacking for dummies

    A Wiley Brand


    Prevent Windows 10, Linux*, and macOS* attacks

    Use the latest tools and techniques

    Develop a security testing plan


    Kevin Beaver, CISSP

    Independent information security consultant, Principle Logic, LLC


