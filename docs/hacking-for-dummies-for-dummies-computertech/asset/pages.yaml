  md: 'Cain & Abel is a password-cracking tool that also has network analysis capabilities.
    You can also use a regular network analyzer, such as the commercial products Omnipeek
    (https://www.savvius.com) and CommView (https://www.tamos.com/products/commview),
    as well as the free open-source program Wireshark (https://www.wireshark.org).
    With a network analyzer, you can search for word traffic in various ways. To capture
    POP3 password traffic, for example, you can set up a filter and a trigger to search
    for the PASS command. When the network analyzer sees the PASS command in the packet,
    it captures that specific data.


    Network analyzers require you to capture data on a hub segment of your network
    or via a monitor/mirror/span port on a switch. Otherwise, you can''t see anyone
    else''s data traversing the network — just. Check your switch''s user guide to
    see whether it has a monitor or mirror port and instructions on how to configure
    it. You can connect your network analyzer to a hub on the public side of your
    firewall. You''ll capture only those packets that are entering or leaving your
    network — not internal traffic. I cover this type of network infrastructure hacking
    in detail Chapter 9.


    # COUNTERMEASURES


    Here are some good defenses against network attacks:


    +   >> Use switches on your network, not hubs. Ethernet hubs are things of the
    past, but I still see them in use occasionally. If you must use hubs on network
    segments, a program like snifledet (http://sniffled.sourceforge.net) for Unix/Linux-based
    systems and PromisDetect (http://security.nu/toolbox/promisdetect) for Windows
    can detect network cards in promiscuous mode (accepting all packets, whether they''re
    destined for the local machine or not). A network card in promiscuous mode signifies
    that a network analyzer may be running on the network.


    +   >> Make sure that unsupervised areas, such as an unoccupied lobby or training
    room, don''t have live network connections. An Ethernet port is all someone needs
    to gain access to your internal network.


    +   >> Don''t let anyone without a business need physical access to your switches
    or to the network on the public side of your firewall. With physical access, a
    hacker can connect to a switch monitor port or tap into the unswitched network
    segment outside the firewall and then capture packets.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_129_0.png)'
