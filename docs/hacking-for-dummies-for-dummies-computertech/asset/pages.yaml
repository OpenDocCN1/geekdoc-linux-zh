  md: '# Countermeasures against the WPS PIN flaw


    It''s rare to come across a security fix as straightforward as this one: Disable
    WPS. If you need to leave WPS enabled, at least set MAC address controls on your
    AP(s). This fix isn''t foolproof, but it''s better than nothing! More recent consumer–grade
    wireless routers also have intruder lockout for the WPS PIN. If the system detects
    WPS pinning attacks, it locks out those attempts for a certain period, which is
    a great form of protection. The best thing to do to prevent WPS attacks in the
    enterprise is not to use low-end wireless routers in the first place.


    # Rogue wireless devices


    Watch out for unauthorized APs and wireless clients that are attached to your
    network, which are great ways for someone to social-engineer your users connecting
    to their malicious network/systems.


    Also be sure to educate your users on safe Wi-Fi use when they''re outside your
    office. Communicate to them the dangers of connecting to unknown Wi-Fi, and remind
    them on a periodic and consistent basis. Otherwise, their systems can be hacked
    or infected with malware, and whose problem is it they connect to your network
    again.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_189_0.png)


    By using Nettumblr or your client manager software, you can test for APs and ad-hoc
    (or peer-to-peer) devices that don''t belong on your network. You can also use
    the network monitoring features in a wireless network analyzer, such as Omnipeek
    and CommView for WIFI.


    Look for the following rogue AP characteristics:


    +   >> SSID, including the popular default ones such as linksys public wifi.

    >> MAC addresses that don''t belong on your network. Look at the first three bytes
    of the MAC address (the first six numbers), which specify the vendor name. You
    can perform a MAC address lookup at http://standards.ieee.org/develop/regauth/public.html
    to find information on APs you''re unsure about.

    >> Weak radio signals, which can indicate that an AP has been hidden away or is
    adjacent to outside your building.

    >> Communications across a different radio channel(s) from the one(s) your network
    communicates on.

    >> Degradation in network throughput for any Wi-Fi client.'
