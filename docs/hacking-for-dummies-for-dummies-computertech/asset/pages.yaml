  md: '+   IN THIS CHAPTER

    >> Attacking email systems

    >> Assailing instant messaging

    >> Assailing Voice over IP applications


    # Chapter 14

    Communication and Messaging Systems


    Communication systems and protocols such as email and Voice over Internet Protocol
    (VoIP) often create vulnerabilities that people overlook. Why? Well, in my experience,
    communications software — at both the server and client levels — is vulnerable
    because network administrators believe that firewalls and antivirus software are
    all they need to keep trouble away, or simply forget about securing these systems.


    In this chapter, I show you how to test for common email and VoIP issues. I also
    outline key counter countermeasures to help prevent these hacks against your systems.


    # Introducing Messaging System Vulnerabilities


    Practically all messaging applications are hacking targets on your network. Given
    the proliferation of and business dependence on email, just about anything is
    fair game. Ditto with VoIP. It''s downright scary what people with ill intent
    can do with these tools.


    CHAPTER 14 Communication and Messaging Systems 253'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'With messaging systems, one underlying weaknesses is that many of the supporting
    protocols weren''t designed with security in mind — especially those developed
    several decades ago, when security wasn''t nearly the issue it is today. The funny
    thing is that even modern—day messaging protocols or at least the implementation
    of the protocols are still susceptible to serious security problems. Furthermore,
    convenience and usability often outweigh the need for security.


    Many attacks against messaging systems are minor nuisances; others can inflict
    serious harm on your information and your organization’s reputation. Malicious
    attacks against messaging systems include the following:


    +   - Transmitting malware.

    - Crashing servers.

    - Obtaining remote control of workstations.

    - Capturing information while it travels across the network.

    - Perusing emails stored on servers and workstations.

    - Gathering messaging-trend information via log files or a network analyzer that
    can tip off the attacker after conversations between people and organizations
    (often called traffic analysis or social network analysis).

    - Capturing and replaying phone conversations.

    - Gathering internal network configuration information, such as host names and
    IP addresses.


    These attacks can lead to such problems as unauthorized and potentially illegal
    — disclosure of sensitive information, as well as loss of information.


    # Recognizing and Countering Email Attacks


    The attacks I describe in this section exploit the most common email security
    vulnerabilities I’ve seen. The good news is that you can eliminate or minimize
    most of them to the point where your information isn’t at risk. Some attacks require
    basic hacking methodologies: gathering public information, scanning and enumerating
    your systems, and finding and exploiting vulnerabilities. Other attacks can be
    carried out by sending emails or capturing network traffic.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Email bombs


    Email bombs attack by creating denial of service (DoS) conditions against your
    email software and even your network and Internet connections by taking up a large
    amount of bandwidth and sometimes requiring large amounts of storage space. Email
    bombs can crash a server and provide unauthorized administrator access — yes,
    even with today''s seemingly endless storage capacities.


    # Attachments


    An attacker can create an attachment-overload attack by sending hundreds or thousands
    of emails with very large attachments to one or more recipients upon your network.


    # ATTACKS USING EMAIL ATTACHMENTS


    Attachment attacks have a couple of goals:


    +   > The server may be targeted for a complete interruption of service with these
    failures:


    +   * Storage overload: Multiple large messages can quickly fill the total storage
    capacity of an email server. If the messages aren''t automatically deleted by
    the server or manually deleted by user accounts, the server will be unable to
    receive new messages.


    This can create a significant DOS problem for your email system, either crashing
    it or requiring you to take your system offline to clean up the junk that has
    accumulated. A 100MB file attachment 10 times to 100 users can take 100GB of storage
    space, which can add up!


    +   * Bandit blocking: An attacker can crash your email service or bring it to
    a crawl by filling the incoming Internet connection with junk. Even if your system
    automatically identifies and discards obvious attachment attacks, the bogus messages
    eat resources and delay processing of valid messages.


    +   > An attack on a single email address can have serious consequences if the
    address is for an important user or group.


    # COUNTERMEASURES AGAINST EMAIL ATTACHMENT ATTACKS


    These countermeasures can help prevent attachment-overload attacks:


    +   * Limit the size of emails or email attachments. Check for this option in
    your email server''s configuration settings (such as those provided in Microsoft
    Exchange), in your email content filtering system, and even at the email client.


    CHAPTER 14 Communication and Messaging Systems 255'
  merge: -1
  pgno: 269
- img_proc: true
  md: '> Limit each user''s space on the server or in the cloud. This countermeasure
    denies large attachments from being written to disk. Limit message sizes for inbound
    and even outbound messages if you want to prevent a user from launching this attack
    from inside your network. I find that a few gigabytes is a good limit, but the
    limit depends on your network size, storage availability, business culture, and
    so on. Think through this carefully before putting one in place.


    Using SFTP, FPS, or HTTPS instead of large file transfers. Numerous cloud-based
    file services are available, such as Dropbox, OneDrive for Business, and Sharefile.
    You can also encourage your users to use departmental shares or public folders.
    By doing so, you can store one copy of the file on a server and have the recipient
    download the file on his or her own workstation.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_270_0.png)


    Contrary to popular belief and use, the email system should not be an information
    repository, but that''s exactly what email has evolved into. An email server for
    this purpose can prevent unnecessary legal and regulatory risks and turn into
    a nightmare if your business needs an e-discovery request related to a lawsuit.
    An important part of your security is developing an information classification
    and retention program to help with records management. But it doesn''t go alone.
    Get others as your lawyer, human resources manager, and chief information officer
    involved. This practice can help ensure that people are on board and that your
    business doesn''t get into trouble for holding too many — or few — electronic
    records in the event of a lawsuit or investigation.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_270_1.png)


    # Connections


    A hacker can send a huge number of emails simultaneously to your email system.
    Malware''s that present on your network can do the same thing from inside your
    network if your network has an Simple Mail Transfer Protocol (SMTP) relay (which
    is often the case). These connection attacks can cause the server to give up on
    servicing any inbound or outboundTransmission Control Protocol (TCP) requests.
    This situation can lead to a server lockout or a crash, resulting in a condition
    in which the attacker is allowed administrator or root access to the system.


    # ATTACKS USING FLOODS OF EMAILS


    An attack using a flood of emails is carried out in spam attacks and other DoS
    attacks.


    # COUNTERMEASURES AGAINST CONNECTION ATTACKS


    Prevent email attacks as far out on your network perimeter as you can, ideally
    in the cloud. The more traffic or malicious behavior you keep off your email servers
    and clients, and the better.


    256 PART 5 Hacking Applications'
