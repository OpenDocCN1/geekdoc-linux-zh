    >> Network host configurations.

    >> Network monitoring and maintenance.


    If someone exploits a vulnerability in one of the items in the preceding list
    or where in your network''s security, bad things can happen:


    +   >> An attacker can launch a denial of service (DoS) attack, which can take
    down your Internet connection or your entire network.

    >> A malicious employee using a network analyzer can steal confidential information
    in emails and files sent over the network.

    >> A hacker can set up backdoor access into your network.

    >> A contractor can attack specific hosts by exploiting local vulnerabilities
    across the network.


    Before assessing your network infrastructure security, remember to do the following:


    +   >> Test your systems from the outside and the inside (that is, and on internal
    network segments and demilitarized zones [DMZs]).

    >> Obtain permission from partner networks to check for vulnerabilities on their
    systems that can affect your network''s security, such as open ports, lock of
    a firewall, or a misconfigured router.


    # Choosing Tools


    With all security assessments, your network security tests require the right tools:
    port scanners, protocol analyzers, and vulnerability assessment tools. Great commercial,
    shareware, and freeware tools are available. I describe a few of my favorite tools
    in the following sections. Keep in mind that you need more than one tool, because
    no tool does everything you need.


    If you''re looking for easy-to-use security tools with all-in-one packaging, get
    what you pay for for most of the time – especially for the Windows platform. Tons
    of security professionals swear by many free security tools, especially those
    that run on Linux and other Unix-based operating systems. Many of these tools
    offer a lot of value if you have the time, patience, and willingness to master
    them'
