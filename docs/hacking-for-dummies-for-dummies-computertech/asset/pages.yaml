  md: '# DEMONSTRATE EXPLOITS WERE NEEDED


    I once performed a security assessment in which I used Qualys to find a vulnerability
    in an older version of OpenSSL running on a web server. With most Dos findings,
    I did exploit the vulnerability because I didn''t want to take down the production
    system. Instead, I listed it as a medium-priority vulnerability — an issue that
    had the potential to be exploited. My client pushed back and said that OpenSSL
    wasn''t on the system. With permission, I downloaded the exploit code available
    on the Internet, compiled it, and ran it against my client''s server. Sure enough,
    the code took the server offline.


    At first, my client thought the attack was a fluke, but after I took the server
    offline again, he bought into the vulnerability. He was using an OpenSSL derivative,
    which created the vulnerability. Had my client fixed the problem, any number of
    attackers around the world could have taken — and kept — this production system
    offline, which could have been both tricky and time-consuming, and not good for
    business!


    Other Dos tools checking out are UDPFlood (https://www.mcafee.com/us/downloads/free-tools/udpflood.aspx),
    Blast (https://www.mcafee.com/us/downloads/free-tools/blast.aspx), NetScanTools
    Pro, and CommView.


    # Countermeasures against Dos attacks


    Most Dos attacks are difficult to predict, but they can be easy to prevent, as
    follows:


    +   **Test and apply security patches (including service packs and firmware updates)
    as soon as possible** for network hosts, such as routers and firewalls, as well
    as for server and workstation operating systems.


    +   **Use an IPS to monitor for Dos attacks.** You can run a network analyzer
    in continuous capture mode if you can''t justify the cost of an all-out IPS solution
    and use it to monitor for Dos attacks.


    +   **Configure firewalls and routers to block malformed traffic.** You can enact
    this countermeasure only if your system supports it, so refer to your administrator''s
    guide for details.


    +   **Minimize IPS spoofing** by filtering out external packets that appear to
    come from an internal address, the local host (127.0.0.1), or any other private
    and nonroutable address, such as 10.x.x.x, 172.16.x.x–172.31.x.x, or 192.168.x.x.
    The following paper from Cisco Systems provides more information: https://www.cisco.com/web/about/ac123/ac147/archive_issues/ip_j_10-4_ip_spoofing.html.


    154 PART 3 Hacking Network Hosts'
