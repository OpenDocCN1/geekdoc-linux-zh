- img_proc: true
  md: 'The time between resetting the user account and changing the password is a
    prime opportunity for a break-in.


    +   - Many systems have default accounts or unused accounts with weak pass-words
    or no passwords at all. These accounts are prime targets.


    # COUNTERMEASURES


    The best defends against attacks on passwords in limbo are solid help-desk policies
    and procedures that prevent weak passwords from being available at any given time
    during the new-account-generation and password-reset processes. Following are
    perhaps the best ways to overcome this vulnerability:


    +   - Require users to be on the phone with the help desk or to have a help-desk
    member perform the reset at immediately and the user''s desk.


    +   - Require that the user immediately log in and change the password.


    +   - If you need the ultimate in security, implement stronger authentication
    methods, as such challenge/response questions, smart cards, or digital certificates.


    +   - Automate password reset functionality via self-service tools on your network
    so that users can manage most of their password problems without help from others.


    I cover mobile-related password cracking in Chapter 11 and website/application
    password cracking in Chapter 15.


    # General Password Cracking Countermeasures


    A password for one system usually equals passwords for many other systems because
    many people use the same (or at least similar) passwords on every system they
    use. For this reason, you may want to consider instructing users to create different
    passwords for different systems, especially on the systems that protect sensitive
    information. The only downside is that users may be tempted to write them down,
    which can negate any benefits.'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'Strong passwords are important, but you need to balance security and convenience.
    You can''t expect users to memorize passwords that are insanely complex and must
    be changed every few weeks. But you can''t afford weak passwords or no passwords
    at all. Come up with a strong password policy and accompanying standard — preferably
    one that requires length, strong passrases (combinations of words that are easy
    to remember yet not impossible to crack) that have to be changed only once or
    twice a year.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_132_0.png)


    # # Storing passwords


    If you have to choose between weak passwords that your users can memorize and
    strong passwords that your users must write down, I recommend having readers write
    down passwords and store the information securely. Train users to store their
    written passwords in a secure place — not on keyboards or in easily cracked password-protected
    computer files (such as spreadsheets). Users should store a written password in
    any of these locations:


    +   - A locked cabinet or office safe

    - A disk secured (full) disk encryption, which can prevent an intruder from accessing
    the operating system and passwords stored on the system. (Just know that this
    technique isn''t foolproof, as I outline in Chapter 11.1)

    - A secure password management tool such as LastPass (https://www.lastpass.com)
    or the open-source program Password Safe (https://www.pwswafe.org/).


    Again, as I mentioned earlier, applications as these aren''t impervious to attack,
    but so be careful.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_132_1.png)


    Don''t write passwords on sticky notes! People joke about this practice, but it
    happens a lot, and it''s not good for business!


    # # Creating password policies


    As an IT or security professional, you should show users the importance of securing
    their passwords. Here are some tips on how to do that:


    +   - Demonstrate how to create secure passwords. Refer to passwords as passphrases,
    because people tend to take passwords literally and use can be less secure.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '+   Show what can happen when weak passwords are used or passwords are shared.


    +   Diligently build user awareness of social engineering attacks.


    Enforce (or at least encourage the use of) a strong password-creation policy that
    includes the following criteria:


    +   Use uppercase and lowercase letters, special characters, and numbers. Never
    use only numbers. Such passwords can be cracked quickly.


    +   Misspell words or create acronyms from a quote or a sentence. ASCII, for example,
    is an acronym for American Standard Code for Information Interchange that can
    be used as part of a password.


    +   Use punctuation characters to separate words or acronyms.


    +   Change passwords every 6 to 12 months or immediately if they are suspected
    of being compromised. Any change more frequent introduces inconvenience serves
    only to create more vulnerabilities.


    +   Use different passwords for each system. This practice is especially important
    for network infrastructure hosts, such as servers, firewalls, and routers. It''s
    okay to use similar passwords; just make them slightly different for each type
    of system, such as SummerInTheSouth-Win10 for Windows systems and Linux+SummerInTheSouth
    for Linux systems.


    +   Use variable-length passwords. This trick can throw off attackers because
    they won''t know the required minimum or maximum length of passwords and must
    try all password-length combinations.


    +   Don''t rely completely on similar-looking characters, such as 3 of E, 5 of
    S, or l of 1. Password-cracking programs and dictionaries are available to help
    check for this practice.


    +   Don''t reuse the same password within at least four to five passwords.


    +   Use password-protected screen savers. Unlocked screens are a great way for
    systems to be compromised. You could the strongest passwords and best fill disk
    encryption in the world, but none of that matters if the computer is left unattended
    with the screen unlocked.


    +   Don''t share passwords. To each is his own!


    +   Avoid storing passwords in an unsecured central location, such as an unprotected
    spreadsheet on a hard drive. This practice is an invitation to disaster. Use a
    password manager to store user passwords if you''re willing to do so. (I''m not
    yet).'
