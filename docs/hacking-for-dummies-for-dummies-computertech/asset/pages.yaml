  md: 'The quality you get with Cain and other tools depends on the codec that VoIP
    devices use. With my equipment, I find that the quality is marginal at best, but
    that''s not really a big deal. Your goal is to prove the existence of a vulnerability
    — not listen to in other people''s conversations.


    You can also use a Linux-based tool called vomit (http://vomit.xdnet.net), which
    is short for vomit over misconfigured Internet telephones, that you can use to
    convert VoIP conversations to .wav files. First, you need to capture the actual
    conversation using tcpdump, but if Linux is your preference, this solution offers
    same results as Cain, outlined in the preceding steps.


    If you''re going to work a lot with VoIP, I recommend that you use in a good VoIP
    network analyzer. Check out Savvius Omnipeek, which is a great all-in-one wired
    and wireless analyzer (https://www.savvius.com/product/omnipeek), and TamosSoft''s
    CommView (https://www.tamos.com/products/commview), which is a great alternative
    at a much lower price.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_289_0.png)


    TIP


    These VoIP vulnerabilities are only the tip of the iceberg. New systems, software,
    and related protocols continue to emerge, so it pays to remain vigilant to ensure
    that your conversations are locked down against those with malicious intent. I''ve
    said before, if it has an IP address or URL, it''s fair for game.


    # Countermeasures against VoIP vulnerabilities


    Locking down VoIP can be tricky. You can get off to a good start, though, segmenting
    your VoIP network into one VLAN or a dedicated physical network, that fits into
    your budget. Further isolate any Internet-connected systems so not not just can
    connect to them (a situation that I often see). You should also make sure all
    VoIP-related systems are hardened according to vendor recommendations and widely
    accepted best practices (such as NIST''s SP800-58 document at https://csrc.nist.gov/publications/detail/sp/800-58/final)
    and that software and firmware are patched on a periodic and consistent basis.
    Finally, be sure to scan systems with a network vulnerability scanner such as
    Nexpose or Nessus on a periodic basis. If all your phones are the same make and
    model, you probably can get away with testing a small subset of them. Just be
    careful, as I''ve seen phones and related voice equipment go a bit haywire when
    vulnerability scans are run against them.'
