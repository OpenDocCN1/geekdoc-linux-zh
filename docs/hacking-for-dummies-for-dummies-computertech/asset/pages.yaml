  md: '# Using Cain & Abel for ARP poisoning


    You can perform ARP poisoning on your switched Ethernet network to test your IPS
    or to see how easy it is to turn a switch into a hub and capture anything with
    a network analyzer.


    > WARNING\ARP poisoning can be hazardous to your network''s hardware and health,
    causing downtime and severe. Be careful!


    Follow these steps to use Cain & Abel for ARP poisoning:


    +   1. Load Cain & Abel and then click the Sniffer tab to enter network analyzer
    mode.

    The Hosts page opens by default.


    +   2. Click the Start/Stop APR icon (the yellow-and-black circle).

    The ARP poison routing (how Cain & Abel refers to ARP poisoning) process starts
    and enables the built-in sniffer.


    +   3. If you''re prompted to do so, select the network adapter in the window
    and then click OK.


    +   4. Click the blue plus-sign (+) icon to add hosts on which to perform ARP
    poisoning.


    +   5. In the MAC Address Scanner window that appears, ensure that the All Hosts
    in My subnet is selected, and click OK.


    +   6. Click the APR tab (the one with the yellow-and-black circle icon) to load
    the ARP page.


    +   7. Click the white space below the Status column heading (below the Sniffer
    tab).


    This step reenables the blue + icon.


    +   8. Click the blue + icon.

    The New ARP Poison Routing window shows the hosts discovered in Step 4.


    +   9. Select your default route (in this example, 10.11.12.1).


    The right column fills with all the remaining hosts, as shown in Figure 9-11.


    +   10. Ctrl+click all the hosts in the right column that you want to poison.'
