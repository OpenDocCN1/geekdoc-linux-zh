  md: '# SENSITIVE INFORMATION STORED LOCALLY


    Quite often as part of my security testing, I use a hex editor to see how an application
    is storing sensitive information, such as passwords, in memory. When I''m using
    Firefox

    and Internet Explorer, I can use a hex editor such as WinHex (www.x-ways.net/win)
    to search the active memory of these programs and frequently find user ID

    and password combinations.


    I''ve found that older versions of Internet Explorer, this information is kept
    in mem-

    ory after I browse to other websites or log out of the application. This feature

    poses a security risk on the local system if another user accesses the computer
    or if the

    system is infected with malware that can search memory for sensitive informa-

    ton. The way that browsers store sensitive information in memory is also bad news
    if

    an error or system memory dump occurs and the user ends up sending the

    information to Microsoft (or another browser vendor) for quality-assurance purposes.

    It''s also bad if the information is written to a dump file on the local hard
    drive and

    sits there for someone to find.


    Try searching for sensitive information stored in memory related to your web

    application(s) or on-stand programs that require authentication. You may just
    be

    sprised by the outcome. By refusing obfuscating or encoding the login credentials,
    no

    great fix is available, unfortunately, because this "feature" is part of the web
    browser

    developers can''t control.


    A similar security feature occurs on the client side when HTTP GET requests rather
    than

    HTTP POST requests are used to process sensitive information. Here is an example

    of a vulnerable GET request:


    ```

    https://www.your_app.com/access.php?username=beaver&amp;

    password=WhatVur!&amp;login=Son

    ```


    OET requests are stored in the web browser history file, server log files,

    and proxy log files. GET requests can be transmitted to third-party sites via
    the HTTP

    Referrer field when the user browses to third-party sites. All of the above can
    lead to

    exposure of login credentials and unauthorized web access. The lesson:

    Don''t use HTTP GET for logins. Use HTTP POST requests instead. If anything,

    consider these vulnerabilities to be good reasons to encrypt the hard drives of
    your lap-

    tops and computers that are not physically secure!


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_306_0.png)


    Many web developers and webmasters use these scripts without understanding

    h they work or without testing them, which can introduce serious security

    vulnerabilities.


    PART 5 Hacking Applications'
