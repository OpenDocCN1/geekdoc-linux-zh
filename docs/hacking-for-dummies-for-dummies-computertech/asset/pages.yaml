  md: 'I recommend that you use ophrack''s LiveCD on a sample laptop computer or two
    to demonstrate how simple it is to recover passwords and, subsequently, sensitive
    information from laptops that don''t have encrypted drives. This tool is amazingly
    simple, yet many people refuse to invest money in full-disk encryption software,
    even the free and enterprise-ready Microsoft BitLocker ElcomSoft System Recovery
    is another great tool for this exercise.


    # THE FALLACY OF FULL-DISK ENCRYPTION


    It seems simple enough to encrypt your laptop hard drives and be done with laptop
    security. In a perfect world, that would be the case, but as long as people are
    involved, I suspect that this mobile weakness will continue to exist.


    Several problems with disk encryption create a false sense of security:


    +   **Password selection:** Your disk encryption is only as good as the password
    (phrase) that was used to enable the encryption.


    +   **Key management:** If users don''t have a way to get into their systems if
    they forget or lose their passwords, they''ll get burned once and do whatever
    it takes not to encrypt their drives moving forward. Also, certain disk encryption
    software, such as Microsoft''s BitLocker, may provide the option for (or even
    users) to carry their encryption keys on a thumb drive or similar storage device.
    Losing a laptop with the key to the kingdom stored right inside the laptop bag!
    It happens.


    +   **Screen locking:** The potentially fatal flaw with full-disk encryption occurs
    when users refuse to ensure that their screens are locked whenever they step away
    from their encrypted laptops. it takes only a few seconds for a criminal to swipe
    a laptop to gain—and maintain—access to a system that is “fully protected” with
    full-disk encryption.


    One final impact: Certain types of full-disk encryption are cracked. The protections
    offered by BitLocker, FileVault2, and TrueCrypt, for example, can be fully negated
    by programs such as Password Kit Forensic and ElcomSoft Forensic Disk Decrypt
    (www.elcomsoft.com/ref.html). Furthermore, you shouldn''t be using TrueCrypt,
    given that its original developers went dark, and flaws exist that can allow you
    to protect your systems from less technically inclined passers who might end up
    in possession of one of your lost or stolen systems.'
  merge: -1
