    # Using port scanning tools


    Most port scanners operate in three steps:


    +   1. The port scanner sends TCP SYN requests to the host or range of hosts you
    want to scan.

    Some scanners perform ping sweeps to determine which hosts are available before
    starting the TCP scans.

    Most scanners scan only TCP ports by default. Don''t forget about UDP ports, which
    can be scanned with a UDP port scanner, such as Nmap.

    2. The port scanner waits for replies from the available hosts.

    3. The port scanner probes these available hosts for up to 65,534 possible TCP
    and UDP ports (based on which ports you tell it to scan) to see which ones have
    available services on them.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_146_0.png)


    The port scans provide the following information about the hosts on your network:


    +   - Hosts that are active and reachable through the network.

    - Network addresses of the hosts found.

    - Services or applications that the hosts may be running.


    After performing a generic sweep of the network, you can dig deeper into specific
    hosts you find.


    # NMAP


    After you have a general idea of what hosts are available and what ports are open,
    you can perform fancy scanners to verify that the ports are actually open'
