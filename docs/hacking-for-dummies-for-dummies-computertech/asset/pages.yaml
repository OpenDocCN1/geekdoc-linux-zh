  md: '# # About the Author


    Kevin Beaver is an independent information security consultant, expert witness,
    professional speaker, and writer with Atlanta-based Principle Logic, LLC. He has
    over three decades of experience in IT and has spent a quarter of a century working
    in security. Kevin specializes in performing independent information security
    assessments for corporations, security product vendors, developers/cloud service
    providers, government agencies, nonprofit organizations, others. Before starting
    his information security consulting practice in 2001, Kevin served in various
    information technology (IT) and security roles for several healthcare, e-commerce,
    financial, and educational institutions.


    Kevin has appeared on CNN television as an information security expert and has
    been quoted on The Wall Street Journal, Entrepreneur, Fortune Small Business,
    Women''s Health, and on Inc.''s magazine technology site, IncTechnology.com. Kevin''s
    work has also been referenced by the PCI Council in his Data Standard Wireless
    Guidelines. Kevin has been a top-rated speaker, giving hundreds of presentations
    and panel discussions for IT and security seminars, and webcasts over the past
    decade and half.


    Kevin has co-authored 12 information security books, including Hacking Wireless
    Networks For Dummies, Implementation Strategies for Fulfilling and Maintaining
    IT Compliance (Realtimepublishers.com), and The Practical Guide to HIPAA Privacy
    and Security Compliance (Auerbach). Kevin has written more than three whitepapers
    and over 1000 articles and guest blog posts for sites such as SearchSecurity.com,
    SearchEnterpriseDesktop.com, and Search-SoftwareQuality.com, Ziff Davis'' Toolboxes,
    as well as IBM''s SecurityIntelligence.com. Kevin is the creator and producer
    of the Security On Wheels audiobooks, which provide security learning for IT professionals
    on the go (securitywheels.com), and the Security On Wheels blog (securitywheels.com/blog).
    He also covers information security and related matters on Twitter (@kevinbeaver)
    and YouTube (@princlogic). Kevin earned his bachelor''s degree in Computer Engineering
    Technology from Southern College of Technology and his master''s degree in Management
    of Technology from Georgia Tech. He has obtained his CISSP certification in 2001
    and also holds MCSE, Master CSE, and IT Project-certifications.


    Kevin can be reached through his website, https://www.principlelogic.com, and
    you can connect to him via LinkedIn at https://www.linkedin.com/in/kevinbeaver.'
