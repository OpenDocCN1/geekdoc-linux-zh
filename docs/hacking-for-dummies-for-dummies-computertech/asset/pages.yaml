    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_271_0.png)


    In large companies, or if you''re using a cloud-based email service such as Gmail
    or Office 365, there is little reason why thousands of inbound deliveries should
    be necessary within a short period.


    Email servers can be programmed to deliver emails to a service for automated functions,
    as create this e-commerce order when a message is received. If DoS protection
