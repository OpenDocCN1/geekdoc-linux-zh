  md: 'comes with a slew of tools that are relatively easy to use. Alternative bootable
    (live) testing suites include the Fedora Linux-based Network Security Toolkit
    (www.networksecuritytoolkit.org). A complete list of live bootable Linux tools
    is available at www.livecdlist.com.


    Most of the tests I outline in this chapter require only Windows-based utilities
    but use the platform you''re most familiar with. You''ll get better results that
    way. My favorite tools for assessing wireless networks in Windows are as follows:


    +   - Aircrack-ng (http://aircrack-ng.org)

    - CommView for WiFi (https://www.tamos.com/products/commwifi)

    - Elcomsoft Wireless Security Auditor (https://www.elcomsoft.com/ewsa.html)

    - Omnipeek (www.savvius.com)


    You can use a handheld wireless security testing device, such as the Handy Hotspot
    by Canary Wireless (www.canarywireless.com) and even your Android-basedbased phone
    or tablet with apps as WiSpy or WiFi Analyzer or iOS device with apps as Network
    Analyzer Pro and Network Multimeter. An external antenna is also something to
    consider as part of your arsenal. I''ve had good luck running tests without an
    antenna, your mileage may depend on how far from the wireless signal you are.
    If you''re performing a walkthrough of your facilities to test for wireless signals,
    by using an additional antenna increases your odds of finding both legitimate
    and (more important) unauthorized wireless systems, but doing so probably isn''t
    required. You can choose three types of wireless antennas:


    +   - Omnidirectional: Transmits and receives wireless signals in 360 degrees
    over shorter distances, such as in boardrooms or reception areas. These antennas,
    also known as dipoles, typically come installed on access points (APs) from the
    factory.


    +   - Semidirectional: Transmits and receives directionally focused wireless signals
    over medium distances, such as down corridors and across one side of an office
    or building.


    +   - Directional: Transmits and receives highly focused wireless signals over
    long distances, such as between buildings. This antenna, also known as a high-gain
    antenna, is the antenna of choice for wireless hackers driving around cities looking
    for vulnerable APs — an act known as wardriving.'
