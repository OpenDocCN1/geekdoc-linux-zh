  md: '# Chapter 20

    Ten Tips for Getting Security Buy-In


    Dozens of key steps exist for obtaining the buy-in and sponsorship that you need
    to support your security testing efforts. In this chapter, I describe the ten
    that I find to be most effective.


    # Cultivate an Ally and a Sponsor


    Although well-known breaches and compliance pressures are pushing things along,
    selling security to management isn''t something that you want to tackle alone.
    Get an ally—preferably, your direct manager or someone at that level or higher
    in the organization. Choose someone who understands the value of security testing
    as well as information security in general. Although this person may not be able
    to speak to you directly, he or she can be seen as an unbiased sponsor, giving
    you credibility.'
