  md: '# PASSWORDS BY THE NUMBERS


    A total 128 ASCII characters are used in typical computer passwords. (Technically,
    only 126 characters are used, because you can''t use the NULL and the carriage-return
    characters.) A truly random 8-character password uses 126 different characters
    can make 63,527,897,748,485,376 different combinations. Taking that scenario further,
    if it were possible (and it is in Linux and Unix) to use all 256 ASCII characters
    (254, without NULL and carriage-return characters) in a password, 17,324,859,965,700,
    833,536 different combinations would be available, or approximately 2.7 billion
    times more than there are possible on Earth!


    A text file containing all possible passwords would require millions of terabytes
    of storage space. If you include only the most realistic combination of 95 or
    50 ASCII letters, numbers, and standard punctuation characters, such a file would
    still fill thousands of terabytes of storage space. These storage requirements
    force dictionary and brute-force password-cracking programs to form the password
    combinations on the fly instead of reading all possible combinations from a text
    file. That''s why attacks are more effective at cracking passwords than dictionary
    and brute-force attacks.


    Given the effectiveness of rainbow password attacks, it is realistic to think
    that eventually, anyone will be able to crack all possible password combinations,
    given the current technology and average life span. It probably won''t happen.
    But many people thought in the 1980s that 640K of RAM and 10MB hard drive in a
    PC were all that anyone would ever need!


    After completing the Windows and Unix/Linux steps, that don''t meet specific password
    policy requirements, create a new password policy, or use the information to update
    your security awareness program. Do just something.


    > Be careful handling the results of your cracking efforts. You create an accountability
    issue because more than one person now knows the passwords. Always treat the password
    information of others as being strictly confidential. If you end storing passwords
    on your test system, make sure that the system is extra-secure. If you''re using
    a laptop, encrypting the hard drive is the best defense.


    # Cracking password-protected files


    Do you wonder how vulnerable password-protected word-processing, spread- and zip
    files are when users send them into the wild yonder? Wonder no more. Some utilities
    can show how easily passwords are cracked.'
