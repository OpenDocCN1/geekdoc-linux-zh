- img_proc: true
  md: '# # Putting up firewalls


    Consider using additional controls to protect your web systems, including the
    following:


    +   - A network-based firewall, intrusion prevention system (IPS) that can detect
    and block attacks against web applications. These tools include commercial firewalls
    from companies such as WatchGuard (https://www.watchguard.com) and Palo Alto Networks
    (https://www.paloaltonnetworks.com).

    - A host-based web-application IPS, such as ServerDefender VP (https://www.port80software.com/products/serverdefender/)

    - A firewall from vendors such as Barracuda Networks (https://www.barracuda.com/products/webapplicationfirewall),
    Cloudflare (https://www.cloudflare.com/waf/) and Fortinet (https://www.fortinet.com/products/web-application-firewall/fortibweb).


    These programs can detect web application and certain database attacks in real
    time, and cut them off before they have a chance to do any harm.


    # # Analyzing source code


    Software development is where many software security holes begin and should but
    rarely do. If you feel confident in your security testing efforts to this point,
    you can dig deeper to find flaws in your source code — things that might never
    be discovered by traditional scanners and testing techniques that are powerless
    nonetheless. Fear not! The process is simpler than it sounds. No, you don''t have
    to go through the code line to see what''s happening. You don''t even need developer
    experience (although it does help).


    You can use a static code analysis tool, such as Visual Code Grepper (https://sourceforge.net/projects/visualcodegrep),
    SonarQube (https://www.sonararqube.org), or PVS-Studio Analyzer (https://www.viv64.com/en/pvs-studio).


    Source code analysis often uncovers flaws from traditional application security
    testing. If you want the most comprehensive level of testing, do both. The extra
    level of checks offered by source analysis is becoming more important. These areas
    are often full of security holes that many software developers didn''t learn in
    school.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_314_0.png)


    Given my experience with some of the higher-end source code analyzers, I''m not
    convinced that it''s worth spending a time of money on the


    PART 5 Hacking Applications'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'commercial products. The tools can certainly help, however, especially if you
    have a large, complex application environment. The bottom line in web application
    and mobile app security is if you can show your developers and quality-assurance
    analysts that security begins with them, you can make a difference in your organization''s
    overall information security.


    # # Uncovering Mobile App Flaws


    In addition to running source code analyzers, it''s important to check for application
    vulnerabilities on the mobile side. You''ll want to look for several things, including:


    +   - Cryptographic database keys that are hard-coded into apps.


    +   - Improper handling of sensitive information such as storing personally identifiable
    information locally where the user and other apps can access it.


    +   - Login weaknesses, such as being able to get around login prompts.


    +   - Network communication weaknesses such as clear-text communications or the
    use of outdated protocols such as SSL.


    +   - Allowing weak,or blank passwords.


    Note that these checks are uncovered mostly via manual analysis and may require
    tools such as wireless network analyzers, forensics tools, and web probes (which
    I talk about in Chapter 9 and Chapter 11, respectively). Finally, given the tools
    and techniques I discuss elsewhere in this chapter, be sure to test for weaknesses
    such as SQL injection at the web service endpoints that your mobile apps interact
    with. As with the Internet of Thing, it''s important to test the security of your
    mobile apps. It''s better for you to find the flaws than for someone else to find
    them.'
