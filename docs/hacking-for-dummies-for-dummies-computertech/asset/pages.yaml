  md: '# # Scanning, Poking, and Prodding the Network


    Performing the security tests described in the following sections on your network
    infrastructure involves following these basic hacking steps:


    +   1. Gather information, and map your network.

    2. Scan your systems to see which are available.

    3. Determine what''s running on the systems you discover.

    4. Attempt to penetrate the systems you discover (if you choose to do).


    Every network card driver and implementation of TCP/IP in most operating systems
    — including Windows, Linux, and your firewalls and routers — has quirks that result
    in different behaviors when scanning, poking, and probing your systems. These
    different behaviors can result in different responses from your various systems,
    including from false-positive findings to DDoS conditions. Refer to your administrator
    guides or vendor websites for details on any known issues and patches to fix those
    issues. If you patched all your systems, you shouldn''t have any issues; just
    know that anything''s possible.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_143_0.png)


    # # Scanning ports


    A port scanner shows you what''s on your network by scanning the network to see
    what''s alive and working. Port scanners provide basic views of how the network
    is laid out. They can help you identify unauthorized hosts or applications and
    network configuration errors that can cause serious vulnerabilities.


    The big-picture view from port scanners often un security issues that otherwise
    go unnoticed. Port scanners are easy to use and can test network hosts regardless
    of what operating systems and applications they''re running. You can usually perform
    the tests relatively quickly and without having to touch individual network hosts
    (which would be a real pain).


    The trick in assessing your overall network system is interpreting the results
    you get from a port scanner. You can get false positives on open ports, and may
    have to dig deeper. Datagram Protocol (UDP) scans, like the protocol itself, are
    less reliable than Transmission Control Protocol (TCP) and often produce false
    positives because many applications don''t know how to respond to random UDP requests.'
