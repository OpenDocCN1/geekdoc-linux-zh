  md: '# Assessing Your Security Infrastructure


    Reviewing your overall security infrastructure in the following ways can add oom
    to your systems:


    +   **Look at how your overall network is designed.** Consider organizational
    issues, such as whether policies are in place, maintained, or taken seriously.
    Physical issues count as well. Determine whether members of management have buy-in
    on information security and compliance, or whether they simply shrug the off as
    an unnecessary expense or barrier to conducting business.


    +   **Map your network using the information you gather from the security tests
    in this book.** Updating existing documentation is a major necessity. Outline
    IP addresses, running services, and whatever you discover. Draw your network diagram.
    Network design and security issues are a whole lot easier to assess when you can
    work with them. I prefer to use a technical drawing program as Microsoft Visio
    or Cheops-ng (http://cheops-ng.sourceforge.net) to create network diagrams, a
    tool isn''t necessary. You can draw your map on a white-board, as many people
    do, which is just fine.


    Be sure to update your diagrams when your network changes or once every year or
    so.


    +   **Think about your approach to correcting vulnerabilities and increasing your
    organization''s overall security.** Are you focusing all your efforts on the perimeter
    and not on a layered security approach? Think about how stores and banks are protected.
    Security cameras focus on the cash registers, teller computers, and surrounding
    areas — not just on the parking lot or entrances. Look at security from a defense-in-depth
    perspective. Make sure that several layers of security are in place if one measure
    fails so that the attacker may go through other barriers to carry out a successful
    attack.


    +   **Think about security policies and business processes at a higher level of
    the business.** Document what security policies and procedures are in place and
    whether they are effective. Determine what risks exists in the way that security
    is overseen and enforced. No organization is immune to gaps in this area. Look
    at the overall security culture within your organization to see what it looks
    like from an outsider''s perspective. Look at it through the lens of an insider.
    Find out what customers or business partners think about how your organization
    treats their sensitive information. I can say with 100 percent certainty that
    something — may several somethings — can be improved on the soft side of security.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_342_0.png)'
  merge: -1
