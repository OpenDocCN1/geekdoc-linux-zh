    of accountability! Don''t forget to look for the simple stuff. When investing
    Linux, you can dig deep into the kernel and do this or to carry out your über-complex
    exploit, but the little things you get you. For the low-hanging fruit of your
    network, as that will get you into the trouble the quickest.


