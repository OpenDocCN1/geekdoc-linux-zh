    +   **Align your security message with your audience, and keep the message as
    nontechnical as possible.** The last thing you want to do is unload a bunch of
    geek-speak on people who no clue what you''re talking about. You''ll end up with
    an opposite effect from the one you were going for. For your messages in terms
    of each group you''re speaking to, explaining how security affects them and how
    they can help.


    +   **Lead by example.** Show that you take security seriously, and order evidence
    that everyone should, too.


    If you can get the ear of management and users, and put enough effort to make
    a normal business practice after day, you can shape your organization''s culture.
    The process takes work, but it can provide security value beyond your wildest
    imagination. I''ve seen the difference it makes!


    # Keeping Up with Other Security Efforts


    Periodic and consistent security assessments aren''t the be-all and end-of of
    information security. Testing doesn''t guarantee security, but it''s certainly
    a key element. This testing must be integrated into an ongoing security program
    that includes the following:


    +   - Higher-level risk assessments.

    - Strong security policies and standards that are enforced and met.

    - Solid incident-response and business-continuity plans that are tested.

    - Effective security awareness and training initiatives.'
