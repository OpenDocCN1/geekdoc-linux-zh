- img_proc: true
  md: '# COUNTERMEASURES


    The only reliable way to eliminate weak password storage is to use only applications
    that store passwords securely. This practice may not be practical, but it''s your
    only guarantee that your passwords are secure. Another option is to instruct users
    not to store their passwords when prompted.


    Before upgrading applications, contact your software vendor to see how it manages
    passwords, or search for a third-party solution.


    # Network analyzer


    A network analyzer sniffs the packets traversing the network, which is what the
    bad guys do if they can gain control of a computer, tap into your wireless network,
    or physical network access to set up their network analyzer. If they gain physical
    access, they can look for a network jack on the wall and plug in.


    # TESTING


    Figure 8-4 shows how crystal-clear passwords can be through the eyes of a network
    analyzer. This figure shows how Cain & Abel (www.oxid.it/cain.html) can sniff
    thousands of passwords going across the network in a couple of hours. As you can
    see in the left pane, these clear text password vulnerabilities can apply to FTP,
    web, Telnet, and more. (The actual usernames and passwords are blurred to protect
    them.)


    FIGURE 8-4: Using Cain & Abel to capture passwords going across the network.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_128_0.png)


    If traffic isn''t tunneled through some form of encrypted link (such as a virtual
    network, Secure Shell, or Secure Sockets Layer), it''s vulnerable to attack.


    > REMEMBER


    PART 2 Putting Security Testing in Motion'
