    # Countermeasures against default configuration settings exploits


    You can implement some of the simplest and most effective countermeasures for
    Wi-Fi, and they''re all free:


    +   - Make sure that you change default admin passwords and SSIDs.


    +   - At a minimum, enable WPA2. Use very strong PSKs consisting of at least 20
    random characters, or use WPA/WPA2 in enterprise mode with a RADIUS server for
    authentication.


    +   - Disable SSID broadcasting if you don''t need this feature.


    +   - Apply the latest firmware patches for your APs and Wi-Fi cards. This countermeasure
    helps prevent various vulnerabilities to minimize the exploitation of publicly
    known holes related to management interfaces on APs and client-management software
    on the clients.'
