- img_proc: true
  md: 'The problem with monitoring security-related events is humans find it boring
    and difficult to do effectively. Each day, you could dedicate a time — such as
    first thing in the morning — checking your critical log files from the previous
    night or weekend to ferret out intrusions and other computer and network security
    problems. Do you really want to subject yourself or someone else to that kind
    of torture?


    Manually sifting through log files probably isn''t the best way to monitor the
    system. Consider the following drawbacks:


    +   - Finding critical security events in system log files is difficult, if not
    impossible. The task is too tedious for the average human to accomplish effectively.

    - Depending on the type of logging and security equipment you use, you may not
    detect some security events, such as IPS evasion techniques and exploits carried
    out over allowed ports on the network.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_347_0.png)


    Instead of panning all your log files for hard-to-find intrusions, here''s what
    I recommend:


    +   - Enable system logging where it is possible and reasonable. You don''t necessarily
    look for certain obvious ones, such as log failures, policy changes, and unauthorized
    access file.

    - Log security events by using syslog via a central server on your network or
    in the cloud. Don''t keep logs on the local host, if possible, to prevent the
    bad guys from tampering with log files to cover their tracks.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_347_1.png)


    Following are a couple of good solutions to the security-monitoring dilemma:


    +   - Purchase an event-logging system. A low-priced yet effective solutions are
    available, such as GFI EventsManager (www.gfi.com/products-and-solutions/network-security-solutions/gfi-eventsmanager).
    Typically, lower-priced event-logging systems support only one platform: Microsoft
    Windows is the most common. Higher-end solutions such as ArcSight Data Platform
    (https://software.microfocus.com/en-us/products/siem-data-collection-log-management-platform.overview)
    offer log management across various platforms and event correlation to help you
    track down the source of security problems and the various systems affected during
    an incident.

    - Outsource security monitoring to a third-party managed security provider (MSSP)
    in the cloud. Dozens of MSPPs were around during the Internet boom, but only one
    remains. The value is in outsourcing


    # CHAPTER 19 Managing Security Processes 333'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'security monitoring is the fact that these companies often have facilities
    and tools that you''re unlikely to be able to afford, let alone maintain. MSSPs
    also have analysts working around the clock who can share with you the security
    experience and knowledge they gain from other customers.


    When these cloud service providers discover a security vulnerability or intrusion,
    they usually address the issue immediately, often without your involvement. I
    recommend checking whether third-party parties and their services can free some
    of your time and resources so that you can focus on other things. Just don''t
    depend solely on their monitoring efforts. A cloud service provider may have trouble
    catching insider abuse, social engineering attacks, and web application exploits
    that are carried out over secured sessions (such as HTTPS). You still need to
    be involved.


    # Outsourcing Security Assessments


    Outsourcing your security assessments is popular and a great way for organizations
    to get an unbiased third-party perspective of their security posture. Outsourcing
    allows you to have a checks-and-balances system that clients, business partners,
    auditors, and regulators to see and often require.


    Outsourcing vulnerability and penetration testing isn''t cheap. Many organizations
    spend tens of thousands of dollars or more, depending on the testing needed. Doing
    all work yourself is quite pricey too, however, when you factor in the time, tools,
    and any necessary training required. Quite possibly, doing yourself isn''t as
    effective as hiring a service, either! An unbiased view through a fresh set of
    eyes can uncover things you never thought about because the trees got in the way
    of the forest.


