- img_proc: true
  md: '> Criminal hackers: Often referred to as crackers, these hackers are skilled
    criminal experts who write some of the hacking tools, including the scripts and
    other programs that the script kiddies and security professionals use. These folks
    also write malware to carry out their exploits from the other side of the world.
    They can break into networks and computers and cover their tracks. They can even
    make it look like though someone hacked their victims'' systems. Sometimes, people
    with ill intent may not be doing what is considered to be hacking; nevertheless,
    they''re abusing their privileges or somehow gaining unauthorized access.


    Advanced hackers are often members of collectives that prefer to remain nameless.
    They are very secretive, sharing information with their subordinates (lower-ranked
    hackers in the collectives) only when they deem those subordinates to be worthy.
    Typically, for lower-ranked hackers to be considered worthy, they must possess
    unique information or the gangliche attack by proving themselves through a high-profile
    hack. These hackers are some of your worst enemies in IT. (Okay, maybe they''re
    not as bad as untrained and careless actors they claim. They do go in hand, all!)
    By understanding criminal behavior, you''re simply proactive, solving problems
    before they become problems.


    Security researchers: These are highly technical, publicly known security experts
    who not only monitor and track computer, network, and application vulnerabilities,
    but also write tools and code to exploit them. If these guys didn''t exist, security
    professionals would not have much in the world of open-source and even certain
    commercial security testing tools.


    I follow many of these security researchers on a weekly basis via their blogs,
    Twitter feeds, and articles, and you should too. You can review my blog (https://www.principleogic.com)
    and the appendix of this book, which lists lists of others from which you can
    benefit. Following the progress of these security researchers helps you stay up
    to date on vulnerabilities as well as the latest, greatest security tools. I list
    tools and related resources from various security researchers in the appendix
    and throughout the book.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_43_0.png)


    Hackers can be good (white-hat) and bad (black-hat) hackers. Gray-hat hackers
    are a bit of both. There are also blue-hat hackers, whom software developers invite
    to find security flaws in their systems.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_43_1.png)


    A study from the Black Hat security conference found that IT professionals eventually
    engage in malicious and criminal activity against others. And people wonder why
    IT doesn''t get the respect it deserves!


    Regardless of age and complexity, hackers possess curiosity, bravado, and often
    very sharp minds.


