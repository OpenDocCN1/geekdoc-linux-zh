  md: '# Malware


    Email systems are regularly attacked by malware as viruses and worms. Of the most
    important tests you can run for malware vulnerability is to verify that your antimalware
    software is working.


    > REMEMBER Before you begin testing your antimalware software, make sure that
    you have the latest antimalware software engine and signatures loaded.


    EICAR offers a safe option for checking the effectiveness of your antimalware
    software. Although EICAR is by no means a comprehensive method of testing for
    malware vulnerabilities, it serves as a good, safe start.


    EICAR is a European-based malware think tank that has conjunction with antimalware
    vendors to provide this basic system test. The EICAR test string transmits in
    the body of an email or as a file attachment so you can see how your server and
    workstations respond. You can load this file, which contains the following 68-character
    string, on your computer to see whether your antimalware or malware software detects
    it:


    ```

    X5O!P%AP[4\P54(P^)7CC7]$EICAR-STANDARD-ANTIMALWARE-TEST-FILE!$HH+*

    ```


    > TIP You can download a file with this string from www.eicar.org/non-intended-use.html
    Several versions of the file are available on this site. I recommend testing with
    the zip file to make sure that your antimalware software can detect malware within
    compressed files.


    When you run this test, you may see results from your antimalware software similar
    to Figure 14-11.


    Virus Alert

    Antivirus has detected and removed a virus from your computer

    Object Name: $Eicar.com

    Virus Name: EICAR Test String

    Action Taken: The file was automatically deleted.


    FIGURE 14-11: Using the EICAR test string to test antimalware software.


    In addition to testing your antimalware software, you can attack email systems
    using other tools that I cover in this book. Metasploit (https://www.metasploit.com)
    enables you to discover missing patches in Exchange and other servers that hackers
    could exploit. Brutus (https://www.hoobie.net/brutus) enables you to test the
    cracking of POP3/IMAP passwords, and for webmail systems, web passwords.


    REMEMBER


    268 PART 5 Hacking Applications'
