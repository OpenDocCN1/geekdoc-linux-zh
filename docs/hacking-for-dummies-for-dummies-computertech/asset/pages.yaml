  md: 'If you want to see traffic similar to what a network-based IPS sees, you should
    connect the network analyzer to a hub or switch monitor port — or even a network
    tap — outside of the firewall, as shown in Figure 9-7. This way, your testing
    enables you to view:


    +   * What''s entering your network before the firewall filters eliminate the
    traffic.

    * What''s leaving your network after the traffic passes through the firewall.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_156_0.png)


    Whether you connect your network analyzer inside or outside of your firewall,
    you see immediate results. The amount of information returned can be overwhelming,
    but you can look for these issues first:


    +   **Odd traffic, such as:

    * An unusual amount of ICMP packets.

    * Excessive amounts of multicast or broadcast traffic.

    * Protocols that aren''t permitted by policy or shouldn''t exist, given your current
    network configuration.


    +   **Internet use habits, which can help point out malicious behavior of a rogue
    insider or system that has been compromised, such as:

    * Email

    * Web surfing and social media

    * Use of Tor

    * Instant messaging and other P2P traffic'
