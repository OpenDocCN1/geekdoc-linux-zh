    # # Discovering Wireless Networks


    When you have a wireless card and wireless testing software, you''re ready to
    roll. The first tests you should perform gather information about your wireless
    network, as described in the following sections. Be sure to perform these checks
    on your production wireless networks, guest wireless networks, and even test wireless
    systems that you may be using. You never know where the vulnerabilities are lurking!


    # # Checking for worldwide recognition


    The first test requires only the media access control (MAC) address of your AP
    and access to the Internet. You can find out more MAC addresses in "MAC spoofing"
    later in this chapter). You''re testing to see whether someone has covered your
    Wi-Fi signal and posted information about it for the world to see. Here''s how
    the test works:


    +   1. Find your AP''s MAC address.


    If you''re not sure what your AP''s MAC address is, you should be able to view
    it by using the arp — command at a Windows command prompt. You have to ping the
    access point''s IP address first that the MAC address is loaded into your Address
    Resolution Protocol (ARP) cache. Figure 10-1 shows what this process can look
    like.


    FIGURE 10-1: Finding the MAC address of an AP using arp.


    | C:\> arp -a | Interface: 10.11.12.203 on Interface eth0 Physical Address Type
    |

    | 10.11.12.203 00-0b-8d-ad-be-ef static |


    +   2. After you have the AP''s MAC address, browse to the WIGLE database of wireless
    networks (https://wigle.net).


    +   3. Register with the site that you can perform a database query. Performing
    this query is worthwhile.'
