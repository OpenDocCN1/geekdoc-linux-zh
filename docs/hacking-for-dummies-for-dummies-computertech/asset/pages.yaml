- img_proc: true
  md: 'Following are a couple of advanced queries that you can enter directly in the
    Google search field:


    +   - **site:hostname keywords:** This query searches for any keyword you list,
    such as SSN, **confidential**, or credit card. An example would be


    ```

    site:www.principleogic.com speaker

    ```


    +   - **filetype:file-extension site:hostname:** This query searches for specific
    file types on a specific website, such as doc, pdf, db, dbf, and zip. These file
    types may contain sensitive information. An example would be


    ```

    filetype:pdf site:www.principleogic.com

    ```


    Other advanced Google operators include:


    +   - **allintitle** searches for keywords in the title of a web page.

    - **inurl** searches for keywords in the URL of a web page.

    - **related** finds pages similar to this web page.

    - **link** shows other sites that link to this web page.


    You can find specific definitions and more at **www.googleguide.com/advanced_operators.html**.
    Many vulnerability scanners also perform checks against the Google Hacking Database
    (GHDB) site (https://www.exploit-db.com/google-hacking-database).


    > When sitting through your site with Google, be to look for sensitive information
    about your servers, network, and organization in Google Groups (http://groups.google.com),
    which is the Usenet archive, and new sewers such as Reddit and Quora. I''ve found
    online postings that reveal too much about the internal network and business systems;
    the sky is the limit. If you find something that doesn''t need to be there, you
    can work with Google to have it edited or removed. For more information, see Google''s
    Contact us at https://www.google.com/intl/en/contact.


    Looking at the bigger picture of web security, Google hacking is limited, but
    if you''re really into it, check out Johnny Long''s book Google Hacking for Penetration
    Testers (Syngress).'
