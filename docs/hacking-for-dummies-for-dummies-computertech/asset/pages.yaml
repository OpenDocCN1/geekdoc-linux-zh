- img_proc: true
  md: '# MANUAL ANALYSIS REQUIRED!


    I can''t stress how important it is to perform manual analysis of websites and
    applications by using a good,old-fashioned web browser. You certainly can''t live
    without web vulnerability scanners, but you''d better not depend on them to find
    everything, because they won''t. Common security vulnerabilities that you must
    check for include:


    +   * Specific password requirements, including whether complexity is enforced.

    * Whether intruder lockout occurs after a certain number of failed login attempts.

    * Whether encryption (ideally, Transport Layer Security [TLS]) Version 1.2 or
    later) is used to protect user sessions, especially logins.

    * User session handling, ideally confirming that sessions are changed after login
    and whether sessions time out after a reasonable period.

    * File upload capabilities and whether malware can be uploaded to the system.


    You don''t necessarily have to perform manual analysis of your websites and applications
    every time you test, but you need to do it periodically — at least once or twice
    a year. Don''t ever convince yourself! In the meantime, using a tool such as a
    file integrity monitoring tool can help determine if web servers change and,,
    may secure your account.


    # Crawlers


    A spider program such as the free HTTrack Web Copier (https://www.httrack.com)
    can crawl your project to look for every accessible file. To use HTTrack, load
    your project a name, and tell HTTrack which website(s) to mirror. After a few
    minutes and possibly hours (depending on the size and complexity of the site),
    you''ll have everything that''s publicly accessible on the site stored on your
    drive c:\My Web Sites. Figure 15-1 shows the crawl output of a basic website.


    Complicated sites often reveal a lot more information that shouldn''t be there,
    including old data files and application scripts and source code.


    Inevitably, when performing vulnerability and penetration testing, I stumble across
    .zip or .rar files on web servers. Sometimes, these files contain junk, they often
    hide sensitive information that the public shouldn''t be able to access. One project
    in particular stands out. When I ran across a .zip file and tried to open it,
    WinZip asked me for a password. Using my handy-dandy .zip file password-cracking
    tool from ElcomSoft (see Chapter 8 for details on password cracking),


    PART 5 Hacking Applications'
