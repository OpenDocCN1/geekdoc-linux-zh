- img_proc: true
  md: 'A failed login counter can increase password security and minimize the overall
    effects of account lockout if the account experiences an automated attack. A login
    counter can force a password change after a certain number of failed attempts.
    If the number of failed login attempts is high and has occurred over a short period,
    the account has likely experienced an automated password attack.


    Other password-protection countermeasures include:


    +   - **Stronger authentication methods:** Examples are challenge/response, smart
    cards, biometrics, and digital certificates.

    - **Automated password reset:** This functionality lets users manage most of their
    password problems without getting others involved. Otherwise, this support issue
    becomes expensive, especially for larger organizations.

    - **Password-protected system BIOS:** This countermeasure is especially important
    on servers and laptops that are susceptible to physical security threats and vulnerabilities.


    # Securing Operating Systems


    You can implement various operating-system security measures to ensure that passwords
    are protected.


    > Regularly perform these low-tech and high-tech password-cracking tests to make
    sure your passwords are as secure as possible — perhaps as part of a monthly,
    quarterly, or biannual audit of local and domain passwords.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_135_0.png)


    # Windows


    The following countermeasures can prevent password hacks on Windows systems:


    +   - Some Windows passwords can be gleaned by reading the clear text or crackable
    cipher text from the Windows Registry. Secure your registries by doing the following:

    - Allow only administrator access.

    - Harden the operating system by using well-known hardening practices, such as
    those from SANS (https://www.sans.org/critical-security-controls), NIST (https://csrc.nist.gov),
    the Center for


    CHAPTER 8 Passwords 121'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'Internet Security Benchmarks/Scoring Tools (https://www.cisecurity.org), and
    the ones outlined in Network Security For Dummies, by Cheyb Cobb (John Wiley &
    Sons, Inc.).


    +   Keep all SAM database backup copies secure.


    +   Disable the storage of LM hashes in Windows for passwords that are shorter
    than 15 characters.


    You can, for example, create and set the NoLMHash registry key to a value of 1
    under HKEY_LOCAL_MACHINE\SYSTEM\ControlSet\Control\lsa.


    +   Use local or group security policies to help eliminate weak passwords on Windows
    systems before they''re created.


    +   Disable null sessions in your Windows or enable the Windows Firewall.


    +   In Windows XP and later versions, enable the Do Not Allow Anonymous Enumeration
    of SAM Accounts and Shares option in the local security policy.


    Chapter 12 covers Windows hacks that you need to understand and test in detail.


    # Linux and Unix


    The following countermeasures can help prevent password cracks on Linux and Unix
    systems:


    +   Ensure that your system is using shadowed MDS passwords.


    +   Help the prevention of weak passwords. You can use the built-in operating
    system password filtering (such as cracklib in Linux) or a password-auditing program
    (such as npswpass or passwd+).


    +   Check your /etc/passwd file for duplicate UID entries. Hackers can exploit
    these entries to gain backdoor access.


    Chapter 13 explains the Linux hacks and how to test Linux systems for vulnerabilities.'
