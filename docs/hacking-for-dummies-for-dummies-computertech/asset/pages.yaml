  md: '# Taking other countermeasures


    Here are some password hacking countermeasures that I recommend:


    +   * Enable security auditing to help monitor and track password attacks.

    You can''t possibly manage this part of your security program if you''re not looking
    out for attacks.


    +   * Test applications to make sure they aren''t storing passwords indefinitely
    in memory or writing them to disk. A good tool for this is WinHex (www.winhex.com/index-m.html).
    I used this tool to search a computer''s memory for keywords as password, login,
    and so on, and have come up some passwords that the developers thought cleared
    from memory.


    Some password-cracking Trojan-horse applications are transmitted through worms
    or simple email attachments. Such malware can be lethal to your password-protection
    mechanisms if they are installed on your systems. The best defense is malware
    protection or whitelisting of Webroot, McAfee, or Bit9.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_134_0.png)


    +   * Keep your systems patched. Passwords are reset or compromised during overflows
    or other denial of service (DoS) conditions.


    +   * Know your user IDs. If an account has never been used, delete or disable
    the account until it''s needed. You can determine unused accounts by manual inspection
    or by using a tool as DumpSec (https://www.systemtools.com/comasoft/tcomasoft.com,
    a tool that can enumerate the Windows operating system and gather user IDs and
    other information.


    As the security manager in your organization, you can enable lockout to prevent
    password-cracking attacks. Account lockout is the ability to lock user accounts
    for a certain time after a number of failed login attempts has occurred. Most
    operating systems (and some applications) have this capability. Don''t set it
    too low (fewer than five failed logins), and don''t set it too high to give a
    malicious user a greater chance of breaking in. Somewhere between 5 and 50 may
    work. I usually recommend a setting of 10 or 15. Consider the following when configuring
    lockout on your systems:


    +   * Use account lockout to prevent any vulnerabilities of user DoS condition,
    require two different passwords, and don''t set a lockout for the first one if
    that feature is available in your operating system.


    +   * If you permit autoreset of the account after a certain period — often referred
    to as intruder lockout — not a short time period. Thirty minutes works well.'
