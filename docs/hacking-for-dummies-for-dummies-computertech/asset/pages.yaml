  md: 'Many return useful banner information when you connect to a service or application
    running on a port. If you Telnet to an email server on port 25 by entering telnet
    mail.your_domain.com 25 at a command port, you may see something like this:


    ```

    220 mail.your_domain.com SMTP all_the_version_info_

    you_need_to_hack Ready

    ```


    Most servers return detailed information, such as the version and the current
    service pack installed. After you have this information, you (and the bad guys)
    can determine the vulnerabilities of the system from one of the websites listed
    in the next section.


    An email to an invalid address may return with detailed header information. A
    bounced message discloses information that can be used against you, including
    internal IP addresses and software versions. On certain Windows systems, you can
    use this information to establish unauthenticated connections and sometimes even
    map drives. I cover these issues in Chapter 12.


    # Assessing Vulnerabilities


    After finding potential security holes, the next step is confirming whether they’re
    vulnerabilities in the context of your environment. Before you test, perform manual
    searching. You can research websites and vulnerability databases, such as these:


    +   - Common Vulnerabilities and Exposures (http://cve.mitre.org/cve)

    - US-CERT Vulnerability Notes Database (www.kb.cert/vuls)

    - NIST National Vulnerability Database (https://nvd.nist.gov)


    These sites list known vulnerabilities — at least, the formally classified ones.
    As I explain in this book, many other vulnerabilities are more generic in nature
    and can''t be easily classified. If you can find a vulnerability documented on
    one of these sites, search the vendor''s site. You can also find a list of commonly
    exploited vulnerabilities at https://www.sans.org/critical-security-controls.
    This site contains the SANS Critical Security Controls consensus list, which is
    compiled and updated by the SANS organization.'
