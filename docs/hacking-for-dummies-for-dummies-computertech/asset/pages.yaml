  md: '# Identifying Basic Physical Security Vulnerabilities


    Regardless of your security technology, practically any breach is possible if
    an attacker is in your building or data center. That''s why looking for physical
    security vulnerabilities and fixing them before they''re exploited is so important.


    In small companies, some physical security issues may not be a problem. Many physical
    security vulnerabilities depend on such factors as:


    +   * Size of building.

    * Number of buildings or office locations.

    * Number of employees.

    * Presence of a receptionist or security guard.

    * Location and number of building entrance and exit points.

    * Placement of server rooms, wiring closets, and data centers.


    Thousands of possible physical security እንደሚ exist. The bad guys are always on
    the lookout for them, so you should look for these first. Here are some examples
    of physical security vulnerabilities I''ve found when performing security assessments
    for my clients:


    +   * No receptionist or guard to monitor who''s coming and going.

    * No sign-in or escort (or enforced) for building access.

    * Employees belong overly visiting of trusted visitors because they wear uniforms
    or say that they''re in the building to work on the copier or computers.

    * No access controls on or the use of traditional keys that can be duplicated
    with no accountability.

    * Doors popped open.

    * IP-based video, access control, and data center management systems accessible
    via the network with default user IDs and passwords.

    * Publicly-accessible computer rooms.

    * Unsecured backup media such as tapes, hard drives, and CDs/DVDs (remember those
    things?).

    * Sensitive information stored in hard-copy format lying around cubicles rather
    than stored in locking filing cabinets.'
