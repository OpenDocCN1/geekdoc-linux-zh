  md: '# Chapter 6


    # Social Engineering


    Social engineering takes advantage of one of the weakest links in any organization''s
    information security defenses: people. Social engineering hacking: involves maliciously
    exploiting the trusting nature of human beings to obtain information that can
    be used for personal gain.


    Social engineering is one of the toughest hacks to perpetrate because it takes
    bravado and skill to come across trustworthy to a stranger. It''s also by far
    the toughest thing to protect against, because people are making their own security
    decisions involved.


    In this chapter, I explore the consequences of social engineering, techniques
    for your own security testing efforts, and specific countermeasures to defend
    against social engineering.


    # Introducing Social Engineering


    In a social engineering scenario, those with intent pose as someone else to gain
    information that they likely couldn''t access otherwise. Then they take the information
    they obtain from their victims and wreak havoc on network resources, steal or
    delete files, and even commit corporate espionage or some other form of fraud
    against the organization they attack. Social engineering is different from physical
    security exploits, such as shoulder surfing and dumpster diving, but the two types
    of hacking are related and often used in tandem.


    +   IN THIS CHAPTER

    >> Understanding social engineering

    >> Examining the ramifications of social engineering

    >> Performing social engineering tests

    >> Protecting your organization against social engineering'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'Here are some examples of social engineering:


    +   - **Support personnel** claiming they need to install a patch or new version
    of software on a user''s computer, talking the user into downloading the software,
    and obtaining remote control of the system.


    +   - **Venders** needing to update the organization''s accounting package or
    phone system, asking for the administrator password, and obtaining full access.


    +   - **Employees** notifying the security desk that they have lost their access
    badge to the data center, receiving a set of keys from security, and obtaining
    unauthorized access to physical and electronic information.


    +   - **Phishing emails** sent to gather the user IDs and passwords of unsuspecting
    recipients or to plant malware on their computers. These attacks can be generic
    in nature or more targeted — called spearphishing attacks. The criminals use these
    login credentials or malware to gain access to the network, capture intellectual
    property, encrypt files for ransom, and so on.


    Sometimes, social engineers act like confident, knowledgeable managers and executives.
    At other times, they play the roles of extremely uninformed or naïve employees.
    They may also pose as others, such as IT consultants or maintenance workers. Social
    engineers are great at adapting to their audience. It takes a special type of
    personality to pull this trick off, resembling that of a sociopath.


    Effective information security — especially the required for fighting social engineering
    — often begins and ends with your users. Other chapters in this book provide advice
    on technical controls that can help fight social engineers, and interaction have
    a profound effect on the level of security in your organization at any given time.
    The candy-security analogy is “Hard, crunchy outside; soft, chewy. The hard, crunchy
    outside is the layer of mechanisms — such as firewalls, intrusion prevention systems,
    and content filtering — that organizations typically rely to secure their information.
    The soft, chewy inside are the people and the processes inside the organization.
    If the bad guys get past the thick outer layer, they can compromise the (mostly)
    defenseless inner layer.


    # Starting Your Social Engineering Tests


    I approach the testing methodologies in this chapter بمعنى from the way I approach
    them in subsequent chapters. Social engineering is an art and science. Social
    engineering takes skill to perform as a security professional'
  merge: -1
