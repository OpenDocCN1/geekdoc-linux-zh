  md: '# MAC address spoofing


    MAC address spoofing tricks the switch into thinking that your computer is something
    else. You simply change your computer''s MAC address and masquerade as another
    user.


    You can use this to test access control systems, such as your IPS/firewall and
    even your operating-system login controls that check for specific MAC addresses.


    # LINUX-BASED SYSTEMS


    In Linux (and Unix), you can spoof MAC addresses with the ifconfig utility. Follow
    these steps:


    +   1. While you''re logged in as root, use ifconfig to enter a command that disables
    the network interface.


    Insert the network interface number that you want to disable (usually, eth0) into
    the command, like this:


    ```

    [root@localhost root]# ifconfig eth0 down

    ```


    +   2. Enter a command for the MAC address you want to use.


    Insert the fake MAC address and the network interface number (eth0) into the command
    again, like this:


    ```

    [root@localhost root]# ifconfig eth0 hw ether

    new_mac_address

    ```


    You can use a more feature-rich utility GNU MAC Changer (https://github.com/alobbs/macchanger)
    for Linux systems.


    # WINDOWS


    You can use regedit to edit the Windows Registry, but I like using a neat Windows
    utility SMAC (www.klconsulting.net/smac), which makes MAC spoofing a simple process.
    Follow these steps to use SMAC:


    +   1. Load the program.


    +   2. Select the adapter for which you want to change the MAC address.


    +   3. Enter the new MAC address in the New Spoofed MAC Address fields, and click
    the Update button.'
  merge: -1
  pgno: 164
