  md: '# Show Value in Your Efforts


    This endeavor is where the rubber meets the road. If you can demonstrate that
    what you''re doing offers value on an ongoing basis, you can maintain a good pace
    and not have to keep pleading to keep your security testing program going. Keep
    these points in mind:


    +   **Document your involvement in IT and security, and create ongoing reports
    for management regarding the state of security in the organization.** Give management
    examples of how the organization''s systems are (or will be) secured against attacks.

    - **Outline tangible results as a proof of concept.** Show security assessment
    reports that you''ve created or scanner results from the security tools you intend
    to use.

    - **Treat doubts, concerns, and objections by management and users as requests
    for more information.** Find the answers, and see to these as opportunities to
    further sell your efforts.


    # Be Flexible and Adaptable


    Prepare yourself for skepticism and rejection. As hot as security is today, rejection
    still happens, especially from top-level managers who are disconnected from IT
    and security in the organization. A middle-management structure that leaves creativity
    is a party to the problem as well.


    Don''t get defence. Security is a long-term process, not a short-term assessment,
    product, or service. Start small. Use a limited amount of resources budget, tools,
    and time — and then build the program over the long haul.


    Psychological studies have found that new ideas presented casually and without
    pressure are more likely to be considered and accepted than ideas that are from
    people under a deadline. If you focus on your approach at least as much as you
    focus on the content of what you''re presenting, you can often get people on your
    side, and in return, you''ll accomplish a lot more with your security program.


    > REMEMBER

