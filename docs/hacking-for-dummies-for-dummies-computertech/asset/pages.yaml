  md: '# HACKING IN THE NAME OF LIBERTY?


    Many hackers exhibit behaviors that contradict their stated purposes. They fight
    for civil liberties and want to be left alone, but at the same time, they love
    prying into the business of others and controlling them in any way possible. Many
    hackers call themselves civil libertarians and claim to support the principles
    of personal privacy and freedom, but they contradict their words by intruding
    on the privacy and property of other people. They steal the property and violate
    the rights of others but go to great lengths to get their own back from anyone
    who threatens them. The situation is "live and let" gone awry.


    The case involving copyrighted materials and the Recording Industry Association
    of America (RIAA) is a classic example. Hackers have gone to great lengths to
    prove a point, defacing the websites of organizations that support copyrights
    and sharing music and software themselves. Go figure.


    The same goes for malicious users. Typically, their criminal activity goes unnoticed,
    but if they''re caught, the security breach may be kept hush-hush in the name
    of protecting shareholder value or notifying any customer or business-partner
    feathers. Information security and privacy laws and regulations, are changing
    this situation, because in most cases, breach notification is required. Sometimes,
    the malicious user is fired or asked to resign. Although public cases of internal
    breaches are becoming more common (usually through breach disclosure laws), these
    cases don''t give a full picture of what''s taking place in the average organization.


    Whether or not they want to, most executives now have to deal with all the state,
    federal, and international laws and regulations that require notifications of
    breaches or suspected breaches of sensitive information. These requirements apply
    to external hacks, internal breaches, and even seemingly benign things such as
    lost mobile devices and backup tapes. The appendix lists the information security
    and privacy laws and regulations that may affect your business.


    # Planning and Performing Attacks


    Attack styles vary widely:


    +   Some hackers prepare far in advance of an attack. They gather small bits of
    information and methodically carry out their hacks, as I outline in Chapter 4.
    These hackers are the most difficult to track.


    CHAPTER 2 Cracking the Hacker Mindset 33'
