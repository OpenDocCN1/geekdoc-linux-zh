  md: '# THINKING ABOUT HIRING

    A REFORMED HACKER?


    Former hackers — I’m referring to the black-hat hackers who have hacked into computer
    systems in the past and ended up serving time in prison — can be very good at
    what they do. No doubt some of them are very smart. Many people swear by hiring
    reformed hackers to do their testing. Others compare this practice to hiring the
    proverbial fox to guard the henhouse. If you''re thinking about bringing in a
    former (un)ethical hacker to test your systems, consider these issues:


    +   - Do you want to reward malicous behavior with your organization’s business?

    - A hacker who claims to be honest isn’t necessarily. He or she could have deep-rooted
    psychological issues or character flaws that you’re going to have to contend with.
    *Buyer, beware!*


    +   - Information gath-hered and accessed during security assessments is some
    of the most sensitive information your organization possesses. If this information
    gets into the wrong hands, even ten years down the road, it could be used against
    you. Some hackers and reformed criminals hang out in social groups. You may not
    want your information to be shared in circles.


    That said, everyone deserves a chance to explain what happened in the past. Zero
    tolerance is senseless. Listen to the hacker’s story, and use common-sense discretion
    about you trust the person to help you. The supposed black-hat hacker may have
    been a gray-hat hacker or a misguided white-hat hacker who would fit well in your
    organization. It’s your call. Just be prepared to defend your decision when the
    time comes.


    # Instilling a Security-Aware Mindset


    Your network users are your first and last line of defense. Make sure that your
    security testing efforts and the money spent on your information security initiatives
    aren’t wasted because a simple employee slip-up gave a malicious attacker the
    keys to the kingdom.


    The following elements can help establish a security-aware culture in your organization:


    +   - Make security awareness and ongoing training an active process among all
    employees and users on your network, including management and contractors. One-time
    training when employees are hired is enough.


    336 PART 6 Security Testing Aftermath'
  merge: -1
  pgno: 350
- img_proc: true
