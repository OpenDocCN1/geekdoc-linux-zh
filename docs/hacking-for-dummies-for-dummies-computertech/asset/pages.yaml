    the plan overly complex. A well-defined scope includes the following information:


    +   **Specific systems to be tested:** When selecting systems to test, start with
    the most critical systems and processes or the ones that are the most vulnerable.
    You could test OS passwords, test an Internet-facing web application, or attempt
    social engineering via email phishing before drilling down into all systems.


    +   **Risks involved:** Have a contingency plan for your security testing process
    in case something goes awry. Suppose you''re assessing your firewall or web application,
    and you take it down. This situation can cause unavailability, which can reduce
    system performance or employee productivity. Worse, it might cause loss of data
    integrity, loss of data itself, and bad publicity. It could most certainly take
    off a person or two and make you look bad. All of these can create risks.


    Handle social engineering and DoS attacks carefully. How might they affect the
    people and systems you test.


    +   **Dates when the tests will be performed and overall timeline:** When the
    tests are to be performed is something you must think long and hard about. Decide
    whether to perform testing during normal business hours, or late at night or early
    in the morning so that production systems aren''t affected. Involve others to
    make sure that they approve of your timing.


    You may get pushed and suffer Dos-related consequences, the best approach is an
    unlimited attack, in which any type of test is possible at time of day. The bad
    guys aren''t breaking into your systems within a limited scope, so why would you?
    Some exceptions to this approach are performing all-out DoS attacks, social engineering,
    and physical security tests.


    +   **Whether you intend to be detected:** One of your goals may be to perform
    the tests without being detected. You might perform your tests on remote systems
    or a remote office and don''t want the users to be aware of what you''re doing.
    Otherwise, the users or IT staff may catch on you and to be on your best behavior
    instead of their normal behavior.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_33_0.png)


    TIP


    +   **Whether to leave security controls enabled:** An important, yet-overlooked,
