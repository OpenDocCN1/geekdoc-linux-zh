  md: 'When assessing security and responding to security incidents, a network analyzer
    can help you do the following:


    When your network behaves erratically, a network analyzer can help you track and
    isolate malicious network use, detect malicious Trojan-horse applications, and
    monitor and track down DOS attacks.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_155_0.png)


    # Network analyzer programs


    You can use one of the following programs for network analysis:


    +   * Omnipeek (https://www.savius.com) is one of your favorite network analyzers.
    It does everything I need and more, and it''s very simple to use.

    * CommView (https://www.tamos.com/products/commview) is a great, low-cost, Windows-based
    alternative.

    * Cain & Abel (https://www.oxid.it/cain.html) is a free multifunctional password-recovery
    tool for performing ARP poisoning, capturing packets, cracking passwords, and
    more.

    * Wireshark (//wireshark.org), formerly known as Ethereal, is a free alternative.
    I download and use this tool if I need a quick fix and don''t have my laptop nearby.
    It''s not user-friendly as many of the commercial products, but it''s very powerful
    if you''re willing to master its ins and outs. Wireshark is available for Windows
    and macOS X.

    * ettercap (http://ettercap.github.io/) is another powerful (and free) utility
    for performing network analysis and more on Windows, Linux, and other operating
    systems.


    Here are a few cates for using a network analyzer:


    +   * To capture all traffic, you must connect the analyzer to one of the following:

    * A hub on the network.

    * A monitor/span/mirror port on the switch.

    * A switch that you''ve performed an ARP poisoning attack on.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_155_1.png)


