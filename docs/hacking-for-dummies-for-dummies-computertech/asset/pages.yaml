  md: '# IN THIS CHAPTER

    » Selecting tools

    » Scanning network hosts

    » Assessing security with a network analyzer

    » Preventing denial of service and infrastructure vulnerabilities


    # Chapter 9

    Network Infrastructure Systems


    To have secure operating systems and applications, you need a secure network.
    Devices such as routers, firewalls, and even generic network hosts (including
    servers and workstations) must be assessed as part of the security testing process.


    Thousands of possible network vulnerabilities exist, along with equally many tools
    and even more testing techniques. You probably don''t have the time or resources
    available to test your network infrastructure systems for all possible vulnerabilities,
    using every method imaginable. Instead, you need to focus on tests that produce
    a good overall assessment of your network. The tests I describe in this chapter
    produce exactly.


    You can eliminate many well-known, network-related vulnerabilities by simply patching
    your network hosts with the latest vendor software and firmware updates. Because
    many network infrastructure systems aren''t publicly accessible, odds are good
    that your network won''t be attacked from the outside. You can eliminate many
    other vulnerabilities by following some solid security practices on your network,
    as described in this chapter. The tests, tools, and techniques outlined in this
    chapter offer the most bang for your security assessment buck.'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'The better you understand network protocols, the easier network vulnerability
    testing is because network protocols are the foundation for most information security
    concepts. If you''re a little fuzzy on how networks work, I highly encourage you
    to find a copy of TCP/IP For Dummies, 6th Edition, by Cande Leiden and Harald
    Wilkins (John Wiley & Sons, Inc.). TCP/IP For Dummies is one of the books that
    helped me develop my foundation of networking concepts. The Request for Comments
    (RFCs) on the Official Internet Protocol Standards page, www.rfc-editor.org/standards,
    is a good reference as well.


    # Understanding Network Infrastructure Vulnerabilities


    Network infrastructure vulnerabilities are the foundation of most technical security
    in your information systems. These lower-level vulnerabilities affect practically
    everything on your network, is why you need to test for and eliminate them whenever
    possible.


    Your focus for security tests on your network infrastructure should be find weaknesses
    that others can see in your network so you can quantify and treat your network''s
    level of exposure.


    Many issues are related to the security of your network infrastructure. Some issues
    are technical and you need to use various tools to assess them properly; you can
    assess others with a good pair of eyes and some logical thinking. Some issues
    are easy to see from outside the network, and others are easier to detect from
    inside your network.


    When you assess your company''s network infrastructure security, you need to look
    at the following:


    +   - Where devices, such as a firewall or an intrusion prevention system (IPS),
    are placed on the network and how they''re configured.

    - External attackers see when they perform port scans and how they can exploit
    vulnerabilities in your network hosts.

    - Network design, such as Internet connections, remote access capabilities, layered
    defenses, and placement of hosts on the network.

    - Interaction of installed security devices, such as firewalls, IPSes, and antivirus.

    - What protocols are in use, including known-vulnerable ones such as Secure Socket
    Layer (SSL).'
