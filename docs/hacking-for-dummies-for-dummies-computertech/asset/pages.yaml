  md: 'Password-cracking utilities take a set of known passwords and run through a
    password-hashing algorithm. The resulting encrypted hashes are compared at lightning
    speed with the password hashes extracted from the original password database.
    When a match is found between the newly generated hash and the hash in the original
    database, the password has been cracked. The process is that simple.


    Other password-cracking programs attempt to log on by using a predefined set of
    user IDs and passwords. This method is how many dictionary-based cracking tools
    work, as Brutus (www.hoobie.net/brutus) and SQLPing (www.security.com/downloads).
    I cover web application and database passwords in chapters 15 and 16.


    Passwords that are subjected to cracking tools eventually lose. You have access
    to the same tools as the bad guys. You want to benefit security assessments and
    malicious attacks. You want to find password weaknesses before the bad guys do.
    In this section, I show you some of my methods for assessing Windows and Linux/Unix
    passwords.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_118_0.png)


    # KNOW WHERE YOUR PASSWORDS LIE


    Password storage locations vary by operating system. Windows usually stores passwords
    in these locations:


    +   * Security Accounts Manager (SAM) database (c: \windows\system32\config)

    * Active Directory database file stored locally or across domain controllers (ntds.dit).


    Windows may also store passwords in a backup of the SAM file in the c: \winnt\repair
    directory.


    Some applications store passwords in the Registry or as plain-text files on the
    hard drive. A simple registry or file-system search for "password" may uncover
    just what you''re looking for.


    Linux and other Unix variants typically store passwords in these files:


    +   * /etc/passwd (readable by everyone)

    * /etc/shadow (accessible by the system and the root account only)

    * /etc/security/passwd (accessible by the system and the root account only)


    104 PART 2 Putting Security Testing in Motion'
