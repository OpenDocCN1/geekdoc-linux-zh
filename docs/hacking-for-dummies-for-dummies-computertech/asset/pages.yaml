    # Countermeasures against MAC spoofing


    The easiest way to prevent the circumvention of MAC address controls and subsequent
    unauthorized access to your wireless network is to enable WPA2 or the forthcoming
    WPA3. Another way to control MAC spoofing is to use a wireless intrusion prevention
    system. The second option is certainly more costly, but it could be worth the
    money when you consider the other proactive monitoring and blocking benefits such
    a system would provide.


    # Physical security problems


    Various physical security vulnerabilities can result in physical theft, the refiguration
    of wireless devices, and the capture of confidential information.'
