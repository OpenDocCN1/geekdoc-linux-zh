  md: '# SECURITY TESTING CERTIFICATIONS


    If you perform vulnerability and penetration tests and want to add another certification
    to your credentials, you may want to consider becoming a Certified Ethical Hacker
    (C| EH) through a certification program sponsored by EC-Council. See www.eccouncil.org
    for more information, Licensed Information Systems Security Professional (CISSP),
    the C| EH certification is a well-known, respected certification in the industry,
    accredited by the American National Standards Institute (ANSI 17024).


    Other options include the SANS Global Information Assurance Certification (GIAC)
    program, IACRB Certified Penetration Tester (CPT), and the Offensive Security
    Certified Professional (OSCP) program, which has a hands-on security testing certification.
    I love that approach, as too often, people who perform this type of work don''t
    have the hands-on experience with the tools and techniques to do it well. See
    www.giac.org and www.offensive-security.com for more information.


    Conversely, security assessments based on ethical hacking focus on vulnerabilities
    that can be exploited. This testing validates that security controls don''t exist
    or are ineffective. This vulnerability and penetration testing can be both highly
    technical and nontechnical, although it involves the use of formal methodology,
    it tends to be a bit less structured than formal auditing. Where auditing is required
    (such as SSAE 16 SOC 1/2 audits and the ISO 27001 certification) in your organization,
    you might consider integrating the vulnerability and penetration testing techniques
    I outline in this book into your IT/security audit program. Auditing and vulnerability
    and penetration testing complement one really well.


    # Security considerations


    If you choose to make vulnerability and penetration testing an important part
    of your business''s information risk management program, you really need to have
    a documented security testing policy. Such a policy outlines who''s doing the
    testing, the general type of testing that''s performed, and how often the testing
    takes place. Specific procedures for carrying out your security tests could outline
    the methodologies I cover in this book. You might also consider creating a security
    standards document that outlines the specific security testing tools used and
    the specific people performing the testing. You could establish standard testing
    dates, as once per quarter for external systems and biannual tests for internal
    systems — whatever works for your business.'
