    # In-Depth Testing Brings Out the Worst in Your Systems


    Someone walking around doing a self-assessment or high-level audit can find security
    best practices that you''re missing, but he isn''t going to find most of the security
    flaws that in-depth security vulnerability and penetration testing is going to
    uncover. The testing methods I outline in this book bring out the warts and all.


    # Combined Vulnerability and Penetration Testing Is What You Need


    Penetration testing by itself is rarely enough to find everything in your systems,
    because the scope of traditional penetration testing is simply too limited. The
    same goes for basic vulnerability scans. When you combine both approaches, get
    the most bang for your buck.


    # Proper Testing Can Uncover Overlooked Weaknesses


    Performing the proper security assessments not only uncovers technical, physical,
    and human weaknesses, but also reveals root causes with IT and security operations,
    such as patch management, change management, and lack of user awareness. Otherwise,
    you may not find these weaknesses until it''s too late.'
