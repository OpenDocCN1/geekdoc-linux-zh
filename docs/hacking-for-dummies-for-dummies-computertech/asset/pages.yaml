  md: '# Where to Go from Here


    The more you know about external hackers and rogue insiders inside and how your
    systems should be tested, the better you''re able to secure your computer and
    network systems. This book provides the foundation you need to develop and maintain
    a successful security assessment and vulnerability management program to minimize
    business risks.


    Depending on your computer and network configurations, you may be able to skip
    certain chapters. For example, if you aren''t running Linux or wireless networks,
    you can skip those chapters. Just be careful. You may think you''re not running
    certain systems, but they could very well be on your network, somewhere, waiting
    to be exploited.


    Keep in mind that the high-level concepts of security testing won''t change as
    often as the specific vulnerabilities you protect against. Vulnerability and penetration
    testing will always remain both an art and a science in a field that''s ever-changing.
    You must keep up with the latest hardware and software technologies, along with
    the various vulnerabilities that come about day after day and month after month.


    You won''t find a single best way to hack your systems, so tweak this information
    to your heart''s content, and happy hacking!


