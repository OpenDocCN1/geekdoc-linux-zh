    # # Office layout and use


    Office design and use can help or hinder physical security.


    # # Attack points


    Intruders can exploit various weaknesses around the office. Ask yourself the following
    questions about common attack points:


    +   >> Does a receptionist or security guard monitor traffic in and out of the
    doors of the building?


    +   >> Do employees have confidential information on their desks? Determine whether
    mail and packages lie outside someone''s door — or, worse, outside the building
    — waiting for pickup?


    +   >> Where are trash cans and bins, recycling bins, and shredders located, and
    are they easily accessible? Open recycling bins and other careless handling of
    trash invite so-called diving. People with ill intent often search for confidential
    company information and customer records in the trash, and they''re often successful.
    Accessible trash can create many security exposures.'
