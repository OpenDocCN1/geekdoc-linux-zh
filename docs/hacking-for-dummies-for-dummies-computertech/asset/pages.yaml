- img_proc: true
  md: '# Commercial tools


    I recommend a robust patch-automation application, especially if these factors
    are involved:


    +   - A large network.

    - A network with multiple operating systems (Windows, Linux, Mac OS, and so on).

    - A lot of third-party software applications, such as Adobe and Java.

    - More than a few dozen computers.


    Check out these patch-automation solutions:


    +   - Ecora Patch Manager (www.ecora.com/products/patchmanager.asp)

    - GFI LangGuard (www.gfi.com/products-and-solutions/network-security-solutions/gfi-langguard)

    - PDQ Deploy (https://www.pdq.com/pdq-deploy)


    # Free tools


    Use of these free tools to help with automated patching:


    +   - Windows Server Update Services (https://technet.microsoft.com/en-us/library/cc539281.aspx
    or System Center Configuration Manager (https://www.microsoft.com/en-us/cloud-platform/system-center-configuration-manager/))

    - Windows Update, which is built into Microsoft Windows operating systems.

    - Baseline Security Analyzer (https://www.microsoft.com/en-us/download/details.aspx?id=7558).

    - The built-in patching tools for Linux-based systems (such as Yellowdog Updater,
    Modified (yum), and YaST Online Update).


    # Hardening Your Systems


    In addition to patching your systems, you have to make sure that your systems
    are hardened (locked down) against the security vulnerabilities that patches can''t
    fix. I found that many people stop with patching, thinking that their systems
    are secure, but that''s not the case. Throughout the years, I''ve seen network


    PART 6 Security Testing Aftermath'
