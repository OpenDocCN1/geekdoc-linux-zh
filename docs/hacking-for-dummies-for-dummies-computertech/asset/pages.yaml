    +   >> Categorizing vulnerabilities you discover


    +   >> Documenting and presenting the results


    # Chapter 17


    # Reporting Your Results


    f you''re wishing for a break after testing, now isn''t the time to rest on your
    laurels. The reporting phase of your security assessment is one of the critical
    pieces. The last thing you want to do is run your tests, find security problems,
    and leave the job at that. Put your time and effort to get good use by thoroughly
    analyzing and documenting what you find to ensure security vulnerabilities are
    eliminated and your information is more secure as a result. Reporting is an essential
    element of the ongoing diligence that information security and risk management
    requires.


