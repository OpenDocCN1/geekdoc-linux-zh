    # Chapter 11

    Mobile Devices


    Mobile computing is popular for business and for hacking. It seems

    eeveryone has a mobile device of some sort for personal or business use

    (usually both). If not properly secured, mobile devices connected to the

    enterprise network represent thousands upon thousands of unprotected islands of

    information floating about, out of your control.


    Because of all the phones, tablets, and laptops running numerous operating

    system (OS) chock-full of apps, an infinite number of risks is associated

    with mobile computing. Rather than delving into all the variables, this chapter

    ores some of the biggest, most common mobile security flaws that could

    afect you and your business.


    # Sizing Up Mobile Vulnerabilities


    It pays to find and fix the low-hanging fruit on your network so that you get
    the

    most for your buck. The following mobile laptop, phone, and tablet weak-

    nesses should be front and center on your priority list:


    +   >> No encryption

