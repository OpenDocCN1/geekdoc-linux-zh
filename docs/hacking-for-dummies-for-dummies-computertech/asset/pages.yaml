  md: 'When trying to crack passwords, the associated user accounts may be locked
    out, which could interrupt your users. Be careful if intruder lockout is enabled
    in your operating systems, databases, or applications. If lockout is enabled,
    you might lock out some or all computer/network accounts, resulting in a denial
    of service situation for your users.


    # Dictionary attacks


    Dictionary attacks quickly compare a set of known dictionary-type words including
    many common passwords — against a password database. This database is a text file
    with hundreds, if not thousands, of dictionary words, typically listed in alphabetical
    order. Suppose that you have a dictionary file that you downloaded from one of
    the sites in the following list. The English-dictionary file at the Purdue University
    site contains one word per line starting with 1oth, all the way to zygote.


    Many password-cracking utilities use a separate dictionary that you create or
    download from the Internet. Here are other popular sites that house dictionary
    files and miscellaneous word lists:


    +   - ftp://cerias.purdue.edu/pub/dict

    - www.outpost9.com/files/WordLists.html


    Don''t forget to use other language files as well, such as Spanish and Klingon.


    Dictionary attacks are only as good as the dictionary you supply to your password-cracking
    program. You can easily spend days or even weeks to crack passwords with a dictionary
    attack. If you don''t set a time limit or a similar expectation going, you''ll
    find that dictionary cracking is a mere exercise in futility. Most dictionary
    attacks are good for weak (easily guessed) passwords. Some special dictionaries,
    have common misspellings or alternative spelling of words, such as pa$$word (password)
    and 5security (security). Additionally, special dictionaries can contain non-English
    words and thematic words from religion, politics, or Star Trek.


    # Brute-force attacks


    Brute-force attacks can crack practically any password, given sufficient time.
    Brute-force attacks try every combination of numbers, letters, and special characters
    until the password is discovered. Many password-cracking utilities let you specify
    testing criteria as the character sets, password length to try, and known characters
    (for a mask attack). Figure 8-1 shows some example brute-force password-cracking
    options.'
