  md: '# Utilities


    When assessing physical security, you must consider building and data center utilities,
    such as power, water, generators, and fire suppression. These utilities can help
    you fight incidents and keep other controls running during a power loss. You have
    to be careful, though, as they can also be used against you if an intruder enters
    the building.


    # Attack points


    Intruders often exploit utility-related vulnerabilities. Ask yourself the following
    questions about some commonly overlooked attack points:


    +   Is power-protection equipment in place, as surge protectors, uninterruptible
    power supplies (UPSes), and generators? Also determine how easily accessible the
    on/off switches on these devices are — that is whether an intruder can walk in
    and flip a switch, or a scale to cut off a simple lock and access critical equipment.


    +   When the power fails, do physical security mechanisms fail open (allow anyone
    through) or fail closed (keep everyone out until power is restored?) I''ve seen
    both ways and you need to understand what happens in that situation.


    +   Where are fire-detection and -suppression devices located, including alarm
    sensors, extinguishers, and sprinkler systems — Determine how an intruder can
    abuse them. Also determine whether they''re accessible via wireless or local network
    with default credentials or over the Internet? Finally, determine whether these
    devices are placed where they can harm electronic equipment during a false alarm.


    +   Where are local telecom wires (both copper and fiber) that run outside the
    building? If they''re aboveground, someone could tap into them with telecom tools.
    If they''re buried, digging in the area might cut them easily. If they''re on
    telephone poles, they may be vulnerable to traffic accidents or weather-related
    incidents.


    # Countermeasures


    You may need to involve outside experts in the design, assessment, or retro-fitting
    stages. The key is placement. Be sure to consider the following:


    +   Ensure that major utility controls are placed behind closed and lockable doors
    or fenced areas out of the sight of people passing through or nearby.'
