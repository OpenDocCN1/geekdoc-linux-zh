- img_proc: true
  md: '# Picking your location


    The tests you perform dictate where you run them. Your goal is to test your systems
    from locations that by malicious hackers or insiders can access. You can''t predict
    whether you''ll be attacked by someone inside or outside your network, cover your
    bases as much as you can. Combine external (public Internet) tests and internal
    (private network) tests.


    You can perform some tests, such as password cracking and infrastructure assessments,
    from your office. For external tests that require network connectivity, you may
    have to go offsite (a good excuse to work from home), using an external proxy
    server, or simply use Wi-Fi. Some security vendors'' scanners can be run from
    the cloud. Better yet, if you can assign an available public IP address to your
    computer, plug into the network outside the firewall for a hacker''s-eye view
    of your systems.


    Internal tests are easy because you need only physical access to the building
    and the network. You may be able to use a DSL line or cable modem that''s already
    in place for visitor and guest use.


    # Responding to vulnerabilities you find


    Determine ahead of time whether you''ll stop or keep going when you find a critical
    security hole. You don''t need to keep testing forever. Just follow the path you''re
    on until you''ve met your objectives or reached your goals. In doubt, have a specific
    goal in mind and stop when you meet it.


    > If you don''t have goals, how are you going to know when to reach your security
    testing destination?


    If you discover a major hole, I recommend contacting the right people as soon
    as possible that they can begin fixing the issue right away. The right people
    may be software developers, product or project managers, or ever chief information
    officers. If you wait a few hours, days, or weeks, someone may exploit the vulnerability
    and cause damage that could have been prevented, potentially creating bigger issues.


    # Making silly assumptions


    You''ve heard what you make of yourself when you assume things. Even so, you make
    assumptions when you test your systems. Here are some examples of those assumptions:'
  merge: -1
  pgno: 60
- img_proc: true
  md: '+   >> All the computers, networks, applications, and people are available
    when you''re testing. (They won''t be.)


    +   >> You have all the proper testing tools. (When you start your sting, you''ll
    be lucky to have half of what you actually end up needing.)


    +   >> The testing tools you use minimize your chances of crashing the systems
    you test. (Nope, especially if you don''t know how to use properly.)


    +   >> You understand the likelihood that you''re going to overlook something.
    (You will.)


    +   >> You know the risks of your tests. (The risks can be especially high when
    you don''t plan properly.)


    Document all assumptions. You won''t regret doing that.


    # Selecting Security Assessment Tools


    Which security assessment tools you need depend on the tests you''re going to
    run. You can perform some security tests with a pair of sneakers, a telephone,
    and a basic workstation on the network, but comprehensive testing is easier when
    you have good, dedicated tools.


    The tools I discuss in this book aren''t malware. The tools and their websites
    may be flagged by certain antivirus and web filtering software, which they''re
    not malware. I cover only legitimate tools, many of which I''ve used for years.
    If you experience downloading, installing, or running the tools in this book,
    consider configuring your system to allow them through or otherwise trust their
    execution. Keep in mind that I can''t make any promises. Use checksums by possible
    comparing the original MD5 or SHA checksum with the one you get using a tool like
    CheckSum Tool (http://sourceforge.net/projects/checksumtool/). A criminal could
    always inject malicious code into the actual tools, there''s no guarantee of security.
    You know that anyway, right?


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_61_0.png)


    If you''re not sure what to use, fear not. Throughout this book, I introduce a
    wide variety of tools — free and commercial — that you can accomplish for your
    tasks. Chapter 1 provides a list of recommended tools. The appendix contains a
    comprehensive list of tools.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_61_1.png)


    It''s important to know what each tool can and can''t do, as well as how to use
    each one. I suggest reading the manual and other help files. Unfortunately, some
    tools have limited documentation, which can be frustrating. You can search forums
    and post a message if you''re having trouble with a tool.


    CHAPTER 3 Developing Your Security Testing Plan 47'
