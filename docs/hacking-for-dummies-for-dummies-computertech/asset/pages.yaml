  md: '# Chapter 1


    # Introduction to Vulnerability and Penetration Testing


    His book is about testing your computers and networks for security vulnerabilities
    and plugging the holes you find before the bad guys get a chance to exploit them.


    # Straightening Out the Terminology


    Everyone has heard of hackers and malicious users. Many people have even suffered
    the consequences of their criminal actions. Who are these people and why do you
    need to know about them? The next few sections give you the lowdown on these attackers.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'In this book, I use the following terminology:


    +   - **Hackers** (or external attackers) try to compromise computers, sensitive
    information, and even entire networks for ill-gotten gains — usually from the
    outside — as unauthorized users. Hackers go for almost any system they think can
    compromise. Some prefer prestigious, well-protected systems, but hacking into
    anyone''s system increases an attacker''s status in hacker circles.


    +   - **Malicious users (external or internal attackers)** try to compromise computers
    and sensitive information from the outside (e.g. customers or business partners)
    or the inside as authorized and trusted users. Malicious users go for systems
    that they believe compromise for ill-gotten gains or revenge, because they may
    have access or knowledge of a system that gives them a leg up.


    Malicious attackers are, generally speaking, both hackers and malicious users.
    For the sake of simplicity, I refer to both as *attacker* or *malicious user*
    only when I need to differentiate and drill down into their unique tools, techniques,
    and ways of thinking.


    +   - **Ethical hackers (or good guys)** hack systems to discover vulnerabilities
    to protect against unauthorized access, abuse, and misuse. Information security
    researchers, consultants, and internal staff fall into this category.


    # Hacker


    Hacker has two meanings:


    +   - Traditionally, hackers like to tinker with software or electronic systems.
    Hackers enjoy exploring and learning how computer systems operate. They love discovering
    new ways to work — both mechanically and electronically.


    +   - In recent years, *hacker* has taken on a new meaning: someone who maliciously
    breaks into systems for personal gain. Technically, these criminals are *crackers*
    (criminal hackers). Crackers break into code, or systems with malicious intent.
    The gain they seek could be fame, intellectual property, profit, or even revenge.
    They modify, delete, and steal critical information as well take entire networks
    offline, bringing large corporations and government agencies to their knees.


    > Don''t even get started on how pop culture and the media have hijacked the word
    *hack*, from *life hacking* to so-called election med. Politicians, and media
    strategists know that the average person doesn''t understand the term *hacking*,
    many of them use however they desire to achieve their goals. Don''t be distracted.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'The good-guy (white-hat) hackers don''t like being lumped in the same category
    as the bad-guy (black-hat) hackers. (In case you''re curious, the white hat and
    black hat come from old Western TV shows in which the good guys wore white cowboy
    hats and the bad guys wore black cowboy hats.) *Gray-hat hackers are a bit of
    both.* Whatever the case, most people have a negative connotation of the word
    hacker.


    Many malicious hackers claim they don''t cause damage but help others for the
    greater good of society. Yeah, whatever. Malicious hackers are electronic miscreants
    and deserve the consequences of their actions.


    Be careful not to confuse criminal hackers with security researchers. Researchers
    not only hack overboard and develop the amazing tools that we get to use in our
    work, but also (usually) take responsible steps to disclose their findings and
    publish their code.


    # Malicious user


    A malicious user — meaning a rogue employee, contractor, intern, or other user
    who abuses his or her privileges is a common term in security circles and headlines
    about information breaches. The issue isn''t necessarily users hacking internal
    systems, but users who abuse the access privileges they''ve been given. Users
    ferret through critical database systems to glean sensitive information, email
    confidential client information to the competition or else—where the cloud, or
    delete sensitive files from servers that they probably didn''t have access to
    in the first place.


    Sometimes, an innocent (or ignorant) insider whose intent isn''t malicious causes
    security problems by moving, deleting, or corrupting sensitive information. Even
    an innocent finger on the keyboard can have dire consequences in the business
    world. Think about all the ransomware infections businesses around the world.
    All it takes is one click by a careless user to infect your network to be affected.


    Malicious users are often the worst enemies of IT and information security professionals
    who know exactly where to go to get the goods and don''t need to be computer-savvy
    to compromise sensitive information. These users have the access they need, and
    management trusts them — without question.


    What about Edward Snowden guy — the former National Security Agency employee who
    rated his own owner? That subject is a complicated one. (I will talk about hacker
    motivations in Chapter 2.) Regardless of what you think of Snowden, he abused
    his authority and violated the terms of his nondisclosure agreement. The same
    can be said of others, for whatever reason, are placed on a pedestal of their
    notoriety.


    CHAPTER 1 Introduction to Vulnerability and Penetration Testing 9'
