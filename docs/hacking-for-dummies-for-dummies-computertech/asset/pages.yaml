  md: '# Weak BIOS passwords


    Most computer BIOS (basic input/output system) settings allow power-on-passwords
    or setup passwords to protect the computer’s hardware settings are stored in the
    CMOS chip. Here are some ways around these passwords:


    +   You usually can reset these passwords by unplugging the CMOS battery or by
    changing a jumper on the motherboard.


    +   Password-cracking utilities for BIOS passwords are available on the Internet
    and from computer manufacturers.


    +   If gaining access to the hard drive is your ultimate goal, you can remove
    the hard drive from the computer and install it in another one, and you''re good
    to go. This technique is a great way to protect BIOS/power-on passwords are not
    effective countermeasures for lost or stolen laptops.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_130_0.png)


    For a list of default system passwords for various vendor equipment, check https://www.cirt.net/passwords.


    Tons of variants exist for hacking and counting countermeasures depending on your
    hardware setup. If you plan to hack your own passwords, check for information
    in your manual, or refer to the BIOS-hiding guide at https://searchenteredesktop.techtarget.com/tutorial/BIOS-password-hacking.
    If protecting the information on your hard drives is your ultimate goal, full
    (sometimes referred to as whole) is the best way to go. I cover mobile-related
    password cracking in depth in Chapter 11. The news is that newer computers (within
    the past five years or so) use a new type of BIOS unified extensible firmware
    interface (UEFI), which is much more resilient to boot-level system cracking attempts.
    Still, a weak password may be all it takes for the system to be exploited.


    # Weak passwords in limbo


    Bad guys often exploit user accounts that have just been created or reset by a
    network administrator or help desk. New accounts may need to be created for new
    employees or for security testing purposes. Accounts may need to be reset if users
    forget their passwords or if the accounts have been locked out because of failed
    attempts.


    # WEAKNESSES


    Here are some reasons why user accounts can be vulnerable:


    +   When user accounts are reset, they’re often an easily cracked or widely-known
    password (such as the user’s name or the word password).


    116 PART 2 Putting Security Testing in Motion'
