  md: '# IT Governance and Compliance Are More Than High-Level Checklist Audits


    With all the government and industry regulations in place, your business likely
    doesn''t have a choice in the matter. You have to address security. The problem
    is being compliant with these laws and regulations doesn''t automatically mean
    that your network and information are secure. The Payment Card Data Industry Security
    Standard (PCI DSS) comes to mind. Countless businesses run vulnerability scans,
    answer their self-assessment questionnaires, and assume they''ve done all that''s
    needed to manage their information security programs. The same goes for compliance
    with the General Data Protection Regulation (GDPR) and the Health Insurance Portability
    and Accountability Act (HIPAA).


    You have to take off the checklist blinders and move from a compliance-centric
    approach to a risk-centric approach. Using the tools and techniques covered in
    this book enables you to dig deeper into the vulnerabilities that create the biggest
    challenges for your business.


    # Vulnerability and Penetration Testing Complements Audits and Security Evaluations


    No doubt someone in your organization understands higher-level security audits
    better than this vulnerability and penetration testing stuff. But if you can sell
    that person on more- in-depth security testing and integrate it into existing
    security initiatives (such as internal audits and compliance spot checks), the
    auditing process can go much deeper and improve your outcomes. Everyone wins.


    # Customers and Partners Will Ask How Secure Your Systems Are


    Many businesses now require in-depth assessments of their business partners, and
    the same goes for certain customers. The bigger companies almost want to know
    how secure their information is while it''s being processed or stored in your
    environment. You can''t rely on data center audit reports such as the


    348 PART 7 The Part of Tens'
