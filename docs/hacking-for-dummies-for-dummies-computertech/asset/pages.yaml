  md: 'mail email servers allow you to limit the number of resources used for inbound
    connections, as shown in the Maximum Number of Simultaneous Threads setting for
    the IceWarp email server in Figure 14-1. This is called different things for different
    email servers and firewalls, so check your documentation. Completely stopping
    an unlimited number of inbound requests can be impossible, but you can minimize
    the impact of the attack. This limits the amount of server processor time, which
    can help during a DoS attack.


