  md: '# Creating Reports


    You may need to organize vulnerability information into a formal document for
    management or for your client. Creating a report is a professional thing to do
    and shows that you take your work seriously. Ferret out the critical findings
    and document them so that other parties can understand them.


    Graphs and charts are pluses. Screen captures of your findings — especially when
    saving the data to a file is difficult — adds a nice touch to your reports and
    show tangible evidence that the problem exists.


    Document the vulnerabilities in a concise, nontechnical manner. Every report should
    contain the following information:


    +   - Date(s) the testing was performed.

    - Tests that were performed.

    - Summary of the vulnerabilities discovered.

    - Prioritized list of vulnerabilities that need to be addressed.

    - Recommendations and specific steps for plugging the security holes.


    You always add value by performing an operational assessment of IT/security processes.
    I recommend adding a list of general observations on weak business processes,
    management''s support of IT and security, and so on, along with recommendations
    for addressing each issue. You can look at this as a list of root–cause analysis.


    Most people want the final report to include a summary of the findings — not everything.
    The last thing people want to do is sift through a vulnerability scanner’s 600–page
    PDF file containing jargon that means very little to them. Many consulting firms
    have been known to charge mebucks for this type of report, and they get away with
    it, but that doesn''t makes things.


    Administrators and developers need the raw–data reports from the security tools.
    That way, you can reference the data later when you need to see specific HTTP
    requests/responses, details on missing patches, and so on.


    As part of the final report, you may want to document behaviors that you observe
    when carrying out your security tests. You may find that some employees are oblivious
    or belligerent when you carry out an obvious social engineering attack, for example,
    or that the IT or security staff misses tip-offs (such as degraded performance
    of the network during testing or various attacking'
  merge: -1
