- img_proc: true
  md: '# Automatic testing


    You can use an automated file integrity monitoring program to alert you when these
    types of changes are made. This practice is what I recommend; it''s a lot easier
    than manual checks on an ongoing basis. Security controls can include:


    +   - A change-detection application, as Open Source Tripwire, can help you keep
    track of what changed and when.

    - A file-monitoring program as COPS (point your web browser to ftp://ftp.cerias.purdue.edu/pub/tools/unix/scanners/cops),
    finds files that have changed in status, such as a new SetUID or removed SetGID.


    # Finding Buffer Overflow Vulnerabilities


    RPC and other vulnerable daemons are common targets for buffer-overflow attacks.
    Buffer-overflow attacks are how hackers often get in to modify system files, read
    database files, and more.


    # Attacks


    In a buffer-overflow attack, the attacker manually sends strings of information
    to the victim Linux machine or writes a script that does so. These strings contain
    the following:


    +   - Instructions to the processor to do nothing.

    - Malicious code to replace the attacked process. exec("/bin/sh") creates a shell
    command prompt, for example.

    - A pointer to the start of the malicious code in the memory buffer.


    If an attacked application (such as FTP or RPC) is running as root, this can give
    attackers root permissions in their remote shells. Simple examples of vulnerable
    software running on Linux are Samba, MySQL, and Mozilla Firefox. Depending on
    the version, this software can be exploited with commercial or free tools such
    as Metasploit (https://www.metasploit.com) to obtain remote command prompts, add
    backdoor user accounts, change ownership of files, and more. I cover Metasploit
    in Chapter 12.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Countermeasures against buffer overflow attacks


    Three main countermeasures can help prevent–overflow attacks:


    +   - Disable unneeded services.

    - Protect your Linux systems with a firewall or a host-based IPS.

    - Enable another access control mechanism, such as TCP Wrappers, that authenticates
    users with a password.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_259_0.png)


    Don''t enable access controls via an IP address or host name, which can be easily
    spoofed.


    As always, make sure that your systems have been updated with the latest kernel
    and software updates.


    # Checking Physical Security


    Some Linux vulnerabilities involve the bad guy''s being at the system console
    – something that''s entirely possible given the insider threats that every organization.


    # Physical security hacks


    If an attacker is at the system console, anything goes, including rebooting the
    system (even if no one is logged in) by pressing Ctrl+Alt+Delete. After the system
    is rebooted, the attacker can start it in single-user mode, which allows him to
    zero out the root password or possibly read the entire shadow password file. I
    cover password cracking in Chapter 8.


    # Countermeasures against physical security attacks


    Edit your /etc/initab file, and comment out (place a # sign in front of) the line
    that reads ca::ctrlalt:/sbin/shutdown -t3 -r now, shown in the last line of Figure
    13–9. These changes prevent someone from rebooting the system by pressing Ctrl+Alt+Delete.
    Be beared that this change also prevents you from legitimately pressing Ctrl+Alt+Delete.'
