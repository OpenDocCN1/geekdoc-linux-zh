  md: 'URL-based input and returns the returned file''s contents to the user, as in
    the following example of an attempted breach of a Linux server''s passwd file:


    ```

    https://www.web_app.com/onlineserv/Checkout.cgi?state=

    detail&language=english&imageSet=/f/..;/f/..;/f/..;/f/..;/f/../../etc/passwd

    ```


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_299_0.png)


    No biases. No theory. No marketing fluff. What works with information security
    and doesn''t. Period.


    FIGURE 15-2: Using Firefox Developer to reset form-field lengths.


    It''s important to note that most recent application platforms, such as ASP.NET
    and Java, are pretty good about not allowing manipulation of the URL variables,
    but I still see this vulnerability periodically.


    The following links demonstrate another example of URL trickery caused URL redirection:


    ```

    https://www.web_app.com/error.aspx?URL=http://www.

    bad-site.com&ERROR=+''OPTIONS''++is+for+forbidden.

    https://www.web_app.com/exit.aspx?URL=http://www.

    bad-site.com

    ```


    In both situations, an attacker can exploit the vulnerability by sending the link
    to unsuspecting users via email or by posting it on a website. When users click
    it, they can be redirected to a malicious third-party site containing malware
    or inappropriate material.


    # CHAPTER 15 Web Applications and Mobile Apps 285'
