  md: '+   >> No power-on passwords

    >> Easily guessed (or cracked) power-on passwords


    For other technologies and systems (web applications, operating systems, and so
    on), you can usually find the testing tool you need. Relatively few security testing
    tools are available for finding mobile-related flaws, however. Not surpringly,
    the most expensive tools enable you to cover the big flaws with the least pain
    and hassle.


    # Cracking Laptop Passwords


    Arguably the greatest threats to any business''s security are unencrypted laptops.
    Given all the headlines and awareness about this effectively insecure vulnerability,
    I can''t believe that it''s still prevalent in business. This section explores
    tools you can use to crack unencrypted laptop passwords on Windows, Linux, or
    macOS systems. I also discuss basic countermeasures to defend against this vulnerability.


    # Choosing your tools


    My favorite tool for demonstrating the risks associated with unencrypted laptops
    running Windows is Elcomsoft Software Recovery (https://www.elcomsoft.com/esr.html).
    You burn this tool to a DVD or USB device and use it to boot the system you want
    to recover (or reset) the password, as shown in Figure 11-1.


    You have the option to reset the local administrator (or other) password or have
    to crack all passwords. The tool really that simple, and it''s highly successful
    on all operating systems, including Windows 10.


    You can also use an older tool for Windows called NTAccess (https://www.mirider.com/ntaccess.html)
    for resetting local Windows accounts. This program isn''t pricey or fancy, but
    it does the job. Other tools are available as well (discussed later in this section),
    Elcomsoft and NTAccess provide excellent ways to demonstrate that you can encrypt
    your laptops'' hard drives.


    People will tell you that they don''t have anything important or sensitive on
    their laptops, but they do. Even seemingly laptops used for training or sales
    have tens of sensitive information that can be used against your business if the
    laptops are lost or stolen. This information includes spreadsheets that have been
    copied from the network to locally, virtual private network (VPN) connections
    with stored login credentials, web browsers that have cached browsing history,
    and (worst) passwords that users have chosen to save.


