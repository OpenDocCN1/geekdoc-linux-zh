  md: '# Patching


    Ongoing patching is perhaps the best thing you can do to enhance and maintain
    the security of your Linux and macOS systems. Regardless of the Linux distribution
    you use, using a tool to assist in your patching efforts makes your job a lot
    easier.


    I find that Linux and macOS are out of the patch-management loop. With the focus
    on patching Windows, network administrators forget about the other systems on
    their network. Do not fall into this trap, especially given the growing use of
    macOS.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_262_0.png)


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_262_1.png)


    Patching is critical, even on those that have been assumed to be secure. macOS
    High Sierra, for example, had two vulnerabilities that affected a lot of Mac computers.
    The first vulnerability provided full root access to the system without a password,
    and the second provided App Settings access if you entered any admin username
    with a random password. This fact underscores the importance of being alerted
    to these flaws, responding fast, and patching the systems quickly. Even when users
    bring in their own Macs, they need to know that timely patching is the essence,
    and you need to be able to enforce patching wherever possible. Your business network
    is on the line!


    # Distribution updates


    For Linux, the process is different in every distribution. You can use the following
    tools, based on your specific distribution:


    +   **Red Hat:** The following tools update Red Linux systems:

    - RPM Packet Manager, which is the graphical user interface (GUI) application
    that runs in the Red Hat GUI desktop. It manages files with an .rpm extension
    that Red Hat and other free and open-source developers use to package their programs.
    RPM Packet Manager was originally a Red Hatsystem is now available for many versions
    of Linux.

    - update2, a command-line, text-based tool that''s included in Red Hat, Fedora,
    and CentOS.


    +   **Debian:** You can use the Debian package management system (dpkg) included
    with the OS to update Debian Linux systems.


    +   **Slackware:** You can use the Slackware Package Tool (pkgtool) included with
    the OS to update Slackware Linux systems.


    +   **SUSE:** Linux Linux updates YaST2 software management.'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'In addition to Linux kernel and general operating system updates, make sure
    to pay attention to Apache, OpenSSL, OpenSSH, MySQL, PHP, and other software programs
    on your systems. They may have weaknesses that you don''t want to overlook.


    For macOS, the updates are pushed to the computer locally, and unfortunately,
    it''s up to the user to install the updates by default.


    # Multiplatform update managers


    Commercial patch-management tools have additional features, such as correlating
    patches with vulnerabilities and automatically deploying appropriate patches.
    Commercial tools that can help with Linux and macOS patch management include ManageEngine
    (https://www.manageengine.com/products/desktop-central/mac-management.html), GFI
    LangGuard (https://www.gfi.com/products-and-solutions/network-security-solutions/gfi-languard/specifications/patch-management-for-operating-systems),
    and KACE Systems Management Appliance (https://www.quest.com/products/kace-systems-management-appliance).'
