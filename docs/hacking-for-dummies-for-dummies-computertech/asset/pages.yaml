    # # Chapter 16

    # Databases and Storage Systems


    Attacks against databases and storage systems can be very serious, because that''s
    where “the goods” are located, and with ill intent are well aware of that fact.
    These attacks can occur across the Internet or on the internal network when external
    attackers and malicious insiders exploit any number of vulnerabilities. These
    attacks can also occur via the web application through SQL injection. This chapter
    covers some common vulnerabilities that, when exploited, can be very impactful
    to the business.


    # ## Diving Into Databases


    Database systems — such as Microsoft SQL Server, MySQL, and Oracle — have lurked
    behind the scenes, but their value and vulnerabilities have finally come to the
    forefront. Even the mighty Oracle, which once claimed to be unhackable, is as
    susceptible to exploits as its competition. With the slew of regulatory requirements
    governing database security, hardly any business can hide from the risks that
    lie within practically every business (large and small) uses some sort of database,
    either in-house or hosted in the cloud.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Choosing tools


    As with wireless networks, operating systems, and so on, you need good tools for
    it you''re going to find the database security issues that count. The following
    are my favorite tools for testing database security:


    +   - Advanced SQL Password Recovery (https://www.elcomsoft.com/asqlpr.html) for
    cracking Microsoft SQL Server passwords.

    - Cain & Abel (https://www.oxid.it/cain.html) for cracking database password hashes.

    - Nexpose (https://www.rapd7.com/products/nexpose) for performing in-depth vulnerability
    scans.

    - SQLPinging (https://www.security.com/downloads) for locating Microsoft SQL Servers
    on the network, checking for blank passwords for the sa account (the default SQL
    Server system administrator), and performing dictionary password-cracking attacks.


    You can use network vulnerability scanners, such as Nexpose, along with exploit
    tools, such as Metasploit, for your database testing.


    # Finding databases on the network


    The first step in discovering database vulnerabilities is figuring out where they''re
    located on your network. It sounds funny, but many network admins''ve aren''t
    aware of various databases running in their environments. This situation is especially
    true of the free SQL Server database software editions that users can download
    and run on your network.


    > I can''t tell you how often I find sensitive production data, such as credit
    card and Security Numbers, being used in test databases that are wide open by
    curious insiders or external attackers who have made their way into the network.
    Using sensitive production data in the uncontrolled areas of the network such
    as sales, software development, and quality assurance is a data breach waiting
    to happen.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_318_0.png)


    The best tool I''ve found to discover Microsoft SQL Server systems is SQLPinging3
    (see Figure 16-1).


    SQLPinging can even discover instances of SQL Server hidden behind personal firewalls,
    such as Windows Firewall. This feature is nice, as Windows Firewall is enabled
    by default in Windows 7 and later.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '![](img/6f4b05e27c5ed3644d5304cc1cefc73c_319_0.png)


    FIGURE 16-1: SQLPing can find SQL Server systems with missing sa account passwords.


    If you have Oracle in your environment, Finn Finnigan has a great list of Oracle-centric
    security tools at www.petefinnigan.com/tools.htm that can perform functions similar
    to those of SQLPing.


    # Cracking database passwords


    SQLPing3 also serves as a nice dictionary-based SQL password-cracking program.
    As Figure 16-1 shows, it checks for blank sa passwords by default. Another free
    tool for cracking SQL Server, MySQL, and Oracle password hashes is Cain & Abel,
    in Figure 16-2.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_319_1.png)


    FIGURE 16-2: Using Cain & Abel to crack Oracle passwords.


    CHAPTER 16 Databases and Storage Systems 305'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'You simply load Cain & Abel, the Cracker tab at the top, select Oracle Hashes
    in the bottom-left corner, and click the blue plus symbol at the top to load a
    user name and password hash to start the cracking. You can also select Oracle
    TNS Hashes at the bottom left and capture Transport Network Substrate hashes off
    the wire when capturing packets with Cain. You can do the same for MySQL password
    hashes.


    The commercial product ElcomSoft Distributed Password Recovery (https://www.elcomsoft.com/edpr.html)
    can also crack Oracle password hashes. If you have access to SQL Server master
    .mdf files (which are often readily on the network due to weak share and file
    permissions, as I outline later in this chapter), you can use ElcomSoft''s Advanced
    SQL Password Recovery to recover database passwords immediately.


    You may tackle some legacy Microsoft Access database files that are protected
    as well. No worries: The tool Advanced Access Password Recovery can get right
    in. There are many end-of-life or unsupported versions of Access still around.
    Running a vulnerability scanner such as Nexpose to uncover flaws can prove beneficial.
    Depending on the findings, you might then be able to use Metploit to demonstrate
    what can happen.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_320_0.png)


    As you can imagine, these password-cracking tools are great to demonstrate the
    most basic of weaknesses in your database security. They''re also nice ways to
    underscore the problems with critical files scattered across the network in an
    unprotected fashion.


    Another way to demonstrate SQL Server weaknesses is to use SQL Server Management
    Studio (https://docs.microsoft.com/en-us/sql/ssms/sql-server-management-studio-ssms)
    to connect to the databases you now have the passwords for and set up backdoor
    accounts or browse to see (and show) what''s available. Practically every every
    Server system I come across has sensitive personal financial or healthcare information
    available for taking. It simply takes a query such as the following to access
    records in any table:


    ```

    select * from tablename

    ```


    # Scanning databases for vulnerabilities


    As operating systems and web applications, some database-specific vulnerabilities
    can be rooted out by using the right tools. I use Nexpose to find such issues
    as the following:'
  merge: -1
  pgno: 320
- img_proc: true
  md: '+   * Buffer overflows.

    * Privilege escalations.

    * Password hashes accessible through default/unprotected accounts.

    * Weak authentication methods enabled.


    A great all-in-one commercial database vulnerability scanner for performing depth
    checks — including user-rights audits in SQL Server, Oracle, and so on — is AppDetectivePRO
    (https://www.trustwave.com/Products/Database-Security/AppDetectivePRO). AppDetectivePRO
    can be a good addition to your security tool arsenal if you can justify the investment.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_321_0.png)


    Many vulnerabilities can be tested from both an unauthenticated outsider''s perspective
    as well as a trusted insider''s perspective. The important thing is to review
    the security of your databases from many angles as reasonably possible. As I''ve
    said before, if a database is out there and accessible, people are going to play
    with it.


    # # Following Best Practices for Minimizing Database Security Risks


    Keeping your databases secure is fairly simple if you do the following:


    +   * Run your databases on dedicated servers (or workstations where necessary).

    * Check the underlying operating systems for security vulnerabilities. (I operating
    system (OS) exploits for Windows and Linux in chapters 12 and 13, respectively.)

    * Ensure that your databases fall within the scope of vulnerability scanning,
    patching, and system hardening.

    * Seek out and replace (or otherwise segment off) end-of-life database systems.
    They''re just too risky to leave around.

    * Require strong passwords on every database system. Most enterprise-ready databases,
    such as Oracle and SQL Server, allow you to use domain authentication (such as
    Active Directory or LDAP) to tie your in your domain policy and user accounts
    without having to worry about managing a separate set.

    * Use appropriate file and share permissions to keep eyes away.


    CHAPTER 16 Databases and Storage Systems 307'
  merge: -1
  pgno: 321
- img_proc: true
  md: '+   >> Deidentify any sensitive production data before it''s used in nonproduction
    environments such as development or quality assurance.


    +   >> Check your web applications for SQL injection and related input validation
    vulnerabilities. (Cover web application security in Chapter 15.)


    +   >> Use a network firewall, such as the type available from Fortinet (https://www.fortinet.com)
    or Cisco (https://www.cisco.com) and databasespecific controls, such as those
    available from Imperva (https://www.imperva.com) and IDERA (https://www.idera.com).


    +   >> Perform database hardening and management using a tool such as Microsoft
    Security Compliance Manager (https://techn.microsoft.com/en-us/library/cc67T002.aspx).


    +   >> Run the latest version of database server software. The new security features
    in Oracle, SQL Server 2016 and SQL Server 2017 are great advancements towards
    database security for on-premises databases as well as those in the cloud.


    # Opening Up About Storage Systems


    Attackers are carrying out a growing number of storage-related hacks and using
    various attack vectors and tools to break into the storage environment. (Surely
    you know what I''m going to say next.) Therefore, you need to know the techniques
    and tools yourself and use them to test your storage environment.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_322_0.png)


    A lot of misconceptions and myths are related to the security of such storage
    systems as Fibre Channel and iSCSI Storage Area Networks (SANs), CIFS and NFS-based
    Network Attached Storage (SAN) systems, and so on. Many network and storage administrators
    believe that encryption or RAID equals security, an external attacker can''t reach
    the company''s storage environment, the company''s systems are resilient, or security
    is handled elsewhere. All these beliefs are very dangerous, and I''m confident
    that more attacks will target critical storage systems.


    As with databases, practically every business has some sort of network storage
    housing sensitive information that it can''t afford to lose. For that reason,
    it''s important to include both network storage (SAN and NAS systems) and traditional
    file shares in the scope of your security testing.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Choosing tools


    We are my favorite tools for testing security:


    +   - **nmap** (http://nmap.org) for port scanning to find live storage hosts.

    - **SoftPerfect Network Scanner** (https://www.softfect.com/products/networkscanner)
    for finding open and unprotected shares.

    - **FileLocator** (https://www.mythic.com) for finding specific files and information.

    - **Nexperose** for performing in-depth vulnerability scans.


    # Finding storage systems on the network


    Seek out storage-related vulnerabilities, you first have to figure out what''s.
    The best way to get rolling is to use a port scanner and, ideally, an all-in-one
    vulnerability scanner such as Nexpose or LangGuard. Also, given the fact that
    many storage servers have built-in web servers, you can use Acunet Web Vulnerability
    Scanner and Netscanner to uncover web-based flaws. You can use these vulnerability
    scanners to gain good insight into areas that need further inspection, as weak
    authentication, unpatched operating systems, and cross-site scripting.


    > A commonly overlooked storage vulnerability that many storage systems can be
    accessed from both the demilitarized zone (DMZ) and the internal segment(s). This
    vulnerability poses risks to both sides of the network. Be sure to check manually
    to see whether you can reach the DMZ from the internal network, and versa.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_323_0.png)


    You can also perform basic file permission and share scans (outlined in Chapter
    12) in conjunction with a text search to uncover sensitive information that no
    one on the network should have access. Digging down further, a quick for finding
    open network shares is to use SoftPerfect Network Scanner''s sharing capabilities,
    as shown in Figure 16-3.


    As you can see in Figure 16-3, Network Scanner enables you to perform a security
    and security permission scan for all devices or simple folders. I recommend selecting
    Specific Account in the Authentication section and then clicking Manager so that
    you can enter a domain account for the network that has general user permissions.
    This technique provides a good level of access to determine which shares are accessible.


    CHAPTER 16 Databases and Storage Systems 309'
  merge: -1
  pgno: 323
- img_proc: true
  md: '![](img/6f4b05e27c5ed3644d5304cc1cefc73c_324_0.png)


    When Network Scanner completes its scan, the shares are the shares that need attention.
    I rarely complete the Shared Folder column a security assessment without coming
    across such shares open to the Windows Everyone group. But as common is searching
    the directories and files within these shares that are accessible to logged-in
    users to open, modify, delete, and do whatever they please. How''s that for accountability?


    # Rooting out sensitive text in network files


    When you find open network shares, scan for sensitive information stored in files
    as .pdf, .docx, and .xlsx files. The process is as simple as using a text search
    utility as FileLocator Pro. Alternatively, you can use Windows Explorer or the
    find command in Linux to search for sensitive information, but that process is
    too slow and cumbersome for my liking.


    You''ll be amazed by what you come across unsecured on users'' desktops, server
    shares, and more, such as the following:


    +   * Employee health records

    * Customer credit card numbers

    * Corporate financial reports

    * Source code

    * Master database files'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'The sky''s limit. Such sensitive information should be protected by good business
    practices, and it''s also governed by state, federal, and international regulations,
    so make sure that you find it and secure it.


    Do your searches for sensitive text while you''re logged in to the local system
    or domain as a regular user — not as an administrator. This practice gives you
    a better view of regular users who have unauthorized access to sensitive files
    and shares that you were secure. Using a basic text search tool such as FileLocator
    Pro, for the following text strings:


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_325_0.png)


    +   * DOB (for dates of birth)

    * SSN (for Social Security numbers)

    * License (for driver''s license information)

    * Credit or CCV (for credit-card numbers)


    Don''t forget about your mobile devices when seeking sensitivity. Everything from
    laptops to USB drives to unprotected hard drives is fair to the bad guys. A misplaced
    or stolen system can create a costly breach. The same can be said for cloud-based
    file sharing services as OneDrive and Sharefile.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_325_1.png)


    The possibilities for information exposure are endless. Start with the basics,
    and peek only into common files that you may know some juicy info in them. Limiting
    your search to these files will save you a ton of time:


    +   * .txt

    * .doc and .docx

    * .rtf

    * .xls and .xlsx

    * .pdf


    Figure 16–4 shows a basic text search with FileLocator Pro. Notice the files located
    on different parts of the server.


    FileLocator Pro can also search for content inside .pdf files to uncover sensitive
    data.


    To speed the process, Spurion''s Sensitive Data Manager (https://www.spirion.com).
    This product, formerly known as IdentityFinder and since rolled into the company''s
    enterprise data discovery platform, is a tool needed for


    # CHAPTER 16 Databases and Storage Systems 311'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'scanning storage devices for sensitive, personally identifiable information.
    It can also search inside binary files such as PDFs.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_326_0.png)


    FIGURE 16-4: Using FileLocator Pro to search for sensitive text on unprotected
    shares.


    For a second round of testing, you could perform your searches while logged in
    as an administrator. You''re likely to find a lot of sensitive information scattered
    about. It might seem worthless at first, but it could highlight sensitive information
    stored in places where it shouldn''t be or that network administrators shouldn''t
    be to access.


    > Testing is highly dependent on time, searching for the right keywords, and looking
    at the systems on the network. You likely won''t root out every single bit of
    sensitive information, but this effort shows where certain problems are, which
    helps you justify the need for stronger access controls and for better IT and
    security management processes.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_326_1.png)


    # # Following Best Practices for Minimizing Storage Security Risks


    Like database security, storage security isn''t brain surgery. Keeping your systems
    secure is simple, too, if you do the following:


    +   - Check the underlying operating systems for security vulnerabilities. I cover
    operating system exploits for Windows and Linux in chapters 12 and 13.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '+   >> Ensure that your network storage (SAN and NAS systems) falls within
    the scope of patching and system hardening.


    +   >> Require strong passwords on every storage management interface.


    +   >> Use appropriate file and share permissions to keep prying eyes away.


    +   >> Educate your users on where to store sensitive information and the risks
    of mishandling it.


    +   >> Deidentify any sensitive production data before it''s used in development
    or quality assurance, using tools made for this purpose.


    +   >> Use a network access control lists or a firewall, as those available from
    Fortinet (https://www.fortinet.com) or WatchGuard Technologies (https://www.watchguard.com)
    to ensure that only the people and systems with a business need to access your
