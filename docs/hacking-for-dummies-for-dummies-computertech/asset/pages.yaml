  md: '+   >> Unsecured computer hardware, especially routers, switches, and unencrypted
    laptops.


    +   >> Sensitive information being thrown away in trash cans rather than being
    shredded or placed in a shred container.


    When these physical vulnerabilities are uncovered, bad things can happen. All
    it takes to exploit these weaknesses is an unauthorized individual with malicious
    intent.


    # Pinpointing Physical Vulnerabilities in Your Office


    Many potential physical security exploits seem unlikely, but they can occur to
    organizations that don''t pay attention to the risks. The bad guys can exploit
    many vulnerabilities, including weaknesses in a building''s infrastructure, office
    layout, computer-room access, and design. In addition to these factors, consider
    the facility''s proximity to local emergency assistance (police, fire, ambulance)
    and the area''s crime statistics (burglary, robbery, and so on) that you can better
    understand what you''re up against.


    Look for vulnerabilities discussed in the following sections when assessing your
    organization''s physical security. This research won''t take a lot of technical
    savvy or expensive equipment. Depending on the size of your office or facilities,
    these tests shouldn''t take much time either. The bottom line is to determine
    whether the physical security controls are adequate, given what''s at stake. Above
    all, be practical, and use common sense.


    # Building infrastructure


    Doors, windows, and walls are critical components of a building — especially in
    a data center or other area where confidential information is stored.


    # Attack points


    Criminals can exploit infrastructure vulnerabilities. Ask yourself the following
    questions about commonly overlooked attack points:


    +   >> Are doors propped open, and if so, why?


    +   >> Are there gaps at the bottom of critical doors? (Gaps could allow someone
    to use a balloon or other device to trip a sensor inside an otherwise-secure room.)


