  md: '# The MAC-daddy attack


    Attackers can ARP (Address Resolution Protocol) running on your network to make
    your systems appear to be your system or another authorized host on your network.


    # ARP spoofing


    An excessive number of ARP requests can be a sign of an ARP spoofing attack (also
    called ARP poisoning) on your network.


    A client running a program such as dsniff (https://www.monkey.org/~dsniff) or
    Cain & Abel can change the ARP tables — the tables that store IP addresses to
    media access control (MAC) address mappings on network hosts. Changing the ARP
    tables causes the victim computers to think that they need to send traffic to
    the attacker''s computer rather than the true destination when communicating on
    the network. ARP spoofing is used during man-in-the-middle attacks.


    Spoofed ARP replies can be sent to a switch, which reverts the switch to broadcast
    mode and essentially turns it into a hub. When this attack occurs, the attacker
    can sniff every packet going through the switch and capture anything and everything
    from the network.


    This security vulnerability is inherent in the way TCP/IP communications are handled.


    Here''s a typical ARP spoofing attack involving a hacker''s computer (Hacky) and
    two legitimate network'' computers (Joe and Bob):


    +   1. Hacker poisons the ARP caches of victims Joe and Bob by using a tool such
    as dsniff, etcap, or necat.

    2. Joe associates Hacky''s MAC address with Bob''s IP address.

    3. Bob associates Hacky''s MAC address with Joe''s IP address.

    4. Joe''s traffic and Bob''s traffic are sent to Hacky''s IP address first.

    5. Hacky''s network analyzer captures Joe''s and Bob''s traffic.


    If Hacky is configured to act like a router and forward packets, it forwards the
    traffic to its original destination. The original sender and receiver never know
    the difference!'
