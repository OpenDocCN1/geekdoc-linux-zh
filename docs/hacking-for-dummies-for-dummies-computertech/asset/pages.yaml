  md: '# HACKING MAGAZINES


    If you want detailed information on how some hackers work or want to keep up with
    the latest hacker methods, several magazines are worth checking out:


    +   * 2600 — The Hacker Quarterly magazine (www.2600.com)

    * (INSECURE magazine (www.helpnetsecurity.com/insecurem-archive)

    * Hackin9 (http://hakin9.org)

    * PHRACK (www.phrack.org/archives)


    Malicious attackers usually learn from their mistakes. Every mistake moves them
    them one step closer to breaking into someone''s system. They use this knowledge
    when carrying out future attacks. You, as a security professional responsible
    for testing the security of your environment, need to do the same.


    Time is an attacker''s friend, and it''s always on his or her side. By attacking
    computers rather than in person, hackers have more control of the timing of their
    attacks. Attacks can be carried out slowly, making them hard to detect. Attacks
    are frequently carried out after typical business hours, often in the middle of
    the night and (in the case of malicious users) from home. Defenses may be weaker
    after hours, with less physical security and less intrusion monitoring, when the
    typical network administrator or security guard is sleeping.


    # Maintaining Anonymity


    Smart attackers want to remain as low-key as possible. Covering their tracks is
    a priority, and many times, their success depends on remaining unnoticed. To avoid
    raising suspicion so that they can come back and access the systems in the future.


    Hackers often remain anonymous by using one of the following resources:


    +   * Borrowed or stolen remote desktop and virtual private network (VPN)

    accounts of friends or previous employers.

    * Public computers at libraries, schools, or hotel business centers.

    * Open wireless networks.

    * Internet proxy servers or anonymizer services.


