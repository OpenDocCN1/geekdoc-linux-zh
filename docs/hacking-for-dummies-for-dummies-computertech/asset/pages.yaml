    # Performing General Security Tests


    Assess critical and often-overlooked security issues on your Linux and macOS systems,
    such as the following:


    +   - Misconfigurations or unencrypted entries in the shadow password files, which
    could provide covert system access.

    - Password complexity requirements.

    - Users equivalent to root.

    - Suspicious tasks configured in cron, the script scheduler program.'
