  md: '# Hacker motivations


    Perhaps more important than a hacker''s skill level is his or her motivation.
    The following groups of hackers have different motivations:


    +   - **Hacktivists**: These hackers try to disseminate political or social messages
    through their work. A hacktivist wants to raise public awareness of an issue but
    wants to remain anonymous. In many situations, these hackers try to take you down
