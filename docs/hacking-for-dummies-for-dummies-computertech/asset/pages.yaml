  md: 'If you receive the test email that you sent, SMTP relaying is enabled on your
    server and probably needs to be disabled. The last thing you want is to let spammers
    or other attackers make it look like you''re sending tons of spam, or worse, to
    be blacklisted by one or more blacklist providers. Ending up on a blacklist can
    disrupt email sending and receiving, which isn''t good for business!


    # COUNTERMEASURES AGAINST SMTP RELAY ATTACKS


    You can implement the following countermeasures on your email server to disable
    or at least control SMTP relaying:


    +   **Disable SMTP relay on your email server.** SMTP relay should be disabled
    by default, it pays to check. If you don''t know whether you need SMTP relay,
    you probably dont. You can enable SMTP relay for specific hosts or within your
    firewall configuration.


    +   **Enforce authentication if your email server supports it.** You may be able
    to require password authentication on an email address that matches your email
    server''s domain. Check your email server and client documentation for details
    on setting up this type of authentication.


    # Email header disclosures


    If your email client and server are configured with typical defaults, a malicious
    attacker might find critical pieces of information such as these:


    +   **Internal IP address of your email client machine (which could lead to the
    enumeration of your internal network and eventual exploitation via phishing and/or
    subsequent malware infection).


    +   **Software versions of your client and email server, along with their vulnerabilities.


    +   **Host names that may divulge your network naming conventions.


