    # 7. End the command with a period by itself.


    You can enter ? or help at the first Telnet prompt to see a list of all the supported
    commands, and depending on the server, get help on the use of the commands.


    The final period marks the end of the message. After you enter this final period,
    your message will be sent if relaying is allowed.


    # 8. Check for relaying on your server:


    +   - Look for a message similar to Relay not allowed coming from the server.


    +   - If you get a message similar to this, SMTP relaying isn''t allowed on your
