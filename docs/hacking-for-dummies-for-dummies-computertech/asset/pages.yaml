  md: '# General best practices for minimizing

    email security risks


    The following countermeasures help keep messages as secure as possible.


    # Software solutions


    The right software can neutralize many threats:


    +   Use antimalware software on the email server — better, the email gateway

    nto prevent malware from reaching email clients. Cloud-based email systems

    cts those offered by Google and Microsoft often have such protection

    built in. Using malware protection on your clients is given.


    +   Apply the latest operating system (OS) and email-server security patches

    and any security alerts are released.


    +   Encrypt (where it is reasonable to do so). You can go old-school and use S

    MIME or PGP to encrypt sensitive messages, or use email encryption at the

    desktop level or the server or email gateway. Better (easier), you can use TLS

    via the POP3S, IMAPS, and SMTPs protocols. The best option may be to use

    en email security application or cloud service that supports the sending and

    receiving of encrypted emails via a web browser over HTTPS, as G Suite

    and Office 365.


    Don''t depend on users to encrypt messages. With any other security

    policy or control, relying on users to make security decisions often ends

    poorly. Use an enterprise solution to encrypt messages automatically.


    Make sure that encrypted files and emails can be protected against malware.

    Encryption doesn''t keep malware out of files or emails. You have just encrypted

    malware within the files or emails. Encryption keeps your server or gateway

    antimalware software from detecting the malware until it reaches the desktop.


    +   Make it possible for users not to open emails any attachments, especially
    those

    from unknown senders or untrusted sources, and create ongoing awareness

    sessions and other reminders.


    +   Plan for users who ignore or forget the policy of not opening unsolicited

    emails and attachments. This will happen! Certain software such as Microsoft

    Outlook and Windows SmartScreen can help alert users to the stuff.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_283_0.png)


    CHAPTER 14 Communication and Messaging Systems 269'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Operating guidelines


    Some simple operating rules can keep your walls high and the attackers out of
    your email systems:


    +   - Put your email server behind a firewall on a different network segment from
    the Internet and from your internal LAN — ideally, in a demilitarized zone (DMZ2).
    Or, use a mail gateway.

    - Harden by disabling unused protocols and services on your email server.

    - Run your email server and perform malware scanning on dedicated servers if possible
    (potentially separating inbound and outbound messages). Doing so can keep malicious
    attacks out of other servers and information in the event that the server is hacked.
    Look for solutions that test-embedded links test them and provide safe links.

    - Log all transactions with the server in case you need to investigate malicious
    use. Be sure to monitor these logs as well! If you cannot justify, consider outsourcing
    this function to a managed security services provider.

    - If your server doesn''t need certain services running (SMTP, POP3, and IMAP),
    disable them —.

    - For web-based email, such as Microsoft’s Outlook Web Access (OWA), properly
    test and secure your server application and operating system by using the techniques
    and hardening resources throughout this book.

    - Require strong passwords. For stand-alone accounts as well as domain-level Exchange
    or similar accounts, any password weaknesses on the network will trickle over
    and be exploited by someone via Outlook Web Access or POP3. I cover password hashing
    in Chapter 8.

    - Be sure to include your server(s) in your vulnerability scanning and penetration
    testing efforts.

    - If you’re running sendmail — especially an older version — Consider running
    a secure alternative, such as Postfix (www.postfix.org) or gmail (www.gmail.org).


    # Understanding VoIP


    A widely used technology in enterprises today is Voice over Internet Protocol.
    In-house VoIP systems and systems for remote users, VoIP servers, softphones,
    and related components have their own set of security vulnerabilities. With most
    security-related, many people haven''t thought about the security surrounding
    voice conversations traversing their networks or the Internet,


    PART 5 Hacking Applications'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'those issues certainly need to be on your radar. Don’t fret — it’s not too
    late

    to make things right. Just remember that if protective measures are in place,

    VoIP systems need to be included in your overall security testing on a

    continuous basis.


    # VoIP vulnerabilities


    As with any technology or set of network protocols, the bad guys are always going

    to figure out how to break in. VoIP is certainly no different. In fact, given
    what''s

    at stake (phone conversations and phone system availability), you have a lot

    to lose.


    VoIP-related systems are no more (less) secure than other common computer

    systems. Why VoIP systems have their own operating system, they have IP

    addresses, and they''re accessible on the network. Compounding the issue is

    of many VoIP systems house more intelligence (a fancy word for “more stuff

    tat go wrong”), makes VoIP networks even more hackable.


    If you want to find out how VoIP operates, which will undoubtedly

    help you root out vulnerabilities, check out For Dummies, by Timothy V. Kelly

    (John Wiley & Sons, Inc.).


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_285_0.png)


    On one hand, VoIP systems have vulnerabilities very similar to other systems

    in this book, including default settings, missing patctches, and weak pass-

    words. For reason, using the standard vulnerability scanning tools that is

    for important. Figure 14–12 shows various vulnerabilities associated with the

    authentication mechanism in the web interface of a VoIP adapter.


    Looking at these results, you might think that this device is a basic web server.

    That''s exactly my point: VoIP systems are nothing more than networked com-

    puter systems with vulnerabilities that can be exploited.


    On the other hand, two major security weaknesses are tied specifically to VoIP:


    +   >> Phone-service disruption: Yep, VoIP is susceptible to DoS attacks like
    any

    other system or application. VoIP is as vulnerable as the most time-sensitive

    applications there, given the low tolerance that people have for choppy

    d dropped phone conversations (cellphones aside, of course).


    +   >> Lack of encryption: The other big weakness of VoIP is that voice conversations

    usually aren''t encrypted; therefore, they can be intercepted and decoded. Imagine

    the fun that a bad guy could have recording conversations and blackmailing his

    victims. This is very easy on unsecured wireless networks, but as I show in

    the upcoming section “Capturing and recording voice traffic,” it is also pretty
    simple

    to carry out on wired networks.


    CHAPTER 14 Communication and Messaging Systems 271'
