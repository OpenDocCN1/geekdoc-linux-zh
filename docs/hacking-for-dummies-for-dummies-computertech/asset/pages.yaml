    > Building your toolbox and getting to know your tools well will save you gobs
    of effort, you''ll impress others with your results, and you''ll help minimize
    your business''s risks.


    # Pounding Production Systems at the Wrong Time


    One of the best ways to tick your manager or lose your client''s trust is to run
    security tests against production systems when everyone is using them. This problem
    is especially serious for companies that run old, feeble operating systems or
    legacy applications. If you try to test systems at the wrong time, you should
    expect the critical ones to be negatively affected at the worst moment.


    Make sure that you know the best time to perform your testing, which may be in
    the middle of the night. (I never said information that security testing was easy!)
    Odd testing schedules may justify using security tools and other supporting utilities
    to automate certain tasks, such as vulnerability scanners that allow you to run
    scans at certain times.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# Outsourcing Testing and Not Staying Involved


    Outsourcing is great, but you must stay involved throughout the entire process.
    Don''t hand the reins of your security testing to a third-party consultant or
    a man-aged service provider without following up and staying on top of what''s
    taking place. You won''t be doing your manager or clients any favors by staying
    out of third-party vendors'' hair. Get in their hair (unless, of course, they''re
    bald like me, but you know what I mean). You can''t outsource accountability,
    so stay in touch!'
