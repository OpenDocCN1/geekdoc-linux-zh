  md: '# Organizational password vulnerabilities


    It''s human nature to want convenience, especially for remembering five, ten,
    or dozens of passwords for work and daily life. This desire for convenience makes
    passwords among the easiest barriers for an attacker to overcome. 3 trillion (yes,
    trillion with a and 12 zeros) eight-character password combinations are possible
    using the 26 letters of the alphabet and the numerals 09. Strong passwords are
    easy to remember and difficult to crack. Most people, however, focus only on the
    easy-to-remember part. Users like to use such passwords as password, their login
    names, abc123, or no password at all! Don''t laugh; I''ve seen these blatant weaknesses
    and guarantee that they''re on any given network at this very moment.


    Unless users are educated and reminded about using strong passwords, their passwords
    usually are:


    +   **Easy to guess:** Passwords such as "password" or "letmein" are more common
    than people think.

    **Seldom change:** Many people are not required to change their passwords periodically
    and constantly over time.

    **Reused for many security points:** When bad guys crack one password, they often
    access other systems and websites with that same password and username.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_111_0.png)


    Using the same password across multiple systems and websites is nothing but a
    waiting to happen. Everyone is guilty of this practice, but that doesn''t make
    it right. What can you do to protect your credentials, and spread the word to
    your users about how this practice can get you into a real bind.


    +   **Written down:** Generally, the more complex a password is, the more difficult
    it is to crack. When users create complex passwords, however, they''re more likely
    to write them down. External attackers and malicious insiders can find these passwords
    and use them against you and your business.


    # Technical password vulnerabilities


    You can find these serious technical vulnerabilities after exploiting organizational
    password vulnerabilities:


    +   Password encryption schemes are weak. Hackers can break weak password storage
    mechanisms using cracking methods that I outline in this chapter. Many vendors
    and developers believe that passwords are as safe as they are'
