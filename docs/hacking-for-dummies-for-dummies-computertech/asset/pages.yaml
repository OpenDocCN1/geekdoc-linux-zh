  md: '# Inference


    *Inference* is guessing passwords from information you know about a user, such
    as her date of birth, favorite television show, or phone number. It sounds silly,
    but criminals often determine their victims'' passwords by guessing them.


    The best defense against an inference attack is to educate users to create secure
    passwords that don''t include information that can be associated with them. Absent
    password complexity filters, it''s not always easy to enforce this practice with
    technical controls, so you need a sound security policy and ongoing security awareness
    and training to remind users of the importance of creating secure passwords.


    # Weak authentication


    External attackers and malicious insiders can obtain — or avoid having to — passwords
    by taking advantage of older or unsecured operating systems that don''t require
    passwords to log in. The same goes for a phone or tablet that isn''t configured
    to use passwords.


    # BYPASSING AUTHENTICATION


    On operating systems (such as Windows 9x) that prompt for a password, you can
    press Esc on the keyboard to get right in. Okay, it''s hard to find any Windows
    9x systems these days, but the same goes for any operating system — old or new
    — that''s configured to bypass the login screen. After you''re in, you can find
    other passwords stored in places as well as VPN connections and in screen savers.
    Passwords can be cracked easily with tools as ElmSoft''s Proactive System Password
    Recovery (https://www.elcomsoft.com/psr.html) or Cain (https://www.oxid.in/cain.html).
    These weak systems serve as trusted machines — meaning that people assume they
    are secure and provide good patches for network-based password attacks as well.


    # COUNTERMEASURES


    The only true defense against weak authentication is to ensure that your operating
    systems require a password upon boot. To eliminate this vulnerability, at least
    upgrade to Windows 7, if not Windows 10, or use the latest versions of Linux or
    one of the various flavors of Unix, including macOS and Chrome OS.


    Current authentication systems, such as Kerberos and directory services (such
    as Microsoft''s Active Directory), encrypt user passwords or not communicate the
    passwords across the network, which creates an extra layer of security.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_115_0.png)


    TIP'
