- img_proc: true
  md: 'To test for script vulnerabilities, you can peruse scripts manually or use
    a search tool (such as the search function built into the Windows Start menu or
    the Find program in Linux) to find any hard-coded usernames, passwords, and other
    sensitive information. Search for *admin, root, user, ID, login, sign, password,
    pass,* and so on. Sensitive information embedded in scripts is rarely necessary
    and is often the result of poor coding practices that give precedence to convenience
    security.


    # Countermeasures against

    default script attacks


    You can help prevent attacks against default web scripts as:


    +   - Know how scripts work before deploying them within a web environment.


    +   - Make sure to remove all default or sample scripts from the web server

    using them.


    +   - Keep any content management system software updated, especially

    WordPress, as it tends to be a big target for attackers.


    +   - Don''t use accessible scripts that contain hard-coded confidential

    information. They''re security incidents in the making.


    +   - Set file permissions on sensitive areas of your site/application to prevent

    public access.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_307_0.png)


    # Unsecured login mechanisms


    Many websites require users to log in before they can do anything with the appli-

    cation. These login mechanisms may not handle incorrect user IDs or passwords

    grfully, divulging information that an attacker can use to gather valid user IDs\sand
    passwords.


    To test for unsecured login mechanisms, browse to your application, and try these

    methods of logging in:


    +   - Use an invalid user ID with a valid password.


    +   - Use a valid user ID with an invalid password.


    +   - Use an invalid user ID with an invalid password.'
  merge: -1
