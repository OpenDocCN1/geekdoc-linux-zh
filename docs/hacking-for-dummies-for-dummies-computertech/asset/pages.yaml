  md: '# Chapter 13


    # Linux and macOS


    inux hasn''t made inroads on the enterprise desktop the way that Windows has,
    but its offshoot, macOS, certainly. Both Linux and Macs are prevalent in enterprises,
    so you need to make sure that they fall within the scope of your security testing.
    A common misconception is that Linux and macOS (and its predecessor, OS X) are
    more secure than Windows. More and more often, these operating systems (OSes)
    are shown to be susceptible to the same types of security vulnerabilities that
    affect Windows, so you can''t let your guard down.


    Criminal hackers are increasingly attacking Linux and macOS because of their popularity
    and growth in today''s network environment. Certain versions of Linux are free
    (in the sense that you don''t have to pay for the base operating system), many
    organizations are installing Linux for their web servers and email servers in
    the hope of saving money and having a more-secure system. Linux has grown in popularity
    for other reasons as well, including:


    +   - Abundant resources are available, including books, websites, and developer
    consultant expertise. There''s a lower risk that Linux will be hit as much malware
    as Windows and its applications have to deal with. Linux excels when it comes
    to security, but things probably won''t stay that way.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '+   Buy-in has increased among Unix vendors, including IBM, HP, and Oracle.


    +   Unix and Linux have become easier to use.


    On the workstation side, OS X and macOS are mainstream in business today. These
    OSes are based on Unix/Linux cores and are susceptible to many of the Linux flaws
    I discuss in this chapter.


    Based on what I see in my work, Linux is less vulnerable to common security flaws
    (especially in terms of missing third-party companies'' programs) than Windows.
    When comparing any distribution of Linux, such as Ubuntu and Red Hat/Fedora, with
    Windows 7 or Windows 10, I tend to find more weaknesses in the Windows systems.
    Chalk this fact up to widespread use, more features, or undetected users, but
    a more lot can happen in a Windows environment.


    That said, Linux certainly isn''t flawless. In addition to the password attacks
    I cover in Chapter 8, certain remote and local attacks against Linux-based systems
    are possible. In this chapter, I show some security issues in the Linux operating
    system and outline some countermeasures to plug the holes that you can keep the
    bad guys out. Don''t let the title of this chapter fool you; a lot of information
    applies to all flavors of Unix.


    # Understanding Linux Vulnerabilities


    Vulnerabilities and attacks against Linux are creating business risks in a growing
    number of organizations, especially e-commerce companies, network and IT/security
    vendors, and cloud service providers that rely on Linux for many of their systems
    (including their own products). When Linux and macOS systems experience the same
    side effects as their Windows-using counterparts, including:


    +   Leaks of sensitive information.


    +   Cracked passwords.


    +   Corrupted or deleted databases.


    +   Systems taken offline.


