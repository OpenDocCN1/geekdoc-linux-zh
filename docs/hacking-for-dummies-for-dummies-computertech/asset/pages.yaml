  md: '# Hosts


    Scan and document specific hosts that are accessible from the Internet and your
    internal network. Start by pinging specific host names or IP addresses with one
    of these tools:


    +   - The basic ping utility that''s built into your operating system (OS).


    +   - A third-party utility that allows you to ping multiple addresses at the
    same time, such as NetScanTools Pro (www.netscantools.com) for Windows and fping
    (http://fping.sourceforge.net) for Linux.


    +   - The Site WhatIsIP.com (www.whatisim.com) shows how your IP address appears
    on the Internet. Just browse to that, and your public IP address (your firewall
    or router; preferably not your local computer) appears. This information gives
    you an idea of the outermost IP address that the world sees.


    # Open ports


    Scan for open ports by using network scanning and analysis tools such as the following:


    +   - Scan network ports with NetScanTools Pro or Nmap (http://nmap.org). See
    Chapter 9 for details.


    +   - Monitor network traffic with a network analyzer, such as Omnipeek (www.savvius.com)
    or Wireshark (www.wireshark.com). I cover this topic in various chapters of this
    book.


    Scanning internally is easy. Simply connect your PC to the network, load the software,
    and fire away. Be aware of network segmentation and internal IPSes may impede
    your work.


    Scanning outside your network takes a few more steps. The easiest way to connect
    and get an outside-in perspective is to assign your public IP address and plug
    that system into a switch on the public side of your firewall or router. Physically
    the computer isn''t on the Internet looking in, but this type of connection works
    the same way as long as it''s outside your network perimeter. You can also do
    an outside-in scan from home or from a remote office.'
