    # SHARES


    Windows uses network shares to share folders or drives on the system so that other
    users can access them across the network. Shares are easy to set up and provide
    a great way to share files with other users on the network without having to involve
    a server. Shares, however, are often misused, allowing users, malware, and attackers
    who have made their way inside the network to access information that they shouldn''t
    be able to get. You can search for network shares by using the Share Finder tool
    that''s built into LangGuard. This tool scans an entire range of IP addresses
    for Windows shares, as shown in Figure 12-5.


