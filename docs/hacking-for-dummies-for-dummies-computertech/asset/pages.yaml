- img_proc: true
  md: '>> Windows Update.


    >> Windows Server Update Services, which you can find at https://docs.microsoft.com/en-us/windows-server/administration/windows-server-update-services/get-started/windows-server-update-services-wsus.


    >> System Center Configuration Manager, which you can find at https://www.microsoft.com/en-us/cloud-platform/system-center-configuration-manager.


    Keep in mind that those tools are Microsoft-centric patch managers. I can stress
    the need to get your third-party patches for Adobe, Java, and other products under
    control. If you''re looking for a commercial alternative, check GLanGuard''s patch
    management features (https://www.gfi.com/products-and-solutions/network-security-solutions/gfi-langguard)
    and PDQ Deploy (https://www.pdq.com/pdq-deploy), among others. I cover patching
    in depth in Chapter 18.


    # Running Authenticated Scans


    Another test you can run against your Windows systems is an authenticated scan,
    essentially looking for vulnerabilities as a trusted user. I find these types
    of tests to be very beneficial because they often highlight system problems and
    even operational security weaknesses (such as poor change management processes,
    weak patch management, and lack of information classification) that would never
    be discovered.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_239_0.png)


    A trusted insider has physical access to the network and the right tools can exploit
    vulnerabilities more easily, especially if no internal access control lists or
    intrusion prevention system is in place or a malware infection.


    A way to look for Windows weaknesses while you''re logged in (that is, through
    the eyes of a malicious insider) is to use some of the vulnerability scanning
    tools I''ve mentioned, such as Nessus and Nexpose. Figure 12-16 shows the nice
    and (rare) feature of Nexpose that allows you to test your login credentials before
    starting vulnerability scans. Being able to validate login credentials before
    you start your scans can save you an amazing amount of time, hassle, and money.


    REMEMBER'
