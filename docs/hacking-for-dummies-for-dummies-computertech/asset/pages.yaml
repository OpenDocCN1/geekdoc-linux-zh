  md: '# Chapter 8


    # Passwords


    Password hacking is one of the easiest and most common ways that attackers often
    obtain unauthorized network, computer, or application access. You hear about it
    in the headlines, and after study, such as the Verizon Data Breach Investigations
    Report, reaffirms that weak passwords are at the root of many security problems.
    I have trouble wrapping my head around the fact that I''m still talking about
    (and businesses are suffering from) passwords, but that is a reality. As an information
    security testing professional, you can certainly do your part to minimize the
    risks.


    Along strong passwords — ideally, longer, stronger passphrases, which are difficult
    to crack (or guess) — are easy to create and maintain, network administrators
    and users often neglect this aspect of password management. Therefore, passwords
    are the weakest links in the information security chain. Passwords rely on secrecy.
    After a password is compromised, its original owner isn''t the only person who
    can access the system with. That''s when accountability goes out the window and
    bad things start happening.


    External attackers and malicious insiders have many ways to obtain passwords.
    They can glean passwords simply by asking for them or by looking over the shoulders
    of users (shoulder surfing) while they type their passwords. Hackers can also
    obtain passwords from local computers by using password-cracking software. To
    obtain passwords from a network, attackers can use remote cracking utilities,
    keyloggers, or network analyzers.


