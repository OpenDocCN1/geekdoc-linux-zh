- img_proc: true
  md: '# Windows defaults


    The default share permission depends on the Windows system version.


    # Windows 2000/NT


    When you create shares in Windows NT and Windows 2000, by default, the group Everyone
    is given Full Control access in the share to browse, read, and write all files.


    You should not longer have these versions of Windows running on your network,
    but they''re still around!


    > Anyone who maps to the IPC connection with a null session (as described “Detecting
    Null Sessions” earlier in this chapter) is automatically made part of the Everyone
    group. As a result, remote hackers can automatically browse, read, and write access
    to a Windows NT or Windows 2000 server after establishing a null session.


    # Windows XP and later


    In Windows XP and later (Windows Server 2016, Windows 10, and so on), the Everyone
    group is given only read access to shares. This setting is definitely an improvement
    over the defaults in Windows 2000 and Windows NT. In some situations, you don''t
    want the Everyone group to have read access to share.


    > Share permissions are different from file permissions. When creating shares,
    you have to set both types of permissions. In current versions of Windows, these
    settings create hoops for casual users to jump through and discourage share creation,
    but it''s not foolproof. Unless you have your desktops locked down, users can
    share their files at all, including via cloud-based filesharing services as OneDrive
    and ShareFile.


    # Testing


    Assessing share permissions is a good way to get an overall view of who can access
    what. This testing shows how vulnerable your network shares — and sensitive information
    — can be. You can find shares with default permissions and access rights enabled.
    Trust me; they''re everywhere!


    The best way to test for share weaknesses is to log into the Windows system via
    a standard local or domain user with no special privileges and then run an enumeration
    program so you can see who has access to what.'
