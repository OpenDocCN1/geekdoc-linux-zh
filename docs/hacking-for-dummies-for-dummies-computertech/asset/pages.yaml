  md: '# Countermeasures against unsecured login systems


    You can implement the following countermeasures to prevent people from attack-ing
    login systems in your web applications:


    +   Any login errors that are returned to the user should be as generic as possible,
    saying something similar to Your user ID and combination is invalid.


    +   The application should never return error codes in the URL that differentiate
    between an invalid user ID and an invalid password.


    If a URL message must be returned, the application should keep it as generic as
    possible. Here''s an example:


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_311_0.png)


    ```

    www_your_app.com/login.cgi?success=false

    ```


    This URL message may not be convenient to the user, but it helps hide the mechanism
    and the behind-the-scenes actions from the attacker.


    +   Use CAPTCHA (also reCAPTCHA) or web login forms to help prevent-cracking attempts.


    +   Employ an intruder lockout mechanism on your web server or within your web
    applications to lock user accounts after around 10 failed login attempts. This
    chore can be handled via session tracking or via a third-party web application
    firewall add-on, as I discuss in “Putting up firewalls” later in this chapter.


    +   Check for and change any default passwords to passwords that are easy to remember
    yet difficult to crack.


    # Performing general security scans for web application vulnerabilities


    I want to reiterate that you need to perform both automated and manual testing
    against your web systems. You''re not going to see the whole picture by relying
    on one of these methods. I highly recommend using an all-one-web vulnerability
    scanner such as Acunetix Web Vulnerability Scanner or Netspark to root out web
    vulnerabilities that would be difficult, if not impossible, to find-otherwise.
    Combine the scanner results with a malicious mindset and the hacking techniques
    I describe in this chapter, and you''re on your way to finding the security flaws
    that matter.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# TESTING MODERN WEB 2.0 APPLICATIONS


    Newer web technologies, originally dubbed Web 2.0, have changed the way that the
    Internet is used. From YouTube to Facebook to Twitter, new server and client-side
    technologies like SOAP web services, Ajax, and HTML5 are being out as though they''re
    going out of style. These technologies aren''t just consumer technologies. Businesses
    see the value in them, and developers are excited to use them.


    Unfortunately, the down side of these technologies is complexity. This rich Internet
    applications are so complex that developers, quality-assurance analysts, and security
    managers are struggling to keep up with all their associated security issues.
    Don''t get me wrong: the vulnerabilities in newer applications are similar to
    what show up in legacy technologies such as XSS, SQL injection, and parameter
    manipulation. You have to remain vigilant.


    In the meantime, here are some tools you can use to test flaws in your modern
    web applications:


    +   * Web Developer (http://crispeedicker.com/work/web-developer) for analyzing
    script code and performing other manual checks.

    * WSigger (https://www.mcafee.com/us/downloads/free-tools/wsdigger.aspx) for analyzing
    web services.


    Many modern web vulnerability scanners can also uncover flaws in these newer technologies.


    # Minimizing Web Security Risks


    Keeping your web applications secure requires ongoing vigilance in your vulnerability
    and penetration testing efforts and on the part of your web developers and vendors.
    Keep up with the latest hacks, testing tools, and techniques, and let your developers
    and know that security needs to be a top priority for your organization. I discuss
    getting security buy-in in Chapter 20.


    You can gain hands-on experience testing and hacking web applications by using
    the following resources:


    +   * OWASP WebGoat Project (https://www.owasp.org/index.php/Category:OWASP_WebGoat_Project).'
  merge: -1
  pgno: 312
- img_proc: true
  md: '> >> Foundstone''s Hme Tools (https://www.mcafee.com/hk/downloads/free-tools/hacme-bank.aspx
    and https://www.mcafee.com/uk/downloads/free-tools/hacmebooks.aspx).


    I highly recommend that you check these tools and get your hands dirty!


    # # Practicing security by obscurity


    The following forms of security by obscurity (hiding something from obvious view
    using trivial methods) can prevent automated attacks from worms or scripts that
    are hard-coded to attack script types or default HTTP ports:


    +   >> To protect web applications and related databases, use different machines
    to run each web server, application, and database server.


    The operating systems on these machines should be tested for security vulnerabilities
    and hardened based on best practices and the countermeasures described in chapters
    12 and 13.


    +   >> Use built-in web server security features to handle access controls and
    process isolation, such as the application-isolation feature in IIS. This practice
    ensures that one web application is attacked, it won''t necessarily put other
    applications running on the same server at risk.


    +   >> Use a tool for obscuring your web server''s identity — essentially anonymizing
    your server. An example is Port80 Software''s Mask (https://www.port80.com/products/servermask).


    +   >> If you are running a Linux web server, use a program as IP Personality
    (http://personality.sourceforge.net) to change the operating-system fingerprint
    so that the server looks like it''s running something else.


    +   >> Change your web application to run on HTTPS on a nonstandard port. Change
    from the default HTTP port 80 or HTTPS port 443 to a high port number, such as
    8877, and if possible, set the server to run as an unprivileged user — that is,
    other than system, administrator, and so on.


    Never, ever rely on obscurity alone; it isn''t foolproof. A dedicated attacker
    may determine that the system isn''t what it claims to be. Still, even with the
    naysayers, it can be better than nothing.


    CHAPTER 15 Web Applications and Mobile Apps 299'
