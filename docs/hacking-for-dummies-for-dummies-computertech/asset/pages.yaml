- img_proc: true
  md: 'and not returning false positives. Nmap allows you to run the following addi-scans:


    +   **Connect**: This basic TCP scan looks for any open TCP ports on the host.
    You can use this scan to see what''s running and determine whether IPSes, firewalls,
    or other devices logging the connections.


    +   **UDP scan**: This basic UDP scan looks for any open UDP ports on the host.
    You can use this scan to see what''s running and determine whether IPSes, firewalls,
    or other devices logging the connections.


    +   **SYN Stealth**: This scan creates a half-open TCP connection with the host,
    possibly evading IPS systems and logging devices. This scan is a good one for
    testing IPSes, and other logging devices.


    +   **Fin Stealth, Xmas Tree, and Null**: These scans let you mix things up by
    sending strangely formed packets to your network hosts so that you can see how
    they respond. These scans change the flags in the TCP headers of each packet,
    which allows you to test how host handles them to point out TCP/IP implementations
    as well as patches that may be applied.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_147_0.png)


    Be careful when performing these scans. You can create your own Dos attack and
    potentially crash applications or systems. Unfortunately, if you have a weak TCP/IP
    scan (the software that controls TCP/IP communications on your hosts), there''s
    no good way to prevent your scan from creating a Dos attack. A good way to help
    reduce the chances of such an attack is to use the slow Nmap timing options —
    Paranoid, Sneaky, or Polite when running your scans.


