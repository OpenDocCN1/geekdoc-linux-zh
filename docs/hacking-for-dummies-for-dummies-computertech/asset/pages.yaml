    One thing worth noting: WPA and WPA2 running in “enterprise mode” require an 802.1x
    authentication server, such as a RADIUS server, to manage accounts for the network.
    Wireless networks running with this type of configuration are difficult to crack,
    so your testing efforts would be better served elsewhere on your network.


    For nonenterprise wireless APs (and that’s mostly what I see in), there’s no good
    reason to run WPA2 with presared keys (PSKs).


    You can also use attack to crack WPA and WPA2-PSK. To crack it you have to wait
    for a wireless client to authenticate with it A quick quick and dirty way to force
    the reauthentication process is to send a deauthentication packet to the broadcast
    point. Peter T. Davis and I cover this in detail in Hacking Wireless Networks
    For Dummies (John Wiley & Sons, Inc.).


    You can use airodump-ng to capture packets and then start attack (or run simultaneously)
    to initiate cracking the PSK by using the following command-line options:


    ```

    airrack-ng -a2 -w path_to_wordlist &,capture file(s);

    ```


    WPA recovery depends on a good dictionary. The dictionary files available at https://www.outpost9.com/files/Wordlists.html
    are a good starting point. Even with a great dictionary full of potential passwords,
    I’ve found that dictionary attacks against WPA are futile. Know your lists so
    that you don’t waste much time trying to crack WPA PSKs that aren’t crackable.


    Another commercial alternative for cracking WPA and WPA2 keys is ElecSoft Wireless
    Security Auditor (EWSA). Using EWSA, simply capture wireless packets in the tcdump
    format (every WLAN analyzer supports this format) and load the capture file into
    the program; thereafter, you have the PSK. EWSA is a little different because
    it can crack WPA and WPA2 PSKs in a fraction of the time it normally takes, but
    there’s a caveat: You must have a computer with a supported NVIDIA or AMD video
    card. Yep, EWSA doesn’t just use the processing power of your GPU; it harnesses
    the power and mammoth acceleration capabilities of the video card’s graphics processing
    unit (GPU). Now, that’s innovation!


