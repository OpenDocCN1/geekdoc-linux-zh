  md: '# Cracking files


    Most password-protected files can be cracked in seconds or minutes. You can demonstrate
    this "wow factor" security vulnerability to users and management. Here''s a hypothetical
    scenario that could occur in the real world:


    +   1. Your chief financial officer (CFO) wants to send some confidential financial
    information in a Microsoft Excel spreadsheet to a company member.

    2. She protects the spreadsheet by assigning it a password during the file-save
    process in Excel.

    3. For good measure, she uses WinZip to compress the file and adds password to
    make it *really* secure.

    4. The CFO sends the spreadsheet as an email attachment, assuming that the email
    will reach its destination.


    The financial advisor''s network has content filtering, which monitors incoming
    emails for keywords and file attachments. Unfortunately, the financial firm''s
    network administrator is looking in the content-filtering system to see what''s
    coming.


    +   5. This rogue network administrator finds the email with the confidential
    attachment, saves the attachment, and realizes it''s password-protected.

    6. The network administrator remembers a great password-cracking tool called Advanced
    Archive Recovery (www.microsoft.com/archpr .html) that can help him, so he proceeds
    to it crack the password.


    Cracking password–protected files is as simple as that! All that the network administrator
    must do is forward the confidential spreadsheet to his buddies or to the company''s
    competitors.


    If you carefully select the right options in Advanced Archive Recovery, you can
    dramatically shorten your testing time. If you know that a password is fewer than
    five characters or is all lowercase, you can cut your cracking time in half.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_125_0.png)


    TIP


    I recommend performing these file–password–cracking tests on files that you capture
    with a content–filtering or network–analysis tool. This method is a good way to
    determine whether your users are adhering to policy and using adequate passwords
    to protect the sensitive information that they''re sending.


    # Countermeasures


    The best defense against weak file password protection is requiring your users
    to use a stronger form of file protection, as Pretty Good Privacy (PGP) or


