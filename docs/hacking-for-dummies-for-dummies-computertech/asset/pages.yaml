  md: 'If you don''t want to research your potential vulnerabilities and can jump
    right into testing, you have a couple of options:


    +   **Manual assessment:** You can assess the vulnerabilities by connecting to
    the parts that are exposing the service or poking around in these spots. You should
    manually assess systems (such as web applications). The vulnerability reports
    in the preceding databases often disclose how to do this, at least generally.
    If you have a lot of free time, performing these tests manually may work for you.


    +   **Automated assessment:** Manual assessments are great ways to learn, but
    people usually don''t have time to complete most manual steps. If you''re like
    mine, scan for vulnerabilities automatically when you can and dig around


    Many vulnerability assessment scanners test for flaws on specific platforms (such
    as Windows and Linux) and types of networks (wired or Linux). They test for specific
    system vulnerabilities and may focus on standards such as the SANS Critical Controls
    and the Open Web Security Project (https://www.owasp.org). Some scanners map the
    business logic within a web application; others map the whole network; others
    help software developers test for code flaws. The drawback to these tools is that
    they find only individual vulnerabilities; they don''t necessarily aggregate and
    correlate vulnerabilities across an entire network. This task is where your skills
    and the methodologies you share in this book come into play.


    One of my favorite security tools is a vulnerability scanner called Nexpose by
    Rapid7 (https://www.rapid7.com/products/expose). It''s both a scanner and vulnerability
    assessment tool, and it offers a great deal of help for vulnerability management.
    You can run one-time scans immediately or schedule scans to run on a periodic
    basis.


    With most good security tools, you pay for Nexpose. It isn''t the least expensive
    tool, but you do get what you pay for, especially when it comes to taking you
    (such as when PCI DSS is required of your business). A free version, the Community
    Edition, is available for scanning smaller networks with fewer features. Additional
    vulnerability scanners that work include QualysGuard (https://www.qualys.com)
    and GFI LanGuard (https://www.gfi.com/products-and-solutions/network-security-solutions).


    Assessing vulnerabilities with a tool such as Nexpose requires follow-up expertise.
    You can''t rely on the scanner alone. You study the reports to base your recommendations
    on the content and criticality of the tested systems. You''ll find that higher–end
    vulnerability scanners provide proof and reliable information to help you in your
    validation efforts.


