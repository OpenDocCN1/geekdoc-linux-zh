  md: '# Using Metasploit


    After you find a vulnerability, the next step is exploiting it. In this example,
    I used Metasploit Framework (an open-source tool owned and maintained by Rapid7)
    to obtain a remote command prompt on the vulnerable server. Here''s how you can
    do the same thing:


    +   1. Download and install Metasploit Framework (`https://www.metasploit.com`).


    I used the Windows version; you can download and run the executable.


    +   2. When the installation is complete, run the Metasploit Console, which is
    Metasploit''s main console.


    (You can also access a web-based version of Metasploit through your browser, but
