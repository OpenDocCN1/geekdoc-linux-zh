  md: '# WHOIS


    The best starting point is to perform a WHOIS lookup by using any of the tools
    available on the Internet. In case you''re not familiar with it, WHOIS is a protocol
    you can use to query online databases such as Domain Name System (DNS) registries
    to find out more about domain names and IP address blocks. You may have used WHOIS
    to check whether a particular Internet domain name was available.


    For security testing, WHOIS provides the following information that can give a
    hacker a leg up in starting a social engineering attack or scanning a network:


    +   - Internet domain registration information, such as contact names, phone numbers,
    and mailing addresses

    - DNS servers responsible for your domain


    You can look up WHOIS information at one of the following places:


    +   - WHOIS.net (https://www.whois.net)

    - A domain registrar''s site (such as www.godaddy.com)

    - Your Internet service provider''s technical support page


    Two of my favorite WHOIS tools websites are DNSStuff (www.dnsstuff.com) and MXToolbox
    (https://toolbox.com). For example, you can run DNS queries directly from MXToolbox
    to do the following:


    +   - Display general domain-registration information.

    - Show which host handles email for a domain (the Mail Exchanger [MX] record).

    - Map the location of specific hosts.

    - Determine whether the host is listed on certain blacklists.


    An inexpensive commercial tool called SmartWhois (https://www.tamos.com/products/smartwhois)
    is handy for WHOIS lookups. A free site you can use for more basic Internet domain
    queries is http://dnstools.com. Another commercial product called NetScanTools
    Pro (https://www.nettools.com) is excellent at gathering information, among many
    other things. I cover this tool and others in more detail in Chapter 9.


