    # Determining Which Systems to Test


    After you''ve established your overall goals, decide which systems to test. You
    may not want — or — to assess the security of all your systems at the same time.
    Assessing the security of all your systems could be quite an undertaking and might
    lead to problems. I''m not recommending that you don''t assess every computer
    and application you have. I''m just suggesting that whenever possible, you should
    break your projects into smaller chunks to make them more manageable, especially
    if you''re starting out. The Pareto principle (focusing on your highest-pay tasks)
    should take precedence. You might decide which systems to test based on a high-level
    risk analysis, answering questions as these:


    +   - What are your most critical systems?

    - Which systems, if accessed without authorization, would cause the most trouble
    or suffer the greatest losses?

    - Which systems appear to be most vulnerable to attack?

    - Which systems are undocumented, rarely administered, or are the ones you know
    the least about?


    The following list includes devices, systems, and applications on which you might
    perform vulnerability and penetration tests:


    +   - Routers and switches

    - Firewalls

    - Wireless access points

    - Web applications (internal, external (hosted locally or inand the cloud)


