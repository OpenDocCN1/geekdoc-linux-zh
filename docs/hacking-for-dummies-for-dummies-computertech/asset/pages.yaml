  md: '![](img/6f4b05e27c5ed3644d5304cc1cefc73c_240_0.png)


    I recommend running authenticated scans as a domain or local administrator. Authenticated
    scanning shows you the greatest number of security flaws as well as who has access
    to what. You''ll likely be surprised to find that many vulnerabilities are accessible
    via standard user accounts. You don''t necessarily need to run authenticated scans
    every time you test for security flaws, but running them once or twice per month
    is a great idea.


    > Everything you do — or do not do — in terms of security vulnerability and penetration
    testing will either help you or hide you in a court of law after a breach occurs.


    As mentioned earlier in this chapter, you can use Microsoft Baseline Security
    Analyzer to check for basic vulnerabilities and matching patches. MBSA is a free
    utility from Microsoft that checks all Windows XP and later operating systems
    for missing patches and other weaknesses. Windows 10 isn''t listed supported,
    but the tool still works on Windows 10 systems. It also tests Windows, SQL Server,
    Microsoft Office, and IIS for basic security settings, such as passwords. You
    can use these tests to identify security flaws in your systems.


    With MBSA, you can scan the local system you''re logged in or to computers across
    the network. One caveat: MBSA requires an administrator account on the local machine(s)
    you''re scanning.


