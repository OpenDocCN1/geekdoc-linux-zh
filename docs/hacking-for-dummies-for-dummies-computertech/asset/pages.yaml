- img_proc: true
  md: 'After you enter this information, the web application probably will respond
    with a message similar to Your user ID is invalid or Your password is invalid.
    Or the web application may return a generic error message, such as Your user ID
    and password combination is invalid, and return different error codes in the URL
    for user IDs and passwords, as shown in Figures 15-7 and 15-8.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_308_0.png)


    FIGURE 15-7:

    The URL returns an error when an invalid user ID is entered.


    Either situation is bad news, because the application is telling you not only
    which parameter is invalid, but also one is valid. Malicious attackers now know
    a good username or password, their workload is cut in half! If they know the username
    (which is usually easier to guess), they can write a script to automate the password-cracking
    process, and vice versa.


    You should also take your login testing to the next level by using a web cracking
    tool like Brutus (www.noodle.net/brutus/index.html), as shown in Figure 15-9.
    Brutus is a simple tool that can be used to crack HTTP and form-based authentication
    mechanisms through dictionary and brute-force attacks.


    > As with any type of password testing, this task can be long and arduous, and
    run the risk of locking out user accounts. Proceed with caution.


