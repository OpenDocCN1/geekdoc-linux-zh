- img_proc: true
  md: '> REMEMBER You must do manual analysis. You definitely want to use a scanner,
    because scanners find around half of the issues. For the other half, you must
    pick up where scanners leave off to truly assess the overall security of your
    websites and applications. You have to do some manual work, because web vulnerability
    scanners are faulty, because poking and probing web systems requires old fashioned
    hacker trickery and your favorite browser, doing things that simply can''t be
    automated (yet).


    You can use general network vulnerability scanners such as Nepose and Nessus,
    as exploit tools such as Metasploit to test websites and applications. You can
    use these tools to find (and exploit) weaknesses at the web-server level that
    you might not find with standard web-scanning tools and manual analysis. Google
    can also be beneficial for rooting through web applications and looking for sensitive
    information. Although these non-application-specific tools can be beneficial,
    it''s important to know that they won''t drill down as deep as the tools I mention
    in the preceding list.


    # Seeking Out Web Vulnerabilities


    Attacks against vulnerable websites and applications via Hypertext Transfer Protocol
    (HTTP) make up the majority of all internet-related attacks. Most of these attacks
    can be carried out even if the HTTP traffic is encrypted (via HTTPS, also known
    as HTTP over SSL/TLS) because the communications medium has nothing to do with
    these attacks. The security vulnerabilities lie within the websites and applications
    themselves or within the web server and software that the systems run on and communicate
    with.


    Many attacks against websites and applications are minor nuisances and may not
    affect sensitive information or system availability. But some attacks can wreak
    havoc on your systems, putting sensitive information at risk and even placing
    your organization out of compliance with state, federal, and international information
    privacy and security laws and regulations.


    # Directory traversal


    I start out with a simple directory traversal attack. Directory traversal is a
    basic weakness, but it can turn up interesting and sometimes sensitive information
    about a web system. This attack involves browsing a site and looking for clues
    about the server''s directory structure and sensitive files that may have been
    loaded intentionally or unintentionally.


    Perform the following tests to determine your website''s directory structure.'
  merge: -1
