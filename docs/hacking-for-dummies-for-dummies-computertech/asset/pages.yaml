  md: '# # Recognizing How Malicious Attackers Beget Ethical Hackers


    You need protection from hacker sheniganans; you have to become savvy as the guys
    who are trying to attack your systems. A true security assessment possesses the
    skills, mindset, and tools of a hacker is trustworthy. He or she performs hacks
    as security testing against systems based on how hackers think and work.


    Ethical hacking (otherwise known as vulnerability and penetration testing) involves
    the tools, tricks, and techniques that criminal hackers use, with one major difference:
    It''s performed with the target''s permission in a professional setting. The intent
    of this testing is to discover vulnerabilities from a malicious attacker''s viewpoint
    to better secure systems. Vulnerability and penetration testing is part of an
    overall information risk management program that allows for ongoing security improvements.
    This security testing can also ensure that vendors'' products are legitimate.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_24_0.png)


    # ## Vulnerability and penetration testing versus auditing


    Many people confuse security testing via vulnerability and penetration testing
    with security auditing, but big differences exist in the objectives. Security
    auditing involves comparing a company''s security policies (or compliance requirements)
    with what''s actually taking place. The intent of security auditing is to validate
    that security controls exist, typically by using a risk-based approach. Auditing
    often involves reviewing business processes and in some cases isn''t technical.
    Security audits, in fact, can be as basic as security checklists that simply serve
    to meet a compliance requirement.


    Not all audits are high-level, but many of the ones I''ve seen — especially those
    involving compliance with the Payment Card Industry Data Security Standard (PCI
    DSS) and the Health Insurance Portability and Accountability Act (HIPAA) — are
    quite simplistic. Often, these audits are performed by people who have no technical
    computer, network, or application experience — or, work outside IT altogether!


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_24_1.png)


    10 PART 1 Building the Foundation for Security Testing'
