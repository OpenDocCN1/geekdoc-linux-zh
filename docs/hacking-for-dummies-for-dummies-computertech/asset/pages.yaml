  md: '# Countermeasures against network protocol vulnerabilities


    A network analyzer can be used for good or evil. The good ensures that your security
    policies are followed. The evil helps someone work against you. A few countermeasures
    can help minimize the risk someone using an unauthorized network analyzer. Just
    keep in mind that there''s no way to prevent it completely.


    > An external attacker or malicious user can connect to your network (physically
    or wirelessly), he can capture packets on the network, even if you''re using an
    Ethernet switch.


    # PHYSICAL SECURITY


    Ensure adequate physical security is in place to prevent someone from plugging
    into your network by doing the following things:


    +   * Keep the bad guys out of your server room and wiring closet. Ensure that
    the web, Telnet, and Secure Shell (SSH) management interfaces on your Ethernet
    switches are especially secure to keep someone from changing the switch port configuration
    and everything that goes across the wire.

    * Make sure that unsupervised areas, such as an unoccupied lobby or training room,
    don''t have live connections.


    For details on physical security, see Chapter 7.


    # NETWORK ANALYZER DETECTION


    You can use some older utilities to determine whether someone is running an unauthorized
    network analyzer on your network:


    +   * Sniffdet(http://sniffdet.sourceforge.net) for Unix-based systems.

    * PromiscDetect(http://ntsecurity.nu/toolbox/promiscdetect) for Windows.


    Certain IPS can also detect whether a network analyzer is running on your network.
    These tools enable you to monitor the network for Ethernet cards that are running
    in promiscuous mode. You simply load the programs on your computer, and the programs
    alert you if they see promiscuous behaviors on the network (Sniffdet) or local
    system (PromiscDetect).


    146 PART 3 Hacking Network Hosts'
