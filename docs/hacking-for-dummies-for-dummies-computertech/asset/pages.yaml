  md: 'If you have nothing but on your hands, you might uncover these types of vulnerabilities
    manually. In the interest of accuracy (sanity), however, these attacks are best
    carried out by running a web vulnerability scanner, which can detect the weakness
    by sending hundreds of URL iterations to the web system very quickly.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_300_0.png)


    # Hidden field manipulation


    Some websites and applications embed hidden fields in web pages to pass state
    information between the web server and the browser. Hidden fields are represented
    in a web form as `<input type="hidden">`. Because of poor coding practices, hidden
    fields often contain confidential information (such as products on an e-commerce
    site) that should be stored only in a back-end database. Users shouldn''t believe
    hidden fields (the name), but a curious attacker can discover and exploit them.
    To do so, follow these steps:


    +   1. View the HTML source code.


    To see the source code in Explorer and Firefox, right-click the page and choose
    View Source or View Page Source from the contextual menu.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_300_1.png)


    +   2. Change the information stored in these fields.


    A malicious user might change a price from $100 to $10, for example.


    +   3. Repost the page to the server.


    This step allows the attacker to obtain ill-gotten gains, such as a lower price
    on a web purchase.


    Such vulnerabilities are becoming rare, but like URL manipulation, the possibility
    for exploitation exists, so it pays to keep an eye out.


    Using hidden fields for authentication (login) mechanisms can be dangerous. I
    once came a multifactor authentication intruder lockout process that relied on
    a hidden field to track the number of times the user attempted to log in. This
    variable could be reset to zero for each login attempt and thus facilitate a scripted
    dictionary or brute-force login attack. It is somewhat ironic that the security
    control designed to prevent intruder attacks was vulnerable to an intruder attack.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_300_2.png)


    Several tools, such as the proxies that come with commercial vulnerability scanners
    and Burp Proxy, can easily manipulate hidden fields. Figure 15–3 shows the WebInspect
    SPI Proxy interface and a web page''s hidden field.


    If you across hidden fields, you can try to manipulate them to see what can be
    done. It''s as simple as that.'
