    # Chapter 4


    # # Hacking Methodology


    Before you headfirst into your security testing, it''s critical to have a methodology
    to work from. Vulnerability and penetration testing involves more than poking
    and probing a system or network. Proven techniques can guide you along the hacking
    highway and ensure that you end up at the right destination. Using a methodology
    that supports your testing goals separates you from the amateurs. A methodology
    also ensures that you make the most of your time and effort.


    # ## Setting the Stage for Testing


    In the past, a lot of security assessment techniques involved manual processes.
    Now certain vulnerability scanners automate various tasks, from testing to remediation
    validation (the process of determining whether a vulnerability was fixed). Some
    vulnerability scanners can even allow you to take corrective actions. These tools
    allow you to focus on the tests and less on the specific steps involved. Following
    a general methodology and understanding what''s going behind the scenes will help
    you find the things that really matter.


    Think logically — like a programmer, a radiologist, or a home inspector — to dissect
    and interact with all the system components to see how they work. You gather information,
    often in many small pieces, and assemble the pieces of the puzzle. You start at
    point A with several goals in mind, run your tests (repeating


    CHAPTER 4 Hacking Methodology 49'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'many steps along the way), and move closer until you discover security vulnerabilities
    at point B.


    The process used for such testing is the same as the one that a malicious attacker
    would. The primary differences lie in the goals and how you achieve them. Today''s
    attacks can come from any angle against any system — not just from the perimeter
    of your network and the Internet, as you may have been taught in the past. Test
    every possible entry point, including partner, vendor, and customer networks,
    as well as home users, wireless networks, and mobile devices. Any human being,
    computer system, or physical component that protects your computer systems — both
    inside and outside your buildings — is fair game attack, and it needs to be tested
    eventually.


    When you start rolling with testing, you should keep a log of the tests you perform,
    the tools you use, the tests you test, and your results. This information can
    help you do the following:


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_64_0.png)


    +   - Track what worked in previous tests and why.

    - Prove what you did.

    - Correlate your testing with firewalls, intrusion prevention systems (IPS), and
    other log files if trouble or questions arise.

    - Document your findings.


    In addition to general notes, taking screen captures of your results (using Snagit,
    Camtasia, or a similar tool) whenever possible is very helpful. These shots come
    in handy later if you need to show proof of what occurred, and they''ll also be
    useful as you generate your final report. Also, depending on the tools you use,
    these screen captures may be your only evidence of vulnerabilities or exploits
    when the time comes to write your final report. Chapter 3 lists the general steps
    involved in creating and documenting a security testing plan.


    ![](img/6f4b05e27c5ed3644d5304cc1cefc73c_64_1.png)


    Your main tasks are to find the vulnerabilities and to simulate the gathering
    and systems carried out by someone with malicious intent — a partial attack on
    one computer, perhaps, a comprehensive attack against the entire network. Generally,
    you look for weaknesses that malicious users and external attackers might exploit.
    Assess both external and internal systems (including processes and procedures
    that involve computers, networks, people, and physical infrastructures). Look
    for vulnerabilities. Check how all your systems interconnect and how private systems
    and information are (aren''t) protected from untrusted elements.


    # 50 PART 1 Building the Foundation for Security Testing'
