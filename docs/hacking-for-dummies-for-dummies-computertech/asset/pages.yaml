    # # Countermeasures against patch vulnerability exploits


    Patch your systems — the Windows OS and any Microsoft or third-party applications
    running on them. I know that patching is a lot easier than done. Combine that
    practice with the other hardening recommendations I provide in this chapter, however,
    and you''ll have a pretty darned secure Windows environment.


    To get your arms around the patch process, automate it wherever you. You can use
    the following tools:


    224 PART 4 Hacking Operating Systems'
