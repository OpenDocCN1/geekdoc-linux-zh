- img_proc: true
  md: 'When unsecured Windows-based systems are attacked, serious things can happen
    to a tremendous number of computers around the world.


    # Choosing Tools


    Hundreds of Windows hacking and testing tools are available. The key is finding
    a set of tools that can do what you need and that you''re comfortable using.


    Many security tools, including some of the tools described in this chapter, work
    only in certain versions of Windows. The most recent version of each tool in this
    chapter should be compatible with currently supported versions of Windows, but
    your mileage may vary.


    I''ve found that the security tools and other power-user applications I install
    in Windows — especially those that tie into the network-user drivers and TCP/IP
    stack — the most unstable Windows. I''m talking about slow performance, general
    instability, and even the occasional Blue Screen of Death. Unfortunately, the
    only fix is to reinstall Windows and all your applications. After years of rebuilding
    my systems every few months, I wisely upped and bought a copy of VMware Workstation
    and I can junk up with testing tools without worrying about all the software I
    affect affecting ability to get my other work done. (Ah, the memories of those
    DOS and Windows 1.x days, when things were so much simpler!)


    # Free Microsoft tools


    You can use the following Microsoft tools to test your systems for various weaknesses:


    +   **Built-in Windows programs** for NetBIOS and TCP/UDP service enumeration,
    as such these:

    * nbtstat for gathering NetBIOS name-table information.

    * nstat for displaying open ports on the local Windows system.

    * net for running various network-based commands, including viewing shares on
    remote Windows systems and adding user accounts after you gain a remote command
    prompt via Metasploit.

    **Microsoft Baseline Security Analyzer (MBSA)** (https://www.microsoft.com/en-us/download/details.aspx?id=75SS8)
    to test for missing patches and basic Windows security settings.'
