    \ to 13\nz is less than 21\n>>>\n```\n\n# 2.4.5 Determinate and Indeterminate\
    \ Repetition Structures and Recursion\n\nUsing the procedural/imperative model,\
    \ Python3 can repeat segments of program or script flows in two basic ways: via\
    \ determinate repetition or indeterminate repetition structures. Traditionally,\
    \ a determinate repetition structure is *counting repetition*, and an indeterminate\
    \ repetition structure is *logical repetition*. These two methods are implemented\
    \ with the *for* procedural statement, and the *while* procedural statement. Generally,\
    \ if you know ahead of time (for example, when you are writing the code) how many\
    \ repetitions of a block of code you want to execute, you use the *for* statement,\
    \ and if you do not know (when, for example, you allow the user to input the number\
    \ of repetitions as the script file is), you use the *while* statement.\n\nOf\
    \ course, it is possible to implement the same two ways of repetition by not using\
    \ a specific structured programming approach; for example, by using conditional\
    \ execution, and unstructured switching to obtain the same results. This is not\
    \ good practice, and we choose to show the structured approach in Python3.\n\n\
    Make sure that in the body of statements included in the indeterminate repetition\
    \ block that **while** is executing, the test condition for continued execution\
    \ becomes false. Otherwise, this will result in *infinite repetition!* To halt\
    \ infinite repetition in an executing script file, hold down the <Ctrl> and C\
    \ keys on the keyboard at the same time.\n\nA note about Python3 style is in order\
    \ at this point.\n\n# Pythonic\n\nProceeding from Guido van Rossum's definition\
    \ of Python in the Language Reference, a common technique in Python3 is to loop\
    \ over all elements of an *iterable* object using a **for statement**. Many other\
    \ languages do not have this type of construct, so people unfamiliar with Python3\
    \ sometimes use a numerical counter instead, as as:\n\n```\n>>>for i in range(len(money)):\n\
    \  print money[i]\n```"
