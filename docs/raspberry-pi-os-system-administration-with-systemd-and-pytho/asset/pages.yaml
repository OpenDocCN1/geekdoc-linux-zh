    # 1.9 Installing ZFS, and zpool and zfs Command Syntax


    The Zettabyte File System (ZFS) is an advanced journaling file system, and volume
    manager, developed at Sun Microsystems, and has many functions and facilities
    for maintaining redundancy and security on server-class computers. It''s also
    useful for an individual user at home, who wants to use the same objectives, but
    on a smaller scale system, such as using Raspberry Pi hardware. Following are
    the instructions for installing ZFS, and the general syntax forms for the zpool
    and zfs commands, the two premiere ZFS tools. Everything we show in the sections
    below is on Ubuntu 23.04, running on a Raspberry Pi 4, the installation of which
    is shown in Section 1.2.4. For a more complete description of these two important
    commands, see the man pages for zfs and zpool on an Ubuntu 23.04 system (after
    you have installed ZFS according to the instructions given below in Section 1.9.1).'
