    # 2.5.4 Multi-Threaded Concurrency with Python


    The first question you must ask yourself how and why the Raspberry Pi OS functions
    the way it does: Given the limited resources, and very prodigious nature of modern
    computer hardware, how does an operating system maximize performance and efficiency
    for all users of the system? And furthermore, how can use programs, such as Python3
    scripts, reflect this technique?'
