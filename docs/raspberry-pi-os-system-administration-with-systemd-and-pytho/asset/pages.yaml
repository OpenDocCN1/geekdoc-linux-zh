    Raspberry Pi system is the http.server module, which comes standard with Python3.
    The value of using this module, at least for an ordinary user of a Raspberry Pi
    system, is that you can quickly and easily implement a system that can be programmed,
    configured, and controlled by that ordinary user.


    Another very useful, and important aspect of user interaction with a Raspberry
    Pi system, that we cover in Section 2.3.2.2, is how you can maintain the files
    on your system. The Python3 standard library, and many user-written libraries
    and modules, can help you do this efficiently on the Raspberry Pi OS. You can
    use the extensive syntax, and the multi-paradigm programming capabilities of Python3,
    to go far beyond the capabilities of doing operating system and file maintenance
    that are available in any of the shell script-creation programs.


    User file maintenance consists of creating, saving, organizing, and deleting files
    on your system, in your own account, or globally for the entire system and its
