  md: '# Raspberry Pi OS System Administration with systemd and Python


    And if you followed the technique in Section 1.2.3, and your boot/system medium
    is an externally mounted USB2 or 3 device, like an SSD, you can use the SD Card
    Copy to clone the original SSD onto another one of at least the same, or greater,
    capacity than the original.


    A couple of words of caution are in here order.


    First, when using the SD Card Copy, make sure you use the "Copy from Device",
    and the "Copy to Device" correctly. The "Copy from Device" must be the original
    boot/system medium, and the "Copy to Device" can be another equal-larger capacity
    medium that is mounted inside of an enclosure, connected via USB port on the Raspberry
    Pi hardware. Don''t confuse the two media, or you''ll end up with no bootable
    clone! When we cloned a boot/system SSD, the original and the clone were the exact
    same 128 GB SSDs, made by Silicon Power, mounted in Orico USB3 Hard Drive enclosures.
    And we were very careful to specify them correctly to the SD Card Copy!


    Second, some manufacturer''s products, even though they''re nominally the same
    capacity, are in fact different. So you should try to ensure this ahead of time.


    The drawback to using this approach is of course that the cloning takes a snapshot
    of the entire system as it exists at one particular moment in time. This is unlike
    the rsync command, automated by each cron, or a systemctl timer, which snapshots
    can be taken regularly, and automatically, according to some timed schedule.


    # 1.12.3.3 Using git and github to Backup File Systems


    The git command and github.com are useful, efficient, and powerful means you can
    use to create a distributed version-control system for your software projects.
    They can also be used as a cloud-based storage and archiving facility, particularly
    if you follow the storage model we recommend in this chapter. That is, if your
    Raspberry Pi OS is installed on one medium, and all of your user data files are
    stored on another persistent medium, such as an additional USB3-mounted SSD.


    Of course, using a github repository for backup and archiving is not free. In
    addition, there are limits to the amount of data that you can store on github.
    Therefore this method of backup and archiving works best for an ordinary user,
    in a public repository at github, with small data storage requirements. Also,
    if you use another data storage model than what we recommend, the mechanics of
    doing git archiving and backup would be dependent on that data storage model.'
