    # 1.8 File Systems, Connections to Persistent Media, and Adding Media to Your
    System


    Question: What is a computer file system?


    Answer: A way of logically ordering data, so that it is persistent, can be securely
    and easily located very quickly, and accessed in a consistent way for use.


    Providing data persistence, which is the third primary objective of an operating
    system, in large part involves establishing and maintaining connections to persistent
    media, such as the microSD card that may be the system/boot disk on your hardware.
    Alternative forms of this media, and the file systems found them, can be physically
    connected via the USB3 ports on the Raspberry Pi itself, such as with SATA SSD''s
    external enclosures, and USB thumb drives. They can also be some form of remote
    virtual drive, which'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Raspberry Pi OS System Administration with systemd and Python


    as a network-available, and a mounted NFSv4 share, or remote volumes and complements
    of drives.


    In some cases, a file system may make use of a persistent storage device or medium
    at all! At this higher level of abstraction, the file system can access, organize,
    and represent any form of data, whether it is persistent or volatile. We use the
    word volatile here during the lifetime of some process or service. Of course,
    systemd and the Linux kernel control all processes and services running on the
    Raspberry Pi. Pseudo, and special-purpose file systems (sometimes called synthetic
    file systems), which can be thought of as virtual file systems, have this kind
    of characteristic.


    There are also established protocols for connecting to and accessing either the
    locations where they may reside. Two examples of access protocols that establish
    and maintain the connections to virtual, network-available media and file systems
    are the Network File System, version 4 (NFSv4), and the Internet Small Computer
    System Interface (iSCSI).


    In this section, we present an organizing scheme that we can use to think about
    types of media and file systems. A file system may be nominally assigned according
    to what media it exits on: a directly connected physical medium (such as a USB
    SATA disk), a virtual medium (such as Network-Attached Storage or Storage Area
    Networks that use NFSv4 or iSCSI), or as a specialized pseudo-file system that
    is not on a persistent medium at all (such as the cgroups or proc file systems).


