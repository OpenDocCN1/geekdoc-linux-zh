    # 1.5 User Administration


    The two most important objectives of user administration are service and security.
    First, providing service to ensure that the user base has access to and can fully
    take advantage of the resources that the Raspberry Pi OS can provide. Second,
    securing the files and processes that the user base needs to utilize those resources.
    Later in this chapter we will go over the security methodologies that a system
    administrator can deploy to keep the system secure. In Volume 3, the chapter entitled
    "Virtualization with LXC/LXD", we also show security methods that utilize various
    virtualization technologies such as LXC/LXD containers.


    The Linux technique for providing service and security to users is through read,
    write, and execute (rwx) access privileges, for the individual user, group, or
    others (u,g,o) on the system, to specific objects on the system, such as directories,
    or folders, and most importantly, to the files contained in them. Designing and
    implementing user groups, and access privileges for user groups, are the most
    important parts of this technique.


    Certainly, user account and group creation are the first steps in providing maximum
    service and security to the user base. That is true even if you are the only one
    of the system!


    A very integral part of designing user accounts and groups is the detailed consideration
    given to the recommended data storage model showed in Section 1.4.1, item 3. This
    is done by securing user files on a second, possibly redundant, storage medium,
    so that they can be kept separate from the operating system boot medium itself.
    It can be practically achieved by properly creating user accounts so that they
    have their home directories on second hard drive. As we show in Section 1.8 below,
    various ways of adding redundant persistent media very easily and effectively
    implement the model.


    We concentrate here on how to manage user accounts and groups on Raspberry Pi
    OS with the adduser, addgroup, deluser, delgroup, newcomers, passwd, and usermod
    commands. These activities are usually done a significant time after the initial
    installation of your Raspberry Pi system, but can be done during installation
    and initialization of the system. Following Table 1.2 showing brief descriptions
    of these commands.'
