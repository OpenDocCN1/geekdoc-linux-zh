    **Sequence:** An iterable which supports efficient element access using integer
    indices via the `__getitem__` special method and defines a `len()` method that
    returns the length of the sequence. Some built-in sequences are built as `list`,
    `str`, `tuple`, and `unicode`. Note that `dict` also supports `__getitem__` and
    `__len__()`, but is considered a mapping rather than a sequence because the lookups
    use immutable keys rather than integers.

    **Type:** The kind of object, such as integers or character strings.


