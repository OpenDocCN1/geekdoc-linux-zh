    * Network connections

    * Backup file objects on additional hard disks or other media

    * Compressed directories or files


    Encryption/decryption basically uses a variety of mathematical algorithms to treat
    the above targets. These algorithms are called cryptographic ciphers. The important
    terms to know when dealing with cryptography are plain text and cypher text. Plain
    text is the unencrypted, or decrypted format, and cypher text is the encrypted
    format.


    The details of encryption algorithms, their mathematics and complexity, are not
    useful to the ordinary user knowing where and when to apply them. That is, at
    the system, whole disk, partition, directory, or individual file levels. And also
    knowing why you want to use them, and carefully reasoning and designing your strategies
    for implementing these algorithms with the common command-line tools.


