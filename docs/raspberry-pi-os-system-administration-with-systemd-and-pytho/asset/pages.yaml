    # 1.13.2 Using the Advanced Packaging Tool (APT)


    For beginners, a GUI approach to package management at first might not seem to
    be the quickest and easiest way to accomplish one of the most significant post-installation
    tasks a system administrator must do. GUI approaches have some tremendous advantages,
    and not only in saving of time. But we feel the explicit control you get by using
    APT, on the command line, outweighs the initial advantages of a GUI. All of the
    tools available for APT, the apt-get command is the most useful for a beginner.


    # 1.13.2.1 Using apt-get


    The Advanced Packaging Tool (APT) is used for all aspects of managing packages.
    The most used (and useful) of its package management utilities is the CLI apt-get
    tool. Following is an abbreviated description of apt-get, from the man page to
    on our Raspberry Pi system:


    ****************************************************************

    -get - APT package handling utility - CLI version


    Syntax:


    ```

    apt [-asqdyfmubV] [-o=config_string] [-c=config_file]

    [update | upgrade | deselect-upgrade | dist-upgrade]

    install pkg [--pkg_version_number | /target_release]...]

    remove pkg... | purge pkg...]

    source pkg [--pkg_version_number | /target_release]...]

    build-dep pkg [--pkg_version_number | /target_release]...]

    download pkg [--pkg_version_number | /target_release]...]

    oremove | check | autoclean | [-v | --version]

    [-h | --help]

    ```


    Purpose: apt-get is the command-line tool for handling packages, and may be considered
    the user''s "back-end" to other tools using the APT library. Several "front-end"
    interfaces exist.


    Output: Added, removed, or updated software packages on the system.'
