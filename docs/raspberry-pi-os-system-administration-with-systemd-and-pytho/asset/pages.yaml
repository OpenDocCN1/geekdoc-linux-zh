    software, or both. Firewalls are mainly used to halt unauthorized access to a

    private network or intranet, or from the Internet. All traffic entering or leaving

    a single computer, or intranet, passes through the firewall, which can look

    at each message packet stream, and block those that do not meet specific

    security requirements set by the system administrator. These requirements

    arere codified in what are known as firewall rules.'
