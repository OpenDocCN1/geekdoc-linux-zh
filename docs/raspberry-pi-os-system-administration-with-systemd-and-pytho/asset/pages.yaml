- img_proc: true
  md: '# Python3 265


    The answer for the Raspberry Pi OS is:


    First, by separating the hardware, that is, the SoC CPU and its cores, main memory,
    and peripheral memory, into multiple virtual machinery: in short, via virtualization.


    Then, by executing instructions concurrently on this virtualized machinery—this
    means not in any particular sequence, and perhaps even all at once.


    Finally, by making sure that the data generated and stored in the file system
    persistent over time.


    Python3, as a Raspberry Pi software tool that creates user programs and scripts,
    can achieve concurrency with a mechanism called threads, and the concurrent execution
    of instructions by threads. This is very similar to UNIX and Linux system programming
    with threads.


    Similar to the Linux system programming concurrency fact, Python3 threads give
    you the ability to run several programs concurrently, in a single process. when
    you create one or more threads in your Python3 program, they are executed concurrently,
    independently of each other, and they can share information among them because
    they are using the same resources of a single process. These features make Python3
    useful in creating such things as network programming, and the creation of GUI
    programs.


    Python3 supports threads on the Raspberry Pi OS, and any other systems use the
    POSIX threads library (threads).


    To quote from the Python documentation:


