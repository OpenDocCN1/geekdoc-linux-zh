    According to Linux system administration professionals, there is an easy to remember
    and important set of considerations you must make when

    backing up the system, as the system administrator. This set of considerations
    can be posed in simple question form as:


    How, What, Why, When, Where, and Who?


    Some of the answers to these simple questions can be dovetailed together,

    and we provide a selected list of example answers as follows:'
