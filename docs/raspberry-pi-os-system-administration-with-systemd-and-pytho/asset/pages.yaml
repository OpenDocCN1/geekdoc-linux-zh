    # 1.9.2 The Syntax of the zpool and zfs Commands


    Following are the abbreviated syntax of the zpool and zfs commands, taken from
    the man pages on our system:


    zpool

    Syntax:

    zpool subcommand [options] [option arguments] [command arguments]


    Purpose: To create and manage storage pools of virtual devices, such as disk drives


    Commonly used options/features:


    +   zpool create name vdev

    Creates a new pool with name with the specified vdev

    zpool create -o copies=2 name

    Creates a new pool with the property copies set to 2

    zpool destroy name

    Destroys, or removes, a pool name

    zpool list name

    Lists storage space and health of pool name

    zpool scrub name

    Verifies that the checksums on pool name are correct

    zpool status name

    Displays the status of pool name'
