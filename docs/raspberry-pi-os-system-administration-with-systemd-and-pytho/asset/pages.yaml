    # 1.14.1.2 systemd Cgroups, Affecting the Limits of CPU Scheduling


    With the adoption of systemd in the Linux kernel in all branches of Linux, including
    Debian and its downstream distro, the Raspberry Pi OS, several new and many updated
    features have been introduced. These features completely change the startup phase
    of booting, for example. But most importantly, they radically modify both system
    and applications services (such as sshd), and are managed. One of these radically
    modified and updated features, known as Control Groups (cgroups), is completely
    reorganized with respect to service and process/thread management. Processes and
    threads, as well as system services, are grouped in a unified manner. This method
    system resource management, such as what percentage of CPU time a thread, or service
    is allocated, from the process level up to the application level. This is achieved
    by mapping cgroup structure to the system “unit tree”. We sketch systemd cgroups
    impact on the performance scheduling of processes and threads through the CPU
    in this section. In the next section, we focus on how cgroups impact memory management
    to affect system performance.


    cgroups are a mechanism for organizing services and processes/threads in a hierarchical
    tree, or “unit tree”, of groups to facilitate resource management. The structure
    of this tree is graphically illustrated using the systemd-cgroups command. We
    show how the systemd-cgroups command can be used to view and assess the cgroups
    structure. Then, control is exercised on these numbered groups to affect resources
    like CPU usage, memory management, network bandwidth, and other system service-related
    activities. This'
