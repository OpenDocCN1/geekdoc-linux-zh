    #  2.4.1 Printing Text, Comments, Numbers, Grouping Operators, and Expressions


    To use Python3 in practical examples, as shown later in this chapter, it''s absolutely
    to first become familiar with the syntax of the language. For example, how it''s
    used as a calculator, in "interpretive mode", to execute single lines of Python
    code to accomplish short, meaningful operations and tasks.


    One of the first things you must know about how a calculator works is how to enter
    numbers and mathematical expressions on the calculator. So, with Python3, instead
    of listing all the syntactic rules, we will execute a number of examples to illustrate,
    and you have work with some of the most important of those rules.


    Here are a couple of the important considerations you need to be aware before
    you enter any Python code on the Python command line or into a file.


    +   1. The rule of four: The indentation spaces that you place on each line of
    Python code are very important!


    This is done automatically for you in the Script Area of Tonny, when you are entering
    several lines of Python code.


    Since Python is a structured programming language that uses specific structures
    in blocks, those blocks are delimited, or defined by the indentation you give
    on each line (unlike in other languages that use specific printing characters
    to delimit blocks). This means you must line up your blocks of Python structures
    vertically, starting from the left-hand side, and for your purposes, use four
    spaces for each indented block. For example,


    ```

    Block 1 head

    xxxxxxxxxx

    xxxxxxxxxx

    Block 2 head

    xxxxxxxxxxxx

    xxxxxxxxxxxx

    ```'
