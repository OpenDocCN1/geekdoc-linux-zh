  md: '# Raspberry Pi OS System Administration with systemd and Python


    +   1. Only one zpool can be mapped or associated with any zdev. So if you want
    to create a zpool on a physical hard disk or one of its slices, no other existing
    active zpool can be mapped to that zdev!


    +   2. There are six types of zdev in ZFS:

    na. Disk (default): The physical hard drives in your system, usually the whole
    drive or partition slice.

    b. File: The absolute path of preallocated files/images.

    c. Raid1/2/3: Nonstandard distributed parity-based software levels.

    d. Spare: Hard drives marked as a hot spare for ZFS software RAID.

    e. Cache: Device used for a level-2 adaptive read cache (L2ARC).

    f. Log: A separate log (SLOG) called the ZFS intent log.


    +   3. Unlike a traditional file system, where the mount point of the file system
    begins at a particular mount drive letter, the default mount point for a zpool
    is root (/). This is how the path to a file named test.txt appears when it is
    in the zpool named data1 on the file system


    ```

    /data1/bob/test.txt

    ```


    Here''s how the path to a file named test.txt appears on a traditional file system:


    ```

    C:\Users\bob\Desktop\test.txt

    ```


    When you want a ZFS file system to expand onto more than one disk, for example,
    you add more disks to the zpool.


    +   4. A zpool can be enlarged by adding more devices, but it cannot be shrunk
    (at least not this time!)


