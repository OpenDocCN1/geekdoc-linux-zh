    # 25.4.2 Python Thread Example Using OOP Model


    # 25.4.3 OOP GUIs and Producer–Consumer Model Threads


    Threads are an extremely integral part of the Tk toolkit, which we illustrated
    in Section 2.5.3. This also applies in many of the functions of a GUI with synchronous
    I/O, any operation that can block, or take a long time to complete, must be spawned
    in parallel, so that the central GUI module (the main thread) is always running.
    Although spawned children can run as multiple processes, the efficiency and shared
    environment model of threads make them ideal for this role, since they run in
    the namespace of a single process. Most toolkits do not allow multiple threads
    to update the main thread in parallel-updates, and are usually restricted to the
    main thread.


    The two important points to be made about Python3 threads in a GUI are that the
    main thread handles all screen graphics updates, and that GUI must obey the synchronization
    rules established for general thread concurrency according to standardized models.


    All threads in a GUI generally follow what is called the *producer–consumer model*.
    Simply put, that''s one or more objects (the producers) are responsible for placing
    data into some storage pool, and one or more objects (the consumers) are responsible
    for removing data from that pool.


    The drawbacks to the producer–consumer model are as follows:


    The producer(s) cannot add more data than the storage pool can hold.


    The consumers(s) cannot take from an empty pool.


    The actions of all objects must be synchronized.'
