  md: '# 2.5.3 Graphical User Interfaces with Python3 and tkinter Widgets


    Until this point in the chapter, we have interacted with Python3 via a graphical
    IDE, basically in a text-based manner, where we typed commands into Tonny''s Script
    or Shell Areas, or into a text editor, and executed Python 3.9.2 to view the output
    results as text. In this section, we will build a “widget”-based GUI (widget is
    short for window gadget) GUI with Python3, where we still create the Python3 code
    as text, but see the resulting output of the Python3 script in the form of widget
    graphics. We use tkinter as the GUI interface, or toolkit. tkinter is an abbreviation
    for the “TK interface.” And “TK", which is short for “toolkit”, is a platform
    independent, customizable, and configurable library. The Python module tkinter
    allows Python programs to interact with the TK libraries, to produce pictures,
    and other forms of graphics, on the display of the Raspberry Pi.

    to accomplish this, we assume the following:


    +   1. That you are using a GUI, desktop environment to interact with your Raspberry
    Pi system. After all, that''s what Tonny is! A graphical IDE. Therefore, we also
    have a GUI capability when we program with tkinter to create GUIs.

    2. That you have Python3.X on your Raspberry Pi system. The command line sessions,
    In-Chapter Exercises, examples, and questions and problems found in this, and
    in the following sections of the chapter, all require that you have at least a
    late version of Python3 installed on your Linux system.


    Our coverage of GUI construction with tkinter uses Uses Python 3.9.2, and the
    appropriate tkinter module for those versions of Python. Depending upon the default
    Python3.X you are using, and given the specific Raspberry Pi OS distribution you
    are executing it, the tkinter installation instructions may vary slightly from
    what is shown in 2.3.3.1 below, but basically it will be the same.


    # 2.5.3.1 Installing tkinter


    The standard widget GUI package that works with Python3 is named tkinter in Python3.X.
    For you to add widget components and functionality to Python, you must be able
    to import this component package into your Python3 session.


    In this section, as much as possible and practical given the Python3 GUI scripts
