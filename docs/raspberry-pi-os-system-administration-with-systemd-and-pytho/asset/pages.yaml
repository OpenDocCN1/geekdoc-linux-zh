  md: 'Raspberry Pi OS System Administration Fundamentals


    # 1.4.3 Preliminary Considerations When Managing System Services with systemd


    The service manager that is available in our base Raspberry Pi OS is systemd.
    In fact, systemd is the system service manager for all distributions in the three
    major branches of Linux, and all important downstream Linux distributions as well,
    including Raspberry Pi OS.


    We detail system service management with systemd completely in Volume 1, and provide
    several examples of how to effectively control operating system services in a
    modern system-controlled Linux system.


    We pose a couple of preliminary questions about “system services” on the Raspberry
    Pi OS.


    Question: What is a daemon?


    Answer: Basically a daemon is a background, ongoing process that is not linked
    or controlled by a terminal. Particularly not connected to the usual way to standard
    output or start error.


    Question: Is a “service” a daemon?


    Answer: Sometimes. More accurately and generally, a service can be a process or
    collection of processes, the overall state of the system, the state of a physical
    device, a virtual device, a dataset, etc. And as a provider of resources, or a
    collection of an’ capabilities, it can have more than one. For example, the many
    layered file systems present on the system, or the multiple means of remote login
    to the system.


    # 1.4.4 Further References For System Service Management Using systemd


    In this section we provide further references for the uses of systemd service
    management, which are presented fully, with numerous examples, in Volumes 1 and
    3. Our primary reference is the example detailed in Volume 1, Example 1.2, of
    to enable server-side hosts for a secure ftp daemon, known as vsftpd. This is
    a complete, basic example of using systemd to manage system services.


    In addition, Volume 3, “Raspberry Pi OS Text Editors, git, and Virtualization
    with LXC/LXD”, also shows examples of how you can implement the vsftpd service
    securely inside an of an LXC/LXD container.


    As noted in the references, you should be cautious when executing these examples,
    particularly if you are not using one of the virtualization methodologies in Volume
    3, and on an insecure network connected to the Internet. You must have root privileges
    on the computer to execute the examples we show in the above references as well.'
