    The multi-programming model requires processes, whether they are generated by
    shell built-ins, external commands, user-written programs, or by any system programs
    that use the fork, exec or execute system calls, have their credentials authenticated
    before they can make use of objects such as system resources, other processes,
    sockets, or /inodes.


    Linux systems associate processes to credentials, which associate the process
    with a specific user and a specific group. These credentials are essential in
    a multi-user and multi-programming system because they determine what each process
    can do or control in user space and kernel space, maintaining the autonomy and
    the security of each user''s personal data, and by extension the stability of
    the system.


    The use of credentials is applied in the process data structure, and in the shared
    resources processes are trying to access. This is similar to a key and a set of
    tuples in a lock. Files are the critical resource on the system. Thus, in the
    default ext file system, each file is owned by a specific user and belongs to
    a group of users. The owner of a file determines what kind of operations are allowed
    on that file, distinguishing herself, the file’s user group, and all other users
    on the system. When a process tries to make use of a file, the Linux Virtual File
    System (VFS) always validates whether the access is allowed or not, according
    to the permissions established by the file owner and the process credentials.
    Process credentials and file access permissions are integrated and inseparable.
    This authentication is based upon the forms of file permissions we have detailed
    so far. We have shown that the chmod command is the instrument for granting these
    permissions to files and directories.


