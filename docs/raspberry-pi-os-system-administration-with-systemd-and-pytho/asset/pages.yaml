    can transfer to someone via e-mail, ssh, or via mobile secondary storage media
    (USB thumb drive, for example). Or perhaps they would want to retain their own
    file system objects as backups via the same methods.


    The primary reason for making an archive is the convenience of dealing with (sending
    or receiving) a single file instead of a complete directory hierarchy. Without
    an archiving facility such as tar, the sender might have to send several files
    and directories (a file structure) that the receiver would have to restore in
    their correct hierarchical structure. Without an archiving facility such as tar,
    depending on the size of the files and directory structure, the task of sending,
    receiving, and reconstructing the file structure can be very time consuming.


    There are other compression facilities, such as the bzip2, gzip, gunzip, gzexe,
    xz, zcat, and zm commands, and we must point out that compression saves disk space
    and transmission time. But compressing small files normally does not result in
    much compression, and storage space. Also, compressing files of one cluster in
    size (the minimum unit of disk storage, i.e. one or more sectors) does not help
    save media space, even if compression does to save the compressed file anyway.
    But if compression does result in a smaller file, because in a smaller file, you
    do save time in transmitting the compressed version. If the disk block size is
    512 bytes and a cluster consists of more than two blocks, you can use the tar
