  md: '# Raspberry Pi OS System Administration with systemd and Python


    control can be done on a transient, or temporary, basis using using the systemd-run
    command. Or it can be done on a persistent, or permanent basis, making critical
    changes to the systemd units file all permanent, start-at-boot services have.
    We organize our presentation in this section around these two bases.


    Before the introduction of cgroups and systemd in the Linux kernel, processes
    received similar amounts of system resources the administrator could modify to
    enhance performance (per the use-case(s) the system operated under (by design)
    with process nice values. The drawback of this legacy approach was that, for an
    application, as a webserver or database management program, which may have a large
    number of sub-processes or threads running at the same time, there was an inadequate
    mechanism available to give priority to these groups of tasks. Another task or
    set of tasks that were more use-case, mission-critical, but had a smaller number
    of subtasks, had to share resources equally with the webserver or database management
    program.


    systemd cgroups have a tremendous advantage over the legacy approach. For example,
    using systemd cgroups, all processes started by the nginx webserver have their
    own cgroup numbers. This allows you to control nginx at the application level,
    and all of its "worker children", with the systemdctl command. We completely detail
    the systemdctl in Volume 1, Chapter 2.


    We give a more in-depth explanation of the hierarchic cgroups tree in Volume 1,
    Chapter 2, Section 2.7.1. In this section we also show the utility of the systemd-cgl
    command, and how it depicts, in an easy-to-read, graphical tree format all of
    the cgroups and their hierarchical structuring on your Raspberry Pi system.


    The key takeaway here, and something that is often misunderstood, is that if you
    run some task, and nothing else of higher "priority" (in terms of cgroup-levied
    resource controls) is running at the same time, task gets 100% of the resources
    (or nearly so, the system needs to have a small chunk of resources to keep itself
    running!).


