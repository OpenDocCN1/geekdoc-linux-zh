  md: '# 214 Raspberry Pi OS System Administration with systemd and Python


    Raspberry Pi OS via utilities that work with Linux files. For example, you may
    be programming a statistical analysis script in Python that perhaps has its data
    generated from some other program or utility stored in a few-where in the file
    structure of your Raspberry Pi system. These files can be text, Unicode text,
    or binary, raw 8-bit bytes.


    The general form of a file operation in Python3 is:


    ```

    name = open(filename, mode)

    name.method(argument(s))

    name.close()

    ```


    where:

    name is a file object name in the current procedure,

    open is the keyword that opens Python3''s connection to an external file,

    filename is the name of the external file, which may include directory paths,
    and so on,\mode is a way of accessing the file, like reading from it, or writing
    to it,

    method is one of several operations that are allowed to be performed on the open
    external file,

    argument(s) is(are) one or more qualifiers on the operation specified in method,

    close is the termination of connection to the external file.


    The mode can be r, w, or a, for reading (the default, meaning you do not need
    to specify this to open with read), writing, or appending to the file, respectively.
    The file will be created if it does not exist, and opened for writing or appending
    if it does exist. It will be truncated when opened for writing. Add b to the mode
    for binary files. Add + to the mode to allow simultaneous reading and writing.

    The preferred way to open a file is to use the built-in open() function. Add u
    to the mode to open the file for input with universal newline support.


    In the following examples, we illustrate some simple operations on files, such
    as how to open, write/read from, and close them.

    In the first example, we input a string of text into a named file. In the Thny
    Shell Area, type the following three lines of code:


    # Example 2.11


    ```

    >>> file = open(''sometext'',''w'')

    >>> file.write(''This is a line of text.'')

    23

    >>> file.close()

    >>>

    ```'
