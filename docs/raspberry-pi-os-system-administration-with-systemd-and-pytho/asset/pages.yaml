  md: "# coroutine.send(data)\n\nThen, execution resumes, with value being assigned,\
    \ or referenced to the value of data. To signal the end of a computation, we shut\
    \ down a coroutine using the close() method. This raises a GeneratorExit exception\
    \ inside the coroutine, which we can catch with a try/except clause.\n\nThe next\
    \ example illustrates these concepts. It is a coroutine that prints strings that\
    \ match a provided template pattern. Use Way 2 (Script Mode), and the Tonny Run\
    \ Toolbar to implement this in Tonny:\n\nExample 2.22\n\n```\ndef grepper(template):\n\
    \    print (\"Searching for ' + template)\n    try:\n        while True:\n   \
    \         x = (yield)\n            if template in x:\n                print (x)\n\
    \    except GeneratorExit:\n        print (\"Done\")\n```\n\nIn the Tonny Shell\
    \ Area, type the following:\n\n```\n>>> q = grepper(\"Pythonista\")\n>>> next(q)\n\
    Pythonista\n>>> q.send(\"After doing this section, you will be known as a Pythonista\"\
    )\nAfter doing this section, you will be known as a Pythonista\n>>> q.send(\"\
    Not a very Pythonic answer\")\n>>> q.send(\"Python makes C look high maintenance\
    \ and too complex\")\n>>> q.close()\nDone\n```\n\nWhen we call q.send with a value,\
    \ evaluation resumes inside the coroutine q at the statement line = (yield), where\
    \ the sent value is assigned to the variable line. Evaluation continues inside\
    \ q, printing out the line if it matches, going through the loop until it encounters\
    \ the line = (yield) again. Then, evaluation pauses inside q and resumes where\
    \ q.send was called.\n\nWe can chain functions that send() and functions that\
    \ yield together to achieve complex behaviors, similar to streaming, or pipelining.\
    \ In the next example, the function read splits a string \"text\" into words and\
    \ sends each word to another coroutine. Continuing in the Tonny Shell Area, grepper\
    \ still defined:"
