    # 1.4 systemd and Traditional Reboot or Shutdown


    systemd is in charge of taking the system from the normal operating condition
    to a power-off state, or to reboot the system. The relevant systemctl commands,
    with their options, that achieve shutting the system down or rebooting it, and
    briefly explain what they accomplish, are shown in Table 1.1. We described these
    commands and the system shutdown path through possible target states, from a normal
    operating condition, to a powered-off state, is described in Figure 1.2.


    Traditionally, the graceful shutdown or reboot procedures can be done graphically
    from the active window system, or from the command line or console, using the
    halt or shutdown commands and their options. The shutdown command has the advantage
    of allowing you to specify a time when shutdown processes are initiated.


    Graceful shutdown procedures are generally done as follows:


    +   - Shutdown system and user processes

    - Flush system memory to disk

    - Unmount file systems

    - Power off


    # TABLE 1.1

    systemctl Shutdown Commands


    | Command | Description |

    | --- | --- |

    | systemctl halt | Halts the system |

    | systemctl poweroff | Powers off the system |

    | systemctl reboot | Restarts the system |

    | systemctl suspend | Suspends the system |

    | systemctl hibernate | Hibernates the system |

    | systemctl hybrid-sleep | Hibernates and suspends the system |'
