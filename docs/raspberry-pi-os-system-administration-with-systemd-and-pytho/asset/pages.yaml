    # 1.15.2 Access Control Credentials: Discretionary (DAC), Mandatory (MAC), and
    Role-Based (RBAC)


    The terms we use in this section are important if you want to understand the different
    types of access control. When we talk about access control security checks, here
    are the important terms:


    Objects: A fundamental component of executing kernel is the programs and processes
    it maintains. Objects are the entities that are targeted, or worked on, by the
