    command; (2) -la, the options; and (3) myfile, the command argument.


    What if you make a mistake in your typing, and misspell a command name or one
    of the other parts of a command? Type the following on the command line:


    ```

    $ ls -la myfile

    x: not found

    ```


    The lx: not found reply from Raspberry Pi OS is an error message. There is no
    lx command in the Raspberry Pi OS, so if you had typed an option that did not
    exist, you would also get an error message. If you supplied a file name that was
    not in the current working directory, you would get an error message, too. This
    makes an important point about the execution of Raspberry Pi OS commands. If no
    error message is displayed, then the command executed correctly and the results
    might or might not appear on screen, depending on what the command actually does.
    If you get an error message displayed, you must correct the error before Raspberry
    Pi OS will execute the command as you type.


    > ***Note

    Typographic mistakes in commands account for a large percentage of the errors
    that beginners make make!


    # 0.2.4 Creating, Deleting, and Managing Directories


    Another critical aspect of file maintenance is the set of procedures and the related
    Raspberry Pi OS commands you use to create, delete, and organize directories in
    your Raspberry Pi OS account on a computer. When moving through the file system,
    you are either ascending or descending to reach the directory you want to use.
    The directory directly above the current working directory is referred to as the
    parent of the current working directory. The directory or directories immediately
    under the current working directory are referred to as the children of the current
    working directory.'
