    # 1.5.1 Adding a User and Group in a Text-Based Interface


    The commands adduser and addgroup, by default, add a “normal” (non-system) user
    or group to the system, using line options and option arguments. They take default
    configuration information from /etc/addusergroup.conf. They are a more developed
    front-end for the older, low-level commands, such as useradd, groupadd, and usermod.
    Adduser and addgroup utilize patented UID and GID values for creation of new accounts
    and groups. By default they create a home directory from a skeleton configuration
    file, etc.


    adduser itself is a script file that interfaces to the following commands and
    their functionality:


    useradd, groupadd, passwd, gpasswd, usermod, chfn, chage, edquota.'
