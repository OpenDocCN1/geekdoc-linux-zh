    # 2.3.2 Python3 Program Data Model


    Following are some statements about the Python3 model of data that might help
    you organize your concepts and thoughts about what the “nuts and bolts” of Python3
    are:


    +   1. Even though Python3 incorporates many of the features of a multi-paradigm
    programming ensemble, its actual, and fundamental basis is the following:

    Everything in the Python3 program can be referred to as an object, with the same
    exact meaning of the word used in OOP. These objects have three parts: an identifier,
    a type, and a value.


    For example, when you assign x = 62.25 interactively in the Python3 interpreter,
    or in a Python3 module, script file, or library of modules, a real number object
    is created; it has a value of 62.25, and it is identified as an object with its
    location in memory. x is the identifier that refers to its specific location in
    memory. The equal sign (=) is essentially the reference between identifier and
    a value.


    +   2. In OOP languages such as Python3 and Javascript, the type an object assumes
    gives it membership in a particular set, called its class. The class of the object
    limits, and also defines, what are known as the methods, or operations, which
    can be performed on or with it.'
