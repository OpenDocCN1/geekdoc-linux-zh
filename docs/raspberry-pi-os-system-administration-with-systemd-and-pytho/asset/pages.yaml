  md: 'Expression: A piece of syntax which can be evaluated to some value. In other
    words, an expression is an accumulation of expression elements like literals,
    names, attribute access, operators, or function calls, which all return a value.


    In contrast to many other languages, not all language constructs are expressions.
    There are also statements which cannot be used as expressions, such as print or
    if. Assignments are also statements, not expressions.


    Immutable: An object with a fixed value. Immutable objects include numbers, strings,
    and tuples. Tuples cannot be altered. A new object has to be created if a different
    value has to be stored; for example, a key in a dictionary.


    Iterable: An object capable of returning its members one at a time. Examples of
    iterables include all sequences (such as a list, string, and tuple) and some nonsense
    types like dict and file and any classes you define with an _iter__() or __getitem__()
    method. Iterables can be used in a for loop and in many places where a sequence
    is needed. When an iterable is passed as an argument to the built-in iter(), it
    returns an iterator for the object. This iterator is good for one pass over the
    set of values. When using iterables, it is usually necessary to call iter() or
    deal with iterator objects. The for statement does automatically for you, creating
    a temporary unnamed variable to hold the iterator for the duration of the loop.


    Lambda: An anonymous inline function consisting of a single expression which is
    evaluated when the function is called. The syntax to create a lambda function
    is lambda[arguments]: expression.


    Method: A function which is defined inside a class body. If called as an attribute
    of an instance of that class, the method will get the object as its first argument
    (which is usually self).


    Mutable: Mutable objects can change their value but keep their class identity.


    Pythonic: An idea or piece of code which closely follows the most common usages
    of the Python language, rather than implementing code using structures common
    to other languages. For example, a common usage in Python is to loop over all
    elements of an iterable using a for statement. Many other languages do not have
    this type of construct, so people unfamiliar with Python use a numerical counter
    instead:


    ```

    for i in range(len(money)):

    print(money[i])

    ```'
