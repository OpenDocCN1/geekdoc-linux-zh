  md: '# Raspberry Pi OS System Administration Fundamentals


    There are some limitations to using Filezilla, however. It’s primarily designed
    as an ftp client and server software, rather than as a dedicated backup tool.
    While it can be used to transfer files between systems, it lacks built-in functionality
    for automated backups. However, you can achieve automatic-file backups by utilizing
    external tools in conjunction with Filezilla. Here''s a general approach you can
    consider:


    +   Set up a backup tool: Choose a backup software or script that suits your needs.
    There are numerous options available, such as rsync triggered by system systemctl
    timers. Your chosen tool supports automatic-scheduling.


    +   Configure the backup software: Set up the backup software to include the specific
    files and folders you want to back up. Configure the backup destination (e.g.,
    local storage, network drive, cloud storage) and establish the backup schedule
    (e.g., hourly, daily, weekly).


    +   Integrate FileZilla: Use FileZilla to transfer the files to the designated
    backup location. You can manually initiate the transfers, or create a bash script
    file as we show in Example 1.9, which executes the transfers automatically. FileZilla
    Pro and FileZilla Pro CLI provide a command-line interface (CLI) that allows you
    to do script transfers, but they''re not free!


    +   Schedule the backup process: Depending on the backup tool you''ve chosen,
    use its scheduling capabilities to automatically trigger the backup process at
    regular intervals. This ensures that the specified files are backed up periodically.


    By combining a backup tool with FileZilla, and scheduling functionality, you can
    create an automated backup system for your specific files. Remember to consult
    the documentation and resources of your chosen backup software for detailed instructions
    on configuration and automation.


    # 1.12.3.2 SD Card Copier


    There''s system cloning software built right into the Raspberry Pi OS!

    If you deployed the system installation technique shown in Section 1.2.3, entitled
    “How to Boot and Run a Raspberry Pi OS from a USB3mounted SD”, you can use a hybrid
    form of method to archive your entire operating system, including the boot partition.
    If the system/boot disk is a microSD card, you can simply add another blank (or
    not) microSD card into a suitable microSD-to-USB adapter, mount it in one of the
    USB ports on your Raspberry Pi hardware, and then use the Pi Menu choice Accessories
    > SD Card Copier menu to choose the current system/boot disk to the blank one.'
