    # 0.2.2 Viewing the Contents of Files


    To begin working with files, you can easily create a new text file by using the
    cat command. The syntax of the cat command is as follows:


    cat [options] file-list


    +   Purpose: Join one or more files sequentially or display them in the console
    window


    +   Output: Contents of the files in file-list displayed on the screen, one file
    at a time


    +   Commonly used options/features:


    +   +E Display line numbers on the displayed lines


    +   - help Display the purpose of the command and a brief explanation of each
    option


    The cat command, short for concatenate, allows you to join files. In the example
    you will join what you type on the keyboard to a new file being created in the
    current working directory. This is achieved by the redirect >, which takes what
    you type at the standard input (in this case the keyboard) and directs it into
    the file myfile. You can consider the keyboard, and the stream of information
    it provides, as a file. As stated in the Preface, this usage is an example of
    a command, cat with no options, option arguments, or command arguments. It simply
    uses the command, a redirect character, and a target, or destination, named myfile,
    where the redirection will go.'
