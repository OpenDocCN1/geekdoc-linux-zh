    \ as inputs, processes them inside the black box with names that are only seen\
    \ inside the black box, and spits them out as named objects available to the Python\
    \ program via an assignment statement.\n\nThe general form of a function definition\
    \ is:\n\n+   - name (formal parameters):\n  body of the function\n  return (returned\
    \ parameters)\n\nwhere name is the name you give the function (make sure you are\
    \ not using a Python keyword!), formal parameters are the objects that are passed\
    \ to the function so it can carry out operations on them and, optionally, returned\
