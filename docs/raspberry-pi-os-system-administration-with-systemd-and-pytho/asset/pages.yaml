    The general necessity of backing up user and system files on a single-user

    Raspberry Pi system, as a part of an ordinary user’s routine operations,

    should be obvious, even to the beginner. Also, for complex, multi-machine,

    multi-user systems, it''s an absolutely necessary procedure for anyone responsible
