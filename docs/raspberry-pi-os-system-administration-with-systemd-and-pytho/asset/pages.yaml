    We give a broad introduction to the Python3 programming language, using Python
    3.9.2. For the beginner Python3 programmer, we illustrated all of its important
    programming capabilities and syntactic structures, in the context of the three
    predominant computer paradigms: virtualization, concurrency, and persistence.
    We showed the details of doing an installation of the latest version of Python3.X
    on a Raspberry Pi system, instead of utilizing the default installation of it
    comes with your Raspberry Pi OS. We gave a brief introduction to Thonny, the Python3
    IDE. We showed all Python3''s important syntax, including numbers and expressions,
    variables, statements, getting input from the user, functions, the procedural/imperative
    OOP programming models in Python3, modules, saving and executing Python scripts,
    string and sequence operations, and error handling. We also gave many basic and
    practical examples, such as another way of writing shell scripts, such as rewriting
    Bash and tsch scripts, basic user file maintenance, backing up files, remote copying
    with the rsync command, and graphics using tkinter. Finally, we showed how various
    forms of thread execution are achieved in Python3, and how OOP can be deployed
    to accommodate them.


