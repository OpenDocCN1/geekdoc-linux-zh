    # 11.15.8.1 The Meaning of Encryption


    Encryption uses a very developed science, known as cryptography, to implement
    data hiding. Cryptography is used on a Raspberry Pi system to encode data to hide
    it from unprivileged users, and then decode the data for privileged users. On
    the Raspberry Pi OS, the following are some of the objects that can be possible
    targets for encryption:


    Individual files


