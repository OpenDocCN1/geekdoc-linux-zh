  md: '# 1.8.6.1 Partitioning a Disk Using fdisk


    fdisk is a command line, interactive, dialog-driven program used to create and
    manage partition tables on Linux. The following is a brief description of fdisk
    syntax and use:


    fdisk – Create and manages partition tables

    Syntax: fdisk [options] device

    fdisk -l [device...]


    Output: New or manipulated partitions on the media device.


    Common Interactive Commands:


    +   n Create a new partition. You enter a partition number, starting, sector,
    and an ending sector. Both start and end sectors can be specified in absolute
    terms as sector numbers. Pressing the Enter key with no input specifies the default
    value, which is the start of the largest available block for the start sector
    and the end of the same block for the end sector.

    p Display basic partition summary data. This includes partition numbers, starting
    and ending sector numbers, partition sizes, fdisk''s partition types codes, and
    partition names

    t Change a single partition''s type code. You enter the type code using a two-byte
    hexadecimal number

    w Write data. Use this command to save your changes.


