    ***Note***


    Contemporary tar on Linux is the GNU version.


    The tar (short for tape archive) utility was originally designed to save file
    systems on tape as a backup, so that files could be recovered in the event of
    a system crash. It is primarily used to pack a directory hierarchy as an ordinary
    disk file. That disk file can then be saved for backup purposes locally or remotely,
    and transmitted to someone via the Internet. It is also used commonly with a compression
    utility, such as gzip, via a command line. Saving saving disk space results primarily
    from the fact that empty space within a cluster is not wasted. A brief description
    of the tar utility follows.


    The GNU version of tar has some important functional features, and incorporates
    a more friendly syntax, unlike UNIX tar. Therefore, for beginners we only show
    "long form" of the GNU-style syntax because it is more intuitive, and to understand.
    Once you get familiar with tar, you may switch to the UNIX-style short form at
    discretion.


    System administrators normally use a cost-effective archival medium for archiving
    file system structures as backups, so that when a system crashes for some reason,
    files can be recovered. Linux-based computer systems normally for crashes beyond
    the operating system''s control, such as a microSD card failure, failure of the
    processor itself. The Raspberry Pi rarely causes a system to crash, because it''s
    a well-designed, coded, and tested operating system. In a typical commercial installation,
    backup is done every day during off hours (late night or early morning) when the
    system is not normally in use, with appreciable demand placed on it.'
