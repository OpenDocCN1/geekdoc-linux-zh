    \ 2.4.12.1 Generator Recursion\n\nRecursion, which is the delay of computation\
    \ until some target final state is reached, can be implemented using Python3 generator\
    \ functions by defining a generator function that calls itself within the body\
    \ of its definition. Here's an example of what kind of a recursive generator function\
    \ in Python3:\n\n```\ndef recursive_generator(n):\n    if n == 0:\n        return\n\
    \    yield n\n    yield from recursive_generator(n - 1)\nfor num in recursive_generator(5):\n\
    \    print(num)\n```\n\nSave the above code in a file named recursive.py, in Tonny's\
    \ current working directory. In this descriptive example, the recursive_generator\
    \ function takes an integer as its parameter. If n is 0, the function simply returns,\
    \ indicating the final state of the recursion has been reached. Otherwise, it\
    \ yields the current value of n and calls itself again, recursively with n - 1,\
    \ using the yield statement to assign the iteration to the recursive call. But\
    \ n is assigned the value of 5.\n\nUsing Way 3 (Import Script Mode), here's how\
    \ you can use the recursive_generator to generate a sequence of numbers. When\
    \ you import the above code into the Tonny Shell Area, the output is as follows:\n\
    \n```\n>>>import recursive\n5\n4\n3\n2\n1\n```\n\nIn this descriptive example,\
    \ calling recursive_generator(5) generates a sequence of numbers from 5 down to\
