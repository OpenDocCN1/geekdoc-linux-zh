    # 1.1 Introduction


    This chapter is central to a major component of Raspberry Pi OS: system administration.


    In order to install, maintain, and effectively use a Raspberry Pi system composed
    of both hardware and software components, it is often necessary to perform the
    set of common tasks in the following sections. In this chapter, we target an individual,
    novice user, who performs these tasks exclusively for her own use, on her personal
    desktop/laptop computer. The common tasks may also be performed by an appointed
    administrator, for a more complex system used by many people. It is possible to
    divide these common tasks into those performed by an administrator, and those
    performed by a single user, or a group of autonomous users.


    Even though we show the basics of ordinary common tasks, it is possible to extrapolate
    from what is presented to the wider context of much larger-scale computer systems,
    run by a system administrator.


    Additionally, at the website, we provide other materials that supplement our presentation
    of these tasks here in the printed book.


    In order to do many of the system administration tasks in this chapter, it is
    absolutely necessary to have supervisor or root user privileges on the system.
    That (or a designated system administrator) can establish at installation of your
    Raspberry Pi system.


    Both the su and sudo commands are used to execute programs and other commands
    with root permissions. The root user has maximum permissions, and can do anything
    to the system that a system administrator needs. Normal users execute programs
    and commands with reduced permissions.


    To execute something that requires maximum permissions, you must first execute
    the su or sudo commands. Using the su command makes you the super user—or root
    user—when you execute it with no additional options.'
