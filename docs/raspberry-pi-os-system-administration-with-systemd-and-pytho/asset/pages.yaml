  md: 'data model (and also the “Why?”) Python3 programming uses. In particular, as
    that applies to OOP. OOP is a programming model that represents concepts as *objects*
    that have fields (which are basically attributes that describe the object) and
    associated processes, or if you will, functions, known as *methods*, which are
    basically known as “messaging” operations on those attributes. Objects, which
    are established as instances of what are known as “classes”, are constructed to
    interact with one another using the messaging system, to design applications and
    computer programs. Examples of modern OOP languages are Smalltalk, C++, C#, Java,
    Perl, Ruby, and Python.


    Below are some common terms used in OOP:


    +   **Class:** A user-defined model for an object that defines characteristics
    of any object in that class. The characteristics are data members (class variables
    and instance variables) and methods, accessed via what''s dot().


    +   **Class variable:** A variable that is shared by all instances of a class.
    Class variables are defined within a class, but outside of the class''s methods.


    +   **Data member:** A class variable or instance variable that holds data associated
    with a class and its objects.


    +   **Instance variable:** A variable that is defined inside a method and belongs
    only to the current instance of a class.


    +   **Inheritance:** The transfer of the characteristics of a class to other classes
    that are derived from it.


    +   **Instance:** An individual object of a certain class. An object that belongs
    to a class named Circle, for example, is an instance of the class Circle.


    +   **Instantiation:** The creation of an instance of a class.


    +   **Method:** A unique instance of data structure defined by its class. An object
    can comprise both data members (class variables and instance variables) and methods.


    The general form of a class definition is:


