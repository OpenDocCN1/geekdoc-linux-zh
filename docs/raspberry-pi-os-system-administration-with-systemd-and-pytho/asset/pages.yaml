    # Example 2.37


    ```

    1 import tkinter as tk

    2 from tkinter import ttk

    3 from functools import partial

    # This is the data generating module, which computes the sum.

    4 def add_it(label, n1, n2):

    5 num1 = (n1.get())

    6 num2 = (n2.get())

    7 result = float(num1)+float(num2)

    8 label.config(text="Sum = %f" % result)

    9 return

    # "grids" the widget object indicated, then returns it.

    10 def mkgrid(row=r, column=c, sticky=''news'')

    11 w.grid(row=r, column=c, sticky=''news'')

    12 return w

    13 root = tk.Tk()

    14 root.title("Real Number Adder")

    # The rest hosts the anchor into the grid manager widgets.

    15 add_lab = mkgrid(0, 0, ttk.Label(root, text="add 1",anchor=''e''))

    16 add2_lab = mkgrid(1, 0, ttk.Label(root, text="add 2",anchor=''e''))

    17 add1 = mkgrid(0, 1, tk.Entry(root))

