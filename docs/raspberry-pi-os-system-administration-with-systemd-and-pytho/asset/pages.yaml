    \ Pi OS Archiving and Backup Facilities\n\nIn addition to the traditional tar\
    \ facility briefly shown in the previous section, there are several other facilities\
    \ and methods a system administrator can use to archive and backup individual\
    \ user accounts, files, file systems, and the entire system itself. As stated\
    \ above, to get a more complete listing of the capabilities and options available\
    \ for the command line facilities shown in this, and all other sections, consult\
    \ the man pages on your system for these commands. We briefly describe and give\
    \ simple examples of some of the more modern and useful of these facilities and\
    \ methods.\n\n# 1.12.1 rsync\n\nThe rsync command is a very modern and space-efficient\
    \ way to backup files and directories, particularly from one machine to another,\
    \ using ssh across a network. Its operation can also be automated, via the use\
    \ of system scheduling.\n\nIts most important and defining feature is the data\
    \ transfer \"quick check\" algorithm it uses, which reduces the amount of data\
    \ transmitted. This is done by sending only the differences between the source\
    \ files, and the same destination files (if any). If files need to be transferred,\
    \ they are copied, or \"synced\", using this algorithm. The algorithm looks for\
    \ files that have changed in size attributes (such as permissions, or ACLs) are\
    \ made on the destination file directly when the quick check indicates that the\
    \ destination file needs to be updated in that.\n\nAn abbreviated summary of the\
    \ rsync command is as follows:\n\n```\nrsync\nSyntax:\nLocal: rsync [OPTION...]\
    \ SRC... [DEST]\nRemote:\n  via remote shell:\n    Pull mode: rsync [OPTION...]\
    \ [USER@]HOST:SRC... [DEST]\n    Push mode: rsync [OPTION...] SRC... [USER@]HOST:DEST\n\
    \  via rsync daemon:\n    Pull mode: rsync [OPTION...] [USER@]HOST::SRC... [DEST]\n\
    \    rsync [OPTION...] rsync/[USER@]HOST[:PORT]/SRC... [DEST]\n    Push mode:\
    \ rsync [OPTION...] SRC... [USER@]HOST::DEST\n    rsync [OPTION...] SRC... rsync/[USER@]HOST[:PORT]]\n\
    ```"
