    useful for allowing remote access to a private network through secure authentication
    certificates and logins. A common practice is to let a standalone computer serve
    as a single hardware firewall to a private network. Hardware firewalls can be
    purchased as a stand-alone product. They can also be integral into broadband routers.
    Most hardware firewalls will have a minimum of four network connectors to link
    them to other computers, but for larger networks, there are business networking
    solutions.


    The Raspberry Pi OS uses Uncomplicated Firewall, or ufw, to protect the system.
    The default configuration file for it is located in /etc/ufw/ufw. The easiest
    way for you to find out about text-based modifications to firewall rules is to
    see the ufw man page on your system. We provide an extensive section giving the
    basic details of using the command-line method of modifying firewall rules in
    Volume 1, Section 1.16, entitled “ufw” and Netfilter Interface in the Raspberry
    Pi OS”.


    It is not absolutely necessary to change the ufw firewall rules, unless your security
    model, and its impact on your particular use case, warrants firewall customization.
    We provide a general overview of ufw in the next section.


