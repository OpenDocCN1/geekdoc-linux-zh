  md: '# Raspberry Pi OS System Administration Fundamentals


    ************************************************************************************************************************************************


    **systemd-run** - Run programs in transient scope units, service units, or path-,
    socket-, or timer-triggered service units


    # Syntax:


    ```

    systemd-run [OPTIONS...] COMMAND [ARGS...]

    systemd-run [OPTIONS...] [PATH OPTIONS...] [COMMAND] [ARGS...]

    systemd-run [OPTIONS...] [SOCKET OPTIONS...] [COMMAND] [ARGS...]

    systemd-run [OPTIONS...] [TIMER OPTIONS...] [COMMAND] [ARGS...]

    ```


    # Purpose:


    systemd-run may be used to create and start a transient .service or .scope unit
    and run the specified COMMAND in it. It may also be used to create and start a
    transient .path, .socket, or .timer unit, which activates a .service unit when
    elapsing.


    # Common Options:


    env


    +   -p BlockIWeight=10 updatedb

    --active=30

    -t -send-sighup /bin/bash

    --scope -user screen


    Logs environment variables given by systemd to services.

    Limits resources available to a command.

    Runs commands at a specific time.

    Allows access to a busy using in this case.

    Starts a screen as a user service.


    ************************************************************************************************************************************************


    You can modify resources on an application according to the design of your system
    case(s). It is worth noting that programming applications can create transient
    cgroups using cgroup API calls to systemd. A transient unit is removed from the
    as soon as the service is stopped using systemctl stop command, or the system
    is rebooted (there is no permanent unit file created for the service using systemd-run.)


    To create a persistent cgroup for a service, you must create or edit its unit
    configuration file. The configuration can be preserved after system reboot, and
    it can be used to manage services that are started automatically by systemd.

    We present Examples 1.10 and 1.11 below, with relevant background information,
    on these two methods of service creation.


    # Creating a Transient cgroup with systemd-run and Changing its CPUShare


    To create a transient cgroup, and run a command in that cgroup, the general form
    of the systemd-run command, with some specific options, is as follows:


    ```

    $ systemd-run -unit=name -slice=slice_name -property prop_name=val command

    ```'
