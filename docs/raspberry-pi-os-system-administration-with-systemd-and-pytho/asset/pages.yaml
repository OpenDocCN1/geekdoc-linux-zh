    # 2.3.4 Python3 Standard Type Hierarchy


    The type of an object describes the Python data structure representation of the
    object as well the methods and operations that can be carried out on that object.
    Table 2.1 is a list of the type categories, and following it is a brief description
    of the categories in the table.


    The None type has a single value that contains a null object (an object with no
    value). Its truth value is False.


    **Numeric types:** Booleans, integers, long integers, floating point numbers,
    and complex numbers.


    **Sequence types:** *Sequences* represent ordered sets of objects indexed by nonnegative
    integers and include strings, Unicode strings, lists, and tuples.


    **Mapping types:** A *mapping object* represents an arbitrary collection of objects
    that are indexed by another collection of nearly arbitrary key values. Unlike
    a sequence, a mapping object is unordered and can be indexed by numbers, strings,
    and other objects. *Dictionaries* are the only built-in mapping, and are similar
    to a *hash*.


    **Set types:** A *set* is an unordered collection of unique items. Unlike sequences,
    sets provide no indexing or slicing operations. Unlike dictionaries there are
    no key values associated with the objects. In addition, the items placed in a
    set must be immutable.


    **Callable types:** These represent objects that support the function call operation.
    There are several kinds of objects with this property, including user-defined
    functions, built-in functions, instance methods, and classes.


    **Classes and types:** When you define a class, the class definition normally
    produces an object of *type*.


    **Modules:** The *module* type is a container that holds objects loaded with the
    *import* statement.'
