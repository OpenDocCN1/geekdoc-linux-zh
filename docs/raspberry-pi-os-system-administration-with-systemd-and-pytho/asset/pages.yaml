    # 1.10.1 What the Common UNIX Printing System (CUPS) Accomplishes


    Using CUPS is a standard way of printing in both Linux and Unix. Since it was
    developed to provide as many printer definitions as possible, it will more than
    likely allow you to directly connect your model of printer, or connect to a print
    server on your LAN.


    It is basically composed of two parts: a scheduler and a filtering system. The
    scheduler arranges jobs in print queues and sends them to the filtering system
    that translates the print data into device driver information for the particular
    printer you want your documents to print.


    # 1.10.2 Managing CUPS Locally with systemd


    Using systemd, via the systemctl command, allows you to start, stop, reload, or
    restart the CUPS service. This is a higher level of management for your local
    printers via a system service.


    # 1.10.2.1 Starting CUPS Service using systemd


    In the Raspberry Pi OS, when you attach a new printer via a USB cable to the hardware,
    it will generally be automatically recognized and attached via CUPS. If the CUPS
    service has not already started, it will be automatically started and run in the
    process of connecting the new printer. To start the CUPS service without having
    any printers attached or powered on, the following:


    To start the CUPS service, and check its status, use the following commands:


    ```

    $ sudo systemctl start cups

    $ sudo systemctl status cups

    ```


