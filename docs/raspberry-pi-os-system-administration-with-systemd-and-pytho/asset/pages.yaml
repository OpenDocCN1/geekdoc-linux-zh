    # 2.5.3.2.1 Non-Event Driven tkinter


    That brings us some interesting questions: What kind of graphics is not event
    driven, and what apps or programs accomplish this way of displaying data? Basically
    static, non-interactive forms of computer graphics. Can you name any of them?
    And, is tkinter able to do this form of non-event driven processing, and exactly
    how?


    # Well, here’s an answer to that question.


    As we’ve noted, tkinter is primarily designed for event-driven graphics programming,
    where the program responds to user input or system events. However, you can also
    create non-event driven graphics using tkinter by using a technique called “animation
    loops”.


    In a non-event program, you need to create your own loop that continuously updates
    the graphical elements.


    Here’s a basic example of how you can create a non-event driven graphical program
    using tkinter:


    ```

    import tkinter as tk

    def update_graphics():

    # Update your graphical elements here

    # This function will be called repeatedly in the main loop

    # Example: Move a shape on a canvas

    canvas.move(shape, 1, 0)

    # Schedule the next update

    root.after(10, update_graphics) # Update every 10 milliseconds

    root = tk.Tk()

    canvas = tk.Canvas(root, width=400, height=400)

    canvas.pack()

    # Create a shape on the canvas

    shape = canvas.create_rectangle(50, 50, 100, 100, fill=''red'')

    # Start the update loop

    update_graphics()

    root.mainloop()

    ```


    In the above example, the update_graphics() function is called repeatedly using
    the root.after() method, which schedules a function to be called after a specified
    delay (in milliseconds). Inside the update_graphics() function,'
