    # 1.8.1 Types of File System and ext4


    Furthermore, as a very integral part of the operation of the Linux kernel as it
    exists in a transient and volatile state as we have defined, the pseudo and special
    purpose file systems can be viewed as a series of conduits through which the entire
    system itself “flows”. Thinking along these lines, when the kernel is in the CPU
    and attendant RAM, the kernel code itself is organized as a file system. The kernel
    (or system super-kernel) can be viewed as a file system of transitory data structures,
    that maintains the steady state of the hardware and software using these conduits
    exclusively; this achieve the important controlling of virtualization, concurrency,
    user-autonomy, security, and the necessary archival, long-term data persistence
    on the file systems that are to serve the user base.


    Over the history of Linux, various file systems have been used to provide speed,
    efficiency, security, and utility to the ordinary user. The most contemporary
    and universal of these, across the three major branches of Linux, is the Linux
    Extended File System (ext). All of the representative downstream releases of Linux
    use it as the default file system.


    The 4th version of ext, ext4, is the current and most robust version so far. It
    has several features, such as large scalability, the ability to map to large disk
    array sizes, and other very critical features, such as journaling. Following is
    a compact listing of some the features of ext4:


    +   - It can support volumes sizes up to 1 exabyte, and file sizes up to 16 terabytes.

    - It uses an “extents” mapping scheme, which replaces block mapping used by earlier
    versions of ext. An extent is a range of contiguous physical blocks.

    - It is backward-compatible with ext3 and ext2. Therefore ext3 and ext2 file systems
    can be mounted as ext4.

    - It delays block allocation until data is flushed to disk.\n- It has an unlimited
    number of sub-directories that can be created.'
