    # 1.15 System Security


    There are two meanings of the “security” relevant here, when referring to computers
    such as the Raspberry Pi. We will consider only one of them.

    The first meaning denotes reliability. In other words, the files and data on the
    disks can be relied upon to be persistent over time. The objective of not only
    having persistent media, but also of backing the operating system itself, and
    the user files and data. For example, if the operating system'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Raspberry Pi OS System Administration Fundamentals


    crashes and cannot be brought back to the exact state it was before the crash,
    the user files and data are archived, secure, and can be recovered in total.


    The second meaning denotes processes free from malicious intrusion by agents (such
    as robotic cracker programs) or objects (such as the processes that are the basis
    of program execution) that do not have the authority to access a specific part
    of the system, or any of its components, files, or data. The reasons for implementing
    system security in this second sense, both for an ordinary, single-user system,
    and in a multi-user environment, should be very obvious to the beginner. Especially
    in the light of contemporary privacy issues, and the widespread hacking and system
    penetration forces prevalent on the Internet.


    Since we''ve already dealt with the persistent media in the previous sections,
    in this section we deal with the second meaning of computer security.


    Fundamentally, according to this second meaning, there are at least four places
    where you can situate security measures as we show them in this section. They
    are as follows:


    +   1. At the Process Level: The process model of the Raspberry Pi OS makes this
    most important. This model dictates security implemented on processes, via authentication
    and credentialing techniques. Processes that are the basis for program execution,
    and that bridge kernel and user spaces. Examples of these measures are:


    +   * Setting UNIX permission bits (rwx), the special permission bits SUID, and
    the sticky bit. The setting of permission bits implies that the processes that
    create, the real objects that the permission bits possess are aimed at, or applied
    to. This is part of everything that creates processes in the Raspberry Pi OS,
    which means user-written programs, and all other applications programs and system
    programs as well.


    +   * Deployment of ACLs, either extended POSIX1.e ACLs or NFSv4 ACLs, as detailed
    in Volume 1.


    +   * Use of Linux-specific “capabilities” applied to processes, as detailed in
    the sections below


    +   * Namespace isolation of processes, using the Linux kernel namespace API,
    and the six major implementations of it.


    +   2. At the Physical Level: When someone sits directly in front of the Raspberry
    Pi and tries to log in and use it. One of the ways that can be accomplished through
    the use of password protection into user accounts. On a public computer system
    (which is kind of rare as far as we know for a Raspberry Pi!), this is the most
