  md: '# Raspberry Pi OS System Administration with systemd and Python


    To give you a notion of a prudent strategy to deploy in backing up your user files,
    the file that contains the words you are reading right now was archived in the
    following manner:


    +   1. Saved at regular intervals to an SSD, which served as the boot/system medium
    on a Raspberry Pi 400.

    2. Saved periodically to an externally mounted USB3 thumb drive mounted on that
    Raspberry Pi 400.

    3. Saved periodically to another Raspberry Pi 4B attached to the local area network.


    We will use the rsync command to accomplish our backup strategies in this section.
    This command is like the cp and rcp commands, that is more efficient and faster.


    Most importantly, rsync "synchronizes" two files or directory structures that
    changes in one are reflected in the rsync duplicate, either between mounted media,
    or remotely over a local area network (LAN) or the Internet. It can copy locally
    or to/from another host over any remote host, particularly ssh. It has a large
    number of options that control every aspect of its behavior and permits very flexible
    selection of the set of files to be copied. The rsync command finds files that
    need to be transferred using a "quick check" (by default) that looks for files
    that have changed in size or in last-modified time. We encourage you to consult
    the rsync man page for more information.


    The general forms of the rsync command are:


    Local:


    ```

    rsync [OPTION(S)...] SRC... [DEST]

    ```


    Across a network:


    ```

    Pull: rsync [OPTION(S)...] [USER@]HOST:SRC... [DEST]

    Push: rsync [OPTION(S)...] SRC... [USER@]HOST:DEST

    ```


    where OPTION(S) are the valid options for the rsync command, SRC is the source
    file or directory, and DEST is the destination path.


    The next five examples will use Python3 standard library modules, and embed Bash
    shell commands in a Python "wrapper" (Linux shell command(s) embedded in Python
    code. The examples primarily use the Python3 system module to:


    +   1. Back up a single file on the system medium to a mounted USB thumb drive.'
