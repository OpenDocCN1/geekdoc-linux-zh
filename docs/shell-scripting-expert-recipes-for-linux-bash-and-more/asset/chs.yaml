  \n## 重定向函数的整个输出\n\n与其让函数本身写入到文件，将输出重定向到 `stdout` 也可以写入文件更为合适。这可以意味着调用者在需要时将输出重定向到文件。这种方法可以当函数需要显示\
  \ `lspci` 格式的设备，以及 `lscpu` 格式的字符串时非常有用，并且可以创建一个类似逗号分隔值（`.csv`）的格式。\n\n![download.eps](img/download_fmt.gif)\n\
