  \ HTTP/1.0\" 200 4649 -\n```\n\n# getuptime.sh\n\n第二个脚本定期获取系统内存的快照。当然，也有更强大的系统工具可用，但有时只需要一个简单的\
  \ shell 脚本。这个非常短的脚本每分钟获取一次 `/proc/meminfo` 的副本，以查看服务器上的内存使用情况。每个文件命名为 `mem.(year)(month).(day).(minutes)`。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```bash\ncat monitor.sh\n#!/bin/bash\n\
  while :do\n  cat /proc/meminfo > /var/tmp/mem.$(date +%Y%m%d.%H%M)\n  sleep 60\n\
  done\n\n# monitor.sh\n\n上面的脚本每分钟创建一个文件。这些数据可以很容易地解析到电子表格并显示为图表。\n\n```bash\n/var/tmp#\
