  \ 4\nmyvar is 500\nuniquevar is 3\n```\n\n`myvar` 被视为全局变量这一事实可能是一个特别的问题。函数通常需要使用自己的变量，而不会覆盖调用者的值，且函数不需要了解调用者的任何信息。将局部变量命名为\
  \ `the_function_variable_one`、`the_function_variable_two` 等，甚至是 `the_function_stock`\
  \ 和 `the_function_price`，很快就会变得复杂。bash shell 通过添加关键字 `local` 解决了这个问题。当你向 `the_function`\
  \ 添加 `local myvar` 行时，结果就不同了。\n\n![note.ai](img/note_fmt.gif)\n\n#### scope2.sh\n\
  \n```bash\nthe_function()\n{\n  echo \"  This is the_function.  I was passed $#\
  \ arguments: \\\"\"\n        \\\"$1\\\", \"$2\\\", \"$3\\\".\"\n  local myvar=100\n\
  \  echo \"    GLOBALVAR started as $GLOBALVAR;\"\n  GLOBALVAR='expr $GLOBALVAR +\
  \ 1'\n  echo \"    GLOBALVAR is now $GLOBALVAR\"\n  echo \"    myvar started as\
  \ $myvar;\"\n  myvar='expr $myvar + 1'\n  echo \"    myvar is now $myvar\"\n  echo\
  \ \"uniquevar started as $uniquevar\"\n  uniquevar='expr $uniquevar + 1'\n  echo\
  \ \"uniquevar is $uniquevar\"\n  echo \"  Leaving the_function.\"\n}\n```\n\n这个额外的关键字告诉\
  \ bash `myvar` 与同名的外部变量不同。在 `the_function` 内部发生的任何关于 `myvar` 的操作都不会影响另一个变量。这意味着\
  \ `the_function` 可以放心地使用它想要的任何变量名。显然，如果 `the_function` 需要引用另一个 `myvar` 变量的值，它必须为自己的局部变量使用不同的名称。\n\
  \n\n\n\n\n```\n $ ./scope2.sh a b c\nThis is the main script.\nGLOBALVAR is 1\n\
  myvar is 500\nI was passed 3 arguments: \"a\", \"b\", \"c\".\n******************************\n\
