  \ `pr -T -4`；在实际操作中，结果将变为 `mem.csv` 而不是 `pr -T -4`。\n\n\n\n\n`date` 实际上是一个非常灵活的命令，可以执行相当复杂的时间转换，所有处理日期的\
  \ GNU 工具（`touch`、`at`、`batch` 等）也是如此。访问 [`www.gnu.org/software/tar/manual/html_chapter/Date-input-formats.html`](http://www.gnu.org/software/tar/manual/html_chapter/Date-input-formats.html)\
  \ 可以查看某些可用性解释。以下脚本通过计算 30 天后、3 个月和 7 年后的 `date`，来处理敏感数据的近期备份、归档和最终删除。如果不使用 `date`，操作将会非常复杂；如果是\
  \ 10 月、11 月或 12 月，增加 3 个月就会改变年份。如果是 1 月 29 日之后，增加 30 天可能会也可能进入 3 月，这取决于是否为闰年，依此类推。`date`\
  \ 可以在后台为你处理所有这些。\n\n![download.eps](img/download_fmt.gif)\n\n```\n$ date\nSun Mar\
  \ 20 15:23:19 EDT 2011\n$ cat save_records.sh\n#!/bin/bash\nDATEFORMAT=\"%m/%d/%Y\"\
  \nTODAY='date +${DATEFORMAT}'\necho \"Today is $TODAY\"\n# Get the three dates\n\
  LONGTERM='date -d \"30 days\"  \"+${DATEFORMAT}\"'\nARCHIVAL='date -d \"3 months\"\
  \ \"+${DATEFORMAT}\"'\nDELETION='date -d \"7 years\"  \"+${DATEFORMAT}\"'\necho\
  \ \"Files will be moved to long-term storage in 30 days (midnight at $LONGTERM).\"\
  \necho \"Files will be archived at midnight on $ARCHIVAL.\"\necho \"They will be\
  \ deleted at midnight on $DELETION.\"\nat -f /usr/local/bin/longterm_records \"\
  $1\" midnight $LONGTERM\nat -f /usr/local/bin/archive_records  \"$1\" midnight $ARCHIVAL\n\
  at -f /usr/local/bin/delete_records   \"$1\" midnight $DELETION\n$ ./save_records.sh\
  \ /var/spool/data/todays_records/\nToday is 03/20/2011\nFiles will be moved to long-term\
  \ storage in 30 days (midnight at 04/19/2011).\nFiles will be archived at midnight\
  \ on 06/20/2011.\nThey will be deleted at midnight on 03/20/2018.\nwarning: commands\
  \ will be executed using /bin/sh\njob 28 at Tue Apr 19 00:00:00 21\nwarning: commands\
  \ will be executed using /bin/sh\njob 29 at Mon Jun 20 00:00:00 21\nwarning: commands\
  \ will be executed using /bin/sh\njob 30 at Tue Mar 20 00:00:00 18\n$\n```\n\n###\
  \ save_records.sh\n\n#### dirname\n\n`dirname` 与 `basename` 属于同一类别，但功能相反，它从路径中返回目录名称。当脚本不知道文件存放的确切位置时这非常有用，例如当脚本是\
  \ tar 包的一部分，该包可能被解压到用户的家目录、`/tmp` 或任何地方。以下脚本广泛使用 `dirname $0` 来生成其指向相当复杂结构的自定义路径。它使用\
  \ `etc/cfg`（相对于脚本位置）来决定是否交互式地询问安装程序接受条款。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\ncat install.sh\n#!/bin/bash\nACCEPT_LICENSE=0 # may be overridden by the\
  \ config file\necho \"Reading configuration...\"\nCFG='dirname $0'/etc/cfg\n. $CFG\n\
  echo \"Done.\"\nmkdir 'dirname $0'/logs 2>/dev/null || exit 1\nif [ \"$ACCEPT_LICENSE\"\
  \ -ne \"1\" ]; then\n  ${PAGER:-more} 'dirname $0'/LICENSE.TXT\n  read -p \"Do you\
  \ accept the terms?\"\n  case $REPLY in\n    y*|Y*) continue ;;\n    *) echo \"\
  You must accept the terms to install the software.\"\n      exit 1 ;;\n  esac\n\
  fi\nrm -f 'dirname $0'/logs/status\ncase 'uname' in\n  Linux)\n    for rpm in 'dirname\
  \ $0'/rpms/*.rpm\n    do\n      rpm -Uvh $rpm 2>&1 | tee 'dirname $0'/logs/'basename\
  \ ${rpm}'.log\n      echo \"${PIPESTATUS[0]} $rpm\" >> 'dirname $0'/logs/status\n\
  \    done\n    ;;\n  SunOS)\n    for pkg in 'dirname $0'/pkgs/*.pkg\n    do\n  \
  \    pkgadd -d $pkg 2>&1 | tee 'dirname $0'/logs/'basename ${pkg}'.log\n      echo\
  \ \"${PIPESTATUS[0]} $pkg\" >> 'dirname $0'/logs/status\n    done\n    ;;\n  *)\
  \ echo \"Unsupported OS. Only RPM and PKG formats available.\"\n    exit 2 ;;\n\
  esac\necho\n# Check for errors... grep -v \"⁰\" returns 1 if there are any lines\n\
  # which start with something other than \"0\".\ngrep -v \"⁰\" 'dirname $0'/logs/status\n\
  if [ \"$?\" -ne \"1\" ]; then\n  echo \"Errors were encountered during installation\
  \ of the above packages.\"\n  echo \"Please investigate before using the software.\"\
  \nelse\n  echo \"Software installed successfully.\"\nfi\n```\n\n### install.sh\n\
  \n在上述 `install.sh` 脚本的测试运行中，root 用户知道安装程序已下载到用户 steve 的家目录中，这不是创建 `install.sh` 的脚本编写者猜到的路径。如果\
  \ root 进入了 `funky-1.40/` 目录，那么配置文件的正确相对路径将是 `etc/install.cfg`。因为 root 实际上是从 `/home/steve`\
  \ 调用它的，正确的相对路径将是 `funky-1.40/etc/install.cfg`。通过使用 `dirname`，你不需要担心这些问题，更不必需要将绝对路径\
  \ `/home/steve/funky-1.40/etc/install.cfg` 硬编码到脚本中。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\n# cd ~steve\n# pwd\n/home/steve\n# tar xzvf funky-1.40.tar.gz\n# cd funky-1.40\n\
  # ./install.sh\n```\n\n\n\n\n\n```bash\n $ cat factorize.sh\n#!/bin/bash\nfunction\
  \ factorize\n{\n  # echo \"Parsing $@\"\n  if [ \"$#\" -gt \"1\" ];\n  then\n  \
  \  sum='expr $1 \\* $2'\n    echo \"$1 x $2 = $sum\"\n    shift 2\n    factorize\
  \ $sum $@\n  fi\n}\n# GNU says: 72: 2 2 2 3 3\n# UNIX says:\n#72\n#  2\n#  2\n#\
  \  2\n#  3\n#  3\n# So test for GNU vs non-GNU\nfactor --version | grep GNU > /dev/null\
  \ 2>&1\nif [ \"$?\" -eq \"0\" ]; then\n  factorize 'factor $1 | cut -d: -f2-'\n\
  else\n  factorize 'factor $1 | grep -v \"^${1}\" '\nfi\n```\n\n### factorize.sh\n\
  \n```bash\n $ ./factorize.sh 72\n2 x 2 = 4\n4 x 2 = 8\n8 x 3 = 24\n24 x 3 = 72\n\
  $ ./factorize.sh 913\n11 x 83 = 913\n$ ./factorize.sh 294952\n2 x 2 = 4\n4 x 2 =\
  \ 8\n8 x 7 = 56\n56 x 23 = 1288\n1288 x 229 = 294952\n$ ./factorize.sh 43674876546\n\
  2 x 3 = 6\n6 x 7 = 42\n42 x 1451 = 60942\n60942 x 716663 = 43674876546\n$\n```\n\
  \n![note.ai](img/note_fmt.gif)\n\nGNU 的 `factor` 程序将所有输出显示在同一行，并在最后一个数字和其因数之间使用冒号。Unix\
  \ 的 `factor` 将最终数字显示在第一行的开头，然后每个因数单独占一行，并缩进两个空格。脚本通过在 `--version` 输出中查找 `GNU`（这实际上只存在于\
  \ GNU 版本）来判断如何重新格式化：对于 GNU，则跳到第一个冒号之前；或者对于其他 `factor` 实现，则剪掉以初始数字开头的行。\n\n### 身份标识、组与\
  \ getent\n\n`id` 命令的一个常见用途是确保脚本以适当权限运行。这对于强制执行安全机制并不是特别有用，因为脚本可以很容易被复制和编辑，但有时，告知用户如果他们不是\
  \ root 用户，脚本将无法按预期工作是有帮助的。例如，这个短脚本显示了已配置的网络适配器及其当前速度。`ethtool` 命令需要 root 权限才能执行其任务，因此，与其无法正常工作，不如直接退出是更合理的。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```bash\n $ cat nicspeed.sh\n#!/bin/bash\n\
  # 此脚本仅对 root 用户有效。\nif [ 'id -u' -ne 0 ]; then\n  echo \"Error: This script has\
  \ to be run by root.\"\n  exit 2\nfi\nfor nic in '/sbin/ifconfig | grep \"Link encap:Ethernet\"\
  \ | \\\n    grep \"^eth\" | awk '{ print $1 }''\ndo\n  echo -en $nic\n  ethtool\
  \ $nic | grep Speed:\ndone\n```\n\n↓当作为非特权用户运行时，它会拒绝继续。\n\n```bash\n $ ./nicspeed.sh\n\
  Error: This script has to be run by root.\n```\n\n↓当作为 root 用户运行时，脚本可以正常工作。\n\n\
  ```bash\n # ./nicspeed.sh\neth0      Speed: 1000Mb/s\neth1      Speed: 100Mb/s\n\
  eth4      Speed: 1000Mb/s\n\n\n### nicspeed.sh\n\n另一个与命名服务（包括密码数据库）相关的命令是 `getent`。`getent`\
  \ 从命名服务（列在 `/etc/nss.conf` 中）检索键值对。其中一些数据库可以输出全部内容；`getent passwd` 等于 `cat /etc/passwd`，但它取决于使用的命名服务。其他的不是；`getent`\
  \ 需要一个参数（接受名称或 MAC 地址）。\n\n![note.ai](img/note_fmt.gif)\n\n自由和开源软件的一个用处是，如果你想确切了解它的工作原理，很容易获取源码并阅读。在研究这个主题时，我想检查\
  \ `getent group` 如何处理纯数字组名。访问 http://ftp.gnu.org/gnu/glibc/glibc-2.tar.gz，提取 `getent.c`\
  \ 并找到相关代码：\n\n```c\n24 gid_t arg_gid = strtol(key[i], &ep, 10);\n25\n26 if (errno\
  \ != EINVAL && key[i] != '\\0' && *ep == '\\0')\n28 grp = getgrgid(arg_gid);\n29\
  \ else\n30 grp = getgrnam(key);\n\n前面的代码检查键是否为组名，如果是，则将其视为名称；否则，将其视为数字。后续脚本分别使用了\
  \ `groups` 和 `id`。对于所有其他查询，分别使用 `getent group` 或 `getent passwd`。这应该是收集各种组合信息的有用库。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```bash\n $ cat groups.sh\n#!/bin/bash\n\
  function get_groupname\n{\n  [ -z \"$1\" ] && getent group $@ | cut -d: -f1\n}\n\
  function get_groupid\n{\n  [ -z \"$1\" ] && getent group $@ | cut -d: -f3\n}\nfunction\
  \ get_username\n{\n  [ -z \"$1\" ] && getent passwd $1 | cut -d: -f1\n}\nfunction\
  \ userid\n{\n  [ -z \"$1\" ] && getent passwd $1 | cut -d: -f3\n}\nfunction get_user_names\n\
  {\n  [ -z \"$1\" ] && groups $@ | cut -d: -f2\n}\nfunction get_user_ids\n{\n  get_user_names\
  \ $@ | while read groups\n  do\n    get_groupid $groups\n  done\n}\nfunction get_primary_group_id\n\
  {\n  [ -z \"$1\" ] && getent passwd $1 | cut -d: -f4\n}\nfunction get_primary_group_name\n\
  {\n  [ -z \"$1\" ] && get_primary_group_id $1\n}\nfunction show_user\n{\n  [ $#\
  \ -gt 0 ] && getent passwd $@ | cut -d: -f1,5\n}\nfunction show_groups\n{\n  for\
  \ uid in $@\n  do\n    echo \"User $uid : Primary group is $(get_primary_group_name\
  \ $uid)\"\n    echo \"Additional groups:\"\n    for gid in id -G $uid | cut -d,\
  \ -f2\n    do\n      printf \"%s \" \"$(get_groupname $gid)\"\n    done\n    echo\n\
  \  done\n}\nfunction show_group_members\n{\n  for sgid in $@\n  do\n    echo\n \
  \   echo \"Primary members of the group $(get_groupname $sgid)\"\n    getent passwd\
  \ | cut -d: -f1,4 | grep \":${sgid}$\" | cut -d: -f1\n    echo \"Secondary members\
  \ of the group $(get_groupname $sgid)\"\n    getent group $sgid | cut -d: -f4 |\
  \ tr ',' ' '\n  done\n}\nUSERNAME=${1:-LOGNAME}\necho \"User $USERNAME is in groups:\
  \ $(id -Gn $USERNAME)\"\ngroups $USERNAME\nshow_group_members $(id -G $USERNAME)\n\
  $\n```\n\n### groups.sh\n\n`logger` 是在大多数 Unix 和 Linux 系统上使用 syslog 命令行工具。它有几个优点，之一是允许非特权\
  \ shell 脚本写入超级用户拥的文件。这意味着写入的文件由系统管理员决定，而不是脚本作者。这提供了额外的灵活性和自定义。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```bash\n $ cat checkfs.sh\n#!/bin/bash\nlogger -t checkfs -p user.info \"Starting\
  \ checkfs\"\ndf | cut -c52- | grep -v \"Use%\" | while read usage\ndo\n  if [ \"\
  ${usage\\%}\" -gt \"85\" ]; then\n    logger -t checkfs -s -p user.warn \"Filesystem\
  \ $filesystem is at $usage\"\n  fi\ndone\nlogger -t checkfs -p user.info \"Finished\
  \ checkfs\"\n```\n\n### checkfs.sh\n\n```bash\n $ df -h\nFilesystem      Size Used\
  \ Avail Use% Mounted on\n/dev/sda5       28G   27G  395M  99% /\ntmpfs         \
  \  1.5G     0  1.5G   0% /lib/init/rw\nudev            1.5G  248K  1.5G   1% /dev\n\
  tmpfs           1.5G     0  1.5G   0% /dev/shm\n/dev/sda3       56G   55G  1.8G\
  \  97% /iso\n/dev/sda6       134G  124G  3.3G  98% /home/steve\n$ ./checkfs.sh\n\
  checkfs: Filesystem / is at 99%\ncheckfs: Filesystem /iso is at 97%\ncheckfs: Filesystem\
  \ /home/steve is at 98%\n$\n```\n\n这导致以下日志消息被添加到 `/var/log/messages` 文件中。注意，尽管脚本是非特权用户运行的（该用户可能没有读取该文件的权限），但他们仍然可以通过\
  \ syslog 写入该文件。\n\n\n\n\n\n```\nMar 29 20:14:08 goldie checkfs: Starting checkfs\n\
  Mar 29 20:14:08 goldie checkfs: Filesystem / is at 99%\nMar 29 20:14:08 goldie checkfs:\
  \ Filesystem /iso is at 97%\nMar 29 20:14:08 goldie checkfs: Filesystem /home/steve\
  \ is at 98%\nMar 29 20:14:08 goldie checkfs: Finished checkfs\n```\n\n### md5sum\n\
  \nMD5 是一种校验和算法，它根据文件内容生成较长的（128 位）校验和。它可以用于验证文件是否在静默中发生损坏，无论是在磁盘上，还是更常见地，在通过互联网等不可靠的网络进行传输时。例如，图\
  \ 14-2 显示了包含源代码、二进制文件、文档和一个 `md5sum` 文件的 GNU.org FTP 服务器。在底部窗口中，`md5sum --check`\
  \ 命令会自动从文件中读取 md5 校验和，并用下载的文件与预期校验和进行对比。\n\n两个不同的文件可能会生成相同的校验和；因为可能存在的文件数量实际上是无限的，这种情况是不可避免的，尽管在使用\
  \ MD5 时，这非常罕见。然而，对于大多数情况，如果 md5 校验和匹配，就可以安全地说文件本身是匹配的。同样，如果 md5 校验和不匹配，数据就是不同的，这是永远成立的。\n\
  \n这种方法的用途之一是监控文件的变化。为了检测在文件总大小没有变化的情况下其内容是否发生了变化，可以在怀疑变化发生前后各存储一个校验和。如果校验和不同，则文件一定被修改过。这对于大文件来说特别有用，因为仅仅通过拍摄文件的快照副本来观察其是否发生了（或没有）修改是不现实的。无论文件本身有多大，任何文件的\
  \ md5 校验和始终只有 128 字节。因此，保存文件校验和的定期快照是可行的，即使保存实际数据的多个副本在实践上不可行。\n\n图 14-2\n\n![f1402.tif](img/f1402_fmt.jpg)\n\
  \n该脚本监控文件并在发生变化时报告。它保存了正在监控文件的 md5sums，每当其中任何文件发生变化时，就会发送警报。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\n # cat monitorlogs.sh\n#!/bin/bash\nSAVEDIR=/tmp/log.save\nmkdir -p ${SAVEDIR}\n\
  cd /var/log\nNOW='date +%d%b%Y%H%S'\nmkdir -p \"$SAVEDIR\" 2>/dev/null\nfor FILE\
  \ in messages syslog dmesg daemon.log\ndo\n  md5sum ${FILE} | cut -d\" \" -f1 >\
  \ \"${SAVEDIR}/${FILE}.md5\"\nwhile :\ndo\n  NOW='date +%d%b%Y%H%S'\n  for FILE\
  \ in messages syslog dmesg daemon.log\n  do\n    prev='cat \"$SAVEDIR/${FILE}.md5\"\
  \ || echo 0\n    if [ -s \"${FILE}\" ]; then\n      # it exists and has content\n\
  \      md5='md5sum ${FILE} | cut -d\" \" -f1 | tee \"${SAVEDIR}/${FILE}.md5'\n \
  \     if [ \"$prev\" != \"$md5\" ]; then\n        case \"$prev\" in\n          0)\
  \ echo \"'date': $FILE appeared.\" ;;\n          *) echo \"'date': $FILE changed.\"\
  \ ;;\n        esac\n        cp \"${FILE}\" \"${SAVEDIR}/${FILE}.$NOW\"\n      fi\n\
  \    else\n      # it doesn't exist; did it exist before?\n      if [ \"$prev\"\
  \ != \"0\" ]; then\n        echo \"'date': $FILE disappeared.\"\n        echo 0\
  \ > \"${SAVEDIR}/${FILE}.md5\"\n      fi\n    fi\n  done\n  sleep 30\ndone\n# ./monitorlogs.sh\n\
  Feb 11 11:44:45 2011 messages appeared.\nFeb 11 11:44:45 2011 syslog appeared.\n\
  Feb 11 11:44:45 2011 dmesg appeared.\nFeb 11 11:44:45 2011 daemon.log appeared.\n\
  Feb 11 11:45:15 2011 messages changed.\nFeb 11 11:45:15 2011 syslog changed.\nFeb\
  \ 11 11:46:15 2011 messages changed.\nFeb 11 11:46:15 2011 syslog changed.\n^C\n\
  #\n```\n\n### monitorlogs.sh\n\n### mkfifo\n\n先入先出（FIFO）文件被称为命名管道。与普通管道（用于连接独立命令的输入输出）不同，FIFO\
  \ 管理进程之间的输入和输出。然而，任何进程（如果文件系统权限允许）都可以对该管道读取和写入数据。这允许多个进程进行通信，而无需知道是谁在接收它们发送的数据，或在发送它们接收的数据。`mkfifo`\
  \ 命令用于设置 FIFO，并可以设置权限。\n\n### 主与从进程\n\n这种进程间通信以一种非常简单易用且理解的方式提供了非常有用的多任务处理能力。主脚本偶尔发出命令；它的许多从进程中的一个会获取并处理它。该工作可能需要时间才能完成（这些客户端有很多\
  \ sleep 语句以确保这一点！），但主脚本可以将任务调度给队列并返回循环。然而，当所有的从进程（或客户端）都在忙时，它向 FIFO 的 echo 操作在有客户端获取之前不会返回，因此主脚本随后会被阻塞。在图\
  \ 14-3 中，当第一个客户端（中间左侧）获取了“退出”命令时，没有更多进程在监听管道，因此主脚本无法显示其内容。\n\n反转顺序\n\n\n\n\n\n相反地，可以有许多独立的进程向\
  \ `FIFO` 写入数据，然后由一个主节点（甚至是多个主节点）从管道的另一端进行读取。一组进程可以收集要执行的任务，而另一组进程则像上一个例子中的小工人一样获取下一个可用的任务。这种方案有多个收集者，每个收集者并发地从不同的文件系统读取，并在发现\
  \ zip 压缩包时将其写入 `FIFO`。在这种场景下，主节点是从 `FIFO` 读取的脚本。以下脚本从 `FIFO` 读取 zip 文件，并查找包含“chapter”字样的文件。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```bash\n#!/bin/bash\nfifo=/tmp/zips.fifo\n\
  rm $fifo\nmkfifo $fifo\nsearchstring=$@\nwhile read filename\ndo\n  unzip -l \"\
  ${filename}\" | grep $searchstring > /dev/null 2>&1\n  if [ \"$?\" -eq \"0\" ];\
  \ then\n    echo \"Found \"$searchstring\" in $filename\"\n  fi\ndone < $fifo\n\
  echo \"Finished.\"\n```\n\n`zip-master.sh`\n\n`zip-gatherer.sh` 脚本包含一个 `searchfs`\
  \ 函数，它会在给定的文件系统中进行查找（因此，搜索 `/` 不会跨越到独立的 `/home` 文件系统），并为发现的每个类型为 `crypt`、`ext` 或\
  \ `fuseblk` 的文件系统在后台执行该函数的实例。\n\n![download.eps](img/download_fmt.gif)\n\n```bash\n\
  #!/bin/bash\nfifo=/tmp/zips.fifo\nfunction searchfs\n{\n  temp='mktemp'\n  find\
  \ ${1} -mount -type f -iname \"*zip\" -exec file {} \\; \\\n          | grep \"\
  Zip archive data\" | cut -d: -f1 > $temp\n  cat $temp > $fifo\n  rm -f $temp\n \
  \ echo \"Finished searching ${1}.\"\n}\nfor filesystem in 'mount -t crypt,ext3,ext4,fuseblk\
  \ | cut -d\" \" -f3'\ndo\n  echo \"Spawning a child to search $filesystem\"\n  searchfs\
  \ $filesystem &\ndone\n# 等待子进程完成\nwait\n# 向主节点发送一个 EOF 以关闭 fifo\nprintf \"%c\" 04\
  \ > $fifo\n```\n\n`zip-gatherer.sh`\n\n`searchfs` 函数将其写入临时文件，然后将该文件导出到 `FIFO`。这有助于一致性，因为\
  \ `find` 命令运行可能需要长时间，且不同的函数实例可能会相互重叠，导致 `FIFO` 中的文件名混乱。\n\n`zip-gatherer.sh` 脚本通过向\
  \ `FIFO` 发送 `04` (EOT) 字符结束。这会关闭文件，导致 `zip-master.sh` 中的 `while read` 循环退出。`zip-gatherer.sh`\
  \ 通过执行无参数的 `wait` 命令来确保所有子进程都已完成搜索，该命令在所有子进程完成之前不会返回。\n\n以下显示了 `zip-gatherer.sh`\
  \ 的输出。`/` 下某些目录非特权用户不可，因此会显示权限拒绝（Permission denied）。可以通过将 stderr 重定向到 `/dev/null`\
  \ 轻松隐藏它。主脚本启动后台进程遍历发现的每个文件系统，每个进程都将其发现的结果写入同一个共享 `FIFO`，等待主脚本处理。\n\n```\n\n ./zip-gatherer.sh\n\
  Spawning a child to search /\nSpawning a child to search /windows\nSpawning a child\
  \ to search /home/steve\nfind: '/var/lib/php5': Permission denied\nfind: '/var/lib/polkit-1':\
  \ Permission denied\nfind: '/var/lib/sudo': Permission denied\nfind: '/var/lib/gdm':\
  \ Permission denied\nfind: '/var/cache/system-tools-backends/backup': Permission\
  \ denied\nfind: '/var/cache/ldconfig': Permission denied\nfind: '/var/spool/exim4':\
  \ Permission denied\nfind: '/var/spool/cups': Permission denied\nfind: '/var/spool/cron/atspool':\
  \ Permission denied\nfind: '/var/spool/cron/atjobs': Permission denied\nfind: '/var/spool/cron/crontabs':\
  \ Permission denied\nfind: '/var/run/exim4': Permission denied\nfind: '/var/run/cups/certs':\
  \ Permission denied\nfind: '/var/log/exim4': Permission denied\nfind: '/var/log/apache2':\
  \ Permission denied\nfind: '/home/steve/lost+found': Permission denied\nfind: '/etc/ssl/private':\
  \ Permission denied\nfind: '/etc/cups/ssl': Permission denied\nfind: '/lost+found':\
  \ Permission denied\nfind: '/root': Permission denied\nFinished searching /.\nFinished\
  \ searching /home/steve.\nFinished searching /windows.\n$\n```\n\n接下来的代码段显示了 `zip-master.sh`\
  \ 的输出。`actionis.zip` 不是一个有效的 zip 文件，因此 `unzip` 显示了错误。为了灵活性，`zip-master.sh` 在命令行上接受\
  \ `grep` 参数，以便你可以选择搜索的内容。这意味着可以将 `-i` 参数传递给 `grep` 以进行不区分大小写的搜索。\n\n```\n $ ./zip-master.sh\
  \ -i chapter\nFound \"-i chapter\" in /iso/E19787-01.zip\nFound \"-i chapter\" in\
  \ /home/steve/\nFound \"-i chapter\" in /home/steve/\nunzip: error not a zip file:\
  \ actionis.zip\nFound \"-i chapter\" in /home/steve\nFinished.\n$\n```\n\n### 网络\n\
  \n网络是 Unix 和 Linux 的核心。网络相关的命令有很多，可以很容易地脚本，`telnet` 和 `ping` 是其中常见的。最后，加密是今天网络的一部分，即使是内部通信也是。\n\
  \n#### telnet\n\n`telnet` 是一种在网络上登录远程系统的旧且不安全的协议。然而，`telnet` 客户端仍然是非常用的网络测试工具，因为它只是在两个系统之间传输文本（尽管它会将某些字符视为协议信息，但对于测试\
  \ `HTTP`、`SMTP`、`POP` 和 `IMAP` 足够）。使用简单的 `telnet` 命令测试 Web 服务器很容易；在下面的示例中，`www.example.com`\
  \ 服务器给出了 `302` 状态码，这表示重定向到 `http://www.iana.org/domains/example/`（`HTTP` 状态码的定义请参见\
  \ `http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html`），但实际上将其视为成功连接服务器。`HTTP`\
  \ 状态码 400 和 500 通常是有问题的，分别表示请求或服务器的问题。数字越小越好；`200` 意味着 OK，表示完全成功。\n\n![note.ai](img/note_fmt.gif)\n\
  \n在交互式测试 `HTTP` 服务器时，最简单的方法指定 `HTTP/1.0` 而不是 `HTTP/1.1`，因为 1.0 版本不需要额外的头部。此外，记住在请求后发送一个空行（即按两次回车键）以指示头部结束。\n\
  \n```\n $ telnet www.example.com 80\nTrying 192.0.32.10...\nConnected to www.example.com.\n\
  Escape character is '^]'.\nGET http://www.example.com/ HTTP/1.0\nHTTP/1.0 302 Found\n\
  Location: http://www.iana.org/domains/example/\nServer: BigIP\nConnection: close\n\
  Content-Length: 0\nConnection closed by foreign host.\n$\n```\n\n\n\n\n你也可以使用 telnet\
  \ 客户端直接与 SMTP、POP 和 IMAP 服务器通信，使用它们相应的协议，尽管这些协议现在越来越多地默认加密。请参阅章节后后的“OpenSSL”部分以了解如何与加密服务通信；这并不像通常认为的那么困难，甚至非常容易编写脚本。\n\
  \n`netcat`\n\n`netcat` 工具在网络上传输数据。它与 telnet 客户端非常相似，但它对特殊字符（如 EOF）的处理不同。这意味着它可以用于在网络上传输二进制数据，且不会损坏任何数据包。`netcat`\
  \ 有许多用途，包括以与 telnet 相同的方式测试连接、端口扫描和文件传输。\n\n### 使用 `netcat` 测试连接\n\n`netcat` 可以以类似于\
  \ telnet 的方式与基于文本的协议（如 HTTP、SNMP、POP、IMAP）的服务器通信。它不会特殊对待 EOF，也不会显示关于转义字符之类的自定义消息，因此其输出可以直接保存到文件中。\n\
  \n```bash\n$ telnet www.example.com 80\n```\n\n↓接下来的三行来自 telnet，而不是服务器。\n\n```\n\
  Trying 192.0.32.10...\nConnected to www.example.com.\nEscape character is '^]'.\n\
  HEAD / HTTP/1.0\nHTTP/1.0 302 Found\nLocation: http://www.iana.org/domains/example/\n\
  Server: BigIP\nConnection: close\nContent-Length: 0\nConnection closed by foreign\
  \ host.\n$ netcat www.example.com 80\nHEAD / HTTP/1.0\n```\n\n↓所有输出都来自服务器本身。\n\n\
  ```\nHTTP/1.0 302 Found\nLocation: http://www.iana.org/domains/example/\nServer:\
  \ BigIP\nConnection: close\nContent-Length: 0\n$\n```\n\n### 使用 `netcat` 作为端口扫描器\n\
  \n`nmap` 是此项工作更强大的工具，但 `netcat` 也可以用端口扫描器。同样，它的输出是极简的，因此在自动化脚本中解析 `netcat` 输出要容易得多。\n\
  \n```bash\n$ nmap 192.168.0.210\nStarting Nmap 5.00 ( http://nmap.org ) at 2011-03-24\
  \ 19:41 GMT\nInteresting ports on intranet (192.168.0.210):\nNot shown: 997 closed\
  \ ports\nPORT    STATE SERVICE\n22/tcp  open  ssh\n80/tcp  open  http\n111/tcp open\
  \  rpcbind\nNmap done: 1 IP address (1 host up) scanned in 0.08 seconds\n$ netcat\
  \ -vz 192.168.0.210 1-1024\nintranet [192.168.0.210] 111 (sunrpc) open\nintranet\
  \ [192.168.0.210] 80 (www) open\nintranet [192.168.0.210] 22 (ssh) open\n$\n```\n\
  \n### 使用 `netcat` 传输数据\n\n`netcat` 也可以用于在系统之间传输数据。因为它直接接收数据，它可以将其输出直接写入文件。在接收端，启动\
  \ `netcat -l`（监听）并指定端口号。通过 `pv` 管道传输并非必需，但它确实可以显示方便的进度状态；`pv -t` 显示管道活跃的时间；`pv -b`\
  \ 显示通过了多少字节。\n\n```bash\nrecipient$ netcat -l -p 8888 | pv -t > fedora.iso.gz\n\
  0:39:17\n$\n```\n\n在发送端，使用 `cat` 将文件内容输入到 `netcat`。同样，我将 `pv` 放入管道中，因为它能方便地显示进度。否则，由于\
  \ `netcat` 忽略 EOF，没有方便的方法来判断传输已完成。因此，在传输完成时需要（从任一端）按下 `Ctrl-C` 来结束连接。某些发行版自动启用 `netcat`\
  \ 的 `-q` 选项，但这会导致它在传输二进制文件时不再实用。\n\n```bash\nsender$ cat /iso/Fedora-14-i686-Live-Desktop.iso.gz\
  \ | pv -b | netcat recipient 8888\n669MB\n^C\n$\n```\n\n更进一步一步，你可以通过 `netcat` 发送整个\
  \ tar 包或 cpio 存档。在下面的示例中，我对 `tar` 使用了 `-v` 标记，以便文件在存入和从存档中提取时在两端显示出来。\n\n```bash\n\
  recipient$ netcat -l -p 8888 | pv -t | tar xvf -\niso/:01\niso/debian-504-amd64-DVD-1.iso\n\
  iso/solaris-cluster-3_3-ga-x86.zip\niso/solaris-cluster-3_3-ga-sparc.zip\n0:32:21\n\
  $sender$ tar cvf - /iso | pv -b | netcat recipient 8888\ntar: Removing leading '/'\
  \ from member\niso/debian-504-amd64-DVD-1.iso\niso/solaris-cluster-3_3-ga-x86.zip\n\
  iso/solaris-cluster-3_3-ga-sparc.zip\n4.5GB\n^C\n$\n```\n\n### ping\n\n`ping` 是一个基础诊断工具，它向另一个主机发送\
  \ `ICMP` 请求以获取响应。如果远程主机（除非它是固执系统或防火墙）会回传 `ICMP` 复。这主要用于判断远程主机是否存活；另一个效果是如果位于同一子网，远程主机的\
  \ MAC 地址现在已添加到本地系统的 ARP 缓存中。传统 `ping` 实现的一个痛点是它们会发送四个数据包并等待很长时间的响应。像这样的脚本可以用于](images_fmt.gif）测试整个\
  \ C 子网。\n\n```bash\n$ cat simpleping.sh\n#!/bin/bash\nLOG=ping.log\nPREFIX=192.168.1\n\
  i=1\nwhile [ \"$i\" -lt \"8\" ]\ndo\n  echo \"Pinging ${PREFIX}.$i\"\n  ping -c1\
  \ -w1 ${PREFIX}.$i > /tmp/ping.$i 2>&1 &\n  sleep 2\n  kill -9 !$\n  grep \"⁶⁴ bytes\
  \ from\" /tmp/ping.$i\n  if [ \"$?\" -eq \"0\" ]; then\n    echo \"${PREFIX}.$i\
  \ is alive\" | tee -a $LOG\n  else\n    echo \"${PREFIX}.$i is dead\" | tee -a $LOG\n\
  \  fi\n  rm -f /tmp/ping.$i\n  i='expr $i + 1'\ndone\n$ ./simpleping.sh\nPinging\
  \ 192.168.1.1\n./ping.sh: line 20: 641 Killed ping ${PREFIX}.$i > /tmp/ping.$i 2>&1\n\
  192.168.1.1 is alive\nPinging 192.168.1.2\n./ping.sh: line 20: 651 Killed ping ${PREFIX}.$i\
  \ > /tmp/ping.$i 2>&1\n192.168.1.2 is dead\nPinging 192.168.1.3\n./ping.sh: line\
  \ 20: 658 Killed ping ${PREFIX}.$i > /tmp/ping.$i 2>&1\n192.168.1.3 is alive\nPinging\
  \ 192.168.1.4\n./ping.sh: line 20: 665 Killed ping ${PREFIX}.$i > /tmp/ping.$i 2>&1\n\
  192.168.1.4 is dead\nPinging 192.168.1.5\n./ping.sh: line 20: 675 Killed ping ${PREFIX}.$i\
  \ > /tmp/ping.$i 2>&1\n192.168.1.5 is dead\nPinging 192.168.1.6\n./ping.sh: line\
  \ 20: 682 Killed ping ${PREFIX}.$i > /tmp/ping.$i 2>&1\n192.168.1.6 is dead\nPinging\
  \ 192.168.1.7\n./ping.sh: line 20: 689 Killed ping ${PREFIX}.$i > /tmp/ping.$i 2>&1\n\
  192.168.1.7 is dead\n$ cat ping.log\n192.168.1.1 is alive\n192.168.1.2 is dead\n\
  192.168.1.3 is alive\n192.168.1.4 is dead\n192.168.1.5 is dead\n192.168.1.6 is dead\n\
  192.168.1.7 is dead\n$\n```\n\nsimpleping.sh\n\n这只测试了网络上的前七个设备，并浪费了大量的屏幕空间。最好指定超时最大数据包计数；GNU\
  \ `ping` 分别通过 `-w` 和 `-c` 选项提供了这一功能。这使得 ping 测试变得更简单、干净且更快速。前面的测试大约需要运行八分钟；接下来的只需要一秒（正常情况下，单个\
  \ ping 不会花费整一秒）。为了获得更高的准确性，可以将 `-w1` 增加到 `-w2`；这将花费两秒完成，但为主机提供了两秒而不是一秒。你也可以使用 `-c2`\
  \ 在第一个数据包丢失时发送两个数据包。\n\n```bash\n$ ping2.sh\n#!/bin/bash\nLOG=ping.log\nPREFIX=192.168.1\n\
  for i in 'seq 1 254'\ndo\n  echo \"Pinging ${PREFIX}.$i\"\n  ping -c1 -w1 ${PREFIX}.$i\
  \ > /tmp/ping.$i 2>&1 &\n  sleep 2\n  kill -9 !$\n  grep \"⁶⁴ bytes from\" /tmp/ping.$i\n\
  \  if [ \"$?\" -eq \"0\" ]; then\n    echo \"${PREFIX}.$i is alive\" | tee -a $LOG\n\
  \  else\n    echo \"${PREFIX}.$i is dead\" | tee -a $LOG\n  fi\n  rm -f /tmp/ping.$i\n\
  \  i='expr $i + 1'\ndone\n$\n$ time ./ping2.sh > /dev/null 2>&1\nreal    0m0.255s\n\
  user    0m0.008s\nsys     0m0.028s\n$\n$ wc -l ping.log\n254 ping.log\n$ grep alive\
  \ ping.log\n192.168.1.1 is alive\n192.168.1.3 is alive\n192.168.1.10 is alive\n\
  $\n```\n\n\n\n\n\n还有一种称为广播 ping（`ping -b`）的技术；它会向本地子网的广播地址发送一个单一的 ping 请求。子网上的每个节点都应该对此\
  \ ping 请求做出响应。那样会更简单，尽管单个节点可以配置为忽略广播请求，即使它们会针对定制的 ping 请求做出响应。\n\n## 脚本化 ssh 和 scp\n\
  \n在过去的时代，`rcp` 是一个在系统之间拷贝文件的有用工具。它很容易设置，shell 脚本可以轻松地将文件从一台机器拷贝到另一台，而不会产生任何尴尬的问题。现在的网络不再像以前那样被信任了，因此\
  \ `rcp`、`rlogin`、`rsh` 以及它们那些天真信任的朋友（通常被称为 r-tools）已经过时。\n\n![note.ai](img/note_fmt.gif)\n\
  \n尽管 `rsync` 工具的名称以“r”（代表 remote，远程）开头，但它并不是“r-tools”之一，并且可以配置为使用 `SSH` 进行安全的身份验证和加密。\n\
  \n许多人熟悉交互式地使用 `scp`，但它也可以用于提供安全的无密码身份验证。关键在于公钥基础设施（PKI）。`PKI` 意味着你可以拥有非对称密钥；这意味着其中一个被相对安全地保存，被称为私钥。另一个密钥可以安全地与任何人共享，即使是不可信任的敌人也可以，并被称为公钥。用公钥加密的数据可以用私钥解密，反之亦然。这在实际上意味着，你可以向远程主机证明你是私钥的所有者，而无需向任何人透露该密钥。这可以作为许多其他功能（包括安全的网页浏览）的无密码登录的基础。\n\
  \n![note.ai](img/note_fmt.gif)\n\n在私钥上使用空密码短（passphrase）会抵消 `PKI` 的整个身份验证方面。有时，这种情况下是可以的——如果只需要加密，那么身份验证就不重要了——但为了身份验证的目的，确保私钥有一个良好的密码短是至关重要的。\n\
  \n`ssh-keygen` 工具创建一对密钥。然后你只需要将公钥（`id_rsa.pub`）拷贝（或追加）到远程服务器的 `~/.ssh/authorized_keys`\
  \ 中，并正确设置权限（`~/.ssh` 目录设置为 `0700`，`~/.ssh/authorized_keys` 设置为 `0600`）。`ssh-copy-id`\
  \ 工具为你完成了这一切。\n\n```bash\n home$ ssh-keygen\nGenerating public/private rsa key pair.\n\
  Enter file in which to save the key (/home/steve/.ssh/id_rsa): <enter>\nCreated\
  \ directory '/home/steve/.ssh'.\nEnter passphrase (empty for no passphrase): ssh-password\n\
  Enter same passphrase again: ssh-password\nYour identification has been saved in\
  \ /home/steve/.ssh/id_rsa.\nYour public key has been saved in /home/steve/.ssh/id_rsa.pub.\n\
  The key fingerprint \nis:\n28:17:fd:fe:df:60:8a:fa:9e:17:c0:94:8c:5f:e2:35\nhome$\n\
  home$ ssh-copy-id -i ~/.ssh/id_rsa.pub example.com\nsteve@example.com's password:\
  \ example.com-password\nNow try logging into the machine, with \"ssh 'example.com'\"\
  , and check in:\n.ssh/authorized_keys\nto make sure we haven't added extra keys\
  \ that you weren't expecting.\nhome$ ssh example.com\nEnter passphrase for key '/home/steve/.ssh/id_rsa':\
  \ ssh-password\nLast login: Fri Dec 11 11:01:33 2009 from home\nexample.com$ ls\
  \ -l .ssh/authorized_keys\n-rw-------  1 steve  user    395 Jun 3  2011 authorized_keys\n\
  example.com$\n```\n\n下一步是将密钥添加到你的环境中。如果你正在运行诸如 `GNOME` 或 `KDE` 等图形化会话，`SSH` agent\
  \ 应该已经在为你运行了。如果没有运行，你需要让你当前的 shell 解析 `ssh-agent` 命令的输出。这为你的 shell 提供了与 `ssh-agent`\
  \ 通信所需设置，`ssh-agent` 在调用调用后会自动在后台启动。然后你可以使用 `ssh-add` 命令手动将密钥添加到 agent。这将提示输入密钥的密码短，并将密钥存储在内存中供后续连接使用。\n\
  \n```bash\n home$ eval 'ssh-agent'\nAgent pid 3996\nhome$ ps -fp 3996\nUID     \
  \  PID  PPID  C STIME TTY           TIME CMD\nsteve      3996      1  0  19:43 \
  \ ?            00:00 ssh-agent\nhome$ ssh-add\nEnter passphrase for /home/steve/.ssh/id_rsa:\n\
  Identity added /home/steve/.ssh/id_rsa\nhome$ ssh@example.com\nve@example.com:~$\
  \ uname -n\nexample.com:~$\n```\n\n整个设置只需要几分钟，就能为你提供一个连接到远程机器的安全基础设施。这可以用于提供类似于\
  \ `rcp` 的文件拷贝。接下来的脚本会检查身份验证是否正常，如果不正常则显示错误消息。一旦确认基础设施正常，它将使用 `scp` 将命令行上列出的任何文件拷贝到远程主机。因为调用的\
  \ shell 有一个活跃的 `ssh-agent`，在任何阶段都不会询问密码。\n\n![download](img/download_fmt.gif)\n\n\
  ```bash\n#!/bin/bash\nuser=$1\nhost=$2\nfiles=$@\necho \"Testing connection to $host...\"\
  \nssh -n -o NumberPasspts=0 $user@$host\nif [ \"$?\" -ne \"0\" ]; then\n  echo \"\
  FATAL: You do not have passwordless ssh.\"\n  echo \"Try ssh-add.\"\n  exit 1\n\
  fi\necho \"Okay. Starting the scp.\"\nscp -B $files $user@$host\nif [ \"$?\" -ne\
  \ \"0\" ]; then\n  echo \"An error occurred.\"\nelse\n  echo \"Successfully copied\
  \ $files to $host\"\nfi\nssh $user@$host lsls -l $files\n$ ./scp.sh wrong example.com\
  \ scp.sh data\nTesting connection to example.com...\nPseudo-terminal will not be\
  \ allocated because stdin is not a terminal.\nPermission denied (publickey,password,keyboard-interactive).\n\
  FATAL: You do not have passwordless ssh.\nTry ssh-add.\n$ ./scp.sh steve.com scp.sh\
  \ data\nTesting connection to example.com...\nPseudo-terminal will not be allocated\
  \ because stdin is not a terminal.\nOkay. Starting the scp.\nhosts    100%  479\
  \  0.5KB/s  00:00\nscp.sh   100%  436  0.4KB/s  00:00\ndata     100%  4096KB 105.0KB/s\
  \  00:39\nSuccessfully copied hosts scp.sh data to example.com\nI can do ssh as\
  \ well.\n-rw-r--r--  1 steve  user  479 Mar 21 14:51 hosts\n-rw-r--r--  1 steve\
  \  user  4194304 Mar 21 14:52 data\n-rwxr-xr-x  1 steve  user  501 Mar 21 14:51\
  \ scp.sh\nhome$\n```\n\n## scp.sh\n\n真的如此简单；你可以设置自动化拷贝，并通过脚本 安全地在远程机器上运行命令。这是一个非常有用的工具，为了保持其安全，你只需要对密码秘密，不要让任何人接管你的登录会话。\n\
  \n## OpenSSL\n\n`OpenSSL` 是管理安全套接字层（`SSL`）连接的库。`SSL` 提供两个关键优势：身份验证和加密。本节主要涉及加密方面。对于身份验证，密钥由证书颁发机构（CA）签名，客户端软件（通常是浏览器或邮件客户端）认可。无论是由\
  \ CA 签名还是你自己签名（称为自签名证书），其余部分都是。添加 SSL 会增加一些复杂性；例如，无法使用 `telnet` 建立 SSL 连接。设置 SSL\
  \ 连接相当复杂，但 `openssl` 二进制文件通过 `s_client` 命令提供了一个实用的封装。它在后台实现了所有的 `SSL` 协议，并尽可能轻松地提供了一个安全的传输机制。\n\
  \n\n\n\n\n`openssl s_client` 工具在后台完成所有的 SSL 握手并显示结果。在下面的代码段中，到 [www.google.com](http://www.google.com)\
  \  `443` 端口的连接会交换证书并建立安全连接。随后的 HTTP 会话与之前显示的未加密会话相同；`302` 状态码将重定向到 `google.com`\
  \ 的另一个页面。然而，这一次，窃听者只能看到加密后的流量。\n\n![note.ai](img/note_fmt.gif)\n\n相同的技术也可以用于连接到安全的\
  \ SMTP、IMAP、POP 以及其他基于文本的服务。\n\n```\n $ openssl s_client  -connect www.google.com:443\n\
  CONNECTED(00000003)\ndepth=1  /C=ZA/O=Thawte Consulting  (Pty)  Ltd./CN=Thawte SGC\
  \ CA\nverify error:num=20:unable to get local issuer certificate\nverify return:0\n\
  ---\nCertificate chain\n 0  s:/C=US/ST=California/L=Mountain View/O=Google Inc/CN=www.google.com\n\
  \    i:/C=ZA/O=Thawte Consulting  (Pty)  Ltd./CN=Thawte SGC CA\n 1  s:/C=ZA/O=Thawte\
  \ Consulting  (Pty)  Ltd./CN=Thawte SGC CA\n    i:/C=US/O=VeriSign,  Inc./OU=Class\
  \  3  Public Primary Certification Authority\n---\nServer certificate\n-----BEGIN\
  \ CERTIFICATE-----\nMIIDITCCAoqgAwIBAgIQL9+89q6RUm0PmqPfQDQ+mjANBgkqhkiG9w0BAQUFADBM\n\
  MQswCQYDVQQGEwJaQTElMCMGA1UEChMcVGhhd3RlIENvbnN1bHRpbmcgKFB0eSkg\nTHRkLjEWMBQGA1UEAxMNVGhhd3RlIFNHQyBDQTAeFw0wOTEyMTgwMDAwMDBaFw0x\n\
  MTEyMTgyMzU5NTlaMGgxCzAJBgNVBAYTAlVTMRMwEQYDVQQIEwpDYWxpZm9ybmlh\nMRYwFAYDVQQHFA1Nb3VudGFpbiBWaWV3MRMwEQYDVQQKFApHb29nbGUgSW5jMRcw\n\
  FQYDVQQDFA53d3cuZ29vZ2xlLmNvbTCBnzANBgkqhkiG9w0BAQEFAAOBjQAwgYkC\ngYEA6PmGD5D6htffvXImttdEAoN4c9kCKO+IRTn7EOh8rqk41XXGOOsKFQebg+jN\n\
  gtXj9xVoRaELGYW84u+E593y17iYwqG7tcFR39SDAqc9BkJb4SLD3muFXxzW2k6L\n05vuuWciKh0R73mkszeK9P4Y/bz5RiNQl/Os/CRGK1w7t0UCAwEAAaOB5zCB5DAM\n\
  BgNVHRMBAf8EAjAAMDYGA1UdHwQvMC0wK6ApoCeGJWh0dHA6Ly9jcmwudGhhd3Rl\nLmNvbS9UaGF3dGVTR0NDQS5jcmwwKAYDVR0lBCEwHwYIKwYBBQUHAwEGCCsGAQUF\n\
  BwMCBglghkgBhvhCBAEwcgYIKwYBBQUHAQEEZjBkMCIGCCsGAQUFBzABhhZodHRw\nOi8vb2NzcC50aGF3dGUuY29tMD4GCCsGAQUFBzAChjJodHRwOi8vd3d3LnRoYXd0\n\
  ZS5jb20vcmVwb3NpdG9yeS9UaGF3dGVfU0dDX0NBLmNydDANBgkqhkiG9w0BAQUF\nAAOBgQCfQ89bxFApsb/isJr/aiEdLRLDLE5a+RLizrmCUi3nHX4adpaQedEkUjh5\n\
  u2ONgJd8IyAPkU0Wueru9G2Jysa9zCRo1kNbzipYvzwY4OA8Ys+WAi0oR1A04Se6\nz5nRUP8pJcA2NhUzUnC+MY+f6H/nEQyNv4SgQhqAibAxWEEHXw==\n\
  -----END CERTIFICATE-----\nsubject=/C=US/ST=California/L=Mountain View/O=Google\
  \ Inc/CN=www.google.com\nissuer=/C=ZA/O=Thawte Consulting  (Pty)  Ltd./CN=Thawte\
  \ SGC CA\n---\nNo client certificate CA names sent\n---\nSSL handshake has read\
  \  1772 bytes and written  307 bytes\n---\nNew,  TLSv1/SSLv3, cipher TLS_AES_256_GCM_SHA256\
  \ (TLSv1.3)\nNew,  TLSv1/SSLv3, cipher TLS_AES_256_GCM_SHA256 compression: \nNew,\
  \  TLSv1/SSLv3, cipher TLS_AES_256_GCM_SHA256 compression: \n```\n\n`openssl` 二进制文件同样能够运行一个非常基础的安全\
  \ Web 服务器。它会传递相对于其运行本地目录的文件，因此在 `/var/tmp` 中运行时，对 `/README` 的请求将返回 `/var/tmp/README`\
  \ 文件。这不适用于生产环境，但对于测试 SSL 客户端的连接性非常有用。这里不是介绍 SSL 的入门教程，但以下操作将让你获得一个供 OpenSSL 服务器使用的自签名证书（密码为\
  \ `welcome123`）。\n\n在创建 `server.pem` 后，你可以丢弃 `server.key` 和 `server.crt` 文件；只需要\
  \ `server.pem`。\n\n\n\n\n\n```\nopenssl genrsa -des3 1024 > server.key\n正在生成 1024\
  \ 位模数的 RSA 私钥\n............++++++\n.............................++++++\ne 为 65537\
  \ (0x10001)\n输入密码短语: welcome123\n验证 - 输入密码短语: welcome123\nopenssl req -new -key\
  \ server.key -x509 -days 3650 -out server.crt\n输入 server.key 的密码短语: welcome123\n\
  将被要求输入将纳入证书请求中的信息。\n你即将输入的内容被称为“特定名称”（Distinguished Name，简称 DN）。\n有很多字段，但你可以留一些空白\n\
  某些字段将有一个默认值，\n如果你输入 '.'，则该字段将留空。\n-----\n国家名称（2 位代码） [AU]:US\n州或省名称（全名） [Some-State]:New\
  \ York\n地区名称（例如，城市） []::New York\n组织名称（例如，公司） [Internet Widgits Pty Ltd]:Wrox\n\
  组织单位名称（例如，部门） []:Shell Scripting Recipes\n通用名称（例如，您的名称） []::Steve Parker\n电子邮件地址\
  \ []::steve@steve-parker.org\ncat server.crt server.key > server.pem\ncat server.pem\n\
  -----BEGIN CERTIFICATE-----\nMIID0TCCAzqgAwIBAgIJAMCjRE2qwt6vMA0GCSqGSIb3DQEBBQUAMIGiMQswCQYD\n\
  VQQGEwJVUzERMA8GA1UECBMITmV3IFlvcmsxETAPBgNVBAcTCE5ldyBZb3JrMQ0w\nCwYDVQQKEwRXcm94MSAwHgYDVQQLExdTaGVsbCBTY3JpcHRpbmcgUmVjaXBlczEV\n\
  MBMGA1UEAxMMU3RldmUgUGFya2VyMSUwIwYJKoZIhvcNAQkBFhZzdGV2ZUBzdGV2\nZS1wYXJrZXIub3JnMB4XDTExMDMwMTIyMTkwNloXDTIxMDIyNjIyMTkwNlowgaIx\n\
