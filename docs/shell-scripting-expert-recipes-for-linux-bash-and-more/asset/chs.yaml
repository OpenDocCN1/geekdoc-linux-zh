  \ 与他联系。\n\n## 关于技术编辑\nJohn Kennedy 自 1997 年以来一直担任 `Linux`（以及 `Unix`）系统管理员。他曾接触过\
  \ `Red Hat`、`SUSE`、`Debian`、`Ubuntu`、`Solaris` 和 `HP-UX`。他从 2000 年开始编写 `bash` 脚本，是因为他觉得工作太多，想要有些东西能帮他处理繁琐的工作。\n\
  \n在学习 `Linux` 和 `Unix` 的乐趣之前，John 在美国空军服役九年担任通信系统操作员，并在德国、德克萨斯和英国工作过。离开军队后，他住在内布拉斯加州和宾夕法尼亚州，现在回到了英国。\n\
