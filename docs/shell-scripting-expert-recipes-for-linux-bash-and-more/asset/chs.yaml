  \ is $i\" \ndone \necho \necho \"Looping through Dollar At with double quotes\"\
  \ \nfor i in \"$@\" \ndo \n  echo \"Parameter is $i\" \ndone $ ./star.sh one \"\
  two   three\" four        five\n```\n\n↓未保留空格\n```\n Dollar Star is one two three\
  \ four five\n```\n\n↓引号保留了空格\n```\n Dollar Star in double quotes is one two   three\
  \ four five\n```\n\n↓显然未保留空格\n```\n Dollar At is one two three four five\n```\n\n\
  ↓引号保留了空格\n```\n Dollar At in double quotes is one two   three four five\nLooping\
  \ through Dollar Star\n```\n\n↓使用 `$*` 且无引号时，每个单词都被视为一个独立的单词\n```\n Parameter is\
  \ one\nParameter is two\nParameter is three\nParameter is four\nParameter is five\n\
