  \ 项目贡献给世界，感谢 `GPL` 和 `Free Software Foundation`，并感谢他毕生致力于推广软件自由。世界需要理想主义者，而 Stallman\
  \ 就是其中之一。我相信，历史将证明 Stallman 是正确的，分享开发成果比隐藏它们更好。这是科学传统，如果计算机科学要被视为一项严肃的科学事业，这种传统也必须应用于它。\n\
  \n感谢所有的 `GNU` 程序员和 Linux 内核开发者，他们将所有这些自由软件组件组合成各种不同的可用免费操作系统。还要感谢其他为各种雇主根据各种许可证编写代码的\
  \ `Unix` 开发者。\n\n最后，感谢 Bill Joy、Vinod Khosla、Andy Bechtolsheim 和 Scott McNealy 感谢\
  \ Sun Microsystems 和 `Solaris` 操作系统。还要感谢 Jonathan Schwartz 让公司的大部分软件开源（甚至购买 `StarDivision`\
  \ 以发布 `OpenOffice.org`），以及在许多业界尚未理解这种模型时 `JDS` 对 `GNOME` 项目的贡献。愿 Sun Microsystems\
  \ 安。\n\n# 引言\n\n人生苦短，学艺精长。\n\n—  Chaucer\n\nshell 是每一个 `Unix` 和 `Linux` 系统的标准接口；用户和管理员都有\
  \ shell 的经验，将命令组合成 shell 脚本是一个自然的演进。然而，这只是冰山一角。\n\nshell 实际上是一种完整的编程语言，拥有变量和函数，以及更高级的结构，如数组（包括关联数组）。由于与内核紧密相连，它的语法中内置了原生的文件\
  \ I/O 原语，以及进程和作业控制。`Unix` 最闻名的所有主要特性在 shell 中可用，并供 shell 脚本使用。\n\n这本书的目的是为了最大限地发挥\
  \ shell 的作用，无论背景和经验如何，它都应该让任何读者感到惊喜。本书面向中级和有经验的 `Unix` 和 `Linux` 管理员，也可能对其他高级用户产生兴趣。本书假设你至少熟悉一种类\
  \ Unix 系统（Unix-like system），并且可能已经写过一些 shell 脚本，但想要提高你的技艺。\n\n经验丰富的读者可能想跳过前两章；极其丰富的读者可能可能想跳过前四章，尽管其中很可能包含许多值得回顾的细节。\n\
  \n# 本书内容\n\n本书涉及 shell 脚本编写，重点关注 `Bourne shell` 和 `POSIX` 兼容性，但广泛涵盖了更近的进展，特别是 `Bash`\
  \ shell，它在 `GNU/Linux` 操作系统中几乎是通用的，也包含在大多数商业 Unix 中。`KornShell` 在大多数此类操作系统（无论是闭源还是开源）中也可用。\n\
  \n# 本书结构\n\n本书分为四部分：第一部分涵盖 shell 的基础特性和语法；第二部分介绍 shell 脚本可以利用工具；第三部分包含了涵盖广泛主题的配方（recipes）。最后，第四部分包含参考信息。\n\
  \n第一部分是四个部分中最长的；它研究了变量、通配符、条件执行、循环、函数、数组和进程。理论部分通过大量的实际示例来展示所涵盖的内容。其中许多脚本非常简单，因为它们只关注\
  \ shell 的某一方面。\n\n第二部分涵盖了 shell 外部的使 shell 脚本更有用的工具；这些被分为文本、文件和通用系统管理的三个章节。第二部分的示例在性质上更具现实性，比第一部分的稍长且复杂。\n\
  \n第三部分是一系列 shell 脚本配方。希望你发现这些配方本身是有用的，但它们被选中也是为了演示书中前两部分所涵盖的主题。它们还展示了在现实 shell 脚本中可以许多不同方法和技术。这部分处理了真实和实际的问题，而不会为了解释某一个特定点而做出妥协。这些脚本完成了必要的工作：编写\
  \ `init` 脚本、编写彩色实时交互游戏、解析 `HTML`、控制进程、将 `at` 脚本翻译成多种语言、编写 `CGI` 脚本、创建图形报告等。\n\n\
  最后，第四部分列了一些进一步阅读的链接以及术语表。\n\n# 使用本书的准备\n\n第 2 章介绍了用于获取自己的 shell 环境并以适合你的方式对其进行设置的一些选项。在活动系统上进行实验是一个选项，但不是好选项。设置测试账户更好，运行专门的测试机或虚拟机则更好。虚拟化软件（如\
  \ `VirtualBox` 或 `VMWare Player`）免费提供，并提供了一种无风险的方法来测试即使是最高的 root 脚本。\n\n## 约定\n\n\
  为了帮助你从文本中获得最大收益并跟踪进度，我们在全书中使用了一些约定。\n\n- 我们这样显示命令：`echo hello`。\n- 我们这样显示系统输出和提示符：`hello`。\n\
  - 我们在文中这样显示文件名和代码：`/etc/hosts`。\n\n我们以两种不同的方式展示代码：\n\n```\n 使用粗体等宽字体强调用户输入的文本。\n\
  使用不加粗的等宽字体表示代码内容和系统输出。\n```\n\n## 源代码\n\n在你完成书中的示例时，你可以选择手动输入所有代码，也可以使用随书附的源代码文件。书中使用的所有源代码都可以在\
