  \ `Book Errata` 链接。在该页面，你可以查看 Wrox 编辑人员已针对该书提交并发布的所有勘误。在 [www.wrox.com/misc-pages/booklist.shtml](http://www.wrox.com/misc-pages/booklist.shtml)\
  \ 也可以找到包含每本书勘误链接的完整书籍列表。\n\n如果您在 `Book Errata` 页面上没有发现“您的”错误，请访问 [www.wrox.com/contact/techsupport.shtml](http://www.wrox.com/contact/techsupport.shtml)\
  \ 并填写表单向我们发送您发现的错误。我们将检查这些信息，并在适当的情况下在书籍勘误页面发布消息，并在书籍的后续版本中修复该问题。\n\n## p2p.wrox.com\n\
  \n如需与作者和同行讨论，请加入 [p2p.wrox.com](http://p2p.wrox.com) P2P 论坛。论坛是一个基于 Web 的系统，让您发布与\
  \ Wrox 书籍及相关技术有关的消息并与其他读者和其他技术用户进行互动。论坛提供订阅功能，当论坛发布新贴子时，可以通过电子邮件向您发送您选择感兴趣的话题。Wrox\
  \ 作者、编辑、其他行业专家以及您的读者都活跃在这些论坛中。\n\n在 [p2p.wrox.com](http://p2p.wrox.com)，您将发现许多不同的论坛，它们不仅在您阅读本书时有所帮助，也能帮助您开发自己的应用程序。要加入论坛，请按照以下步骤操作：\n\
  \n1. 访问 [p2p.wrox.com](http://p2p.wrox.com) 并点击 `Register` 链接。\n2. 阅读使用条款并点击 `Agree`。\n\
  3. 填写加入所需的强制信息以及您希望提供的任何可选信息，并点击 `Submit`。\n4. 您将收到一封电子邮件，其中说明了如何验证账户并完成加入流程的信息。\n\
  \n![note.ai](img/note_fmt.gif)\n\n您可以在不加入 P2P 的情况下阅读论坛消息，但若要发布自己的消息，则必须加入。\n\n一旦加入，您就可以发布新消息并回复其他用户发布的消息。您可以随时在\
  \ Web 上阅读消息。如果您希望将特定论坛的新消息通过电子邮件发送给您，请点击论坛列表中论坛名称旁的 `Subscribe to this Forum` 图标。\n\
  \n关于如何使用 Wrox P2P 的更多信息，请务必阅读 P2P FAQ，以获取有关论坛软件工作原理以及许多针对 P2P 和 Wrox 书籍常见问题的解答。要阅读\
  \ FAQ，请点击任何 P2P 页面上的 `FAQ` 链接。\n\n![024485_wroxbob_ad_bw.pdf](img/024485_wroxbob_ad.gif)![fic_ad.jpg](img/fic_ad.jpg)\n\
