  \necho \"GLOBALVAR is $GLOBALVAR\"\necho \"myvar is $myvar\"\necho \"uniquevar is\
  \ $uniquevar\"\n$\n```\n\n#### scope.sh\n\n首先，`GLOBALVAR` 是在调用 `the_function` 时传递给该函数的环境的一部分，因此\
  \ `the_function` 知道 `GLOBALVAR` 的初始值是符合预期的。由于它们都在同一个 shell 中，`GLOBALVAR` 会像任何全局变量一样增加，在随后的调用\
  \ `the_function` 时，`GLOBALVAR` 会再次增加。\n\n其次，`myvar` 与 `GLOBALVAR` 不同，因为它是在 `the_function`\
  \ 内部定义的。这可能会向语言暗示此处的 `myvar` 与其他地方 `myvar` 不同。然而，在 shell 中情况并非如此；如果 `myvar` 被赋予了一个值，那么该变量就是该运行进程（在本例中为\
  \ shell）的值，无论该进程认为自己是处于函数内部还是任何其他状态；这是一个简单的 Unix 系统变量，它没有函数或作用域的概念。\n\n最后，`uniquevar`\
  \ 有最明显的问题，因为它从未被定义过。这没关系；shell 将其视为空字符串，在第一次被引用时，它为 `uniquevar='expr $uniquevar\
  \ + 1'`。这被传递给 `expr  + 1`，它非常乐意将其求值为 1。从现在起 `uniquevar` 为 1，下次被引用时它将增加到 2，依此类推。当在主脚本结束时\
  \ `echo` 时，`uniquevar` 在函数外部仍保留了它的值。\n\n```\n./scope.sh a b\nThis is the main script.\n\
  GLOBALVAR is 1\nmyvar is 500\nI was passed 3 arguments: \"a\", \"b\", \"c\".\n******************************\n\
