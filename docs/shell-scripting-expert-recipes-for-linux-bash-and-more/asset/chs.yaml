  \ with 3 2 1 ...\n  This is the_function.  I was passed 3 arguments: \"3\", \"2\"\
  , \"1\".\n    GLOBALVAR started as 2;\n    GLOBALVAR is now 3\n    myvar started\
  \ as 100;\n    myvar is now 101\n    uniquevar started as 1\n    uniquevar is 2\n\
  \  Leaving the_function.\nGLOBALVAR is 3\nmyvar is 500\nCalling the_function with\
  \ $1 $2 $3 ...\n  This is the_function.  I was passed 3 arguments: \"3\", \"2\"\
  , \"1\".\n    GLOBALVAR started as 3;\n    GLOBALVAR is now 4\n    myvar started\
  \ as 100;\n    myvar is now 101\n    uniquevar started as 2\n    uniquevar is 3\n\
  \  Leaving the_function.\nGLOBALVAR is 4\nmyvar is 500\nAll Done.\nGLOBALVAR is\
  \ 4\nmyvar is 500\nuniquevar is 3\n```\n\n函数传统只返回一个值。壳（shell）的情况并不那么简单，因此某些副作用偶尔会让人感到惊讶。由于只有一个\
  \ shell 在执行该脚本，因此函数内部的任何变量在函数外部仍会继续存在。此脚本有三个变量：`GLOBALVAR`、`myvar` 和 `uniquevar`。在某些语言中，在类似的情况下，`GLOBALVAR`\
  \ 会被视为全局变量，因为它在函数本身之外定义。在某些语言中，函数内部的 `myvar` 将是局部的并与函数外部的 `myvar` 变量分开。在许多语言中，`uniquevar`\
  \ 在第一次被调用时会失败，因为在之前它从未被定义过。在 shell 中，这是没有问题的。`uniquevar` 仍然在函数外部被看到，因为它在函数之外从未存在过。\n\
  \n这些偶尔发生冲突但被广泛理解的标准在许多编程语言中都是通用的。shell 略有不同，因为它不是一种严格的编程语言。在运行以下脚本之前，尝试预测它的结果，并准备好解释为什么结果会如你所预测的那样。你可以参考表\
