  -   **封面图片**: © mika makkonen / istockphoto.com\n\n## 致谢\n没有 Wiley 同事们提供的帮助（以及截止日期），这本书就无法完成。过程中的每一步都是一次新的体验，Christina\
  \ Haviland 在每一步中都是我极出色的导师。John Kennedy 在整个过程中提供了反馈和鼓励，Nancy Rapoport 展现了对细节的敏锐洞察力。\n\
  \n从个人角度来看，我想感谢 20 世纪 80 年代 Acorn、Sinclair 以及其他公司的人，他们为孩子们提供了可以学习真实编程的廉价计算机。还要感谢\
