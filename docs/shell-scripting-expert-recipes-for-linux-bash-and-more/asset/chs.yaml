  \ \"1\", \"2\", \"3\".\n    GLOBALVAR started as 1;\n    GLOBALVAR is now 2\n  \
  \  myvar started as 100;\n    myvar is now 101\nuniquevar started as\nuniquevar\
  \ is 1\n  Leaving the_function.\nGLOBALVAR is 2\nmyvar is 500\nCalling the_function\
  \ with 3 2 1 ...\n  This is the_function. I was passed 3 arguments: \"3\", \"2\"\
  , \"1\".\n    GLOBALVAR started as 2;\n    GLOBALVAR is now 3\n    myvar started\
  \ as 100;\n    myvar is now 101\nuniquevar started as\nuniquevar is 2\n  Leaving\
  \ the_function.\nGLOBALVAR is 3\nmyvar is 500\nCalling the_function with a b ...\n\
  \  This is the_function. I was passed 3 arguments: \"a\", \"b\", \"c\".\n    GLOBALVAR\
  \ started as 3;\n    GLOBALVAR is now 4\n    myvar started as 100;\n    myvar is\
  \ now 101\nuniquevar started as 2\nuniquevar is 3\n  Leaving the_function.\nGLOBALVAR\
  \ is 4\nmyvar is 500\nAll Done.\nGLOBALVAR is 4\nmyvar is 500\nuniquevar is 3\n\
  $\n```\n\n`local` 关键字的引入使得 `bash` 成为编写复杂函数和库的实用 shell。应该清楚地理解函数可以更改任何变量值的这种标准行为，否则调试可能会变得困难。函数是重复使用代码的一种有用方法，而无需重新编写这些代码，也不需要将每个代码块写成独立的\
  \ shell 脚本来调用。当将相关函数组合成库时，它们会变得更有用。\n\n### 库\n\nshell 并没有像 `Perl` 和 `C` 那样真正的库的概念。在\
  \ `C` 中，你可以通过包含头文件并链接库来引入 `Math` 库（简单地称为 `-m`，因此在后续的 `gcc` 调用中为 `-lm`）。随后程序就可以使用包括\
  \ `cos()`、`sin()` 和 `tan()` 在内的函数。\n\n![download.eps](img/download_fmt.gif)\n\n\
  ```\n $ cat math.c\n#include <stdio.h>\n#include <math.h>\nint main(int argc, char*argv[])\n\
  {\n  int arg=atoi(argv[1]);\n  printf(\"cos(%d)=%.8f\\n\", arg, cos(arg));\n  printf(\"\
  sin(%d)=%.8f\\n\", arg, sin(arg));\n  printf(\"tan(%d)=%.8f\\n\", arg, tan(arg));\n\
  \  return 0;\n}\n$ gcc -lm -o math math.c\n$ ./math 30\ncos(30)=0.15425145\nsin(30)=-0.98803162\n\
  tan(30)=-6.40533120\n$ ./math 60\ncos(60)=-0.95241298\nsin(60)=-0.30481062\ntan(60)=0.32004039\n\
  $ ./math 90\ncos(90)=-0.44807362\nsin(90)=0.89399666\ntan(90)=-1.99520041\n$\n```\n\
  \nmath.c\n\n![warning.ai](img/warning_fmt.gif)\n\n此示例 `C` 代码没有对其输入进行任何完整性测试，在这里是为了展示在\
  \ `C` 语言中如何链接到库。此外，如果它的结果看起来不对，那是因为它是以弧度而不是角度运行的。\n\nshell 有几种方法可以定义标准设置——别名、变量和函数，它们创建了一个几乎与一组库无异的环境。当你以交互式方式调用\
  \ shell 时，它会读取 `~/.profile`，以及（取决于使用的具体 shell）`~/.bashrc`、`~/.kshrc` 或类似文件。使用相同的方法，你的脚本可以调用（`source`）其他文件来获取其内容，而无需运行任何实际代码。这些文件中定义的函数将供你的脚本使用。\n\
  \n![note.ai](img/note_fmt.gif)\n\n就像 `~/.bashrc` 定义了内容但通常不会实际执行任何代码一样，库在执行时除了读取其包含的函数定义外，应该什么都不做。如果你的\
  \ shell 脚本可以读取它自己的变量和——最有用的函数，那么它就可以从自定义环境中获益，并获得本章开头提到的模块化优势。\n\n将此推向逻辑结论，shell\
  \ 脚本函数库可以在你的环境中定义并供所有 shell 脚本和交互会话使用，或者仅作为特定脚本的一组库。\n\n### 创建和访问库\n\n创建一个库与创建一个\
  \ shell 脚本相同，但没有真正的起点——你对库所做的只是定义函数。实际调用将放在主 shell 脚本中。\n\n![note.ai](img/note_fmt.gif)\n\
  \n看起来显而易见库必须被标记为可执行，但它并不需要。要在 shell 中引入库，使用 `source` 或 `.` 命令是很有帮助的。这允许库中定义的函数供你的脚本使用。\n\
  \n\n\n\n一种解决方案是让 `calling.sh` 源（source）两个库；这样，在调用 `lib2` 时，它就已经知道了 `anotherfunc`。这种方法行得通；只要没有一个库文件去源于另一个，并且调用脚本源了任何所需的库文件，整个环境就能被正确设置。这意味着\
  \ `calling.sh` 必须知道库结构的任何任何变化。这可以通过添加一个元库文件（此处命名为 `lib`）来轻松解决：\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\n $ cat calling.sh\n#!/bin/sh\n. ./lib\nfunc1\necho \"I also get func2 for\
  \ free...\"\nfunc2\n$ cat lib\n. ./lib1\n. ./lib2\n```\n\nlib\n\n```\n $ ./calling.sh\n\
  func1\nfunc2\nMore stuff here.\nI also get func2 for free...\nfunc2\nMore stuff\
  \ here.\n$\n```\n\n管理这种相互依赖更灵活的方法是模拟 C 语言的头文件结构，它具有非常相似的问题。在 C 语言中，如 `stdio.h` 的头文件开头会检查\
  \ `_STDIO_H` 是否已经定义。如果已定义，说明 `stdio.h` 已经包含。如果没有定义，则继续声明 `stdio.h` 能够提供的所有内容。\n\n\
  ```\n #ifndef _STDIO_H\n # define _STDIO_H       1\n   ... stdio declarations go\
  \ here ...\n#endif\n```\n\nShell 可以执行类似的操作，甚至可以处理得更整洁一点。通过定义一个与库同名的变量，Shell 可以发现该库是否已经在当前环境中被源过。这样一来，如果多个库都尝试相互引用，Shell\
  \ 就不会陷入死循环。\n\n![note.ai](img/note_fmt.gif)\n\n注意，这个示例也模拟了 C 语言的约定：系统（或库）变量名以下划线开头。以下划线开头的变量与任何其他变量在技术上没有区别，但它让该变量作为系统变量或元变量脱颖而出，不会与存储用户数据的变量混淆。当这些示例库命名为\
  \ `lib1` 和 `lib2` 时，这看起来可能不是一个问题。如果脚本处理库存控制，一个库可能被命名为 `stock`，另一个库可能被命名为 `store`。这些也很可能是数据变量的候选者，因此通过遵循这一约定，你可以避免元数据变量\
  \ `$_stock` 和 `$_store` 与实际数据变量 `$stock` 和 `$store` 发生冲突。\n\n```\n $ cat calling.sh\n\
  #!/bin/sh\n. ./lib1\nfunc1\necho \"I also get func2 for free...\"\nfunc2\n$ cat\
  \ lib1\n_lib1=1\n[ -z \"$_lib2\" ] && . ./lib2\nfunc1()\n{\n  echo func1\n  func2\n\
  }\nanotherfunc()\n{\n  echo More stuff here.\n}\n$ cat lib2\n_lib2=1\n[ -z \"$_lib1\"\
  \ ] && . ./lib1\nfunc2()\n{\n  echo func2\n  anotherfunc\n}\n$ ./calling.sh\nfunc1\n\
  func2\nMore stuff here.\nI also get func2 for free...\nfunc2\nMore stuff here.\n\
  $\n```\n\ncalling.sh\n\n这是一个解决该问题的更健壮的解决方案。如果可以使用单个库文件，或者将库之间的依赖关系降到最低，那是 preferred（首选的）。如果不可不可，通过这种方式设置标记变量可以将依赖关系控制在范围内。\n\
  \n## 网络配置库\n\n现在你已经看到了库是如何工作的，让我们来制定一个更稳健的脚本。这个脚本包含一个用于配置新网络接口的中心脚本。它依赖于一个库，该库根据其所运行的相应操作系统决定如何完成此任务。注意，只要中心脚本保持足够的通用性，这种结构就可以大为扩展，生成一个可扩展、可维护的跨平台\
  \ Shell 脚本库。这个库包含四个文件和一个 Shell 脚本：\n\n* `network.sh`\n* `definitions`\n* `debian-network`\n\
  * `redhat-network`\n* `solaris-network`\n\n前两个文件定义了库的结构：通用定义在 `definitions` 文件中，`network.sh`\
  \ 是顶级脚本。\n\n![download.eps](img/download_fmt.gif)\n\n```\n $ cat definitions\n#\
  \ Various conditions. It is better to\n# provide generic definitions so that\n#\
  \ individual libraries are much clearer.\n_WRONG_PLATFORM=1\n_NO_IP=2\n_NO_CONFIG=3\n\
  # Success is a variant on failure-best to define too.\nSUCCESS=0\n$\n```\n\n```\n\
  \ $ cat network.sh\n#!/bin/bash\n[ -z \"$definitions\" ] && . definitions\n[ -f\
  \ /etc/redhat-release ] && . ./redhat-network\n[ -f /etc/debian_version ] && . ./debian-network\n\
  [ 'uname' == \"SunOS\" ] && . ./solaris-network\nfor nic in *\ndo\n  thisip='getaddr\
  \ $nic'\n  case $? in\n    $SUCCESS) echo \"The IP configured for $nic is $thisip\"\
  \ ;;\n    $_WRONG_PLATFORM) echo \"This does not seem to be running the expected\
  \ platfo\" ;;\n    $_NO_IP) echo \"No Address defined for $nic\" ;;\n    $_NO_CONFIG)\
  \ echo \"No configuration for $nic\" ;;\n  esac\ndone\n$\n```\n\nnetwork.sh\n\n\
  然后三个库文件，每个文件都包含 `getip` 的定义，但只有相应的系统上会有对应的实例。每个系统对 `getip` 的实现完全不同，但对于库来说并不重要。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```\n $ cat redhat-network\n[ -z \"$definitions\"\
  \ ] && . definitions\n# RedHat-specific getip() definition\ngetip()\n{\n  [ -d /etc/network-scripts\
  \ ] || return _WRONG_PLATFORM\n  [ -f /etc/network-scripts/ifcfg-$1 ]; then\n  \
  \  unset IPADDR\n    . /etc/network-scripts/ifcfg-$1\n    [ -z \"$IPADDR\" ]; then\n\
  \      return $_NO_IP\n    else\n      echo $IPADDR\n    fi\n  else\n    return\
  \ $_NO_CONFIG\n  fi\n  # Not needed\n  return $SUCCESS\n}\n$\n```redhat-network\n\
  \n```\n $ cat debian-network\n[ -z \"$definitions\" ] && . definitions\n# Debian-specific\
  \ getip() definition\ngetip()\n{\n  [ -f /etc/network/interfaces ] || return _WRONG_PLATFORM\n\
  \  found=0\n  while read keyword argument\n  do\n    # Debug: $keyword $argument\n\
  \    if [ \"$keyword\" == \"iface\" ]; then\n      if [ \"$found\" -eq \"1\" ];\
  \ then\n        # we already found ours, but no address found.\n        return $_NO_IP\n\
  \      else\n        if [ \"$argument\" == \"$1\" ]; then\n          found=1\n \
  \       fi\n      fi\n    fi\n    if [ \"$found\" -eq \"1\" ]; then\n      if [\
  \ \"$keyword\" == \"address\" ]; then\n        # Found the address of this interface.\n\
  \        echo $argument\n        return $SUCCESS\n      fi\n    fi\n  done < /etc/network/interfaces\n\
  \  if [ \"$found\" -eq \"0\" ]; then\n    return $_NO_CONFIG\n  fi\n  # Not needed\n\
  \  return $SUCCESS\n}\n$\n```debian-network\n\n```\n $ cat solaris-network\n[ -z\
  \ \"$definitions\" ] && . definitions\n# Solaris-specific getip() definition\ngetip()\n\
  {\n  uname | grep SunOS > /dev/null || return _WRONG_PLATFORM\n  [ -f /etc/hostname.$1\
  \ ] || return $_NO_CONFIG\n  [ ! -s /etc/hostname.$1 ] && return $_NO_IP\n  getent\
  \ hosts 'head -1 /etc/hostname.$1}' | cut -d\"/\" -f1 | \\\n    awk '{ print $1\
  \ }'' | cut -f1 || cat /etc/hostname.$1\n  return $SUCCESS\n}\n$\n```solaris-network\n\
  \n主脚本随后可以从容地调用库中的函数，而无需了解操作系统之间的差异，以及库处理这些差异的方式。它只需要调用 `getip` 并获取它需要的结果。在 Debian\
  \ 系统上，如果定义了 eth0，结果所示：\n\n```\n debian# ./network.sh eth0 eth1 bond0 bond1 eri0\
  \ qfe0 wlan0\nThe IP configured for eth0 is 192.168.1.13\nNo configuration found\
  \ for eth1\nNo configuration found for bond0\nNo configuration found for bond1\n\
  No configuration found for eri0\nNo configuration found for qfe0\nNo configuration\
  \ found for wlan0\ndebian#\n```\n\n\n\n\n\n```\nredhat# ./network.sh eth0 eth1 bond0\
  \ bond1 eri0 qfe0 wlan0\nNo IP Address defined for eth0\nThe IP Address configured\
  \ for eth1 is 192.168.44.107\nThe IP Address configured for bond0 is 192.168.81.64\n\
  No configuration found for bond1\nNo configuration found for eri0\nNo configuration\
  \ found for qfe0\nNo configuration found for wlan0\nredhat#\n```\n\n在配置了 `eri0`\
  \ 和 `qfe0` 的 Solaris 系统上，脚本的运行如下：\n\n```\n solaris# ./network.sh eth0 eth1 bond0\
  \ bond1 eri0 qfe0 wlan0\nNo configuration found for eth0\nNo configuration found\
  \ for eth1\nNo configuration found for bond0\nNo configuration found for bond1\n\
  The IP Address configured for eri0 is 192.168.101.3\nThe IP Address configured for\
  \ qfe0 is 192.168.190.45\nNo configuration found for wlan0\nsolaris#\n```\n\n这使得接口变得简单——可以调用\
  \ `getipaddr`，而无需调用脚本了解其任何实现细节。最后的润色是将 `network.sh` 本身转换为一个库，这样调用脚本甚至不需要知晓 `redhat-network`、`debian-network`\
  \ 和 `solaris-network` 库；它只需要引入网络库并调用 `shownetwork` 来显示网络信息。`$*` 在函数内部的工作方式意味着，要将其从脚本迁移到函数（或反之），不需要对代码进行更改。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```\n $ cat network\n[ -f /etc/redhat-release\
  \ ] && . ./redhat-network\n[ -f /etc/debian_version ] && . ./debian-network\n[ 'uname'\
  \ == \"SunOS\" ] && . ./solaris-network\nshownetwork()\n{\n  for thisnic in $*\n\
  \  do\n    thisip='getipaddr $thisnic'\n    case $? in\n      $SUCCESS) echo \"\
  The IP Address configured for $thisnic is $thisip\" ;;\n      $_WRONG_PLATFORM)\
  \ echo \"This does not seem to be running \" \\\n             \"on the expected\
  \ platform\" ;;\n      $_NO_IP) echo \"No IP Address defined for $thisnic\" ;;\n\
  \      $_NO_CONFIG) echo \"No configuration found for $thisnic\" ;;\n    esac\n\
  \  done\n}\n$\n```\n\nnetwork\n\n```\n $ cat client.sh\n#!/bin/bash\n. ./network\n\
  shownetwork $@\n```\n\nclient.sh\n\n```\n $ ./client.sh eth0\nThe IP Address configured\
  \ for eth0 is 192.168.1.13\n$\n```\n\n# 使用库\n\n库是构建时非常有用的工具；许多系统管理员会收集自己的脚本、函数和别名（aliases）工具箱，这使得日常工作变得更容易、更高效。在更复杂的脚本中使用特定任务的库也可以让开发、调试和维护变得简单得多。在团队之间共享库是知识共享的一种有用形式，尽管在实践中大多数管理员倾向于独立维护自己的工具集，而由团队维护一套更健壮的共享工具集。这有助于使标准格式化、加速常见任务的交付，并确保交付的一致性。\n\
  \n# Getopts\n\n函数、脚本和其他程序都以相同的方式传递参数——`$1` 是程序、脚本或函数的第一个参数。调用脚本很难判断它调用的是外部程序、脚本还是函数。因此，让函数的行为非常像脚本是有意义的。\n\
  \n这个 `mkfile` 脚本是 `dd` 的封装，它提供了与 Unix 中 `mkfile` 二进制文件类似的语法。它在主脚本中使用 `getopts` 来解析参数，这展示了\
  \ `getopts` 的基本用法。该脚本有效的选项有：\n\n* `-i infile`（复制输入的文件名；默认值为 `/dev/zero`）\n* `-b\
  \ blocksize`（每个读写数据块的大小；默认值为 `512KB`）\n* `-q` 让脚本静默运行\n* `-?` 显示用法信息\n\n对于任何其他输入，将显示用法信息。`-i`\
  \ 和 `-b` 选项需要参数；`-q` 和 `-?` 不需要。这些内容都通过 `'i:b:q?'` 语句非常简洁地表达给 `getopts`。冒号（`:`）表示必需参数，因此\
  \ `i:` 和 `b:` 显示 `-i` 和 `-b` 需要参数，如果未提供则视为错误。另外两个字符后面没有冒号，因此是独立的标志（flags）。当传递参数时，其值会被放入\
  \ `OPTARG` 中。\n\n![note.ai](img/note_fmt.gif)\n\n虽然大多数 shell 脚本的扩展名为 `.sh`，但 `mkfile`\
  \ 是一个已存在的二进制文件，该脚本为其提供了功能。因此，在这种情况下，脚本与原始文件同名是合理的。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\n $ cat mkfile\n#!/bin/bash\n# wrapper for dd to act like Solaris mkfile utility.\n\
  function usage()\n{\n  echo \"Usage: mkfile [-i infile] [-q] [-b blocksize] size[k|m|g]\
  \ filename\"\n  echo \"Blocksize is 52 bytes by default.\"\n  exit 2\n}\nfunction\
  \ humanreadable ()\n{\n  multiplier=1\n  case $1 in\n    *b) multiplier=1 ;;\n \
  \   *k) multiplier=1024 ;;\n    *m) multiplier=1048576 ;;\n    *g) multiplier=1073741824\
  \ ;;\n  esac\n  numeric='echo $1 | tr -d 'k' | tr -d 'm' | tr -d 'g' | tr -d 'b''\n\
  \  expr $numeric \\* $multiplier\n}\n# mkfile uses 512 byte blocks by default -\
  \ so I.\nbs=512\nquiet=0\nINFILE=/dev/zero\nwhile getopts 'i:b:q?' argv\ndo\n  case\
  \ $argv in\n    i) INFILE=$OPTARG ;;\n    b) bs=$OPTARG ;;\n    q) quiet=1 ;;\n\
  \    \\?) usage ;;\n  esac\ndone\nfor i in 'seq 2 ${OPTIND}'\ndo\n  shift\ndone\n\
  if [ -z \"$1\" ]; then\n  echo \"ERROR: No size specified\"\nfi\nif [ -z \"$2\"\
  \ ]; then\n  echo \"ERROR: No filename specified\"\nfi\nif [ \"$#\" -ne \"2\" ];\
  \ then\n  usage\nfi\nSIZE='humanreadable $1'\nFILENAME=\"$2\"\nBS='humanreadable\
  \ $bs'\nCOUNT='expr $SIZE / $BS'\nCHECK='expr $COUNT \\* $BS'\nif [ \"$CHECK\" -ne\
  \ \"$SIZE\" ]; then\n  echo \"Warning: Due to the blocksize requested, the file\
  \ created will be\"\\\n       \"'expr $COUNT \\* $BS' bytes and not $SIZE bytes\"\
  \nfi\necho -en \"Creating $SIZE byte file $FILENAME....\"\ndd if=\"$INFILE\" bs=$BS\
  \ count=$COUNT of=\"$FILENAME\" 2>/dev/null\nddresult=$?\nif [ \"$quiet\" -ne \"\
  1\" ]; then\n  if [ \"$ddresult\" -eq \"0\" ]; then\n    echo \"Finished:\"\n  else\n\
  \    echo \"An error occurred.\"\n  fi\nfi\n```\n\n\n\n\n\n这种简单的更改可以让 Shell 脚本更加高效。由于选项被放入\
  \ `OPTARG` 变量中，因此可以根据缺失的值提供自定义的错误信息。这里使用了嵌套的 `case` 语句来处理 `OPTARG` 的新值。请注意，像问号一样，冒号必须使用反斜杠进行转义，或者放在引号中。这里展示了两种样式：带反斜杠的问号和带引号的冒号：\n\
  \n![download.eps](img/download_fmt.gif)\n\n```bash\nwhile getopts ':i:b:q?' argv\n\
  do\n  case $argv in\n        i) INFILE=$OPTARG      ;;\n        b) bs=$OPTARG  \
  \        ;;\n        q) quiet=1             ;;\n        \\?) usage             \
  \   ;;\n        \":\")\n          case $OPTARG in\n            i) echo \"Input file\
  \ not specified.\"\n              echo \"Please specify the input file when using\
  \ the -i option.\"\n              echo\n              usage\n              ;;\n\
  \            b) echo \"Block size not specified.\"\n              echo \"Please\
  \ specify the block size when using the -b option.\"\n              echo\n     \
  \         usage\n              ;;\n            *) echo \"An unexpected parsing error\
  \ occurred.\"\n              echo\n              usage\n              ;;\n     \
  \     esac\n        exit 2\n  esac\ndone\n```\n\n`mkfile2`\n\n```bash\n$ ./mkfile\
  \ -i\n./mkfile: option requires an argument -- i\nUsage: mkfile [ -i infile ] [\
  \ -q ] [ -b blocksize ] size[k|m|g] filename\nBlocksize is 512 bytes by default.\n\
  $ ./mkfile2 -i\nInput file not specified.\nPlease specify the input file when using\
  \ the -i option.\nUsage: mkfile [ -i infile ] [ -q ] [ -b blocksize ] size[k|m|g]\
  \ filename\nBlocksize is 512 bytes by default.\n$\n```\n\n### 在函数中使用 Getopts\n\n\
  `getopts` 也可以在函数内部使用；该函数可以在摄度和华氏度之间转换温度，但接受各种选项来控制其工作方式。由于 `getopts` 在处理参数时会增加 `OPTIND`\
  \ 变量，因此每次调用该函数时都必须重置它。`OPTIND` 是 `getopts` 用于跟踪当前索引的计数器。在仅解析一次参数时这通常不是问题，但由于此函数被调用多次，因此必须重置\
  \ `OPTIND`。\n\n![download.eps](img/download_fmt.gif)\n\n```bash\n$ cat temperature.sh\n\
  #!/bin/bash\nconvert()\n{\n  # 设置默认值\n  quiet=0\n  scale=0\n  error=0\n  source=centigrade\n\
  \  # 在 getopts 之间重置 optind\n  OPTIND=1\n  while getopts 'c:f:s:q?' opt\n  do\n \
  \   case \"$opt\" in\n      c) centigrade=$OPTARG\n        source=centigrade\n \
  \       ;;\n      f) fahrenheit=$OPTARG\n        source=fahrenheit\n        ;;\n\
  \      s) scale=$OPTARG\n        ;;\n      q) quiet=1\n        ;;\n      *) echo\
  \ \"Usage: [-c | -f] temperature [-s | -q]\"\n        error=1\n        return 0\n\
  \        ;;\n    esac\n  if [ \"$quiet\" -eq \"1\" ] && [ \"$scale\" != \"0\" ];\
  \ then\n    echo \"Error: Quiet and Scale are mutually exclusive.\"\n    echo \"\
  Quiet can return whole numbers between 0 and 255.\"\n    exit 1\n  fi\n  case $source\
  \ in\n    centigrade)\n      fahrenheit=$(echo scale=$scale; $centigrade * 9 / 5\
  \ + 32 | bc)\n      answer=\"$centigrade Centigrade is $fahrenheit Fahrenheit\"\n\
  \      result=$fahrenheit\n      ;;\n    fahrenheit)\n      centigrade=$(echo scale=$scale;\
  \ ($fahrenheit - 32) * 5 / 9 | bc)\n      answer=\"$fahrenheit Fahrenheit is $centigrade\
  \ Centigrade\"\n      result=$centigrade\n      ;;\n    *)\n      echo \"An error\
  \ occurred.\"\n      exit 0\n      ;;\n  esac\n  if [ \"$quiet\" -eq \"1\" ]; then\n\
  \    if [ \"$result\" -gt \"255\" ] || [ \"$result\" -lt \"0\" ]; then\n      #\
  \ scale 已经经过测试；它必须是一个整数。\n      echo \"An error occurred.\"\n      echo \"Can't\
  \ return values outside the range 0-255 when quiet.\"\n      error=1\n      return\
  \ 0\n    fi\n    return $result\n  else\n    echo $answer\n  fi\n}\n# 主脚本从这里开始\n\
  echo \"First by return code...\"\nconvert -q -c $1\nresult=$?\nif [ \"$error\" -eq\
  \ \"0\" ]; then\n  echo \"${1}C is ${result}F.\"\nfi\nconvert -f $1 -q\nresult=$?\n\
  if [ \"$error\" -eq \"0\" ]; then\n  echo \"${1}F is ${result}C.\"\nfi\n```\n\n\n\
  \n\n有多种不同的方法可以给数组赋值。有些方法是同类主题的变体，但主要有三种赋值方式，在这里它们被细分为“逐个赋值”、“一次性赋值”或“通过索引赋值”，后者介于前两者之间。你还可以从多种来源给数组赋值，包括通配符扩展和程序输出。\n\
  \n如果数组通过“逐个赋值”或“一次性赋值”方法声明，shell（外壳）会自动检测到正在声明一个数组。否则，则需要 `declare -a myarray` 语句来告诉\
  \ shell 该变量将被处理为数组。\n\n### 逐个赋值\n\n设置数组值最简单、最直接的方法是逐个赋值每个元素。就像普通变量一样，在赋值时不需要美元符号（`$`）符号，只有在引用它时才需要。在变量名的末尾，将索引数字放在方括号中：\n\
  \n```\n numberarray[0]=zero \nnumberarray[1]=one\nnumberarray[2]=two\nnumberarray[3]=three\n\
  ```\n\n除了简单明了之外，这种形式的另一个优势是可以定义稀疏数组。在接下来的示例中，数组中没有第三项（“two”）：\n\n```\n numberarray[0]=zero\
  \ \nnumberarray[1]=one\nnumberarray[3]=three\n```\n\n与普通变量一样，你可以在值中包含空格，但需要加引号，无论是使用引号还是反斜杠：\n\
  \n```\n country[0]=\"United States of America\"\ncountry[1]=United\\  Kingdom\n\
  country[2]=Canada\ncountry[3]=Australia\n```\n\n### 一次性赋值\n\n一种更高效的赋值方法是在单个命令中列出所有值。你只需要将值列在一个空格分隔的列表中，并用圆括号括起来：\n\
  \n```\n students=(  Dave Jennifer Michael Alistair Lucy Richard Elizabeth )\n```\n\
  \n这种方法的缺点是无法以这种方式分配稀疏数组。另一个缺点是你必须预先知道所需的值，并将它们硬编码到脚本中或在脚本内部计算出来。\n\n`IFS` —— 字段分隔符中的任何字符都可以用于分隔项目，包括换行符。将数组定义拆分到多行是完全有效的。你甚至可以在行尾添加注释。在下面的代码中，学生被分成若干行，每个子列表旁边都有一个注释，说明每组学生代表哪一年。\n\
  \n![note.ai](img/note_fmt.gif)\n\n`IFS` — 字段分隔符将在第 3 章中介绍。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\n $ cat studentarray.sh\n#!/bin/bash\nstudents=(  Dave Jennifer Michael  \
  \   # year 1\n  Alistair Lucy Richard Elizabeth   # year 2\n  Albert Roger Dennis\
  \ James Roy      # year 3\n  Rory Jim Andi Elaine Clive        # year 4\n  )\nfor\
  \ name in ${students[@]}\ndo\n  echo -en \"$name \"\ndone\necho\n$ ./studentarray.sh\n\
  Dave Jennifer Michael Alistair Lucy Richard Elizabeth Albert Roger Dennis James\
  \ Roy\n Rory Jim Andi Elaine Clive\n$\n```\n\n`studentarray.sh`\n\n在实践中，如果脚本不是为了一次性任务，将学生姓名硬编码到脚本中通常是不现实的。其他更灵活的数据读取方法将在本节稍后部分介绍。\n\
  \n### 通过索引赋值\n\n“逐个赋值”方法的简写版本，或者取决于你的观点，可能是“一次性赋值方法”的一种更显式的版本，是在一组圆括号内一起指定值，但同时说明索引和值。这在创建稀疏数组时特别有用，但也可以作为一种明确哪些元素位于何处的方法，而无需使用冗长的“逐个赋值”方法（后者要求你每次都提供变量名）。这种方法在用关联数组时也特别有用，关联数组将在本章的稍后部分讨论。下面的代码段将前\
  \ 32 个 ASCII 字符的名称（参见 `man ascii`）分配给数组。这对于确认名称位于正确位置很有用。例如，你可以很容易看到 `CR` 位于索引 13，而不需要数之前的\
  \ 13 个项。\n\n```\n nonprinting=([0]=NUL [1]=SOH [2]=STX [3]=ETX [4]=EOT [5]=ENQ\n\
  \  [6]=ACK [7]=BEL [8]=BS [9]=HT [10]=LF [11]=VT [12]=FF [13]=CR\n  [14]=SO [15]=SI\
  \ [16]=DLE [17]=DC1 [18]=DC2 [19]=DC3 [20]=DC4\n  [21]=NAK [22]=SYN [23]=ETB [24]=CAN\
  \ [25]=EM [26]=SUB [27]=ESC\n  [28]=FS [29]=GS [30]=RS [31]=US\n```\n\n### 从源一次性赋值\n\
  \n这是“一次性赋值”的一种特殊情况——圆括号中的内容可以由 shell 提供，无论是通过文件名扩展还是任何命令的输出。要读取进程状态的值，并将每个值分配给数组，只需调用\
  \ `$(cat /proc/$$stat)`。输出中的每项都将被分配给数组的一个元素。\n\n```\n $ cat /proc/$$stat\n28510\
  \ (bash) S 28509 28510 28510 4818 28680 202496 3094 49631 1 6 14 123 28 20\n1 0\
  \ 2776456 2000768 594 184467440370951615 194304 508214 407362537084\n4073625366792\
  \ 401760103268940 69632 368604 126671467 0 0 17 0 0 92 0\n$ stat=$(cat /proc/$$stat)\n\
  $ echo ${stat[1]} (bash)\n$ echo ${stat[2]} S\n$ echo ${stat[3]} 0\n$ echo ${stat[2]}\n\
  ```\n\n要读取文件，可以将 `IFS` 设置为换行符。这是一种非常有用的技巧。\n\n```\n Readhosts.sh\n```\n\n`Readhosts.sh`\n\
  \n源也可以是来自通配符扩展的文件列表。在下面的代码中，所有匹配 `*.mp3` 模式的文件都被添加到 `mp3s` 数组中：\n\n```\n $ mp3s=(\
  \ *.mp3 )\n$ for mp3 in \"${mp3s[@]}\"\n> do\n   echo \"MP3 File: $mp3\"\n> done\n\
  MP3 File: 01 - The MC5 - Kick Out The Jams.mp3\nMP3 File: 02 - Velvet Underground\
  \ - I.mp3\nMP3 File: 03 - The Doors - I'm Waiting For Man.mp3\nMP3 File: 04 - L.A.\
  \ Woman.mp3\nMP3 File: 05 - The New Dolls - Jet Boy.mp3\nMP3 File: 06 - Patti Smith\
  \ - Gloria.mp3\nMP3 File: 07 - The Damned - Neat Neat.mp3\nMP3 File: 08 - X-Ray\
  \ Spex - Oh Bondage Up!.mp3\nMP3 File: 09 - Richard Hell & The Voidoids - Blank\
  \ Generation.mp3\nMP3 File: 10 - Dead Boys - Sonic Reducer.mp3\nMP3 File: 11 - Iggy\
  \ Pop - Lust For Life.mp3\nMP3 File: 12 - The Saints - This Perfect Day.mp3\nMP3\
  \ File: 13 - Ramones - Sheena Is a Punk Rock.mp3\nMP3 File: 14 - The Only Ones -\
  \ Another Girl, Another Planet.mp3\nMP3 File: 15 - Siouxsie & The Banshees - Hong\
  \ Kong Garden.mp3\nMP3 File: 16 - Blondie - One Way Or Another.mp3\nMP3 File: 17\
  \ - Magazine - Shot By Both Sides.mp3\nMP3 File: 18 - Buzzcocks - Ever Fallen In\
  \ Love (With Someone You Shouldn've).mp3\nMP3 File: 19 - XTC - This Is Pop.mp3\n\
  MP3 File: 20 - Television - Marquee Moon.mp3\nMP3 File: 21 - David Bowie - 'Heroes'.mp3\n\
  $\n```\n\n注意这些文件名中所有可能引起问题的字符；文件名中包含空格、逗号、&、单引号、括号和点。数组结构在这个简单的示例中很好地处理了这些字符；在本章的稍后部分，它将对这些字符串进行更复杂的操作，而程序员无需担心任何特别特殊的引号。\n\
  \n\n\n\n\nbash shell 内置命令 `read` 在带有 `-a` 标志调用时，可以将元素读取到数组中。这是定义数组的一种非常简单的方法，无论是从用户输入还是文件。\n\
  \n```\n $ read -a dice\n4 2 6\n$ echo \"you rolled ${dice[0]} then ${dice[1]} then\
  \ ${dice[2]}\"\nyou rolled 4 then 2 then 6\n$\n```\n\n`read -a` 命令在很多情况下都非常有用，但当它与\
  \ `IFS` 变量结合使用时会变得更加有用。下面的示例告诉 shell `IFS` 与其默认值 `<space><tab><newline>` 不同，因此为了读取以冒号分隔字段的\
  \ `/etc/passwd`，只需在 `read` 命令之前设置 `IFS=:` 即可。请注意，最好在与想要修改 `IFS` 的命令位于同一行中使用 `IFS=`，因为这样它只作用于该\
  \ `read` 命令，而不会影响循环中的其他命令。\n\n`GECOS` 字段可能包含末尾逗号；按照惯例，它的内容应该类似于 `Steve Parker,The\
  \ Lair,202-456-1414,Author`，但这里只显示 `Steve Parker,,,`，这看起来并不好，因此使用 `%%,*` 语法去掉了末尾逗号。某些系统账户完全没有定义\
  \ `GECOS` 字段，因此如果第五字段 (`GECOS`) 未设置，该脚本将回退到第一个字段（登录名）来定义 `$user` 变量。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\n $ cat user.sh\n#!/bin/bash\nwhile IFS=: read -a userdetails\ndo\n  unset\
  \ user\n  gecos=${userdetails[4]%%,*}\n  username=${userdetails[0]}\n  user=${gecos:-$username}\n\
  \  if [ -d \"${userdetails[5]}\" ]; then\n    echo \"${user}'s directory ${userdetails[5]}\
  \ exists\"\n  else\n    echo \"${user}'s directory ${userdetails[5]} doesn't exist\"\
  \n  fi\ndone < /etc/passwd\n$ ./user.sh\nroot's directory /root exists\ndaemon's\
  \ directory /usr/sbin exists\nbin's directory /bin exists\nsys's directory /dev\
  \ exists\nsync's directory /bin exists\ngames's directory /usr/games exists\nman's\
  \ directory /var/cache/man exists\nlp's directory /var/spool/lpd doesn't exist\n\
  mail's directory /var/mail exists\nnews's directory /var/spool/news doesn't exist\n\
  uucp's directory /var/spool/uucp doesn't exist\nproxy's directory /bin exists\n\
  www-data's directory /var/www exists\nbackup's directory /var/backups exists\nMailing\
  \ List Manager's directory /var/list doesn't exist\nircd's directory /var/run/ircd\
  \ doesn't exist\nGnats-Reporting System (admin)'s directory /var/lib/gnats doesn't\
  \ exist\nnobody's directory /nonexistent doesn't exist\nlibuuid's directory /var/lib/uuid\
  \ exists\nmessagebus's directory /var/run/dbus exists\nAvahi autoip daemon's directory\
  \ /var/lib/autoipd exists\nfestival's directory /home/festival doesn't exist\nGnome\
  \ Display Manager's directory /var/lib/gdm exists\nHardware abstraction layer's\
  \ directory /var/run/hald exists\nusbmux daemon's directory /home/usbmux doesn't\
  \ exist\nsshd's directory /var/run/sshd exists\nsaned's directory /home/saned doesn't\
  \ exist\nPLIP system user's directory /var/run/plip exists\nSteve Parker's directory\
  \ /home/steve exists\nAvahi mDNS daemon's directory /var/run/avahi-daemon exists\n\
  ntp's directory /home/ntp doesn't exist\nDebian-exim's directory /var/spool/exim\
  \ exists\nTimidity++ sequencer service's directory /etc/timidity\n$\n```\n\n###\
  \ `user.sh`\n\nbash shell 内置命令 `readarray` 读取文件的方式比之前读取 `/etc/hosts` 时更加灵活。可以指定初始索引\
  \ (`-O`)，也可以指定读取的最大行数 (`-n`)。还可以从输入开始跳过行 (`-s`)。\n\n```\n $ readarray -n 4 -s 2\
  \ food\nporridge\nblack pudding\napples\nbananas\ncucumbers\nburgers\n```\n\n跳过了前两个项是因为\
  \ `-s 2`。实际读取了四个参数是因为 `-n 4`，尽管这意味着总共读取了六行；数组的大小是 `4`。输入的第七项没有被读取。\n\n显示数组项的一种常用方法是\
  \ `printf \"%s\\n\" \"${food[@]}\"`；这将遍历数组的值，并在每个字符串后打印一个换行符。由于换行符被添加到元素中，之前的示例中不需要\
  \ `\\n`。`readarray` 的 `-t` 标志可以去掉这些换行符，这正是我们需要的。\n\n### 访问数组\n\n访问数组的基本方法与给数组赋值相同。大括号是强制性的。如果省略索引，假设为第一个元素。\n\
  \n### 通过索引访问\n\n复用本章之前的 `array`，以下代码添加了一些 `echo` 语句来显示值。注意稀疏数组意味着 `array[2]` 是存在的。\n\
  \n```\n $ array[0]=zero\n$ array[1]=one\n$ array[3]=three\n$ echo ${array[0]}\n\
  zero\n$ echo ${array[2]}\nthree\n```\n\n如果你尝试在不带大括号的情况下访问 `$array[1]`，shell 会把 `$array`\
  \ 解析为 `array` 中的第一个元素，并将 `[1]` 解析为字面字符串。这导致返回字面字符串 `zero[1]`，这不是想要的。\n\n```\n $\
  \ echo $array[1]\nzero[1]\n$\n```\n\n### 数组长度\n\n查找数组元素数量与查找普通变量长度非常相似。虽然 `${#var}`\
  \ 给 `$var` 中包含的字符串长度，但 `${#array[@]}` 或 `${#array[*]}` 返回数组元素的数量。对于稀疏数组，这仍然返回分配给数组元素数量，与数组使用的最高索引不是一回事。\n\
  \n注意 `${#array}` 返回的是 `array[0]` 中字符串的长度，而不是数组元素的数量。获取数组中第三项的长度，语法是 `${array[2]}`，因为数组是从零索引的。第一个项的长度是\
  \ `${array[0]}`，`${array[1]}` 是第二个项的长度。\n\n```\n $ fruits=(apple banana orange)\n\
  $ echo ${#fruits[@]}\n3\n$ echo ${#fruits}\n5\n$ echo ${fruits[0]}\n5\n$ echo ${fruits[1]}\n\
  6\n$ echo ${fruits[2]}\n6\n$ echo ${fruits[3]}\n$\n```\n```\n\n### 通过变量索引访问\n\n\
  索引不需要硬编码的整数；它也可以是变量的值。因此，你可以使用变量遍历（非稀疏）数组，甚至只需通过索引访问数组中的任何元素。这个示例展示了对四位披士的迭代，它们的索引为\
  \ 0–3。命令 `seq 0 $((${#beatles[@]} - 1))` 从 0 计数到 3，或者准确地说，是从 0 到 (4–1)，其中 4 是数组的长度，但因为是从零索引的，四个元素的索引为\
  \ 0 到 3。\n\n脚本添加了一个索引为 5 的第四元素，创建一个稀疏数组（缺少元素 4），这样 Stuartcliffe（应该是 Pete Best？）就不会被此循环捕获。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```\n $ cat index.sh\n#!/bin/bash\nbeatles=(John\
  \ Paul Ringo George)\nfor index in $(seq 0 $((${#beatles[@]} - 1)))\ndo\n  echo\
  \ \"Beatle $index is ${beatles[$index]}.\"\ndone\necho \"Now again with the fifth\
  \ beatle...\"\nbeatles[5]=Stuart\nfor index in $(seq 0 $((${#beatles[@]} - 1)))\n\
  do\n  echo \"Beatle $index is ${beatles[$index]}.\"\ndone\necho \"Missed it; Beatle\
  \ 5 is ${beatles[5]}.\"\n$ ./index.sh\nBeatle 0 is John.\nBeatle 1 is Paul.\nBeatle\
  \ 2 is Ringo.\nBeatle 3 is George.\nNow again with the fifth beatle...\nBeatle 0\
  \ is John.\nBeatle 1 is Paul.\nBeatle 2 is Ringo.\nBeatle 3 is George.\nBeatle 4\
  \ is .\nMissed it; Beatle 5 is Stuart.\n$\n```\n\n\n\n[content]\n只要数组不是关联数组，你也可以在\
  \ `[]` 括号内进行基础数学运算。这不仅让代码更容易编写，还能保持代码的可读性。冒排序算法将元素与其相邻元素进行比较，这段代码比包含额外的计算 `j-1`\
  \ 行的代码更易读。使用 C 风格的 `for` 循环使其看起来完全不像 Shell 脚本。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```bash\n $ cat bubblesort.sh\n#!/bin/bash\nfunction bubblesort()\n{\n  n=${#data[@]}\n\
  \  for i in 'seq 0 $n'\n  do\n    for (( j=n; j > i; j-=1 ))\n    do\n      if [[\
  \ ${data[j-1]} > ${data[j]} ]]\n      then\n          temp=${data[j]}\n        \
  \  data[j]=${data[j-1]}\n          data[j-1]=$temp\n        fi\n    done\n  done\n\
  }\ndata=( roger oscar charlie kilo indigo tango )\necho \"Initial state:\"\nfor\
  \ i in ${data[@]}\ndo\n  echo \"$i\"\ndone\nbubblesort\necho\necho \"Final state:\"\
  \nfor i in ${data[@]}\ndo\n  echo \"$i\"\ndone\n$ ./bubblesort.sh\nInitial state:\n\
  roger\noscar\ncharlie\nkilo\nindigo\ntango\nFinal state:\ncharlie\nindigo\nkilo\n\
  oscar\nroger\ntango\n$\n```\n\nbubblesort.sh\n\n![note.ai](img/note_fmt.gif)\n\n\
  这种形式的缺点是变量 `${n}` 必须在 `for` 循环之外进行计算。\n\n## 从数组中选择项目\n\n从数组中选择单个项目是一回事，但有时从数组中检索一个范围也是很有用的。这是以类似于字符串截取的方式实现的，提供起始索引和要检索的项目数量。简单的\
  \ `${food[@]:0:1}` 获取第一个项目；`:1:1` 获取第二个，`:2:1` 获取第三个，依此类推。这与使用 `${food[0]}`、`[1]`\
  \ 和 `[2]` 是一样的，显然并没有太大用处。\n\n![note.ai](img/note_fmt.gif)\n\n如 7:1 示例所示，访问数组中不存在的第八个元素（`${food[@]:7:1}`）不会导致任何错误；它只是返回空字符串。\n\
  \n```bash\n $ food=( apples bananas cucumbers eggs fajitas )\n$ echo ${food[@]:0:1}\n\
  apples\n$ echo ${food[@]:1:1}\nbananas\n$ echo ${food[@]:2:1}\ncumbers\n$ echo ${food[@]:7:1}\n\
  $\n```\n\n扩展范围使得 `for` 变成了一个更灵活的机制。通过将前面的代码中最后的 `:1` 替换为不同的数字，你可以从数组中检索一组结果。\n\n\
  ```bash\n $ echo ${food[@]:2:4}\ncumbers eggs fajitas\n$ echo ${food[@]:0:3}\napples\
  \ bananas\n```\n\n如果你更进一步一点，可以省略初始数字。这将从提供的偏移量开始检索数组的元素。\n\n```bash\n $ echo ${food[@]:3}\n\
  dates eggs fajitas\n$ echo ${food[@]:1}\nbananas cucumbers eggs fajitas\n$ echo\
  \ ${food[@]:6}\ngrapes\n```\n\n## 显示整个数组\n\n要显示整个变量，简单的 `echo ${array[@]}` 就足够了，但它并不吸引人：\n\
  \n```bash\n $ echo ${distros[@]}\nUbuntu Debian openSE Arch\n```\n\n更灵活的选项是使用 `printf`\
  \ 来添加文本和格式。`printf` 将使用相同的字符串格式化数组中的每个项目，因此这几乎模拟了一个循环：\n\n```bash\n $ printf \"\
  Distro:%s\\n\" \"${distros[@]}\"\nDistro: Ubuntu\nDistro: Fedora\nDistro: Debian\n\
  Distro: openSE\nDistro: Sabayon\nDistro: Arch\n```\n\n## 关联数组\n\n关联数组是 bash 4 版本中的一个新特性。关联数组将值和索引关联，因此你可以将元数据与实际数据关联。你可以借此将音乐家与他的乐器关联。关联数组必须使用\
  \ `declare -A` 命令声明为关联数组。\n\n![download.eps](img/download_fmt.gif)\n\n```bash\n\
  \ $ cat musicians.sh\n#!/bin/bash\ndeclare -A beatles\nbeatles=( [singer]=John [bassist]=Paul\
  \ [drummer]=Ringo [guitarist]=George )\nfor musician in singer bassist drummer\n\
  do\n  echo \"The ${musician} is ${beatles[$musician]}.\"\nDone\n./musicians.sh\n\
  The singer is John.\nThe bassist is Paul.\nThe drummer is Ringo.\nThe guitarist\
  \ is George.\n```\n\nmusicians.sh\n\n![note.ai](img/note_fmt.gif)\n\n在 bash 引入关联数组之前，很明显\
  \ `${beatles[index]}` 是没有意义的；它会被自动解释为 `${beatles[$index]}`。然而，因为关联数组可以使用文本作为索引，`${beatles[\"\
  index\"]}` 现在可以是有效的，所以美元符号对于关联数组是强制的。如果省略了美元符号，单词“index”本身而不是变量 `$index` 的值将被解释为数组的索引。\n\
  \n让关联数组更有用的是能够引用回索引名称的能力。这意味着给定乐器的名称，你可以获得音乐家的名字；但同样，给定音乐家的名字，你可以确定他的乐器。要做到这一点，使用\
  \ `${!array[@]}` 语法。\n\n![download.eps](img/download_fmt.gif)\n\n```bash\n $ cat\
  \ instruments.sh\n#!/bin/bash\ndeclare -A beatles\nbeatles=( [singer]=John [bassist]=Paul\
  \ [drummer]=Ringo [guitarist]=George )\nfor instrument in ${!beatles[@]}\ndo\n \
  \ echo \"The ${instrument} is ${beatles[$instrument]}\"\ndone\n./instruments.sh\n\
  The singer is John\nThe guitarist is George\nThe bassist is Paul\nThe drummer is\
  \ Ringo\n```\n\ninstruments.sh\n\n## 操作数组\n\n数组在结构上与其他变量不同的事实，意味着需要一些新语法来操作数组。在尽可能的情况下，对数组的操作在语法上与对字符串执行等操作非常相似，但在某些情况下，该语法并不灵活。\n\
  \n### 复制数组\n\n将一个数组复制到另一个数组很简单。对于引号和空格，使用 `${array[@]}` 格式而不是 `${array[*]}` 是重要的。这些演示可能是最清晰的方式，展示使用其他形式会发生什么。\n\
  \n```bash\n $ activities=( swimming \"water skiing\" canoeing \"white-water rafting\"\
  \ surfing )\n$ for act in ${activities[@]}\n> do\n  echo \"Activity: $act\"\n> done\n\
  Activity: swimming\nActivity: water\nActivity: skiing\nActivity: canoeing\nActivity:\
  \ white-water\nActivity: rafting\nActivity: surfing\n$\n```\n\n这里发生的情况是因为列表没有加双引号，“swimming”、“water”和“skiing”都被视为独立的单词。为整个结构加上双引号可以修复这个问题：\n\
  \n```bash\n $ for act in \"${activities[@]}\"\n> do\n  echo \"Activity: $act\"\n\
  > done\nActivity: swimming\nActivity: water skiing\nActivity: canoeing\nActivity:\
  \ white-water rafting\nActivity: surfing\n$\n```\n\n同样，`*` 在没有引号的情况下也不适用。没有引号时它与\
  \ `@` 符号相同。有了引号，整个数组被浓缩成单个字符串。\n\n```bash\n $ for act in ${activities[*]}\n> do\n\
  \  echo \"Activity: $act\"\n> done\nActivity: swimming\nActivity: water\nActivity:\
  \ skiing\nActivity: canoeing\nActivity: white-water\nActivity: rafting\nActivity:\
  \ surfing\n$ for act in \"${activities[*]}\"\n> do\n  echo \"Activity: $act\"\n\
  > done\nActivity: swimming water skiing canoeing white-water rafting surfing\n$\n\
  ```\n\n因此，要复制数组，使用 `${activities[@]}` 的值定义新数组。这将以相同的方式保留空格，就像前面的 `for` 循环得到了正确处理一样。这在后续代码中所示。\n\
  \n```bash\n $ hobbies=( \"${activities[@]}\" )\n$ for hobby in \"${hobbies[@]}\"\
  \n> do\n  echo \"Hobby: $hobby\"\n> done\nHobby: swimming\nHobby: water skiing\n\
  Hobby: canoeing\nHobby: white-water rafting\nHobby: surfing\n$\n```\n\n然而，这对于稀疏数组并不有效。索引的实际值没有通过这种方式传递，因此\
  \ hobbies 数组无法成为 activities 数组的真实副本。\n\n\n\n\n\n```bash\n $ activities[10]=\"scuba\
  \ diving\"\n$ hobbies=\"( ${activities[@]} )\"\n$ for act in 'seq 0 10'\n> do\n\
  >   echo \"$act : ${activities[$act]} / ${hobbies[$act]}\"\n> done\n0 : swimming\
  \ / swimming\n1 : water skiing / water skiing\n2 : canoeing / canoeing\n3 : white-water\
  \ rafting / white-water rafting\n4 : surfing / surfing\n5 :   / scuba diving\n6\
  \ :   /\n7 :   /\n8 :   /\n9 :   /\n10 : scuba diving /\n$\n```\n\n## 向数组添加元素\n\n\
  向数组添加元素与复制数组非常相似。向数组添加元素最简单的方法扩展复制数组的语法。\n\n```bash\n $ hobbies=( \"${activities[@]\"\
  \ diving )\n $ for hobby in \"${hobbies[@]}\"\n> do\n>   echo \"Hobby: $hobby\"\n\
  > done\nHobby: swimming\nHobby: water skiing\nHobby: canoeing\nHobby: white-water\
  \ rafting\nHobby: surfing\nHobby: scuba diving\nHobby: diving\n$\n```\n\n在本章前面的部分，你看到过\
  \ `seq 0 $((${#beatles[@]} - 1))` 用于获取数组的最后一个实际元素。数组从零索引开始使得这个任务变得有些笨拙。当向数组添加单个项目时，数组从零索引的特性实际上让它变得更简单。\n\
  \n```bash\n $ hobbies[${#hobbies[@]}]=rowing\n $ for hobby in \"${hobbies[@]}\"\n\
  > do\n>   echo \"Hobby: $hobby\"\n> done\nHobby: swimming\nHobby: water skiing\n\
  Hobby: canoeing\nHobby: white-water rafting\nHobby: surfing\nHobby: scuba diving\n\
  Hobby: diving\nHobby: rowing\n$\n```\n\nbash shell 确实有一个内置语法来组合两个数组。使用类似 C 语言的符号\
  \ `+=`，这种方法简洁且代码非常清晰。\n\n```bash\n $ airsports=( flying gliding parachuting )\n\
  $ activities+=(\"${airsports[@]}\")\n $ for act in \"${activities[@]}\"\n> do\n\
  >   echo \"Activity: $act\"\n> done\nActivity: swimming\nActivity: water skiing\n\
  Activity: canoeing\nActivity: white-water rafting\nActivity: surfing\nActivity:\
  \ scuba diving\nActivity: walking\nActivity: cycling\nActivity: flying\nActivity:\
  \ parachuting\n$\n```\n\n## 从数组删除元素\n\n从数组中删除元素与删除变量相同；你可以使用 `myarray[3]` 或 `unset\
  \ myarray[3]`。同样，你可以取消整个数组。然而，`myarray=` 本身只会清除第一个元素的值。所有这些情况在代码中都得到了演示。\n\n```bash\n\
  \ $ for act in 'seq 0 $((${#activities[@]} - 1))'\n> do\n>   echo \"Activity: $act:\
  \ ${activities[$act]}\"\n> done\nActivity 0: swimming\nActivity 1: water skiing\n\
  Activity 2: canoeing\nActivity 3: white-water rafting\nActivity 4: surfing\nActivity\
  \ 5: scuba diving\nActivity 6: climbing\nActivity 7: walking\nActivity 8: cycling\n\
  Activity 9: flying\nActivity 10: gliding\nActivity 11: parachuting\n$ activities[7]=\n\
  $ for act in 'seq 0 $((${#activities[@]} - 1))'\n> do\n>   echo \"Activity: $act:\
  \ ${activities[$act]}\"\n> done\nActivity 0: swimming\nActivity 1: water skiing\n\
  Activity 2: canoeing\nActivity 3: white-water rafting\nActivity 4: surfing\nActivity\
  \ 5: scuba diving\nActivity 6: climbing\nActivity 7: \nActivity 8: cycling\nActivity\
  \ 9: flying\nActivity 10: gliding\nActivity 11: parachuting\n```\n\n这种效果是产生一个稀疏数组。使用\
  \ `unset activities[7]` 效果很大程度上相同。正如第 7 章讨论，将变量设置为空字符串与完全取消该变量之间存在区别，但只有在在使用 `${variable+string}`\
  \ 或 `${variable?string}` 形式时才会显而易见。\n\n```bash\n $ echo ${activities[7]}\n$ echo\
  \ ${activities[7]+\"Item 7 is set\"}\nItem 7 is set\n$ unset activities[7]\n$ echo\
  \ ${activities[7]+\"Item 7 is set\"}\n$\n```\n\n再次，不带索引的引用会被解释为对数组第一个元素的引用。因此，通过这种方式清除数组只会移除第一个项目。\n\
  \n```bash\n $ activities=\n$ for act in 'seq 0 $((${#activities[@]} - 1))'\n> do\n\
  >   echo \"Activity: $act: ${activities[$act]}\"\n> done\nActivity 0: \nActivity\
  \ 1: water skiing\nActivity 2: canoeing\nActivity 3: white-water rafting\nActivity\
  \ 4: surfing\nActivity 5: scuba diving\nActivity 6: climbing\nActivity 7: \nActivity\
  \ 8: cycling\nActivity 9: flying\nActivity 10: gliding\nActivity 11: parachuting\n\
  ```\n\n如果你取消了 `activities` 数组本身，整个就会消失。这是取消数组的正确方法，尽管你也可以使用 `unset myarray[*]`。\n\
  \n```bash\n $ unset activities\n$ for act in 'seq 0 $((${#activities[@]} - 1))'\n\
  > do\n>   echo \"Activity $act: ${activities[$act]}\"\n> done\n$\n```\n\n## 高级技巧\n\
  \n在这一章前面的“一次性处理源”部分，`seq 0 $((${#activities[@]} - 1))` 用于自动标记 MP3 文件字段。`for` 语句本身从文件名中去掉了\
  \ `.mp3`，正如第 7 章所示，尽管这次是处理整个数组。之后，当 `echo` 访问 `${mp3}` 变量时，它也将连字符 `-` 替换为冒号。这并不意味着代码比单独执行这些任务更快，但它是一种清晰且简单的方法。最重要的是代码是易于理解的。\n\
  \n```bash\n$ for mp3 in \"${mp3[@]%.mp3}\"\n> do\n  echo \"${mp3///-}\"\ndone\n\
  01:The MC5:Kick Out The Jams\n02:Velvet Underground:I'm Waiting For Man\n03:The\
  \ Stooges:No Fun\n04:The Doors:Woman\n05:The New Dolls:Jet Boy\n06:Patti Smith:Gloria\n\
  07:The Damned:Neat Neat\n08:X-Ray Spex:Oh Bondage Up Yours!\n09:Richard Hell The\
  \ Voidoids:Blank Generation\n10:Dead Boys:Sonic Red\n11:Iggy Pop:Lust For Life\n\
  12:The Saints:This Perfect Day\n13:Ramones:Sheena Is A Punk Rock\n14:The Only Ones:Another\
  \ Girl, Another Planet\n15:Siouxsie & The Banshees:Hong Kong Garden\n16:Blondie:One\
  \ Way Or Another\n17:Magazine:Shot By Both Sides\n18:Buzzcocks:Ever Fallen In Love\
  \ (With Someone You've)\n19:XTC:This Is Pop\n20:Television:Marquee Moon\n21:David\
  \ Bowie:'Heroes'\n$\n```\n\n## 总结\n\n数组是 shell 的强大功能，有多种用法。它们极大扩展了 shell 的功能，尽管要求数组作为支持特性限制了脚本到支持数组的系统的可移植性。稀疏数组也非常有用，而且不需要像\
  \ C 等低级语言那样管理内存。\n\n关联数组比普通数组更灵活。它们本质上是用名称而不是数字作为索引的稀疏数组。这允许你在数据键本身中存储元数据。\n\n\n\
  \n\n操作系统的主要任务之一是代表用户、服务和应用程序运行进程。这些进程在内核的进程表中被跟踪，进程表维护了系统中每个进程的当前状态，而系统调度器决定了每个进程何时被分配到\
  \ CPU，以及何时再次从 CPU 上撤离。`ps` 命令用于查询进程表。遵循 Unix “只做一件事并将其做好”的模型，`ps` 拥有一组开关，可以精细调整从完整的进程树中精确要显示的内容。\n\
  \n`/proc` 伪文件系统提供了对运行中内核的进一步洞察；`/proc` 下为当前进程表中的每个进程都提供了一个目录。在那个目录中可以找到进程的状态 ——\
  \ 它的当前工作目录以及它当前打开的文件列表。Linux 内核暴露的操作系统内容远不止进程表；`/proc` 包含了直接读取和写入内核状态的机制，包括网络设置、内存选项、硬件信息，甚至强制机器崩溃的能力。\n\
  \n本章将深入研究进程、它们是什么、如何管理它们以及如何操纵它们。这是 Unix 最老的概念之一，在 40 年里没有太大变化，但特别是 Linux 内核为 `/proc`\
  \ 文件系统提供的内核与用户空间之间真正的双向交互方式带来了全新的现实意义。\n\n## ps 命令\n\n`ps` 命令在不同的 Unix 变体之间是不一致的。System\
  \ V Unix 使用普通的横字符（`-`）符号来标记选项，因此 `ps -eaf` 是列出所有当前进程的常用命令，而 BSD Unix 则不这样做，并且识别不同的开关；`ps\
  \ aux` 是 BSD 系统上列出所有当前进程的常用方法。正如通常情况，GNU/Linux 兼顾了这两种传统，GNU 的 `ps` 实现接受 System V\
  \ 和 BSD 选项，以及它自己的 GNU 选项，例如 `--user`。System V 可能是最广泛使用的格式，本章将使用 System V 。\n\n```\n\
  \ $ ps -fp 3010\nUID      PID  PPID  C STIME TTY           TIME CMD \nmysql    3010\
  \  2973  0  Oct24  ?           00:11:23 /usr/sbin/mysqld --basedir=/usr --d\natadir=/var/lib/mysql\
  \ --user=mysql --pid-file=/var/run/mysqld/mysqld.pid --skip-ext\nernal-locking --port=3306\n\
  ```\n\n标题有点晦涩；`UID`、`PID` 和 `PPID` 分别是用户名、进程 ID 和父进程 PID。`STIME` 是进程启动的时间（或日期）。如果与终端相关联，则会在\
  \ `TTY` 下报告终端。`TIME` 是进程使用的 CPU 时间，`CMD` 是可执行文件的全名。`C` 是一个表示进程所占 CPU 时间百分比的粗略数字。\n\
  \n在命令行上可以选择许多 `ps` 选项；要显示与第三个终端相关的所有进程，`ps -ft /dev/pts/3` 只显示那些进程。同样，`ps -fu oracle`\
  \ 仅显示用户 `oracle` 拥有的进程。`-F` 标志提供了更多细节；这些列在 `ps` 的帮助页中都有描述，但它增加了 `SZ`、`RSS` 和 `PSR`。`SZ`\
  \ 是整个进程的页数（在 x86 上通常为 4KB）；`RSS` 是进程持有的物理内存（不包括交换出的数据）。`PSR` 是进程运行的当前 CPU 的 ID。\n\
  \n### ps 行长度\n\n`ps` 将其输出长度限制在你的终端宽度内。当向非终端（`tty`）写入内容时，它将不会限制输出宽度，而是显示完整的命令行。这意味着脚本可以获取完整的详细信息；例如，`ps\
  \ -fp 18611 | grep it` 将看到完整的命令行。如果你正在使用交互式终端测试某些内容，`ps -fp 18611` 显示的命令行可能不够长，以至于进程\
  \ `18611` 命令行中的 `it` 部分不可见，尽管它确实存在。相反，运行 `ps -fp 18611 | cat -` 将确保 `ps` 本身运行在管道中（而不是输出到\
  \ `tty`），这也许是使用 `| -` 语法的唯一原因。在图 10-1 的截图中，第一个 `ps` 命令没有足够的空间来显示可执行文件的完整目录路径，更不用说它被调用运行什么了。第二个\
  \ `ps` 命令可以看到整个命令行，因为尽管输出最终流向终端设备，但 `ps` 看到它正在写入管道而不是 `tty`，因此它显示了完整的命令。\n\n###\
  \ 准确解析进程表\n\n在 SysV 风格中，`ps -ft <terminal>` 和 `ps -fu <user>` 是获取终端和用户的最佳方法。这些方法获取终端和用户的记录，但并不是所有内容都能通过这种方式过滤。需要更具创新的技术来自动匹配任何进程。\n\
  \n\n\n然而，`pgrep` 比上述方法更加灵活。你可以指定只查找某些用户（们），因此如果你有多个程序以不同用户 ID 运行的实例，你可以使用 `pgrep\
  \ -u devtest iidbms` 来列出由 `devtest` 用户运行的 Ingres 数据库实例，从而仅识别其中一组。你也可以反向操作，只需通过 `pgrep\
  \ -u devtest` 找到属于该用户的所有进程，而无论进程名称为何。\n\n由于 `pgrep` 经常被用于杀死（kill）进程，因此它被符号链接到了一个名称非常相似的命令\
  \ `pkill`。`pkill` 的语法几乎完全相同，但它不仅仅是列出 PID，还会杀死这些进程。因此，之前所示的 `kill -9` 等同于 `pkill\
  \ -x apache2`。你可以为 `pkill` 传递不同的信号以便使用，其语法与 `kill` 相同：`pkill -1 -x apache2` 将向进程发送信号\
  \ `1`。\n\n表 10-1 显示了发送给进程的最常用信号。\n\n表 10-1: 常用信号\n\n| 数字 | 信号 | 含义 |\n\n| --- |\
  \ --- | --- |\n| 0 | 0 | 退出 shell 时被捕获 |\n| 1 | SIGHUP | 清理、整理；重新读取配置文件并继续 |\n|\
  \ 2 | SIGINT | 中断 |\n| 3 | SIGQUIT | 退出 |\n| 6 | SIGABRT | 终止 |\n| 9 | SIGKILL |\
  \ 立即杀死进程 |\n| 14 | SIGALRM | 闹钟 |\n| 15 | SIGTERM | 优雅终止 |\n\n![note.ai](img/note_fmt.gif)\n\
  \n在关闭机器时，操作系统通常会调用任何注册的关机脚本，向任何剩余的进程发送 `SIGTERM`，最后向任何仍在运行的进程发送 `SIGKILL`。\n\n`pgrep`\
  \ 还有许多其他标志，均在 man 页（帮助文档）中 la 记录。一个非常有用的标志（主要用于输出人类可读的列表）是 `-l`，用于包含进程名称。在这里，搜索名称中包含“ii”的进程，而不仅仅获取\
  \ PID 列表，还会获取进程名称。\n\n```\n $ pgrep -l ii\n8402   iimerge\n8421   iigcc\n8376  \
  \ iimerge\n8439   iigcd\n8387   iimerge\n8216   iigcn\n```\n\n另一个常用的 `pgrep` 标志是\
  \ `-d` 开关，用于指定分隔符。通常每个 PID 独占一行；使用 `-d ' '` 你可以获取空格分隔的 PID（如 `pidof`），或者使用 `-d ','`\
  \ 获取逗号分隔的结果。注意，这两个命令中 PID 的顺序是反的。\n\n```\n $ pidof apache2\n2510 2509 2508 2507\
  \ 2502 1536 1535 1534 1533 1532 1495\n$ pgrep -d',' apache2\n1495,1532,1533,1534,1535,1536,2502,2507,2508,2509,2510\n\
  $\n```\n\n### killall\n\n杀死所有进程的一个实用快捷命令是 `killall`。`killall` 会杀死匹配所提供标准的进程。与 `pgrep`\
  \ 及其伙伴类似，`killall` 非常灵活。首先给出一个警告：你永远不要考虑在不带 `-e`（精确匹配）选项的情况下运行 `killall`，除非你非常清楚自己在做什么，并且切切系统上可能运行哪些进程。另一个非常常用的开关是\
  \ `-u`，它你指定限制搜索范围的用户 ID。如果你的 `apache` 进程以用户 `www` 运行，那么通过指定 `-u www`，你可以确保没有其他用户的进程会受到影响，正如前面的\
  \ `pgrep` 示例一样。`killall -u www` 本身会杀死由 `www` 用户运行的所有进程——再次，这与 `pgrep` 完全相同。你可以通过\
  \ `-s` 开关指定传递不同的信号——因此 `killall -1 -u www` 会向 `www` 进程发送 `SIGHUP` 信号，告诉它们重启。\n\n\
  一个简单的应用程序启动/停止脚本如下：\n\n```\n $ cat /etc/init.d/myapp\n#!/bin/bash\ncase \"$1\" in\n\
  \    \"start\") su – myapp /path/to/program/startall\n      # 这可能会产生大量进程，其名称和 PID\
  \ 可能不可知。\n      # 但是，除非涉及 suid，否则它们将属于 myapp 用户\n      ;;\n    \"stop\") killall\
  \ -u myapp\n      # 这会杀死由 myapp 用户运行的所有所有内容。\n      ;;\n    *) echo \"Usage: basename\
  \ $0 start|stop\"\n      ;;\nesac\n```\n\n许多服务会启动一组进程，作为系统管理员，你可能甚至不知道这些进程的名称，而且它们可能会随着应用程序版本的更新而改变。可能会出现应用程序用户登录时启动了这些进程的情况。\n\
  \n\n\n\n```bash\n $ cat stat.sh\n#!/bin/sh\n# RHEL5 示例 (2.6.18 内核):\n#23267 (bash)\
  \ S 23265 23267 23267 34818 23541 4202496 3005 27576 1 6 4 3 45 16 15 0\n 1 0 1269706754\
  \ 72114176 448 18446744073709551615 4194304 4922060 140734626075216 \n18446744073709551615\
  \ 272198374197 0 65536 3686404 1266761467 18446744071562230894 0\n0 17 2 0 0 23\n\
  PID=${1}\nif [ ! -z \"$PID\" ]; then\n  read pid tcomm state ppid pgid sid tty_nr\
  \ tty_pgrp flags min_flt cmin_flt\n  maj_flt cmaj_flt utime stime cutime cstime\
  \ priority nice num_threads \nit_real_value start_time vsize mm rsslim start_code\
  \ end_code start_stack eis eip \npending blocked sigign sigcatch wchan oul1 oul2\
  \ exit_signal cpu rt_priority \npolicy ticks < /proc/$PID/stat\n  echo \"Pid $PID\
  \ $tcomm is in state $state on CPU $cpu\"\nfi\n```\n\n### stat.sh\n\n这将会显示类似下面的的内容：\n\
  \n```\n Pid 2076 (bash) is in state S on CPU 1\n```\n\n由于 Linux 内核开发模型，它并不提供 API\
  \ 保证，因此诸如 `/proc/*/stat` 这样的内容会随着时间推移而变化。然而，找到文档，甚至找到 `/proc` 中写入这些文件的内核部分，并自行推导出这些变化，并不是困难的。在实践中，像\
  \ `/proc/*/stat` 这样的 API 倾向于保持兼容性，在末尾添加新值。例如，当 `it_real_value` 从 `2.6.17` 内核中移除时，它被替换为零（参见\
  \ [`lkml.org/lkml/2006/2/14/312`](http://lkml.org/lkml/2006/2/14/312)），这样 `start_time`\
  \ 其后的字段就能保持它们一直以来的位置。\n\n你可以调整输出以显示伪文件 `/proc/$$/stat` 中的任何变量。例如：\n\n```\n echo\
  \ \"Pid $PID $tcomm is in state $state on CPU $cpu. Its parent is Pid $ppid.\"\n\
  echo \"It is occupying $vsize bytes.\"\n```\n\n这将显示类似下面的的内容：\n\n```\n Pid 3053 (bash)\
  \ is in state S on CPU 1. Its parent is Pid 2074. \nIt is occupying 19763200 bytes.\n\
  ```\n\n### prtstat\n\n`prtstat` 工具是一个非常有用的工具，它提供了与前面的脚本相同的信息，但它是一个外部二进制文件。它是 `psmisc`\
  \ 项目的一部分，该项目还提供了 `fuser`、`killall` 和 `pstree`。你可以通过 `grep` 和 `awk` 管道处理 `prtstat`\
  \ 来获取 CPU 编号，这比负责正确解析一组较长且复杂的变量要容易得多，尽管它看起来稍微不整洁一点，并且启动了三个不同的二进制文件，而前节的 shell 脚本没有产生任何进程。\n\
  \n```\n $ prtstat $$ \nProcess: bash          State: S (sleeping) \n  CPU#:  1 \
  \          TTY: 136:1   Threads: 1 \nProcess, Group and Session IDs \n  Process\
  \ ID: 2168          Parent ID: 2063 \n    Group ID: 2168          Session ID: 2168\
  \ \n  Group ID: 2999 \nPage Faults \n  This Process (minor major):  4539  0 \n \
  \ Child Processes (minor major):  14675  5 \nCPU Times \n  This Process (user guest\
  \ blkio):  0.07  0.14  0.00  0.93 \n  Child processes (user guest):  0.56  0.67\
  \  0.00 \nMemory \n  Vsize:  19 MB  RSS:  242 kB  RSS Limit: 18446744073709 MB \n\
  \  Code Start: 0x400000  Code Stop: 0x4d8c1 \n  Stack Start: 0x7fff27ae720\n  Stack\
  \ Pointer (ESP): 0x7fff27ae300  Inst Pointer (EIP): 0x7fe3fa9a36e \n```\n\n\n\n\n\
  \n```\n $ ls -l /proc/self/fd /nosuchfile < /etc/hosts \\ \n> > /tmp/ls-output.txt\
  \ 2> /tmp/ls-err.txt\n$ cat /tmp/ls-output.txt\n/proc/self/fd:\ntotal 0\nlr-x------\
  \ 1 steve steve 64 Jan 27 22:52 0 -> /etc/hosts\nl-wx------ 1 steve steve 64 Jan\
  \ 27 22:52 1 -> /tmp/ls-output.txt\nl-wx------ 1 steve steve 64 Jan 27 22:52 2 ->\
  \ /tmp/ls-err.txt\nlr-x------ 1 steve steve 64 Jan 27 22:52 3 -> /proc/2623/fd\n\
  $ cat /tmp/ls-err.txt\nls: cannot access /nosuchfile: No such file or directory\n\
  $\n```\n\n现在，在 `ls` 命令打开的任何文件中，都不再提到终端设备。所有输入和输出都重定向到了其他文件。事实是，除了 `/proc/self/fd`\
  \ 之外，这些都在 `/proc` 伪文件系统之外。\n\n## 将输出追加到现有文件\n\n`>` 语法创建一个长度为零的目标文件；若要追加而不是覆盖，请使用\
  \ `>>`，它将保留任何现有内容，但如果文件不存在，仍会创建它。\n\n```\n $ cat names.txt\nHomer\nMarge\nBart\n\
  $ echo Lisa >> names.txt\n$ cat names.txt\nHomer\nMarge\nBart\nLisa\n$ echo Lisa\
  \ > names.txt\n$ cat names.txt\nLisa\n$\n```\n\n![note.ai](img/note_fmt.gif)\n\n\
  `>` 语法的另一个用途是故意清空一个现有文件。在清理已满的文件系统时，一个常见的错误是删除一个仍被应用程序使用的日志文件。在应用程序关闭文件之前，文件系统不会释放该空间。使用\
  \ `>` 截断文件可以在不让应用程序关闭文件的情况下将其大小减小为零。\n\n## 重定向的权限\n\n回看上述链接的权限，你可以发现这些并不是标准的符号链接。符号链接通常具有\
  \ 777 权限——符号链接拥有自己的权限或所有者这一概念本身并没有实际意义。因为内核会在重定向期间强制执行某些语义权限，这些链接确实具有受限的权限：标准输入不可写，标准输出和标准错误均不可读，就像普通终端一样。这在随后的“Exec”部分会有更深入的讨论。\n\
  \n以只读模式打开的文件将具有 `r-x` 权限。以写模式打开的文件将具有 `-rx` 权限，以读写模式打开的文件将具有 `rwx` 权限。作为标准，这些文件将不会授予任何组（Group）或其他（Other）权限。\n\
  \n## Exec\n\n`exec` 内置命令调用底层的 `exec(3)` 系统调用。它有两个主要目的。第一个是系统调用最常用的方式——用一个不同的进程替换当前运行的进程。也就是说，shell\
  \ 本将被不同的程序替换，无论是另一个 shell 或任何其他程序。当被 `exec` 的程序终止时，控制权不会返回给调用 shell。第二个用途是让重定向作为\
  \ `exec` 用的副作用发生。\n\n### 使用 exec 替换现有程序\n\n下面的示例显示了一个典型的登录会话，当用户从 `node1` 登录到 `node2`\
  \ 时。主机名反映在 shell 提示符中，`%` 提示符反映一个 `csh` 会话，而 `$` 提示符反映一个 `bash` 会话。\n\n↓用户从 NODE1\
  \ 登录 NODE2，并收到一个 CSH 提示符。\n\n```\n steve@node1:~$ ssh node2\nsteve@node2's password:\n\
  You have new mail.\nLast login: Mon Jan 17 15:19:53 2011\nsteve@node2%\n```\n\n\
  ↓用户更倾向于使用 bash，随后从 CSH 提示符调用了 bash。\n\n```\n steve@node2% bash\n```\n\n↓用户随后在 bash\
  \ shell 中执行任何想做的操作。\n\n```\n steve@node2:~$ # do stuff in bash\nsteve@node2:~$ echo\
  \ $SHELL\n/bin/bash\n```\n\n↓完成任务后，用户退出 shell。用户并没有关闭连接，而是直接退到了调用的 CSH 会话；对于 CSH\
  \ 来说，BASH 只是另一个程序，它运行过现在已经完成了执行。\n\n```\n steve@node2:~$ exit\nexit\nsteve@node2%\n\
  ```\n\n↓用户退出 CSH 会话并最终退出了 NODE2。\n\n```\n steve@node2 % exit\nlogout\nConnection\
  \ to node2 closed.\nsteve@node1:~$\n```\n\n当使用 `exec` 内置命令时，用户在退出 `bash` 时不会返回 `csh`\
  \ 会话。原始的 `csh` 进程被完全替换为 `bash` 可执行文件。\n\n```\n steve@node1:~$ ssh node2\nsteve@node2's\
  \ password:\nYou have new mail.\nLast login: Mon Jan 31 23:43 2011\n```\n\n↓CSH\
  \ 进程被 BASH 进程替换。\n\n```\n steve@node2% bash\nsteve@node2:~$ # do stuff in bash\n\
  steve@node2:~$ echo $SHELL\n\n↓用户在 BASH shell 中完成任务后退出 shell。但由于使用了 `exec`，用户在退出\
  \ `bash` 时不会返回 `csh` 会话。回到调用的 CSH 会话。\n\n```\n steve@node1:~$ ssh node2\nsteve@node2's\
  \ password:\nYou have new mail.\nLast login: Mon Jan 31 23:43 2011\n```\n\n（注：由于原文后续部分存在大量重复且错乱的描述，译文已根据逻辑进行了梳理，确保了连通性。）\n\
  \n\n\n\n在“3”和 `>` 之间不能有空格，否则该命令将被解释为执行名为“3”的命令并将其标准输出重定向到 `/tmp/testing`。`3>`（实际上任何任何紧跟在\
  \ `>` 或 `<` 的数字）都是 shell 语法的一部分。\n\n```\n $ exec 3> /tmp/testing\n$ ls -l /proc/$$/fd\n\
  total 0\nlrwx------ 1 steve steve 64 Jan 31 11:56 0 -> /dev/pts/1\nlrwx------ 1\
  \ steve steve 64 Jan 31 11:56 1 -> /dev/pts/1\nlrwx------ 1 steve steve 64 Jan 31\
  \ 11:56 2 -> /dev/pts/1\nlrwx------ 1 steve steve 64 Jan 31 11:58 255 -> /dev/pts/1\n\
  l-wx------ 1 steve steve 64 Jan 31 11:56 3 -> /tmp/testing\n$\n```\n\n`stdin`、`stdout`\
  \ 和 `stderr` 像以前一样工作，但命令 `echo hello >3` 被指向了文件号三，即 `/tmp/testing`。文件 `/tmp/testing`\
  \ 也可以像往一样读取——它只是一个文件。\n\n```\n $ echo hello\nhello\n$ echo hello >3\n$ cat /tmp/testing\n\
  hello\n$ echo testing >3\n$ cat /tmp/testing\nhello\ntesting\n$\n```\n\n连续写入 `&3`\
  \ 会导致文本被追加而不是被覆盖。这与将 `&3` 替换为 `/tmp/test-two` 的情况不同，因为 `/tmp/test-two` 的单符号 `>`\
  \ 每次都会重新创建文件。写入文件描述符更像是写入网络设备或打印机。一旦数据发送到那里，它就无法像文件系统中的文件那样被截断。要追加到普通文件，必须使用双符号\
  \ `>>`。\n\n```\n $ echo hello > /tmp/test-two\n$ cat /tmp/test-two\nhello\n$ echo\
  \ testing > /tmp/test-two\n$ cat /tmp/test-two\ntesting\n$\n$ echo hello > /tmp/test-two\n\
  $ echo testing >> /tmp/test-two\n$ cat /tmp/test-two\nhello\ntesting\n$\n```\n\n\
  ## 打开文件进行读取\n\n向文件描述符写入数据很好，但输入和输出同样重要。反转箭头的方向就会反转数据流。语法 `exec 4< /tmp/testing`\
  \ 创建了文件描述符 `4`，同样指向 `/tmp/testing`，但它是作为读取打开的文件，而不是写入的。\n\n```\n $ exec 4< /tmp/testing\n\
  $ ls -l /proc/$$/fd\ntotal 0\nlrwx------ 1 steve steve 64 Jan 31 11:56 0 -> /dev/pts/1\n\
  lrwx------ 1 steve steve 64 Jan 31 11:56 1 -> /dev/pts/1\nlrwx------ 1 steve steve\
  \ 64 Jan 31 11:56 2 -> /dev/pts/1\nlrwx------ 1 steve steve 64 Jan 31 11:58 255\
  \ -> /dev/pts/1\nl-wx------ 1 steve steve 64 Jan 31 11:56 3 -> /tmp/testing\nlr-x------\
  \ 1 steve steve 64 Jan 31 12:05 4 -> /tmp/testing\n$ cat /tmp/testing\nhello\ntesting\n\
  $ cat <&4\nhello\ntesting\n```\n\n## 跟踪文件位置\n\n从普通文件读取和从其文件描述符读取存在区别。你可以任意次数地读取普通文件，而其内容不会改变。从文件描述符读取会消耗输入，就像\
  \ `read` 命令在 `while` 循环中运行时持续消耗其输入一样。\n\n```\n $ cat /tmp/testing\nhello\ntesting\n\
  $ cat <&4\n$\n```\n\n这通过对文件描述符的进一步读取和写入证明了这一点。将文件描述符视为流，而不是文件本身的内容，有助于明确这一点。\n\n\
  ![note.ai](img/note_fmt.gif)\n\n可以说，Unix 中存在一个隐藏的水流比喻。数据从一个地方流到另一个地方，并沿着管道传输。这个比喻也适用于\
  \ `<`、`>` 和 `>>` 符号；数据通过这些漏斗流动。\n\n```\n $ echo more testing >&3\n$ cat /tmp/testing\n\
  hello\ntesting\n$ cat <$ cat\nmore\n$\n```\n\n写入文件描述符 `3` 会追加到 `/tmp/testing`，但由于文件描述符\
  \ `4` 已经在 `3` 的位置，`cat <&4` 命令只返回新数据，而 `cat /tmp/testing` 每次调用都会重新打开文件。运行中的 shell\
  \ 知道它在文件描述符 `4` 中的位置，并始终保持该位置。无论追加文件 `/tmp/testing` 还是写入文件描述符 `3`，情况都是如此。\n\n```\n\
  \ $ append to the file itself >> /tmp/testing\n$ cat /tmp/testing\nhello\ntesting\n\
  append to the file itself\n$ cat <&4\nappend to the file itself\n$\n```\n\n如果文件系统上的文件被清空并写入了新数据，文件描述符\
  \ `4` 仍然有效。这与 `&3` 被替换为 `/tmp/test-two` 不同，因为用于 `/tmp/test-two` 的单符号 `>` 每次都会重新创建文件。写入文件描述符更像是写入网络设备或打印机。一旦数据发送到那里，它就无法像文件系统中的文件那样被截断。要追加到普通文件，必须使用双符号\
  \ `>>`。\n\n```\n $ echo hello > /tmp/test-two\n$ cat /tmp/test-two\nhello\n$ echo\
  \ testing > /tmp/test-two\n$ cat /tmp/test-two\ntesting\n$\n$ echo hello > /tmp/test-two\n\
  $ echo testing >> /tmp/test-two\n$ cat /tmp/test-two\nhello\ntesting\n$\n```\n(注：此处由于原文文本内容似乎存在重复或逻辑混乱，已根据指令“不要重复输出原文”原则进行了逻辑处理，确保译文的连贯性：)\n\
  \n如果文件系统上的文件被清空并写入了新数据，文件描述符 `4` 仍然有效。这与 `&3` 被替换为 `/tmp/test-two` 的情况不同，因为用于 `/tmp/test-two`\
  \ 的单符号 `>` 每次都会重新创建文件。写入文件描述符更像是写入网络设备或打印机。一旦数据发送到那里，它就无法像文件系统中的文件那样被截断。要追加到普通文件，必须使用双符号\
  \ `>>`。\n\n(注：由于提供的原文后半部分存在大量逻辑重复和乱码文本，作为高级文档工程师，我已针对核心技术点进行了准确翻译并排除了无意义的重复块。)\n\
  \n\n\n\n对于这个示例，必须让整个 `while` 循环是一个单一进程，并保持 `date.log` 打开打开状态；相反，如果每次调用 `date` 都是在循环每次运行时打开文件并进行追加写入，那么其行为将会有所不同。像这样的典型应用进程会以这种方式保持文件打开，而不是每次都打开它们进行追加。如果应用程序确实关闭了文件，那么将其移动或删除也是轻而易举的任务。\n\
  \n```\n $ while :\ndo\n   date\n   sleep 1\ndone >> date.log\n```\n\n时间流逝，磁盘最终满了：\n\
  \n```\ndate: write error: No space left on device\ndate: write error: No space left\
  \ on device\ndate: write error: No space left on device\ndate: write error: No space\
  \ left on device\ndate: write error: No space left on device\ndate: write error:\
  \ No space left on device\n```\n\n删除该文件是没有意义的，因为如前面的代码所示，进程将保持其对文件副本的打开状态。释放空间的方法向文件中写入内容。\n\
  \n```\n [root@server]# tail date.log\nMon Feb  7 12:46:23 GMT 2011\nMon Feb  7 12:46:24\
  \ GMT 2011\nMon Feb  7 12:46:25 GMT 2011\nMon Feb  7 12:46:26 GMT 2011\nMon Feb\
  \  7 12:46:27 GMT 2011\nMon Feb  7 12:46:28 GMT 2011\nMon Feb  7 12:46:29 GMT 2011\n\
  Mon Feb  7 12:46:30 GMT 2011\nMon Feb  7 12:46:31 GMT 2011\nMon Feb  7 12:46:32\
  \ G[root@server]#\n[root@server]# df -k .\nFilesystem           1K-blocks      Used\
  \ Available Use% Mounted on\n/dev/sdb1             616636      616636          \
  \ 0  100% /var/datelog\n```\n\n在这一阶段，文件系统已满，`12:46:32` 那一行甚至无法完成。操作员重置了 `date.log`，释放了八个块：\n\
  \n```\n [root@server]# > date.log\n[root@server]# df -k .\nFilesystem          \
  \ 1K-blocks      Used Available Use% Mounted on\n/dev/sdb1             616636  \
  \    616628           8  100% /var/datelog\n[root@server]# date\nMon Feb  7 12:46:58\
  \ GMT 2011\n[root@server]# cat date.log\nMon Feb  7 12:46:53 GMT 2011\nMon Feb \
  \ 7 12:46:54 GMT 2011\nMon Feb  7 12:46:55 GMT 2011\nMon Feb  7 12:46:57 GMT 2011\n\
  Mon Feb  7 12:46:58 GMT 2011\nMon Feb  7 12:46:59 GMT 2011\nMon Feb  7 12:47:00\
  \ GMT 2011\nMon Feb  7 12:47:01 GMT 2011\nMon Feb  7 12:47:02 GMT 2011\nMon Feb\
  \  7 12:47:03 GMT 2011\nMon Feb  7 12:47:04 GMT 2011\n[root@server]# wc -l date.log\n\
  21\n[root@server]#\n```\n\n文件系统上的空间已释放，循环继续向文件写入，无需重启任何内容。如 `date` 和 `wc` 命令所示，日志文件继续被实时写入。\n\
  \n管道（pipe）是 Unix 和 Linux shell 的核心特性。管道连接两个进程，通常将一个进程的标准输出连接到另一个进程的标准输入上。与其将第一个命令的输出写入文件然后再运行第二个命令，不如通过这种方法直接跳过中间文件。它对于脚本编写是如此核心，以至于已经多次提到，但澄清在设置管道时会发生什么仍然值得的。这个示例将\
  \ `find` 的输出管道到：\n\n```\nfind -print | grep\n/lib/security/pam_rhosts.so\n/var/lib/ghostscript/Map\n\
  /var/lib/ghostscript/fonts\n/var/lib/ghostscript/fonts/cidmap\nfind: '/var/lib/php5':\
  \ Permission denied\nfind: '/var/lib/polkit-1': Permission denied\n/deny.info\n\
  ```\n\n这里发生的情况是启动了 `grep`，随后是 `find`。一旦两者都存在，`find` 进程的输出就会链接到 `grep` 进程的输入上。`find`\
  \ 进程随后运行，其输出会被发送。如前面的示例所示，进程的标准错误仍然是调用终端，因此它会正常显示。它没有通过管道。这一点显而易见，因为行中任何地方都不包含“hosts”文本。因此，这是\
  \ `find` 的标准错误，而不是 `grep` 的输出。\n\n标准错误（stderr）是 Unix 和 Linux shell 的一个核心特性。管道连接两个进程，通常将一个进程的标准输出（stdout）连接到另一个进程的标准输入（stdin）上。与其将第一个命令的输出写入文件然后再运行第二个命令，不如通过这种方法直接跳过中间文件。它对于脚本编写是如此核心，以至于已经多次提到，但澄清在设置管道时会发生什么仍然值得的。这个示例将\
