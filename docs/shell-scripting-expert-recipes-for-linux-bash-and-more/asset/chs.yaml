  server$ md5sum /tmp/data.bin /bin/ls\nd265cc0520a9a43e5f07ccca453c94f5  /tmp/data.bin\n\
  d265cc0520a9a43e5f07ccca453c94f5  /bin/ls\n$\n```\n\n# nohup\n\n如果你（无论是交互式还是作为 shell\
  \ 脚本的一部分）希望一个进程运行完毕，而不因为你注销而被杀死，`nohup` 命令会通知 shell 忽略在控制终端注销系统时发送给它的任何“挂断”（`HUP`）信号。它仍然可以通过\
  \ `kill -9` 杀死，但如果网络故障导致你与系统的连接断开，或者你所连接的客户端崩溃，或者其他数百万原因之一导致连接中断，你的进程将继续运行。\n\n\
  这对于在远程服务器上执行耗时长的命令，甚至在多个远程服务器上并行执行命令非常有用。无论使用自动化工具还是简单的 `ssh` 命令序列，你都可以登录到机器，运行\
  \ `nohup /path/to/somecommand &` 然后再次注销。`&` 将命令放在后台；通常情况下，如果你不需要等待命令执行的结果，那么将其作为后台进程运行是有意义的。这也意味着你拿回了\
  \ shell 提示符，以便你可以注销。\n\n默认情况下，进程需要读取的任何输入将从 `/dev/null` 重定向，输出和错误将写入当前目录下的文件 `nohup.out`\
  \ 中。如果 `stdout` 和 `stderr` 都重定向到其他地方，则不会创建 `nohup.out`。这个配方只是在后台启动了一个长时间运行的命令并返回菜单。在后台作业完成之前，文件数量似乎保持不变；如果直接写入\
  \ `$thefile`，将会看到数量随时间推移而增加，直到作业完成。如果此会话因任何原因被终止，`find` 将继续运行，这样菜单的下一个用户将获得最新的正确答案，而不是部分答案。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```\n # cat menu.sh\n#!/bin/bash\nthefile=/var/log/filelisting.dat\n\
  tempfile='mktemp'\nselect task in count recreate\ndo\n  case $REPLY in\n    1) wc\
  \ -l $thefile ;;\n    2) echo \"Recreating the index. It will be ready in a few\
  \ minutes.\"\n      (nohup find / -print > $tempfile 2>&1 ; mv $tempfile $thefile)\
  \ & ;;\n  esac\ndone\n# ./menu.sh\n1) count\n2) recreate\n#? 1\n895992 /var/log/filelisting.dat\n\
  #? 2\nRecreating the index. It will be ready in a few minutes.\n#? 1\n895992 /var/log/filelisting.dat\n\
  #? 1\n915128 /var/log/filelisting.dat\n#?\n```\n\nmenu.sh\n\n# seq\n\n`seq` 按顺序显示数字，类似于某些\
  \ BASIC 语言实现实现 `for` 循环的方式，具有起始数字和结束数字，以及可选的步长。`seq` 还可以接受不同的 `printf` 类型格式，并自动填充输出，使每项都填充到使用的最大宽度。这对于固定宽列很有帮助，因为输出不需要从\
  \ 1 计数到 100，而是从 001 到 100。\n\n## 整数序列\n\n以下脚本使用了两个 `seq` 语句。外层循环使用 `seq 10 10 40`\
  \ 为 `for` 循环提供输入。`seq 10 10 40` 以 10 为增量从 10 计数到 40。这些子网分别是 `192.168.10.0/24`、`192.168.20.0/24`、`192.168.30.0/24`\
  \ 和 `192.168.40.0/24`分别用于生产（Production）、备份（Backup）、应用（Application）和心跳（Heartbeat）。\n\
  \n![note.ai](img/note_fmt.gif)\n\n`/24` 表示前 24 位（3 个 8 位字节，即 `192.168.10`、`192.168.20`\
  \ 等）是地址的网络部分。这留下了最后一个字节作为主机地址，即地址中标识该网络上特定主机的部分。\n\n内层循环从 30 计数到 35，因为这六个节点在每个网络上使用相同主机地址。它们的主机也与其主机地址绑定，因此\
  \ `node030` 也被称为 `node030-prod`、`node030-bkp`、`node030-app` 和 `node030-hb`，取决于使用哪个网络访问它。对于生产网络，原始名称\
  \ `node030` 也与该地址相关。内部网络中简单的 `if` 语句处理了这个问题，在输出中添加了额外的名称。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\n $ cat hosts.sh\n#!/bin/bash\nfor subnet in 'seq 10 10 40'\ndo\n  case $subnet\
  \ in\n    10) suffix=prod\n      description=Production ;;\n    20) suffix=bkp\n\
  \      description=Backup ;;\n    30) suffix=app\n      description=Application\
  \ ;;\n    40) suffix=hb\n      description=Heartbeat ;;\n  esac\n  cat << EOF >\
  \ /tmp/hosts.$subnet\nSubnet 192.168.${subnet}.0/24\nThis is the $description subnet.\n\
  EOF\n  for address in'seq 30 35'\n  do\n    # For Production network, also add raw\
  \ name\n    if [ \"$suffix\" == \"prod\" ]; then\n      printf \"192.168.%d.%d\\\
  tnode%0d-%s\\n\" $subnet $address $suffix >> /tmp/hosts.$subnet\n    else\n    \
  \  printf \"192.168.%d.%d\\tnode%0d-%s\\n\" $subnet $address $suffix >> /tmp/hosts.$subnet\n\
  \    fi\n  done\n  cat /tmp/hosts.$subnet\ndone\n$ ./hosts.sh\n# Subnet 192.168.10.0/24\n\
  # This is the Production subnet.\n192.168.10.30  node030-prod\n192.168.10.31  node031-prod\n\
  192.168.10.32  node032-prod\n192.168.10.33  node033-prod\n192.168.10.34  node034-prod\n\
  192.168.10.35  node035-prod\n# Subnet 192.168.20.0/24\n# This is the Backup subnet.\n\
  192.168.20.30  node030-bkp\n192.168.20.31  node031-bkp\n192.168.20.32  node032-bkp\n\
  192.168.20.33  node033-bkp\n192.168.20.34  node034-bkp\n192.168.20.35  node035-bkp\n\
  # Subnet 192.168.30.0/24\n# This is the Application subnet.\n192.168.30.30  node030-app\n\
  192.168.30.31  node031-app\n192.168.30.32  node032-app\n192.168.30.33  node033-app\n\
  192.168.30.34  node034-app\n192.168.30.35  node035-app\n# Subnet 192.168.40.0/24\n\
  # This is the Heartbeat subnet.\n192.168.40.30  node030-hb\n192.168.40.31  node031-hb\n\
  192.168.40.32  node032-hb\n192.168.40.33  node033-hb\n192.168.40.34  node034-hb\n\
  192.168.40.35  node035-hb\n```\n\nhosts.sh\n\n## 浮点序列\n\n`seq` 不仅适用于整数。这个简单的脚本显示了英数的分。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```\n $ cat miles.sh\n#!/bin/bash\n#\
  \ 1m ~= 1.609 km\nfor miles in'seq 1 0.25 5'\ndo\n  km='echo \"scale=2; $miles *\
  \ 1.609\" | bc'\n  printf \"%0.2f miles is %0.2f kilometers\\n\" $miles $km\ndone\n\
  $ ./miles.sh\n1.00 miles is 1.61 kilometers\n1.25 miles is 2.01 kilometers\n1.50\
  \ miles is 2.41 kilometers\n1.75 miles is 2.82 kilometers\n2.00 miles is 3.22 kilometers\n\
  2.25 miles is 3.62 kilometers\n2.50 miles is 4.02 kilometers\n2.75 miles is 4.42\
  \ kilometers\n3.00 miles is 4.83 kilometers\n3.25 miles is 5.23 kilometers\n3.50\
  \ miles is 5.63 kilometers\n3.75 miles is 6.03 kilometers\n4.00 miles is 6.44 kilometers\n\
  4.25 miles is 6.84 kilometers\n4.50 miles is 7.24 kilometers\n4.75 miles is 7.64\
  \ kilometers\n5.00 miles is 8.05 kilometers\n$\n```\n\nmiles.sh\n\nsleep\n\n正如本书中广泛使用的那样，`sleep`\
  \ 和 `date` 结合使用可以提供宝贵的调试信息。GNU 的实现还可以接受小数分数，以及后缀 m（分钟）、h（小时）和 d（天）。通过在脚本中插入 `sleep`\
  \ 语句，你可以有效地在那个阶段暂停执行并查看正在发生什么。本章节稍后的超时部分充分利用了 `sleep` 命令来模拟应用程序关闭脚本的不同场景。\n\n\n\n\
  \n\n`sleep` 的另一个常见用途是在循环中；要每分钟执行一次一组命令，使用简单的 `sleep 60` 比在 `cron` 中调度任务要简单得多。在 `cron`\
  \ 中实现每 90 秒运行一次任务要困难得多，但同样，`sleep` 语句完美适合这项任务。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\n $ cat memory.sh\n#!/bin/bash\nLOGFILE=/var/tmp/memory.txt\nwhile :\ndo\n\
  \  RAM='grep MemFree /proc/meminfo | awk '{ print $2 }'\n  echo \"At 'date +%H:%M\
  \ on %d %b %Y' there is $RAM Kb free on 'hostname -s'\" \\\n        |tee -a $LOGFILE\n\
  \  sleep 60\ndone\n$ ./memory.sh\nAt 12:45 on 25 Mar 2011 there is 500896 Kb free\
  \ on goldie\nAt 12:46 on 25 Mar 2011 there is 441336 Kb free on goldie\nAt 12:47\
  \ on 25 Mar 2011 there is 213736 Kb free on goldie\nAt 12:48 on 25 Mar 2011 there\
  \ is 82936 Kb free on goldie\nAt 12:49 on 25 Mar 2011 there is 96996 Kb free on\
  \ goldie\nAt 12:50 on 25 Mar 2011 there is 87240 Kb free on goldie\nAt 12:51 on\
  \ 25 Mar 2011 there is 493826 Kb free on goldie\n```\n\n`memory.sh`\n\n`sleep` 经常被忽视，但它是那种没有它就无法工作的微小工具。GNU\
  \ 扩展让它变得稍微易于了一些；`sleep 1h` 比 `sleep 3600` 更具可读性；`sleep 2d` 比 `sleep 172800` 更容易理解。支持秒级睡眠的能力可能并不十分有用，因为在没有实时操作系统的情况下，`sleep`\
  \ 唯一能保证的是不会在请求的时间之前返回（除非被杀掉）。书中后面的食谱 17-1 确实利用亚秒级睡眠来加快游戏进程运行。\n\n### timeout\n\n\
  `read` 和 `select` 命令遵循变量 `TMOUT`，该变量定义了等待交互式输入的最大秒数。其他命令没有内置此功能，但它可以是一项关键特性，特别是对于脚本化操作。这个简单的脚本对于演示\
  \ `timeout` 的作用很有用，因为它并不总是按照你预期的那样执行。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\n $ cat longcmd.sh\n#!/bin/bash\ntrap 'echo \"'date': ouch!\"' 15\necho \"\
  'date': Starting\"\nsleep 20\necho \"'date': Stage Two\"\nsleep 20\necho \"'date':\
  \ Finished\"\n```\n\n`longcmd.sh`\n\n在第一次运行时，`-s 15 3` 告诉 `timeout` 在 3 秒后向脚本发送\
  \ `SIGTERM`（信号 15）。这个信号被脚本捕获了，但它的效果是杀死第一个 `sleep` 命令。因此，在启动 3 秒后，即 13:33:46，脚本在处理捕获时显示了\
  \ `ouch!` 消息。执行继续脚本中的下一个命令，该命令输出日期（仍为 13:33:46），睡眠 20 秒，并在 13:34:06 结束。\n\n```\n\
  \ $ timeout -s 15 3 ./longcmd.sh ; date\nThu Mar 24 13:33:43 GMT 2011: Starting\n\
  Terminated\nThu Mar 24 13:33:46 GMT 2011: ouch!\nThu Mar 24 13:33:46 GMT 2011: Stage\
  \ Two\nThu Mar 24 13:34:06 GMT 2011: Finished\nThu Mar 24 13:34:06 GMT 2011\n```\n\
  \n![warning.ai](img/warning_fmt.gif)\n\nGNU coreutils 直到 7 版本才包含 `timeout` 工具。在此之前，许多发行版都包含了一个来自\
  \ The Coroner’s Toolkit 的 `timeout` 工具。`timeout` 命令是确保进程不会永久运行的重要方法。使用 `-s` 标志允许你指定信号，否则它将发送\
  \ `SIGTERM`。\n\n\n\n\n\n```bash\n $ cat /etc/init.d/myapp.sh\n#!/bin/bash\nfunction\
  \ killapp\n{\n  # if we get here, the application refused to shut down.\n  kill\
  \ -9 'cat /var/run/myapp.pid'\n}\ncase $1 in\n  start)\n        echo \"Starting\
  \ myap...\"\n        /usr/local/bin/myapp &\n        echo $! > /var/run/myapp.pid\n\
  \        ;;\n  stop)\n        echo \"Stopping myapp...\"\n        timeout -s 15\
  \ -k 10 20 /usr/local/bin/stop.myapp\n        res=$?\n        echo \"'date': myapp\
  \ returned with exit code $res\" >> /var/log/myapp.log\n        case \"$res\" in\n\
  \          0)   echo \"NOTE: myapp stopped by itself.\" ;;\n          124) echo\
  \ \"NOTE: myapp timed out when stopping.\" \n               killapp ;;\n       \
  \   137) echo \"NOTE: myapp was killed when timing out.\" \n               killapp\
  \ ;;\n          *)   echo \"Note: myapp exited with return code $res\" ;;\n    \
  \    esac\n        rm -f /var/run/myapp.pid\n        ;;\n  *)\n        echo \"Usage:\
  \ 'basename $0' start | stop\"\n        exit 2\nesac\n```\n\n### myapp.sh\n\n![download.eps](img/download_fmt.gif)\n\
  \n```bash\n $ cat /usr/local/bin/stop.myapp\n#!/bin/bash\ntrap may_die 1 3 9 15\n\
  function may_die\n{\n  SLEEP='expr $RANDOM % 20'\n  echo \"Sleeping for $SLEEP seconds\
  \ (but you don't know that)\"\n  sleep $SLEEP && exit 10\n}\nTIME='expr $RANDOM\
  \ % 50'\necho \"STOPPING MYAPP. (likely to take $TIME seconds, but you don't know\
  \ that!)\"\nfor i in 'seq 1 $TIME'\ndo\n  echo -en \".\"\n  sleep 1\ndone\nexit\
  \ 20\n$\n```\n\n### stop.myapp\n\n一个 18 秒的关机过程不受超时限制的影响：\n\n```bash\n $ ./myapp.sh\
  \ stop\nStopping myapp...\nSTOPPING MYAPP. (likely to take 18 seconds, but you don't\
  \ know that!)\n..................Note: myapp exited with return code 20\n```\n\n\
  一个 44 秒的关机过程定会超时。因为后续的关机时间超过了允许的 10 秒，关机程序会被杀死：\n\n```bash\n $ ./myapp.sh stop\n\
  Stopping myapp...\nSTOPPING MYAPP. (likely to take 44 seconds, but you don't know\
  \ that!)\n....................Terminated\nSleeping for 11 seconds (but you don't\
  \ know that)\n./myapp.sh: line 3:  6071 Killed            timeout -s 15 -k 10 20\
  \ /usr/local/bin/stop.myapp\nNOTE: myapp was killed when timing out.\n```\n\n超时后接较短的退出仍会被记录为超时，但它避免了被强制杀死：\n\
  \n```bash\n $ ./myapp.sh stop\nStopping myapp...\nSTOPPING MYAPP. (likely to take\
  \ 26 seconds, but you don't know that!)\n................Terminated\nSleeping for\
  \ 2 seconds (but you don't know that)\nNOTE: myapp timed out.\n$\n```\n\n### 网络超时\n\
  \n上一节给出的第二个示例是一个依赖于系统外部因素的系统或进程，例如从远程服务器下载内容。如果该服务器或到它的网络很慢，脚本本身无法为此做什么，但可以使用 `timeout`\
  \ 来管理该情况。例如，如果预期的传输时间为 10 秒，如果传输在分钟后未完成，可以使用 `timeout` 来终止传输。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```bash\n $ cat downloader.sh\n#!/bin/bash\nfor file in file1.zip file2.zip file3.zip\n\
  do\n  timeout -s 9 60 wget http://unreliable.example.com/${file}\n  if [ \"$?\"\
  \ -ne \"0\" ]; then\n    echo \"An error occurred when downloading $file\"\n  fi\n\
  done\n```\n\n### downloader.sh\n\n```bash\n $ downloader.sh\n--2011-03-25 13:06:58--\
  \ http://unreliable.example.com/file1.zip\nResolving unreliable.example.com... 192.0.32.10\n\
  Connecting to unreliable.example.com|192.0.32.10|80... connected.\nHTTP request\
  \ sent, awaiting response... 200\nLength: 84263304 (80M) [application/zip]\nSaving\
  \ to: 'unreliable.example.com/file1.zip'\n100%======================> 84,263,304\
  \ 9.8M/s in 8.0s\n2011-03-25 13:07:06 (9.8 MB/s) - 'unreliable.example.com/file1.zip'\
  \ saved [84263304/84263304]\n--2011-03-25 13:07:06-- http://unreliable.example.com/file2.zip\n\
  Resolving unreliable.example.com... 192.0.32.10\nConnecting to unreliable.example.com|192.0.32.10|80...\
  \ connected.\nHTTP request sent, awaiting response... 200\nLength: 413396910 (394M)\
  \ [application/zip]\nSaving to: 'unreliable.example.com/file2.zip'\n59%======================>\
  \ 245,297,152 36.9M/s eta 6s\n./downloader.sh: line 3:  3482 Killed            timeout\
  \ -s 9 60 http://unreliable.example.com/${file}\nAn error occurred when downloading\
  \ file2.zip\n--2011-03-25 13:08:07-- http://unreliable.example.com/file3.zip\nResolving\
  \ unreliable.example.com... 192.0.32.10\nConnecting to unreliable.example.com|192.0.32.10|80...\
  \ connected.\nHTTP request sent, awaiting response... 200\nLength: 701084434 (669M)\
  \ [application/zip]\nSaving to: 'unreliable.example.com/file3.zip'\n17%[=====> \
  \                         ] 121,831,424 22.0M/s\n./downloader.sh: line 3:  3482\
  \ Killed            timeout -s 9 60 http://unreliable.example.com/${file}\nAn error\
  \ occurred when downloading file3.zip\n```\n\n\n\n\n\n`uuencode` 是 `sharutils` 软件包的一部分，它能将二进制文件编码，使其适合作为电子邮件附件进行传输。由于电子邮件是基于文本的协议，某些二进制字符可能会破坏电子邮件本身，因此将其编码为\
  \ 7 位的安全文本编码可以确保邮件能够顺利通过。收件者的邮件客户端应该检测到该格式，并将附件显示为附件，而不是邮件正文的一部分。`uuencode` 有点特殊之处在于，尽管它可以从\
  \ `stdin` 或文件读取，但当仅将文件名作为参数传递给它时，它仍然假设它将从 `stdin` 接收数据。它接收的最后一个（在此例中是唯一的）文件名将用作所附件文件的名称。在处理\
  \ `stdin` 时，这是合理的；文件没有名称，但收件者需要一个名称才能保存或打开它。因此，在处理文件时，通常最好提供两次文件名。第一个是文件名，第二个是收件者接收时的名称。头部如如下例所示。前三个单词是“begin”，然后是文件的八进制权限（在电子邮件附件中并不大用），最后是呈现给收件者的文件名。在这里，本地文件\
  \ `sample.odt` 将作为 `recipient.odt` 发送。\n\n```\n $ uuencode sample.odt recipient.odt\
  \ | head\nbegin 664 recipient.odt\nM4$L#!!0'''@''$&3<SY>QC(,)P'''\"<''''('''';6EM971Y<&5A<'!L:6-A\n\
  M=&EO;B]V;F0N;V%S:7,N;W!E;F1O8W5M96YT+G1E>'102P,$%''(\"'@'09-S\nM/@''''''''''''''''L'''!C;VYT96YT+GAM;*5778_B-A1][Z^(LM*^&0]#\n\
  M5UK2@56KJFJEF:K:H=6^>FP'K/57;4/@W_?:(28P9\"85$@+%]]P/GWM\\'1Z^\nM[)4L=MQY8?2BG$[NRH)K:IC0ZT7Y]^HW]+G\\\
  LOSAP=2UH+QBAFX5UP%1HP/\\\nM%N\"M?=5:%⁷⁶Z<H0+WREB>*^\"K0RENO.J^JCJY2K7?'A($>[)W#?._!]&.L<\n\
  ML6>^Y&5\\Y@3N>S-'FK'.$0ND]MUK,]9Y[R6J#;\"N+'GBHHJ]%/K[HMR$8\"N,\nMFZ:9-+.)<6L\\\
  G<_G.%ESP33C[-;)A&(4<\\EC,H^GDRGNL(H',K:^B.V7I+?J\nMA;O1U)!'7G75[]:C%;%;#U!#-\\\
  2-UD8\"G[WQL:W=\\ZJ$S4!//N,O\n```\n\nLibreOffice 文档难以管理的二进制数据现在已安全地编码为可打印（如果是人类可读的！）7\
  \ 位文本。这可以附加邮件正文中发送给收件者。在这里，我通过显示消息（“Here is the document wanted. Regards, Steve”）并在子壳中运行\
  \ `uuencode` 来给自己发送文档，其输出作为单个文本流通过管道传递给 `mailx` 命令。\n\n```\n sender$ echo \"Here\
  \ is the document wanted.\";\n> echo \"Regards, Steve.\";\n> uuencode sample.odt\
  \ document.odt ) |\n> mailx -s\"Document attached\" steve@steve-parker.org\nsender$\n\
  ```\n\n配置机器发送电子邮件只需设置 `mailhost.example.com`（其中 `mailhost.example.com` 是你内部电子邮件服务器的名称）即可。如果本地机器已正确配置发送电子邮件，则此消息将被发送。只要语法正确，`mailx`\
  \ 命令就会返回成功；它无法检测传输过程中的任何问题。你需要检查这一点。收到的电子邮件如图 14-6 所示。\n\n### xargs\n\n当调用一个带有许多参数（通常是文件名）的命令时，内核必须将这些数据存放在某处供命令引用。有时（通常使用\
  \ `find` 命令遍历大型文件系统），此列表会超过内核允许的长度。这会导致诸如“rm: Argument list long”之类的信息。许多人已经习惯了这一点，并知道解决办法是使用\
  \ `xargs`，但并不是所有人都理解它的工作原理，这可能会产生一些影响。\n\n```\n $ rm 'find . -name \"*.core*\" -print'\n\
  bash: /bin/rm: Argument list long\n$ find . -name \"*.core*\" -print | xargs -0\
  \ rm\n$\n```\n\n为了解决这个问题，`xargs` 会读取其标准输入（没有这种限制），并将这些以可管理的分块传递给被告知要传递的命令。这个简单的\
  \ `listfiles` 脚本显示了这对正在运行命令的影响。在这里，`-L 3` 选项告诉 `xargs` 将输入分成每次调用三个文件。这并不是每个人认为的\
  \ `xargs` 工作方式，因此结果可能会令人意料。\n\n```\n $ cat listfiles\n#!/bin/bash\necho \"Listfiles\
  \ (PID $$) was called with $# arguments:\"\ni=1\nwhile [ -a \"$1\" ]\ndo\n  echo\
  \ \"${i}: $1\"\n  ((i++))\n  shift\ndone\n\nlistfiles\n\n```\n $ find . -print\n\
  .\n./etc\n./etc/hosts\n./etc/config.txt\n./bin\n./bin/ls\n./sh\n./listfiles\n$ find\
  \ . -print | xargs -L 3 ./listfiles\n\nListfiles (PID 17088) was called with 3 arguments:\n\
  1: .\n2: ./etc\n3: ./etc/hosts\nListfiles (PID 17089) was called with 3 arguments:\n\
  1: ./etc/config.txt\n2: ./bin\n3: ./bin/ls\nListfiles (PID 17090) was called with\
  \ 2 arguments:\n1: ./sh\n2: ./listfiles\n$\n```\n\n`find` 命令的前三个结果作为三个参数传递给 `listfiles`：\n\
  \n1. .\n2. ./etc\n3. ./etc/hosts\n\n接下来的三个文件传递给 `listfiles` 的另一个实例，因为其 PID 不同。最后只剩下两个文件，它们被传递给\
  \ `listfiles` 的最后调用。在文件名开始包含空格字符之前，这种方法是良好的。\n\n```\n $ find . -print\n.\n./My Photos\n\
  ./My Photos/DCIM001.jpg\n./My Photos/DCIM002.jpg\n./My Documents\n./My Documents/doc1.doc\n\
  ./etc\n./etc/hosts\n./etc/config.txt\n./bin\n./bin/ls\n./sh\n./listfiles\n$ find\
  \ . -print | xargs -L 3 ./listfiles\nListfiles (PID 17129) was called with 3 arguments:\n\
  1: .\n2: ./My Photos\n3: ./My Photos/DCIM001.jpg\nListfiles (PID 17130) was called\
  \ with 3 arguments:\n1: ./My Photos/DCIM002.jpg\n2: ./My Documents\n3: ./My Documents/doc1.doc\n\
  Listfiles (PID 17131) was called with 3 arguments:\n1: ./My Documents/cv.odt\n2:\
  \ ./etc\n3: ./etc/hosts\nListfiles (PID 17132) was called with 3 arguments:\n1:\
  \ ./etc/config.txt\n2: ./bin\n3: ./bin/ls\nListfiles (PID 17133) was called with\
  \ 2 arguments:\n1: ./sh\n2: ./listfiles\n$\n```\n\n为了解决这种困惑，`xargs -0` 期望文件之间用 ASCII\
  \ 零字符分隔，并将任何类型的空白字符视为文件名的一部分。相应命令的 `find -print0` 和 `locate -0` 语法也支持这种方法。这种方法稳健得多，并且在默认情况下非常好。\n\
  \n这会将所有参数传递给命令，但某些命令希望以不同的方式将文件名传递给它们。如果你想在日志文件中搜索找到的文件，`grep -nw \"^${filename}$\"\
  ` /tmp/interesting 将要使用的命令；它将只搜索完整文件名的精确匹配。然而，这个命令并不完全所要求的：\n\n\n\n\n\n```\nfind\
  \ . -print0 | xargs -0 grep -n /tmp/interestingfiles\n```\n\n相反，文件名需要放在 `-n` 和 `/tmp/interestingfiles`\
  \ 之间。文件名的标准占位符是 `{}`，尽管可以通过 `-I` 标志进行更改。此命令行将文件名放在 `grep` 命令参数的相应部分。`xargs` 也足够智能能够推断出\
  \ `-L1`，因此每次调用 `grep` 时都只带一个文件名进行搜索。\n\n```\n$ cat /tmp/interestingfiles\n./bin/ls\n\
  ./My Documents/cv.odt\n./usr/bin/sleep\n$ find . -print0 | xargs -0 -I{} grep -nw\
  \ \"^{}$\" /tmp/interestingfiles\n2:./My Documents/cv.odt\n1:./bin/ls\n$\n```\n\n\
  ### yes\n\n许多工具（如 `fsck`）都有一个 `-y` 选项，用于对可能提出的所有问题回答“是”（yes）。良好的工具在编写时会使得对任何问题回答“是”基本上意味着相同的意思——无论是标记超级块为洁净还是删除索引节点，`fsck`\
  \ 的 `-y` 标志都表示它应该执行修复文件系统所需的任何操作。这对于脚本非常有用，因为这意味着它们不需要与用户交互。某些工具没有这个选项，而在交互式使用这些工具时，`yes`\
  \ 就很有用。`yes` 的作用是持续输出字母 `y`。这两个命令是等价的：\n\n```\n# fsck -y /dev/sdf1\n# yes | fsck\
  \ /dev/sdf1\n```\n\n![note.ai](img/note_fmt.gif)\n\n作为替代方案，`yes` 可以接受任何其他文本作为参数，并显示该文本。\n\
  \n`yes` 的一个初看可能并不太明显的用法是这个单行命令：\n\n```\n$ yes no | cp -i * /tmp\n```\n\n此命令将单词“no”传递给\
  \ `cp` 命令，当 `cp` 作为 `cp -i` 调用时，它会在覆盖文件之前总是进行查询。最终结果是现有文件将不会被替换，但其他文件将被复制到 `/tmp`。这并不经常需要，但至少它的看起来很有趣，而且偶尔也很有用。\n\
  \n## 总结\n\n系统管理需要精通复杂且相互关联的工具集。我希望本章介绍了这些工具在 Shell 脚本中使用的某些方法，以自动化常见的系统管理任务，使复杂任务变得更简单、快速且可重复，并帮助基本操作变得更加灵活实用。\n\
  \n本书的前几个部分涵盖了更多理论、概念以及 Unix 和 GNU/Linux 生态系统中特定工具和功能的工作原理。书的其余部分由配方（recipes）组成，重点关注任务本身以及如何以及为什么要某种方式执行它们。这些配方建立在之前介绍的知识和信息的基础上，构建了一系列可靠、实用的\
  \ Shell 脚本，这些脚本可以直接使用或根据特定用途进行修改。这些配方还提供了有用示例，说明了如何为了各种目的组合 Shell 的工具和功能。\n\n# 第三部分：系统管理配方\n\
  \n*   第 15 章：Shell 特性\n*   第 16 章：系统管理\n*   第 17 章：演示\n*   第 18 章：数据存储与检索\n*   第\
  \ 19 章：数字\n*   第 20 章：进程\n*   第 21 章：国际化\n\n## 第 15 章\n\n## Shell 特性\n\n本章探讨了三个特定任务：在任何\
  \ Linux 或 Unix 发行版上安装 init 脚本、报告已安装的 RPM 包以及一个 Kickstart 安装后脚本。\n\n第一个配方指处理移植性问题的一些技术。从这个配方中可能得到的最重要的点是它像“结构”部分概述的那样，被分为四个不同的步骤。尽管在确定发行版后立即将脚本复制到相关位置似乎更高效，但通过意识到这些是独立的任务并一次只执行一步，可以让代码具有更高的可维护性。\n\
  \n`RPM` 报告配方使用了第 9 章中的数组和第 7 章中一些复杂的变量结构来产生相当短的结果。Kickstart 安装后配方加载了库，并在此使用了在此文档（here\
  \ documents）和重定向来创建一个简单的环境。\n\n### 配方 15-1：安装 init 脚本\n\n此配方使用条件执行——`if`、`test`\
  \ 和 `case` 来确定如何自动启动进程。今天大多数 GNU/Linux 系统将 init 脚本安装到 `/etc/init.d`，但并非如此，而且实际上注册（如果有的话）和启动进程的方法在不同发行版之间不同。在第\
  \ 16 章配方 16-1“Init 脚本”中描述了 init 脚本本身。\n\n## 使用的技术\n\n*   `if`, `else`, `elif`\n\
  *   `case`\n*   `expression`\n\n## 概念\n\ninit 脚本是一个简单的 Shell 脚本，它在系统启动时启动服务，并在系统关机时干净地关闭。此配方用于通用的软件安装程序，以便在软件包管理系统之外安装软件时能够自动安装\
  \ init 脚本。\n\n## 潜在陷阱\n\n脚本本身存在几个陷阱；最糟糕的情况是在没有识别的情况下失败且没有向用户报告失败。此脚本确实对未能成功检测到的发行版做了猜测，但为它辩护的话，它确实显示了消息说明它正在做什么。遵循标准的\
  \ Unix 传统，它是一个非常安静的脚本，成功时完全沉默，只有在有需要警告用户的情况或发生严重错误时才显示消息。\n\n另一个更具体的陷阱是弄错了发行版的要求；这并不像听起来那么容易避免，因为有很多发行版可用，而且其中任何一个都可能出于任何原因改变它们的任何方式。较大、更稳定的发行版比其他发行版更不可能随意更改某些内容，但\
  \ Upstart 和 SMF 分别是 Ubuntu 和 Solaris 对系统启动设施的显著变化，而该设施在过去的几十年中一直保持稳定。此配方的结构专门设计用于防止此类问题随着时间的推移渗入脚本中。\n\
  \n## 结构\n\n\n\n\n\n此类脚本的结构对它的运行效果以及长期维护性具有非常大的影响。因为它是一个相当微不足的基础设施脚本，它不太可能获得与它负责启动的实际软件同水平的细节关注或质量控制。这甚至不是初始化脚本（init\
  \ script）；它只是一个用于安装初始化脚本的、一次性的临时脚本。显而易见的问题是：“既然如此，为什么要关心它的质量呢？”原因是，随着时间的推移，它会受到非常糟糕的对待，导致这类脚本变成丑陋且不可维护的代码块，很快变得难以管理且充满\
  \ Bug。这类脚本往往是添加对新发行版的支持会无意中破坏对另一个发行版的支持，修复代码的某部分会破坏另一部分。从开始就确定正确的结构意味着脚本在未来将具有灵活性和维护性，来修改代码的新开发者可以清楚他们应该做什么以及在哪里做。人们很可能会检测到（例如）Red\
  \ Hat 并立即将初始化脚本复制到 `/etc/init.d`，运行 `chkconfig` 然后就完事。这对于 Red Hat 确实有效，但它忽略了脚本还必须处理的更复杂的细微差别。\n\
  \n该脚本被分为四个不同的步骤：\n\n1. 确定发行版。\n2. 安装到相应的初始化目录。\n3. 注册服务。\n4. 启动服务。\n\n## 确定发行版\n\
  \n大多数发行版都提供了一种方便的方法来确定系统是否是由该特定的发行版提供的；这通常是 `/etc` 中的一个文件，该文件的存在即可确认发行版。该文件的内容通常通常会提供更详细的信息，例如，如果你依赖于\
  \ SuSE 10.0 及更高版本的某个功能，那么解析 `/etc/SuSE-release` 就能从程序上告知该功能是否应该可用。这一步只确定正在使用哪种发行版；其他特定发行版的工作不是在此阶段完成，而是在步骤\
  \ 2 中完成。这允许脚本将相似的发行版组合在一起执行该任务。\n\n在确定发行版时，`if` / `elif` / `elif` / `else` 结构是理想的，因为每个发行版可能有其自己的工作要做，无论是检查特定文件是否存在还是执行某些其他类似的处理任务。最后的\
  \ `else` 语句设置 `distro=unknown`，这对于随后的处理再次有用。\n\n## 安装到初始化目录\n\n确定发行版后，第二部分将根据发行版安装到相应的目录。对于许多现代\
  \ GNU/Linux 发行版，简单的 `init_dir=/etc/init.d` 就足够了，但其他一些也有自己的特殊之处。\n\n此阶段使用 `case`\
  \ 结构来遍历不同的可能的发行版。它还有一个通配符 `*` 子句，在未知发行版上，它将循环遍历各种常见的目录，如果发现其中一个目录存在，它将假设那里是安装初始化脚本的正确位置。这允许它表现出一点常识，这可能被证明是有用的。让用户知道这里进行了一些猜测是很重要的，因为如果猜测被证明是错误的，用户对问题可能出在哪里会有某种指示。\n\
  \n## 注册服务\n\n在启动服务之前，必须在系统中注册该服务。传统的做法是从 `/etc/init.d` 建立符号符号链接到 `rcN.d`，其中 `N`\
  \ 是要切换的运行级别（runlevel）。这些链接中的某些被称为 `SXXservice`，其中 `S` 代表 Start（启动），`XX` 是一个指示服务启动顺序的数字，从低到高。这些脚本将带有启动参数被调用。其他链接是\
  \ `KXXservice`，其中 `K` 代表 Kill（杀死），这些将带有停止参数调用，以便在重启机器或更改运行级别关闭服务。一些较新的 GNU/Linux\
  \ 发行版使用 `chkconfig`，它解析初始化脚本中的注释来确定所需的运行级别和启动顺序。\n\n## 启动服务\n\n最后一个动作是实际启动服务。对于许多\
  \ Linux 发行版，现在是 `chkconfig $service`；对于其他则涉及调用初始化脚本。如果脚本的第一个参数是 `-a`，则将 `autostart`\
  \ 变量设置为 `yes`。该变量在脚本开头定义作为 `getopt` 的简单替代方案。这是通过检查 `$1` 是否为 `-a` 实现的，如果是，则将 `service`\
  \ 设置为 `$2` 而不是 `$1`，并相应设置 `autostart`。对于脚本来说，使用 `$2` 用于 autostart 会更容易，但语法将不那么自然，且保持一致。\n\
  \n整个多行的 `case` 语句只有在 `[autostart == yes]` 测试成功时才会执行。此测试使用 shell 的 `cmd1 && cmd2`\
  \ 结构，其中 `cmd1` 实际上是 test（在第 5 章中讨论），而 `cmd2` 是测试成功时运行的命令。如果 `autostart` 设置为 `yes`，则将执行随后的\
  \ `case` 语句。否则，脚本执行将在 `esac`（`case` 语句的结束处）之后继续。\n\n## 配方\n\n![download](img/download.gif)\n\
  \n```bash\n#!/bin/bash\n# service 是初始化脚本的名字\n# 也是应用程序的名字。\nif [ \"$1\" == \"-a\"\
  \ ]; then\n  autostart=yes\n  service=$2\nelse\n  autostart=no\n  service=$1\nfi\n\
  distro=unknown\ninit_dir=unknown\nrc_dir=/etc/rc.d\n# Step 1: 确定发行版\nif [ -f /etc/redhat-release\
  \ ]; then\n  # 对于 Fedora 或 RHEL 也有效\n  distro=redhat\nelif [ -f /etc/debian_version\
  \ ]; then\n  # 对于 Ubuntu 也有效\n  distro=debian\nelif [ -f /etc/SuSE-brand ] || [\
  \ -f /etc/SuSE-release ]; then\n  distro=suse\nelif [ -f /etc/slackware-version\
  \ ]; then\n  distro=slackware\nelse\n  distro=unknown\nfi\n# Step 2: 安装到相应的目录\n\
  case $distro in\n  redhat|debian|suse)\n    # /etc/rc.d/ 是指向 /etc/init.d 的链接\n \
  \   # SuSE 和 RedHat 不需要 rc_dir。\n    init_dir=/etc/init.d\n    rc_dir=/etc\n   \
  \ ;;\n  slackware)\n    init_dir=/etc/rc.d\n    rc_dir=/etc/rc.d\n    ;;\n  *)\n\
  \    echo -n \"Unknown distribution; guessing init directory... \"\n    for init_dir\
  \ in /etc/rc.d/init.d /etc/init.d unknown\n    do\n      [ -d ${init_dir} ] && break\n\
  \    done\n    if [ \"$init_dir\" == \"unknown\" ]; then\n      echo \"Failed\"\n\
  \    else\n      echo \"Found ${init_dir}.\"\n      rc_dir=$init_dir\n    fi\nesac\n\
  if [ $init_dir != unknown ]; then\n  cp $service ${init_dir}\nelse\n  echo \"Error:\
  \ Can not determine init.d directory.\"\n  echo \"Initialization script has not\
  \ been copied.\"\n  exit 1\nfi\n# Step 3: 注册服务\ncase $distro in\n  suse|redhat)\n\
  \    chkconfig --add $service\n    ;;\n  *)\n    ln -sf ${init_dir}/service ${rc_dir}/rc2.d/S90service\n\
  \    ln -sf ${init_dir}/service ${rc_dir}/rc3.d/S90service\n    ln -sf ${init_dir}/service\
  \ ${rc_dir}/rc0.d/K10service\n    ln -sf ${init_dir}/service ${rc_dir}/rc6.d/K10service\n\
  \    ;;\nesac\n# Step 4: 启动服务\n[ $autostart == yes ] && case $distro in\n  suse|redhat)\n\
  \    chkconfig $service on\n    ;;\n  unknown)\n    echo \"Unknown distribution;\
  \ attempting to start up...\"\n    ${init_dir}/$service start\n    ;;\n  *)\n  \
  \  # Debian, Slackware\n    ${init_dir}/$service start\n    ;;\nesac\n```\n\n##\
  \ install-init.sh\n\n调用\n\n此脚本通常由另一个脚本调用（例如安装程序），但这里显示了（几乎完全静默的）调用方式以保证完整性。“starting\
  \ the application!” 消息是由 myapp 初始化脚本本身显示的，而不是由 install-init.sh 显示。\n\n\n\n\n\n```bash\n\
  \ # ./install-init.sh -a myapp\n/etc/init.d/myapp called with start; starting the\
  \ application!\n# ls -l /etc/init.d/myapp\n-rwxr-xr-x 1 root root 429 Apr 11 12:56\
  \ /etc/init.d/myapp\n# ls -l /etc/rc3.d/S90myapp\n-rwxr-xr-x 1 root root 429 Apr\
  \ 11 12:56 /etc/rc3.d/S90myapp\n#\n```\n\n## 总结\n\n随着时间的推移，不同的发行版采取了略有不同的方法来解决启动和停止系统服务的问题。这些方法基本上是相同的，但它们存在细微且微妙的差异，这些差异处理起来比那些容易引起关注的大而明显的差异更困难。将所有这些复杂性抽象到单个\
  \ Shell 脚本中，意味着系统的其他部分（在本例中为应用程序的安装程序）不需要担心所有不同的实现方式，也不需要关心 脚本是如何处理所有它们的。此外，此脚本中实现细节的任何更改都可以独立于主安装程序进行单独测试。\n\
  \n本配方在 Shell 中使用了不同的流结构来实现脚本的各个部分。通常当你看到频繁使用 `if` 时，特别是当它使用多个 `elif` 语句时，它应该被 `case`\
  \ 替换。在这种情况下，`if` 是识别发行版的理想工具，而 `case` 是根据识别出的发行版采取特定操作的最佳工具。\n\n## 配方 15-2：RPM 报告\n\
  \n此配方执行了一个实用的任务，即比较在不同机器上安装的 RPM，并对结果生成一份相当易读的报告。RPM 文件名的工作方式通常让这变得更加困难：横线是包名的有效且相当常见的部分，同时也用于分隔名称、版本和发布版本。\n\
  \n此报告以 `rpm -qa` 命令的输出作为输入，该命令可以在多个不同的机器上运行，也可以在同一台机器的不同时间运行，以比较软件包列表在机器之间或随时间推移的对比。所有输入文件中相同的软件包显示为白色背景上的黑色文字。安装了多个不同版本的软件包显示在灰色背景上，以便于识别。\n\
  \n## 使用的技术\n\n- 参数扩展，特别是 `%` 和 `##`\n- 关联数组（这些仅在 `bash` 4 或更高版本中有效）\n- 函数\n- Here\
  \ documents（在此文档）\n- HTML\n\n## 概念\n\nRPM 文件名包含大量信息，但并不容易解析。例如，`gnome-panel-2.16.1-7.el5`\
  \ 是软件的 `2.16.1` 版本，但该版本的发布号为 `7.el5`。由于文件名的一部分是用横线分割的，且横线在包名中非常常见，因此很难确定文件名的哪个部分是什么。唯一的方法是从后往前处理；版本和发布字段不包含横线。这意味着获取版本和发布版本字符串的代码必须通过提取最后一个横线之后的所有内容来剥离名称和版本（`gnome-panel-2.16.1`），然后提取该字符串中最后一个横线之前的内容以获得\
  \ `2.16.1`。它可以很容易通过删除最后一个横线之前的所有内容来获取发布号。将发布版本和版本重新拼接在一起可以将版本和发布版本放在一个变量中。\n\n在\
  \ HTML 中显示简单数据非常容易，不需要对 HTML 或 CSS 有特别深的知识。此配方产生符合 HTML 4.01 标准的 HTML 代码，基本上只使用了\
  \ `<table>` 元素和简单的 CSS。每行以 `<tr>`（表格行）开始，以 `</tr>` 结束。行中的每个标题单元格以 `<th>`（表头）开始，以\
  \ `</th>` 结束。每个数据单元格以 `<td>`（单元数据）开始，以 `</td>` 结束。\n\n## 潜在陷阱\n\n此任务的主要陷阱是处理包名中的横线。面对如\
  \ `dbus-x11-1.1.2-12.el5`、`xorg-x11-fonts-75dpi-7.1-2.1.el5` 和 `xorg-x11-drv-vesa-1.3.0-8.1.el5`\
  \ 等名称时，如果不使用 `%`、`%%`、`#` 和 `##` 语法，似乎无法从这些名称中提取连贯的数据。仔细考虑输入格式以及如何处理它是这里的关键。确保在\
  \ `readrpms` 中正确读取和解释它，意味着数据是连贯的，因此脚本其余部分的代码非常简单。\n\n## 结构\n\n两个主函数是 `readrpms`\
  \ 和 `showrpms`。在这些调用周围，`starthtml` 和 `endhtml` 输出启动和结束 HTML 文档所需的标准结构。配方中的另一个函数是\
  \ `rpmnames`，它仅提供所有 RPM 名称的排序列表，并去除了末尾的版本和发布信息。它由 `showrpms` 调用，以获取有序列表，从而创建 HTML\
  \ 报告。\n\n### startthtml 和 endhtml\n\n这两个函数显示启动和结束 HTML 输出的 HTML 代码。`starthtml` 定义了一个\
  \ CSS 样式表并开始定义表格。它使用 here document 来完成。由于 `<<-EOF` 告诉 here document 去除开头的制表符，脚本可以拥有良好的格式并缩进函数的内容，但生成的\
  \ HTML 是左对齐的，这在编辑实际 HTML 代码本身时看起来更好。\n\n在 `starthtml` 结束处以及 `endhtml` 中，一个简单的 `for`\
  \ 循环在表格顶部和底部显示一个标题行，列出用作输入的每个文件名。这可能是主机名，可能是数据收集的时间戳，甚至可能是两者都有，或者是像“Web 服务器”和“数据库服务器”这样更高级的信息。\n\
  \n这些函数的其余部分只是 HTML 文开头和结尾所需的 HTML 语法。样式信息定义了三类表格行：`heading`、`same` 和 `notsame`。这定义了用于每种类型行的字体大小和背景颜色。然后通过在脚本中显示\
  \ `<tr class=\"notsame\">` 来使用。也可以为表格单元格分配不同的颜色；未安装的软件包可以用一种颜色突出显示，旧软件包用另一种颜色，或任何符合需要的颜色。\n\
  \n### readrpms\n\n`readrpms` 是读取 `rpm -qa` 文件并将版本号分配给数组的函数。由于不存在多维数组，无法创建如 `rpm[node1][kernel-debug]=2.6.18-194.el5`\
  \ 的数组。因此，结构是一个名为 `version` 的数组存储成对的数据，以 `nodename_rpmname` 为索引，版本号为数据。这变成了 `version[node1_kernel-debug]=2.6.18-194.el5`，对于此脚本的目的来说，这与可能更直观的多维数组已经足够接近了。\n\
  \n这里有一个转折：可能安装了同一个 RPM 的多个版本，因此 `readrpms` 使用 `-z` 测试 `node_rpmname` 数组元素初始是否为空，如果该机器已经列出了同名的\
  \ RPM，则将该 RPM 添加到列表中。\n\n正如“概念”部分所讨论的，为了获取版本和发布版本，需要一个中间变量，以便从包名末尾剥离相关数据。\n\n###\
  \ showrpms\n\n`showrpms` 是显示 HTML 代码的函数。它从 `rpmnames` 获取一个排序列表，并从第一个节点的 RPM 条目中获取一个模板。它遍历每个节点的对应\
  \ RPM 条目，如果它们都匹配模板，则每台机器都安装了软件包的相同版本。如果不是，则会被标记，并且该行可以使用相应的 CSS 标签进行标记。该循环中的 `break`\
  \ 可能是过早优化，但如果比较大量的系统，在发现差异后停止继续检查可能会带来轻微的性能提升。为了保持输出简洁且易于搜索，如果所有项都相同，`stdout` 将显示消息“RPM\
  \ MATCH”；如果不同，则只显示每个节点。\n\n\n\n\n\n随后，`for` 循环再次遍历这些值，并基本上将 `<td>${version[$idx]}</td>`\
  \ 回显到 HTML 文件中。这受到两个因素的影响变得复杂：第一个是，如果软件包没有安装，清楚地说明这一点比直接留空表格单元格要好。第二个因素是，如果安装了多个版本的\
  \ RPM 副本，将它们放在单独的一行中会更整洁，因此在 `readrpms` 函数添加空格的地方插入一个 `<br />` 标签。`readrpms` 本可以自己插入该\
  \ `<br />` 标签，但最好的做法是将数据结构和输出格式分开。这样，即使最终输出是纯文本、RTF、CSV 或其他合适的格式，也可以使用相同的代码。\n\n\
  由于脚本既会输出到 `stdout` 也会输出到 HTML 文件，因此第一行输出会发送到 `stdout`，但前提只有在并非所有 RPM 都不完全相同的情况下才会发送。下一行写入\
  \ HTML。`${version[$idx]:-NotInstalled}` 会显示版本号，或者如果数组元素为空，则显示“NotInstalled”。版本号中的任何空格（表示多个版本）随后会被\
  \ `sed` 替换为 `<br />` 标签。最后，“NotInstalled”标记会被转换回“Not Installed”。\n\n## 食谱\n\n![download.eps](img/download_fmt.gif)\n\
  \n```bash\n#!//bin/bash\ndeclare -A version\nHTML=report.html\nfunction rpmnames\n\
  {\n  for rpm in 'cat $* | sort -u'\n  do\n    echo ${rpm%-*-*}\n  done | sort -u\n\
  }\nfunction readrpms\n{\n  for node in $*\n  do\n    while read rpm\n    do\n  \
  \    # rpm is gnome-panel-2.16.1-7.el5\n      rpmname=${rpm%-*-*}              #\
  \ gnome-panel\n      rpmnameversion=${rpm%-*}          # gnome-panel-2.16.1\n  \
  \    rpmversion=${rpmnameversion##*-}  # 2.16.1\n      rpmrelease=${rpm##*-}   \
  \         # 7.el5\n      idx=${node}_${rpmname}\n      if [ -z \"${version[$idx]}\"\
  \ ]; then\n        version[$idx]=\"${rpmversion}-${rpmrelease}\"\n      else\n \
  \       version[$idx]=\"${version[$idx]} ${rpmrelease}\"\n      fi\n    done < $node\n\
  \  done\n}\nfunction showrpms\n{\n  for rpmname in cpmnames *\n  do\n    idx=$1_\n\
  \    template=\"${version[$idx]}\"\n    allsame=1\n    for node in *\n    do\n \
  \     idx=${node}_${rpmname}\n      if [ \"${version[$idx]}\" != \"${template}\"\
  \ ]; then\n        allsame=0\n        break\n      fi\n    done\n    if [ $allsame\
  \ -eq 1 ]; then\n      echo \"RPM MATCH: $rpmname $template\"\n      echo \"<tr\
  \ class=\\\"same\\\">\" >> $HTML\n    else\n      echo \"RPM $rpmname\"\n      echo\
  \ \"<tr class=\\\"notsame\\\">\" >> $HTML\n    fi\n    echo \"<th>${rpmname}</th>\"\
  \ >> $HTML\n    for node in *\n    do\n      idx=${node}_${rpmname}\n      [ $allsame\
  \ -eq 0 ] && echo \"$node : ${version[$idx]:-Not Installed}\"\n      echo \"<td>${version[$idx]:-NotInstalled}</td>\"\
  \ | \\\n        sed s/\"/\"<br />\"/g | \\\n        sed s/\"NotInstalled\"/\"Not\
  \ Installed\" >> $HTML\n    done\n    echo \"</tr>\" >> $HTML\n  done\n}\nfunction\
  \ starthtml\n{\n  cat - <<-EOF > $HTML\n    <!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01 Transitional//EN\"\n             \"http://www.w3.org/TR/html4/loose\"\
  >\n    <html>\n    <head>\n      <meta http-equiv=\"Content-Type\" content=\"text/html;\
  \ charset=UTF-8\">\n      <title>Report on $*</title>\n      <style>\n        tr.heading\
  \ { background-color: #f2f2f2; }\n        tr.same { background-color: #e6f3ff; }\n\
  \        tr.notsame { background-color: #fffce6; }\n        td, th { font-family:\
  \ sans-serif; font-size: 1.2em; }\n      </style>\n    </head>\n    <body>\n   \
  \   <table border=\"1\">\n        <tr class=\"heading\">\nEOF\n}\n```\n\n## rpm-report.sh\
  \ 调用\n\n```\n$ ./rpm-report.sh node1 node2 node3 node4 node5\nRPM MATCH: a2ps 13b-5.el5\n\
  acl\nnode1: 2.39-2.el5\nnode2: 2.39-2.el5\nnode3: 2.39-2.el5\nnode4: 2.39-2.el5\n\
  node5: 2.39-2.el5\nacpid\nnode1: 1.0.4-9.el5_4\nnode2: 1.0.4-9.el5_4\nnode3: 1.0.4-7.el5\n\
  node4: 1.0.4-9.el5_4\nnode5: 1.0.4-9.el5_4\naide\nnode1: Not Installed\nnode2: 0.13.1-6.el5\n\
  node3: Not Installed\nnode4: Not Installed\nnode5: Not Installed\nalchemist\nnode1:\
  \ 1.0.36-2.el5\nnode2: Not Installed\nnode3: 1.0.36-2.el5\nnode4: 1.0.36-2.el5\n\
  node5: 1.0.36-2.el5\nalsa-lib\nnode1: 1.0.17-1.el5 1.0.17-1.el5\nnode2: 1.0.17-1.el5\n\
  node3: 1.0.17-1.el5\nnode4: 1.0.17-1.el5\nnode5: 1.0.17-1.el5\nalsa-utils\nnode1:\
  \ 1.0.17-1.el5\n. . . . .\nzenity\nnode1: 2.16.0-2.el5\nnode2: Not Installed\nnode3:\
  \ 2.16.0-2.el5\nnode4: 2.16.0-2.el5\nnode5: 2.16.0-2.el5\nRPM MATCH: zip 2.31-2.el5\n\
  RPM MATCH: zlib 1.2.3-3 1.2.3-3\n$ web-browser ./report.html\n```\n\n## 图 15-1\n\
  \n![f1501.tif](img/f1501_fmt.jpg)\n\n## 总结\n\n这个报告本身非常有用，由于使用了变量数据结构（特别是数组和参数扩展），生成它的食谱非常短且高效。结合非常简单的\
  \ HTML，生成了一个看起来专业的报告，可以粘贴到文档中、放在内网中，甚至可以打印（尽管这里使用的测试数据产生了 42 页横向打印）。\n\n代码结构意味着比较的主机数量没有限制，比较的\
  \ RPM 数量也没有限制。这与许多执行此类任务的脚本不同，那些脚本通常硬编码 `node1`、`node2` 和 `node3` 等值。输出的 HTML 可能变得难以一次性查看，但以\
  \ `RPM` 开头的脚本输出可以被其他脚本轻松搜索。\n\n\n\n\n\n- `mode 1, or active-backup`: 一种用于容错的故障转移模式。本脚本配置的正是这种模式。配置了两个网络适配器（其中一个在任何时刻处于激活状态）以及第三个（虚拟）设备\
  \ `bond0`，并配置了 IP 地址。\n- `mode 2, or balance-xor`: 使用源和目的 MAC 地址的异或运算来决定每个出站数据包使用哪个网络适配器。\n\
  - `mode 3, or broadcast`: 同时在所有接口上传输数据，用于容错。\n- `mode 4, or 802.3ad`: 用于容错和负载均衡的链路聚合。\n\
  - `mode 5, or balance-tlb`: 在最空闲的网络适配器上传输数据包，用于负载均衡。\n- `mode 6, or balance-alb`:\
  \ 也通过欺骗远程 ARP 缓存将其发送到其中一个适配器，从而对入站数据包进行负载负载均衡。\n\n互联网上有许多指南，尽管 [`www.kernel.org/doc/Documentation/networking/bonding.txt`](http://www.kernel.org/doc/Documentation/networking/bonding.txt)\
  \ 以及 `/usr/share/doc/kernel-doc-*/Documentation/networking/bonding.txt` 中的内核文档提供了非常简洁的有用信息。本脚本设置的选项为\
  \ `miimon=100`（它告诉 bond 每 100 毫秒检查一次链路，每秒 10 次）以及 `fail_over_mac=1`（这意味着每个网络适配器保留自己的\
  \ MAC 地址，并且在发生故障转移后更新远程 ARP 缓存）。这些选项以及许多其他选项都记录在 `bonding.txt` 文件中，可以在上述位置找到它。\n\
  \n在系统运行时，可以通过 `cat /proc/net/bonding/bond0` 检查 bond 的状态。这提供了关于 bond 本身及其底层从设备状态的相当详细的信息。\n\
  \n## 潜在陷阱\n\n自动化网络配置最糟糕的结果之一是机器无法通过网络访问。更糟糕的是，如果机器无法访问是因为它使用了已被其他设备占用的 IP 地址。将新机器接入网络需要进行一些完整性检查，因此此库在配置设备之前会执行一些基本检查。\n\
  \n网络设备的命名并不总是完全可预测的；有多种方法配置 `udev` 子系统来强制特定端口始终被命名为 `eth0`、`eth1` 或所需的名称。\n\n##\
  \ 结构\n\nkickstart 文件定义了一个 `%post` 部分，该部分由 `bash` 执行。可以用它来根据任何需要调优系统配置。如果你在安装服务器上提供了一个简单的库，那么就不需要在每个服务器的\
  \ kickstart 文件的 `%post` 部分编写复杂的脚本。\n\n该库提供了三个函数。文件中的第一个函数 `addroute` 为设备添加静态网络路由。在\
  \ Red Hat 上，这是通过 `/etc/sysconfig/network-scripts` 下的 `route-NIC` 文件实现的。每个网络适配器可以有一个这样的文件，并为特定适配器添加路由。虽然在安装阶段，你可以安全地假设该文件不存在，但使用\
  \ `>>` 追加到文件比直接用 `>` 写入文件更安全，因为这样不会丢失现有的路由。\n\n文件中的第二个函数 `makeslave` 只是为了让第三个函数简单一点。它使用在此文档（here\
  \ document）为网络适配器创建配置文件，将其配置为虚拟 bond 设备的从设备。它接受两个参数：要创建的网络适配器和它将成为从设备的 bond。这一次，最好使用单个\
  \ `>` 以确保该适配器的任何现有配置被删除。\n\n![note.ai](img/note_fmt.gif)\n\n由于它仅从库内部调用，因此 `makeslave`\
  \ 假设它已经运行在 `/etc/sysconfig/network-scripts` 是安全的。为其他脚本或库提供接口的脚本不应做此类假设。\n\n第三个函数是库的主体。这个\
  \ `addbond` 函数配置一个带有浮动 IP 地址的虚拟 bond 设备，该地址将由当时最合适的 NIC 使用，并在检测到故障时在适配器之间浮动。\n\n\
  该函数开始读取传入的变量，并作为基础完整性测试，检查是否提供了所有预期的参数。如果 `$5` 长度不为零，则可以认为其之前的参数也有值。这不是一个面向用户的脚本，期望提供的参数是良好的是合理的。脚本随后执行另一个基本测试；因为系统上已经配置了网络（但只有一个网络适配器），因此应该能够确认网络上没有其他主机已经配置了即将分配给正在安装机器的\
  \ IP 地址。这里有一个例外——通常，bond 的 IP 地址已经用作执行安装的 IP 地址了。因此，脚本会检查 `ip` 命令的输出中列出 `inet $IP`。如果该\
  \ IP 地址未被正在安装的机器占用，则快速的 `ping` 应该确认它在网络任何地方都没有被使用。这个简单的测试确保机器上线时不会使用网络上另一台机器的 IP\
  \ 地址。\n\n由于安装环境是完全全自动的且可能包含各种意外配置，因此进行了更多的完整性测试，以确保 bond 本身没有被配置过。如果在 `/etc/sysconfig/network-scripts`\
  \ 中存在 `ifcfg-$BOND` 文件，或者在 `/etc/modprobe.conf` 中有条目，则脚本也会退出，因为需要人工干预。\n\n要创建 bond\
  \ 需要两个从设备。之前提到的 `makeslave` 函数处理了这个问题并避免了 `addbond` 函数中的重复。然后使用非常类似的在此文档来创建 bond\
  \ 设备的条目。这为配置添加了 IP 地址和子网掩码。`/etc/modprobe.conf` 也添加了条目。这在启动时将 bonding 模块加载到内核并设置模块所需的选项。\n\
  \n最后，关闭现有的从接口，加载 bonding 模块并启动新配置的 bond 设备。这最后阶段并不是绝对必要的，因为系统已经能够与 kickstart 服务器通信，且新设备将在\
  \ kickstart 文件的 `%post` 部分完成后立即发生的第一次重启时启动。\n\n`client-ks.cfg` 文件仅显示了 kickstart\
  \ 文件的 `%post` 部分，这里设置了 `bond0` 使用 `eth0` 和 `eth4`（对于具有四个板载网络端口的系统，这些应该是板载的第一个端口和系统中安装的\
  \ PCI 网卡的第一个端口），然后是 `bond1` 使用 `eth1` 和 `eth5`，这些应该是与前两个端口相邻的两个端口。\n\n\n\n\n\n```bash\n\
  \ # 网络函数库\n# 假设为 RedHat Enterprise Linux 风格\n[ -f /etc/redhat-release ] || return\n\
  function addroute\n{\n  # 向设备添加路由\n  # $1 = 网络适配器 (例如 eth0, bond0)\n  # $2 = 目的网络\n\
  \  # $3 = 路由器\n  cd /etc/sysconfig/network-scripts\n  echo \"Adding $2 via $3 on\
  \ $1\"\n  echo \"$2 via $3\" >> route-$1\n}\nfunction makeslave\n{\n  # $1 = 网络适配器\n\
  \  # $2 = bond\n  cat - > ifcfg-$1 <<EOF\nDEVICE=$1\nBOOTPROTO=none\nONBOOT=yes\n\
  MASTER=$2\nSLAVE=yes\nUSERCTL=no\nEOF\n}\nfunction addbond\n{\n  # $1 = bond, $2=网络适配器\
  \ 1, $3 = 网络适配器 2\n  # $4 = IP 地址或名称, $5 = 子网掩码\n  BOND=$1\n  DEV1=$2\n  DEV2=$3\n\
  \  IP='getent hosts $4 | awk '{ print $1 }'\n  NAME='getent hosts $4 | awk '{ print\
  \ $1 }'\n  NETMASK=$5\n  if [ -z \"$NAME\" ] || [ -z \"$5\" ]; then\n    echo \"\
  Usage: addbond bond dev1 dev2 ip netmask\"\n    return 1\n  fi\n  /bin/ip a | grep\
  \ \"^    inet ${IP}/\" > /dev/null\n  if [ \"$?\" -ne \"0\" ]; then\n    if ping\
  \ -c1 -w1 $IP > /dev/null 2>&1\n    then\n      echo \"Error: $NAME ($IP) is responding\
  \ to ping. Not configuring $IP\"\n      return\n    fi\n  fi\n  cd /etc/sysconfig/network-scripts\n\
  \  if [ -f ifcfg-$BOND ]; then\n    echo \"Error: $BOND is already configured\"\n\
  \  fi\n  [ -f ifcfg-$DEV1 ] && mv ifcfg-$DEV1 bak.ifcfg-$DEV1\n  [ -f ifcfg-$DEV2\
  \ ] && mv ifcfg-$DEV2 bak.ifcfg-$DEV2\n  if grep $BOND /etc/modprobe.conf > /dev/null\n\
  \  then\n    echo \"Error: $BOND is already defined in /etc/modprobe.conf\"\n  \
  \  return\n  fi\n  echo \"Creating bond device $BOND from $DEV1 and $DEV2\"\n  echo\
  \ \"with the IP address ${IP}/${NETMASK}\"\n  makeslave $DEV1 $BOND\n  makeslave\
  \ $DEV2 $BOND\n  cat - > ifcfg-$BOND <<EOF\nDEVICE=$BOND\nBOOTPROTO=none\nIPADDR=$IP\n\
  NETMASK=$NETMASK\nONBOOT=yes\nEOF\n  cat - >> /etc/modprobe.conf << EOF\nalias $BOND\
  \ bonding\noptions $BOND mode=1 miimon=100 fail_over_mac=1\nEOF\n  ifdown $DEV1\n\
  \  ifdown $DEV2\n  modprobe $BOND\n  ifup $BOND\n}\n```\n\n`netlib`\n\n```bash\n\
  \ %post\n. /mnt/source/netlib\nmakebond bond0 eth0 eth4 192.168.1.53 255.255.255.0\n\
  addroute bond0 192.168.9.0 192.168.1.1\nmakebond bond1 eth1 eth4 192.168.2.53 255.255.255.0\n\
  ```\n\n`client-ks.cfg`\n\n### 调用\n\n```\nCreating bond device bond0 from eth0 and\
  \ eth4\nwith the IP address 192.168.1.53/255.255.255.0\nAdding 192.168.9.0 via 192.168.1.1\n\
  makebond bond1 eth1 eth4 192.168.2.53 255.255.255.0\n```\n\n## 总结\n\n`netlib` 库提供了网络函数，假设其环境为\
  \ RedHat Enterprise Linux 风格。`addroute`、`makeslave` 和 `addbond` 函数被用于配置网络接口和路由。\n\
  \n`addroute` 函数用于向特定设备添加路由。`makeslave` 函数将网络适配器配置为 bond 的从设备（slave）。`addbond` 函数在两个网络适配器之间创建一个\
  \ bond 接口，并设置 IP 地址和子网掩码。\n\n`%post` 部分中的示例用法演示了如何调用这些函数来建立 bond 接口。\n\n### client-ks.cfg\
  \ 输出\n\n`client-ks.cfg` 文件显示了 bond 创建过程的输出：\n\n```\nCreating bond device bond0 from\
  \ eth0 and eth4\nwith the IP address 192.168.1.53/255.255.255.0\nAdding 192.168.9.0\
  \ via 192.168.1.1\n```\n\n\n\n\n\n`ps -o comm` 显示表头以及实际进程名称。`ps -o comm=` 则不显示表头。\n\
  \n## 重启与强制重新加载\n\n要重启，脚本简单地带有 `stop` 参数调用自身，如果成功，它会再次带有 `start` 参数调用自身。LSB 也要求实现\
  \ `force-reload`，但在这种情况下，它的操作与 `restart` 相同，因此会调用 `$0 restart`。如果以后需要，可以在该占位符下放置更具体的实现。\n\
  \n## 默认\n\n由于可能随时添加或预期新的参数，通配符 `*` 选项会向标准输出打印消息并以返回代码 `2` 退出，该代码通常用于表示用法错误。请注意，如果没有传递任何参数，此代码块也会执行。\n\
  \n## 潜在陷阱\n\n不同的实现使用不同的方法注册服务。LSB 定义了特殊格式的注释，`chkconfig` 可以利用它们注册服务。LSB 标准建议这种格式：\n\
  \n```\n ### BEGIN INIT INFO\n# Provides: lsb-ourdb\n# Required-Start: $local_fs\
  \ $network $remote_fs\n# Required-Stop: $local_fs $network $remote_fs\n# Default-Start:\
  \  2 3 4 5\n# Default-Stop: 0 1 6\n# Short-Description: start and stop OurDB\n#\
  \ Description: OurDB is a very fast and reliable database\n#      engine used for\
  \ illustrating init scripts\n### END INIT INFO\n```\n\n在现实生活中，init 脚本可能包含这些或全部字段，也可能包含隐藏在注释中的其他配置数据。例如，在\
  \ Red Hat Enterprise Linux 6 上，`/etc/init.d/sshd` 在开头具有这些额外的特殊注释字段。Red Hat 还在头部注释中包含其他信息，但\
  \ `### BEGIN INIT INFO` 和 `### END INIT INFO` 之间的注释是注册脚本所必需的。\n\n```\n # sshd  \
  \         启动 OpenSSH 客户端守护进程\n#\n# chkconfig: 2345 55 25\n# description: SSH 是一种用于安全远程\
  \ shell 访问的协议。 \\\n#               此服务启动 OpenSSH 服务器守护进程。\n#\n# processname: sshd\n\
  # config: /etc/ssh/ssh_host_key\n# config: /etc/ssh/ssh_host_key.pub\n# config:\
  \ /etc/ssh/ssh_random_seed\n# config: /etc/ssh/sshd_config\n# pidfile: /var/run/sshd.pid\n\
  ### BEGIN INIT INFO\n# Provides: sshd\n# Required-Start: $local_fs $network $syslog\n\
  # Required-Stop: $local_fs $syslog\n# Should-Start: $syslog\n# Should-Stop: $network\
  \ $syslog\n# Default-Start: 2 3 4 5\n# Default-Stop: 0 1 6\n# Short-Description:\
  \ 启动 OpenSSH 服务器守护进程\n# Description:       SSH 是一种用于安全远程 shell 访问的协议。\n#       \
  \            此服务启动 OpenSSH 服务器守护进程。\n### END INIT INFO\n```\n\n## 结构\n\n简单来说，init\
  \ 脚本包含对第一个参数的测试，并带有 `start` 或 `stop` 参数启动或停止应用程序。如前所述，为了符合 LSB 标准，至少还应该实现状态 `restart`\
  \ 和 `force-reload`。\n\n### chkconfig\n\n为了供 `chkconfig` 使用，脚本以头部开头，其格式为 shell 脚本注释。实际\
  \ shell 在处理这些脚本时会忽略这些注释，但 `chkconfig` 工具在安装和描述服务时会读取它们。在没有 `chkconfig` 的系统上，这些注释仅被视为注释并被忽略。\n\
  \n### 启动与停止\n\n在头部之后，代码主体通常实现为 `case` 语句，根据复杂性，以函数形式或直接在 `case` 语句内部运行相应的命令。LSB\
  \ 标准规定 init 脚本应该根据结果输出不同的返回代码；目前许多脚本无论状态如何都返回零，而另一些在发生错误时返回 `1` 或 `-1`。\n\n### Provides\
  \ 和 Required-Start 元素\n\n有一个名为 `Provides` 的字段，定义了此 init 脚本提供的服务名称。还有 `Required-Start`\
  \ 和 `Required-Stop` 字段，它们与 `Provides` 配合确定运行脚本的顺序。如果 `/etc/init.d/udev` 声明 `Provides:\
  \ udev`，而 `/etc/init.d/network-manager` 声明 `Required-Start: $remote_fs dbus udev`，则\
  \ `/etc/init.d/udev` 将在 `/etc/init.d/network-manager` 之前运行。\n\n其中的另一个特殊字段是 `$remote_fs`。这是一个系统定义的设施，以名称开头的美元符号标记。目前共定义了七个系统设施，如表\
  \ 16-1 所示。\n\n[Table 16-1:] 系统设施\n\n| 名称 | 描述 |\n| --- | --- |\n| $local_fs | 所有本地文件系统已成功挂载。\
  \ |\n| $network | 网络子系统可用。 |\n| $named | IP / 主机查找（例如 DNS）可用。 |\n| $portmap | RPC\
  \ 服务可用。 |\n| $remote_fs | 远程（网络）文件系统可用。 |\n| $syslog | 系统日志可用。 |\n| $time | 认为系统时钟是准确的。\
  \ |\n\n食方 (Recipe)\n\n```bash\n#!/bin/bash\n### INIT INFO\n# Provides: myapp\n#\
  \ Required-Start: $local_fs $network $remote_fs\n# Required-Stop: $local_fs $network\
  \ $remote_fs\n# Default-Start:  2 3 4 5\n# Default-Stop: 0 1 6\n# Short-Description:\
  \ start and stop myapp\n# Description: MyApp 是一个用于系统的优秀实用工具。\n### END INIT INFO\n\
  INSTDIR=/usr/local/bin\nPIDFILE=/var/run/myapp.pid\nAPP=myapp\ncase $1 in\n  start)\n\
  \    if [ -f $PIDFILE ]; then\n      echo \"Error: $PIDFILE exists.\"\n      exit\
  \ 1\n    fi\n    $DIRS/$APP &\n    PID=$!\n    echo $PID > $PIDFILE\n    exit 0\n\
  \  ;;\n  stop)\n    $0 status || exit 1\n    PID='cat $PIDFILE 2>/dev/null'\n  \
  \  if [ \"$?\" -eq \"0\" ]; then\n      kill -9 $PID && rm -f $PIDFILE || exit 1\n\
  \    else\n      exit 1\n    fi\n    exit 0\n  ;;\n  status)\n    PID='cat $PIDFILE\
  \ 2>/dev/null'\n    if [ \"$?\" -ne \"0\" ]; then\n      exit 1\n    fi\n    if\
  \ [ -f $PIDFILE ]; then\n      if [ \"'ps -o comm -p $PID'\" != \"$APP\" ]; then\n\
  \        echo \"Error: PID $PID is not $APP\"\n        exit 1\n      fi\n      ps\
  \ -p $PID > /dev/null 2>&1\n      exit $?\n    else\n      exit 1\n    fi\n  ;;\n\
  \  restart)\n    $0 stop && $0 start\n  ;;\n  force-reload)\n    $0 restart\n  ;;\n\
  \  *) echo \"Argument \"$1\" not implemented.\"\n    exit 2\n  ;;\nesac\n```\n\n\
  ## 调用\n\n当未运行时，`status` 参数返回非零值。\n\n```bash\n # /etc/init.d/myapp status\n# echo\
  \ $?\n1\n```\n\n启动应用程序会导致 PID 被写入 `myapp.pid`。\n\n```bash\n # /etc/init.d/myapp\
  \ start\n# cat /var/run/myapp.pid\n9024\n# ps -fp 'cat /var/run/myapp.pid'\nUID\
  \        PID  PPID  C STIME TTY           TIME CMD\nroot      9024     1  0 12:04\
  \ pts/3           0:00 /bin/bash\n```\n\n重启应用程序会导致新的 PID，因为旧实例在 12:09 停止并启动了新实例。\n\
  \n```bash\n # /etc/init.d/myapp restart\n# cat /var/run/myapp.pid\n9040\n# ps -fp\
  \ 'cat /var/run/myapp.pid'\nUID        PID  PPID  C STIME TTY           TIME CMD\n\
  root      9040     1  0 12:09 pts/3           0:00 /bin/bash\n```\n\n停止应用程序也会移除\
  \ `myapp.pid`。\n\n```bash\n # /etc/init.d/myapp stop\n# cat /var/run/myapp.pid\n\
  cat: /var/run/myapp.pid: No such file or directory\n```\n\n如果应用程序没有运行，`restart`\
  \ 不会启动它。\n\n```bash\n # /etc/init.d/myapp restart\n# cat /var/run/myapp.pid\ncat:\
  \ /var/run/myapp.pid: No such file or directory\n```\n\n## 总结\n\ninit 脚本通常非常简单，但在不同系统之间会有不同。此食方提供了一个足够简单的框架，在大多数情况下都可以工作，但如果在脚本开头的注释中提供了额外信息，某些系统在并行启动和依赖检查方面可以更加灵活。\n\
  \n食方 16-2: CGI 脚本\n\n\n\n\n\n通用网关接口（Common Gateway Interface，简称 CGI）是定义数据如何传递给 Web\
  \ 服务器的协议，最常见的形式是 [`www.example.com/page?name=steve&shell=bash`](http://www.example.com/page?name=steve&shell=bash)，但另一种不那么明显的形式是\
  \ Web 服务器如何处理表单。这通常与 PHP 等语言一起使用，这些语言需要在 Web 服务器上安装额外的软件，但这些任务仅使用 Web 服务器和 shell\
  \ 即可完成。\n\n在当今的互联网上，CGI 脚本需要极其健壮且安全，因为任何能够欺骗脚本执行非常规操作的人，都可以以运行脚本的用户账户权限在 Web 服务器上执行代码。像\
  \ PHP 这样更复杂的系统增加了更多冗余，并可能隐藏正在发生的底层细节，但它们确实增加了一些额外的安全保护。对于调试这些更复杂的系统，或者在受信任或非常简单的环境中，shell\
  \ 也可以用于 CGI 脚本。\n\n## 使用的技术\n\n- `HTTP`\n- `CGI; RFC 3875`\n- `Apache mod_cgi`\n\
  - `eval`, `case`, `read`\n\n## 概念\n\nCGI 协议的演进速度超过了记录速度，随后 RFC 3875 ([`www.ietf.org/rfc/rfc3875`](http://www.ietf.org/rfc/rfc3875))\
  \ 被编写出来以记录通用网关接口。它允许 Web 服务器使用 HTTP 协议定义的 `GET` 和 `POST` 两个协议从浏览器接收额外数据。`DELETE`\
  \ 和 `PUT` 也包含在表象状态传输（REST）架构中，尽管它们在 Web 上并不被使用。\n\n### GET\n\n最简单的形式是 `GET`，它将参数嵌入\
  \ URL 本身。这些参数作为环境变量 `QUERY_STRING` 传递给脚本。由脚本来以最适合自己的方式解析此变量，但标准是每个 `variable=value`\
  \ 对发送在初始问号之后，然后用安培符号（`&`）分隔。这就是当使用表单发送 `GET` 请求时变量的呈现方式。此外还会进行一些细微的编码；URI 只能包含某些字符，因此空格被替换为\
  \ `%20`（空格在 ASCII 中为 `0x20`），尽管也可以使用 `+` 来表示空格。冒号变为 `%3A`，正斜线变为 `%2F`，以此此类推。\n\n\
  ### POST\n\n另一种常见形式是 `POST`，它在请求体内传递参数。你可以使用 `POST` 从浏览器向 Web 服务器发送文件。不是通过 `QUERY_STRING`\
  \ 变量，`POSTed` 的数据在脚本的标准输入上处理。\n\n### 表单\n\n发送数据的表单在 HTML 中定义，并定义了 `action` 和 `method`。HTML\
  \ 本身并不一定是 CGI；它可能是一个普通的 HTML 网页。CGI 脚本的 URL 定义在 `action` 参数中，而 `method` 指定了浏览器使用\
  \ `GET` 还是 `POST` 将数据发送到 Web 服务器。\n\n## 潜在陷阱\n\n处理用户提交的数据的主要陷阱是安全。如果你能避免这个陷阱（例如在测试本地且完全信任的系统时），那么将\
  \ shell 作为调试工具是一个极佳的节省器，因为它消除了任何复杂的第三方冗余。\n\n正如下文 `GET` 节所示以及图 16-5 所示，编辑位置栏可以从\
  \ Web 服务器提取潜在的敏感数据。用户还可以将 `telnet` 会话指向你 Web 服务器的 80 端口，并将他们选择的任何类型的数据直接发送到你的 CGI\
  \ 脚本，可以在 `QUERY_STRING` 变量中（针对 `GET` 请求），也可以在标准输入中（针对 `POST` 请求）。事实时间的推移表明，管理员要防止任何可能的攻击是非常困难的，因为\
  \ CGI 脚本已以各种方式受到攻击。理想情况下，CGI 脚本应该确切知道它预期的输入，并丢弃任何其他输入而不对其进行处理。在实践中，这并不常见，因此所有输入数据必须被视为可能是恶意的。需要检查的项目包括：\n\
  \n- `$VARIABLE`\n- `${VARIABLE}`\n- `cmd`\n- `'cmd'`\n- `$(cmd)`\n- `cmd > file`\
  \ (或 `>>`)\n- `cmd < file` (或 `<<`, `<<-`, 或 `<<<`)\n\n## 结构\n\n首先，假设你正在使用 Apache\
  \ Web 服务器，向 Apache 配置中添加类似内容以启用 CGI。取决于具体的设置，文件和目录的名称会有所不同，但重要的是定义 `/cgi-bin` 别名，并为其别名的目标目录设置\
  \ `+ExecCGI` 选项。然后在大 Web 服务器的文档目录的任何位置安装 `index.html` 文件，并在 `cgi-bin` 目录下安装两个 CGI\
  \ 文件。\n\n```\n ScriptAlias /cgi-bin/ /var/www/cgi-bin/\n    <Directory \"/var/www/cgi-bin\"\
  >\n                AllowOverride None\n                Options +ExecCGI -MultiViews\
  \ +SymLinksIfOwnerMatch\n                Order allow,deny\n                Allow\
  \ from all\n    </Directory>\n```\n\n![note.ai](img/note_fmt.gif)\n\n为了让这些截图使用 example.com\
  \ 域名，我在 `/etc/hosts` 中定义了一个项目，并在 Apache 中创建了一个虚拟主机来响应该名称。你可以在本教程稍后 `POST` 节中的示例原始\
  \ `/etc/hosts` 输出中看到这一点。\n\n## 头部\n\n脚本必须只输出 HTML，所有内容都将发送到浏览器。这必须从一个两行的头部开始。第一行定义了内容将是什么，第二行始终是一个空行。这标记了头部的结束和内容的开始。\n\
  \n```\nContent-type: text/html\n```\n\n此头部由本教程的“显示头部”部分发送，包括发送初始的 HTML 代码以设置标题 文本并显示\
  \ H1 标题。\n\n### GET\n\n`index.html` 包含两个表单，在随后的“调用”节中的图 16-1 所示。第一个是 `GET` 表单，它发送两个名为\
  \ `one` 和 `two` 的文本输入，以及三个名为 `check1`、`check2` 和 `check3` 的复选框。这些名称除了页面源代码和 `GET`\
  \ 请求的 URL 之外对用户不可见。表格将这些字段标记为“第一文本”、“第二文本”和“勾选这些”。表单定义为 `action=\"/cgi-bin/hello.cgi\"\
  \ method=\"get\"`。\n\n`hello.cgi` 解析 `QUERY_STRING` 变量，首先将任何安培符号转换为换行符。这把 `one=hello+world&two=this+is+my+message&check1=on&check3=on`\
  \ 转换为四行独立的内容，由 `eval` 进行求值。这四行是：\n\n- `one=hello+world`\n- `two=this+is+my+message`\n\
  - `check1=on`\n- `check3=on`\n\n注意 `check2` 完全没有被发送，因为它没有被设置。这是复选框特有的；如果第一个文本输入为空，它将作为\
  \ `one=` 发送；`QUERY_STRING` 将是 `one=&two=this+is+my-message`。脚本将 `+` 符号转换回空格（URL\
  \ 不能包含空格）以显示消息。在随后的“调用”节中，图 16-2 显示了 `hello.cgi` 解释并显示传递的文本和复选框。\n\n\n\n\n\n这种技术本身本质上极不安全；在任何情况下，将未处理的用户输入传递给\
  \ `eval` 都是危险的。在随后的“调用”（Invocation）部分，图 16-3 显示了一个恶意用户在表单中输入变量名 `$DOCUMENT_ROOT`。图\
  \ 16-4 显示脚本似乎是完全安全的；美元符号已被更改为无害的文本 `%24`（`$` 在 ASCII 中为 `0x24`）。然而，这种转换是由 浏览器完成的，而浏览器是在用户控制下的。图\
  \ 16-5 显示用户可以更改 Location 栏中的 URL，Web 服务器的文档根（Document Root）将作为网页的一部分显示给恶意用户（在本例中为\
  \ `/home/steve/book/web`）。这些信息随后可用于发起进一步攻击；服务器上很可能存在用户 `steve`，并且可能对 `ssh` 开放，或者在\
  \ Web 服务器上可能开放 `ftp`。一旦你能让远程服务器代表你解释代码，你几乎可以控制它的所有一切。这些信息并非秘密，但这里不是提供更多示例的地方——这不是一本系统安全书籍。\n\
  \n`hello.cgi` 的第二部分将美元符号（`$`）转换为无害的 `\\$`。这意味着图 16-5 的下部分显示的是文本 `$DOCUMENT_ROOT`，该文本完全没有被脚本解析。这仍然无法保证对所有可能的攻击都是绝对安全的，但它展示了一些需要防范的问题。\n\
  \n## POST\n\n在随后的“调用”部分，图 16-6 再次显示了 `index.html` 页面，其中第二个表单填充了本地文件 `/etc/hosts`\
  \ 和 `/etc/resolv.conf` 的名称。POST 数据从浏览器发送到脚本的标准输入（stdin）。这两个协议并不能真正结合，尽管可以使用 `method=\"\
  POST\"` 和 `action=\"upload.cgi?foo=bar\"` 向 CGI 脚本传递 GET 请求。这在图 16-7 中有所所示，尽管这种组合并不常见；POST\
  \ 表单通常只使用 POST 元素并忽略 `QUERY_STRING`。编码类型必须设置为 `multipart/form-data`，以告诉浏览器需要对文件进行适当编码，以便通过\
  \ HTTP 协议发送。\n\n![note.ai](img/note_fmt.gif)\n\n通过注释掉对 `readfiles` 的调用，并取消 `<pre>`\
  \ 标签以及脚本末尾的 `cat - -` 命令，可以测试此脚本。这显示了脚本接收到的原始数据。\n\n发送的原始数据包括一个随机生成的边界字符串（boundary\
  \ string）以及每个文件之前包含文件名和变量名的某些头部。这里显示了该输出的一个示例；理解这种结构对于理解脚本如何解析它至关重要。\n\n```\n -----------------------------92544452916948079257411075\n\
  Content-Disposition: form-data; name=\"fileone\"; filename=\"hosts\"\nContent-Type:\
  \ application/octet-stream\n127.0.0.1       localhost www.example.com\n192.168.1.3\
  \      router\n192.168.1.5      plug\n192.168.1.10     declan\n192.168.1.11    \
  \ atomic\n192.168.1.13     goldie\n192.168.1.227    elvis\n-----------------------------92544452916948079257411075\n\
  Content-Disposition: form-data; name=\"filetwo\"; filename=\"resolv.conf\"\nContent-Type:\
  \ application/octet-stream\nnameserver 192.168.1.3\n-----------------------------92544452916948079257411075\n\
  Content-Disposition: form-data; name=\"filethree\"; filename=\"\"\nContent-Type:\
  \ application/octet-stream\n-----------------------------92544452916948079257411075--\n\
  ```\n\n`upload.cgi` 脚本首先读取第一行来定义边界。它被用作文件之间的标记。它也被用于输入的最末尾，末尾带有 `--` 以标记输入的完全结束。行\
  \ `boundary=${BOUNDARY%^M}` 删除了边界末尾的 `^M`。这是必要的，因为 Web 浏览器以 DOS 格式发送文本，在每行末尾都多了一个额外的\
  \ `^M`。\n\n`readfiles` 函数读取第一个文件的头部，并在 `uploads` 子目录中创建一个空文件。这相对于文件系统中的 `upload.cgi`\
  \ 脚本。随后，`while` 循环每次读取一行，并将上一行存储在 `$previous_line` 变量中。在读取每行时，都会删掉每行中的 `^M`。该函数一次读取一行输入，并使用\
  \ `case` 语句确定找到了哪种情况：\n\n- 当找到边界（boundary）时，获取已完成文件的 MD5 校验和，并读取下一组头部。如果出于某种原因导致退出。\n\
  - 如果找到边界后跟着 `--`，则获取最后读取文件的校验和，并返回函数。\n- 在所有其他情况下，将上一行追加到当前文件中，并将 `$previous_line`\
  \ 设置为最近读取的行。使用 `$previous_line` 这种“技巧”的原因是，否则处理每组头部的过程将变得复杂。每行发送时都跟着一个空行，然后是边界，因此让\
  \ `case` 语句在输入背后工作更为整洁。\n\n![note.ai](img/note_fmt.gif)\n\n在 `case` 语句的 `catch-all`\
  \ 子句中有一个注释掉的 `tee`。这可选用于在 Web 浏览器中显示上传文件的内容。显示文件内容不是此配方的目的，但提供它是为了展示如何对脚本进行微调来完成任务。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```html\n <html>\n<head>\n  <title>example.com</title>\n\
  </head>\n<body>\n<h1>CGI Script</h1>\n<table>\n  <form action=\"/cgi-bin/hello.cgi\"\
  \ method=\"get\">\n    <td colspan=2>提交文本 (GET)</td></tr>\n    <tr><th>第一个文本</th>\n\
  \    <td><input type=\"text\" name=\"one\"></td></tr>\n    <tr><th>第二个文本</th>\n\
  \    <td><input type=\"text\" name=\"two\"></td></tr>\n    <tr><th>检查这些</th>\n \
  \   <td>\n      1<input type=\"checkbox\" name=\"check1\">\n      2<input type=\"\
  checkbox\" name=\"check2\">\n      3<input type=\"checkbox\" name=\"check3\">\n\
  \    </td></tr>\n    <tr><td>&nbsp;</td><td><input type=\"submit\" value=\"Submit\
  \ Form\"></td></tr>\n  </form>\n  <form action=\"/cgi-bin/upload.cgi?foo=bar\" method=\"\
  post\" enctype=\"multipart/form-data\">\n    <td colspan=2>文件上传 (POST)</td></tr>\n\
  \    <tr><th>文件一</th>\n    <td><input type=\"file\" name=\"fileone\"></td></tr>\n\
  \    <tr><th>文件二</th>\n    <td><input type=\"file\" name=\"filetwo\"></td></tr>\n\
  \    <tr><th>文件三</th>\n    <td><input type=\"file\" name=\"filethree\"></td></tr>\n\
  \    <tr><td>&nbsp;</td><td><input type=\"submit\" value=\"Upload Files\"></td></tr>\n\
  \  </form>\n</table>\n</body>\n</html>\n```\n\n`index.html`\n\n\n\n\n\n```bash\n\
  #!/bin/bash\nfunction readfiles\n{\n  read disposition data name filename\n  read\
  \ ct contenttype\n  read blankline\n  read previous_line\n  eval 'echo $filename\
  \ | tr -d '^M''\n  echo \"<hr/>\"\n  echo \"Processing file \\\"$filename\\\" ($contenttype)<br/>\"\
  \n  > uploads/$filename\n  while read content\n  do\n    contentvalue=${content%^M}\n\
  \    case $contentvalue in\n      $boundary)\n        # end of file.\n        #\
  \ First, show the summary of the previous file\n        cd uploads\n        md5sum\
  \ $filename\n        cd - > /dev/null\n        echo \"<br/>\"\n        # Now read\
  \ in the headers of the next file\n        read disposition data name filename\n\
  \        read ct contenttype\n        read blankline\n        read previous_line\n\
  \        eval 'echo $filename | tr -d '^M''\n        if [ ! -z \"$filename\" ];\
  \ then\n          echo \"<hr/>\"\n          echo \"Processing file \\\"$filename\\\
  \" ($contenttype)<br/>\"\n          > uploads/$filename\n        else\n        \
  \  # That was the end of the input. No proper notification\n          # received\
  \ (boundary--) but handle it gracefully.\n          echo \"<hr/>\"\n          return\n\
  \        fi\n        ;;\n      ${boundary}--)\n        # end of all input\n    \
  \    cd uploads\n        md5sum $filename\n        cd - > /dev/null\n        echo\
  \ \"<hr/>\"\n        return\n        ;;\n      *)\n        echo \"$previous_line\"\
  \ >> uploads/$filename # | tee -a uploads/$filename\n        previous_line=$content\n\
  \        ;;\n    esac\n  done\n}\n# Show the Header\ncat - <<EndOfHeaders\nContent-type:\
  \ text/html\n<html>\n<head><title>Uploader</title></head>\n<body>\n<h1>File Uploads</h1>\n\
  EndOfHeaders\necho \"Query String is $QUERY_STRING\"\n# Read the first line of input.\
  \ This tells you the boundary\nread BOUNDARY\nboundary=${BOUNDARY%^M}\n# Read and\
  \ process the input\nreadfiles\n# Use this instead for debugging and testing\n#\
  \ echo \"<pre>\"\n# cat -\n# echo \"</pre>\"\n# Write the HTML footer\ncat - <<EOF\n\
  </body>\n</html>\nEOF\n```\n\n### upload.cgi\n\n初始网页如如图 16-1 所示。它显示了一个 `GET` 表单和一个\
  \ `POST` 表单。\n\n图 16-2 显示了 `hello.cgi` 处理 `GET` 表单的结果。这个简单的测试并没有尝试以任何方式欺骗 CGI 脚本，但它展示了\
  \ CGI 脚本是如何工作的。\n\n图 16-3 显示了恶意用户在表单中输入较少的数据。这种简单的攻击本身无效，因为 浏览器在将数据发送到 Web 服务器之前会修改美元符号。\n\
  \n图 16-4 显示了尝试攻击的结果。美元符号已被替换为无害的文本 `%`。\n\n图 16-5 显示了当用户通过修改地址栏中的 URL 直接编辑查询字符串，将\
  \ `%$` 改回美元符号时发生的情况。这一次，变量 `$DOCUMENT_ROOT` 的实际值被显示给了攻击者。\n\n图 16-6 再次显示了初始网页，但已填充内容，准备通过\
  \ `POST` 表单向 Web 服务器发送两个文件。这些文件的名称和内容将作为网络请求的一部分被发送。\n\n在图 16-7 中，CGI 脚本在处理文件时显示更新，并显示每个文件的\
  \ MD5 校验和。\n\n## 总结\n\nCGI 是一个非常有用的工具，但它的设计假设是互联网是相当可靠的。因此，人们创建了如 PHP 或巨大的 Perl\
  \ 库等复杂框架来驯服它。最近，Ajax 被用于通过提供更灵活、更透明的服务器端处理来在很大程度上取代了 CGI。尽管如此，用 shell 编写的 CGI 脚本仍然很有用，因为它们除了\
  \ Web 服务器本身不需要任何第三方软件，组合非常快速简单，并且可以提供关键的调试信息。\n\nCGI 允许你根据发送的输入程序化地更改 Web 服务器的响应。处理\
  \ CGI 脚本有两种方法：`GET` 更透明且更容易调试，而 `POST` 允许将文件发送到服务器。浏览器插件可以将 `POST` 表单转换为 `GET`，反之亦然。Wireshark\
  \ 也可以用于追踪网络流量和调试 CGI 连接。\n\n### 菜谱 16-3：配置文件\n\n配置文件几乎存在于每一个操作系统和应用程序中。某些系统倾向于使用二进制文件，因为作为导出应用程序状态并读回状态的方法，这种方式更方便。Unix\
  \ 和 GNU/Linux 的传统是使用文本文件。这对于 shell 脚本来说要方便得多，而且意味着文件可以通过人工干预、其他脚本和其他软件进行处理。它意味着不需要因为数据或配置只能由某个特定软件读取就被锁死在特定的应用程序上。\n\
  \n## 使用的技术\n\n* `source` (`.`)\n* 变量赋值\n\n## 概念\n\n一个 shell 脚本可以包含在一个文件中，包括所有的代码、数据和配置。然而，如果将这些项目存储在单独的文件中，脚本将更加灵活。用户可以像编辑简单的文本文件一样编辑配置；这样用户就不必看到脚本的实现细节。这种情况发生在所有层面，从高层的应用程序用户到系统管理任务（例如编辑\
  \ `/etc/hosts` 或 `/etc/sysconfig/network-scripts/ifcfg-eth0`）。这些本质上也都是配置文件。\n\n\
  配置文件最简单的格式之一是使用与 shell 相同的语法。这样，你可以使用 `source` (`.`) 命令直接将配置引入环境。这并非偶然；这正是 shell\
  \ 本身读取 `~/.profile`、`~/.bashrc` 以及其他配置文件的方式。\n\n## 潜在陷阱\n\n这种技术的主要陷阱是转义字符和引号可能会导致问题。例如，如果给一个变量赋值为\
  \ `a'b`，那么 shell 将在换行后继续读取，直到找到结束的单引号。\n\n```bash\n cat eg.cfg\nx=a'b\n$ . eg.cfg\n\
  -bash: eg.cfg: line 1: unexpected EOF while looking for matching '''\n-bash: eg.cfg:\
  \ line 2: syntax error: unexpected end of file\n$\n```\n\n## 结构\n\n这个菜谱展示了赋值的各种方法。在脚本开头，它将变量设置为空。然后，使用\
  \ `[-r $CFG]`，如果配置文件存在且可读，则读取它。`-p` 切换开关在 `read` 命令中包含了提示符，因此 `read -p \"Name: \"\
  \ name` 会在 `Name:.` 的提示符下读取 `name` 变量。\n\n\n\n\n在提示符文本中添加（`$NAME`）意味着用户按下回车键而不是输入值，则将使用一个默认值。这是通过\
  \ `-z` 测试实现的，该测试会检查变量是否为空，如果为空，则将变量设置为已读取的默认值。这种映射使用了变量名大写和小写的命名惯例，因此 `$name` 是用户输入的名称，而\
  \ `$NAME` 是从配置文件中读取的值。这在 shell 中并不是定义标准，但在需要方便使用两个同名不同变量时，是一种非常有用的命名惯例。在随后的“调用（Invocation）”部分中，Bethany\
  \ 没有提供值，因此使用了默认值“Manchester（Manchester）”。\n\n最后，脚本将其当前值写入配置文件。因为 shell 将读取该文件，标准的\
  \ shell 语法意味着以哈号（##）开头的注释将被忽略。\n\n## 配方（Recipe）\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\nDEBUG=0\nNAME=Steve\nLOCATION=Manchester\n#!/bin/bash\nDEBUG=3\nNAME=\nLOCATION=\n\
  COLOR=\nCFG='dirname $0'/name.cfg\n[ -r $CFG ] && . $CFG\nread -p \"What is your\
  \ name? ($NAME): \" name\n[ -z \"$name\" ] && name=$NAME\nread -p \"Where are you?\
  \ ($LOCATION): \" location\n[ -z \"$location\" ] && location=$LOCATION\nread -p\
  \ \"What is your favorite color? ($COLOR): \" color\n[ -z \"$color\" ] && color=$COLOR\n\
  echo \"Hello ${name}, how is the weather in ${location}?\"\necho \"Can you see anything\
  \ ${color}?\"\necho \"# Config file autogenerated by 'id -nu' on 'date'\" > $CFG\n\
  echo \"# Do not edit by hand, this file will be rewritten\" >> $CFG\necho >> $CFG\n\
  echo DEBUG=$DEBUG >> $CFG\necho NAME=$name >> $CFG\necho LOCATION=$location >> $CFG\n\
  echo COLOR=$color >> $CFG\n```\n\n```\nname.sh\nname.cfg\n```\n\n## 调用（Invocation)\n\
  \n```\n$ cat name.cfg\nDEBUG=0\nNAME=Steve\nLOCATION=Manchester\n$ ./name.sh\nWhat\
  \ is your name? (Steve): Bethany\nWhere are you? (Manchester): \nWhat is your favorite\
  \ color? ( Blue Blue\nHello Bethany, how is the weather in Manchester?\nCan you\
  \ see anything Blue?\n$ cat name.cfg\n# Config file autogenerated by steve on Sun\
  \ Apr 24 15:55:44 BST 2011\n# Do not edit by hand, this file will be rewritten\n\
  DEBUG=0\nNAME=Bethany\nLOCATION=Manchester\nCOLOR=Blue\n$ ./name.sh\nWhat is your\
  \ name? (Bethany): Emily\nWhere are you? (Manchester): the garden\nWhat is your\
  \ favorite color? (Blue): Pink\nHello Emily, how is the weather in the garden?\n\
  Can you see anything Pink?\n$ cat name.cfg\n# Config file autogenerated by steve\
  \ on Sun Apr 24 15:56:07 BST 2011\n# Do not edit by hand, this file will be rewritten\n\
  DEBUG=0\nNAME=Emily\nLOCATION=the garden\nCOLOR=Pink\n$\n```\n\n## 总结（Summary）\n\
  \n配置文件是存储默认值的一种有用方式。它们很容易读取，因为 shell 已经包含了解析它们的代码；不需要像 Windows 风格的 `.ini` 文件或某些自定义文件格式那样编写额外的代码。这不是构建配置文件的唯一方法，但它是最常用的方法，因为它非常简单。\n\
  \n## 配方 16-4：锁（Locks）\n\n了解一个进程对资源具有排他访问权限是有用的。例如，如果一个脚本需要几分钟来处理和更新一个关键文件，在完成之前让它处于不一致状态，那么其他脚本在文件临时处于已知错误状态时尝试访问该文件并不是一个好主意。\n\
  \n锁系统提供了这种机制，在任何时间只允许一个进程访问特定资源。资源本身可以是任何东西；锁仅仅是多个进程同时执行操作的屏障。这可以确保 init 脚本不会启动多个进程副本（通常使用\
  \ `/var/run/app-name.pid` 作为锁文件），或任何其他需要保证唯一访问的程序。\n\n在 shell 中实现锁的标准方法是将运行进程的 `PID`\
  \ 放入一个公共文件中。脚本的其他任何实例在进入代码关键区域之前都会该文件，只有在没有其他实例已占用锁时才会继续。在实践中，这并不完全简单。进程必须考虑到这一点。\n\
  \n## 概念（Concepts）\n\n锁的概念非常直观。实现稍微复杂一些。锁文件在它可用时并不是立即可用。这个配方有一个 `while` 循环，等待锁文件被删除。\n\
  \n## 使用的技术（Technologies Used）\n\n*   `sed`\n*   `>`\n*   `>>`\n\n## 陷阱（Potential\
  \ Pitfalls）\n\n在 shell 中实现锁的问题在于，获取锁必须是原子的，但 shell 中没有单一的“写入并检查”函数。如果脚本的两个实例看到锁是可用的，然后都去获取它，哪一个会获胜？\n\
  \n![warning](img/warning.gif)\n\n## simplelock.sh\n\n```\n#!/bin/bash\nLOCK=/tmp/myapp.lock\n\
  function get_lock\n{\n  MYPID=$1\n  DELAY=2\n  while [ -f \"$LOCK\" ]\n  do\n  \
  \  sleep $DELAY\n  done\n  echo $MYPID > $LOCK\n}\nfunction release_lock\n{\n  rm\
  \ -f $LOCK\n}\necho \"I am process $$\"\nget_lock $$\necho \"$: 'date'\" > /tmp/keyfile.txt\n\
  sleep 5\nrelease_lock\ncat /tmp/keyfile.txt\n```\n\n问题位于 `while` 循环的末尾。如果两个实例同时运行，调度器可以随时运行或暂停任何进程。大多数情况下这是没问题的，但偶尔执行顺序将如\
  \ 表 16-2 所示。\n\n### 表 16-2：非原子锁\n\n| 脚本一 | 脚本二 | 锁文件内容 |\n| --- | --- | --- |\n\
  |  | 读取锁 | 空 |\n| 读取锁 |  | 空 |\n|  | 写入锁 | PID #2 |\n| 写入锁 |  | PID #1 |\n| 写入关键文件\
  \ |  | PID #1 |\n|  | 写入关键文件 | PID #1 |\n\n\n\n\n脚本的第二个实例最终写入了关键文件，尽管锁文件中包含第一个实例的\
  \ `PID`。这是一件糟糕的事情，而这正是锁系统旨在规避的情况。如果它无法阻止这种情况发生，那么整个锁定机制真的只是一个尽力而为的方案，而不是一个完全健壮的方案。\n\
  \n由于这个配方的工作方式，可能会出现一个进程从锁中“移除”自己，而另外两个进程正尝试移除自己。如果第一个 `sed` 进程是最后一个完成的（仅有 9 次系统调用的重叠），它可能会将其他进程的\
  \ `PIDs` 写入锁中，这显然同时将锁授予那两个进程。那两个进程就可以继续执行，认为它们拥有锁的排他访问权限。这在实践中发生的概率极低，但如果没有硬件层面的“写入并检查”功能，这是无法避免的。\n\
  \n这里提供的配方的另一个弱点是，它可能会无限地等待某个永远不会释放的锁访问。可以使用 `timeout` 工具来绕过这个问题，使得脚本至少可以优雅地退出并报告问题。然而，`timeout`\
  \ 不适用于函数，只适用于可以作为外部程序本身执行并超时的脚本和程序。这是完全可行的，只是 `get_lock` 必须实现为一个独立的脚本，而不是函数。\n\n\
  ## Structure\n\n这个配方展示了两个脚本：`domain-nolock.sh` 和 `domain.sh`。它们执行的任务相同。然而，`domain.sh`\
  \ 使用锁来控制脚本的主体。这确保了生成的输出文件是一致的。\n\n`domain.sh` 显示了实际脚本的主要工作原理。这是一个非常简单的脚本，对互联网域名进行\
  \ `whois` 查询，并检索创建和过期日期以及权威 DNS 服务器列表。它的低效之处在于它运行了三次 `whois`，这导致对 `whois` 服务器进行了三次独立的查询。这还可能导致你的\
  \ IP 地址被临时封禁进一步的 `whois` 查询。即使没有插入 `sleep` 语句来确保在这里清楚地显示效果，三次 `whois` 搜索大约需要 2 秒，因此最好是获取一次\
  \ `whois` 记录然后对该本地副本进行三次搜索。\n\n脚本使用 `tee -a` 将内容写入屏幕并追加到日志文件中。这产生了一些显著后果，锁定系统解决了这些问题。\n\
  \n![note.ai](img/note_fmt.gif)\n\n`Whois` 记录结构并不特别良好，因此简单通过输出进行 `grepping` 并不是获取信息的非常可靠的方法。\n\
  \n`domain.sh` 脚本有三个函数：`get_lock`、`release_lock` 和 `cleanup`。脚本的主体与 `domain-nolock.sh`\
  \ 相同，只是它先调用 `get_lock`，在完成后调用 `release_lock`。\n\n`get_lock` 是主函数。它等待锁释放，将自己的 `PID`\
  \ 添加到锁中，然后检查确保它是锁文件中唯一的 `PID`。锁的上一个所有者可能在没有清理锁文件的情况下已经挂了，因此该 `PID` 出现在锁文件中也是可以接受的。如果代码运行到这一阶段，说明它已经确定\
  \ `PID` 文件已释放。如果在锁文件中发现另一个 `PID`，它就假设自己输掉了竞争。它从锁中移除自己的 `PID`，进行退避，然后重试。它会一直运行外层的\
  \ `while` 循环，直到 `GOT_LOCK` 被设置为 1。\n\n`get_lock` 的第一部分在 `[ -s \"$LOCK\" ]` 时运行时循环。此循环等待锁文件长度为零或不存在。如果此条件已成立，则整个\
  \ `while` 循环被忽略。如果发现了锁文件且长度大于零，它会从锁文件中读取 `PID` 并使用 `ps` 查找进程名称。如果在进程表中找不到该 `PID`\
  \ 的名称，则上一个进程可能在没有释放锁的情况下结束，因此它通过带有另一个进程 `PID` 的 `release_lock` 从锁文件中移除该 `PID`。只释放该\
  \ `PID` 而不是移除整个锁，允许第三个进程已经注意到上一个 `PID` 已完成并已经获取了锁。当前实例在下一次循环之前不作任何假设，到那时它应该发现文件是空的。如果到那个阶段第三个进程已经获取了锁，那么该实例必须继续等待锁。\n\
  \n如果 `PID` 仍在运行，`get_lock` 会报告状态，增加其睡眠延迟并再次循环。什么构成了合适的延迟时间很大程度上取决于应用程序。定义一个上限可能是有用的；如果循环了\
  \ 360 次，那么延迟将是 6 分钟，然后是 6 分钟 1 秒，然后是 6 分钟 2 秒，以此此类推。\n\n一旦处理完初始的 `while` 循环，锁文件中没有运行中的进程。脚本将自己的\
  \ `PID` 追加到锁文件中，然后检查锁是否还包含其他内容。如果是，则另一个进程正在同时执行相同的操作。然而，由于 `grep` 会设置返回码，因此 `grep`\
  \ 和随后的 `if` 查询可以被视为原子的。如果 `grep` 命令未能在文件中列出另一个进程，则说明文件处于洁净状态，锁已获取。在操作系统级别，`grep`\
  \ 不是一个单一的原子命令；它本身是一个运行需要时间的进程，并可能在任何阶段被交换出。“写入后-grep”的过程加上文件系统的一致性，确实确保了这在效果上是原子的，因为另一个实例无论都会退避。表\
  \ 16-3 提供了对表 16-2 内容更详细的观察，并查看了最坏情况发生。\n\n**表 16-3 原子性**\n\n| 脚本一 | 脚本二 | 锁的内容 |\n\
  | --- | --- | --- |\n| `echo $$ >> $LOCK` | | PID #1 |\n| `grep -vw $MYPID $LOCK`\
  \ (中断) | | PID #1 |\n| | `echo $$ >> $LOCK` | PID #1, PID #2 |\n| `grep` (继续，返回失败；未发现其他进程使用锁)|\
  \ | PID #1, PID #2 |\n| | `grep -vw $MYPID $MYLOCK` (成功；自此 grep 开始前锁已两个 PID) | PID\
  \ #1, PID #2 |\n| `if` 检查 grep 返回码。看到失败，知道自己拥有锁，尽管另一个脚本已写入锁文件。 | | PID #1, PID #2\
  \ |\n| | `if` 检查 grep 返回码，并移除自己的 PID | PID #1 |\n| 将自己的 PID 写入锁文件以防万一。这本没有必要。 |\
  \ | PID #1 |\n\n如果 `grep` 命令成功，说明它发现了另一个也在尝试获取锁的进程。调用 `release_lock` 从锁文件中移除当前进程的\
  \ `PID`，随机睡眠（最长 5 秒）尝试确保两个进程再次碰撞，循环继续，因为 `GOT_LOCK` 尚未被设置。可能会两个实例都从锁中移除自己，但这不会造成伤害。\n\
  \n\n\n\n\n`release_lock` 函数使用一个简单的 `sed` 命令从锁文件中删除一行。`$MYPID` 周围的 `^` 和 `$` 分别表示行的开始和结束，因此整行必须与\
  \ PID 精确匹配。否则，从文件中删除 PID `123` 也会删除另一个针对 PID `1234\\.` 的不相关条目。从文件中删除一行的另一种常用技术是使用\
  \ `grep -v $PID $LOCK > /tmp/tempfile.$$$`，然后通过 `mv /tmp/tempfile.$$$ $LOCK` 将新文件移动回原始文件。这完全不是原子的，在\
  \ `grep` 和 `mv` 命令之间，另一个进程可能已经向文件写入了内容。这些更改将会丢失。虽然 `sed -i` 实际上做了相同的事情，但它的重叠操作是在系统调用层面的，比这些进程能够管理的速度快数百倍。\n\
  \n如果脚本被中断，会调用 `cleanup` 函数。这是通过 `trap` 实现的，用于在脚本完成前终止移除锁。\n\n## 配方 (Recipe)\n\n\
  ![download.eps](img/download_fmt.gif)\n\n```bash\n#!/bin/bash\nKEYFILE=/tmp/domains.txt\n\
  MYDOMAIN=$1\necho \"$MYDOMAIN Creation Date:\" | tee -a $KEYFILE\nsleep 2\nwhois\
  \ $MYDOMAIN | grep -i created | cut -d\":\" -f2- | tee -a $KEYFILE\nsleep 2\necho\
  \ \"$MYDOMAIN Expiration Date:\" | tee -a $KEYFILE\nsleep 2\nwhois $MYDOMAIN | grep\
  \ \"Expiration Date:\" | cut -d\":\" -f2- | tee -a $KEYFILE\nsleep 2\necho \"$MYDOMAIN\
  \ DNS Servers:\" | tee -a $KEYFILE\nsleep 2\nwhois $MYDOMAIN | grep \"Name Server:\"\
  \ | cut -d\":\" -f2- | \\\n      grep -v \"^$\" | tee -a $KEYFILE\nsleep 2\necho\
  \ \"... end of $MYDOMAIN information ...\" | tee -a $KEYFILE\n```\n\n### domain-nolock.sh\n\
  \n```bash\n#!/bin/bash\n# LOCK 是一个全局变量。对于这种用法，lock.myapp.$$ 是并不的。\n# /var/run 适用于\
  \ root 拥有的进程；其他人可以使用 /tmp 或 /var/tmp\n# 或者他们的家目录或应用程序文件系统。\n# LOCK=/var/run/lock.myapp\n\
  LOCK=/tmp/lock.myapp\nKEYFILE=/tmp/domains.txt\nMYDOMAIN=$1\nmydom=/tmp/${MYDOMAIN}.$$\n\
  # 不同的信号及其意图请参阅 kill(1)。\ntrap cleanup 1 2 3 6\nfunction release_lock\n{\n  MYPID=$1\n\
  \  echo \"Releasing lock.\"\n  sed -i \"/^${MYPID}$/d\" $LOCK\n}\nfunction get_lock\n\
  {\n  DELAY=2\n  GOT_LOCK=0\n  MYPID=$1\n  while [ \"$GOT_LOCK\" -ne \"1\" ]\n  do\n\
  \    PID=\n    while [ -s \"$LOCK\" ]\n    do\n      PID='cat $LOCK 2>/dev/null'\n\
  \      name='ps -o comm= -p \"$PID\" 2>/dev/null'\n      if [ -z \"$name\" ]; then\n\
  \        echo \"Process $PID has claimed the lock, but is not running.\"\n     \
  \   release_lock $PID\n      else\n        echo \"Process $PID ($name) has already\
  \ taken the lock:\"\n        ps -fp $PID | sed -e 1d\n        date\n        echo\n\
  \        sleep $DELAY\n        let AY=$DELAY + 1\n      fi\n    done\n    # 将我们的\
  \ PID 存储在锁文件中\n    echo $MYPID >> $LOCK\n    # 如果另一个实例写入了锁，它将包含\n    # hơn $$ 和\
  \ PID\n    # PID 可能是空的，所以用引号括起来。\n    # 否则它会变成 \"-e $LOCK\" 且不传递文件名\n    grep -vw\
  \ $MYPID $LOCK > /dev/null 2>&1\n    if [ \"$?\" -eq \"0\" ]; then\n      # 如果 $?\
  \ 为 0，说明 grep 找到了其他内容。\n      echo \"An error occurred. Another process has taken\
  \ the lock:\"\n      ps -fp 'grep -vw -e $MYPID -e \"$PID\" $LOCK'\n      # 其他进程可以处理自己。\n\
  \      # 放弃对锁的访问\n      # sed -i 可以原子地做到这一点。\n      # 通过随机睡眠时间后退。\n      sed -i\
  \ \"/^${MYPID}$/d\" $LOCK\n      sleep $((RANDOM % 5))\n    else\n      GOT_LOCK=1\n\
  \      # 获取锁的独占访问权限\n      echo $MYPID > $LOCK\n    fi\n  done\n}\nfunction cleanup\n\
  {\n  echo \"$$: Caught signal: Exiting\"\n  release_lock\n  exit 0\n}\n# 主脚本在这里。\n\
  # 你可能想在没有锁的情况下执行事情。\n# 然后为独占工作获取锁\nget_lock $$\n############\n# 执行某些操作 #\n############\n\
  echo \"$MYDOMAIN Creation Date:\" | tee -a $KEYFILE\nsleep 2\nwhois $MYDOMAIN |\
  \ grep -i created | cut -d\":\" -f2- | tee -a $KEYFILE\nsleep 2\necho \"$MYDOMAIN\
  \ Expiration Date:\" | tee -a $KEYFILE\nsleep 2\nwhois $MYDOMAIN | grep \"Expiration\
  \ Date:\" | cut -d\":\" -f2- | tee -a $KEYFILE\nsleep 2\necho \"$MYDOMAIN DNS Servers:\"\
  \ | tee -a $KEYFILE\nsleep 2\nwhois $MYDOMAIN | grep \"Name Server:\" | cut -d\"\
  :\" -f2- | \\\n      grep -v \"^$\" | tee -a $KEYFILE\nsleep 2\necho \"... end of\
  \ $MYDOMAIN information ...\" | tee -a $KEYFILE\n```\n\n### domain.sh\n\n#### 调用\
  \ (Invocation)\n\n以下输出显示了两个 shell。第一个 shell 提示 Instance One，它调用 domain-nolock.sh\
  \ 处理 example.com。该脚本运行完成，一切正常。\n\n```\n Instance One$ ./domain-nolock.sh example.com\n\
  example.com Creation Date:\n      1992-01-01\nexample.com Expiration Date:\n  13-aug-2011\n\
  example.com DNS Servers:\n  A.IANA.NET\nB.IANA.NET\n... end of example.com information\
  \ ...\nInstance One$\n```\n\n第二个 shell 提示 Instance Two，它调用 domain-nolock.sh 处理 example-parker.org。再次一切正常。\n\
  \n```\n Instance Two$ ./domain-nolock.sh example-parker.org\nexample-parker.org\
  \ Creation Date:\n      2000-06-15\nexample-parker.org Expiration Date:\n  2005-06-15\n\
  example-parker.org DNS Servers:\n\n... end of example-parker.org information ...\n\
  Instance Two$\n```\n\n只有在回读输出文件时问题才会出现。两个脚本同时向同一个文件写入，现在它变得混乱不堪：\n\n```\n Instance\
  \ One$ cat /tmp/domains.txt\nexample.com Creation Date:\n      1992-01-01\nexample-parker.org\
  \ Creation Date:\n2000-06-15\nexample.com Expiration Date:\n  13-aug-2011\nexample-parker.org\
  \ Expiration Date:\n2005-06-15\nexample.com DNS Servers:\n  A.IANA.NET\nB.IANA.NET\n\
  example-parker.org DNS Servers:\n... end of example.com information ...\n... end\
  \ of example-parker.org information ...\nInstance One$\n```\n\n更好的解决方案是使用锁。这次，调用\
  \ domain.sh 的域名 example.com。该脚本运行完成，再次除了最后的 Releasing lock 注释外，似乎没有任何异常。\n\n```\n\
  \ Instance One$ ./domain.sh example.com\nexample.com Creation Date:\n      1992-01-01\n\
  example.com Expiration Date:\n  13-aug-2011\nexample.com DNS Servers:\n  A.IANA.NET\n\
  B.IANA.NET\n... end of example.com information ...\nReleasing lock.\nInstance One$\n\
  ```\n\n第二个实例也调用了 domain.sh，这次是处理 example-parker.org 域名。该实例不断读取锁文件，并等待 2 秒、3 秒、4\
  \ 秒、5 秒，直到锁被释放。第二个实例随后继续进入代码的关键部分，向屏幕和输出文件写入内容，这些不能由两个并发进程同时写入。\n\n\n\n\n\n```\n\
  Instance Two$ ./domain.sh steve-parker.org\nProcess 14228 (domain.sh) has already\
  \ taken the lock:\nsteve    14228 12786  0 12:47  pts/7    00:00:00 /bin/bash ./domain.sh\
  \ example.com\nFri Apr 22 12:47:11 BST 2011\nProcess 14228 (domain.sh) has already\
  \ taken the lock:\nsteve    14228 12786  0 12:47  pts/7    00:00:00 /bin/bash ./domain.sh\
  \ example.com\nFri Apr 22 12:47:14 BST 2011\nProcess 14228 (domain.sh) has already\
  \ taken the lock:\nsteve    14228 12786  0 12:47  pts/7    00:00:00 /bin/bash ./domain.sh\
  \ example.com\nFri Apr 22 12:47:17 BST 2011\nProcess 14228 (domain.sh) has already\
  \ taken the lock:\nsteve    14228 12786  0 12:47  pts/7    00:00:00 /bin/bash ./domain.sh\
  \ example.com\nFri Apr 22 12:47:21 BST 2011\nsteve-parker.org Creation Date:\n20-Jun-2000\
  \ 13:48:46 UTC\nsteve-parker.org Expiration Date:\n20-Jun-2011 13:48:46 UTC\nsteve-parker.org\
  \ DNS Servers:\nNS.123-REG.CO.UK\nNS2.123-REG.CO.UK\n... end of example.com information\
  \ ...\nReleasing lock.\nInstance Two$\n```\n\n输出文件现在整洁地分为两个部分：第一部分是 `example.com`\
  \ 的详细信息，第二部分是 `steve-parker.org` 的详细信息。\n\n```\nInstance One$ cat /tmp/domains.txt\n\
  example.com Creation Date:\n      1992-01-01\nexample.com Expiration Date:\n  13-aug-2011\n\
  example.com DNS Servers:\n  A.IANA-SERVERS.NET\n  B.IANA-SERVERS.NET\n... end of\
  \ example.com information ...\nsteve-parker.org Creation Date:\n20-Jun-2000 13:48:46\
  \ UTC\nsteve-parker.org Expiration Date:\n20-Jun-2011 13:48:46 UTC\nsteve-parker.org\
  \ DNS Servers:\nNS.123-REG.CO.UK\nNS2.123-REG.CO.UK\n... end of steve-parker.org\
  \ information ...\nInstance One$\n```\n\n## 总结\n\n锁（Locks）是确保运行代码的某个实例与其他所有实例区别对待的有用方法，因为它是持有锁的唯一实例。一旦持有锁，对于该独占权限可以用于什么没有任何限制。它可以用于写入文件（如本食谱所示），也可以用于确保进程只有一个实例在运行。它可以用于任何情况，即在这些情况下，我们希望执行某些特定操作的进程知道其他进程在它执行时不会干扰它。\n\
  \n正如调用示例所示，无论是否锁定，第一个进程都会继续运行，完全不知道另一个进程甚至在运行，更不用说想要访问第一个实例正在使用的相同资源了。两者的区别在于，锁定版本知道它已经安排了对资源的独占访问。\n\
  \n# 第 17 章\n\n## 展示（Presentation）\n\n展示可以对用户对 Shell 脚本的印象产生巨大影响，还可以使其使用变得显著容易得多。并不是所有的\
  \ Shell 脚本都是为了完成一次性任务而存在的临时补丁；有些脚本会使用多年，并在在此期间被各种人士使用。因此，脚本不限于在黑色背景上打印顺序白色文本行是好事。本章展示了\
  \ Shell 脚本能够实现的一些，而不需要任何复杂的技巧或对其他子系统的依赖。\n\n## 食谱 17-1：太空游戏\n\n这个食谱的灵感源自 20 世纪 70\
  \ 年代的经典街机游戏《太空侵略者》（Space Invaders）。目标是在外星人到达地球（由屏幕底部表示）之前消灭它们。你可以使用“a”和“l”键左右移动你的飞船，并通过按下“f”键发射火炮。你一次只能发射一次火炮。\n\
  \n## 使用的技术\n\n*   `kill`、`trap` 和 `SIGALRM` 用于计时\n*   `read` 的高级用法，用于对按键做出及时响应\n\
  *   `tput` 控制终端\n*   显示的 ANSI 颜色\n*   数组，特别是将数组传递给函数\n*   用于计算位置和碰撞检测的基础数学\n\n##\
  \ 概念\n\n游戏本身背后的概念相当简单。外星人从左向右再来回，并从屏幕上方向你移动，所以它们每当到达屏幕右侧时就会向下移动一行文本。这是通过每次增加 `ceiling`\
  \ 变量来实现的；外星人渲染在 `(row*2) + ceiling` 处；乘以 2 意味着每波外星人之间有一个空行，而在这个值加上不断增加的 `ceiling`\
  \ 意味着整个军队随着时间的推移变得越来越低。\n\n你有一门激光炮，它由一对变量 `cannonX` 和 `cannonY` 表示，这两个变量跟踪飞船。数据结构相当简单；`aliens1`\
  \ 和 `aliens2` 数组仅包含每行外观的编码。使用两个不同的数组和模 2 函数 `((offset % 2 == 0))`，外星人看起来在屏幕上移动得更加生动。\n\
  \n实时读取按键，而无需用户在每次击键后按下回车键，以及屏幕的定期重绘，这这两个元素使得 Shell 看起来是不适合这种游戏的语言。`read -n` 语法在旧的\
  \ Unix 系统中不存在，但 GNU 系统和 Solaris 10 提供了它。外星人的实时更新通过 `SIGALRM` 信号执行，该信号每隔 `$DELAY`\
  \ 秒唤醒一次以刷新显示。每当脚本被唤醒时，`move` 函数会在 `$DELAY` 秒后设置另一个闹钟，就像按下闹钟的“小睡”按钮一样。\n\n脚本中的 `sleep\
  \ $DELAY` 假设 `sleep` 可以接受非整数；这对于 GNU `sleep` 是正确的，但对于传统的 Unix `sleep` 则不是，后者不能低于\
  \ `sleep 1`，即睡眠一整秒。这使得游戏在 Unix 上玩起来相当慢，遗憾。一种可能的变通方法是每 `X` 次迭代睡眠一次，正当 `$DELAY` 逐渐减小的同时，`X`\
  \ 逐渐增大。这按照传统做法，被留给读者练习。\n\n由于读取键盘输入的的循环与对 `move` 函数的定时调用是独立的，因此你可以对飞船的移动获得正向反馈，而不会受外星人位置更新的干扰。这种独立性对于让游戏感觉是具有交互性的而不仅仅是基于回合的至关重要。\n\
  \nBash 数组最令人沮丧的事情之一是，它们不能作为参数传递给函数，也无法作为返回值返回。针对这个问题有一个变通方法；使用 `\"${a[@]}\"` 运行函数，然后处理\
  \ `\"$@\"`（在这两种情况下引号都是至关重要的）可以解决这个问题，包括保留数组元素中的任何空格。\n\n\n\n\n\n```bash\n $ cat\
  \ func-array.sh\n#!/bin/bash\na=( one \"two three\" four five )\nfunction myfunc\n\
  {\n  for value in \"$@\"\n  do\n    echo I was passed: $value\n  done\n}\nmyfunc\
  \ \"${a[@]}\"\n$ ./func-array.sh\nI was passed: one\nI was passed: two three\nI\
  \ was passed: four\nI was passed: five\n$\n```\n\n### `func-array.sh`\n\n函数无法将数组作为值返回，尽管它们可以返回基本值，但这种方法并不特别健壮，而且完全无法处理空格。作为参考，这段代码片段已经是\
  \ bash 所能做到的极致了，但它的用途有限。\n\n![download.eps](img/download_fmt.gif)\n\n```bash\n $\
  \ cat array-func.sh\n#!/bin/bash\na=( one two three four five )\nfunction myfunc\n\
  {\n  declare -a b\n  i=0\n  for value in \"$@\"\n  do\n    b[i]=\"abc.${value}.def\"\
  \n    ((i++))\n    shift\n  done\n  echo \"${b[@]}\"\n}\nfor value in \"${a[@]}\"\
  \ndo\n  echo \"Item is $value\"\ndone\ndeclare -a c\nc=('myfunc \"${a[@]}\"')\n\
  for value in \"${c[@]}\"\ndo\n  echo \"Converted Item is $value\"\ndone\n$ ./array-func.sh\n\
  Item is one\nItem is two\nItem is three\nItem is four\nItem is five\nConverted Item\
  \ is abc.one.def\nConverted Item is abc.two.def\nConverted Item is abc.three.def\n\
  Converted Item is abc.four.def\nConverted Item is abc.five.def\n$\n```\n\n### `array-func.sh`\n\
  \n## 潜在陷阱\n\n碰撞检测是最难做对的，特别是当外星人的宽度超过一个单元格时。保持屏幕清晰也需要一些警惕；屏幕刷新过于频繁会破坏游戏，因为会导致过度闪烁。相对来说，调用\
  \ `clear` 命令需要非常长时间，并且会让显示非常闪烁。\n\n在编写此脚本时，所做的最重大更改之一是将取模函数从 `for` 循环内部对外部 `expr`\
  \ 命令的调用替换为内置的 `(( ... %2 ))` 结构，这意味着 `expr` 不再为每个外星人（无论死活）都被调用一次。从 `expr` 切换到内置方法意味着改变外星人的形状是可能的；如果没有这个更改，速度将慢得令人痛苦。将取模运算移出\
  \ `for` 循环也再次稍微提高了效率，尽管这种提升并不十分明显。\n\n## 结构\n\n脚本的开头和结尾都是 `tput` 命令。这在游戏开始前让光标隐藏（`tput\
  \ cinvis`），并在退出后让它重新可见（`tput cvvis`）。另一个小细节是在你退出游戏时取消对 `SIGALRM` 的陷阱捕获（trap），这样\
  \ `move` 函数就不会在脚本结束后尝试发送 `SIGALRM`。这些只是微小的细节，但它们显著地提升了观感。或者说，如果没有了它们，观感会糟糕得多。\n\n\
  该脚本的结构由四个核心函数以及一个主循环组成。从脚本底部向上看，主循环仅从键盘读取单个字符（`read -n 1`），如果按键是“左”或“右”指令（分别为“a”和“l”），它将更新飞船的位置以匹配。飞船将立即重绘。如果按了发射键（“f”）且大炮未在使用中（`cannonY\
  \ -eq 0`），则相对于你飞船当前的 X 坐标设置 `cannonX`，并将 `cannonY` 设置为飞船的 Y 轴（固定在屏幕底部）。\n\n每当按键移动你的太空船时，主循环都会调用\
  \ `drawship`。该函数使用 `printf` 语句清除整行，并作为装饰，对飞船内部的大炮进行颜色编码，以显示其是否已武装。由于这与 `move` 函数分离，它可以为你的飞船移动提供实时更新，不像缓慢的外星飞船那种单调更新。`drawship`\
  \ 也作为 `move` 函数的一部分调用，这样即使船没有移动，大炮的更新也能定期反映。\n\n主循环上方是 `move` 函数。`move` 函数使用 `SIGALRM`\
  \ 在 `$DELAY` 秒后调用自己。`DELAY` 随着时间推移而变短，因此外星人向你移动的速度越来越快。每次调用 `move`，外星人都会沿着它们的方向再移动一个格子。当它们到达屏幕边缘时，`direction`\
  \ 变量会反转，以便它们向相反方向移动。每当它们碰到屏幕右侧时，它们也会向下移动一行（通过增加天板高度）。\n\n`move` 然后为每一行外星人调用一次 `drawrow`\
  \ 函数。由于 bash 没有多维数组，外星人的行数被硬编码在脚本中。如果使用循环遍历这些行会很好，但即使有六行外星人，调用六次 `drawrow` 函数也不算繁琐。`drawrow`\
  \ 返回渲染过程中任何击中大炮的外星人的索引，如果当前行没有外星人被击中，则返回零。这对数组的结构产生了影响；数组从零开始索引，但由于零在 `drawrow`\
  \ 的返回码中具有特殊含义，存储外星点的数组 `row0` 到 `row5` 并不使用 `index[0]`，这可能有点笨拙，但它意味着每次调用 `drawrow`\
  \ 后的下一行简单地设置 `rowX[$?]=0`。如果 `$?` 为零，则未使用的 `[0]` 索引会被更新，这对其他任何内容都没有影响。如果 `$?` 大于零，则它指向一个外星人，因此存储其分值的数组变量将被设置为零。这样做的效果是后续的\
  \ `drawrow` 调用不会在该位置绘制外星人，碰撞检测将允许大炮射穿该间隙，而不是停在那里。更整洁的实现需要在每次调用 `drawrow` 后后跟一些更复杂的代码，检查返回值并仅在实际上击中外星人时更新数组。本教程中使用的方法执行速度略快，而且更重要的是，它更易阅读和维护。\n\
  \n接下来计算存活的外星人数量，如果你消灭了所有入侵力量，将显示祝贺消息并退出游戏。也许游戏应该在下一波中带有更快的外星人继续进行；这很容易实现，但会增加一些复杂性并使代码变长。\n\
  \n最后，`move` 调用 `drawcannon` 函数。这可以写在 `move` 函数内部，但将其抽象成一个独立的函数会更整洁一些。`drawcannon`\
  \ 只是在之前的位置上方覆盖一个空格字符，计算新位置（比之前高一个单元格），并在那里重绘大炮。\n\n`drawrow` 函数承担了大部分繁重工作。除了渲染外星人，它还执行碰撞检测以查看你是否成功命中。它的第一个参数告诉它要绘制什么类型的外星人，其余的是相应的\
  \ `rowX()` 数组的值。如之前所述，将数组传递给函数很困难，这并不是唯一的方法，但它保持了代码的简单。`shift` 将 `alientype` 参数移出：剩下的\
  \ `$@` 就是值列表，告诉 `drawrow` 哪些外星人仍然存活，以及它们值多少分。这种实现也留下了很大的活性，允许外星人能够承受多次击；`drawrow`\
  \ 不需要将值减为零，而是简单地从外星人的生命值中减去一个固定值，使其可能仍大于零，这样在随后的运行中仍然会被渲染，直到它被完全摧毁。\n\n\n\n\n\n\
  该函数首先计算当前行是否有需要绘制的外星人。如果该行没有需要绘制的外星人，则该行将不计入外星人入侵尝试，因此函数在进行任何进一步测试之前退出。如果函数继续运行，它将计算要绘制当前行的高度。如果该高度与\
  \ `$bottom` 变量（该变量定义了飞船的固定 Y 位置）相同，则表示入侵成功，你输了游戏，程序将带有相应的消息退出。否则，脚本继续执行。\n\n对于每个外星人，如果它存在，则会将外星人占据的空间与激光炮的位置进行比较。如果它们匹配，则用\
  \ `$avatar` 变量定义的外星人显示图标替换为三颗红星，以表示发生爆炸。玩家得分将根据数组中存储的值增加，而 `$killed` 变量存储该外星人在数组中的索引，以便调用它的\
  \ `drawrow` 函数将其清零。这样可以节省 `drawrow` 无需知道数组名称即可进行更新。如果 `bash` 支持多维数组，这种做法是不必要的，但由于每行都是一个独立的数组，让\
  \ `drawrow` 将索引返回给调用者，并由调用者维护状态且根据已死亡外星人的索引更新相应的数组更为方便。最后，显示外星人（或相应的空格），循环返回以绘制该行中的下一个外星人。\n\
  \n## 配方\n\n```bash\n#!/bin/bash\nstty -echo\n# 隐藏光标 (man terminfo)\ntput civis\n\
  clear\ncat - << EOF\n           SPACE\n   LEFT:      a\n   RIGHT:     l\n   FIRE:\
  \      f\n   QUIT:      q\n                           按任意键。\nEOF\nread -s -n 1\n\
  row0=( 0 30 30 30 30 30 30 30 30 )\nrow1=( 0 20 20 20 20 20 20 20 20 )\nrow2=( 0\
  \ 15 15 15 15 15 15 15 15 )\nrow3=( 0 10 10 10 10 10 10 10 10 )\nrow4=( 0 5 5 5\
  \ 5 5 5 5 5 )\nrow5=( 0 1 1 1 1 1 1 1 1 )\naliens1=( '\\033[1;32m|0|\\033[0m' '\\\
  033[1;34m\\-/\\033[0m'\n          '\\033[1;35m:x:\\033[0m' '\\033[1;38m:#:\\033[0m'\n\
  \          '\\033[1;33m!|!\\033[0m' '\\033[1;39m:-:\\033[0m' )\naliens2=( '\\033[1;32m:0:\\\
  033[0m' '\\033[1;34m/-\\\\\\033[0m'\n          '\\033[1;35m-x-\\033[0m' '\\033[1;38m-#-\\\
  033[0m'\n          '\\033[1;33m:|:\\033[0m' '\\033[1;39m-:-\\033[0m' )\nscore=0\n\
  # 最左侧的外星人可以到达的最右侧\nMAXRIGHT=46\n# 飞船可以到达的最右侧\nFARRIGHT=73\n# 飞船当前位置 (x 轴)\nship=30\n\
  # 激光炮列；飞船移动时保持不变\ncannonX=$ship\n# 激光炮高度；0 表示准备好发射\ncannonY=0\n# 向右为正，向左为负\ndirection=1\n\
  offset=20\nbottom=20\nceiling=4\nMAXCEILING=6\nDELAY=0.4\nfunction drawrow\n{\n\
  \  # 绘制一行外星人；返回被击中外星人的索引\n  # 注意任何时候只能击中一个外星人\n  alientype=$1\n  shift\n  let row=\"\
  $alientype * 2 + $ceiling\"\n  aliensonrow='echo $@ | tr ' ' '+' | bc'\n  if [ $aliensonrow\
  \ -eq 0 ]; then\n    # 这里什么都不做。特别是，不要检测失败。\n    # 只清空上一行（包含该行的最后的爆炸）\n    # 并返回。\n\
  \    tput cup $row 0\n    printf \"%80s\" \" \"\n    return 0\n  fi\n  if [ $row\
  \ -eq $bottom ]; then\n    tput cup $((bottom-4)) 6\n    trap exit RM\n    echo\
  \ \"YOU LOSE\"\n    sleep $DELAY\n    stty echo\n    tput vis\n    exit 1\n  fi\n\
  \n  declare -a row\n  thisrow=( echo $@ )\n  tput cup 0\n  printf \"Score: %-8d\"\
  \ $score\n  killed=0\n  # 清除上一行\n  tput cup $((row-1)) 0\n  printf \"%80s\" \" \"\
  \n  tput cup $row 0\n  printf \"%80s\" \" \"\n  tput cup $row \"%-${offset}s\"\n\
  \  # 不要在循环中进行此计算，否则会慢\n  if (( $offset % 2 == 0 )); then\n    thisrow=${aliens1[$alientype]}\n\
  \  else\n    thisrow=${aliens2[$alientype]}\n  fi\n  # 每行 8 个外星人\n  for i in `seq\
  \ 1 8`\n  do\n    value=${thisrow[$i]}\n    avatar=$alien\n    if [ $value -gt 0\
  \ ]; then\n      # 检测并标记碰撞\n      if [ $row -eq $cannonY ]; then\n        let LEFT=\"\
  $i*4 + $offset-4\"\n        let RIGHT=\"$i*4 + $offset-1\"\n        if [ $cannonX\
  \ -ge $LEFT ] && [ $cannonX -le $RIGHT ]; then\n        killed=$i\n        avatar='\\\
  033[1;31m***\\033[0m'\n        ((score=$score + $value))\n        cannonY=0\n  \
  \    fi\n    fi\n    if [ $value -eq 0 ]; then\n      printf \"     \"\n    else\n\
  \      echo -en \"${avatar} \"\n    fi\n  done\n  return $killed\n}\nfunction drawcannon\n\
  {\n  # 将激光炮向上移动一个\n  if [ $cannonY -eq 0 ]; then\n    # 掉出了屏幕顶部\n    return\n  fi\n\
  \  tput cup $cannonY $cannonX\n  printf \" \"\n  ((cannonY=cannonY-1))\n  tput cup\
  \ $cannonY $cannonX\n  echo -en \"\\033[1;31m*\\033[0m\"\n}\nfunction drawship\n\
  {\n  tput cup $bottom 0\n  printf \"%80s\" \" \"\n  tput cup $bottom $ship\n  #\
  \ 通过飞船中的颜色显示激光炮状态\n  if [ $cannonY -eq 0 ]; then\n    col=31\n  else\n    col=30\n\
  \  fi\n  echo -en \"|--\\033[1;${col}m*\\033[0m--|\"\n}\nfunction move\n{\n  # 将外星人向左或右移动\n\
  \  # 移动激光炮，检查碰撞\n  (sleep $DELAY && kill -RM $$) &\n  # 如果击中屏幕边缘则改变方向\n  if [ $offset\
  \ -gt $MAXRIGHT ] && [ $direction -eq 1 ]; then\n    # 击中屏幕右侧加速\n    DELAY='echo\
  \ $DELAY*.90 | bc'\n    direction=-1\n    ((ceiling++))\n  elif [ $offset -eq 0\
  \ ] && [ $direction -eq -1 ]; then\n    direction=1\n  fi\n  ((offset=offset+direction))\n\
  \  drawrow ${row0[@]}\n  row0[?]=0\n  drawrow ${row1[@]}\n  row1[?]=0\n  drawrow\
  \ ${row2[@]}\n  row2[?]=0\n  drawrow ${row3[@]}\n  row3[?]=0\n  drawrow ${row4[@]}\n\
  \  row4[?]=0\n  drawrow ${row5[@]}\n  row5[?]=0\n  aliensleft='echo ${row0[@]} ${row1[@]}\
  \ ${row2[@]} ${row3[@]} ${row4[@]} ${row5[@]} | tr '+' | bc'\n  if [ $aliensleft\
  \ -eq 0 ]; then\n    tput cup 5 5\n    trap exit RM\n    echo \"YOU WIN\"\n    sleep\
  \ $DELAY\n    stty echo\n    tput vis\n    exit 0\n  fi\n  drawcannon\n  drawship\n\
  }\ntrap move RM\nclear\ndrawship\nwhile :\ndo\n  read -s -n 1 key\n  case \"$key\"\
  \ in\n    a)\n      [ $ship -gt 0 ] && ((ship=ship-1))\n      drawship\n      ;;\n\
  \    l)\n      [ $ship -lt $FARRIGHT ] && ((ship=ship+1))\n      drawship\n    \
  \  ;;\n    f)\n      if [ $cannonY -eq 0 ]; then\n        let cannonX=\"$ship+3\"\
  \n        cannonY=$bottom\n      fi\n      ;;\n    q)\n      echo \"Goodbye!\"\n\
  \      tput vis\n      stty echo\n      trap exit RM\n      exit 0\n      ;;\n \
  \ esac\ndone\n```\n\n## 调用\n\n以正常方式运行游戏，在彩色的终端上应显示全彩游戏，且闪烁极小。[图 17-1](https://wiki.example.org/figure17-1)\
  \ 显示游戏进行中。\n\n[图 17-2](https://wiki.example.org/figure17-2) 显示了外星人被击中时的爆炸。三颗红星标记了爆炸。\n\
  \n[图 17-3](https://wiki.example.org/figure17-3) 显示了外星人落在地球上游戏结束。\n\n[图 17-4](https://wiki.example.org/figure17-4)\
  \ 显示了玩家消灭所有入侵者后的胜利。\n\n\n\n\n尽管这只是为了好玩，但这个配方展示了创建比通常作为交互式 shell 脚本的“按 1 继续，按 2 退出”类型菜单更具交互性和参与感的\
  \ shell 脚本是可能的。shell 的远比我们平时利用的要多，尽管 shell 远不是游戏开发的完美语言，但我希望这个配方能激发人们对 shell 脚本更有创意的使用，特别是\
  \ `bash` shell 中可用的新特性（如数组）以及 GNU 环境中的特性（例如 `sleep` 能够执行亚秒睡眠，如果没有它，这个游戏玩起来无趣得多）。\n\
  \n# 第 18 章 数据存储与检索\n\n检索、处理和存储数据是计算的核心。本章介绍了执行此任务的两个不同配方。第一个处理 HTML 文档以识别并使用文档中包含的任何链接。这看起来并没有那么简单，因此这个配方涵盖了必须完成的一些工作，以确保不会遗漏任何链接，并且普通文本不会被轻易误认为链接。第二个配方从\
  \ Linux 内核的 `/proc` 伪文件系统中解析内核状态并将其转换为 CSV，这样就可以被电子表格软件解析并用于创建图表。\n\n这两个配方相互平衡，因为第一个读取的是实际上打算供图形化桌面软件（如网络浏览器）读取的数据。第二个创建的是可以被桌面表格软件解释的数据。尽管是纯基于文本的，shell\
  \ 在解析以及为图形软件创建数据方面也可以发挥作用。\n\n## 配方 18-1：解析 HTML\n\nHTML 是一种非常常见的标记语言，但世界上有很多编写糟糕的\
  \ HTML，这使得解析此类文件非常困难。这个配方展示了一种从 HTML 中剥离标签（`<a>`、`<li>` 等）的结构。`downloader.sh` 脚本处理\
  \ `<a>` 标签，并将链接 保存到以锚文本命名的文件中。输入 `<a href=\"http://www.example.com/\">This is an\
  \ example web site</a>` 将把 `www.example.com` 的索引页下载到名为“This is an example web site”的文件。\n\
  \n## 使用的技术\n\n- `tr`\n- `((suffix++))`\n- `wget`\n\n## 概念\n\n这个配方采取的实际操作并不特别重要；`wget\
  \ -Fi` 能够完成与此脚本实现非常相似的事情，但这个脚本的核心实际上是从 HTML 输入中剥离标签。\n\n这个配方中使用了一些 HTML 术语；在输入 `<a\
  \ href=\"/eg.shtml\">example pages</a>` 中，`/eg.shtml` 是链接，`example pages` 是锚文本。默认情况下，锚文本在浏览器中以蓝色带下划线的文本显示，而链接是点击锚文本后将显示的页面地址。\n\
  \n该配方使用了一个非常粗略的状态机来跟踪脚本到达 HTML 输入的哪个位置。如果没有它，就必须对输入文件的格式做多得假设。\n\n## 潜在陷阱\n\n在处理\
  \ HTML 时有许多陷阱；这种语言没有单一的定义，尽管今天大多数 HTML 都是 HTML 4.01、XHTML 或某些未验证的标签杂乱组合，这大致对应（但不完全对应）于\
  \ HTML 3 点。该配方尝试以一种合理的方式将输入结构化为一组标签，但它确实对结构做了一些隐式假设。如果输入文件能够被网络浏览器渲染，那么该配方也应该能够从中剥离出链接。\n\
  \n## 结构\n\n配方的开头清空了关键变量并设置了下载目录（如果目录不存在则创建）。`INFILE` 变量被设置为 `${HOME}/.mozilla/firefox/*/bookmarks.html`，这表明即使在\
  \ `${1:-default}` 语法内部也可以变量。\n\n一长串 `tr` 语句将输入结构化为一行的 HTML，然后将任何 `<` 和 `>` 符号转换为换行符。在换行和空格之后，另一类空白字符是制表符，因此这些被转换为空格，然后通过\
  \ `tr -s ' '` 将任何连续的空格压缩为单个空格。这就是 HTML 期望处理空白字符的方式。这确实有一个副作用，即带有多个空格的锚文本也会被压缩；这也是网络浏览器处理此类输入时所做的。`<a\
  \ href=\"/eg.shtml\">example pages</a>` 变成了三行输入：\n\n- `a href=\"/eg.shtml\"`\n-\
  \ `example pages`\n- `/a`\n\n随后 `while` 语句就可以预期找到被剥离成单行的输入；`while` 语句的体部是一个单一的 `if\
  \ ... else` 语句，其中 `else` 部分在这里在此处首先被涵盖。`else` 部分继续测试标签是否为 `(`（或 `A`），并且这个非常粗略的状态机当前状态不在锚点内部（因为正如注释所说，`<a\
  \ href=\"#\">a href</a>` 是有效的，尽管这不太可能）。锚文本也可能是一个欢迎页，但仅仅因为第一个单词是“a”，并不意味着这就是链接的开始。如果标签是\
  \ `a` 且尚未在处理锚文本，则处理该链接。\n\n解析链接本身可能是麻烦的；这里作为示例的 Firefox 书签包含了诸如 `A HREF=\"http://fxfeeds.mozilla.com/en-US/firefox/livebookmarks/\"\
  \ FEEDURL=\"http://fxfeeds.mozilla.com/en-US/firefox/headlines.xml\" ID=\"rdf:#$HvPhC3\"\
  ` 的链接。为了从这些中提取出正确的部分，配方再次将内容拆分为行，并只获取包含 `href` 的那一行。它从第 7 个字符开始裁剪（以丢失 `a href=`），然后剪掉任何（但并不总是）位于\
  \ URL 周围的引号。最后，如果获取的链接包含任何文本，变量 `$state` 被设置为 `anchor`。\n\n`if ... else` 语句的另一半处理其他情况。`if`\
  \ 语句本身测试 `$state` 是否为 `anchor` 且 `$tag` 不为空。如果标签是 `img`，那么锚“文本”实际上是一张图像；无法将图像信息保存为文件名，因此脚本将保存为\
  \ `img.1`、`img.2` 等。它只需通过清空行的其余部分来实现这一点，因此 `img src=\"/example.png\"` 变成了 `img`。\n\
  \n然后，如果锚文本是多个单词，变量 `$label` 将包含第一个单词之后剩余的单词，因此 `filename=\"$tag $label\"`。否则，唯一的单词就是锚文本，因此\
  \ `filename=$tag`。脚本随后检查该文件在下载目录中已存在。如果存在，它会检查 `${filename}.1`、`${filename}.2` 等。简单的\
  \ `while` 循环通过追加并增加后缀来实现这一点，直到 `$filename` 变量包含一个不存在的文件名。\n\n最后，在读取链接、将状态设置为 `anchor`\
  \ 并读取锚文本后；调用 `wget` 下载文件。输出被保存到临时文件中，如果 `wget` 因为任何原因失败，则显示其输出。否则，因为会占据屏幕上的大量空间，如果命令成功则省略输出。随后清空\
  \ `$state` 变量，以便整个过程可以重新开始。\n\n\n\n\n# downloader.sh\n\n```bash\n#!/bin/bash\nINFILE=${1:-${HOME}/.mozilla/firefox/*/bookmarks.html}\n\
  state=\nlink=\ndownload=/tmp/download\nmkdir -p \"$download\" 2>/dev/null\nBASE_URL=http://steve-parker.org\n\
  cat $INFILE | \\\n    tr '\\n' ' ' | tr '<' '\\n' | tr '>' '\\n' | tr '\\t' ' '\
  \ | tr -s ' '  | \\\n    while read tag label\ndo\n  if [ \"$state\" == \"anchor\"\
  \ ] && [ ! -z \"$tag\" ]; then\n    if [ \"$tag\" == \"img\" ]; then\n      label=\n\
  \    fi\n    if [ -z \"$label\" ]; then\n      filename=$tag\n    else\n      filename=\"\
  $tag $label\"\n    fi\n    origname=$filename\n    suffix=1\n    while [ -f \"${download}/${filename}\"\
  \ ]\n    do\n      filename=\"${origname}.${suffix}\"\n      ((suffix++))\n    done\n\
  \    echo \"Retrieving $link as $filename\"\n    # Prepend BASE_URL if not otherwise\
  \ valid\n    firstchar='echo $link | cut -c1'\n    case \"$firstchar\" in\n    \
  \  \"/\") link=${BASE_URL}$link ;;\n      \"#\") link=${BASE_URL}/$link ;;\n   \
  \ esac\n    wget -O \"${download}/${filename}\" \"$link\" > /tmp/wget.$$ 2>&1\n\
  \    if [ \"$?\" -eq \"0\" ]; then\n      ls -ld \"${download}/${filename}\"\n \
  \   else\n      echo \"Retrieving $link failed.\"\n      cat /tmp/wget.$$\n    fi\n\
  \    state=\n  else\n    if [ \"$tag\" == \"A\" ] || [ \"$tag\" == \"a\" ]; then\n\
  \      # Only do this if not already in an anchor;\n      #   <a href=\"#\">a href</a>\
  \ is valid!\n      if [ \"$state\" != \"anchor\" ]; then\n        link='echo $label|\
  \ grep -i \"href=\" |tr [:blank:] '\\n'| \\\n              grep -io \"href.*\"|cut\
  \ -c6- | tr -d '\"' |tr -d \"'\"'\n        [ ! -z \"$link\" ] && state=anchor\n\
  \      fi\n    fi\n  fi\ndone\nrm /tmp/wget.$$ 2>/dev/null\n```\n\n## 调用方法\n\n```bash\n\
  \ $ cat eg.html\n<a href=\"/eg.shtml\">example pages</a>\n<a href=\"/eg2.shtml\"\
  >a     pages</a>\n```\n\n↓ 多余空格可能会导致问题；该配方使用 `tr -s` 将这些空格去除。\n\n```bash\n <a  href=\"\
  /eg.shtml\">eg pages</a>\n```\n\n↓ 作为锚点文本的图片可能会很尴尬；该配方使用“img”作为文件名。\n\n```bash\n\
  \ <a href=\"/imagelink1.html\"><img src=\"/images/image1.png\" alt=\"image\"></a>\n\
  <a href=\"/imagelink2.html\"><img src=\"/images/image2.png\" alt=\"image\"></a>\n\
  ```\n\n↓ 这看起来非常像链接，但它没有 href，所以会被忽略。\n\n```bash\n <a bar=foo>nono</a>\nThis is what<a\
  \ href=\"#\">a href</a>looks like\nThis is what<a href=\"#more\">a marker</a>looks\
  \ like\n```\n\n↓ 该配方会有效关闭此标签，因为它并没有真正搜索 `</a>`。\n\n```bash\n <a href='/e_g.shtml'>more\n\
  <a href=\"/more.html\"><img src=\"/images/image8.png\" alt=\"image\"></a>\nexamples\n\
  <a class=\"pad\" href=\"/examples.shtml\" title=\"eg\">further examples</a>$ ./downloader.sh\
  \ eg.html\nRetrieving /eg.shtml as example pages\n-rw-rw-r-- 1 steve steve 10421\
  \ May 12:58 /tmp/download/example pages\nRetrieving /eg2.shtml as a pages\n-rw-rw-r--\
  \ 1 steve steve 402 May 12:58 /tmp/download/a pages\nRetrieving /e+g.shtml as eg\
  \ pages\n-rw-rw-r-- 1 steve steve 2409 May 12:58 /tmp/download/eg pages\nRetrieving\
  \ /imagelink1.html as img\n-rw-rw-r-- 1 steve steve 94532 May 12:58 /tmp/download/img\n\
  Retrieving /imagelink2.html as img.1\n-rw-rw-r-- 1 steve steve 1053 May 12:58 /tmp/download/img.1\n\
  Retrieving # as a href\n-rw-rw-r-- 1 steve steve 3407 May 12:58 /tmp/download/a\
  \ href\nRetrieving #more as a marker\n-rw-rw-r-- 1 steve steve 593 May 12:58 /tmp/download/a\
  \ marker\nRetrieving /e_g.shtml as more\n-rw-rw-r-- 1 steve steve 548 May 12:58\
  \ /tmp/download/more\nRetrieving /moreimages.html as img.2\n-rw-rw-r-- 1 steve steve\
  \ 5930 May 12:58 /tmp/download/img.2\nRetrieving /examples.shtml as further examples\n\
  -rw-rw-r-- 1 steve steve 50395 May 12:58 /tmp/download/further examples\n```\n\n\
  ↓ 再次运行脚本会导致使用新的文件名，而不是覆盖文件。\n\n```bash\n $ ./downloader.sh eg.html\n$ ./downloader.sh\
  \ eg.html\nRetrieving /eg.shtml as example pages.1\n-rw-rw-r-- 1 steve steve 10421\
  \ May 13:04 /tmp/download/example pages.1\nRetrieving /eg2.shtml as a pages.1\n\
  -rw-rw-r-- 1 steve steve 402 May 13:04 /tmp/download/a pages.1\nRetrieving /e+g.shtml\
  \ as eg pages.1\n-rw-rw-r-- 1 steve steve 2409 May 13:04 /tmp/download/eg pages.1\n\
  Retrieving /imagelink1.html as img.3\n-rw-rw-r-- 1 steve steve 94532 May 13:04 /tmp/download/img.3\n\
  Retrieving /imagelink2.html as img.4\n-rw-rw-r-- 1 steve steve 1053 May 13:04 /tmp/download/img.4\n\
  Retrieving # as a href.1\n-rw-rw-r-- 1 steve steve 3407 May 13:04 /tmp/download/a\
  \ href.1\nRetrieving #more as a marker.1\n-rw-rw-r-- 1 steve steve 593 May 13:04\
  \ /tmp/download/a marker.1\nRetrieving /e_g.shtml as more.1\n-rw-rw-r-- 1 steve\
  \ steve 548 May 13:04 /tmp/download/more.1\nRetrieving /moreimages.html as img.5\n\
  -rw-rw-r-- 1 steve steve 5930 May 13:04 /tmp/download/img.5\nRetrieving /examples.shtml\
  \ as further examples.1\n-rw-rw-r-- 1 steve steve 50395 May 13:04 /tmp/download/further\
  \ examples.1\n```\n\n↓ 如果没有提供 HTML 文件，则使用默认文件（Firefox 文件）。\n\n```bash\n $ ./downloader.sh\n\
  Retrieving https://addons.mozilla.org/en-US/firefox/bookmarks/ as Get Bookmark-ons\n\
  -rw-rw-r-- 1 steve steve 39564 May 13:13 /tmp/download/Get Bookmark-ons\nRetrieving\
  \ http://www.mozilla.com/en-US/firefox/central/ as Getting Started\n-rw-rw-r-- 1\
  \ steve steve 41281 May 13:13 /tmp/download/Getting Started\nRetrieving http://fxfeeds.mozilla.com/en-US/firefox/livebookmarks/\
  \ as Latest Headli\n-rw-rw-r-- 1 steve steve 17415 May 13:13 /tmp/download/Latest\
  \ Headlines\nRetrieving http://bad.example.com/ as This is a broken example\nRetrieving\
  \ http://bad.example.com/ failed.\n--2011-05-01 23:03:11-- http://bad.example.com/Resolving\
  \ bad.example.com... failed: Name or service not known\nwget: unable to resolve\
  \ host 'bad.example.com'\nRetrieving http://www.mozilla.com/en-US/firefox/help/\
  \ as Help and Tutorials\n-rw-rw-r-- 1 steve steve 25123 May 13:13 /tmp/download/Help\
  \ and Tutorials\nRetrieving http://www.mozilla.com/en-US/firefox/customize/ as Customize\
  \ Firefox\n-rw-rw-r-- 1 steve steve 35349 May 13:13 /tmp/download/Customize Firefox\n\
  Retrieving http://www.mozilla.com/en-US/firefox/community/ as Get Involved\n-rw-rw-r--\
  \ 1 steve steve 52377 May 13:13 /tmp/download/Get Involved\nRetrieving http://www.mozilla.com/en-US/firefox/about/\
  \ as About Us\n-rw-rw-r-- 1 steve steve 22163 May 13:13 /tmp/download/About Us\n\
  $\n```\n\n## 总结\n\n该配方处理的是复杂且格式不规范的输入，因此仅仅遵循文档标准是不够的。花时间思考可能出现的输入类型，以及如何将其强制转换为标准格式，会让后续处理变得容易得多。\n\
  \n跟踪状态也有用，特别是当元素嵌套时，例如注释中提到的 `<a href=\"#\">a href</a>`。对于其他 HTML 元素，这种状态也是必要的；可以使用\
  \ `case` 语句解析每个支持的标签。\n\n## 配方 18-2：CSV 格式化\n\n系统管理通常是响应式的，通常没有时间来设计、编写和测试一个整洁的脚本。本配方处理的是内存泄漏问题；在这种情况下，最佳解决方案是创建一个非常快速简单的脚本，抓取相关数据以备后分析。重要的是获取及时数据，而不是数据的格式是否整洁或漂亮。`grab-meminfo.sh`\
  \ 就是这样一个脚本示例；它每三分钟抓取一次戳和 `/proc/meminfo` 的副本。\n\n## 使用的技术\n\n- `/proc/meminfo`\n\
  - `((suffix++))`\n- `CSV`\n- `bc`\n\n## 概念\n\n`/proc/meminfo` 是 `/proc` 目录下许多看起来像文本文件、但实际上是当前运行的\
  \ Linux 内核的直接接口的文件之一。这些是 Shell 脚本从内核中以易于使用的格式获取原始数据的极佳资源，而无需依赖额外的工具（如 `free`），这些工具会获取相同的数据并进行重新解释。\n\
  \n\n\n\n`plot-graph.sh` 脚本从 `/proc/meminfo` 获取原始数据并将其格式化为 CSV 文件，该文件可以使用 Microsoft\
  \ Excel、OpenOffice.org 或 LibreOffice 等电子表格软件读取。这些桌面软件可用于将数据格式化为图表，帮助实现内存使用随时间的变化可视化。它还以更简洁的格式保存数据。最后，`stats.sh`\
  \ 使用该输出对随时间变化的峰值和平均内存使用进行长期分析，以识别问题的根本原因。\n\n## 潜在陷阱\n\n尽管时间非常关键，但在编写像 `grab-meminfo.sh`\
  \ 这样的脚本时，做一些规划是有回报的。该脚本的输出越容易解析越好，但保留尽可能多的数据是非常值得的，而不是只计算总内存使用并丢弃其他部分。通过保留完整的 `meminfo`\
  \ 文件，可以绘制内存使用与交换分区（swap）使用之间的对比图，而如果脚本只收集内存使用统计数据，这些信息将会丢失。\n\n如果 `grab-meminfo.sh`\
  \ 能直接以 `plot-graph.sh` 保存的格式创建日志文件会更好；但实际上，记录的内容并不那么整洁，因此本配方故意展示了从非常原始的初始快照到格式化图表的转换，而不是从格式良好的快照转换。\n\
  \n## 结构\n\n`grab-meminfo.sh` 几乎没有任何结构；它是一个获取 `/proc/meminfo` 内容的 `while` 循环。`plot-graph.sh`\
  \ 获取这些数据并将其写入一个 CSV 文件。由于每个快照都对应一个不同的文件，可以使用 `ls -tr` 根据文件时间戳顺序读取这些文件。如果时间戳丢失（例如通过将文件复制到远程服务器），则需要使用\
  \ `sort -n` 按文件名进行排序。使用 `grep` 从文件中提取相关数据（`meminfo` 与 `/proc` 下许多文件一样，被设计得易于处理），并计算当时的物理内存和交换分区的使用量，将其存储到格式更好的日志文件中以供以后使用。它还被输出到标准输出；这可以重定向到\
  \ CSV 文件。\n\n`bc` 用于将 `/proc/meminfo` 报告的千字节（KB）转换为报告中更易管理的千字节（GB）。本配方使用了 `bc` 的\
  \ `scale` 特性，在此情况下用于转换为保留两位小数的精度。对于此图表来说，这种精度足够了，同时确保图表标签为 0–18 GB 而不是 0–18,000,000\
  \ KB。\n\n如本配方的“调用”部分所示，图 18-1 是在 OpenOffice.org 中生成的，方法是选择列 B、E 和 F（时间、GB 已用内存和\
  \ GB 已用交换分区）；从“插入”菜单中选择“图表”；选择“折线图”并在“图表元素”部分添加标题。\n\n过一段时间后，可能希望更多服务器内存的使用情况。第三个脚本\
  \ `stats.sh` 提供了这种高层次的概述，计算每天的峰值和平均内存使用量。`stats.sh` 从日志文件中提取每个日期并逐一处理。如果服务器仅在上午\
  \ 9:00 到下午 6:00 的工作期间使用，平均值可能会出现偏差，因为统计数据是 24/7 全天收集的。可以通过简单的 `cut` 来缓解这一点；如果小时在上午\
  \ 9:00 之前或下午 5:00 之后，则跳过循环并忽略这些数字。这确保了 `stats.sh` 只显示上午 9:00 到下午 5:59 之间收集的数据。\n\
  \n由于 `plot-graph.sh` 对数据的格式化比 `grab-meminfo.sh` 更好，`stat.sh` 的任务稍微简单。每行 Memory 后面都跟着一行\
  \ Swap 行，因此在 `while` 循环内部会进行第二次读取以获取相关的 Swap 数据。计算总和和峰值，并增加计数。这些数据随后被保存到临时文件中，因为\
  \ `while` 循环本身是一个子壳，当循环结束时，子壳及其所有环境变量都会丢失。因此，主脚本会从临时文件中读取循环的状态，计算平均值，并将数据写入 CSV\
  \ 文件。如本配方的“调用”部分所示，图 18-2 清晰地描绘了存在规律模式，每周一都会出现一个峰值。顶行是峰值内存（Peak RAM），然后是平均内存（Mean\
  \ RAM），底部是峰值交换分区（Peak Swap）和平均交换分区（Mean Swap）。这些信息可以用来精确确定周一上导致问题的具体差异。可能是因为周一是负载峰值，服务器只是需要更多内存来应对负载，也可能是应用程序中仅周一使用的部分包含需要修复的内存泄漏。\n\
  \n## 配方\n\n```bash\n#!/bin/bash\ncount=1\nwhile :\ndo\n  date +D:%H:%M > /var/tmp/$count.meminfo\n\
  \  cat /proc/meminfo >> /var/tmp/$count.meminfo\n  ((count++))\n  sleep 20\ndone\n\
  ```\n\n### `grab-meminfo.sh`\n\n```bash\n#!/bin/bash\nLOG=/var/tmp/memory.log\n\
  echo \"Date,Time,Memory Used,Swap Used,Gb Memory Used,Gb Swap\"\nfor MEMINFO in\
  \ ls /var/tmp/*.meminfo | sort -n\ndo\n  timestamp=$(head -1 $MEMINFO)\n  memtotal=$(grep\
  \ \"^MemTotal:\" $MEMINFO | awk '{print $2}')\n  memfree=$(grep \"^MemFree:\" $MEMINFO\
  \ | awk '{print $2}')\n  swaptotal=$(grep \"^SwapTotal:\" $MEMINFO | awk '{print\
  \ $2}')\n  swapfree=$(grep \"^SwapFree:\" $MEMINFO | awk '{print $2}')\n  ramused=$((memtotal\
  \ - memfree))\n  swapused=$((swaptotal - swapfree))\n  date=$(echo $timestamp |\
  \ cut -d: -f1)\n  time=$(echo $timestamp | cut -d: -f2)\n  echo \"$DATE ramused\
  \ kB use\" >> $LOG\n  echo \"$DATE swapused kB use\" >> $LOG\n  gbramused=$(echo\
  \ \"scale=2;ramused / 1024 / 1024\" | bc)\n  gbswapused=$(echo \"scale=2;swapused\
  \ / 1024 / 1024\" | bc)\n  echo \"$date,$time,$ramused,$swapused,$gbramused,$gbswapused\"\
  \ndone\n```\n\n### `plot-graph.sh`\n\n```bash\n#!/bin/bash\nLOG=${1:-memory.log}\n\
  CSV=${2:-stats.csv}\necho \"Date,Peak RAM,Peak Swap,Mean RAM,Mean Swap,Peak RAM\
  \ (GB),Peak Swap (GB),Mean RAM (GB),Mean Swap (GB)\" > $CSV\ntotals=/tmp/$.\nfor\
  \ date in cat $LOG | cut -d: -f1 | sort -u\ndo\n  count=0\n  peakram=0\n  peakswap=0\n\
  \  totalram=0\n  totalswap=0\n  echo \"Processing $date\"\n  grep \"^${date}:\"\
  \ $LOG | while read timestamp type ramused text\n  do\n    hour=$(echo $timestamp|cut\
  \ -d: -f2)\n    if [ \"$hour\" -lt \"9\" ] || [ \"$hour\" -gt \"17\" ]; then\n \
  \     continue\n    fi\n    read timestamp swaptype swapused text\n    ((count++))\n\
  \    echo count=$count > $counter\n    let totalram=$totalram+$ramused\n    let\
  \ totalswap=$totalswap+$swapused\n    [ $ramused -gt $peakram ] && peakram=$ramused\n\
  \    [ $swapused -gt $peakswap ] && peakswap=$swapused\n    echo totalram=$totalram\
  \ > $totals\n    echo totalswap=$totalswap >> $totals\n    echo peakram=$peakram\
  \ >> $totals\n    echo peakswap=$peakswap >> $totals\n    echo count=$count >> $totals\n\
  \  done\n  . $totals\n  meanram=$(echo \"$totalram / $count\" | bc)\n  meanswap=$(echo\
  \ \"$totalswap / $count\" | bc)\n  peakramgb=$(echo \"scale=2;$peakram / 1024 /\
  \ 1024\" | bc)\n  peakswapgb=$(echo \"scale=2;$peakswap / 1024 / 1024\" | bc)\n\
  \  meanramgb=$(echo \"scale=2;$meanram / 1024 / 1024\" | bc)\n  meanswapgb=$(echo\
  \ \"scale=2;$meanswap / 1024 / 1024\" | bc)\n  echo \"$date,$peakram,$peakswap,$meanram,$meanswap,$peakramgb,$peakswapgb,$meanramgb,$meanswapgb\"\
  \ >> $CSV\ndone\nrm -f $totals\n```\n\n### `stats.sh`\n\nInvocation\n\n```bash\n\
  \ $ nohup ./grab-meminfo.sh &\n[1] 18580\n $ nohup: ignoring input and appending\
  \ output to 'nohup.out'\n $ ./plot-graph.sh > memory.csv\n $ oocalc memory.csv\n\
  ```\n\n\n\n\n```\n $ ./stats.sh\nProcessing 08/15/11\nProcessing 08/16/11\nProcessing\
  \ 08/17/11\nProcessing 08/18/11\nProcessing 08/19/11\nProcessing 08/20/11\nProcessing\
  \ 08/21/11\nProcessing 08/22/11\nProcessing 08/23/11\nProcessing 08/24/11\nProcessing\
  \ 08/25/11\nProcessing 08/26/11\nProcessing 08/27/11\nProcessing 08/28/11\nProcessing\
  \ 08/29/11\nProcessing 08/30/11\nProcessing 08/31/11\nProcessing 09/01/11\nProcessing\
  \ 09/02/11\nProcessing 09/03/11\nProcessing 09/04/11\nProcessing 09/05/11\nProcessing\
  \ 09/06/11\n$ oocalc stats.csv\n```\n\n图 18-2\n\n![f1802.tif](img/f1802_fmt.jpg)\n\
  \n## 总结\n\nShell 是收集和处理数据的有用工具，但对于正式演示来说，其纯文本界面具有局限性。通过使用 HTML 和 CSV 等基于文本的文件格式，让\
  \ Shell 将数据输出到桌面应用程序（如浏览器，如你在第 15 章食谱 15-2 中看到的那样）和电子表格（在本食谱中），可以实现从文本到图形的无缝转换。这种数据操纵在其他环境中是不可能的；如果数据从初就是\
  \ Excel 表格和宏，那么它将永远困在 Excel 中。通过使用通用的文本格式，可以使用任何合适的工具对数据进行重构和重新格式化，并在需要时导出到更封闭的应用程序。简简单的\
  \ Shell 脚本甚至比 Excel 这样的大型软件项目更强大且灵活。\n\n# 第 19 章：数字\n\n数字是计算的核心，但本章涵盖了在 Shell 脚本处理数字时可能会遇到的一些问题。第一个食谱查看了列出斐波那契数列数字的三种方法。这揭示了\
  \ Shell 处理数字大小的某些局限性，以及规避这些限制的方法。\n\n第二个食谱处理不同进制之间的数字转换。虽然我们通常用十进制（10 进制）表示数字，但二进制（2\
  \ 进制）是 CPU 使用的原始格式。十六进制（16 进制）非常常用，因为它比二进制更紧凑，一个字节可以整齐地显示为两个十六进制字符。`netboot.sh`\
  \ 食谱使用 `printf` 在十进制和十六进制之间转换；`bc` 工具可以将数字从任何进制转换为任何其他进制，但 `printf` 提供了用十六进制和八进制表示十进制的最简单方法。\n\
  \n## 食谱 19-1：斐波那契数列\n\n斐波那契数列是非常简单的整数序列，其中序列中每个数字的值计算为前两个数字之和。传统上从 0 和 1 开始，所以如果\
  \ `F(0)` 是 0，`F(1)` 是 1，那么 `F(2)` 就是 `F(0) + F(1)`，即 1。`F(3)` 是 `F(1) + F(2)`，即\
  \ 2。`F(4)` 是 3，`F(5)` 是 5，`F(6)` 是 8，`F(7)` 是 13，`F(8)` 是 21。这个数字序列增长迅速，除了视觉上很美之外，也是使用\
  \ Shell 进行大数字计算的三种方法之一。\n\n## 使用的技术\n\n* 函数 (Functions)\n* `((count++))`\n* `$((\
  \ x + y ))`\n* `[ x -lt y ]`\n* `expr`\n* `bc`\n\n## 概念\n\n数字相加的概念非常简单，但无处不在。图 19-1\
  \ 显示了斐波那契数列的工作。每个正方形的边长是序列中的位置，所以前两个正方形是 1×1，然后是 2×2，接着是 3×3、5×5、8×8、13×13、21×21，以此类推。通过在每个正方形中画圆弧，出现了一个螺旋。这种螺旋在自然界中可以看到，从菠萝到蜗壳到向日葵。\n\
  \n![f1901.eps](img/f1901)\n\n## 潜在陷阱\n\n处理大数字时主要的陷阱是存储会“溢回”。计算机内部使用二进制，其中位要么开启（1）要么关闭（0）。一个字节（8\
  \ 位）可以表示数字 255。超过之后，它会溢回零。在普通的十进制法中，9999 之后的数字是 10000，然后是 10001 等。在只工作右侧数字的计算器上，看起来就像\
  \ 9999 后面跟着 0000，然后是 0001。计算机的内部表示也发生了相同的情况。在 `1111 1111` (255) 之后是 `0000 0000`\
  \ (256)，但 8 位字节只能看到最低 8 位，即零。\n\n表 19-1：位溢回\n\n| 二进制值 | 十进制值 |\n| :--- | :--- |\n\
  | 00000000 | 0 |\n| 00000001 | 1 |\n| 00000010 | 2 |\n| 00000011 | 3 |\n| 00000100\
  \ | 4 |\n| 00000101 | 5 |\n| 00000110 | 6 |\n| 00000111 | 7 |\n| 11111100 | 252\
  \ |\n| 11111101 | 253 |\n| 11111110 | 254 |\n| 11111111 | 255 |\n| 00000001 00000000\
  \ | 256 或 0 |\n| 00000001 00000001 | 257 或 1 |\n| 00000001 00000010 | 258 或 2 |\n\
  \n这个问题在食谱 1 中用单字节精度显示，并在 4 字节字显示。最长的 4 字节字由 32 个连续的 1 组成，代表 4294967295。之后，32 位容器会溢回零。在\
  \ 64 位中，最大值是 18446744073551615，但如食谱方法 2 所示，整个范围并不可用。\n\n### 方法 1 的结构\n\n第一个食谱的结构与其他不同；它使用使用\
  \ `seq` 的 `for` 循环来计数。因为它失效很快，所以 `seq` 是控制它并确保它很快停止的有用方法。后来的更健壮的版本使用无限 `while` 循环（`while:`\
  \ 中的冒号始终求值为真），允许它们持续运行，直到进入更高值时，它们也开始失效。\n\n第一个食谱使用一个 `fibonacci` 函数，它返回两个参数之和。这是函数传统的计算机科学用法；它接受值作为输入，并返回计算结果作为单个值。遗憾的是，返回码实际上是用于状态报告而不是长整数，因此在\
  \ Shell 中处理超过 255 的值时，这种方法没有用处。食谱包含一个基本的健全性测试以检查是否溢回；数字应该总是越来越大。`144 + 233 = 377`，二进制下为\
  \ `1 0111 1001`。丢失第九位后，它变为 `0111 1001`，十进制为 121。`121` 小于之前的数字 `233`，所以答案 `121` 显然是错误的。必须有更好的方法，后续的方法展示了一些替代技术。\n\
  \n\n\n\n第二种斐波纳契配方忽略了函数的返回码，简单地让 `fibonacci` 函数 `echo` 输出结果。shell 本身可以处理大于 255 的整数；只有返回码限制为\
  \ 1 字节。这绕过了 1 字节的限制，并且调用函数的代码定义了 `F2='fibonacci $F0 $F1'`，以便 `F2` 捕获的是函数的 `stdout`\
  \ 而不是返回码。\n\n该配方还将将具有预设结束状态的 `for` 循环替换为无限 `while` 循环。由于没有 `for` 循环，它还提供并递增加了 `count`\
  \ 变量。该变量使用 bash 语法 `((count++))` 进行递增，这看起来非常像 C 语言的语句 `count++`。它是 `let count=$count+1`\
  \ 的简写。它并没有更高效，只是更易于编写和阅读。\n\n该配方可以计算到序列中的第 92 个数字，即 7,540,113,804,746,346,429，大约是\
  \ 7.5 亿亿（quintillion）。第 93 个数字是 4,660,046,610,375,530,309 + 7,540,113,804,746,346,429，即\
  \ 12,200,160,415,121,876,738，或者说 12 多亿亿。这已经达到了 shell 处理能力的极限。shell 对整数的实现使用了一种名为“补码”的系统来表示负整数和正整数。这允许变量存储负数和正数，但是以牺牲范围为代价的。1\
  \ 字节（8 位）补码变量可以表示从 –127 到 +128 的任何整数，而不是 0 到 255；64 位补码变量可以表示从 –9,223,372,036,854,775,808\
  \ 到 +9,223,372,036,854,775,807 的任何整数。因此，该配方在序列的第 92 个数字之后失败，该数字（12 亿亿）大于了最大值 9.2\
  \ 亿亿。\n\n用 `expr` 替换 shell 数学运算没有区别，因为问题出在数字的内部表示上，而不是相加的技巧。`fibonacci3.sh` 方法将\
  \ `fibonacci` 函数中的 `echo` 替换为 `expr`，但它的失败方式几乎与 `fibonacci2.sh` 完全相同。区别在于 `expr`\
  \ 会输出错误信息，而 shell 的实现是静默失败的。因为 `expr` 没有给出值，测试 `if [ \"$F2\" -lt \"$F1\" ]` 扩展为\
  \ `if [ \"\" -lt \"$F1\" ]`，这没有意义，所以 `test`（即 ``）报错“integer expression expected（预期整数表达式）”。\n\
  \n### 方法 2 的配方\n\n![download.eps\n\n```bash\n#!/bin/bash\nfunction fibonacci\n{\n\
  \  echo $(( $1 + $2 ))\n}\nF0=0\nF1=1\necho \"0: $F0, \"\necho \"1: $F1, \"\ncount=2\n\
  while :\ndo\n  F2='fibonacci $F0 $F1'\n  if [ \"$F2\" -lt \"$F1\" ]; then\n    echo\
  \ \"${count}: $F2 (WRONG!),\"\n  else\n    echo \"${count}: $F2,\"\n  fi\n  ((count++))\n\
  \  F0=$F1\n  F1=$F2\n  sleep 0.1\ndone\nfibonacci $F0 $F1\n```\n\n`fibonacci2.sh`\n\
  \n```bash\n#!/bin/bash\nfunction fibonacci\n{\n  #echo $(( $1 + $2 ))\n  expr $1\
  \ + $2\n}\nF0=0\nF1=1\necho \"0: $F0, \"\necho \"1: $F1, \"\ncount=2\nwhile :\n\
  do\n  F2='fibonacci $F0 $F1'\n  if [ \"$F2\" -lt \"$F1\" ]; then\n    echo \"${count}:\
  \ $F2 (WRONG!),\"\n  else\n    echo \"${count}: $F2,\"\n  fi\n  ((count++))\n  F0=$F1\n\
  \  F1=$F2\n  sleep 0.1\ndone\nfibonacci $F0 $F1\n```\n\n`fibonacci3.sh`\n\n### 方法\
  \ 2 的调用\n\n```\n$ ./fibonacci2.sh\n0: 0,\n1: 1,\n2: 1,\n3: 2,\n4: 3,\n5: 5,\n6:\
