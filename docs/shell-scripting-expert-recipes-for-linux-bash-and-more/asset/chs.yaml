  \ because i is now $i\"\n$ bash -x while.sh\n+ i=1\n+ '[' 1 -lt 100 ]\n+ echo 'i\
  \ is 1'\nis is 1\n++ expr 1 '*' 2\n+ i=2\n+ '[' 2 -lt 100 ]\n+ echo 'i is 2'\nis\
