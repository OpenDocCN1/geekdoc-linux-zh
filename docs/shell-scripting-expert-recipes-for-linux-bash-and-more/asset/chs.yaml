  ```\n\n### /sys/devices/system/node\n\n`mem.sh` 脚本检查每个 CPU 节点的可用内存。在真正的 NUMA 系统中，如果一个节点的所有\
  \ CPU 都处于离线状态，与该节点相关的内存将不可用。由于 Linux 在 x86_64 架构上的工作方式，尽管 CPU 被标记为离线，但内存仍然可用。\n\n\
  ![下载](img/download_fmt.gif)\n\n### mem.sh\n\n```bash\n#!/bin/bash\nkb=$(head -1\
  \ /proc/meminfo | awk '{ print $2}')\nmb=$(echo \"scale=2; $kb/1024\" | bc)\ngb=$(echo\
  \ \"scale=2; $mb/1024\" | bc)\necho \"Server has $gb ($kb)\"\ncd /sys/devices/system/node\n\
  grep MemTotal node*/meminfo | while read name memtotal kb\ndo\n  mb=$(echo \"scale=2;\
  \ $kb/1024\" | bc)\n  gb=$(echo \"scale=2; $mb/1024\" | bc)\n  echo \"Node $name\
  \ has $gb. $(grep -w 1 ${name}/online | wc -l) CPUs online\"\ndone\n```\n\n`mem.sh`\
  \ 开始显示操作系统可用的内存。这个数值会比安装的内存少一点，因为它显示的是 `/sys/devices/system/node` 下的 `MemTotal`\
  \ 字段。实际上，脚本不需要检查 CPU0 是否有 online 文件，这是为了避免脚本中出现过多的错误检查。\n\n```bash\nwhopper# ./mem.sh\n\
  Server has 125.91 Gb (132035676)\nNode 0 has 15.76 Gb. 4 CPUs online\nNode 1 has\
  \ 15.78 Gb. 4 CPUs online\nNode 2 has 15.78 Gb. 5 CPUs online\nNode 3 has 15.78\
  \ Gb. 6 CPUs online\nNode 4 has 15.78 Gb. 5 CPUs online\nNode 5 has 15.78 Gb. 5\
  \ CPUs online\nNode 6 has 15.78 Gb. 6 CPUs online\nNode 7 has 15.78 Gb. 4 CPUs online\n\
  whopper# ./cpu.sh on 'seq 0 50'\nnode0/cpu0 is always Online.\nCPU0 does not have\
  \ online/offline functionality\nCPU1 is already Online\nCPU2 is already Online\n\
  Offlining CPU3 ... OK\nCPU4 is already Online\nCPU5 is already Online\nCPU6 is already\
  \ Online\nOfflining CPU7 ... OK\nCPU8 is already Online\nOfflining CPU9 ... OK\n\
  CPU10 is already Online\nCPU11 is already Online\nOfflining CPU12 ... OK\nCPU13\
  \ is already Online\nCPU14 is already Online\nCPU15 is already Online\nCPU16 is\
  \ already Online\nCPU17 is already Online\nCPU18 is already Online\nCPU19 is already\
  \ Online\nCPU20 is already Online\nCPU21 is already Online\nCPU22 is already Online\n\
  CPU23 is already Online\nOfflining CPU24 ... OK\n```\n\n\n\n\n\n在传统的 Unix 系统上，所有用户和系统脚本的标准\
  \ shell（`/bin/sh`）都是 Bourne shell（波恩壳）。在大多数 GNU/Linux 发行版中，`bash` 一直是默认 shell。最近，某些\
  \ GNU/Linux 系统使用 `dash` 作为系统 shell（`/bin/sh`），但保留 `bash` 作为交互式 shell，通常位于 `/usr/bin/bash`。有许多不同的\
  \ shell，每种都是为特定目的编写的并有自己的历史，这导致每个 shell 的语法和功能集都略有不同。\n\n本章将介绍可用的 shell、它们的来源以及它们的功能。本书主要关注\
  \ `bash`，并参考了 Bourne shell，但了解其他流行的 shell 同样重要。本章还希望让读者了解 shell 脚本可能运行的不同环境的某些特性，以及这些环境如何影响脚本的运行。\n\
  \n并没有真正的必要在交互式使用和 shell 脚本中使用同一个 shell。两者都使用相同 shell 的主要好处是，你可以轻松地测试你的语法，或者交互式地尝试某个想法，在将其写入脚本之前查看如何使其生效。另一方面，使用一个具有你喜欢的文件系统导航、历史回溯等功能的交互式\
  \ shell 可能更有利，而你始终可以通过在命令行中输入其名称来调用另一个 shell。\n\n## Bourne Shell\n\n当 Unix 最初诞生时，它有一个由\
  \ Unix 创建者之一 Ken Thompson 编写的非常基础的 shell。Bourne shell 由 Steve Bourne 在 1979 年编写，是一种可脚本的\
  \ Unix shell。所有其他 shell 都有一个前缀来标明它们是哪种 shell —— `ksh`、`csh`、`zsh` 等 —— 但 Bourne\
  \ shell 不称自己为 `bsh`，因为它本身就是“那个 shell（the shell）”，所以它的规范路径是 `/bin/sh`。其他 shell 后期出现并具有更多功能，同时保持了与\
  \ Bourne shell 的通用兼容性——某些兼容性比另一些更好。\n\nBourne shell 提供的最重要的新概念之一是管道（pipeline），这种结构允许一个进程将其输出传递给另一个进程的输入。这是\
  \ shell 命令能力的一次巨大变化。Bourne 还引入了变量和流程控制，将 shell 从一个非常基础的命令解释器变成了一种灵活的脚本语言。\n\n##\
  \ KornShell\n\nKornshell (`ksh`) 由 David Korn 于 1983 年编写。它是一种非常流行的脚本及交互式使用 shell，特别是在专有\
  \ Unix 上。和 `bash` 以及 `dash` 一样，它与 Bourne shell 向后兼容，但增加了新的功能和语法。`ksh` 引入了 shell\
  \ 历史的光标键导航，并提供了数组和浮点数运算。长期以来，`ksh` 是 AT&T 的专利 Unix 软件，因此 `pdksh`（现在称为 `mksh`）是 `ksh93`\
  \ 的自由软件等品。在 `ksh93` 于 2005 年根据 IBM CPL 发布后，大多数 GNU/Linux 发行版以及 OpenSolaris 都包含了\
  \ `ksh93` 而不是 `pdksh` 或 `mksh`。因此，当你在最近的系统中发现 `ksh`，它可能是真正的 `ksh93` 而不是克隆版本。\n\n\
  `ksh` 和 Bourne 功能之间的共同点被用于定义 `/bin/sh` 的 POSIX 标准，因此 `ksh` 是一种重要的 shell 脚本语言。在传统的\
  \ Unix 系统中，将 root  shell 设置为 `/bin/ksh` 是完全可以的。它是 IBM AIX Unix 的默认 shell。`/etc/init.d`\
  \ 脚本仍将在 Bourne shell 下运行，但交互式 root shell 可以是 `ksh`（通常带有 `-o vi` 选项以提供类似 vi 的历史回溯）。\n\
  \n微软的 Services For Unix (SFU —— 已停用) 为 Windows 环境提供了一个几乎兼容的 `ksh` shell，尽管它是基于 `mksh`\
  \ 的，而当时与原始 `ksh` 并不完全兼容。你可以读到 David Korn 在一次关于 SFU 的演示中，向微软产品经理询问他选择 Kornshell 实现方案的故事。Korn\
  \ 批评了这种实现选择，因为它与真正的 `ksh` 不兼容，并询问微软是否考虑过任何更兼容的 `ksh` 变体。只有在那个糟糕的微软代表试图声称他们的 Kornshell\
  \ 实现与 Kornshell 完全兼容后，他才最终被指出，那个对 Kornshell 兼容性提出尴尬问题的人正是 David Korn 本人。\n\n## C\
  \ Shell\n\nC shell (`csh`) 由 Bill Joy 于 20 世纪 70 年编写，他是 Sun Microsystems 的创始人之一，也是一位多产的\
  \ BSD Unix 黑客。`csh` 的主要吸引力之一是它的语法看起来更像 C 语言，许多系统程序员对 C 语言非常熟悉。它也是比 Bourne shell\
  \ 更好的交互式 shell，首次提供了 `history` 命令。它还添加了作业控制（job control）以及使用波浪号 (`~`) 表示当前用户目录的概念。所有这些功能（但不包括\
  \ C 风格语法）都被此处列出的其他 shell 所采纳。\n\n1996 年，Tom Christiansen 写了一篇广传的文章，名为《Csh 编程是有害的》（Csh\
  \ Programming Considered Harmful），指出了 csh 语法可能让系统程序员感到违背直觉或产生局限的某些方式。Christiansen\
  \ 提出的问题特别集中在重定向和进程控制领域。\n\n## Tenex Shell\n\n`Tcsh` 是 Tenex Csh，它对 `csh` 提供了许多改进，同时保持与\
  \ `csh` 完全兼容。它相比 `csh` 的改进包括更好的历史控制；用于堆栈位置的 `pushd` 和 `popd`；终端锁定以及只读变量。它还提供了拼写检查；如果交互式\
  \ `tcsh` 怀疑发生了输入错误，会向用户提示选项。\n\n除了命令和文件名的自动补全外，`tcsh` 还添加了变量名的自动补全。它可以配置为区分大小写或不区分大小写的模式进行操作。\n\
  \n## Z Shell\n\nZ shell (`zsh`) 由 Paul Falstad 于 1990 年编写。它旨在成为一种类似 `ksh` 的 shell，但也包含了\
  \ `csh` 的功能，因为 `csh` 在 70 年代和 80 年代是非常流行的交互式 shell。它作为交互式 shell 特别出色。它没有声称完全兼容 POSIX\
  \ 或 Bourne，这让它在添加新功能时具有更大的灵活性，尽管它的目标是兼容 `ksh`。它可以通过 `emulate` 命令改变其行为，或者在作为 `/bin/sh`\
  \ 或 `/bin/ksh` 调用时表现得这些 shell。\n\nZsh 在交互式使用上非常像 `bash`，具有相似（但在某些方面更强大）的历史回溯和命令补全。可以使用\
  \ `compctl` 命令自定义补全的工作。通配符（Globbing）语法与 `ksh` 和 Bourne shell 略有不同，且数组从 1 开始索引，而不是\
  \ 0。\n\n## Bourne Again Shell\n\n`bash` 是大多数 GNU/Linux 和 Mac OSX 系统的标准交互式 shell，在传统\
  \ Unix 用户中也变得流行。它还是 Cygwin 环境（在 Microsoft Windows 下提供 GNU 工具）的默认 shell。它与 Bourne\
  \ shell 兼容，但增加了许多额外功能，大部分功能在书中都有介绍。`bash` shell 的名字（“Bourne Again shell”）是对 Bourne\
  \ shell 作者名字的一个双关语。\n\n\n\n\nBash 最初由 Brian Fox 在 1988 年为自由软件基金会（FSF）编写，目前由 Chet\
  \ Ramey 维护。它汲取了各种 shell 的思想，包括 `csh` 和 `ksh`。最值得注意的是，`bash` 使用了来自 `ksh` 的 `[[ …\
  \ ]]`、`$( … )` 和 `(( … ))` 语法。\n\n当 `bash` 被作为 `sh` 调用时，它在读取的配置文件中行为更像 Bourne shell。这将在本章稍后的部分进行详细介绍。\n\
  \n# Debian Almquist Shell\n\nDash 诞生于 1989 年，最初名为 Almquist Shell (`ash`)，由 Kenneth\
  \ Almquist 编写。1999 年，由 Herbert Xu 将其移植到 Debian 项目，成为 Debian Almquist Shell (`dash`)。与\
  \ `bash` 一样，它的目标是符合 POSIX 标准，但与 `bash` 不同的是，它并不尝试更多；它的目标仅仅是作为一个符合 POSIX 标准的 shell。这使其比\
  \ `bash` 更小、更轻量、更快。因此，它在许多 GNU/Linux 发行版中取代了 `bash` 成为默认的 `/bin/sh`，这些发行版通常保留 `bash`\
  \ 用于交互式使用，而将 `dash` 用于系统脚本，特别是启动脚本。\n\nGNU/Linux 上 `bash` 作为 `/bin/sh` 长期存在在迁移到\
  \ `dash` 时导致了一些问题，因为许多系统脚本调用 `/bin/sh` 作为解释器，但期望能够使用 `bash` 的特性。[`bugs.launchpad.net/ubuntu/+source/dash/+bug/61463`](https://bugs.launchpad.net/ubuntu/+source/dash/+bug/61463)\
  \ 网站列出了 Ubuntu 6.10 在从 `bash` 迁移到 `dash` 作为默认 `/bin/sh` 时经历的许多问题。\n\n# 点文件 (Dotfiles)\n\
  \n标准格式的操作系统提供了由发行版和负责各个 shell 本的项目选择的各种设置。系统管理员可以通过编辑 `/etc` 目录下的配置文件对这些设置进行自定义。所有兼容\
  \ Bourne 的 shell 都遵循的主配置文件是 `/etc/profile`。它为交互式 shell 提供了一些基础且合理的设置；它通常根据是否以 root\
  \ 身份运行将命令提示符设置为 `$` 或 `#`；设置 `umask`；以及设置 `PATH`、`TERM` 和其他有用变量。它可能还会执行其他有用操作，例如显示\
  \ `/etc/motd`（今日消息）文件，在用户有新邮件时通知用户，甚至在用户登录时显示“幸运饼”消息来逗趣。它还可以调用其他脚本，这些脚本通常位于 `/etc/profile.d/`\
  \ 目录下。这些脚本可以用于自定义特定的功能、应用程序和工具，允许包管理器随应用程序一起添加或删除这些微调，而无需编辑 `/etc/profile` 脚本本身。\n\
  \n![note.ai](img/note_fmt.gif)\n\n所有这些配置文件都是被源（sourced）的，而不是简单地执行。这意味着这些文件定义的任何变量或函数都会被运行的\
  \ shell 继承。\n\n由于每个用户想要以自己的方式自定义自己的 shell，每个用户都会获得一组文件，这些文件与全局的 `/etc` 文件不同，用户可以按自己的方式编辑。为了系统的稳定性，会先解析\
  \ `/etc` 文件，然后是用户自己的文件。每个 shell 倾向于有自己的一文件名待读取，例如，可以将 `bash` 特有的命令放入 `~/.bashrc`\
  \ 中，这样如果用户在某时刻选择运行 `ksh`，也不会导致错误，因为 `ksh` 会读取 `~/.kshrc`。所有兼容 Bourne 的 shell 无论自身的约定，都会引用\
  \ `/etc/profile` 和 `~/.profile`。同样，基于 `csh` 的 `tcsh` 将根据与 `csh` 的兼容性需求读取 csh 的 `/etc/.login`\
  \ 和 `~/.cshrc`。\n\n以点开头的文件不会通过普通的 `ls` 命令显示。这并没有提供任何安全性——`ls -a` 可以很容易地显示它们——但有助于将配置文件和数据文件分开。主目录往往会变得非常混乱，因此将用户自己的自定义文件默认隐藏不显示可能是很有用的。所有这些配置文件（即使是\
  \ `/etc` 中的文件，其中大多数是不隐藏的）通常被统称为“配置文件 (profile)”或“环境 (environment)”，但也简单地称为“点文件 (dotfiles)”。\n\
  \n这提供了巨大的自定义和灵活性，但产生的大量文件——`/etc/profile`、`/etc/login`、`/etc/bash.bashrc`、`/etc/csh.cshrc`、`/etc/ksh.kshrc`、`/etc/profile.d/*`、`~/.profile`、`~/.bashrc`、`~/.kshrc`、`~/.login`、`~/.cshrc`、`~/.tcshrc`\
  \ 等——给许多 shell 用户和系统管理员带来了很多困惑。与所有这些不同的组合相比，绕口令“She sells sea-shells on the sea\
  \ shore”处理起来简直是轻而易举。哪些文件在什么时候被读取，每个文件里应该放什么内容？三种不同的 shell 调用类型是：交互式登录 shell、交互式非登录\
  \ shell 和非交互式 shell。每种类型都有自己的定义，且每个 shell 在这三种情况下都会读取不同的文件。接下来的章节将涵盖所有这些组合，并在文中按类别和\
  \ shell 类型进行组织。\n\n![note.ai](img/note_fmt.gif)\n\n由于 `dash` 在所有这些情况下的行为与 Bourne\
  \ shell (`sh`) 相同，因此在这些表中被省略了。\n\n# 交互式登录 shell\n\n登录 shell 是由于登录事件而执行的 shell；它本质上是交互式的。对于所有这些情况，`dash`\
  \ 的行为与 Bourne shell (`sh`) 相同，因此在这些表中被省略了。在 Debian GNU/Linux 系统中，`/etc/profile`\
  \ 配置为调用 `/etc/bash.bashrc`，而 `~/.profile` 配置为调用 `~/.bashrc`，以便交互式登录 shell 能获取交互式非登录\
  \ shell 的所有文件。\n\n表 11-1 显示了每个 shell 如何配置交互式登录 shell。\n\n| Shell | 配置文件 |\n| ---\
  \ | --- |\n| bash | `/etc/profile`，然后是找到的 `~/.bash_profile`、`~/.bash_login` 或 `~/.profile`。\
  \ |\n| csh | `/etc/csh.cshrc`，随后是 `/etc/csh.login、`/etc/.login`、`/etc/login.std`\
  \ 或 `/etc/cshrc`，取决于操作系统。之后是 `~/.cshrc` 和 `~/.login`。 |\n| sh | `/etc/profile` 然后\
  \ `~/.profile`。 |\n| tcsh | 与 csh 类似，但如果存在 `~/.tcshrc` 则用它代替 `~/.cshrc`。 |\n| ksh\
  \ | `/etc/profile`、`~/.profile`、`/etc/ksh.kshrc`，然后是 `~/.kshrc`。 |\n| zsh | `/etc/zsh/zshenv`、\
  \ `$ZDOTDIR/.zshenv`、`/etc/zsh/zprofile`、 `$ZDOTDIR/.zprofile`、`/etc/zshrc`、 `$ZDOTDIR/.zshrc`、`/etc/zsh/slogin`、\
  \ `$ZDOTDIR/.zlogin`。 |\n\n# 交互式非登录 shell\n\n交互式非登录 shell 是在登录后启动的。它是交互式的。\n\n```\n\
  if [ -x /usr/bin/bash ]; then\n echo \"Replacing $SHELL with bash\"\n exec /usr/bin/bash\n\
  fi\n```\n\n![note.ai](img/note_fmt.gif)\n\n# 非交互式 shell\n\n非交互式 shell 是为了执行脚本而运行的。它们不是交互式的。\n\
  \n\n\n\n\n取决于 `zsh` 的构建方式，`/etc/zsh` 实际上可能是 `/etc`。Solaris 的 `zsh` 在构建时没有使用 `enable_etcdir`\
  \ 配置选项，因此在 Solaris 上 `/etc/zsh` 只是 `/etc`。这在其他发行版的 `zsh` 构建版本中也会出现：Red Hat 使用 `/etc`，而\
  \ Debian 使用 `/etc/zsh`。此外，如果未设置 `ZDOTDIR`，则会使用 `$HOME` 作为默认值。自定义 `ZDOTDIR` 的位置是\
  \ `/etc/zsh/zshenv`，如果那里没有设置，则在 `~/.zshenv`。\n\n## 交互式非登录 Shell\n\n非登录 shell（non-login\
  \ shell）是指为已登录的用户启动但并不代表新登录实例的 shell。这发生于你在现有的交互式 shell 中直接输入“bash”时、执行 `su` 时（当不作为\
  \ `su -` 调用时），以及在图形会话中打开新的终端仿真器窗口或标签页时。这是自定义 `PATH` 变量、设置 `PS1` 提示符等的好地方。表 11-2\
  \ 显示了每个 shell 如何配置交互式非登录 shell。\n\n### 表 11-2： 交互式非登录 shell 配置文件\n\n| Shell | 读取的文件\
  \ |\n| --- | --- |\n| bash | `~/.bashrc`，或作为 `sh` 调用时类似于 `sh` |\n| csh | `/etc/csh.cshrc`,\
  \ `~/.cshrc` |\n| sh | 如果设置则读取 `$ENV`，否则不读取 |\n| tcsh | `/etc/csh.cshrc`，如果找到则读取\
  \ `~/.tcshrc`，否则读取 `~/.cshrc` |\n| ksh | `/etc/ksh.kshrc`, `~/.kshrc` |\n| zsh |\
  \ `/etc/zsh/zshenv`, `$ZDOTDIR/.zshenv`, `/etc/zshrc`, `$ZDOTDIR/.zshrc` |\n\n在这里，Bourne\
  \ shell 如果环境变量 `$ENV` 已设置，则会加载该变量指定的文件。因此这与 `bash` 的 `~/.bashrc` 文件类似，但稍微灵活一点，因为它允许用户为非登录\
  \ shell 会话加载其选择的任何文件。如果以 `sh` 的名字调用 `bash`，为了兼容 Bourne shell，如果 `$ENV` 已设置，它也会加载它。这对于某些旧版脚本非常有用，这些脚本假设\
  \ `/bin/sh` 是 Bourne shell 并会读取 `$ENV` 文件。\n\n## 非交互式 Shell\n\n非交互式 shell（non-interactive\
  \ shell）是指不与终端直接关联的 shell。shell 脚本会启动非交互式 shell 会话，`cron` 和 `at` 工具也是如此。表 11-3 显示了每个\
  \ shell 如何配置非交互式 shell。注意，Bourne 兼容 shell 在运行非交互式 shell 时不会解析任何系统级或用户级的文件。\n\n###\
  \ 表 11-3： 非交互式 shell 配置文件\n\n| Shell | 读取的文件 |\n| --- | --- |\n| bash | 如果设置则读取\
  \ `$BASH_ENV`，或作为 `sh` 调用时类似于 `sh` |\n| csh | `/etc/csh.cshrc`, `~/.cshrc` |\n|\
  \ sh | 无 |\n| tcsh | `/etc/csh.cshrc`，如果找到则读取 `~/.tcshrc`，否则读取 `~/.cshrc` |\n| ksh\
  \ | 无 |\n| zsh | `/etc/zsh/zshenv`, `$ZDOTDIR/.zshenv` |\n\n由于 `sh` 在交互式非登录 shell\
  \ 中如果设置则会加载 `$ENV`（`bash` 在作为 `sh` 调用时也是如此），`bash` 在设置了 `$BASH_ENV` 且以 `bash` 名称调用时也会加载\
  \ `$BASH_ENV`。这允许 `bash` 为非交互式脚本包含交互式脚本中未包含的额外配置。\n\n## 退出脚本\n\nBash、`zsh` 和 `csh`\
  \ 也提供了可以在交互式 shell（无论登录或非登录）退出时执行的脚本。如果会话结束意味着失去可见（例如来自 Windows 的 PuTTY 会话）或需要更改终端设置，这会非常有用。对于\
  \ `zsh`，如果存在 `$ZDOTDIR/.logout` 和 `/etc/zsh/logout` 则会执行它们。对于 `bash`，如果存在 `~/.bash_logout`\
  \ 和 `/etc/bash_logout` 则会被调用。对于 `csh` 和 `tcsh`，退出时会执行 `~/.logout` 和 `/etc/.logout`、`/etc/csh.logout`\
