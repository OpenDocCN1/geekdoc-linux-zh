  94: 1293530146158671551,\n95: -4953053512429003327 (WRONG!),\n96: -3659523366270331776,\n\
  97: -8612576878699335103 (WRONG!),\n98: 6174643828739884737,\n99: -2437933049959450366\
  \ (WRONG!),\n^C\n$ ./fibonacci3.sh\n0: 0,\n1: 1,\n2: 1,\n3: 2,\n4: 3,\n5: 5,\n6:\
  \ 8,\n7: 13,\n( 81 lines of output omitted )\n89: 1779979416004714189,\n90: 2880067194370816120,\n\
  91: 4660046610375530309,\n92: 7540113804746346429,\nexpr: + Numerical result out\
  \ of range\n./fibonacci3.sh: line 17: [: : integer expression expected\n93: ,\n\
  expr: syntax error\n./fibonacci3.sh: line 17: [: : integer expression expected\n\
  94: ,\nexpr: syntax error\n./fibonacci3.sh: line 17: [: : integer expression expected\n\
  95: ,\nexpr: syntax error\n./fibonacci3.sh: line 17: [: : integer expression expected\n\
  96: ,\nexpr: syntax error\n./fibonacci3.sh: line 17: [: : integer expression expected\n\
  97: ,\n```\n```\n\n### 方法 3 的结构\n\n第四个配方使用 `bc` 进行数学运算。虽然 shell 不能处理大于 9,223,372,036,854,775,807\
  \ 的整数，但 `[ \"$F2\" -lt \"$F1\"]` 比较可以，因为 `F2` 是一个字符串。第 92 个数字是 `fibonacci3.sh` 失败的地方。第\
  \ 34 位数字是 `bc` 打印反斜杠（\\\\）的地方。不带这种格式的输出显示所示。\n\n方法 3 的配方\n\n![download.eps](img/download_fmt.gif)\n\
  \n```bash\n#!/bin/bash\nfunction fibonacci\n{\n  echo $1 + $2 | bc | tr -d '\\n'\n\
  }\nF0=0\nF1=1\necho \"0: $F0, \"\necho \"1: $F1, \"\ncount=2\nwhile :\ndo\n  F2='fibonacci\
  \ $F0 $F1'\n  echo \"${count}: $F2,\"\n  ((count++))\n  F0=$F1\n  F1=$F2\n  sleep\
  \ 0.1\ndone\nfibonacci $F0 $F1\n```\n\n`fibonacci4.sh`\n\n方法 3 的调用\n\n```\n$ ./fibonacci4.sh\n\
