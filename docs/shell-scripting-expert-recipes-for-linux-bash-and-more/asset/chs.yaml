  \ cp messages.po po/de/script.po\nsteve@goldie:~/script$ vi po/de/script.po\nsteve@goldie:~/script$\
  \ cat po/de/script.po\n# My Nifty Script.\n# Copyright (C) 2011 Steve Parker\n#\
