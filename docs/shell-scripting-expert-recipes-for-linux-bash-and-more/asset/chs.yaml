  Search For: ^C\n$\n```\n\n### contacts.sh\n\n第一次搜索找到了 `contacts.txt` 文件中列出的唯一“Steve”。第二次搜索在文件的任何位置查找\
  \ `^Name:.*s`。它对该正则表达式执行了 `grep -A3 -i`，匹配了 Steve、Stallman 和 Linus Torvalds。这些匹配行每行下方的三行都会输出，但在显示之前，通过\
  \ `grep -e` 仅提取出 Name（姓名）和 Email（电子邮件）行。最后，为了演示目的，在每个只显示显示项目时，去掉了输出中的字段名。\n\n###\
  \ split\n\n在管理和传输文件时，文件传输的大小通常有限制。无论是具有 2MB 或 10MB 限制的电子邮件系统，还是具有 4GB 限制的 FAT 文件系统，或是将大量数据保存到\
  \ 4.7GB 的 DVD 中，当你习惯了处理灵活且强大、完全能够处理比此大得多的操作系统时，发现许多主流基础设施并不像现代 Linux 或 Unix 系统那样强大，就会遇到问题。\n\
  \n解决问题的办法是使用 `split` 工具；虽然它可以根据行数拆分文件，但它最常用于将大文件分成较小的、规则块。`-b` 标志告诉它按这种方式工作。你可以在\
  \ `K`、`M`、`G`、`T`、`P`、`E`、`Z` 甚至 `Y` 中指定块的大小。这些都是 1024 的倍数；添加 `B` 后缀（`KB`、`MB`、`GB`\
  \ 等）将以 1000 的倍数计算。\n\n默认选项众所周知，它会创建一个名为 `aa`、`ab`、`ac` 等的文件序列（直到 `ax`、`ay`、`ba`、`bb`、`bc`）。但它提供了一些更友好的选项；`-d`\
  \ 标志使用数字代替字母（使用 `x01`, `x02`, `x03` 代替 `aa`, `ab`, `ac`），你也可以自定义前缀。在前缀末添加下划线是一个好习惯，这样你可以轻松看到后缀。后缀的默认长度为两个字符；如果文件将被分成超过\
  \ 100 个块，你需要使用 `-a` 指定更长的后缀长度：`-a3` 最多 1000 个块，`-a4` 最多 10,000 个块，依此类推。遗憾的是，`split`\
  \ 不会为你计算这些，在使用完可用后缀后会报错“output suffixes exhausted”（输出后缀已耗尽）。考虑以下示例，一个 Solaris 10\
  \ Update9 虚拟镜像（略大于 4GB）使用前缀 `Sol10u9` 和数字后缀（01 到 05）被拆分成五个最多 1GB（1024 * 1024 字节）的文件。如时间戳所示，此操作花费了大约\
  \ 4 分钟：\n\n```bash\n $ ls -l\nrwxrxr-x 1 steve 433278080 Oct 20 11:16 Solaris 10\
  \ u9.vdi\n$ ls -lh\nrwxrxr-x 1 steve 4.1G Oct 20 11:16 Solaris 10 u9.vdi\n$ split\
  \ -b 1G -d Solaris 10 u9.vdi Sol10u9_\n$ ls -l\ntotal 8470776\n-rw-rw-r-- 1 steve\
  \ 1073741824 Dec 1 10:20 Sol10u9_00\n-rw-rw-r-- 1 steve 1073741824 Dec 1 10:21 Sol10u9_01\n\
  -rw-rw-r-- 1 steve 1073741824 Dec 1 10:23 Sol10u9_02\n-rw-rw-r-- 1 steve 1073741824\
  \ Dec 1 10:24 Sol10u9_03\n-rw-rw-r-- 1 steve  37814784 Dec 1 10:24 Sol10u9_04\n\
  -rwxrxr-x 1 steve 4332782080 Oct 20 11:16 Solaris 10 u9.vdi\n$ ls -lh\ntotal 8.1G\n\
  -rw-rw-r-- 1 steve 1.0G Dec 1 10:20 Sol10u9_00\n-rw-rw-r-- 1 steve 1.0G Dec 1 10:21\
  \ Sol10u9_01\n-rw-rw-r-- 1 steve 1.0G Dec 1 10:23 Sol10u9_02\n-rw-rw-r-- 1 steve\
  \ 1.0G Dec 1 10:24 Sol10u9_03\n-rw-rw-r-- 1 steve  37M Dec 1 10:24 Sol10u9_04\n\
  -rwxrxr-x 1 steve 4.1G Oct 20 11:16 Solaris 10 u9.vdi\n$\n```\n\n你可以使用 `cat` 命令将这些文件重新合并，它处理二进制文件和文本文件一样有效。下面的示例展示了这种用法。`diff`\
  \ 显示结果文件与原始文件相同。\n\n```bash\n $ cat Sol10u9_* > Sol10.vdi\n$ ls -lh\ntotal 12.2G\n\
  -rw-rw-r-- 1 steve 1073741824 Dec 1 10:20 Sol10u9_00\n-rw-rw-r-- 1 steve 1073741824\
  \ Dec 1 10:21 Sol10u9_01\n-rw-rw-r-- 1 steve 1073741824 Dec 1 10:23 Sol10u9_02\n\
  -rw-rw-r-- 1 steve 1073741824 Dec 1 10:24 Sol10u9_03\n-rw-rw-r-- 1 steve  37814784\
  \ Dec 1 10:24 Sol10u9_04\n-rwxrxr-x 1 steve 4.1G Oct 20 11:16 Solaris 10 u9.vdi\n\
  $\n```\n\n`tee` 是另一个经常被忽视的工具，它可以让你的脚本执行得更加简单整洁。它将输入传递到 `stdout`，同时将其写入文件。使用 `-a`\
  \ 标志，它会将内容追加到文件中。\n\n\n\n\n\n这个简单的脚本计算一组 ISO CD 镜像的 MD5 校验和，并将其写入日志文件。由于使用了 `tee`，它可以在创建日志文件的同时，向用户输出实用的输出，该日志文件可以直接作为\
  \ `md5sum --check` 的输入，完全没有重复代码。\n\n```bash\n $ cat tee.sh\n#!/bin/bash\nLOGFILE=/tmp/iso.md5\n\
  > $LOGFILE\nfind /iso -type f -name \"*.iso*\" -print | while read filename\ndo\n\
  \  echo \"Checking md5sum of $filename\"\n  md5sum \"$filename\" | tee -a $LOGFILE\n\
  done\n$ ./tee.sh\nChecking md5sum of /iso/SLES-11-DVD-i586-GM-DVD1.iso.gz\n5d7a7d8a3e296295f6a43a0987f88ecd\
