  \ IDE 来编写手机应用，而是在裸机上通过真实系统工作。`Arduino` 项目在硬件层面促进了这一点，值得赞誉；这是一个优秀的项目，让破解硬件变得简单，而不需要身边有一位懂行的叔叔来翻译电阻值。`Free\
  \ Software` 基础设施，特别是最近注入的如 `Google Summer of Code` 等项目，另一个理想的温床，让这种对黑客技术的喜爱在新的（`GNU`？）一代中焕发新生。一代人在成长过程中只知道如何使用设备而不知道如何开发设备，这种想法令人不安。上述项目为未来提供了希望。\n\
  \n我也想感谢 ICL，我在那里认识了 Douglas、Capitan、Jit 和 Ketan。我们测试了 `DRS/NX`，并可以直接接触 `userspace`\
  \ 和 `kernel` 开发者。那是一种罕见的享受，也是我爱上 `Unix` 的地方。感谢那些在 `Usenet` 仍然可读的年代在 `comp.unix.shell`\
  \ 上活跃的人们；你们教会了我们这么多知识，我们当时一定看起来很天真（事实如此）。\n\n\n\n\n\n由于与内核和用户空间开发者供职同一家公司，我在 ICL\
  \ 所获得的经验让所有拥有 `GNU/Linux` 操作系统的用户都能享用。在编写这本书的过程中，我能够在讨论 `Unix`、`Linux` 和 shell 特性时，引用那些我从未谋面过（且可能永远不会谋面）的人所撰写的电子邮件。同样，在专业背景下，我有幸与特定\
  \ Linux 内核功能的关键开发者进行在线交流，讨论这些功能在不同版本的 `Linux` 内核中是如何实现的，而这在不同的开发模式下是不可能实现的。同样，`bash`\
  \ shell 的维护者 Chet Ramey 也对有关实现细节的邮件进行了回复。\n\n从专业和 IT 社区的角度来看，我想感谢 Ken Thompson、Dennis\
