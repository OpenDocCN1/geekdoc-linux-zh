  ## VERBOSE 的值越高，日志文件就越详尽。\n# VERBOSE 的值越低意味着日志文件越短；\n# VERBOSE 的值越高意味着日志文件越长。\n\
  VERBOSE=10\nAPPNAME='basename $0'\nfunction logmsg()\n{\n  echo \"${APPNAME}: 'date':\
  \ $@\" >> $LOGFILE\n}\nfunction debug()\n{\n  verbosity=$1\n  shift\n  if [ \"$VERBOSE\"\
  \ -gt \"$verbosity\" ]; then\n    echo \"${APPNAME}: 'date': DEBUG Level ${verbosity}:\
  \ $@\" >> $LOGFILE\n  fi\n}\nfunction die()\n{\n  echo \"${APPNAME}: 'date': FATAL\
  \ ERROR: $@\" >> $LOGFILE\n  exit 1\n}\nlogmsg Starting script $0\nuname -a || die\
  \ uname command not found.\nlogmsg 'uname -a'\ncat /etc/redhat-release || debug\
  \ 8 Not a RedHat-based system\ncat /etc/debian_version || debug 8 Not a Debian-based\
  \ system\ncd /proc || debug 5 /proc filesystem not found.\ngrep -q \"physical id\"\
  \ /proc/cpuinfo || debug 8 /proc/cpuinfo virtual file not found\n.\nlogmsg Found\
  \ 'grep \"physical id\" /proc/cpuinfo | sort -u | wc -l' physical CPUs.\nunset IPADDR\n\
  . /etc/sysconfig/network-scripts/ifcfg-eth0 || debug 1 ifcfg-eth0 not readable\n\
  logmsg eth0 IP address defined as $IPADDR\nlogmsg Script $0 finished.\n$\n$ ./debugger.sh\n\
  Linux goldie 2.6.32-5-amd64 #1 SMP Fri Dec 10 15:35:08 UTC 2010 x86_64 GNU/Linux\n\
  cat: /etc/redhat-release: No such file or directory\n6.0\n./debugger.sh: line 39:\
  \ /etc/sysconfig/network-scripts/ifcfg-eth0: No such file or \nDirectory\n```\n\n\
  ### debugger.sh\n\n如果你运行该脚本并查看 `/tmp/myscript.log` 中的输出，你会看到不同的函数如何以极少的开发工作为开发者提供标准的日志文件：\n\
  \n```\n $ cat /tmp/myscript.log\ndebugger.sh: Mon Jan 24 23:46:00 2011: Starting\
  \ script ./debugger.sh\ndebugger.sh: Mon Jan 24 23:46:00 2011: goldie 2.6.32-5-amd64\
  \ #1 SMP Fri Dec 10 15:35:08 UTC 2010 x86_64 GNU/Linux\ndebugger.sh: Mon Jan 24\
  \ 23:46:00 2011: DEBUG Level 8: Not a RedHat-based system\ndebugger.sh: Mon Jan\
  \ 24 23:46:00 2011: Found 1 physical CPUs.\ndebugger.sh: Mon Jan 24 23:46:00 2011:\
  \ DEBUG Level 1: ifcfg-eth0 not readable\ndebugger.sh: Mon Jan 24 23:46:00 2011:\
  \ eth0 IP address defined as $IPADDR\ndebugger.sh: Mon Jan 24 23:46:00 2011: Script\
  \ ./debugger.sh finished.\n$\n```\n\n![note.ai](img/note_fmt.gif)\n\n`die()` 函数是语言的一部分。对于快速且粗略的脚本来说，它的功能非常有价值。此脚本定义了三个函数——`logmsg`，它简单地记录传递给它的所有消息；`debug`，如果脚本全局变量\
  \ `VERBOSE` 允许，它会记录传递给它的消息；以及 `die`，它记录一条消息并结束脚本。脚本的主体部分尝试执行各种命令，其中大多数会被记录，而某些则注定会失败。注意以下这一行：\n\
  \n`logmsg Found grep \"physical id\" /proc/cpuinfo | sort -u | wc -l' physical CPUs.`\n\
  \n这表明任何内容都可以传递给函数，包括预定义文本和系统命令输出的混合。通过统计已安装 CPU 的唯一物理 ID 可以得到物理 CPU 的总数——随着多核变得越来越常见，确定系统中到底安装了多少块实际芯片通常是有用的。\n\
  \n### 带有 Trap 的函数\n\n`trap` 是 shell 脚本中早期定义的一个有用调用。它也可以采取其他形式，但最常见的用法是让脚本定义一个清理函数，以便在脚本被中断时由\
  \ `trap` 调用。如果你的脚本使用了临时文件，你可以使用通用函数来删除它们，无论脚本中断的原因是什么。此脚本遍历目录，寻找 `ldd` 能够找到库链接的文件。如果它找到了库，`ldd`\
  \ 会显示这些库并发送返回代码零（成功）。\n\n```\n $ ldd /bin/ls\n  linux-vdso.so.1 => (0x00007fff53ff000)\n\
  \  libselinux.so.1 => /lib/libselinux.so.1 (0x00007f5c716a1000)\n  librt.so.1 =>\
  \ /lib/librt.so.1\n```\n\n### 递归函数\n\n递归函数是指在执行过程中会调用自身的函数。演示这一点的简单例子是数学上的阶乘函数。一个整数的阶乘是\
  \ 1 到自身之间所有整数的乘积。所以 6 的阶乘（也写作 `6!`）是 `1×2×3×4×5×6`，结果为 720。可以通过非递归的方法来实现，但因为 `6!`\
  \ 是 `(5! × 6)`，而 `5!` 是 `(4! × 5)`，以此类推，一个简单的阶乘函数实际上可以写成：\n\n![download.eps](img/download_fmt.gif)\n\
  \n```bash\n $ cat factorial.sh\n#!/bin/bash\nfactorial()\n{\n  if [ \"$1\" -gt \"\
  1\" ]; then\n    previous='expr $1 - 1'\n    parent='factorial $previous'\n    result='expr\
  \ $1 * $parent'\n    echo $result\n  else\n    echo 1\n  fi\n}\nfactorial $1\n$\
  \ ./factorial.sh 6\n720\n```\n\n\n\n\n\n这个脚本具体发生了什么并不一定显而易见。添加一些日志和 `sleep` 调用（这样时间戳就能更清晰地指示发生的时间）确实有助于演示函数输出发生了什么以及副作用是什么。`factorial`\
  \ 在 `echo` 语句之前被调用，该语句说明了发生的情况。计算是在调试语句之前完成的。日志的前六行显示 `factorial 6` 调用了 `factorial\
  \ 5`，接着调用 `factorial 4`，以此类推，直到在 11:50:12 调用 `factorial 1` 并返回 1。随后，日志开始层层退出递归，在\
  \ 11:50:18 计算 `factorial 2`，在 11:50:20 计算 `factorial 3`，一直到最后一步在 11:50:26 计算出 `factorial\
  \ 6`。\n\n![download.eps](img/download_fmt.gif)\n\n```\n $ cat recursive-string.sh\n\
  #!/bin/bash\nLOG=/tmp/factorial-log.txt\n> $LOG\nfactorial()\n{\n  echo \"'date':\
  \ Called with $1\" >> $LOG\n  sleep 1\n  if [ \"$1\" -gt \"1\" ]; then\n    previous='expr\
  \ $1 - 1'\n    parent='factorial $previous'\n    result='expr $1 * $parent'\n  \
  \  echo \"'date': Passed $1 - the factorial of $previous is ${parent}. \" \\\n \
  \        \"$1 * $parent is ${result}.\" >> $LOG\n    echo \"'date': Sleeping for\
  \ 2 seconds.\" >> $LOG\n    sleep 2\n    echo $result\n  else\n    echo \"'date':\
  \ Passed $1 - returning 1.\" >> $LOG\n    echo \"'date': Sleeping for 5 seconds.\"\
  \ >> $LOG\n    sleep 5\n    echo 1\n  fi\n}\nread -p \"Enter a number: \" x\necho\
  \ \"Started at 'date'\"\nfactorial $x\necho \"Here is my working:\"\ncat $LOG\n\
  rm -f $LOG\necho \"Finished at 'date'\"\n$ ./recursive-string.sh\nEnter a number:\
  \ 6\nStarted at Wed Jan 26 11:50:07 GMT 2011\n20\nHere is my working:\nWed Jan 26\
  \ 11:50:07 GMT 2011: Called with 6\nWed Jan 26 11:50:08 GMT 2011: Called with 5\n\
  Wed Jan 26 11:50:09 GMT 2011: Called with 4\nWed Jan 26 11:50:10 GMT 2011: Called\
  \ with 3\nWed Jan 26 11:50:11 GMT 2011: Called with 2\nWed Jan 26 11:50:12 GMT 2011:\
  \ Called with 1\nWed Jan 26 11:50:13 GMT 2011: Passed 1 - returning 1.\nWed Jan\
  \ 26 11:50:13 GMT 2011: Sleeping for 5 seconds.\nWed Jan 26 11:50:18 GMT 2011: Passed\
  \ 2 - the factorial of 1 is 1. 2 * 1 is 2.\nWed Jan 26 11:50:18 GMT 2011: Sleeping\
  \ for 2 seconds.\nWed Jan 26 11:50:20 GMT 2011: Passed 3 - the factorial of 2 is\
  \ 2. 3 * 2 is 6.\nWed Jan 26 11:50:20 GMT 2011: Sleeping for 2 seconds.\nWed Jan\
  \ 26 11:50:22 GMT 2011: Passed 4 - the factorial of 3 is 6. 4 * 6 is 24.\nWed Jan\
  \ 26 11:50:22 GMT 2011: Sleeping for 2 seconds.\nWed Jan 26 11:50:24 GMT 2011: Passed\
  \ 5 - the factorial of 4 is 24. 5 * 24 is 120.\nWed Jan 26 11:50:24 GMT 2011: Sleeping\
  \ for 2 seconds.\nWed Jan 26 11:50:26 GMT 2011: Passed 6 - the factorial of 5 is\
  \ 120. 6 * 120 is 720.\nWed Jan 26 11:50:26 GMT 2011: Sleeping for 2 seconds.\n\
  Finished at Wed Jan 26 11:50:28 GMT 2011\n$\n```\n\n`recursive-string.sh`\n\n上一个脚本被称为\
  \ `recursive-string.sh`，因为它将数字作为字符串传递的；接下来的脚本被称为 `recursive-byte.sh`，因为它使用函数的返回值来返回实际数字。由于\
  \ Unix 返回码是字节（bytes），它们只能存储 0 到 255 之间的值。你可以看到，该脚本在输入最大为 5 时运行正常，但当传入值 6 进行计算时会失败，因为\
  \ 6 的阶乘是 `6*120=720`，这大于 255。\n\n![download.eps](img/download_fmt.gif)\n\n```\n\
  \ $ cat recursive-byte.sh\n#!/bin/bash\nLOG=/tmp/factorial-log.txt\n> $LOG\nfactorial()\n\
  {\n  echo \"'date': Called with $1\" >> $LOG\n  sleep 1\n  if [ \"$1\" -gt \"1\"\
  \ ]; then\n    previous='expr $1 - 1'\n    parent='factorial $previous'\n    result='expr\
  \ $1 * $parent'\n    echo \"'date': Passed $1 - the factorial of $previous is ${parent}.\
  \ \" \\\n         \"$1 * $parent is ${result}.\" >> $LOG\n    echo \"'date': Sleeping\
  \ for 2 seconds.\" >> $LOG\n    sleep 2\n    return $result\n  else\n    echo \"\
  'date': Passed $1 - returning 1.\" >> $LOG\n    echo \"'date': Sleeping for 5 seconds.\"\
  \ >> $LOG\n    sleep 5\n    return 1\n  fi\n}\nread -p \"Enter a number: \" x\n\
  echo \"Started at 'date'\"\nfactorial $x\necho \"Answer: $?\"\necho \"Here is my\
  \ working:\"\ncat $LOG\nrm -f $LOG\necho \"Finished at 'date'\"\n$ ./recursive-byte.sh\n\
  Enter a number: 5\nStarted at Wed Jan 26 11:53:49 GMT 2011\nAnswer: 120\nHere is\
  \ my working:\nWed Jan 26 11:53:49 GMT 2011: Called with 5\nWed Jan 26 11:53:50\
  \ GMT 2011: Called with 4\nWed Jan 26 11:53:51 GMT 2011: Called with 3\nWed Jan\
  \ 26 11:53:52 GMT 2011: Called with 2\nWed Jan 26 11:53:53 GMT 2011: Called with\
  \ 1\nWed Jan 26 11:53:54 GMT 2011: Passed 1 - returning 1.\nWed Jan 26 11:53:54\
  \ GMT 2011: Sleeping for 5 seconds.\nWed Jan 26 11:53:59 GMT 2011: Passed 2 - the\
  \ factorial of 1 is 1. 2 * 1 is 2.\nWed Jan 26 11:53:59 GMT 2011: Sleeping for 2\
  \ seconds.\nWed Jan 26 11:54:01 GMT 2011: Passed 3 - the factorial of 2 is 2. 3\
  \ * 2 is 6.\nWed Jan 26 11:54:01 GMT 2011: Sleeping for 2 seconds.\nWed Jan 26 11:54:03\
  \ GMT 2011: Passed 4 - the factorial of 3 is 6. 4 * 6 is 24.\nWed Jan 26 11:54:03\
  \ GMT 2011: Sleeping for 2 seconds.\nWed Jan 26 11:54:05 GMT 2011: Passed 5 - the\
  \ factorial of 4 is 24. 5 * 24 is 120.\nWed Jan 26 11:54:05 GMT 2011: Sleeping for\
  \ 2 seconds.\nFinished at Wed Jan 26 11:54:07 GMT 2011\n$\n```\n\n`recursive-byte.sh`\n\
  \n当你向此脚本传递数字 6 时，它会产生值 208，因为 720 模 256 等于 208。计算过程中，`bc` 得到了正确的答案，但当 shell 函数返回该值时，它会被压缩成单个字节，720\
  \ 的有效位构成了 208。\n\n![note.ai](img/note_fmt.gif)\n\n由于一个字节由 8 位组成，超过 255 的数字会溢出。在二进制中，120\
  \ 是 `1111000`，是 8 位，这是正常的。720 是 `1011010000`，是 10 位。前两位被丢弃，剩下 `1101000`，对应的十进制为\
  \ 208。\n\n\n\n\n函数传统只返回一个值。壳（shell）的情况并不那么简单，因此某些副作用偶尔会让人感到惊讶。由于只有一个 shell 在执行该脚本，因此函数内部的任何变量在函数外部仍会继续存在。此脚本有三个变量：`GLOBALVAR`、`myvar`\
  \ 和 `uniquevar`。在某些语言中，在类似的情况下，`GLOBALVAR` 会被视为全局变量，因为它在函数本身之外定义。在某些语言中，函数内部的 `myvar`\
  \ 将是局部的，并与函数外部的 `myvar` 变量分开。在许多语言中，`uniquevar` 在第一次被调用时会失败，因为在之前它从未被定义过。在 shell\
  \ 中，这是没有问题的。`uniquevar` 仍然不会在函数外部被看到，因为它在函数之外从未存在过。\n\n这些偶尔发生冲突但被广泛理解的标准在许多编程语言中都是通用的。shell\
  \ 略有不同，因为它不是一种严格的编程语言。在运行以下脚本之前，尝试预测它的结果，并准备好解释为什么结果会如你所预测的那样。你可以参考表 8-1。\n\n###\
  \ 表 8-1： `GLOBALVAR`、`myvar` 和 `uniquevar` 的预测最终值\n\n| 变量 | 初始值 | 预测的最终值及原因 |\n\
  | --- | --- | --- |\n| `$GLOBALVAR` | 1 | |\n| `$myvar` | 500 | |\n| `$uniquevar`\
  \ | 未定义 | |\n\n![download.eps](img/download_fmt.gif)\n\n```bash\ncat scope.sh\n\
  #!/bin/sh\nthe_function()\n{\n  echo \"  This is the_function.  I was passed $#\
  \ arguments: \\\"\"\n        \\\"$1\\\", \"$2\\\", \"$3\\\".\"\n  myvar=100\n  echo\
  \ \"    GLOBALVAR started as $GLOBALVAR;\"\n  GLOBALVAR='expr $GLOBALVAR + 1'\n\
  \  echo \"    GLOBALVAR is now $GLOBALVAR\"\n  echo \"    myvar started as $myvar;\"\
