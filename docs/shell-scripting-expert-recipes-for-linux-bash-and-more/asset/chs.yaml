  \n#### awk\n\nIBM DeveloperWorks 网站有一些实用的 awk 信息：\n\n\n\n\n\n[`www.ibm.com/developerworks/linux/library/l-awk1/`](http://www.ibm.com/developerworks/linux/library/l-awk1/)\n\
  \nGreg Goebel 有一个非常有用的 awk 入门教程：\n\n[`www.vectorsite.net/tsawk.html`](http://www.vectorsite.net/tsawk.html)\n\
  \n## Unix 变体\n\nBruce Hamilton 的 Rosetta Stone 是一个极佳的资源，正如网站上所说，“在这个世界里管那个叫什么？”它涵盖了大多数主要的\
  \ Unix 类操作系统以及如何在这些系统中执行常见任务。你也可以用它搜索你熟悉的内容（例如 `iptables`），以找到它们在其他操作系统中的对应命令（如\
  \ `ipf`、`pfctl` 等）：\n\n[`www.bami.com/rosetta.html`](http://www.bami.com/rosetta.html)\n\
  \n## Shell 服务\n\n有两种类型的 Shell 服务；传统的是 shell 主机（shell hosts），允许你在他们的服务器上拥有账户，并可以通过\
  \ `ssh` 登录。最近出现了一种较新的形式，例如 [`anyterm.org/`](http://anyterm.org/) — [`simpleshell.com/`](http://simpleshell.com/)\
  \ 就是这种形式的一个实例 — 它使用 AJAX 在浏览器和服务器 shell 之间传递文本，将 shell 账户转换为 Web 服务。Fabrice Bellard（QEMU\
  \ 模拟器的作者）甚至编写了一个基于 Javascript 的 486 CPU 模拟器，可以在 [`bellard.org/js-linux`](http://bellard.org/js-linux)\
  \ 浏览器中运行原生 Linux。\n\n[`shells.red-pill.eu/`](http://shells.red-pill.eu/) 有一个很长的\
  \ shell 服务商列表，[`www.egghelp.org/shells.htm`](http://www.egghelp.org/shells.htm)\
  \ 也是如此。我偶尔使用 [silenceisdefeat.com](http://silenceisdefeat.com)（我在那里的用户名是 steveparker）。作为至少\
  \ 1 美元一次性捐赠的回报，他们提供对 OpenBSD 服务器的访问。\n\n不说，被允许访问别人的系统是一种荣幸，使用条款始终反映了这一点。将此类服务视作在别人家里做客是正确的。唯一的区别在于，你应该预期并接受你的主机有权按照他们的意愿检查你的文件和活动。使用这些服务发送垃圾邮件、进行拒绝服务（DoS）攻击、端口映射、破解盗版软件（warez）或尝试匿名，以及所有其他显而易见的滥用行为都是不可接受的，例如从内部（例如\
  \ Bittorrent、DoS）或外部（例如托管）泛洪主机网络，或者消耗过 CPU、内存或其他系统资源。无论如何，这些在很大程度上都是自动化的，因此此类尝试将告失败。\n\
  \n## 术语表\n\n- `$` 美元符号在 shell 中用于引用变量。在正则表达式中，它也表示文本行的结束。\n- `|` 管道符号用于连接流水线中的命令。\n\
  - `\\` 反斜杠用于指示其后的字符应被视为字面量且不进行扩展。这有少数例外；`\\\\` 是字面量反斜杠，因此要嵌入字符串 `\"`，格式应为 `\\\\\"\
  `。另一个主要例外是反斜杠后跟着换行符。这表示行持续，即将当前行与下一行合并。这对于编写更清晰、更易读的代码很有用。\n- 在单引号内时，反斜杠不会转义单引号；`echo\
  \ 'That's all folks'` 不起作用，`echo 'That\\'s all folks'` 也不行。为了转义这一点，你必须在其他引号之外包含一个\
  \ `\\'`：`echo 'That'\\''s all folks'`。\n- `#!` Hash-bang（也称为 she-bang）是文件最开始的一对特殊字符，指示随后的可执行文件是执行该脚本的解释器（以及可选参数）。\n\
  - `&` 取符号告诉 shell 在其前的命令将在后台执行。shell 保持在前台，且变量 `$!` 会被设为后台进程的 PID。\n- `[` 是 `test`\
  \ 程序的同义词。\n- **absolute path** 绝对路径以斜杠字符开头；`/etc/hosts` 是一个绝对路径，无论引用进程位于何处，它都指向系统上的特定文件。另见相对路径。\n\
  - **alias** 别名是命令的快捷方式。这些别名仅在交互式 shell 会话中有效，在 shell 脚本中无效。\n- **array** 数组是一个具有许多值的单个变量，每个值通过其索引访问。在\
  \ bash 版本 4 和 ksh93 之前，索引必须是整数。从 bash 4 和 ksh93 开始，关联数组意味着索引也可以是字符字符串。\n- **bash**\
  \ Bourne Again SHell，是许多 Unix 和 Linux 操作系统上的默认 shell。\n- **builtin** 内置于 shell 的命令。对于\
  \ bash，这些命令列在 `bash` 手页的“Shell Builtin Commands（Shell 内置命令）”标题下。它们主要是如 `cd` 这样的命令，`cd`\
  \ 无法作为外部进程运行（因为该进程将改变目录而不影响当前 shell），或者如 `declare`，它定义了当前 shell 如何处理命名的变量。同样，`source`\
  \ (`.`) 命令必须是当前运行 shell 进程的一部分才能产生所需的效果。\n- 某些 shell 内置命令会覆盖外部命令。出于效率考虑，`echo` 就是其中一个内置命令。\n\
  - `type` 命令在 `$PATH` 环境变量之前搜索 shell 内置命令，但 `which` 只在 `$PATH` 中查找。这意味着 `type kill`\
  \ 的响应是 `kill` 是一个 shell 内置命令，而 `which kill` 的响应是 `/bin/kill`。\n- **command substitution**\
  \ 将一个命令的输出作为另一个命令插入的行为。命令替换有两种形式。标准形式使用反引号包围命令行来表示命令替换；较新的形式使用 `$(cmd)`。命令替换可以嵌套；反引号必须用反斜杠转义。以下代码段显示了两种形式；变量周围的引号是为了保留输出行之间的换行符。最后的换行符总是会被删除。\n\
  \n```\n $ foo='ls -l \\'which grep\\' /usr/bin/test'\n$ echo FOO is: \"$foo\"\n\
  FOO is: -rwxr-xr-x 1 root root 119288 Apr 22 2010 /bin/grep\n-rwxr-xr-x 1 root root\
  \ 30136 Apr 28 2010 /usr/bin/test\n$ bar=$(ls -l $(which grep) /usr/bin/test)\n\
  $ echo BAR is: \"$bar\"\nBAR is: -rwxr-xr-x 1 root root 119288 Apr 22 2010 /bin/grep\n\
  -rwxr-xr-x 1 root root 30136 Apr 28 2010 /usr/bin/test\n```\n\n- **compiled language**\
  \ 编译型语言写为文本文件，然后由编译器解析产生二进制文件，由操作系统执行。生成的二进制文件特定于其编译所在的操作系统和架构。\n- **dash** Debian\
  \ Almquist SHell 现在是 Debian 及其他源自它的发行版的默认 shell。它是一个比 bash 更小、更轻量的 shell，但仍然符合 POSIX\
  \ 标准。\n- **device driver** 处理特定类设备实现细节的内核代码。设备驱动通常位于 `/dev` 目录中，取决于操作系统，它可能是磁盘文件系统或虚拟文件系统。设备驱动通常是块设备或字符设备。块设备是磁盘驱动器等设备，按块进行读写。大多数其他设备是字符设备，如终端、音频驱动程序、内存、网络设备等。还有特殊的设备驱动，如\
  \ `/dev/random`、`/dev/zero` 和 `/dev/null`，它们与任何物理硬件都不关联 —— see null。\n- **environment**\
  \ 进程的环境是其状态的统称；这包括它的当前工作目录、打开的文件、子进程，以及为该进程设置的环境变量。\n\n\n\n\n\n### FIFO\n一种先进先出的管道。此类示例可以在第\
  \ 14 章中找到。由文件系统条目表示的数据；这通常与存储在物理设备上的数据相关，但对于 `/proc` 和 `/dev` 等虚拟文件系统则并非如此。文件还有元数据（存储在其\
  \ `inode` 中）以及名称（存储在它的目录条目中）。\n\n### FSF\n自由软件基金会（Free Software Foundation）由 Richard\
  \ M. Stallman 博士创立，它是由 Stallman 博士创立的 `GNU` 项目的主要赞助者。\n\n### function\n函数是代码块，它们在定义时不会被执行（尽管\
  \ shell 在解析函数时会报告它发现的任何语法错误），但实际上它们变成了 shell 可用的额外命令，并可以这样被调用。第 8 章将详细介绍函数。\n\n\
  ## GNU\n`GNU`’s Not Unix（GNU 不是 Unix）项目将大部分原始 Unix 工具重写并扩展为自由软件。\n\n### here document\n\
  “在此文档中”（here document）使用 `<<` 语法为命令提供标准输入。它的主要用途是为命令提供多行输入，而无需先将这些行写入文件然后从该文件进行重定向。在\
  \ `<<` 之后，你定义一个分隔符；该分隔符单独占一行，标记了输入的结束。后续代码展示了在此文档的使用。\n\n```\n $ cat > /tmp/output.txt\
  \ << END_IT_HERE\n> hello\n> this is a test.\n> END_IT_HERE\n$ cat /tmp/output.txt\n\
  hello\nthis is a test.\n$\n```\n\n### here string\n“在此字符串中”（here string）的语法为 `<<<`；它类似于在此文档，不同之处在于\
  \ `<<<` 右侧的文本不是分隔符而是要执行的命令。如下代码所示，文本是字面量的，但可以使用命令替换来提供命令的输出。为了保留命令输出中的换行符，必须将整个表达式放在双引号内。脚本简单读取了两行输入作为\
  \ `$foo` 和 `$bar`，然后将其显示在标准输出上。\n\n```\n $ cat /tmp/herestring.sh\n#!/bin/bash\n\
  read foo\necho Foo is $foo\nread bar\necho Bar is $bar\n$ /tmp/herestring.sh <<<\
  \ ls\nFoo is ls\nBar is\n$ /tmp/herestring.sh <<< 'ls /tmp'\nFoo is chris.txt herestring.sh\
  \ keyring-vcxP9t MozillaMailnews orbit-steve\n sh-thd-1305760934 ssh-pQhaCK2245\
  \ virtual-steve.NqnWUy\nBar is\n$ /tmp/herestring.sh <<< \"'ls /tmp'\"\nFoo is chris.txt\n\
  Bar is herestring.sh\n$\n```\n\n### infinite recursion\n参见递归，无限\n\n### inode\n文件系统中的每个文件都有一个索引节点（`inode`），它存储文件本身的关键元数据，包括指向文件内容所在位置的链接。`inode`\
  \ 中存储的关键数据：\n* 所有者\n* 组\n* 权限\n* 文件大小\n* 链接计数\n* 最后更改 (`ctime`)、修改 (`mtime`) 和访问\
  \ (`atime`) 时间\n\n这种结构意味着一个文件可以出现在多个目录中和/或具有多个名称；对于文件的每个“副本”，不需要额外的磁盘空间（目录条目除外），链接计数会加\
  \ 1。当所有副本都被删除时，链接计数将减为零，空间可以被释放。然而，如果最后一个链接被删除时文件正处于打开状态，`inode` 会反映这一事实；文件对于在删除时已打开该文件的进程仍然可用，直到所有此类进程都关闭该文件。\n\
  \n### interpreted language\n解释型语言（与编译型语言相反）是逐行解析并执行的。这的一个副作用是，该语言通常也可以交互式使用。解释型语言程序可以在任何支持该语言的系统上执行（尽管系统之间的细微差异会增加一些复杂性）。shell\
  \ 就是这种语言之一。与编译型语言形成对比。\n\n### kernel\n操作系统的核心。`kernel` 在任何其他程序之前启动；它对硬件具有完全控制，包括（对于\
  \ 80386 及更新型号的 x86 架构）将 CPU 切换到保护模式的专用能力。这使得它能够提供抢占式多任务、中断处理和内存管理等服务。\n\n### ksh\n\
  KornShell 由 David Korn 作为 AT&T Unix 的一部分编写而就。它现在是一个开源项目，也是许多 GNU/Linux 发行版以及 Unix\
  \ 变体的一部分。\n\n## Linux\n一种类 Unix 操作系统内核，最初由 Linus Torvalds 开发并仍由其管理。\n\n### null\n\
  `NULL` 字节是 ASCII 字符零。`/dev/null` 被称为“垃圾桶”——它丢弃发送到它的任何内容。从其读取时，`/dev/null` 输出为空。相比之下，`/dev/zero`\
  \ 提供连续的 `NULL` 字符流。这些 `/dev` 设备都是设备驱动的特殊实例，为硬件提供接口。\n\n### process\n由操作系统执行的项目。每个进程有一个进程\
  \ ID (`PID)，并在 `/proc/PID` 中有一个条目，包含进程的状态以及它打开的文件。在 脚本中，shell 是一个进程并在其内部执行内置命令。外部命令（如\
  \ `grep`）会产生新进程，执行后由 shell 在 `$?` 变量设置返回码。\n\n### recursion, infinite\n参见无限递归\n\n\
  ### redirection\n将文件（通常是输入或输出流，如 `stdin` 或 `stdout`）的内容重定向到另一个的行为。这在第 10 章。\n\n\
  ### relative path\n相对路径不以斜杠开头；`../etc/hosts` 指向 `etc` 目录下的 hosts 文件，该目录与当前运行进程处于同一个父目录。`etc/hosts`\
  \ 指向当前运行进程所在目录下的 `etc` 目录中的 hosts 文件。\n\n### sh\n默认系统 shell。这通常是 Bourne shell 或符合\
  \ POSIX 的 shell。对于 `/bin/sh` 具体具有哪些功能的混乱会导致 shell 可移植性的巨大问题。\n\n### shell\nshell\
  \ 是 Unix 和 Linux 系统的默认环境、命令解释器和编程语言。它是用户与 `kernel` 之间的接口。\n\n### Standard Input\
  \ (stdin), Standard Output (stdout), Standard Error (stderr)\n标准输入、输出和错误是所有进程启动时带有三个文件描述符。它们分别是文件描述符\
  \ 0、1 和 2。`echo hello` 输出到 `stdout`；`echo error>&2` 输出到 `stderr`。\n\n### Unix\n\
  多用户、多任务的企业级操作系统，最早开发于 1969 年，目前仍在使用。Unix 是 Open Group 的商标。\n\n### whitespace\n空格、制表符和换行符都被归类为空白字符。默认情况下，内部字段分隔符（`IFS`）设置为这三个字符。\n\
