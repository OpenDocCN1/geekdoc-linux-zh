  \n管道（pipe）是 Unix 和 Linux shell 的核心特性。管道连接两个进程，通常将一个进程的标准输出连接到另一个进程的标准输入上。与其将第一个命令的输出写入文件然后再运行第二个命令，不如通过这种方法直接跳过中间文件。它对于脚本编写是如此核心，以至于已经多次提到，但澄清在设置管道时会发生什么仍然值得的。这个示例将\
  \ `find` 的输出管道到：\n\n```\nfind -print | grep\n/lib/security/pam_rhosts.so\n/var/lib/ghostscript/Map\n\
  /var/lib/ghostscript/fonts\n/var/lib/ghostscript/fonts/cidmap\nfind: '/var/lib/php5':\
  \ Permission denied\nfind: '/var/lib/polkit-1': Permission denied\n/deny.info\n\
  ```\n\n这里发生的情况是启动了 `grep`，随后是 `find`。一旦两者都存在，`find` 进程的输出就会链接到 `grep` 进程的输入上。`find`\
  \ 进程随后运行，其输出会被发送。如前面的示例所示，进程的标准错误仍然是调用终端，因此它会正常显示。它没有通过管道。这一点显而易见，因为行中任何地方都不包含“hosts”文本。因此，这是\
  \ `find` 的标准错误，而不是 `grep` 的输出。\n\n### 等\n\n可以等待一个、多个或所有后台进程完成。此会话下载了 `md5sum.txt`\
  \ 文件，它非常小，然后是 CentOS 5.5 的前两个 CD-ROM ISO 镜像。这些都是大文件，因此在后台下载，以便将控制权返回给 shell。\n\n\
  \n\n\n无法在同一个终端中将两个活跃的 `wget` 进程都置于前景，但最后的 `wait` 命令具有类似的效果。它会等待所有者的子进程返回，然后将控制权交回给调用\
  \ shell。对于交互式会话来说这并不重要，但脚本可以使用这种方法在获取所有 ISO 镜像，然后再比较 md5sums，而这只有在下载完成后才能进行。\n\n\
  ![note.ai](img/note_fmt.gif)\n\n为了简洁起见，`md5sum.txt` 被裁剪为仅包含这两个文件。否则，它会显示关于其他缺失 ISO\
  \ 镜像的错误信息。\n\n### 使用 nohup 捕捉挂起\n\n在运行像上一节中的下载这样的耗时后台任务时，确保任务在用户注销或因为网络连接断开而不会终止是有用的。`nohup`\
  \ 命令在包装器中运行进程，保护它们免受可能导致其终止的信号的影响。它们并不总是一起使用，但将 `nohup` 进程放入后台运行非常常见，同样，对进程使用 `nohup`\
  \ 也非常常见。默认情况下，命令的输出将重定向到 `nohup.out`。然而，如果 `stderr` 和 `stdout` 都被重定向，则不会创建 `nohup.out`。\n\
  \n通过将这些整合在一起，可以创建一个脚本来下载并验证 ISO 镜像。以下代码将其输出记录到单独的文件（每个镜像一个），并在最后进行适当的 `md5sum` 检查。\n\
  \n![download.eps](img/download_fmt.gif)\n\n\n\n\n如前所述，Linux 上的 `/proc` 文件系统暴露了大量关于内核的细节，这（初看起来可能如此）并不是在启动时创建的一组静态文件，而是直接挂钩到内核本身。因此，某些文件可以写入，某些可以读取，而另一些则可以可读可写。`/proc`\
  \ 中的许多功能在 `proc(5)` 手册页中描述；运行 `man 5 proc` 即可阅读。这些文件对于 Shell 脚本非常有用，因为 Shell 脚本可以非常接近内核本身的内部实现，这在类\
  \ Unix 系统中是不寻常的。\n\n## Version\n\n`/proc/version` 是内核版本的只读列表，包括编译时的构建详细信息。与 `uname`\
  \ 相比，这是检测实际内核版本的一种更完整、更准确的方法。尽管在这里看起来很长，但它实际上只是一行文本。\n\n```\n $ cat /proc/version\n\
  Linux version 2.6.32-5-amd64 (Debian 2.6.32-29) (ben@decadent.org.uk) (gcc version\n\
  \ 4.3.5 (Debian 4.3.5-4) ) #1 SMP Fri Dec 10 15:35:08 UTC 2010\n$ uname -a\nLinux\
  \ goldie 2.6.32-5-amd64 #1 SMP Fri Dec 10 15:35:08 UTC 2010 x86_64 GNU/Linux\n$\n\
  ```\n\n## SysRq\n\nPC 键盘上有一个很少使用的键，标记为 `SysRq`。它的历史可以追溯到大型机计算机系统，但 Linux 内核将其作为与内核通信的一种，即使正常方法（如大多数示例所示的向\
  \ `/proc` 回显）不可用。如果启用，当用户按下“魔法”组合键 Ctrl+Alt+SysRq 并配合另一个键来指定内核的操作时，内核可以执行一些可用的的最基础的任务——同步文件系统、报告内存使用情况，甚至重启系统。可用任务列表见表\
  \ 10-2。\n\n### 表 10-2: 常见 SysRq 命令\n\n| 键 | 目的 |\n| --- | --- |\n| c | 崩溃系统。 |\n\
  | m | 显示系统内存。 |\n| h | 显示帮助。 |\n| r | 将控制台显示设置为原始模式（Raw mode）。 |\n| s | 同步所有文件系统。\
  \ |\n| i | 向所有进程（init 除外）发送 KILL 信号。 |\n| u | 卸载所有文件系统。 |\n| b | 重启机器。 |\n| e |\
  \ 向所有进程（init 除外）发送 TERM 信号。 |\n\n有一个常用的口诀，“抬起瘦大象是极其无聊”（Raising Skinny Elephants\
  \ Is Utterly Boring）。为了安全地重启挂起的系统，这会将控制台设置为原始模式，同步文件系统，向所有进程发送 TERM，卸载所有文件系统并重启机器。图\
  \ 10-2 显示了一个控制台，其中已按下了 Control-Alt-SysRq 和 `h` 组合键以显示 SysRq 帮助信息，接着按下 Control-Alt-SysRq\
  \ 和 `s` 来同步磁盘。\n\n图 10-2\n\n![f1002.tif](img/f1002_fmt.jpg)\n\nsysrq 功能在 `/proc`\
  \ 下有两个文件：`/proc/sysrq-trigger` 和 `/proc/sys/kernel/sysrq`。后者用于启用或禁用 sysrq 功能，所有用户可读，root\
  \ 用户可写。1 表示功能已启用；0 表示已禁用。\n\n`/proc/sysrq-trigger` 文件接受表 10-2 中的任意一个键，其行为就像用户在系统控制台上按下了\
  \ Ctrl+Alt+SysRq 加上该键。这在控制台位于远程数据中心时特别特别有用。\n\n```\n declan:~# echo h > /proc/sysrq-trigger\n\
  declan:~# tail -1 /var/log/messages\nFeb 13 22:17:44 declan kernel: [2328070.124615]\
  \ SysRq : HELP : loglevel0-8 reBoot \nCrashdump tErm Full kIll saK aLlcpus showMem\
  \ Nice powerOff showPc show-all-timers(Q\n)unRaw Sync showTasks Unmount shoW-blocked-tasks\n\
  declan:~# echo m > /proc/sysrq-trigger\ndeclan:~# tail -24 /var/log/messages\nFeb\
  \ 13 22:17:44 declan kernel: [2328070.124615] SysRq : Show Memory\nFeb 13 22:17:44\
  \ declan kernel: [2328070.124615] Mem-info:\nFeb 13 22:17:44 declan kernel: [2328070.124615]\
  \ Mem-info: Node 0 DMA\nFeb 13 22:17:44 declan kernel: [2328070.124615] Mem-info:\
  \ Node 0 DMA2\nFeb 13 22:17:44 declan kernel: [2328070.124615] Mem-info: CPU 0:\n\
  Feb 13 22:17:44 declan kernel: [2328070.124615] Mem-info: CPU 1:\nFeb 13 22:17:44\
  \ declan kernel: [2328070.124615] Mem-info: CPU 2:\nFeb 13 22:17:44 declan kernel:\
  \ [2328070.124615] Mem-info: CPU 3:\nFeb 13 22:17:44 declan kernel: [2328070.124615]\
  \ Mem-info: CPU 4:\nFeb 13 22:17:44 declan kernel: [2328070.124615] Mem-info: CPU\
  \ 5:\nFeb 13 22:17:44 declan kernel: [2328070.124615] Mem-info: Active:\nFeb 13\
  \ 22:17:44 declan kernel: [2328070.124615] Mem-info: Dirty:\nFeb 13 22:17:44 declan\
  \ kernel: [2328070.124615] Mem-info: Free:\nFeb 13 22:17:44 declan kernel: [2328070.124615]\
  \ Mem-info: Slab:\nFeb 13 22:17:44 declan kernel: [2328070.124615] Mem-info: Mapped:\n\
  Feb 13 22:17:44 declan kernel: [2328070.124615] Mem-info: Pagetables:\nFeb 13 22:17:44\
  \ declan kernel: [2328070.124615] Mem-info: Node 0 DMA\nFeb 13 22:17:44 declan kernel:\
  \ [2328070.124615] Mem-info: Node 0 DMA32\nFeb 13 22:17:44 declan kernel: [2328070.124615]\
  \ Mem-info: low_reserve:\nFeb 13 22:17:44 declan kernel: [2328070.124615] Mem-info:\
  \ all_claimable?\nFeb 13 22:17:44 declan kernel: [2328070.124615] Mem-info: all_reclaimable?\n\
  ```\n\n## /proc/meminfo\n\n`/proc/meminfo` 提供了内存状态的详细概述。随后的代码突出了了一些令人感兴趣的元素。MemTotal\
  \ 和 MemFree 浅显易懂，分别代表可用内存和空闲内存。虚拟内存包括交换空间，这里显示了它，以及当前的缓冲区和缓存。`/proc/meminfo` 是一个非常有用的信息来源，和\
  \ `/proc` 的大部分部分一样，它的设计便于人类和脚本进行解析。\n\n```\n MemTotal:   2062424 kB\n MemFree: \
  \    46984 kB\nBuffers:     201248 kB\n Cached:     1575452 kB\n SwapTotal:   1951856\
  \ kB\n SwapFree:    1951004 kB\n```\n\n## /proc/cpuinfo\n\n`/proc/cpuinfo` 文件显示了系统中处理器的信息。严格来说，它显示的是系统的处理线程，因此超线程、多核、多处理器系统可能会列出很多\
  \ CPU。要计算系统中多少个物理 CPU，或者一个 CPU 有多少个核心，已不再那么直观。`physical id` 字段从 0 开始计算核心，因此如果最大的物理\
  \ ID 是 3，那么机器内部就有四个实际芯片。同样，`core id` 字段计算核心数量，因此如果一个 CPU 拥有核心 0–5，则它是一个六核 CPU。超线程使可执行线程数翻倍，但超线程核心在\
  \ `/proc/cpuinfo` 中仅列出一次。\n\n`cpuinfo.sh` 脚本解析 `/proc/cpuinfo`，以提供系统处理器提供人类可读的描述。\n\
  \n\n\n\n\n```bash\n $ cat cpuinfo.sh\n#!/bin/bash\nhyperthreads=1\ngrep -w \"^flags\"\
  \ /proc/cpuinfo | grep -qw \"ht\" && hyperthreads=2\nphys='grep \"physical id\"\
  \ /proc/cpuinfo | sort -u | wc -l'\ncores='grep \"core id\" /proc/cpuinfo | sort\
  \ -u | wc -l'\nthreads='expr $phys * $cores * $hyperthreads'\ndetail='grep \"model\
  \ name\" /proc/cpuinfo | sort -u | cut -d: -f2- \\\n  | cut -c2- | tr -s \" \" '\n\
  echo \"'hostname -s' has $phys physical CPUs ($detail) each with $cores cores. \"\
  \necho \"Each core has $hyperthreads threads: total $threads threads\"\n$ ./cpuinfo.sh\n\
  webserv has 2 physical CPUs (Intel(R) Xeon(R) CPU L5420 @ 2.50GHz) each with 4\n\
  cores.\nEach core has 2 threads: total 16 threads\n$\n```\n\n### cpuinfo.sh\n\n\
  ### /sys\n\n`/sys` 是一个伪文件系统，与 `/proc` 非常密切；它们之间甚至有些重叠，因为 `/proc` 有一个包含类似项的 `/sys`\
  \ 子目录。`cpu.sh` 脚本读写 `/sys/devices/system/node/` 树。本章后面的 `mem.sh` 脚本从同一个树中读取内存配置。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```bash\n $ cat cpu.sh\n#!/bin/bash\n\
  if [ ! -f /sys/devices/system/node/node0/cpu0/online ]; then\n  echo \"node0/cpu0\
  \ is always Online.\"\nfi\nfunction showcpus()\n{\n  cpu=${1:-'*'}\n  for node in\
  \ 'ls -d /sys/devices/system/node/node*/cpu${cpu} | \\\n        cut -d\"/\" -f6\
  \ | sort -u'\n  do\n    grep . /sys/devices/system/node/${node}/cpu*/online /dev/null\
  \ \\\n        | cut -d\"/\" -f6- | sed s/\"\\/online\"/\"\"/g | \\\n          sed\
  \ s/\":1$\"/\" is Online\"/g |sed s/\":0$\"/\" is Offline\"/g\n  done\n}\nfunction\
  \ online()\n{\n  if [ ! -f /sys/devices/system/node/node*/cpu${1}/online ]; then\n\
  \    echo \"CPU$1 does not have online/offline functionality\"\n  else\n    grep\
  \ -q 1 /sys/devices/system/node/node*/cpu${1}/online\n    if [ \"$?\" -eq \"0\"\
  \ ]; then\n      echo \"CPU$cpu is already Online\"\n    else\n      echo -en 'showcpus\
  \ $cpu' - \"\n      echo -en \"Onlining CPU$cpu ... \"\n      echo 1 > /sys/devices/system/node/node*/cpu${1}/online\
  \ 2> /dev/null\n      if [ \"$?\" -eq \"0\" ]; then\n        echo \"OK\"\n     \
  \ else\n        echo \"Failed to online CPU$1\"\n      fi\n    fi\n  fi\n}\nfunction\
  \ offline()\n{\n  if [ ! -f /sys/devices/system/node/node*/cpu${1}/online ]; then\n\
  \    echo \"CPU$1 does not have online/offline\"\n  else\n    grep -q 0 /sys/devices/system/node/node*/cpu${1}/online\n\
  \    if [ \"$?\" -eq \"0\" ]; then\n      echo \"CPU$cpu is already Offline\"\n\
  \    else\n      echo -en 'showcpus $cpu' - \"\n      echo -en \"Offlining CPU$cpu\
  \ ... \"\n      echo 0 > /sys/devices/system/node/node*/cpu${1}/online 2> /dev/null\n\
  \      if [ \"$?\" -eq \"0\" ]; then\n        echo \"OK\"\n      else\n        echo\
  \ \"Failed to offline CPU$1\"\n      fi\n    fi\n  fi\n}\ncase $1 in\n  show) showcpus\
  \ $2\n  ;;\n  on)\n    shift\n    for cpu in *\n    do\n      online $cpu\n    done\n\
  \    ;;\n  off)\n    shift\n    for cpu in *\n    do\n      offline $cpu\n    done\n\
  \    ;;\n  *) echo \"Usage: \"\n    echo \"  basename $0 show [cpu] - shows all\
  \ CPUs shared by that node\"\n    echo \"  basename $0 on cpu (cpu cpu ... )\"\n\
  \    echo \"  basename $0 off cpu (cpu cpu ... )\"\n  ;;\nesac\n```\n\n### cpu.sh\n\
  \n脚本的主体是一个 `case` 语句，它读取传递给脚本的第一个单词（`on`、`off` 和 `show` 是有效关键字），并根据需要调用相关函数。对于 `show`，一个可选的\
  \ CPU ID 参数可以将输出限制为单个 CPU。如果未提供，`showcpus` 函数开头的 `cpu=${1:-'*'}` 将此参数的值设为星号。这随后被用作通配符匹配系统中的所有\
  \ CPU。\n\n![note.ai](img/note_fmt.gif)\n\n`NUMA` 代表非均匀内存访问架构（Non-Uniform Memory\
  \ Architecture）；它可以指代大型机器集群，例如 Beowulf 集群。`NUMA` 也可以指多个多核 CPU，其中系统内存的一部分绑定到一个 CPU，而另一部分内存空间则绑定到另一个\
  \ CPU。\n\n\n\n\n```\n\n万一您并不总是能立即访问此类机器，这台配备 128GB 内存和 8 个 CPU（总计 48 核）的 SunFire\
  \ X4640 的输出可能供您参考。\n\n```bash\nwhopper# ./cpuinfo.sh\nwhopper has 8 physical CPUs\
