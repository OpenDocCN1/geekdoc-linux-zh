  \ msgfmt -o po/fr/LC_MESSAGES/mynicescript.mo po/fr/script.po\n```\n\n## Invocation\
  \ (调用)\n\n注意，在接下来的示例中，文件已存在的消息是由 `mkdir` 命令报告的，而不是脚本。这是 `mkdir` 自身的本地化。对于这些测试运行，我确保了目录已经存在（在所有语言中），以显示这种行为。目录名\
  \ `.savedfiles` 在脚本中特意翻译成了本地语言。如果脚本决定所有目录名都使用英文，那么德语信息将会是 `mkdir: kann Verzeichnis\
  \ \"/home/steve/.savedfiles\" nicht anlegen: Die Datei existiert bereits.` 这是一个基于每个文件的文件的决策；由于明显的技术原因，不能因为你处于匈牙利本地环境就将\
  \ `/etc/hosts` 重命名为 `/stb/házigazdák`。然而，用户主目录下的这个保存文件目录更适合翻译，尽管这取决于应用程序以及它如何处理同一用户使用不同的本地设置再次运行脚本的情况。\n\
  \n\n\n\n\n```\nsteve@goldie:~/script$ ./script.sh\nmkdir: cannot create directory\
  \ '/home/steve/.savedfiles': File exists\nHello, world!\nWelcome to the script.\n\
  Here's a random number: 17365\nHere's another: 28848\nTwice 2 is 4\nTwice 4 is 8\n\
  Twice 6 is 12\nI have 1 child.\nI have 2 children.\nI have 3 children.\nsteve@goldie:~/script$\
  \ export LANG=de_DE\nsteve@goldie:~/script$ ./script.sh\nmkdir: kann Verzeichnis\
  \ \"/home/steve/.gespeichertendateien\" nicht anlegen: Die Datei\nexistiert bereits\n\
  Hallo Welt!\nwillkommen, um das Skript\nHier ist eine Zufallszahl: 16618\nHier ist\
  \ eine andere: 5870\nzweimal 2 ist 4\nzweimal 4 ist 8\nzweimal 6 ist 12\nIch habe\
  \ 1 Kind. \nIch habe 2 Kinder.\nIch habe 3 Kinder.\nsteve@goldie:~/script$ LANGUAGE=fr_FR\n\
  steve@goldie:~/script$ export LANGUAGE\nsteve@goldie:~/script$ ./script.sh\nmkdir:\
  \ impossible de créer le répertoire \" /home/steve/.fichiersenregistrés \": Le fichier\
  \ existe\nBonjour tout le monde!\nBienvenue sur le script.\nvoici un nombre aléatoire:\
  \ 4944\nvoici un autre: 26037\ndeux fois 2 est de 4\ndeux fois 4 est de 8\ndeux\
  \ fois 6 est de 12\nJ'ai 1 enfant.\nJ'ai 2 enfants.\nJ'ai 3 enfants.\n```\n\n##\
  \ 总结\n\n国际化可能是一个复杂的话，但在实践中，实际翻译只需要在简单的文本文件中源语言和目标语言进行配对。开发者甚至可以轻松提取出 `msgid` 和 `msgstr`\
  \ 字符串（如果这对翻译者有帮助），然后在翻译完成后将其放回去。所需的只是一个简单的文本文件。\n\n```\nmsgid \"Hello, world!\"\n\
  msgstr \"Bonjour tout le monde!\"\n```\n\n复数会增加额外的复杂性，脚本的编写需要确保 `msgid` 字符串能够完美契合\
  \ `gettext` 和 `eval_gettext` 所需的简单模式。这一切都让翻译者的工作变得更容易，因此这些限制实际上是一件好事。\n\n一些更大的挑战可能在于招募和激励翻译者，并在脚本中的消息发生变化时，让他们重新参与进来以更新翻译。在自由软件或开源项目中，确保潜在的翻译者对他们的要求感到舒适，是留住和鼓励志愿者的重要部分。你可以让翻译者非常容易地即使一次只翻译一个字符串到项目中；甚至可以轻松建立一个网站，让偶然的翻译者进来选择一种语言，查看该语言下当前未翻译的字符串并提供他们的翻译。你甚至可以不进行任何严格的身份验证或检查。如果一个字符串收到了\
  \ 30 个提交，其中 28 个相互一致，那么除非你正面临着被冒充的巨大风险，否则它们很可能是有效的翻译，即使没有进一步的检查。\n\n部分翻译也是一种选择。如果无法实现\
  \ 100% 的翻译目标，那么在此期间可以发布带有部分翻译的脚本，这将某些某些以原生语言显示，而其他消息以英语显示。这通常比完全不支持该语言要好得多。\n\n\
