- "# Shell 脚本：Linux、Bash 及更多高级秘籍\n\n\n\n![](img/cover.gif)\n\n![封面](img/cover.gif)\n\
  \n\n# 第一部分：关于材料\n\n- 第 1 章：Unix、GNU 和 Linux 的历史\n- 第 2 章：入门\n- 第 3 章：变量\n- 第 4 章：通配符扩展\n\
  - 第 5 章：条件执行\n- 第 6 章：使用循环流程控制\n- 第 7 章：变量后续\n- 第 8 章：函数与库\n- 第 9 章：数组\n- 第 10 章：进程\n\
  - 第 11 章：选择与使用 Shell\n\n# 第 1 章\n## Unix、GNU 和 Linux 的历史\n\nUnix 传统悠久，而 Linux 源于\
  \ Unix 传统，因此要理解 Linux 必须理解 Unix，而要理解 Unix 必须理解它的历史。在 Unix 出现之前，开发者会提交一叠孔卡，每张卡片代表一个命令或命令的一部分。这些卡片由计算机按顺序读取并执行。开发者在任务完成后会收到生成的输出。这通常在任务提交几天后发生；如果代码中有错误，输出就只有错误信息，开发者必须重新开始。后来，电传打字机和各种形式的分时系统大大加快了速度，但其模型基本上是相同的：提交一系列字符（孔卡，或键盘上的按键——本质上仍是一串字符）作为批处理作业提交以运行（或运行失败），并相应地返回结果。这在今天具有重要意义，因为它仍然是任何计算机化系统中传输数据的方式——一切都是字符序列，按顺序传输。无论是文本文件、网页、电影还是音乐，它们都只是\
  \ 0 和 1 的字符串，一如既往。任何看起来稍有不同的只是在这串 0 和 1 的字符串之上覆盖了一个界面。\n\nUnix 以及其他各种交互和分时系统于 20\
  \ 世纪 60 年代中期出现。Unix 及其至今仍然是计算实践的核心；它的影响可以在 DOS、Linux、Mac OS X 甚至微软 Windows 中看到。\n\
  \n### Unix\n\n1965 年，贝尔实验室（Bell Labs）和通用电气（GE）加入了马萨诸塞理工学院（MIT）的一个名为 `MULTICS` 的项目，即多复用信息计算系统。Multics\
  \ 旨在成为稳定的分时操作系统。“多复用”（Multiplexed）方面增加了不必要的复杂，最终导致贝尔实验室在 1969 年放弃了该项目。肯·汤普（Ken Thompson）、丹尼斯·里奇（Dennis\
  \ Ritchie）、道格·麦克罗伊（Doug McIlroy）和乔·奥萨纳（Joe Ossanna）保留了其后部分思想，去除了大量复杂性，并提出了 Unix（名字是\
  \ `MULTICS` 一词的变体，因为它是一个受 MULTICS 启发的简化操作系统）。\n\nUnix 的早期特性之一是引入了管道（pipes）——这是道格·麦克罗伊思考了几年的想法，并由肯·汤普在\
  \ Unix 中实现。同样，它采用了相同的流式串行数据概念，但管道引入了 `stdin` 和 `stdout` 的概念，数据通过它们流过。之前已经做过类似的事情，这个概念相当简单：一个进程创建输出，该输出成为另一个进程的输入。这种方法在今天具有重要意义，因为它仍然是任何计算机系统中传输数据的方式——一切都是字符序列，按顺序传输。无论是文本文件、网页、电影还是音乐。这种方法极大地影响了\
  \ Unix 的设计。大多数命令也支持文件参数，但它们被修改为从“标准输入”（`stdin`）读取并到“标准输出”（`stdout`）；管道可以将数据从一个工具流到另一个。这种新颖的概念定义了\
  \ Shell；它使得系统成为一组通用的工具，而不是单一用途应用程序。这被总结为“做好件事并做好它”。GNU 工具链的编写是为了保持与 Unix 的兼容性。\n\
  \n![noteai](img/note.gif)\n\nGNU 项目于 1983 年由理查德·斯托曼（Richard Stallman）启动，意在用自由软件取代商业\
  \ Unix。到 Linux 内核项目于 1991 年启动时，GNU 已经完成了所有用户工具的替换。事实上，GNU 工具的性能通常至少不亚于传统的 Unix 工具，往往提供了基于经验的额外功能。独立测试表明，GNU\
  \ 工具实际上比其 Unix 替代品更可靠（[http://www.gnu.org/software/reliability.html]）。\n\n例如，`who`\
  \ 命令列出登录系统的用户，每个会话一行。`wc` 命令计算字符、单词和行数。因此，以下代码将告诉你有多少人已登录：\n\n```\nwho | wc -l\n\
  ```\n\n`who` 工具不需要提供一个统计登录用户的选项，因为通用的 `wc` 工具已经可以做到这一点。这节省了 `who` 的一些额外工作，但当这种方法适用于整个工具范围（包括可能编写的任何新工具）时，避免了大量工作和随之而来的复杂性，这意味着引入额外漏洞的可能性降低了。当这种方法应用于更复杂的工具（如\
  \ `grep` 或甚至更多）时，每增加一个工具，系统的灵活性就会增加。\n\n![note.ai](img/fmt.gif)\n\n在更复杂的情况下，这实际上比看起来要困难；首先它必须找出有多少列和多少行。再次，有一组工具组合在一起提供这些信息。通过这种方式，链中的每个工具都可以被其他工具调用。\n\
  \n此外，这种系统意味着你不需要学习每个工具如何实现它的“单词计数”功能。有一些事实上的标准开关；`-q` 通常表示静默（Quiet），`-v` 通常表示详细（Verbose），以此此类推，但如果\
  \ `who -c` 表示“计算条目数”，那么 `cut -c <n>`（表示“取前 n 个字符”）就会不一致。更好的做法是让每个工具完成自己的工作，并让 `wc`\
  \ 为所有工具进行计数。\n\n\n\n\n\n对于一个更复杂的示例，`sort` 实用仅对文本进行排序。它可以按字母顺序或数字顺序排序（区别在于，在字母顺序中“10”在“9”之前，但在数字顺序排序中则在“9”之后），但它不会搜索内容或一次显示页。`grep`\
  \ 和 `more` 可以与 `sort` 结合使用在管道中实现这一功能：\n\n```\ngrep foo /path/to/file | sort -n -k\
  \ 3 | more\n```\n\n这条流水线将在 `/path/to/file` 中搜索 `foo`。该命令的输出（`stdout`）将随后输入 `sort`\
  \ 命令的标准输入（`stdin`）。想象一根水软管，获取 `grep` 的输出并将其连接到 `sort` 的输入。`sort` 工具接收来自 `grep` 的过滤后的列表，并将排序后的结果输出到\
  \ `more` 的 `stdin`，由 `more` 读取这些经过过滤和排序的数据并对其进行分页显示。\n\n准确理解这里发生了什么是非常用的；这与人们直觉上假设的相反。首先，启动了\
  \ `more` 工具。它的输入连接到一个管道。然后启动了 `sort`，它的输出连接到该管道。创建了第二个管道，并将 `sort` 的 `stdin` 连接到该管道。接着运行\
  \ `grep`，将其 `stdout` 连接到连接其与 `sort` 进程的管道。\n\n当 `grep` 开始运行并输出数据时，这些数据会通过管道传递 `sort`，`sort`\
  \ 对输入进行排序并通过管道输出给 `more`，最后由 `more` 对整个过程进行分页。这可能会影响发生错误时的情况；如果你输错了“more”，那么什么都不会发生。如果你输错了“grep”，那么在检测到错误时，`more`\
  \ 和 `sort` 已经启动了。在这个示例中，这并不重要，但如果管道下游的命令具有某种持久性影响（例如，如果它们创建或修改了文件），那么系统状态已经发生改变，尽管整个管道从未被执行过。\n\
  \n## “一切皆文件”与管道\n\nUnix 中还发展出了几个关键概念。其中之一是著名的“一切皆文件”设计，通过这种设计，设备驱动程序、目录、系统配置、内核参数和进程都被表示为文件系统上的文件。一切，无论是纯文本文件（例如\
  \ `/etc/hosts`）、块或字符特殊设备驱动程序（例如 `/dev/sda`），还是内核状态和配置（例如 `/proc/cpuinfo`），都被表示为一个文件。\n\
  \n管道的存在导致了这样一个系统：工具的编写假设它们将处理处理文本流，而且事实上，系统的大部分配置也是文本形式的。配置文件可以进行排序、搜索、重新格式化，甚至进行区分和重新组合，而这些都可以使用现有的工具完成。\n\
  \n“一切皆文件”的概念以及文件提供的四种操作（`open`、`close`、`read`、`write`）意味着 Unix 提供了一个非常清晰、简单的系统设计。Shell\
  \ 脚本本身是另一个也是文本的系统实用程序。这意味着你可以编写这样的程序：\n\n```\n#!/bin/sh\ncat $0\necho \"===\"\n\
  tac $0\n```\n\n这段代码使用了 `cat` 功能（它简单地输出文件）和 `tac` 工具（它执行相同的操作但会反转顺序。因此，这个名字是对该工具功能的非常字面的解释，也是\
  \ Unix 幽默的典型典型例子）。变量 `$0` 是由系统定义的特殊变量，包含了当前运行程序的名称（即被调用时的名称）。\n\n因此，该命令的输出如下：\n\n\
  ```\n#!/bin/sh\ncat $0\necho \"===\"\ntac $0\n===\ntac $0\necho \"===\"\ncat $0\n\
  #!/bin/sh\n```\n\n前四行是 `cat` 的结果，第五行是 `echo` 语句的结果，最后四行是 `tac` 的输出。\n\n## BSD\n\n\
  AT&T/贝尔实验室（Bell Labs）无法销售 Unix，因为他们是一家电信垄断企业，因此被禁止扩展到其他行业（如计算领域）。因此，AT&T 将 Unix\
  \ 赠送了，特别是赠送给了大学，大学自然非常渴望免费获得一个操作系统。学校还能获得源代码，这一事实是一个额外的福利，不仅对管理员是如此，对学生也是如此。用户和管理员不仅可以运行操作系统，他们还可以查看（并修改）使其运行的代码。提供源代码的访问权限对\
  \ AT&T 来说是一个很容易的选择；他们（在那个阶段）并不感兴趣自己开发和支持它，通过这种方式用户可以自给自足。最终结果是许多大学毕业生带着 Unix 经验进入行业，因此当他们工作需要操作系统时，他们会建议使用\
  \ Unix。因此，Unix 的使用因为它在用户中广受欢迎（他们喜欢其简洁的设计）以及它偶然的分发方式而传播开。\n\n尽管 Unix 经常免费或低价提供并包含源代码，但根据自由软件基金（Free\
  \ Software Foundation）的定义，它并不是“自由软件”，因为定义关注的是自由而非成本。Unix 许可禁止向他人重新分发 Unix，尽管许多用户开发了自己的补丁，并且其中一些人还与其他\
  \ Unix 许可持有者共享了这些补丁（对于那些还没有从 AT&T 获取 Unix 许可的人来说，这些补丁是没用的。核心软件仍然是 Unix；任何补丁只是对它的修改）。加州大学伯克利分校的\
  \ BSD 软件发行（BSD）创建并分发了许多此类补丁，修复漏洞、添加功能并通上改进了 Unix。“自由软件”和“开源”这两个术语在很长一段时间内都不会出现，但这一切都是基于一种理解：如果某东西是有用的，那么就可以共享。TCP/IP（互联网的两个核心协议）通过\
  \ BSD 进入了 Unix，BIND（DNS 域名系统服务器）和 Sendmail MTA（邮件传输代理）也是如此。最终，BSD 为 Unix 开发了如此多的补丁，以至于该项目替换了几乎所有的原始\
  \ Unix 代码。在诉讼之后，AT&T 和 BSD 达成和解，并同意 BSD 中剩余的组件不再是 AT&T 的财产，可以独立分发。此以后，BSD 分出了 NetBSD、OpenBSD、FreeBSD\
  \ 和其他变体。\n\n## GNU\n\n如前所述，GNU 项目于 1983 年启动，旨在响应当时大多数计算机制造商随硬件分发的闭源软件。在此之前，通常有一个社区会在用户之间共享源代码，这样当任何人认为可以进行改进时，他们就可以修复代码以按自己的意运行。这并没有被记录在任何具有法律约束力的文件中；它只是开发者自然运行的文化。如果某人对某段软件感兴趣，为什么不给他一个副本（通常以源代码形式提供，以便他修改以在自己的系统上运行？当时很少有安装环境足够相似到可以假设在一个机器上编译的二进制文件可以在另一台机器上运行）。正如\
  \ Stallman 喜欢指出的那样，“软件共享……和计算机的历史一样，就像共享食谱和烹饪的历史一样。” ¹\n\nStallman 在 20 世纪 70 年代和\
  \ 80 年代初与 MIT 的其他开发人员一起开发了不兼容分时系统（ITS）。随着那一代硬件的淘汰，新的硬件问世了，而且随着行业正在开发和添加功能——这些新机器配备了定制的操作系统。当时的操作系统通常与硬件密切相关，因此\
  \ ITS 和 CTSS 随着它们运行的硬件被更新的设计取代而消失了。\n\n![note.ai](img/note_fmt.gif)\n\n\n\n\nITS\
  \ 是 `IBM’s Compatible Time Sharing System (CTSS)` 的一个双关语，后者在同一时期于 `MIT` 开发的。`CTSS`\
  \ 中的 “C” 强调了它与旧的 `IBM` 主机具有某种程度的兼容性。通过在名称中加入“Incompatible”（不兼容），ITS 为其这种反叛性的不兼容性感到自豪。\n\
  \n## GNU 的起源\n\nStallman 的转折点发生在他想要修复一个打印机驱动程序时，这样当打印机卡纸时（这经常发生），它会提醒提交任务的用户，以便她可以修复卡纸。然后，打印机就可以供其他人使用了。导致打印机卡纸的用户在问题解决之前无法获得输出结果，而提交了后续任务的用户则必须等待得更久。\n\
  \n提交打印任务后等待几个小时（那时的打印机要慢得多），结果发现在你提交自己的打印任务之前，打印机就已经停滞了，这种挫败感对于 `MIT` 的用户来说太难以忍受了，因此\
  \ Stallman 想要修复代码。他并没有预感到原开发者会为他开发这个特定的功能；他乐意自己进行修改，因此向开发者索要源代码副本。他被拒绝了，因为驱动程序软件包含了关于打印机工作原理的专利信息，这对于其他打印机制造商来说可能是有价值的竞争信息。\n\
  \n让 Stallman 反感的并不是功能本身，而是一个开发者拒绝与另一个开发者共享代码。这种态度对 Stallman 来说是陌生的，直到那个阶段，他一直认为代码共享是理所当然的。问题在于软件——特别是打印机驱动程序——不像\
  \ Stallman 之前过的操作系统那样自由（它没有传达同样的自由）。这个问题在整个行业中普遍存在；它并非针对某个特定的平台，因此更换硬件无法解决问题。\n\n\
  GNU 代表 “GNU’s Not Unix”（GNU 不是 Unix），这是一个递归缩写词；如果你展开缩写 `IBM`，你会得到 `International\
  \ Business Machines`，就结束了。如果你展开 `GNU`，你会得到 `GNU’s Not Unix’s Not Unix`。继续展开，你会得到\
  \ `GNU’s Not Unix’s Not Unix’s Not Unix`，以此此类推。这是“黑客幽默”的例子，通常是一种非常冷涩的幽默，带有一点聪明或不同寻常的色彩。在\
  \ `grep` 手册页的底部，“NOTES”章节下有一条注释：“GNU 并不是 Unix，但 Unix 是一头猛兽；它的复数形式是 Unixen，”这是对 Unix\
  \ 的友好调侃。\n\nRichard Stallman 是一个意志坚强的人（他形容自己为“边缘自闭症”），拥有非常有逻辑的头脑，他决定用他所唯一的方法解决这个问题：创建一个新的操作系统，以维护旧的未成文的自由，允许对系统的平等访问，包括使其运行的代码。由于当时并不存在这样的东西，他必须亲手编写。于是他就写了。\n\
  \n## 公告：免费 Unix！\n\n```\nFrom CSvax:pur-ee:inuxc!ixn5c!ihnp4!houxm!mhuxi!eagle!mit-vax!mit-eddie!RMS@MIT-OZ\n\
  Newsgroups: net.unix-wizards,net.usoft\nOrganization: MIT AI Lab, Cambridge, MA\n\
  From: RMS%MIT-OZ@mit-eddie\nSubject: new Unix implementation\nDate: Tue, 27-Sep-83\
  \ 12:35:59 EST\n```\n\n从这个感恩节开始，我将编写一个名为 `GNU`（代表 `Gnu’s Not Unix`）的完整 Unix 兼容软件系统，并免费送给每一个可以使用的人。非常需要时间、金钱、程序和设备的贡献。\n\
  \n首先，`GNU` 将是一个 `kernel`（内核）加上编写和运行 `C` 程序所需的所有工具：`editor`（编辑器）、`shell`（外壳）、`C`\
  \ 编译器、链接器、汇编器以及其他几项。之后，我们将添加一个文本格式化器、一个 `YACC`、一个帝国扩张游戏、一个电子表格以及数百种其他东西。我们希望最终能提供\
  \ `Unix` 系统通常带的所有有用工具，以及任何其他有用工具，包括在线和纸质文档。\n\n`GNU` 将能够运行 `Unix` 程序，但不会与 `Unix`\
  \ 完全相同。我们将根据对其他操作系统的经验，做出所有方便的改进。特别是，我们计划支持长文件名、文件版本号、防崩溃文件系统、可能还有文件名补全、终端无关显示支持，并最终实现基于\
  \ `Lisp` 的窗口系统，通过该系统，几个 `Lisp` 程序和普通的 `Unix` 程序可以共享屏幕。`C` 和 `Lisp` 都将作为系统编程语言可用。我们将基于\
  \ `MIT` 的 `chaosnet` 协议提供网络软件，远优于 `UUCP`。我们可能还有与 `UUCP` 兼容的东西。\n\n## 关于作者\n\n我是\
  \ Richard Stallman，最初被大量模仿的 `EMACS` 编辑器的发明者，目前在 `MIT` 的人工智能实验室。我在编译器、编辑器、调试器、命令解释器、ITS\
  \ 以及 Lisp 操作系统上做过大量工作。我在 `ITS` 中开创了终端无关显示支持。此外，我还为 Lisp 机器实现了一个防崩溃文件系统和两个窗口系统。\n\
  \n## 为什么我必须编写 GNU\n\n我认为黄金准则要求如果我喜欢一个程序，我必须把它分享给其他喜欢它的人。我无法心安理得地签署保密协议或软件许可协议。\n\
  \n为了让我能够在不违反原则的情况下继续使用计算机，我决定汇集足够的自由软件，以便我不需要任何非自由软件。\n\n## 你可以如何贡献\n\n我请求计算机制造商捐赠机器和金钱。我请求个人捐赠程序和工作。已经有一家计算机制造商提议提供一台机器。但我们需要更多。如果你捐赠机器，你可以预期的结果是\
  \ `GNU` 将早期在这些机器上运行。这些机器最好能够在居住区域运行，不需要复杂的冷却或电力。\n\n\n\nHURD 的意思是“替换 Unix 的守护进程群”（Unix-Replacing\
  \ Daemons），因为它的微内核方法使用了多个用户空间的后台进程（在 Unix 传统中被称为守护进程）来实现 Unix 内核在单体内核中完成的工作。`HIRD`\
  \ 反而代表“代表深度的接口群”（Herd of Interfaces Representing Depth）。这再次是一个递归缩写，类似于 `GNU`（“GNU\
  \ 不是 Unix”），但这次它是一对相互递归的缩写。它也是对“herd”（一群，Gnu 的集合名词）一词的双关语。\n\n由于不成文的共识失效，Stallman\
  \ 需要创造一种新方法来确保自由分发的软件保持这种状态。`GNU 通用公共许可证`（`GPL`）以一种典型的智能方式实现了这一点。`GPL` 利用版权来确保许可证本身不会被更改；许可证的其余部分规定，接收者对代码拥有完全权利，只要他向其分发代码的任何人授予相同的权利（无论是否经过修改），且许可保持不变。这样，所有开发者（以及用户）都处于一个平等的竞争环境中，代码实际上由所有参与者所有，但没有人可以更改许可，这确保了平等。软件的创建者可以在\
  \ `GPL` 和一种更严格的许可证下对其软件进行双重许可；这已经发生过多次——例如通过 `MySQL` 项目。\n\n`GNU` 项目承担的任务之一——当然——是编写一个自由软件\
  \ Shell 解释器。Brian Fox 编写了 `bash`（Bourne Again SHell）壳——它的名字源于原始的 `/bin/sh` 是 Steve\
  \ Bourne 编写的，被称为 `Bourne Shell`。由于 `bash` 汲取了 `Bourne shell` 的特性，并也添加了新特性，`bash`\
  \ 显然是“再次出 Bourne Shell”（Bourne Again Shell）。Brian 还编写了 `readline` 实用程序，它可以在提交文本行进行解析之前对输入行进行灵活编辑。这可能是让\
  \ `bash` 成为一个优秀交互式 shell 最重要的特征。Brian Fox 是`自由软件基金会`的第一名员工，该实体是为了协调 `GNU` 项目而成立的。\n\
  \n![note.ai](img/note_fmt.gif)\n\n你可能已经发现了规律；虽然 `bash` 不是递归缩写，但它的名字是对它基于 `Bourne\
  \ shell` 这一事实的双关。它还暗示了 `bash` 是原始 `Bourne shell` 的改进，因为它被“再次诞生”（bourne again）。\n\
  \n## Linux\n\nLinus Torvalds 是一位芬兰大学学生，他当时在使用 `Minix`，这是一个由阿姆斯特丹自由大学的师 Andrew Tanenbaum\
  \ 编写的简单 Unix 克隆系统，但 Torvalds 对其缺乏功能以及未能充分利用（当时相当新的）`Intel 80386` 处理器感到沮丧，特别是它的“保护模式”，这允许内核和用户空间之间有更好的分离。很快，他获得了一个可以工作的\
  \ shell，然后让 `GCC`（`GNU C 编译器`，现在称为 `GNU 编译器集`，因为它已扩展到编译各种版本的 `C`、`Fortran`、`Java`\
  \ 和 `Ada`）运行。在该阶段，内核加 shell 加编译器就足够“自引导”系统了——它可以被用来构建自身的副本。\n\n### Torvalds 的新闻组帖子\n\
  \n1991 年 8 月 25 日，Torvalds 在 `MINIX` 新闻组 `comp.os.minix` 上发布了以下内容：\n\n```\nFrom:\
  \ torvalds@klaava.helsinki.fi (Linus Benedict Torvalds) To: Newsgroups: comp.os.minix\
  \ Subject: 你最想在 minix 中看到什么？ Summary: 针对我新操作系统的小调查\n\n各位使用 minix 的朋友大家好：\n\n我正在为\
  \ 386 (486) AT 兼容机编写一个（业爱好，不会像 gnu 那样庞大和专业的）（免费）操作系统系统。这从四月就开始酝酿了，现在开始准备就绪。我想就人们对\
  \ minix 中喜欢/不喜欢的事物获得任何反馈，因为我的操作系统在某些方面与它相似（出于实际考虑，文件系统的物理布局也相同）。\n\n我目前已经移植了 bash\
  \ (1.08) 和 gcc (1.40)，它们看起来运行得良好。这意味着我将在几个月内得到一些实用的东西，我想知道大多数人最想要哪些功能。\n\n欢迎任何建议，但我不保证会实现它们\
  \ :-)\n\nLinus Torvalds torvalds@kruuna.helsinki.fi\n```\n\n有趣的是，Torvalds 认为 `GNU`\
  \ 项目的成功是理所当然的；该项目已经运行了八年，并且基本上实现了大部分目标（内核除外）。Torvalds 在最初犯了尝试编写自己许可证的错误后（对于我们这些不是国际知识产权法应用细节专家的人来说，这通常是不建议的），将内核许可在\
  \ `GNU GPL`（第 2 版）下作为该项目的自然许可。\n\n在实践中，这本书更多是关于使用 `Unix` 和 `GNU` 工具进行 shell 脚本，而不是专门关于\
  \ `Linux` 内核下的 shell 脚本；总来说，提到的大多数工具都是来自自由软件基金会的 `GNU` 工具：`grep`、`ls`、`find`、`less`、`sed`、`awk`、当然还有\
  \ `bash` 本身、`diff`、`basename` 和 `dirname`；Linux 上 shell 脚本的大多数命令都是 `GNU` 工具。因此，有些人倾向于使用“GNU/Linux”一词来描述\
  \ `GNU` 用户空间加 `Linux` 内核的组合。对于这本书来说，目标是在保持技术准确的同时避免过度的政治狂热。`RedHat Linux` 是 `RedHat`\
  \ 对其发行版的称呼，因此被称为 `RedHat Linux`。`Debian GNU/Linux` 倾向于承认 `GNU` 内容，所以当我们专门提到 `Debian`\
  \ 时也会这样做。当谈到 `Linux` 内核时，我们会说“Linux”；谈到 `GNU` 工具时，我们会这样命名。渴望头条的记者偶尔会构思出一个比社区中实际存在的要得分歧。像任何大家庭一样，它也有自己的分歧——通常是大声且公开的——但我们将尝试在这里不煽风火。\n\
  \n![note.ai](img/note_fmt.gif)\n\n`Unix` 的设计假设是由工程师操作的；如果有人想通过它实现任何目标，他或她就会准备学习系统如何工作以及如何操作它。整体设计的优雅简单（“一切皆文件”、“只做一件事并做好”等）意味着在系统某部分学到的原理可以应用于其他部分。\n\
  \n`GNU/Linux` 系统的兴起，特别是它们在桌面级电脑和笔记本系统上相对广泛的使用——而不仅仅是在黑暗数据中心里独自嗡嗡运行的服务器——为基于这一共同哲学的一系列工具带来了新一代用户，但并不一定将历史背景纳入考虑。\n\
  \n`Microsoft Windows` 有非常不同的哲学：终端用户不需要担心底层系统如何工作，结果是由于软件的闭源许可，他们不应期望即使对经验丰富的专业人士来说也是可识别的。这不是质量甚至数量上的差异；这是一个不同的方法，它假设了一个层级结构，其中开发者知道一切，而用户什么都不需要知道。\n\
  \n结果，许多丰富的 Windows 用户查看了 `GNU/Linux` 发行版，并令他们失望发现发现为了按照“显然”应该这样做的方式进行配置，他们必须手动编辑文本文件，或指定某个参数。这种灵活性实际上是该系统的优势，而不是弱点。在\
  \ `Windows` 模型中，用户不需要学习，因为他们被允许做出任何重要的决定：哪种内核调度器、哪种文件系统、哪个窗口管理器。这些决定都由开发者做到了“通用适用”的水平。\n\
  \n## 总结\n\n\n\n\n\n虽然在不了解其历史的情况下对 GNU/Linux 系统进行管理和编写 shell 脚本是完全可能的，但如果不了解某些事物是如何演变成如今的，许多显而易见的特性将难以理解。为典型的\
  \ Linux 发行版（如 `RedHat`、`SuSE` 或 `Ubuntu`）编写脚本与为嵌入式设备编写脚本是有区别的，后者运行的更有可能是 `busybox`\
  \ 而不是完整的 GNU 工具集。为商业 Unix 编写脚本又略有不同；就像 Web 开发者必须小心确保网站在多个平台、多个浏览器上都能正常工作一样，编写稳健的跨平台\
  \ shell 脚本也需要一定程度的测试。\n\n即使为典型的 Linux 发行版编写代码，了解文件位于何处以及是如何出现在那里的也是很有用的。是否存在 `/etc/sysconfig`？init\
  \ 脚本是在 `/etc/rc.d/init.d` 还是 `/etc/init.d` 中，或者它们是否根本以这种形式存在？可以识别哪些特征来判断该特定发行版遵循的是什么传统？了解系统的历史有助于人们理解语法应该是\
  \ `tar xzf` 还是 `tar -xzf`；应该使用 `/etc/fstab` 还是 `/etc/vfstab`；运行 `killall httpd`\
  \ 是只会停止你的 Apache 进程（如在 GNU/Linux 下那样），还是会停止整个系统（如在 Solaris 上那样）！\n\n下一章将延续这段错综复杂的历史，比较在选择\
  \ Unix 或 GNU/Linux 环境时可提供的各种选择。\n\n自由软件，自由社会, 2002, 第 1 章。ISBN 1-882114-98-1\n\n\
  # 第 2 章：入门\n\n在学习并测试书中的代码之前，你需要运行某种类 Unix 环境。由于你正在阅读这本书，你很可能已经访问了 Unix 或 Linux 系统，但本章提供了某些可用选择的概述、如何获取它们，以及如何让你的测试环境运行起来。在处理书中的代码时，考虑运行虚拟机，或者至少在你现有的系统上创建一个独立的账户，可能也是值得考虑的。\n\
  \n尽管 GNU/Linux 和 Bash shell 可能是目前最常用的操作系统和 shell 组合，且该组合是本书的重点，但还有许多其他操作系统可用，以及各种\
  \ shell。对于 shell 脚本编写来说，操作系统的选择在大多数情况下没有太大区别，因此本章更多地关注操作系统和编辑器的选择。\n\n## 选择操作系统\n\
  \n首先，值得提到 Linux 并不是唯一的选择；其他免费的操作系统包括 `BSDs`（`FreeBSD`、`NetBSD`、`OpenBSD`）、`Solaris\
  \ Express`、`Nexenta` 等。然而，有许多 GNU/Linux 发行版，这些版本通常支持最广泛的硬件和软件。这些发行版大部分可以完全合法地下载和使用，即使用于生产环境。在提到的\
  \ Linux 发行版中，`RedHat Enterprise Linux` (`RHEL`) 和 `SuSE Linux Enterprise Server`\
  \ (`SLES`) 的可用性和更新受到限制；`Oracle Solaris` 的生产用途仅限于 90 天试用期。\n\n### GNU/Linux\n\n###\
  \ RHEL\n`RHEL` 是基于 `Fedora` 的商业发行版。它在北美和欧洲大部分地区非常流行。由于 `RHEL` 媒体包含了 `RedHat` 商标和一些非自由软件（如\
  \ `RedHat Cluster`），该媒体的分发仅限于授权客户。然而，`CentOS` 项目从源码重新构建 `RHEL`，移除了 `RedHat` 商标，提供了一个与\
  \ `RHEL` 在二进制和源码上完全兼容的 Linux 发行版。这非常有用，因为许多 Linux 商业软件只在 `RHEL` 上进行测试和支持，但这些供应商通常也支持在\
  \ `CentOS` 上运行应用程序，即使他们不支持该操作系统本身。\n\n`RHEL` 本身仅通过付费订阅提供。然而，`CentOS` 和 `Oracle Enterprise\
  \ Linux` 是两个克隆版本，通过从源码中删除 `RedHat` 商标并以与 `RedHat` 二进制文件完全相同的方式重新构建。`CentOS` 可以 [`centos.org/`](http://centos.org/)\
  \ 获取，`Oracle Enterprise Linux` 可以 [`edelivery.oracle.com/linux`](http://edelivery.oracle.com/linux)\
  \ 获取。\n\n### Fedora\n`Fedora` 是由社区维护的向 `RHEL` 反馈的发行版。它拥有非常活跃且通常极具技术的用户群，许多开发首先在\
  \ `Fedora` 中进行测试，然后推送到上游（到相关项目，无论是 `GNOME`、`KDE`、Linux 内核等）。与 `Ubuntu` 一样，它每六个月发布一次，但支持周期要短得多。在\
  \ `Fedora` 中被证明的技术会进入 `RedHat Enterprise Linux`。与 `Ubuntu` 一样，也有 `KDE`、`XFCE` 和\
  \ `LXDE` 的重编译版本以及主基于 `GNOME` 的桌面。DVD 镜像可以从 [`fedoraproject.org/`](http://fedoraproject.org/)\
  \ 获取。\n\n### SLES\n`SLES` 是 Novell 的企业 Linux。它基于社区版的 `OpenSUSE`。`SLES` 和 `OpenSUSE`\
  \ 在欧洲特别受欢迎，部分原因是由于 `SuSE` 在 2004 年被收购之前是一家德国公司。`SuSE` 与其他 Linux 发行版最大的区别在于其 `YaST2`\
  \ 配置工具。`SLES` 有相当稳定的发布周期；每 2-3 年发布一个大版本，更新频率比 `RHEL` 高，但比大多数其他 Linux 发行版低。\n\n`SLES`\
  \ 可用于评估，从 [`www.novell.com/products/server/`](http://www.novell.com/products/server/)\
  \ 获取。就像 RedHat Linux 一，完整版本需要支持合同。\n\n### OpenSUSE\n`OpenSUSE` 之于 `SLES` 就像 `Fedora`\
  \ 之于 `RHEL` —— 一个可能不太稳定但更关注社区的尖端版本。在正式发布之前提供测试版本。`OpenSUSE` 可以从 [`software.opensuse.org/`](http://software.opensuse.org/)\
  \ 获取。OpenSUSE 主网站是 [`www.opensuse.org/`](http://www.opensuse.org/)。\n\n### Ubuntu\n\
  `Ubuntu` 基于 `Debian` 的“测试”分支，具有额外的功能和定制。它非常容易安装和配置，有很多论坛提供支持，是一个完善的 GNU/Linux 发行版。`Ubuntu`\
  \ 每两年发布一次长期支持 (`LTS`) 版本，桌面版支持 2 年，服务器版支持 5 年。此外每六个月发布一次常规版本，以 YY-MM 命名，因此 10-10\
  \ 版本（`Lucid Lynx`）于 2010 年 10 月发布。尽管以桌面操作系统而闻名，但没有图形功能的服务器版本越来越受欢迎。\n\n`Ubuntu`\
  \ 可以通过多种方式安装 —— 从 CD/DVD、USB 闪盘甚至从现有的 Windows 安装。指令和免费下载的媒体及种子文件从 [`ubuntu.com/`](http://ubuntu.com/)\
  \ 获取。还有许多 `Ubuntu` 的重编译版本：使用 `KDE` 代替 `GNOME` 的 `ubuntu`，使用 `XFCE` 窗口器的 `Xubuntu`，以及包含教育软件的\
  \ Edubuntu 以及为笔记本电脑定制的 Netbook Edition。\n\n### Debian\n`Debian` 是主流使用的较旧 GNU/Linux\
  \ 发行版之一。它拥有超过 1000 名 Debian 开发者的团队，提供了超过 30000 个软件包。稳定分支通常每 5 年发布一次，因此当前的稳定版可能相当老，尽管有增加稳定发布频率的计划。测试分支深受许多用户的欢迎，提供了最新的软件包，但没有不稳定分支那样的不可预测性。Debian\
  \ CD/DVD 镜像可以直接下载，或通过 BitTorrent 从 [www.debian.org/CD/](http://www.debian.org/CD/)\
  \ 获取。\n\n\n\n\n\n有数百个 GNU/Linux 发行版可用。[`distrowatch.com/`](http://distrowatch.com/)\
  \ 网站是一个极好的资源，包含了几乎所有存在的发行版以及其他 Unix 和类 Unixget 的信息。其他一些值得关注的流行发行版包括 Gentoo、Damn\
  \ Small Linux、Knoppix、Slackware 和 Mandriva。\n\n## BSD 系列\n\n伯克利软件发行（Berkeley Software\
  \ Distribution，简称 `BSD`）是最老的 Unix 变体之一。它已经分裂成许多不同的版本，这里列出了其中主要的三个。每个 `BSD` 变体都有不同的侧重点，这决定了它们的开发风格。\n\
  \n`FreeBSD` 可能是 BSD 中最容易获取的，支持更广泛的硬件。`OpenBSD` 是 `NetBSD` 的分支，通常被认为是可用最安全的 Unix\
  \ 系统，尽管它的开发速度通常较慢，但生成的系统极其稳定且安全。`OpenBSD` 被广泛用作路由器或防火墙。对于 2011 年 5 月发布的 4.9 版本，在\
  \ `OpenBSD` 的默认安装中仅发现过两个可远程利用的安全漏洞。而有些操作系统在一个月内就能发现许多个。\n\n`NetBSD` 是 BSD 中可移植性最好的，运行在\
  \ PC、Alpha 和 PowerPC 以及 ARM、`HPPA`、`SPARC/SPARC64`、Vax 等许多平台上。\n\n## 专有 Unix\n\n\
  `Oracle Solaris` 源可追溯到 1983 年，可以说它是目前市场上功能最全、开发最活跃的企业操作系统。`SunOS` 最初基于 `BSD`，但在转向\
  \ `Solaris` 时切换到了 System V 的 Unix 变体。现在的 `Solaris` 原始的 Bourne shell 作为 `/bin/sh`，以及\
  \ `ksh93`、`bash`、`csh`、`tcsh` 和 `zsh` shell。`Solaris` 支持 `SPARC` 和 `x86` 架构。\n\n\
  可以在 [`www.oracle.com/technetwork/server-storage/solaris/downloads/index.html`](http://www.oracle.com/technetwork/server-storage/solaris/downloads/index.html)\
  \ 下载 `Oracle Solaris`，它可以在非生产环境下免费使用，或以 90 天试用期的形式使用。`Solaris Express` 是目前开发中的 `Solaris`\
  \ 版本的技术预览。还有 `OpenIndiana`，它是 `OpenSolaris` 的一个分支，可以在 [`openindiana.org/`](http://openindiana.org/)\
  \ 获取，以及 `Nexenta`，另一个带有 GNU 用户空间的分支，可以在 [`nexenta.org/`](http://nexenta.org/) 获取。\n\
  \n`IBM AIX` 是 IBM 针对 `Power` 架构开发的 Unix，基于 System V Unix。它提供 `Express` 版本（限制为四个\
  \ CPU 核心和 8GB RAM）、`Standard Edition` 版（不具备扩展性限制）以及 `Enterprise Edition` 版（增加了额外的监控工具和功能）。在编写本文时，当前版本是\
  \ `AIX 7.1`，于 2010 年 9 月发布。\n\n`HP-UX` 是 HP 的 Unix 产品，基于 System V Unix。它运行在 `PA-RISC`\
  \ 和 Intel `Itanium` 系统上。在编写本文时，`HP-UX` 的当前版本是 `11iv3`，于 2008 年 4 月发布。\n\n## 微软 Windows\n\
  \n`Cygwin` 是一个在微软 Windows 下运行的环境，为你提供了一套相当全面的 GNU 工具。如果你无法切换到原生使用 shell 的操作系统，`cygwin`\
  \ 是在不离开 Windows 的情况下获取功能完整的 `bash` shell 和核心实用程序（`ls`、`dd`、`cat` ——你在 GNU/Linux\
  \ 发行版中预期的几乎所有）的方便方法。这意味着你的 `grep`、`sed`、`awk` 和 `sort` 等 GNU 工具的工作方式与在 Linux 下完全一致。注意\
  \ `cygwin` 并不是模拟器——它提供了一个 Windows DLL（`cygwin1.dll`）和一组编译为微软 Windows 可执行文件（`.exe`）的（主要是\
  \ GNU）实用程序。这些程序在 Windows 下原生运行；没有任何是模拟的。图 2-1 显示了 `cygwin` 的用法。注意某些二进制文件命名使用了 Microsoft\
  \ DOS 和 Windows 使用的 `.exe` 扩展名。\n\n图 2-1\n\n![f0201.tif](img/f0201_fmt.jpg)\n\n\
  `Cygwin` 可从 [`www.cygwin.com/`](http://www.cygwin.com/) 获取。\n\n## 选择编辑器\n\n在之前提到的大多数操作系统中都提供了各种文本编辑器。文字处理软件（如\
  \ `OpenOffice.org`、`Abiword` 或 `Microsoft Word`）并不适用于编程，因为这些程序经常会对文本进行修改，例如拼写检查、大小写转换、格式化等，这可能会以意想不到的方式破坏脚本。使用纯文本编辑器要好得多，你在这里将看到最常见的编辑器。仅仅因为它们没有向实际文件添加格式，并不意味着这些编辑器完全缺乏强大的功能；大多数编辑器提供语法高亮，许多编辑器还为编辑\
  \ shell 脚本以及其他文本提供了更多有用功能。\n\n## 图形化文本编辑器\n\n对于图形界面环境，基于 GUI 的编辑器可能更好用。\n\n### Gedit\n\
  \nGNOME 默认文本编辑器是 `gedit`。它提供了基础语法高亮。图 2-2 显示了 `gedit` 的用法。\n\n图 2-2\n\n![f0202.tif](img/f0202_fmt.jpg)\n\
  \n### Kate\n\nKDE 默认文本编辑器是 `kate`。它提供了语法高亮、多标签页等功能。图 2-3 显示了 `kate` 正在运行。\n\n图 2-3\n\
  \n![f0203.tif](img/f0203_fmt.jpg)\n\n### Kwrite\n\n`kwrite` 也是 KDE 的一部分，尽管 `kwrite`\
  \ 更倾向于编写文档而非代码。\n\n作为硬核命令行工具 `vi`（在大多数 Linux 发行版中作为 `VIM` [Vi Improved] 提供）的图形化替代方案是\
  \ `gvim`。这是一个实用的折中方案，提供了一些图形化功能（看起来与 gedit 几乎一样），同时保留了 `vi` 和 `vim` 熟悉的按键。图 2-4\
  \ 显示了 `gvim` 的用法，有两个标签正在编辑不同的脚本。\n\n图 2-4\n\n![f0204.tif](img/f0204_fmt.jpg)\n\n\
  ### Eclipse\n\n`Eclipse` 是 IBM 的一个完整 IDE（集成开发环境）。它是针对 Java 开发设计的，但也可以用于 shell 脚本。然而，对于大多数\
  \ shell 编程任务来说，它过了。\n\n### Windows 版 Notepad++\n\n`Notepad++` ([`notepad-plus-plus.org/`](http://notepad-plus-plus.org/))\
  \ 是微软 Windows 环境的一个非常强大的 GPL（自由软件）编辑器。它为许多语言提供语法高亮、强大的搜索选项，并通过插件体系提供许多额外功能。它在 Windows\
  \ 环境中作为轻量级但全功能的文本编辑器非常受欢迎。图 2-5 显示了带有原生 Windows 窗口装饰框的 `Notepad++`。\n\n图 2-5\n\n\
  ![f0205.tif](img/f0205_fmt.jpg)\n\n\n\n\nGNOME 拥有 `gnome-terminal`；KDE 拥有 `konsole`。XFCE\
  \ 有一个简单称为“Terminal”的终端模拟器，其目标是成为不依赖 GNOME 依赖的 `gnome-terminal` 的良好替代方案。此外还有 `xterm`、`rxvt`\
  \ 等。原生的“linux”终端模拟器，这是你在没有登录图形会话的情况下登录 Linux 系统时所看到的界面。\n\n`gnome-terminal` 是 GNOME\
  \ 环境下的默认终端。它使用配置文件（profiles），因此你可以为不同的目的定义不同的外观设置。它还使用了标签页（tabs），标签可以打乱顺序，甚至从原始窗口中分离。\n\
  \n`Konsole` 是 KDE 环境中默认且非常灵活的终端模拟器。它可以在系统菜单下找到。`Konsole` 的一些特别好用的功能包括：当终端静默持续 10\
  \ 全秒时（例如，当一个长时间运行的任务完成向终端写入数据时），或者静默结束时（例如，当长时间运行的任务结束静默并开始向终端写入数据时），可以获取 KDE 的弹出警提醒。\n\
  \n另一个突出的功能是，通过配置设置，定义当你双击一个词时什么构成一个“单词”。如果你希望通过双击来选择整个电子邮件地址，请确保 @ 符号（@`）和点（`.`）在列表中；如果你希望通过双击\
  \ $100 并仅选择数字，请确保 `$` 不在列表中。\n\n如果你需要在一组系统上运行相同的命令，可以在不同的标签页中登录每台服务器，然后选择“编辑（Edit）⇒\
  \ 复制输入到（Copy Input To）⇒ 当前窗口中的所有标签页（All tabs in current window）”。完成后别忘记取消此选择。\n\n\
  图形会话的原始终端模拟器是 `xterm`。虽然它现在不再常见，但对于那些在没有完整图形环境的情况下来说，熟悉 `xterm` 是非常有值的。\n\n当你登录到一个没有图形能力的\
  \ Linux 系统，或者通过按下 Ctrl+Alt+F1 时，你会获得原生的 Linux 终端模拟器。这是基础终端模拟器，是实际 Linux 操作系统的一部分。它支持颜色以及高亮和闪烁的文本。\n\
  \n## 非图形化文本编辑器\n\n还有许多基于命令行的文本编辑器，每个都有不同的优处。\n\n### Vi\n`Vi` 迄今为止是系统管理员中最广泛使用的文本编辑器\
  \ —— 它的初始学习曲线非常陡峭，主要是因为可以在两种不同的模式下运行——插入模式（insert mode，你可以像在普通编辑器中一样输入文本）和命令模式（command\
  \ mode，你的按键被解释为在文本上执行的命令）——而且很难判断你当前处于哪种模式。关于模式，你真正需要知道的是按下 `Escape` 进入命令模式，在命令模式下按下\
  \ `i` 进入插入模式。按下 `Escape` 总是会让你进入命令模式，所以 `Escape+i` 总是会让你进入插入模式。一旦你掌握了这些技巧，并学会了 `vi`\
  \ 许多强大命令中的前几个，相比之下，其他编辑器就会显得缓慢、笨拙且繁琐。虽然 `vi` 是 Unix 的一部分，但大多数 GNU/Linux 发行版都包含了\
  \ `vim`（增强版 Vi），并将 `vi` 作为 `vim` 的别名。`Vim` 提供了对 `vi` 的兼容性，以及额外的功能。`Vim` 自带了一个 `vimtutor`\
  \ 脚本，它通过其许多示例引导你完成教程。图 2-6 显示了 `vimtutor` 教程的第一页。\n\n图 2-6\n\n![f0206.tif](img/f0206.tif)\n\
  \n### Emacs\n`Emacs` 是另一种流行的文本编辑器，它拥有大量的插件。`Emacs` 作为一个文本处理器，与 `vim` 一样，从 Unix 开始的，它是控制式的，但现在有了图形版本。`Emacs`\
  \ 像 `vim` 的兼容，，额外额外。。`vim`` 一个 `vim，，，，，，。。。。。在 Ubuntu  `，， ` ``` `    ，，，，，，，，，，，，，，，，，\
  \ `      的。。图 2-6\n\n图 2-6\n\n![f0206.tif](img/f0206.tif)\n\n\n\n\n你可以通过设置 `PATH`\
  \ 环境变量来告诉 shell 在哪里搜索要运行的程序（以及脚本）。主要的系统命令位于 `/bin`、`/usr/bin`、`/sbin` 和 `/usr/sbin`，但你可能在\
  \ `$HOME/bin`、$HOME/scripts`、`/usr/local/bin` 或其他地方有自己的脚本。将这些路径添加到 `PATH` 中，这样即使你不在该目录，shell\
  \ 也能找到它们：\n\n```\nPATH=${PATH}:${HOME}/bin\n```\n\n如果没有 `PATH`，你将为命令提供显式路径（绝对路径或相对路径）。例如：\n\
  \n```\n$ myscript.sh\nbash: myscript.sh: command not found\n$ /home/steve/bin/myscript.sh\n\
  \  ... 或者：\n$ cd /home/steve/bin\n$ ./myscript.sh\n```\n\n从安全角度来看，在 `PATH` 中放置点（`.`）是一种非常糟糕的习惯，尤其是在\
  \ `PATH` 的开头。如果你进入一个目录并运行命令（可能是 `ls`），该目录中任何命名为 `ls` 的程序都将被执行，而不是系统的 `/bin/ls` 程序。避免在\
  \ `PATH` 的开头或结尾出现冒号，或者在两个冒号之间留空，因为效果与点（`.`）相同。此外，最好将系统目录（如 `/usr/bin` 和 `/bin`）放在\
  \ `PATH` 的开头，这样本地脚本就不会覆盖系统默认脚本。因此，请使用以下语法\n\n```\nPATH=$PATH:${HOME}/bin\n```\n\n\
  而不是：\n\n```\nPATH=${HOME}/bin:$PATH\n```\n\n## 工具特定变量\n\n许多系统工具都有自己的变量；`less` 会将\
  \ `$LESS` 的值添加到其命令中。`ls` 会添加 `$LS_OPTIONS`。因此，你可以通过设置这些环境变量来定义有用的快捷方式。\n\n```\n\
  ## 定义工具特定的设置\nexport LS_OPTIONS='--color=yes'\n## 整理 less 的显示外观\nexport LESS='-X'\n\
  ```\n\n`less` 还会读取 `$LESS_TERMCAP_*` 变量，这些变量告诉它终端的能力。这是一个非常有用的序列，意味着隐藏在 man 页面中（由\
  \ `less` 格式化）的代码会被解释为颜色变化。\n\n![download.eps](img/download_fmt.gif)\n\n```\n## 彩色的\
  \ man 页面\nexport LESS_TERMCAP_mb=$'\\E01;31m'\nexport LESS_TERMCAP_md=$'\\E[01;31m'\n\
  export LESS_TERMCAP_me=$'\\E[0m'\nexport LESS_TERMCAP_se=$'\\E[0m'\nexport LESS_TERMCAP_so=$'\\\
  E[01;44;33m'\nexport LESS_TERMCAP_ue=$'\\E[0m'\nexport LESS_TERMCAP_us=$'\\E[01;32m'\n\
  ```\n\n### 变量\n\n还有一些广泛认可的变量可以被许多其他工具，以便系统灵活适应你的需求。你可以指定想要使用的文本编辑器，某些工具（如 `mail`）可以使用该值。你还可以指定你喜欢的分页工具——`less`\
  \ 和 `more` 是最常用的两种。\n\n```\n## 定义首选工具\nexport EDITOR=vim\nexport PAGER=less\n```\n\
  \n你自己的脚本可以使用这些变量来对用户更加灵活。只需使用 `${EDITOR:-vim}` 语法，这样如果设置了 `$EDITOR` 则将使用该命令；如果未设置，你可以为你的应用程序提供默认值：\n\
  \n![download.eps```bash#!/bin/bash${EDITOR:-vim} \"$1\"echo \"感谢编辑文件。内容如下：\"${PAGER:-less}\
  \ \"$1\"```#### `edit.sh`该脚本将用你首选的 `$EDITOR` 编辑文件，然后用你首选的 `$PAGER 将其显示给你。## 别名 (Aliases)别名为经常使用或难以记忆的命令提供了助记符。当命令没有使用配置文件或环境变量来指定默认选项集时，别名也很有用。你可以将这些别名放入你的启动脚本中，让日常输入变得更简单。###\
  \ less`less` 有一个 `-X` 选项，它可以阻止在完成后完成后刷新屏幕。这在很大程度上取决于个人喜好；如果你想 `less` 一个文件，然后在文件内容仍在终端中可见的情况下继续工作，你将希望使用\
  \ `-X` 来停止屏幕刷新（就像你对文件使用 `cat` 一样——命令完成后内容仍然可见）。然而，如果你想看到调用 `less` 之前显示在终端的内容，你就不想要\
  \ `-X` 选项。尝试这两种方法看看你喜欢哪种。如果你想使用 `-X`，可以在你的 `~/.bashrc` 文件中设置别名。```alias less=\"\
  less -X\"```由于 `less` 命令从前面提到的 `$LESS` 环境变量获取参数，你可以设置该变量。### cp, rm 和 mv 别名由于它们是\
  \ RedHat Enterprise Linux 的二进制兼容副本，某些 Linux 发行版——特别是 RedHat，因此 CentOS 和 Oracle Enterprise\
  \ Linux——为 `cp`、`rm` 和 `mv` 命令定义了一些非常谨慎的别名。它们都被别名为 `-i` 选项，这会导致它们在交互式 shell 中在删除或覆盖文件之前提示确认。这可以是一个非常有用的安全功能，但很快就会变得令人厌烦。如果你觉得默认设置很讨厌，可以在\
  \ `~/.bashrc` 中取消这些别名。命令 `unalias rm` 会移除此别名，同样 `unalias cp` 和 `unalias mv` 也会将这些命令恢复为标准行为。![note.ai](img/note_fmt.gif)\n\
  \n如果你知道某个命令（如 `rm`）设置了别名，可以通过两种方式访问未别名的版本。如果你知道命令的完整路径是 `/bin/rm`，你可以输入 `/bin/rm`，这将绕过别名定义。更简单的方法是在命令前加一个反斜杠；`\\\
  rm` 将调用未别名的 `rm` 命令。\n\n### ls 别名\n\n由于它是一个非常常用的命令，有一些流行的 `ls` 别名，其中最常用的是用于 `ls\
  \ -l` 的 `ll` 和用于 `ls -a` 的 `la`。你的发行版甚至可能为你设置了这些。一些流行的 `ls` 别名包括：\n\n```\n## 保存手指\n\
  alias l='ls'\n## 长列表 ls\nalias ll='ls -l'\n## 颜色和文件类型\nalias lf='ls -CF'\n## 按扩展名排序\n\
  alias lx='ls -XB'\n## 按大小排序\nalias lk='ls -Sr'\n## 显示隐藏文件\nalias la='ls -A'\n##\
  \ 按日期排序\nalias lt='ls -ltr'\n```\n\n### 其他命令快捷方式\n\n还有许多你可能频繁使用并想要定义别名的其他命令。在图形会话中，你可以启动浏览器并直接引导到特定的网站。\n\
  \n```\n## 从终端启动网页\nalias bbc='firefox http://www.bbc.co.uk/'\nalias sd='firefox\
  \ http://slashdot.org/'\nalias www='firefox'\n```\n\n另一个经常使用的命令是 `ssh`。有时这只是 `ssh\
  \ hostname`，但有时 `ssh` 会使用复杂的命令行，在这种情况下别名再次非常有用。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\n## 通过输入名称 ssh 到常用目的地\n## 登录 Declan\nalias declan='ssh declan'\n## 使用非标准端口\
  \ (222) 登录工作\nalias work='ssh work.example.com -p 222'\n## 登录工作并将内部代理隧道到 localhost:80\n\
  alias workweb='ssh work.example.com -p 222 -L 80:proxy.example.com:8080'\n```\n\n\
  ### 修改历史记录\n\n另一个可以在个性化设置中更改 shell 功能是 `historyhistory 命令。它受某些环境变量和某些 shell 选项 (`shopt`)\
  \ 的影响。当你同时打开多个 shell 窗口或从不同系统为同一用户登录多个话时，历史功能记录命令的方式可能会变得复杂，某些历史事件可能会被新的覆盖。你可以设置\
  \ `histappend` 选项来防止这种情况的发生。\n\n历史记录的另一个潜在问题是，如果你没有足够的磁盘配额，它可能会占用大量的磁盘空间。`HISTSIZE`\
  \ 变量定义了 shell 会话应在历史文件中存储多少条目；`HISTFILESIZE` 定义了历史文件的最大总大小。\n\n\n\n\n\n`HISTIGNORE`\
  \ 是一个用冒号分隔的命令列表，这些命令不会被存储在历史记录中；这些通常是常见的命令，如 `ls`，它们对审计来说通常没有太大价值。从审计的角度来看，保留 `rm`、`ssh`\
  \ 和 `scp` 等命令更有用。此外，`HISTCONTROL` 可以让历史记录忽略开头的空格（这样这两个命令都会被存储为 `rm` 而不是“  rm”（命令前带有前导空格）：\n\
  \n```\n $ rm /etc/hosts\n$   rm /etc/hosts\n```\n\n`HISTCONTROL` 还可以被设置为忽略重复项，因此如果一个命令被运行了多次，那么在历史文件中存储该信息可能没有多大意义。`HISTCONTROL`\
  \ 可以设置为 `ignorespace`（忽略空格）、`ignoredups`（忽略重复）或 `ignoreboth`（两者都忽略）。你的 `~/.bashrc`\
  \ 中的历史部分可能像如下所示：\n\n![download.eps](img/download_fmt.gif)\n\n```\n## append（追加）历史记录，而不是覆盖历史记录\n\
  shopt -s histappend\n## 控制历史文件的大小\nexport HISTSIZE=100000\nexport HISTFILESIZE=409600\n\
  ## 忽略常用命令\nexport HISTIGNORE=\":pwd:id:uptime:resize:ls:clear:history:\"\n## 忽略重复条\n\
  export HISTCONTROL=ignoredups\n```\n\n### history\n\n### `~/.inputrc` 和 `/etc/inputrc`\n\
  \n`/etc/inputrc` 和 `~/.inputrc` 用于 GNU `readline` 机制（`bash` 和许多其他工具使用它从终端读取一行文本），以控制\
  \ `readline` 的行为。这些配置文件仅供使用 `readline` 库的 shell（`bash`、`dash`、`zsh`）使用，而不供其他 shell（如\
  \ `ksh`、`tcsh` 等）使用。这定义了 `bash` 相比 Bourne shell 的许多方便功能，例如在当今的 PC 键盘上正确使用光标键。通常不需要编辑此文件，也没有必要创建自定义的\
  \ `~/.inputrc`（全局的 `/etc/inputrc` 通常足够）。了解它包含的内容对于理解你的 shell 如何与键盘命令交互很有帮助。`inputrc`\
  \ 还定义了 8 位特性，如果你在大量处理 7 位系统，你可能需要使用它。\n\n另一个需要知道的有用 `bash` 选项是：\n\n```\n set completion-ignore-case\
  \ On\n```\n\n这意味着当你输入 `cd foo` 并按下 `Tab` 键时，如果没有 `foo*` 目录，shell 将进行忽略大小写的搜索，这样任何名为\
  \ `Foo*`、`fOo*` 或 `fOO*` 的目录都会匹配。\n\n另一个 `bash` 选项是关闭响铃：\n\n```\n set bell-style\
  \ visible\n```\n\n注意的是，`inputrc` 会影响任何使用 `readline` 库的内容，这通常是一件好事，因为它让你在多个不同工具的行为上保持一致性。我从未意识到过这种情况会导致问题，但对这些的影响保持警是有好处的。\n\
  \n### `~/.wgetrc` 和 `/etc/wgetrc`\n\n如果你需要通过代理服务器访问，可以使用 `~/.wgetrc` 文件为 `wget`\
  \ 工具设置代理设置。例如：\n\n```\n http_proxy = http://proxyserver.intranet.example.com:8080/\n\
  https_proxy = http://proxyserver.intranet.example.com:8080/\nproxy_user = steve\n\
  proxy_password = letmein\n```\n\n你也可以在 shell 中设置相应的变量。\n\n`/etc/wgetrc` 文件会被首先处理，但会被用户的\
  \ `~/.wgetrc`（如果存在）覆盖。\n\n![note.ai](img/note_fmt.gif)\n\n你必须使用 `chmod 0600 ~/.wgetrc`\
  \ 才能处理 `~/.wgetrc` —— 这是为了你自己的安全；有效的密码不应该被你以外的任何人看到！如果权限比 `0600` 开放，`wget` 将忽略该文件。\n\
  \n### `Vi` 模式\n\n来自 Unix 背景的人可能更习惯 `ksh`，无论是用于交互式使用还是 shell 脚本。在交互模式下，`ksh` 通过 `Esc-k`\
  \ 键序列回溯之前的命令，并通过 `Esc-/` 序列搜索历史记录。这些大致等同于 `bash` 的上方向键（或 `^P`）和 `Ctrl-R` 键序列。要让\
  \ `bash`（实际上是 Unix 下的 Bourne shell）表现得更像 `ksh`，请设置 `-o vi` 选项：\n\n```\n bash$ set\
  \ -o vi\n  bash$\n```\n\n### `Vim` 设置\n\n以下有用命令可以在 `~/.vimrc` 中设置或从命令模式手动设置。注意，`vim`\
  \ 使用双引号 (`\"`) 字符来标记注释。这些示例应该是自而易懂的；也可以在 `vim` 会话中交互式地设置，因此输入 `:syntax on` 或 `:syntax\
  \ off` 将开启或关闭当前会话剩余部分的语法高亮。在 `~/.vimrc` 中预定义所有你喜爱的设置可能是很有用的。\n\n![download.eps](img/download_fmt.gif)\n\
  \n```\n$ cat ~/.vimrc\n\" 这必须是第一行，因为它会副作用改变其他选项。\nset nocompatible\n\" 显示行号\nset\
  \ number\n\" 在进入插入模式时显示 \"-- INSERT --\"\nset showmode\n\" 增量搜索\nset incsearch\n\
  \" 高亮匹配的搜索词\nset hlsearch\n\" set ic 意味着忽略大小写的搜索；noic 意味着区分大小写。\nset noic\n\" 在插入模式下允许通过退格删除任何字符\n\
  set backspace=indent,eol,start\n\" 不自动换行\nset nowrap\n\" 让鼠标在控制台中工作\nset mouse=a\n\
  \" 保留 50 行命令历史\nset history=50\n\" 显示光标位置\nset ruler\n\" 执行增量搜索\nset incsearch\n\
  \" 保存备份文件\nset backup\n\" 视觉响铃闪烁背景而不是发出响铃\nset visualbell\n\" 为不同类型的文件设置合理的默认值\n\
  au FileType c set cindent tw=79\nau FileType sh set ai sw=4 noexpandtab\nau FileType\
  \ vim set ai sw=2 noexpandtab\n\" 不将制表符替换为空格\nset notab\n\" 在行首使用制表符，其他地方使用空格\n\
  set smarttab\n\" 开启语法高亮\nsyntax on\n\" 显示行尾的空白字符\nhighlight WhitespaceEOL ctermbg=blue\
  \ guibg=blue\nmatch WhitespaceEOL /\\s+$/\n```\n\n### `vimrc`\n\n## 总结\n\n有许多操作系统、shell\
  \ 和编辑器可以选择。通常情况下，编辑器的选择取决于个人喜好。系统的选择在某些方面可能非常重要，但对于 shell 脚本而言，许多环境（所有的 GNU/Linux\
  \ 发行版、Cygwin 以及一些专有 Unix，如 Solaris）如今都使用 `GNU bash` 以及标准 Unix 工具的 GNU 实现，如 `bc`、`grep`、`ls`、`diff`\
  \ 等。\n\n我希望本章第二部分的一些自定义内容在你根据个人喜好调整系统时被证明有用；如果一个 `alias`（别名）能让你无需记忆某些复杂的语法，你的大脑就能从干扰中解脱出来，让你专注于你真正想要实现的目标，而不是背诵某些晦涩命令的精确语法。\n\
  \n前两个介绍性章节应该已经为你编写一些 shell 脚本做好了准备；第一部分的其余内容涵盖了可用工具及其使用方法。本书的其余部分将在这些基础知识的基础上，提供真实世界的配方，你可以使用并在此基础上构建，从而激发你编写自己的脚本来解决你所面临的问题。\n\
  \n# 第 3 章：变量\n\n没有变量很难完成很多工作：你无法计数、循环或从用户或环境中读取输入，而且你无法进行太大改变。有了变量，你就可以根据变量的状态来修改脚本的行为，也可以修改变量本身以反映脚本之外的世界。\n\
  \n\n\n\n本章介绍了 shell 中变量的使用，以及设置和读取变量的语法。它还列出了一些常见的预设和标准 shell 变量，以及一些实用的 shell 选项。尽管这些变量中某些是\
  \ bash 特有的，但本章的大部分内容适用于所有 shell。第 7 章将深入探讨 bash（以及其他一些 shell）可以实现的更高级的功能，例如数组和更强大的参数扩展特性。\n\
  \n## 使用变量\n\n变量是一个内存块，你可以在其中存储任意数据，并仅通过引用其名称再次检索它。你不需要显式地分配所需的内存，也不需要在需要后释放内存。虽然某些语言具有复杂的垃圾回收机制，但\
  \ shell 脚本通常倾向于处理相对较少的数据且运行时间较短，因此一个简单得的模型就足够了。\n\nshell 在使用变量的语法上是相当独特的。许多语言（如\
  \ Perl、PHP 等）在每次引用变量时都使用美元符号作为前缀；另一些语言（如 Java 或 C）则不使用特定标记来标识变量；上下文足以明确该代码正在引用一个变量。\n\
  \n![note.ai](img/note_fmt.gif)\n\n有时你需要美元符号来引用变量（`echo $variable`），而有时你不需要美元符号（`variable=foo`）。有时你需要在名称周围加上大括号（`echo\
  \ ${variable}bar`），而有时并不重要（`echo $variable bar`）。这些看似任意的规则背后是有逻辑的，所以不要恐慌；它们都是完全可以理解的。\n\
  \n在 shell 中，当你引用变量所存储的值时，在变量名称前面加一个美元符号：\n\n```bash\n $ echo $PATH\n```\n\n当你向变量写入内容时，只需使用其名称（这里的美元符号只是一个提示符，而不是变量引用的一部分）：\n\
  \n```bash\n $ PATH=/usr/sbin:/usr/bin:/sbin:/bin\n```\n\n这意味着当你想要变量的值时，可以使用美元符号引用变量的名称和值，但当它不属于赋值语句的一部分时，单独的名称将被视为普通字符串：\n\
  \n```bash\n $ YOUR_NAME=steve\n$ echo \"The variable YOUR_NAME is $YOUR_NAME\"\n\
  The variable YOUR_NAME is Steve\n```\n\n## 类型\n\n在大多数语言中，变量都与某种“类型”相关，无论是字符串、整数、布尔、浮点数或其他。某些语言是强类型的，这意味着它们不允许整数与浮点数进行比较，或者不允许字符串赋值给数值变量，以此此类推（或者强制你将它们转换为适当类型类型，至少可以清楚程序员意图发生发生什么）。在\
  \ shell 中，完全没有“类型”的概念；如果非要说的话，你可以说万物都是字符串，但某些函数会处理字符串，就好像其中包含的数字实际上是数字一样。在其他语言中，这些错误会在编译时被捕获；由于\
  \ shell 脚本是解释执行的，从不编译，因此这是可能的。\n\nshell 变量的另一个奇特之处是，在使用之前不需要显式声明它们——一个未设置的变量几乎等同于包含空字符串的变量。当你引用未定义的变量时，不会抛出错误：\n\
  \n```bash\n $ cat unset.sh \n#!/bin/bash\necho \"The variable YOUR_NAME is $YOUR_NAME\"\
  \ \nYOUR_NAME=\"Steve\" \necho \"The variable YOUR_NAME is $YOUR_NAME\" \n$ ./unset.sh\
  \ \nThe variable YOUR_NAME is \nThe variable YOUR_NAME is Steve\n$\n```\n\n## 为变量赋值\n\
  \n为变量赋值有三种主要方法：\n\n* 显式定义：`VAR=value`\n* 读取：`read VAR`\n* 命令替换：`VAR='date'`, `VAR=$(date)`\n\
  \n## 显式定义：VAR=value\n\n你可以使用 `x=y` 语法定义变量的值（在此过程中，如果该变量在环境中不存在，则创建它），如前面的 `unset.sh`\
  \ 示例所示。这里的语法很重要，因为一个常见的错误是添加空格，这会从根本上改变语法。\n\n等号 `=` 周围不允许有空格。这可能会让有其他语言背景的人感到恼恼，因为在那些语言中，使用空格与否没有区别——通常用于让代码更清晰易读。shell\
  \ 语法之所以这样是有原因的，正如你在接下来的几段中看到的；以下三个示例展示了在等号 (=) 周围放置空格的不同方式，以及为什么它们不是有效的变量赋值：\n\n\
  ```\n variable = foo\n```\n\n前面的代码被视为一个带有两个参数的命令 (`variable`)：`=` 和 `foo`；其语法与 `ls\
  \ -l foo` 完全相同。没有规则规定不能用 `=` 作为第一个参数调用命令，因此 shell 无法判断意图是进行变量赋值。看起来显而易见的是没有名为 `variable`\
  \ 的命令，因此暗示了变量赋值。然而，你不知道脚本运行的任何系统上可能存在哪些命令，你不希望你的脚本因为某些终端用户创建了一个名为 `variable` 的文件而崩溃。\n\
  \n```\n variable =foo\n```\n\n再次，这是完全有效的语法，等同于 `ls =foo`，因此不是变量赋值。\n\n```\n variable=\
  \ foo\n```\n\n这是一个相对广泛的技术的特例。要在不改变环境的情况下带有特定环境运行命令，你可以在调用 shell 前加上变量赋值：\n\n```\n\
  \ LD_LIBRARY_PATH=/usr/lib firefox\n```\n\n这是运行 `firefox` 时将 `LD_LIBRARY_PATH` 设置为\
  \ `/usr/lib`（默认查找库的位置通常是 `/usr/lib`）。所以 `LD_LIBRARY_PATH= firefox` 会调用 `firefox`\
  \ 并带有一个空 `variable`，正如 `variable = foo` 语法那样。一旦你以这种方式分配了变量，可以通过加上美元符号来访问它：\n\n```bash\n\
  \ $ variable=foo\n$ echo $variable\nfoo\n$\n```\n\n## 读取：read var\n\n设置变量的一种交互式方法是使用\
  \ `read` 命令：\n\n```bash\n $ cat first.sh\n#!/bin/bash\nread myvar\necho \"myvar\
  \ is $myvar\"\n```\n\n如果你运行此脚本，它会提示输入一行，并将 `myvar` 变量设置为输入的内容。\n\n你可以通过先输出提示来让这变得简单一点。`echo`\
  \ 的 `-n` 告诉 `echo` 不要在结尾输出换行符，这样提示和输入的内容将位于同一行：\n\n```bash\n echo -n \"Enter your\
  \ name: \"\nread myvar\necho \"Hello $myvar\"\n```\n\n交互式运行时，它看起来像这样：\n\n```\n $\
  \ ./first.sh\nEnter your name: Steve\nHello Steve\n$ ./first.sh\nEnter your name:\
  \ Steve Parker\nHello Steve Parker\n$\n```\n\n注意整行都被读取到变量 `myvar` 中——你也可以使用 `read`\
  \ 一次读取多个变量：\n\n```bash\n echo -n \"Please enter your first name and last name: \"\
  \nread firstname lastname\necho \"Hello, $firstname. How is the $lastname family?\"\
  \n```\n\n前面的代码将读取这两个变量，忽略任何空白。行中的最后一个变量将占据行中任何所有未读取的文本，因此这意外地很好地处理了双姓：\n\n```\n\
  \ $ ./firstlast.sh \nPlease enter your first name and last name: Steve Parker Smith\
  \ \nHello, Steve. How is the Parker Smith family? \n$\n```\n\n然而，它在输入不足时处理并不良好——`lastname`\
  \ 变量存在于环境中（你可以通过向脚本添加 `set | grep name=` 查看这一点），但它被设置为空字符串：\n\n\n\n\n\n```\n $ cat\
  \ firstlast.sh \n#!/bin/bash \necho -n \"Please enter your first name and last name:\
  \ \" \nread firstname lastname \necho \"Hello, $firstname. How is the $lastname\
  \ family?\" \necho \"Relevant environment variables:\" \nset|grep \"name=\" \n$\
  \ ./firstlast.sh \nPlease enter your first name and last name: Steve Parker \nHello,\
  \ Steve. How is the Parker family? \nRelevant environment variables: \nfirstname=Steve\
  \ \nlastname=Parker \n$ ./firstlast.sh \nPlease enter your first name and last name:\
  \ Steve \nHello, Steve. How is the  family? \nRelevant environment variables: \n\
  firstname=Steve \nlastname= \n$\n```\n\n在前面的代码中，“the”和“family”之间有两个空格，因此脚本显示为“How\
  \ is the $lastname family”，但这两个空格之间是一个零长度字符串即“$lastname”。这种情况将在本章稍后的部分进行详细讨论。\n\n\
  ## 从文件中读取\n\n你也可以使用 `read` 命令从文件中读取行（实际上，从终端读取仍然是从文件读取，因为在 Unix 中一切皆文件）。以下代码更清楚地演示了如何操作：\n\
  \n```\n $ read message < /etc/motd \n$ echo $message \nLinux goldie 2.6.32-5-amd64\
  \ #1 SMP Fri Oct 15 00:56:30 UTC 2010 x86_64\n$\n```\n\n然而，`/etc/motd` 中有多行。以下代码将行读取到名为\
  \ `message` 的变量中，并循环直到没有更多输入为止（如果读取到文件结束，`read` 返回非零值，因此 `while` 循环结束——这将在第 6 章中详细介绍）。\n\
  \n```\n $ while read message\n> do \n>    echo $message \n> done < /etc/motd \n\
  Linux goldie 2.6.32-5-amd64 #1 SMP Fri Oct 15 00:56:30 UTC 2010 x86_64 \nThe programs\
  \ included with the Debian GNU/Linux system are free software; \nthe exact distribution\
  \ terms for each program are described in the \nindividual files in /usr/share/doc/*/copyright.\
  \ \nDebian GNU/Linux comes with ABSOLUTELY NO WARRANTY, to the extent \npermitted\
  \ by applicable law. \n$\n```\n\n这会将 `/etc/motd` 的内容引导到循环中，因此循环继续从 `/etc/motd` 读取另一行（并将其输出），直到消息被完全消耗完毕。这种逐行的特性通过在循环的每个步骤中引入微小的暂停来得更好的体现：\n\
  \n```\n $ while read message \n> do \n>    echo $message \n>    sleep 1 \n>    date\n\
  > done < /etc/motd\n```\n\n这次需要 8 秒钟来显示这八行文本，这在书中很难展示，因此每次都会运行 `date` 命令，以显示时间确实在每读取每一行时都在进展：\n\
  \n```\n Linux goldie 2.6.32-5-amd64 #1 SMP Fri Oct 15 00:56:30 UTC 2010 x86_64 \n\
  Mon Oct 25 19:49:32 BST 2010 \nMon Oct 25 19:49:33 BST 2010 \nThe programs included\
  \ with the Debian GNU/Linux system are free software; \nMon Oct 25 19:49:34 BST\
  \ 2010 \nthe exact distribution terms for each program are described in the \nMon\
  \ Oct 25 19:49:35 BST 2010 \nindividual files in /usr/share/doc/*/copyright. \n\
  Mon Oct 25 19:49:36 BST 2010 \nMon Oct 25 19:49:37 BST 2010 \nDebian GNU/Linux comes\
  \ with ABSOLUTELY NO WARRANTY, to the extent \nMon Oct 25 19:49:38 BST 2010 \npermitted\
  \ by applicable law. \nMon Oct 25 19:49:39 BST 2010\n```\n\n## 命令替换：`VAR=`date`,\
  \ `VAR=$(date)`\n\n另一种设置变量的常用方法将其值设置为给定命令的输出。这实际上是第一格式的变体：`VAR=value`。如果你想让变量在周一设置为“Monday”，周二设置为“Tuesday”，以此类推，可以使用\
  \ `date` 命令的 `%A` 标志，它告诉 `date` 根据当前语言环境提供今天对应的单词。（`date` 命令将在第 14 章中进行详细讨论。）\n\n\
  ![note.ai](img/note_fmt.gif)\n\n大多数 shell 也允许 `VAR=$(date)` 语法，但原始的 Bourne shell\
  \ 不支持。\n\n```\n $ cat today.sh\n#!/bin/bash\nTODAY='date +A'\necho \"Today is $TODAY\"\
  \n$ ./today.sh\nToday is Monday\n$\n```\n\n## 位置参数\n\n当调用 shell 脚本时，向脚本传递参数（或参数）可能是有——例如你想让脚本处理的文件名。这些参数在脚本内部通过它们在命令行上的位置来引用：`$0`\
  \ 是命令名，`$1` 是第一个参数，`$2` 是第二个，以此类推。你不能修改这些变量的值，它们是特殊的。\n\n典型的脚本如下所示：`basename` 会剥离路径，因此\
  \ `/usr/bin/params.sh` 变为 `params.sh`。\n\n```\n $ cat params.sh\n#!/bin/bash\necho\
  \ \"My name is $(basename $0)\"\necho \"First parameter is: $1\"\necho \"Second\
  \ parameter is: $2\"\n$ ./params.sh one two\nMy name is params.sh\nFirst parameter\
  \ is: one\nSecond parameter is: two\n```\n\n脚本无法知道被调用了多少参数。`$#` 告诉我们提供了多少参数。这可以让脚本更加用户友好。\n\
  \n```bash\n $ cat params.sh\n#!/bin/bash\necho \"My name is $(basename $0)\"\nif\
  \ [ \"$#\" -ne 2 ]; then\n    echo \"Usage: $0 arg1 arg2\"\necho \"First parameter\
  \ is: $1\"\necho \"Second parameter is: $2\"\nfi\n$ ./params.sh one\nMy name is\
  \ params.sh\nUsage: params.sh arg1 arg2\n$ ./params.sh one two\nMy name is params.sh\n\
  First parameter is: one\nSecond parameter is: two\n```\n\n必须能够接收超过九参数：假设如果你只需要几个，那么\
  \ `$0` 到 `$9` 将很有用，但如果你处理的更多，显式地写 `$10`、`$11`、`$12`、`$13` 等很快就会变得麻烦——你真正想要说“获取下一个”。内置命令\
  \ `shift` 将所有内容移动一位，每次调用时都会丢弃 `$1`、然后是 `$2`、`$3` 等。你无法找回被移出的的变量，因此在调用 `shift` 之前，请确保你已经完全处理了它们！\n\
  \n\n\n\n\n```bash\n $ cat manyparams.sh \n#!/bin/bash \necho \"My name is 'basename\
  \ $0' - I was called as $0\" \necho \"I was called with $# parameters.\" \ncount=1\
  \ \nwhile [ \"$#\" -ge \"1\" ]; do \n  echo \"Parameter number $count is: $1\" \n\
  \  let count=$count+1 \n  shift \ndone \n$ ./manyparams.sh one two three \nMy name\
  \ is manyparams.sh - I was called as ./manyparams.sh \nI was called with 3 parameters.\
  \ \nParameter number 1 is: one \nParameter number 2 is: two \nParameter number 3\
  \ is: three \n$ ./manyparams.sh one two three four five six seventh eight nine ten\
  \ eleven twelve twelve \nMy name is manyparams.sh - I was called as ./manyparams.sh\
  \ \nI was called with 12 parameters. \nParameter number 1 is: one \nParameter number\
  \ 2 is: two \nParameter number 3 is: three \nParameter number 4 is: four \nParameter\
  \ number 5 is: five \nParameter number 6 is: six \nParameter number 7 is: seven\
  \ \nParameter number 8 is: eight \nParameter number 9 is: nine \nParameter number\
  \ 10 is: ten \nParameter number 11 is: eleven \nParameter number 12 is: twelve \n\
  $\n```\n\n你也可以一次位移几个变量，使用 `shift n`。因此，要位移三个变量，`shift 3` 等同于 `shift`;`shift`;`shift`，尽管你可能更多地看到后语法，因为它更具移植性，而且在某些人看来，这种意图的表达更清晰。\n\
  \n### 所有参数\n\n用于读取传递参数的最后两个变量是 `$*` 和 `$@`。它们非常相似，且经常被混淆。如在下面的代码所示，无论输入是什么，前四行看起来都是完全一样的，区别在于，如果在传递给脚本时使用了双引号，则空格会被保留，而且在被脚本处理时它们也被包含在双引号中。因此，“five”之前的多个空格总是会丢失，因为它们在传递给\
  \ shell 时没有双引号。“two”和“three”之间的多个空格只有当脚本在双引号内处理 `\"$@\"` 时才能被正确保留（下方示例中的最后一个）。\n\
