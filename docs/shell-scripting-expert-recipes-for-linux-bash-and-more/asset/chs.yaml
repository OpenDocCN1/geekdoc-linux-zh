  Wait, I see the error in my manual check. I will just keep the numbers as is.\n\n\
  Final check on the translation:\nstandard_in -> 标准输入\nsyntax error -> 语法错误\nillegal\
  \ character -> 非法字符\n(lines omitted) -> (省略了 xx 行)\n\n\n\n脚本的其余部分根据 `$TFTPBOOT/messages/`\
  \ 中的一些模板文件创建安装所需的文件。`create_msgs` 函数简单地为客户端创建一对菜单文件，其中包含显示中的客户端和服务器名称。`create_kickstart`\
  \ 创建一个非常短的 kickstart 文件，RedHat 安装程序可以使用它来配置安装。在实践中，kickstart 文件比这要长得多，可以包含磁盘布局需求、安装后脚本以及要安装和排除的包列表，从而实现完全的无人值安装。若要调整安装设置，可以在\
  \ `%post` 部分添加代码；这应该是一段很短的代码，但它可以启动整套脚本以在安装后对客户端进行定制。此示例向 `/etc/hosts` 添加了时间服务器条目，还会调用\
  \ NFS 服务器上特定客户端的脚本（如果存在），以执行特定该客户端的安装后任务。如果需要，这可以是某些非常重度定制的开始。\n\n`create_pxelinux_file`\
  \ 创建传递给 `pxelinux.0` 的配置文件，用于显示基本菜单。当用户按下 F2 键时，它会提供额外的文本（来自 `client-f2.txt`），在启动时或用户按下\
  \ F1 键时，显示基本文本（来自 `client.txt`）。`messages/` 目录相对于 `$TFTPBOOT` 目录。同样，`${OSNAME}/vmlinuz`\
  \ 和 `${OSNAME}/initrd.img` 文件分别指向服务器上的 `/tftpboot/RHEL60/vmlinuz` 和 `/tftpboot/RHEL60/initrd.img`。\n\
  \n`calc_client_details` 是此配方的主函数。在脚本开始时，变量 `$CLIENT` 已设置为 `'getent hosts $1'` 输出的第一个字段（主机名）。无论传递传递的是主机名还是\
  \ IP 地址，都能获取主机名，因为 `getent hosts` 无论接收到哪个键总是返回相同格式的数据。`calc_client_details` 然后查找该名称并获取第二个字段，即\
  \ IP 地址。然后它如之前所述处理该 IP 地址。如果结果是一个八位字符串，则假设成功查找了主机名和 IP 地址并将其转换为可用的十六进制字符串。如果看起来成功，它将显示包含所有这些信息的单行消息并继续。如果没有成功，它将显示其计算结果并在写入任何内容之前退出。\n\
  \n## Recipe\n\n![download.eps](img/download_fmt.gif)\n\n```bash\n#!/bin/bash\nTFTPBOOT=/tftpboot/linux-install/pxelinux.cfg\n\
  NFS=/kickstart\nCLIENT='getent hosts $1 | awk '{ print $2 }'\nif [ -z \"$CLIENT\"\
  \ ]; then\n    echo \"A failure occurred in looking up \\\"$1\\\"\"\n    exit 2\n\
  fi\nSERVER='hostname'\nOSNAME=RHEL60\nfunction calc_client_details\n{\n  CLIENT_IP='getent\
  \ hosts $CLIENT | awk '{ print $1 }'\n  if [ -z \"$CLIENT_IP\" ] || [ -z \"$CLIENT\"\
  \ ]; then\n    echo \"A failure occurred in looking up \\\"$CLIENT\\\"\"\n    exit\
  \ 2\n  fi\n  # 192.168.1.42 is C0 A8 01 2A\n  CLIENT_HEXADDR=$(printf \"%02X%02X%02X%02X\"\
  \ 'echo $CLIENT_IP | tr '.' ' '')\n  if [ \"'echo -n $CLIENT_HEXADDR | wc -c'\"\
  \ -ne \"8\" ]; then\n    echo \"An error occurred processing the Hex IP Address\
  \ for \\\"$CLIENT\\\"\"\n    echo \"IPv4 Address detected: $CLIENT_IP\"\n    echo\
  \ \"Hex IP Address calculated: $CLIENT_HEXADDR\"\n    exit 1\n  fi\n  echo \"Client\
  \ details: $CLIENT is at IP address $CLIENT_IP ($CLIENT_HEXADDR)\"\n}\nfunction\
  \ create_pxelinux_file\n{\n  cat - > ${TFTPBOOT}/${CLIENT_HEXADDR} <<-EOF\n    \
  \    default boot\n        timeout 600\n        prompt 1\n        display messages/${CLIENT}.txt\n\
  \        F1 messages/${CLIENT}.txt\n        F2 messages/${CLIENT}-F2.txt\n     \
  \   label boot\n            localboot 0\n        label install\n            kernel\
  \ ${OSNAME}/vmlinuz\n            append initrd=${OSNAME}/initrd.img ks=nfs:${SERVER}:${NFS}/${CLIENT}.cfg\n\
  \  EOF\n  ls -ld ${TFTPBOOT}/${CLIENT_HEXADDR}\n}\nfunction create_kickstart\n{\n\
  \  mkdir -p ${NFS}\n  if [ \"$?\" -ne \"0\" ]; then\n    echo \"Error creating ${NFS}\"\
  \n    exit 1\n  fi\n  cat - > ${NFS}/${CLIENT}.cfg <<-EOF\n        # Kickstart file\
  \ for $CLIENT to boot from $SERVER\n        text install\n        # You would probably\
  \ want to put more details here\n        # but this is a shell scripting recipe\
  \ not a kickstart recipe\n        %post\n        echo This is the postinstall routine\n\
  \        printf \"10.2.2.2\\ttimeserver\" >> /etc/hosts\"\n        /net/$SERVER/$NFS/${CLIENT}.postinstall\n\
  \  EOF\n  ls -ld ${NFS}/${CLIENT}.cfg\n}\nfunction create_msgs\n{\n  CLIENTFILE=${TFTPBOOT}/messages/client.txt\n\
  \  CLIENTF2=${TFTPBOOT}/messages/client-f2.txt\n  MYFILE=${TFTPBOOT}/messages/${CLIENT}.txt\n\
  \  MYF2=${TFTPBOOT}/messages/${CLIENT}-f2.txt\n  if [ ! -r \"$CLIENTFILE\" ]; then\n\
  \    echo \"Error reading $CLIENTFILE\"\n    exit 1\n  fi\n  sed s/CLIENT/g\n}\n\
  ```\n\n\n\n\n图 19-2\n\n![f1902.tif](img/f1902_fmt.jpg)\n\n## 总结\n\nPXE 启动的设置可能稍微繁琐，但一旦基础设施就绪，它就是快速、轻松自动化构建几十、数百甚至数千台服务器的极佳方法。本教程涵盖了从一种命名规范（`192.168.1.42`）转换为另一种（`C0A8012A`）所涉及的数学。这是必要的，因为大多数与\
  \ IPv4 地址协作的系统使用十进制表示，而 `pxelinux.0` 使用十六进制。两种系统都是可以的，但需要在这两种格式之间进行转换，而脚本的作用就是适应这些特殊性，并作为这些相似但又不同的系统之间的胶水。\n\
  \n# 第 20 章：进程\n\n控制进程是操作系统内核的关键任务之一。内核还提供信号发送机制，允许一个进程向另一个进程发送消息。这些消息可以通过接收端 shell\
  \ 的陷阱（trap）机制进行处理。其他方法也可用：例如，仅仅文件的存在就可以用来更改脚本的行为。本教程同时使用了这两种方法。本教程还利用 `pgrep` 和\
  \ `kill` 命令来查找运行中的进程并向它们发送信号。\n\n## 教程 20-1：进程控制\n\n有很多商业集群产品，它们提供对网络、存储服务以及进程的监控和故障转移功能。它们还提供了针对多节点集群可能的故障场景（通常被称为“脑裂”和“健忘症”）的高级保护。本教程的复杂度远未达到此类，但它提供了对单服务器上服务的简单监控和重启。\n\
  \n## 使用的技术\n\n* 关联数组\n* 信号处理\n* 配置文件\n* 进程控制：`pgrep`, `kill`\n* `logger`\n* 循环：`for`,\
  \ `while`\n* 条件执行：`if`, `case`, `[ expression ] &&`\n\n## 概念\n\n集群和高可用性本身就是巨大的话题。本教程只是查看了进程的监控和可能的重启。起初，这似乎是一个非常细微的任务，但有一些细节需要处理。如何处理持续失败的进程是其中一个问题；本教程记录了服务上次失败的时间，如果它最近已经重启过，则禁用该服务且不再再次重启。当然，仅仅因为某件事在两周前失败过并且之后又失败了，并不意味着应该放弃它，因此脚本中定义了\
  \ 3 分钟（180 秒）的超时时间。通过在读取配置文件之前在脚本中设置此类硬编码值和调试值，如果在未选择其他值的情况下将设置默认值，但用户可以通过编辑 `/etc/ha/ha.cfg`\
  \ 轻松更改这些值。\n\n基本原理是定期检查被监控进程的 `PID`。如果进程已停止，则重启它。如果它在不同的 `PID` 下重启，则被视为失败，因此教程记录该事实并让新进程继续运行。这意味着进程在失败时不会再次重启，但脚本不会采取直接干预。\n\
  \n不同的应用程序具有不同的属性；某些长时间运行的进程（这里使用 `sleep 600` 作为最终“失败”的长运行进程的示例）是简单的：启动进程，监控其 `PID`\
  \ 是否仍然存活，如果它由于任何原因死亡，则启动一个新的副本。某些服务并非那么简单。Apache 服务器通过 `apachectl start` 指令启动，但该进程本身几乎立即终止，留下一组\
  \ `apache2`（取决于构建方式，可能名为 `apache`、`httpd` 或 `httpd2`）进程。对于这种情况，脚本会等待一小会儿，然后查看发现了哪些\
  \ `PIDs`。Apache 在此处实际的操作是留下一个 root 拥有的进程，它绑定到特权端口 80 并有自己的子进程，这些子进程以非特权用户运行并在请求到达时实际提供服务。\n\
  \n每个应用程序的值通过每个被监控服务的 `.conf` 文件进行配置。除了一些为了展示可以进行其他类型操作的未使用变量外，这些文件中的主变量是指示服务是否启用的标志、启动命令、在进程树中查找的进程名称，以及收集和监控\
  \ `PIDs` 之前的延迟。还有一个标志，表示在多次失败后是否应该停止进程。如所述，启动命令和最终实际运行并被监控的进程名称可能是完全不同的，或者（如 `sleep`\
  \ 的情况）是相同的。\n\n最后，脚本还监控一个名为 Friar Tuck 的特殊守护守护进程。在 `http://www.catb.org/jargon/html/meaning-of-hack.html`，术语文件（Jargon\
  \ File）讲述了两个名为 Robin Hood 和 Friar Tuck 的进程看似真实的故事。这两个进程互相监控，如果其中一个被杀死，另一个就会重启它。Windows\
  \ NT 3.5 和 4.0 版本也有类似的功能，以防止用户通过更改注册表将工作站升级为服务器；一个线程监控注册表设置，另一个线程监控监控线程。这里使用了相同的原理；如果\
  \ HA Monitor 脚本发生故障，整个系统就会崩溃。这被称为单点故障（SPoF），通过设置一个伙伴进程来监控并重启主监控脚本可以避免它。这使得伙伴进程也成为了一个\
  \ SPoF，因此主监控脚本监控它的伙伴。这样一来，它们都确保对方始终运行。Friar Tuck 进程可以使用与主监控脚本完全相同的代码，但 Friar Tuck\
  \ 不需要像主 HA Monitor 脚本那么复杂。这意味着 Friar Tuck 可以用来描述监控进程的基本操作，而主 HA Monitor 脚本可以更深入，并为进程监控和控制提供更通用的代码。\n\
  \nFriar Tuck 还用作系统的通信点；你通过调用 `friartuck.sh` 启动它，并向 Friar Tuck 发送信号以停止服务以及强制其刷新配置。如果没有这一点，要完全停止整个框架将非常困难；两个进程必须在短时间内被杀死，以免在另一个进程恢复之前被恢复。这正是术语文件故事中\
  \ Robin Hood 和 Friar Tuck 所做的。向 Friar Tuck 发送信号也是主脚本被指示动态重新读取其配置的方式。这意味着一个启用的服务在由于重复失败被禁用后，可以通过强制\
  \ HA Monitor 脚本刷新其配置来重新启用。\n\n## 潜在陷阱\n\n这样的系统有很多陷阱。最糟糕的场景之一是两个进程实际上在同一时间被杀死。在这样的集群级别，对此根本无能为力。更高级的集群系统可以直接挂钩到操作系统内核来处理集群的各种关键方面，但这个简单的教程只是努力保持其进程存活。\n\
  \n\n\n\n系统配置的另一个问题是在放弃和重启失败进程之间取得平衡。如果一个进程因为配置问题、常规内存泄漏或其他代码故障而持续失败，那么让服务偶尔对外部用户可用，但又不断再次离线，可能会适得其其反。在这种情况下，允许服务失败并要求人工干预来修复底层问题可能会更好。\n\
  \n一个存储最近失败时间戳的数组可以为这种情况提供更准确的故障诊断；如果在过去 3 分钟内发生了两次失败，但在此之前的最后一次失败是在 3 个月前，那么再次重启服务将是合理的。然而，如果服务不断失败，可能最好直接禁用该服务。每次都打乱失败时间戳数组实现起来非常容易。\n\
  \n## 结构\n\n该系统的基本结构位于 `HA Monitor` 中，但它的简单版本嵌入在 `Friar Tuck` 进程中。该配方的的另一个关键方面是涉及的数据结构。这些将在接下来的材料中依次讨论。\n\
  \n# 数据结构\n\n主脚本 `hamonitor.sh` 大量使用数组来跟踪它可以监控的无限数量进程的不同方面。`Friar Tuck` 脚本不需要其中任何内容，对它来说要简单得多，但添加数组使得\
  \ `HA Monitor` 脚本变得灵活得多。因为 shell 不支持多维数组，因此进程的每个方面都有自己的数组。脚本没有使用 `stopcmd`、`min`\
  \ 和 `max` 数组；列出它们是为了保持完整性，并暗示如果你有此意愿，该脚本可以很容易地修改以执行其他操作。`pid` 数组跟踪进程正在使用的 PID(s)；如果在收集\
  \ PID 之前之前有延迟，则将其设置为负值。\n\n两个脚本都使用的另一个变量是 `tag`；它被 `logger` 用于识别运行的进程。通过使用 `logger\
  \ -t \"$tag\"`，脚本可以准确地识别自己。`\"$tag\"` 周围的引号非常重要；冒号在 tag 之后，如果没有引号，它将显示 `friartuck:\
  \ (8357) ./friartuck.sh FINISHING`，这不如 `friartuck (8357): friartuck.sh FINISHING`\
  \ 那么清晰。\n\n```\n Apr  20 10:00:20 goldie friartuck (8357): ./friartuck.sh FINISHING.\
  \ Signalling 8323 \nto do the same.\nApr  20 10:00:21 goldie hamonitor (8323): /etc/ha/hamonitor.sh\
  \ FINISHING\nApr  20 10:00:25 goldie friartuck (8357): ./friartuck.sh FINISHED.\n\
  ```\n\n这对于调试和诊断脚本特别有用。如下所示，很容易看到 `friartuck.sh` 正在向 PID 8323 信号，那是 `hamonitor.sh`\
  \ 脚本。\n\n# Friar Tuck\n\n`Friar Tuck` 控制一切，包括启动监控系统和向 `HA Monitor` 发送信号。`Friar Tuck`\
  \ 捕获信号 3 和 4，并创建 `/tmp` 文件与 `HA Monitor` 通信。这在收到 `SIGQUIT` (3) 时协调两个进程的关闭，或者在收到\
  \ `SIGILL` (4) 时指示 `HA Monitor` 重新读取其配置文件。\n\n如果 `pgrep` 没有发现以 root 身份运行的 `hamonitor.sh`，则启动它。如果找到了但在一个意外的\
  \ PID 下，则记录该事实并记录新的 PID。然而，如果 `hamonitor.sh` 持续失败，则不会采取任何特殊操作；`friartuck.sh` 将始终尝试重启它。这比\
  \ `hamonitor.sh` 的行为要简单，但这是 `friartuck.sh` 需要采取的粗简单方法，以确保 `hamonitor.sh` 始终运行。\n\
  \n# HA Monitor\n\n`hamonitor.sh` 脚本大约有 200 行；这是书中第二长的单个脚本，大约也是一个结构化 shell 脚本所合理的合理长度。一个简单的命令序列可以长得多且保持可管理，但对于一个相当复杂的脚本，任何长于此的内容都值得拆分为不同的函数和代码库。\n\
  \n有一个 `while` 循环，它从中间偏下的位置开始一直持续到脚本结束。这部分将近 100 行，很难在屏幕上一次性看到，尽管它的主要部分是一个内部 `for`\
  \ 循环，其长度更易于管理。\n\n此脚本可以使用 bash 4 版本提供的关联数组；如果不可用，配置文件必须命名为 `1.conf`、`2.conf` 等。此外，`declare\
  \ -A` 语句必须改为 `declare -a`，因为 `-A` 用于声明关联数组，在 bash 4 之前的版本中不存在。\n\n脚本从 `readconfig`\
  \ 函数开始。它逐个将配置文件读取到数组中。这种方法意味着监控的进程数量实际上是无限的。该函数最值得注意的方面是，预期从配置文件读取的变量在读取配置文件之前会被取消设置。如果不这样做，并且配置文件漏掉了某个变量，它仍然具有上一个配置文件中定义的值。这将是错误的行为且非常难以追踪。`readconfig`\
  \ 还会进行初始检查以查看进程是否已经在运行。如果是，它会将 `pid` 数组的该元素设置为以指定用户运行该进程的 PID 列表。\n\n`startproc`\
  \ 函数的前两个参数是启用标志和要运行的用户名。其余的参数用于启动进程。这通过处理前两个值然后使用 `shift 2` 命令丢弃它们来实现，从而在 `$@` 中只留下启动命令及其参数。\n\
  \n主 `while` 循环随后启动。该循环被分为两个部分；第一部分（`sleep $DELAY` 行之前）检查 `STOPFILE` 或 `READFILE`\
  \ 是否存在。如果发现这些且归 root 所有，脚本将要么关闭（删除 `STOPFILE` 以指示 `Friar Tuck` 它已接收并处理了消息），要么重新读取其配置文件然后删除\
  \ `READFILE`，以便在循环的下次迭代中不再重新读取配置。\n\n执行 `sleep $DELAY` 命令后，`HA Monitor` 遍历 `idx`\
  \ 数组，这提供了每个数组键的名称。在 bash 4 版本中，你可以使用 `${!process[@]}` 无 `idx` 数组创建此列表，在这种情况下使用 `idx`\
  \ 列出键会更清晰。这种方法在没有关联数组的情况下也有效。\n\n如果服务未启用（在配置文件中或因为失败次数过多），则将其忽略。`continue` 回到 `for`\
  \ 循环处理下一个进程。\n\n接下来，检查 `pid` 数组是否有负值。如果是负值，则进程刚刚启动，可能尚未完全完成启动。该变量会递增（以接近零），并再次使用\
  \ `continue` 移动到 `for` 循环中的下一个进程。如果变量达到了 `-1`，则使用 `pgrep` 扫描进程树以查找运行的进程，并将该 PID\
  \ 分配给进程中 `pid` 数组的元素。如果没有找到，则通过调用 `failurecount` 函数将进程标记为失败。否则，将记录新 PID 并在循环的后续迭代中查找。\n\
  \n\n\n最后 50 行左右是脚本的主体。在这里，测试了三种不同的场景。\n\n首先，如果在搜索进程时未找到预期的 `PID`，则该进程已失败，必须重启或将其标记为失败。暂时跳过第二种场景，脚本处理的第三种可能性是：同一个进程仍以之前的\
  \ `PID` 运行，且一切正常。\n\n脚本考虑的第二种可能性是三种情况中最复杂的一种。如果发现进程正在运行，但在不同的 `PID` 下，则可能发生了两种情况之一：要么进程已经终止并被一个新进程取代了，要么是该进程的其他其他实例正与被监控的进程一同运行。\n\
  \n脚本会对 `PIDs` 列表进行比较。如果在当前运行的 `PIDs` 列表中没有找到任何之前监控的 `PIDs`，则 `failed` 变量会加 1。在循环结束时，该变量决定了行动方案。如果没有发现失败的进程，则额外的\
  \ `PIDs` 被视为无害的且与被监控的进程无关。\n\n如果发现一个或多个之前监控的 `PIDs` 缺失，将调用 `failurecount` 函数。如果该进程最近已经失败，这将禁用其进一步监控。`pid`\
  \ 元素将被设置为进程的 `PID(s)`，或者如果 `startdelay` 不为零，则设置为 `(0 - startdelay)`。这为进程在需要时提供了稳定所需的时间。\n\
  \n还提供了一个 `stopha.sh` 脚本。它仅是将信号 3 (`SIGQUIT`) 发送给 `friartuck.sh` 进程（或者发送给命令行传递的另一个\
  \ `PID`）。Friar Tuck 将捕获该信号，关闭 HA 器，然后终止自身。\n\n## Recipe 方\n\n![download.eps](img/download_fmt.gif)\n\
  \n```bash\n#!/bin/bash\nfunction bailout\n{\n  logger -t $tag \"$0 FINISHING. Signalling\
  \ $pid to do the same.\"\n  touch /tmp/hastop.$pid\n  while [ -f /tmp/hastop.$pid\
  \ ]\n  do\n    sleep 5\n  done\n  logger -t $tag \"$0 FINISHED.\"\n  exit 0\n}\n\
  function reread\n{\n  logger -t $tag \"$0 signalling $pid to reread config.\"\n\
  \  touch /tmp/haread.$pid\n}\ntrap bailout 3\ntrap reread 4\ntag=\"friartuck ($$)\"\
  \ndebug=9\nDELAY=10\npid=0\ncd 'dirname $0'\nlogger -t $tag \"Starting HA Monitor\
  \ Monitoring\"\nwhile :\ndo\n  sleep $DELAY\n    [ \"$debug\" -gt \"2\" ] && logger\
  \ -t $tag \"Checking hamonitor.sh\"\n    NewPID='pgrep -u root hamonitor.sh'\n \
  \   if [ -z \"$NewPID\" ]; then\n      # No process found; child is dead.\n    \
  \  logger -t $tag \"No HA process found!\"\n      logger -t $tag \"Starting \\\"\
  '$pwd'/hamonitor.sh\\\"\"\n      nohup 'pwd'/hamonitor.sh >/dev/null 2>&1 &\n  \
  \    pid=0\n    elif [ \"$NewPID\" != \"$pid\" ]; then\n      logger -t $tag \"\
  HA Process rediscovered as $NewPID (was $pid)\"\n      pid=$NewPID\n    else\n \
  \     # All is well.\n      [ \"$debug\" -gt \"3\" ] && logger -t $tag \"hamonitor.sh\
  \ is running\"\n    fi\ndone\n```\n\n`friartuck.sh`\n\n\n\n\n\n```bash\n#!/bin/bash\n\
  function readconfig\n{\n  # 读取配置\n  logger -t $tag Reading Configuration\n  for\
  \ proc in ${CONFDIR}/*.conf\n  do\n    # 如果是 Bash44，此文件名可以是 web.conf，否则为 1.conf,\
  \ 2.conf 等\n    unset ENABLED START STOP PROCESS MIN MAX STARTDELAY USER STOPPABLE\n\
  \    index='basename $proc .conf'\n    echo \"Reading $index configuration\"\n \
  \   . $proc\n    startcmd[$index]=$START\n    stopcmd[$index]=$STOP\n    process[$index]=$PROCESS\n\
  \    min[$index]=$MIN\n    max[$index]=$MAX\n    startdelay[$index]=$STARTDELAY\n\
  \    user[$index]=$USER\n    enabled[$index]=$ENABLED\n    idx[$index]=$index\n\
  \    lastfailure[$index]=0\n    stoppable[$index]=${STOPPABLE:-1}\n    PID='pgrep\
  \ -d ' ' -u ${user[$index]} $PROCESS'\n    if [ ! -z \"$PID\" ]; then\n      # 已经在运行\n\
  \      logger -t $tag \"${PROCESS} is already running;\"\\\n          \" will monitor\
  \ ${USER}'s PID(s) $PID\"\n      pid[$index]=$PID\n    else\n      pid[$index]=-1\n\
  \      if [ \"$ENABLED\" ]; then\n        startproc $ENABLED $USER $START\n    \
  \  fi\n    fi\n  done\n  logger -t $tag \"Monitoring ${idx[@]}\"\n  # 设置默认值\n  DELAY=10\n\
  \  FAILWINDOW=180\n  debug=9\n  . ${CONFDIR}/ha.cfg\n}\n# 如果 Bash 版本低于 4，使用 declare\
  \ -a 来声明数组\ndeclare -A process\ndeclare -A startcmd\ndeclare -A stopcmd\ndeclare\
  \ -A min\ndeclare -A max\ndeclare -A pid\ndeclare -A user\ndeclare -A startdelay\n\
  declare -A enabled\ndeclare -A lastfailure\ndeclare -A stoppable\n# 对于 v4 之前的 Bash，需要一个索引数组（不支持关联数组）\n\
  declare -A idx\nfunction failurecount\n{\n  index=$1\n  interval='expr $(date +%s)\
  \ - ${lastfailure[$index]}'\n  lastfailure[$index]='date +%s'\n  if [ \"$interval\"\
  \ -lt \"$FAILWINDOW\" ]; then\n    if [ ${stoppable[$index]} -eq 1 ]; then\n   \
  \   logger -t $tag \"${process[$index]} has failed twice within $interval\"\\\n\
  \          \" seconds. Disabling.\"\n      enabled[$index]=0\n    else\n      logger\
  \ -t $tag \"${process[$index]} has failed twice within $interval\"\\\n         \
  \ \" seconds but can not be disabled.\"\n    fi\n  fi\n}\nfunction startproc\n{\n\
  \  if [ \"$1\" -ne \"1\" ]; then\n    shift 2\n    logger -t \"Not starting \\\"\
  $@ as it is disabled.\"\n    return\n  fi\n  user=$2\n  shift 2\n  logger -t $tag\
  \ \"Starting \\\"$@ as \\\"$user\\\"\"\n  nohup sudo -u $user $@ >/dev/null 2>&1\
  \ &\n}\nCONFDIR=/etc/ha\ntag=\"hamonitor ($$)\"\nSTOPFILE=/tmp/hastop.$$\nREADFILE=/tmp/haread.$$\n\
  cd 'dirname $0'\nlogger -t $tag \"Starting HA Monitoring\"\nreadconfig\nwhile :\n\
  do\n  if [ -f $STOPFILE ]; then\n    case 'stat -c %u $STOPFILE' in\n      0)\n\
  \        logger -t $tag \"$0 FINISHING\"\n        rm -f $STOPFILE\n        exit\
  \ 0\n        ;;\n      *)\n        logger -t $tag \"$0 ignoring non-root $STOPFILE\"\
  \n        ;;\n    esac\n  fi\n  if [ -f $READFILE ]; then\n    case 'stat -c %u\
  \ $READFILE' in\n      0) readconfig\n          rm -f $READFILE\n          ;;\n\
  \      *)\n          logger -t $tag \"$0 ignoring non-root $READFILE\"\n       \
  \   ;;\n    esac\n  fi\n  sleep $DELAY\n  for index in ${idx[@]}\n  do\n    if [\
  \ ${enabled[$index]} -eq 0 ]; then\n      [ \"$debug\" -gt \"3\" ] && logger -t\
  \ $tag \"Skipping ${process[$index]} as it disabled.\"\n      continue\n    fi\n\
  \    # 检查守护进程；如果未则启动它。\n    if [ ${pid[$index]} -lt -1 ]; then\n      # 仍在等待其启动；跳过。\n\
  \      logger -t $tag \"Not checking ${process[$index]} yet.\"\n      pid[$index]='expr\
  \ ${pid[$index]} + 1'\n    elif [ ${pid[$index]} == -1 ]; then\n      pid[$index]='pgrep\
  \ -d ${user[$index]} ${process[$index]}'\n      if [ -z \"${pid[$index]}\" ]; then\n\
  \        logger -t $tag \"${process[$index]} didn't start in the allowed times.\"\
  \n        failurecount $index\n      fi\n      logger -t $tag \"PID of ${process[$index]}\
  \ is ${pid[$index]}.\"\n    fi\n    [ \"$debug\" -gt \"2\" ] && logger -t $tag \"\
  Checking ${process[$index]}\"\n    NewPID='pgrep -d ${user[$index]} ${process[$index]}'\n\
  \    if [ -z \"$NewPID\" ]; then\n      # 未找到进程；子进程已死亡。\n      logger -t $tag \"\
  No process for ${process[$index]} found!\"\n      failurecount $index\n      startproc\
  \ $enabled[$index]} ${user[$index]} ${cmd[$index]}\n      if [ ${startdelay[$index]}\
  \ -eq 0 ]; then\n        pid[$index]='pgrep -d ${user[$index]} ${process[$index]}'\n\
  \      else\n        pid[$index]='expr 0 - ${startdelay[$index]}'\n      fi\n  \
  \    [ \"$debug\" -gt \"4\" ] && logger -t $tag \"Start Delay for ${process[$index]}\
  \ is ${startdelay[$index]}.\"\n    elif [ \"$NewPID\" != \"${pid[$index]}\" ]; then\n\
  \      # PID 发生了变化。只是产生了新进程吗？\n      failed=0\n      for thispid in ${pid[$index]}\n\
  \      do\n        echo $NewPID | grep -w $thispid > /dev/null\n        if [ \"\
  $?\" -ne \"0\" ]; then\n          # 其中一个 PID 丢失\n          ((failed++))\n      \
  \  fi\n      done\n      if [ \"$failed\" -gt \"0\" ]; then\n        failurecount\
  \ $index\n        logger -t $tag \"PID changed for ${process[$index]}; was \\\"\
  ${pid[$index]}\\\" now \\\"$NewPID\\\"\"\n        # pid[$index]=-2 #SGP $NewPID\n\
  \        if [ ${startdelay[$index]} -eq 0 ]; then\n          pid[$index]=$NewPID\n\
  \        else\n          pid[$index]='expr 0 - ${startdelay[$index]}'\n      fi\n\
  \    fi\n    else\n      # 一正常。\n      [ \"$debug\" -gt \"3\" ] && logger -t $tag\
  \ \"${process[$index]} is running\"\n    fi\n  done\ndone\n```\n\n`hamonitor.sh`\n\
  \n```bash\n#!/bin/bash\npid=${1:-'pgrep -u root friartuck.sh'}\nkill -3 $pid\n```\n\
  \n`stopha.sh`\n\n```bash\n# Apache 使用 apachectl 启动\n# 但进程名称为 apache2\nSTART=\"/usr/sbin/apachectl\
  \ start\"\nSTOP=\"/usr/sbin/apachectl stop\"\nPROCESS=apache2\nMIN=1\nMAX=10\nSTARTDELAY=2\n\
  ENABLED=1\nUSER=root\n```\n\n`apache.conf`\n\n```bash\nSTART=\"nohup ./friartuck.sh\
  \ >/dev/null 2>&1\"\nSTOP=/bin/false\nPROCESS=\"friartuck.sh\"\nMIN=1\nMAX=1\nSTARTDELAY=0\n\
  ENABLED=1\nUSER=root\nSTOPPABLE=0\n```\n\n`friartuck.conf`\n\n```bash\nSTART=\"\
  sleep 600\"\nSTOP=\nPROCESS=sleep\nMIN=1\nMAX=1\nSTARTDELAY=0\nENABLED=1\n```\n\n\
  要启动该框架，请运行 `hamonitor.sh`。`hamonitor.sh` 脚本会在事件发生时记录日志。根据 `ha.cfg` 的配置，消息可能会发送不同的文件。现在可以安全地杀掉\
  \ `friartuck.sh` 的命令行调用了，它将由 `hamonitor.sh` 脚本重启。整个流程现在在没有控制终端的情况下运行，且任何脚本都可以自主重启另一个。\n\
  \n\n\n\n```\n Apr 20 11:04:36 goldie hamonitor (10531): Checking friartuck.sh\n\
  Apr 20 11:04:37 goldie hamonitor (10531): No process for friartuck.sh found!\nApr\
  \ 20 11:04:37 goldie hamonitor (10531): Starting \"nohup ./friartuck.sh >/dev/null2>&1\"\
  \ as \"root\"\nApr 20 11:04:37 goldie hamonitor (10531): Start Delay for friartuck.sh\
  \ is 0.\nApr 20 11:04:37 goldie hamonitor (10531): Checking sleep\nApr 20 11:04:37\
  \ goldie friartuck (10680): Starting HA Monitor Monitoring\nApr 20 11:04:37 goldie\
  \ hamonitor (10531): sleep is running\nApr 20 11:04:37 goldie hamonitor (10531):\
  \ Checking apache2\nApr 20 11:04:37 goldie hamonitor (10531): apache2 is running\n\
  Apr 20 11:04:47 goldie friartuck (10680): Checking hamonitor.sh\nApr 20 11:04:47\
  \ goldie friartuck (10680): HA Process rediscovered as 10531 (was 0)\n```\n\n杀死\
  \ `sleep` 进程将强制其以与 `friartuck.sh` 重启非常相同的方式进行重启。由于其配置文件中定义的配置偏好，`sleep` 在 3 分钟内只能重启一次，否则它将被标记为失败。\n\
  \n```\n Apr 20 11:05:47 goldie hamonitor (10531): Checking sleep\nApr 20 11:05:47\
  \ goldie hamonitor (10531): No process for sleep found!\nApr 20 11:05:47 goldie\
  \ hamonitor (10531): Starting \"sleep 600\" as \"steve\"\nApr 20 11:05:47 goldie\
  \ hamonitor (10531): Start Delay for sleep is 0.\nApr 20 11:05:47 goldie hamonitor\
  \ (10531): Checking apache2\nApr 20 11:05:47 goldie hamonitor (10531): apache2 is\
  \ running\nApr 20 11:05:57 goldie friartuck (10680): Checking hamonitor.sh\nApr\
  \ 20 11:05:57 goldie friartuck (10680): hamonitor.sh is running\nApr 20 11:05:57\
  \ goldie hamonitor (10531): Checking friartuck.sh\nApr 20 11:05:57 goldie hamonitor\
  \ (10531): Checking sleep\nApr 20 11:05:57 goldie hamonitor (10531): sleep is running\n\
  ```\n\n在 3 分钟窗口内再次杀死 `sleep` 会导致其被禁用。在重新读取配置之前，HA Monitor 脚本不会再次尝试重启它。\n\n```\n\
  \ Apr 20 11:07:08 goldie hamonitor (10531): Checking sleep\nApr 20 11:07:08 goldie\
  \ hamonitor (10531): No process for sleep found!\nApr 20 11:07:08 goldie hamonitor\
  \ (10531): sleep has failed twice within 81 seconds. Disabling.\nApr 20 11:07:08\
  \ goldie hamonitor (10531): Not starting \"sleep 600\" as it is disabled.\nApr 20\
  \ 11:07:08 goldie hamonitor (10531): Start Delay for sleep is 0.\n```\n\n由于 `friartuck`\
  \ 在其配置文件具有 `STOPPABLE=0` 属性，数组值 `${stoppable[friartuck]}` 的值也是 0。然而，与 `sleep` 进程不同，无论\
  \ Friar Tuck 被杀死多少次，它始终会被重启。\n\n```\n Apr 20 11:08:38 goldie hamonitor (10531):\
  \ Checking friartuck.sh\nApr 20 11:08:38 goldie hamonitor (10531): No process for\
  \ friartuck.sh found!\nApr 20 11:08:38 goldie hamonitor (10531): Starting \"nohup\
  \ ./friartuck.sh >/dev/null2>&1\" as \"root\"\nApr 20 11:08:38 goldie hamonitor\
  \ (10531): Start Delay for friartuck.sh is 0. . . . . . . . .\n Apr 20 11:09:18\
  \ goldie hamonitor (10531): Checking friartuck.sh\nApr 20 11:09:19 goldie hamonitor\
  \ (10531): No process for friartuck.sh found!\nApr 20 11:09:19 goldie hamonitor\
  \ (10531): friartuck.sh has failed twice within 41 seconds but can not be disabled.\n\
  Apr 20 11:09:19 goldie hamonitor (10531): Starting \"nohup ./friartuck.sh >/dev/null2>&1\"\
  \ as \"root\"\nApr 20 11:09:19 goldie hamonitor (10531): Start Delay for friartuck.sh\
  \ is 0.\n```\n\n乍看之下，Apache 似乎被相同的方式处理；通过 `apachectl stop` 命令停止 Apache 会导致所有进程终止。HA\
  \ Monitor 脚本重启 Apache 的方式就像它处理 `sleep` 和 `friartuck.sh` 一样。\n\n```\n Apr 20 11:12:10\
  \ goldie hamonitor (10531): Checking apache2\nApr 20 11:12:10 goldie hamonitor (10531):\
  \ No process for apache2 found!\nApr 20 11:12:10 goldie hamonitor (10531): Starting\
  \ \"/usr/sbin/apachectl start\" as \"root\"\nApr 20 11:12:10 goldie hamonitor (10531):\
  \ Start Delay for apache2 is 0. . . . . . . . .\nApr 20 11:12:20 goldie hamonitor\
  \ (10531): Not checking apache2. . . . . . . . .\nApr 20 11:12:30 goldie hamonitor\
  \ (10531): PID of apache2 is 1935. . . . . . . . .\nApr 20 11:12:40 goldie hamonitor\
  \ (10531): Checking apache2\nApr 20 11:12:40 goldie hamonitor (10531): apache2 is\
  \ running\n```\n\n然而，如果独立调用 `apachectl`，Apache 将出现在不同的 PID 下，而 HA Monitor 并不会感知。只要它超出了上一次失败后的\
  \ 3 分钟窗口，这种情况就会被记录，但执行将继续。\n\n\n\n\n\n```\nApr 20 11:24:36 goldie hamonitor (13620):\
  \ Checking apache2\nApr 20 11:24:36 goldie hamonitor (13620): No process for apache2\
  \ found!\nApr 20 11:24:36 goldie hamonitor (13620): Starting \"/usr/sbin/apachectl\
  \ start\" as \"root\"\nApr 20 11:24:36 goldie hamonitor (13620): Start Delay for\
  \ apache2 is 2.\n. . . . . . . \nApr 20 11:24:46 goldie hamonitor (13620): Not checking\
  \ apache2 yet.\n. . . . . . .\nApr 20 11:24:56 goldie hamonitor (13620): PID of\
  \ apache2 is 14192.\n. . . . . . . \nApr 20 11:25:06 goldie hamonitor (13620): Checking\
  \ apache2\nApr 20 11:25:06 goldie hamonitor (13620): apache2 is running\n. . . .\
  \ . . . \nApr 20 11:25:26 goldie hamonitor (13620): No process for apache2 found!\n\
  Apr 20 11:25:26 goldie hamonitor (13620): apache2 has failed twice within 50 seconds.\
  \ Disabling.\nApr 20 11:25:26 goldie hamonitor (13620): Not starting \"/usr/sbin/apachectl\
  \ start\" as it is disabled.\nApr 20 11:25:26 goldie hamonitor (13620): Start Delay\
  \ for apache2 is 2.\n. . . . . . . \n```\n\n向 `friartuck.sh` 发送 `kill -4` 信号会导致\
  \ Friar Tuck 创建一个名为 `/tmp/haread.$pid` 的文件，其中 `$pid` 是 `hamonitor.sh` 脚本的 PID。`hamonitor.sh`\
  \ 脚本会在下次循环时注意到该文件的存在并重新读取其配置文件。\n\n```\nApr 20 11:27:27 goldie hamonitor (13620):\
  \ Skipping apache2 as it is disabled.\nApr 20 11:27:35 goldie friartuck (13564):\
  \ ./friartuck.sh signalling 13620 to reread config.\nApr 20 11:27:35 goldie friartuck\
  \ (13564): Checking hamonitor.sh\nApr 20 11:27:35 goldie friartuck (13564): hamonitor.sh\
  \ is running\nApr 20 11:27:37 goldie hamonitor (13620): Checking friartuck.sh\n\
  Apr 20 11:27:37 goldie hamonitor (13620): friartuck.sh is running\nApr 20 11:27:37\
  \ goldie hamonitor (13620): Checking sleep\nApr 20 11:27:37 goldie hamonitor (13620):\
  \ sleep is running\nApr 20 11:27:37 goldie hamonitor (13620): Skipping apache2 as\
  \ it is disabled.\nApr 20 11:27:37 goldie hamonitor (13620): Reading Configuration\n\
  Apr 20 11:27:37 goldie hamonitor (13620): Starting \"/usr/sbin/apachectl start\"\
  \ as \"root\"\nApr 20 11:27:37 goldie hamonitor (13620): friartuck.sh is already\
  \ running; will monitor root's PID(s) 13564\nApr 20 11:27:37 goldie hamonitor (13620):\
  \ sleep is already running; will monitor sleep's PID(s) 13638\nApr 20 11:27:37 goldie\
  \ hamonitor (13620): Monitoring friartuck sleep. . . . . . . .\nApr 20 11:27:47\
  \ goldie hamonitor (13620): PID of apache2 is 14711. . . . . . . .\nApr 20 11:28:07\
  \ goldie hamonitor (13620): Checking apache2\nApr 20 11:28:07 goldie hamonitor (13620):\
  \ apache2 is running\n```\n\n最后，要停止整个框架，向 `friartuck.sh` 发送 `kill -3` 信号会导致 Friar\
  \ Tuck 创建 `/tmp/hastop.$pid` 并等待 `hamonitor.sh` 将其删除。两个脚本随后将干净退出且不再重启。这也是通过 `hastop.sh`\
  \ 脚本完成的。\n\n```\nApr 20 11:29:35 goldie friartuck (13564): ./friartuck.sh FINISHING.\
  \ Signalling 13620 to do the same.\nApr 20 11:29:38 goldie hamonitor (13620): Checking\
  \ friartuck.sh\nApr 20 11:29:38 goldie hamonitor (13620): friartuck.sh is running\n\
  Apr 20 11:29:38 goldie hamonitor (13620): Checking sleep\nApr 20 11:29:38 goldie\
  \ hamonitor (13620): sleep is running\nApr 20 11:29:38 goldie hamonitor (13620):\
  \ Checking apache2\nApr 20 11:29:38 goldie hamonitor (13620): apache2 is running\n\
  Apr 20 11:29:38 goldie hamonitor (13620): /etc/ha/hamonitor.sh FINISHING\nApr 20\
  \ 11:29:40 goldie friartuck (13564): ./friartuck.sh FINISHED.\n```\n\n## 总结\n\n\
  高可用性是一个复杂的领域，复杂性通常意味着成本。如果应用程序的不可用会对业务造成损失，那么投入资金来缓解此类故障就是不合理的。你将获得一个更完整的系统，它能够监控存储和网络资源、重启应用程序，并在节点之间进行故障转移，以缓解硬件完全故障的影响。\n\
  \n然而，当你面对一个不可靠的应用程序，且在白天黑夜的任何时候手动重启都是不现实的时，此脚本将代表你合理尝试保持应用程序运行，并处理可能阻碍它的基本问题，例如高可用性脚本本身的故障。它也足够简单，便于理解和使用，无需经过为期一周的培训课程即可开始使用其核心功能。\n\
  \n# 第 21 节 国际化\n\n国际化通常被认为是只有通过过度设计的编程环境的复杂功能才能完成的。事实并非如此，如本配方所示，很容易编写出国际化的 Shell\
  \ 脚本。用程序方式处理人类语言始终是棘棘的，而同时处理多种不同的语言则更加复杂。两个关键点是：将 Shell 语法与消息字符串分离，并留意每一个复数形式。英语脚本可以接受“I\
  \ can see 1 aircraft”和“I can see 2 aircraft”，但在另一种语言中，“aircraft”一词会有不同的复数形式。\n\n\
  ### 配方 21-1: 国际化\n\n大多数 Shell 脚本是用美式英语编写的，绝大多数从未被翻译成其他语言。同样，有些脚本是用本地语言编写的，且从未被翻译成其他语言。有时这样做是完全没问题的——针对单一语言员工的内部脚本不需要在任何其他语言中运行。但在其他情况下，除非脚本经过翻译，否则可能会遇到许多不同的问题。如果一个人因为听不懂脚本在说什么而无法使用它，这显然是一个关注的问题。如果脚本可以用某人的母语进行通信，那么他对信息的理解会清晰得多。此外，支持某些语言也可能是法律或合同上的要求。\n\
  \n本章的讨论假设原始脚本是用英语编写并翻译成其他语言的，但并没有要求必须这样做。原始脚本可以编写为显示任何语言；脚本输出的内容将成为 `msgid`，然后被翻译为\
  \ `msgstr`。\n\n我编写的第一个使用国际化的脚本是一个配置特定 USB ADSL 调制调调器的脚本（[`speedtouchconf.sourceforge.net/`](http://speedtouchconf.sourceforge.net/)）。起初，此脚本仅显示了调制调器与用户\
  \ ISP 工作所需的某些本地化设置——每个 ISP 对于 ADSL 都有自己的 VPI/VCI 对，在 ADSL 早期，客户被要求了解这些（或者运行 ISP\
  \ 硬编码这些值的 Windows 软件）。因此，法国的 Wanadoo 使用 8/35，其他法国 ISP 使用 8/67，所有英国 ISP 使用 0/38，依此类推。很快发现，这个调制调器正被世界各地技术能力迥异、英语水平各异的人在使用。在收集这些\
  \ VPI/VCI 对的同时，我开始收到翻译脚本本身的建议。最终，它由志愿者翻译成了丹语、西班牙语、法语、意大利语、挪威语、波兰语、葡萄牙语和斯洛伐克语。这一切都是通过\
  \ GNU gettext 变得可行——甚至是简单的。对于非技术翻译者来说，提供翻译相当容易，这意味着招募志愿者翻译非常容易。有了 gettext，翻译者甚至不需要读取\
  \ Shell 脚本本身，只需要需要翻译的字符串即可。尽管如此，看到消息在脚本中的具体位置是有用的，而 gettext 确实提供了这种上下文，并允许程序员向翻译者添加注释来标记消息。\n\
  \n\n\n\n\n## 概念\n\n翻译是一个四个步骤的过程。首先是对字符串进行国际化（internationalization），然后对其进行翻译（可能翻译成许多不同的语言），然后进行编译，最后在运行时自动本地化到所需的目标语言中。国际化通常缩写为\
  \ `i18n`，而本地化被称为 `L10n`。这是因为这两个词太长了；“18”代表“i”和“n”之间缺失的 18 个字母，而“10”则代表“L”和“n”之间缺失的\
  \ 10 个字母。\n\n国际化是准备一个可在全球范围内（确实是国际范围内）使用的脚本的过程。这涉及到标记任何需要翻译的字符串，在带有 `gettext` 的\
  \ shell 脚本情况下，要确保编码标准足够简单，以便 `gettext` 能够识别字符串中的变量并进行适当翻译。\n\n其次，翻译是将 shell 脚本输出现有字符串并将其翻译成不同人类语言的过程。如果开发者足够熟练，可以将脚本翻译成另一种语言，那么所有测试都可以很容易地完成，周转时间很快。如果不是，那么重写代码以适配\
  \ `gettext`、获取字符串翻译、编译翻译并运行测试（理想情况下由翻译人员检查以确保最终结果符合预期）可能会非常尴尬且耗时。一个很好的折中方案是创建一个虚拟语言；在\
  \ 20 世纪 90 年代，Red Hat Linux 安装程序提供了“Redneck”（红脖子）作为安装过程中可用的语言之一。这为北美开发者提供了一种可以进行测试的语言，而不需要开发者精通外语。（政治不适当的文本很容易溜进此类翻译中，因为根据定义，它跨越了语言/文化边界，所以请务必始终保持尊重。）\n\
  \n![note.ai](img/note_fmt.gif)\n\nRed Hat Linux 5.1（注意这与 RHEL 5.1 不同）安装指南在第 37 页有一个脚注，该脚注这样解释了\
  \ Redneck 语言：\n\n“Redneck”语言条目代表了 Red Hat 公司的 Donnie Barnes 所说的一种美国式英语方言，在向安装程序添加国际化支持期间被用测试用例。包含它仅是为了娱乐价值（并为了说明与\
  \ Donnie 话实际上有多困难）。\n\n第三，一旦字符串完成翻译，单个语言文本文件将由 `msgfmt` 工具编译成二进制 `.mo` 文件，供 `gettext`\
  \ 使用。这些文件可以放在 `$TEXTDOMAINDIR` 目录下的特定区域子目录中，根据当前的区域设置使用适当的文件。\n\n文本域（text domain）告诉\
  \ `gettext`应该使用哪一组翻译。如果系统安装了两个不同的应用程序，且它们对英语短语“No Change”（无更改）都有自己的翻译，那么自动售卖机应用程序所需的该短语翻译（意思是“如果你不提供所需的金额，你无法得回任何硬币”）将与状态跟踪应用程序所需的翻译不同（意思是“此物体的状态与上次检查时相同”）。文本域确保了使用相关的翻译。\n\
  \n本地化随后是第四步也是最后一步。它发生在用户的机器上，当脚本执行并将控制权交给 `gettext` 时，它会字面上获取相关的本地化文本并显示给用户。在 GUI\
  \ 系统中，这可能意味着菜单、对话框和弹出消息以相应的语言显示。对于 shell 脚本，这意味着文本将以正确的语言显示。\n\n## 潜在陷阱\n\n一个不那么显眼的陷阱完全不是技术性的。它是指随着脚本时间的推移，每一个产生新输出或不同输出的更改都需要重新审核翻译。这可能会产生重大影响，特别是对具有完整翻译的语言比例而言。脚本的单次更改可能会破坏在此之前翻译率为\
  \ 100% 的所有语言，并进一步恶化那些只有部分支持的语言。\n\n在商业驱动的项目中，如果支持五种语言，可能需要重新聘请五位翻译人员来翻译新文本。与他们将翻译的文本行相比，与他们谈判的时间成本可能非常高。在社区项目中，需要同样的努力，尽管某些翻译人员可能不再有兴趣维护该脚本，因此必须找到该语言的替代志愿者，否则该语言的翻译将不完整。如果支持\
  \ 50 种语言，可能需要寻找并鼓励 50 名翻译人员，因此无论翻译人员的动力如何，问题都会增加十倍。\n\n在技术方面，人们注意到的现象之一是，虽然 `echo`\
  \ 以换行符结束输出，但 `gettext` 没有，因此直接用 `gettext` 替换 `echo` 语句不会产生相同的结果。根据上下文，在 `gettext`\
  \ 之后跟一个单独的 `echo` 来向输出插入换行符通常是最简单的修复方法。在其他情况下，使用其他更灵活的输出工具（如 `printf`）可以比单独使用 `echo`\
  \ 生成更整洁、易读的代码。\n\n更重要的是，`gettext` 并 shell 可以使用的任何结构。这并不是全是坏事；这意味着翻译人员也不需要了解任何 shell\
  \ 脚本的知识。从这个角度来看有助于确定什么和什么适合传递给 `gettext`。然而，`gettext` 确实有一个名为 `eval_gettext` 的大哥，它可以评估简单的变量语法，以便变量值进入可翻译的字符串。这可以处理简单的变量，如\
  \ `$a` 或 `${a}`，但不能处理更复杂的，例如 `${a:-1}`。它不能处理其他结构，例如 `'pwd'`。任何此类快捷方法都需要 `eval_gettext`\
  \ 之外完成，这给开发者增加了一些额外的额外负担，但也意味着非技术翻译人员更容易翻译。\n\n在食谱中，将数字 2、4 和 6 翻倍的短 `for` 循环将答案放入\
  \ `$ans`，命令为 `ans='expr $i * 2'`。然后将其传递给 `eval_gettext`，但 `$i` 和 `$ans` 中的美元符号必须进行转义，以免它们被\
  \ shell 展开。传递准确的文本（包括美元符号）是非常重要的，因为 `msgid` 是“Twice $i is $ans”，而不是“Twice 2 is 4”。\n\
  \n在复数形式上还有进一步的问题。某些语言的单数和复数项使用同一个词。例如在英语中，“sheep”一词既是单数也是复数。相反，child 的英语复数是 children\
  \ 而不是 childs。这种结构不符合逻辑且不可编程，因此必须根据它是否为复数来翻译。某些语言会根据使用的是单数还是复数完全改变语法。`eval_ngettext`\
  \ 可以处理这种差异，正如脚本结尾的“I have n child[ren]”引用所示。\n\n## 结构\n\n这个脚本只是一个非常简单的 33 行 shell\
  \ 脚本。它创建了一个备份目录 `~/.savedfiles`；欢迎用户使用脚本；输出两个随机数；然后将 2、4 和 6 乘以 2。最后，它声称有 1、2 或\
  \ 3 个孩子。这些内容都不特别费力，但它为这些目的展示了足够的的国际化知识，并且保持脚本尽可能简单有助于将注意力集中在翻译上。\n\n\n\n\n\n首先，`xgettext`\
  \ 会找到脚本中所有可翻译的字符串，并创建 `messages.po`，该文件包含了所有适用于翻译格式的字符串。对于每种翻译的语言，都会提取该文件的副本。根据具体的分工情况，开发者可能会填写大部分甚至所有的标头信息，而翻译人员将读取每个\
  \ `msgid`（英文文本）并将其目标语言填充到 `msgstr` 中。这在配方（recipe）中表示为 `vi po/de/script.po`，其中 `po`\
  \ 是 `$TEXTDOMAINDIR` 变量指定的目录。翻译人员可能会作为其自身测试的一部分运行 `msgfmt` 命令，或者由开发者在翻译提交后运行该命令，或者两者都运行。这会创建\
  \ `$TEXTDOMAIN.mo` 二进制文件，其中包含了翻译信息。为了演示起，这里的文本域（text domain）是 `mynicescript`，而脚本本身名为\
  \ `script.sh`。它们的名称可以相同也可以不同，但在这里强调了它们的区别以明确区分。原则上说，文本域通常是项目的名称，而单个脚本可能只是其中的一小部分。\n\
  \n## Recipe (配方)\n\n![download.eps](img/download_fmt.gif)\n\n```\nsteve@goldie:~/script$\
  \ cat script.sh\n#!/bin/bash\n. gettext.sh\nexport TEXTDOMAIN=mynicescript\ncd 'dirname\
  \ $0'\nexport TEXTDOMAINDIR='pwd'/po\nsavedir='gettext \"savedfiles\"'\nmkdir ~/.$savedir\n\
  gettext \"Hello, world!\"\necho\ngettext \"Welcome to the script.\"\necho\n###i18n:\
  \ Thank you for translating this script!\n###i18n: Please leave $RANDOM intact :-)\n\
  eval_gettext \"Here's a random number: \\$RANDOM\"\necho\neval_gettext \"Here's\
  \ another: \\$RANDOM\"\necho\necho\nfor i in 2 4 6\ndo\n  ans='expr $i \\* 2'\n\
  \  eval_gettext \"Twice \\$i is \\$ans\"\n  echo\ndone\n```\n\n## script.sh\n\n\
  首先，`xgettext` 从脚本中提取文本。这会创建一个 `messages.po` 文件，该文件包含一个由开发者和翻译人员协作完成的标头。它还包含一个包含脚本中找到每个字符串的模板，供翻译人员进行翻译。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```\nsteve@goldie:~/script$ xgettext\
  \ --add-comments='##i18n' script.sh\nsteve@goldie:~/script$ cat messages.po\n# SOME\
  \ DESCRIPTIVE TITLE.\n# Copyright (C) YEAR THE PACKAGE'S COPYRIGHT HOLDER\n# This\
  \ file is distributed under the same license as the PACKAGE package.\n# FIRST AUTHOR\
  \ <EMAIL@ADDRESS>, YEAR.\n#\n#, fuzzy\nmsgid \"\"\nmsgstr \"\"\n\"Project-Id-Version:\
  \ PACKAGE VERSION\\n\"\n\"Report-Msgid-Bugs-To: \\n\"\n\"POT-Creation-Date: 2011-04-06\
  \ 19:47+0100\\n\"\n\"PO-Revision-Date: YEAR-MO-DA HO:MI+ZONE\\n\"\n\"Last-Translator:\
  \ FULL NAME <EMAIL@ADDRESS>\\n\"\n\"Language-Team: LANGUAGE <LL@li.org>\\n\"\n\"\
  Language: \\n\"\n\"MIME-Version: 1.0\\n\"\n\"Content-Type: text/plain; charset=CHARSET\\\
  n\"\n\"Content-Transfer-Encoding: 8bit\\n\"\n#: script.sh:7\nmsgid \"savedfiles\"\
  \nmsgstr \"\"\n#: script.sh:10\nmsgid \"Hello, world!\"\nmsgstr \"\"\n#: script.sh:12\n\
  msgid \"Welcome to the script.\"\nmsgstr \"\"\n#. ##i18n: Thank you for translating\
  \ this script!\n#. ##i18n: Please leave $RANDOM intact :-)\n#: script.sh:17\n#,\
  \ sh-format\nmsgid \"Here's a random number: $RANDOM\"\nmsgstr \"\"\n#: script.sh:19\n\
  #, sh-format\nmsgid \"Here's another: $RANDOM\"\nmsgstr \"\"\n#: script.sh:25\n\
  #, sh-format\nmsgid \"Twice $i is $ans\"\nmsgstr \"\"\n```\n\n↓ messages.po 设置德语本地环境\
