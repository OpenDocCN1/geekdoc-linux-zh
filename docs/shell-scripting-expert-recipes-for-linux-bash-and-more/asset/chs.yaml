  It will always be the queen of hearts.\n$\n```\n\n# 旅游规划师\n\n最后，一个更复杂的脚本以惊人的一致性生成了随机旅行计划。当它建议去纽约时，它可能会建议参观自由女神像；但当它建议去悉尼时，它可能会建议参观歌剧院，因此这种随机性并非真正的随机。该脚本使用了一个名为\
  \ `places/` 的子目录，其中包含以每个已知地命名的文本文件。该文件的每一行包含该地方的一个旅游景点。`tourism.sh` 中的 `while` 循环确保了最终景点前面不会有“and”单词，这意味着你可以通过在命令行提供天数来更改天数，且英语语法依然有效。它还在最后一次连接之前放置逗号，并在最后一对元素之间放置逗号，并且在显示单日游时表现正常。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```bash\n$ ls -l places/\ntotal 32\n\
  -rw-rw-r-- 1 steve steve 46 Feb 19 12:04 Amsterdam\n-rw-rw-r-- 1 steve steve 38\
  \ Feb 18 18:36 London\n-rw-rw-r-- 1 steve steve 65 Feb 19 12:08 Microsoft\n-rw-rw-r--\
  \ 1 steve steve 61 Feb 19 12:06 New York\n-rw-rw-r-- 1 steve steve 38 Feb 18 18:49\
  \ Paris\n-rw-rw-r-- 1 steve steve 53 Feb 19 12:08 Seattle\n-rw-rw-r-- 1 steve steve\
  \ 72 Feb 19 12:03 Sydney\n-rw-rw-r-- 1 steve steve 47 Feb 19 12:08 Unix\n$ cat places/Paris\n\
  the Eiffel Tower\nNotre Dame\nthe Seine\n$ cat tourism.sh\n#!/bin/bash\ncd places\n\
  place=$(shuf -e -n1 *)\ndays=${1:-2}\necho -en \"Let's go to $place and check out\
  \ \"\ncount=1\nshuf -n$days \"$place\" | while read trip\ndo\n  let count=$count+1\n\
  \  echo -en $trip\n  if [ \"$count\" -le \"'expr $days - 1'\" ]; then\n    echo\
  \ -en \", \"\n  elif [ \"$count\" -le \"$days\" ]; then\n    echo -en \" and \"\n\
  \  else\n    echo \" \"\n  fi\ndone\n$ ./tourism.sh\nLet's go to Sydney and check\
  \ out the Opera House and Sydney Harbour Bridge\n$ ./tourism.sh 1\nLet's go to New\
  \ York and check out the Empire State Building\n$ ./tourism.sh 3\nLet's go to Paris\
  \ and check out Notre Dame, the Eiffel Tower and the Seine\n$ ./tourism.sh 4\nLet's\
  \ go to London and check out the London Eye, the Houses of Parliament, Big Ben and\
  \ Covent Garden\n```\n\n## tourism.sh \n\n## sort\n\n`sort` 是 Unix/Linux 工具箱中一个非常强大的实用。它可以根据各种标准进行排序，检查并合并已排序的文件，根据不同的键进行排序，甚至根据这些键中的不同字符进行排序。它还可以删除重复项，从而消除了对\
  \ `sort file.txt | uniq` 语法的需求。\n\n`sort` 的选项分为两类。有些选项用于修改 `sort` 的行为；`-u` 消除重复结果，`-c`\
  \ 和 `-C` 仅检查输入是否已排序。`-t` 指定空白以外的字段分隔符，`-s` 则让内容相同的行保持其在输入中的原始顺序。其他选项则修改了 `sort`\
  \ 实际用于排序输入时使用的策略。表 13-1 总结了 `sort` 可用于修改排序策略的标志。\n\n### 表 13-1: 排序修符\n\n| 标志 | 结果\
  \ |\n| :--- | :--- |\n| `-M` | 按月份排序；未知 < 十二（取决于区域设置）。 |\n| `-b` | 忽略前导空白。 |\n|\
  \ `-d` | 字典排序；忽略标点符号。 |\n| `-f` | 不区分大小写的排序。 |\n| `-g` | 通用数值排序。大多数情况下使用 `-n`。 |\n\
  | `-i` | 忽略不可打印字符。 |\n| `-h` | 对人类可读格式的文件进行排序。 |\n| `-n` | 数值排序；9 在 10 之前。 |\n|\
  \ `-R` | 随机排序。 |\n| `-r` | 反转排序结果。 |\n| `-V` | 一种理解软件版本号（如 foo-1.23.0）的排序算法。 |\n\
  \n`-M` 功能取决于当前的 `LC_TIME` 变量。你可以通过 `locale -a` 命令查看安装了哪些内容。\n\n### 按键排序\n\n`-k`\
  \ 选项告诉 `sort` 使用哪个字段（或多个字段）作为排序键。默认分隔符是任意数量的空白，因此对于相当杂乱的输入，例如 `musicians.txt`，`sort\
  \ -k 2` 命令将按字母顺序排序姓。字段的排列方式并不重要，`sort` 默认取任意数量的空白作为分隔符。\n\n```\n$ cat musicians.txt\n\
  die Mercury      Singer      5 Sep 1946\nBrian May      Guitarist      19 Jul 1947\n\
  John Deacon      Bass      19 Aug 1951\nRoger Taylor      Drums      26 Jul 1949\n\
  Benny Andersson      Pianist      16 Dec 1946\nBjorn Ulvaeus      Guitarist    \
  \  25 Apr 1945\nAnni-Frid Lyngstad      Singer      15 Nov 1945\nAgnetha Falkog\
  \      Singer      4 Apr 1950\n\n### 多字段排序\n\n对多个字段排序也是可能的。对 `hosts` 进行多字段排序，只需按年份排序，然后是月份，最后是日期。这有点更复杂，因为\
  \ IP 地址是用点分隔的，所以可以使用 `-t` 选项来指定分隔符。数据可以先按键 1 排序，然后是键 2，最后是键 3。这并不那么直观，因为 `sort -t.\
  \ -k1 -k2 -k3 -k4` 并不像你预期的那样工作。键 1 被视为初始的“127.”后面跟着整行内容，因此当 `sort` 到键 4 时，它会根据 IP\
  \ 地址的最后一个字节进行重新排序（.1, .210, .227 等），完全抵消了之前的排序。\n\n```\n$ hosts\n127.0.0.1     \
  \   localhost\n192.168.1.3      sky\n192.168.1.11      atomic\n192.168.1.10    \
  \  declan      example.com\n192.168.0.210    goldie ksgp dalston\n192.168.1.5  \
  \    plug\n192.168.1.227    elvis\n192.168.1.13      goldie  goldie.example.com\
  \ moe sgp\n```\n\n一个更实用的例子是排序 `/etc/hosts` 文件。按主机名进行排序将没有用；最好按 IP 地址进行数值排序。这有点更复杂，因为\
  \ IP 地址是用点分隔的，所以可以使用 `-t` 选项来指定分隔符。数据可以先按键 1 排序，然后是键 2，最后是键 3。这并不那么直观，因为 `sort -t.\
  \ -k1 -k2 -k3 -k4` 并不像你预期的那样工作。键 1 被视为初始的“127.”后面跟着整行内容，因此当 `sort` 到键 4 时，它会根据 IP\
  \ 地址的最后一个字节进行重新排序（.1, .210, .227 等），完全抵消了之前的排序。\n\n```\n$ hosts\n127.0.0.1     \
  \   localhost\n192.168.1.3      sky\n192.168.1.11      atomic\n192.168.1.10    \
  \  declan      example.com\n192.168.0.210    goldie ksgp dalston\n192.168.1.5  \
  \    plug\n192.168.1.227    elvis\n192.168.1.13      goldie  goldie.example.com\
  \ moe sgp\n$ sort -t. -k7n -k6M.txt\nBjorn Ulvaeus      Guitarist      25 Apr 1945\n\
  Anni-Frid Lyngstad      Singer      15 Nov 1945\ndie Mercury      Singer      5\
  \ Sep 1946\nBenny Andersson      Pianist      16 Dec 1946\nBrian May      Guitarist\
  \      19 Jul 1947\nJohn Deacon      Bass      19 Aug 1951\nRoger Taylor      Drums\
  \      26 Jul 1949\n```\n\n\n\n\n为了解决这个问题，你可以告诉 `sort` 每个键的起始字段和结束字段。在这种情况下，第一个键是字段\
  \ 1 到 1（包含边界），第二个键是字段 2 到 2（包含边界），依此类推。这可以得到预期的结果：IP 地址将根据其子网进行分组，并在子网内部进行数值排序。`-n`\
  \ 标志还告诉 `sort` 进行数值排序（这样 5 就会排在 10 之前，而在字母顺序排序中则不会如此）。\n\n```\n $ sort -t. -k1,1n\
  \ -k2,2n -k3,3n -k4,4n hosts\n127.0.0.1       localhost\n192.168.0.210   dgoldie\
  \ ksgp dalston\n192.168.1.3      sky\n192.168.1.5      plug\n192.168.1.10    declan\
  \          declan.example.com\n192.168.1.11    atomic\n192.168.1.13    goldie  goldie.example.com\
  \ smf  spo  sgp\n192.168.1.227   elvis\n$\n```\n\n# 按日期和时间排序日志文件\n\n字段拆分可以更进一步，即仅对字段内的某些字符进行排序。标准的\
  \ Apache 访问日志文件将访问日期和时间存储为 `[02/Mar/2011:13:06:17 -0800]`。这很难自动排序；这里的第一个键是 2011，第二个是\
  \ `Mar`，然后是 02。之后是 13，然后是 06，然后是 17。除了值的顺序之外（如果是 2011/Mar/02/13:06:17 就会容易得多），代表\
  \ 3 月的单词 `Mar` 在 Apr 之前但在 Dec 之后，这在字母顺序上是没有意义的。\n\n幸运的是，正如你在本节开头的音乐家示例所示，`sort`\
  \ 可以根据区域设置（locale）确定月份名称，因此只要你当前的区域设置使用的名称与日志文件中的相同，`sort` 就可以使用 `-M` 标志按照日历年份的顺序（1\
  \ 月到 12 月）排序月份。为了展示如何对这些排序，请看这个系统管理员检查三个日志文件的典型示例。相关的页面（文章 928，通过 URL 片段 `art=928`\
  \ 识别）出现在两个较旧的日志文件中，但没有出现在当前的 `access_log`。然而，简单的 `grep` 会按“错误”顺序处理这些文件，因为 `access_log.processed.1`\
  \ 在字母顺序上位于较旧的 `access_log.processed.2` 之前，而且文件名通配符展开会按字母顺序对其结果进行排序。这意味着日志的显示顺序是错误的。\n\
  \n```\n $ ls -ltr access*\n-rw-rw-r-- 1 steve steve 22429808 Mar  2 04:42 access_log.processed.2\n\
  -rw-rw-r-- 1 steve steve 45490104 Mar  4 04:49 access_log.processed.1\n-rw-rw-r--\
  \ 1 steve steve 19457016 Mar  5 21:16 access_log\n$ grep art=928 *\naccess_log.processed.1:77.88.31.247\
  \ - - [02/Mar/2011:13:06:17 -0800] \"GET /urandom/\ncomment.php?art=928 HTTP/1.1\"\
  \ 200 11551 \"-\" \"Mozilla/5.0 (compatible; YandexBot/3.0\n; +http://yandex.com/bots)\"\
  \naccess_log.processed.1:77.88.31.247 - - [02/Mar/2011:16:30:34 -0800] \"GET /urandom/\n\
  comment.php?title=Number+of+the+day&art=928 HTTP/1.1\" 200 11599 \"-\" \"Mozilla/5.0\
  \ (c\nompatible; YandexBot/3.0; +http://yandex.com/bots)\"\naccess_log.processed.1:66.249.69.52\
  \ - - [04/Mar/2011:01:18:32 -0800] \"GET /urandom/\ncomment.php?art=928 HTTP/1.1\"\
  \ 200 11584 \"-\" \"Mozilla/5.0 (compatible; Google/bot/2.1\n; http://www.google.com/bot.html)\"\
  \naccess_log.processed.2:67.195.111.173 - - [01/Mar/2011:06:26:32 -0800] \"GET /urando\n\
  m/comment.php?title=Number+of+the+day&art=928 HTTP/1.0\" 200 11599 \"-\" \"Mozilla/5.0\n\
  (compatible; Yahoo! Slurp; http://help.yahoo.com/help/us/ysearch/slurp)\"\naccess_log.processed.2:218.213.130.168\
  \ - - [01/Mar/2011:07:25:41 -0800] \"GET /urand\nom/comment.php?art=928 HTTP/1.1\"\
  \ 200 11551 \"-\" \"ichiro/4.0 (http://help.goo.ne.jp/d\noor/crawler)\"\naccess_log.processed.2:218.213.130.168\
  \ - - [01/Mar/2011:07:33:54 -0800] \"GET /urand\nom/comment.php?title=Number+of+the+day&art=928\
  \ HTTP/1.1\" 200 11599 \"-\" \"ichiro/4.0\n(http://help.goo.ne.jp/door/crawler)\"\
  \n```\n\n在这种情况下，由于文件上的时间戳是正确的，管理员可以使用 `ls -lt` 将文件排序为正确的顺序。\n\n\n\n\n```bash\n #\
  \ cat dirsize.sh\n#!/bin/bash\ncd \"${1:-.}\"\nif [ \"$?\" -ne \"0\" ]; then\n \
  \ echo \"Error: Failed to change to directory $1\"\n  exit 2\nfi\necho \"The largest\
  \ files/directories in $1 are:\"\ndu -sh * | sort -hr | head | cat -n -\n# ./dirsize.sh\
  \ /var/log\nThe largest files/directories in /var/log are:\n      1  1.3M    installer\n\
  \      2  1.1M    kern.log.1\n      3  780K    messages.1\n      4  696K    apache2\n\
  \      5  680K    wtmp.1\n      6  572K    kern.log\n      7  412K    messages\n\
  \      8  380K    daemon.log.1\n      9  288K    syslog.1\n     10  284K    daemon.log\n\
  #\n```\n\n### `dirsize.sh`\n\n### tr\n\n`tr` 工具用于单字符与其他字符之间的转换。调用方式为 `echo frabacbable\
  \ | tr 'a' 'b'`，每当它看到字母 `a` 时就会将其替换为 `b`，输出为 `frbbbcbbble`。此脚本根据供应商安装说明对内核进行调整。具体细节可能会随版本变化，因此每次都需要从供应商处下载，但有两点是保持不变：\n\
  \n- 供应商始终通过 `echo value > /proc` 提供内核调优的临时更改，而不是作为 `sysctl.conf` 文件的调优。\n- 供应商的排版非常糟糕，在不合法的地方使用了多余的斜杠和大写字母。这些必须优雅地处理。\n\
  \n调优 Linux 内核有两种方法；要设置用户可以打开的最大文件数，你可以执行 `echo 65536 > /proc/sys/fs/file-max`，这会让更改立即生效，但在重启后会丢失；或者你可以在\
  \ `/etc/sysctl.conf` 中添加行 `sys.fs.file-max = 65536`。这将在系统每次启动时被应用。你需要运行 `sysctl\
  \ -p` 来动态从 `/etc/sysctl.conf` 加载新值。注意 `sys.fs.file-max` 在 `/proc` 文件系统中表示为 `sys/fs/file-max`。这对于\
  \ `tr` 来说是理想的；有一个单字符（已知仅作为分隔符使用），目标是将其替换为另一个单字符，后者也仅用作分隔符。\n\n`tr` 的另一个用途是将范围内的字符转置到第二个范围的相关位置。这通常用于将\
  \ `[A-Z]` 转换为 `[a-z]`，尽管它也可以转换任何字符。它还可以使用预定义的范围，例如 `[:alnum:]` 代表所有字母和数字，`[:digit:]`\
  \ 代表数字，`[:space:]` 代表任何空白字符等等。这些都列在 `tr(1)` 手页中。\n\n此脚本获取当前的发行说明（`relnotes.txt`）并提取任何\
  \ `echo value > /proc/tunable.subsys.subval` 命令，并将它们转换为 `/etc/sysctl.conf` 的 `tunable.subsys.subval\
  \ = value` 条目。它使用 `tr '[A-Z]' '[a-z]'` 将任何大写文本转换为小写，因为所有内核调优参数都是小写的。它通过 `tr '/'\
  \ '.'` 将斜杠转换为点。它还会删除任何重复的斜杠，以便输入的 `/pROc/sYs///kERnel//sHMMax` 转换为输出的格式 `sys.kernel.shmmax`。\n\
  \n![download.eps](img/download_fmt.gif)\n\n```bash\n $ ls\ninstallproduct.sh\n$\
  \ cat installproduct.sh\n#!/bin/bash\nVERSION=${1:-\"2.4.3\"}\nDOWNLOAD=downloads.vendor.com\n\
  URL=http://${DOWNLOAD}/product/v${VERSION}\necho \"Retrieving release notes...\"\
  \nwget -nd ${URL}/relnotes.txt\necho \"Got release notes:\"\necho \"*** START OF\
  \ RELEASE NOTES\"\ncat relnotes.txt\necho \"*** END OF RELEASE NOTES\"\ngrep \"\
  ^echo \" relnotes.txt | tr -s \"/\" | while read params\ndo\n  value=$(echo $params\
  \ | cut -d\"\" -f1)\n  proc=$(echo $params | cut -d\"\" -f2 | cut -d\"\" -f3)\n\
  \  sysctl=$(echo $proc | tr '[A-Z]' '[a-z]' | tr '/' '.')\n  echo \"Setting $sysctl\
  \ to $value...\"\n  echo $sysctl=$value | tee -a /etc/sysctl.conf\ndone\necho \"\
  Loading new kernel.\"\nsysctl -p >/dev/null 2>&1\n$ ./installproduct.sh\nRetrieving\
  \ release notes...\n--2011-03-07 17:19:08--http://downloads.vendor.com/product/v2.4.3/relnotes.txt\n\
  Resolving downloads.vendor.com...192.168.1.13\nConnecting to downloads.vendor.com...192.168.1.13:80...connected.\n\
  HTTP request sent, waiting...200 OK\nLength: 292 [text/plain]\nSaving to: relnotes.txt\n\
  100%======================> 292 KB\n2011-03-07 17:19:08 (292 KB/s) - relnotes.txt\n\
  Got release notes:\n*** START OF RELEASE NOTES\nBefore installing product, tune\
  \ the kernel as follows:\necho 65536 > /proc/sys/file-max\necho 2097152 > /proc/sys/kernel/shm\n\
  echo 2147483648 > /proc/sys/kernel/shmmax\necho 4096 > /proc/sys/kernel/shmn\necho\
  \ 128 > /proc/sys/kernel/sem\n*** END OF RELEASE NOTES\nSetting sys.fs.file-max\
  \ to 65536...\n...- sys.fs.file-max=65536\nSetting sys.kernel.shm to 2097152...\n\
  sys.kernel.shm=2097152\nSetting sys.kernel.shmmax to 2147483648...\nsys.kernel.shmmax=2147483648\n\
  Setting sys.kernel.shmn to 4096...\nsys.kernel.shmn=4096\nSetting sys.kernel.sem\
  \ to 128...\nsys.kernel.sem=128\nLoading new kernel.\n$\n```\n\n### `installproduct.sh`\n\
  \n如前所述，`tr` 的功能不仅仅是大小写转换。使用非对称集合，可以压缩特定的字符以满足更严格的要求。此来自网站论坛的 `access_log` 包含大量数据，但并不容易解析。在这个示例中，`cut`\
  \ 语句仅从日志中提取 URL 请求：\n\n```\n $ cut -d'\"' -f2 access_log\nGET /forum/viewforum.php?f=2\
  \ HTTP/1.1\nGET /forum/templates/subSilver/images/folder_lock_new.gif HTTP/1.1\n\
  GET /forum/templates/subSilver/images/folder_lock.gif HTTP/1.1\nGET /forum/viewtopic.php?p=884&sid=a2738b9fc491726ac290aa7a9447291b\
  \ HTTP/1.1\nGET /forum/viewforum.php?f=2&sid=a705161ccdf318a111c67dcde0e1bd03 HTTP/1.0\n\
  GET /forum/profile.php?mode=register&sid=a705161ccdf318a111c67dcde0e1bd03 HTTP/1.0\n\
  GET /forum/viewtopic.php?p=840&sid=88c87f962c9ee6bdfff8b5fba9c728a8 HTTP/1.1\nGET\
  \ /forum/viewtopic.php?p=848 HTTP/1.1\n```\n\n如果去掉 `?`、`&` 和 `=` 符号，解释将会容易得多。简单的\
  \ `tr` 语句将此类字符替换为空格，现在可以轻松将文本传递给 `read` 语句了。\n\n\n\n\n\n```\n $ cut -d'\"' -f2 access_log\
  \ | tr '[?&=]' ' '\nGET /forum/viewforum.php f 2 HTTP/1.1\nGET /forum/templates/subSilver/images/folder_lock_new.gif\
  \ HTTP/1.1\nGET /forum/templates/subSilver/images/folder_lock.gif HTTP/1.1\nGET\
  \ /forum/viewtopic.php p 884 sid a2738b9fc491726ac290aa7a9447291b HTTP/1.1\nGET\
  \ /forum/viewforum.php f 2 sid a705161ccdf318a111c67dcde0e1bd03 HTTP/1.0\nGET /forum/profile.php\
  \ mode register sid a705161ccdf318a111c67dcde0e1bd03 HTTP/1.0\nGET /forum/viewtopic.php\
  \ p 840 sid 88c87f962c9ee6bdfff8b5fba9c728a8 HTTP/1.1\nGET /forum/viewtopic.php\
  \ p 848 HTTP/1.1\n$ cut -d'\"' -f2 access_log | tr '[?&=]' ' ' | while read METHOD\
  \ PAGE ARGUMENTS\n> do\n>   echo Page requested was $PAGE\n>   echo Arguments were\
  \ $ARGUMENTS\n> done\nPage requested was /forum/viewforum.php\nArguments were f\
  \ 2 HTTP/1.1\nPage requested was /forum/templates/subSilver/images/folder_lock_new.gif\n\
  Arguments were HTTP/1.1\nPage requested was /forum/templates/subSilver/images/folder_lock.gif\n\
  Arguments were HTTP/1.1\nPage requested was /forum/viewtopic.php\nArguments were\
  \ p 884 sid a2738b9fc491726ac290aa7a9447291b HTTP/1.1\nPage requested was /forum/viewforum.php\n\
  Arguments were f 2 sid a705161ccdf318a111c67dcde0e1bd03 HTTP/1.0\nPage requested\
  \ was /forum/profile.php\nArguments were mode register sid a705161ccdf318a111c67dcde0e1bd03\
  \ HTTP/1.0\nPage requested was /forum/profile.php\nArguments were mode register\
  \ agreed true sid a705161ccdf318a111c67dcde0e1bd03 HTTP/1.0\nPage requested was\
  \ /forum/posting.php\nArguments were mode newtopic f 2 sid a705161ccdf318a111c67dcde0e1bd03\
  \ HTTP/1.0\nPage requested was /forum/login.php\nArguments were redirect posting.php\
  \ mode newtopic f 2 sid a705161ccdf318a111c67dcde0e1bd03 HTTP/1.0\nPage requested\
  \ was /forum/posting.php\nArguments were mode newtopic f 2 sid a705161ccdf318a111c67dcde0e1bd03\
  \ HTTP/1.0\nPage requested was /forum/login.php\nArguments were redirect posting.php\
  \ mode newtopic f 2 sid a705161ccdf318a111c67dcde0e1bd03 HTTP/1.0\nPage requested\
  \ was /forum/viewtopic.php\nArguments were p 840 sid 88c87f962c9ee6bdfff8b5fba9c728a8\
  \ HTTP/1.1\nPage requested was /forum/viewtopic.php\nArguments were p 848 HTTP/1.1\n\
  ```\n\n`tr` 的另一个有用但较少为人知的选项是 `-d`。它会删除提供给它的任何字符。它的许多用途之一是将以太网（MAC）地址从常见的冒号分隔的十六进制字节格式（`70:5a:b6:2a:e8:b8`）转换为同样常用的无冒号格式（`705ab62ae8b8`）。`tr\
  \ -d` 可以完美地做到这一点。\n\n```\n $ ifconfig -a|grep HW \neth0      Link encap:Ethernet\
  \  HWaddr 70:5a:b6:2a:e8:b8\neth0  Link encap:Ethernet  HWaddr 70:5a:b6:2a:e8\n\
  pan0  Link encap:Ethernet  HWaddr 64:bc:ab:d2:e\nboxnet0 Link encap:Ethernet  HWaddr\
  \ 0a:00:27:00:00\nwlan0  Link encap:Ethernet  HWaddr 70:1a:04:e3:b1\n$ ifconfig\
  \ -a|grep HW | tr -d ':' | cut -c-10-\neth0  705ab62ae8b8\npan0  64bcabd2e\nboxnet0\
  \  0a00270000\nwlan0  701a04e3b1\n$\n```\n\n### uniq\n\n初看之下，`uniq` 似乎是一个显示文件中唯一行的工具。实际上，它会删除连续的行，但如果相同的行在输入后面出现，它会再次显示。因此，常见的组合是\
  \ `sort | uniq`，虽然使用 `sort -u` 可以更高效地完成。\n\n询问 `uniq` 有什么用是一个合理的问题，答案是 `uniq` 在它能做的事情上非常灵活。在前面的章节，`uniq`\
  \ 配合 `-w` 和 `-d` 标志来查找那些重复项。`-w` 标志告诉它只比较前 `N` 个字符（这些字符将是不同的），而 `-d` 标志（如果输入已排序）只列出那些重复项。`uniq`\
  \ 是一种非常实用的过滤结果的方法，通过使用 `uniq` 可以自动计数结果的数量，这在 `for` 或 `while` 循环脚本中会很繁琐且耗时。\n\n`uniq`\
  \ 命令也相当灵活，如果传递了第二个文件名，它将输出写入文件而不是 `stdout`，如果文件已存在。`-d` 的补全是 `-u`；`uniq` 正常情况下会打印每个唯一行；如果条目出现两次，它将不会显示。这三种调用——`uniq`\
  \ 单独使用、`uniq -u` 以及 `uniq -d`——提供了过滤几乎任何输入的灵活方法。\n\n### wc\n\n`wc` 代表 Word Count（字数），尽管它也可以计算字符和行。这使得它成为计数任何类型项目的灵活工具。它最常用于计算文件的行数，或者（像大多数\
  \ Unix 工具一样）发送给它的其他数据，但它也可以计算字符和单词。\n\n尽管它通常用于单个文件或通过管道解析标准输入，`wc` 还能同时计算并汇总多个文件。`wc`\
  \ 的三个主要标志是 `-w`（计算单词）、`-c`（计算字符）和 `-l`（计算行）。在这些中，常用行计数。计算文件的行数通常有用；计算管道结果的数量也非常有用。书中的许多代码和配方使用\
  \ `wc -l` 作为自动计数结果数量的方法。\n\n所有 `wc` 的实现在处理多个文件时都会对其输出进行填充，以便列对齐。这在编写脚本时可能会很麻烦，因为没有带填充的“\
  \ 14”并不易于解释为数字十四的简单“14”。Unix 的 `wc` 实现总是会填充，因此需要一种解决方法；`awk` 会很乐地删除空白字符，所以下面的命令运行良好。这段代码显示了带有填充的多个文件以及这如何影响给变量赋值文件长度的常见任务。\n\
  \n```\n $ wc -l /etc/hosts*\n  18 /etc/hosts\n  14 /etc/hosts.allow\n  87 /etc/hosts.deny\n\
  \  119 total\n$ wc -l /etc/hosts\n  18 /etc/hosts\n$ num_hosts='wc -l /etc/hosts\
  \ | cut -d' ' -f1'\n$ echo $num_hosts\n18 /etc/hosts\n$ num_hosts='wc -l /etc/hosts\
  \ | awk '{ print $1 }''\n$ echo $num_hosts\n18\n$\n```\n\n\n\n\n`wc` 的 GNU 实现在当只有\
  \ `stdin` 或单个文件待列出时，不会进行任何填充。这意味着如果只有一个文件，那么直接从 `wc` 输出中设置 `num_hosts` 的那种较浅的初始尝试在\
  \ GNU 环境下是可行的。在 `wc` 的其他实现中，则需要使用 `awk` 来获取实际数字并忽略填充部分。\n\n在本章稍早的世界杯脚本中，`NUMTEAMS`\
  \ 变量是按照这种方式定义的。为了编写可移植的脚本，最安全的做法是假设 `wc` 的输出没有经过安全填充；如果脚本运行在相对现代的机器上且不在密集循环中，这种额外的开销是微乎其微的\n\
  \n```\nTEAMS='wc -l $TEAMS | awk '{ print $1 }'\n```\n\n这个示例完全没有产生主要开销，并确保了脚本更好的跨平台移植性。因此，在解析\
  \ `wc` 的输出时，除非你确定它将在单个输入上运行 GNU 版 `wc`，否则使用这种方法最好。在这种情况下，你可以使用轻量级的 `cut` 工具，例如：\n\
  \n```\nTEAMS='wc -l $TEAMS | cut -d ' ' -f1'\n```\n\n## 总结\n\nUnix 和 Linux 在处理文本方面非常灵活。大多数配置设置都以文本格式存储，并且是工具无关的，因此可以使用任意数量的工具来处理它们。这赋予了用户和系统管理员巨大的权力，因为他们并不局限于使用单一工具来编辑\
  \ `/etc/hosts` 并使用另一个自定义工具来编辑 `/etc/passwd`。相反，有一整套工具可以处理几乎任何内容，而且这些工具可以以各种不同的方式组合。这种让一切变得开放且可访问的清晰设计决策是\
  \ Unix 模型的一个核心优势。\n\n下一章将建立在本章和上一章的基础上，介绍实用的系统管理任务。\n\n# 第 14 章：系统管理工具\n\n系统管理是\
  \ Shell 脚本最常见的用途。Unix 和 Linux 中的许多命令是为了配置系统本身而存在的，因此大多数脚本为此目的编写的这并不意外。本章旨在提供一些真实世界的示例，说明如何使用这些命令，特别是在\
  \ Shell 脚本中如何有效地使用它们来实现系统管理任务的自动化、扩展和简化。它讨论了与这些工具相关的一些陷阱和注意事项，以及它们在实际生活中的用法。这应该为书中其余部分提供坚实的基础，其余部分由完整的、深入的配方组成，更多关注配方实际的作用，而不是底层工具本身。\n\
  \n## basename\n\n`basename` 返回文件的实际文件名，并删除任何目录路径。它最常用的用法是配合脚本的 `$0` 变量来确定它是如何被调用的。这对于调试和通用输出信息很有用。确定程序被调用的名称的功能也被某些系统实用程序用于修改它们的实际行为。`mount`\
  \ 和 `umount` 命令共享许多公共代码，但运行 `umount /home` 的效果与运行 `mount /home` 完全不同——完全相反。同一个程序通过检查它被调用的名称并采取相应行动来处理这个问题。这消除了冗余，并将所有的文件系统挂载和卸载代码保持同一个程序中。一个直接的例子是后面提到的\
  \ `dos2unix` 转换工具。DOS（以及 Microsoft Windows）文本文件格式使用 CR+LF，而 Unix（以及 Linux）仅使用 LF。这种差异已经存在了很久，而且可能永远无法得到调和。存在两个转换工具\
  \ `unix2dos` 和 `dos2unix` 用于在这两种文本文件格式之间进行简单的转换。这些工具并非在每个平台上都可用，而且存在各种影响这两种非常相似格式之间看似简单的翻译的怪癖，但\
  \ `sed` 是执行此类转换的极佳方法。`http://sed.sourceforge.net/sed1line.txt` 页面包含了大量实用的 `sed`\
  \ 单行命令，其中包含本脚本用到的一些。\n\n![note.ai](img/note_fmt.gif)\n\n`tofrodos` 包提供了 `fromdos`\
  \ 和 `todos` 命令，这是实现此功能的另一种方法。\n\n初始的 `ls -il` 显示 `dos2unix` 和 `unix2dos` 是硬链接；它们是文件，具有两个目录条目和两个不同的名称。`diff`\
  \ 证实了这一点。然而，的行为取决于调用方式。\n\n![download.eps](img/download_fmt.gif)\n\n```\n$ ls -il\
  \ dos2unix unix2dos\n5161177 -rwxr-xr-x 2 steve steve 613 Feb 21 14:55 dos2unix\n\
  5161177 -rwxr-xr-x 2 steve steve 613 Feb 21 14:55 unix2dos\n$ diff dos2unix unix2dos\n\
  $ echo $\n0\n$ cat dos2unix\n#!/bin/bash\n# from http://sed.sf.net/sed1line.txt:\n\
  # sed 's/.$//'                   \n```\n\n```bash\n#!/bin/bash\n# from http://sed.sf.net/sed1line.txt:\n\
  # sed 's/.$//'                   \nif [ ! -f \"$1\" ]; then\n  echo \"Usage: $0\
  \ filename\"\n  exit 1\nfi\ncase $(basename \"$0\") in\n  unix2dos)\n    sed 's/.$//'\
  \ \"$1\" > \"$1.tmp\" && mv \"$1.tmp\" \"$1\"\n    ;;\n  dos2unix)\n    sed 's/.$//'\
  \ \"$1\" > \"$1.tmp\" && mv \"$1.tmp\" \"$1\"\n    ;;\n  *)\n    echo \"Usage: $0\
  \ {unix2dos|dos2unix} filename\"\n    exit 1\n    ;;\nesac\nexit 0\n```\n\n## dos2unix\
  \ (与 unix2dos 相同)\n\n`cat -v` 将多余 CR 字符显示为 `^M`。同一个脚本根据如何作为 unix2dos 调用来转换方向，或者默认情况下（如果通过其他名称调用），它将作为\
  \ dos2unix。\n\n```\n$ cat -v hello.txt\nline1^M\nline2^M\nline3^M\n$ ./dos2unix\
  \ hello.txt\nline1\nline2\nline3\n$ ./unix2dos hello.txt\n$ cat -v hello.txt\nline1^M\n\
  line2^M\nline3^M\n$\n```\n\n## date\n\n`date` 命令是一个非常有用的工具。它最常用于创建时间戳，特别是记录发生的事件时。`syslog`\
  \ 工具为它记录的事件添加时间戳，因此 `/var/log/messages`、`syslog`、`auth.log` 等此类文件开头都包含这个关键元素。这对于理清事件链以及不同日志文件（甚至不同机器）中捕获的不同事件如何相互关联至关重要。\n\
  \n### date 的典型用法\n\n在系统管理中，`date` 命令最常用的两种用法可能是记录结果和状态消息（特别是记录到文件时），以及创建具有意义名称的临时文件。这里提供了这两种技术的脚本，随后是通过\
  \ `date` 命令高级功能可以实现的一些更复杂的操作。第一个配方模拟了本章稍后描述的 logger 设施。第二个配方使用 `date` 创建一组唯一且包含信息的命名日志文件。在这个示例中，时间戳对于追踪\
  \ Web 服务器的错误非常有用。一个常用的 NTP 源也特别有用，尽管如果能够确定它们之间的时间差，即使是完全独立的系统也可以进行比较。\n\n\n\n\n\
