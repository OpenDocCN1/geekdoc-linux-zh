- pgno: 326
  md: '# The alias Command


    An alias is a shorthand notation provided by the shell to allow command customization.
    The shell keeps a list of aliases that is searched when a command is entered before
    any other substitution occurs. If the first word of a command line is an alias,
    it is replaced by the text of the alias.


    An alias is defined by using the alias command. The format is


    ```

    alias name=string

    ```


    where name is the name of the alias, and string is any string of characters. For
    example,


    ```

    alias ll=''ls -l''

    ```


    assigns ll -l to the alias ll. Now when the command ll is entered by the user,
    the shell silently replaces it with ls -l. Even better, you can type arguments
    after the alias name on the command line, as in


    ```

    ll *.c

    ```


    which transforms into this after alias substitution has been performed:


    ```

    ls -l *.c

    ```


    The shell performs its normal command-line processing both when the alias is set
    and when it is used, so quoting can be tricky. For example, recall that the shell
    keeps track of your current working directory inside a variable called PWD:


    ```

    $ cd /users/steve/letters

    $ echo $PWD

    /users/steve/letters

    $

    ```


    You can create an alias called dir that gives you the base name of your current
    working directory by using the PWD variable and one of the parameter substitution
    constructs:


    ```

    alias dir="echo ${PWD##*/}"

    ```


    This seems reasonable, but let''s see how this alias works in practice:


    ```

    $ alias dir="echo ${PWD##*/}"    *Define alias*

    $ pwd                              *Where are we?*

    /users/steve

    $ dir                              *Execute alias*

    steve

    $ cd letters                      *Change directory*

    $ dir                              *Execute the alias again*

    steve

    $ cd /usr/spool                   *One more try*

    $ dir

    steve

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'No matter the current directory, the `dir` alias prints out steve. That’s because
    we weren’t careful about quotes when we defined the dir alias. Recalling that
    the shell performs parameter substitution inside double quotes, the problem is
    that the shell evaluated `${PWD##*/}` at the time the alias was defined. This
    means that the `dir` alias was essentially defined as if we’d typed in the following:


    ```

    ```shell

    $ alias dir="echo steve"

    ```

    ```


    No wonder it didn’t work!


    The solution is to use single rather than double quotes when defining the `dir`
    alias to defer the parameter substitution until the alias is executed:


    ```

    ```shell

    $ alias dir=''echo ${PWD##*/}''        Define alias

    $ pwd                                  Where are we?

    /users/steve

    $ dir                                  Execute alias

    steve

    $ cd letters                           Change directory

    $ dir                                  Execute alias again

    letters

    $ cd /usr/spool                        One more try

    $ dir

    spool

    $

    ```

    ```


    If an alias ends with a space, the word following the alias is also checked for
    alias substitution. For example:


    ```

    ```shell

    alias nohup="/bin/nohup "

    nohup ll

    ```

    ```


    causes the shell to perform alias checking on the string `ll` after replacing
    `nohup` with `/bin/nohup`.


    Quoting a command or prefacing it with a backslash prevents alias substitution.
    For example:


    ```

    ```shell

    $ ''\ll''

    ksh: ll: command not found

    $

    ```

    ```


    # The format


    ```

    ```shell

    alias name

    ```

    ```


    causes the value of the alias name to be listed, and the alias command without
    arguments causes all aliases to be listed.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'The following aliases are automatically defined when the Korn shell starts
    up:


    ```

    autoload=''typeset -fu''

    functions=''typeset -f''

    history=''fc -l''

    integer=''typeset -i''

    local=typeset

    nohup=''nohup ''

    r=''fc -e -''

    suspend=''kill -STOP $$''

    ```


    Note from the preceding example that r is actually an alias for the fc command
    with the -e option, and history is an alias for fc -l. By comparison, Bash doesn’t
    automatically define any aliases by default.


    # Removing Aliases


    The unalias command is used to remove aliases from the alias list. The format
    is


    ```

    unalias name

    ```


    which removes the alias name and


    ```

    unalias -a

    ```


    which removes all aliases.


    If you develop a set of alias definitions that you like to use during your login
    sessions, you may want to define them inside your ENV file so that they will always
    be available for you to use, as they don’t otherwise migrate to subshells.


    # Arrays


    Both Korn and Bash provide a limited array capability. Bash arrays may contain
    an unlimited number of elements (subject to memory limitations); Korn shell arrays
    are limited to 4096 elements. Array indexing in both shells starts at zero.


    An array element is accessed with a subscript, which is an integer-valued expression
    enclosed within square brackets. You don’t declare the maximum size of a shell
    array either, you simply assign values to elements as needed. The values that
    you can assign are the same as for ordinary variables:


    ```

    $ arr[0]=hello

    $ arr[1]="some text"

    $ arr[2]=/users/steve/memos

    $

    ```


    To retrieve an element from an array, you need to write the array name followed
    by an open bracket, the element number and a close bracket. The entire construct
    must also be'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'enclosed inside a pair of curly braces, and the whole element is preceded by
    a dollar sign. Sounds complicated? It’s not:


    ```

    $ echo ${array[0]}

    hello

    $ echo ${array[1]}

    some text

    $ echo ${array[2]}

    /users/steve/memos

    $ echo $array

    hello

    $

    ```


    As you can see from the preceding example, if no subscript is specified, element
    zero is used.


    If you forget the curly braces when performing the substitution, nothing breaks,
    it just produces a result that’s not quite what you expect:


    ```

    $ echo $array[1]

    hello[1]

    $

    ```


    The value of array is substituted (hello—the value of array[0]) and then echoed
    along with [1 . (Note that because the shell does filename substitution after
    variable substitution, the shell would attempt to match the pattern hello[1 against
    the files in your current directory.)


    The construct [*] can be used as a subscript to produce all the elements of an
    array on the command line, with each element separated by a space.


    ```

    $ echo ${array[*]}

    hello some text /users/steve/memos

    $

    ```


    The construct ${#array[*]} can be used to find out the number of elements in array.


    ```

    $ echo ${#array[*]}

    3

    $

    ```


    The number reported is the actual number of values stored within array elements,
    not the largest subscript used to store an element inside the array.


    ```

    $ array[10]=foo

    $ echo ${array[*]}                 Display all elements

    hello some text /users/steve/memos foo

    $ echo ${#array[*]}                 Number of elements

    4

    $

    ```


    An array that has noncontiguous values defined is known as a sparse array, in
    case you’ve ever heard that phrase before.


    You can declare an array of integers by specifying the array name to typeset -i:


    ```

    typeset -i data

    ```'
