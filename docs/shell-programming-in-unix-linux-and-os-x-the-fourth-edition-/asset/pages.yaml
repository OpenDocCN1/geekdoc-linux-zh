- pgno: 134
  md: "Here the shell executes `pwd`, inserts its output on the command line, and\
    \ then executes the `echo`. Note that in the following section, back quotes can\
    \ be used in all the places where the `$(...)` construct is used and, of course,\
    \ vice-versa with the examples in this section.\n\n# The `$(...)` Construct\n\n\
    All modern Unix, Linux and any other POSIX-compliant shells support the newer\
    \ and preferred `$(...)` construct for command substitution. The general format\
    \ is\n\n`$(command)`\n\nwhere, just as with back quotes, `command` is the name\
    \ of the command whose standard output is to be substituted on the command line.\
    \ For example:\n\n```\n```sh\n$ echo The date and time is: $(date)\nThe date and\
    \ time is: Wed Aug 28 14:28:23 EDT 2002\n$\n```\n```\n\nThis construct is better\
    \ than back quotes for a couple of reasons. First, complex commands that use combinations\
    \ of forward and back quotes can be difficult to read, particularly if the typeface\
    \ you’re using doesn’t visually differentiate between single and back quotes;\
    \ second, `$(...)` constructs can be easily nested, allowing command substitution\
    \ within command substitution. Although nesting can also be performed with back\
    \ quotes, it’s trickier. You’ll see an example of nested command substitution\
    \ later in this section.\n\nLet’s emphasize something important: you aren’t restricted\
    \ to invoking a single command between the parentheses. Several commands can be\
    \ executed if separated by semicolons; and, more commonly, you can also use command\
    \ pipelines.\n\nHere’s a modified version of the `nu` program that displays the\
    \ number of logged-in users:\n\n```\n```sh\n$ cat nu\n echo There are $(who |\
    \ wc -l) users logged in\n$ nu                         Execute it\nThere are 13\
    \ users logged in\n$\n```\n```\n\nBecause single quotes protect everything, the\
    \ following output should be clear:\n\n```\n```sh\n$ echo '$(who | wc -l) tells\
    \ how many users are logged in'\n$(who | wc -l) tells how many users are logged\
    \ in\n$\n```\n```\n\nBut command substitution is interpreted inside double quotes:\n\
    \n```\n```sh\n$ echo \"You have $(ls | wc -l) files in your directory\"\nYou have\
    \       7 files in your directory\n$\n```\n```"
  merge: -1
