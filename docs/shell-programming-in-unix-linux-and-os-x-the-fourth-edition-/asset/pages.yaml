- pgno: 28
  md: 'renamed, and the second argument is the new name. So, to change the name of
    the file saved_names to hold_it, for example, the following command would do the
    trick:


    ```

    ```sh

    $ mv saved_names hold_it

    $

    ```

    ```


    Be careful! When executing an mv or cp command, the Unix system does not care
    whether the file specified as the second argument already exists. If it does,
    the contents of the file will be lost. For example, if a file called old_names
    exists, executing the command


    ```

    ```sh

    cp names old_names

    ```

    ```


    would copy the filenames to old_names, destroying the previous contents of old_names
    in the process. Similarly, the command


    ```

    ```sh

    mv names old_names

    ```

    ```


    would rename names to old_names, even if the file old_names existed prior to execution
    of the command.


    # Removing a File: The `rm` Command


    Use the rm command to remove a file from the system. The argument to rm is simply
    the name of the file to be removed:


    ```

    ```sh

    $ rm hold_it

    $

    ```

    ```


    You can remove more than one file at a time with the rm command by simply specifying
    all such files on the command line. For example, the following would remove the
    three files wb, collect, and mon:


    ```

    ```sh

    $ rm wb collect mon

    $

    ```

    ```


    # Working with Directories


    Suppose that you had a set of files consisting of various memos, proposals, and
    letters. Further suppose that you had another set of files that were computer
    programs. It would seem logical to group this first set into a directory called
    documents and the latter into a directory called programs. Figure 1.1 illustrates
    such a directory organization.


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_28_0.png)


    Figure 1.1   Example directory structure'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'The file directory `documents` contains the files plan, dact, sys.A, new.hire,
    no.JSK, and AMG.reply. The directory `programs` contains the files wb, collect,
    and mon. At some point, you may decide to further categorize the files in a directory.
    This can be done by creating subdirectories and then placing each file into the
    appropriate subdirectory. For example, you might want to create subdirectories
    called memos, proposals, and letters inside your documents directory, as shown
    in Figure 1.2.


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_29_0.png)


    *Figure 1.2*  Directories containing subdirectories


    `documents` contains the subdirectories memos, proposals, and letters. Each of
    these subdirectories in turn contains two files: memos contains plan and dact;
    proposals contains sys.A and new.hire; and letters contains no.JSK and AMG.reply.


    Although each file in a given directory must have a unique name, files contained
    in different directories do not. So you could have a file in your programs directory
    called dact, even though a file by that name also exists in the memos subdirectory.


    # The Home Directory and Pathnames


    The Unix system always associates each user of the system with a particular directory.
    When you log in to the system, you are placed automatically into your own directory
    (called your *home directory*).


    Although the location of users’ home directories can vary from one system to the
    next, let’s assume that your home directory is called steve and that this directory
    is actually a subdirectory of a directory called users. Therefore, if you had
    the directories documents and programs, the overall directory structure would
    actually look something like Figure 1.3. A special directory named / (pronounced
    “slash”) is shown at the top of the directory tree. This directory is known as
    the root.


    Whenever you are “inside” a particular directory (called your *current working
    directory*), the files contained within that directory are immediately accessible,
    without specifying any path information. If you want to access a file from another
    directory, you can either first issue a command to “change” to the appropriate
    directory and then access the particular file, or you can specify the particular
    file by its *pathname*.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/29b87b4d3daf7eb41fe5066130730f4c_30_0.png)


    Figure 1.3　Hierarchical directory structure


    A pathname enables you to uniquely identify a particular file to the Unix system.
    In the specification of a pathname, successive directories along the path are
    separated by the slash character `/`. A pathname that begins with a slash character
    is known as a full or absolute pathname because it specifies a complete path from
    the root. For example, the pathname `/users/steve` identifies the directory steve
    contained within the directory users. Similarly, the pathname `/users/steve/documents`
    references the directory documents as contained in the directory steve within
    users. As a final example, the pathname `/users/steve/documents/letters/AMG.reply`
    identifies the file AMG.reply contained along the appropriate directory path.


    To help reduce the typing that would otherwise be required, Unix provides certain
    notational conveniences. A pathname that does not begin with a slash is known
    as a relative pathname: the path is relative to your current working directory.
    For example, if you just logged in to the system and were placed into your home
    directory `/users/steve`, you could directly reference the directory documents
    simply by typing `documents`. Similarly, the relative pathname `programs/mon`
    could be typed to access the file mon contained inside your programs directory.


    By convention, `..` always references the directory that is one level higher than
    the current directory, known as the parent directory. For example, if you were
    in your home directory `/users/steve`, the pathname `..` would reference the directory
    users. If you had issued the appropriate command to change your working directory
    to `documents/letters`, the pathname `..` would reference the documents directory,
    and `../../..` would reference the directory steve, and `../proposals/new.hire`
    would reference the file new.hire contained in the proposals directory. There
    is usually more than one way to specify a path to a particular file, a very Unix-y
    characteristic.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Another notational convention is the single period ., which always refers to
    the current directory. That’ll become more important later in the book when you
    want to specify a shell script in the current directory, not one in the PATH.
    We’ll explain this in more detail soon.


    # Displaying Your Working Directory: The `pwd` Command


    The pwd command is used to help you “get your bearings” by telling you the name
    of your current working directory.


    Recall the directory structure from Figure 1.3. The directory that you are placed
    in after you log in to the system is called your home directory. You can assume
    from Figure 1.3 that the home directory for the user steve is `/users/steve`.
    Therefore, whenever steve logs in to the system, he will automatically be placed
    inside this directory. To verify that this is the case, the pwd (print working
    directory) command can be issued:


    ```

    ```shell

    $ pwd

    /users/steve

    $

    ```

    ```


    The output from the command verifies that steve’s current working directory is
    `/users/steve`.


    # Changing Directories: The `cd` Command


    You can change your current working directory by using the cd command. This command
    takes as its argument the name of the target or destination directory.


    Let’s assume that you just logged in to the system and were placed in your home
    directory, `/users/steve`. This is depicted by the arrow in Figure 1.4.


    You know that two directories are directly “below” steve’s home directory: documents
    and programs. This can be easily verified at the terminal by issuing the ls command:


    ```

    ```shell

    $ ls

    documents

    programs

    $

    ```

    ```


    The ls command lists the two directories documents and programs the same way it
    listed other ordinary files in previous examples.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/29b87b4d3daf7eb41fe5066130730f4c_32_0.png)


    Figure 1.4  Current working directory is steve


    To change your current working directory, issue the cd command, followed by the
    name of the new directory:


    ```

    ```shell

    $ cd documents

    $

    ```

    ```


    After executing this command, you will be placed inside the documents directory,
    as depicted in Figure 1.5.


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_32_1.png)


    Figure 1.5  cd documents'
  merge: -1
