- pgno: 308
  md: '# Interactive and

    Nonstandard Shell Features


    In this chapter you’ll learn about shell features that are useful to interactive
    users or not part of the POSIX shell standard. These features are available in
    Bash and the Korn shell, the two most commonly available POSIX-compliant shells
    across Unix, Linux, and Mac systems.


    The Korn shell was developed by David Korn at AT&T Bell Laboratories and was designed
    to be “upward compatible” with both the System V Bourne shell and the POSIX standard
    shell. It is now widely available across all major *nix platforms and if you have
    access to a command line, you probably have ksh available to you.


    Bash (short for Bourne-Again Shell) was developed by Brian Fox for the Free Software
    Foundation. It was also designed to be compatible with the System V Bourne shell
    and the POSIX standard shell, and additionally contains many extensions from the
    Korn and C shells. Bash is the standard shell on Linux systems and on most modern
    Unix and Mac systems it has replaced the Bourne shell (in fact, if you are using
    sh you’re probably really using bash and just don’t know it).


    Except for a few minor differences, Bash and the Korn shell provide all the POSIX
    standard shell’s features and add many new ones. To give you an idea of the compatibility
    of these shells with the POSIX standard, all shell programs presented in this
    book work under both Bash and the Korn shell.


    We’ll note any non-standard features that we discuss in this chapter, and Table
    14.4 at the end of this chapter lists the features supported by the different
    shells.


    # Getting the Right Shell


    Up to this point we’ve dropped commands into a file and run it as a shell program
    without really discussing what shell will actually read the lines and run the
    program. By default, shell programs are run by your login shell, so it hasn’t
    been a big issue.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'It turns out that all the major interactive shells allow you to specify which
    shell—actually, which program of the thousands included in a Unix or Linux distribution—should
    be used to run the file. If the first two characters on the first line of a file
    are #!, the remainder of the line specifies an interpreter for the file. So


    ```

    #!/bin/ksh

    ```


    specifies the Korn shell and


    ```

    #!/bin/bash

    ```


    specifies Bash. If you use constructs or notational conventions specific to one
    shell, you can use this feature to force that shell to run your programs, avoiding
    compatibility problems.


    Since you can specify any program you want, a Perl program beginning with


    ```

    #!/usr/bin/perl

    ```


    forces the shell to invoke /usr/bin/perl to interpret the lines within the file.


    You have to use this feature with caution, however, because many programs, such
    as Perl, don’t reside in a standard place on every Unix system. Also, this is
    not specified by the POSIX standard, even though it’s found in every modern shell
    and is even implemented at the operating system level on many Unix versions.


    Most commonly you’ll see system shell programs use this notation to ensure that
    Bourne Shell is used regardless of the user’s login shell by beginning with


    ```

    #!/bin/sh

    ```


    # The ENV File


    When you start the shell, one of the first things it does is look in your environment
    for a variable called ENV. If it finds it and it’s non-null, the file specified
    by ENV will be executed, much like the .profile is executed when logging in. The
    ENV file contains commands to set up the shell’s environment. Throughout this
    chapter, we’ll mention various things that you may want to put into this file.


    If you do decide to have an ENV file, you should set and export the ENV variable
    inside your .profile file:


    ```

    ```sh

    $ cat .profile

    ...

    export ENV=$HOME/.alias

    ...

    $

    ```

    ```


    Note the shortcut in use above: Instead of assigning the variable a value, then
    calling export, it turns out you can do both on the same line for efficiency.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'For Bash users, the ENV file is read only when Bash is invoked with the name
    sh, with the --posix command-line option, or after set -o posix is executed (all
    of which force POSIX standard compliance). By default, when a non-interactive
    Bash shell is started (for example, when you run a shell program), it reads commands
    from the file specified by the BASH_ENV environment variable, and when an interactive
    Bash shell is started (for example, by typing bash at the command prompt), it
    doesn’t.


    If you’re running an older system, you should also export a variable called SHELL
    inside your .profile file.


    ```

    ```sh

    $ grep $SHELL .profile

    SHELL=/bin/ksh ; export SHELL

    $

    ```

    ```


    This variable is used by certain applications (such as vi) to determine what shell
    to start up when you execute a shell escape. In such cases, you want to make sure
    that each time you start up a new shell, you get the shell you want and not an
    older Bourne shell.


    Probably, though, SHELL will already be set by your login shell. You can test
    it with


    ```

    ```sh

    $ echo $SHELL

    /bin/bash

    $

    ```

    ```


    Also note that the previous example demonstrates yet another way to set and export
    a variable, this time by having two separate commands on the same line, separated
    by a semicolon. Why the inconsistency? Because Unix is so flexible that you’ll
    find it’s common for shell programs you read—and users you work with—to accomplish
    the same task multiple ways. Might as well get used to variations in notation!


    # Command-Line Editing


    Line edit mode is a feature of the shell that allows you to edit a command line
    in a manner that mimics features found in two popular screen editors. The POSIX
    standard shell provides the capability to mimic vi and both Bash and the Korn
    shell also support an emacs line edit mode. We list the complete set of vi commands
    in Table A.4 in Appendix A.


    If you’ve used either of these screen-based text editors, you’ll find that the
    built-in line editors in the shell are faithful reproductions from a functional
    perspective. This capability is one of the most useful features in the shell.


    To turn on a line edit mode, use the set command with the -o mode option, where
    mode is either vi or emacs:


    ```

    ```sh

    $ set -o vi                         Turn on vi mode

    ```

    ```


    Put this in your .profile or ENV file to automatically start up the shell with
    one of the edit modes turned on.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Command History


    Regardless of which shell you use, it keeps a history of all your previously entered
    commands. Each time you press the Enter key to execute a command, that command
    gets added to the end of your history list.


    Depending on your settings, your command history could even be saved to a file
    and restored between login sessions, so you can quickly access commands from previous
    sessions.


    By default, the history list is kept in a file in your home directory under the
    name `.sh_history` (`.bash_history` for Bash). You can change this filename to
    anything you want by setting the variable `HISTFILE` to the name of your history
    file. This variable can be set and exported in your `.profile` file.


    There is a limit to the number of commands the shell stores. The minimum value
    is 128 commands but most modern shells save 500 or more of your commands on the
    list. Each time you log in, the shell automatically truncates your history file
    to this length.


    You can control the size of your history file through the `HISTSIZE` variable.
    If the default size isn’t adequate for your needs, set the `HISTSIZE` variable
    to a larger value, such as 500 or 1000. The value you assign to `HISTSIZE` can
    be set and exported in your `.profile` file:


    ```

    ```sh

    $ grep HISTSIZE .profile

    HISTSIZE=500

    export HISTSIZE

    $

    ```

    ```


    Don’t go crazy with a massive history size, however: The larger the value, the
    more disk space you will need to store the history file, and the longer it will
    take the shell to search through the list when you access previous commands.


    # The `vi` Line Edit Mode


    After turning on the vi line editor feature, you will be typing all subsequent
    commands in what vi users would think of as *input* mode. You probably won’t even
    notice anything different because you can type in and execute commands exactly
    the same way that you do with the default shell input prompt:


    ```

    ```sh

    $ set -o vi

    $ echo hello

    hello

    $ pwd

    /users/pat

    $

    ```

    ```


    To make use of the line editor, you must switch to *command* mode by pressing
    the ESCAPE or Esc key, usually in the upper-left corner of the keyboard. When
    you enter command mode, the cursor moves to the left one space, to the last character
    typed in.'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'The *current character* is whatever character the cursor is on; we’ll say more
    about the current character in a moment. You can enter vi commands only in command
    mode and that the commands are interpreted immediately upon typing them in, no
    Enter needed.


    A typical problem you may encounter when typing in long commands is that it’s
    only after typing it all in that you notice an error. Inevitably, the error is
    at the beginning of the line!


    In command mode, you can move the cursor around and fix the errors without disturbing
    the command line. After you’ve moved the cursor to the place where the error is,
    you can change the letter or letters to whatever you want. Then press Enter (regardless
    of where the cursor is on the line) and it’ll be given to the shell for interpretation.


    In the following examples, the underline (_) represents the cursor. A command
    line will be shown, followed by one or more keystrokes, followed by what the line
    looks like after applying the keystrokes:


    *before keystrokes after*


    First, let’s look at moving the cursor around. Many systems will let you use the
    arrow keys on your keyboard, which makes it easy: left arrow to move left, right
    arrow to move right.


    The more general vi-inspired movement commands, however, are h to move the cursor
    to the left and the l key moves it to the right. Try this out by entering command
    mode (press Esc) and pressing the h and l keys a few times. The cursor should
    move around on the line. If you try to move the cursor past the left or right
    side of the line, the shell “beeps” at you.


    ```

    ```text

    $ mary had a little larb_    Esc    $ mary had a little larb_

    $ mary had a little larb_    h      $ mary had a little larb_

    $ mary had a little larb_    h      $ mary had a little larb_

    $ mary had a little larb_    l      $ mary had a little larb_

    ```

    ```


    After the cursor is on the character you want to change, you can use the x command
    to delete the current character (“X” it out).


    ```

    ```text

    $ mary had a little larb_    x    $ mary had a little lab_

    ```

    ```


    Note that the b moved to the left when the r was deleted and is now the current
    character.


    To add characters to the command line, you can use the i or a commands. The i
    command inserts characters *before* the current character, and the a command adds
    characters *after* the current character. Both of these commands put you back
    into input mode, so remember to press Esc to go back to command mode.


    ```

    ```text

    $ mary had a little lab_     im     $ mary had a little lamb_

    $ mary had a little lamb_    m      $ mary had a little lamb_

    $ mary had a little lamb_    Esc    $ mary had a little lamb_

    $ mary had a little lamb_    x      $ mary had a little lam_

    $ mary had a little lam_     a      $ mary had a little lamb_

    $ mary had a little lamb_    da     $ mary had a little lambda_

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'If you think that moving the cursor around by repeatedly pressing h and l is
    slow, you’re right. The h and l commands may be preceded by a number that specifies
    the number of spaces to move the cursor.


    ```

    $ mary had a little lamb    Esc    $ mary had a little lamb

    $ mary had a little lamb    10h    $ mary had a little lamb

    $ mary had a little lamb    13h    $ mary had a little lamb

    $ mary had a little lamb    5x     $ mary had a little lamb

    ```


    As you see, the x command can also be preceded by a number to tell it how many
    characters to delete.


    You can then easily move to the end of the line by typing the $ command:


    ```

    $ had a little lambda          $       had a little lambda

    ```


    To move to the beginning of the line, you use the 0 (that’s a zero) command:


    ```

    $ had a little lambda        0      $ had a little lambda

    ```


    Two other useful cursor movement commands are w and b. The w command moves the
    cursor forward to the beginning of the next word, where a word is a string of
    letters, numbers, and underscores delimited by blanks or punctuation. The b command
    moves the cursor backward to the beginning of the previous word. These commands
    may also be preceded by a number to specify the number of words to move forward
    or backward.


    ```

    $ had a little lambda       w       $ had a little lambda

    $ had a little lambda       2w      $ had a little lambda

    $ had a little lambda       3b      $ had a little lambda

    ```


    At any time you can press Enter and the current line will be executed as a command.


    ```

    $ had a little lambda                  Hit Enter

    ksh: had: not found

    $ _

    ```


    After a command is executed, you are placed back in input mode.


    # Accessing Commands from Your History


    So far, you''ve learned how to edit the current command line. But there''s more
    to vi mode because you can use the vi commands k and j to retrieve commands from
    your history. The k command replaces the current line on your terminal with the
    previously entered command, putting the cursor at the beginning of the line. Let’s
    assume that these commands have just been entered:


    ```

    $ pwd

    /users/pat

    $ cd /tmp

    $ echo this is a test

    this is a test

    $ _

    ```'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'Now go into command mode (Esc) and use k to access previous commands from the
    command history:


    ```

    ```text

    $ _                         Esc k       $ echo this is a test

    ```

    ```


    Every time k is used, the line is replaced by the previous line from the command
    history, as far back as you want to go, within the constraints set with `HISTSIZE`,
    as discussed earlier.


    ```

    ```text

    $ echo this is a test       k          $ cd /tmp

    $ cd /tmp                   k          $ pwd

    ```

    ```


    To execute the command being displayed, just press the Enter key.


    ```

    ```text

    $ pwd                       Hit Enter

    /tmp

    $ _

    ```

    ```


    The j command is the reverse of the k command and is used to display the next
    most recent command in the history. In other words, k moves you “back” in time,
    and j moves you “forward” in time. Try them a few times and you''ll immediately
    see what we mean.


    The / command searches through the command history for a command containing the
    specified string. If the / is entered followed by a string, the shell searches
    backward through its history to find the most recently executed command that contains
    that string. The command will then be displayed.


    If no line in the history contains the specified string, the shell “beeps” to
    indicate the error. When the / is entered, the current line is replaced by a /.


    ```

    ```text

    /tmp

    $ _                         Esc /test    /test_

    ```

    ```


    The search is begun when the Enter key is pressed.


    ```

    ```text

    /test_                    Enter        $ echo this is a test

    ```

    ```


    To execute the command that results from the search, Enter must be pressed again.


    ```

    ```text

    $ echo this is a test                         Hit Enter again

    this is a test

    $ _

    ```

    ```


    If the command that’s displayed isn’t the one you seek, continue the search by
    typing in / without a pattern and pressing Enter. The shell is smart enough to
    use the string that you entered the last time you executed the search command
    and continue from the last match shown further back in your command list.


    When you’ve found the command in the history (either by k, j, or /), you can edit
    the command using the other vi commands we’ve already discussed. Worth noting
    is that by making these changes, you don’t actually change the command in the
    history. You’re editing a copy of the command, which will then be entered in the
    history as the most recent command when you press Enter.


    Table 14.1 summarizes the basic vi line edit commands.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '| Command | Meaning |

    |---|---|

    | `h` | Move left one character. |

    | `l` | Move right one character. |

    | `b` | Move left one word. |

    | `w` | Move right one word. |

    | `0` | Move to start of line. |

    | `$` | Move to end of line. |

    | `x` | Delete character at cursor. |

    | `dw` | Delete word at cursor. |

    | `rc` | Change character at cursor to `c`. |

    | `a` | Enter input mode and enter text after the current character. |

    | `i` | Enter input mode and insert text before the current character. |

    | `k` | Get previous command from history. |

    | `j` | Get next command from history. |

    | `/string` | Search history for the most recent command containing `string`;
    if `string` is null, the previous string will be used. |


    *Table 14.1  Basic vi Line Edit Commands*


    It seems like a lot, but don’t get too anxious: `j` and `k` to move up and down
    your history list, `h` and `l` to move around on the command line, `i` to insert
    and `Enter` to invoke are all you really need to get going with command line editing
    in vi mode.


    # The emacs Line Edit Mode


    Not a fan of the vi visual editor but prefer emacs, an editor much beloved by
    the open source developer community? The shell has a line edit mode for you too.
    After turning on the emacs line editor, you again won’t notice anything different
    because you’ll type in and execute commands exactly as before:


    ```

    ```shell

    $ set -o emacs

    $ echo hello

    hello

    $ pwd

    /users/pat

    $

    ```

    ```


    This time, however, to use the emacs line editor you will enter emacs commands.
    emacs commands are either control characters—characters typed in by holding down
    the Ctrl key and pressing another character—or they are characters preceded by
    the Esc key. You may enter'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'emacs commands any time you want because there are no separate “modes” like
    the vi line editor. *Note that emacs commands are not followed by an Enter.*


    (For a complete list of emacs commands, refer to the documentation for Bash or
    the Korn shell.)


    First, let’s look at how to move the cursor around on the command line. *Ctrl+h*
    moves the cursor back (to the left), and the *Ctrl+f* command moves it forward
    (to the right). Try this by pressing *Ctrl+h* and *Ctrl+f* a few times while entering
    a command on the command line. The cursor should move around on the line. If you
    try to move the cursor past the left or right side of the line, the shell simply
    ignores your command.


    ```

    ```text

    $ mary had a little larb_    Ctrl+b       $ mary had a little larb

    $ mary had a little larb     Ctrl+b       $ mary had a little larb

    $ mary had a little larb     Ctrl+f       $ mary had a little larb

    $ mary had a little larb     Ctrl+f       $ mary had a little larb

    ```

    ```


    After the cursor is on the character you want to change, you can use the *Ctrl+d*
    command to delete the current character.


    ```

    ```text

    $ mary had a little larb_    Ctrl+d       $ mary had a little lab

    ```

    ```


    Note that the b moved to the left when the r was deleted and is now the current
    character.


    To add characters to the command line, you simply type them in. The characters
    are inserted *before* the current character.


    ```

    ```text

    $ mary had a little lab_      m          $ mary had a little lamb

    $ mary had a little lamb      m          $ mary had a little lamb_

    $ mary had a little lamb_     Ctrl+h      $ mary had a little lamb

    ```

    ```


    Note that the current erase character (usually either Backspace or *Ctrl+h*) will
    always delete the character to the left of the cursor.


    The *Ctrl+a* and *Ctrl+e* commands may be used to move the cursor to the beginning
    and end of the command line, respectively.


    ```

    ```text

    $ mary had a little lamb_    Ctrl+a       $ mary had a little lamb

    $ mary had a little lamb     Ctrl+e       $ mary had a little lamb_

    ```

    ```


    Note that the *Ctrl+e* command places the cursor one space to the right of the
    last character on the line. (When you’re not in emacs mode, the cursor is always
    at the end of the line, one space to the right of the last character typed in.)


    This is handy because when you’re at the end of the line, anything you type will
    be appended to whatever is already on the line.


    ```

    ```text

    $ mary had a little lamb_    da         $ mary had a little lambda_

    ```

    ```


    Two other useful cursor movement commands are the *Esc f* and *Esc b* commands.
    The *Esc f* command moves the cursor forward to the end of the current word. The
    *Esc b* command moves the cursor backward to the beginning of the previous word.
    Note that for these commands you press and release the Esc key, then press the
    key that corresponds to the desired command (f, b, and so on).'
  merge: -1
  img_proc: true
- pgno: 317
  md: '```

    ```text

    $ mary had a little lambda_    Esc b       $ mary had a little lambda_

    $ mary had a little lambda_    Esc b       $ mary had a little lambda

    $ mary had a little lambda     Esc b       $ mary had a little lambda

    $ mary had a little lambda     Esc f       $ mary had a little lambda

    $ mary had a_little lambda     Esc f       $ mary had a_little lambda

    ```

    ```


    You can press the Enter key at any time and the current line will be executed
    as a command.


    ```

    ```text

    $ mary had a little lambda_                    Hit Enter; enter command

    ksh: mary: not found

    $ _

    ```

    ```


    # ## Accessing Commands from Your History


    You’ve learned how to edit the current command line, but the shell keeps a history
    of recently entered commands. To access these commands from the history list,
    use the emacs commands *Ctrl+p* and *Ctrl+n*. The *Ctrl+p* command replaces the
    current line one your terminal with the previously entered command, putting the
    cursor at the end of the line. *Ctrl+n* does the same action, but with the *next*
    command in the history list.


    Let’s assume that these commands have just been entered:


    ```

    ```text

    $ pwd

    /users/pat

    $ cd /tmp

    $ echo this is a test

    this is a test

    $ _

    ```

    ```


    Now use *Ctrl+p* to access them:


    ```

    ```text

    $ _                         Ctrl+p             $ echo this is a test_

    ```

    ```


    Every time Ctrl+p is used, the current line is replaced by the previous line from
    the command history.


    ```

    ```text

    $ echo this is a test_       Ctrl+p             $ cd /tmp_

    $ cd /tmp_                  Ctrl+p             $ pwd_

    ```

    ```


    To execute the command being displayed, just press Enter.


    ```

    ```text

    $ pwd_                       Hit Enter

    /tmp

    $ _

    ```

    ```


    The *Ctrl+r* command is used to search through the command history for a command
    containing the specified search string. The *Ctrl+r* is entered followed by the
    search pattern, followed by the Enter key. The shell then searches the command
    history for the most recently executed command that contains that string. If found,
    the command line is displayed; otherwise, the shell “beeps.”'
