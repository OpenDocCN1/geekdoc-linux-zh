    \ most common operation will be looking someone up, there will be a tendency to\
    \ avoid typing `rolo`, then making selection 1, then typing the desired name.\
    \ Instead, it’s a lot easier to just type in\n\n```\n```text\nlu name\n```\n```\n\
    \ndirectly. Given this, let’s give `rolo` some useful command line arguments so\
    \ it can also be used as efficiently. By default if any arguments are specified,\
    \ `rolo` will assume that a lookup is requested and call `lu` directly, handling\
    \ all the arguments along. If the user wants to perform a quick lookup, they can\
    \ type `rolo` followed by the name. If they want to get the full menu interface,\
    \ typing just `rolo` offers just that alternative too.\n\nThe preceding two changes\
    \ (looping until a valid choice is selected and doing a quick lookup) are added\
    \ to version 2 of rolo:\n\n```\n```sh\n$ cat rolo\n#\n# rolo - rolodex program\
    \ to look up, add, and\n#     remove people from the phone book -- version 2\n\
    \n#\n# If arguments are supplied, then do a lookup\n#\n\nif [ \"$#\" -ne 0 ];\
    \ then\n        lu \"$@\"\n        exit\nfi\n\nvalidchoice=\"\"        # set it\
    \ null\n\n#\n# Loop until a valid selection is made\n#\n\nuntil [ -n \"$validchoice\"\
    \ ]\ndo\n        #\n        # Display menu\n        #\n```\n```"
