- pgno: 124
  md: '# Can I Quote You on That?


    This chapter teaches you about a unique feature of the shell programming language:
    the way it interprets quote characters. The shell recognizes four different types
    of quote characters:


    +   - The single quote character `''`

    +   - The double quote character `"`

    +   - The backslash character `\\`

    +   - The back quote character `` ` ``


    The first two and the last characters in the preceding list must occur in pairs,
    while the backslash character can be used any number of times in a command as
    needed. Each of these quotes has a distinct meaning to the shell. We’ll cover
    them in separate sections of this chapter.


    # The Single Quote


    There are many reasons that you’ll need to use quotes in the shell. One of the
    most common is to keep character sequences that include whitespace together as
    a single element.


    Here’s a file called phonebook that contains names and phone numbers:


    ```

    ```text

    $ cat phonebook

    Alice Chebba     973-555-2015

    Barbara Swingle  201-555-9527

    Liz Stachiw      212-555-2298

    Susan Goldberg   201-555-7776

    Susan Topple     212-555-4932

    Tony Iannino     973-555-1295

    $

    ```

    ```


    To look up someone in our phonebook file you could use grep:


    ```

    ```text

    $ grep Alice phonebook

    Alice Chebba     973-555-2015

    $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Look what happens when you look up Susan:


    ```

    ```text

    $ grep Susan phonebook

    Susan Goldberg  201-555-7776

    Susan Topple    212-555-4932

    $

    ```

    ```


    There are two Susans in the datafile, hence the two lines of output—but suppose
    you only wanted Susan Goldberg''s information. One way to overcome this problem
    would be to further qualify the name. For example, you could specify the last
    name as well:


    ```

    ```text

    $ grep Susan Goldberg phonebook

    grep: can''t open Goldberg

    Susan Goldberg  201-555-7776

    Susan Topple    212-555-4932

    $

    ```

    ```


    But that''s not going to work, as you can see.


    Why? Because the shell uses whitespace characters to separate the command arguments,
    the preceding command line results in grep being passed three arguments: Susan,
    Goldberg, and phonebook (see Figure 5.1).


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_125_0.png)


    Figure 5.1  `grep Susan Goldberg phonebook`


    When grep is executed, it interprets the first argument as the search pattern
    and the remaining arguments as the names of the files to search. In this case,
    grep thinks it''s supposed to look for Susan in the files Goldberg and phonebook.
    It tries to open the file Goldberg, can''t find it, and issues the error message:


    ```

    ```text

    grep: can''t open Goldberg

    ```

    ```


    Then it goes to the next file, phonebook, opens it, searches for the pattern Susan,
    and prints the two matching lines. Quite logical, really.


    The problem is really about how to pass arguments that include whitespace characters
    to programs.


    The solution: enclose the entire argument inside a pair of single quotes, as in


    ```

    ```text

    grep ''Susan Goldberg'' phonebook

    ```

    ```


    When the shell sees the first single quote, *it ignores any special characters
    that follow until it sees the matching closing quote.*


    ```

    ```text

    $ grep ''Susan Goldberg'' phonebook

    Susan Goldberg  201-555-7776

    $

    ```

    ```'
