- pgno: 20
  md: "# # Introduction\n\nIt’s no secret that the family of Unix and Unix-like operating\
    \ systems has emerged over the last few decades as the most pervasive, most widely\
    \ used group of operating systems in computing today. For programmers who have\
    \ been using Unix for many years, this came as no surprise: The Unix system provides\
    \ an elegant and efficient environment for program development. That’s exactly\
    \ what Dennis Ritchie and Ken Thompson sought to create when they developed Unix\
    \ at Bell Laboratories way back in the late 1960s.\n\n> **Note**\n> \n> Throughout\
    \ this book we’ll use the term Unix to refer generically to the broad family of\
    \ Unix-based operating systems, including true Unix operating systems such as\
    \ Solaris as well as Unix-like operating systems such as Linux and Mac OS X.\n\
    \nOne of the strongest features of the Unix system is its wide collection of programs.\
    \ More than 200 basic commands are distributed with the standard operating system\
    \ and Linux adds to it, often shipping with 700–1000 standard commands! These\
    \ commands (also known as *tools*) do everything from counting the number of lines\
    \ in a file, to sending electronic mail, to displaying a calendar for any desired\
    \ year.\n\nBut the real strength of the Unix system comes not from its large collection\
    \ of commands but from the elegance and ease with which these commands can be\
    \ combined to perform far more sophisticated tasks.\n\nThe standard user interface\
    \ to Unix is the command line, which actually turns out to be a *shell*, a program\
    \ that acts as a buffer between the user and the lowest levels of the system itself\
    \ (the *kernel*). The shell is simply a program that reads in the commands you\
    \ type and converts them into a form more readily understood by the system. It\
    \ also includes core programming constructs that let you make decisions, loop,\
    \ and store values in variables.\n\nThe standard shell distributed with Unix systems\
    \ derives from AT&T’s distribution, which evolved from a version originally written\
    \ by Stephen Bourne at Bell Labs. Since then, the IEEE has created standards based\
    \ on the Bourne shell and the other more recent shells. The current version of\
    \ this standard, as of this writing, is the Shell and Utilities volume of IEEE\
    \ Std 1003.1-2001, also known as the POSIX standard. This shell is what we use\
    \ as the basis for the rest of this book.\n\nThe examples in this book were tested\
    \ on a Mac running Mac OS X 10.11, Ubuntu Linux 14.0, and an old version of SunOS\
    \ 5.7 running on a Sparcstation Ultra-30. All examples, with the"
  merge: -1
  img_proc: true
- pgno: 21
  md: 'exception of some Bash examples in Chapter 14, were run using the Korn shell,
    although all of them also work fine with Bash.


    Because the shell offers an interpreted programming language, programs can be
    written, modified, and debugged quickly and easily. We turn to the shell as our
    first choice of programming language and after you become adept at shell programming,
    you will too.


    # How This Book Is Organized


    This book assumes that you are familiar with the fundamentals of the system and
    command line; that is, that you know how to log in; how to create files, edit
    them, and remove them; and how to work with directories. In case you haven’t used
    the Linux or Unix system for a while, we’ll examine the basics in Chapter 1, “A
    Quick Review of the Basics.” In addition, filename substitution, I/O redirection,
    and pipes are also reviewed in the first chapter.


    Chapter 2, “What Is the Shell?,” reveals what the shell really is, how it works,
    and how it ends up being your primary method of interacting with the operating
    system itself. You’ll learn about what happens every time you log in to the system,
    how the shell program gets started, how it parses the command line, and how it
    executes other programs for you. A key point made in Chapter 2 is that the shell
    is just another program; nothing more, nothing less.


    Chapter 3, “Tools of the Trade,” provides tutorials on tools useful in writing
    shell programs. Covered in this chapter are cut, paste, sed, grep, sort, tr, and
    uniq. Admittedly, the selection is subjective, but it does set the stage for programs
    that we’ll develop throughout the remainder of the book. Also in Chapter 3 is
    a detailed discussion of regular expressions, which are used by many Unix commands,
    such as sed, grep, and ed.


    Chapters 4 through 9 teach you how to put the shell to work for writing programs.
    You’ll learn how to write your own commands; use variables; write programs that
    accept arguments; make decisions; use the shell’s for, while, and until looping
    commands; and use the read command to read data from the terminal or from a file.
    Chapter 5, “Can I Quote you on That?”, is devoted entirely to a discussion of
    one of the most intriguing (and often confusing) aspects of the shell: the way
    it interprets quotes.


    By that point in the book, all the basic programming constructs in the shell will
    have been covered, and you will be able to write shell programs to solve your
    particular problems.


    Chapter 10, “Your Environment,” covers a topic of great importance for a real
    understanding of the way the shell operates: the environment. You’ll learn about
    local and exported variables; subshells; special shell variables, such as HOME,
    PATH, and CDPATH; and how to set up your .profile file.


    Chapter 11, “More on Parameters,” and Chapter 12, “Loose Ends,” tie up some loose
    ends, and Chapter 13, “Rolo Revisited,” presents a final version of a phone directory
    program called rolo that is developed throughout the book.'
  merge: -1
