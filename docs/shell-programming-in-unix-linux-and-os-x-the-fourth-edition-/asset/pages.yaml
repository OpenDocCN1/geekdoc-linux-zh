- pgno: 231
  md: '# *export variables*


    where *variables* is the list of variable names that you want exported. For any
    subshells that get executed subsequent to the export command, the value of the
    exported variables will be passed to the subshell.


    Here’s a program called `vartest3` to help illustrate the difference between local
    and exported variables:


    ```

    ```sh

    $ cat vartest3

    echo x = $x

    echo y = $y

    $

    ```

    ```


    Assign values to the variables x and y in the login shell, and then run `vartest3`:


    ```

    ```sh

    $ x=100

    $ y=10

    $ vartest3

    x =

    y =

    $

    ```

    ```


    x and y are both local variables, so their values aren’t passed down to the subshell
    that runs `vartest3`. That’s as expected.


    But now let’s export the variable y and try the program again:


    ```

    ```sh

    $ export y

    $ vartest3

    x =

    y = 10

    $

    ```


    *Make y known to subshells*

    ```


    This time `vartest3` knew about y because it is an exported variable.


    Conceptually, whenever a subshell is executed the exported variables get “copied
    down” to the subshell, whereas the local variables do not (see Figure 10.4).


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_231_0.png)


    Figure 10.4  Execution of `vartest3`'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'Now it’s time for another question: What do you think happens if a subshell
    changes the value of an exported variable? That is, will the parent shell know
    about it after the subshell has finished?


    To answer this question, here’s a program called `vartest4`:


    ```

    ```sh

    $ cat vartest4

    x=50

    y=5

    $

    ```

    ```


    We’ll assume that you haven’t changed the values of x and y, and that y is still
    exported from the previous example.


    ```

    ```sh

    $ vartest4

    $ echo $x $y

    100 10

    $

    ```

    ```


    The subshell couldn’t change the value of either the local variable x (no surprise!)
    or the exported variable y, it merely changed its local subshell copy of y that
    was instantiated when it was executed (see Figure 10.5). Just as with local variables,
    when a subshell goes away, so do the values of the exported variables. In fact,
    once they get to the subshell, they are local variables.


    > That’s why this is true: *There is no way to change the value of a variable
    in a parent shell from within a subshell.*


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_232_0.png)


    Figure 10.5  Execution of `vartest4`'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'In the case of a shell program invoking another shell program (for example,
    the rolo program calling the l program), the process is repeated: the exported
    variables from the subshell are copied to the new subshell. These exported variables
    may have been exported from the login shell, or newly exported from within the
    subshell.


    > *After a variable is exported, it remains exported to all subshells subsequently
    executed.*


    Consider a modified version of `vartest4`:


    ```

    ```sh

    $ cat vartest4

    x=50

    y=5

    z=1

    export z

    vartest5

    $

    ```

    ```


    and `vartest5`:


    ```

    ```sh

    $ cat vartest5

    echo x = $x

    echo y = $y

    echo z = $z

    $

    ```

    ```


    When `vartest4` gets executed, the exported variable y will be copied into the
    subshell’s environment. `vartest4` sets the value of x to 50, changes the value
    of y to 5, and sets the value of z to 1. Then it exports z which makes the value
    of z accessible to any subsequent subshell.


    `vartest5` is such a subshell and when it is executed the shell copies into its
    environment the exported variables from `vartest4`: y and z.


    This explains the following output:


    ```

    ```sh

    $ vartest4

    x =

    y = 5

    z = 1

    $

    ```

    ```


    This entire process is depicted in Figure 10.6.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/29b87b4d3daf7eb41fe5066130730f4c_234_0.png)


    To summarize the way local and exported variables work:


    +   1. Any variable that is not exported is a local variable whose existence will
    not be known to subshells.

    +   2. Exported variables and their values are copied into a subshell’s environment,
    where they may be accessed and changed. However, such changes have no effect on
    the variables in the parent shell.

    +   3. Exported variables retain this characteristic not only for directly spawned
    subshells, but also for subshells spawned by those subshells (and so on down the
    line).

    +   4. A variable can be exported any time before or after it is assigned a value
    but takes on its value at the moment of export; subsequent changes aren’t tracked.


    # export -p


    If you type export -p, you’ll get a list of the variables and their values exported
    by your shell:


    ```

    ```sh

    $ export -p

    export LOGNAME=steve

    export PATH=/bin:/usr/bin:.

    export TIMEOUT=600

    export TZ=EST5EDT

    export y=10

    $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'As you can see, there are actually lots of exported variables in a typical
    login shell. On the Mac, `export -p` produces a list of 22 variables. Note that
    in the example shown to our earlier export experimentation, along with other variables
    that were exported when you logged on and your login shell was started up.


    But what are these all-capital-letter exported variables? Let’s have a closer
    look.


    # PS1 and PS2


    The sequence of characters that the shell uses as your command prompt are stored
    in the environment variable PS1. It turns out that you can change this to be anything
    you want and as soon as you change it, the new value will be used by the shell
    from that point on.


    ```

    $ echo :$PS1:

    $: $

    $ PS1="==> "

    ==> pwd

    /users/steve

    ==> PS1="I await your next command, master: "

    I await your next command, master: PS1="$ "

    $


    Back to normal

    ```


    Your secondary command prompt, used when a command requires more than a single
    line of input, defaults to > and is kept in the variable PS2. This too you can
    change to your heart’s content:


    ```

    $ echo :$PS2:

    :>

    $ PS2="=======> "

    $ for x in 1 2 3

    =======> do

    =======> echo $x

    =======> done

    1

    2

    3

    $

    ```


    Once you log off the system, all the changes will vanish, just like modifications
    to any other shell variables. If you change PS1, the shell will use the new value
    for the remainder of your login session. Next time you log in, however, you’ll
    get the old prompt unless you save the new PS1 value by adding it to your .profile
    file (discussed later in this chapter).'
  merge: -1
  img_proc: true
- pgno: 236
  md: '> > **Tip**

    > > The PS1 prompt has a language all its own with special sequences that produce
    the command count, current directory, time of day, and much more. Learn about
    it by reading the “Prompting” section of the Bash or Sh man page!


    # HOME


    Your home directory is where you’re placed whenever you log on to the system.
    A special shell variable called HOME is also automatically set to this directory
    when you log on:


    ```

    $ echo $HOME

    /users/steve

    $

    ```


    This variable can be used by your programs to identify your home directory and
    is widely used by other programs in Unix for just this purpose. It’s also used
    by the cd command as the desired destination when you type cd with no arguments:


    ```

    $ pwd                         *Where am I?*

    /usr/src/lib/libc/port/stdio

    $ cd

    $ pwd

    /users/steve                  *There’s no place like home*

    $

    ```


    You can change your HOME variable to anything you want, but be warned that doing
    so may affect the operation of any programs that rely on it:


    ```

    $ HOME=/users/steve/book       *Change it*

    $ pwd

    /users/steve

    $ cd

    $ pwd                         *See what happened*

    /users/steve/book

    $

    ```


    You can change your HOME, but you really shouldn’t unless you’re prepared to have
    a lot of things go wonky rather quickly.


    # PATH


    Let’s return to the rolo program from Chapter 9:


    ```

    $ rolo Liz

    Liz Stachiw     212-775-2298

    $

    ```'
