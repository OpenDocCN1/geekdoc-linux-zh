  md: '# The `jobs` Command


    *General Format:* `jobs`


    The list of active jobs is printed. If the `-l` option is specified, detailed
    information about each job, including its process ID, is listed as well. If the
    `-p` option is specified, only process IDs are listed.


    If an optional *job_id* is supplied to the jobs command, just information about
    that job is listed.


    *Example*


    ```

    ```text

    $ sleep 100 &

    [1] 1104

    $ jobs

    [1] + Running              sleep 100 &

    $

    ```

    ```


    # The `kill` Command


    *General Format:* `kill -signal job`


    The kill command sends the signal *signal* to the specified process, where *job*
    is a process ID or *job_id*, and *signal* is a number or one of the signal names
    specified in `<signal.h>` (see the description of trap later in the chapter).
    `kill -l` lists these names. A signal number supplied with the `-l` option lists
    the corresponding signal name. A process ID used with the `-l` option lists the
    name of the signal that terminated the specified process (if it was terminated
    by a signal).


    The `-s` option can also be used when a signal name is supplied, in which case
    the dash before the name is not used (see the following example).


    If *signal* isn’t specified, SIGTERM (TERM) is used.


    *Examples*


    ```

    ```text

    kill -9 1234

    kill -HUP %2 3456

    kill -s TERM %2

    kill %1

    ```

    ```


    Note that more than one process ID can be supplied to the `kill` command on the
    command line.


    # The `newgrp` Command


    *General Format:* `newgrp group`


    This command changes your real group id (GID) to *group*. If no argument is specified,
    it changes you back to your default group.'
