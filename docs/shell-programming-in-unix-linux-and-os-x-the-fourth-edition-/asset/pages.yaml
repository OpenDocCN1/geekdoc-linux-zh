    \                    Output from greetings\n->                              New\
    \ PS1\n```\n\n# ## The TERM Variable\n\nThough many of the programs in Unix are\
    \ command-line based (like `ls` and `echo`), there are a number of full-screen\
    \ commands (like the vi editor) that require a detailed knowledge of your terminal\
    \ settings and capabilities. The environment variable that holds that information\
    \ is `TERM` and usually it’s nothing you need to worry about: your Terminal or\
    \ SSH program usually sets it automatically to be the optimal value for things\
    \ to work seamlessly.\n\nHowever, some old-school users might find that `TERM`\
    \ needs to have a specific value like `ansi` or `vt100` or `xterm` for the full-screen\
    \ programs to behave properly. In those instances, setting the value within `.profile`\
    \ is recommended.\n\nYou can even prompt for a `TERM` value during the login sequence\
    \ by having a simple code block like this:\n\n```\necho \"What terminal are you\
    \ using (xterm is the default)? \\c\"\nread TERM\nif [ -z \"$TERM\" ]\nthen\n\
    \        TERM=xterm\n\nfi\nexport TERM\n```\n\nBased on the terminal type entered,\
    \ you may also want to do things such as set up the function keys or the tabs\
    \ on the terminal.\n\nEven if you always use the same terminal type, you should\
    \ set the `TERM` variable in your `.profile` file."
