- pgno: 254
  md: 'Variables defined this way otherwise behave as normal exported variables to
    the subshell but don’t exist for the invoking shell once that line of code is
    executed.


    # Your `.profile` File


    In Chapter 2 you learned about the login sequence completed before the shell displays
    your command prompt, ready for you to type your first command. Before the prompt,
    the login shell looks for and reads two special files on the system.


    The first is `/etc/profile`, set up by the system administrator. It generally
    checks to see whether you have mail (it’s where the “You have mail” message comes
    from), sets your default file creation mask (your `umask`), establishes a default
    PATH, and anything else that the administrator wants to have happen whenever a
    user logs in.


    More interestingly, the second file that gets automatically executed is `.profile`
    in your home directory. Most Unix systems set up a default `.profile` file when
    the account is created, so let’s start by seeing what’s in it:


    ```

    ```sh

    $ cat $HOME/.profile

    PATH="/bin:/usr/bin:/usr/local/bin:."

    export PATH

    $

    ```

    ```


    This is a pretty modest `.profile` that simply sets the PATH and exports it.


    You can change your `.profile` file to include any commands that you want executed
    whenever you log in, including indicating which directory you start out in, a
    check of who’s logged in, and the installation of any system aliases you prefer.
    You can even put commands in your `.profile` that override settings (usually environment
    variables) established in `/etc/profile`.


    Since we’ve said you can change your current working directory within the `.profile`,
    it should be no surprise that the login shell actually executes these files as
    if you typed in


    ```

    ```sh

    $ . /etc/profile

    $ .profile

    $

    ```

    ```


    as soon as you logged in. This also means that changes to your environment made
    within the `.profile` remain until you log out of the shell.


    Most Unix users dabble with their `.profile` to change lots of aspects of their
    command line environment. For example, here’s a sample `.profile` that sets PATH
    to include your own bin, sets CDPATH, changes the primary and secondary command
    prompts, changes the erase character to a backspace (Ctrl+h) with the stty command,
    and prints a friendly message using the greetings program from Chapter 7:


    ```

    ```sh

    $ cat $HOME/.profile

    PATH="/bin:/usr/bin:/usr/local/bin:$HOME/bin:."

    CDPATH=.:$HOME:$HOME/misc:$HOME/documents

    ```

    ```'
  merge: -1
