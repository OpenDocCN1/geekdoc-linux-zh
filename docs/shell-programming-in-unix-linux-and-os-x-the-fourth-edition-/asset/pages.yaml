- pgno: 136
  md: "Moving further into the world of shell scripting, let’s see how this works\
    \ with file redirection. For example, to store the contents of a file into a variable,\
    \ you can use the handy `cat` command:\n\n```\n```sh\n$ namelist=$(cat names)\n\
    $ echo \"$namelist\"\nCharlie\nEmanuel\nFred\nLucy\nRalph\nTony\nTony\n$\n```\n\
    ```\n\nIf you want to mail the contents of the file memo to all the people listed\
    \ in the names file, you can do the following:\n\n```\n```sh\n$ mail $(cat names)\
    \ < memo\n$ \n```\n```\n\nHere the shell replaces the `cat` command with its output\
    \ on the command line, so it looks like this:\n\n```\n```sh\nmail Charlie Emanuel\
    \ Fred Lucy Ralph Tony Tony < memo\n```\n```\n\nThen the shell executes `mail`,\
    \ redirecting its standard input from the file memo and passing it to the seven\
    \ recipients specified.\n\nNotice that Tony might receive the same mail twice\
    \ because he’s listed twice in the names file. You can remove any duplicate entries\
    \ from the file by using `sort` with the `-u` option (remove duplicate lines)\
    \ rather than `cat` to ensure that each person only receives mail once:\n\n```\n\
    ```sh\n$ mail $(sort -u names) < memo\n$ \n```\n```\n\nRemember that the shell\
    \ does filename substitution *after* it substitutes the output from commands.\
    \ Enclosing the commands inside double quotes prevents the shell from doing the\
    \ filename substitution on the output.\n\nCommand substitution is often used to\
    \ change the value stored in a shell variable. For example, if the shell variable\
    \ name contains someone’s name, and you want to convert every character in that\
    \ variable to uppercase, you could use `echo` to send the variable to `tr`’s input,\
    \ perform the translation, and then assign the result back to the variable:\n\n\
    ```\n```sh\n$ name=\"Ralph Kramden\"\n$ name=$(echo $name | tr '[a-z]' '[A-Z]')\
    \    # Translate to uppercase\n$ echo $name\nRALPH KRAMDEN\n$\n```\n```"
  merge: -1
  img_proc: true
- pgno: 137
  md: "The technique of using echo in a pipeline to write data to the standard input\
    \ of the subsequent command is simple but powerful, and is often used in shell\
    \ programs.\n\nThe next example shows how cut can be used to extract the first\
    \ character from the values stored in a variable called filename:\n\n```\n   \
    \ $ filename=/users/steve/memos\n    $ firstchar=$(echo $filename | cut -c1)\n\
    \    $ echo $firstchar\n    /\n    $\n```\n\nsed is also often used to “edit”\
    \ the value stored in a variable. Here it is used to extract the last character\
    \ from each line of the file specified by the variable file:\n\n```\n    $ file=exec.o\n\
    \    $ lastchar=$(echo $file | sed 's/.*\\(.\\)$/\\1/')\n    $ echo $lastchar\n\
    \    o\n    $\n```\n\nThe sed command replaces all the characters on the line\
    \ with the last one (remember that surrounding a pattern in parentheses causes\
    \ it to be saved in a register[\\e] in this case register 1, which is then referenced\
    \ as \\1). The result of the sed substitution is stored in the variable lastchar.\
    \ The single quotes around the sed command are important because they prevent\
    \ the shell from trying to interpret the backslashes. (Question: would double\
    \ quotes also have worked?)\n\nFinally, command substitutions can be nested. Suppose\
    \ that you want to change every occurrence of the first character in a variable\
    \ to something else. In a previous example, firstchar=$(echo $filename | cut -c1)\
    \ gets the first character from filename, but how would we use this character\
    \ to change every occurrence of that character in filename? A two-step process\
    \ is one way:\n\n```\n    $ filename=/users/steve/memos\n    $ firstchar=$(echo\
    \ $filename | cut -c1)\n    $ filename=$(echo $filename | tr \"$firstchar\" \"\
    ^\")    *translate to ^*\n    $ echo $filename\n    ^users^steve^memos\n    $\n\
    ```\n\nBut a single, nested command substitution can perform the same operation:\n\
    \n```\n    $ filename=/users/steve/memos\n    $ filename=$(echo $filename | tr\
    \ \"$(echo $filename | cut -c1)\" \"^\")\n    $ echo $filename\n    ^users^steve^memos\n\
    \    $\n```\n\nIf you have trouble understanding this example, compare it to the\
    \ previous one: Note how the firstchar variable in the earlier example is replaced\
    \ by the nested command substitution; otherwise, the two examples are the same."
  merge: -1
  img_proc: true
- pgno: 138
  md: '# The `expr` Command


    Although the standard shell supports built-in integer arithmetic, older shells
    don’t have this capability. In that situation, the mathematical equation shown
    below can be used instead:


    ```

    $ expr 1 + 2

    3

    $

    ```


    It’s easy to work with, but `expr` isn’t very good at parsing equations, so each
    operator and operand given to `expr` must be separated by spaces to be properly
    understood. That explains the following:


    ```

    $ expr 1+2

    1+2

    $

    ```


    The usual arithmetic operators are recognized by `expr`: + for addition, - for
    subtraction, / for division, * for multiplication, and % for modulus (remainder).


    ```

    $ expr 10 + 20 / 2

    20

    $

    ```


    Multiplication, division, and modulus have higher precedence than addition and
    subtraction, as with standard mathematics. Thus, in the preceding example the
    division was performed before the addition.


    But what about this example?


    ```

    $ expr 17 * 6

    expr: syntax error

    $

    ```


    The shell saw the * and substituted the names of all the files in your directory,
    which `expr` had no idea how to interpret! In the case of multiplication especially,
    the expression given to `expr` must be quoted to keep it away from the shell’s
    interference—but not as a single argument, as in this example:


    ```

    $ expr "17 * 6"

    17 * 6

    $

    ```


    Remember that `expr` must see each operator and operand as separate argument;
    the preceding example sends the whole expression in as a single argument, which
    doesn’t give you the results you want.


    This is a job for the backslash!


    ```

    $ expr 17 \* 6

    102

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Naturally, one or more of the arguments to `expr` can be the value stored inside
    a shell variable because the shell takes care of the substitution first anyway:


    ```

    ```sh

    $ i=1

    $ expr $i + 1

    2

    $

    ```

    ```


    This is the older method for performing arithmetic on shell variables and is less
    efficient than the shell built-in `$(...)` construct. In the case of incrementing
    or otherwise modifying a variable, you can use the command substitution mechanism
    to assign the output from `expr` back to the variable:


    ```

    ```sh

    $ i=1

    $ i=$(expr $i + 1)    Add 1 to i

    $ echo $i

    2

    $

    ```

    ```


    In legacy shell programs, you’re more likely to see `expr` used with the back
    quotes discussed earlier:


    ```

    ```sh

    $ i=`expr $i + 1`    Add 1 to i

    $ echo $i

    3

    $

    ```

    ```


    Similar to the shell’s built-in arithmetic, `expr` only evaluates integer arithmetic
    expressions. You can use `awk` or `bc` if you need to do floating point calculations.
    The difference? 17 is an integer, while 13.747 is a floating point (that is, number
    with a decimal point) value.


    Also note that `expr` has other operators. One of the most frequently used is
    the `:` operator, which is used to match characters in the first operand against
    a regular expression given as the second operand. By default, it returns the number
    of characters matched.


    For example, the `expr` command


    ```

    ```sh

    expr "$file" : ".*"

    ```

    ```


    returns the number of characters stored in the variable `file`, because the regular
    expression `.*` matches all the characters in the string. For more details on
    `expr` and the powerful colon construct, consult your *Unix User’s Manual* or
    the man page for `expr` on your system.


    Table A.5 in Appendix A summarizes the way quotes are handled by the shell.'
