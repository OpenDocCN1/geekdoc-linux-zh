- pgno: 302
  md: "The signal generated by the DELETE key (2) is ignored so that if the user presses\
    \ this key while in the editor, the change program won’t abort. The editor is\
    \ then launched so that the user can make whatever changes are required. Once\
    \ done, the program continues by removing the old entry from the phone book file\
    \ with grep, then the modified entry is converted back to having ^ field separators\
    \ and appended to the end of the file. An extra newline character must be added\
    \ here to make sure that a newline is stored in the file after the new entry,\
    \ easily done with an echo with no arguments.\n\nFinally, the phone book file\
    \ is sorted and the temporary files removed.\n\n# listall\n\n```\n```sh\n#\n#\
    \ list all of the entries in the phone book\n#\n\nIFS='^'    # to be used in set\
    \ command below\necho \"----------------------------------------------\"\nwhile\
    \ read line\ndo\n    #\n    # Get the first and last fields, presumably names\
    \ and numbers\n    #\n\n    set $line\n\n    #\n    # display 1st and last fields\
    \ (in reverse order!)\n    #\n\n    eval printf \"\\\"%-40.40s \\\\n\\\" \\\"\
    -\\$1\\\" \\\"-\\${\\$#}\\\"\"\ndone < $PHONEBOOK\necho \"----------------------------------------------\"\
    \n```\n```\n\nThe listall program lists all entries in the phone book, printing\
    \ just the first and last lines of each entry. The internal field separator characters\
    \ (IFS) is set to a ^, to be used inside the loop. Each line from the file is\
    \ then read and assigned to the variable `line`. The set command assigns each\
    \ field to the appropriate positional parameter as shown earlier.\n\nThe challenge\
    \ is to get the value of the first and last positional parameters. The first is\
    \ easy because it can be directly referenced as $1. To get the last one, the program\
    \ taps the power of eval as explained in Chapter 12. Specifically, the command\n\
    \n```\n```sh\neval echo \\${$#}\n```\n```\n\ndisplays the value of the last positional\
    \ parameter. In this particular program, it shows up in the command"
