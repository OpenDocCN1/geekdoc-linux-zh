  md: '| Operator | Returns TRUE (zero exit status) if |

    |---|---|

    | **String Operators** | |

    | `string` | `string` is not null |

    | `-n string` | `string` is not null (and `string` must be seen by `test`) |

    | `-z string` | `string` is null (and `string` must be seen by `test`) |

    | `string₁ = string₂` | `string₁` is identical to `string₂` |

    | `string₁ != string₂` | `string₁` is not identical to `string₂` |

    | **Integer Comparison Operators** | |

    | `int₂ -eq int₂` | `int₁` is equal to `int₂` |

    | `int₂ -ge int₂` | `int₁` is greater than or equal to `int₂` |

    | `int₂ -gt int₂` | `int₁` is greater than `int₂` |

    | `int₂ -le int₂` | `int₁` is less than or equal to `int₂` |

    | `int₂ -lt int₂` | `int₁` is less than `int₂` |

    | `int₂ -ne int₂` | `int₁` is not equal to `int₂` |

    | **Boolean Operators** | |

    | `! expr` | `expr` is FALSE; otherwise, returns TRUE |

    | `expr₁ -a expr₂` | `expr₂` is TRUE, and `expr₂` is TRUE |

    | `expr₁ -o expr₂` | `expr₂` is TRUE, or `expr₂` is TRUE |


    # The `times` Command


    *General Format:* `times`


    Execution of this command causes the shell to write to standard output the total
    amount of time that has been used by the shell and by all its child processes.
    For each, two numbers are listed: first the accumulated user time and then the
    accumulated system time.


    Note that `times` does not report the time used by built-in commands.


    *Example*


    ```

    ```text

    $ times                         Print time used by processes

    1m5s  2m9s                     1 min., 5 secs. user time, 2 mins., 9 secs. system
    time

    8m22.23s  6m22.01s             Time used by child processes

    $

    ```

    ```'
