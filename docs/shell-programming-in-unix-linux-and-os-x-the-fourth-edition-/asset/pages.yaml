    was executed?


    It turns out that the shell does not perform filename substitution when assigning
    values to variables. Therefore,


    ```

    x=*

    ```


    assigns the single character * to x. This means that given the output shown, the
    shell must have done the filename substitution when executing the echo command.
    In fact, the precise sequence of steps that occurred when


    ```

    echo $x

