- pgno: 103
  md: '# sort


    At its most basic, the `sort` command is really easy to understand: give it lines
    of input and it’ll sort them alphabetically, with the result appearing as its
    output:


    ```

    ```text

    $ sort names

    Charlie

    Emanuel

    Fred

    Lucy

    Ralph

    Tony

    Tony

    $

    ```

    ```


    By default, `sort` takes each line of the specified input file and sorts it into
    ascending order.


    Special characters are sorted according to the internal encoding of the characters.
    For example, the space character is represented internally as the number 32, and
    the double quote as the number 34. This means that the former would be sorted
    before the latter. Particularly for other languages and locales the sorting order
    can vary, so although you are generally assured that `sort` will perform as expected
    on alphanumeric input, the ordering of foreign language characters, punctuation,
    and other special characters is not always what you might expect.


    `sort` has many options that provide more flexibility in performing your sort.
    We’ll just describe a few of the options here.


    # The `-u` Option


    The `-u` option tells `sort` to eliminate duplicate lines from the output.


    ```

    ```text

    $ sort -u names

    Charlie

    Emanuel

    Fred

    Lucy

    Ralph

    Tony

    $

    ```

    ```


    Here you see that the duplicate line that contained Tony was eliminated from the
    output. A lot of old-school Unix people accomplish the same thing by using the
    separate program `uniq`, so if you read system shell scripts you’ll often see
    sequences like `sort | uniq`. Those can be replaced with `sort -u`!'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# The `-r` Option


    Use the -r option to reverse the order of the sort:


    ```

    ```text

    $ sort -r names          Reverse sort

    Tony

    Tony

    Ralph

    Lucy

    Fred

    Emanuel

    Charlie

    $

    ```

    ```


    # The `-o` Option


    By default, sort writes the sorted data to standard output. To have it go into
    a file, you can use output redirection:


    ```

    ```text

    $ sort names > sorted_names

    $

    ```

    ```


    Alternatively, you can use the -o option to specify the output file. Simply list
    the name of the output file right after the -o:


    ```

    ```text

    $ sort names -o sorted_names

    $

    ```

    ```


    This sorts names and writes the results to sorted_names.


    What’s the value of the -o option? Frequently, you want to sort the lines in a
    file and have the sorted data replace the original. But typing


    ```

    ```text

    $ sort names > names

    $

    ```

    ```


    won’t work—it ends up wiping out the names file! However, with the -o option,
    it is okay to specify the same name for the output file as the input file:


    ```

    ```text

    $ sort names -o names

    $ cat names

    Charlie

    Emanuel

    Fred

    Lucy

    Ralph

    Tony

    Tony

    $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Tip


    Be careful if your filter or process is going to replace your original input file
    and make sure that it’s all working as you expect prior to having the data overwritten.
    Unix is good at a lot of things, but there’s no *unremove* command to recover
    lost data or lost files.


    # The `-n` Option


    Suppose that you have a file containing pairs of (x, y) data points as shown:


    ```

    $ cat data

    5    27

    2    12

    3    33

    23   2

    -5   11

    15   6

    14   -9

    $

    ```


    And suppose that you want to feed this data into a plotting program called `plotdata`,
    but that the program requires that the incoming data pairs be sorted in increasing
    value of *x* (the first value on each line).


    The `-n` option to `sort` specifies that the first field on the line is to be
    considered a *number*, and the data is to be sorted arithmetically. Compare the
    output of `sort` used without the `-n` option and then with it:


    ```

    $ sort data

    -5   11

    14   -9

    15   6

    2    12

    23   2

    3    33

    5    27

    $ sort -n data    *Sort arithmetically*

    -5   11

    2    12

    3    33

    5    27

    14   -9

    15   6

    23   2

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: "# Skipping Fields\n\nIf you had to sort your data file by the *y* value—that\
    \ is, the second number in each line—you could tell `sort` to start with the second\
    \ field by using the option\n\n`-k2n`\n\ninstead of `-n`. The `-k2` says to skip\
    \ the first field and start the sort analysis with the second field of each line.\
    \ Similarly, `-k5n` would mean to start with the fifth field on each line and\
    \ then sort the data numerically.\n\n```\n```text\n$ sort -k2n data\n14     -9\n\
    23      2\n15      6\n-5     11\n2      12\n5      27\n3      33\n$\n```\n```\n\
    \n*Start with the second field in the sort*\n\nFields are delimited by space or\
    \ tab characters by default. If a different delimiter is to be used, the `-t`\
    \ option must be used.\n\n# The `-t` Option\n\nAs mentioned, if you skip over\
    \ fields, `sort` assumes that the fields are delimited by space or tab characters.\
    \ The `-t` option can indicate otherwise. In this case, the character that follows\
    \ the `-t` is taken as the delimiter character.\n\nConsider the sample password\
    \ file again:\n\n```\n```text\n$ cat /etc/passwd\nroot:*:0:0:The super User:/:/usr/bin/ksh\n\
    steve:*:203:100::/users/steve:/usr/bin/ksh\nbin:*:3:3:The owner of system files:/:\
    \ \ncron:*:1:1:Cron Daemon for periodic tasks:/: \ngeorge:*:75:75::/users/george:/usr/lib/rsh\n\
    pat:*:300:300::/users/pat:/usr/bin/ksh\nuucp:nc823cisiLiZM:5:5::/usr/spool/uucppublic:/usr/lib/uucp/uucico\n\
    asg:*:6:6:The Owner of Assignable Devices:/: \nsysinfo:*:10:10:Access to System\
    \ Information:/:/usr/bin/sh\nmail:*:301:301::/usr/mail:\n$\n```\n```\n\nIf you\
    \ wanted to sort this file by username (the first field on each line), you could\
    \ just issue the command\n\n```\n```text\nsort /etc/passwd\n```\n```"
  merge: -1
  img_proc: true
- pgno: 107
  md: 'To sort the file instead by the third colon-delimited field (which contains
    what is known as your *user ID*), you would want an arithmetic sort, starting
    with the third field (-k3), and specifying the colon character as the field delimiter
    (-t:):


    ```

    ```text

    $ sort -k3n -t: /etc/passwd                 Sort by userid

    root:*:0:0:The super User:/usr/bin/ksh

    cron:*:1:1:Cron Daemon for periodic tasks:/

    bin:*:3:3:The owner of system files:/

    uucp:*:5:5:/usr/spool/uucppublic:/usr/lib/uucp/uucico

    asg:*:6:6:The Owner of Assigned Devices:/

    sys:*:7:7:I/O Access to System Information:/usr/bin/sh

    george:*:75:75:/users/george:/usr/lib/rsh

    steve:*:203:100:/users/steve:/bin/ksh

    pat:*:300:300:/users/pat:/usr/bin/ksh

    mail:*:301:31:/usr/mail:

    $

    ```

    ```


    Here we''ve folded the third field of each line so that you can easily verify
    that the file was sorted correctly by user *ID*.


    # Other Options


    Other options to sort enable you to skip characters within a field, specify the
    field to end the sort on, merge sorted input files, and sort in “dictionary order”
    (only letters, numbers, and spaces are used for the comparison). For more details
    on these options, look under sort in your *Unix User’s Manual*.


    # uniq


    The uniq command is useful when you need to find or remove duplicate lines in
    a file. The basic format of the command is


    ```

    ```text

    uniq in_file out_file

    ```

    ```


    In this format, uniq copies *in_file* to *out_file*, removing any duplicate lines
    in the process. uniq’s definition of duplicated lines is *consecutive lines that
    match exactly*.


    If *out_file* is not specified, the results will be written to standard output.
    If *in_file* is also not specified, uniq acts as a filter and reads its input
    from standard input.


    Here are some examples to see how uniq works. Suppose that you have a file called
    names with contents as shown:


    ```

    ```text

    $ cat names

    Charlie

    Tony

    Emanuel

    Lucy

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 108
  md: '```

    Ralph

    Fred

    Tony

    $

    ```


    You can see that the name Tony appears twice in the file. You can use `uniq` to
    remove such duplicate entries:


    ```

    $ uniq names                 Print unique lines

    Charlie

    Tony

    Emanuel

    Lucy

    Ralph

    Fred

    Tony

    $

    ```


    Oops! Tony still appears twice in the preceding output because the multiple occurrences
    are not *consecutive* in the file, and thus `uniq`’s definition of duplicate is
    not satisfied. To remedy this situation, sort is often used to get the duplicate
    lines adjacent to each other, as mentioned earlier in the chapter. The result
    of the sort is then run through `uniq`:


    ```

    $ sort names | uniq

    Charlie

    Emanuel

    Fred

    Lucy

    Ralph

    Tony

    $

    ```


    The sort moves the two Tony lines together, and then `uniq` filters out the duplicate
    line (but recall that sort with the `-u` option performs precisely this function).


    # The -d Option


    Frequently, you’ll be interested in finding just the duplicate entries in a file.
    The `-d` option to `uniq` can be used for such purposes: It tells `uniq` to write
    *only* the duplicated lines to *out_file* (or standard output). Such lines are
    written just once, no matter how many consecutive occurrences there are.


    ```

    $ sort names | uniq -d       List duplicate lines

    Tony

    $

    ```


    As a more practical example, let’s return to our `/etc/passwd` file. This file
    contains information about each user on the system. It’s conceivable that over
    the course of adding and removing users from this file that perhaps the same username
    has been inadvertently entered'
  merge: -1
  img_proc: true
- pgno: 109
  md: "more than once. You can easily find such duplicate entries by first sorting\
    \ `/etc/passwd` and piping the results into `uniq -d` as done previously:\n\n\
    ```\n```text\n$ sort /etc/passwd | uniq -d\n$\n```\n```\n\nThere are no duplicate\
    \ full line `/etc/passwd` entries. But you really want to find duplicate entries\
    \ for the username field, so you only want to look at the first field from each\
    \ line (recall that the leading characters of each line of `/etc/passwd` up to\
    \ the colon are the username). This can’t be done directly through an option to\
    \ `uniq`, but can be accomplished by using `cut` to extract the username from\
    \ each line of the password file before sending it to `uniq`.\n\n```\n```text\n\
    $ sort /etc/passwd | cut -f1 -d: | uniq -d\ncem\nharry\n$\n```\n```\n\nIt turns\
    \ out that there are multiple entries in `/etc/passwd` for cem and harry. If you\
    \ wanted more information on the particular entries, you could now grep them from\
    \ `/etc/passwd`:\n\n```\n```text\n$ grep -n 'cem' /etc/passwd\n20:cem:*:91:91::/users/cem:\n\
    166:cem:*:91:91::/users/cem:\n$ grep -n 'harry' /etc/passwd\n29:harry:*:103:103:Harry\
    \ Johnson:/users/harry:\n79:harry:*:90:90:Harry Johnson:/users/harry:\n$\n```\n\
    ```\n\nThe `-n` option was used to find out where the duplicate entries occur.\
    \ In the case of cem, there are two entries on lines 20 and 166; in harry’s case,\
    \ the two entries are on lines 29 and 79.\n\n# Other Options\n\nThe `-c` option\
    \ to `uniq` adds an occurrence count, which can be tremendously useful in scripts:\n\
    \n```\n```text\n$ sort names | uniq -c\n    1 Charlie\n    1 Emanuel\n    1 Fred\n\
    \    1 Lucy\n    1 Ralph\n    2 Tony\n$\n```\n```\n\nOne common use of `uniq -c`\
    \ is to figure out the most common words in a data file, easily done with a command\
    \ like:\n\n```\n```text\ntr '[A-Z]' '[a-z]' datafile | sort | uniq -c | head\n\
    ```\n```"
  merge: -1
  img_proc: true
