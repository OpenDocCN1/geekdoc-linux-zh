- pgno: 318
  md: 'When the `Ctrl+r` is typed, the shell replaces the current line with the prompt
    `^R`:


    ```

    $ _                         Ctrl+r test       $ ^Rtest_

    ```


    The search is initiated when Enter is pressed.


    ```

    $ ^Rtest_                   Enter             $ echo this is a test_

    ```


    To execute the command that is displayed as a result of the search, Enter must
    be pressed again.


    ```

    $ echo this is a test_       Hit Enter again

    this is a test

    $ _

    ```


    To continue the search through the command history, keep typing `Ctrl+r` followed
    by an Enter.


    Bash handles `Ctrl+r` a little differently. When you type `Ctrl+r`, Bash replaces
    the current line with `(reverse-i-search)`'':


    ```

    $ _                         Ctrl+r             (reverse-i-search)`'': _

    ```


    As you type text, the line is updated inside the `_` with the text you typed,
    and the rest of the line is updated with the matching command:


    ```

    (reverse-i-search)`'': _                         c       (reverse-i-search)`c'':
    echo this is a

    test

    (reverse-i-search)`c'': echo this is a test   d       (reverse-i-search)`cd'':
    cd /tmp

    ```


    Note how Bash highlights the matching part of the command by placing the cursor
    on it. As with the Korn shell, the command is executed by pressing Enter.


    When you’ve found the command in the history (either by `Ctrl+p`, `Ctrl+n`, or
    `Ctrl+r`), you can also edit the command using the other emacs commands already
    discussed. As with the vi edit mode, you won’t actually change the command in
    the history but are editing a copy of the command, which will then be entered
    in the history list when you press Enter.


    Table 14.2 summarizes the basic emacs line edit commands.


    # Table 14.2  Basic emacs Line Edit Commands


    | Command | Meaning |

    |---|---|

    | `Ctrl+b` | Move left one character. |

    | `Ctrl+f` | Move right one character. |

    | `Esc f` | Move forward one word. |

    | `Esc b` | Move back one word. |

    | `Ctrl+a` | Move to start of line. |

    | `Ctrl+e` | Move to end of line. |

    | `Ctrl+d` | Delete current character. |'
