    \   lpr all.out\n  522   history 10\n$\n```\n```\n\n# The `fc` Command\n\nThe\
    \ fc command allows you to start up an editor on one or more commands from your\
    \ history or to write a list of history commands to your terminal. In the latter\
    \ form, which is indicated by giving the -l option to fc, it is like typing in\
    \ history, only more flexible (you can specify a range of commands to be listed).\
    \ For example, the command\n\n```\n```text\nfc -l 510 515\n```\n```\n\nwrites\
    \ commands 510 through 515 to standard output, and the command\n\n```\n```text\n\
    fc -n -l -20\n```\n```\n\nwrites the last 20 commands to standard output, but\
    \ omits the command numbers (-n). Suppose that you’ve just executed a long command\
    \ and decide that it would be nice to turn that command line into a shell program\
    \ called runx. You can use fc to get the command from your history and I/O redirection\
    \ to write that command to a file:\n\n```\n```text\nfc -n -l -1 > runx\n```\n\
    ```\n\nThat’s the letter l followed by the number -1 to get the most recent command\
    \ (current minus one). fc is described in full detail in Appendix A.\n\n# The\
    \ `r` Command\n\nA simple Korn shell command allows you to re-execute previous\
    \ commands using even fewer keystrokes. Type in the r command, and the Korn shell\
    \ re-executes your last command:\n\n```\n```text\n$ date\nThu Oct 24 14:24:48\
    \ EST 2002\n$ r\ndate\nThu Oct 24 14:25:13 EST 2002\n$\n```\n```\n\n*Re-execute\
