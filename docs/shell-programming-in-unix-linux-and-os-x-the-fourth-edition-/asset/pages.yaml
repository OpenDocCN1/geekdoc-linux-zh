- pgno: 269
  md: "With the addition of a while loop and some integer arithmetic, the words program\
    \ can now be modified to count the total number of words from standard input,\
    \ essentially offering you your own version of `wc -w`:\n\n```\n```sh\n$ cat words\n\
    #\n# Count all of the words on standard input\n#\n\ncount=0\nwhile read line\n\
    do\n        set -- $line\n        count=$(( count + $# ))\ndone\n\necho $count\n\
    $\n```\n```\n\nAfter each line is read, the set command assigns all the positional\
    \ parameters to the new line of information, which resets $# to the number of\
    \ words on the line. The -- option is included in case any of the lines begins\
    \ with a - or is blank or lacks any alphanumeric characters.\n\nThe value of $#\
    \ is then added to the variable count, and the next line is read. When the loop\
    \ is exited due to the end of file being encountered, the value of count is displayed;\
    \ that is, the total number of words read.\n\n```\n```sh\n$ words < /etc/passwd\n\
    567\n$ wc -w < /etc/passwd\n567\n$\n```\n```\n\n*Check against wc*\n\nWe admit,\
    \ this is a rather weird way to figure out how many words are in a file, but as\
    \ you can see, the set command is more versatile than most Unix users realize.\n\
    \nHere’s a quick way to count the number of files in your directory:\n\n```\n\
    ```sh\n$ set *\n$ echo $#\n8\n$\n```\n```\n\nThis is much faster than\n\n```\n\
    ```sh\nls | wc -l\n```\n```\n\nbecause the first method uses only shell built-in\
    \ commands. In general, your shell programs run much faster if you try to get\
    \ as much done as you can using the shell’s built-in commands."
  merge: -1
  img_proc: true
- pgno: 270
  md: "# ## Other Options to set\n\n`set` accepts several other options, each enabled\
    \ by preceding the option with a `-`, and disabled by preceding it with a `+`.\
    \ The `-x` option that we have described here is the most commonly used but others\
    \ are summarized in Appendix A, Table A.9.\n\n# ## The IFS Variable\n\nThere is\
    \ a special shell variable called `IFS`, which stands for *internal field separator*.\
    \ The shell uses the value of this variable when parsing input from the read command,\
    \ output from command substitution (the back-quoting mechanism), and when performing\
    \ variable substitution. Succinctly, `IFS` contains a set of characters that are\
    \ used as whitespace separators. If it’s typed on the command line, the shell\
    \ treats it like a normal whitespace character (that is, as a word delimiter).\n\
    \nSee what it’s set to now:\n\n```\n```sh\n$ echo \"$IFS\"\n\n$\n```\n```\n\n\
    Well, that wasn’t very illuminating! To determine the actual characters stored\
    \ in there, pipe the output from `echo` into the `od` (*octal dump*) command with\
    \ the `-b` (*byte display*) option:\n\n```\n```sh\n$ echo \"$IFS\" | od -b\n0000000\
    \ 040 011 012 012\n0000004\n$\n```\n```\n\nThe first column of numbers shown is\
    \ the relative offset from the start of the input. The following numbers are the\
    \ octal equivalents of the characters read by `od`. The first such number is `040`,\
    \ which is the ASCII value of the space character. It’s followed by `011`, the\
    \ tab character, and then by `012`, the newline character. The next character\
    \ is another newline which was added by `echo`. This set of characters for `IFS`\
    \ should come as no surprise; they’re the whitespace characters we’ve talked about\
    \ throughout the book.\n\nWhere this gets interesting is the fact that you can\
    \ change `IFS` to any character or character set desired. This can be particularly\
    \ useful when you want to parse a line of data whose fields aren’t delimited by\
    \ the normal whitespace characters.\n\nFor example, we noted that the shell normally\
    \ strips leading whitespace characters from the beginning of any line you read\
    \ with the `read` command. Change `IFS` to just a newline character before the\
    \ read is executed, however, and it will preserve the leading whitespace (because\
    \ the shell won’t consider it a field delimiter):\n\n```\n```sh\n$ read line \
    \                        Try it the “old” way\n             Here's a line\n\n\
    $ echo \"$line\"\nHere's a line\n```\n```"
  merge: -1
  img_proc: true
- pgno: 271
  md: "```\n```sh\n$ IFS=\"\n> \"\n$ read line\n        Here's a line\n$ echo \"$line\"\
    \n        Here's a line\n$\n```\n```\n\nSet it to just a newline\n\nTry it again\n\
    \nLeading spaces preserved\n\nTo change IFS to just a newline, an open quote was\
    \ typed, followed immediately by pressing the Enter key, followed by the closing\
    \ quote on the next line. No additional characters can be typed inside those quotes\
    \ because they’ll be stored inside IFS and then used by the shell.\n\nNow let’s\
    \ change IFS to something more visible, the colon:\n\n```\n```sh\n$ IFS=:\n$ read\
    \ x y z\n123:345:678\n$ echo $x\n123\n$ echo $z\n678\n$ list=\"one:two:three\"\
    \n$ for x in $list; do echo $x; done\none\ntwo\nthree\n$ var=a:b:c\n$ echo \"\
    $var\"\na:b:c\n$\n```\n```\n\nBecause IFS was changed to a colon, when the line\
    \ was read, the shell divided it into three words: 123, 345, and 678, which were\
    \ then stored into the three variables x, y, and z. In the next-to-last example,\
    \ the shell used IFS when substituting the value of list in the for loop. The\
    \ last example demonstrates that the shell doesn’t use IFS when performing variable\
    \ assignment.\n\nChanging IFS is often done in conjunction with the set command:\n\
    \n```\n```sh\n$ line=\"Micro Logic Corp.:Box 174:Hackensack, NJ 07602\"\n$ IFS=:\n\
    $ set $line\n$ echo $#\n3\n$\n$ for field; do echo $field; done\nMicro Logic Corp.\n\
    Box 174\nHackensack, NJ 07602\n$\n```\n```\n\nHow many parameters were set?"
  merge: -1
  img_proc: true
- pgno: 272
  md: "This technique is a powerful one because it uses all built-in shell commands\
    \ which makes it very fast. This technique is used in the final version of the\
    \ `rolo` program as presented in Chapter 13.\n\nThe following program, called\
    \ `number2` is a final version of the line numbering program presented in Chapter\
    \ 9. This program prints the input lines to standard output, preceded by a line\
    \ number, modifying `IFS` to ensure that leading spaces and other whitespace characters\
    \ on each line of input are faithfully stored and reproduced, unlike the earlier\
    \ version of the program. Notice also the use of `printf` to right-align the line\
    \ numbers.\n\n```\n```sh\n$ cat number2\n#\n# Number lines from files given as\
    \ argument or from\n# standard input if none supplied (final version)\n#\n\n#\
    \ Modify the IFS to preserve leading whitespace on input\n\nIFS='\n'   # Just\
    \ a newline appears between the quotes\n\nlineno=1\n\ncat $* |\nwhile read -r\
    \ line\ndo\n        printf \"%5d:%s\\n\" $lineno \"$line\"\n        lineno=$((\
    \ lineno + 1 ))\ndone\n```\n```\n\nHere’s a sample execution of number:\n\n```\n\
    ```text\n$ number2 words\n  1:#\n  2:# Count all of the words on standard input\n\
    \  3:#\n  4:\n  5:count=0\n  6:while read line\n  7:do\n  8:  set -- $line\n \
    \ 9:  count=$(( count + $# ))\n 10:done\n 11:\n 12:echo $count\n$\n```\n```"
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Because `IFS` has an influence on the way things are interpreted by the shell,
    if you’re going to change it in your program it’s usually wise to save the old
    value first in another variable (such as `OIFS`) and then restore it after you’ve
    finished the operations.


    # The `readonly` Command


    The readonly command is used to specify variables whose values cannot be subsequently
    changed. For example,


    ```

    readonly PATH HOME

    ```


    marks both `PATH` and `HOME` variables as read-only. Subsequent attempts to assign
    a value to either variable causes the shell to issue an error message:


    ```

    $ PATH=/bin:/usr/bin:.

    $ readonly PATH

    $ PATH=$PATH:/users/steve/bin

    sh: PATH: is read-only

    $

    ```


    Here you see that after the variable PATH was made read-only, the shell printed
    an error message when an attempt was made to assign a value to it.


    To get a list of your read-only variables, type `readonly -p` without any arguments:


    ```

    $ readonly -p

    readonly PATH=/bin:/usr/bin:.

    $

    ```


    The read-only variable attribute is not passed down to subshells. Also, after
    a variable has been made read-only in a shell, there is no way to “undo” it.


    # The `unset` Command


    Sometimes you may want to remove the definition of a variable from your environment.
    To do so, you type unset followed by the names of the variables:


    ```

    $ x=100

    $ echo $x

    100

    $ unset x    _Remove x from the environment_

    $ echo $x


    $

    ```


    You can’t unset a read-only variable. Furthermore, the variables `IFS`, `MAILCHECK`,
    `PATH`, `PS1`, and `PS2` cannot be unset.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# # Loose Ends


    We''ve put commands and features into this chapter that did not fit into earlier
    chapters.

    There''s no particular rationale for their order of presentation, so this is your
    chance to simply

    expand your knowledge of shell programming tricks and techniques.


    # ## The `eval` Command


    This section describes one of the more unusual shell commands: `eval`. Its format
    is as follows:


    ```

    eval command-line

    ```


    where `command-line` is a normal command line that you would type at the terminal.
    When

    you put `eval` in front of it, however, the effect is that the shell scans the
    command line twice

    before executing it, which can be very useful if the script is building a command
    that needs to

    be invoked, among other purposes.


    For the simple case, using eval seems to have no effect:


    ```

    $ eval echo hello

    hello

    $

    ```


    But consider the following example without the use of eval:


    ```

    $ pipe="|"

    $ ls $pipe wc -l

    |: No such file or directory

    wc: No such file or directory

    -l: No such file or directory

    $

    ```


    Those ls errors are because the value of pipe and the subsequent call to wc -l
    are all interpreted as command arguments. The shell takes care of pipes and I/O
    redirection before variable substitution, so it never properly interprets the
    pipe symbol inside pipe.


    Putting eval in front of the command sequence gives the desired results, however:'
  merge: -1
  img_proc: true
- pgno: 275
  md: "```\n```sh\n$ eval ls $pipe wc -l\n             16\n$\n```\n```\n\nThe first\
    \ time the shell scans the command line, it substitutes `|` as the value of pipe.\
    \ Then eval causes it to rescan the line, at which point the `|` is recognized\
    \ by the shell as the pipe symbol and everything proceeds as desired.\n\nThe eval\
    \ command is frequently used in shell programs that build up command lines inside\
    \ one or more variables. If the variables contain any characters that must be\
    \ interpreted by the shell, eval is essential. Command terminator (`;`, `|`, `&`,\
    \ `>`, `<`), I/O redirection (`<`, `>`), and quote characters are among the characters\
    \ that must appear directly on the command line to have special meaning to the\
    \ shell.\n\nFor the next example, consider the program last whose sole purpose\
    \ is to display the last argument passed to it. Recall the mycp program from Chapter\
    \ 9 where we accomplished this task by shifting all the arguments until only one\
    \ was left.\n\nIt turns out you can accomplish the same result by using eval:\n\
    \n```\n```sh\n$ cat last\neval echo \\$\\#\n$ last one two three four\nfour\n\
    $ last *                         Get the last file\nzoo_report\n$\n```\n```\n\n\
    The first time the shell scans\n\n```\n```sh\necho \\$\\#\n```\n```\n\nthe backslash\
    \ tells it to ignore the `$` that immediately follows. After that, it encounters\
    \ the special parameter `$#`, so it substitutes its value on the command line.\
    \ The command now looks like this:\n\n```\n```sh\necho $4\n```\n```\n\nThe backslash\
    \ is removed by the shell after the first scan. When the shell rescans this line,\
    \ it substitutes the value of `$4` and then executes echo.\n\nThis same technique\
    \ could be used if you had a variable called arg that contained a digit, for example,\
    \ and you wanted to display the positional parameter referenced by arg. You could\
    \ simply write\n\n```\n```sh\neval echo \\$\\$arg\n```\n```\n\nThe only problem\
    \ with this approach is that only the first nine positional parameters can be\
    \ accessed this way because accessing positional parameters 10 and above requires\
    \ the `${n}` notation. So here's a second attempt:\n\n```\n```sh\neval echo \\\
    ${$arg}\n```\n```"
