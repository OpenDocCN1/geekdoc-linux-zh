- pgno: 43
  md: "# Filename Substitution\n\n# The Asterisk\n\nOne powerful feature of the Unix\
    \ system that is handled by the shell is *filename substitution*. Let’s say that\
    \ your current directory has these files in it:\n\n```\n```text\n$ ls\nchapt1\n\
    chapt2\nchapt3\nchapt4\n$\n```\n```\n\nSuppose that you want to display their\
    \ contents en masse. Easy: `cat` allows you to display the contents of as many\
    \ files as you specify on the command line. Like this:\n\n```\n```text\n$ cat\
    \ chapt1 chapt2 chapt3 chapt4\n    ...\n$\n```\n```\n\nBut that’s tedious. Instead,\
    \ you can take advantage of filename substitution by simply typing:\n\n```\n```text\n\
    $ cat *\n    ...\n$\n```\n```\n\nThe shell automatically substitutes the names\
    \ of all the files in the current directory that match the pattern *. The same\
    \ substitution occurs if you use * with another command too, of course. How about\
    \ echo?\n\n```\n```text\n$ echo *\nchapt1 chapt2 chapt3 chapt4\n$\n```\n```\n\n\
    Here the * is again replaced with the names of all the files contained in the\
    \ current directory, and the echo command simply displays that list to you.\n\n\
    Any place that * appears on the command line, the shell performs its substitution:\n\
    \n```\n```text\n$ echo * *\nchapt1 chapt2 chapt3 chapt4 : chapt1 chapt2 chapt3\
    \ chapt4\n$\n```\n```\n\nThe * is part of a rich file substitution language, actually,\
    \ and it can also be used in combination with other characters to limit which\
    \ filenames are matched.\n\nFor example, let’s say that in your current directory\
    \ you have not only chapt1 through chapt4 but also files a, b, and c:\n\n```\n\
    ```text\n$ ls\na\nb\n```\n```"
  merge: -1
  img_proc: true
- pgno: 44
  md: "```\n```text\nc\nchap1\nchap2\nchap3\nchap4\n$\n```\n```\n\nTo display the\
    \ contents of just the files beginning with chap, you can type in\n\n```\n```sh\n\
    $ cat chap*\n    .\n    .\n    .\n$\n```\n```\n\nThe chap* matches any filename\
    \ that begins with chap. All such filenames matched are substituted on the command\
    \ line before the specified command is even invoked.\n\nThe * is not limited to\
    \ the end of a filename; it can be used at the beginning or in the middle as well:\n\
    \n```\n```sh\n$ echo *t1\nchap1\n$ echo *t*\nchap1 chap2 chap3 chap4\n$ echo *x\n\
    *x\n$\n```\n```\n\nIn the first echo, the *t1 specifies all filenames that end\
    \ in the characters t1. In the second echo, the first * matches everything up\
    \ to a t and the second everything after; thus, all filenames containing a t are\
    \ printed. Because there are no files ending with x, no substitution occurs in\
    \ the last case. Therefore, the echo command simply displays *x.\n\n# Matching\
    \ Single Characters\n\nThe asterisk (*) matches zero or more characters, meaning\
    \ that *x* matches the file x as well as x1, x2, xabc, and so on. The question\
    \ mark (?) matches exactly one character. So cat? will display all files that\
    \ have filenames of exactly one character, just as cat ?x prints all files with\
    \ two-character names beginning with x. Here we see this behavior illustrated\
    \ again with echo:\n\n```\n```sh\n$ ls\na\naa\naax\nalice\nb\nbb\nc\ncc\n```\n\
    ```"
  merge: -1
