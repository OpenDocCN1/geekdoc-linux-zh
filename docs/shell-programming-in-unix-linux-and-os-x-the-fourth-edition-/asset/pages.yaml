- pgno: 249
  md: '![](img/29b87b4d3daf7eb41fe5066130730f4c_249_0.png)


    Figure 10.7   Executing db


    # The `exec` Command


    Within the db program, once the shell process completed, you were done with everything,
    as demonstrated by the fact that no commands followed `/bin/sh` in the program.
    Instead of having db wait around for the subshell to finish, you can use the exec
    command to replace the current program (db) with the new one (/bin/sh).


    The general format of exec is


    ```

    exec program

    ```


    Because the exec’ed program replaces the current one, there’s one less process
    hanging around, which helps the system run quickly. The startup time of an exec’ed
    program is quicker too, due to how Unix system execute processes.


    To use exec in the db program, you simply replace the last line with


    ```

    exec /bin/sh

    ```'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'After this statement is executed, `db` will be replaced by `/bin/sh`. This
    means that it would now be pointless to have any commands following the `exec`
    because they’ll never be executed.


    `exec` can also be used to close standard input and reopen it with any file that
    you want to read. To change standard input to `infile`, for example, use the `exec`
    command in the form


    ```

    exec < infile

    ```


    Any commands that subsequently read data from standard input will read from `infile`.


    Redirection of standard output is done similarly. The command


    ```

    exec > report

    ```


    redirects all subsequent output written to standard output to the file `report`.
    Note in both of the previous examples that `exec` is not used to start up execution
    of a new program, just used to reassign standard input or standard output.


    If you use `exec` to reassign standard input and later want to reassign it someplace
    else, you can simply invoke `exec` again. To reassign standard input back to the
    terminal, you would write


    ```

    exec < /dev/tty

    ```


    The same concept also applies to reassignment of standard output.


    # The `(…)` and `{ …; }` Constructs


    Sometimes you want to group a set of commands together. For example, you may want
    to push a sort followed by your `plotdata` program into the background. Not connected
    with a pipe; just two commands one after the other.


    It turns out that you can group a set of commands together by enclosing them in
    parentheses or braces. The first form causes the commands to be executed by a
    subshell, the latter form by the current shell.


    Here are some examples to illustrate how they work:


    ```

    ```text

    $ x=50

    $ (x=100)

    $ echo $x

    50

    $ { x=100; }

    $ echo $x

    100

    $ pwd

    /users/steve

    $ (cd bin; ls)

    add

    greetings

    lu

    number

    ```

    ```


    _Execute this in a subshell_


    _Didn''t change_


    _Execute this in the current shell_


    _Where am I?_


    _Change to bin and do an `ls`_'
  merge: -1
  img_proc: true
- pgno: 251
  md: '```

    phonebook

    rem

    rolo

    $ pwd

    /users/steve                 No change

    $ { cd bin; }                 This should change me

    $ pwd

    /users/steve/bin

    $

    ```


    If the commands enclosed in the braces are all going to be on the same line, a
    space must follow the left brace, and a semicolon must appear after the command.
    Look closely at the statement above—{ cd bin; }—for an example.


    Parentheses work differently. As the example


    ```

    (cd bin; ls)

    ```


    demonstrates, parentheses are useful for executing commands without affecting
    the current environment.


    You can also use them for other purposes like pushing a set of commands into the
    background:


    ```

    $ (sort 2016data -o 2016data; plotdata 2016data) &

    [1]   3421

    $

    ```


    The parentheses group the sort and plotdata commands together so that they can
    be sent to the background with their order of execution preserved.


    Input and output can also be piped to and from these constructs, and I/O can be
    redirected too, which makes them darn helpful to shell programmers.


    In the next example, a dot-prefaced nroff command—l1s 2—is effectively prepended
    to the beginning of the file memo before being sent to nroff for processing.


    ```

    $ { echo ".ls 2"; cat memo; } | nroff -Tlp | lp

    ```


    In the command sequence


    ```

    $ { prog1; prog2; prog3; } 2> errors

    ```


    all messages written to standard error by the three programs are collected into
    the file errors.


    As a final example, let’s return to the waitfor program from Chapter 8. As you’ll
    recall, this program periodically checks for a user logging on to the system.
    You’ll recall that it would be nice if the program could somehow automatically
    “send itself” to the background. Now you know how to do it: Simply enclose the
    until loop and the commands that follow within parentheses and send the entire
    grouping into the background:


    ```

    $ cat waitfor

    #

    # Wait until a specified user logs on -- version 4

    #

    ```'
