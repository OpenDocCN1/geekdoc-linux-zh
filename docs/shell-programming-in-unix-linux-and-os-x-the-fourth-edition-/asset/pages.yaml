    # The exec Command


    *General Format:* `exec command args`


    When the shell executes the exec command, it initiates execution of the specified
    *command* with the indicated arguments. Unlike other commands, *command* replaces
    the current process (that is, no new process is created). After *command* starts
    execution, there is no return to the program that initiated the exec.


    If just I/O redirection is specified, the input and/or output for the shell is
    accordingly redirected.


    # Examples


    | Command | Description |

    |---|---|

    | `exec /bin/sh` | Replace current process with `sh` |

