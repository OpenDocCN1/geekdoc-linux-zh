    # The `read` Command


    *General Format:* `read vars`


    This command causes the shell to read a line from standard input and assign successive
    whitespace-delimited words from the line to the variables `vars`. If fewer variables
    are listed than there are words on the line, the additional words are stored in
    the last variable.


    Specifying just one variable has the effect of reading and assigning an entire
    line to the variable.


    The exit status of `read` is zero unless an end-of-file condition is encountered.


    *Examples*


    ```

    $ read hours mins

    10 19

    $ echo "$hours:$mins"

    10:19

    $ read num rest

    39 East 12th Street, New York City 10003

    $ echo "$num\n$rest"

    39

    East 12th Street, New York City 10003

    ```'
