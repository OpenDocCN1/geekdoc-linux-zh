  md: "```\n```sh\ncommand_t\ncommand\n...\nfi\n```\n```\n\n`command_t` is executed\
    \ and its exit status tested. If it is zero, the commands that follow up to the\
    \ `fi` are executed. Otherwise, the commands that follow up to the `fi` are skipped.\n\
    \n*Example*\n\n```\n```sh\nif grep $sys sysnames > /dev/null\nthen\n        echo\
    \ \"$sys is a valid system name\"\nfi\n```\n```\n\nIf the grep returns an exit\
