  md: "# The `fg` Command\n\n*General Format:* `fg job_id`\n\nIf job control is enabled,\
    \ the job specified by `job_id` is brought to the foreground. If no argument is\
    \ given, the most recently suspended job or the job last sent to the background\
    \ is brought to the foreground.\n\n*Example*\n\n```\nfg %2\n```\n\n# The `for`\
    \ Command\n\n*General Format:*\n\n```\nfor var in word₁ word₂ ... wordₙ\ndo\n\n\
    \    command\n    command\n        ...\n\ndone\n```\n\nExecution of this command\
    \ causes the commands enclosed between the do and done to be executed as many\
    \ times as there are words listed after the in.\n\nThe first time through the\
    \ loop, the first word—`word₁`—is assigned to the variable `var` and the commands\
    \ between the do and done executed. The second time through the loop, the second\
    \ word listed—`word₂`—is assigned to `var` and the commands in the loop executed\
    \ again.\n\nThis process continues until the last variable in the list—`wordₙ`—is\
    \ assigned to `var` and the commands between the do and done executed. At that\
    \ point, execution of the for loop is terminated. Execution then continues with\
    \ the command that immediately follows the done.\n\nThe special format\n\n```\n\
    for var\ndo\n    ...\ndone\n```\n\nindicates that the positional parameters “$1”,\
    \ “$2”, ... are to be used in the list and is equivalent to\n\n```\nfor var in\
    \ \"$@\"\ndo\n    ...\ndone\n```\n\n*Example*\n\n```\n# nroff all of the files\
    \ in the current directory\nfor file in *\n```"
