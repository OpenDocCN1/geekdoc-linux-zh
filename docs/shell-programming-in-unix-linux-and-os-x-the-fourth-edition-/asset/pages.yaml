  md: '# The `continue` Command


    *General Format:* `continue`


    Execution of this command from within a `for`, `while`, or `until` loop causes
    any commands that follow the `continue` to be skipped. Execution of the loop then
    continues as normal.


    If the format


    `continue n`


    is used, the commands within the *n* innermost loops are skipped. Execution of
    the loops then continues as normal.


    # The `echo` Command


    *General Format:* `echo args`


    This command causes *args* to be written to standard output. Each word from *args*
    is delimited by a blank space. A newline character is written at the end. If *args*
    is omitted, the effect is to simply skip a line.


    Certain backslashed characters have a special meaning to `echo` as shown in Table
    A.8.


    Table A.8　`echo` **Escape Characters**


    | Character | Prints |

    |---|---|

    | `\a` | Alert |

    | `\b` | Backspace |

    | `\c` | The line without a terminating newline |

    | `\f` | Formfeed |

    | `\n` | Newline |

    | `\r` | Carriage return |

    | `\t` | Tab character |

    | `\v` | Vertical tab character |

    | `\\` | Backslash character |

    | `\0nnn` | The character whose ASCII value is *nnn*, where *nnn* is a one- to
    three-digit octal number that starts with a zero |


    Remember to quote these characters so that the `echo` command, rather than the
    shell, interprets them.'
