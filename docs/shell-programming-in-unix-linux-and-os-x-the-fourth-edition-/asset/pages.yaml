  md: '# tr


    The tr filter is used to translate characters from standard input. The general
    form of the command is


    ```

    tr from-chars to-chars

    ```


    where *from-chars* and *to-chars* are one or more characters or a set of characters.
    Any character in *from-chars* encountered in the input will be translated into
    the corresponding character in *to-chars*. The result of the translation is written
    to standard output.


    In its simplest form, tr can be used to translate one character into another.
    Recall the file intro from earlier in this chapter:


    ```

    $ cat intro

    The UNIX operating system was pioneered by Ken

    Thompson and Dennis Ritchie at Bell Laboratories

    in the late 1960s. One of the primary goals in

    the design of the UNIX system was to create an

    environment that promoted efficient program

    development.

    $

    ```


    The following shows how tr can be used to translate all letter ‘e’ to x’s:


    ```

    $ tr e x intro

    Thx UNIX opxrating systxm was pionxxrxd by Kxn

    Thompson and Dennis Ritchie at Bxll Laboratorixs

    in thx latx 1960s. Onx of thx primary goals in

    thx dxsign of thx UNIX systxm was to crxatx an

    xnvironmxnt that promotxd xffici xnt program

    dxvelopment.

    $

    ```


    The input to tr must be redirected from the file intro because tr always expects
    its input to come from standard input. The results of the translation are written
    to standard output, leaving the original file untouched. Showing a more practical
    example, recall the pipeline that you used to extract the usernames and home directories
    of everyone on the system:


    ```

    $ cut -d: -f1,6 /etc/passwd

    root:/

    cron:/

    bin:/

    uucp:/usr/spool/uucp

    asg:/

    steve:/users/steve

    other:/

    $

    ```


    You can translate the colons into tab characters to produce a more readable output
    simply by tacking an appropriate tr command to the end of the pipeline:'
  merge: -1
  img_proc: true
- pgno: 94
  md: '```

    ```sh

    $ cut -d: -f1,6 /etc/passwd | tr '':'' '' ''

    root    /

    cron    /

    bin     /

    uucp    /usr/spool/uucp

    asg     /

    steve   /users/steve

    other   /

    $

    ```

    ```


    Enclosed between the single quotes is a tab character (even though you can’t see
    it—just take our word for it). It must be enclosed in quotes to keep it from being
    parsed and discarded by the shell as extraneous whitespace.


    Working with characters that aren’t printable? The octal representation of a character
    can be given to `tr` in the format


    ```

    ```text

    \nnn

    ```

    ```


    where `nnn` is the octal value of the character. This isn’t used too often, but
    can be handy to remember.


    For example, the octal value of the tab character is 11, so another way to accomplish
    the colon-to-tab transformation is to use the `tr` command


    ```

    ```sh

    tr '':'' ''\11''

    ```

    ```


    Table 3.3 lists characters that you’ll often want to specify in octal format.


    **Table 3.3  Octal Values of Some ASCII Characters**


    | Character | Octal value |

    |---|---:|

    | Bell | 7 |

    | Backspace | 10 |

    | Tab | 11 |

    | Newline | 12 |

    | Linefeed | 12 |

    | Formfeed | 14 |

    | Carriage Return | 15 |

    | Escape | 33 |


    In the following example, `tr` takes the output from `date` and translates all
    spaces into newline characters. The net result is that each field of output appears
    on a different line:


    ```

    ```sh

    $ date | tr -s '' '' ''\12''    # Translate spaces to newlines

    Sun

    ```

    ```'
