    # ## Quoting


    Four different types of quoting mechanisms are recognized, as summarized in Table
    A.5.


    Table A.5  **Summary of Quotes**


    | Quote | Description |

    |---|---|

    | `''...''` | Removes special meaning of all enclosed characters. |

    | `"..."` | Removes special meaning of all enclosed characters except $, `, \\,
    and \\. |

    | `\\c` | Removes special meaning of character *c* that follows; inside double
    quotes removes special meaning of $, `, ", newline, and \\ that follows, but is
    otherwise not interpreted; used for line continuation if it appears as last character
    on line (newline is removed). |

    | `''command''` or `$(command)` | Executes *command* and inserts standard output
    at that point. |


    # ## Tilde Substitution


    Each word and shell variable on a command line is checked to see whether it begins
    with an unquoted ~. If it does, the rest of the word or variable up to a / is
    considered a login name and is looked up in a system file, typically /etc/passwd.
    If that user exists, their home directory replaces the ~ and the login name. If
    that user doesn’t exist, the text is unchanged. A ~ by itself or followed by a
    / is replaced by the HOME variable.'
