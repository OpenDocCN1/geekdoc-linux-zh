- pgno: 22
  md: 'Chapter 14, “Interactive and Nonstandard Shell Features,” discusses features
    of the shell that either are not formally part of the IEEE POSIX standard shell
    (but are available in most Unix and Linux shells) or are mainly used interactively
    instead of in programs.


    Appendix A, “Shell Summary,” summarizes the features of the IEEE POSIX standard
    shell.


    Appendix B, “For More Information,” lists references and resources, including
    the Web sites where different shells can be downloaded.


    The philosophy of this book uses is to teach by example. We believe that properly
    chosen examples do a far better job of illustrating how a particular feature is
    used than ten times as many words. The old “A picture is worth ...” adage seems
    to apply just as well to coding.


    We encourage you to type in each example and test it on your own system, for only
    by doing can you become adept at shell programming. Don’t be afraid to experiment.
    Try changing commands in the program examples to see the effect, or add different
