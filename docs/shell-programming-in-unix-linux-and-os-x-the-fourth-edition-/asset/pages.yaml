  md: 'waits for the last process sent to the background to complete execution. With
    some intermediate variables involved, you can also save their process ID values
    for later access too:


    ```

    prog1 &

    pid1=$!

    ...

    prog2 &

    pid2=$!

    ...

    wait $pid1        # wait for prog1 to finish

    ...

    wait $pid2        # wait for prog2 to finish

    ```


    Tip: Want to test if a process you’ve launched is still running? The ps command
    can check if you use the -p flag and the process ID.


    # # The `trap` Command


    When you press the DELETE or BREAK key at your terminal during execution of a
    shell program, that program is typically terminated and you’re prompted for your
    next command. This may not always be desirable in shell programs. For instance,
    you may end up leaving a bunch of temporary files that won’t get cleaned up as
    they would on normal program completion.


    Pressing the DELETE key sends what’s known as a signal to the executing program,
    and programs can specify what action should be taken on receipt of the signal
    rather than just relying on default actions like immediately exiting the process.


    Signal handling in a shell program is done with the trap command, whose general
    format is


    ```

    trap commands signals

    ```


    where commands is one or more commands that will be executed whenever any of the
    signals specified by signals is received.


    Mnemonic names and numbers are assigned to the different types of signals, and
    the more commonly used ones are summarized in Table 12.1. A more complete list
    is given under the trap command in Appendix A.


    Table 12.1 **Commonly Used Signal Numbers**


    | Signal | Mnemonic Name | Generated for |

    |---:|---|---|

    | 0 | `EXIT` | Exit from the shell |

    | 1 | `HUP` | Hangup |

    | 2 | `INT` | Interrupt (for example, DELETE, `Ctrl+c` key) |

    | 15 | `TERM` | Software termination signal (sent by `kill` by default) |'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'As an example of the trap command, the following shows how you can remove some
    files and then exit if someone tries to interrupt the program from the terminal:


    ```

    trap "rm $WORKDIR/work1$$ $WORKDIR/dataout$$; exit" INT

    ```


    Once this trap is executed, the two files work1$$ and dataout$$ will be automatically
    removed if a SIGINT (signal number 2) is received by the program. If the user
    interrupts execution of the program after this trap is executed, you can be assured
    that these two temporary files will be removed, not left around in the file system.
    The exit that follows the rm is necessary because without it execution would continue
    in the program at the point that it left off when the signal was received.


    Signal number 1—SIGHUP or just HUP—is generated for hangup: originally this related
    to dialup connections, but now more generally refers to an unexpected disconnect
    like the Internet connection dropping. You can modify the preceding trap to also
    remove the two specific files in this case by adding a SIGINT to the list of signals:


    ```

    trap "rm $WORKDIR/work1$$ $WORKDIR/dataout$$; exit" INT HUP

    ```


    Now these files will be removed if the line gets hung up or if the user interrupts
    processing with the DELETE key or Ctrl+C.


    The sequence specified to trap (also known as the trap handler) must be enclosed
    in quotes if it contains more than one command. Also note that the shell scans
    the command line at the time that the trap command gets executed and also again
    when one of the listed signals is received.


    In the preceding example, the value of WORKDIR and $$ will be substituted at the
    time that the trap command is executed. If you wanted this substitution to occur
    at the time that a signal was received, you can put the commands inside single
    quotes:


    ```

    trap ''rm $WORKDIR/work1$$ $WORKDIR/dataout$$; exit'' INT HUP

    ```


    The trap command can be used to make your programs more user friendly too. In
    a further revision to the rolo program in the next chapter, the Ctrl+C interrupt
    signal will be caught by the program and return the user to the main menu, not
    have the program quit completely.


    # trap with No Arguments


    Executing trap with no arguments results in the display of any trap handlers that
    you have defined or modified:


    ```

    $ trap ''echo logged off at $(date) >>$HOME/logoffs'' EXIT

    $ trap                         List changed traps

    trap - ''echo logged off at $(date) >>$HOME/logoffs'' EXIT

    $ Ctrl+d                       Log off

    login: steve                  Log back in

    Password:

    $ cat $HOME/logoffs            See what happened

    logged off at Wed Oct  2 15:11:58 EDT 2002

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'A trap was set to be executed whenever the shell exited—signal 0, `EXIT`—was
    received by the shell. Because this was set in the login shell, the trap handler
    is used when you log off to write the time you logged off into the file `$HOME/logoffs`.
    The command is enclosed in single quotes to prevent the shell from executing date
    when the trap is defined.


    The trap command is then executed with no arguments which lists the new action
    to be taken for signal 0 (`EXIT`). When Steve then logs off and back on again,
    the file `$HOME/logoffs` verifies that the echo command was executed and the trap
    worked.


    # Ignoring Signals


    If the command listed for `trap` is null, the specified signal will be ignored
    when received. For example, the command


    ```

    trap "" SIGINT

    ```


    specifies that the interrupt signal is to be ignored. You might want to ignore
    certain signals when performing some operation that you don’t want interrupted.


    Note that `trap` lets you specify signals by signal number, by shortened name
    (`INT`) or by the full signal name (`SIGINT`). We encourage you to use mnemonic
    names to help produce readable code, but it is, of course, up to you which you
    prefer.


    In the above example, the first argument must be specified as a null value for
    a signal to be ignored and is not equivalent to writing the following, which has
    a separate meaning of its own:


    ```

    trap 2

    ```


    If you ignore a signal, all subshells also ignore that signal. If you specify
    a signal handler action, however, all subshells will automatically take the default
    action on receipt of that signal, not the new code sequence.


    Suppose that you execute the command


    ```

    trap "" 2

    ```


    and then start a subshell, which in turn executes other shell programs as subshells.
    If an interrupt signal is then generated, it will have no effect on the shells
    or subshells that are executing because they will all ignore the signal by default.


    If instead of executing the previous `trap` command you execute


    ```

    trap : 2

    ```


    and then execute your subshells, then the current shell will do nothing on receipt
    of an interrupt (it will execute the null command), while subshells will be terminated
    (the default action).'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Resetting Traps


    After you’ve changed the default action to be taken on receipt of a signal, you
    can change it back again with trap if you simply omit the first argument; so


    ```

    trap HUP INT

    ```


    resets the action to be taken on receipt of the SIGHUP or SIGINT signals back
    to the default behavior for the shell.


    Many shell programs also use a construct like this


    ```

    trap "/bin/rm -f $tempfile; exit" INT QUIT EXIT

    ```


    to ensure that the rm command won’t produce an error message if the temporary
    file hasn’t yet been created upon exit. The trap handler removes the temporary
    file if it exists and does nothing if it doesn’t.


    # More on I/O


    You know about the standard constructs <, >, and >> for input redirection, output
    redirection, and output redirection with append, respectively. You also know that
    you can redirect standard error from any command simply by writing 2> instead
    of just >:


    ```

    command 2> file

    ```


    Sometimes you may want to explicitly write to standard error in your program.
    With a slight variation on the above, you can redirect standard output to standard
    error by writing


    ```

    command > &2

    ```


    The notation >& specifies output redirection to a file associated with the file
    descriptor that follows. File descriptor 0 is standard input, descriptor 1 is
    standard output, and descriptor 2 is standard error. It’s important to remember
    that no space is permitted between the > and the &.


    To write a message to standard error:


    ```

    echo "Invalid number of arguments" >&2

    ```


    You may want to redirect both standard output (often abbreviated “stdout”) and
    standard error output (“stderr”) from a program into the same file. If you know
    the name of the file, this is straightforward:


    ```

    command > foo 2>> foo

    ```


    Here both stdout and stderr will be written to foo.


    You can also write


    ```

    command > foo 2>&1

    ```


    to achieve the same effect; standard output is redirected to foo, and standard
    error is redirected to standard output (which has already been redirected to foo).
    Because the shell evaluates'
