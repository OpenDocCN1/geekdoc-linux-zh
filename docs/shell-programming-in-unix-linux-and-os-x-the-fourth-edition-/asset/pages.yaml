- pgno: 237
  md: 'To keep things neat and organized, the program was created in steve’s /bin
    subdirectory, as shown:


    ```

    $ pwd

    /users/steve/bin

    $

    ```


    Change directory to anywhere else on the system:


    ```

    $ cd                                      *Go home*

    $

    ```


    And try to look up Liz in the phone book:


    ```

    $ rolo Liz

    sh: rolo: not found

    $

    ```


    Uh oh, that’s not good. What happened?


    Whenever you type in the name of a program, the shell searches a list of directories
    until it finds the requested program. When found, the program is started up. This
    list of directories to search for user commands is stored in a shell variable
    called PATH and it’s automatically set when you log on. To see what it’s set to
    at any point, use echo:


    ```

    $ echo $PATH

    /bin:/usr/bin:.

    $

    ```


    Chances are that your PATH has a somewhat different value, but don’t worry about
    that—it’s just variations in system configuration. The important thing to notice
    is that directories are separated by a colon (:) and that the shell searches them
    in order, left to right, to find requested commands or programs.


    In the preceding example, three directories are listed: /bin, /usr/bin, and .,
    (which, you’ll recall, stands for the current directory). So whenever you type
    in the name of a program, the shell searches the directories listed in PATH until
    it finds a matching executable file. Type in rolo and the shell first looks for
    /bin/rolo, then /usr/bin/rolo, then, finally, ./rolo in the current directory.
    As soon as it finds a match the shell executes it, but if the shell doesn’t find
    rolo in any of the directories specified in PATH, it issues a “not found” error.


    To have the current directory searched before anything else, put the period at
    the start of PATH:


    ```

    .:/bin:/usr/bin

    ```


    Warning! For security reasons, it’s not a good idea to have your current directory
    searched before the system ones.


    This is to avoid a Trojan horse attack: Imagine that someone creates their own
    version of a command like su (which allows you to switch to root or superuser
    status by prompting for the admin password) in a directory then waits for another
    user to change to that directory and run the command. If PATH specifies that the
    current directory be searched first, then the modified version of su will be executed.
    The problem is, this version prompts for the password, emails'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'it to the malicious user, deletes itself, and prints out an innocuous error
    message. Reinvoked, password retyped, it all works fine and the administrator
    account has just been compromised without the user realizing anything has occurred!
    Sneaky, eh?


    The period `.` for specifying the current directory is optional but useful as
    a visible reminder. For example, a `PATH` of


    ```

    :/bin:/usr/bin

    ```


    is equivalent to the previous one; however, throughout this text we''ll specify
    the current directory with a period for clarity.


    Worried about Trojan horses now? Don''t fret, you can always override the search
    specified by `PATH` by specifying an explicit path to the program to be executed.
    For example, if you type


    ```

    /bin/date

    ```


    the shell goes directly to `/bin` to execute `date`. `PATH` in this case is ignored,
    as it is if you type in


    ```

    ../bin/lu

    ```


    or


    ```

    ./rolo

    ```


    This last case says to execute the program rolo in the current directory and is
    commonly used while developing shell programs because it lets programmers omit
    `.` from their `PATH`.


    Now you understand why you couldn''t execute rolo from your home directory: `/users/steve/bin`
    wasn''t included in `PATH` so the shell couldn''t find rolo. A simple matter to
    rectify: You can simply add this directory to `PATH`:


    ```

    $ PATH=/bin:/usr/bin:/users/steve/bin:.

    $

    ```


    Now any program in `/users/steve/bin` can be executed regardless of your current
    directory in the file system:


    ```

    $ pwd

    /users/steve

    $ rolo Liz

    grep: can''t open phonebook

    $

    ```


    *Where am I?*


    Oops. The shell finds rolo and executes it correctly, but the grep command can''t
    find the phonebook data file.


    Look more closely at the rolo program and you''ll see that the grep error message
    must be coming from lu. Here''s lu, as it exists currently:


    ```

    $ cat /users/steve/bin/lu

    #

    # Look someone up in the phone book -- version 3

    #

    ```'
