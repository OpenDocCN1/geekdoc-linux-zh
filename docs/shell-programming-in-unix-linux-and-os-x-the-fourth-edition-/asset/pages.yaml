- pgno: 144
  md: 'See the problem? Enclosing Susan T inside double quotes results in its getting
    passed to `lu` as a single argument, but when the shell substitutes the value
    for `$1` on `grep`’s command line within the program itself, it then passes it
    as **two** arguments to `grep`.


    You can fix this problem by enclosing `$1` inside double quotes in the `lu` program:


    ```

    ```sh

    $ cat lu

    #

    # Look someone up in the phone book -- version 2

    #


    grep "$1" phonebook

    $

    ```

    ```


    Single quotes wouldn’t work in this instance. Why not?


    Now let’s try that invocation again:


    ```

    ```text

    $ lu Tony

    Tony Iannino    973-555-1295             *This still works*

    $ lu "Susan T"                         *Now try this again*

    Susan Topple    212-555-4932

    $

    ```

    ```


    # # A Program to Add Someone to the Phone Book


    Let’s continue with the development of programs that work with the phonebook file.
    You’ll probably want to add someone to the file at some point, particularly because
    our phonebook file is so small, so let’s write a program called `add` that takes
    two arguments: the name of the person to be added and their phone number.


    The `add` program simply appends the name and number, separated by a tab character,
    onto the end of the phonebook file:


    ```

    ```sh

    $ cat add

    #

    # Add someone to the phone book

    #


    echo "$1        $2" >> phonebook

    $

    ```

    ```


    Although you can’t tell, there’s a tab character that separates the `$1` from
    the `$2` in the preceding `echo` command. This tab must be quoted to make it to
    `echo` without getting gobbled up by the shell.


    Let’s try out the program:


    ```

    ```text

    $ add ''Stromboli Pizza'' 973-555-9478

    $ lu Pizza                         *See if we can find the new entry*

    Stromboli Pizza  973-555-9478      *So far, so good*

    ```

    ```'
