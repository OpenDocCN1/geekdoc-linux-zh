  md: '| Variable | Meaning |

    |---|---|

    | `LINENO` | Set by the shell to the line number in the script it is executing.
    This value is set before the line gets executed and starts at 1. |

    | `MAIL` | The name of a file that the shell periodically checks for the arrival
    of mail. If new mail arrives, the shell displays a “You have mail” message. See
