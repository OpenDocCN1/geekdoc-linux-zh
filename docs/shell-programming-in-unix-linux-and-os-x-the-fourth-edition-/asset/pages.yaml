    where *expression* is an arithmetic expression using shell variables and operators.
    Valid shell variables are those that contain numeric values (leading and trailing
    whitespace is allowed). Valid operators are taken from the C programming language
    and are listed in Appendix A, “Shell Summary.”


    > > **$(( )) Operators**

