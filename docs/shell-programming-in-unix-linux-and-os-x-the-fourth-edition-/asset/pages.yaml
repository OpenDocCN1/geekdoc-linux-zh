- pgno: 268
  md: 'Here’s what happened: After the line was read and assigned to `line`, the command


    ```

    set $line

    ```


    was executed and after the shell did its substitution, the command looked like
    this:


    ```

    set -1 + 5 = 4

    ```


    When set executed, it saw the - and thought that an invalid option, -1, was being
    selected. That explains the error message.


    Another problem with words occurs if you give it a line consisting entirely of
    whitespace characters, or if the line is null:


    ```

    $ words

    ```


    *Just Enter is pressed*


    ```

    CDPATH=.:/users/steve:/usr/spool

    EDITOR=/bin/vi

    HOME=/users/steve

    IFS=


    LOGNAME=steve

    MAIL=/usr/spool/mail/steve

    MAILCHECK=600

    PATH=/bin:/usr/bin:/users/steve/bin::

    PHONEBOOK=/users/steve/phonebook

    PS1=$

    PS2=>

    PWD=/users/steve/misc

    SHELL=/usr/bin/sh

    TERM=xterm

    TMOUT=0

    TZ=EST5EDT

    cmd=wc

    x=*

    0

    $

    ```


    In the latter case the shell saw the `set` command, but no arguments, so it output
    a list of all variables in the shell.


    To protect against both of these problems occurring, use the `--` option to `set`.
    This tells `set` not to interpret any subsequent dashes or argument-format words
    it encounters on the command line as options. It also prevents `set` from displaying
    all your variables if no other arguments follow, as was the case when you typed
    a null line.


    Reflecting this, the set command in words should be changed to read


    ```

    set -- $line

    ```'
