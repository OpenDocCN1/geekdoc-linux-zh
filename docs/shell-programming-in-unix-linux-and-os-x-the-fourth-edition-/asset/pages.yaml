    When a backslash is the last character of a line of input, the shell treats it
    as a line continuation character. It removes the newline character that follows
    and also does not treat the newline as an argument delimiter (it’s as if it wasn’t
    even typed). This construct is often used for entering long commands across multiple
    lines.


    For example, the following is completely valid:


