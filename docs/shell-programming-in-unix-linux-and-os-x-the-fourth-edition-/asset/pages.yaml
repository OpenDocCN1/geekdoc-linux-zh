    \ to finish typing a multi-line command.\n\nQuotes are also needed when assigning\
    \ values containing whitespace or special characters to shell variables, though\
    \ there are nuances, as demonstrated:\n\n```\n    $ message='I must say, this\
    \ sure is fun'\n    $ echo $message\n    I must say, this sure is fun\n    $ text='*\
    \ means all files in the directory'\n    $ echo $text\n    names nu numbers phonebook\
    \ stat means all files in the directory\n    $\n```\n\nThe quotes are needed in\
