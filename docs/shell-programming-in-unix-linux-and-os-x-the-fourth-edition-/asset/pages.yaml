- pgno: 218
  md: "There are two important concepts that this code raises, actually. The first\
    \ is to do with how computers actually implement multitasking, by swapping individual\
    \ programs in and out of the processor. The result is that at any point during\
    \ execution, a program can be swapped out, even half-way through a series of commands.\
    \ Now you can see the problem with the above code: because it’s two statements,\
    \ what happens if the program loses its place in line between the two statements\
    \ and another instantiation of the program happens to run the exact same two lines\
    \ of code? The second program overwrites the result of the first program’s grep\
    \ invocation. Not good for either user!\n\nThe second point relates to what’s\
    \ known as a *race condition*, a situation where more than one simultaneous invocation\
    \ of a program can cause trouble. Most often that’s related to temporary files,\
    \ but it can also occur with sub-processes and lock files, as we’ll discuss later\
    \ in the book.\n\nFor now, just keep in mind that when writing shell programs\
    \ that can be run by more than one person, make sure that each user’s temporary\
    \ files are unique.\n\nOne solution is to create temporary files in the user’s\
    \ home directory instead of /tmp. Another way is to choose a temporary filename\
    \ that will be unique and different for each invocation of the program. A neat\
    \ way to do this is to embed the unique process ID (PID) of the specific invocation\
    \ into the filename. This is easily accomplished by referring to the special $$\
    \ shell variable:\n\n```\n```shell\n$ echo $$\n4668\n$ ps\n  PID  TTY   TIME COMMAND\n\
    \ 4668  co    0:09 sh\n 6470  co    0:03 ps\n$\n```\n```\n\nWhen substituted by\
    \ the shell, $$ becomes the process ID number of the login shell itself. Because\
    \ each process on the system is given a unique process ID, using the value of\
    \ $$ in the name of a file eliminates the possibility of a different process using\
    \ the same name. To fix the problem highlighted earlier, replace the two lines\
    \ from with this improved sequence:\n\n```\n```shell\ngrep -v \"$name\" phonebook\
    \ > /tmp/phonebook$$\nmv /tmp/phonebook$$ phonebook\n```\n```\n\nto side-step\
    \ any potential race conditions. Each person using rolo will run it as a different\
    \ process, so the temporary file used in each instance will be different. Problem\
    \ solved.\n\n# ## The Exit Status from `read`\n\nread returns an exit status of\
    \ zero unless an end-of-file condition is encountered. If the data is coming from\
    \ the terminal, this means that the user has pressed Ctrl+d. If the data is coming\
    \ from a file, it means that there’s no more data to read from the file."
  merge: -1
  img_proc: true
- pgno: 219
  md: "This makes it easy to write a loop that will read lines of data from either\
    \ a file or the terminal.\n\nThe next program, called addi, reads in lines containing\
    \ pairs of numbers, which are added together; their sums are then written to standard\
    \ output:\n\n```\n```sh\n$ cat addi\n#\n# add pairs of integers on standard input\n\
    #\n\nwhile read n1 n2\ndo\n        echo $(( $n1 + $n2))\ndone\n$\n```\n```\n\n\
    The while loop is executed as long as the read command returns an exit status\
    \ of zero, which occurs as long as there’s still data to be read. Inside the loop,\
    \ the two values read from the line (presumably integers—no error checking is\
    \ done here) are added up and the result written to standard output by echo.\n\
    \n```\n```text\n$ addi\n10 25\n35\n-5 12\n7\n123 3\n126\nCtrl+d\n$\n```\n```\n\
    \nStandard input for addi can be redirected from a file, and standard output can\
    \ be another file (or a pipe, of course):\n\n```\n```sh\n$ cat data\n1234 7960\n\
    593 -595\n395 304\n3234 999\n-394 -493\n$ addi < data > sums\n$ cat sums\n9194\n\
    -2\n699\n4233\n-887\n$\n```\n```"
  merge: -1
  img_proc: true
- pgno: 220
  md: "The following program, called **number**, is a simplified version of the standard\
    \ Unix command: it accepts one or more files as arguments and displays their contents\
    \ with each line preceded by its line number. If no arguments are supplied, it\
    \ reads standard input instead.\n\n```\n```sh\n$ cat number\n#\n# Number lines\
    \ from files given as argument or from\n# standard input if none supplied\n#\n\
    \nlineno=1\n\ncat $* |\nwhile read line\ndo\n        echo \"$lineno: $line\"\n\
    \        lineno=$((lineno + 1))\ndone\n$\n```\n```\n\nThe variable lineno—the\
    \ line number count—is initially set to 1. Then the arguments typed to number\
    \ are given to cat to be collectively written to standard output. If no arguments\
    \ are supplied, $* will be null, and cat will be passed no arguments. This will\
    \ cause it to read from standard input. The output from cat is piped into the\
    \ while loop.\n\nEach line encountered by read is echoed at the terminal, prefaced\
    \ by the current value of lineno, whose value is then incremented by one.\n\n\
    ```\n```text\n$ number phonebook\n1: Alice Chebba       973-555-2015\n2: Barbara\
    \ Swingle    201-555-9257\n3: Billy Bach         201-555-7618\n4: El Coyote  \
    \        212-555-3232\n5: Liz Stachiw        212-555-2298\n6: Susan Goldberg \
    \    201-555-7776\n7: Teri Zak           201-555-6000\n8: Tony Iannino       973-555-1295\n\
    $ who | number                         Try from standard input\n1: root      console\
    \   Jul 25 07:55\n2: pat       tty03     Jul 25 09:26\n3: steve     tty04    \
    \ Jul 25 10:58\n4: george    tty13     Jul 25 08:05\n$\n```\n```\n\nNote that\
    \ number won’t work too well for lines that contain backslashes or leading whitespace\
    \ characters. The following example illustrates this point.\n\n```\n```text\n\
    $ number\n        Here are some backslashes: \\\\ \\\\\n1: Here are some backslashes:\
    \ *\n$\n```\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: "Leading whitespace characters are removed from any line that’s read. The backslash\
    \ characters are also interpreted by the shell when it reads the line. You can\
    \ use the `-r` option of `read` to prevent it from interpreting the backslash\
    \ character. If we change the\n\n```\nwhile read line\n```\n\nin `number` to\n\
    \n```\nwhile read -r line\n```\n\nthe output will look better:\n\n```\n```sh\n\
    $ number\n        Here are some backslashes: \\\\ \\\\*\n1: Here are some backslashes:\
    \ \\\\ \\\\*\n$\n```\n```\n\nIn Chapter 11 you’ll learn how to preserve the leading\
    \ whitespace characters and also how to have some control over the parsing of\
    \ the input data.\n\n# The `printf` Command\n\nAlthough `echo` is quite adequate\
    \ for displaying simple messages, sometimes you’ll want to print *formatted* output:\
    \ for example, lining up columns of data. Unix systems provide the `printf` command\
    \ for these tasks. Those of you familiar with the C or C++ programming language\
    \ will notice many similarities with their function of the same name.\n\nThe general\
    \ format of the `printf` command is\n\n```\nprintf \"format\" arg1 arg2\n```\n\
    \nwhere *format* is a string that details how the subsequent values are to be\
    \ displayed. Since the format string is a single argument and is likely to contain\
    \ special characters and spaces, it’s always a good idea to enclose it in quotes.\n\
    \nCharacters in the format string that are not preceded by a percent sign (%)\
    \ are written directly to standard output. At its most simple, then, `printf`\
    \ can work like `echo` (as long as you remember to end each line with `\\n` for\
    \ a newline, as shown):\n\n```\n```sh\n$ printf \"Hello world!\\n\"\nHello world!\n\
    $\n```\n```\n\nCharacters preceded by a percent sign are called *format specifications*\
    \ and tell `printf` how the corresponding argument should be displayed. For each\
    \ percent sign in the format string there should be a corresponding argument,\
    \ except for the special specification `%%`, which causes a single percent sign\
    \ to be displayed.\n\nLet’s start with a simple example of `printf`:\n\n```\n\
    ```sh\n$ printf \"This is a number: %d\\n\" 10\nThis is a number: 10\n$\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 222
  md: 'printf doesn’t automatically add a newline character to the end of its output
    like echo but it does understand the same escape sequences (refer to Table 9.1
    earlier in this chapter), so adding \n to the end of the format string causes
    the newline character sequence to also be printed and the command prompt to appear
    on the next line as expected.


    Although the preceding is a simple example that could also be handled by echo,
    it helps to illustrate how the conversion specification (%d) is interpreted by
    printf: the format string is scanned and outputs each character in the string
    until it sees the percent sign. Then it reads the d and tries to replace the %d
    with the next argument given to printf, which must be an integer. After that argument
    (10) is sent to standard output, printf continues scanning the format string,
    sees the \n, and outputs a newline.


    Table 9.2 summarizes the different format specification characters.


    Table 9.2  `printf` **Format Specification Characters**


    | Character | Use for Printing |

    |---|---|

    | %d | Integers |

    | %u | Unsigned integers |

    | %o | Octal integers |

    | %x | Hexadecimal integers, using a-f |

    | %X | Hexadecimal integers, using A-F |

    | %c | Single characters |

    | %s | Literal strings |

    | %b | Strings containing backslash escape characters |

    | %% | Percent signs |


    The first five conversion specification characters are all used for displaying
    integers. %d displays signed integers, and %u displays unsigned integers; %u can
    also be used to display the positive representation of a negative number. By default,
    integers displayed as octal or hexadecimal numbers do not have a leading 0 or
    0x, but you can fix that if needed, as we’ll show later in this section.


    Strings are printed using %s or %b. %s is used to print strings literally, without
    any processing of backslash escape characters; %b is used to force interpretation
    of the backslash escape characters in the string argument.


    Here are a few printf examples to clarify:


    ```

    ```text

    $ printf "The octal value for %d is %o\n" 20 20

    The octal value for 20 is 24

    $ printf "The hexadecimal value for %d is %x\n" 30 30

    The hexadecimal value for 30 is 1e

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 223
  md: "```\n```text\n$ printf \"The unsigned value for %d is %u\\n\" -1000 -1000\n\
    The unsigned value for -1000 is 4294966296\n$ printf \"This string contains a\
    \ backslash escape: %s\\n\" \"test\\nstring\"\nThis string contains a backslash\
    \ escape: test\\nstring\n$ printf \"This string contains an interpreted\n↪backslash\
    \ escape: %b\\n\" \"test\\nstring\"\nThis string contains an interpreted backslash\
    \ escape: test\nstring\n$ printf \"A string: %s and a character: %c\\n\" hello\
    \ A\nA string: hello and a character: A\n$\n```\n```\n\nIn the last printf, %c\
    \ is used to display a single character. If the corresponding argument is longer\
    \ than one character, only the first is displayed:\n\n```\n```text\n$ printf \"\
    Just the first character: %c\\n\" abc\na\n$\n```\n```\n\nThe general format of\
    \ a conversion specification is\n\n`%[flags][width][.precision]type`\n\nThe *type*\
    \ is the conversion specification character from Table 9.2. As you can see, only\
    \ the percent sign and *type* are required; the other parameters are called *modifiers*\
    \ and are optional. Valid *flags* are -, +, #, and the space character.\n\n+ \
    \  - `-` left-justifies the value being printed, which will make more sense when\
    \ we discuss the *width* modifier.\n+   - `+` causes `printf` to precede integers\
    \ with a + or − sign (by default, only negative integers are printed with a sign).\n\
    +   - `#` causes `printf` to precede octal integers with `0` and hexadecimal integers\
    \ with `0x` or `0X`, specified as `%x` or `%X`, respectively.\n+   - The space\
    \ character causes `printf` to precede positive integers with a space and negative\
    \ integers with a − for alignment purposes.\n\nA few more examples. Pay close\
    \ attention to the format strings!\n\n```\n```text\n$ printf \"%+d\\n%d\\n%+d\\\
    n\" 10 -10 20\n+10\n-10\n+20\n$\n```\n```\n\n```\n```text\n$ printf \"% d\\n%\
    \ d\\n% d\\n\" 10 -10 20\n 10\n-10\n 20\n$\n```\n```\n\n```\n```text\n$ printf\
    \ \"%#o %#x\\n\" 100 200\n0144 0xc8\n$\n```\n```"
  merge: -1
  img_proc: true
- pgno: 224
  md: "As you can see, using `+` or space as the flag causes a column of positive\
    \ and negative numbers to align nicely.\n\nThe `width` modifier is a positive\
    \ number that specifies the minimum *field width* for printing an argument. The\
    \ argument is right-justified within this field unless the `-` flag is used:\n\
    \n```\n```text\n$ printf \"%20s%20s\\n\" string1 string2\n                   \
    \ string1                    string2\n$ printf \"%-20s%-20s\\n\" string1 string2\n\
    string1                 string2\n$ printf \"%5d%5d%5d\\n\" 1 10 100\n    1   \
    \ 10    100\n$ printf \"%5d%5d%5d\\n\" -1 -10 -100\n   -1   -10   -100\n$ printf\
    \ \"%-5d%-5d%-5d\\n\" 1 10 100\n1     10   100\n$\n```\n```\n\nThe width modifier\
    \ can be useful for lining up columns of text or numbers (Tip: signs for numbers\
    \ and leading 0, 0x, or 0X characters are counted as part of the argument width).\
    \ The width specifies a *minimum* size for the field, but if the width of an argument\
    \ exceeds *width*, it can overflow or not be output at all. An easy way to test:\n\
    \n```\n```text\n    printf \"%-15.15s\\n\" \"this is more than 15 chars long\"\
    \n```\n```\n\nWhat happens on your system when you try that command?\n\nThe `.precision`\
    \ modifier is a positive number that specifies a minimum number of digits to be\
    \ displayed for `%d`, `%u`, `%o`, `%x`, and `%X`. This results in zero-padding\
    \ on the left of the value:\n\n```\n```text\n$ printf \"%.5d %.4X\\n\" 10 27\n\
    00010 001B\n$\n```\n```\n\nFor strings, the `.precision` modifier specifies the\
    \ maximum number of characters to be printed from the string. If the string is\
    \ longer than *precision* characters, it is truncated on the right. That’s important\
    \ to realize as it lets you line up text across multiple lines, but with some\
    \ data missing if any individual value is wider than the specified field:\n\n\
    ```\n```text\n$ printf \"%.6s\\n\" \"Ann Smith\"\nAnn Sm\n$\n```\n```\n\nA *width*\
    \ can be combined with `.precision` to specify both a field width and zero padding\
    \ (for numbers) or truncation (for strings):\n\n```\n```text\n$ printf \"%#10.5x:%5.4x:%5.4x\\\
    n\" 1 10 100\n:    0x00001: 000a: 0100\n$ printf \"%-9.5s:\\n\" abcdefg\n:   \
    \ abcde:\n$ printf \"%-9.5s:\\n\" abcdefg\n:abcde    :\n$\n```\n```"
  merge: -1
  img_proc: true
- pgno: 225
  md: "Finally, in case all of this isn’t confusing enough, if a * is used in place\
    \ of a number for **width** or **precision**, the argument preceding the value\
    \ to be printed must be a number and will be used as the width or precision, respectively.\
    \ If a * is used in place of both, two integer arguments must precede the value\
    \ being printed and are used for the width and precision:\n\n```\n$ printf \"\
    %*s%*.s\\n\" 12 \"test one\" 10 2 \"test two\"\n        test one        te\n\n\
    $ printf \"%12s%10.2s\\n\" \"test one\" \"test two\"\n        test one       \
    \ te\n```\n\nAs you can see, the two printfs in this example produce the same\
    \ result. In the first printf, 12 is used as the width for the first string, 10\
    \ as the width for the second string, and 2 as the precision for the second string.\
    \ In the second printf, these numbers are specified as part of the format specification.\n\
    \nWhile the format specification for printf is unquestionably complex, its power\
    \ and capabilities to turn the relatively unstructured output of echo into exactly\
    \ what you want from your own shell programs is darn helpful. It’s a command well\
    \ worth studying more closely so you know how to use it as you develop your own\
    \ more sophisticated programs.\n\nTable 9.3 summarizes the various format specification\
    \ modifiers.\n\nTable 9.3 — *printf* Format Specification Modifiers\n\n| Modifier\
    \ | Meaning |\n|---|---|\n| *Flags* |  |\n| `-` | Left-justify value. |\n| `+`\
    \ | Precede integer with + or -. |\n| `(space)` | Precede positive integer with\
    \ space character. |\n| `#` | Precede octal integer with 0, hexadecimal integer\
    \ with 0x or 0X. |\n| *width* | Minimum width of field; * means use next argument\
    \ as width. |\n| *precision* | Minimum number of digits to display for integers;\
    \ maximum number of characters to display for strings; * means use next argument\
    \ as precision. |\n\nLet’s keep exploring printf. Here’s a simple example that\
    \ uses printf to align two columns of numbers from a file:\n\n```\n$ cat align\n\
    #\n# Align two columns of numbers\n# (works for numbers up to 12 digits long,\
    \ including sign)\n```"
  merge: -1
  img_proc: true
