- pgno: 296
  md: "Now let’s look at the individual programs that `rolo` utilizes, with particular\
    \ attention paid to how the change in data format ripples through the entire design.\
    \ Each of the original programs has been changed to accommodate the new entry\
    \ format and also to be more user friendly.\n\n# add\n\n```\n##\n# Program to\
    \ add someone to the phonebook file\n#\n\necho \"Type in your new entry\"\necho\
    \ \"When you're done, type just a single Enter on the line.\"\n\nfirst=\nentry=\n\
    \nwhile true\ndo\n        echo \">> \\c\"\n        read line\n\n        if [ -n\
    \ \"$line\" ] ; then\n                entry=\"$entry$line\"\n\n              \
    \  if [ -z \"$first\" ] ; then\n                        first=$line\n        \
    \        fi\n        else\n                break\n        fi\ndone\n\necho \"\
    $entry\" >> $PHONEBOOK\nsort -o $PHONEBOOK $PHONEBOOK\necho\necho \"$first has\
    \ been added to the phone book\"\n```\n\nThis program adds an entry to the phone\
    \ book. It continually prompts the user to enter lines until a line with just\
    \ an Enter is typed (that is, a completely blank line). Each line that is entered\
    \ is appended to the variable `entry`, with the special `^` character used to\
    \ logically separate fields.\n\nWhen the while loop is exited, the new entry is\
    \ added to the end of the phone book, and the file is sorted."
  merge: -1
  img_proc: true
- pgno: 297
  md: "```\n```sh\nlu\n\n#\n# Look someone up in the phone book\n#\n\nname=\"$1\"\n\
    grep -i \"$name\" $PHONEBOOK > /tmp/matches$$\n\nif [ ! -s /tmp/matches$$ ] ;\
    \ then\n    echo \"I can't find $name in the phone book\"\nelse\n        #\n \
    \       # Display each of the matching entries\n        #\n\n        while read\
    \ line\n        do\n                display \"$line\"\n        done < /tmp/matches$$\n\
    fi\n\nrm /tmp/matches$$\n```\n```\n\nThis is the program to look up an entry in\
    \ the phone book. Now, however, matching entries are written to the file `/tmp/matches$$`\
    \ so we can improve the user experience in the situation where there are no matches.\n\
    \nIf the size of this output file is zero (`test -s`), no match was found. Otherwise,\
    \ the program enters a loop to read each matching line from the file and display\
    \ it to the user. A new program called `display` is used to unwrap ^-separated\
    \ fields and turn them into multi-line output entries. This new program is also\
    \ used by the `rm` and `change` programs to display entries.\n\nAlso note the\
    \ addition of the `-i` flag to grep in the script. This allows case-insensitive\
    \ matches, so a search for “steve” will match “Steve.” A good example of how a\
    \ working knowledge of the flags to grep on Unix commands can easily make your\
    \ scripts more powerful and easier to use.\n\n```\n```sh\ndisplay\n\n#\n# Display\
    \ entry from the phonebook\n#\n\necho\necho \"----------------------------------------\"\
    \n```\n```"
  merge: -1
  img_proc: true
- pgno: 298
  md: "```\n```sh\nentry=$1\nIFS=\"^\"\nset $entry\n\nfor line in \"$1\" \"$2\" \"\
    $3\" \"$4\" \"$5\" \"$6\"\ndo\n        printf \"| %-34.34s |\\n\" $line\ndone\n\
    echo \"|          o                 o          |\"\necho \"----------------------------------------\"\
    \necho\n```\n```\n\nThis program displays the caret-separated entry passed as\
    \ its argument. To make the output more aesthetically interesting, the program\
    \ actually “draws” a rolodex card. Typical output from display looks like this:\n\
    \n```\n```text\n----------------------------------------\n| Steve's Ice Cream\
    \                    |\n| 444 6th Avenue                       |\n| New York City\
    \ 10003                  |\n| 212-555-3021                         |\n|      \
    \                                |\n|           o                 o        |\n\
    ----------------------------------------\n```\n```\n\nLook at the code again and\
    \ notice how after skipping a line and displaying the top of the card, display\
    \ changes IFS to ^, then executes the set command to assign each “line” to a different\
    \ positional parameter. For example, if entry is equal to\n\n```\n```text\nSteve's\
    \ Ice Cream^444 6th Avenue^New York City 10003^212-555-3021^\n```\n```\n\nexecuting\
    \ the set command assigns Steve's Ice Cream to $1, 444 6th Avenue to $2, New York\
    \ City 10003 to $3, and 212-555-3021 to $4.\n\nAfter breaking down the fields\
    \ with set, the program enters a for loop that, with this version of the code,\
    \ will output six lines of data, no matter how many lines are contained in the\
    \ entry. This ensures uniformity of rolodex cards and the program can be easily\
    \ modified to “draw” larger-sized cards if desired.\n\nIf the set command was\
    \ executed on Steve's Ice Cream as shown previously, $5 and $6 would be null,\
    \ thus resulting in two blank lines to “fill out” the bottom of the card.\n\n\
    To ensure that the output is properly aligned on both left and right edges, the\
    \ printf command is used to display a line exactly 38 characters wide: the leading\
    \ | followed by a space followed by the first 34 characters of $line followed\
    \ by a space and a |."
  merge: -1
  img_proc: true
- pgno: 299
  md: "# rem\n\n```\n```sh\n#\n# Remove someone from the phone book\n#\n\nname=$1\n\
    \n#\n# Get matching entries and save in temp file\n#\n\ngrep -i \"^$name\" $PHONEBOOK\
    \ > /tmp/matches$$\n\nif [ ! -s /tmp/matches$$ ] ; then\n        echo \"I can't\
    \ find $name in the phone book\"\n        exit 1\nfi\n\n#\n# Display matching\
    \ entries one at a time and confirm removal\n#\n\nwhile read line\ndo\n      \
    \  display \"$line\"\n        echo \"Remove this entry (y/n)? \\c\"\n        read\
    \ answer < /dev/tty\n\n        if [ \"$answer\" = y ] ; then\n               \
    \ break\n        fi\ndone < /tmp/matches$$\n\nrm /tmp/matches$$\n\nif [ \"$answer\"\
    \ = y ] ; then\n        if grep -i -v \"$line\" $PHONEBOOK > /tmp/phonebook$$\n\
    \        then\n                echo \"Selected entry has been removed\"\n    \
    \    elif [ ! -s $PHONEBOOK ] ; then\n                echo \"Note: You now have\
    \ an empty phonebook.\"\n        else\n                echo \"Entry not removed\"\
    \n        fi\nfi\n```\n```"
