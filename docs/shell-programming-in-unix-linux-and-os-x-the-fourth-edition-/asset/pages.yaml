    is delimited by a colon and can be followed by a percent sign `%` and a message
    to be displayed when mail arrives in the indicated file. (You have mail is often
    the default.) |

    | `PATH` | A colon-delimited list of directories to be searched when the shell
    needs to find a command to be executed. The current directory is specified as
    `.` or `::` (if it heads or ends the list, `.` suffices). |

    | `PPID` | The process ID of the program that invoked this shell (that is, the
    parent process). |

    | `PS1` | The primary command prompt, normally `$ `. |

    | `PS2` | The secondary command prompt, normally `> `. |

    | `PS4` | Prompt used during execution trace (`-x` option to shell or `set -x`).
    Default is `+ `. |

    | `PWD` | Pathname of the current working directory. |


    # Parameter Substitution


    In the simplest case, the value of a parameter can be accessed by preceding the
    parameter with a dollar sign $. Table A.3 summarizes the different types of parameter
    substitution that can be performed. Parameter substitution is performed by the
    shell before filename substitution and before the command line is divided into
    arguments.


    The presence of a colon after *parameter* in Table A.3 indicates that *parameter*
    is to be tested to see whether it’s set and non-null. Without the colon, a test
    is made to check whether *parameter* is set only.'
