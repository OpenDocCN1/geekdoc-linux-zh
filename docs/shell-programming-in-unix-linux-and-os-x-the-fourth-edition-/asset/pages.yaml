    \ prompt will be returned. In the next section, you’ll see how to test whether\
    \ the correct number of arguments has been supplied to a program and, if not,\
    \ take some action.\n\n# The test Command\n\nThough the previous example program\
    \ used a pipeline to test for the if statement, a built-in shell command called\
    \ `test` is much more commonly used for testing one or more conditions. Its general\
    \ format is\n\n```\ntest expression\n```\n\nwhere *expression* represents the\
    \ condition you’re testing. `test` evaluates *expression*, and if the result is\
    \ *true*, it returns an exit status of zero, otherwise the result is *false*,\
    \ and it returns a nonzero exit status.\n\n# String Operators\n\nAs an example,\
    \ the following command returns a zero exit status if the shell variable name\
    \ contains the characters `julio`:\n\n```\ntest \"$name\" = julio\n```\n\nThe\
    \ = operator is used to test whether two values are identical. In this case, we’re\
    \ testing to see whether the *contents* of the shell variable name are identical\
    \ to the characters `julio`. If it is, `test` returns an exit status of zero;\
    \ nonzero otherwise.\n\nNote that `test` must see all operands (`$name` and `julio`)\
    \ and operators (`=`) as separate arguments, meaning that they must be delimited\
    \ by one or more whitespace characters.\n\nGetting back to the `if` command, to\
    \ echo the message “Would you like to play a game?” if name contains the characters\
    \ `julio`, you would write your if command like this:\n\n```\nif test \"$name\"\
    \ = julio\nthen\n        echo \"Would you like to play a game?\"\nfi\n```\n\n\
    When the if command gets executed, the command that follows the if is executed,\
    \ and its exit status is evaluated. The test command is passed the three arguments\
    \ $name (with its"
