- pgno: 287
  md: "# Functions\n\nAll modern shells support functions—long or short sequences\
    \ of commands that can be referenced or reused as often as desired in a shell\
    \ program.\n\nTo define a function, you use the general format:\n\n```\nname ()\
    \ { command; ... command; }\n```\n\nwhere *name* is the name of the function,\
    \ the parentheses denote that a function is being defined, and the commands enclosed\
    \ between the curly braces define the body of the function. These commands will\
    \ be executed whenever the function is executed.\n\nNote that at least one whitespace\
    \ character must separate the `{` from the first command, and that a semicolon\
    \ must separate the last command from the closing brace if they occur on the same\
    \ line.\n\nThe following defines a function called nu that displays the number\
    \ of logged-in users:\n\n```\nnu () { who | wc -l; }\n```\n\nYou execute a function\
    \ the same way you execute an ordinary command: by typing its name into the shell:\n\
    \n```\n$ nu\n        22\n$\n```\n\nFunctions are really useful for shell programmers\
    \ and can alleviate lots of tedium in developing solutions. One key feature: arguments\
    \ listed after the function on the command line are assigned to the positional\
    \ parameters $1, $2, . . . , within the function, just as with any other command.\n\
    \nHere's a function called nrrun that runs tbl, nroff, and lp on the file specified:\n\
    \n```\n$ nrrun () { tbl $1 | nroff -mm -Tlp | lp; }\n$ nrrun memo1           \
    \              *Run it on memo1*\nrequest id is laser1-33 (standard input)\n$\n\
    ```\n\nFunctions exist only in the shell in which they're defined so they can't\
    \ be passed to subshells. Because the function is executed in the current shell,\
    \ changes made to the current directory or to variables remain after the function\
    \ has completed execution, as if it had been invoked with the . command explored\
    \ earlier in the book:\n\n```\n$ db () {\n>       PATH=$PATH:/uxn2/data\n>   \
    \    PS1=DB:\n>       cd /uxn2/data\n>       }\n$\n$ db                      \
    \        *Execute it*\nDB:\n```"
  merge: -1
  img_proc: true
- pgno: 288
  md: "A function definition can continue over as many lines as necessary. The shell\
    \ will continue to prompt for commands within the function with the secondary\
    \ command prompt until you complete the function definition with the }.\n\nYou\
    \ can put definitions for commonly used functions inside your `.profile` so that\
    \ they'll be available whenever you log in. Alternatively, you can group the definitions\
    \ in a file, say `myfuncs`, and then execute the file in the current shell by\
    \ typing\n\n    . myfuncs\n\nAs you now know, this causes any functions defined\
    \ inside myfuncs to become available in the current shell.\n\nThe following function,\
    \ called mycd, takes advantage of the fact that functions are run in the current\
    \ environment. It mimics the operation of the Korn shell’s cd command, which has\
    \ the capability of substituting portions of the current directory’s path (see\
    \ the discussion of cd in Chapter 14 for more explanation).\n\n```\n$ cat myfuncs\n\
    ```\n\n_See what's inside_\n\n```\n#\n# new cd function:\n#     mycd dir Switches\
    \ dir\n#     mycd old new Substitute new for old in current directory's path\n\
    #\nmycd ()\n{\n        if [ $# -le 1 ] ; then\n                # normal case --\
    \ 0 or 1 argument\n                cd $1\n        elif [ $# -eq 2 ] ; then\n \
    \               # special case -- substitute $2 for $1\n                cd $(echo\
    \ $PWD | sed \"s|$1|$2|*\")\n        else\n                # cd can't have more\
    \ than two arguments\n                echo mycd: bad argument count\n        \
