  md: 'where *chars* is one or more characters that will be used to separate the lines
    pasted together. That is, the first character listed in *chars* will be used to
    separate lines from the first file that are pasted with lines from the second
    file; the second character listed in *chars* will be used to separate lines from
    the second file from lines from the third, and so on.


    If there are more files than there are characters listed in *chars*, paste “wraps
    around” the list of characters and starts again at the beginning.


    In the simplest form of the `-d` option, specifying just a single delimiter character
    causes that character to be used to separate *all* pasted fields:


    ```

    ```text

    $ paste -d''+'' names addresses numbers

    Tony+55 23 Vine Street, Miami+(307) 555-5356

    Emanuel+39 University Place, New York+(212) 555-3456

    Lucy+17 E. 25th Street, New York+(212) 555-0959

    Ralph+38 Chauncey St., Bensonhurst+(212) 555-7741

    Fred+17 E. 25th Street, New York+(212) 555-0040

    ```

    ```


    Notice that it’s always safest to enclose the delimiter characters in single quotes.
    The reason why will be explained shortly.


    # The -s Option


    The -s option tells paste to paste together lines from the same file, not from
    alternate files. If just one file is specified, the effect is to merge all the
    lines from the file together, separated by tabs, or by the delimiter characters
    specified with the -d option.


    ```

    ```text

    $ paste -s names        Paste all lines from names

    Tony    Emanuel Lucy    Ralph Fred

    $ ls | paste -d'' '' -s -    Paste ls''s output, use space as delimiter

    addresses intro lotsaspace names numbers phonebook

    $

    ```

    ```


    In the former example, the output from `ls` is piped to `paste` which merges the
    lines (`-s` option) from standard input (`-`), separating each field with a space
    (`-d '' ''` option). You’ll recall from Chapter 1 that the command


    ```

    ```text

    echo *

    ```

    ```


    would have also listed all the files in the current directory, perhaps *slightly*
    less complicated than `ls | paste`.


    # sed


    `sed` is a program used for editing data in a pipe or command sequence. It stands
    for *stream editor*. Unlike `ed`, `sed` cannot be used interactively, though its
    commands are similar. The general form of the `sed` command is


    ```

    ```text

    sed command file

    ```

    ```'
