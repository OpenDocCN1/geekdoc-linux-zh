- pgno: 173
  md: "The word *value* is successively compared against the values *pattern₁*, *pattern₂*,\
    \ ..., *patternₙ*, until a match is found. When a match is found, the commands\
    \ listed after the matching value are executed, up to the double semicolons, which\
    \ serve as a “break” statement that shows you’ve finished specifying commands\
    \ for that particular conditional. After the double semicolons are reached, the\
    \ execution of the case is terminated. If a match is not found, none of the commands\
    \ listed in the case is executed.\n\nAs an example of the use of the case statement,\
    \ the following program called number takes a single digit and translates it to\
    \ its English equivalent:\n\n```\n```sh\n$ cat number\n#\n# Translate a digit\
    \ to English\n#\n\nif [ \"$#\" -ne 1 ]\nthen\n        echo \"Usage: number digit\"\
    \n        exit 1\nfi\n\ncase \"$1\"\nin\n\n        0) echo zero;;\n        1)\
    \ echo one;;\n        2) echo two;;\n        3) echo three;;\n        4) echo\
    \ four;;\n        5) echo five;;\n        6) echo six;;\n        7) echo seven;;\n\
    \        8) echo eight;;\n        9) echo nine;;\n\nesac\n$ \n```\n```\n\nNow\
    \ to test it:\n\n```\n```sh\n$ number 0\nzero\n$ number 3\nthree\n$ number\nUsage:\
    \ number digit\n$ number 17\n$\n```\n```\n\n*Try no arguments*\n\n*Try a two-digit\
    \ number*\n\nThe last case shows what happens when you type in more than one digit:\
    \ $1 doesn’t match any of the values listed in the case, so none of the echo commands\
    \ is executed."
  merge: -1
  img_proc: true
- pgno: 174
  md: "# Special Pattern-Matching Characters\n\nThe case statement is quite powerful\
    \ because instead of just specifying sequences of letters, you can create complex\
    \ regular expressions in the shell notation. That is, you can use the same special\
    \ characters for specifying the patterns in a case as you can with filename substitution.\
    \ For example, ? can be used to specify any single character; * can be used to\
    \ specify zero or more occurrences of any character; and [...] can be used to\
    \ specify any single character enclosed between the brackets.\n\nBecause the pattern\
    \ * matches anything (just like how echo * matches all files in the current directory),\
    \ it’s frequently used at the end of the case as the “catch-all” or default value:\
    \ if none of the previous values in the case match, this one’s guaranteed to be\
    \ a match.\n\nWith that in mind, here’s a second version of the number program\
    \ that has such a catch-all case statement.\n\n```\n```sh\n$ cat number\n#\n#\
    \ Translate a digit to English -- version 2\n#\n\nif [ \"$#\" -ne 1 ]\nthen\n\
    \        echo \"Usage: number digit\"\n        exit 1\nfi\n\ncase \"$1\"\nin\n\
    \        0) echo zero;;\n        1) echo one;;\n        2) echo two;;\n      \
    \  3) echo three;;\n        4) echo four;;\n        5) echo five;;\n        6)\
    \ echo six;;\n        7) echo seven;;\n        8) echo eight;;\n        9) echo\
    \ nine;;\n        *) echo \"Bad argument; please specify a single digit\";;\n\
    esac\n$ number 9\nnine\n$ number 99\nBad argument; please specify a single digit\n\
    $\n```\n```\n\nLet’s switch to another program, ctype, that identifies and prints\
    \ the class of the single character given as an argument. Character types recognized\
    \ are digits, uppercase letters,"
  merge: -1
  img_proc: true
- pgno: 175
  md: "lowercase letters, and special characters (anything not in the first three\
    \ categories). As an added check, the program also ensures that only a single\
    \ character is given as the argument.\n\n```\n```sh\n$ cat ctype\n#\n# Classify\
    \ character given as argument\n#\n\nif [ $# -ne 1 ]\nthen\n        echo Usage:\
    \ ctype char\n        exit 1\nfi\n\n#\n# Ensure that only one character was typed\n\
    #\n\nchar=\"$1\"\nnumchars=$(echo \"$char\" | wc -c)\n\nif [ \"$numchars\" -ne\
    \ 1 ]\nthen\n        echo Please type a single character\n        exit 1\nfi\n\
    \n#\n# Now classify it\n#\n\ncase \"$char\"\nin\n        [0-9]  ) echo digit;;\n\
    \        [a-z]  ) echo lowercase letter;;\n        [A-Z]  ) echo uppercase letter;;\n\
    \        *       ) echo special character;;\nesac\n$\n```\n```\n\nBut when we\
    \ try a few sample runs, something’s not right:\n\n```\n```text\n$ ctype a\nPlease\
    \ type a single character\n$ ctype 7\nPlease type a single character\n$\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 176
  md: "# The -x Option for Debugging Programs\n\nA bug. Not uncommon at all in the\
    \ process of developing programs, whether they’re 5 lines or 500 lines long. In\
    \ this instance, it appears that the letter counting portion of our program isn’t\
    \ working properly. But how do you figure out what’s not working?\n\nThis is a\
    \ good point to introduce the shell’s -x option. To debug any shell program—or\
    \ learn more about how it works—trace the sequence of its execution by typing\
    \ in `sh -x` followed by the regular invocation (name and arguments). This starts\
    \ up a new shell to execute the indicated program with the -x option enabled.\n\
    \nIn this mode, commands are printed at the terminal as they are executed, preceded\
    \ by a plus sign. Let’s try it out!\n\n```\n```text\n$ sh -x ctype a         \
    \                Trace execution\n+ [ 1 -ne 1 ]                            $#\
    \ equals 1\n+ char=a                                 Assignment of $1 to char\n\
    + echo a\n+ wc -c\n+ numchars=     2                        wc returned ???\n\
    + [       2 -ne 1 ]                      That's why this test succeeded\n+ echo\
    \ please type a single character\nplease type a single character\n+ exit 1\n$\n\
    ```\n```\n\nThe trace output indicates that wc returned 2 when this command was\
    \ executed:\n\n```\n```sh\necho \"$char\" | wc -c\n```\n```\n\nBut why the value\
    \ 2 if the command was given the single letter a? It turns out that two characters\
    \ were actually given to wc: the single character a and the “invisible” newline\
    \ character that echo automatically prints at the end of each line. Oops. So instead\
    \ of testing for a single character by comparing it to 1, the conditional expression\
    \ should be comparing the user input to 2: the character typed plus the newline\
    \ added by echo.\n\nGo back to the ctype program and update the if command that\
    \ reads\n\n```\n```sh\nif [ \"$numchars\" -ne 1 ]\nthen\n        echo Please type\
    \ a single character\n        exit 1\n\nfi\n```\n```\n\nto look like this\n\n\
    ```\n```sh\nif [ \"$numchars\" -ne 2 ]\nthen\n        echo Please type a single\
    \ character\n        exit 1\n\nfi\n```\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: "and try it again.\n\n```\n```sh\n$ ctype a\nlowercase letter\n$ ctype abc\n\
    Please type a single character\n$ ctype 9\ndigit\n$ ctype K\nuppercase letter\n\
    $ ctype !\nspecial character\n$ ctype\nUsage: ctype char\n$\n```\n```\n\nNow it\
    \ seems to work just fine.\n\nIn Chapter 11 you’ll learn how you can turn this\
    \ trace feature on and off at will from inside your program too; but for now,\
    \ we encourage you to try using `sh -x` on the various scripts we’ve created so\
    \ far.\n\nBefore leaving the ctype program, here's a version that avoids the use\
    \ of `wc` and handles all possible conditions with case statements:\n\n```\n```sh\n\
    $ cat ctype\n#\n# Classify character given as argument -- version 2\n#\n\nif [\
    \ $# -ne 1 ]\nthen\n        echo Usage: ctype char\n        exit 1\nfi\n\n#\n\
    # Now classify char, making sure only one was typed\n#\n\nchar=$1\n\ncase \"$char\"\
    \nin\n        [0-9] ) echo digit;;\n        [a-z] ) echo lowercase letter;;\n\
    \        [A-Z] ) echo uppercase letter;;\n        ?      ) echo special character;;\n\
    \        *      ) echo Please type a single character;;\nesac\n$\n```\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: "Remember, the ? matches any single character. Since we already have tested\
    \ the character against digits, and lowercase and uppercase letters, if this pattern\
    \ is matched, the character must be a special character. Finally, if this pattern\
    \ isn't matched, more than one character must have been typed, so the catch-all\
    \ case prints the appropriate error message.\n\n```\n```text\n$ ctype u\nlowercase\
    \ letter\n$ ctype '>'\nspecial character\n$ ctype xx\nPlease type a single character\n\
    $\n```\n```\n\n# Back to the case\n\nThe symbol | has the effect of a logical\
    \ OR when used between two patterns. That is, the pattern\n\n`pat₁ | pat₂`\n\n\
    specifies that either `pat₁` or `pat₂` is to be matched. For example,\n\n`-l |\
    \ -list`\n\nmatches either the value -l or -list, and\n\n`dmd | 5620 | tty5620`\n\
    \nmatches any of dmd or 5620 or tty5620.\n\nKnowing about the case statement,\
    \ there are a number of different programmatic flow structures that can be more\
    \ neatly and efficiently rewritten as case sequences.\n\nFor example, the greetings\
    \ program that you saw earlier in this chapter can be rewritten to use a case\
    \ statement rather than the clunkier if-elif. This time, let's take advantage\
    \ of the fact that date with the +%H option writes a two-digit hour to standard\
    \ output.\n\n```\n```sh\n$ cat greetings\n#\n# Program to print a greeting --\
    \ case version\n#\n\nhour=$(date +%H)\n\ncase \"$hour\"\nin\n        0?  | 1[01]\
    \ ) echo \"Good morning\";;\n        1[2-7]      ) echo \"Good afternoon\";;\n\
    \        *           ) echo \"Good evening\";;\nesac\n$\n```\n```"
  merge: -1
  img_proc: true
- pgno: 179
  md: "The two-digit hour obtained from `date` is assigned to the shell variable `hour`,\
    \ then the `case` statement is executed. The value of `hour` is compared against\
    \ the first pattern:\n\n```\n0? | 1[01]\n```\n\nwhich matches any value that starts\
    \ with a zero followed by any character (midnight through 9 am), or any value\
    \ that starts with a one and is followed by a zero or one (10 or 11 am).\n\nThe\
    \ second pattern\n\n```\n1[2-7]\n```\n\nmatches a value that starts with a one\
    \ and is followed by any one of the digits two through seven (noon through 5 pm).\n\
    \nThe last case, the catch-all, matches anything else (6 pm through 11 pm).\n\n\
    ```\n$ date\nWed Aug 28 15:45:12 EDT 2002\n$ greetings\nGood afternoon\n$\n```\n\
    \n# The Null Command :\n\nEvery matching case statement needs a resulting command,\
    \ and every `if-then` conditional needs a resultant command too—but sometimes\
    \ you don't want to execute anything, just “eat” the result. How do you do that?\
    \ With the shell’s built-in *null* command. The format of this command is simply\n\
    \n```\n:\n```\n\nand the purpose of it is—you guessed it—to do nothing.\n\nIn\
    \ most cases it’s used to satisfy the requirement that a command appear, particularly\
    \ in `if` statements. Suppose that you want to make sure that the value stored\
    \ in the variable `system` exists in the file `/user/steve/mail/systems`, and\
    \ if it doesn’t, you want to issue an error message and exit from the program.\
    \ So you start by writing something like\n\n```\nif grep \"^$system\" /users/steve/mail/systems\
    \ > /dev/null\nthen\n```\n\nbut you don’t know what to write after the `then`\
    \ because you want to test for the nonexistence of the system in the file and\
    \ don’t want to do anything special if the grep succeeds. The shell requires that\
    \ you write a command after the `then`, so here’s where the null command comes\
    \ to the rescue:\n\n```\nif grep \"^$system\" /users/steve/mail/systems > /dev/null\n\
    then\n        :\nelse\n        echo \"$system is not a valid system\"\n      \
    \  exit 1\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 180
  md: "If the conditional test is valid, nothing is done. If it’s not valid, the error\
    \ message is issued and the program exited.\n\nTo be fair, this particular example\
    \ could be reversed by restructuring the grep statement (remember the ‘!’ argument\
    \ to test?) but sometimes it’s easier to test for a positive condition and do\
    \ nothing than a negative. In either case, this is where a well placed comment\
    \ can do wonders when the code is read weeks or months later.\n\n# The && and\
    \ || Constructs\n\nThe shell has two special constructs that enable you to execute\
    \ a command based on whether the preceding command succeeds or fails. In case\
    \ you think this sounds similar to the if command, well it is. Sort of. It’s a\
    \ shorthand form of the if.\n\nIf you write\n\n```\n```sh\ncommand_1 && command_2\n\
    ```\n```\n\nanywhere that the shell expects to see a command, command_1 will be\
    \ executed, and if it returns an exit status of zero (success), command_2 will\
    \ be executed. If command_1 returns a non-zero exit status (fail), command_2 is\
    \ not invoked but is ignored.\n\nFor example, if you write\n\n```\n```sh\nsort\
    \ bigdata > /tmp/sortout && mv /tmp/sortout bigdata\n```\n```\n\nthen the mv command\
    \ will be executed only if the sort is successful. Note that this is equivalent\
    \ to writing\n\n```\n```sh\nif sort bigdata > /tmp/sortout\nthen\n        mv /tmp/sortout\
    \ bigdata\nfi\n```\n```\n\nThe command\n\n```\n```sh\n[ -z \"$EDITOR\" ] && EDITOR=/bin/ed\n\
    ```\n```\n\ntests the value of the variable EDITOR. If it’s null, /bin/ed is assigned\
    \ to it.\n\nThe || construct works similarly, except that the second command gets\
    \ executed only if the exit status of the first is nonzero. So if you write\n\n\
    ```\n```sh\ngrep \"$name\" phonebook || echo \"Couldn't find $name\"\n```\n```\n\
    \nthe echo command will get executed only if the grep fails (that is, if it can’t\
    \ find $name in phonebook, or if it can’t open the file phonebook). In this case,\
    \ the equivalent if command would look like\n\n```\n```sh\nif grep \"$name\" phonebook\n\
    then\n    :\n```\n```"
  merge: -1
  img_proc: true
- pgno: 181
  md: "```\n```sh\nelse\n        echo \"Couldn't find $name\"\nfi\n```\n```\n\nYou\
    \ can use a complex sequence of commands on either or both the left- or right-hand\
    \ side of these constructs. On the left, the exit status tested is that of the\
    \ last command in the pipeline; thus\n\n```\n```sh\nwho | grep \"^$name \" > /dev/null\
    \ || echo \"$name's not logged on\"\n```\n```\n\ncauses execution of the echo\
    \ if the grep fails.\n\nThe && and || can also be combined on the same command\
    \ line:\n\n```\n```sh\nwho | grep \"^$name \" > /dev/null && echo \"$name's not\
    \ logged on\" \\\\\n        || echo \"$name is logged on\"\n```\n```\n\n(Recall\
    \ that when \\\\ is used at the end of the line it signals line continuation to\
    \ the shell.)\nThe first echo gets executed if the grep succeeds; the second if\
    \ it fails.\n\nThese constructs are also often used in if commands, as demonstrated\
    \ in this snippet from a system shell program (don't worry if you don't understand\
    \ every command invoked):\n\n```\n```sh\nif validsys \"$sys\" && timeok\nthen\n\
    \        sendmail \"$user@$sys\" < $message\nfi\n```\n```\n\nIf validsys returns\
    \ an exit status of zero, timeok is executed and its exit status is then tested\
    \ for the if. If that status is zero, then sendmail is executed. If validsys returns\
    \ a nonzero exit status, however, timeok is not executed, and the failed exit\
    \ status is then tested by the if, and sendmail ends up not being executed.\n\n\
    The use of the && operator in the preceding case is a logical AND; both programs\
    \ must return an exit status of zero for the sendmail program to be executed.\
    \ In fact, you could have written the above if conditional as\n\n```\n```sh\n\
    validsys \"$sys\" && timeok && sendmail \"$user@$sys\" < $message\n```\n```\n\n\
    By comparison, when the || is used in an if, the effect is like a logical OR:\n\
    \n```\n```sh\nif endofmonth || specialrequest\nthen\n        sendreports\nfi\n\
    ```\n```\n\nIf endofmonth returns a zero exit status, sendreports is executed;\
    \ otherwise specialrequest is executed and if its exit status is zero, sendreports\
    \ is executed. The net effect is that sendreports is executed if either endofmonth\
    \ or specialrequest returns an exit status of zero.\n\nIn Chapter 8 you'll learn\
    \ about how to write complex flow control loops in your programs. But before you\
    \ get there, try the exercises that follow using the if, case, && and || notations\
    \ explained in this chapter."
  merge: -1
  img_proc: true
- pgno: 182
  md: "# 'Round and 'Round\nShe Goes\n\nIn this chapter you’ll learn how to set up\
    \ program loops. These loops will enable you to execute a set of commands either\
    \ a specified number of times or until a specific end condition is met.\n\nThe\
    \ three built-in looping commands for shell programming are\n\n+   - `for`\n+\
    \   - `while`\n+   - `until`\n\nYou’ll learn about each one of these loops in\
    \ separate sections of this chapter.\n\n# The `for` Command\n\nThe for command\
    \ is used to execute one or more commands a specified number of times.\nIts basic\
    \ format is as shown:\n\n```\nfor var in word₁ word₂ ... wordₙ\ndo\n        command\n\
    \        command\n        ...\ndone\n```\n\nThe commands enclosed between the\
    \ do and the done are what’s known as the body of the loop and are executed for\
    \ as many items as are listed after the in. When the loop is executed, the first\
    \ word, word₁, is assigned to the variable var, and the body of the loop is then\
    \ executed. Next, the second word in the list, word₂, is assigned to var, and\
    \ the body of the loop is executed again."
  merge: -1
  img_proc: true
- pgno: 183
  md: "This process continues with successive words in the list being assigned to\
    \ *var* and the commands in the loop body being executed until the last word in\
    \ the list, *word_n*, is assigned to *var* and the body of the loop executed.\
    \ At that point, no words are left in the list, and execution of the **for** command\
    \ is then complete. Execution then continues with the command that immediately\
    \ follows the **done**.\n\nIf there are *n* words listed after the **in**, the\
    \ body of the loop will have been executed a total of *n* times when the loop\
    \ has finished.\n\nHere’s a loop that will be executed three times:\n\n```\nfor\
    \ i in 1 2 3\ndo\n\n        echo $i\n\ndone\n```\n\nTo try it out, type this in\
    \ directly at the terminal, just like any other shell command:\n\n```\n$ for i\
    \ in 1 2 3\n> do\n>\n>        echo $i\n>\n> done\n1\n2\n3\n$\n```\n\nWhile the\
    \ shell is waiting for the **done** to be typed to complete the **for** command,\
    \ it keeps showing the secondary command prompt. When the user enters **done**,\
    \ the shell then proceeds to execute the loop. Because three items are listed\
    \ after the **in** (1, 2, and 3), the body of the loop—in this case a single **echo**\
    \ command—will be executed a total of three times.\n\nThe first time through the\
    \ loop, the first value in the list, 1, is assigned to the variable **i**. Then\
    \ the body of the loop is executed. This displays the value of **i** at the terminal.\
    \ The next word in the list, 2, is assigned to **i** and the **echo** command\
    \ re-executed, resulting in the display of 2 at the terminal. The third word in\
    \ the list, 3, is assigned to **i** to the third time through the loop and the\
    \ **echo** command executed. This results in 3 being displayed at the terminal.\
    \ At that point, no more words are left in the list, so execution of the **for**\
    \ command is complete, and the shell displays the command prompt to let you know\
    \ it’s done.\n\nNow let’s back up to Chapter 6 and recall the **run** program\
    \ that enabled you to run a file through **tbl**, **nroff**, and **lp**:\n\n```\n\
    $ cat run\ntbl $1 | nroff -mm -Tlp | lp\n$\n```\n\nIf you wanted to run the files\
    \ memo1 through memo4, you could type the following at the terminal:\n\n```\n\
    $ for file in memo1 memo2 memo3 memo4\n> do\n```"
  merge: -1
  img_proc: true
- pgno: 184
  md: "```\n        run $file\n> done\nrequest id is laser1-33 (standard input)\n\
    request id is laser1-34 (standard input)\nrequest id is laser1-35 (standard input)\n\
    request id is laser1-36 (standard input)\n$\n```\n\nThe four values memo1, memo2,\
    \ memo3, and memo4 will be assigned in turn to the variable file and the run program\
    \ will be executed with that value as the argument. Execution will be just as\
    \ if you typed in four commands:\n\n```\n$ run memo1\nrequest id is laser1-33\
    \ (standard input)\n$ run memo2\nrequest id is laser1-34 (standard input)\n$ run\
    \ memo3\nrequest id is laser1-35 (standard input)\n$ run memo4\nrequest id is\
    \ laser1-36 (standard input)\n$\n```\n\nThe shell permits filename substitution\
    \ in the list of words in the for statement, so the previous loop could have also\
    \ been written this way:\n\n```\nfor file in memo[1-4]\ndo\n        run $file\n\
    done\n```\n\nIf you wanted to print all the files in your current directory using\
    \ the run program, you could type\n\n```\nfor file in *\ndo\n        run $file\n\
    done\n```\n\nTo do something more sophisticated, imagine filelist contains a list\
    \ of the files that you want to run through run. You can type\n\n```\nfiles=$(cat\
    \ filelist)\n\nfor file in $files\ndo\n        run $file\ndone\n```\n\nto run\
    \ each of the files, or, more succinctly,\n\n```\nfor file in $(cat filelist)\n\
    do\n        run $file\ndone\n```"
  merge: -1
  img_proc: true
- pgno: 185
  md: "The better way to address this is to actually improve the run script itself,\
    \ however, and it turns out that the for statement is perfect for the job:\n\n\
    ```\n```sh\n$ cat run\n#\n# process files through nroff -- version 2\n#\nfor file\
    \ in $*\ndo\n        tbl $file | nroff -rom -Tlp | lp\ndone\n$ \n```\n```\n\n\
    Recall that the special shell variable $* stands for all the arguments typed on\
    \ the command line. If you executed the new version of run by typing\n\n```\n\
    ```sh\nrun memo1 memo2 memo3 memo4\n```\n```\n\nthe $* in the for's list would\
    \ be replaced by the four arguments memo1, memo2, memo3, and memo4. Of course,\
    \ you could also type\n\n```\n```sh\nrun memo[1-4]\n```\n```\n\nto achieve the\
    \ same results.\n\n# The $@ Variable\n\nWhile we're utilizing $*, let's have a\
    \ closer look at how it and its cousin $@ work. To do that, let's write a program\
    \ called args that displays all the arguments typed on the command line, one per\
    \ line.\n\n```\n```sh\n$ cat args\necho Number of arguments passed is $#\n\nfor\
    \ arg in $*\ndo\n        echo $arg\n\ndone\n$\n```\n```\n\nNow to try it:\n\n\
    ```\n```sh\n$ args a b c\nNumber of arguments passed is 3\na\nb\nc\n$ args 'a\
    \ b' c\n```\n```"
  merge: -1
  img_proc: true
- pgno: 186
  md: "```\nNumber of arguments passed is 2\na\nb\nc\n$\n```\n\nLook closely at the\
    \ second example: even though `a b` was passed as a single argument to args, it\
    \ was split into two values within the `for` loop. That's because the `$*` in\
    \ the `for` command was replaced by the shell with `a b c` and the quotes were\
    \ lost. Thus the loop was executed three times.\n\nThe shell replaces the value\
    \ of `$*` with `$1, $2, ...`, but if you instead use the special shell variable\
    \ `\"$@\"` the values will be passed with `\"$1\", ...`. The key difference is\
    \ the double quotes around the `$@`: without them this variable behaves just like\
    \ `$*`.\n\nGo back to the args program and replace the unquoted `$*` with `\"\
    $@\"`:\n\n```\n$ cat args\necho Number of arguments passed is $#\n\nfor arg in\
    \ \"$@\"\ndo\n        echo $arg\n\ndone\n$\n```\n\nNow try it:\n\n```\n$ args\
    \ a b c\nNumber of arguments passed is 3\na\nb\nc\n$ args 'a b' c\nNumber of arguments\
    \ passed is 2\na b\nc\n$ args\nNumber of arguments passed is 0\n$\n```\n\n*Try\
    \ it with no arguments*\n\nIn the last case, no arguments were passed to the program\
    \ so the variable `\"$@\"` was replaced by *nothing*. The net result is that the\
    \ body of the loop was not executed at all.\n\n# The for Without the List\n\n\
    A special notation is recognized by the shell when writing `for` commands. If\
    \ you omit the `in` element and its subsequent list"
  merge: -1
  img_proc: true
- pgno: 187
  md: "```\nfor var\ndo\n    command\n    command\n    ...\ndone\n```\n\nthe shell\
    \ automatically sequences through all the arguments typed on the command line,\
    \ just as if you had written\n\n```\nfor var in \"$@\"\ndo\n    command\n    command\n\
    \    ...\ndone\n```\n\nWith that in mind, here’s the third and last version of\
    \ the args program:\n\n```\n$ cat args\necho Number of arguments passed is $#\n\
    \nfor arg\ndo\n        echo $arg\ndone\n$ args a b c\nNumber of arguments passed\
    \ is 3\na\nb\nc\n$ args 'a b' c\nNumber of arguments passed is 2\na b\nc\n$\n\
    ```\n\n# **The** while **Command**\n\nThe second type of looping command is the\
    \ while statement. The format of this command is\n\n```\nwhile command_t\ndo\n\
    \    command\n    command\n    ...\ndone\n```\n\ncommand_t is executed and its\
    \ exit status tested. If it’s zero, the commands enclosed between the do and done\
    \ are executed once. Then command_t is executed again and its exit status tested."
  merge: -1
  img_proc: true
- pgno: 188
  md: "If it’s zero, the commands enclosed between the do and done are once again\
    \ executed. This continues until `command₍c₎` returns a nonzero exit status. At\
    \ that point, execution of the loop is terminated. Execution then proceeds with\
    \ the command that follows the done.\n\nNote that the commands between the do\
    \ and done might never be executed if `command₍c₎` returns a nonzero status the\
    \ first time it’s executed.\n\nHere’s a program called *while* that simply counts\
    \ to 5:\n\n```\n$ cat twhile\ni=1\n\nwhile [ \"$i\" -le 5 ]\ndo\n        echo\
    \ $i\n        i=$((i + 1))\ndone\n$ twhile                         Run it\n1\n\
    2\n3\n4\n5\n$\n```\n\nThe variable i is initially set to the value 1. Then the\
    \ while loop is entered, succeeding on the conditional test so the code block\
    \ is executed. The shell continues execution as long as i is less than or equal\
    \ to 5. Inside the loop, the value of i is displayed at the terminal, then incremented\
    \ by one.\n\nThe while loop is often used in conjunction with the shift command\
    \ to process an unknown number of arguments typed on the command line.\n\nConsider\
    \ the next program, called *prargs*, which prints each of the command-line arguments\
    \ out, one per line.\n\n```\n$ cat prargs\n#\n# Print command line arguments one\
    \ per line\n#\n\nwhile [ \"$#\" -ne 0 ]\ndo\n        echo \"$1\"\n        shift\n\
    done\n$ prargs a b c\na\nb\nc\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "```\n$ prargs 'a b' c\na b\nc\n$ prargs *\naddresses\nintro\nlotspaces\nnames\n\
    nu\nnumbers\nphonebook\nstat\n$ prargs        No arguments\n$\n```\n\nWhile the\
    \ number of arguments is not equal to zero, the value of $1 is displayed and then\
    \ a shift is invoked to shift down the variables (that is, $2 to $1, $3 to $2,\
    \ and so on) and also decrement $#. When the last argument has been displayed\
    \ and shifted out, $# will equal zero, at which point execution of the while will\
    \ be terminated.\n\nNote that if no arguments are given to prargs (as was done\
    \ in the last case), the echo and shift are never executed because $# is equal\
    \ to zero as soon as the loop is entered.\n\n# The `until` Command\n\nThe while\
    \ command continues execution as long as the test expression continues to return\
    \ a TRUE (zero) exit status. The until command is the opposite: It continues executing\
    \ the code block until the test expression returns a nonzero exit status and stops\
    \ once a zero status is produced.\n\nHere is the general format of the until:\n\
    \n```\nuntil commandₜ\ndo\n        command\n        command\n        ...\ndone\n\
    ```\n\nLike the while, the commands between the do and done might never be executed\
    \ if commandₜ returns a zero exit status the first time it is executed.\n\nWhile\
    \ the two commands are quite similar, the until command is useful for writing\
    \ programs that wait for a particular event to occur. For example, suppose that\
    \ you want to see whether sandy is logged on because you have to give her something\
    \ important. You could send her electronic mail, but you know that she usually\
    \ doesn't get around to reading her mail until late in the day. You could use\
    \ the on program from Chapter 7 to see whether sandy's logged on:\n\n```\n$ on\
    \ sandy\nsandy is not logged on\n$\n```"
  merge: -1
  img_proc: true
- pgno: 190
  md: "Simple, but ineffective because it runs once and is done. You could run the\
    \ program periodically throughout the day (rather tedious), or, better, you could\
    \ write your own program to continually check until she does log in!\n\nLet’s\
    \ call the program waitfor and have it take a single argument: the name of the\
    \ user you want to monitor. Instead of having the program continually check for\
    \ that user logging on, however, let’s have it check only once every minute. To\
    \ do this, we’ll have to use a command called sleep, which suspends execution\
    \ of a program for a specified number of seconds.\n\n# The command\n\n`sleep n`\
    \ suspends execution of the program for n seconds. At the end of that interval,\
    \ the program resumes execution where it left off—with the command that immediately\
    \ follows sleep.\n\n```\n```sh\n$ cat waitfor\n#\n# Wait until a specified user\
    \ logs on\n#\n\nif [ \"$#\" -ne 1 ]\nthen\n        echo \"Usage: waitfor user\"\
    \n        exit 1\nfi\n\nuser=\"$1\"\n\n#\n# Check every 60 seconds for user logging\
    \ on\n#\n\nuntil who | grep \"^$user \" > /dev/null\ndo\n        sleep 60\ndone\n\
    \n#\n# When we reach this point, the user has logged on\n#\necho \"$user has logged\
    \ on\"\n$```\n```\n\nAfter checking that exactly one argument was provided, the\
    \ program assigns $1 to user. Then an until loop is entered that will be executed\
    \ until the grep exit status is zero; that is, until the specified user logs on.\
    \ As long as the user isn’t logged on, the body of the loop—the sleep command—is\
    \ executed to suspend execution for 60 seconds. At the end of the minute, the\
    \ pipeline listed after the until is re-invoked and the process is repeated."
  merge: -1
  img_proc: true
- pgno: 191
  md: "When the until loop is exited—signaling that the monitored user has logged\
    \ on—a message is displayed at the terminal to that effect and the script is done.\n\
    \n```\n```text\n$ waitfor sandy          Time passes\nsandy has logged on\n$\n\
    ```\n```\n\nOf course, running the program as shown here is not very practical\
    \ because it ties up your terminal until sandy logs on. A better idea is to run\
    \ waitfor in the background so that you can use your terminal for other work:\n\
    \n```\n```text\n$ waitfor sandy &       Run it in the background\n[1] 4392   \
    \            Job number and process id\n$ nroff waitfor         Do other work\n\
    \    ...\n\nsandy has logged on      Happens sometime later\n```\n```\n\nNow you\
    \ can do other work and the waitfor program continues executing in the background\
    \ until sandy logs on, or until you log off the system.\n\n> > **Note**\n> >\n\
    > > By default, all your processes are automatically terminated when you log off\
    \ the system.\n> > If you want a program to continue running after you’ve logged\
    \ off, you can run it with the nohup\n> > command, or schedule it to run with\
    \ at or from cron. Consult Your Unix User’s\n> > Manual for more details.\n\n\
    Because waitfor only checks once per minute for the user logging on, it won’t\
    \ consume many system resources while it’s running (an important consideration\
    \ when running programs in the background).\n\nUnfortunately, after the specified\
    \ user logs on, there’s a chance you might miss the one-line notification message.\
    \ If you’re editing a file with a screen editor such as vi, the notification message\
    \ could turn your screen into a mess, and you still might not be able to read\
    \ it!\n\nA better alternative might be to mail it to yourself instead. Heck, you\
    \ can let the user choose which they’d prefer by adding an option to the program\
    \ that, if selected, indicates that the message is to be mailed. If not selected,\
    \ the message is then displayed at the terminal.\n\nIn the version of waitfor\
    \ that follows, a -m option has been added for this purpose:\n\n```\n```sh\n$\
    \ cat waitfor\n#\n# Wait until a specified user logs on -- version 2\n#\n\nif\
    \ [ \"$1\" = -m ]\nthen\n        mailopt=TRUE\n        shift\n```\n```"
  merge: -1
  img_proc: true
- pgno: 192
  md: "```\n```sh\nelse\n        mailopt=FALSE\nfi\n\nif [ \"$#\" -eq 0 -o \"$#\"\
    \ -gt 1 ]\nthen\n        echo \"Usage: waitfor [-m] user\"\n        echo \"  \
    \  -m means to be informed by mail\"\n        exit 1\n\nfi\n\nuser=\"$1\"\n\n\
    #\n# Check every minute for user logging on\n#\n\nuntil who | grep \"^$user \"\
    \ > /dev/null\ndo\n        sleep 60\ndone\n\n#\n# When we reach this point, the\
    \ user has logged on\n#\n\nif [ \"$mailopt\" = FALSE ]\nthen\n        echo \"\
    $user has logged on\"\nelse\n        echo \"$user has logged on\" | mail steve\n\
    fi\n$\n```\n```\n\nThe first test checks to see whether the -m option was specified.\
    \ If it was, mailopt is assigned the value TRUE, and shift is executed to “shift\
    \ out” the first argument (moving the name of the user to be monitored to $1 and\
    \ decrementing $#). If the -m option wasn’t specified, mailopt is set to FALSE.\n\
    \nExecution then proceeds as in the previous version, except this time when the\
    \ main block of code completes, the mailopt variable is tested to determine whether\
    \ to output the notification via email or as an echo statement.\n\n```\n```sh\n\
    $ waitfor sandy -m\nUsage: waitfor [-m] user\n             -m means to be informed\
    \ by mail\n$ waitfor -m sandy &\n[1] 5435\n```\n```"
