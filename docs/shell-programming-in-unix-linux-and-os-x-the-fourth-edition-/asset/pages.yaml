- pgno: 340
  md: '# # Shell Summary


    This appendix summarizes the main features of the standard POSIX shell as per
    IEEE Std 1003.1-2001.


    # ## Startup


    The shell can be given the same options on the command line as can be specified
    with the `set` command. In addition, the following options can be specified:


    +   - `-c commands` — *commands* are executed.

    +   - `-i` — The shell is interactive. Signals 2, 3, and 15 are ignored.

    +   - `-s` — Commands are read from standard input.


    # ## Commands


    The general format of a command typed to the shell is


    ```

    command arguments

    ```


    where *command* is the name of the program to be executed, and *arguments* are
    its arguments. The command name and the arguments are delimited by *whitespace*
    characters, normally the space, tab, and newline characters (changing the variable
    `IFS` affects this).


    Multiple commands can be typed on the same line if they’re separated by semicolons
    `;`.


    Every command that gets executed returns a number known as the exit status; zero
    is used to indicate success, and non-zero indicates a failure.


    The pipe symbol `|` can be used to connect the standard output from one command
    to the standard input of another, as in


    ```

    who | wc -l

    ```'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'The exit status is that of the last command in the pipeline. Placing a `!`
    at the beginning of the pipeline causes the exit status of the pipeline to be
    the logical negation of the last command in the pipeline.


    If the command sequence is terminated by an ampersand `&`, it is run asynchronously
    in the background. The shell displays the process ID and job number of the command
    at the terminal and prompts for the next interactive command to be entered.


    Typing of a command can continue to the next line if the last character on the
    line is a backslash character `\`.


    The characters `&&` cause the command that follows to be executed only if the
    preceding command returns a zero exit status. The characters `||` cause the command
    that follows to be executed only if the preceding command returns a non-zero exit
    status. As an example, in


    ```

    who | grep "fred" > /dev/null && echo "fred''s logged on"

    ```


    the echo is executed only if the grep returns a zero exit status.


    # Comments


    If the character `#` appears on a line, the shell treats the remainder of the
    line as a comment and ignores it for interpretation, substitution and execution.


    # Parameters and Variables


    There are three different types of *parameters*: shell variables, special parameters,
    and positional parameters.


    # Shell Variables


    A shell variable name must start with an alphabetic or underscore `_` character,
    and can be followed by any number of alphanumeric or underscore characters. Shell
    variables can be assigned values on the command line by writing:


    ```

    variable=value variable=value ...

    ```


    Filename substitution is not performed on *value*.


    # Positional Parameters


    Whenever a shell program is executed, the name of the program is assigned to the
    variable `$0` and the arguments typed on the command line to the variables `$1`,
    `$2`, ..., respectively. Positional parameters can also be assigned values with
    the `set` command. Parameters 1 through 9 can be explicitly referenced. Parameters
    greater than 9 must be enclosed inside braces, as in `${10}`.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Special Parameters


    Table A.1 summarizes the special shell parameters.


    **Table A.1  Special Parameter Variables**


    | Parameter | Meaning |

    |---|---|

    | `$#` | The number of arguments passed to the program; or the number of parameters
    set by executing the `set` statement. |

    | `$*` | Collectively references all the positional parameters as `$1, $2, ...`.
    |

    | `$@` | Same as `$*`, except when double-quoted (`"$@"`) collectively references
    all the positional parameters as `"$1", "$2", ...`. |

    | `$0` | The name of the program being executed. |

    | `$$` | The process ID of the program being executed. |

    | `$!` | The process ID of the last program sent to the background for execution.
    |

    | `$?` | The exit status of the last command not executed in the background. |

    | `$-` | The current option flags in effect (see the `set` statement). |


    In addition to these parameters, the shell has some other variables that it uses.
    Table A.2 summarizes the more important of these variables.


    **Table A.2  Other Variables Used by the Shell**


    | Variable | Meaning |

    |---|---|

    | `CDPATH` | The directories to be searched whenever `cd` is executed without
    a full path as argument. |

    | `ENV` | The name of a file that the shell executes in the current environment
    when started interactively. |

    | `FCEDIT` | The editor used by `fc`. If not set, `ed` is used. |

    | `HISTFILE` | If set, specifies a file to be used to store the command history.
    If not set or if the file isn''t writable, `$HOME/.sh_history` is used. |

    | `HISTSIZE` | If set, specifies the number of previously entered commands accessible
    for editing. The default value is at least 128. |

    | `HOME` | The user''s home directory; the directory that `cd` changes to when
    no argument is supplied. |

    | `IFS` | The internal field separator characters; used by the shell to delimit
    words when parsing the command line, for the read and set commands, when substituting
    the output from a back-quoted command, and when performing parameter substitution.
    Normally, it contains the three characters: space, horizontal tab, and newline.
    |'
  merge: -1
  img_proc: true
