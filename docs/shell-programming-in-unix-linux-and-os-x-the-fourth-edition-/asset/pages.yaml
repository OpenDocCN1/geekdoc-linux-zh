    # The `wait` Command


    If you move a command into the background for execution, that command line runs
    in a subshell independent of your current shell (the job is said to run *asynchronously*).
    In some situations, however, you may want to wait for the background process (also
    known as a *child* process because it’s spawned from your current shell—the *parent*)
    to finish execution before proceeding. For example, you may have sent a large
    sort into the background and need to wait for it to finish before you access the
    sorted data.


    The `wait` command does the job. Its general format is


    ```

    ```text

    wait process-id

    ```

    ```


    where *process-id* is the process ID of the process you want to complete. If the
    process ID is omitted, the shell waits for all child processes to complete execution.
    Execution of your current shell will be suspended until the process or processes
    finish execution.


    You can try the `wait` command at your terminal:


    ```

    ```text

    $ sort big-data > sorted_data &       Send it to the background

    [1] 3423                              Job number & process id from the shell

    $ date                                Do some other work

    Wed Oct  2 15:05:42 EDT 2002

    $ wait 3423                           Now wait for the sort to finish

    $                                     When sort finishes, prompt is returned

    ```

    ```


    # The `$!` Variable


    If you have only one process running in the background, then `wait` with no argument
    suffices. However, if you’re running more than one background command and you
    want to wait on the most recently launched, you can access the process ID of the
    most recent background command as the special variable `$!`. So the command


    ```

    ```text

    wait $!

    ```

    ```'
  merge: -1
