- pgno: 258
  md: '# # More on Parameters


    In this chapter, you’ll learn more about variables and parameters. Technically,
    parameters include the arguments passed to a program (the *positional parameters*),
    the special shell variables such as `$#` and `$?`, and ordinary variables, also
    known as *keyword parameters*.


    Positional parameters cannot be assigned values directly but they can be reassigned
    values with the `set` command. As you know, variables are assigned values simply
    by writing


    ```

    variable=value

    ```


    The format is a bit more general than that shown, actually, because you can assign
    several variables at once using the format


    ```

    variable=value variable=value . . .

    ```


    The following example illustrates:


    ```

    $ x=100 y=200 z=50

    $ echo $x $y $z

    100 200 50

    $

    ```


    # ## Parameter Substitution


    In the simplest form, to have the value of a parameter substituted, precede the
    parameter with a dollar sign, as in `$1` or `$9`.


    ```

    ${parameter}

    ```


    If there’s a potential conflict caused by the characters that follow the parameter
    name, you can enclose the name inside curly braces, as in


    ```

    mv $file ${file}x

    ```


    This command would add an x to the end of the filename specified by `$file`. It
    could not be written as'
  merge: -1
  img_proc: true
- pgno: 259
  md: "```\nmv $file $filex\n```\n\nbecause the shell would try to substitute the\
    \ value of a variable named filex for the second argument, not file plus the letter\
    \ x.\n\nAs mentioned in Chapter 6, to access positional parameters 10 and above,\
    \ you also must enclose the number inside curly braces using the same notational\
    \ format: ${11}.\n\nBut it turns out that once you wrap a variable name with curly\
    \ braces, there’s quite a bit more you can do...\n\n```\n${parameter:-value}\n\
    ```\n\nThis construct says to use the value of *parameter* if it is not null,\
    \ and to substitute *value* otherwise. For example, in the command line\n\n```\n\
    echo Using editor ${EDITOR:-/bin/vi}\n```\n\nthe shell will use the value of EDITOR\
    \ if it’s not null and the value /bin/vi otherwise. It has the same effect as\
    \ writing\n\n```\nif [ -n \"$EDITOR\" ]\nthen\n        echo Using editor $EDITOR\n\
    else\n        echo Using editor /bin/vi\nfi\n```\n\nThe command line\n\n```\n\
    ${EDITOR:-/bin/ed} /tmp/edfile\n```\n\nstarts up the program stored in the variable\
    \ EDITOR (presumably a text editor), or /bin/ed if EDITOR is null.\n\nImportant\
    \ to note is that this doesn’t change the value of the variable, so even after\
    \ the above statement, if EDITOR started out as null, it would continue to have\
    \ the null value.\n\nHere’s a simple demonstration of this construct:\n\n```\n\
    $ EDITOR=/bin/ed\n$ echo ${EDITOR:-/bin/vi}\n/bin/ed\n$ EDITOR=              \
    \           Set it null\n$ echo ${EDITOR:-/bin/vi}\n/bin/vi\n$\n```"
