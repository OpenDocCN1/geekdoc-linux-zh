- pgno: 17
  md: '# About the Authors


    **Stephen Kochan** is the author or co-author of several best-selling titles on
    Unix and the C language, including *Programming in C*, *Programming in Objective-C*,
    *Topics in C Programming*, and *Exploring the Unix System*. He is a former software
    consultant for AT&T Bell Laboratories, where he developed and taught classes on
    Unix and C programming.


    **Patrick Wood** is the CTO of the New Jersey location of Electronics for Imaging.
    He was a member of the technical staff at Bell Laboratories when he met Mr. Kochan
    in 1985. Together they founded Pipeline Associates, Inc., a Unix consulting firm,
    where he was vice president. They co-authored *Exploring the Unix System*, *Unix
    System Security*, *Topics in C Programming*, and *Unix Shell Programming*.'
  merge: -1
  img_proc: true
