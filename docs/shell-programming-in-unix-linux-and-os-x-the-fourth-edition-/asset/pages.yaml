    # # Filename Nuances


    # ## Spaces in Filenames


    A discussion of command lines and filenames wouldn’t be complete without talking
    about the bane of old-school Unix people and very much the day-to-day reality
    of Linux, Windows, and Mac users: spaces in filenames.


    The problem arises from the fact that the shell uses spaces as delimiters between
    words. In other words the phrase `echo hi mom` is properly parsed as an invocation
    to the command `echo`, with two arguments `hi` and `mom`.


    Now imagine you have a file called `my test document`. How do you reference it
    from the command line? How do you view it or display it using the `cat` command?


    ```

    ```bash

    $ cat my test document

    cat: my: No such file or directory

    cat: test: No such file or directory

    cat: document: No such file or directory

    ```

    ```


    That definitely doesn’t work. Why? Because cat wants a filename to be specified
    and instead of seeing one, it sees three: my, test, and document.


    There are two standard solutions for this: Either escape every space by using
    a backslash, or wrap the entire filename in quotes so that the shell understands
    that it’s a single word with spaces, rather than multiple words.


    ```

    ```bash

    $ cat "my test document"

    This is a test document and is full

    of scintillating information to edify

    and amaze.

    $ cat my\ test\ document

    This is a test document and is full

    of scintillating information to edify

    and amaze.

    ```

    ```


    That solves the problem and is critical to know as you proceed with file systems
    that quite likely have lots of directories and files that contain spaces as part
    of their filenames.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Other Weird Characters


    While the space might be the most difficult and annoying of special characters
    that can appear in filenames, occasionally you’ll find others show up that can
    throw a proverbial monkey-wrench into your command line efforts.


    For example, how would you deal with a filename that contains a question mark?
    In the next section, you’ll learn that the character “?” has a specific meaning
    to the shell. Most modern shells are smart enough to sidestep the duplication
    of meaning, but, again, quoting the filename or using backslashes to denote that
    the special character is part of the filename is required:


    ```

    ```sh

    $ ls -l who\ me\?

    -rw-r--r-- 1 taylor staff 0 Dec 4 10:18 who me?

    ```

    ```


    Where this really gets interesting is if you have a backslash or quote as part
    of the filename, something that can happen inadvertently, particularly for files
    created by graphically oriented programs on a Linux or Mac system. The trick?
    Use single quotes to escape a filename that includes a double quote, and vice
    versa. Like this:


    ```

    ```sh

    $ ls -l "don''t quote me" $he said "yes"

    -rw-r--r-- 1 taylor staff 0 Dec 4 10:18 don''t quote me

    -rw-r--r-- 1 taylor staff 0 Dec 4 10:19 $he said "yes"

    ```

    ```


    This topic will come up again as we proceed, but now you know how to side-step
    problems with directories or files that contain spaces or other non-standard characters.


    # Standard Input/Output, and I/O Redirection


    # Standard Input and Standard Output


    Most Unix system commands take input from your screen and send the resulting output
    back to your screen. In Unix nomenclature, the screen is generally called the
    *terminal*, a reference that harkens back to the earliest days of computing. Nowadays
    it’s more likely to be a terminal *program* you’re running within a graphical
    environment, whether it’s a Linux window manager, a Windows computer, or a Mac
    system.


    A command normally reads its input from *standard input*, which is your computer
    keyboard by default. It’s a fancy way of clarifying that you “type in” your information.
    Similarly, a command normally writes its output to *standard output*, which is
    also your terminal or terminal app by default. This concept is depicted in Figure
    1.9.


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_47_0.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'As an example, recall that executing the `who` command results in the display
    of all users that are currently logged-in. More formally, the `who` command writes
    a list of the logged-in users to standard output. This is depicted in Figure 1.10.


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_48_0.png)


    Figure 1.10   who command


    It turns out that just about every single Unix command can take the output of
    a previous command or file as its input too, and can even send its output to another
    command or program. This concept is hugely important to understanding the power
    of the command line and why it’s so helpful to know all of these commands even
    when a graphical interface might be also available for your use.


    Before we get there, however, consider this: if the `sort` command is invoked
    without a filename argument, the command takes its input from standard input.
    As with standard output, this is your terminal (or keyboard) by default.


    When input is entered this way, an end-of-file sequence must be specified after
    the last line is typed, and, by Unix convention, that’s `Ctrl+d`; that is, the
    sequence produced by simultaneously pressing the Control (or Ctrl, depending on
    your keyboard) key and the `d` key.


    As an example, let’s use the `sort` command to sort the following four names:
    Tony, Barbara, Harry, Dirk. Instead of first entering the names into a file, we’ll
    enter them directly from the terminal:


    ```

    ```text

    $ sort

    Tony

    Barbara

    Harry

    Dirk

    Ctrl+d

    ```

    ```'
  merge: -1
  img_proc: true
