- pgno: 34
  md: '![](img/29b87b4d3daf7eb41fe5066130730f4c_34_0.png)


    Figure 1.7  `cd documents/letters`


    You can get back up to your home directory by using a single `cd` command to go
    up two directories as shown:


    ```

    ```shell

    $ cd ../..

    $ pwd

    /users/steve

    $

    ```

    ```


    Or you can get back to the home directory using a full pathname rather than a
    relative one:


    ```

    ```shell

    $ cd /users/steve

    $ pwd

    /users/steve

    $

    ```

    ```


    Finally, there is a third way to get back to the home directory that is also the
    easiest. Typing the command `cd` *without* an argument *always* moves you back
    to your home directory, no matter where you are in the file system:


    ```

    ```shell

    $ cd

    $ pwd

    /users/steve

    $

    ```

    ```


    # More on the `ls` Command


    When you type the `ls` command, the files contained in the current working directory
    are listed. But you can also use `ls` to obtain a list of files in other directories
    by supplying an argument to the command. First let''s get back to your home directory:


    ```

    ```shell

    $ cd

    $ pwd

    /users/steve

    $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Now let’s take a look at the files in the current working directory:


    ```

    ```text

    $ ls

    documents

    programs

    $

    ```

    ```


    If you supply the name of one of these directories to the `ls` command, you can
    get a list of the contents of that directory. So you can find out what’s contained
    in the documents directory by typing the command `ls documents`:


    ```

    ```text

    $ ls documents

    letters

    memos

    proposals

    $

    ```

    ```


    To take a look at the subdirectory memos, you can follow a similar procedure:


    ```

    ```text

    $ ls documents/memos

    dact

    plan

    $

    ```

    ```


    If you specify a nondirectory file argument to the `ls` command, you simply get
    that filename echoed back at the terminal:


    ```

    ```text

    $ ls documents/memos/plan

    documents/memos/plan

    $

    ```

    ```


    Confused? There’s an option to the `ls` command that lets you determine whether
    a particular file is a directory, among other things. The `-l` option (the letter
    l) provides a more detailed description of the files in a directory. If you were
    currently in steve’s home directory, here’s what the `-l` option to the `ls` command
    produces:


    ```

    ```text

    $ ls -l

    total 2

    drwxr-xr-x  5 steve    DP3725     80 Jun 25 13:27 documents

    drwxr-xr-x  2 steve    DP3725     96 Jun 25 13:31 programs

    $

    ```

    ```


    The first line of the display is a count of the total number of blocks (1,024
    bytes) of storage that the listed files use. Each successive line displayed by
    the `ls -l` command contains detailed information about a file in the directory.
    The first character on each line indicates what type of file it is: `d` for a
    directory, `-` for a file, `b`, `c`, `l`, or `p` for a special file.


    The next nine characters on the line define the access permissions of that particular
    file or directory. These **access modes** apply to the file’s owner (the first
    three characters), other users in'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'the same **group** as the file’s owner (the next three characters), and finally
    all other users on the system (the last three characters). Generally, they indicate
    whether the specified class of user can read the file, write to the file, or execute
    the contents of the file (in the case of a program or shell script).


    The `ls -l` command then shows the link count (see “Linking Files: The ln Command,”
    later in this chapter), the owner of the file, the group owner of the file, how
    large the file is (that is, how many characters are contained in it), and when
    the file was last modified. The information displayed last on the line is the
    filename itself.


    > > **Note**

    > >

    > > Many modern Unix systems have gone away from using groups, so while those
    permissions are still shown, the group owner for a specific file or directory
    is often omitted in the output of the `ls` command.


    You should now be able to glean a lot of information from the `ls -l` output for
    a directory full of files:


    ```

    ```shell

    $ ls -l programs

    total 4


    -rwxr-xr-x  1 steve  DP3725   358 Jun 25 13:31 collect

    -rwxr-xr-x  1 steve  DP3725  1219 Jun 25 13:31 mon

    -rwxr-xr-x  1 steve  DP3725    89 Jun 25 13:30 wb

    $

    ```

    ```


    The dash in the first column of each line indicates that the three files collect,
    mon, and wb are ordinary files and not directories. Now, can you figure out how
    big are they?


    # Creating a Directory: The mkdir Command


    Use `mkdir` to create directories. The argument to this command is simply the
    name of the directory you want to create. For example, assume that you are still
    working with the directory structure depicted in Figure 1.7 and that you want
    to create a new directory called `misc` at the same level as the directories documents
    and programs. If you were currently in your home directory, typing the command
    `mkdir misc` would achieve the desired effect:


    ```

    ```shell

    $ mkdir misc

    $

    ```

    ```


    Now if you run `ls`, you will have the new directory listed:


    ```

    ```shell

    $ ls

    documents

    misc

    programs

    $

    ```

    ```'
