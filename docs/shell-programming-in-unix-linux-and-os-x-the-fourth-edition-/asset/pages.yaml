- pgno: 146
  md: '# A Program to Remove Someone from the Phone Book


    No set of programs that enable you to look up or add someone to the phone book
    would be complete without a program to remove someone from the phone book too.
    We''ll call this program rem and let the user specify the name of the person to
    be removed as a command argument.


    What should the strategy be for developing the program? Essentially, you want
    to remove the line from the file that contains the specified name, which is a
    reverse pattern match. The -v option to grep can be used here because it does
    exactly what we want, printing all lines from a file that don''t match a pattern:


    ```

    ```sh

    $ cat rem

    #

    # Remove someone from the phone book

    #


    grep -v "$1" phonebook > /tmp/phonebook

    mv /tmp/phonebook phonebook

    $```

    ```


    The grep construct writes all lines that don''t match into the file /tmp/phonebook.
    (Tip: /tmp is a directory designated in Unix systems for temporary files and is
    usually wiped clean every time the system restarts.) After the grep command is
    done, the old phonebook file is replaced by the new one from /tmp.


    ```

    ```text

    $ rem ''Stromboli Pizza''    Remove this entry

    $ cat phonebook

    Alice Chebba    973-555-2015

    Barbara Swingle 201-555-9257

    Billy Bach      201-555-7618

    Liz Stachiw     212-555-2298

    Susan Goldberg  201-555-7776

    Susan Topple    212-555-4932

    Tony Iannino    973-555-1295

    $ rem Susan

    $ cat phonebook

    Alice Chebba    973-555-2015

    Barbara Swingle 201-555-9257

    Billy Bach      201-555-7618

    Liz Stachiw     212-555-2298

    Tony Iannino    973-555-1295

    $```

    ```


    The first case, where Stromboli Pizza was removed, worked fine. In the second
    case, however, both Susan entries were removed because they both matched the pattern.
    Not good! You can use the add program to add them back to the phone book:


    ```

    ```sh

    $ add ''Susan Goldberg'' 201-555-7776

    $ add ''Susan Topple'' 212-555-4932

    $```

    ```'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'In Chapter 7, you’ll learn how to test the action prior to taking it so the
    program can determine whether more than one matching entry is found. The program
    might want to alert the user that more than one match has been found, for example,
    rather than just blindly delete multiple entries. (This can be very helpful, because
    most implementations of `grep` will match *everything* if an empty string is passed
    as the pattern, which would effectively delete the phonebook entirely. Not good.)


    Incidentally, note that `sed` could have also been used to delete the matching
    entry. In such a case, the `grep` could be replaced with


    ```

    ```sh

    sed "$1/d" phonebook > /tmp/phonebook

    ```

    ```


    to achieve the same result. The double quotes are needed around the `sed` command’s
    argument to ensure that the value of `$1` is substituted, while at the same time
    ensuring that the shell doesn’t see a command line like


    ```

    ```sh

    sed /Stromboli Pizza/d phonebook > /tmp/phonebook

    ```

    ```


    and pass three arguments to `sed` rather than two.


    ```

    ```sh

    ${n}

    ```

    ```


    If you supply more than nine arguments to a program, you cannot access the tenth
    and greater arguments with `$10`, `$11`, and so on. If you try to access the tenth
    argument by writing


    ```

    ```sh

    $10

    ```

    ```


    the shell actually substitutes the value of `$1` followed by a `0`. Instead, the
    format


    ```

    ```sh

    ${n}

    ```

    ```


    must be used. To directly access argument 10, you must write


    ```

    ```sh

    ${10}

    ```

    ```


    in your program, and so on for arguments 11, 12, and so on.


    # The `shift` Command


    The `shift` command allows you to effectively *left-shift* your positional parameters.
    If you execute the command


    ```

    ```sh

    shift

    ```

    ```


    whatever was previously stored inside `$2` will be assigned to `$1`, whatever
    was previously stored in `$3` will be assigned to `$2`, and so on. The old value
    of `$1` will be irretrievably lost.


    When this command is executed, `$#` (the number of arguments variable) is also
    automatically decremented by one:


    ```

    ```sh

    $ cat tshift

    echo $# $*

    shift

    echo $# $*

    ```

    ```


    *Program to test the shift*'
