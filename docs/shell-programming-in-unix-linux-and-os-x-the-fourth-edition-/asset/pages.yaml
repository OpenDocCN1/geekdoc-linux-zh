- pgno: 260
  md: '# ${parameter:=value}


    This version is similar to the previous, but if `parameter` is null not only is
    `value` used, but it is also assigned to `parameter` as well (note the = in the
    construct). You can’t assign values to positional parameters this way, however,
    so that means that `parameter` can’t be a number.


    A typical use of this construct would be in testing to see whether an exported
    variable has been set and, if not, assigning it a default value:


    ```

    `${PHONEBOOK:=$HOME/phonebook}`

    ```


    This says that if `PHONEBOOK` already has an assigned value, leave it alone, otherwise
    set it to `$HOME/phonebook`.


    Note that the preceding example could not stand alone as a command because after
    the substitution is performed the shell would attempt to execute the result:


    ```

    ```sh

    $ PHONEBOOK=

    $ ${PHONEBOOK:=$HOME/phonebook}

    sh: /users/steve/phonebook: cannot execute

    $

    ```

    ```


    To use this construct as a stand-alone command, the null command can be employed.
    If you write


    ```

    : ${PHONEBOOK:=$HOME/phonebook}

    ```


    the shell still does the substitution (it evaluates the rest of the command line),
    yet executes nothing (the null command).


    ```

    ```sh

    $ PHONEBOOK=

    $ : ${PHONEBOOK:=$HOME/phonebook}    # See if it got assigned

    $ echo $PHONEBOOK

    /users/steve/phonebook

    $ : ${PHONEBOOK:=foobar}             # Shouldn’t change

    $ echo $PHONEBOOK

    /users/steve/phonebook               # It didn’t

    $

    ```

    ```


    Just as commonly seen, however, are shell programs that use the `:=` notation
    on the first reference to the variable in a conditional or echo statement. Same
    effect, but without the null command.


    # ${parameter:?value}


    If `parameter` is not null, the shell substitutes its value; otherwise, the shell
    writes `value` to standard error and then exits (don’t worry—if it’s done from
    your login shell, you won’t be logged off). If `value` is omitted, the shell writes
    the default error message


    ```

    prog: parameter: parameter null or not set

    ```'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Here’s an example:


    ```

    ```sh

    $ PHONEBOOK=

    $ : ${PHONEBOOK:?"No PHONEBOOK file"}

    No PHONEBOOK file

    $ : ${PHONEBOOK:?}

    sh: PHONEBOOK: parameter null or not set

    $

    ```

    ```


    With this construct, you can easily check to see whether variables needed by a
    program are all set and not null:


    ```

    ```sh

    : ${TOOLS:?}  ${EXPTOOLS:?}  ${TOOLBIN:?}

    ```

    ```


    # `${parameter:+value}`


    This one substitutes value if *parameter* is not null; otherwise, it substitutes
    nothing. It’s the opposite of `-`, of course.


    ```

    ```sh

    $ traceopt=T

    $ echo options: ${traceopt:+"trace mode"}

    options: trace mode

    $ traceopt=

    $ echo options: ${traceopt:+"trace mode"}

    options:

    $

    ```

    ```


    The *value* part for any of the constructs in this section can be a command substitution
    because it’s executed only if its value is required. This can get a bit complicated
    too. Consider this:


    ```

    ```sh

    WORKDIR=${DBDIR:-$(pwd)}

    ```

    ```


    Here WORKDIR is assigned the value of DBDIR if it’s not null, or the pwd command
    is executed and the result assigned to WORKDIR. pwd is executed *only if* DBDIR
    is null.


    # Pattern Matching Constructs


    The POSIX shell offers four parameter substitution constructs that perform pattern
    matching. Some really old shells do not support this feature, but it’s unlikely
    you’ll encounter one of them if you’re on a modern Unix, Linux, or Mac system.


    The construct takes two arguments: a variable name (or parameter number) and a
    pattern. The shell searches through the contents of the specified variable to
    match the supplied pattern. If matched, the shell uses the value of the variable
    on the command line, with the *matching portion of the pattern deleted*. If the
    pattern is not matched, the entire contents of the variable are used on the command
    line. In both cases, the contents of the variable remain unchanged.


    The term *pattern* is used here because the shell allows you to use the same pattern
    matching characters that it accepts in filename substitution and case values:
    `*` to match zero or more characters, `?` to match any single character, `[...]`
    to match any single character from the specified set, and `[...]` to match any
    single character not in the specified set.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'When you write the construct


    `${variable#pattern}`


    the shell looks inside `variable` to see whether it ends with the specified `pattern`.
    If it does, the contents of `variable` are used, with the shortest matching `pattern`
    removed from the right.


    If you use the construct


    `${variable%pattern}`


    the shell once again looks inside `variable` to see whether it ends with `pattern`.
    This time, however, it removes the longest matching pattern from the right. This
    is relevant only if the `*` is used in the construct. Otherwise, the `%` and `%`
    behave the same way.


    The `#` is used in a similar way to force the pattern matching to start from the
    left rather than the right. So, the construct.


    `${variable#pattern}`


    tells the shell to use the value of `variable` on the command line, with `pattern`
    removed from the left.


    Finally, the shell construct


    `${variable##pattern}`


    works like the `#` form, except that the longest occurrence of `pattern` is removed
    from the left.


    Remember that in all four cases, no changes are made to the variable itself. You
    are affecting only what gets used on the command line. Also, remember that the
    pattern matches are anchored. In the case of the `%` and `%%` constructs, the
    values of the variable must end with the specified pattern; in the case of the
    `#` and `##` constructs, the variable must begin with it.


    Here are some simple examples to show how these constructs work:


    ```

    ```sh

    $ var=testcase

    $ echo $var

    testcase

    $ echo ${var%e}

    testcas

    $ echo $var

    testcase

    $ echo ${var%s*e}

    testca

    $ echo ${var%%s*e}

    te

    $ echo ${var#?e}

    stcase

    $ echo ${var#*s}

    tcase

    $ echo ${var##*s}

    ```

    ```


    *Remove e from right*


    *Variable is unchanged*


    *Remove smallest match from right*


    *Remove longest match*


    *Remove smallest match from left*


    *Remove smallest match from left*


    *Remove longest match from left*'
  merge: -1
