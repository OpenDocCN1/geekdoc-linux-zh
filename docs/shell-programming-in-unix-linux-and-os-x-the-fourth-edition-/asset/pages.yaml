- pgno: 376
  md: "# The `unset` Command\n\n*General Format:* `unset names`\n\nThis causes the\
    \ shell to erase definitions of the variables or functions listed in `names`.\
    \ Read-only variables cannot be unset. The `-v` option to unset specifies that\
    \ a variable name follows, whereas the `-f` option specifies a function name.\
    \ If neither option is used, it is assumed that variable name(s) follow.\n\n```\n\
    *Example*\n\n```sh\nunset dlist files\n```\n```\n\n*Remove definitions of variables\
    \ `dlist` and `files`*\n\n# The `until` Command\n\n*General Format:*\n\n```\n\
    ```sh\nuntil commandₜ\ndo\n        command\n        command\n        ...\ndone\n\
    ```\n```\n\n`commandₜ` is executed and its exit status tested. If it is nonzero,\
    \ the commands enclosed between the `do` and `done` are executed. Then `commandₜ`\
    \ is executed again and its status tested. If it is nonzero, the commands between\
    \ the `do` and `done` are once again executed. Execution of `commandₜ` and subsequent\
    \ execution of the commands between the `do` and `done` continues until `commandₜ`\
    \ returns a zero exit status, at which point the loop is terminated. Execution\
    \ then continues with the command that follows the done.\n\nBecause `commandₜ`\
    \ gets evaluated immediately on entry into the loop, the commands between the\
    \ `do` and `done` may never be executed if the test returns a zero exit status\
    \ the first time.\n\n```\n*Example*\n\n```sh\n# sleep for 60 seconds until jack\
    \ logs on\nuntil who | grep jack > /dev/null\ndo\n        sleep 60\ndone\n\necho\
    \ jack has logged on\n```\n```\n\nThe preceding loop continues until the `grep`\
    \ returns a zero exit status (that is, finds jack in who’s output). At that point,\
    \ the loop is terminated, and the echo command that follows is executed."
  merge: -1
  img_proc: true
- pgno: 377
  md: "# The `wait` Command\n\n*General Format:* `wait job`\n\nThis command causes\
    \ the shell to suspend its execution until the process identified as `job` finishes\
    \ executing. Job can be a process ID or a `job_id`. If `job` is not supplied,\
    \ the shell waits for all child processes to finish executing. If more than one\
    \ process is listed, `wait` will wait for them all to complete.\n\n`wait` is useful\
    \ for waiting for processes to finish that have been sent to the background for\
    \ execution.\n\n*Example*\n\n```\nsort large_file > sorted_file &    sort in the\
    \ background\n    . . .                         Continue processing\nwait    \
    \                          Now wait for sort to finish\nplotdata sorted_file\n\
    ```\n\nThe variable `$!` can be used to obtain the process ID of the last process\
    \ sent to the background.\n\n# The `while` Command\n\n*General Format:*\n\n```\n\
    while commandₜ\ndo\n        command\n        command\n        . . .\ndone\n```\n\
    \n`commandₜ` is executed and its exit status tested. If it is zero, the commands\
    \ enclosed between the `do` and `done` are executed. Then `commandₜ` is executed\
    \ again and its status tested. If it is zero, the commands between the `do` and\
    \ `done` are once again executed. Execution of `commandₜ` and subsequent execution\
    \ of the commands between the `do` and `done` continues until `commandₜ` returns\
    \ a non-zero exit status, at which point the loop is terminated. Execution then\
    \ continues with the command that follows the `done`.\n\nNote that because `commandₜ`\
    \ gets evaluated immediately on entry into the loop, the commands between the\
    \ `do` and `done` may never be executed if the test returns a non-zero exit status\
    \ the first time.\n\n*Example*\n\n```\n# fill up the rest of the buffer with blank\
    \ lines\n\nwhile [ $lines -le $maxlines ]\ndo\n        echo >> $BUFFER\n     \
    \   lines=$((lines + 1))\ndone\n```"
  merge: -1
  img_proc: true
- pgno: 378
  md: '# For More Information


    Many sources of information on Unix, Linux and the Mac OS X command line are available,
    but we have selected titles and Web sites of particular value to shell programmers.
    All Web sites and URLs are valid as of the publication of this book, but as is
    often the case on the Internet, some may not be available by the time you read
    this.


    There is one reference that you cannot do without. This is the built-in documentation
    for your particular system, which offers detailed descriptions of the syntax and
    various options for each command.


    # Online Documentation


    If a printed version of your system’s documentation isn’t available, you can use
    the man command to get information (referred to as the “man pages”) about any
    specific Unix command. The format is


    `man command`


    Not sure of the command name? `man -k` can help you identify the specific Linux
    or Unix command you seek, as in this example from Ubuntu Linux:


    ```

    ```text

    $ man -k dvd

    brasero (1)          - Simple and easy to use CD/DVD burning application for ...

    btcflash (8)          - firmware flash utility for BTC DRW1008 DVD+/-RW recorder.

    dvd+rw-booktype (1)   - format DVD+-RW/-RAM disk with a logical format

    dvd+rw-format (1)     - format DVD+-RW/-RAM disk

    dvd+rw-mediainfo (1)  - display information about dvd drive and disk

    dvd-ram-control (1)   - checks features of DVD-RAM discs

    growisofs (1)         - combined genisoimage frontend/DVDr recording program.

    rpl8 (8)              - Firmware loader for DVD drives

    $

    ```

    ```


    Some systems have an interactive documentation command called info. To invoke
    it, simply type info and after it starts up, type h for a tutorial.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# Documentation on the Web


    The best place on the Web for information on the POSIX standard is at www.unix.org.
    This site is maintained by The Open Group, an international consortium that worked
    with the IEEE to create the current POSIX specification. The complete specification
    is available on its Web site. You must register first to read it, but registration
    is free. The URL for accessing the documentation is www.unix.org/online.html.


    The Free Software Foundation maintains online documentation for a variety of Linux
    and Unix utilities, notably including Bash and the C compiler, at www.fsf.org/manual.


    David Korn, the developer of the Korn shell, maintains www.kornshell.com. It contains
    documentation, downloads, information on books on the Korn shell, and links to
    information on other shells.


    If you only have access to Microsoft Windows systems but still want to try your
    hand at shell programming, or you just want to get a taste of Linux, we encourage
    you to install the Cygwin package from www.cygwin.com. The base system includes
    Bash and lots of other command line utilities, offering a system remarkably Linux
    and Unix like. Best of all, the entire Cygwin package is free to download and
    use.


    # Books


    # O’Reilly & Associates


    A good source of books on Linux and Unix-related topics is O’Reilly and Associates
    (www.ora.com). Their books cover a wide variety of subjects and are available
    from their Web site, from booksellers online, and in book stores. Their Web site
    also has many useful articles on Unix and Linux.


    Two good references on Unix and Linux, respectively:


    *Unix in a Nutshell*, 4th Edition, A. Robbins, O’Reilly & Associates, 2005.


    *Linux in a Nutshell*, 6th Edition, E. Siever, S. Figgins, R. Love and A. Robbins,
    O’Reilly & Associates, 2009.


    Two good books on Perl programming, from beginner to advanced:


    *Learning Perl*, 6th Edition, R. L. Schwartz, B. Foy and T. Phoenix, O’Reilly
    & Associates, 2011.


    *Perl in a Nutshell*, 2nd Edition, S. Spainhour, E. Siever, and N. Patwardhan,
    O’Reilly & Associates, 2002


    A good book covering both the POSIX standard versions of awk and sed as well as
    the GNU versions:


    *Sed & Awk*, 2nd Edition, D. Dougherty and A. Robbins, O’Reilly & Associates,
    1997 (ISBN 978-1-56592-225-9).'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'Want to learn more about the Unix command line from a Mac user’s perspective?
    We recommend:


    *Learning Unix for OS X*, D. Taylor, O’Reilly & Associates


    # Pearson


    Learn the essentials of Unix shell programming from the ground up:


    *Sams Teach Yourself Shell Programming in 24 Hours*, 2nd Edition, S. Veeraraghaven,
    Sams Publishing, 2002.


    A good book for learning Unix and programming in C and Perl on a Unix system:


    *Sams Teach Yourself Unix in 24 Hours*, 5th Edition, D. Taylor, Sams Publishing,
    2016.


    This title offers a broad range of topics related to FreeBSD, a robust and free
    UNIX that many demanding enterprises use in place of Linux. It is detailed in
    its approach and offers information not found anywhere else:


    *FreeBSD Unleashed, 2nd Edition*, M. Urban and B. Tiemann, Sams Publishing, 2003.


    Learn FreeBSD from the ground up. This book is the only beginning level tutorial
    that offers all the ins and outs of the FreeBSD operating system:


    *Sams Teach Yourself FreeBSD in 24 Hours*, Michael Urban and Brian Tiemann, 2002.


    *The Unix C Shell Field Guide*, G. Anderson and P. Anderson, Prentice Hall, 1986.


    An in-depth reference to the C shell.


    *The AWK Programming Language*, A. V. Aho, B. W. Kernighan, and P. J. Weinberger,
    Addison-Wesley, 1988.


    A complete description of the awk language authored by its creators.


    *The Unix Programming Environment*, B. W. Kernighan and R. Pike, Prentice Hall,
    1984.


    An advanced Unix programming book.


    *Advanced Linux Programming*, M. Mitchell, J. Oldham, and A. Samuel, New Riders
    Publishing, 2001.


    An advanced Linux programming book.'
