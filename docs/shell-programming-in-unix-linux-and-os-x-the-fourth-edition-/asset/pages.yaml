- pgno: 323
  md: "The real value of this construct is that it allows arithmetic expressions to\
    \ be used in `if`, `while`, and `until` commands. The comparison operators set\
    \ the exit status to a non-zero value if the result of the comparison is false\
    \ and to a zero value if the result is true. So writing\n\n```\n(( i == 100 ))\n\
    ```\n\nhas the effect of testing `i` to see whether it is equal to 100 and setting\
    \ the exit status appropriately. This makes integer arithmetic ideal for inclusion\
    \ in `if` conditionals:\n\n```\nif (( i == 100 ))\nthen\n        ...\nfi\n```\n\
    \nThe `(( i == 100 ))` returns an exit status of zero (true) if `i` equals 100\
    \ and one (false) otherwise, and has the same effect as writing\n\n```\nif [ \"\
    $i\" -eq 100 ]\nthen\n        ...\nfi\n```\n\nAnother advantage of using `((...))`\
    \ rather than `test` is the ability to perform arithmetic as part of the test:\n\
    \n```\nif (( i / 10 != 0 ))\nthen\n        ...\nfi\n```\n\nHere the comparison\
    \ returns TRUE if `i` divided by 10 is not equal to zero.\n\n`while` loops can\
    \ also benefit from integer arithmetic. For example,\n\n```\nx=0\nwhile (( x++\
    \ < 100))\ndo\n        commands\ndone\n```\n\nexecutes `commands` 100 times.\n\
    \n# Integer Types\n\nBoth the Korn and Bash shells support an integer data type.\
    \ You can declare variables to be integers by using the typeset command with the\
    \ `-i` option\n\n```\ntypeset -i variables\n```\n\nwhere `variables` are any valid\
    \ shell variable names. Initial values can also be assigned to the variables at\
    \ the time they are declared:\n\n```\ntypeset -i signal=1\n```"
  merge: -1
  img_proc: true
- pgno: 324
  md: 'The main benefit: arithmetic performed on integer variables with the `((...))`
    construct is faster than on non-integer values.


    However, an integer variable cannot be assigned anything but an integer value
    or integer expression. If you attempt to assign a non-integer to it, the message
    `bad number` is printed by the shell:


    ```

    ```sh

    $ typeset -i i

    $ i=hello

    ksh: i: bad number

    ```

    ```


    Bash simply ignores any strings that don''t contain numeric values and generates
    an error for anything that contains both numbers and other characters:


    ```

    ```sh

    $ typeset -i i

    $ i=hello

    $ echo $i

    0

    $

    $ i=1hello

    bash: i: hello: value too great for base (error token is "1hello")

    $ i=10+15

    $ echo $i

    25

    $

    ```

    ```


    The preceding example also shows that integer-valued expressions can be assigned
    to an integer variable, without even having to use the `((...))` construct. This
    holds true for both shells.


    # Numbers in Different Bases


    Both Korn and Bash also allow you to perform arithmetic in different numeric bases.
    To write a number in a different base with these shells, you use the notation


    `base#number`


    For example, to express the value 100 in base 8 (octal) you can write


    `8#100`


    You can write constants in different bases anywhere an integer value is permitted.
    To assign octal 100 to the integer variable i, you can write


    ```

    ```sh

    typeset -i i=8#100

    ```

    ```


    Note that with the Korn shell the base of the first value assigned to an integer
    variable sets the default base of all subsequent uses of that variable. In other
    words, if the first value you assign to the integer variable i is an octal number,
    each time you reference the value of i on the command line, the Korn shell displays
    it as an octal number using the notation `8#value`.


    ```

    ```sh

    $ typeset -i i=8#100

    $ echo $i

    8#100

    $ i=50

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 325
  md: '```

    ```shell

    $ echo $i

    8#62

    $ (( i = 16#a5 + 16#120 ))

    $ echo $i

    8#705

    $

    ```

    ```


    Because the first value assigned to i is an octal number (8#100), all further
    references to i will also be in octal. When the base 10 value of 50 is next assigned
    to i and then i is subsequently displayed, we get the value 8#62, which is the
    octal equivalent of 50 in base 10.


    There’s a subtlety in the above example too: while the display value of i is set
    to octal, the default numeric base for values assigned to the variable remain
    decimal unless specified otherwise. In other words, i=50 was not equivalent to
    i=8#50 even though the shell knew i was to be referenced as base 8.


    In the preceding example, the ((...)) construct is used to add the two hexadecimal
    values a5 and 120. The result is then displayed, once again in octal. We admit,
    that’s fairly obscure and not likely something you’ll encounter in day-to-day
    shell programming or interactive use!


    Bash uses both the *base#number* syntax for arbitrary bases and the C language
    syntax for octal and hexadecimal numbers—octal numbers are preceded by 0 (zero),
    and hexadecimal numbers are preceded by 0x:


    ```

    ```shell

    $ typeset -i i=0100

    $ echo $i

    64

    $ i=0x80

    $ echo $i

    128

    $ i=2#1101001

    $ echo $i

    105

    $ (( i = 16#a5 + 16#120 ))

    $ echo $i

    453

    $

    ```

    ```


    Unlike the Korn shell, Bash doesn’t keep track of the variable’s numeric base;
    integer variables are displayed as decimal values. You can always use printf to
    print integers in octal or hexadecimal format.


    As you can see, with Bash and the Korn shell it’s easy to work with different
    bases which makes it possible to write functions that perform base conversion
    and non-decimal arithmetic.'
