- pgno: 155
  md: "value substituted, of course), =, and julio. test then evaluates whether the\
    \ first argument is identical to the third argument and returns a zero exit status\
    \ if it is and a nonzero exit status if it is not.\n\nThe exit status returned\
    \ by test is then tested by the if statement. If it’s zero, the commands between\
    \ then and fi are executed; in this case, the single echo command is executed.\
    \ If the exit status is nonzero, the echo command is skipped.\n\nAs demonstrated\
    \ above, it’s good programming practice to enclose shell variables that are arguments\
    \ to test inside a pair of *double* quotes (to allow variable substitution). This\
    \ ensures that test sees the argument in the even if its value is null. For example,\
    \ consider the following example:\n\n```\n```sh\n$ name=\t\t\t\tSet name null\n\
    $ test $name = julio\nsh: test: argument expected\n$\n```\n```\n\nBecause name\
    \ was null, only two arguments were passed to test: = and julio—because the shell\
    \ substituted the value of name before parsing the command line into arguments.\
    \ In fact, after $name was substituted by the shell, it was as if you typed the\
    \ following:\n\n```\n```sh\ntest = julio\n```\n```\n\nWhen test executed, it saw\
    \ only two arguments (see Figure 7.1) and therefore issued the error message.\n\
    \n![](img/29b87b4d3daf7eb41fe5066130730f4c_155_0.png)\n\nFigure 7.1  `test $name\
    \ = julio` with name null\n\nBy placing double quotes around the variable, you\
    \ ensure that test sees the argument because quotes act as a “placeholder” when\
    \ the argument is null.\n\n```\n```sh\n$ test \"$name\" = julio\n$ echo $?\t\t\
    \t\tPrint the exit status\n1\n$\n```\n```\n\nEven if name is null, the shell still\
    \ passes three arguments to test, the first one being a null value (see Figure\
    \ 7.2).\n\n![](img/29b87b4d3daf7eb41fe5066130730f4c_155_1.png)\n\nFigure 7.2 \
    \ `test \"$name\" = julio` with name null"
