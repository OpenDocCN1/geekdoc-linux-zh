- pgno: 58
  md: '# # What Is the Shell?


    In this chapter you’ll learn what the Unix command shell is, what it does and
    why it’s a vital part of every power user’s toolbox.


    # ## The Kernel and the Utilities


    The Unix system is logically divided into two different areas: the *kernel* and
    the *utilities* (see Figure 2.1). Or, if you prefer, the kernel and everything
    else, generally all accessed through the shell.


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_58_0.png)


    Figure 2.1  The Unix system


    The kernel is the heart of the Unix system and resides in the computer’s memory
    from the time the computer is turned on and *booted* until the time it is shut
    down.


    The various tools and utilities that make up the full Unix system experience reside
    on the computer’s disk and are only brought into memory and executed as requested.
    Virtually every Unix command you know is a utility; therefore, the program resides
    on the disk and is only brought into memory at your request. So, for example,
    when you execute the date command, the Unix system loads the program called date
    from the computer’s disk into memory and begins reading its code to take the specified
    action or actions.


    The shell is also a utility program and is loaded into memory for execution as
    part of your login sequence. In fact, it’s worth learning the precise sequence
    of events that occurs when the first shell on a terminal or window starts up.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# The Login Shell


    In the old days, terminals were physical devices that were connected to the Unix
    hardware through a direct wire. Nowadays, however, terminal programs let you stay
    within your Linux, Mac or Windows environment and interact with the system over
    the network in a managed window. Generally you launch a program such as Terminal
    or xterm, then connect to remote systems as needed using programs such as ssh,
    telnet, or rlogin.


    For each physical terminal on a system, a program called getty will be active.
    This is depicted in Figure 2.2.


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_59_0.png)


    Figure 2.2  The getty process


    The Unix system—more precisely a program called init—automatically starts up a
    getty program on each terminal port whenever the system is allowing users to log
    in. getty is essentially a device driver, letting the login program display the
    message login: at its assigned terminal and wait for someone to type in something.


    If you connect via a program like ssh, you’ll be assigned a pseudo-terminal or
    pseudo-tty, in Unix parlance. That’s why when you typed in who you saw entries
    like ptty3 or pty1.


    In both instances, there is the program that reads your account and password information,
    and the program that validates it and invokes whatever login programs are needed
    for you to “log in” if everything checks out and is correct.


    As soon as someone types in some characters followed by the Enter key, the login
    program finishes the process of logging in (see Figure 2.3).'
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/29b87b4d3daf7eb41fe5066130730f4c_60_0.png)


    Figure 2.3  login started on sue’s terminal


    When login begins execution, it displays the string `Password:` at the terminal
    and then waits for you to type your password. After you have typed it and pressed
    Enter (you won’t see any output as you type, for security reasons), login then
    proceeds to verify your login name and password against the corresponding entry
    in the file `/etc/passwd`. This file contains an entry for each user account that
    specifies, among other things, the login name, home directory, and program to
    start up when that user logs in. The last bit of information (the login shell)
    is stored after the last colon of each line. If nothing follows the last colon,
    the standard shell `/bin/sh` is assumed by default.


    If you log in through a terminal program, the data handshake might involve a program
    like `ssh` on your system and `sshd` on the server, and if you’re opening up a
    window on your Unix computer, it will likely just instantly log you in without
    you having to again type in your password. Handy!


    But back to the password file. The following three lines show typical lines from
    `/etc/passwd` for three users of the system: sue, pat, and bob:


    ```

    sue:*:15:47::/users/sue:

    pat:*:99:7::/users/pat:/bin/ksh

    bob:*:13:100::/users/data:/users/data/bin/data_entry

    ```


    After login validates an encrypted version of the password you typed in against
    the encrypted password for the specified account as stored in `/etc/shadow`, it
    then checks for the name of the login program to execute. In most cases, this
    will be `/bin/sh`, `/bin/ksh`, or `/bin/bash`. In other cases, it may be a special
    custom-designed program or `/bin/nologin` for accounts that don’t include interactive
    access (common for file ownership management). The idea underlying them all is
    that you can set up a login account to automatically run any program whatsoever
    whenever someone logs in to the system. The shell is the program most often selected
    because of its general utility, but it’s not the only game in town.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'Back to Sue. Once she’s validated, login essentially kills itself, handing
    off control of Sue’s terminal connection to the standard shell and then vanishing
    from memory (see Figure 2.4).


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_61_0.png)


    Figure 2.4  login executes `/usr/bin/sh`


    According to the other entries from `/etc/passwd` shown previously, pat gets the
    program `ksh` stored in `/bin` (this is the Korn shell), and bob gets the specialized
    program `data_entry` (see Figure 2.5).


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_61_1.png)


    Figure 2.5  Three users logged in'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'As mentioned earlier, the init program runs programs similar to getty for networked
    connections. For example, sshd, telnetd, and rlogind answer connection requests
    via ssh, telnet, and rlogin, respectively. Instead of being tied directly to a
    specific, physical terminal or modem line, these programs connect users’ shells
    to pseudo-ttys. You can see this whether you’re logged in to your system over
    a network, on an X Windows screen, or through a networked terminal connection
    program with the who command:


    ```

    ```text

    $ who

    phw       pts/0    Jul 20 17:37        Logged in with nlogin

    $

    ```

    ```


    # Typing Commands to the Shell


    When the shell starts up, it displays a command prompt—typically a dollar sign
    $—at your terminal and then waits for you to type in a command (Figure 2.6, Steps
    1 and 2). Each time you type in a command and press the Enter key (Step 3), the
    shell analyzes what you typed and proceeds to carry out your request (Step 4).


    If you ask the shell to invoke a particular program, it searches the disk, stepping
    through all the directories you’ve specified in your PATH until it finds the named
    program. When the program is found, the shell creates a clone of itself (known
    as a subshell) and asks the kernel to replace the subshell with the specified
    program; then the login shell “goes to sleep” until the program has finished (Step
    5). The kernel copies the specified program into memory and begins its execution.
    This copied program is called a process; in this way, the distinction is made
    between a program that is kept in a file on the disk and a process that is in
    memory and being executed, line by line.


    If the program writes output to standard output, that output will appear at your
    terminal unless redirected or piped into another command. Similarly, if the program
    reads input from standard input, it will wait for you to type in that input unless
    redirected from a file or piped from another command (Step 6).


    When the command finishes execution, it vanishes and control once again returns
    to the login shell, which prompts for your next command (Steps 7 and 8).


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_62_0.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Note that this cycle continues as long as you’re logged in. When you log off
    the system, execution of the shell then terminates and the system starts up a
    new `getty` (or `rlogin`, and so on) and waits for someone else to log in. This
    cycle is illustrated in Figure 2.7.


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_63_0.png)


    It’s important to recognize that the shell is just a program. It has no special
    privileges on the system, meaning that anyone with sufficient expertise and enthusiasm
    can create their own shell. That’s why so many different versions or “flavors”
    of the shell exist today, including the older Bourne shell, developed by Stephen
    Bourne; the Korn shell, developed by David Korn; the “Bourne again shell,” mainly
    used on Linux systems; and the C shell, developed by Bill Joy. They were all designed
    to serve specific purposes and have their own unique capabilities and personalities.


    # ## The Shell’s Responsibilities


    Now you know that the shell analyzes (to use proper computer parlance, it *parses*)
    each line you type in and initiates execution of the selected program. It’s during
    the parsing phase that filename expansion special characters like `*` are expanded,
    as discussed in the previous chapter.


    The shell also has other responsibilities, as outlined in Figure 2.8.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/29b87b4d3daf7eb41fe5066130730f4c_64_0.png)


    Figure 2.8   The shell’s responsibilities


    # Program Execution


    The shell is responsible for the execution of all programs that you request from
    your terminal.


    Each time you type in a line to the shell, the shell analyzes the line and then
    determines what to do. As far as the shell is concerned, each line follows the
    same basic format:


    ```

    `program-name arguments`

    ```


    The line that is typed to the shell is known more formally as the command line.
    The shell scans this command line and determines the name of the program to be
    executed and what arguments to pass to the program.


    The shell uses special characters to determine where the program name starts and
    ends, and where each argument starts and ends. These characters are collectively
    called whitespace characters, and are the space character, the horizontal tab
    character, and the end-of-line character, known more formally as the newline character.
    Multiple occurrences of whitespace characters are ignored by the shell. When you
    type the command


    ```

    `mv    tmp/mazewars games`

    ```'
  merge: -1
