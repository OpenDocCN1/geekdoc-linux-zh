- pgno: 282
  md: "The shell fed every line typed into the shell as the standard input stream\
    \ of `wc` until it encountered the line containing just `EOF` followed by RETURN.\n\
    \nIn-line input redirection—also referred to as *here documents* by some programmers—is\
    \ a powerful feature when used inside shell programs. It lets you specify the\
    \ standard input to a command directly in the program, thus obviating the need\
    \ to write it into a separate file, or to use `echo` to get it into the standard\
    \ input of the command.\n\nHere’s a common example of how this feature is used\
    \ within a shell program:\n\n```\n```shell\n$ cat mailmsg\nmail $* <<END-OF-DATA\n\
    \nAttention:\n\nOur monthly computer users group meeting\nwill take place on Friday,\
    \ March 4, 2016 at\n8pm in room 1A-08. Please try to attend.\n\nEND-OF-DATA\n\
    $\n```\n```\n\nTo send this message to all members of the group as stored in the\
    \ file `users_list`, you could invoke\n\n```\n```shell\nmailmsg $(cat users_list)\n\
    ```\n```\n\nThe shell performs parameter substitution for the redirected input\
    \ data, executes back-quoted commands, and recognizes the backslash character.\n\
    \nSpecial characters within a *here document* are generally ignored, but if you\
    \ include dollar signs, back quotes, or backslashes in these lines, they can be\
    \ interpreted. To have them ignored, precede them with a backslash character.\
    \ Alternatively, if you want the shell to leave all input lines completely untouched,\
    \ precede the end of document word that follows the `<<` with a backslash.\n\n\
    Let’s highlight the difference between the two:\n\n```\n```shell\n$ cat <<FOOBAR\n\
    > $HOME\n> *****\n>       \\$foobar\n> `date`\n> FOOBAR                      \
    \   Terminates the input\n/usr/steve\n^^^^^^^\n       $foobar\nWed Oct  2 15:23:15\
    \ EDT 2002\n$\n```\n```"
  merge: -1
  img_proc: true
- pgno: 283
  md: 'Since the shell supplies all the lines up to FOOBAR as the input to `cat` it
    substitutes the value for `$HOME` but not for `foobar` because the latter is prefaced
    with a backslash. The `date` command is also executed because back quotes are
    interpreted by the shell.


    To side-step all the issues with the shell interpreting the contents of the lines,
    use backslash on the *end-of-document* word instead:


    ```

    ```text

    $ cat <<\\FOOBAR

    > \\\\\\\\

    > `date`

    > $HOME

    > FOOBAR

    \\\\

    `date`

    $HOME

    $

    ```

    ```


    Use care when selecting the word that follows the `<<`. Generally, just make sure
    that it’s weird enough so that the chances of it accidentally appearing in the
    subsequent lines of data are minuscule.


    You now know about the `<<\` sequence, but there’s another one that most modern
    shells understand: If the first character that follows the `<<` is a dash (`-`),
    any leading tab characters in the input will be removed by the shell. This is
    useful for visually indenting the redirected text for readability while still
    having it output appear in normal left-aligned form:


    ```

    ```text

    $ cat <<-END

    >             Indented lines

    >             because tabs are cool

    > END

    Indented lines

    because tabs are cool

    $

    ```

    ```


    # Shell Archives


    One of the best uses of the in-line input redirection feature is for creating
    shell *archive* files. With this technique, one or more related shell programs
    can be put into a single file and then sent to someone else using the standard
    Unix `mail` commands. When the archive is received, it can be “unpacked” by invoking
    it as a shell program.


    For example, here’s an archived version of the lu, add, and rem programs used
    by rolo:


    ```

    ```text

    $ cat rolousb

    #

    # Archived programs used by rolo.

    #


    echo Extracting lu

    ```

    ```'
