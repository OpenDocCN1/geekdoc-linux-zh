    # Command Substitution


    *Command substitution* refers to the shell’s capability to replace a specified
    command with the output of that command at any point in a command line. There
    are two ways in the shell to perform command substitution: by enclosing the command
    in back quotes or surrounding it with the `$(...)` construct.


    # The Back Quote


    The back quote—often called “back tick”—is unlike any of the previously encountered
    types of quotes because its purpose is not to protect characters from the shell
    but to tell the shell to replace the enclosed command with its output. The general
    format for using back quotes is


    ```

    `command`

    ```


    where *command* is the name of the command to be executed and whose output is
    to be inserted at that point.


    > > **Note**

    > >

    > > Using the back quote for command substitution is no longer the preferred method;
    however, we cover it here because of the large number of older shell scripts that
    still use this construct. You should also know about back quotes in case you ever
    need to write shell programs that are portable to older Unix systems with shells
    that don’t support the newer, preferred `$(...)` construct.


    Here is an example:


    ```

    $ echo The date and time is: `date`

    The date and time is: Wed Aug 28 14:28:43 EDT 2002

    $

    ```


    When the shell does its initial scan of the command line, it recognizes the back
    quote and expects a command to follow. In this case, the shell finds the date
    command so it executes date and replaces the `date` sequence on the command line
    with the output from date. After that, the shell divides the resultant command
    line into arguments in the normal manner and then hands them all off to the echo
    command.


    ```

    $ echo Your current working directory is `pwd`

    Your current working directory is /user/steve/shell/ch6

    $

    ```'
