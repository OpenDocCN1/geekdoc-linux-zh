- pgno: 228
  md: '# Your Environment


    When you log on to your system, whether it’s a shiny new Mac OS X Terminal app,
    a clean Linux install, or a Unix server in the back office, you’re effectively
    given your own copy of the shell program. This login shell maintains what’s known
    as your *environment*—a configuration that is distinct from other users on the
    system. This environment is maintained from the moment you log on until the moment
    you log off. In this chapter you’ll learn about the shell environment and you’ll
    see how it relates to writing and running programs.


    # Local Variables


    Type the following program called `vartest` into your computer:


    ```

    ```sh

    $ cat vartest

    echo $x:

    $

    ```

    ```


    `vartest` consists of a single echo command that displays the value of the variable
    x surrounded by colons.


    Assign any value you want to the variable x from your terminal:


    ```

    ```sh

    $ x=100

    ```

    ```


    Question: What do you think will be displayed when vartest is now executed? Answer:


    ```

    ```sh

    $ vartest

    ::

    $

    ```

    ```


    `vartest` doesn’t know about the value of x. Therefore, its value is the default:
    null. The variable x that was assigned the value 100 in the login shell is known
    as a *local variable*. The reason why it has this name will become clear shortly.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Here’s another example called `vartest2`:


    ```

    ```sh

    $ cat vartest2

    x=50

    echo :$x:

    $ x=100

    $ vartest2

    :50:

    $

    ```

    ```


    Since the script changed the value of x from 100 to 50, the question is: What’s
    the value of x after the script completes?


    ```

    ```sh

    $ echo $x

    100

    $

    ```

    ```


    You can see that `vartest2` didn’t change the value of x, previously set to 100
    in the interactive shell.


    # Subshells


    The seemingly weird behavior exhibited by `vartest` and `vartest2` is due to the
    fact that these programs are run within *subshells* by your login shell. A subshell
    is essentially an entirely new shell just to run the desired program.


    When you ask the login shell to execute `vartest`, it starts up a new shell to
    execute the program. Whenever a new shell runs, it runs in its own environment,
    with its own set of local variables. A subshell has no knowledge of local variables
    that were assigned values by the login shell (the *parent* shell). Furthermore,
    a subshell cannot change the value of a variable in the parent shell, as evidenced
    by `vartest2`.


    Let’s review the process that goes on here so you can better understand what’s
    called the *scoping* of variables in shell programs: Before executing `vartest2`,
    your shell has a variable called x that has been assigned the value 100. This
    is depicted in Figure 10.1.


