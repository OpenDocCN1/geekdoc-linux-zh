  md: "# Deleting Lines\n\nTo delete lines of text, use the d command. By specifying\
    \ a line number or range of numbers, you can delete specific lines from the input.\
    \ In the following example, sed is used to delete the first two lines of text\
    \ from intro:\n\n```\n```text\n$ sed '1,2d' intro        Delete lines 1 and 2\n\
    in the late 1960s. One of the primary goals in\n the design of the UNIX system\
    \ was to create an\nenvironment that promoted efficient program\ndevelopment.\n\
    $\n```\n```\n\nRemembering that by default sed writes all lines of the input to\
    \ standard output, the remaining lines in text—that is, lines 3 through the end—simply\
    \ get written to standard output.\n\nBy preceding the d command with a pattern,\
    \ you can used sed to delete all lines that contain that text. In the following\
    \ example, sed is used to delete all lines of text containing the word UNIX:\n\
    \n```\n```text\n$ sed '/UNIX/d' intro        Delete all lines containing UNIX\n\
    Thompson and Dennis Ritchie at Bell Laboratories\nin the late 1960s. One of the\
    \ primary goals in the\nenvironment that promoted efficient program\ndevelopment.\n\
    $\n```\n```\n\nThe power and flexibility of sed goes far beyond what we’ve shown\
    \ here. sed has facilities that enable you to loop, build text in a buffer, and\
    \ combine many commands into a single editing script. Table 3.2 shows some more\
    \ examples of sed commands.\n\nTable 3.2  **sed Examples**\n\n| sed Command |\
    \ Description |\n|---|---|\n| `sed '5d'` | Delete line 5 |\n| `sed '/[Tt]est/d'`\
    \ | Delete all lines containing Test or test |\n| `sed -n '20,25p' text` | Print\
    \ only lines 20 through 25 from text |\n| `sed '1,10s/unix/UNIX/g' intro` | Change\
    \ unix to UNIX wherever it appears in the first 10 lines of intro |\n| `sed '/jan/s/-1/-5/'`\
    \ | Change the first -1 to -5 in all lines containing jan |\n| `sed 's/...//'\
    \ data` | Delete the first three characters from each line of data |\n| `sed 's/...$//'\
    \ data` | Delete the last 3 characters from each line of data |\n| `sed -n '1!p'\
    \ text` | Print all lines from text, showing non-printing characters as `\\n`\
    \ (where `\\n` is the octal value of the character), and tab characters as `\\\
    t` |"
