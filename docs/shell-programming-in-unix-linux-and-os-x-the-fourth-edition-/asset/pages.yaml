  md: "# The `exit` Command\n\n_General Format:_ `exit n`\n\nExecution of `exit` causes\
    \ the current shell program to be immediately terminated. The exit status of the\
    \ program is the value of the integer _n_, if supplied. If _n_ is not supplied,\
    \ the exit status is that of the last command executed prior to the exit.\n\n\
    An exit status of zero is used to indicate success, and non-zero to indicate failure\
