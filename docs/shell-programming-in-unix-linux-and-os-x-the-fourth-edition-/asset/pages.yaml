    # grep


    grep allows you to search one or more files for a pattern you specify. The general
    format of this command is


    ```

    grep pattern files

    ```


    Every line of each file that contains *pattern* is displayed at the terminal.
    If more than one file is specified to `grep`, each line is also preceded by the
    name of the file, thus enabling you to identify the particular file that the pattern
    was found in.


    Let’s say that you want to find every occurrence of the word shell in the file
    ed.cmd:


    ```

    $ grep shell ed.cmd

    files, and is independent of the shell.

    to the shell, just type in a q.

    $

    ```


    This output indicates that two lines in the file ed.cmd contain the word shell.'
