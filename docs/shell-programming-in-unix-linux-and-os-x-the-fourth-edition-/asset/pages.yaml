  md: '# The `set` Command


    *General Format: `set options args`*


    This command is used to turn on or off options as specified by *options*. It is
    also used to set positional parameters, as specified by *args*.


    Each single letter option in *options* is enabled if the option is preceded by
    a minus sign -, or disabled if preceded by a plus sign +. Options can be grouped,
    as in


    ```

    set -fx

    ```


    which enables the f and x options.


    Table A.9 summarizes the options that can be selected.


    **Table A.9 — `set` Options**


    | Meaning | Option |

    |---|---|

    | `--` | Don’t treat subsequent *args* preceded by a - as options. If there are
    no arguments, the positional parameters are unset. |

    | `-a` | Automatically export all variables that are subsequently defined or modified.
    |

    | `-b` | If supported by the implementation, causes the shell to notify you when
    background jobs finish. |

    | `-c` | Don’t allow output redirection to overwrite existing files. `>|` can
    still be used to force individual files to be overwritten even if this option
    is selected. |

    | `-e` | Exit if any command that gets executed fails or has a nonzero exit status.
    |

    | `-f` | Disable filename generation. |

    | `-h` | Add commands inside functions to the hash list as they are defined, and
    not as they are executed. |

    | `-m` | Turn on the job monitor. |

    | `-n` | Read commands without executing them (useful for checking for balanced
    `do...dones`, and if `... fis`). |

    | `+o` | Write current option mode settings in command format. |

    | `-o m` | Turn on option mode *m* (see Table A.10). |

    | `-u` | Issue an error if a variable is referenced without having been assigned
    a value or if a positional parameter is referenced without having been set. |

    | `-v` | Print each shell command line as it is read. |

    | `-x` | Print each command and its arguments as it is executed, preceded by a
    +. |'
  merge: -1
