  md: 'indicates it’s a substitution, the slashes delimit the old and new values,
    and g indicates it should be applied as many times as needed for each line, not
    just once per line.


    # Matching the Beginning of the Line: The Caret (^)


    When the caret character ^ is used as the first character in a regular expression,
    it matches the beginning of the line. So the regular expression


    ```

    ^George

    ```


    matches the characters George *only if they occur at the beginning of the line*.
    This is actually known as “left-rooting” in the regex world, for obvious reasons.


    Let’s have a look:


    ```

    $ ed intro

    248

    /the/

    >>in the late 1960s.  One of the primary goals in

    >>the design of the Unix system was to create an

    /^the/                         *Find the line that starts with the*

    the design of the Unix system was to create an

    1,$s/^/>>>/                    *Insert >> at the beginning of each line*

    1,$p

    >>The Unix operating system was pioneered by Ken

    >>Thompson and Dennis Ritchie at Bell Laboratories

    >>in the late 1960s.  One of the primary goals in

    >>the design of the Unix system was to create an

    >>environment that promoted efficient program

    >>development.

    ```


    The preceding example also shows how the regular expression ^ can be used to match
    the beginning of the line. Here it is used to insert the characters >> at the
    start of each line. A command like


    ```

    1,$s/^/    /

    ```


    is also commonly used to insert spaces at the start of each line (in this case
    four spaces would be inserted).


    # Matching the End of the Line: The Dollar Sign $


    Just as the ^ is used to match the beginning of the line, so the dollar sign $
    is used to match the end of the line. So the regular expression


    ```

    contents$

    ```


    matches the characters contents *only if they are the last characters on the line*.
    What do you think would be matched by the regular expression


    ```

    .$

    ```'
