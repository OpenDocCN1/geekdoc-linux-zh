    \ destination file is a directory, the program changes the variable `to` to more\
    \ precisely identify the destination filename by including the directory name:\
    \ `$to/$(basename $from)`. This ensures that the subsequent test for the existence\
    \ of the ordinary file `$to` will be done on the file in the directory, not on\
    \ the directory itself.\n\nThe basename command gives the basename of its argument\
    \ with all directory components stripped away (for example, `/usr/bin/troff` produces\
    \ `troff`; basename `troff` also produces `troff`). This extra step ensures that\
    \ the copy is made from and to the correct place. (As an example, if `mycp /tmp/data\
    \ bin` is typed, where `bin` is a directory, you want to copy `/tmp/data` into\
    \ `bin/data` and not into `bin/tmp/data`.)\n\nHere’s some sample output. Note\
