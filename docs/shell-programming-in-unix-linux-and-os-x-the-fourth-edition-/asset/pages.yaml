- pgno: 295
  md: "```\n4) echo \"Enter name to change: \\c\"\n   read name\n   if [ -z \"$name\"\
    \ ]; then\n      echo \"Change ignored\"\n   else\n\n      change \"$name\"\n\n\
    \   fi;;\n5) listall;;\n6) exit 0;;\n*) echo \"Bad choice\\a\";;\nesac\ndone\n\
    ```\n\nOne improvement appears in the very beginning of the new code: Instead\
    \ of requiring that the user already have a phone book file in their home directory,\
    \ the program checks to see whether the variable PHONEBOOK has been set. If it\
    \ has, it’s assumed that it contains the name of the phone book file. If it hasn’t,\
    \ it’s set to $HOME/phonebook as the default.\n\nThe program then checks to see\
    \ whether the actual file exists, and if it doesn’t, asks the user whether they\
    \ would like to have it created. This greatly improves that first use experience,\
    \ as you can imagine.\n\nThis version of rolo also has a couple of new choices\
    \ on the menu too. Because individual entries can be rather long, an edit option\
    \ now allows the user to update a particular entry. Prior to this, of course,\
    \ the only way to change an entry was to remove it, then add a completely new\
    \ entry.\n\nAnother option lists the entire phone book. With this option, just\
    \ the first and last lines (fields) of each entry are displayed. This assumes\
    \ that the user follows some convention such as putting the name on the first\
    \ line and the number on the last.\n\nThe entire menu selection code block is\
    \ also now inside a while loop so that rolo will continue to display menus until\
    \ the user chooses to exit the program.\n\nAs per our discussion last chapter,\
    \ notice that a trap command is executed before the loop is entered. This trap\
    \ specifies that a continue command is to be executed if an interrupt (SIGINT)\
    \ is generated by the user. If the user presses Ctrl-C in the middle of an operation\
    \ (such as listing the entire phone book), the program will stop the current operation\
    \ and redisplay the main menu.\n\nBecause entries can now span as many lines as\
    \ desired, the action performed when add is selected has been changed too. Instead\
    \ of asking for the name and number, rolo invokes the add program to get the entry\
    \ and lets the function take care of prompting the user and figuring out when\
    \ the data input is done.\n\nFor the lookup, change, and remove options, a check\
    \ is now made to ensure that the user doesn’t end a null value by pressing the\
    \ Enter key when asked to type in the name. This avoids the regular expression\
    \ error that grep would otherwise issue if given a null first argument."
