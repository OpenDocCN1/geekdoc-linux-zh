- pgno: 289
  md: "Functions execute faster than an equivalent shell program because the shell\
    \ doesn’t have to search the disk for the program, open the file, and read its\
    \ contents into memory; it can just jump right into executing the individual commands\
    \ directly.\n\nAnother advantage of functions is the capability to group related\
    \ shell programs in a single file. For example, the add, lu, and rem programs\
    \ from Chapter 10 can now be defined as individual functions within the rolo program\
    \ file. The template for such an approach is shown:\n\n```\n```sh\n$ cat rolo\n\
    #\n# rolo program written in function form\n#\n#\n# Function to add someone to\
    \ the phonebook file\n#\nadd () {\n        # put commands from add program here\n\
    }\n\n#\n# Function to look someone up in the phone book\n#\n\nlu () {\n      \
    \  # put commands from lu program here\n}\n\n#\n# Function to remove someone from\
    \ the phone book\n#\n\nrem () {\n        # put commands from rem program here\n\
    }\n\n#\n# rolo - rolodex program to look up, add, and\n#       remove people from\
    \ the phone book\n#\n\n# put commands from rolo here\n$ \n```\n```\n\nNone of\
    \ the commands inside the original add, lu, rem, or rolo programs would have to\
    \ be changed. The first three are turned into functions by including them inside\
    \ rolo, sandwiched"
  merge: -1
  img_proc: true
- pgno: 290
  md: 'between the function header and the closing curly brace. Defining them as functions
    would, however, make them inaccessible as standalone commands.


    # Removing a Function Definition


    To remove the definition of a function from the shell, use the `unset` command
    with the `-f` option. Look familiar? It is the same command you use to remove
    the definition of a variable from the shell.


    ```

    ```text

    $ unset -f nu

    $ nu

    sh: nu: not found

    $

    ```

    ```


    # The `return` Command


    If you use `exit` from inside a function, its effect is not only to terminate
    execution of the function but also of the shell program that called the function.
    It exits all the way back to the command line. If you instead want to just exit
    the function, use the `return` command, whose format is


    return *n*


    The value *n* is used as the return status of the function. If omitted, the status
    is that of the last command executed. This is also what gets returned if you don’t
    include a `return` statement in your function. The return status is in all other
    ways equivalent to the exit status: you can access its value through the shell
    variable `$?`, and you can test it in `if`, `while`, and `until` commands.


    # The `type` Command


    When you type in the name of a command to execute, it’s useful to know whether
    the command is a function, a shell built-in function, a standard Unix command
    or even a shell alias. This is where the `type` command comes in handy. The `type`
    command takes one or more command names as its argument and tells you what it
    knows about it. Here are some examples:


    ```

    ```text

    $ nu () { who | wc -l; }

    $ type pwd

    pwd is a shell builtin

    $ type ls

    ls is aliased to `/bin/ls -F''

    $ type cat

    cat is /bin/cat

    $ type nu

    nu is a function

    $

    ```

    ```'
