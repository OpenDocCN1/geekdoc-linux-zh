- pgno: 245
  md: '# CDPATH


    The `CDPATH` variable works like the `PATH` variable: it specifies a list of directories
    to be searched by the shell whenever you execute a `cd` command. This search is
    done only if the specified directory is not given by a full pathname and if `CDPATH`
    is not null. If you type in


    ```

    cd /users/steve

    ```


    the shell changes your directory directly to `/users/steve`; but if you type


    ```

    cd memos

    ```


    the shell looks at your `CDPATH` variable to find the memos directory. And if
    your `CDPATH` looks like this:


    ```

    $ echo $CDPATH

    .:/users/steve:/users/steve/docs

    $

    ```


    the shell first looks in your current directory for a memos directory, and if
    not found then looks in `/users/steve` for a memos directory, and if not found
    there tries `/users/steve/docs` in a last ditch effort to find the directory.
    If the directory that it finds is not relative to your current one, the `cd` command
    prints the full path to the directory to let you know where it’s taking you:


    ```

    $ cd /users/steve

    $ cd memos

    /users/steve/docs/memos

    $ cd bin

    /users/steve/bin

    $ pwd

    /users/steve/bin

    $

    ```


    Like the `PATH` variable, use of the period for specifying the current directory
    is optional, so


    ```

    :/users/steve:/users/steve/docs

    ```


    is equivalent to


    ```

    .:/users/steve:/users/steve/docs

    ```


    Judicious use of the `CDPATH` variable can save you a lot of typing, especially
    if your directory hierarchy is fairly deep and you now find yourself frequently
    moving around in it (or if you’re frequently moving into other directory hierarchies
    as well).


    Unlike `PATH`, you’ll probably want to put your current directory first in the
    `CDPATH` list. This gives you the most natural use of `CDPATH`; if the current
    directory isn’t listed first, you may end up in an unexpected directory!


    Oh, and one more thing: `CDPATH` isn’t set when you log in; you need to explicitly
    set it to the sequences of directories you’d like the shell to use when searching
    for the specified name.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# More on Subshells


    You know that a subshell can’t change the value of a variable in a parent shell,
    nor can it change its current directory. Suppose that you want to write a program
    to set values for some variables that you like to use whenever you log on. For
    example, assume that you have the following file called vars:


    ```

    ```sh

    $ cat vars

    BOOK=/users/steve/book

    VUPUB=/user/spot1/uucppublic

    DOCS=/usr/steve/docs/memos

    DB=/usr2/data

    $

    ```

    ```


    If you invoke vars, the values assigned to these variables will essentially vanish
    after the program has finished executing because vars is run in a subshell:


    ```

    ```sh

    $ vars

    $ echo $BOOK


    $

    ```

    ```


    No surprise there.


    # The . Command


    To address this dilemma, there’s a built-in shell command called . (pronounced
    “dot”) whose general format is


    ```

    ```sh

    . file

    ```

    ```


    and whose purpose is to execute the contents of file in the current shell. That
    is, commands from file are executed by the current shell just as if they were
    typed, not within a subshell. The shell uses your PATH variable to find file,
    just like it does when executing other programs.


    ```

    ```sh

    $ . vars        # Execute vars in the current shell

    $ echo $BOOK    # Hoorah!

    /users/steve/book

    $

    ```

    ```


    Because a subshell isn’t spawned to execute the program, any variable that gets
    assigned a value is retained even after the program completes.


    If you have a program called db that has the following commands:


    ```

    ```sh

    $ cat db

    DATA=/usr2/data

    RPTS=$DATA/rpts

    BIN=$DATA/bin


    cd $DATA

    $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'executing db with the “dot” command will do something interesting:


    ```

    ```sh

    $ pwd

    /users/steve

    $ . db

    $

    ```

    ```


    This time the shell program defines the three variables DATA, RPTS, and BIN in
    the current shell and moves to the $DATA directory.


    ```

    ```sh

    $ pwd

    /usr2/data

    $

    ```

    ```


    If you work on multiple projects, you can create programs like db to customize
    your environment as needed. In that program, you can also include definitions
    for other variables, change prompts, and more. For example, you might want to
    change your PS1 prompt to DB—to let you know that your database variables have
    been set up. You could change your PATH to include a directory that has programs
    related to the database and your CDPATH so that the related directories will be
    easily accessed with the cd command.


    On the other hand, if you make these sorts of changes, you might want to execute
    db in a subshell rather than the current shell because doing the latter leaves
    all the modified variables around after you’ve finished your work.


    The best solution is to start a new shell from inside the subshell, with all the
    modified variables and updated environment settings. Then, when you’re finished
    working, you can “log out” the new shell by pressing `Ctrl+d`.


    Let’s take a look at how this works with a new version of db:


    ```

    ```sh

    $ cat db

    #

    # Set up and export variables related to the data base

    #


    HOME=/usr2/data

    BIN=$HOME/bin

    RPTS=$HOME/rpts

    DATA=$HOME/rawdata


    PATH=$PATH:$BIN

    CDPATH=$HOME:$RPTS


    PS1="DB: "


    export HOME BIN RPTS DATA PATH CDPATH PS1


    #

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 248
  md: '```

    ```sh

    # Start up a new shell

    #


    /bin/sh

    $

    ```

    ```


    The HOME directory is set to `/usr2/data`, and then the variables BIN, RPTS, and
    DATA are defined relative to this HOME (a good idea in case you ever have to move
    the directory structure somewhere else: all you’d have to change in the program
    is the variable HOME).


    Next, PATH is modified to include the database bin directory and the CDPATH variable
    is set to search the current directory, the HOME directory, and the RPTS directory
    (which presumably contains subdirectories).


    After exporting these variables, the standard shell, `/bin/sh`, is invoked. From
    that point on, this new shell processes any user-entered commands until either
    the user types `exit` or uses the `Ctrl-d` sequence. Upon exit, control returns
    to db, which in turn returns control to your login shell.


    ```

    ```text

    $ db

    DB: echo $HOME

    /usr2/data

    DB: cd rpts

    /usr2/data/rpts

    DB: ps

    PID TTY TIME COMMAND

    123 13 0:40 sh

    761 13 0:01 sh

    765 13 0:01 sh

    769 13 0:03 ps

    DB: exit

    $ echo $HOME

    /usr/etc/steve

    $

    ```

    ```


    *Run it*


    *Try out CDPATH*


    *It works*


    *See what processes are running*


    *Your login shell*


    *Subshell running db*


    *New shell run from db*


    *Done for now*


    *Back to normal*


    The execution of db is depicted in Figure 10.7 (where we’ve shown only the exported
    variables of interest for simplicity’s sake, not all that exist in the environment).'
