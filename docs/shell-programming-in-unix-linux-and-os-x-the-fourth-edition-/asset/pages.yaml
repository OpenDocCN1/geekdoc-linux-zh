- pgno: 345
  md: '# # Command Re-entry


    The shell keeps a history list of recently entered commands. The number of commands
    available is determined by the `HISTSIZE` variable (default is typically 128),
    and the file in which the history is kept is determined by the `HISTFILE` variable
    (default is `$HOME/.sh_history`). Because the command history is stored in a file,
    these commands are available after you log off and back on.


    There are three ways you can access the command history.


    # ## The `fc` Command


    The built-in command `fc` allows you to run an editor on one or more commands
    in the command history. When the edited command is written and you leave the editor,
    the edited version of the command is then executed. The editor is determined by
    the `FCEDIT` variable (default ed). The `-e` option may be used with `fc` to specify
    the editor rather than `FCEDIT`.


    The `-s` option causes commands to be executed without first invoking an editor.
    A simple editing capability is built in to the `fc -s` command; an argument of
    the form


    `old=new`


    may be used to change the first occurrence of the string *old* to the string *new*
