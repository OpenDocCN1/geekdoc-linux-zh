  md: "The first while loop executes until end of file or 4096 lines have been read\
    \ (4096 is a Korn shell buffer limit for arrays).\n\nAnother example: The `cdh`\
    \ function defined below changes the current directory but also uses an array\
    \ to keep a history of previous directories. It allows the user to list the directory\
    \ history and move back to any directory in the list:\n\n```\n```sh\n$ cat cdh\n\
    CDHIST[0]=$PWD                         # initialize CDHIST[0]\n\ncdh ()\n{\n \
    \       typeset -i cdlen i\n        if [ $# -eq 0 ] ; then          # default\
    \ to HOME with no arguments\n                set -- $HOME\n        fi\n\n    \
    \    cdlen=${#CDHIST[*]}             # number of elements in CDHIST\n\n      \
    \  case \"$@\" in\n        -1)                             # print directory list\n\
    \                i=0\n                while ((i < cdlen))\n                do\n\
    \                        printf \"%3d %s\\n\" $i ${CDHIST[i]}\n              \
    \          ((i = i + 1))\n                done\n                return ;;\n  \
    \      -[0-9] | -[0-9][0-9] | -[0-9][0-9][0-9])\n                            \
    \            # cd to dir in list\n                i=${1#-}                # remove\
    \ leading '-'\n                cd ${CDHIST[i]} ;;\n        *)                \
    \              # cd to new dir\n                cd $@ ;;\n        esac\n\n   \
    \     CDHIST[cdlen]=$PWD\n}\n$ \n```\n```\n\nThe CDHIST array stores each directory\
    \ visited by `cdh`, and the first element, CDHIST[0], is initialized with the\
