- pgno: 292
  md: '# # Rolo Revisited


    This chapter presents the final, much improved version of the rolo program enhanced
    with additional options and also allows for more general types of entries (other
    than just names and numbers). The sections in this chapter discuss the individual
    components of rolo, starting with the main rolo program itself. At the end of
    the chapter, sample output is shown.


    # ## Data Formatting Considerations


    While the initial name-and-number rolo program shown earlier in the book is handy,
    there’s no question that a more useful program would allow more than just the
    names and numbers to be stored. You’d probably want to save addresses and email
    addresses too, for example. The new rolo program allows entries in the phone book
    to consist of multiple lines. A typical entry might be


    ```

    Steve''s Ice Cream

    444 6th Avenue

    New York City 10003

    212-555-3021

    ```


    To increase the flexibility of the program, an individual entry can now contain
    as many lines as desired. Another entry in the phone book might read


    ```

    YMCA

    (201) 555-2344

    ```


    To logically separate entries in the phone book file, each entry is “packed” into
    a single line by replacing the terminating newline characters in an entry with
    a different character. We arbitrarily chose the caret ^ as it appears very rarely
    in regular user input, addresses, etc. The only repercussion of this decision
    is that this character cannot be used as part of the entry itself.


    Using this technique, the first entry shown would be stored in the phone book
    file as


    ```

    Steve''s Ice Cream^444 6th Avenue^New York City 10003^212-555-3021^

    ```'
  merge: -1
  img_proc: true
- pgno: 293
  md: "and the second entry as\n\n`YMCA (201) 555-2344`\n\nIt now becomes quite easy\
    \ to work with entries when they’re stored in this format, a testament to how\
    \ really thinking through a problem and solution can reap great benefits as it’s\
    \ developed further.\n\n```\nrolo\n#\n# rolo - rolodex program to look up, add,\n\
    #        remove and change entries from the phone book\n#\n#\n# Set PHONEBOOK\
    \ to point to the phone book file\n# and export it so other progs know about it\n\
    # if it's set on entry, then leave it alone\n#\n: ${PHONEBOOK:=$HOME/phonebook}\n\
    export PHONEBOOK\nif [ ! -e \"$PHONEBOOK\" ] ; then\n        echo \"$PHONEBOOK\
    \ does not exist!\"\n        echo \"Should I create it for you (y/n)? \\c\"\n\
    \        read answer\n\n        if [ \"$answer\" != y ] ; then\n             \
    \   exit 1\n        fi\n\n        > $PHONEBOOK || exit 1       # exit if the creation\
    \ fails\nfi\n\n#\n#\n# If arguments are supplied, then do a lookup\n#\n\nif [\
    \ \"$#\" -ne 0 ] ; then\n        lu \"$@\"\n        exit\nfi\n\n#\n# Set trap\
    \ on interrupt (DELETE key) to continue the loop\n#\n```"
