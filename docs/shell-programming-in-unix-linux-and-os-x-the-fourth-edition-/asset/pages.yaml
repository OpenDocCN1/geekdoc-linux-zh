- pgno: 128
  md: '# The Double Quote


    Double quotes work similarly to single quotes, except they’re less protective
    of their content: single quotes tell the shell to ignore all enclosed characters,
    double quotes say to ignore most. In particular, the following three characters
    are not ignored inside double quotes:


    +   - Dollar signs

    +   - Back quotes

    +   - Backslashes


    The fact that dollar signs are not ignored means that variable name substitution
    is done by the shell inside double quotes.


    ```

    ```shell

    $ filelist=*

    $ echo $filelist

    addresses intro lotsospaces names nu numbers phonebook stat

    $ echo ''$filelist''

    $filelist

    $ echo "$filelist"

    *

    $

    ```

    ```


    Here you see the major difference between no quotes, single quotes, and double
    quotes. In the first instance, the shell sees the asterisk and substitutes all
    the filenames from the current directory. In the second case, the shell leaves
    the characters enclosed within the single quotes completely alone, which results
    in the display of $filelist. In the final case, the double quotes indicate to
    the shell that variable name substitution is still to be performed inside the
    quotes. So the shell substitutes * for $filelist. But because filename substitution
    is not done inside double quotes, * is then safely passed to echo as the value
    to be displayed.


    > > **Note**

    > >

    > > While we’re talking about single versus double quotes, you should also be
    aware that the shell has no idea what “smart quotes” are. Those are generated
    by word processors like Microsoft Word and curl “inward” towards the material
    they surround, making it much more attractive when printed. The problem is, that’ll
    break your shell scripts, so be alert!


    If you want to have the value of a variable substituted, but don’t want the shell
    to then parse the substituted characters specially, enclose the variable inside
    double quotes.


    Here’s another example illustrating the difference between double quotes and no
    quotes:


    ```

    ```shell

    $ address="39 East 12th Street

    > New York, N. Y. 10003"

    $ echo $address

    39 East 12th Street New York, N. Y. 10003

    $ echo "$address"

    39 East 12th Street

    New York, N. Y. 10003

    $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Note that in this particular example, it makes no difference whether the value
    assigned to `address` is enclosed in single quotes or double quotes. The shell
    displays the secondary command prompt in either case to indicate it’s waiting
    for the corresponding close quote.


    After assigning the two-line address to `address`, the value of the variable is
    displayed by `echo`. Without the variable being quoted the address is displayed
    on a single line. The reason is the same as what caused


    ```

    echo one        two      three    four

