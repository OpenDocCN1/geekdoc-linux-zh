    # Other Ways to Access Your History


    There are several other ways to access your command history that are worth noting
    if you don’t find that either the vi or emacs line edit modes work for you.


    # The `history` Command


    The easiest way to access your command history is actually to just type in the
    command `history`:


    ```

    ```shell

    $ history

    507   cd shell

    508   cd ch15

    509   vi int

    510   ps

    511   echo $HISTSIZE

    512   cat $ENV

    513   cp int int.sv

    514   history

    515   exit

    516   cd shell

    517   cd ch16

    518   vi all

    519   run -n5 all

    520   ps

    521   lpr all.out

    522   history

    ```

    ```


    The numbers to the left are relative command numbers (command number 1 would be
    the first, or oldest, command in your history).


    Be aware that the history command differs between the Korn and Bash shells: The
    Korn shell history command writes your last 16 commands to standard output while
    Bash will list your entire command history, even if it’s 500 or 1000 lines long.'
