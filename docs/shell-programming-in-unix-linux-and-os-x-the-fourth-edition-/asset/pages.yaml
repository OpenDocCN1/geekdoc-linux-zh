- pgno: 156
  md: 'Other operators can be used to test character strings. There are a number of
    them, as summarized in Table 7.1.


    Table 7.1  test String Operators


    | Operator | Returns TRUE (exit status of 0) if |

    |---|---|

    | `string₁ = string₂` | `string₁` is identical to `string₂` |

    | `string₁ != string₂` | `string₁` is not identical to `string₂` |

    | `string` | `string` is not null |

    | `-n string` | `string` is not null (and string must be seen by test) |

    | `-z string` | `string` is null (and string must be seen by test) |


    You’ve seen how the = operator is used. The != operator is similar, except it
    tests two strings for inequality. That is, the exit status from test is zero if
    the two strings are not equal, and nonzero if they are.


    Let’s look at three similar examples.


    ```

    ```sh

    $ day="monday"

    $ test "$day" = monday

    $ echo $?

    0                         True

    $

    ```

    ```


    The test command returns an exit status of 0 because the value of day is equal
    to the characters monday. Now look at the following:


    ```

    ```sh

    $ day="monday"

    $ test "$day" = monday

    $ echo $?

    1                         False

    $

    ```

    ```


    Here we assigned the characters monday—including the space character that immediately
    followed—to day. Therefore, when the previous test was made, test returned FALSE
    because the characters "monday" were not identical to the characters "monday ".


    If you wanted these two values to be considered equal, omitting the double quotes
    around the variable reference would have caused the shell to “eat up” the trailing
    space character, and test would have never seen it:


    ```

    ```sh

    $ day="monday"

    $ test $day = monday

    $ echo $?

    0                         True

    $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Although this seems to violate our rule about always quoting shell variables
    that are arguments to test, it’s okay to omit the quotes if you’re sure that the
    variable is not null (and not composed entirely of whitespace characters).


    You can test to see whether a shell variable has a null value with the third operator
    listed in Table 7.1:


    ```

    ```sh

    test "$day"

    ```

    ```


    This returns TRUE if day is not null and FALSE if it is. Quotes are not necessary
    here because test doesn’t care whether it sees an argument in this case. Nevertheless,
    you are better off using them here as well because if the variable consists entirely
    of whitespace characters, the shell will get rid of the argument if it’s not enclosed
    in quotes.


    ```

    ```sh

    $ blanks="     "                 Is it not null?

    $ test $blanks

    $ echo $?

    1                              False—it’s null

    $ test "$blanks"                And now?

    $ echo $?

    0                              True—it’s not null

    $

    ```

    ```


    In the first case, test was not passed any arguments because the shell ate up
    the four spaces in blanks. In the second case, test got one argument consisting
    of four space characters which is not null.


    In case we seem to be belaboring the point about blanks and quotes, realize that
    this is a frequent source of shell programming errors. It’s good to really understand
    the principles here to save yourself a lot of programming headaches in the future.


    There is another way to test whether a string is null, and that’s with either
    of the last two operators listed previously in Table 7.1. The -n operator returns
    an exit status of zero if the argument that follows is not null. Think of this
    operator as testing for nonzero length.


    The -z operator tests the argument that follows to see whether it is null and
    returns an exit status of zero if it is. Think of this operator as testing to
    see whether the following argument has zero length.


    So the command


    ```

    ```sh

    test -n "$day"

    ```

    ```


    returns an exit status of 0 if day contains at least one character. The command


    ```

    ```sh

    test -z "$dataflag"

    ```

    ```


    returns an exit status of 0 if dataflag doesn’t contain any characters. That is,
    -n and -z are the opposite of each other, and both exist just to make it easier
    to write clear, readable conditional statements.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Be warned that both of the preceding operators expect an argument to follow,
    so get into the habit of enclosing the argument within double quotes.


    ```

    $ nullvar=

    $ nonnullvar=abc

    $ test -n "$nullvar"    Does nullvar have nonzero length?

    $ echo $?

    1    No

    $ test -n "$nonnullvar"  And what about nonnullvar?

    $ echo $?

    0    Yes

    $ test -z "$nullvar"    Does nullvar have zero length?

    $ echo $?

    0    Yes

    $ test -z "$nonnullvar"  And nonnullvar?

    $ echo $?

    1    No

    $

    ```


    Note that test can also be picky about its arguments. For example, if the shell
    variable symbol contains an equals sign, look at what happens if you try to test
    it for zero length:


    ```

    $ echo $symbol

    =

    $ test -z "$symbol"

    sh: test: argument expected

    $

    ```


    The = operator has higher precedence than the -z operator, so test attempts to
    process the command as an equality test, and expects an argument to follow the
    =. To avoid this sort of problem, many shell programmers write their test commands
    as


    ```

    test X"$symbol" = X

    ```


    which will be true if symbol is null, and false if it’s not. The x in front of
    symbol prevents test from interpreting the characters stored in symbol as an operator.


    # An Alternative Format for test


    The test command is used so often by shell programmers that an alternative format
    of the command is available and can make your programs a lot neater: [ . This
    format improves the readability of if statements and other conditional tests throughout
    your shell scripts.


    You’ll recall that the general format of the test command is


    ```

    test expression

    ```


    This can also be expressed in the alternative format as


    ```

    [ expression ]

    ```'
  merge: -1
  img_proc: true
- pgno: 159
  md: "The `[` is actually the name of the command (who said anything about command\
    \ names having to be alphanumeric characters?). It still initiates execution of\
    \ the same test command, but when used this way it also expects to see a closing\
    \ `]` at the end of the expression. Spaces must appear after the `[` and before\
    \ the `]`.\n\nYou can rewrite the `test` command shown in a previous example with\
    \ this alternative format as shown:\n\n```\n```sh\n$ [ -z \"$nonnullvar\" ]\n\
    $ echo $?\n1\n$\n```\n```\n\nWhen used in an `if` command, the alternative format\
    \ looks like this:\n\n```\n```sh\nif [ \"$name\" = julio ]\nthen\n        echo\
    \ \"Would you like to play a game?\"\nfi\n```\n```\n\nWhich format of the `if`\
    \ command you use is up to you; we prefer the `[...]` format, which coaxes shell\
    \ programming into a syntax much more similar to other popular programming languages,\
    \ so that’s what we’ll use throughout the remainder of the book.\n\n# Integer\
    \ Operators\n\n`test` has a large assortment of operators for performing integer\
    \ comparisons. Table 7.2 summarizes these operators.\n\nTable 7.2 — `test` **Integer\
    \ Operators**\n\n| Operator | Returns TRUE (exit status of 0) if |\n|---|---|\n\
    | `int₁ -eq int₂` | `int₁` is equal to `int₂` |\n| `int₁ -ge int₂` | `int₁` is\
    \ greater than or equal to `int₂` |\n| `int₁ -gt int₂` | `int₁` is greater than\
    \ `int₂` |\n| `int₁ -le int₂` | `int₁` is less than or equal to `int₂` |\n| `int₁\
    \ -lt int₂` | `int₁` is less than `int₂` |\n| `int₁ -ne int₂` | `int₁` is not\
    \ equal to `int₂` |\n\nFor example, the operator `-eq` tests to see whether two\
    \ integers are equal. So if you had a shell variable called `count` and you wanted\
    \ to see whether its value was equal to zero, you would write\n\n```\n```sh\n\
    [ \"$count\" -eq 0 ]\n```\n```"
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Other integer operators behave similarly, so


    ```

    ```sh

    [ "$choice" -lt 5 ]

    ```

    ```


    tests to see whether the variable choice is less than 5.


    The command


    ```

    ```sh

    [ "$index" -ne "$max" ]

    ```

    ```


    tests to see whether the value of index is not equal to the value of max.


    Finally


    ```

    ```sh

    [ "$#" -ne 0 ]

    ```

    ```


    tests to see whether the number of arguments passed to the command is not equal
    to zero.


    It’s important to note that the test command, not the shell itself, interprets
    the variable’s value as an integer when an integer operator is used, so these
    comparisons work regardless of the shell variable’s type.


    Let’s have a closer look at the difference between test’s string and integer operators
    with a few examples.


    ```

    ```sh

    $ x1="005"

    $ x2="10"

    $ [ "$x1" = 5 ]             String comparison

    $ echo $?

    1                           False

    $ [ "$x1" -eq 5 ]            Integer comparison

    $ echo $?

    0                           True

    $ [ "$x2" = 10 ]             String comparison

    $ echo $?

    1                           False

    $ [ "$x2" -eq 10 ]           Integer comparison

    $ echo $?

    0                           True

    $

    ```

    ```


    The first test


    ```

    ```sh

    [ "$x1" = 5 ]

    ```

    ```


    uses the string comparison operator = to test whether the two strings are identical.
    They’re not, because the first string is composed of the three characters 005,
    and the second the single character 5.


    In the second test, the integer comparison operator -eq is used. Treating the
    two values as integers (numbers), 005 is equal to 5, as verified by the test exit
    status.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'The third and fourth tests are similar, but in these cases you can see how
    even a leading space stored in the variable x2 can influence a test made with
    a string operator versus one made with an integer operator.


    # File Operators


    Virtually every shell program deals with one or more files. For this reason, a
    wide assortment of operators are provided by test to enable you to ask various
    questions about files. Each of these operators is *unary* in nature, meaning that
    they expect a single argument to follow. In all cases, the second argument is
    the name of a file (and that includes a directory name, as appropriate).


    Table 7.3 lists the common file operators.


    | Operator | Returns TRUE (exit status of 0) if |

    |---|---|

    | `-d file` | `file` is a directory |

    | `-e file` | `file` exists |

    | `-f file` | `file` is an ordinary file |

    | `-r file` | `file` is readable by the process |

    | `-s file` | `file` has nonzero length |

    | `-w file` | `file` is writable by the process |

    | `-x file` | `file` is executable |

    | `-L file` | `file` is a symbolic link |


    The command


    ```

    [ -f /users/steve/phonebook ]

    ```


    tests whether the file /users/steve/phonebook exists and is an ordinary file (that
    is, not a directory or special file).


    The command


    ```

    [ -r /users/steve/phonebook ]

    ```


    tests whether the indicated file exists and is also readable by you.


    The command


    ```

    [ -s /users/steve/phonebook ]

    ```


    tests whether the indicated file has non-zero content (that is, isn’t an empty
    file). This is useful if you create an error log file and later want to see whether
    anything was written to it:


    ```

    if [ -s $ERRFILE ]

    then

    ```'
  merge: -1
  img_proc: true
- pgno: 162
  md: '```

    ```sh

    echo "Errors found:"

    cat $ERRFILE

    fi

    ```

    ```


    A few more test operators, when combined with the previously described operators,
    enable you to specify more complicated conditional expressions.


    # The Logical Negation Operator `!`


    The unary logical negation operator `!` can be placed in front of any other test
    expression to negate the result of the evaluation of that expression. For example,


    ```

    ```sh

    [ ! -r /users/steve/phonebook ]

    ```

    ```


    returns a zero exit status (true) if `/users/steve/phonebook` is **not** readable;
    and


    ```

    ```sh

    [ ! -f "$mailfile" ]

    ```

    ```


    returns true if the file specified by `$mailfile` does not exist or is **not**
    an ordinary file. Finally,


    ```

    ```sh

    [ ! "$x1" = "$x2" ]

    ```

    ```


    returns true if `$x1` is not identical to `$x2` and is obviously equivalent to
    (and the more confusing cousin of) the clearer conditional expression


    ```

    ```sh

    [ "$x1" != "$x2" ]

    ```

    ```


    # The Logical AND Operator `-a`


    The operator `-a` performs a logical *AND* of two expressions and returns TRUE
    only if the two joined expressions are both true. So


    ```

    ```sh

    [ -f "$mailfile" -a -r "$mailfile" ]

    ```

    ```


    returns TRUE if the file specified by `$mailfile` is an ordinary file and is readable
    by you. (An extra space was placed around the `-a` operator to aid in the expression’s
    readability and obviously has no effect on its execution.)


    The command


    ```

    ```sh

    [ "$count" -ge 0   -a   "$count" -lt 10 ]

    ```

    ```


    will be true if the variable `count` contains an integer value greater than or
    equal to zero but less than 10. The `-a` operator has lower precedence than the
    integer comparison operators (and the string and file operators, for that matter),
    meaning that the preceding expression gets evaluated as


    ```

    ```sh

    [ "$count" -ge 0) -a [ "$count" -lt 10)

    ```

    ```


    as you would expect.


    In some cases, it’s important to know that `test` immediately stops evaluating
    an AND expression as soon as something is proven to be false, so a statement like


    ```

    ```sh

    [ ! -f "$file" -a $(who > $file) ]

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'will not run in the subshell with the who invocation if the ! -f (non-existence)
    test fails, because test already knows that the AND (-a) expression is false.
    Subtle, but something that can trip up shell programmers if they try to jam too
    much into conditional expressions with the assumption that everything is run prior
    to the conditional tests being applied.


    # Parentheses


    You can use parentheses in a test expression to alter the order of evaluation
    as needed; just make sure that the parentheses themselves are quoted because they
    have a special meaning to the shell. So to translate the earlier example into
    a test command, you would write


    ```

    [ \( "$count" -ge 0 \) -a \( "$count" -lt 10 \) ]

    ```


    As is typical, spaces must surround the parentheses because test expects to see
    every element in the conditional statement as a separate argument.


    # The Logical OR Operator -o


    The -o operator is similar to the -a operator, only it forms a logical OR of two
    expressions. That is, evaluation of the expression will be true if either the
    first expression is true or the second expression is true (or both expressions
    are true).


    ```

    [ -n "$mailopt" -o -r $HOME/mailfile ]

    ```


    This command will be true if the variable mailopt is not null or if the file $HOME/mailfile
    is readable by you.


    The -o operator has lower precedence than the -a operator, meaning that the expression


    ```

    "$a" -eq 0 -o "$b" -eq 2 -a "$c" -eq 10

    ```


    gets evaluated by test as


    ```

    "$a" -eq 0 -o ("$b" -eq 2 -a "$c" -eq 10)

    ```


    Naturally, you can use parentheses to change this order if necessary:


    ```

    \( "$a" -eq 0 -o ("$b" -eq 2 \) -a "$c" -eq 10)

    ```


    Since precedence is critically important in complex conditional statements, you’ll
    find that a lot of shell programmers have nested if statements to side-step any
    issues, while others use explicit parentheses to clarify order of interpretation.
    Certainly just assuming things are interpreted left-to-right is dangerous!


    You will see many uses of the test command throughout the book because it’s almost
    impossible to write even simple shell programs without some sort of conditional
    statements involved. Table A.11 in Appendix A summarizes all available test operators.'
  merge: -1
  img_proc: true
- pgno: 164
  md: "# # The else Construct\n\nA construct known as `else` can be added to the `if`\
    \ command, with the general format as shown:\n\n```\nif command\nthen\n      \
    \  command\n        command\n        . . .\nelse\n        command\n        command\n\
    . . .\nfi\n```\n\nIn the above, `command` is executed and its exit status is evaluated.\
    \ If it’s true (zero), the then code block (all the statements between then and\
    \ else) is executed and the else block is ignored. If the exit status is false\
    \ (non-zero), the then code block is ignored and the else code block (everything\
    \ between else and fi) is executed. In either case, only one set of commands gets\
    \ executed: the first set if the exit status is zero, and the second set if it’s\
    \ nonzero.\n\nThis can be more succinctly explained:\n\n```\nif condition then\
    \ statements-if-true else statements-if-false fi\n```\n\nLet’s now write a modified\
    \ version of `on`. Instead of having no output if the requested user is not logged\
    \ on, we’ll have the program report that fact to the user.\n\nHere is version\
    \ 3 of the program:\n\n```\n$ cat on\n#\n# determine if someone is logged on --\
    \ version 3\n#\n\nuser=\"$1\"\n\nif who | grep \"$user \" > /dev/null\nthen\n\
    \        echo \"$user is logged on\"\nelse\n        echo \"$user is not logged\
    \ on\"\nfi\n$\n```\n\nIf the user specified as the first argument to `on` is logged\
    \ on, the `grep` will succeed and the message `user is logged on` will be displayed;\
    \ otherwise, the message `user is not logged on` will be displayed."
  merge: -1
  img_proc: true
- pgno: 165
  md: "```\n$ who\n                         Who's on?\nroot      console Jul 8 10:37\n\
    barney    tty03    Jul 8 12:38\nfred      tty04    Jul 8 13:40\njoanne    tty07\
    \    Jul 8 09:35\ntony      tty19    Jul 8 08:30\nlulu      tty23    Jul 8 09:55\n\
    $ on pat\npat is not logged on\n$ on tony\ntony is logged on\n$\n```\n\nTo turn\
    \ a quick prototype into a useful program for the long term, it’s a good practice\
    \ to make sure that the correct number of arguments is passed to the program.\
    \ If the user specifies the wrong number of arguments, an appropriate error message\
    \ can be issued, along with a usage message. Like this:\n\n```\n$ cat on\n#\n\
    # determine if someone is logged on -- version 4\n#\n#\n# see if the correct number\
    \ of arguments were supplied\n#\nif [ \"$#\" -ne 1 ]\nthen\n        echo \"Incorrect\
    \ number of arguments\"\n        echo \"Usage: on user\"\nelse\n        user=\"\
    $1\"\n\n        if who | grep \"^$user \" > /dev/null\n        then\n        \
    \        echo \"$user is logged on\"\n        else\n                echo \"$user\
    \ is not logged on\"\n        fi\nfi\n$\n```\n\nIt seems like a lot of changes,\
    \ but other than wrapping all the previous code within an else-fi pair, the primary\
    \ addition is an if command to evaluate whether the correct number of arguments\
    \ was supplied. If $# is not equal to 1, the required number of arguments, the\
    \ program prints two error messages; otherwise, the commands after the else clause\
    \ are executed. Note that two fi commands are required because two if commands\
    \ are used."
  merge: -1
  img_proc: true
- pgno: 166
  md: 'As you can see, indentation goes a long way toward making the program easy
    to read and understand. Get into the habit of setting and following indentation
    rules in your own programs and you’ll definitely thank us later on as your programs
    become increasingly complicated.


    The sophistication of the user experience is clearly improved over previous versions
    of the program:


    ```

    ```text

    $ on                         No arguments

    Incorrect number of arguments

    Usage:  on user

    $ on priscilla               One argument

    priscilla is not logged on

    $ on jo anne                 Two arguments

    Incorrect number of arguments

    Usage:  on user

    $

    ```

    ```


    # The exit Command


    A built-in shell command called `exit` enables you’ to immediately terminate execution
    of your shell program. The general format of this command is


    `exit n`


    where *n* is the exit status that you want returned. If none is specified, the
    exit status used is that of the last command executed prior to the exit (that
    is, it’s effectively `exit $?`).


    Be advised that executing the exit command directly from your terminal will log
    you off the system because it will have the effect of terminating execution of
    your login shell.


    # A Second Look at the `rem` Program


    `exit` is frequently used as a convenient way to terminate execution of a shell
    program. For example; let’s take another look at the `rem` program, which removes
    an entry from the phonebook file:


    ```

    ```sh

    $ cat rem

    #

    # Remove someone from the phone book

    #


    grep -v "$1" phonebook > /tmp/phonebook

    mv /tmp/phonebook phonebook

    $

    ```

    ```


    As written, this program has the potential to create problems if unexpected situations
    arise, potentially even corrupting or wiping out the entire phonebook file.'
  merge: -1
  img_proc: true
- pgno: 167
  md: "For example, suppose that you type in\n\n```\nrem Susan Topple\n```\n\nThe\
    \ shell will pass two arguments to `rem` because of the missing quotes. The `rem`\
    \ program will then remove all Susan entries, as specified by `$1`, without ever\
    \ seeing that there were too many arguments specified by the user in the first\
    \ place.\n\nAs a result, it’s always best to take precautions with any potentially\
    \ destructive program and to be certain that the action intended by the user is\
    \ consistent with the action that the program is poised to take.\n\nOne of the\
    \ first checks that can be made in `rem` is for the correct number of arguments,\
    \ as was done earlier with the `on` program. This time, we’ll use the `exit` command\
    \ to terminate the program if the correct number of arguments isn’t supplied:\n\
    \n```\n$ cat rem\n#\n# Remove someone from the phone book -- version 2\n#\n\n\
    if [ \"$#\" -ne 1 ]\nthen\n        echo \"Incorrect number of arguments.\"\n \
    \       echo \"Usage: rem name\"\n        exit 1\nfi\n\ngrep -v \"$1\" phonebook\
    \ > /tmp/phonebook\nmv /tmp/phonebook phonebook\n$ rem Susan Goldberg\nIncorrect\
    \ number of arguments.\nUsage: rem\n$\n```\n\n*Try it out*\n\nThe `exit` command\
    \ returns an exit status of 1, to signal failure, in case some other program wants\
    \ to check it in a conditional expression. How could you have written the preceding\
    \ program with an `if-else` instead of using the `exit`?\n\nWhether you use the\
    \ `exit` or an `if-else` is up to you. Sometimes the `exit` is a more convenient\
    \ way to get out of the program quickly, particularly if it’s done early in the\
    \ program, and it has the additional benefit of avoiding the need for deeply nested\
    \ conditionals.\n\n# The `elif` Construct\n\nAs your programs become more complex,\
    \ you may find yourself stuck writing nested `if` statements like this:\n\n```\n\
    if command₂\nthen\n```"
  merge: -1
  img_proc: true
- pgno: 168
  md: "```\n```sh\ncommand\ncommand\n...\nelse\n    if command₂\n    then\n      \
    \  command\n        command\n        ...\n    else\n        ...\n        if commandₙ\n\
    \        then\n            command\n            command\n            ...\n   \
    \     else\n            command\n            command\n            ...\n      \
    \  fi\n        ...\n    fi\nfi\n```\n```\n\nThis type of command sequence can\
    \ be useful when you need to make more than just a two-choice decision. In this\
    \ case, a multiway decision is made, with the last else clause executed if none\
    \ of the preceding conditions is satisfied.\n\nAs a relatively simple example,\
    \ let’s write a program called `greetings` that prints a friendly Good morning,\
    \ Good afternoon, or Good evening based on time of day. For purposes of the example,\
    \ consider any time from midnight to noon to be the morning, noon to 6 pm the\
    \ afternoon, and 6 pm to midnight the evening.\n\nTo write this program, you have\
    \ to find out what time it is. `date` serves just fine for this purpose. Take\
    \ another look at the output from this command:\n\n```\n```sh\n$ date\nWed Aug\
    \ 29 10:42:01 EDT 2002\n$\n```\n```\n\nThe format of `date`’s output is fixed,\
    \ a fact that you can use to your advantage because the time will always appear\
    \ in character positions 12 through 19. In fact, you really only need the hour\
    \ value in positions 12 and 13:\n\n```\n```sh\n$ date | cut -c12-13\n10\n$\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 169
  md: "Now the task of writing the greetings program is straightforward:\n\n```\n\
    ```sh\n$ cat greetings\n#\n# Program to print a greeting\n#\n\nhour=$(date | cut\
    \ -c12-13)\n\nif [ \"$hour\" -ge 0 -a \"$hour\" -le 11 ]\nthen\n        echo \"\
    Good morning\"\nelse\n        if [ \"$hour\" -ge 12 -a \"$hour\" -le 17 ]\n  \
    \      then\n                echo \"Good afternoon\"\n        else\n         \
    \       echo \"Good evening\"\n        fi\nfi\n$```\n```\n\nIf hour is greater\
    \ than or equal to 0 (midnight) and less than or equal to 11 (up to 11:59:59),\
    \ Good morning is displayed. If hour is greater than or equal to 12 (noon) and\
    \ less than or equal to 17 (up to 5:59:59 pm), Good afternoon is displayed. If\
    \ neither of the preceding conditions is satisfied, Good evening is displayed.\n\
    \n```\n```sh\n$ greetings\nGood morning\n$```\n```\n\nLook at the program again,\
    \ however, and you’ll realize that the nested `if` command sequence used in greetings\
    \ is rather clumsy. To streamline these sorts of *if-then-else* sequences, the\
    \ shell also supports a special `elif` element that acts somewhat like *else if\
    \ condition*, except it doesn’t increase your nesting level. The general format\
    \ is\n\n```\n```sh\nif command₁\nthen\n        command₁\n        command\n   \
    \     ...\nelif command₂\nthen\n        command\n        command\n        ...\n\
    else\n        command\n        command\n        ...\nfi\n```\n```"
  merge: -1
  img_proc: true
- pgno: 170
  md: "`command₁`, `command₂`, ..., `commandₙ` are executed in turn and their exit\
    \ statuses tested. As soon as one returns an exit status of TRUE (zero), the commands\
    \ listed after the `then` that follows are executed, up to another `elif`, `else`,\
    \ or `fi`. If none of the conditional expressions is true, the commands listed\
    \ after the optional `else` are executed.\n\nNow you can rewrite the `greetings`\
    \ program using this new format as shown:\n\n```\n```sh\n$ cat greetings\n#\n\
    # Program to print a greeting -- version 2\n#\n\nhour=$(date | cut -c12-13)\n\n\
    if [ \"$hour\" -ge 0 -a \"$hour\" -le 11 ]\nthen\n        echo \"Good morning\"\
    \nelif [ \"$hour\" -ge 12 -a \"$hour\" -le 17 ]\nthen\n        echo \"Good afternoon\"\
    \nelse\n        echo \"Good evening\"\nfi\n$\n```\n```\n\nA definite improvement.\
    \ The program is easier to read, and it doesn’t have the tendency to wander off\
    \ the right margin due to progressively increasing indentation.\n\nIncidentally,\
    \ it’s very rare to see `date | cut` as a pipe because the `date` command itself\
    \ has a rich and complex set of output formats you can utilize to get just the\
    \ information or value you want. For example, to output just the current hour\
    \ in 0–23 format, use `%H` with the necessary `+` prefix to indicate it’s a formatting\
    \ string:\n\n```\n```sh\n$ date +%H\n10\n$\n```\n```\n\nAs an exercise, you should\
    \ change `greetings` to make use of this more streamlined way to identify the\
    \ current hour of the day.\n\n# Yet Another Version of `rem`\n\nLet’s jump back\
    \ to the phone number removal program `rem`. Earlier we mentioned that it was\
    \ dangerous because without checking the validity of its actions, it could blindly\
    \ delete more than the user desired.\n\nOne way to address this problem is to\
    \ check the *number* of entries that match the user specified pattern before doing\
    \ the removal. If there’s more than one match, issue a message to that effect\
    \ and terminate execution of the program. But how do you determine the number\
    \ of matching entries?"
  merge: -1
  img_proc: true
- pgno: 171
  md: "One easy way is to do a grep on the phonebook file and count the number of\
    \ resulting matches with wc. If the number of matches is greater than one, the\
    \ appropriate message can be issued. That logic can be coded like this:\n\n```\n\
    ```sh\n$ cat rem\n#\n# Remove someone from the phone book -- version 3\n#\n\n\
    if [ \"$#\" -ne 1 ]\nthen\n        echo \"Incorrect number of arguments.\"\n \
    \       echo \"Usage: rem name\"\n        exit 1\n\nfi\n\nname=$1\n\n#\n# Find\
    \ number of matching entries\n#\n\nmatches=$(grep \"$name\" phonebook | wc -l)\n\
    \n#\n# If more than one match, issue message, else remove it\n#\n\nif [ \"$matches\"\
    \ -gt 1 ]\nthen\n        echo \"More than one match; please qualify further\"\n\
    elif [ \"$matches\" -eq 1 ]\nthen\n        grep -v \"$name\" phonebook > /tmp/phonebook\n\
    \        mv /tmp/phonebook phonebook\n\nelse\n        echo \"I couldn't find $name\
    \ in the phone book\"\nfi\n$ \n```\n```\n\nTo improve readability, the positional\
    \ parameter $1 is assigned to the variable name after the number of arguments\
    \ is checked.\n\nAssigning the output of a command sequence to a variable is very\
    \ common in shell programs, as demonstrated on the line\n\n```\n```sh\nmatches=$(grep\
    \ \"$name\" phonebook | wc -l)\n```\n```\n\nWith matches calculated, it’s easy\
    \ to step through the if...elif...else command sequence and see that it first\
    \ tests to see whether the number of matches is greater than one. If it is, the"
  merge: -1
  img_proc: true
- pgno: 172
  md: "“more than one match” message is printed. If it’s not, a test is made to see\
    \ whether the number of matches is equal to one. If it is, the entry is removed\
    \ from the phone book. If it’s not one or greater than one, the number of matches\
    \ must be zero, in which case a message is displayed to alert the user to this\
    \ fact.\n\nNote that the grep command is used twice in this program: first to\
    \ determine the number of matches, then with the -v option to remove the matching\
    \ entry after ensuring that only one line matches.\n\nHere are some sample runs\
    \ of this version of rem:\n\n```\n```text\n$ rem\nIncorrect number of arguments.\n\
    Usage: rem name\n$ rem Susan\nMore than one match; please qualify further\n$ rem\
    \ 'Susan Topple'\n$ rem 'Susan Topple'\nI couldn't find Susan Topple in the phone\
    \ book    She's history\n$\n```\n```\n\nNow you have a fairly robust rem program:\
    \ it checks for the correct number of arguments, printing the proper usage if\
    \ the correct number isn’t supplied; it also checks to make sure that precisely\
    \ one entry is removed from the phonebook file.\n\nIn typical Unix fashion, also\
    \ note that the rem script has no output when the requested action succeeds.\n\
    \n# The case Command\n\nThe case command allows you to compare a single value\
    \ against a set of other values or expressions and to execute one or more commands\
    \ when a match is found. The general format of this command is\n\n```\n```text\n\
    case value in\npattern₁)    command\n             command\n             ...\n\
    \             command;;\npattern₂)    command\n             command\n        \
    \     ...\n             command;;\n...\npatternₙ)    command\n             command\n\
    \             ...\n             command;;\nesac\n```\n```"
  merge: -1
