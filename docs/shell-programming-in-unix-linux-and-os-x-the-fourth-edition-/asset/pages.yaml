  md: '# A Program to Look Up Someone in the Phone Book


    Here’s the phonebook file from previous examples:


    ```

    $ cat phonebook

    Alice Chebba     973-555-2015

    Barbara Swingle  201-555-9257

    Liza Stichow      212-555-2298

    Susan Goldberg   201-555-7776

    Susan Topple      212-555-4932

    Tony Annino       973-555-1295

    $

    ```


    You know how to look up someone in the file by using grep:


    ```

    $ grep Chebba phonebook

    Alice Chebba     973-555-2015

    $

    ```


    And you know that if you want to look up someone by their full name, you need
    to put quotes around the words to keep the argument together:


    ```

    $ grep "Susan T" phonebook

    Susan Topple     212-555-4932

    $

    ```


    It would be nice to write a shell program that you could use to look up someone.
    Let’s call the program **lu** and have it take as its argument the name of the
    person to seek:


    ```

    $ cat lu

    #

    # Look someone up in the phone book

    #


    grep $1 phonebook

    $

    ```


    Here’s a sample use of lu:


    ```

    $ lu Alice

    Alice Chebba     973-555-2015

    $ lu Susan

    Susan Goldberg   201-555-7776

    Susan Topple      212-555-4932

    $ lu "Susan T"

    grep: can''t open T

    phonebook:Susan Goldberg   201-555-7776

    phonebook:Susan Topple      212-555-4932

    $

    ```


    In the preceding example, you were careful to enclose Susan T in double quotes;
    so what happened? Look again at the grep invocation in the lu program:


    ```

    grep $1 phonebook

    ```'
