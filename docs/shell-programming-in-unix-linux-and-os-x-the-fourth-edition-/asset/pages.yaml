- pgno: 45
  md: '```

    ```text

    report1

    report2

    report3

    $ echo ?

    a b c

    $ echo a?

    aa

    $ echo ??

    aa bb cc

    $ echo ??*

    aa aax alice bb cc report1 report2 report3

    $

    ```

    ```


    In the preceding example, the ?? matches two characters, and the * matches zero
    or more characters up to the end. The net effect is to match all filenames of
    two or more characters.


    Another way to match a single character is to give a list of characters to match
    within square brackets [ ]. For example, [abc] matches the letter a, b, or c.
    It’s similar to the ?, but it allows you to choose which characters are valid
    matches.


    You can also specify a logical range of characters with a dash, a huge convenience!
    For example, [0-9] matches the characters 0 through 9. The only restriction in
    specifying a range of characters is that the first character must be alphabetically
    less than the last character, so that [z-f] is not a valid range specification,
    while [f-z] is.


    By mixing and matching ranges and characters in the list, you can perform complicated
    substitutions. For example, [a-np-z]* matches all files that start with the letters
    a through n or p through z (or more simply stated, any filename that doesn’t start
    with the lowercase letter o).


    If the first character following the [ is a !, the sense of the match is inverted.
    That is, any character is matched except those enclosed in the brackets. So


    ```

    ```text

    [!a-z]

    ```

    ```


    matches any character except a lowercase letter, and


    ```

    ```text

    *[!o]

    ```

    ```


    matches any file that doesn’t end with the lowercase letter o.


    Table 1.1 gives a few more examples of filename substitution.


    **Table 1.1  Filename Substitution Examples**


    | Command | Description |

    |---|---|

    | `echo a*` | Print the names of all files beginning with a |

    | `cat *.c` | Print the contents of all files ending in .c |

    | `rm *.*` | Remove all files containing a period |

    | `ls x*` | List the names of all files beginning with x |'
