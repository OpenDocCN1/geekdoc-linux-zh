    to be displayed as


    ```

    one two three four

    ```


    Because the shell removes spaces, tabs, and newlines (whitespace characters) from
    the command line and then cuts it up into arguments before giving it to the requested
    command, the invocation


    ```

    echo $address

    ```


    causes the shell to remove the embedded newline character, treating it as it would
    a space or tab; as an argument delimiter. Then the shell passes the nine arguments
    to `echo` for display. `echo` never sees that newline; the shell gets to it first
    (see Figure 5.5).


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_129_0.png)


    Figure 5.5  `echo $address`


    When the command


    ```

    echo "$address"

    ```


    is used instead, the shell substitutes the value of `address` as before, except
    that the double quotes tell it to leave any embedded whitespace characters alone.
    So in this case, the shell passes a single argument to `echo`—an argument that
    contains an embedded newline. `echo` then displays its single argument. Figure
    5.6 illustrates this, with the newline character depicted by the sequence `\n`.'
