    \ not handed to the command. Furthermore, because the -l flag was specified to\
    \ the wc command, only the count of the number of lines (3) is presented as the\
    \ output of the command.\n\n# Output Redirection\n\nThe output from a command\
    \ normally intended for standard output can be easily “diverted” to a file instead.\
    \ This capability is known as *output redirection* and is also essential to understanding\
    \ the power of Unix."
  merge: -1
  img_proc: true
- pgno: 50
  md: 'If the notation `> file` is appended to any command that normally writes its
    output to standard output, the output of that command will be written to the file
    `file` instead:


    ```

    ```text

    $ who > users

    $

    ```

    ```


    This command causes the who command to be executed and its output to be written
    into the file users. Notice that no output appears. This is because the output
    has been redirected from the default standard output device (the terminal) into
    the specified file. We can check this, of course:


    ```

    ```text

    $ cat users

    oko  tty01  Sep 12 07:30

    ai   tty15  Sep 12 13:32

    ruth tty21  Sep 12 10:10

    pat  tty24  Sep 12 13:07

    steve tty25 Sep 12 13:03

    $

    ```

    ```


    If a command has its output redirected to a file and the file already contains
    some data, that data will be overwritten and lost.


    ```

    ```text

    $ echo line 1 > users

    $ cat users

    line 1

    $

    ```

    ```


    But now consider this example, remembering that users already contains the output
    of the earlier who command:


    ```

    ```text

    $ echo line 2 >> users

    $ cat users

    line 1

    line 2

    $

    ```

    ```


    If you’re paying close attention you’ll notice that this echo command uses a different
    type of output redirection, indicated by the characters `>>`. This character pair
    causes the standard output from the command to be appended to the contents of
    the specified file. The previous contents are not lost; the new output simply
    gets added to the end.


    By using the redirection append characters `>>`, you can use cat to append the
    contents of one file onto the end of another:


    ```

    ```text

    $ cat file1

    This is in file1.

    $ cat file2

    This is in file2.

    $ cat file1 >> file2

    $ cat file2

    This is in file2.

    This is in file1.

    $

    ```


    *Append file1 to file2*

    ```'
  merge: -1
  img_proc: true
- pgno: 51
  md: "Recall that specifying more than one filename to cat results in the display\
    \ of the first file followed immediately by the second file, and so on. This means\
    \ there’s a second way to accomplish the same result:\n\n```\n$ cat file1\nThis\
    \ is in file1.\n$ cat file2\nThis is in file2.\n$ cat file1 file2\nThis is in\
    \ file1.\nThis is in file2.\n$ cat file1 file2 > file3\n$ cat file3\nThis is in\
    \ file1.\nThis is in file2.\n$\n```\n\n*Redirect it instead*\n\nIn fact, that’s\
    \ where the cat command gets its name: When used with more than one file, its\
    \ effect is to concatenate the files together.\n\n# Input Redirection\n\nJust\
    \ as the output of a command can be redirected to a file, so can the input of\
    \ a command be redirected from a file. And as the greater-than character > is\
    \ used for output redirection, the less-than character < is used to redirect the\
    \ input of a command. Of course, only commands that normally take their input\
    \ from standard input can have their input redirected from a file in this manner.\n\
    \nTo redirect input, type the < character followed by the name of the file that\
    \ the input is to be read from. To count the number of lines in the file users,\
    \ for example, you already know that you can execute the command wc -l users:\n\
    \n```\n$ wc -l users\n      2 users\n$\n```\n\nIt turns out that you can also\
    \ count the number of lines in the file by redirecting standard input for the\
    \ wc command:\n\n```\n$ wc -l < users\n      2\n$\n```\n\nNote that there is a\
    \ difference in the output produced by the two forms of the wc command. In the\
    \ first case, the name of the file users is listed with the line count; in the\
    \ second case, it is not.\n\nThis points out a subtle distinction between the\
    \ execution of the two commands. In the first case, wc knows that it is reading\
    \ its input from the file users. In the second case, it only sees the raw data\
    \ which is being fed to it via standard input. The shell redirects the input so\
    \ that it comes from the file users and not the terminal (more about this in the\
    \ next chapter). As far as wc is concerned, it doesn’t know whether its input\
    \ is coming from the terminal or from a file, so it can’t report the filename!"
  merge: -1
  img_proc: true
- pgno: 52
  md: "# # Pipes\n\nAs you will recall, the file `users` that was created previously\
    \ contains a list of all the users currently logged in to the system. Because\
    \ you know that there will be one line in the file for each user logged in to\
    \ the system, you can easily determine the *number* of login sessions by counting\
    \ the number of lines in the users file.\n\n```\n```sh\n$ who > users\n$ wc -l\
    \ < users\n      5\n$\n```\n```\n\nThis output indicates that currently five users\
    \ are logged in or that there are five login sessions, the difference being that\
    \ users, particularly administrators, often log in more than once. Now you have\
    \ a command sequence you can use whenever you want to know how many users are\
    \ logged in.\n\nAnother approach to determine the number of logged-in users bypasses\
    \ the intermediate file. As referenced earlier, Unix lets you “connect” two commands\
    \ together. This connection is known as a *pipe*, and it enables you to take the\
    \ output from one command and feed it directly into the input of another. A pipe\
    \ is denoted by the character `|`, which is placed between the two commands. To\
    \ create a pipe between the `who` and `wc -l` commands, you type `who | wc -l`:\n\
    \n```\n```sh\n$ who | wc -l\n      5\n$\n```\n```\n\nThe pipe that is created\
    \ between these two commands is depicted in Figure 1.12.\n\n![](img/29b87b4d3daf7eb41fe5066130730f4c_52_0.png)\n\
    \nFigure 1.12  Pipeline process: `who | wc -l`"
  merge: -1
  img_proc: true
- pgno: 53
  md: "When a pipe is established between two commands, the standard output from the\
    \ first command is connected directly to the standard input of the second command.\
    \ You know that the `who` command writes its list of logged-in users to standard\
    \ output. Furthermore, you know that if no filename argument is specified to the\
    \ `wc` command, it takes its input from standard input. Therefore, the list of\
    \ logged-in users that is output from the `who` command automatically becomes\
    \ the input to the `wc` command. Note that you never see the output of the command\
    \ at the terminal because it is piped directly into the `wc` command. This is\
    \ depicted in Figure 1.13.\n\n![](img/29b87b4d3daf7eb41fe5066130730f4c_53_0.png)\n\
    \nFigure 1.13   Pipeline process\n\nA pipe can be made between *any two* programs,\
    \ provided that the first program writes its output to standard output, and the\
    \ second program reads its input from standard input.\n\nAs another example, suppose\
    \ you wanted to count the number of files contained in your directory. Knowledge\
    \ of the fact that the `ls` command displays one line of output per file enables\
    \ you to use the same type of approach as before:\n\n```\n```bash\n$ ls | wc -l\n\
    \  10\n```\n```\n\nThe output indicates that the current directory contains 10\
    \ files.\n\nIt is also possible to create a more complicated *pipeline* that consists\
    \ of more than two programs, with the output of one program feeding into the input\
    \ of the next. As you become a more sophisticated command line user, you’ll find\
    \ many situations where pipelines can be tremendously powerful."
  merge: -1
  img_proc: true
- pgno: 54
  md: '# ## Filters


    The term *filter* is often used in Unix terminology to refer to any program that
    can take input from standard input, perform some operation on that input, and
    write the results to standard output. More succinctly, a filter is any program
    that can be used to modify the output of other programs in a pipeline. So if the
    pipeline in the previous example, `wc` is considered a filter. `ls` is not because
    it does not read its input from standard input. As other examples, `cat` and `sort`
    are filters, whereas `who`, `date`, `cd`, `pwd`, `echo`, `rm`, `mv`, and `cp`
    are not.


    # ## Standard Error


    In addition to standard input and standard output, there is a third virtual device
    known as *standard error*. This is where most Unix commands write their error
    messages. And as with the other two “standard” places, standard error is associated
    with your terminal or terminal app by default. In most cases, you never know the
    difference between standard output and standard error:


    ```

    ```text

    $ ls n*                         List all files beginning with n

    n* not found

    $

    ```

    ```


    Here the “not found” message is actually being written to standard error by the
    `ls` command. You can verify that this message is not being written to standard
    output by redirecting the `ls` command’s output:


    ```

    ```text

    $ ls n* > foo

    n* not found

    $

    ```

    ```


    As you can see, the message is still printed out at the terminal and was not added
    to the file `foo`, even though you redirected standard output.


    The preceding example shows the raison d’être for standard error: so that error
    messages will still get displayed at the terminal even if standard output is redirected
    to a file or piped to another command.


    You can also redirect standard error to a file (for instance, if you’re logging
    a program’s potential errors during long-term operation) by using the slightly
    more complex notation


    ```

    ```text

    command 2> file

    ```

    ```


    Note that *no space is permitted* between the 2 and the >. Any error messages
    normally intended for standard error will be diverted into the specified *file*,
    similar to the way standard output gets redirected.


    ```

    ```text

    $ ls n* 2> errors

    $ cat errors

    n* not found

    $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# More on Commands


    # Typing More Than One Command on a Line


    You can type more than one command on a line provided that you separate them with
    a semicolon. For example, you can find out the current time and your current working
    directory by typing in the date and pwd commands on the same line:


    ```

    ```text

    $ date; pwd

    Sat Jul 20 14:43:25 EDT 2002

    /users/pat/bin

    $

    ```

    ```


    You can string out as many commands as you want on the line, as long as each command
    is delimited by a semicolon.


    # Sending a Command to the Background


    Normally, you type in a command and then wait for the results of the command to
    be displayed at the terminal. For all the examples you have seen thus far, this
    waiting time is typically short—a fraction of a second.


    Sometimes, however, you may have to run commands that require a few minutes or
    longer to complete. In those cases, you’ll have to wait for the command to finish
    executing before you can proceed further, unless you execute the command in the
    background.


    It turns out that while your Unix or Linux system seems like it’s focused completely
    on what you’re doing, all systems are actually multitasking, running multiple
    commands simultaneously at any given time. If you’re on an Ubuntu system, for
    example, it might have the window manager, a clock, a status monitor and your
    terminal window all running simultaneously. You too can run multiple commands
    simultaneously from the command line. That’s the idea of putting a command “into
    background,” letting you work on other tasks while it completes.


    The notational convention for pushing a command or command sequence into background
    is to append the ampersand character &. This means that the command will no longer
    tie up your terminal, and you can then proceed with other work. The standard output
    from the command will still be directed to your terminal, though in most cases
    the standard input will be dissociated from your terminal. If the command does
    try to read from standard input, it will stop and wait for you to bring it to
    the foreground (we’ll discuss this in more detail in Chapter 14, “Interactive
    and Nonstandard Shell Features”).


    Here’s an example:


    ```

    ```text

    $ sort bigdata > out &        Send the sort to the background

    [1] 1258                    Process id

    $ date                      Your terminal is immediately available to do other
    work

    Sat Jul 20 14:45:09 EDT 2002

    $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 56
  md: "When a command is sent to the background, the Unix system automatically displays\
    \ two numbers. The first is called the command’s job number and the second the\
    \ process ID, or PID. In the preceding example, 1 is the job number and 1258 the\
    \ process ID. The job number is used as a shortcut for referring to a specific\
    \ background job by some shell commands. (You’ll learn more about this in Chapter\
    \ 14.) The process ID uniquely identifies the command that you sent to the background\
    \ and can be used to obtain status information about the command. This is done\
    \ with the processor status—ps—command.\n\n# The ps Command\n\nThe ps command\
    \ gives you information about the processes running on the system. Without any\
    \ options, it prints the status of just your processes. If you type in ps at your\
    \ terminal, you’ll get a few lines back describing the processes you have running:\n\
    \n```\n```text\n$ ps\n  PID TTY          TIME CMD\n13463 pts/16    00:00:09 bash\n\
    19880 pts/16    00:00:00 ps\n$\n```\n```\n\nThe ps command (typically; your system\
    \ might vary) prints out four columns of information: PID, the process ID; TTY,\
    \ the terminal number that the process was run from; TIME, the amount of computer\
    \ time in minutes and seconds that process has used; and CMD, the name of the\
    \ process. (The bash process in the preceding example is the shell that was started\
    \ when we logged in, and it’s used 9 seconds of computer time.) Until the command\
    \ is finished, it shows up in the output of the ps command as a running process,\
    \ so process 19880 in the preceding example is the ps command itself.\n\nWhen\
    \ used with the -f option, ps prints out more information about your processes,\
    \ including the parent process ID (PPID), the time the process started (STIME),\
    \ and the command arguments:\n\n```\n```text\n$ ps -f\nUID       PID  PPID  C\
    \ STIME TTY          TIME CMD\nsteve   13463 13355  0 12:12 pts/16    00:00:09\
    \ bash\nsteve   19884 13463  0 13:39 pts/16    00:00:00 ps -f\n$\n```\n```\n\n\
    # Command Summary\n\nTable 1.2 summarizes the commands reviewed in this chapter.\
    \ In this table, *file* refers to a file, *file(s)* to one or more files, *dir*\
    \ to a directory, and *dir(s)* to one or more directories."
  merge: -1
  img_proc: true
- pgno: 57
  md: '**Table 1.2  Command Summary**


    | Command | Description |

    |---|---|

    | `cat file(s)` | Display contents of *file(s)* or standard input if not supplied
    |

    | `cd dir` | Change working directory to *dir* |

    | `cp file₁ file₂` | Copy *file₁* to *file₂* |

    | `cp file(s) dir` | Copy *file(s)* into *dir* |

    | `date` | Display the date and time |

    | `echo args` | Display *args* |

    | `ln file₁ file₂` | Link *file₁* to *file₂* |

    | `ln file(s) dir` | Link *file(s)* into *dir* |

    | `ls file(s)` | List *file(s)* |

    | `ls dir(s)` | List files in *dir(s)* or in current directory if *dir(s)* is
    not specified |

    | `mkdir dir(s)` | Create directory *dir(s)* |

    | `mv file₁ file₂` | Move *file₁* to *file₂* (simply rename it if both reference
    the same directory) |

    | `mv file(s) dir` | Move *file(s)* into directory *dir* |

    | `ps` | List information about active processes |

    | `pwd` | Display current working directory path |

    | `rm file(s)` | Remove *file(s)* |

    | `rmdir dir(s)` | Remove empty directory *dir(s)* |

    | `sort file(s)` | Sort lines of *file(s)* or standard input if *file(s)* not
    supplied |

    | `wc file(s)` | Count the number of files, words, and characters in *file(s)*
    or standard input if *file(s)* not supplied |

    | `who` | Display who’s logged in |'
