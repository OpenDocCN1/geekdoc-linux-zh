- pgno: 244
  md: '# Your Current Directory


    Your current directory is also part of your shell environment. Consider this small
    shell program called `cdtest`:


    ```

    ```text

    $ cat cdtest

    cd /users/steve/bin

    pwd

    $

    ```

    ```


    The program uses `cd` to move to `/users/steve/bin` and then invokes `pwd` to
    verify that the change was made. Let’s run it:


    ```

    ```text

    $ pwd

    /users/steve

    $ cdtest

    /users/steve/bin

    $

    ```

    ```


    *Get my bearings*


    Now for the $64,000 question: If you invoke `pwd`, will you be in `/users/steve`
    or `/users/steve/bin`?


    ```

    ```text

    $ pwd

    /users/steve

    $

    ```

    ```


    It turns out that the `cd` in `cdtest` had no effect on your current directory.
    Because the current directory is part of the environment, when a `cd` is executed
    from a subshell, it only affects the directory of the subshell. *There is no way
    to change the current directory of a parent shell from a subshell.*


    When `cd` is invoked, it changes your current directory and also sets the `PWD`
    variable to the full pathname of the new current directory. As a result, the command


    echo $PWD


    produces the same output as the `pwd` command:


    ```

    ```text

    $ pwd

    /users/steve

    $ echo $PWD

    /users/steve

    $ cd bin

    $ echo $PWD

    /users/steve/bin

    $

    ```

    ```


    `cd` also sets `OLDPWD` to the full pathname of the previous current directory,
    which can be useful in certain situations too.'
