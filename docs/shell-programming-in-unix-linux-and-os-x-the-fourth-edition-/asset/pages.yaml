    \ is often used as the command following the `if`, either by explicitly calling\
    \ `test` or using its mnemonic shortcut `[`, the latter of which requires a matching\
    \ `]`.\n\n*Example*\n\n```\n```sh\nif [ $# -eq 0 ] ; then\n        echo \"Usage:\
    \ $0 [-l] file ...\"\n        exit 1\nfi\n```\n```\n\nAn else clause can be added\
    \ to the `if` to be executed if the command returns a nonzero exit status. In\
    \ this case, the general format of the `if` becomes\n\n```\n```sh\nif command_t\n\
    then\n        command\n        command\n        ...\n\nelse\n        command\n\
    \        command\n        ...\n\nfi\n```\n```\n\nIf `command_t` returns an exit\
    \ status of zero, the commands that follow up to the else are executed, and the\
    \ commands between the else and the fi are skipped. Otherwise, `command_t` returns\
    \ a nonzero exit status and the commands between the then and the else are skipped,\
    \ and the commands between the else and the fi are executed.\n\n*Example*\n\n\
    ```\n```sh\nif [ -z \"$line\" ]\nthen\n        echo \"I couldn't find $name\"\n\
    ```\n```"
