    # Built-in Integer Arithmetic


    The POSIX standard shell as included with all modern Unix and Linux variants (including
    Mac OS X’s command shell) provides a mechanism for performing integer arithmetic
    on shell variables called *arithmetic expansion*. Note that some older shells
    do not support this feature.


    The format for arithmetic expansion is


    ```

    $((expression))

