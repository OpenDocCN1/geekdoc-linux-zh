- pgno: 349
  md: '# Arithmetic Expressions


    *General Format:* `$( (expression) )`


    The shell evaluates the integer arithmetic expression. *expression* can contain
    constants, shell variables (which don’t have to be preceded by dollar signs),
    and operators. The operators, in order of decreasing precedence, are


    | Operator | Description |

    |---|---|

    | `-` | unary minus |

    | `~` | bitwise NOT |

    | `!` | logical negation |

    | `* / %` | multiplication, division, remainder |

    | `+ -` | addition, subtraction |

    | `<< >>` | left shift, right shift |

    | `<= >= < >` | comparison |

    | `== !=` | equal, not equal |

    | `&` | bitwise AND |

    | `^` | bitwise exclusive OR |

    | `|` | bitwise OR |

    | `&&` | logical AND |

    | `||` | logical OR |

    | `expr₁ ? expr₂ : expr₃` | conditional operator |

    | `=, *=, /=, %=` | assignment |

    | `+=, <<=, >>=` |  |

    | `&=, ^=, |=` |  |


    Parentheses may be used to override operator precedence.


    The exit status is zero (true) if the last expression is nonzero and one (false)
    if the last expression is zero.


    The C operators `sizeof`, `++`, and `--` may be available in your shell implementation
    but are not required by the standard. Check by typing `sizeof` and see what happens.


    *Examples*


    ```

    y=$((22 * 33))

    z=$(( (y * y) / (y - 1) ))

    ```'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Filename Substitution


    After parameter substitution and command substitution are performed on the command
    line, the shell looks for the special characters `*`, `?`, and `[`. If they''re
    not quoted, the shell searches the current directory, or another directory if
    preceded by a `/`, and substitutes the names of all files that match. If no match
    is found, the characters remain untouched.


    Note that filenames beginning with a `.` must be explicitly matched (in other
    words, `echo *` won’t display your hidden files but `echo .*` will).


    The filename substitution characters are summarized in Table A.6.


    **Table A.6 — Filename Substitution Characters**


    | Character(s) | Meaning |

    |---|---|

    | `?` | Matches any single character. |

    | `*` | Matches zero or more characters. |

    | `[chars]` | Matches any single character in `chars`; the format `C₁-C₂` can
    be used to match any character in the range `C₁` through `C₂`, inclusive (for
    example, `[A-Z]` matches any uppercase letter). |

    | `[!chars]` | Matches any single character not in `chars`; a range of characters
    may be specified as above. |


    # I/O Redirection


    When scanning the command line, the shell looks for the special redirection characters
    `<` and `>`. If found, they are processed and removed (with any associated arguments)
    from the command line. Table A.7 summarizes the different types of I/O redirection
    that the shell supports.


    **Table A.7 — I/O Redirection**


    | Construct | Meaning |

    |---|---|

    | `< file` | Redirect standard input from `file`. |

    | `> file` | Redirect standard output to `file`; `file` is created if it doesn’t
    exist and zeroed if it does. |

    | `>\| file` | Redirect standard output to `file`; `file` is created if it doesn’t
    exist and zeroed if it does; the `noclobber` (`-C`) option to `set` is ignored.
    |

    | `>> file` | Like `>`, except that output is appended to `file` if it already
    exists. |

    | `<< word` | Redirect standard input from lines that follow up until a line containing
    just `word`; parameter substitution occurs on the lines, and back-quoted commands
    are executed if the backslash character is interpreted; if any character in `word`
    is quoted, none of this processing occurs and the lines are passed through unaltered;
    if `word` is preceded by a `-`, leading tabs on the lines are removed. |

    | `<<& digit` | Standard input is redirected from the file associated with file
    descriptor `digit`. |'
  merge: -1
  img_proc: true
- pgno: 351
  md: '| Construct | Meaning |

    |---|---|

    | `>& digit` | Standard output is redirected to the file associated with file
    descriptor `digit`. |

    | `<&-` | Standard input is closed. |

    | `>&-` | Standard output is closed. |

    | `<> file` | Open file for both reading and writing. |


    Note that filename substitution is not performed on *file*. Any of the constructs
    listed in the first column of the table may be preceded by a file descriptor number
    to have the same effect on the file associated with that file descriptor.


    The file descriptor 0 is associated with standard input, 1 with standard output,
    and 2 with standard error.


    # Exported Variables and Subshell Execution


    Commands other than the shell''s built-in commands are normally executed in a
    new instantiation of the shell called a *subshell*. Subshells cannot change the
    values of variables in the parent shell, and they can only access variables from
    the parent shell that were *exported*—either implicitly or explicitly—by the parent.
    If the subshell changes the value of one of these variables and wants to have
    its own subshells know about it, it must explicitly export the variable before
    executing the subshell.


    When the subshell finishes execution, any variables that it may have set are inaccessible
    by the parent.


    # The `( ... )` Construct


    If one or more commands are placed inside parentheses, those commands will be
    executed in a subshell.


    # The `{ ...; }` Construct


    If one or more commands are placed inside curly braces, those commands will be
    executed by the *current* shell.


    With this construct and the `( ... )` construct, I/O can be redirected and piped
    into and out of the set of enclosed commands, and the set can be sent to the background
    for execution by placing an & at the end. For example,


    ```

    (prog1; prog2; prog3) 2>errors &

    ```


    submits the three listed programs to the background for execution, with standard
    error from all three programs redirected to the file errors.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# More on Shell Variables


    A shell variable can be placed into the environment of a command by preceding
    the command name with the assignment to the parameter on the command line, as
    in


    ```

    `PHONEBOOK=$HOME/misc/phone rolo`

    ```


    Here the variable PHONEBOOK will be assigned the indicated value and then placed
    in rolo’s environment. The environment of the current shell remains unchanged,
    as if


    ```

    `(PHONEBOOK=$HOME/misc/phone; export PHONEBOOK; rolo)`

    ```


    had been executed instead.


    # Functions


    Functions take the following form:


    ```

    `name () compound-command`

    ```


    where compound-command is a set of commands enclosed in (...), {...} or can be
    a for, case, until, or while command. Most often, the function definition takes
    this form:


    ```

    `name () { command; command; ...command; }`

    ```


    where name is the name of the function defined to the current shell (functions
    can’t be exported). The function definition can span as many lines as needed.
    A return command can be used to cause execution of the function to be terminated
    without also terminating the shell (see the return command description).


    For example,


    ```

    `nf () { ls | wc -l; }`

    ```


    defines a function called nf to count the number of files in your current directory.


    # Job Control


    # Shell Jobs


    Every command sequence run in the background is assigned a job number, starting
    at one. A job can be referred to by a job_id, which is a % followed by the job
    number, %+, %−, %%, % followed by the first few letters of the pipeline, or %?string.


    The following built-in commands can be given a job_id as an argument: kill, fg,
    bg, and wait. The special conventions %+ and %− refer to the current and previous
    jobs, respectively; %% also refers to the current job. The current job is the
    most recent job placed in the background or the job running in the foreground.
    The convention %string refers to the job whose name begins with string; %?string
    refers to the job whose name contains string. The jobs command may be used to
    list the status of all currently running jobs.'
  merge: -1
  img_proc: true
- pgno: 353
  md: "If the monitor option of the set command is turned on, the shell prints a message\
    \ when each job finishes. If you still have jobs when you try to exit the shell,\
    \ a message is printed to alert you of this. If you immediately try to exit again,\
    \ the shell exits. The monitor option is enabled by default for interactive shells.\n\
    \n# Stopping Jobs\n\nIf the shell is running on a system with job control, and\
    \ the monitor option of the set command is enabled, jobs that are running in the\
    \ foreground may be placed in the background and vice versa. Normally, Ctrl+z\
    \ stops the current job and the bg command puts a stopped job in the background.\
    \ The fg command brings a background or stopped job to the foreground.\n\nWhenever\
    \ a job in the background attempts to read from the terminal, it is stopped until\
    \ it is brought to the foreground. Output from background jobs normally comes\
    \ to the terminal. If stty tostop is executed, output from background jobs is\
    \ disabled, and a job writing to the terminal is stopped until it is brought to\
    \ the foreground. When the shell exits, all stopped jobs are killed.\n\n# Command\
    \ Summary\n\nThis section summarizes the shell’s built-in commands. Actually,\
    \ some of these commands (such as echo and test) may not be built in to the shell\
    \ or might have a streamlined version built-in and a more sophisticated version\
    \ as a separate program. In all cases, these functions must be provided as a utility\
    \ by a POSIX-compliant system. They are built in to Bash and the Korn shell and\
    \ are used in almost all shell scripts.\n\n# The . Command\n\n*General Format:*\
    \ `.`\n\nThis is essentially a *null* command. It is frequently used to satisfy\
    \ the requirement that a command appear.\n\n*Example*\n\n```\nif who | grep jack\
    \ > /dev/null ; then\n    :\nelse\n    echo \"jack's not logged in\"\nfi\n```\n\
    \nThe . command returns an exit status of zero.\n\n# The . Command\n\n*General\
    \ Format:* `. file`"
  merge: -1
