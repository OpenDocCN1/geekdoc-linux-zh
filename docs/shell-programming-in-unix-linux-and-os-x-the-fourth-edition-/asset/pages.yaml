- pgno: 148
  md: '```

    ```sh

    shift

    echo $# $*

    shift

    echo $# $*

    shift

    echo $# $*

    shift

    echo $# $*

    $ tshift a b c d e

    5 a b c d e

    4 b c d e

    3 c d e

    2 d e

    1 e

    0

    $

    ```

    ```


    If you try to `shift` when there are no variables to shift (that is, when `$#`
    already equals zero), you’ll get an error message from the shell (the error will
    vary from one shell to the next):


    ```

    ```text

    prog: shift: bad number

    ```

    ```


    where *prog* is the name of the program that executed the offending `shift`.


    You can shift more than one “place” at once by writing a *count* immediately after
    `shift`, as in


    ```

    ```sh

    shift 3

    ```

    ```


    This command has the same effect as performing three separate shifts:


    ```

    ```sh

    shift

    shift

    shift

    ```

    ```


    The shift command is useful when processing a variable number of arguments. You’ll
    see it put to use when you learn about loops in Chapter 8. For now, just remember
    that positional parameters can be moved along the chain by using `shift`.'
