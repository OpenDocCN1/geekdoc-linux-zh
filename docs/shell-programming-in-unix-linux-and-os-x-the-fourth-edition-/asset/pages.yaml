- pgno: 197
  md: "Individual statements can override block redirection, just as any other statements\
    \ in your shell programs can explicitly read from a specified source or send output\
    \ to a specified destination.\n\nTo force input or output to come from or go to\
    \ the terminal, utilize `/dev/tty`, which always refers to your terminal program,\
    \ whether you’re on a Mac, Linux, or Unix system.\n\nIn the following loop, all\
    \ output is redirected to the file output except the echo command’s output, which\
    \ is explicitly redirected to the terminal:\n\n```\nfor file\ndo\n\n    echo \"\
    Processing file $file\" > /dev/tty\n    ...\ndone > output\n```\n\nYou can also\
    \ redirect the standard error output from a loop, simply by tacking on a `2> file`\
    \ after the done:\n\n```\nwhile [ \"$endofdata\" -ne TRUE ]\ndo\n\n    ...\n\n\
    done 2> errors\n```\n\nHere output from all commands in the loop writing to standard\
    \ error will be redirected to the file errors.\n\nA variation of the `2>` format\
    \ is commonly used to ensure that error messages go to the terminal even when\
    \ a script might have its output redirected to a file or pipe:\n\n```\necho \"\
    Error: no file\" 1>&2\n```\n\nBy default, echo sends its output to standard output\
    \ (file descriptor 1), while file descriptor 2 remains standard error and is not\
    \ redirected on file redirection or pipes by default. So the notation above means\
    \ that the error message from echo should have its “file #1” output redirected\
    \ to “file #2”, that is, standard error. You can test this with code like this:\n\
    \n```\nfor i in \"once\"\ndo\n\n    echo \"Standard output message\"\n    echo\
    \ \"Error message\" 1>&2\ndone > /dev/null\n```\n\nTry it yourself and see what\
    \ happens.\n\n# Piping Data into and out of a Loop\n\nA command’s output can be\
    \ piped into a loop (by having the commands prior to the loop command end with\
    \ a pipe symbol), and the output from a loop can be piped into another command\
    \ too. Here’s an example of the output from a `for` command piped into `wc`:\n\
    \n```\n$ for i in 1 2 3 4\n> do\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "```\n```sh\n>        echo $i\n> done | wc -l\n         4\n$\n```\n```\n\n#\
    \ Typing a Loop on One Line\n\nIf you find yourself frequently typing in loops\
    \ directly at the command line, you might want to try the following shorthand\
    \ notation to type in an entire command on a single line: Put a semicolon after\
    \ the last item in the list and one after each command in the loop (but not after\
    \ the do).\n\nUsing this shorthand, the loop\n\n```\n```sh\nfor i in 1 2 3 4\n\
    do\n        echo $i\ndone\n```\n```\n\ncan be written\n\n```\n```sh\nfor i in\
    \ 1 2 3 4; do echo $i; done\n```\n```\n\nYou can type it in directly on the command\
    \ line this way:\n\n```\n```sh\n$ for i in 1 2 3 4; do echo $i; done\n1\n2\n3\n\
    4\n$\n```\n```\n\nThe same rules apply to while and until loops.\n\nif commands\
    \ can also be typed on the same line using a similar format:\n\n```\n```sh\n$\
    \ if [ 1 = 1 ]; then echo yes; fi\nyes\n$ if [ 1 = 2 ]; then echo yes; else echo\
    \ no; fi\nno\n$\n```\n```\n\nNote that no semicolons appear after the then and\
    \ the else.\n\nMany shell programmers use a hybrid structure where if statements\
    \ are structured thusly:\n\n```\n```sh\nif [ condition ]; then\n    command\n\
    fi\n```\n```\n\nThis simple usage of the semicolon can help increase the readability\
    \ of your shell programs and is worth considering as part of your own code formatting."
  merge: -1
  img_proc: true
- pgno: 199
  md: '# # The `getopts` Command


    Let’s extend the `waitfor` program further by adding a -t option that specifies
    how frequently, in seconds, to perform the check. Now waitfor takes both -m and
    -t options. We’ll allow these options to be specified in any order on the command
    line, as long as they appear before the name of the user that we’re monitoring.
    So valid waitfor commands look like this:


    ```

    waitfor ann

    waitfor -m ann

    waitfor -t 600 ann

    waitfor -m -t 600 ann

    waitfor -t 600 -m ann

    ```


    and invalid ones look like this:


    ```

    waitfor ann                         Missing user name

    waitfor -t600 ann                   Need a space after -t

    waitfor ann -m                      Options must appear first

    waitfor -t ann                      Missing argument after -t

    ```


    As you start writing code to allow this sort of flexibility on the command line,
    you will soon discover that it can become quite complicated!


    Don’t fret, though; the shell provides a built-in command called `getopts` that
    makes it easy to process command line arguments. The general format of the command
    is


    ```

    getopts options variable

    ```


    We’ll dig into the options string shortly. For now, just know that letter-only
    options are specified as such and options that have a required argument have a
    trailing colon, so “abc:” means that -a and -c are allowed, as is -b, but -b requires
    an additional parameter to be specified.


    The getopts command is designed to be executed within a loop, however, because
    it makes it easy to take whatever actions are required for each of the user specified
    options. Each time through the loop, getopts examines the next command line argument
    and determines whether it is a valid option by checking to see whether the argument
    begins with a minus sign and is followed by any of the letters specified as options.
    If it does, getopts stores the matching option letter inside the specified variable
    and returns a zero exit status. You’ll see what I mean in just a few lines ...


    If the letter that follows the minus sign is not listed in options, getopts stores
    a question mark inside variable before returning with a zero exit status. It also
    writes an error message to standard error about the bad parameter that the user
    specified.


    If no more arguments are left on the command line or if the current argument doesn’t
    begin with a minus sign, getopts returns a nonzero exit status, allowing the script
    to then process any subsequent arguments. Think of the command ls -c /bin in this
    context: -c is a flag that could be parsed and processed by getopts, while /bin
    is an argument to the ls command itself, processed after all the starting arguments
    are dealt with.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'Don’t get too anxious if this seems really confusing. The fact is, it is all
    very complicated, so let’s look at an example so you can see how getopts works.
    Suppose for a script you’re writing you want to use getopts to recognize the options
    -a, -i, and -r. Your getopts call might look like this:


    ```

    getopts "air" option

    ```


    Here the first argument—air—specifies the three acceptable command flags (-a,
    -i, and -r) and option is the name of the variable that getopts will use to store
    each matching value encountered.


    The getopts command also allows options to be clustered or grouped together on
    the command line. This is done by following a single minus sign with more than
    one consecutive option. For example, our foo command can be executed like this:


    ```

    foo -a -r -i

    ```


    or like this:


    ```

    foo -ari

    ```


    using this simple grouping feature.


    But wait, getopts is far more powerful than what we’ve explained so far! For example,
    it can also handle the case where an option requires an additional argument. For
    example, the new -t option to be added to the waitfor command requires an argument
    too.


    To properly parse arguments subsequent to a user-specified option, getopts requires
    that the command line be invoked with at least one space separating the option
    from the argument. In this instance, options cannot be grouped together.


    To indicate to getopts that an option has a required argument, add a colon character
    after the option letter on the getopts command line. So the waitfor program, which
    allows both -m and -t options, the latter of which has a required additional argument,
    should call getopts like this:


    ```

    getopts mt: option

    ```


    If getopts doesn’t find an argument after an option that requires one, it stores
    a question mark inside the variable and outputs an error message to standard error.
    Otherwise, it stores the character in the variable and the user specified argument
    inside a special variable called OPTARG.


    One final note about getopts: Another special variable called OPTIND is initially
    set to 1 and is updated each time getopts returns to reflect the number of the
    next command line argument to be processed.


    To make this clearer, here is the third version of waitfor that uses the getopts
    command to process the command line arguments. It also incorporates the previously
    noted change to send mail to the user running the program.'
