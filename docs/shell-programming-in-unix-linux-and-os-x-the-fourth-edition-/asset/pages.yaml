- pgno: 24
  md: '# # A Quick Review

    # of the Basics


    This chapter provides a review of the Unix system, including the file system,
    basic commands, filename substitution, I/O redirection, and pipes.


    # ## Some Basic Commands


    # ### Displaying the Date and Time: The date Command


    The date command tells the system to print the date and time:


    ```

    ```text

    $ date

    Thu Dec  3 11:04:09 MST 2015

    $

    ```

    ```


    `date` prints the day of the week, month, day, time (24-hour clock, the system’s
    time zone), and year. Throughout the code examples in this book, whenever we use
    **boldface type like this**, it’s to indicate what you, the user, type in. Normal
    face type like this is used to indicate what the Unix system prints. *Italic type
    is used for comments in interactive sequences.*


    Every Unix command is submitted to the system with the pressing of the Enter key.
    Enter says that you are finished typing things in and are ready for the Unix system
    to do its thing.


    # ### Finding Out Who’s Logged In: The who Command


    The who command can be used to get information about all users currently logged
    in to the system:


    ```

    ```text

    $ who

    pat       tty29    Jul 19 14:40

    ruth      tty37    Jul 19 10:54

    steve     tty25    Jul 19 15:52

    $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Here, three users are logged in: `pat`, `ruth`, and `steve`. Along with each
    user ID is listed the *tty* number of that user and the day and time that user
    logged in. The tty number is a unique identification number the Unix system gives
    to each terminal or network device that a user is on when they log in to the system.


    The who command also can be used to get information about yourself:


    ```

    ```text

    $ who am i

    pat        tty29   Jul 19 14:40

    $

    ```

    ```


    who and `who am i` are actually the same command: who. In the latter case, the
    am and i are *arguments* to the who command. (This isn’t a good example of how
    command arguments work; it’s just a curiosity of the who command.)


    # Echoing Characters: The `echo` Command


    The echo command prints (or *echoes*) at the terminal whatever else you happen
    to type on the line (there are some exceptions to this that you’ll learn about
    later):


    ```

    ```text

    $ echo this is a test

    this is a test

    $ echo why not print out a longer line with echo?

    why not print out a longer line with echo?

    $ echo

    ```

    ```


    *A blank line is displayed*


    ```

    ```text

    $ echo one          two    three          four  five

    one two three four five

    $

    ```

    ```


    You will notice from the preceding example that echo squeezes out extra blanks
    between words. That’s because on a Unix system, the words are important while
    the blanks are only there to separate the words. Generally, the Unix system ignores
    extra blanks (you’ll learn more about this in the next chapter).


    # Working with Files


    The Unix system recognizes only three basic types of files: *ordinary* files,
    *directory* files, and *special* files. An ordinary file is just that: any file
    on the system that contains data, text, program instructions, or just about anything
    else. Directories, or folders, are described later in this chapter. Finally, as
    its name implies, a special file has a special meaning to the Unix system and
    is typically associated with some form of I/O.


    A filename can be composed of just about any character directly available from
    the keyboard (and even some that aren’t) provided that the total number of characters
    contained in the name is not greater than 255. If more than 255 characters are
    specified, the Unix system simply ignores the extra characters.'
  merge: -1
  img_proc: true
- pgno: 26
  md: "The Unix system provides many tools that make working with files easy. Here\
    \ we’ll review some of the basic file manipulation commands.\n\n# Listing Files:\
    \ The `ls` Command\n\nTo see what files you have stored in your directory, you\
    \ can type the `ls` command:\n\n```\n```text\n$ ls\nREAD_ME\nnames\ntmp\n$\n```\n\
    ```\n\nThis output indicates that three files called `READ_ME`, `names`, and `tmp`\
    \ are contained in the current directory. (Note that the output of `ls` may vary\
    \ from system to system. For example, on many Unix systems `ls` produces multicolumn\
    \ output when sending its output to a terminal; on others, different colors may\
    \ be used for different types of files. You can always force single-column output\
    \ with the `-1` option—that’s the number one.)\n\n# Displaying the Contents of\
    \ a File: The `cat` Command\n\nYou can examine the *contents* of a file by using\
    \ the `cat` command. (That’s short for “concatenate,” if you’re thinking feline\
    \ thoughts.) The argument to `cat` is the name of the file whose contents you\
    \ want to examine.\n\n```\n```text\n$ cat names\nSusan\nJeff\nHenry\nAllan\nKen\n\
    $\n```\n```\n\n# Counting the Number of Words in a File: The `wc` Command\n\n\
    With the `wc` command, you can get a count of the total number of lines, words,\
    \ and characters contained in a file. Once again, the name of the file is expected\
    \ to be specified as the argument to this command:\n\n```\n```text\n$ wc names\n\
    \      5      7      27 names\n$\n```\n```\n\nThe `wc` command lists three numbers\
    \ followed by the filename. The first number represents the number of lines in\
    \ the file (5), the second the number of words (7), and the third the number of\
    \ characters (27)."
  merge: -1
  img_proc: true
- pgno: 27
  md: "# Command Options\n\nMost Unix commands allow the specification of *options*\
    \ at the time a command is executed.\nThese options generally follow the same\
    \ format:\n\n-letter\n\nThat is, a command option is a minus sign followed immediately\
    \ by a single letter. For\nexample, to count just the number of lines contained\
    \ in a file, the option -l (that's the letter l)\nis given to the wc command:\n\
    \n```\n```sh\n$ wc -l names\n        5 names\n\n$\n```\n```\n\nTo count just the\
    \ number of characters in a file, the -c option is specified:\n\n```\n```sh\n\
    $ wc -c names\n       27 names\n\n$\n```\n```\n\nFinally, the -w option can be\
    \ used to count the number of words contained in the file:\n\n```\n```sh\n$ wc\
    \ -w names\n        7 names\n\n$\n```\n```\n\nSome commands require that the options\
    \ be listed before the filename arguments. For example,\nsort names -r is acceptable,\
    \ whereas wc names -l is not. Still, the former is unusual and\nmost Unix commands\
    \ are designed for you to specify command options first, as exemplified by\nwc\
    \ -l names.\n\n# Making a Copy of a File: The cp Command\n\nTo make a copy of\
    \ a file, use the cp command. The first argument to the command is the name\n\
    of the file to be copied (known as the *source file*), and the second argument\
    \ is the name of the\nfile to place the copy into (known as the *destination file*).\
    \ You can make a copy of the file names\nand call it saved_names as follows:\n\
    \n```\n```sh\n$ cp names saved_names\n$\n```\n```\n\nExecution of this command\
    \ causes the contents of the file names to be copied into a new file\nnamed saved_names.\
    \ As with many Unix commands, the fact that no output other than a\ncommand prompt\
    \ was displayed after the cp command was typed indicates that the command\nexecuted\
    \ successfully.\n\n# Renaming a File: The mv Command\n\nA file can be renamed\
    \ with the mv (“move”) command. The arguments to the mv command\nfollow the same\
    \ format as the cp command. The first argument is the name of the file to be"
  merge: -1
