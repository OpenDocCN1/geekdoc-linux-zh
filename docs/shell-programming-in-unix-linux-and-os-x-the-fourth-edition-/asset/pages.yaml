- pgno: 126
  md: 'As soon as the shell encountered the first `''` it stopped interpreting any
    special characters until it found the closing `''`. So the space between `Susan`
    and `Goldberg`, which would have normally delimited two separate arguments, was
    ignored by the shell. The shell then split the command line into two arguments,
    the first `Susan Goldberg` (which includes the space character) and the second
    `phonebook`. It then invoked `grep`, passing it these two arguments (see Figure
    5.2).


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_126_0.png)


    *Figure 5.2*  `grep ''Susan Goldberg'' phonebook`


    `grep` interpreted the first argument, Susan Goldberg, as a pattern that included
    an embedded space and looked for it in the file specified by the second argument,
    phonebook. Note that the shell removes the quotes and does not pass them to the
    program.


    No matter how many space characters are enclosed between quotes, they are all
    preserved by the shell.


    ```

    ```text

    $ echo  one          two        three      four

    one two three four

    $ echo ''one          two        three      four''

    one          two        three      four

    $

    ```

    ```


    In the first case, the shell removes the extra whitespace characters from the
    line (no quotes!) and passes echo the four arguments one, two, three, and four
    (see Figure 5.3).


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_126_1.png)


    *Figure 5.3*  `echo  one          two      three    four`


    In the second case, the extra spaces are preserved and the shell treats the entire
    string of characters enclosed in quotes as a single argument when executing echo
