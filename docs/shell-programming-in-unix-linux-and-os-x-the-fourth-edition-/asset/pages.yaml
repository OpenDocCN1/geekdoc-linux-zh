- pgno: 209
  md: "```\n```sh\n$ mycp prog1 prog2    Simple case\n$ mycp prog1 bin      Copy into\
    \ directory\nbin/prog1 already exists; overwrite (yes/no)? yes\n$\n```\n```\n\n\
    # A Final Version of mycp\n\nThe last modification to mycp makes the program virtually\
    \ equivalent to the standard Linux cp command by allowing a variable number of\
    \ arguments. Recall that with the standard command any number of files can precede\
    \ the name of a directory, as in\n\n```\n```sh\ncp prog1 prog2 greetings bin\n\
    ```\n```\n\nTo modify mycp to accept any number of files in a similar format,\
    \ you can use this approach:\n\n+   1. Get each argument but the last from the\
    \ command line and store it in the shell variable `filelist`.\n+   2. Store the\
    \ last argument in the variable `to`.\n+   3. If `$to` is not a directory, test\
    \ the argument count as there must be exactly two arguments.\n+   4. If `$to`\
    \ is a directory, for each file in `$filelist`, check whether the file already\
    \ exists in the destination directory. If it doesn’t, add the filename to the\
    \ variable `copylist`. If it does exist, ask the user whether the file should\
    \ be overwritten. If the answer is yes, add the filename to `copylist`.\n+   5.\
    \ If `copylist` is non-null, copy the files in it to `$to`.\n\nIf this algorithm\
    \ seems a bit fuzzy, the program and a detailed explanation will help clear things\
    \ up. Note the modified command usage message.\n\n```\n```sh\n$ cat mycp\n#\n\
    # Copy a file -- final version\n#\n\nnumargs=$#                 # save this for\
    \ later use\nfilelist=\ncopylist=\n\n#\n# Process the arguments, storing all but\
    \ the last in filelist\n#\n\nwhile [ \"$#\" -gt 1 ] ; do\n        filelist=\"\
    $filelist $1\"\n        shift\n\ndone\n```\n```"
