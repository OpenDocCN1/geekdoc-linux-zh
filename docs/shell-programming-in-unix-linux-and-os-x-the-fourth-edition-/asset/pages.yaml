  md: "```\ndo\n    nroff -Tlp $file | lp\ndone\n```\n\n# The getopts Command\n\n\
    *General Format:* `getopts options var`\n\nThis command processes command-line\
    \ arguments. *options* is a list of valid single letter options. If any letter\
    \ in *options* is followed by a `:`, that option requires an additional argument\
    \ on the command line which must be separated from the option by at least one\
    \ space.\n\nEach time `getopts` is called, it processes the next command-line\
    \ argument. If a valid option is found, `getopts` stores the matching option letter\
    \ inside the specified variable *var* and returns a zero exit status.\n\nIf an\
    \ invalid option is specified (one not listed in *options*), `getopts` stores\
    \ a `?` inside *var* and returns with a zero exit status. It also writes an error\
    \ message to standard error.\n\nIf an option takes an argument, `getopts` stores\
    \ the matching option letter inside *var* and stores the command-line argument\
    \ inside the special variable `OPTARG`. If no arguments are left on the command\
    \ line, `getopts` sets *var* to `?` and writes an error message to standard error.\n\
    \nIf no more options remain on the command line (if the next command-line argument\
    \ does not begin with a `-`), `getopts` returns a nonzero exit status.\n\nThe\
    \ special variable `OPTIND` is also used by `getopts`. It is initially set to\
    \ 1 and is adjusted each time `getopts` returns to indicate the number of the\
    \ next command-line argument to be processed.\n\nThe argument `--` can be placed\
    \ on the command line to specify the end of the command-line arguments.\n\n`getopts`\
    \ supports stacked arguments, as in\n\n```\nrepx -iau\n```\n\nwhich is equivalent\
    \ to\n\n```\nrepx -i -a -u\n```\n\nOptions that have required arguments may not\
    \ be stacked.\n\nIf the format\n\n```\ngetopts options var args\n```\n\nis used,\
    \ `getopts` parses the arguments specified by *args rather than* the command-line\
    \ arguments.\n\n*Example*\n\n```\nusage=\"Usage: foo [-r] [-O outfile] infile\"\
