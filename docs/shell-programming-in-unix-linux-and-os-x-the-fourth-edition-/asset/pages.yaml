- pgno: 264
  md: "# The $0 Variable\n\nWhenever you execute a shell program, the shell automatically\
    \ stores the name of the program inside the special variable $0. This can be helpful\
    \ in a number of situations, including when you have a program accessible through\
    \ different command names through hard links in the file system. It lets you programmatically\
    \ figure out which one was executed.\n\nIt’s more commonly used for displaying\
    \ error messages because it is based on the actual program file name, not whatever’s\
    \ hardcoded in the program itself. If the name of the program is referenced by\
    \ $0, renaming the program will update the message without requiring the program\
    \ to be edited:\n\n```\n```sh\n$ cat lu\n#\n# Look someone up in the phone book\n\
    #\n\n    if [ \"$#\" -ne 1 ] ; then\n        echo \"Incorrect number of arguments\"\
    \n        echo \"Usage: $0 name\"\n        exit 1\nfi\n\nname=$1\ngrep \"$name\"\
    \ $PHONEBOOK\n\nif [ $? -ne 0 ] ; then\n        echo \"I couldn't find $name in\
    \ the phone book\"\nfi\n$ PHONEBOOK=$HOME/phonebook\n$ export PHONEBOOK\n$ lu\
    \ Teri\nTeri Zak             201-393-6000\n$ lu Teri Zak\nIncorrect number of\
    \ arguments\nUsage: lu name\n$ mv lu lookup                    Rename it\n$ lookup\
    \ Teri Zak                See what happens now\nIncorrect number of arguments\n\
    Usage: lookup name\n$\n```\n```\n\nSome Unix systems will automatically make $0\
    \ a full pathname including directories, which can lead to some clunky error and\
    \ usage messages. In that instance, use $(basename $0) or utilize the trick from\
    \ earlier to chop out the path name:\n\n```\n```sh\n${0##*/}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 265
  md: "# The `set` Command\n\nThe shell’s set command also serves two purposes: it’s\
    \ used both to set various shell options and to reassign the positional parameters\
    \ $1, $2, and so on…\n\n# The `-x` Option\n\nEarlier, in Chapter 7 we briefly\
    \ looked at using `sh -x` optc as a way to help debug problems in a shell program,\
    \ but the set command lets you actually turn on and off trace mode for specific\
    \ portions of your program.\n\nWithin a program, the statement\n\n```\n```sh\n\
    set -x\n```\n```\n\nenables trace mode, which means all subsequently executed\
    \ commands will be printed to standard error by the shell, after filename, variable,\
    \ and command substitution, as well as I/O redirection have been performed. The\
    \ traced commands are preceded by plus signs.\n\n```\n```sh\n$ x=*\n$ set -x \
    \                        Set command trace option\n$ echo $x\n+ echo add greetings\
    \ lu rem rolo\nadd greetings lu rem rolo\n$ cmd=wc\n+ cmd=wc\n$ ls | $cmd -l\n\
    + ls\n+ wc -l\n        5\n$\n```\n```\n\nYou can turn off trace mode at any time\
    \ simply by executing set with the +x option:\n\n```\n```sh\n$ set +x\n+ set +x\n\
    $ ls | wc -l\n        5\n$\n\n                         Back to normal\n```\n```\n\
    \nNote that the trace option is not passed down to subshells. But you can trace\
    \ a subshell’s execution either by invoking the program with the `sh -x` option\
    \ followed by the name of the program, as in\n\n```\n```sh\nsh -x rolo\n```\n\
    ```\n\nor you can insert a series of `set -x` and `set +x` commands within the\
    \ program itself. In fact, you can insert any number of `set -x` and `set +x`\
    \ commands inside your program to turn trace mode on and off as desired!"
  merge: -1
  img_proc: true
- pgno: 266
  md: '# set with No Arguments


    If you don’t give any arguments to set, you’ll get an alphabetized list of all
    the variables that exist in the current environment, local or exported:


    ```

    ```sh

    $ set                         Show me all variables

    CDPATH=: /users/steve:/usr/spool

    EDITOR=/bin/vi

    HOME=/users/steve

    IFS=


    LOGNAME=steve

    MAIL=/usr/spool/mail/steve

    MAILCHECK=600

    PATH=/bin:/usr/bin:/users/steve/bin:.

    PHONEBOOK=/users/steve/phonebook

    PS1=$

    PS2=>

    PWD=/users/steve/misc

    SHELL=/usr/bin/sh

    TERM=xterm

    TMOUT=0

    TZ=EST5EDT

    cmd=wc

    x=

    $

    ```

    ```


    # Using `set` to Reassign Positional Parameters


    You’ll recall that there’s no way to assign a new value to or reassign the value
    of a positional parameter. Attempts to reassign $1 to be 100, for example, might
    be logically written like this:


    ```

    ```sh

    1=100

    ```

    ```


    But it won’t work. Positional parameters are set upon invocation of the shell
    program.


    However, there’s a sneaky trick: you can use set to change the value. If words
    are given as arguments to set on the command line, the positional parameters $1,
    $2, ... will be assigned to those words. The previous values stored in the positional
    parameters will be lost. Within a shell program then, the command


    ```

    ```sh

    set a b c

    ```

    ```


    will assign a to $1, b to $2, and c to $3. $# also gets set to 3 as appropriate
    for the new argument count.


    Here’s a more involved example:


    ```

    ```sh

    $ set one two three four

    $ echo $1:$2:$3:$4

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 267
  md: '```

    ```

    one:two:three:four

    $ echo $*                         *This should be 4*

    4

    $ echo $*                         *What does this reference now?*

    one two three four

    $ for arg; do echo $arg; done

    one

    two

    three

    four

    $

    ```

    ```


    After execution of the set, everything works as expected: $#, $*, and the for
    loop without a list all reflect the change in positional parameter values.


    set is often used in this fashion to “parse” data read from a file or the terminal.
    Here’s a program called words that counts the number of words typed on a line
    (using the shell’s definition of a “word”):


    ```

    ```

    $ cat words

    #

    # Count words on a line

    #


    read line

    set $line

    echo $#

    $ words                         *Run it*

    Here''s a line for you to count.

    7

    $

    ```

    ```


    The program reads the user input, storing the line read in the shell variable
    line, then executes the command


    ```

    ```

    set $line

    ```

    ```


    This causes each word stored in line to be assigned to the appropriate positional
    parameter. The variable $# is also set to the number of words assigned, which
    is also the number of words on the line.


    # The -- Option


    The above works fine, but what happens if for some reason the user input starts
    with a - symbol?


    ```

    ```

    $ words

    -1 + 5 = 4

    words: -1: bad option(s)

    $

    ```

    ```'
