- pgno: 42
  md: 'This type of file is called a *dangling symbolic link* and should be removed
    unless you have a specific reason to keep it around (for example, if you intend
    to replace the removed file).


    One last note before leaving this discussion: The `ln` command follows the same
    general format as `cp` and `mv`, meaning that you can create links to a bunch
    of files within a specific target directory using the format


    ```

    ln files directory

    ```


    # Removing a Directory: The `rmdir` Command


    You can remove a directory with the `rmdir` command. Rather than let you accidentally
    remove dozens or hundreds of files, however, `rmdir` won''t let you proceed unless
    the specified directory is completely empty of files and subdirectories.


    To remove the directory `/users/pat`, we could use the following:


    ```

    $ rmdir /users/pat

    rmdir: pat: Directory not empty

    $

    ```


    Phew! That would have been a mistake! Instead, let''s remove the `misc` directory
    that you created earlier:


    ```

    $ rmdir /users/steve/misc

    $

    ```


    Once again, the preceding command works only if no files or directories are contained
    in the `misc` directory; otherwise, the following happens, as also shown earlier:


    ```

    $ rmdir /users/steve/misc

    rmdir: /users/steve/misc: Directory not empty

    $

    ```


    If you still want to remove the `misc` directory, you would first have to remove
    all the files contained in that directory before reissuing the `rmdir` command.


    As an alternative method for removing a directory and its contents, you can use
    the `-r` option to the `rm` command. The format is simple:


    ```

    rm -r dir

    ```


    where `dir` is the name of the directory that you want to remove. `rm` removes
    the indicated directory and all files (including directories) in it, so be careful
    with this powerhouse command.


    Want to go full turbo? Add the `-f` flag and it forces the action without prompting
    you on a command-by-command basis. It can completely trash your system if you''re
    not careful, however, so many admins simply avoid `rm -rf` entirely!'
  merge: -1
