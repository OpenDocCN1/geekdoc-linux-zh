    \ ] ; then\n        to=\"$to/$(basename $from)\"\nfi\n\n#\n# See if the destination\
    \ file already exists\n#\n\nif [ -e \"$to\" ] ; then\n        echo \"$to already\
    \ exists; overwrite (yes/no)? \\c\"\n        read answer\n\n        if [ \"$answer\"\
