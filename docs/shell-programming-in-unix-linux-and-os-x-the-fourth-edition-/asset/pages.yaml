- pgno: 39
  md: '# Linking Files: The `ln` Command


    So far everything we’ve talked about with file management has assumed that a given
    collection of data has one and only one filename, wherever it may be located in
    the file system. It turns out that Unix is more sophisticated than that and can
    assign multiple filenames to the same collection of data.


    The main command for creating these duplicate names for a given file is the ln
    command.


    The general form of the command is


    ```

    `ln from to`

    ```


    This links the file `from` to the file `to`.


    Recall the structure of steve’s programs directory from Figure 1.8. In that directory,
    he has stored a program called wb. Suppose that he decides that he’d also like
    to call the program writeback. The most obvious thing to do would be to simply
    create a copy of wb called writeback:


    ```

    ```shell

    $ cp wb writeback

    $

    ```

    ```


    The drawback with this approach is that now twice as much disk space is being
    consumed by the program. Furthermore, if steve ever changes wb, he may forget
    to duplicate the change in writeback, resulting in two different, out of sync
    copies of what he thinks is the same program. Not so good, Steve!


    By linking the file wb to the new name, these problems are avoided:


    ```

    ```shell

    $ ln wb writeback

    $

    ```

    ```


    Now instead of two copies of the file existing, only one exists with two different
    names: wb and writeback. The two files have been logically linked by the Unix
    system.


    As far as you’re concerned, it appears as though you have two different files.
    Executing an ls command shows the two files separately:


    ```

    ```shell

    $ ls

    collect

    mon

    wb

    writeback

    $

    ```

    ```


    Where it gets interesting is when you use `ls -l`:


    ```

    ```text

    $ ls -l

    total 5

    -rwxr-xr-x  1 steve   DP3725   358 Jun 25 13:31 collect

    -rwxr-xr-x  1 steve   DP3129  1219 Jun 25 13:31 mon

    -rwxr-xr-x  2 steve   DP3725    89 Jun 25 13:30 wb

    -rwxr-xr-x  2 steve   DP3725    89 Jun 25 13:30 writeback

    $

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Look closely at the second column of the output: The number shown is 1 for
    collect and mon and 2 for wb and writeback. This is the number of links to a file,
    normally for nonlinked, nondirectory files. Because wb and writeback are linked,
    however, this number is 2 for these files (or, more correctly, this file with
    two names).


    You can remove either of the two linked files at any time, and the other will
    not be removed:


    ```

    ```text

    $ rm writeback

    $ ls -l

    total 4

    -rwxr-xr-x  1 steve    DP3725      358 Jun 25 13:31 collect

    -rwxr-xr-x  1 steve    DP3725     1219 Jun 25 13:31 mon

    -rwxr-xr-x  1 steve    DP3725       89 Jun 25 13:30 wb

    $

    ```

    ```


    Note that the number of links on wb went from 2 to 1 because one of its links
    was removed.


    Most often, ln is used to allow a file to appear in more than one directory simultaneously.
    For example, suppose that pat wanted to have access to steve’s wb program. Instead
    of making a copy for himself (subject to the same data sync problems described
    previously) or including steve’s programs directory in his PATH (which has security
    risks as described in Chapter 10, “Your Environment”), he can simply link to the
    file from his own program directory:


    ```

    ```text

    $ pwd

    /users/pat/bin                         pat’s program directory

    $ ls -l

    total 4

    -rwxr-xr-x  1 pat      DP3822     1358 Jan 15 11:01 lcat

    -rwxr-xr-x  1 pat      DP3822      504 Apr 21 18:30 xtr

    $ ln /users/steve/wb .                link wb to pat’s bin

    $ ls -l

    total 5

    -rwxr-xr-x  1 pat      DP3822     1358 Jan 15 11:01 lcat

    -rwxr-xr-x  2 steve    DP3725       89 Jun 25 13:30 wb

    -rwxr-xr-x  1 pat      DP3822      504 Apr 21 18:30 xtr

    $

    ```

    ```


    Note that steve is still listed as the owner of wb, even when viewing the contents
    of pat’s directory. This makes sense, because there’s really only one copy of
    the file and it’s owned by steve.


    The only stipulation on linking files is that for ordinary links the files to
    be linked together must reside on the same file system. If they don’t, you’ll
    get an error from ln when you try to link them. (To determine the different file
    systems on your system, execute the df command. The first field on each line of
    output is the name of a file system.)


    To create links on files on different file systems (or on different networked
    systems), you can use the -s option to the ln command. This creates a symbolic
    link. Symbolic links behave a lot like regular links, except that the symbolic
    link points to the original file; if the original file is removed, the symbolic
    link no longer works.'
  merge: -1
  img_proc: true
- pgno: 41
  md: "Let’s see how symbolic links work with the previous example:\n\n```\n```text\n\
    $ rm wb\n$ ls -l\ntotal 4\n-rwxr-xr-x  1 pat     DP3822    1358 Jan 15 11:01 lcat\n\
    -rwxr-xr-x  1 pat     DP3822     504 Apr 21 18:30 xtr\n$ ln -s /users/steve/wb\
    \ ./symwb                 Symbolic link to wb\n$\ntotal 5\n-rwxr-xr-x  1 pat \
    \    DP3822    1358 Jan 15 11:01 lcat\nlrwxrwxr-x  1 pat     DP3822      15 Jul\
    \ 20 15:22 symwb -> /users/steve/wb\n-rwxr-xr-x  1 pat     DP3822     504 Apr\
    \ 21 18:30 xtr\n$\n```\n```\n\nNote that pat is listed as the owner of symwb,\
    \ and the file type shown as the very first character in the ls output is l, which\
    \ indicates a symbolic link. The size of the symbolic link is 15 (the file actually\
    \ contains the string /users/steve/wb), but if we attempt to access the contents\
    \ of the file, we are presented with the contents of the file it’s linked to,\
    \ /users/steve/wb:\n\n```\n```text\n$ wc symwb\n       5           9         \
    \ 89 symwb\n\n$\n```\n```\n\nThe -L option to the ls command can be used with\
    \ the -l option to get a detailed list of information on the file the symbolic\
    \ link points to:\n\n```\n```text\n$ ls -Ll\ntotal 5\n-rwxr-xr-x  1 pat     DP3822\
    \    1358 Jan 15 11:01 lcat\n-rwxr-xr-x  1 steve   DP3725      89 Jun 25 13:30\
    \ wb\n-rwxr-xr-x  1 pat     DP3822     504 Apr 21 18:30 xtr\n$\n```\n```\n\nRemoving\
    \ the file that a symbolic link points to invalidates the symbolic link (because\
    \ symbolic links are maintained as filenames), but it doesn’t remove it:\n\n```\n\
    ```text\n$ rm /users/steve/wb                         Assume that pat can remove\
    \ this file\n$ ls -l\ntotal 5\n-rwxr-xr-x  1 pat     DP3822    1358 Jan 15 11:01\
    \ lcat\nlrwxrwxr-x  1 pat     DP3822      15 Jul 20 15:22 symwb -> /users/steve/wb\n\
    -rwxr-xr-x  1 pat     DP3822     504 Apr 21 18:30 xtr\n$ wc symwb\nCannot open\
    \ wb: No such file or directory\n$\n```\n```"
