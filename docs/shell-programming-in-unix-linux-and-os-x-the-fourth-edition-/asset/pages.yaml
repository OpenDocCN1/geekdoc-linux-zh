  md: "Would this match a period character that ends a line? No. Recall that the period\
    \ matches any character, so this would match any single character at the end of\
    \ the line (including a period).\n\nSo how do you match a period? In general,\
    \ if you want to match any of the characters that have a special meaning in regular\
    \ expressions, precede the character by a backslash (`\\\\`) to override its special\
    \ meaning. For example, the regular expression\n\n```\n\\.$\n```\n\nmatches any\
    \ line that ends in a period, and the regular expression\n\n```\n^\\.\n```\n\n\
    matches any line that starts with a period.\n\nWant to specify a backslash as\
    \ an actual character? Use two backslashes in a row: `\\\\\\\\`.\n\n```\n$ ed\
    \ intro\n248\n/\\.$/\ndevelopment.\n1,$s/$/>>/\n1,$p\nThe Unix operating system\
    \ was pioneered by Ken>>\nThompson and Dennis Ritchie at Bell Laboratories>>\n\
    \ in the late 1960s. One of the primary goals in>>\nthe design of the Unix system\
    \ was to create an>>\nenvironment that promoted efficient program>>\ndevelopment.>>\n\
    ```\n\n*Search for a line that ends with a period*\n\n*Add `>>` to the end of\
    \ each line*\n\n```\n1,$s/..$//\n1,$p\nThe Unix operating system was pioneered\
    \ by Ken\nThompson and Dennis Ritchie at Bell Laboratories\nin the late 1960s.\
    \ One of the primary goals in\nthe design of the Unix system was to create an\n\
    environment that promoted efficient program\ndevelopment.\n```\n\n*Delete the\
    \ last two characters from each line*\n\nA common use of ^ and $ is the regular\
    \ expression\n\n```\n^$\n```\n\nwhich matches any line that contains *no* characters\
    \ at all. Note that this regular expression is different from\n\n```\n^ $\n```\n\
    \nwhich matches any line that consists of a single space character."
