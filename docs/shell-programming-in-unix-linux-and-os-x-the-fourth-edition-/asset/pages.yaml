- pgno: 112
  md: '# # And Away We Go


    Based on our discussions in Chapter 2, “What Is the Shell?”, you should now realize
    that whenever you type something like


    ```

    who | wc -l

    ```


    you are actually programming in the shell. That’s because the shell is interpreting
    the command line, recognizing the pipe symbol, connecting the output of the first
    command to the input of the second, and initiating execution of both commands.


    In this chapter, you’ll learn how to write your own commands and how to use shell
    variables.


    # ## Command Files


    A shell program can be typed directly, as in


    ```

    $ who | wc -l

    ```


    or it can be typed into a file and then the file can be executed by the shell.
    For example, suppose that you need to find out the number of logged-in users several
    times throughout the day. It’s not unreasonable to type in the preceding pipeline
    each time you want the information, but for the sake of example, let’s type this
    pipeline into a file.


    We’ll call the file nu (for number of users), and its contents will be just the
    pipeline shown previously:


    ```

    $ cat nu

    who | wc -l

    $

    ```


    To execute the commands contained inside the file nu, all you now have to do is
    type nu as the command name to the shell:


    ```

    $ nu

    sh: nu: cannot execute

    $

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: "Oops! We forgot to mention one thing. Before you can execute a script from\
    \ the command line, you must change the file’s permission to make it executable.\
    \ This is done with the change mode command, chmod. To add execute permission\
    \ to the file, you simply type\n\n```\n    chmod +x *file(s)*\n```\n\nThe +x indicates\
    \ that you want to make the *file(s)* that follow executable. The shell requires\
    \ that a file be *both* readable and executable by you before you can invoke it\
    \ directly on the command line.\n\n```\n    $ ls -l nu\n    -rw-rw-r--  1 steve\
    \  steve  12 Jul 10 11:42 nu\n    $ chmod +x nu                         *Make\
    \ it executable*\n    $ ls -l nu\n    -rwxrwxr-x  1 steve  steve  12 Jul 10 11:42\
    \ nu\n    $\n```\n\nNow that you’ve made it executable, try it again:\n\n```\n\
    \    $ nu\n          8\n    $\n```\n\nThis time it worked.\n\n> > **Warning**\n\
    > >\n> > If you fix the permission issue and still get an error “Command not found,”\
    \ try adding `./` before the command, like `./nu` to ensure the shell looks in\
    \ the current directory for commands as well as the usual system locations. To\
    \ fix it long term, add `.` to the end of your `PATH` (typically within your `.profile`\
    \ file).\n\nYou can put any commands inside a file, make the file executable,\
    \ and then execute its contents simply by typing its name to the shell. It’s that\
    \ simple and that powerful, and everything you’ve learned about working on the\
    \ command line therefore also applies to writing shell scripts too.\n\nThe standard\
    \ shell mechanisms such as I/O redirection and pipes can be used on your own programs\
    \ as well:\n\n```\n    $ nu > tally\n    $ cat tally\n          8\n    $\n```\n\
    \nSuppose that you’re working on a proposal called *sys.caps* and the following\
    \ command sequence is needed every time you print the proposal:\n\n```\n    tbl\
    \ sys.caps | nroff -mm -Tlp | lp\n```"
  merge: -1
  img_proc: true
- pgno: 114
  md: "You can save yourself some typing by placing this command sequence into a file—let’s\
    \ call it run—making it executable, and then just typing the name run whenever\
    \ you want to print a new copy of the proposal:\n\n```\n```sh\n$ cat run\ntbl\
    \ sys.caps | nroff -mm -Tlp | lp\n$ chmod +x run\n$ run\nrequest id is laser1-15\
    \ (standard input)\n$\n```\n```\n\n(The request id message in the example is from\
    \ the lp command.)\n\nFor the next example, suppose that you want to write a shell\
    \ program called stats that prints the date and time, the number of users logged\
    \ in, and your current working directory. The three command sequences you need\
    \ to get this information are date, who | wc -l, and pwd:\n\n```\n```sh\n$ cat\
    \ stats\ndate\nwho | wc -l\npwd\n$ chmod +x stats\n$ stats                   \
    \      Try it out\nWed Jul 10 11:55:50 EDT 2002\n     13\n\n/users/steve/documents/proposals\n\
    $\n```\n```\n\nYou can add some echo commands to stats to make the output a bit\
    \ more informative:\n\n```\n```sh\n$ cat stats\necho The current date and time\
    \ is:\ndate\necho\necho The number of users on the system is:\nwho | wc -l\necho\n\
    echo Your current working directory is:\npwd\n$ stats                        \
    \ Execute it\nThe current date and time is:\nWed Jul 10 12:00:27 EDT 2002\n\n\
    The number of users on the system is:\n     13\n\nYour current working directory\
    \ is:\n/users/steve/documents/proposals\n$\n```\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: 'Recall that echo without any arguments produces a blank line. Shortly, you’ll
    see how to have the message and command output displayed on the same line, like
    this:


    ```

    The current date and time is: Wed Jul 10 12:00:27 EDT 2002

    ```


    # Comments


    The shell programming language would not be complete without a *comment* statement.
    A comment is a way for you to insert remarks or comments inside the program that
    otherwise have no effect on its execution.


    Whenever the shell encounters the special character #, it ignores whatever characters
    appear starting with the # through to the end of the line. If the # starts the
    line, the entire line is treated as a comment. Here are examples of valid comments:


    ```

    # Here is an entire commentary line

    # who | wc -l      # count the number of users

    #

    # Test to see if the correct arguments were supplied

    #

    ```


    Comments are useful for documenting commands or sequences of commands whose purposes
    may not be obvious or are sufficiently complex that you might forget why they’re
    there or what they do. Judicious use of comments can also help make shell programs
    easier to debug and to maintain—both by you and by someone else who may have to
    support your programs.


    Let’s go back to the `stats` program and insert some comments and blank lines
    for legibility:


    ```

    $ cat stats

    #

    # stats -- prints: date, number of users logged on,

    #                  and current working directory

    #


    echo The current date and time is:

    date


    echo

    echo The number of users on the system is:

    who | wc -l


    echo

    echo Your current working directory is:

    pwd

    $

    ```


    The extra blank lines cost little in terms of program space yet add much in terms
    of program readability. They’re simply ignored by the shell.'
  merge: -1
  img_proc: true
- pgno: 116
  md: "# Variables\n\nLike virtually all programming languages, the shell allows you\
    \ to store values into *variables*. A shell variable begins with an alphabetic\
    \ or underscore (_) character and is followed by zero or more alphanumeric or\
    \ underscore characters.\n\n> **Note**\n> \n> The regular expression for a shell\
    \ variable name is therefore `[A-Za-z_][a-zA-Z0-9_]*`, right?\n\nTo store a value\
    \ inside a shell variable, you write the name of the variable, followed immediately\
    \ by the equals sign =, followed immediately by the value you want to store in\
    \ the variable:\n\n```\nvariable=value\n```\n\nFor example, to assign the value\
    \ 1 to the shell variable count, you simply write\n\n```\ncount=1\n```\n\nand\
    \ to assign the value /users/steve/bin to the shell variable my_bin, you write\n\
    \n```\nmy_bin=/users/steve/bin\n```\n\nA few important points here. First, spaces\
    \ are not permitted on either side of the equals sign. Keep that in mind, especially\
    \ if you’ve worked in other programming languages and you’re in the habit of inserting\
    \ spaces around operators. In the shell language, you can’t put those spaces in.\n\
    \nSecond, unlike most other programming languages, the shell has no concept of\
    \ *data types*. Whenever you assign a value to a shell variable, no matter what\
    \ it is, the shell simply interprets that value as a string of characters. So\
    \ when you assigned 1 to the variable count, the shell simply stored the *character*\
    \ 1 inside the variable count, making no assumption that an integer value was\
    \ being stored in the variable.\n\nIf you’re used to programming in a language\
    \ such as C, Perl, Swift, or Ruby where all variables must be *declared*, you’re\
    \ in for another adjustment: Because the shell has no concept of data types, variables\
    \ are not declared before they’re used; they’re simply assigned values when you\
    \ want to use them.\n\nThe shell does support integer operations on shell variables\
    \ that contain strings that are also valid numbers through special built-in operations,\
    \ but even then, the variable is continually evaluated to ensure it’s a valid\
    \ number.\n\nBecause the shell is an interpretive language, you can assign values\
    \ to variables directly at your terminal:\n\n```\n```sh\n$ count=1           \
    \              Assign character 1 to count\n$ my_bin=/users/steve/bin        \
    \ Assign /users/steve/bin to my_bin\n$\n```\n```\n\nSo now that you know how to\
    \ assign values to variables, what good is it? Glad you asked."
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Displaying the Values of Variables


    The echo command—which we''ve used already to print values such as strings received
    from standard input—is used to display the value stored inside a shell variable.
    To do this, you simply write


    ```

    echo $variable

    ```


    The $ character is a special character to the shell when followed by one or more
    alphanumeric characters. If a variable name follows the $, the shell takes this
    as an indication that the value stored inside that variable is to be substituted
    at that point. So, when you type


    ```

    echo $count

    ```


    the shell replaces $count with the value stored there; then it executes the echo
    command:


    ```

    $ echo $count

    1

    $

    ```


    Remember, the shell performs variable substitution *before* it executes the command

    (see Figure 4.1).


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_117_0.png)


    Figure 4.1  `echo $count`


    You can have the value of more than one variable substituted at a time:


    ```

    $ echo $my_bin $count

    /users/steve/bin

    $ echo $my_bin $count

    /users/steve/bin 1

    $

    ```


    In the second example, the shell substitutes the values of my_bin and count and
    then executes the echo command (see Figure 4.2).


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_117_1.png)


    Figure 4.2  `echo $my_bin $count`'
  merge: -1
  img_proc: true
- pgno: 118
  md: "Variables can be used anywhere on any command line and will be replaced with\
    \ their value by the shell prior to the specific command being invoked, as the\
    \ next examples illustrate:\n\n```\n```text\n$ ls $my_bin\nmon\nnu\ntestx\n$ pwd\n\
    /users/steve/documents/memos\n$ cd $my_bin\n$ pwd\n/users/steve/bin\n$ number=99\n\
    $ echo There are $number bottles of beer on the wall\nThere are 99 bottles of\
    \ beer on the wall\n$\n```\n```\n\n*Where are we?*\n\n*Change to my bin directory*\n\
