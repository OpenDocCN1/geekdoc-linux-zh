  img_proc: true
- pgno: 81
  md: 'Let’s break this one down. Remember `^` is the beginning of line and `$` the
    end of line. The simplified pattern is then `.*` which is the first character
    of the line (the first `.` followed by the `.*` for the rest of the line. Add
    the `\( \)` notation to push that first character into register 1 and `\1` to
    then reference the character, and it should make sense to you.


    Successive occurrences of the `\(...\)` construct get assigned to successive registers.
    So when the following regular expression is used to match some text


    ```

    `^\(...\)\(...\)`

    ```


    the first three characters on the line will be stored into register 1, and the
    next three characters into register 2. If you appended `\2\1` to the pattern,
    you would match a 12-character string in which characters 1–3 matched characters
    10–12, and in which characters 4–6 matched characters 7–9.


    When using the substitute command in ed, a register can also be referenced as
    part of the replacement string, which is where this can be really powerful:


    ```

    ```text

    $ ed phonebook

    114

    1,$p

    Alice Chebba     973-555-2015

    Barbara Swingle  201-555-9257

    Liz Stachiw      212-555-2298

    Susan Goldberg   201-555-7776

    Tony Iannino     973-555-1295

    1,$s/\(.*\)  \(.*\)/\2 \1/        Switch the two fields

    1,$p

    ```

    ```


    ```

    ```text

    973-555-2015 Alice Chebba

    201-555-9257 Barbara Swingle

    212-555-2298 Liz Stachiw

    201-555-7776 Susan Goldberg

    973-555-1295 Tony Iannino

    ```

    ```


    The names and the phone numbers are separated from each other in the phonebook
    file by a single tab character. The regular expression


    ```

    `\(.*\)    \(.*\)`

    ```


    says to match all the characters up to the first tab (that’s the character sequence
    `.*` between the `\(` and the `\)`) and assign them to register 1, and to match
    all the characters that follow the tab character and assign them to register 2.
    The replacement string


    ```

    `\2 \1`

    ```


    specifies the contents of register 2, followed by a space, followed by the contents
    of register 1.


    When ed applies the substitute command to the first line of the file:


    ```

    `Alice Chebba        973-555-2015`

    ```'
