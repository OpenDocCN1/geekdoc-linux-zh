  md: "```\n```sh\n$ sh rolosubs\nExtracting lu\nExtracting add\nExtracting rem\n\
    $ ls lu add rem\nadd\nlu\nrem\n$\n```\n```\n\nTo generalize this process, here’s\
    \ a simple shell program, shar, that can produce a shell archive that contains\
