- pgno: 66
  md: 'But there’s a bit more the shell does before individual programs are invoked,
    so let’s talk about those for just a moment too.


    # Variable and Filename Substitution


    Like a more formal programming language, the shell lets you assign values to variables.
    Whenever you specify one of these variables on the command line preceded by a
    dollar sign, the shell substitutes the value assigned to the variable. This topic
    is covered in much more detail in Chapter 4.


    The shell also performs filename substitution on the command line. In fact, the
    shell scans the command line looking for filename substitution characters *, ?,
    or […] before determining the name of the program to execute and its arguments.


    Suppose that your current directory contains these files:


    ```

    ```text

    $ ls

    mrs.todd

    prog1

    shortcut

    sweeney

    $

    ```

    ```


    Now let’s use filename substitution (*) for the echo command:


    ```

    ```text

    $ echo *

    mrs.todd prog1 shortcut sweeney

    $

    ```

    ```


    How many arguments were passed to the echo program, one or four? Because the shell
    performs the filename substitution, the answer is four. When the shell analyzes
    the line


    ```

    ```text

    echo *

    ```

    ```


    it recognizes the special character * and substitutes the names of all files in
    the current directory (it even alphabetizes them for you):


    ```

    ```text

    echo mrs.todd prog1 shortcut sweeney

    ```

    ```


    Then the shell determines what arguments to pass to the actual command. So echo
    never sees the asterisk and as far as it’s concerned, four arguments were typed
    on the command line (see Figure 2.11).


    ![](img/29b87b4d3daf7eb41fe5066130730f4c_66_0.png)


    Figure 2.11  Execution of echo'
  merge: -1
  img_proc: true
- pgno: 67
  md: "# I/O Redirection\n\nIt is also the shell’s responsibility to take care of\
    \ input and output redirection. It scans each entered command line for occurrences\
    \ of the special redirection characters <, >, or >> (in case you’re curious, there\
    \ is a << redirection sequence, as you’ll learn in Chapter 12).\n\nWhen you type\
    \ the command\n\n```\necho Remember to record The Walking Dead > reminder\n```\n\
    \nthe shell recognizes the special output redirection character > and takes the\
    \ next word on the command line as the name of the file to which the output should\
    \ be redirected. In this case, the file is called reminder. If reminder already\
    \ exists and you have write access, the previous contents are overwritten. If\
    \ you don’t have write access to the file or its directory, the shell will produce\
    \ an error message.\n\nBefore the shell starts execution of the desired program,\
    \ it redirects the standard output of the program to the indicated file. In almost\
    \ every case, the program never knows that its output is being redirected. It\
    \ just goes on its merry way writing to standard output (which is normally your\
    \ terminal, you’ll recall), unaware that the shell has redirected that information\
    \ to a file.\n\nLet’s take another look at two nearly identical commands:\n\n\
    ```\n$ wc -l users\n    5 users\n$ wc -l < users\n    5\n$\n```\n\nIn the first\
    \ case, the shell parses the command line and determines that the name of the\
    \ program to execute is wc and passes it two arguments: -l and users (see Figure\
    \ 2.12).\n\n![](img/29b87b4d3daf7eb41fe5066130730f4c_67_0.png)\n\nFigure 2.12\
    \  Execution of `wc -l users`\n\nWhen wc begins execution, it sees that it was\
    \ passed the two arguments. The first, -l, tells it to count the number of lines.\
    \ The second argument specifies the name of the file whose lines are to be counted.\
    \ So wc opens the file users, counts its lines, and then prints the resultant\
    \ count along with the filename.\n\nOperation of wc in the second case is slightly\
    \ different. The shell spots the input redirection character < when it scans the\
    \ command line. The word that follows on the command line is therefore interpreted\
    \ as the name of the file from which input is to be redirected. Having “gobbled\
    \ up” the < users from the command line, the shell then starts execution of the\
    \ wc program, redirecting its standard input from the file users and passing it\
    \ only the single argument -l (see Figure 2.13)."
  merge: -1
  img_proc: true
- pgno: 68
  md: '![](img/29b87b4d3daf7eb41fe5066130730f4c_68_0.png)


    Figure 2.13  Execution of `wc -l < users`


    When wc begins execution this time, it sees that it was passed the single argument
    -l. Because no filename was specified, wc decides that the number of lines coming
    in from standard input should be counted instead. So wc -l counts the number of
    lines, unaware that it’s actually counting the number of lines in the file users.
    The final tally is displayed as usual, but without the name of a file because
    wc wasn’t given one.


    The difference in execution of the two commands is important for you to understand.
    If you’re still unclear on this point, review the preceding section one more time
    before proceeding.


    # Hooking up a Pipeline


    Just as the shell scans the command line looking for redirection characters, it
    also looks for the pipe character |. For each match, it connects the standard
    output from the preceding command to the standard input of the subsequent one,
    then initiates execution of both programs.


    So when you type


    ```

    who | wc -l

    ```


    the shell finds the pipe symbol separating the commands who and wc. It connects
    the standard output of the former command to the standard input of the latter,
    then initiates execution of both. When the who command executes, it produces a
    list of who’s logged in and writes the results to standard output, unaware that
    this is not going to the terminal but to another command instead.


    When the wc command executes, it recognizes that no filename was specified and
    counts the lines on standard input, unaware that standard input is not coming
    from the terminal but from the output of the who command.


    As we proceed, you’ll see that not only can you have two-command pipelines; you
    can string together three, four, five, or more commands in really complicated
    pipelines too. It’s a bit tricky to figure out, but that’s really where some of
    the greatest power of the Unix system hides.


    # Environment Control


    The shell provides certain commands that let you customize your environment. Your
    environment includes your home directory, the characters that the shell displays
    to prompt you to type in a command, and a list of the directories to be searched
    whenever you request that a program be executed. You’ll learn more about this
    in Chapter 10.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Interpreted Programming Language


    The shell has its own built-in programming language. This language is *interpreted*,
    meaning that the shell analyzes each statement as encountered, then executes any
    valid commands found. This differs from programming languages like C++ and Swift,
    in which the programming statements are typically compiled into a machine-executable
    form before they are executed.


    Programs developed in interpreted programming languages are typically easier to
    debug and modify than compiled ones. However, they can take longer to execute
    than their compiled equivalents.


    The shell programming language provides features you’d find in most other programming
    languages. It has looping constructs, decision-making statements, variables, and
    functions, and is procedure-oriented. Modern shells based on the IEEE POSIX standard
    have many other features including arrays, data typing, and built-in arithmetic
    operations.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Tools of the Trade


    This chapter provides detailed descriptions of some commonly used shell programming
    tools. Covered are `cut`, `paste`, `sed`, `tr`, `grep`, `uniq`, and `sort`. The
    more proficient you become at using these tools, the easier it will be to write
    efficient shell scripts.


    # Regular Expressions


    Before getting into the tools, you need to learn about *regular expressions*.
    Regular expressions are used by many different Unix commands, including `ed`,
    `sed`, `awk`, `grep`, and, to a more limited extent, the `vi` editor. They provide
    a convenient and consistent way of specifying *patterns* to be matched.


    Where this gets confusing is that the shell recognizes a limited form of regular
    expressions with filename substitution. Recall that the asterisk (*) specifies
    zero or more characters to match, the question mark (?) specifies any single character,
    and the construct [...] specifies any character enclosed between the brackets.
    But that’s not the same thing as the more formal regular expressions we’ll explore.
    For example, the shell sees ? as a match for any single character, while a regular
    expression—commonly abbreviated regex—uses a period (.) for the same purpose.


    True regular expressions are far more sophisticated than those recognized by the
    shell and there are entire books written about how to assemble really complex
    regex statements. Don’t worry, though, you won’t need to become an expert to find
    great value in regular expressions!


    Throughout this section, we assume familiarity with a line-based editor such as
    `ex` or `ed`. See Appendix B for more information on these editors if you’re not
    familiar with them, or check the appropriate man page.


    # Matching Any Character: The Period ( . )


    A period in a regular expression matches any single character, no matter what
    it is. So the regular expression


    `r.`


    matches an `r` followed by any single character.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# The regular expression


    `.x.`


    matches an **x** that is surrounded by any two characters, not necessarily the
    same.


    We can demonstrate a lot of regular expressions by using the simple ed editor,
    an old-school line-oriented editor that has been around as long as Linux have
    been around.


    For example, the ed command


    ```

    ```text

    / ... /

    ```

    ```


    searches forward in the file you are editing for the first line that contains
    any three characters surrounded by blanks. But before we demonstrate that, notice
    in the very beginning of this example that ed shows the number of characters in
    the file (248) and that commands like print (p) can be prefixed with a range specifier,
    with the most basic being `1,$`, which is the first through last line of the file:


    ```

    ```text

    $ ed intro

    248

    1,$p

    The Unix operating system was pioneered by Ken

    Thompson and Dennis Ritchie at Bell Laboratories

    in the late 1960s. One of the primary goals in

    the design of the Unix system was to create an

    environment that promoted efficient program

    development.

    ```

    ```


    *Print all the lines*


    That’s our working file. Now let’s try some regular expressions:


    ```

    ```text

    / ... /

    The Unix operating system was pioneered by Ken

    /

    Thompson and Dennis Ritchie at Bell Laboratories

    1,$s/p.o/XXX/g

    1,$p

    The Unix operating system was XXXneered by Ken

    ThomXXXn and Dennis Ritchie at Bell Laboratories

    in the late 1960s. One of the primary goals in

    the design of the Unix system was to create an

    environment that XXXmoted efficient XXXgram

    development.

    ```

    ```


    *Look for three chars surrounded by blanks*


    *Repeat last search*


    *Change all p.os to XXX*


    *Let’s see what happened*


    In the first search, ed started searching from the beginning of the file and found
    that the sequence “was” in the first line matched the indicated pattern and printed
    it.


    Repeating the search (the ed command `/`) resulted in the display of the second
    line of the file because “and” matched the pattern. The substitute command s that
    followed specified that all occurrences of the character p, followed by any single
    character, followed by the character o were to be replaced by the characters XXX.
    The prefix `1,$` indicates that it should be applied to all lines in the file,
    and the substitution is specified with the structure `s/old/new/g`, where a'
