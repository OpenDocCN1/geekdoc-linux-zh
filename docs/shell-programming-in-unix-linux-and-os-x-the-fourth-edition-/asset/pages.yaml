    The sed command substitutes a blank space followed by any characters up through
    the end of the line (.*$) with nothing (//); that is, it deletes the characters
    from the first blank to the end of the line for each input line.


    # The -n Option


    By default, sed writes each line of input to standard output, whether or not it
    gets changed. Sometimes, however, you''ll want to use sed just to extract specific
    lines from a file. That''s what the -n flag is for: it tells sed that you don''t
    want it to print any lines by default. Paired with that, use the p command to
    print whichever lines match your specified range or pattern. For example, to print
    just the first two lines from a file:


    ```

    ```text

    $ sed -n ''1,2p'' intro          Just print the first 2 lines

    The UNIX operating system was pioneered by Ken

