- pgno: 344
  md: '| Table A.3 — **Parameter Substitution** |  |

    |---|---|

    | **Parameter** | **Meaning** |

    | `$parameter` or `${parameter}` | Substitute the value of *parameter*. |

    | `${parameter:-value}` | Substitute the value of *parameter* if it’s set and
    non-null; otherwise, substitute *value*. |

    | `${parameter-value}` | Substitute the value of *parameter* if it’s set; otherwise,
    substitute *value*. |

    | `${parameter:=value}` | Substitute the value of *parameter* if it’s set and
    non-null; otherwise, substitute *value* and also assign it to *parameter*. |

    | `${parameter=value}` | Substitute the value of *parameter* if it’s set; otherwise,
    substitute *value* and also assign it to *parameter*. |

    | `${parameter:?value}` | Substitute the value of *parameter* if it’s set and
    non-null; otherwise, write *value* to standard error and exit. If *value* is omitted,
    write `parameter: parameter null or not set` instead. |

    | `${parameter?value}` | Substitute the value of *parameter* if it’s set; otherwise,
    write *value* to standard error and exit. If *value* is omitted, write `parameter:
    parameter null or not set` instead. |

    | `${parameter:+value}` | Substitute *value* if *parameter* is set and non-null;
    otherwise, substitute null. |

    | `${parameter+value}` | Substitute *value* if *parameter* is set; otherwise,
    substitute null. |

    | `${#parameter}` | Substitute the length of *parameter*. If *parameter* is `*`
    or `@`, the result is not specified. |

    | `${parameter#pattern}` | Substitute the value of *parameter* with *pattern*
    removed from the left side. The smallest portion of the contents of *parameter*
    matching *pattern* is removed. Shell filename substitution characters (`*`, `?`,
    `[... ]`, and `@`) may be used in *pattern*. |

    | `${parameter##pattern}` | Same as *pattern* except the largest matching *pattern*
    is removed. |

    | `${parameter%pattern}` | Same as *pattern* except *pattern* is removed from
    the right side. |

    | `${parameter%%pattern}` | Same as `##pattern` except the largest matching *pattern*
    is removed from the right side. |'
