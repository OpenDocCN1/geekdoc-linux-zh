  md: '# Matching a Character Set: The `[ . . . ]` Construct


    Suppose that you are editing a file and want to search for the first occurrence
    of the characters in the. In ed, this is easy: you simply type the command


    ```

    ```text

    /the/

    ```

    ```


    This causes ed to search forward in its buffer until it finds a line containing
    the indicated sequence. The first line that matches will be displayed by ed:


    ```

    ```text

    $ ed intro

    248

    /the/                         Find line containing the

    in the late 1960s.  One of the primary goals in

    ```

    ```


    Notice that the first line of the file also contains the word the, except it begins
    with a capital T. A regular expression that searches for either the or The can
    be built using a character set: the characters `[ ]` can be used to specify that
    one of the enclosed character set is to be matched. The regular expression


    ```

    ```text

    [tT]he

    ```

    ```


    would match a lower- or uppercase t followed immediately by the characters he:


    ```

    ```text

    $ ed intro

    248

    /[tT]he/                       Look for the or The

    The Unix operating system was pioneered by Ken

    /                             Continue the search

    in the late 1960s.  One of the primary goals in

    /                             Once again

    the design of the Unix system was to create an

    1,$/[^aeiouAEIOU]/             Delete all vowels

    1,$p

    Th nx prtng systm ws prnd by Kn

    Thmpn nd Dnns Rtch t Bll Lbrtrs

    n th lt 1960s. n f th prmry gls n

    th dsgn f th nx systm ws t crt n

    vrnmnt tht prmtd fnt prgrm

    dvlpmnt.

    ```

    ```


    Notice the example in the above of `[aeiouAEIOU]` which will match a single vowel,
    either uppercase or lowercase. That notation can get rather clunky, however, so
    a range of characters can be specified inside the brackets instead. This can be
    done by separating the starting and ending characters of the range by a dash (-).
    So, to match any digit character 0 through 9, you could use the regular expression


    ```

    ```text

    [0123456789]

    ```

    ```


    or, more succinctly, you could write


    ```

    ```text

    [0-9]

    ```

    ```'
