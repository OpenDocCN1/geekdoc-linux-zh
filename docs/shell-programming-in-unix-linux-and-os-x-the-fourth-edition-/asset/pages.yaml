  md: '# The `shift` Command


    *General Format:* `shift`


    This command causes the positional parameters `$1`, `$2`, ..., `$n` to be “shifted
    left” one place. That is, `$2` is assigned to `$1`, `$3` to `$2`, ..., and `$n`
    to `$n-1`. `$#` is adjusted accordingly.


    If the format


    `shift n`


    is used instead, the shift is to the left `n` places.


    *Examples*


    ```

    ```sh

    $ set a b c d

    $ echo "$#\n$*"

    4

    a b c d

    $ shift

    $ echo "$#\n$*"

    3

    b c d

    $ shift 2

    $ echo "$#\n$*"

    1

    d

    $

    ```

    ```


    # The `test` Command


    *General Format:*


    `test condition`


    or


    `[ condition ]`


    The shell evaluates `condition` and if the result of the evaluation is *TRUE*,
    returns a zero exit status. If the result of the evaluation is *FALSE*, a nonzero
    exit status is returned. If the format `[ condition ]` is used, a space must appear
    immediately after the `[` and before the `]`.


    `condition` is composed of one or more operators as shown in Table A.11. The `-a`
    operator has higher precedence than the `-o` operator. In any case, parentheses
    can be used to group subexpressions. Just remember that the parentheses are significant
    to the shell and so must be quoted. Operators and operands (including parentheses)
    must be delimited by one or more spaces so that `test` sees them as separate arguments.


    `test` is most often used to test conditions in an `if`, `while`, or `until` command.'
  merge: -1
  img_proc: true
