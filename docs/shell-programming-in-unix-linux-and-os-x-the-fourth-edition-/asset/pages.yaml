  md: 'To match an uppercase letter, use


    `[A-Z]`


    To match an upper- or lowercase letter, you write


    `[A-Za-z]`


    Here are some examples with ed:


    ```

    ```text

    $ ed intro

    248

    /[0-9]/

    in the late 1960s. One of the primary goals in

    /^[A-Z]/

    The Unix operating system was pioneered by Ken

    /

    Thompson and Dennis Ritchie at Bell Laboratories

    1,$s/[A-Z]/*/g

    1,$p

    *he *nix operating system was pioneered by *en

    *hompson and *ennis *itchie at *ell *aboratories

    in the late 1960s. *ne of the primary goals in

    the design of the *nix system was to create an

    environment that promoted efficient program

    development.

    ```

    ```


    *Find a line containing a digit*


    *Find a line that starts with an uppercase letter*


    *Again*


    *Change all uppercase letters to *s*


    As you’ll learn below, the asterisk is a special character in regular expressions.
    However, you don’t need to put a backslash before it in the replacement string
    of the substitute command because the substitution’s replacement string has a
    different expression language (we did mention that this can be a bit tricky at
    times, right?).


    In the ed editor, regular expression sequences such as `*`, `.`, `[...]`, `$`,
    and `^` are only meaningful in the search string and have no special meaning when
    they appear in the replacement string.


    If a caret (`^`) appears as the first character after the left bracket, the sense
    of the match is *inverted*. (By comparison, the shell uses the `!` for this purpose
    with character sets.) For example, the regular expression


    `[^A-Z]`


    matches any character *except* an uppercase letter. Similarly,


    `[^A-Za-z]`


    matches any non-alphabetic character. To demonstrate, let’s remove all non-alphabetic
    characters from the lines in our test file:


    ```

    ```text

    $ ed intro

    248

    1,$s/[^a-zA-Z]//g

    1,$p

    TheUnixoperatingsystemwaspioneeredbyKen

    ThompsonandDennisRitchieatBellLaboratories

    ```

    ```


    *Delete all non-alphabetic characters*'
