- pgno: 201
  md: "```\n```sh\n$ cat waitfor\n#\n# Wait until a specified user logs on -- version\
    \ 3\n#\n# Set up default values\n\nmailopt=FALSE\ninterval=60\n\n# process command\
    \ options\n\nwhile getopts mt: option\ndo\n        case \"$option\"\n        in\n\
    \                m) mailopt=TRUE;;\n                t) interval=$OPTARG;;\n  \
    \              \\?) echo \"Usage: waitfor [-m] [-t n] user\"\n               \
    \     echo \"    -m means to be informed by mail\"\n                    echo \"\
    \    -t means check every n secs.\"\n                    exit 1;;\n        esac\n\
    done\n\n# Make sure a user name was specified\n\nif [ \"$OPTIND\" -gt \"$#\" ]\n\
    then\n        echo \"Missing user name!\"\n        exit 2\nfi\n\nshiftcount=$((OPTIND\
    \ - 1))\nshift $shiftcount\nuser=$1\n\n#\n# Check for user logging on\n#\n\nuntil\
    \ who | grep \"^$user \" > /dev/null\ndo\n        sleep $interval\ndone\n\n#\n\
    # When we reach this point, the user has logged on\n#\n```\n```"
  merge: -1
