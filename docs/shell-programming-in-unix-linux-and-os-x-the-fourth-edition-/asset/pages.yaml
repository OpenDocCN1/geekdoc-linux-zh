    THE UNIX OPERATING SYSTEM WAS PIONEERED BY KEN

    THOMPSON AND DENNIS RITCHIE AT BELL LABORATORIES

    IN THE LATE 1960S. ONE OF THE PRIMARY GOALS IN

    THE DESIGN OF THE UNIX SYSTEM WAS TO CREATE AN

    ENVIRONMENT THAT PROMOTED EFFICIENT PROGRAM

    DEVELOPMENT.

    $

    ```

    ```


    The character ranges `[a-z]` and `[A-Z]` are enclosed in quotes to keep the shell
    from interpreting the pattern. Try the command without the quotes and you’ll quickly
    see that the result isn’t quite what you seek.


    By reversing the two arguments to `tr`, you can use the command to translate all
    uppercase letters to lowercase:


    ```

    ```text

    $ tr ''[A-Z]'' ''[a-z]'' < intro

    the unix operating system was pioneered by ken

    thompson and dennis ritchie at bell laboratories

    in the late 1960s. one of the primary goals in

    the design of the unix system was to create an

    environment that promoted efficient program

    development.

    $

    ```

    ```


    For a more interesting example, try to guess what this `tr` invocation accomplishes:


    ```

    ```text

    tr ''[a-zA-Z]'' ''[A-Za-z]''

    ```

    ```


    Figured it out? This turns uppercase letters into lowercase, and lowercase letters
    into uppercase.


    # The `-s` Option


    You can use the `-s` option to “squeeze” out multiple consecutive occurrences
    of characters in `to-chars`. In other words, if more than one consecutive occurrence
    of a character specified in `to-chars` occurs after the translation is made, the
    characters will be replaced by a single character.


    For example, the following command translates all colons into tab characters,
    replacing multiple tabs with single tabs:


    ```

    ```text

    tr -s '':'' ''\11''

    ```

    ```'
