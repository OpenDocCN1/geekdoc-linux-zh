- pgno: 194
  md: "When the break is executed, control is immediately moved outside of the loop,\
    \ where execution then continues as normal.\n\nOne common way this is used is\
    \ with an infinite loop, a block of code that is intended to go around and around\
    \ executing the same commands until break stops it.\n\nIn these situations the\
    \ command true can be used to return an exit status of zero. The command false\
    \ can be used in the opposite situation too, as it returns a nonzero exit status.\
    \ If you write\n\n```\nwhile true\ndo\n        ...\ndone\n```\n\nthe while loop\
    \ will be executed forever, because true always returns a zero exit status.\n\n\
    Because false always returns a nonzero exit status, the loop\n\n```\nuntil false\n\
    do\n        ...\ndone\n```\n\nwill also execute forever.\n\nThe break command\
    \ is therefore used to exit from these sorts of infinite loops, usually when an\
    \ error condition or the end of processing is detected:\n\n```\nwhile true\ndo\n\
    \        cmd=$(getcmd)\n\n        if [ \"$cmd\" = quit ]\n        then\n     \
    \           break\n        else\n                processcmd \"$cmd\"\n       \
    \ fi\ndone\n```\n\nHere the while loop will continue to execute the getcmd and\
    \ processcmd programs until cmd is equal to quit. At that point, the break command\
    \ will be executed, causing the loop to be exited.\n\nIf the break command is\
    \ used in the form\n\n```\nbreak n\n```\n\nthe n innermost loops are immediately\
    \ exited, so in\n\n```\nfor file\ndo\n        ...\n```"
  merge: -1
  img_proc: true
- pgno: 195
  md: "```\nwhile [ \"$count\" -lt 10 ]\ndo\n    ...\n    if [ -n \"$error\" ]\n \
    \   then\n        break 2\n    fi\n    ...\ndone\n...\ndone\n...\n```\n\nboth\
    \ the while and the for loops will be exited if error is nonnull.\n\n# Skipping\
    \ the Remaining Commands in a Loop\n\nThe continue command is similar to break,\
    \ only it doesn’t cause the loop to be exited, just the remaining commands in\
    \ the current iteration of the loop to be skipped. The program moves immediately\
    \ to the next iteration of the loop and continues as normal. Like the break, an\
    \ optional number can follow the continue, so\n\n```\ncontinue n\n```\n\ncauses\
    \ the commands in the innermost n loops to be skipped, after which execution of\
    \ the program continues as normal.\n\n```\nfor file\ndo\n    if [ ! -e \"$file\"\
    \ ]\n    then\n        echo \"$file not found!\"\n        continue\n    fi\n\n\
    \    #\n    # Process the file\n    #\n\n    ...\ndone\n```\n\nEach value of file\
    \ is checked to make sure that the file exists. If it doesn’t, a message is printed,\
    \ and further processing of the file within the for loop is skipped. Execution\
    \ continues with the next value in the list.\n\nThe preceding example is equivalent\
    \ to writing\n\n```\nfor file\ndo\n    if [ ! -e \"$file\" ]\n    then\n```"
  merge: -1
  img_proc: true
