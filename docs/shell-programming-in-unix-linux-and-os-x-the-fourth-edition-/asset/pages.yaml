  md: "the shell scans the command line and takes everything from the start of the\
    \ line to the first whitespace character as the name of the program to execute:\
    \ mv. Subsequent whitespace (the extra spaces) are ignored and the set of characters\
    \ up to the next whitespace character is the first argument to mv: tmp/mazewars.\
    \ The characters up to the next whitespace character—in this case, the newline\
    \ character—is the second argument to mv: games. After parsing the command line,\
    \ the shell then proceeds to execute the mv command, giving it the two specified\
    \ arguments tmp/mazewars and games (see Figure 2.9).\n\n![](img/29b87b4d3daf7eb41fe5066130730f4c_65_0.png)\n\
    \nFigure 2.9　Execution of `mv` with two arguments\n\nAs mentioned, multiple occurrences\
    \ of whitespace characters are ignored by the shell. This means that when the\
    \ shell processes this command line:\n\n```\necho        when        do      \
    \  we        eat?\n```\n\nit passes four arguments to the echo program: when,\
    \ do, we, and eat? (see Figure 2.10).\n\n![](img/29b87b4d3daf7eb41fe5066130730f4c_65_1.png)\n\
    \nFigure 2.10　Execution of echo with four arguments\n\nBecause echo takes its\
    \ arguments and simply displays them at the terminal, adding an individual space\
    \ between each argument, the output from the following becomes a lot more legible:\n\
    \n```\n$ echo          when    do          we    eat? \nwhen do we eat?\n$\n```\n\
    \nIt turns out the echo command never sees those blank spaces; they have been\
    \ “gobbled up” by the shell. When we discuss quotes in Chapter 5, you’ll see how\
    \ you can include blank spaces in arguments to programs, but usually having extra\
    \ vanish is exactly the behavior you want.\n\nWe mentioned earlier that the shell\
    \ searches the disk until it finds the program you want to execute and then asks\
    \ the Unix kernel to initiate its execution. This is true most of the time. However,\
    \ there are some commands that are actually built into the shell itself. These\
    \ built-in commands include cd, pwd, and echo. Before the shell searches the disk\
    \ for a command, it first determines whether it’s a built-in command, and if so\
    \ executes the command directly."
