    # paste


    The paste command is the inverse of cut: Instead of breaking lines apart, it puts
    them together. The general format of the paste command is


    ```

    ```text

    paste files

    ```

    ```


    where corresponding lines from each of the specified files are “pasted” or merged
    together to form single lines that are then written to standard output. The dash
    character - can also be used in the files sequence to specify that input is from
    standard input.


    Suppose that you have a list of names in a file called names:


    ```

    ```text

    $ cat names

    Tony

    Emanuel

    Lucy

    ```

    ```'
