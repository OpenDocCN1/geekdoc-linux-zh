- pgno: 256
  md: 'As a point of interest, Mac OS X and Ubuntu Linux users will find that the
    TERM type for the Terminal program is xterm-256color, and Solaris Unix users have
    vt100 as their default TERM. Many third party telnet/SSH (terminal) programs use
    ansi as their TERM value.


    # The TZ Variable


    The `TZ` variable is used by the date command and some Standard C library functions
    to determine the current time zone. Indeed, since users can log in remotely through
    the Internet, it’s entirely possible that different users on a system are in different
    time zones. The simplest setting for `TZ` is a time zone name of three or more
    alphabetic characters followed by a number that specifies the number of hours
    that must be added to the local time to arrive at Coordinated Universal Time,
    also known as Greenwich Mean Time. This number can be positive (local time zone
    is west of 0 longitude) or negative (local time zone is east of 0 longitude).
    For example, Eastern Standard Time can be specified as


    ```

    TZ=EST5

    ```


    The date command calculates the correct time based on this information and uses
    the time zone name in its output, as necessary:


    ```

    $ TZ=EST5 date

    Wed Feb 17 15:24:09 EST 2016

    $ TZ=xyz date

    Wed Feb 17 17:46:28 xyz 2016

    $

    ```


    A second time zone name can follow the number and if this is specified, daylight
    saving time is assumed to apply (date then automatically adjusts the time when
    daylight saving is in effect) and is assumed to be one hour ahead of the standard
    time. If a number follows the daylight saving time zone name, this value is used
    to compute the daylight saving time from the Coordinated Universal Time in the
    same way as the number previously described.


    Most commonly, you’ll see a time zone specified as EST5EDT or MST7MDT, though
    since some areas of the world don’t actually switch for DST, that can be specified
    too, of course.


    The TZ variable is usually set in either the /etc/profile file or your .profile
    file. If not set, an implementation-specific default time zone is used, typically
    Coordinated Universal Time.


    Also note that on many modern Linux systems the time zone can be set by specifying
    a geographic region, so


    ```

    TZ="America/Tijuana" date

    ```


    will show the current time in Tijuana, Mexico.'
