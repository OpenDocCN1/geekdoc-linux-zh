    \ or when they logged in. You can use the cut command to cut out just the usernames\
    \ from the who command’s output:\n\n```\n    $ who | cut -c1-8\n    root\n   \
    \ steve\n    george\n    dawn\n    $\n```\n\n*Extract the first 8 characters*\n\
    \nThe -c1-8 option to cut specifies that characters 1 through 8 are to be extracted\
    \ from each line of input and written to standard output.\n\nThe following shows\
    \ how you can tack a sort to the end of the preceding pipeline to get a sorted\
    \ list of the logged-in users:\n\n```\n    $ who | cut -c1-8 | sort\n    dawn\n\
    \    george\n    root\n    steve\n    $\n```\n\nNote, this is our first three-command\
    \ pipe. Once you get the concept of output connected to subsequent input, pipes\
    \ of three, four or more commands are logical and easy to assemble.\n\nIf you\
    \ wanted to see which terminals were currently being used or which pseudo or virtual\
    \ terminals were in use, you could cut out just the tty field from the who command\
    \ output:\n\n```\n    $ who | cut -c10-16\n    console\n    tty02\n    tty08\n\
    \    tty10\n    $\n```\n\nHow did you know that who displays the terminal identification\
    \ in character positions 10 through 16? Simple! You executed the who command at\
    \ your terminal and counted out the appropriate character positions.\n\nYou can\
    \ use cut to extract as many different characters from a line as you want. Here,\
    \ cut is used to display just the username and login time of all logged-in users:\n\
    \n```\n    $ who | cut -c1-8,18-\n    root    Feb 24 08:54\n    steve   Feb 24\
    \ 12:55\n    george  Feb 24 09:15\n    dawn    Feb 24 15:55\n    $\n```"
