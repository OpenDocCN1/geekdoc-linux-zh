    ```

    ```


    The < signals input redirection to the shell, which lacks a subsequent filename,
    hence the resultant error message.


    If you put the entire message inside single quotes, the value of x won’t be substituted
    at the end. If you enclose the entire string in double quotes, both occurrences
    of $x will be substituted. Tricky!


    Here are two different ways to properly quote the string so that everything works
    as desired:


    ```

    ```shell

    $ echo "<<< echo \$x >>> displays the value of x, which is $x"

    <<< echo $x >>> displays the value of x, which is 1

    $ echo ''<<< echo $x >>> displays the value of x, which is'' $x

    <<< echo $x >>> displays the value of x, which is 1

    $

    ```

    ```


    In the first case, everything is enclosed in double quotes, and the backslash
    is used to prevent the shell from performing variable substitution in the first
    instance of $x. In the second case, everything up to the last $x is enclosed in
    single quotes but the variable that should be substituted is added without quotes
    around it.'
