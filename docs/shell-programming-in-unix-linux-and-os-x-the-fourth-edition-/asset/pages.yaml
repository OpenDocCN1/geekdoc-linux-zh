- pgno: 193
  md: "```\n```text\n$ vi newmemo\n\nyou have mail\n$ mail\nFrom steve Wed Aug 28\
    \ 17:44:46 EDT 2002\nsandy has logged on\n\n?d\n$\n```\n```\n\n*Work continues*\n\
    \nOf course, we could have written `waitfor` to accept the -m option as either\
    \ the first or second argument, but that’s not how traditional Unix syntax works:\
    \ all options are expected to precede any other types of arguments on the command\
    \ line.\n\nAlso note that the old version of `waitfor` could have been executed\
    \ as follows:\n\n```\n```sh\n$ waitfor sandy | mail steve &\n[1] 5522\n$\n```\n\
    ```\n\nto achieve the same result as adding the -m option, but it’s considerably\
    \ less elegant.\n\nThe program always sends mail to steve as it’s written now,\
    \ which isn’t particularly useful if someone else wants to run it. A better way\
    \ is to determine the user running the program and then send them the mail if\
    \ they specify the -m option. But how do you do that? One way is to execute the\
    \ who command with the am i options and get the user name that comes back. You\
    \ can then use cut to extract the username from the who output and use that name\
    \ as the recipient of the mail.\n\nAll of this can be done in the last if command\
    \ of waitfor if it’s changed to read as shown:\n\n```\n```sh\nif [ \"$#\" -eq\
    \ 1 ]\nthen\n        echo \"$user has logged on\"\nelse\n        runner=$(who\
    \ am i | cut -cl-8)\n        echo \"$user has logged on\" | mail $recipient\n\
    fi\n```\n```\n\nNow the program can be run by anyone, and the mail notification\
    \ will be sent to the correct recipient.\n\n# More on Loops\n\n# Breaking Out\
    \ of a Loop\n\nSometimes program logic dictates an immediate exit from a loop\
    \ statement. To exit from the loop but not from the program, use the break command:\n\
    \n```\n```sh\nbreak\n```\n```"
  merge: -1
