  img_proc: true
- pgno: 374
  md: '# The `trap` Command


    *General Format:* `trap commands signals`


    This command tells the shell to execute commands whenever it receives one of the
    signals listed in signals. The listed signals can be specified by name or number.


    `trap` with no arguments prints a list of the current trap assignments.


    If the first argument is the null string, as in


    ```

    trap "" signals

    ```


    the signals in signals are ignored when received by the shell.


    If the format


    ```

    trap signals

    ```


    is used, processing of each signal listed in signals is reset to the default action.


    *Examples*


    ```

    trap "echo hangup >> $ERRFILE; exit" HUP

    trap "rm $TMPFILE; exit" 1 2 15

    trap "" 2

    trap 2

    ```


    Log message and exit on hangup

    Remove $TMPFILE on signals 1, 2, or 15

    Ignore interrupts

    Reset default processing of interrupts


    Table A.12 lists values that can be specified in the signal list.


    Table A.12  Signal Numbers and Names for `trap`


    | Signal # | Signal Name | Generated for |

    |---|---|---|

    | 0 | EXIT | Exit from the shell |

    | 1 | HUP | Hangup |

    | 2 | INT | Interrupt (for example, Delete key, Ctrl+c) |

    | 3 | QUIT | Quit |

    | 6 | ABRT | Abort |

    | 9 | KILL | Kill |

    | 14 | ALRM | Alarm timeout |

    | 15 | TERM | Software termination signal (sent by `kill` by default) |


    The shell scans commands when the `trap` command is encountered and again when
    one of the listed signals is received. This means, for example, that when the
    shell encounters the command


    ```

    trap "echo $count lines processed >> $LOGFILE; exit" HUP INT TERM

    ```'
  merge: -1
  img_proc: true
