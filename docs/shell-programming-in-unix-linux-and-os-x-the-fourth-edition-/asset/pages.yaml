- pgno: 206
  md: "Notice that if the file already exists, the echo command that prompts for the\
    \ yes/no response is executed. The read command that follows causes the shell\
    \ to wait for the user to type a response. What this shows is that the shell doesn’t\
    \ prompt the user when it’s waiting for data; it’s up to the programmer to add\
    \ a useful prompt to the program.\n\nThe data that is typed is stored in the variable\
    \ answer and is then tested against the characters yes to determine whether the\
    \ copy process should proceed. The quotes around the reference to the variable\
    \ answer in the test\n\n```\n[ \"$answer\" != yes]\n```\n\nare necessary in case\
    \ the user just presses the Enter key without typing any data. In that case, the\
    \ shell would store a null value in answer and, without the quotes, test would\
    \ issue an error message.\n\nAlso note the use of the semicolon to move the then\
    \ statements onto the same line as the if statement. This is a common shell programmer\
    \ notational trick, as mentioned in the previous chapter.\n\n# Special echo Escape\
    \ Characters\n\nA slight annoyance with mycp is that after the echo command is\
    \ run, the response typed by the user appears on the next line. This happens because\
    \ the echo command automatically adds a terminating newline character after the\
    \ last argument.\n\nFortunately, this can be suppressed if the last two characters\
    \ given to echo are the special escape characters \\\\. This tells echo to omit\
    \ the newline after displaying the last argument. If you changed the echo command\
    \ in mycp to read like this:\n\n```\necho \"$to already exists; overwrite (yes/no)?\
    \ \\\\c\"\n```\n\nThe user’s input would be typed right after the message on the\
    \ same line. Bear in mind that the \\\\c is interpreted by echo and not by the\
    \ shell, meaning that it must be quoted so that the backslash makes it to echo.\n\
    \n> **Note**\n> \n> Some Linux and Mac OS X systems have shells that don’t interpret\
    \ these echo escape characters, so the above would be shown as\n> \n> `newfile.txt\
    \ already exists; overwrite (yes/no)? \\c`\n> \n> If testing reveals that your\
    \ shell works like that, change those specific invocations of echo to the separate\
    \ program `/bin/echo` and they’ll work fine. All your other echo statements can\
    \ remain as just regular echo commands, of course.\n\nThe echo command can also\
    \ interpret other special characters (see note if yours doesn’t work as expected).\
    \ These must each be preceded by a backslash and are summarized in Table 9.1."
  merge: -1
  img_proc: true
- pgno: 207
  md: "Table 9.1 *echo* **Escape Characters**\n\n| Character | Prints |\n|---|---|\n\
    | `\\\\b` | Backspace |\n| `\\\\c` | The line without a terminating newline |\n\
    | `\\\\f` | Formfeed |\n| `\\\\n` | Newline |\n| `\\\\r` | Carriage return |\n\
    | `\\\\t` | Tab character |\n| `\\\\\\\\` | Backslash character |\n| `\\\\0nnn`\
    \ | The character whose ASCII value is *nnn*, where *nnn* is a one- to three-digit\
    \ octal number |\n\n# ## An Improved Version of `mycp`\n\nSuppose that you have\
    \ a program called `prog1` in your current directory and you want to copy it into\
    \ your bin directory. With the regular `cp` program, you could use the shortcut\
    \ of just specifying the destination directory to have the file copied there with\
    \ its existing filename. But take another look at the `mycp` program and determine\
    \ what happens if you type in\n\n```\nmycp prog1 bin\n```\n\nThe `-e` test on\
    \ `bin` will succeed (because `-e` tests for existence of a file), and `mycp`\
    \ will display the \"already exists\" message and wait for a yes/no answer. That’s\
    \ a dangerous mistake, particularly if the user types yes!\n\nIf the second argument\
    \ is a *directory*, `mycp` should instead check to see whether the `from` file\
    \ exists *inside* the specified directory.\n\nThe next version of `mycp` performs\
    \ this check. It also has the modified `echo` command that includes the `\\\\\
    c` to suppress the terminating newline.\n\n```\n```sh\n$ cat mycp\n#\n# Copy a\
    \ file -- version 2\n\nif [ \"$#\" -ne 2 ] ; then\n        echo \"Usage: mycp\
    \ from to\"\n        exit 1\nfi\n\nfrom=\"$1\"\nto=\"$2\"\n```\n```"
  merge: -1
