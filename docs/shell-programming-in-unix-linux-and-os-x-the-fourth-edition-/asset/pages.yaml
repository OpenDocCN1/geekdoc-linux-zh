    *See what happened*


    Stromboli Pizza was quoted so that the shell passed it along to add as a single
    argument (what would have happened if it wasn''t quoted?). After add finished
    executing, lu was run to see whether it could find the new entry, and it did.
    The cat command was executed to see what the modified phonebook file looked like.
