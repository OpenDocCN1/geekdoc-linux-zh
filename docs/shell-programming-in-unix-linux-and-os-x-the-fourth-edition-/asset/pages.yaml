- pgno: 300
  md: "The rem program collects all matching entries into a temporary file, then tests\
    \ the result. If the size of the file is zero, no match was found and an error\
    \ message is issued. Otherwise, for each matching entry, the program displays\
    \ the entry and asks the user whether that entry should be removed.\n\nFrom a\
    \ user experience perspective, this type of coding practice provides reassurance\
    \ to the user that the entry they intend to remove is the same one that the program\
    \ is going to remove, even in the single match case.\n\nAfter the user has answered\
    \ the prompt with y, a break command exits the loop. Outside the loop, the program\
    \ then tests the value of answer to determine how the loop was exited. If its\
    \ value is not equal to y, then the user doesn’t want to remove an entry after\
    \ all (for whatever reason). Otherwise, the program proceeds with the requested\
    \ removal by grep-ing all lines that don’t match the specified pattern. Note that\
    \ grep matches only entire lines by anchoring the regular expression to the start\
    \ and end of the line.\n\nNote also that in the edge case of the user removing\
    \ the last entry in their phonebook, the script now recognizes the situation (by\
    \ testing to see if the file exists and is non-zero in size) and outputs an informative\
    \ message. It’s not an error, but it ensures that the failure message that would\
    \ otherwise be triggered by the grep -v invocation isn’t displayed.\n\n# change\n\
    \n```\n#\n# Change an entry in the phone book\n#\n\nname=$1\n\n#\n# Get matching\
    \ entries and save in temp file\n#\n\ngrep -i \"$name\" $PHONEBOOK > /tmp/matches$$\n\
    if [ ! -s /tmp/matches$$ ]; then\n        echo \"I can't find $name in the phone\
    \ book\"\n        exit 1\nfi\n\n#\n# Display matching entries one at a time and\
    \ confirm change\n#\n\nwhile read line\ndo\n        display $line\n        echo\
    \ \"Change this entry (y/n)? \\c\"\n```"
  merge: -1
  img_proc: true
- pgno: 301
  md: "```\n```sh\nread answer < /dev/tty\n\nif [ \"$answer\" = y ] ; then\n     \
    \   break\nfi\ndone < /tmp/matches$$\n\nrm /tmp/matches$$\n\nif [ \"$answer\"\
    \ != y ] ; then\n        exit\nfi\n\n#\n# Start up editor on the confirmed entry\n\
    #\n\necho \"$line\\c\" | tr '^l' '\\012' > /tmp/ed$$\n\necho \"Enter changes with\
    \ ${EDITOR:=/bin/vi}\"\ntrap \"\" 2   # don't abort if DELETE while editing\n\
    $EDITOR /tmp/ed$$\n\n#\n# Remove old entry now and insert new one\n#\n\ngrep -i\
    \ -v \"^$line$\" $PHONEBOOK > /tmp/phonebook$$\n{ tr '\\012' '\\c' /tmp/ed$$;\
    \ echo; } >> /tmp/phonebook$$\n# last echo was to put back trailing newline translated\
    \ by tr\n\nsort /tmp/phonebook$$ -o $PHONEBOOK\nrm /tmp/ed$$ /tmp/phonebook$$\n\
    ```\n```\n\nThe change program allows the user to edit an entry in the phone book.\
    \ The first portion of the code ends up virtually identical to rem; it finds the\
    \ matching entries and then prompts the user to select which one to change.\n\n\
    The selected entry is then written into the temporary file /tmp/ed$$, with the\
    \ ^ characters translated to newlines. This “unfolds” the entry into separate\
    \ lines to be consistent with how rolo displays the entry and for easier editing.\
    \ The program then displays the message echo \"Enter changes with ${EDITOR:=/bin/vi}\"\
    .\n\nThis serves a dual purpose: it tells the user which editor will be used to\
    \ make the change and sets the variable EDITOR to /bin/ed via if it's not already\
    \ set. This technique allows the user to use their preferred editor by simply\
    \ assigning its name to the variable EDITOR before executing rolo:\n\n```\n```sh\n\
    $ EDITOR=emacs rolo\n```\n```"
