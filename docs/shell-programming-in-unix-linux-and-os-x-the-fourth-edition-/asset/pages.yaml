- pgno: 135
  md: "Remember that the shell is responsible for executing the command enclosed between\
    \ the parentheses. The only thing the echo command sees is the output that has\
    \ been inserted by the shell.\n\n> **Note**\n> \n> Those leading spaces produced\
    \ by the `wc` command in the above example are a constant source of annoyance\
    \ for programmers. Can you think of a way to use `sed` to remove them?\n\nSuppose\
    \ that you're writing a shell program and want to assign the current date and\
    \ time to a variable called now.\n\nCommand substitution can be used for this:\n\
    \n```\n```sh\n$ now=$(date)                         Execute date and store the\
    \ output in now\n$ echo $now                            See what got assigned\n\
    Wed Aug 28 14:47:26 EDT 2002\n$\n```\n```\n\nWhen you enter\n\n```\n```sh\nnow=$(date)\n\
    ```\n```\n\nthe shell understands that the entire output from date is to be assigned\
    \ to now. Therefore, you don’t need to enclose `$(date)` inside double quotes,\
    \ though it’s a common practice.\n\nEven commands that produce more than a single\
    \ line of output can be stored inside a variable:\n\n```\n```sh\n$ filelist=$(ls)\n\
    $ echo $filelist\naddresses intro lotsaspaces names nu numbers phonebook stat\n\
    $\n```\n```\n\nWhat happened here? You end up with a horizontal listing of the\
    \ files even though the newlines from `ls` were stored inside the `filelist` variable.\
    \ The newlines got eaten up at display time when the value of `filelist` was substituted\
    \ by the shell in processing the `echo` command line. Double quotes around the\
    \ variable will preserve the newlines:\n\n```\n```sh\n$ echo \"$filelist\"\naddresses\n\
    intro\nlotsaspaces\nnames\nnu\nnumbers\nphonebook\nstat\n$\n```\n```"
  merge: -1
