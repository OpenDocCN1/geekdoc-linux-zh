- "# LINUX：初学者指南\n\n\n\n![](img/cover.jpeg)\n\n\n## 致谢\n首先，我要感谢上帝赋予我知识和灵感，让我完成了这本内容丰富的手籍。我也想感谢我的父母、兄弟们以及我的伴侣\
  \ Silvia 的支持。\n\n\n\n# 引言\n你好！祝喜你购买了这本书。你在获取 Linux 新知识方面做了一项非常棒的投资。\n我叫 Felix Alvaro，是一名网络营销人员、企业家和作家，我的使命是通过我的书籍分享我的知识和经验，激励并启发你实现目标。\n\
  因为你对这本书感兴趣，我假设你已经听说过 Linux。虽然它不是大多数个人电脑上最流行的操作系统，但 Linux 绝对是最强大的。这里有一个冷知识：世界上 98.8%\
  \ 最快的系统（如超级计算机）使用 Linux 内核。如果它们都在用，你为什么不也用呢？\n除了个人在自己的电脑上使用它之外，自从大公司采用开源操作系统作为服务器以来，对\
  \ Linux 管理员的需求一直非常高。\n无论你是买这本书是为了首次体验使用 Linux，还是计划未来获得 Linux 专业认证，购买这本书都绝对让你走在了正确的道路上。我可以承诺，这本书将为你提供所需的信息，帮助你入门并在\
  \ Linux 知识道路上不断进步。\n一旦你熟悉了系统的功能，上手 Linux 是很容易的。在本指南中，我将用简单的方法为你拆解一切，让你能够快速掌握所有内容。我并不假设你已经具备某些知识，因此对我教的每一个概念都会进行详细说明。\n\
  \n# 第一章：入门\n## 什么是操作系统？\n一台电脑，包括它的所有部分——`CPU`、鼠标、显示器和键盘——如果没有将它们所有组合在一起的中央程序是无法工作的。操作系统，简称为\
  \ `OS`，是将计算机硬件与你想在上面安装的不同程序结合在一起的软件。当你启动一台没有 `OS` 的电脑时，你会被引导到 `command prompt`（命令行提示符），这对于大多数计算机用户来说没有任何意义。你将无法观看视频、听音乐、编辑照片或简单地写笔记。\n\
  \n操作系统负责执行以下任务：\n* **检测硬件** – `OS` 负责在启动期间验证计算机组件（硬盘、`CPU`、网卡、鼠标等），并加载相应的硬件驱动程序和模块，以便硬件能够正常运行。\n\
  * **管理进程** – 类似于我们大脑的工作方式，电脑上同时运行着多个进程或应用程序。`OS` 负责分配 `CPU 资源`。`OS` 还为用户提供启动、停止或重启进程的选项。\n\
  * **管理内存** – 每个应用程序都需要特定数量的 `RAM` 和交换内存才能运行。`OS` 负责分配内存空间并处理内存请求。\n* **启动用户界面**\
  \ - `OS` 为用户提供通过 `command line`（命令行）或图形用户界面（`GUI`）访问系统的方法。\n* **建立文件系统** – `OS`\
  \ 处理文件管理（访问、目录和结构），包括对文件系统的访问。\n* **管理访问和用户验证** – `OS` 允许创建具有不同权限的用户账户，以访问文件和进程。\n\
  * **为管理用途提供平台** – 计算机的 `OS` 为管理员提供了添加用户、分配磁盘空间、安装软件以及执行管理计算机活动的平台。\n* **启动服务** –\
  \ `OS` 管理在后台运行的几个进程，这些进程被称为守护进程（daemon processes）。\n\n让我们来看一个我们都能熟悉的场景——工作中的经理。`OS`\
  \ 就像一个经理，负责监督团队的不同部分、分配任务、分发工作量并检查每个人的表现。虽然团队的每个成员都有特定的工作职责，但经理能保持团队凝聚在一起工作。\n\n\
  你可能听过的操作系统示例有 `Windows 10`（及其前身版本）、`Mac OS X Yosemite`（以及之前的版本）和 `Unix`。\n\n\n\n\
  \n\n那么 Linux 处于什么位置呢？我们将在下一节中讨论它。\n\n## 什么是 Linux？\n\nLinux 是一种操作系统，与上一节提到的示例类似，通常被描述为类\
  \ Unix 系统。\n\nLinux 与其他操作系统之间的显著区别在于，Linux 是一个开源操作系统。这意味着 Linux 是通过协作持续开发的，不像 `Windows`\
  \ 和 `OS X` 它们都绑定在各自的公司（`Windows` 和 `Apple`），没有一家公司拥有 `Linux` 的开发和支持权。构建 Linux 是一个共同的愿景，不同的公司共享研究、开发和相关成本。公司与开发者之间的这种开源合作使得\
  \ Linux 成为从小型数字腕表到服务器和超级计算机等领域最优秀的生态系统之一。根据统计，每发布一个内核版本，至少有 100 多家公司和超过 1000 多名开发者在共同工作。\n\
  \nLinux 由一个内核（核心控制软件）以及许多提供不同功能的库和实用程序组成。Linux 通过许多发行版提供，这些就是我们可以称的 Linux 变（flavours）。发行版是特定内核和程序的组合。最流行的发行版包括\
  \ `Arch`、`SUSE`、`Ubuntu` 和 `Red Hat`。本书侧重于大多数 Linux 发行版具备的功能，尽管这些发行版有时会有自己特定的工具。\n\
  \n该操作系统最初用作服务器操作系统，后来被作为 Android 开发的基础。直到目前，Linux 在服务器操作系统方面拥有最大的市场份额，但在个人和家庭使用（如桌面电脑和笔记本电脑）方面是最不受欢迎的。在接下来的几节中，我们将深入讨论\
  \ Linux 比其他操作系统更好的原因。\n\n除了操作系统执行的任务外，Linux 还具有以下特点：\n\n* 支持集群 – 可以配置多个 Linux 系统，使其从外部看起来像一个单一系统。服务可以在集群之间进行配置，并仍然提供无缝的用户体验。\n\
  * 运行虚拟化 – 虚拟化允许一台计算机在用户看来是几台计算机。Linux 可以被配置为虚拟化主机——你可以在其中运行其他操作系统，如 `Windows`、`Mac\
  \ OS` 或其他 Linux 系统。所有虚拟化系统在外部看来都是独立的系统。\n* 云计算 – Linux 可以处理复杂的、大规模的虚拟化需求——包括虚拟网络、网络存储和虚拟机。\n\
  * 存储选项 – 数据并不总是需要存储在你的计算机硬盘上。Linux 提供了不同的本地和网络存储选项，如 `Fibre Channel` 和 `iSCSI`。\n\
  \n由于上述应用较为高级，我将不会详细讨论这些功能。然而，这些在将 Linux 与其他操作系统进行比较时是有益的。\n\n## Linux 历史\n\n来自芬兰的学生林纳斯·本尼迪特·托瓦尔斯（Linus\
  \ Benedict Torvalds）于 1991 年使用 `C` 语言和汇编创建了 Linux。Linux 是作为一个免费、开源、开放许可的操作系统开发的，这允许全球的开发者研究和修改该操作系统。自从\
  \ 1991 年发布初始源代码以来，它在 `GNU General Public License` 下已增长到超过 1800 万行代码。\n\n最初，托瓦尔斯将他发明的操作系统命名为\
  \ `Freax`，这是“free”（免费）、“freak”（怪胎）和“x”几个词的组合。他将文件上传到 FTP 服务器上，他的同事 Ari Lemmke 是该\
  \ FTP 服务器的管理员。Lemmke 认为 `Freax` 听起来不太好，因此在没有告诉托瓦尔斯的情况下将文件夹重命名为 `Linux`。后来，托瓦尔斯批准了这一更更改。\n\
  \n1992 年，Linux 在 `GNU GPL` 下获得许可，第一批 Linux 发行版（称为 distro）被创建——`Boot-root`、`MCC Interim\
  \ Linux`、`Softlanding Linux System (SLS)` 和 `Yggdrasil Linux`，其中最早几个之一是同年发布的。随着时间的推移，创建了多个发行版：`Slackware`\
  \ - 最老的现有发行版，`Debian` - 最大的社区发行版，以及商业发行版 `Red Hat` 和 `SUSE`。\n\n近年来，Linux 经历了更多发展。Linux\
  \ 的服务器市场收入已经超过了 `Unix`。基于 Linux 的移动操作系统 `Android` 已获得了 75% 的市场份额。2015 年，`Linux Kernel\
  \ Version 4.0` 发布。\n\n通过协作工作，Linux 现在是世界上强大的操作系统之一。数据显示，世界上最快的系统中 98.8% 使用 Linux\
  \ 内核。知道你正在使用与这些超级计算机相同的操作系统，难道不令人欣慰吗？\n\n## Linux 与其他操作系统\n\n现在，让我们来看重要的问题：Linux\
  \ 比其他的好吗？让我们将 Linux 与其他著名的操作系统进行比较。\n\n### 成本\n如果你合法获得 `Windows`，你将支付超过 100 美元，Pro\
  \ 版更贵。相反，Linux 是免费的。对于 Linux 商业发行版，公司销售支持和文档等服务，但操作系统本身是免费的。\n\n### 病毒\nLinux 几乎没有任何病毒。由于大多数\
  \ PC 运行在 `Windows` 上，攻击者的目标是 `Windows OS`。Linux 的开源政策是关键。由于许多开发者在 Linux 上工作，有更多的眼睛关注安全漏洞。如果真的出现了\
  \ Linux 病毒，也有很多帮助。专有操作系统与其雇佣的工程师数量和拥有的资源挂钩。对于 Linux，世界各地的任何开发者都可以下载下载源代码并帮助发现和解决缺陷。\n\
  \n### 系统稳定性\n如上一节所述，Linux 被用于服务器和超级计算机。大规模系统可以运行多年而无需重启。进行适当重启的时间是在内核升级期间——即使是对运行在\
  \ Linux 服务器上的软件进行升级，也只执行服务重启，而不是节点重启。\n\n与之相比，想想你经历过因程序崩溃而丢失数据的次数，或者当你插入设备并在 `Windows`\
  \ 中看到“蓝屏”的时间。我不是说在运行 Linux 运行时你不会关闭电脑，但如果你愿意，这个选项是存在的。\n\n### 安装\n当你安装 Linux（其任何变体——`Ubuntu`、`Fedora`\
  \ 等），你将获得所有需要的东西——文本编辑器、电子表格、演示文程序、照片编辑器、网络浏览器、电影播放器、PDF 阅读器等。与 `Windows` 和其他操作系统相比，一旦设置好操作系统，你必须一个一个地安装你需要的所有其他软件。\n\
  \n对于硬件驱动程序也是如此。在 `Windows` 中，你必须先安装驱动程序。购买硬件时，驱动程序通常随光盘提供。现在，想想当你需要安装驱动程序却找不到光盘的时候？你必须去制造商的网站下载特定的驱动程序。在\
  \ Linux 中，驱动程序包含在 `Linux Kernel` 安装包中——你可以节省时间，而且方便得多。\n\n### 支持\nLinux 有一个庞大的在线社区，新用户可以在那里获取信息、阅读常见问题（FAQ），并在认为某些程序或功能运行不正常时提问。开源的伟大之处在于，由于有很多人参与该操作系统，有无限的资源供你使用和学习。所有这些都是免费的！\n\
  \n这些是 Linux 比其他操作系统更好的原因之一。但是，请注意 Linux 使用的是开源软件，所以如果你对下面列出的任何项目表示担忧，那么你应该坚持使用 `Windows`\
  \ 或你目前的操作系统：\n\n\n\n\n\n-   你需要使用专有软件进行工作。如果你绝对无法找到匹配你所需的专有软件的开源程序，请保留你当前的操作系统。\n\
  -   你是一名硬核玩家。大多数游戏仅与 Windows 兼容。\n-   Linux 尚未支持某些硬件。一些在最近几个月内发布的非常新的硬件，Linux 可能尚未对其其支持。硬件供应商通常只为\
  \ Windows 和 Mac 发布驱动程序，因为它们最受欢迎。\n\n大多数安装了 Linux 的个人都会通过所谓的“双启动”来解决这些问题。双启动是在你的设备上同时安装\
  \ Windows 和 Linux 的选项，这样你就可以根据需要选择任一操作系统了。\n\n在本章中，我们讨论了 Linux 操作系统可以做什么，以及它与其他现有操作系统的对比。在下一章中，我们将深入理解\
  \ Linux 操作系统是如何运作的。\n\n# 第二章：理解 Linux\n\n在本章中，我将提供关于该操作系统架构的简要信息，并讨论初学者可以选择的不同 Linux\
  \ 版本（flavours）。\n\n## Linux 架构\n\nLinux 架构可以分为两部分：用户空间（User Space）和内核空间（Kernel Space）。\n\
  \n-   **用户空间 (User Space)** – 这是运行应用程序的地方。用户空间中的 GNU C 库是连接到内核并在用户空间与内核空间之间切换的接口。它使用所有可用内存。\n\
  -   **内核空间 (Kernel Space)** – 所有内核服务都在这里处理。内核空间进一步分为 3 部分：\n    -   **系统调用接口 (System\
  \ Call Interface)** – 用户进程可以通过系统调用访问内核空间。当执行系统调用时，参数从用户空间传递到内核空间。这是实现基本函数的层。\n \
  \   -   **内核代码 (Kernel Code)** – 这是与架构无关的代码，可见于 Linux 支持的所有架构中。\n    -   **依赖架构内核代码\
  \ (Architecture-Dependent Kernel Code)** – 这是针对特定平台的代码层。\n\n![](img/00044.jpeg)\n\
  \n图 1：Linux 架构\n\n## Linux 发行版\n\n每个 Linux 发行版都由 Linux 内核加上工具和配置文件组成。大多数 Linux 发行版都可以从它们的官方网站下载。\n\
  \n让我们根据以下标准来看看几个流行的 Linux 发行版（或版本）之间有什么区别：\n\n### 可用性\n\n如前所述，Linux 是一款免费软件，但提供支持合同和专有组件的公司会收取费用提供它。在下表中，红帽企业版和\
  \ SUSE 企业版都提供商业 Linux，但它们也有免费替代方案——`Fedora` 和 `openSUSE`。\n\n### 软件包格式\n\nLinux\
  \ 发行版以包的形式出现。包是分组在单个文件中的文件。`RPM` 是最常用的。\n\n### 发布周期\n\n这是发行版发布新软件的频率。发布周期较短的发行版能在最短时间内提供最新的软件，而发布周期较长的发行版旨在提供尽可能稳定的环境。一个发行版可以同时采用这两种方式。看看\
  \ `Ubuntu`，它既发布长期支持（LTS）版本（周期较长），也通过 6 个月的周期发布最新软件。\n\n| 发行版 | 可用性 | 软件包格式 | 发布周期\
  \ |\n| :--- | :--- | :--- | :--- |\n| Arch | 免费 | `pacman` | 滚动更新 |\n| CentOS |\
  \ 免费 | `RPM` | 约 2 年 |\n| Debian | 免费 | `Debian` | 2 年 |\n| Fedora | 免费 | `RPM`\
  \ | 约 6 个月 |\n| Gentoo | 免费 | `ebuild` | 滚动更新 |\n| Mint | 免费 | `Debian` | 6 个月 |\n\
  | openSUSE | 免费 | `RPM` | 8 个月 |\n| Red Hat Enterprise | 商业 | `RPM` | 约 2 年 |\n\
  | Scientific | 免费 | `RPM` | 约 6 个月 |\n| Slackware | 免费 | `tarballs` | 不定期 |\n| SUSE\
  \ Enterprise | 商业 | `RPM` | 2-3 年 |\n| Ubuntu | 免费 | `Debian` | 6 个月 |\n\n表 1：流行\
  \ Linux 发行版对比\n\n为了帮助你决定哪种是适合你的发行版，请考虑上述标准并对下方列出的其他领域进行研究：\n\n-   **桌面环境**：进行研究并看看你中中的特定发行版是否具有你喜欢的界面外观和感受，并检查它的可定制程度。\n\
  -   **硬件兼容性**：取决于你使用的硬件，在你安装发行版时，某些驱动程序可能尚未可用。先检查在线资源，以了解哪些可以开箱即用。\n-   **社区支持**：寻找拥有大型在线社区的发行版。社区越大，查找文档和获取支持就越越容易。\n\
  \n我个人向从未用过 Linux 的人推荐 Linux Mint。它的安装简单且无麻烦，而且菜单很熟悉（见下图）。它还额外赠送了预装的某些专有软件（例如 Adobe\
  \ Flash、MP3 支持）。\n\n![](img/00001.jpeg)\n\n图 2：Mint 桌面\n\n一旦你熟悉了 Mint 并觉得想尝试其他发行版，我建议将\
  \ `Ubuntu` 作为你的下一个发行版。`Ubuntu` 让 Linux 对经验丰富的普通用户来说易于使用。该发行版还带有一套标准程序，让你在安装后就能开始工作。\n\
  \n![](img/00005.jpeg)\n\n图 3：Ubuntu 发行版\n\n在本章中，我们讨论了构成 Linux 的不同组件，并涉及了流行发行版之间的差异。希望这能帮助你找到想要开始\
  \ Linux 体验的发行版。在下一章中，我将带你完成 Linux 的安装过程。\n\n# 第三章：Linux 安装\n\n在本章中，我们将讨论如何在你的计算机上最终安装\
  \ Linux。根据你希望的设置，你可以清空硬盘并替换操作系统，也可以与 Linux 共享磁盘。\n\n## 在你的 PC 上安装 Linux\n\n对于初学者来说，有两种方法可以尝试\
  \ Linux 的魅力。\n\n首先，你可以获取一个 Live CD。如果你想在不触动当前操作系统的情况下先尝试 Linux，那么这是最佳选择。使用 Live\
  \ CD 允许你从光盘/USB 启动并使用 Linux。完成后，移除光盘/USB 并重启电脑即可使用你当前的操作系统。\n\n其次，你可以直接在计算机上安装 Linux，可以是独立安装，也可以与现有的操作系统共享。后者需要几个步骤来完成硬磁盘分区。\n\
  \n## 安装前的步骤\n\n在继续安装之前，先检查你的 PC 硬件是一个好主意。你可以查看硬件供应商的网站检查兼容性列表。\n\n-   **DVD 光驱**：为了安装\
  \ Linux，你必须有一个 DVD 光驱，并且你的计算机必须能够从该驱动器启动。如果你的硬盘控制器是 `IDE/ATA` 或 `USB DVD`，这在 Linux\
  \ 中可行。\n-   **硬盘**：如果你将使用 Live CD，则不需要。如果你将安装 Linux，最好至少有 4GB 的磁盘空间。Linux 支持 `IDE`\
  \ 和 `SCSI` 硬盘控制器。\n-   **键盘**：所有键盘均可在 Linux 使用。\n-   **显示器**：大多数发行版安装程序都能检测现代显示器。如果你发现显示不好，请选择显示器类型和特定的分辨率（1024x768）。\n\
  -   **鼠标**：`PS/2` 或 `USB` 鼠标均可在 Linux 使用。\n\n\n\n\n\n### 硬件要求\n\n- **网卡**: 安装程序可以检测大多数网卡。如果你发现某个网卡在使用时遇到问题，请在网上查找额外信息。\n\
  - **处理器**: 要求的最低速度为`700 MHz`。如今新处理器的速度远高于此值。从速度而言，数字越高越好。\n- **内存 (RAM)**：内存越大越好。最低要求为`512MB`。请检查你特定发行版对应的内存——其他发行版可能需要更大的内存分配。\n\
  - **声卡、显卡、打印机**: 确保这些设备与 Linux 兼容。请参考硬件供应商网站获取更多信息。\n\n### 为 Linux 准备空间\n\n如果你选择在不移除当前操作系统的情况下安装\
  \ Linux，请注意，你现有的操作系统使用了整个硬盘。这意味着 Linux 和你当前的操作系统需要共享硬盘，以便两个操作系统能够共存。你将需要对硬盘进行分区和划分。如果你选择此路线，请务必备份你的系统，因为存在擦除硬盘上数据的风险。\n\
  \n为了方便分区，你可以获取运行在 Windows 上的硬盘分区产品，或者使用大多数 Linux 发行版带的名为 `QTParted` 的图形界面工具。某些发行版（如\
  \ `openSUSE` 或 `Xandros Desktop`）可以缩小 Windows 分区并自动为 Linux 创建分区。如果你的发行版提供此功能，你将不再需要分区工具。\n\
  \n### Ubuntu 分区步骤\n\n一旦 Ubuntu 启动并出现 GUI 桌面，请按照以下步骤缩小 Windows 分区的大小：\n\n1. 从 Ubuntu\
  \ 桌面点击 `System ➪Administration➪GParted`。`GParted` 窗口将出现，并显示在你的 PC 上找到的驱动器。你看到的第一个硬盘设备名为\
  \ `/dev/sda`，下一个命名为 `/dev/sdb`，以此此类推。\n2. 在 `GParted` 窗口的右侧，从设备列表中选择。\n3. 选择你想调整大小的分区。你需要寻找最大的分区。\n\
  4. 从 `GParted` 菜单中选择 `Resize/Move`（调整大小/移动）。\n5. 指定分区的新大小，然后点击 `Resize/Move`。指定的大小应在分区后为你留出\
  \ `4GB` 或更多的可用磁盘空间。\n6. 点击 `Apply`（应用）开始应用你所做的更改。\n\n在硬盘上获得 Linux 所需的空闲空间后，你现在开始安装你选择的\
  \ Linux 发行版。\n\n## 安装步骤\n\n访问 Linux 发行版网站并下载发行版文件。你下载的文件将带有安装步骤。在本节中，我们将讨论任何 Linux\
  \ 发行版的通用安装步骤。\n\n- **第 1 步**:准备你的 CD/DVD 安装器或 Live CD。下载你计划安装的发行版副本并将其刻录到 CD/DVD\
  \ 中。\n- **第 2 步**:确保你的 PC 可以从 CD/DVD 驱动器启动。如果在驱动器中有 CD/DVD 的情况下你的 PC 仍然从硬盘启动，请先更改\
  \ `Boot Devices`（启动设备）。进入 `BIOS` 并更改启动顺序——将 `CD/DVD drive` 选择为第一个启动项。你可以通过重启 PC\
  \ 并按键（大多数电脑上为 `F2` 或 `Del`）进入 `Setup`（设置）菜单。核实你电脑品牌和型号对应的按键。一旦完成将 `CD/DVD drive`\
  \ 分配为启动项，将光盘放入驱动器并重启电脑。\n- **第 3 步**: 如果使用的是 Live CD，请重启电脑。电脑将启动并从你的 Live CD 加载操作系统。如果你正在安装\
  \ Linux，第 3 步是为硬盘划分分区。分区的一个选项已在上一节中描述过。\n\n一旦你已经设置好分区，请从 CD/DVD 驱动器启动电脑并继续安装。虽然安装过程因发行版而异，但这些通常是简单且直接的步骤。参考随文档附带的安装屏幕，你应该可以在一到两小时内完成。\n\
  \n安装过程中还会有一些配置步骤，例如设置日期和时间、语言以及选择要安装的软件包。\n\n安装完成后，重启你的电脑。\n\n## 安装故障排除\n\n我们都希望安装顺利，但万一事不如人意，这里有一些你可以检查的初始故障排除提示。\n\
  \n### 安装程序无法启动 X Window\n\nX Window 是许多 Linux 发行版包含的图形用户界面。如果安装程序没有检测到显卡或由于任何其他原因安装程序未能启动\
  \ X，你可以选择文本模式安装。\n\n请参考下表获取访问文本模式安装界的不同方法。\n\n| 发行版 | 如何访问文本模式安装 |\n| :--- | :---\
  \ |\n| Debian | 默认为文本模式 |\n| Fedora | 看到 `boot:` 提示时输入 `text` |\n| SUSE | 按 `F3`\
  \ 并使用方向键选择 `Text-Mode` 。按回车。 |\n| Ubuntu | 默认为文本模式 |\n| Xandros | 从 CD/DVD 驱动器重启时按住\
  \ `Shift` 键。选择 `Rescue Console`（救援控制）。看到 `bash` 提示时输入 `quick_install`。 |\n\n**表\
  \ 2：安装期间如何访问文本模式**\n\n你的发行版不在列表中吗？请在网上查找如何为你的发行版启动文本模式安装。\n\n文本模式安装界面与安装屏幕类似，你必须根据提示执行操作。一旦进入文本模式，请仔细阅读提示。\n\
  \n### 安装后 X 无法工作\n\n如果你在安装期间看到了 GUI，但在首次重启后遇到了灰色屏幕或黑屏，这里是你可以使用的一些步骤。\n\n1. 重启 PC。按\
  \ `Ctrl+Alt+Delete`。\n2. 一旦 PC 启动，如果发行版使用 `GRUB`，按 `A` 键。如果是 `LILO`，则跳过此步。`GRUB`\
  \ 引导程序将显示 Linux 内核的命令行并要求你添加内容。对于 `GRUB`，输入空格以及 `single`。按回车。对于 `LILO`，输入 `Linux\
  \ single` 然后按回车。Linux 内核将以单用户模式启动并显示以下提示：\n```\nsh-3.0#\n```\n一旦看到此提示，你现在可以配置 X。\n\
  \n取决于你使用的发行版，X 使用配置文件来设置显示卡、显示器和分辨率。问题有时发生在 Linux 安装程序的 X 配置不正确。\n\n通过创建一个有效的配置文件来解决这个问题：\n\
  \n1. 输入命令：\n```\nX -configure\n```\n一旦输入此命令，X 服务器将创建一个配置文件。你会看到屏幕变空并显示消息。\n2. 使用文本编辑器\
  \ `vi` 编辑文件 `/etc/xorg.conf.new`。在 `Section \"Files\"` 下插入以下行：\n```\nFontPath \"\
  unix/:700\"\n```\n使用 Fedora 时，你还需要将 `/dev/mouse` 修改为 `/dev/input/mice`。\n3. 输入命令启动\
  \ X 字体服务器：\n```\nxfs\n```\n4. 输入以下行启动新的配置文件：\n```\nX -config /etc/xorg.conf.new\n\
  ```\n一旦看到带有 X 光标的空白屏幕，说明配置文件工作正常。\n5. 使用 `Ctrl+Alt+Backspace` 停止 X 服务器。\n6. 输入以下命令将配置文件复制到\
  \ `/etc/X11` 目录：\n```\ncp /etc/xorg.conf.new /etc/X11/xorg.conf\n```\n7. 输入 `reboot`\
  \ 或按 `Ctrl+Alt+Delete` 重启电脑。\n\n如果配置文件更改顺利，登录界面将会出现。\n\n\n\n\n\n大多数（如果不是全部）Linux\
  \ 发行版都有活跃的在线社区。如果你在安装过程中遇到问题，请搜索该问题、详细描述它或使用实际错误信息作为搜索关键词。你将找到所需的信息；如果没有，你也可以在论坛中发帖，社区随时准备为你提供帮助。\n\
  \n访问以下论坛获取更多信息：\n\n- Ubuntu: [`ubuntuforums.org/`](http://ubuntuforums.org/)\n-\
  \ Linux Mint: [`linuxmint.com/forum/`](http://linuxmint.com/forum/)\n- SUSE: [`forums.suse.com/forum.php`](https://forums.suse.com/forum.php)\n\
  - Debian: [`www.debianhelp.org/`](http://www.debianhelp.org/)\n\n***\n\n在本章中，我们讨论了\
  \ Linux 的正规安装。现在你的电脑上已经有了 Linux，我们将带你完成第一次 Linux 体验。\n\n# 第四章：你的第一次 Linux 体验\n\n\
  现在你的 Linux 系统已经在电脑上运行了，让我们开始探索这个系统吧。\n\n## 启动你的电脑\n\n一旦开启电脑，引导程序——无论是 `GRUB` 还是\
  \ `LILO`——就会启动并显示电脑中安装的操作系统名称。使用方向键选择你想要加载的操作系统。这适用于安装了两个操作系统的电脑。如果 Linux 是你电脑上唯一的操作系统，请等待几秒钟让引导程序启动\
  \ Linux。\n\n一旦 Linux 启动，将显示图形化登录界面。但请注意，其他发行版在启动时不需要登录。每个 Linux 发行版都使用 `root` 用户名进行管理员访问。为了避免在使用\
  \ `root` 时对系统进行任何意外更改，请使用不同的账户登录系统。分配 root 密码是安装过程的一部分。请确保你知道并记住你系统的 root 密码。\n\n\
  以下是登录后 Ubuntu 桌面的示例：\n\n![](img/00006.jpeg)\n\n图 4：Ubuntu 桌面\n\n出现的桌面是 `KDE` 或 `GNOME`。我们将在接后的章节中详细讨论这些内容。\n\
  \n## 了解 Shell（外壳）\n\n来自 `KDE` 或 `GNOME` 的 GUI 通过图标、窗口和指针提供了探索 Linux 的最佳方式。然而，在 GUI\
  \ 无法的情况下（正如我们在“安装故障排除”章节中看到的），如果我们知道如何使用终端，那将是一个优势。在终端中输入命令通常比导航和点击更快。\n\n在桌面上，浏览并找到看起来像显示器的图标。这是终端窗口的图标。如果你找不到该图标，浏览主菜单并找到标记为\
  \ `Console`（控制台）或 `Terminal`（终端）的项。\n\n![](img/00007.jpeg)\n\n图 5：KDE 桌面上的终端\n\n\
  以下是 Ubuntu 的样子：\n\n![](img/00009.jpeg)\n\n图 6：Ubuntu 上的终端屏幕\n\nShell 是你可以运行可执行文件和\
  \ Shell 脚本的地方。Shell 也是我们所说的命令行。命令使用下方的通用语法编写：\n\n```\ncommand option1 option2 .\
  \ . . optionN\n```\n\n以下是一些你可以在 Linux 环境中尝试的示例命令及其相应的输出：\n\n```\nuptime\n19:26 \
  \ up 29 days,  1:39, 2 users, load averages: 1.32 1.36 1.34\n```\n\n`uptime` 是用于显示电脑运行持续时间的命令。在这种情况下，电脑已经运行了\
  \ 29 天，或者接近 1 个月。\n\n```\nuname –srv\nLinux 3.9.31.5-127.fc12.i686 #1 SMP Mon Nov\
  \ 18 18:21:25 EST 2015\n```\n\n`uname` 是显示操作系统名称的命令。`-s`（打印操作系统名称）、`-r`（打印操作系统发行版本）和\
  \ `-v`（打印操作系统版本）是你可以用于 `uname` 命令的选项。在特定示例中，我们想使用所有三个，所以我们输入 `n –srv` 来简化。如果我们想让结果看起来像我们使用了所有选项，可以使用\
  \ `-a` 选项。\n\n要了解针对特定命令可以使用的选项，你可以使用 `man` 命令。\n\n```\nman uname\n```\n\n`man` 命令极其有用，特别是对于初学者。它显示了你可以使用的所有选项。尝试对你遇到的每个\
  \ Linux 命令都使用该命令。\n\n在 Shell 中切换到 root，输入命令 `su-` 然后输入你的 root 密码。在 Shell 环境中切换到\
  \ root 密码将允许你运行只有管理员和超级用户才能执行的任务。\n\n## Linux 桌面\n\nLinux 发行版通常带有两种常用的 GUI：`GNOME`\
  \ 和 `KDE`。你可以在电脑上同时安装两者，并随时随地在两者之间切换。这两个 GUI 都运行在 Unix 上，虽然 Linux 还可以安装其他 GUI，但这两个仍然是最受欢迎的。\n\
  \n下面是对比这两个桌面的图表：\n\n| 准则 | GNOME | KDE |\n| :--- | :--- | :--- |\n| 可用性 | 免费 | 免费\
  \ |\n| 最低系统要求 | 700 Mhz CPU, 768 MB RAM | 1 Ghz CPU, 615 MB RAM |\n| 开发优先级 | 自由、易用性、开发者友好\
  \ | 视觉效果、可配置性 |\n| 个性化体验 | 界面简单，适合新用户 | 提供了美观的桌面，可高度配置 |\n| 资源占用 | 相比 KDE 占用较少 |\
  \ 资源占用较高 |\n| 通用搜索 | 使用文本搜索功能 | 基于文本的导航 |\n\n表 3：GNOME 与 KDE 桌面的对比\n\n这些只是两个桌面之间不同的一些若干准则。我建议你尝试两个桌面，看看哪一个最适合你。\n\
  \n我将向你展示一些显示桌面设置的截图。GNOME 桌面如下所示，顶部工具栏包含应用程序、日期时间、卷、网络和电量等信息。\n\n![](img/00010.jpeg)\n\
  \n图 7：在 Fedora 上运行的 Gnome 桌面\n\n![](img/00015.jpeg)\n\n图 8：Gnome 文件夹菜单\n\n下一组截图了\
  \ KDE 的默认桌面。你会在底部找到面板——类似于 Windows 桌面。\n\n![](img/00034.jpeg)\n\n图 9：openSUSE 上的\
  \ KDE 桌面\n\n![](img/00029.jpeg)\n\n图 10：KDE 菜单选项\n\n两者都可以自定义以获得你想要的视觉效果。尽管去尝试这些桌面吧！有些发行版只预装了一个，但你始终可以获取两者。你可以在几秒钟内在两者之间切换。\n\
  \n\n\n\n\n| 路径 | 作用 |\n| :--- | :--- |\n| `/boot` | 引导程序在启动期间访问的文件——包括 Linux 内内核\
  \ |\n| `/dev` | 用于不同硬件/设备的文件 |\n| `/etc` | 初始化脚本和系统配置文件 |\n| `/home` | 用户目录 |\n\
  | `/lib` | 包含驱动模块的库文件 |\n| `/lost+found` | 用于存放丢失的文件 |\n| `/media` | 挂载和移除的介质文件系统\
  \ |\n| `/mnt` | 挂载文件系统的临时目录 |\n| `/opt` | 用于存储软件包 |\n| `/proc` | Linux 进程信息 |\n\
  | `/root` | Root 用户家目录 |\n| `/sbin` | 用于 root 用户使用的命令的可执行文件 |\n| `/srv` | 用于由系统托管的服务（例如\
  \ FTP、Web） |\n| `/tmp` | 临时目录——系统重启时会删除 |\n| `/usr` | 包含程序文件的子目录 |\n| `/var` | 日志文件\
  \ |\n\n**表 4: Linux 根级目录**\n\n## 目录导航\n\n在 Linux 目录中导航时，你可以使用 GUI 通过浏览文件夹来查找特定文件，使用通用的文本搜索功能，或者使用命令行。\n\
  \n你可以在终端中使用以下有用命令在文件系统中进行导航和操作：\n\n| 命令 | 作用 |\n| :--- | :--- |\n| `ls` | 列出目录下的所有内容\
  \ |\n| `cd /bin/` | 切换目录并进入 bin 目录 |\n| `cd ~` | 波浪号 (`~`) 符号表示用户的家目录——切换目录到家目录\
  \ |\n| `cd ..` | 切换到上一级目录。例如，你当前在 `/home/edulaney/`，使用该命令将带你回到 `/home/`。 |\n| `mkdir`\
  \ | 用于创建目录的命令 |\n| `pwd` | present working directory（当前工作目录）的缩写。此命令将显示你当前所在的目录 |\n\
  \n**表 5: 目录导航命令**\n\n## 文件管理\n\n在这里，我将提供更多你可以使用命令行管理文件的命令。在你的终端中尝试一下。\n\n| 命令 |\
  \ 作用 |\n| :--- | :--- |\n| `cat /home/edulaney/files/file1.txt` | 在屏幕上打印 file1.txt\
  \ 所有内容的命令 |\n| `cp /home/ /tmp/` | 将 `/home/` 的内容拷贝到 `/tmp/` |\n| `mv /home/edulaney/files/file1.txt\
  \ /tmp/` | 将文件 file1.txt 移动到 `/tmp/` 目录。也可以用此命令将整个目录移动到另一个目录 |\n| `rm file1.txt`\
  \ | 删除文件 file1.txt。使用 `rm` 命令要格外小心，特别是当你以 root 身份登录时 |\n| `find / -name “linux*`\
  \ | `find` 命令是一个强大的工具，你可以在使用命令行搜索时使用。此命令将搜索任何名称以 linux 开头的文件或目录 |\n\n**表 6: 文件管理基本命令**\n\
  \n通过 `man` 命令探索更多命令。\n\n## 关闭你的电脑\n\n关闭 Linux 电脑与在其他操作系统中的操作类似。点击主菜单，选择“关机”（Shutdown），然后点击“确定”。这将启动系统关机。某些发行版不允许在不注销的情况下关闭系统。要这样做，点击“注销”（Log\
  \ Out），然后在登录页面选择“关机”。\n\n***\n\n# 第五章：安装后的活动\n\n在这一章中，我们将讨论安装好 Linux 操作系统后可以做的事情——从管理硬件到安装额外的软件。\n\
  \n## 管理硬件和外围\n\n### CPU\n\n操作系统保持程序和硬件顺畅运行。Linux 的功能受到系统硬件限制（例如磁盘空间和内存）的影响，因此了解更多关于电脑硬件的细节非常重要。\n\
  \n让我们从 CPU 开始。CPU 执行所有的计算，其速度（MHz）代表了电脑处理事务的快慢。你的 CPU 规格还会告诉你 CPU 家族（最常见的是 `x86`\
  \ 和 `x86-64`）以及它拥有的内核数。要更多关于你的 CPU，请使用以下 Linux 命令：\n\n| 命令 | 作用 |\n| :--- | :---\
  \ |\n| `uname -a` | 此命令显示机器、处理器架构和操作系统详细信息。使用 `-p` 选项将显示机器处理器名称。例如 `i386` 或 `x86_64`\
  \ AMD Phenom (tm) II X3 700e Processor |\n| `lscpu` | 此命令返回更多关于系统的信息，例如 CPU 数量和\
  \ CPU 速度。示例输出![](img/00016.jpeg) |\n| `cat /proc/cpuinfo` | 这是一个比 `lscpu` 命令显示更多信息的文件。`/proc/cpuinfo`\
  \ 文件的片段：`processor: 1vendor_id: Intelcpu family: 11model : 2model name: Intel(R)\
  \ Pentium(R) 4 CPU 2.86GHzstepping: 4microcode: 0xe` |\n\n**表 7: 获取 CPU 信息的命令**\n\
  \n### 硬盘\n\n接下来，让我们讨论你的电脑硬盘。在安装过程中，我们讨论了确保电脑有足够的磁盘空间。如果你以后计划添加新的硬盘，学习分区将很有用。Linux\
  \ 支持以下分区工具：\n\n- **Fdisk Tools** —— 由 `fdisk`、`cfdisk` 和 `sfdisk` 组成。\n- **libparted\
  \ Tools** —— `libparted` 提供了 GUI 和文本工具。一个特定的例子如所示所示 GParted。\n- **GPT fdisk Tools**\
  \ —— 为 GPT（全局分区表）磁盘创建的工具，使用 `fdisk`。\n\n![](img/019.jpeg)\n**图 12: GParted - 基于\
  \ GUI 的分区工具**\n\n这里有一些你可以使用的命令来检查电脑中的磁盘空间：\n\n| 命令 | 作用 |\n| :--- | :--- |\n| `df\
  \ -h` | 此命令显示所有挂载设备的磁盘使用情况。`-h` 选项以人类可读的方式呈现结果，使用 G 表示 GB，M 表示 MB |\n| `du /home/edulaney/files/`\
  \ | 此命令显示指定目录下的所有文件及其对应的大小。你也可以指定文件名 |\n| `du -s /home/edulaney/files/` | `-s` 选项提供指定目录的总大小\
  \ |\n\n**表 8: 检查空间的命令**\n\n### 移动存储\n\n在 Linux 中使用 USB 闪盘和外部硬盘等存储与使用 Windows 或 macOS\
  \ 类似。插入设备，Linux 会检测设备。除了通过桌面 GUI 访问驱动器外，你还可以导航到 `/media` 目录并找到挂载的子目录。\n\n在使用移动媒体后，在移除之前卸载磁盘以避免任何磁盘问题。你通常可以右键点击设备名称并点击任何选项，如“卸载”（Unmount）、“弹出”（Eject）或“安全删除”（Safely\
  \ Remove）。\n\n![](img/0021.jpeg)\n**图 13: 弹出媒体**\n\n### USB 设备\n\n你可以将其他设备（如键盘、鼠标）、摄像头、手机、扫描仪和打印机连接到你的\
  \ Linux 电脑，并预期它们以即插用的方式工作。\n\n对于打印机，在 Linux 检测到设备后，你还需要设置打印机配置。按照以下步骤设置新打印机。注意截图截自\
  \ Ubuntu 发行版，但这与大多数发行版类似。\n\n1. 点击桌面上的“系统设置”（System Settings），然后点击“打印机”（Printers）。提供根密码。\n\
  \n![](img/0023.jpeg)\n**图 14: 打印机设置菜单**\n\n2. 点击“添加”（Add）按钮。如果系统检测到了你的打印机，设备将出现在列表中。否则，你需要继续配置并提供打印机驱动程序。点击“下一步”（Forward）。\n\
  \n\n\n\n\n![](img/00027.jpeg)\n\n图 15：新打印机\n\n3. 选择正确的驱动程序。系统将显示可用驱动程序列表——选择适用于你打印机品牌的驱动程序。如果你在列表中没有找到驱动程序，也可以提供打印机驱动程序或在线下载该文件。\n\
  \n![](img/00033.jpeg)\n\n图 16：选择驱动程序\n\n4. 填写打印机名称和描述。\n\n![](img/00036.jpeg)\n\n\
  图 17：打印机描述\n\n5. 最后，打印一个测试页以确保其工作正常。\n\n![](img/00038.jpeg)\n\n图 18：打印测试页\n\n##\
  \ 安装额外软件\n\n兼容 Linux 的软件以 `.rpm` 软件包（适用于 RPM，如 Fedora, SUSE）或 `.deb` 软件包（适用于 Debian，如\
  \ Debian, Ubuntu, Xandros）的形式提供。尽管软件包类型不同，RPM 和 Debian 软件包都可以安装在任何类型的 Linux 发行版中。常用的发行版提供了用于安装应用程序的\
  \ GUI（图形界面）。在本节中，我将讨论在 Ubuntu 和 Fedora 中安装软件的方法。\n\n### 在 Ubuntu 中安装应用程序\n\n基于 Debian\
  \ 的发行版使用 APT（即高级软件包工具）。\n\n你可以使用以下命令将软件包安装到你的计算机上。\n\n```\napt-get install package-name\n\
  ```\n\n此命令将下载你想要安装的特定软件包名称。如果你不知道软件包名称，可以搜索关键词。\n\n```\napt-cache search keyword\n\
  ```\n\n例如，我正在寻找一个可以在我的 GNOME 桌面面上用于截屏的应用程序。我可以通过以下命令进一步完善我的搜索功能：\n\n```\napt-cache\
  \ search screenshot | grep GNOME\n```\n\n该命令将显示符合搜索字符串的适用行：\n\n```\nshutter - feature-rich\
  \ screenshot program\n```\n\n`shutter` 是软件包名。使用该软件包名并再次运行 `apt-get install` 命令。\n\
  \n除了通过命令行安装软件包外，你还可以使用“软件与更新”（Software & Updates）工具。该 GUI 提供了一种简单快捷的方法来更新你的 Ubuntu\
  \ 软件并下载软件包。\n\n![](img/00041.jpeg)\n\n图 19：软件与更新工具\n\n与 Windows 和 Mac OS 应用商店类似，Ubuntu\
  \ 也有自己的“软件中心”（Software Center），你可以在那里获取新软件并下载最新的更新。\n\n![](img/00043.jpeg)\n\n图\
  \ 20：Ubuntu 软件中心\n\n### 在 Fedora 中安装应用程序\n\nFedora 使用 RPM 软件包。如果你使用的是 GNOME 桌面，只需使用“添加或删除软件”（Add\
  \ or Remove Software）工具（类似于 Windows）来安装新软件。\n\n点击“系统➪ 管理”，然后点击“添加或删除软件”进入菜单。该程序将显示软件包管理器窗口，列出所有软件包。选择相应的复选框并点击“应用”或“更新”（如果你正在更新软件包）。点击“应用”按钮将安装（或卸载）特定的软件包。\n\
  \n![](img/00008.jpeg)\n\n图 21：Fedora 添加/删除软件包\n\n***\n\n在本章中，我们回顾了 Linux 安装后可以硬件设置和软件安装步骤。如需更详细的操作，请参考你所使用的特定发行版的步骤。在下一章中，我们将简要默认\
  \ Linux 应用程序。\n\n# 第六章：Linux 应用程序\n\nLinux 发行版预装了满足你计算需求的应用程序。在本章中，我们将快速查看其中的一些应用程序。\n\
  \n### 办公应用程序\n\nLibreOffice 套件是 Linux 对 Windows 办公工具的响应。该套件包含文字处理器、演示文稿程序、电子表格、日历和计算器应用程序。如果你是\
  \ Windows 用户，可能需要一些时间来适应界面，但在使用几次应用程序后，你最终会熟悉它。\n\nLibreOffice 包含以下应用程序：\n\n*  \
  \ `Writer` – 文字处理器。文件以 `.odt` 扩展名创建。用 Microsoft Word 编写的文档与 `Writer` 兼容。\n\n![](img/00013.jpeg)\n\
  \n图 22：Writer 的界面\n\n*   `Calc` – 电子表格程序，工作类似于 Microsoft Excel。默认文件扩展名为 `.ods`。\n\
  \n![](img/00018.jpeg)\n\n图 23：Calc 看起来像 Microsoft Excel\n\n*   `Impress` – Microsoft\
  \ PowerPoint 的对应软件。在 Impress 中，你可以根据现有模板制作幻灯片，也可以像在 Microsoft Office 中那样的进行自定义。\n\
  \n![](img/00017.jpeg)\n\n图 24：为 Impress 而生\n\n所有 LibreOffice 应用程序都可以从主菜单中的“办公”选项访问。\n\
  \n### 多媒体应用程序\n\n如何访问多媒体？Linux 发行版预装了允许你打开照片、听音频文件、播放视频以及刻录 CD 或 DVD 的应用程序。\n\n\
  SUSE 和 Xandros 发行版预装了 `digiKam`，这是一个数字相机软件。你也可以选择从 USB 驱动器作为文件访问你的照片。只需点击存储驱动器名称并查看照片。\n\
  \nKDE 和 GNOME 都带有音频 CD 播放器。放入 CD 后，默认音频播放器将检测并播放音频。对于 MP3 等其他音频文件，你可以使用 `XMMS` 或\
  \ `Rhythmbox` 等播放器。根据你使用的发行版，你可以进入“音乐播放器”应用程序、“多媒体”或“音频与视频”类别打开播放器。\n\n最近，不同的发行版已经在文件管理器中发布了内置的\
  \ CD/DVD 刻录功能。它们运行良好，但如果你仍然想要独立的应用程序来刻录文件，可以使用常用的刻录软件，如用于 KDE 的 `K3b`。\n\n### 图像应用程序\n\
  \nLinux 也确保你能够获得所需的照片编辑和图形应用程序。Linux 世界最流行的两个是 `GIMP`（GNU 图像处理程序）和 `GNOME Ghostview`。\n\
  \n`GIMP` 相当于 Adobe Photoshop。用户可以进行图像处理、合成和创建。如果你在主菜单的“图形”类别中找不到 `GIMP`，请检查是否需要先安装。参考“安装软件”中的步骤下载并安装\
  \ `GIMP` 软件包。该应用程序可以读取大多数图像格式：`JPEG`、`TIFF`、`PNG`、`PCX` 和 `GIF`。更多关于 `GIMP` 的信息，请访问其网站\
  \ www.gimp.org。\n\n`GNOME Ghostview` 可以读取 PostScript 或 PDF 文，功能类似于 Acrobat Reader。在\
  \ Fedora 计算机上打开 Ghostview，点击“图形”然后“PostScript 查看器”。\n\n探索预装的应用程序并判断这些是否符合你的需求。记住，有许多\
  \ Linux 应用程序你可以使用，所以去寻找最适合你的那个吧。\n\n***\n\n在本章中，我们简要讨论了 Linux 发行版自带的各种办公、多媒体和图像应用程序。在下一章中，我们将对\
  \ Linux 命令行建立更深入的理解。\n\n# 第七章：使用 Linux 命令行\n\n在第四章中，我们讨论了 Linux 命令行或终端以及你如何从桌面访问它。在之前的章节中，你还能够在终端上使用简单的命令。每个\
  \ GUI 操作都有相应的命令行等项。\n\n### 使用 Shell 特性\n\n你已经看到了使用 `Bash` shell 的。在命令行执行任务比在 GUI\
  \ 中花费的时间少。为了进一步享受使用 CLI（命令行界面）的便利，这里是你应该使用的 Shell 特性：\n\n*   命令补全\n\n启动终端并尝试输入一个未完成的命令。\n\
  \n例如，输入下面的单词并按 Tab 键。\n\n```\nunam\n```\n\n\n\n\n\n注意 Linux 将自动补全单词以形成 `uname`。接下来，删除其余字母并只保留字母\
  \ `u`，Linux 将显示所有以字母“u”开头的命令列表。此功能让用户输入命令时变得更快。你也可以对文件名或目录名这样做。输入文件名的前几个字母，Linux\
  \ 就会为你完成剩余工作。\n\n当你尝试记住某个命令时，这非常有帮助，因为 Linux 会列出所有在你输入的字母开头的命令。将此功能与 `man` 结合使用，你应该能够找到正在寻找的命令。\n\
  \n## 命令历史\n\nLinux 通过命令历史功能让用户变得更加方便。系统会记住你最近输入过的命令，因此你不再需要重新输入。只需使用方向键即可查看之前的命令。\n\
  \n以下是一些你可以利用的技巧，以充分利用这一功能：\n\n| 使用的按键 | 功能 |\n| :--- | :--- |\n| 方向键向上/向下 | 显示从最近到最旧输入的命令\
  \ |\n| 方向键向右/左 | 将光标向右/左移动一个字符 |\n| CTRL 键 + A | 将光标移动到行首 |\n| CTRL 键 + E | 将光标移动到行尾\
  \ |\n| Delete 键 | 删除光标下的字符 |\n| Backspace（退格） | 删除光标左侧的字符 |\n| CTRL 键 + R | 从命令历史中搜索特定命令。使用\
  \ CTRL 键 + R 后，输入你想使用的命令的前几个字母 |\n\n表 9：命令行历史快捷键\n\n系统管理员充分利用了这些功能，因为它们让管理任务的完成变得更容易更快速。尝试在你学过的命令上使用这些技巧，看看使用命令行工作有多有多酷。\n\
  \n## 基础 Linux 命令\n\n作为一名新的 Linux 爱好者，你可以使用 GUI 执行许多任务。然而，如果你想学习更多在 shell 提示符中使用的命令，这里有一份最常用的\
  \ Linux 命令备查表。\n\n| 命令 | 功能 |\n| :--- | :--- |\n| **帮助命令** | |\n| `info` | 显示有关命令的在线信息\
  \ |\n| `man` | 显示命令的详情 |\n| `whatis` | 显示特定关键词的简短描述 |\n| `type` | 显示命令文件的位置 |\n\
  | `alias` | 为命令设置别名——对于长命令特别有用 |\n| `unalias` | 命令别名 |\n| **管理文件和目录** | |\n| `cd`\
  \ | 切换目录 |\n| `pwd` | 显示当前目录 |\n| `ln` | 创建文件和目录的链接 |\n| `touch` | 触发文件的时间戳更新 |\n\
  | **查找文件** | |\n| `find` | 根据名称搜索文件 |\n| `whereis` | 搜索可执行文件 |\n| `which` | 在 `PATH`\
  \ 变量的目录部分搜索文件 |\n| **处理文件** | |\n| `dd` | 复制数据行 |\n| `diff` | 显示两个文件的比较结果 |\n| `more`\
  \ | 一页页显示文本文件——显示只能向前滚动 |\n| `less` | 一页页显示文本文件——显示可以向前向后滚动 |\n| `wc` | 显示文件中字符、单词和行数的计数\
  \ |\n| `cat` | 在一次输出中显示文本文件 |\n| `cut` | 获取文件中的文本段 |\n| `grep` | 显示文件中查找表达式的结果 |\n\
  | `sed` | 执行编辑命令然后复制到标准输出 |\n| `split` | 指定大小将文件拆分 |\n| `sort` | 对文件中的行进行排序 |\n\
  | `uniq` | 保留文件中的唯一行并删除重复项 |\n| **压缩文件** | |\n| `compress` | 用于压缩文件 |\n| `uncompress`\
  \ | 如果文件是用 `compress` 命令压缩的，使用此解压 |\n| `gunzip` | 使用 GNU Zip 解压文件 |\n| `gzip` |\
  \ 使用 GNU Zip 压缩文件 |\n| `tar` | 归档一个或多个目录 |\n| **日期和时间** | |\n| `cal` | 显示指定月份或年的日历\
  \ |\n| `date` | 显示/设置当前日期时间 |\n| **进程管理** | |\n| `bg` | 在后台运行程序或进程 |\n| `free` |\
  \ 检查空内存 |\n| `kill` | 停止进程 |\n| `nice` | 以低优先级运行程序 |\n| `ps` | 显示当前运行的进程 |\n| `top`\
  \ | 显示进程的 CPU 和内存利用列表 |\n| `reboot` | 重启电脑 |\n| `shutdown` | 关闭电脑 |\n\n表 10：重要的\
  \ Linux 命令列表\n\n现在，尝试上面的命令。如果你不确定如何使用命令的选项，可以使用帮助命令（特别是 `man` 和 `info`）来获取更多信息。\n\
  \n***\n\n在本章中，我为你提供了一份可以在命令行中尝试的命令和技巧。继续练习这些命令并在网上研究更多。在接下来的章节中，我们将学习如何保护你的操作系统。\n\
  \n# 第八章：基础管理与安全\n\n你的系统现在已经运行了，你应该考虑的下一步是确保安全。系统管理员考虑安全的两个方面：主机安全和网络安全。如果有多个用户使用计算机，用户目录和文件应该是安全的，不被未经授权访问。由于你的电脑连接了互联网，你也必须保护它。让我们在接下来的部分讨论这些。\n\
  \n## 基础系统管理\n\n类似于 Windows 和 Mac OS 等操作系统，Linux 发行版也带有用于执行管理任务的 GUI 工具。添加和删除账户、执行软件升级、管理硬件、安装应用程序、维护系统性能以及设置和监控安全都是管理员执行的一些活动。\n\
  \n![](img/00004.jpeg)\n图 25：用于管理任务的 SUSE YaST\n\n上述管理任务在使用 SUSE 时可以通过 YaST 执行。这些功能在\
  \ Ubuntu 和 Fedora 发行版中也可用。\n\n![](img/00020.jpeg)\n图 26：Ubuntu 设置\n\n![](img/00014.jpeg)\n\
  图 27：Fedora 设置\n\n## 监控系统性能\n\n为了有效监控计算机的性能，应该检查以下方面：\n\n### CPU 和内存使用\n\n要查看消耗最多\
  \ CPU 资源和内存的进程，使用 `top` 命令。该命令显示 CPU 负载和内存平均值、进程 ID、进程使用的 CPU 百比以及内存使用的百分比。`top`\
  \ 命令的结果每 5 秒刷新一次。退出 `top` 命令输出显示请按 `Q`。\n\n![](img/00022.jpeg)\n图 28：top 命令\n\n\
  获取执行命令时的系统状态快照，使用 `uptime`。该命令打印过去一、五、十五分钟的平均负载。\n\n### 硬盘空间\n\n监控硬盘空间，以确保系统有足够的空间执行日志和备份等任务。使用\
  \ `df -h` 命令验证磁盘空间。这里是一个示例输出：\n\n```\nFilesystem Size Used Avail % Mounted on\n\
  /dev/hda1 7.1G 3.9G 2.9G 59% /\n/dev/hda2 99M 18M 77M 19% /boot\n```\n\n\n\n\nLinux\
  \ 在安装时会自动创建多个用户账户，即使你是该电脑的唯一使用者。系统使用这些账户来运行程序。不同的账户可以保护系统（包括文件和目录）免受未经授权的访问。可以将用户分配到组中以便于管理。\n\
  \n要添加、修改或删除用户或组账户，你可以使用图形用户界面（GUI），也可以通过命令行完成。作为初，建议你尝试这两种方法，看看哪种方法最适合你。\n\n## 通过\
  \ GUI 管理用户和组\n\n如果你使用的是 SUSE，请打开 `YaST`；或者使用发行版中相应的设置菜单。点击“安全与用户”或任何类似的用户管理类别。\n\
  \n![](img/00032.jpeg)\n\n图 29: YaST 添加用户\n\n点击“添加用户”按钮，并提供必要的信息，例如用户的全名、首选用户名和密码。你可以探索并配置额外信息，如登录尝试限制、密码设置和用户组。完成后，点击“确定”按钮以继续创建用户账户。\n\
  \n你也可以使用 GUI 修改或删除账户。执行必要的账户修改并点击“确定”按钮以应用更改。\n\n要创建、修改或删除用户组，请选择“组”而不是“用户”。下面的图片显示了\
  \ YaST 添加新组的界面。提供必要的信息并点击“确定”按钮完成组的创建。\n\n![](img/00026.jpeg)\n\n图 30: 添加组\n\n##\
  \ 通过 CLI 管理用户和组\n\n通过 CLI 添加新用户仅需几行命令。首先，使用命令 `su–` 以 root 身份登录。\n\n使用以下命令创建新账户：\n\
  \n```\n/usr/sbin/useradd -c \"Kevin Jones\" kjones\n```\n\n接下来，设置密码。当你执行以下命令时，系统会提示你两次输入并确认密码。\n\
  \n```\npasswd kjones\n```\n\n要修改账户，使用 `usermod` 命令并配合你想要修改的信息相关的选项。要删除用户账户，使用 `/usr/sbin/userdel\
  \ username` 命令。\n\n要添加用户组，你需要使用命令 `groupadd groupname`。\n\n例如，让我们创建一个名为 `office`\
  \ 的组。要创建此组，输入以下命令：\n\n```\ngroupadd office\n```\n\n由于 Kevin 是工作中的同事，我们将他加入 `office`\
  \ 组。执行此操作，请使用以下命令：\n\n```\nusermod -G office kjones\n```\n\n要删除该组，使用命令 `groupdel\
  \ office`。\n\n再次，我鼓励你使用 `man` 命令来了解更多关于特定命令可用选项的信息。\n\n## 文件所有权\n\n用户和组账户拥有 Linux\
  \ 文件或目录。要查看特定文件的所有者，使用命令 `ls –l filename`。\n\n这里是命令的示例输出。选择一个文件名并在你的终端上尝试一下！\n\n\
  ```\n-rw-rw-r-- 1 kjones office 40909 Jul 16 20:37 file1.txt\n```\n\n第一组字母代表权限设置（执行、读取、写入）。第二部分值为\
  \ `kjones office`，表示所有该文件的用户账户和组账户。\n\n如果你想将文件的所有者从 `kjones` 更改为用户 `rbentley`，请以\
  \ root 身份登录并使用以下命令：\n\n```\nchown rbentley file1.txt\n```\n\n此外，要更改文件的组所有者，输入命令：\n\
  \n```\nchgrp staff file1.txt\n```\n\n## Linux 基础安全\n\n### 设置密码\n\n在创建账户时，作为管理员，要务必创建难以破解的良好密码。记住避开由个人信息（如生日、街道地址或姓名）组成的密码、字典中可以找到的单词以及简单的字母数字组合。\n\
  \n使用包含混合大小写（大写字母和小写字母）、带有数字或标点符号、或者反序书写的密码。还应实施其他预防机制，例如提示用户每隔 X 天更改密码，以及在尝试登录 Y\
  \ 次后锁定账户。\n\n### 文件保护\n\n要保护文件免受未经授权的访问（查看和修改），请检查你的文件权限设置。在上一节中，我们讨论了如何为文件分配用户和组所有者。接下来，我们需要为所有者、组和全局（所有其他用户）指定正确的文件权限。\n\
  \n回到 `ls` 命令的结果：\n\n```\nrw-rw-r-- 1 kjones office 40909 Jul 16 20:37 file1.txt\n\
  ```\n\n第一组字母（绿色显示）表示用户的文件权限。下一组（蓝色显示）针对用户组，而橙色部分代表全局权限。\n\n*   `r` – 允许读取文件内容\n\
  *   `w` – 允许写入文件\n*   `x` – 允许执行（如果文件包含 bash 脚本）\n\n这意味着 `kjones` 对文件具有读取和写入权限。这与\
  \ `office` 组账户的权限相同。所有其他用户（全局）将仅被允许读取文件。\n\n要更改权限，使用权限的八进制表示法并指定三个级别（用户、组和全局）的值。\n\
  \n| 权限 | 表示法 |\n| :--- | :--- |\n| rwx | 7 |\n| rw- | 6 |\n| r-- | 4 |\n| r-x |\
  \ 5 |\n| --x | 1 |\n\n表 11: 权限值\n\n现在让我们尝试移除组的写入权限。\n\n```\nchmod 644 file1.txt\n\
  ```\n\n当你再次列出 `file1.txt` 的详情时，组的写入权限应该已经被删除了。\n\n```\nrw-r--r-- 1 kjones office\
  \ 40909 Jul 16 20:37 file1.txt\n```\n\n有多种方法可以保护你的系统，例如设置防火墙、保护互联网服务、加密文件以及使用数字证书。为了本书的目的（Linux\
  \ 初学者教程），我只讨论了基础和初始的安全实践。\n\n在下一章中，我将提供脚本的概述，如果你想学习更多关于 Linux 的知识，这是另一个练习方面。\n\n\
  # 第九章：脚本简介\n\n我们已经到了书的最后一章。到此时，你已经熟悉了 Linux 环境是如何运作的，并且一定已经注意到它与你之前的操作系统有多不同。我的建议是你更上一层楼，开始学习如何在\
  \ Linux 中创建脚本。在本章中，我将快速预览 Linux 脚本。\n\n## 选择文本编辑器\n\nShell 脚本是基于文本的文件。开始你的脚本之旅，请选择一个最适合你的文本编辑器。Linux\
  \ 发行版预装了文本编辑器，但最常用的列举如下：\n\n*   `vi` – 通常默认安装。管理员青睐它是因为它是一个强大、灵活且强大的编辑器。\n*   `emacs`\
  \ – 包含许多功能但对新手并不友好\n*   `pico` – emacs 的简化版本（不包含那些功能）\n*   `nano` – pico 的克隆版本但带有某些功能\n\
  \n下载这些编辑器的包并亲自体验一下。我个人使用 `vi` 是因为它易用、简单，以及我整体的舒适和熟悉。\n\n![](img/00003.jpeg)\n\n\
  图 31: vi 文本编辑器\n\n`vi` 使用键执行命令。这里是一些示例：\n\n| vi 命令 | 功能 |\n| :--- | :--- |\n| o\
  \ | 在命令模式下输入此键可新建行并进入输入 |\n| I | 输入此键在光标左侧插入后续字符 |\n| u | 撤销更改 |\n| ESC | 退出插入模式\
  \ |\n| wq! | 保存更改并退出 |\n\n表 12: 示例 vi 按键\n\n你选好文本编辑器了吗？现在让我们尝试一个简单的脚本。\n\n## 简单脚本\n\
  \n脚本是可以由 shell 解释或编译的程序。在 Linux 中我们称之为脚本，因为大多数脚本运行在 bash 或任何其他 shell (ksh, csh,\
  \ bash) 中。\n\n脚本对于自动化和简化管理任务、系统日志监控以及数据处理非常有用。要开始编写脚本，使用 `vi` 或你选择的编辑器打开一个文本文件。\n\
  \n\n\n\n文件的第一行指示应使用哪种 shell 来解释脚本。\n\n```bash\n#!/bin/sh\n```\n\n这表示应该使用 bourne\
  \ shell 来解释该脚本。\n\n让我们来一个简单的脚本。输入以下脚本行。将文件保存为 `simplescript.sh`。确保该文件的用户权限设置为 `744`，以便你可以运行该脚本。\n\
  \n```bash\n#!/bin/sh\necho \"My name is: $1\"\necho I’m using Linux distro: $2\n\
  echo Today is: $3\n```\n\n带 3 个参数运行该脚本：\n\n```bash\n./simplescript.sh Steve Fedora\
  \ Tuesday\n```\n\n输出应该如下所示：\n\n```\nMy name is: Steve\nI’m using Linux distro: Fedora\n\
  Today is: Tuesday\n```\n\n这是一个关于你如何利用它来维护计算机性能的示例。如果你已经使用了 80% 的磁盘空间，那么检查计算机中哪些文件是最大的可能会很有帮助。\n\
  \n使用下面的命令编写一个新脚本：\n\n```bash\nfind / -type f -atime +30 -size +1000k -exec ls -l\
  \ {} \\; > /tmp/filecleanup\n```\n\n这个 shell 脚本将生成一个名为 `fileCleanup` 的新文件，其中包含大文件的列表。作为管理员，下一步是联系文件所有者，在删除这些文件之前给他们通知。\n\
  \n正如你可能观察到的，你可以将不同的 Linux 命令与变量、条件表达式、循环和函数结合起来创建脚本。\n\n到这里，我非常鼓励你继续学习高级 Linux，在其中你将学习更复杂、更强大的\
  \ `awk` 和 `sed` 工具。这两个工具在处理数据时特别有用。\n\n# 这里是对我们所涵盖内容的快速回顾，以防你可能需要复习某个步骤：\n\n1. 你现在已经理解了什么是\
  \ Linux。\n2. 你现在知道 Linux 如何与其他操作系统对比。\n3. 你现在熟悉了不同的 Linux 发行版以及它们之间的区别。\n4. 你学习了如何为安装\
  \ Linux 做准备，现在对 Linux 是如何安装的有了初步了解。\n5. 你现在知道了不同的 Linux 桌面及其对应的外观和感受。\n6. 你现在对 Linux\
  \ 文件系统的样貌有了洞解。\n7. 你现在可以在 Linux 文件系统中进行导航了。\n8. 你学习了 Linux 中的基础管理任务。\n9. 你现在可以在\
  \ Linux 中创建用户并限制访问，作为系统安全工作的一部分。\n10. 你现在对 Linux 中脚本是如何运作有了了解。\n\n转到下一页获取免费视频课程的权限，并查看我该系列中的其他畅畅销书！\n\
