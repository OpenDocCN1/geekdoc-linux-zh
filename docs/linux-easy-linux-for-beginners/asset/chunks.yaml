    注意 Linux 将自动补全单词以形成 `uname`。接下来，删除其余字母并只保留字母 `u`，Linux 将显示所有以字母“u”开头的命令列表。此功能让用户输入命令时变得更快。你也可以对文件名或目录名这样做。输入文件名的前几个字母，Linux
    就会为你完成剩余工作。


    当你尝试记住某个命令时，这非常有帮助，因为 Linux 会列出所有在你输入的字母开头的命令。将此功能与 `man` 结合使用，你应该能够找到正在寻找的命令。


    ## 命令历史


    Linux 通过命令历史功能让用户变得更加方便。系统会记住你最近输入过的命令，因此你不再需要重新输入。只需使用方向键即可查看之前的命令。


    以下是一些你可以利用的技巧，以充分利用这一功能：


    | 使用的按键 | 功能 |

    | :--- | :--- |

    | 方向键向上/向下 | 显示从最近到最旧输入的命令 |

    | 方向键向右/左 | 将光标向右/左移动一个字符 |

    | CTRL 键 + A | 将光标移动到行首 |

    | CTRL 键 + E | 将光标移动到行尾 |

    | Delete 键 | 删除光标下的字符 |

    | Backspace（退格） | 删除光标左侧的字符 |

    | CTRL 键 + R | 从命令历史中搜索特定命令。使用 CTRL 键 + R 后，输入你想使用的命令的前几个字母 |


    表 9：命令行历史快捷键


    系统管理员充分利用了这些功能，因为它们让管理任务的完成变得更容易更快速。尝试在你学过的命令上使用这些技巧，看看使用命令行工作有多有多酷。


    ## 基础 Linux 命令


    作为一名新的 Linux 爱好者，你可以使用 GUI 执行许多任务。然而，如果你想学习更多在 shell 提示符中使用的命令，这里有一份最常用的 Linux
    命令备查表。


    | 命令 | 功能 |

    | :--- | :--- |

    | **帮助命令** | |

    | `info` | 显示有关命令的在线信息 |

    | `man` | 显示命令的详情 |

    | `whatis` | 显示特定关键词的简短描述 |

    | `type` | 显示命令文件的位置 |

    | `alias` | 为命令设置别名——对于长命令特别有用 |

    | `unalias` | 命令别名 |

    | **管理文件和目录** | |

    | `cd` | 切换目录 |

    | `pwd` | 显示当前目录 |

    | `ln` | 创建文件和目录的链接 |

    | `touch` | 触发文件的时间戳更新 |

    | **查找文件** | |

    | `find` | 根据名称搜索文件 |

    | `whereis` | 搜索可执行文件 |

    | `which` | 在 `PATH` 变量的目录部分搜索文件 |

    | **处理文件** | |

    | `dd` | 复制数据行 |

    | `diff` | 显示两个文件的比较结果 |

    | `more` | 一页页显示文本文件——显示只能向前滚动 |

    | `less` | 一页页显示文本文件——显示可以向前向后滚动 |

    | `wc` | 显示文件中字符、单词和行数的计数 |

    | `cat` | 在一次输出中显示文本文件 |

    | `cut` | 获取文件中的文本段 |

    | `grep` | 显示文件中查找表达式的结果 |

    | `sed` | 执行编辑命令然后复制到标准输出 |

    | `split` | 指定大小将文件拆分 |

    | `sort` | 对文件中的行进行排序 |

    | `uniq` | 保留文件中的唯一行并删除重复项 |

    | **压缩文件** | |

    | `compress` | 用于压缩文件 |

    | `uncompress` | 如果文件是用 `compress` 命令压缩的，使用此解压 |

    | `gunzip` | 使用 GNU Zip 解压文件 |

    | `gzip` | 使用 GNU Zip 压缩文件 |

    | `tar` | 归档一个或多个目录 |

    | **日期和时间** | |

    | `cal` | 显示指定月份或年的日历 |

    | `date` | 显示/设置当前日期时间 |

    | **进程管理** | |

    | `bg` | 在后台运行程序或进程 |

    | `free` | 检查空内存 |

    | `kill` | 停止进程 |

    | `nice` | 以低优先级运行程序 |

    | `ps` | 显示当前运行的进程 |

    | `top` | 显示进程的 CPU 和内存利用列表 |

    | `reboot` | 重启电脑 |

    | `shutdown` | 关闭电脑 |


    表 10：重要的 Linux 命令列表


    现在，尝试上面的命令。如果你不确定如何使用命令的选项，可以使用帮助命令（特别是 `man` 和 `info`）来获取更多信息。


    ***


    在本章中，我为你提供了一份可以在命令行中尝试的命令和技巧。继续练习这些命令并在网上研究更多。在接下来的章节中，我们将学习如何保护你的操作系统。


    # 第八章：基础管理与安全


    你的系统现在已经运行了，你应该考虑的下一步是确保安全。系统管理员考虑安全的两个方面：主机安全和网络安全。如果有多个用户使用计算机，用户目录和文件应该是安全的，不被未经授权访问。由于你的电脑连接了互联网，你也必须保护它。让我们在接下来的部分讨论这些。


    ## 基础系统管理


    类似于 Windows 和 Mac OS 等操作系统，Linux 发行版也带有用于执行管理任务的 GUI 工具。添加和删除账户、执行软件升级、管理硬件、安装应用程序、维护系统性能以及设置和监控安全都是管理员执行的一些活动。


    ![](img/00004.jpeg)

    图 25：用于管理任务的 SUSE YaST


    上述管理任务在使用 SUSE 时可以通过 YaST 执行。这些功能在 Ubuntu 和 Fedora 发行版中也可用。


    ![](img/00020.jpeg)

    图 26：Ubuntu 设置


    ![](img/00014.jpeg)

    图 27：Fedora 设置


    ## 监控系统性能


    为了有效监控计算机的性能，应该检查以下方面：


    ### CPU 和内存使用


    要查看消耗最多 CPU 资源和内存的进程，使用 `top` 命令。该命令显示 CPU 负载和内存平均值、进程 ID、进程使用的 CPU 百比以及内存使用的百分比。`top`
    命令的结果每 5 秒刷新一次。退出 `top` 命令输出显示请按 `Q`。


    ![](img/00022.jpeg)

    图 28：top 命令


    获取执行命令时的系统状态快照，使用 `uptime`。该命令打印过去一、五、十五分钟的平均负载。


    ### 硬盘空间


    监控硬盘空间，以确保系统有足够的空间执行日志和备份等任务。使用 `df -h` 命令验证磁盘空间。这里是一个示例输出：


    ```

    Filesystem Size Used Avail % Mounted on

    /dev/hda1 7.1G 3.9G 2.9G 59% /

    /dev/hda2 99M 18M 77M 19% /boot

    ```


