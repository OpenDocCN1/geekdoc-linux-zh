    it comes to server OS but one of the least popular for personal and home use such
    as desktops and laptop computers. In the next sections, we will go on an in-depth
    discussion of the reason why Linux is better compared to other operating systems.


    In addition to the tasks performed by an operating system, Linux has the following
    characteristics:


    *   Supports clustering – Multiple Linux systems can be configured to appear as
    one system from the outside. Service can be configured among clusters and still
    offer a seamless user experience.


    *   Runs virtualization – Virtualization allows one computer to appear as several
    computers to users. Linux can be configured as a virtualization host – where you
    could run other OS such as Windows, Mac OS, or other Linux systems. All the virtualized
    systems appear as separate systems to the outside world.


    *   Cloud Computing – Linux can handle complex, large-scale virtualization needs
    – including virtual networks, networked storage, and virtual guests.


    *   Options for Storage – Data need not to be always stored in your computer’s
    hard disk. Linux offers different local and networked storage options such as
    Fibre Channel and iSCSI.


