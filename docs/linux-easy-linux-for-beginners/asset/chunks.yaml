    Linux automatically creates multiple user accounts upon installation, even if
    you are the only one using your computer. The system uses these accounts for running
    programs. Different accounts safeguard the system, including files and directories,
    from unauthorized access. Users can be assigned to groups for easier facilitation.


    To add, modify, or delete a user or group account, you can either use the GUI
    or do it via the command line. As a beginner, it would be good for you to try
    out both so you can see which one is the best method for you.


    ## Managing Users and Groups Via GUI


    Open `YaST` if you are using SUSE or the equivalent Settings Menu in your distribution.
    Click on the `Security and Users` or any similar User Management category.


    ![](images/00032.jpeg)


    Figure 29: YaST Add User


    Click on the `Add user` button and supply the necessary information such as the
    user’s full name, preferred username, and password. You can explore and configure
    additional information such as login attempt limit, password settings, and user
    groups. Once done, click on the `OK` button to continue creating the user account.


    You can also modify or delete an account using the GUI. Perform the necessary
    account modifications and click on the `OK` button to proceed with the changes.


    To create, modify, or delete a group, select `Groups` instead of users. The photo
    below shows the YaST screen for adding a new group. Provide the necessary information
    and click on the `OK` button to finish creating the group.


    ![](images/00026.jpeg)


    Figure 30: Add Group


    ## Managing Users and Groups via CLI


    Adding a new user via CLI consist only of a few lines of command. First, login
    as root by using the command `su–`.


    Use the command below to create a new account:


    ```

    /usr/sbin/useradd -c "Kevin Jones" kjones

    ```


    Next, set the password. Once you issue the command below, you will be prompted
    twice to enter and confirm the password.


    ```

    passwd kjones

    ```


    To modify an account, use the `usermod` command paired with the option that pertains
    to the information that you want to modify. To delete the user account, use the
    `/usr/sbin/userdel username` command.


    To add a user group, you need to use the command `groupadd groupname`.


    For example, let’s create a group named `office`. To create this group, enter
    the command below.


    ```

    groupadd office

    ```


    Since Kevin is a colleague at work, we will add him to the `office` group. To
    do this, use the command below:


    ```

    usermod -G office kjones

    ```


    To delete the group, use the command `groupdel office`.


    Again, I encourage you to use the `man` command to know more about the options
    that can be used for a specific command.


    ## File Ownership


    A user and group account owns a Linux file or directory. To see the owner of a
    particular file, use the command `ls –l filename`.


    Here is a sample output of the command. Choose a filename and try it on your terminal
    too!


    ```

    -rw-rw-r-- 1 kjones office 40909 Jul 16 20:37 file1.txt

    ```


    The first set of letters stands for the permission settings (execute, read, write).
    The second part with the value of `kjones office` signifies the user account and
    the group account that owns the file.


    In case you want to change the ownership of the file from `kjones` to another
    user `rbentley`, login as root and use the command below:


    ```

    chown rbentley file1.txt

    ```


    Also, to change the group owner of the file, input the command:


    ```

    chgrp staff file1.txt

    ```


    ## Basic Security in Linux


    ### Setting-up Passwords


    When creating an account, make it a point as an administrator to create good passwords
    that are difficult to crack. Remember to stay away from passwords formed from
    personal information (such as birthdays, street address, or names), single words
    that can be found in the dictionary, and simple combinations of alphanumeric numbers.


    Use a password that contains mixed case (upper and lower case letters), has numbers
    or punctuations, or is written in reverse order. Also implement other preventive
    mechanism such as prompting the user to change his password every X number of
    days and to lock an account after Y number of login attempts.


    ### Files Protection


    To protect files from unauthorized access (view and modify), revisit your file
    permissions setting. In the preceding section, we talked about assigning the user
    and group owner for a file. Next, we need to specify the correct file permissions
    for the owner, the group, and global (all other users).


    Let’s go back to the result of an `ls` command:


    ```

    rw-rw-r-- 1 kjones office 40909 Jul 16 20:37 file1.txt

    ```


    The first set of letters (in green) signifies the file permissions for the user.
    The next set (in blue) is for the group, while the section in orange stands for
    the global permission.


    *   `r` – permitted to read the file contents

    *   `w` – permitted to write on the file

    *   `x` – permitted to execute (if the file contains a bash script)


    This means that `kjones` has read and write permissions to the file. This is the
    same permission as the `office` group account. All other users (global) will only
    be allowed to read the file.


    To change permissions, use the octal representation of the permission and specify
    the value for the 3 levels (user, group, and global).


    | Permission | Representation |

    | :--- | :--- |

    | rwx | 7 |

    | rw- | 6 |

    | r-- | 4 |

    | r-x | 5 |

    | --x | 1 |


    Table 11: Permission Values


    Let’s now try to remove the write access from the group.


    ```

    chmod 644 file1.txt

    ```


    When you list the details for `file1.txt` again, the write access for the group
    should be already removed.


    ```

    rw-r--r-- 1 kjones office 40909 Jul 16 20:37 file1.txt

    ```


    There are several ways to secure your system such as setting up firewalls, securing
    internet services, and encrypting files, and using digital certificates. For the
    purposes of this book (Linux for Beginners), I only discussed the basic and initial
    security practices.


    In the next chapter, I will give an overview about scripting, which is another
    aspect that you can practice in if you want to learn more about Linux.


    # Chapter Nine: Introduction to Scripting


    We have come to the last chapter of the book. By this time, you are already familiar
    with how a Linux environment works and you must have already noticed how different
    it is from your previous OS. My suggestion to you is to take the experience a
    notch higher and start to learn how to create scripts in Linux. In this chapter,
    I will give a quick preview of scripting in Linux.


    ## Choosing A Text Editor


    Shell scripts are text-based files. To start your scripting journey, choose a
    text editor that works best for you. Linux distributions come with pre-installed
    text editors but the most commonly used ones are listed below:


    *   `vi` – Usually installed by default. Preferred by administrators because it
    is a powerful editor that is small in size and flexible.

    *   `emacs` – contains a lot of features but is not beginner-friendly

    *   `pico` – simplified version of emacs (without the features)

    *   `nano` – a clone of pico but comes with features


    Download the packages for these editors and experience using it yourself. I personally
    use `vi` because of its ease in use, simplicity, and my overall comfort and familiarity
    with it.


    ![](images/00003.jpeg)


    Figure 31: vi text editor


    `vi` uses keys for commands. Here are some examples:


    | vi Command | What it does |

    | :--- | :--- |

    | o | Type this in command mode to insert a new line and enter text |

    | i | Type I to insert succeeding character to the left side of the cursor |

    | u | Undo changes |

    | ESC | To quit insert mode |

    | wq! | To save your changes and quit |


    Table 12: Sample vi keys


    Have you chosen a text editor? Let’s now proceed to trying a simple script.


    ## Simple Scripting


    A script is a program that can be interpreted by a shell or a compiled program.
    We call them shell scripts in Linux because most scripts are run in bash or in
    any other shell (ksh, csh, bash).


    Scripts are useful in automating and simplifying administrative tasks, log monitoring
    of the system, and data processing. To begin scripting, open a text file with
    `vi` or a text editor of your choice.

