    大多数（如果不是全部）Linux 发行版都有活跃的在线社区。如果你在安装过程中遇到问题，请搜索该问题、详细描述它或使用实际错误信息作为搜索关键词。你将找到所需的信息；如果没有，你也可以在论坛中发帖，社区随时准备为你提供帮助。


    访问以下论坛获取更多信息：


    - Ubuntu: [`ubuntuforums.org/`](http://ubuntuforums.org/)

    - Linux Mint: [`linuxmint.com/forum/`](http://linuxmint.com/forum/)

    - SUSE: [`forums.suse.com/forum.php`](https://forums.suse.com/forum.php)

    - Debian: [`www.debianhelp.org/`](http://www.debianhelp.org/)


    ***


    在本章中，我们讨论了 Linux 的正规安装。现在你的电脑上已经有了 Linux，我们将带你完成第一次 Linux 体验。


    # 第四章：你的第一次 Linux 体验


    现在你的 Linux 系统已经在电脑上运行了，让我们开始探索这个系统吧。


    ## 启动你的电脑


    一旦开启电脑，引导程序——无论是 `GRUB` 还是 `LILO`——就会启动并显示电脑中安装的操作系统名称。使用方向键选择你想要加载的操作系统。这适用于安装了两个操作系统的电脑。如果
    Linux 是你电脑上唯一的操作系统，请等待几秒钟让引导程序启动 Linux。


    一旦 Linux 启动，将显示图形化登录界面。但请注意，其他发行版在启动时不需要登录。每个 Linux 发行版都使用 `root` 用户名进行管理员访问。为了避免在使用
    `root` 时对系统进行任何意外更改，请使用不同的账户登录系统。分配 root 密码是安装过程的一部分。请确保你知道并记住你系统的 root 密码。


    以下是登录后 Ubuntu 桌面的示例：


    ![](img/00006.jpeg)


    图 4：Ubuntu 桌面


    出现的桌面是 `KDE` 或 `GNOME`。我们将在接后的章节中详细讨论这些内容。


    ## 了解 Shell（外壳）


    来自 `KDE` 或 `GNOME` 的 GUI 通过图标、窗口和指针提供了探索 Linux 的最佳方式。然而，在 GUI 无法的情况下（正如我们在“安装故障排除”章节中看到的），如果我们知道如何使用终端，那将是一个优势。在终端中输入命令通常比导航和点击更快。


    在桌面上，浏览并找到看起来像显示器的图标。这是终端窗口的图标。如果你找不到该图标，浏览主菜单并找到标记为 `Console`（控制台）或 `Terminal`（终端）的项。


    ![](img/00007.jpeg)


    图 5：KDE 桌面上的终端


    以下是 Ubuntu 的样子：


    ![](img/00009.jpeg)


    图 6：Ubuntu 上的终端屏幕


    Shell 是你可以运行可执行文件和 Shell 脚本的地方。Shell 也是我们所说的命令行。命令使用下方的通用语法编写：


    ```

    command option1 option2 . . . optionN

    ```


    以下是一些你可以在 Linux 环境中尝试的示例命令及其相应的输出：


    ```

    uptime

    19:26  up 29 days,  1:39, 2 users, load averages: 1.32 1.36 1.34

    ```


    `uptime` 是用于显示电脑运行持续时间的命令。在这种情况下，电脑已经运行了 29 天，或者接近 1 个月。


    ```

    uname –srv

    Linux 3.9.31.5-127.fc12.i686 #1 SMP Mon Nov 18 18:21:25 EST 2015

    ```


    `uname` 是显示操作系统名称的命令。`-s`（打印操作系统名称）、`-r`（打印操作系统发行版本）和 `-v`（打印操作系统版本）是你可以用于 `uname`
    命令的选项。在特定示例中，我们想使用所有三个，所以我们输入 `n –srv` 来简化。如果我们想让结果看起来像我们使用了所有选项，可以使用 `-a` 选项。


    要了解针对特定命令可以使用的选项，你可以使用 `man` 命令。


    ```

    man uname

    ```


    `man` 命令极其有用，特别是对于初学者。它显示了你可以使用的所有选项。尝试对你遇到的每个 Linux 命令都使用该命令。


    在 Shell 中切换到 root，输入命令 `su-` 然后输入你的 root 密码。在 Shell 环境中切换到 root 密码将允许你运行只有管理员和超级用户才能执行的任务。


    ## Linux 桌面


    Linux 发行版通常带有两种常用的 GUI：`GNOME` 和 `KDE`。你可以在电脑上同时安装两者，并随时随地在两者之间切换。这两个 GUI 都运行在
    Unix 上，虽然 Linux 还可以安装其他 GUI，但这两个仍然是最受欢迎的。


    下面是对比这两个桌面的图表：


    | 准则 | GNOME | KDE |

    | :--- | :--- | :--- |

    | 可用性 | 免费 | 免费 |

    | 最低系统要求 | 700 Mhz CPU, 768 MB RAM | 1 Ghz CPU, 615 MB RAM |

    | 开发优先级 | 自由、易用性、开发者友好 | 视觉效果、可配置性 |

    | 个性化体验 | 界面简单，适合新用户 | 提供了美观的桌面，可高度配置 |

    | 资源占用 | 相比 KDE 占用较少 | 资源占用较高 |

    | 通用搜索 | 使用文本搜索功能 | 基于文本的导航 |


    表 3：GNOME 与 KDE 桌面的对比


    这些只是两个桌面之间不同的一些若干准则。我建议你尝试两个桌面，看看哪一个最适合你。


    我将向你展示一些显示桌面设置的截图。GNOME 桌面如下所示，顶部工具栏包含应用程序、日期时间、卷、网络和电量等信息。


    ![](img/00010.jpeg)


    图 7：在 Fedora 上运行的 Gnome 桌面


    ![](img/00015.jpeg)


    图 8：Gnome 文件夹菜单


    下一组截图了 KDE 的默认桌面。你会在底部找到面板——类似于 Windows 桌面。


    ![](img/00034.jpeg)


    图 9：openSUSE 上的 KDE 桌面


    ![](img/00029.jpeg)


    图 10：KDE 菜单选项


    两者都可以自定义以获得你想要的视觉效果。尽管去尝试这些桌面吧！有些发行版只预装了一个，但你始终可以获取两者。你可以在几秒钟内在两者之间切换。


