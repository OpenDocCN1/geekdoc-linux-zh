  trans: "\n\n-   你需要使用专有软件进行工作。如果你绝对无法找到匹配你所需的专有软件的开源程序，请保留你当前的操作系统。\n-   你是一名硬核玩家。大多数游戏仅与\
    \ Windows 兼容。\n-   Linux 尚未支持某些硬件。一些在最近几个月内发布的非常新的硬件，Linux 可能尚未对其其支持。硬件供应商通常只为\
    \ Windows 和 Mac 发布驱动程序，因为它们最受欢迎。\n\n大多数安装了 Linux 的个人都会通过所谓的“双启动”来解决这些问题。双启动是在你的设备上同时安装\
    \ Windows 和 Linux 的选项，这样你就可以根据需要选择任一操作系统了。\n\n在本章中，我们讨论了 Linux 操作系统可以做什么，以及它与其他现有操作系统的对比。在下一章中，我们将深入理解\
    \ Linux 操作系统是如何运作的。\n\n# 第二章：理解 Linux\n\n在本章中，我将提供关于该操作系统架构的简要信息，并讨论初学者可以选择的不同\
    \ Linux 版本（flavours）。\n\n## Linux 架构\n\nLinux 架构可以分为两部分：用户空间（User Space）和内核空间（Kernel\
    \ Space）。\n\n-   **用户空间 (User Space)** – 这是运行应用程序的地方。用户空间中的 GNU C 库是连接到内核并在用户空间与内核空间之间切换的接口。它使用所有可用内存。\n\
    -   **内核空间 (Kernel Space)** – 所有内核服务都在这里处理。内核空间进一步分为 3 部分：\n    -   **系统调用接口 (System\
    \ Call Interface)** – 用户进程可以通过系统调用访问内核空间。当执行系统调用时，参数从用户空间传递到内核空间。这是实现基本函数的层。\n\
    \    -   **内核代码 (Kernel Code)** – 这是与架构无关的代码，可见于 Linux 支持的所有架构中。\n    -   **依赖架构内核代码\
    \ (Architecture-Dependent Kernel Code)** – 这是针对特定平台的代码层。\n\n![](img/00044.jpeg)\n\
    \n图 1：Linux 架构\n\n## Linux 发行版\n\n每个 Linux 发行版都由 Linux 内核加上工具和配置文件组成。大多数 Linux\
    \ 发行版都可以从它们的官方网站下载。\n\n让我们根据以下标准来看看几个流行的 Linux 发行版（或版本）之间有什么区别：\n\n### 可用性\n\n\
    如前所述，Linux 是一款免费软件，但提供支持合同和专有组件的公司会收取费用提供它。在下表中，红帽企业版和 SUSE 企业版都提供商业 Linux，但它们也有免费替代方案——`Fedora`\
    \ 和 `openSUSE`。\n\n### 软件包格式\n\nLinux 发行版以包的形式出现。包是分组在单个文件中的文件。`RPM` 是最常用的。\n\n\
    ### 发布周期\n\n这是发行版发布新软件的频率。发布周期较短的发行版能在最短时间内提供最新的软件，而发布周期较长的发行版旨在提供尽可能稳定的环境。一个发行版可以同时采用这两种方式。看看\
    \ `Ubuntu`，它既发布长期支持（LTS）版本（周期较长），也通过 6 个月的周期发布最新软件。\n\n| 发行版 | 可用性 | 软件包格式 | 发布周期\
    \ |\n| :--- | :--- | :--- | :--- |\n| Arch | 免费 | `pacman` | 滚动更新 |\n| CentOS\
    \ | 免费 | `RPM` | 约 2 年 |\n| Debian | 免费 | `Debian` | 2 年 |\n| Fedora | 免费 | `RPM`\
    \ | 约 6 个月 |\n| Gentoo | 免费 | `ebuild` | 滚动更新 |\n| Mint | 免费 | `Debian` | 6 个月\
    \ |\n| openSUSE | 免费 | `RPM` | 8 个月 |\n| Red Hat Enterprise | 商业 | `RPM` | 约 2\
    \ 年 |\n| Scientific | 免费 | `RPM` | 约 6 个月 |\n| Slackware | 免费 | `tarballs` | 不定期\
    \ |\n| SUSE Enterprise | 商业 | `RPM` | 2-3 年 |\n| Ubuntu | 免费 | `Debian` | 6 个月\
    \ |\n\n表 1：流行 Linux 发行版对比\n\n为了帮助你决定哪种是适合你的发行版，请考虑上述标准并对下方列出的其他领域进行研究：\n\n-  \
    \ **桌面环境**：进行研究并看看你中中的特定发行版是否具有你喜欢的界面外观和感受，并检查它的可定制程度。\n-   **硬件兼容性**：取决于你使用的硬件，在你安装发行版时，某些驱动程序可能尚未可用。先检查在线资源，以了解哪些可以开箱即用。\n\
    -   **社区支持**：寻找拥有大型在线社区的发行版。社区越大，查找文档和获取支持就越越容易。\n\n我个人向从未用过 Linux 的人推荐 Linux\
    \ Mint。它的安装简单且无麻烦，而且菜单很熟悉（见下图）。它还额外赠送了预装的某些专有软件（例如 Adobe Flash、MP3 支持）。\n\n![](img/00001.jpeg)\n\
    \n图 2：Mint 桌面\n\n一旦你熟悉了 Mint 并觉得想尝试其他发行版，我建议将 `Ubuntu` 作为你的下一个发行版。`Ubuntu` 让 Linux\
    \ 对经验丰富的普通用户来说易于使用。该发行版还带有一套标准程序，让你在安装后就能开始工作。\n\n![](img/00005.jpeg)\n\n图 3：Ubuntu\
    \ 发行版\n\n在本章中，我们讨论了构成 Linux 的不同组件，并涉及了流行发行版之间的差异。希望这能帮助你找到想要开始 Linux 体验的发行版。在下一章中，我将带你完成\
    \ Linux 的安装过程。\n\n# 第三章：Linux 安装\n\n在本章中，我们将讨论如何在你的计算机上最终安装 Linux。根据你希望的设置，你可以清空硬盘并替换操作系统，也可以与\
    \ Linux 共享磁盘。\n\n## 在你的 PC 上安装 Linux\n\n对于初学者来说，有两种方法可以尝试 Linux 的魅力。\n\n首先，你可以获取一个\
    \ Live CD。如果你想在不触动当前操作系统的情况下先尝试 Linux，那么这是最佳选择。使用 Live CD 允许你从光盘/USB 启动并使用 Linux。完成后，移除光盘/USB\
    \ 并重启电脑即可使用你当前的操作系统。\n\n其次，你可以直接在计算机上安装 Linux，可以是独立安装，也可以与现有的操作系统共享。后者需要几个步骤来完成硬磁盘分区。\n\
    \n## 安装前的步骤\n\n在继续安装之前，先检查你的 PC 硬件是一个好主意。你可以查看硬件供应商的网站检查兼容性列表。\n\n-   **DVD 光驱**：为了安装\
    \ Linux，你必须有一个 DVD 光驱，并且你的计算机必须能够从该驱动器启动。如果你的硬盘控制器是 `IDE/ATA` 或 `USB DVD`，这在 Linux\
    \ 中可行。\n-   **硬盘**：如果你将使用 Live CD，则不需要。如果你将安装 Linux，最好至少有 4GB 的磁盘空间。Linux 支持 `IDE`\
    \ 和 `SCSI` 硬盘控制器。\n-   **键盘**：所有键盘均可在 Linux 使用。\n-   **显示器**：大多数发行版安装程序都能检测现代显示器。如果你发现显示不好，请选择显示器类型和特定的分辨率（1024x768）。\n\
    -   **鼠标**：`PS/2` 或 `USB` 鼠标均可在 Linux 使用。\n\n"
