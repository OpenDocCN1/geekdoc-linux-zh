    ## 目录导航


    在 Linux 目录中导航时，你可以使用 GUI 通过浏览文件夹来查找特定文件，使用通用的文本搜索功能，或者使用命令行。


    你可以在终端中使用以下有用命令在文件系统中进行导航和操作：


    | 命令 | 作用 |

    | :--- | :--- |

    | `ls` | 列出目录下的所有内容 |

    | `cd /bin/` | 切换目录并进入 bin 目录 |

    | `cd ~` | 波浪号 (`~`) 符号表示用户的家目录——切换目录到家目录 |

    | `cd ..` | 切换到上一级目录。例如，你当前在 `/home/edulaney/`，使用该命令将带你回到 `/home/`。 |

    | `mkdir` | 用于创建目录的命令 |

    | `pwd` | present working directory（当前工作目录）的缩写。此命令将显示你当前所在的目录 |


    **表 5: 目录导航命令**


    ## 文件管理


    在这里，我将提供更多你可以使用命令行管理文件的命令。在你的终端中尝试一下。


    | 命令 | 作用 |

    | :--- | :--- |

    | `cat /home/edulaney/files/file1.txt` | 在屏幕上打印 file1.txt 所有内容的命令 |

    | `cp /home/ /tmp/` | 将 `/home/` 的内容拷贝到 `/tmp/` |

    | `mv /home/edulaney/files/file1.txt /tmp/` | 将文件 file1.txt 移动到 `/tmp/` 目录。也可以用此命令将整个目录移动到另一个目录
    |

    | `rm file1.txt` | 删除文件 file1.txt。使用 `rm` 命令要格外小心，特别是当你以 root 身份登录时 |

    | `find / -name “linux*` | `find` 命令是一个强大的工具，你可以在使用命令行搜索时使用。此命令将搜索任何名称以 linux
    开头的文件或目录 |


    **表 6: 文件管理基本命令**


    通过 `man` 命令探索更多命令。


    ## 关闭你的电脑


    关闭 Linux 电脑与在其他操作系统中的操作类似。点击主菜单，选择“关机”（Shutdown），然后点击“确定”。这将启动系统关机。某些发行版不允许在不注销的情况下关闭系统。要这样做，点击“注销”（Log
    Out），然后在登录页面选择“关机”。


    ***


    # 第五章：安装后的活动


    在这一章中，我们将讨论安装好 Linux 操作系统后可以做的事情——从管理硬件到安装额外的软件。


    ## 管理硬件和外围


    ### CPU


    操作系统保持程序和硬件顺畅运行。Linux 的功能受到系统硬件限制（例如磁盘空间和内存）的影响，因此了解更多关于电脑硬件的细节非常重要。


    让我们从 CPU 开始。CPU 执行所有的计算，其速度（MHz）代表了电脑处理事务的快慢。你的 CPU 规格还会告诉你 CPU 家族（最常见的是 `x86`
    和 `x86-64`）以及它拥有的内核数。要更多关于你的 CPU，请使用以下 Linux 命令：


    | 命令 | 作用 |

    | :--- | :--- |

    | `uname -a` | 此命令显示机器、处理器架构和操作系统详细信息。使用 `-p` 选项将显示机器处理器名称。例如 `i386` 或 `x86_64`
    AMD Phenom (tm) II X3 700e Processor |

    | `lscpu` | 此命令返回更多关于系统的信息，例如 CPU 数量和 CPU 速度。示例输出![](img/00016.jpeg) |

    | `cat /proc/cpuinfo` | 这是一个比 `lscpu` 命令显示更多信息的文件。`/proc/cpuinfo` 文件的片段：`processor:
    1vendor_id: Intelcpu family: 11model : 2model name: Intel(R) Pentium(R) 4 CPU
    2.86GHzstepping: 4microcode: 0xe` |


    **表 7: 获取 CPU 信息的命令**


    ### 硬盘


    接下来，让我们讨论你的电脑硬盘。在安装过程中，我们讨论了确保电脑有足够的磁盘空间。如果你以后计划添加新的硬盘，学习分区将很有用。Linux 支持以下分区工具：


    - **Fdisk Tools** —— 由 `fdisk`、`cfdisk` 和 `sfdisk` 组成。

    - **libparted Tools** —— `libparted` 提供了 GUI 和文本工具。一个特定的例子如所示所示 GParted。

    - **GPT fdisk Tools** —— 为 GPT（全局分区表）磁盘创建的工具，使用 `fdisk`。


    ![](img/019.jpeg)

    **图 12: GParted - 基于 GUI 的分区工具**


    这里有一些你可以使用的命令来检查电脑中的磁盘空间：


    | 命令 | 作用 |

    | :--- | :--- |

    | `df -h` | 此命令显示所有挂载设备的磁盘使用情况。`-h` 选项以人类可读的方式呈现结果，使用 G 表示 GB，M 表示 MB |

    | `du /home/edulaney/files/` | 此命令显示指定目录下的所有文件及其对应的大小。你也可以指定文件名 |

    | `du -s /home/edulaney/files/` | `-s` 选项提供指定目录的总大小 |


    **表 8: 检查空间的命令**


    ### 移动存储


    在 Linux 中使用 USB 闪盘和外部硬盘等存储与使用 Windows 或 macOS 类似。插入设备，Linux 会检测设备。除了通过桌面 GUI 访问驱动器外，你还可以导航到
    `/media` 目录并找到挂载的子目录。


    在使用移动媒体后，在移除之前卸载磁盘以避免任何磁盘问题。你通常可以右键点击设备名称并点击任何选项，如“卸载”（Unmount）、“弹出”（Eject）或“安全删除”（Safely
    Remove）。


    ![](img/0021.jpeg)

    **图 13: 弹出媒体**


    ### USB 设备


    你可以将其他设备（如键盘、鼠标）、摄像头、手机、扫描仪和打印机连接到你的 Linux 电脑，并预期它们以即插用的方式工作。


    对于打印机，在 Linux 检测到设备后，你还需要设置打印机配置。按照以下步骤设置新打印机。注意截图截自 Ubuntu 发行版，但这与大多数发行版类似。


    1. 点击桌面上的“系统设置”（System Settings），然后点击“打印机”（Printers）。提供根密码。


    ![](img/0023.jpeg)

    **图 14: 打印机设置菜单**


    2. 点击“添加”（Add）按钮。如果系统检测到了你的打印机，设备将出现在列表中。否则，你需要继续配置并提供打印机驱动程序。点击“下一步”（Forward）。


