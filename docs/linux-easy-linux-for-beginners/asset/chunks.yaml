    文件的第一行指示应使用哪种 shell 来解释脚本。


    ```bash

    #!/bin/sh

    ```


    这表示应该使用 bourne shell 来解释该脚本。


    让我们来一个简单的脚本。输入以下脚本行。将文件保存为 `simplescript.sh`。确保该文件的用户权限设置为 `744`，以便你可以运行该脚本。


    ```bash

    #!/bin/sh

    echo "My name is: $1"

    echo I’m using Linux distro: $2

    echo Today is: $3

    ```


    带 3 个参数运行该脚本：


    ```bash

    ./simplescript.sh Steve Fedora Tuesday

    ```


    输出应该如下所示：


    ```

    My name is: Steve

    I’m using Linux distro: Fedora

    Today is: Tuesday

    ```


    这是一个关于你如何利用它来维护计算机性能的示例。如果你已经使用了 80% 的磁盘空间，那么检查计算机中哪些文件是最大的可能会很有帮助。


    使用下面的命令编写一个新脚本：


    ```bash

    find / -type f -atime +30 -size +1000k -exec ls -l {} \; > /tmp/filecleanup

    ```


    这个 shell 脚本将生成一个名为 `fileCleanup` 的新文件，其中包含大文件的列表。作为管理员，下一步是联系文件所有者，在删除这些文件之前给他们通知。


    正如你可能观察到的，你可以将不同的 Linux 命令与变量、条件表达式、循环和函数结合起来创建脚本。


    到这里，我非常鼓励你继续学习高级 Linux，在其中你将学习更复杂、更强大的 `awk` 和 `sed` 工具。这两个工具在处理数据时特别有用。


