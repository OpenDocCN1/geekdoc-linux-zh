    那么 Linux 处于什么位置呢？我们将在下一节中讨论它。


    ## 什么是 Linux？


    Linux 是一种操作系统，与上一节提到的示例类似，通常被描述为类 Unix 系统。


    Linux 与其他操作系统之间的显著区别在于，Linux 是一个开源操作系统。这意味着 Linux 是通过协作持续开发的，不像 `Windows` 和 `OS
    X` 它们都绑定在各自的公司（`Windows` 和 `Apple`），没有一家公司拥有 `Linux` 的开发和支持权。构建 Linux 是一个共同的愿景，不同的公司共享研究、开发和相关成本。公司与开发者之间的这种开源合作使得
    Linux 成为从小型数字腕表到服务器和超级计算机等领域最优秀的生态系统之一。根据统计，每发布一个内核版本，至少有 100 多家公司和超过 1000 多名开发者在共同工作。


    Linux 由一个内核（核心控制软件）以及许多提供不同功能的库和实用程序组成。Linux 通过许多发行版提供，这些就是我们可以称的 Linux 变（flavours）。发行版是特定内核和程序的组合。最流行的发行版包括
    `Arch`、`SUSE`、`Ubuntu` 和 `Red Hat`。本书侧重于大多数 Linux 发行版具备的功能，尽管这些发行版有时会有自己特定的工具。


    该操作系统最初用作服务器操作系统，后来被作为 Android 开发的基础。直到目前，Linux 在服务器操作系统方面拥有最大的市场份额，但在个人和家庭使用（如桌面电脑和笔记本电脑）方面是最不受欢迎的。在接下来的几节中，我们将深入讨论
    Linux 比其他操作系统更好的原因。


    除了操作系统执行的任务外，Linux 还具有以下特点：


    * 支持集群 – 可以配置多个 Linux 系统，使其从外部看起来像一个单一系统。服务可以在集群之间进行配置，并仍然提供无缝的用户体验。

    * 运行虚拟化 – 虚拟化允许一台计算机在用户看来是几台计算机。Linux 可以被配置为虚拟化主机——你可以在其中运行其他操作系统，如 `Windows`、`Mac
    OS` 或其他 Linux 系统。所有虚拟化系统在外部看来都是独立的系统。

    * 云计算 – Linux 可以处理复杂的、大规模的虚拟化需求——包括虚拟网络、网络存储和虚拟机。

    * 存储选项 – 数据并不总是需要存储在你的计算机硬盘上。Linux 提供了不同的本地和网络存储选项，如 `Fibre Channel` 和 `iSCSI`。


    由于上述应用较为高级，我将不会详细讨论这些功能。然而，这些在将 Linux 与其他操作系统进行比较时是有益的。


    ## Linux 历史


    来自芬兰的学生林纳斯·本尼迪特·托瓦尔斯（Linus Benedict Torvalds）于 1991 年使用 `C` 语言和汇编创建了 Linux。Linux
    是作为一个免费、开源、开放许可的操作系统开发的，这允许全球的开发者研究和修改该操作系统。自从 1991 年发布初始源代码以来，它在 `GNU General
    Public License` 下已增长到超过 1800 万行代码。


    最初，托瓦尔斯将他发明的操作系统命名为 `Freax`，这是“free”（免费）、“freak”（怪胎）和“x”几个词的组合。他将文件上传到 FTP 服务器上，他的同事
    Ari Lemmke 是该 FTP 服务器的管理员。Lemmke 认为 `Freax` 听起来不太好，因此在没有告诉托瓦尔斯的情况下将文件夹重命名为 `Linux`。后来，托瓦尔斯批准了这一更更改。


    1992 年，Linux 在 `GNU GPL` 下获得许可，第一批 Linux 发行版（称为 distro）被创建——`Boot-root`、`MCC Interim
    Linux`、`Softlanding Linux System (SLS)` 和 `Yggdrasil Linux`，其中最早几个之一是同年发布的。随着时间的推移，创建了多个发行版：`Slackware`
    - 最老的现有发行版，`Debian` - 最大的社区发行版，以及商业发行版 `Red Hat` 和 `SUSE`。


    近年来，Linux 经历了更多发展。Linux 的服务器市场收入已经超过了 `Unix`。基于 Linux 的移动操作系统 `Android` 已获得了 75%
    的市场份额。2015 年，`Linux Kernel Version 4.0` 发布。


    通过协作工作，Linux 现在是世界上强大的操作系统之一。数据显示，世界上最快的系统中 98.8% 使用 Linux 内核。知道你正在使用与这些超级计算机相同的操作系统，难道不令人欣慰吗？


    ## Linux 与其他操作系统


    现在，让我们来看重要的问题：Linux 比其他的好吗？让我们将 Linux 与其他著名的操作系统进行比较。


    ### 成本

    如果你合法获得 `Windows`，你将支付超过 100 美元，Pro 版更贵。相反，Linux 是免费的。对于 Linux 商业发行版，公司销售支持和文档等服务，但操作系统本身是免费的。


    ### 病毒

    Linux 几乎没有任何病毒。由于大多数 PC 运行在 `Windows` 上，攻击者的目标是 `Windows OS`。Linux 的开源政策是关键。由于许多开发者在
    Linux 上工作，有更多的眼睛关注安全漏洞。如果真的出现了 Linux 病毒，也有很多帮助。专有操作系统与其雇佣的工程师数量和拥有的资源挂钩。对于 Linux，世界各地的任何开发者都可以下载下载源代码并帮助发现和解决缺陷。


    ### 系统稳定性

    如上一节所述，Linux 被用于服务器和超级计算机。大规模系统可以运行多年而无需重启。进行适当重启的时间是在内核升级期间——即使是对运行在 Linux 服务器上的软件进行升级，也只执行服务重启，而不是节点重启。


    与之相比，想想你经历过因程序崩溃而丢失数据的次数，或者当你插入设备并在 `Windows` 中看到“蓝屏”的时间。我不是说在运行 Linux 运行时你不会关闭电脑，但如果你愿意，这个选项是存在的。


    ### 安装

    当你安装 Linux（其任何变体——`Ubuntu`、`Fedora` 等），你将获得所有需要的东西——文本编辑器、电子表格、演示文程序、照片编辑器、网络浏览器、电影播放器、PDF
    阅读器等。与 `Windows` 和其他操作系统相比，一旦设置好操作系统，你必须一个一个地安装你需要的所有其他软件。


    对于硬件驱动程序也是如此。在 `Windows` 中，你必须先安装驱动程序。购买硬件时，驱动程序通常随光盘提供。现在，想想当你需要安装驱动程序却找不到光盘的时候？你必须去制造商的网站下载特定的驱动程序。在
    Linux 中，驱动程序包含在 `Linux Kernel` 安装包中——你可以节省时间，而且方便得多。


    ### 支持

    Linux 有一个庞大的在线社区，新用户可以在那里获取信息、阅读常见问题（FAQ），并在认为某些程序或功能运行不正常时提问。开源的伟大之处在于，由于有很多人参与该操作系统，有无限的资源供你使用和学习。所有这些都是免费的！


    这些是 Linux 比其他操作系统更好的原因之一。但是，请注意 Linux 使用的是开源软件，所以如果你对下面列出的任何项目表示担忧，那么你应该坚持使用 `Windows`
    或你目前的操作系统：


    '
- fmt: "\n- You need to work using proprietary software. If you absolutely cannot\
    \ find an open source program that will match the proprietary software that you\
    \ need, keep your current OS.\n- You are a serious gamer. Majority of games are\
    \ only made compatible with Windows.\n- Hardware is not yet supported in Linux.\
    \ Very new hardware like those released only in the few months might not yet be\
    \ supported in Linux. Hardware vendors usually release drivers only for Windows\
    \ and Mac since these are the most popular.\n\nMost individuals with Linux installed\
    \ do away with these by what is called dual-booting. This is the option of installing\
    \ both Windows and Linux on your device so you can choose either of the OS depending\
    \ on your needs.\n\nIn this chapter, we have discussed what Linux OS can do and\
    \ how it compares with other existing operating systems. In the next chapter,\
    \ we will go in depth and understand how a Linux operating system works.\n\n#\
    \ Chapter Two: Understanding Linux\n\nIn this chapter, I will provide short information\
    \ on this operating system’s architecture and also discuss about the different\
    \ flavours of Linux that a beginner can choose from.\n\n## Linux Architecture\n\
    \nLinux architecture can be divided into two: the User Space and the Kernel Space.\n\
    \n- **User Space** – This is where the applications are used. The GNU C library\
    \ in the User space is the interface that connects to the kernel and transitions\
    \ between User and Kernel space. This uses all the available memory.\n- **Kernel\
    \ Space** – All Kernel services are processed here. The Kernel space is further\
    \ divided into 3.\n    - **System Call Interface** – A User process can access\
    \ Kernel space through a System Call. When a System Call is performed, arguments\
    \ are passed from User to Kernel space. This is the layer that implements basic\
    \ functions.\n    - **Kernel Code** – This is the architecture-independent code\
    \ and can be seen in all architectures that Linux supports.\n    - **Architecture-Dependent\
    \ Kernel Code** – This is the layer for platform-specific codes.\n\n![](images/00044.jpeg)\n\
    \nFigure 1: Linux Architecture\n\n## Linux Distributions\n\nEach Linux distribution\
    \ consists of a Linux kernel plus utilities and configuration files. Most Linux\
    \ distributions can be downloaded from their websites.\n\nLet’s take a look at\
    \ how several of the popular Linux distributions, or flavours, differ from each\
    \ other based on the following criteria:\n\n### Availability\n\nAs previously\
    \ mentioned, Linux is a free software but companies offering a support contract\
    \ and proprietary components offer it for a fee. In the table below, Red Hat Enterprise\
    \ and SUSE Enterprise both offer Linux commercially but they also have the free\
    \ alternatives – `Fedora` and `openSUSE`.\n\n### Package Format\n\nLinux distributions\
    \ come in packages. Packages are files grouped into one single file. `RPM` is\
    \ the most commonly used.\n\n### Release Cycle\n\nThis is how often a distribution\
    \ releases new software. The ones with shorter release cycles provide the latest\
    \ software in the shortest possible length of time while those distributions with\
    \ longer release cycles aim to offer the most stable environments possible. A\
    \ distribution can have it done both ways. Take a look at `Ubuntu` who releases\
    \ both long-term support (LTS) versions (longer cycle) and the latest software\
    \ through a 6month cycle.\n\n| Distribution | Availability | Package Format |\
    \ Release Cycle |\n| :--- | :--- | :--- | :--- |\n| Arch | Free | `pacman` | Rolling\
    \ |\n| CentOS | Free | `RPM` | Approx. 2-yr |\n| Debian | Free | `Debian` | 2-yr\
    \ |\n| Fedora | Free | `RPM` | Approx. 6-mo |\n| Gentoo | Free | `ebuild` | Rolling\
    \ |\n| Mint | Free | `Debian` | 6-month |\n| openSUSE | Free | `RPM` | 8-month\
    \ |\n| Red Hat Enterprise | Commercial | `RPM` | Approx. 2-yr. |\n| Scientific\
    \ | Free | `RPM` | Approx. 6-mo |\n| Slackware | Free | `tarballs` | Irregular\
    \ |\n| SUSE Enterprise | Commercial | `RPM` | 2-3 years |\n| Ubuntu | Free | `Debian`\
    \ | 6-month |\n\nTable 1: Comparison of Popular Linux Distributions\n\nTo help\
    \ you decide on which is the right distribution for you, consider the criteria\
    \ mentioned above and research on the other fields listed below:\n\n- **Desktop\
    \ environment**: Do your research and find out if the particular distribution\
    \ that you’re eyeing has a basic look and feel that you like plus check how customizable\
    \ it is\n- **Hardware Compatibility**: Depending on the hardware that you are\
    \ using, some drivers might not be available yet by the time you install your\
    \ distro. Check from online resources first to know which ones can be supported\
    \ out-of-the-box.\n- **Community Support**: Find the one with a large online community.\
    \ The bigger the community is, the easier it will be to find documentation and\
    \ get support.\n\nI personally recommend Linux Mint for those who have never used\
    \ Linux before. The installation is easy and fuss-free, plus the menus are familiar\
    \ (see image below). It also comes with an added bonus of proprietary software\
    \ that comes preinstalled (eg. Adobe Flash, MP3 support).\n\n![](images/00001.jpeg)\n\
    \nFigure 2: Mint Desktop\n\nOnce you are familiar with Mint and you feel like\
    \ you want to branch out to other distributions, I recommend `Ubuntu` as your\
    \ next distro. `Ubuntu` makes Linux easy to use for the experienced, average user.\
    \ The distro also comes with a standard set of programs that can get you working\
    \ in no time after installation.\n\n![](images/00005.jpeg)\n\nFigure 3: Ubuntu\
    \ Distribution\n\nIn this chapter, we talked about the different components that\
    \ make up Linux and touched on the differences of popular distributions. I hope\
    \ this will help you find the right distribution that you want to start your Linux\
    \ experience on. In the next chapter, I will walk you through the process of Linux\
    \ installation.\n\n# Chapter Three: Linux Installation\n\nIn this chapter, we\
    \ will discuss about finally installing Linux in your computer. Depending on how\
    \ you want your setup to be, you can either wipe your hard drive clean and replace\
    \ your OS or share the disk with Linux.\n\n## Linux on Your PC\n\nFor beginners,\
    \ there are two ways on how you can test the waters with Linux.\n\nFirst, you\
    \ can get a Live CD. If you want to leave your current OS untouched but you want\
    \ to try Linux first, then this is the best option. Using a Live CD will allow\
    \ you to boot from a CD/USB and use Linux. Once you’re done, remove the CD/USB\
    \ and reboot the computer to use your current OS.\n\nSecond, you can directly\
    \ proceed to installing Linux on your computer, either on its own or shared with\
    \ your existing OS. The latter will take a few steps to do hard partitioning.\n\
    \n## Pre-Installation Steps\n\nBefore proceeding with the installation, it will\
    \ be a good idea to check your PC’s hardware first. You may check the hardware\
    \ vendor’s site to check the compatibility list.\n\n- **DVD Drive**: To install\
    \ Linux, you must have a DVD drive and your computer must be able to boot from\
    \ the drive. If your hard drive controller is `IDE/ATA` or `USB DVD`, this will\
    \ work in Linux.\n- **Hard Drives**: This is not necessary if you will be using\
    \ the Live CD. If you will be installing Linux, it is ideal to have at least 4GB\
    \ of disk space. Linux supports `IDE` and `SCSI` hard drive controllers.\n- **Keyboard**:\
    \ All keyboards work with Linux.\n- **Monitor**: Most distribution installers\
    \ can detect modern monitors. If you find that it does not display well, choose\
    \ a monitor type and a specific resolution (1024x768).\n- **Mouse**: `PS/2` or\
    \ `USB` mouse works with Linux.\n"
  raw: "- You need to work using proprietary software. If you absolutely cannot find\
    \ an open source program that will match the proprietary software that you need,\
    \ keep your current OS.\n\n- You are a serious gamer. Majority of games are only\
    \ made compatible with Windows.\n\n- Hardware is not yet supported in Linux. Very\
    \ new hardware like those released only in the few months might not yet be supported\
    \ in Linux. Hardware vendors usually release drivers only for Windows and Mac\
    \ since these are the most popular.\n\nMost individuals with Linux installed do\
    \ away with these by what is called dual-booting. This is the option of installing\
    \ both Windows and Linux on your device so you can choose either of the OS depending\
    \ on your needs.\n\n***\n\nIn this chapter, we have discussed what Linux OS can\
    \ do and how it compares with other existing operating systems. In the next chapter,\
    \ we will go in depth and understand how a Linux operating system works.\n\n#\
    \ Chapter Two: Understanding Linux\n\nIn this chapter, I will provide short information\
    \ on this operating system’s architecture and also discuss about the different\
    \ flavours of Linux that a beginner can choose from.\n\nLinux Architecture\n\n\
    Linux architecture can be divided into two: the User Space and the Kernel Space.\n\
    \n*   User Space – This is where the applications are used. The GNU C library\
    \ in the User space is the interface that connects to the kernel and transitions\
    \ between User and Kernel space. This uses all the available memory.\n\n*   Kernel\
    \ Space – All Kernel services are processed here. The Kernel space is further\
    \ divided into 3.\n\n    *   System Call Interface – A User process can access\
    \ Kernel space through a System Call. When a System Call is performed, arguments\
    \ are passed from User to Kernel space. This is the layer that implements basic\
    \ functions.\n\n    *   Kernel Code – This is the architecture-independent code\
    \ and can be seen in all architectures that Linux supports.\n\n    *   Architecture-Dependent\
    \ Kernel Code – This is the layer for platform-specific codes.\n\n![](images/00044.jpeg)\n\
    \nFigure 1: Linux Architecture\n\nLinux Distributions\n\nEach Linux distribution\
    \ consists of a Linux kernel plus utilities and configuration files. Most Linux\
    \ distributions can be downloaded from their websites.\n\nLet’s take a look at\
    \ how several of the popular Linux distributions, or flavours, differ from each\
    \ other based on the following criteria:\n\n- Availability\n\nAs previously mentioned,\
    \ Linux is a free software but companies offering a support contract and proprietary\
    \ components offer it for a fee. In the table below, Red Hat Enterprise and SUSE\
    \ Enterprise both offer Linux commercially but they also have the free alternatives\
    \ – Fedora and openSUSE.\n\n- Package Format\n\nLinux distributions come in packages.\
    \ Packages are files grouped into one single file. RPM is the most commonly used.\n\
    \n- Release Cycle\n\nThis is how often a distribution releases new software. The\
    \ ones with shorter release cycles provide the latest software in the shortest\
    \ possible length of time while those distributions with longer release cycles\
    \ aim to offer the most stable environments possible. A distribution can have\
    \ it done both ways. Take a look at Ubuntu who releases both long-term support\
    \ (LTS) versions (longer cycle) and the latest software through a 6month cycle.\n\
    \n| Distribution | Availability | Package Format | Release Cycle |\n\n| Arch |\
    \ Free | pacman | Rolling |\n\n| CentOS | Free | RPM | Approx. 2-yr |\n\n| Debian\
    \ | Free | Debian | 2-yr |\n\n| Fedora | Free | RPM | Approx. 6-mo |\n\n| Gentoo\
    \ | Free | ebuild | Rolling |\n\n| Mint | Free | Debian | 6-month |\n\n| openSUSE\
    \ | Free | RPM | 8-month |\n\n| Red Hat Enterprise | Commercial | RPM | Approx.\
    \ 2-yr. |\n\n| Scientific | Free | RPM | Approx. 6-mo |\n\n| Slackware | Free\
    \ | tarballs | Irregular |\n\n| SUSE Enterprise | Commercial | RPM | 2-3 years\
    \ |\n\n| Ubuntu | Free | Debian | 6-month |\n\nTable 1: Comparison of Popular\
    \ Linux Distributions\n\nTo help you decide on which is the right distribution\
    \ for you, consider the criteria mentioned above and research on the other fields\
    \ listed below:\n\n- Desktop environment: Do your research and find out if the\
    \ particular distribution that you’re eyeing has a basic look and feel that you\
    \ like plus check how customizable it is\n\n- Hardware Compatibility: Depending\
    \ on the hardware that you are using, some drivers might not be available yet\
    \ by the time you install your distro. Check from online resources first to know\
    \ which ones can be supported out-of-the-box.\n\n- Community Support: Find the\
    \ one with a large online community. The bigger the community is, the easier it\
    \ will be to find documentation and get support.\n\nI personally recommend Linux\
    \ Mint for those who have never used Linux before. The installation is easy and\
    \ fuss-free, plus the menus are familiar (see image below). It also comes with\
    \ an added bonus of proprietary software that comes preinstalled (eg. Adobe Flash,\
    \ MP3 support).\n\n![](images/00001.jpeg)\n\nFigure 2: Mint Desktop\n\nOnce you\
    \ are familiar with Mint and you feel like you want to branch out to other distributions,\
    \ I recommend Ubuntu as your next distro. Ubuntu makes Linux easy to use for the\
    \ experienced, average user.  The distro also comes with a standard set of programs\
    \ that can get you working in no time after installation.\n\n![](images/00005.jpeg)\n\
    \nFigure 3: Ubuntu Distribution\n\n***\n\nIn this chapter, we talked about the\
    \ different components that make up Linux and touched on the differences of popular\
    \ distributions. I hope this will help you find the right distribution that you\
    \ want to start your Linux experience on. In the next chapter, I will walk you\
    \ through the process of Linux installation.\n\n# Chapter Three: Linux Installation\n\
    \nIn this chapter, we will discuss about finally installing Linux in your computer.\
    \ Depending on how you want your setup to be, you can either wipe your hard drive\
    \ clean and replace your existing OS with Linux or keep your existing OS and share\
    \ the disk with Linux. The latter will take a few more steps to do the hard disk\
    \ partitioning.\n\nLinux on Your PC\n\nFor beginners, there are two ways on how\
    \ you can test the waters with Linux.\n\nFirst, you can get a Linux Live CD. If\
    \ you want to leave your current OS untouched but you want to try out Linux first,\
    \ then this is the best option. Using a Live CD will allow you to boot from a\
    \ CD/DVD or USB drive and use Linux. Once you’re done, remove the CD/USB and reboot\
    \ the computer to use your current OS. When you’re running the Live CD, you might\
    \ notice it to be a little slow since the OS is loading from the drive. You can\
    \ get Live CDs from Knoppix [http://knoppix.net/get.php](http://knoppix.net/get.php)\
    \ or from Ubuntu [http://www.ubuntu.com/download/desktop/try-ubuntu-before-you-install](http://www.ubuntu.com/download/desktop/try-ubuntu-before-you-install).\n\
    \nSecond, you can directly proceed to installing Linux on your computer, either\
    \ on its own or shared with your existing OS.\n\nThe steps discussed in the succeeding\
    \ sections apply to both using Live CD and those installing Linux.\n\nPre-Installation\
    \ Steps\n\nBefore proceeding with the installation, it will be a good idea to\
    \ check your PC’s hardware first. You may check the hardware vendor’s site to\
    \ check the compatibility list.\n\n- DVD Drive: To install Linux, you must have\
    \ a DVD drive and your computer must be able to boot from the drive. If your hard\
    \ drive controller is IDE/ATA or USB DVD, this will work in Linux.\n\n- Hard Drives:\
    \ This is not necessary if you will be using the Live CD. If you will be installing\
    \ Linux, it is ideal to have at least 4GB of disk space. Linux supports IDE and\
    \ SCSI hard drive controllers.\n\n- Keyboard: All keyboards work with Linux.\n\
    \n- Monitor: Most distribution installers can detect modern monitors. If you find\
    \ that it does not display well, choose a monitor type and a specific resolution\
    \ (1024x768).\n\n- Mouse: PS/2 or USB mouse works with Linux."
