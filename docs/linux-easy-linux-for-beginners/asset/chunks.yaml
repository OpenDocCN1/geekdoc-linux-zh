    \ is responsible for allocating `CPU resources`. The `OS` also provides the user\
    \ the option to start, stop, or restart a process.\n* **Manage memory** – Each\
    \ application needs a specific amount of `RAM` and swap memory to function. The\
    \ `OS` is responsible for assigning memory allocations and for handling memory\
    \ requests.\n* **Initiate user interfaces** - An `OS` offers users ways to access\
