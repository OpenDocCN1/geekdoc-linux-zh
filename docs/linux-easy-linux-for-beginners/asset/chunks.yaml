    ## Installing Additional Software


    Linux-compatible softwares come in `.rpm` for RPM (Fedore, SUSE) or `.deb` for
    Debian (Debian, Ubuntu, Xandros) packages. Even if the type of packages varies,
    both RPM and Debian packages can be installed in any type of Linux distribution.
    Popularly used distributions provide a GUI for installing additional applications.
    In this section, I will discuss on the ways of installing software in Ubuntu and
    Fedora.


    ### Installing Applications in Ubuntu


    Debian-based distros use APT or the Advanced Packaging Tool.


    You can use the command below to install packages to your computer.


    ```

    apt-get install package-name

    ```


    This command will download the specific package name that you want to install.
    In case you do not know the package name, you can search for a keyword.


    ```

    apt-cache search keyword

    ```


    For example, I am looking for an application that I can use to take screenshots
    in my GNOME desktop. I can further refine my search functionality with the following
    command:


    ```

    apt-cache search screenshot | grep GNOME

    ```


    The command will display the applicable lines that fit the search string:


    ```

    shutter - feature-rich screenshot program

    ```


    `shutter` is the package name. Use the package name and run the `apt-get install`
    command again.


    Aside from installing packages via the command line, you can also use the Software
    & Updates Tool. The GUI provides a simple and easy way to update your Ubuntu software
    and download packages.


    ![](images/00041.jpeg)


    Figure 19: Software & Update Tool


    Similar to Windows and Mac OS application stores, Ubuntu also has its Software
    Center where you can get new software and download the latest updates.


    ![](images/00043.jpeg)


    Figure 20: Ubuntu Software Centre


    ### Installing Applications in Fedora


    Fedora uses RPM packages. If you are using a GNOME desktop, you can simply use
    the Add or Remove Software tool (similar to Windows) to install new software.


    Click on System➪ Administration then on Add/Remove Software to access the menu.
    The utility will then display the Package Manager box showing the list of all
    packages. Select the corresponding check box and click on Apply or Update (if
    you are updating the packages). Clicking on the Apply button will install (or
    uninstall) the specific packages.


    ![](images/00008.jpeg)


    Figure 21: Fedora Add/Remove Packages


