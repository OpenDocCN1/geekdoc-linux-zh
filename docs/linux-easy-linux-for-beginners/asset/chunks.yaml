    # 硬件要求


    - **网卡**: 安装程序可以检测大多数网卡。如果你发现某个网卡在使用时遇到问题，请在网上查找额外信息。

    - **处理器**: 要求的最低速度为`700 MHz`。如今新处理器的速度远高于此值。从速度而言，数字越高越好。

    - **内存 (RAM)**：内存越大越好。最低要求为`512MB`。请检查你特定发行版对应的内存——其他发行版可能需要更大的内存分配。

    - **声卡、显卡、打印机**: 确保这些设备与 Linux 兼容。请参考硬件供应商网站获取更多信息。


    # 为 Linux 准备空间


    如果你选择在不移除当前操作系统的情况下安装 Linux，请注意，你现有的操作系统使用了整个硬盘。这意味着 Linux 和你当前的操作系统需要共享硬盘，以便两个操作系统能够共存。你将需要对硬盘进行分区和划分。如果你选择此路线，请务必备份你的系统，因为存在擦除硬盘上数据的风险。


    为了方便分区，你可以获取运行在 Windows 上的硬盘分区产品，或者使用大多数 Linux 发行版带的名为 `QTParted` 的图形界面工具。某些发行版（如
    `openSUSE` 或 `Xandros Desktop`）可以缩小 Windows 分区并自动为 Linux 创建分区。如果你的发行版提供此功能，你将不再需要分区工具。


    ## Ubuntu 分区步骤


    一旦 Ubuntu 启动并出现 GUI 桌面，请按照以下步骤缩小 Windows 分区的大小：


    1. 从 Ubuntu 桌面点击 `System ➪Administration➪GParted`。`GParted` 窗口将出现，并显示在你的 PC 上找到的驱动器。你看到的第一个硬盘设备名为
    `/dev/sda`，下一个命名为 `/dev/sdb`，以此此类推。

    2. 在 `GParted` 窗口的右侧，从设备列表中选择。

    3. 选择你想调整大小的分区。你需要寻找最大的分区。

    4. 从 `GParted` 菜单中选择 `Resize/Move`（调整大小/移动）。

    5. 指定分区的新大小，然后点击 `Resize/Move`。指定的大小应在分区后为你留出 `4GB` 或更多的可用磁盘空间。

    6. 点击 `Apply`（应用）开始应用你所做的更改。


    在硬盘上获得 Linux 所需的空闲空间后，你现在开始安装你选择的 Linux 发行版。


    # 安装步骤


    访问 Linux 发行版网站并下载发行版文件。你下载的文件将带有安装步骤。在本节中，我们将讨论任何 Linux 发行版的通用安装步骤。


    - **第 1 步**:准备你的 CD/DVD 安装器或 Live CD。下载你计划安装的发行版副本并将其刻录到 CD/DVD 中。

    - **第 2 步**:确保你的 PC 可以从 CD/DVD 驱动器启动。如果在驱动器中有 CD/DVD 的情况下你的 PC 仍然从硬盘启动，请先更改 `Boot
    Devices`（启动设备）。进入 `BIOS` 并更改启动顺序——将 `CD/DVD drive` 选择为第一个启动项。你可以通过重启 PC 并按键（大多数电脑上为
    `F2` 或 `Del`）进入 `Setup`（设置）菜单。核实你电脑品牌和型号对应的按键。一旦完成将 `CD/DVD drive` 分配为启动项，将光盘放入驱动器并重启电脑。

    - **第 3 步**: 如果使用的是 Live CD，请重启电脑。电脑将启动并从你的 Live CD 加载操作系统。如果你正在安装 Linux，第 3 步是为硬盘划分分区。分区的一个选项已在上一节中描述过。


    一旦你已经设置好分区，请从 CD/DVD 驱动器启动电脑并继续安装。虽然安装过程因发行版而异，但这些通常是简单且直接的步骤。参考随文档附带的安装屏幕，你应该可以在一到两小时内完成。


    安装过程中还会有一些配置步骤，例如设置日期和时间、语言以及选择要安装的软件包。


    安装完成后，重启你的电脑。


    # 安装故障排除


    我们都希望安装顺利，但万一事不如人意，这里有一些你可以检查的初始故障排除提示。


    ## 安装程序无法启动 X Window


    X Window 是许多 Linux 发行版包含的图形用户界面。如果安装程序没有检测到显卡或由于任何其他原因安装程序未能启动 X，你可以选择文本模式安装。


    请参考下表获取访问文本模式安装界的不同方法。


    | 发行版 | 如何访问文本模式安装 |

    | :--- | :--- |

    | Debian | 默认为文本模式 |

    | Fedora | 看到 `boot:` 提示时输入 `text` |

    | SUSE | 按 `F3` 并使用方向键选择 `Text-Mode` 。按回车。 |

    | Ubuntu | 默认为文本模式 |

    | Xandros | 从 CD/DVD 驱动器重启时按住 `Shift` 键。选择 `Rescue Console`（救援控制）。看到 `bash` 提示时输入
    `quick_install`。 |


    **表 2：安装期间如何访问文本模式**


    你的发行版不在列表中吗？请在网上查找如何为你的发行版启动文本模式安装。


    文本模式安装界面与安装屏幕类似，你必须根据提示执行操作。一旦进入文本模式，请仔细阅读提示。


    ## 安装后 X 无法工作


    如果你在安装期间看到了 GUI，但在首次重启后遇到了灰色屏幕或黑屏，这里是你可以使用的一些步骤。


    1. 重启 PC。按 `Ctrl+Alt+Delete`。

    2. 一旦 PC 启动，如果发行版使用 `GRUB`，按 `A` 键。如果是 `LILO`，则跳过此步。`GRUB` 引导程序将显示 Linux 内核的命令行并要求你添加内容。对于
    `GRUB`，输入空格以及 `single`。按回车。对于 `LILO`，输入 `Linux single` 然后按回车。Linux 内核将以单用户模式启动并显示以下提示：

    ```

    sh-3.0#

    ```

    一旦看到此提示，你现在可以配置 X。


    取决于你使用的发行版，X 使用配置文件来设置显示卡、显示器和分辨率。问题有时发生在 Linux 安装程序的 X 配置不正确。


    通过创建一个有效的配置文件来解决这个问题：


    1. 输入命令：

    ```

    X -configure

    ```

    一旦输入此命令，X 服务器将创建一个配置文件。你会看到屏幕变空并显示消息。

    2. 使用文本编辑器 `vi` 编辑文件 `/etc/xorg.conf.new`。在 `Section "Files"` 下插入以下行：

    ```

    FontPath "unix/:700"

    ```

    使用 Fedora 时，你还需要将 `/dev/mouse` 修改为 `/dev/input/mice`。

    3. 输入命令启动 X 字体服务器：

    ```

    xfs

    ```

    4. 输入以下行启动新的配置文件：

    ```

    X -config /etc/xorg.conf.new

    ```

    一旦看到带有 X 光标的空白屏幕，说明配置文件工作正常。

    5. 使用 `Ctrl+Alt+Backspace` 停止 X 服务器。

    6. 输入以下命令将配置文件复制到 `/etc/X11` 目录：

    ```

    cp /etc/xorg.conf.new /etc/X11/xorg.conf

    ```

    7. 输入 `reboot` 或按 `Ctrl+Alt+Delete` 重启电脑。


    如果配置文件更改顺利，登录界面将会出现。


