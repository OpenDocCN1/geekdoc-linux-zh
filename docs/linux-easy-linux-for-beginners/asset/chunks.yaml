    Linux 在安装时会自动创建多个用户账户，即使你是该电脑的唯一使用者。系统使用这些账户来运行程序。不同的账户可以保护系统（包括文件和目录）免受未经授权的访问。可以将用户分配到组中以便于管理。


    要添加、修改或删除用户或组账户，你可以使用图形用户界面（GUI），也可以通过命令行完成。作为初，建议你尝试这两种方法，看看哪种方法最适合你。


    ## 通过 GUI 管理用户和组


    如果你使用的是 SUSE，请打开 `YaST`；或者使用发行版中相应的设置菜单。点击“安全与用户”或任何类似的用户管理类别。


    ![](img/00032.jpeg)


    图 29: YaST 添加用户


    点击“添加用户”按钮，并提供必要的信息，例如用户的全名、首选用户名和密码。你可以探索并配置额外信息，如登录尝试限制、密码设置和用户组。完成后，点击“确定”按钮以继续创建用户账户。


    你也可以使用 GUI 修改或删除账户。执行必要的账户修改并点击“确定”按钮以应用更改。


    要创建、修改或删除用户组，请选择“组”而不是“用户”。下面的图片显示了 YaST 添加新组的界面。提供必要的信息并点击“确定”按钮完成组的创建。


    ![](img/00026.jpeg)


    图 30: 添加组


    ## 通过 CLI 管理用户和组


    通过 CLI 添加新用户仅需几行命令。首先，使用命令 `su–` 以 root 身份登录。


    使用以下命令创建新账户：


    ```

    /usr/sbin/useradd -c "Kevin Jones" kjones

    ```


    接下来，设置密码。当你执行以下命令时，系统会提示你两次输入并确认密码。


    ```

    passwd kjones

    ```


    要修改账户，使用 `usermod` 命令并配合你想要修改的信息相关的选项。要删除用户账户，使用 `/usr/sbin/userdel username`
    命令。


    要添加用户组，你需要使用命令 `groupadd groupname`。


    例如，让我们创建一个名为 `office` 的组。要创建此组，输入以下命令：


    ```

    groupadd office

    ```


    由于 Kevin 是工作中的同事，我们将他加入 `office` 组。执行此操作，请使用以下命令：


    ```

    usermod -G office kjones

    ```


    要删除该组，使用命令 `groupdel office`。


    再次，我鼓励你使用 `man` 命令来了解更多关于特定命令可用选项的信息。


    ## 文件所有权


    用户和组账户拥有 Linux 文件或目录。要查看特定文件的所有者，使用命令 `ls –l filename`。


    这里是命令的示例输出。选择一个文件名并在你的终端上尝试一下！


    ```

    -rw-rw-r-- 1 kjones office 40909 Jul 16 20:37 file1.txt

    ```


    第一组字母代表权限设置（执行、读取、写入）。第二部分值为 `kjones office`，表示所有该文件的用户账户和组账户。


    如果你想将文件的所有者从 `kjones` 更改为用户 `rbentley`，请以 root 身份登录并使用以下命令：


    ```

    chown rbentley file1.txt

    ```


    此外，要更改文件的组所有者，输入命令：


    ```

    chgrp staff file1.txt

    ```


    ## Linux 基础安全


    ### 设置密码


    在创建账户时，作为管理员，要务必创建难以破解的良好密码。记住避开由个人信息（如生日、街道地址或姓名）组成的密码、字典中可以找到的单词以及简单的字母数字组合。


    使用包含混合大小写（大写字母和小写字母）、带有数字或标点符号、或者反序书写的密码。还应实施其他预防机制，例如提示用户每隔 X 天更改密码，以及在尝试登录 Y
    次后锁定账户。


    ### 文件保护


    要保护文件免受未经授权的访问（查看和修改），请检查你的文件权限设置。在上一节中，我们讨论了如何为文件分配用户和组所有者。接下来，我们需要为所有者、组和全局（所有其他用户）指定正确的文件权限。


    回到 `ls` 命令的结果：


    ```

    rw-rw-r-- 1 kjones office 40909 Jul 16 20:37 file1.txt

    ```


    第一组字母（绿色显示）表示用户的文件权限。下一组（蓝色显示）针对用户组，而橙色部分代表全局权限。


    *   `r` – 允许读取文件内容

    *   `w` – 允许写入文件

    *   `x` – 允许执行（如果文件包含 bash 脚本）


    这意味着 `kjones` 对文件具有读取和写入权限。这与 `office` 组账户的权限相同。所有其他用户（全局）将仅被允许读取文件。


    要更改权限，使用权限的八进制表示法并指定三个级别（用户、组和全局）的值。


    | 权限 | 表示法 |

    | :--- | :--- |

    | rwx | 7 |

    | rw- | 6 |

    | r-- | 4 |

    | r-x | 5 |

    | --x | 1 |


    表 11: 权限值


    现在让我们尝试移除组的写入权限。


    ```

    chmod 644 file1.txt

    ```


    当你再次列出 `file1.txt` 的详情时，组的写入权限应该已经被删除了。


    ```

    rw-r--r-- 1 kjones office 40909 Jul 16 20:37 file1.txt

    ```


    有多种方法可以保护你的系统，例如设置防火墙、保护互联网服务、加密文件以及使用数字证书。为了本书的目的（Linux 初学者教程），我只讨论了基础和初始的安全实践。


    在下一章中，我将提供脚本的概述，如果你想学习更多关于 Linux 的知识，这是另一个练习方面。


    # 第九章：脚本简介


    我们已经到了书的最后一章。到此时，你已经熟悉了 Linux 环境是如何运作的，并且一定已经注意到它与你之前的操作系统有多不同。我的建议是你更上一层楼，开始学习如何在
    Linux 中创建脚本。在本章中，我将快速预览 Linux 脚本。


    ## 选择文本编辑器


    Shell 脚本是基于文本的文件。开始你的脚本之旅，请选择一个最适合你的文本编辑器。Linux 发行版预装了文本编辑器，但最常用的列举如下：


    *   `vi` – 通常默认安装。管理员青睐它是因为它是一个强大、灵活且强大的编辑器。

    *   `emacs` – 包含许多功能但对新手并不友好

    *   `pico` – emacs 的简化版本（不包含那些功能）

    *   `nano` – pico 的克隆版本但带有某些功能


    下载这些编辑器的包并亲自体验一下。我个人使用 `vi` 是因为它易用、简单，以及我整体的舒适和熟悉。


    ![](img/00003.jpeg)


    图 31: vi 文本编辑器


    `vi` 使用键执行命令。这里是一些示例：


    | vi 命令 | 功能 |

    | :--- | :--- |

    | o | 在命令模式下输入此键可新建行并进入输入 |

    | I | 输入此键在光标左侧插入后续字符 |

    | u | 撤销更改 |

    | ESC | 退出插入模式 |

    | wq! | 保存更改并退出 |


    表 12: 示例 vi 按键


    你选好文本编辑器了吗？现在让我们尝试一个简单的脚本。


    ## 简单脚本


    脚本是可以由 shell 解释或编译的程序。在 Linux 中我们称之为脚本，因为大多数脚本运行在 bash 或任何其他 shell (ksh, csh,
    bash) 中。


    脚本对于自动化和简化管理任务、系统日志监控以及数据处理非常有用。要开始编写脚本，使用 `vi` 或你选择的编辑器打开一个文本文件。

