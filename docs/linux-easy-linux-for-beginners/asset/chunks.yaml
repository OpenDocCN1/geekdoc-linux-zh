- fmt: '

    Most, if not all, Linux distributions have a solid community online. If you encounter
    problems during the installation, search for the problem, describe it in detail,
    or use the actual error message as your search keyword. You will find the information
    that you need and if not, you can always post in the forums and the community
    will be ready to help.


    Visit the following forums for more information:


    - Ubuntu: [http://ubuntuforums.org/](http://ubuntuforums.org/)

    - Linux Mint: [http://linuxmint.com/forum/](http://linuxmint.com/forum/)

    - SUSE: [https://forums.suse.com/forum.php](https://forums.suse.com/forum.php)

    - Debian: [http://www.debianhelp.org/](http://www.debianhelp.org/)


    ***


    In this chapter, we discussed about the Linux installation proper. Now that you
    have Linux in your PC, we’ll do a walkthrough of your first Linux experience.


    # Chapter Four: Your First Linux Experience


    Now that your Linux system is up and running on your computer, let’s start exploring
    the system.


    ## Turning on Your PC


    Once you turn on your computer, the boot loader – either `GRUB` or `LILO`, will
    come up and display the names of the operating systems installed in the computer.
    Use the arrow keys to select which OS you would like to load. This is applicable
    for PCs with two OS installed. If Linux is the only OS on your computer, wait
    for a couple of seconds as the boot loader starts up Linux.


    Once Linux boots, a graphical login screen will be shown. Note however that other
    distributions don’t require login upon start up. Each Linux distribution uses
    the `root` username for administrator access. In order to avoid doing any accidental
    changes to your system when you use `root`, login to your system using a different
    account. Assigning the root password is part of the installation process. Make
    sure that you know and remember your system’s root password.


    Here is an example an Ubuntu desktop after logging in:


    ![](images/00006.jpeg)


    Figure 4: Ubuntu Desktop


    The desktop that comes up is either `KDE` or `GNOME`. We will discuss more of
    these in the succeeding sections.


    ## Getting To Know Shell


    The GUI from `KDE` or `GNOME` provides the best way to explore Linux through icons,
    windows, and pointers. However, in the event that the GUI does not work (as we
    have seen in the section about Installation Troubleshooting), it’s a plus if we
    know how to use the terminal. Typing commands in the terminal is usually faster
    than navigating and clicking too.


    In your desktop, browse and find the icon that looks like a monitor. This is the
    icon for the terminal window. If you can’t find the icon, explore the Main Menu
    and find the one with the label `Console` or `Terminal`.


    ![](images/00007.jpeg)


    Figure 5: Terminal on a KDE Desktop


    Here is how it looks like for Ubuntu:


    ![](images/00009.jpeg)


    Figure 6: Terminal Screen on Ubuntu


    The shell is where you can run executable files and shell scripts. The shell is
    also what we call the command line. Commands are written using the general syntax
    below:


    ```

    command option1 option2 . . . optionN

    ```


    Here are a few sample commands you can try in your Linux environment, with their
    corresponding output:


    ```

    uptime

    19:26  up 29 days,  1:39, 2 users, load averages: 1.32 1.36 1.34

    ```


    `uptime` is the command that shows the duration that the computer has been up.
    In this case, the computer has been up for the last 29 days or almost 1 month.


    ```

    uname –srv

    Linux 3.9.31.5-127.fc12.i686 #1 SMP Mon Nov 18 18:21:25 EST 2015

    ```


    `uname` is the command to show the operating system name. `-s` (print the operating
    system name), `-r` (print the operating system release), and `-v` (print the operating
    system version) are options that you can use for the `uname` command. In the particular
    example, we want to use all three so we put `n –srv` to simplify. If we want to
    display the results as if we used all the options, we can use the `-a` option.


    To know about the options that you can use for a particular command, you can use
    the `man` command.


    ```

    man uname

    ```


    The `man` command is extremely useful especially for beginners. This displays
    all the options that you can use. Try to use the command for every Linux command
    that you encounter.


    To switch to root while in the shell, enter the command `su-` and then input your
    root password. Changing to root password while in the shell environment will allow
    you to run tasks that only administrators and superusers can do.


    ## Linux Desktops


    There are two commonly used GUIs that come with Linux distributions: `GNOME` and
    `KDE`. You can have both installed in your computer and switch between the two
    whenever you want. Both GUIs also run on Unix, and while there are other GUIs
    that can be installed on Linux, these two remain as the most popular in use.


    Here is a chart that compares both desktops:


    | Criteria | GNOME | KDE |

    | :--- | :--- | :--- |

    | Availability | Free | Free |

    | Minimum System Requirements | 700 Mhz CPU, 768 MB RAM | 1 Ghz CPU, 615 MB RAM
    |

    | Development Priorities | Focuses on freedom, accessibility, and developer-friendliness
    | Provides an aesthetically pleasing website with great configurability |

    | Customization Experience | Interface is simple to use and great for first-time
    Linux users, advanced users may find its customization settings as limiting |
    Allow for versatile configuration that creates great looking desktop, but user
    has to learn to navigate the options. Customization makes it more resource-intensive
    |

    | Default appearance (Note that both offers customization options) | Default setting:
    Toolbar at the top and a dock that pops out featuring application icons | Default
    setting: toolbar at the bottom and a main menu. |

    | Universal Search | Uses text-based search functionality | Uses text-based and
    menu-based navigation |

    | Resource Usage and User Experience | Less resource-intensive than KDE | Good
    for users who came from Windows OS |


    Table 3: Comparison of GNOME and KDE desktops


    Those are only some of the criteria in which the two GUIs differ. However, I encourage
    you to try both desktops so you can evaluate which one suits you best.


    I’ll show you some screenshots displaying the default settings of the desktops.
    `GNOME` desktop is shown in the next figure with its toolbar at the top that features
    details such as Applications Running, Day and Time, Volume, Network, and Battery
    Life.


    ![](images/00010.jpeg)


    Figure 7: A GNOME desktop running on Fedora


    ![](images/00015.jpeg)


    Figure 8: Gnome Folder Menu


    The next set of screenshots show the default desktop for `KDE`. You’ll find the
    panel at the bottom of the screen – similar to a Windows desktop.


    ![](images/00034.jpeg)


    Figure 9: KDE Desktop on openSUSE


    ![](images/00029.jpeg)


    Figure 10: Menu Options on a KDE


    Both can be customized to get the look and feel that you want to achieve. Go ahead
    and experiment with the desktops! Some distro only have one pre-installed but
    you can always get and install both. You can switch between the two in seconds.


    ## Navigating the Linux Filesystem


    Linux organizes files using a hierarchical system. Files are stored inside directories
    and these directories can also contain other directories. When you compare the
    Linux filesystem to Windows, you will find that there are no drive letters in
    Linux. All files are stored in a single root directory noted as `/` regardless
    of where the data is physically stored (hard drive, external drive, or CR-ROM).


    To find a file in Linux, you also need the information about the directory hierarchy
    known as the pathname. The figure below dissects a sample path name.


    ![](images/00039.jpeg)


    Figure 11: Pathname in Linux


    The pathname is composed of a top-level directory, a directory hierarchy, and
    the filename with the file extension. All are separated by a forward slash (`/`).


    Here is a listing of Linux top-level directories and the data that they contain:


    | Top-Level Directory | Files that the directory contains |

    | :--- | :--- |

    | `/` | Single root directory – file system base |

    | `/bin` | Executable files such as Linux commands `cat`, `cp`, `ls` |

    '
