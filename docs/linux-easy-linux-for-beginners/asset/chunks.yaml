    # Introduction


    Hi there! Congratulations on acquiring this book. You have made a great investment
    in the attainment of new knowledge in Linux.


    My name is Felix Alvaro and I am an Internet Marketer, Entrepreneur and Author
    with the mission to motivate and inspire you to achieve your goals, by sharing
    my knowledge and experience through my books.


    Because of your interest in this book, I am going to presume that you have heard
    about Linux. While it is not the most popular operating system used in most personal
    computers, Linux is definitely the most powerful. Here’s a trivia: 98.8% of the
    world’s fastest systems (think supercomputers) use the Linux kernel. If they are
    using it, then why shouldn’t you?


    Aside from personally using it on your own computer, the demand for Linux administrators
    has been characteristically high ever since big companies adopted the open-source
    operating system for their servers.


    Regardless if you are getting this book to experience using Linux the first time
    or if you are eyeing to get Linux Professional certifications in the future, buying
    this book definitely puts you in the right track. I can promise that this book
    will equip you with the information that you need to get you started and keep
    you going in your Linux knowledge.


    Getting started with Linux is easy once you become familiar with the system’s
    features. In this guide, I am going to break everything down for you in a simple
    approach that will enable you to grasp everything quickly. I also don’t assume
    you know something already and go into detail for every concept I teach.


    # Chapter One: Getting Started


    What is an Operating System?


    A computer, complete with all its parts – the CPU, mouse, monitor, and keyboard
    – will not work without a central program that will piece it all together. An
    operating system, or OS, for short is the software that brings together a computer’s
    hardware and the different programs that you want to install on it. When you boot
    up a PC without an OS, you will be directed to the command prompt that makes no
    sense to most computer users. You will be unable to watch videos, listen to music,
    edit photos, or to simply write a note.


    An operating system is responsible for doing the following tasks:


    *   Detect hardware – An OS is responsible for validating the components of a
    computer during boot up (hard drive, CPU, network cards, mouse, etc.) and loading
    the corresponding drivers and modules for the hardware to properly run.


    *   Manage processes – Similar to the way our mind works, several processes or
    applications are running on a computer at the same time. It is the OS that is
    responsible for allocating CPU resources. The OS also provides the user the option
    to start, stop, or restart a process.


    *   Manage memory – Each application needs a specific amount of RAM and swap memory
    to function. The OS is responsible for assigning memory allocations and for handling
    memory requests.


    *   Initiate user interfaces - An OS offers users ways to access the system either
    via a command line or a graphical user interface (GUI)


    *   Establish file systems – The OS handles the management of files (access, directories,
    and structure), including the access to the file system.


    *   Manage access and user authentication – An OS allows for creating user accounts
    with different permissions for access to files and processes.


    *   Provide platform for administrative use – A computer’s OS provides a platform
    for the administrator to add users, allocate disk space, install software, and
    to perform activities to manage the computer.


    *   Start up services – The OS manages several processes running in the background
    known as daemon processes.


    Let’s take it to a setting that we can all relate to – a manager at work. An OS
    is like a manager who keeps the different parts of the team in check, assigns
    tasks, distributes work load, and checks everyone’s performance. While every member
    of a team has specific job responsibilities, a manager keeps the team working
    together cohesively.


    Examples of an operating system that you have probably heard of are Windows 10
    (and its predecessors), Mac OS X Yosemite (and the previous releases), and Unix.'
