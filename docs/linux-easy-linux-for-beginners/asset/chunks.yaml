    \ Linux 知识道路上不断进步。\n一旦你熟悉了系统的功能，上手 Linux 是很容易的。在本指南中，我将用简单的方法为你拆解一切，让你能够快速掌握所有内容。我并不假设你已经具备某些知识，因此对我教的每一个概念都会进行详细说明。\n\
    \n# 第一章：入门\n## 什么是操作系统？\n一台电脑，包括它的所有部分——`CPU`、鼠标、显示器和键盘——如果没有将它们所有组合在一起的中央程序是无法工作的。操作系统，简称为\
    \ `OS`，是将计算机硬件与你想在上面安装的不同程序结合在一起的软件。当你启动一台没有 `OS` 的电脑时，你会被引导到 `command prompt`（命令行提示符），这对于大多数计算机用户来说没有任何意义。你将无法观看视频、听音乐、编辑照片或简单地写笔记。\n\
    \n操作系统负责执行以下任务：\n* **检测硬件** – `OS` 负责在启动期间验证计算机组件（硬盘、`CPU`、网卡、鼠标等），并加载相应的硬件驱动程序和模块，以便硬件能够正常运行。\n\
    * **管理进程** – 类似于我们大脑的工作方式，电脑上同时运行着多个进程或应用程序。`OS` 负责分配 `CPU 资源`。`OS` 还为用户提供启动、停止或重启进程的选项。\n\
    * **管理内存** – 每个应用程序都需要特定数量的 `RAM` 和交换内存才能运行。`OS` 负责分配内存空间并处理内存请求。\n* **启动用户界面**\
    \ - `OS` 为用户提供通过 `command line`（命令行）或图形用户界面（`GUI`）访问系统的方法。\n* **建立文件系统** – `OS`\
    \ 处理文件管理（访问、目录和结构），包括对文件系统的访问。\n* **管理访问和用户验证** – `OS` 允许创建具有不同权限的用户账户，以访问文件和进程。\n\
    * **为管理用途提供平台** – 计算机的 `OS` 为管理员提供了添加用户、分配磁盘空间、安装软件以及执行管理计算机活动的平台。\n* **启动服务**\
    \ – `OS` 管理在后台运行的几个进程，这些进程被称为守护进程（daemon processes）。\n\n让我们来看一个我们都能熟悉的场景——工作中的经理。`OS`\
    \ 就像一个经理，负责监督团队的不同部分、分配任务、分发工作量并检查每个人的表现。虽然团队的每个成员都有特定的工作职责，但经理能保持团队凝聚在一起工作。\n\
    \n你可能听过的操作系统示例有 `Windows 10`（及其前身版本）、`Mac OS X Yosemite`（以及之前的版本）和 `Unix`。\n\n"
- fmt: '

    So where does Linux fit in? We’ll discuss it in the next section.


    ## What is Linux?


    Linux is an operating system, similar to the examples mentioned in the previous
    section, and is often described as Unix-like.


    The stark difference between Linux and other operating systems lies in the fact
    that Linux is an open-source operating system. This means that Linux is continuously
    developed collaboratively and unlike `Windows` and `OS X` which are both tied
    to respective companies (`Windows` and `Apple`), not one company owns `Linux`''
    development and support. Building Linux is a shared vision, with different companies
    sharing researches, development, and the associated costs. This open source cooperation
    among companies and developers has led to making Linux one of the best ecosystems
    for use from small digital wristwatches to servers and supercomputers. Based from
    statistics, there are at least 100 companies and more than 1000 developers who
    work together for every kernel release.


    Linux is composed of a kernel, the core control software, plus plenty of libraries
    and utilities that provide different features. Linux is available through many
    distributions. These are what we can call Linux flavours. Distributions are a
    group of specific kernels and programs. The most popular ones include `Arch`,
    `SUSE`, `Ubuntu`, and `Red Hat`. The book focuses on functions present on most
    Linux distributions although these distributions have their own specific tools
    at times.


    This operating system was first used as a server OS and then was used as base
    for Android development. Up until now, Linux has the largest market share when
    it comes to server OS but one of the least popular for personal and home use such
    as desktops and laptop computers. In the next sections, we will go on an in-depth
    discussion of the reason why Linux is better compared to other operating systems.


    In addition to the tasks performed by an operating system, Linux has the following
    characteristics:


    * Supports clustering – Multiple Linux systems can be configured to appear as
    one system from the outside. Service can be configured among clusters and still
    offer a seamless user experience.

    * Runs virtualization – Virtualization allows one computer to appear as several
    computers to users. Linux can be configured as a virtualization host – where you
    could run other OS such as `Windows`, `Mac OS`, or other Linux systems. All the
    virtualized systems appear as separate systems to the outside world.

    * Cloud Computing – Linux can handle complex, large-scale virtualization needs
    – including virtual networks, networked storage, and virtual guests.

    * Options for Storage – Data need not to be always stored in your computer’s hard
    disk. Linux offers different local and networked storage options such as `Fibre
    Channel` and `iSCSI`.


    I will not be discussing the functionalities mentioned above in detail because
    of its advanced applications. These, however, are things that are good to know
    when comparing Linux to other operating systems.


    ## History of Linux


    Linus Benedict Torvalds, a student from Finland, created Linux in 1991 using `C`
    and assembly language. Linux was developed as a free, open source, open license
    operating system, which enables developers around the world to study and modify
    the OS. Since the release of the initial source code in 1991, it has grown now
    to more than 18 million lines of code under `GNU General Public License`.


    Initially, Torvalds named the operating system he invented as `Freax`, a combination
    of the words “free”, “freak”, and “x”. He uploaded his files to an FTP server
    where his colleague, Ari Lemmke, was the FTP server administrator. Lemmke thought
    `Freax` was not a good sounding name so he renamed the folder to `Linux` without
    telling Torvalds. Later on, Torvalds approved the name change.


    In 1992, Linux was licensed under `GNU GPL` and the first Linux distributions
    (also called distro) were created – `Boot-root`, `MCC Interim Linux`, `Softlanding
    Linux System (SLS)`, and `Yggdrasil Linux` where one of the first few released
    in the same year. Several distributions have been created over time: `Slackware`
    - the oldest existing distro, `Debian` - the largest community distribution, and
    commercial distributions `Red Hat` and `SUSE`.


    In recent years, Linux has seen more developments. The server market revenue of
    Linux has already exceeded that of `Unix`. The Linux-based mobile OS `Android`
    has gained 75% of the market share. In 2015, `Linux Kernel Version 4.0` was released.


    Through collaborative works, Linux is now one of the most powerful operating systems.
    Data shows that 98.8% of the world’s fastest systems use the Linux kernel. Isn’t
    it comforting to know that you are using the same OS as these supercomputers?


    ## Linux as Compared to other Operating Systems


    Now, let’s get to the important question: Is Linux better than the others? Let’s
    compare Linux with other well-known operating systems.


    ### Cost

    If you obtained `Windows` legally, you would have paid more than $100 and even
    more for the Pro version. Linux, on the other hand, is free of charge. For Linux
    commercial distributions, companies sell services such as support and documentation
    but the OS itself comes for free.


    ### Viruses

    Linux hardly gets any viruses. Since most PCs run on `Windows`, attackers target
    `Windows OS`. The open-source policy of Linux is key. With many developers working
    on Linux, there are more eyes focused on seeing security flaws. There’s plenty
    of help too, if ever a real Linux virus comes around. Proprietary operating systems
    are tied with the number of employed engineers and resources they have. With Linux,
    any developer from around the world can simply download the source code and help
    out in finding and solving flaws.


    ### System Stability

    As mentioned in the previous section, Linux are used in servers and supercomputers.
    Large-scale systems can go on for years without restarting the server. The time
    when a proper restart is performed is during kernel upgrades – even upgrades for
    softwares running on a Linux server only perform a service restart and not a node
    restart.


    Compare that to the number of times you’ve experienced losing data because the
    program crashed or the time when you plugged in a device and you saw the “Blue
    Screen of Death” in `Windows`. I am not saying that you will not turn off your
    computer when running on Linux, but the option is there, if you wish to.


    ### Installation

    When you install Linux (any of its flavours – `Ubuntu`, `Fedora`, etc), you get
    all the stuff that you need – text editor, spreadsheet, presentation program,
    photo editor, web browser, movie player, PDF reader, and the likes. As compared
    to `Windows` and other OS, once you have the OS set-up, you will have to install
    all the other software that you need one-by-one.


    It also holds true for hardware drivers too. In `Windows`, you would have to install
    the drivers first. Drivers usually come in CDs when you purchase hardware. Now,
    think about the time when you would need to install the driver and you couldn’t
    find the CD for it? You would have to go to the manufacturer’s website to download
    the specific driver. In Linux, drivers are included in the `Linux Kernel` installation
    – you get to save time and it’s a lot more convenient.


    ### Support

    Linux has a large community online where new users can get information, read FAQs,
    and ask questions if there are programs or features that you think are not working
    right. The great thing about open-source is that with plenty of people involved
    in the OS, there are unlimited number of resources that you can use and learn
    from. All these come for free too!


    These are some of the reasons why Linux is a better OS compared to others. However,
    do note that Linux uses open-source software so if you are concerned about any
    of the items listed below, then you should stick to `Windows` or your current
