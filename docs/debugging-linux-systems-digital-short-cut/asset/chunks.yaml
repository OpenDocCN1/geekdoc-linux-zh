    Real Time Clock


    Many embedded SoCs include RTC support to keep track of wall time, but some rely
    on an external RTC chip. Unlike x86-based computers where the RTC is part of the
    South Bridge chipset, embedded controllers commonly interface with external RTCs
    via slow serial buses such as I2C or SPI. You can drive such RTCs by writing client
    drivers that use the services of the I2C or SPI core layers. The former drivers
    can be found under *drivers/i2c/*, and the latter under *drivers/spi/*.


    To collect I2C-specific debugging messages, turn on a relevant combination of
    I2C Core debugging messages, I2C Algorithm debugging messages, I2C Bus debugging
    messages, and I2C Chip debugging messages under *Device Drivers*→ *I2C* support
    in the kernel configuration menu. Similarly, for SPI debugging, turn on Debug
    Support for SPI drivers under *Device Drivers*→ *SPI* support.


