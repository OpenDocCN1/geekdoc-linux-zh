    SECTION #4


    Profiling


    crash> rd mydrv_wq 100


    f892c200: 00000000 00000000 00000000 00000000 ................


    ...


    f892c230: 2e636373 00000068 00000000 00000011 scc.h...........


    Gdb is integrated with crash, so you can pass commands from crash to gdb for evaluation.
    For example, you can use gdb’s p command to print data structures.


    Looking at the Sources


    Architecture-dependent portions of kexec reside in *arch/your-arch/kernel/machine_kexec.c*
    and arch


    ptg5994185


    */your-arch/kernel/relocate_kernel.S*. The generic parts live in *kernel/kexec.c*
    (and *include/linux/kexec.h*). Peek inside *arch/your-arch/kernel/crash.c* and
    *arch/your-arch/kernel* *crash_dump.c* for the kdump implementation. *Documentation/kdump/kdump.txt*
    contains installation information.


    [Profiling](#index_split_000.html_1)


    Profiling points you to those regions of code that burn more CPU cycles. Profilers
    help sense the presence of code bottlenecks and come in different flavors. The
    *OProfile* kernel profiler, included with the 2.6 kernel, uses hardware assist
    to gather profile data. The *gprof* application profiler, on the other hand, relies
    on compiler assist to collect profiling information.


    Kernel Profiling with OProfile


    OProfile samples data at regular intervals using hardware performance counters
    supported by many processors. The performance counters can be programmed to count
    events such as the 54


