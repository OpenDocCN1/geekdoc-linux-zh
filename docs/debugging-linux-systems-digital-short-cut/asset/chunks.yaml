    \ 下载\n\n# 产品描述\n\n产品描述\n\n*调试 Linux 系统* 讨论了目前可用于调试 2.6 Linux 内核的主要工具。我们首先探索了看似深奥的内核调试器\
    \ (`KDB`)、内核 GNU 调试器 (`KGDB`)、普通 GNU 调试器 (`GDB`) 以及 JTAG 调试器。然后，我们研究了 `内核探针 (Kernel\
    \ Probes)`，这是一项允许你干预内核函数并提取调试信息或应用修复补丁的功能。分析崩溃转储（crash dump）可以为内核崩溃或挂起的事后分析提供线索，因此我们查看了\
    \ `Kdump`，这是一种在启动新内核后收集系统转储的实用工具。性能分析（Profiling）可以指引你找到消耗 CPU 周期更多的代码区域，因此我们学习了使用\
    \ `OProfile` 内核性能分析器和 `gprof` 应用分析器来感知代码瓶颈的存在。由于跟踪（Tracing）可以为不同代码模块交互期间出现的行为问题提供见解，我们深入研究了\
    \ Linux Trace Toolkit，这是一个为高量跟踪采集设计的系统。\n\n“调试嵌入式 Linux”部分介绍了嵌入式硬件上常见的 I/O 接口，例如闪存、串口、PCMCIA、数字存储媒体、USB、RTC、音频、视频、触摸屏和蓝牙，并提供了调试相关设备驱动程序的指针。我们还通过案例研究学习了一些板级调试技能。“调试网络吞吐量”部分将带你了解可能影响网卡性能的一些设备驱动设计问题和协议实现特性。我们通过检查内核配置菜单中提供的可以输出价值调试信息的选项来结束本指南。\n\
    \n3\n\n调试 Linux 系统（数字快捷指南）\n\n© 2010 Pearson Education. 保留所有权利。\n\nSreekrishnan\
    \ Venkateswaran 著\n\n本出版受 copyright 保护。更多详情请参见第 2 页。\n\n来自 Ross Hagglund 图书馆\n\
