    # SECTION #8: Linux Test Project


    control characteristics such as protocol parameters, number of simultaneous sessions,
    and size of data blocks. Benchmarking is accomplished by comparing the resulting
    throughput with the maximum practical bandwidth that the networking technology
    yields. For example, a 155 Mbps ATM adapter produces a maximum IP throughput of
    135 Mbps, taking into account the ATM cell header size, overheads due to the `ATM
    Adaptation Layer (AAL)`, and the occasional maintenance cells sent by the physical
    `Synchronous Optical Networking (SONET)` layer.


    ## Linux Test Project


    `Linux Test Project (LTP)` , hosted at http://ltp.sourceforge.net/, is a suite
    consisting of approximately 3,000 tests designed to exercise different parts of
    the kernel. Most tests run without user intervention. Others, such as networking
    and storage media tests, need some manual configuration.


    Download the source tar ball from the LTP home page, run `make`, and invoke the
    wrapper script `runltp` from the root of the source tree to start the tests. To
    capture the results in `logfile` in the `results/` directory, do this:


    ```bash

    runltp –p –l logfile

    ```


    Some errors generated by LTP are “expected.” The LTP website documents the list
    of expected errors for various kernel versions. Also in the website is an interesting
    analysis of LTP’s code coverage (overall coverage, lines in path, and distinct
    lines hit) for a few kernel versions, split across directories in the kernel tree.


    # SECTION #11: Kernel Hacking Config Options


    ## User Mode Linux


    `User Mode Linux (UML)` , hosted at http://user-mode-linux.sourceforge.net/, lets
    you debug the kernel without “oops”ing the machine. To accomplish this, an instance
    of the kernel (called the `guest` kernel) runs as a user mode process over the
    running kernel (called the `host` kernel).


    UML has diverse users. It can function as an environment for testing kernel and
    application code, a vehicle to experiment with unstable kernels, a secure pseudo
    computer for hosting services such as web servers, or a tool to learn Linux internals.
    UML is more useful for debugging hardware-independent portions of the kernel than
    for device driver debugging.


    ## Diagnostic Tools


    The `sysfsutils` package helps you navigate the voluminous amount of data present
    inside sysfs. This, and other Linux diagnostic tools such as `sysdiag` and `lsvpd`,
    can be downloaded from http://linux-diag.sourceforge.net/.


    ## Kernel Hacking Config Options


    Several options exist under `Kernel hacking` in the kernel configuration menu
    that can emit valuable debug information. If you enable an option, corresponding
    debug code compile when you build the kernel. Here are a few examples:


    1. `Show Timing information on printks` (`CONFIG_PRINTK_TIME`) adds timing instrumentation
    to `printk()` output, so you can use `printks` as checkpoints for measuring execution
    times and identifying slow code regions.

    2. Using freed memory results in memory poisoning. `Debug slab memory allocations`
    (`CONFIG_DEBUG_SLAB`) helps you detect such problems.

    3. `Spinlock and rw-lock debugging: basic checks` (`CONFIG_DEBUG_SPINLOCK`) finds
    lock-related problems such as uninitialized spinlock usage and helps catch code
    that is not SMP-safe.

    4. You have already worked with `Magic SysRq key` (`CONFIG_MAGIC_SYSRQ`) when
    you learned to use kdump. If you turn this on, you have some avenues left even
    if the kernel crashes during debugging. For example, pressing Alt-Sysrq-t produces
    a dump of current tasks, whereas Alt-Sysrq-p prints the contents of processor
    registers.

    5. `Detect Soft Lockups` (`CONFIG_DETECT_SOFTLOCKUP`) utilizes the services of
    a watchdog to detect tight loops in kernel code that last for more than 10 seconds.
    We looked at this when we analyzed a kernel hang using kdump. Note that hardware
    lockups cannot be found this way. For that, use the services of a Non-Maskable
    Interrupt (NMI)-watchdog if your platform supports it.

    6. If you enable `CONFIG_DEBUG_SLAB`, `CONFIG_DEBUG_HIMEM`, or `CONFIG_DEBUG_PAGE_ALLOC`
    while configuring your kernel, additional error-checking code is compiled that
    help debug problems related to memory management.

    7. `Check for stack overflows` (`CONFIG_DEBUG_STACKOVERFLOW`) adds code to emit
    warnings if the available stack space falls below a threshold. `Stack utilization
    instrumentation` (`CONFIG_DEBUG_STACK_USAGE`) adds stack space instrumentation
    to the magic Sysrq key output. Another related option, `CONFIG_4KSTACKS`, lets
    you set the kernel stack size to 4 KB rather than 8 KB.

    8. `Verbose BUG() reporting` (`CONFIG_DEBUG_BUGVERBOSE`) produces extra debug
    information when any kernel code invokes `BUG()`, assuming that you have `-CONFIG_BUG`
    turned on during kernel configuration.


    Some debug options live outside the `Kernel hacking` submenu, too. For example,
    we enabled `CONFIG_KALLSYMS` to debug an “oops” message using `gdb` and to `kprobe`
    a kernel module. This option lives under `General setup` → `Configure Standard
    Kernel Features (for small systems)` in the configuration menu.


    Kernel hacking options result in overhead and increased footprint, so don’t leave
    them on in production-level kernels.


