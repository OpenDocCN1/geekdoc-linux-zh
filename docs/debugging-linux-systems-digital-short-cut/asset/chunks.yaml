    Audio


    An audio codec converts digital audio data to analog sound signals for playback
    via speakers and performs the reverse operation for recording through a microphone.
    The codec’s connection with ptg5994185


    the CPU depends on the digital audio interface supported by the embedded controller.
    The usual way to communicate with a codec is via the Audio Codec’97 (AC’97) bus
    or the Inter-IC Sound (I2S) bus for data and I2C for the control interface.


    *Advanced Linux Sound Architecture* ( *ALSA*) is the sound framework of choice
    in the 2.6 kernel. ALSA obsoletes *Open Sound System* ( *OSS*), which was the
    sound subsystem in 2.4 kernels. The kernel’s sound core and audio bus drivers
    stay inside the top-level *sound/* directory in the kernel source tree.


    You may turn on options under *Device Drivers*→ *Sound*→ *Advanced Linux Sound
    Architecture* in the kernel configuration menu to include ALSA debug code (CONFIG_SND_DEBUG),
    verbose printk() messages (CONFIG_SND_VERBOSE_PRINTK), and verbose procfs content
    (CONFIG_SND_VERBOSE_PROCFS).


    Procfs information pertaining to ALSA drivers resides in */proc/asound/*. Look
    inside */sys/class/sound/*


    for the device model information associated with each sound-class device.


