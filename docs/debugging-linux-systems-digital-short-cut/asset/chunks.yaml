    SECTION #6


    Debugging Embedded Linux


    Bluetooth eliminates cables and opens a flood gate of novel applications. The
    *BlueZ* Bluetooth implementation is part of the mainline kernel and is the official
    Linux Bluetooth stack. Look inside *drivers/bluetooth/* for low-level BlueZ drivers.


    There are two BlueZ tools useful for debugging:


    1\. *hcidump* taps HCI packets flowing back and forth and parses them into human-readable
    form.


    Here’s an example dump while a device inquiry is in progress:


    bash> hcidump -i hci0


    HCIDump - HCI packet analyzer ver 1.11


    device: hci0 snap_len: 1028 filter: 0xffffffff


    ptg5994185


    HCI Command: Inquiry (0x01|0x0001) plen 5


    HCI Event: Command Status (0x0f) plen 4


    HCI Event: Inquiry Result (0x02) plen 15


    ...


    HCI Event: Inquiry Complete (0x01) plen 1 < HCI Command:


    Remote Name Request (0x01|0x0019) plen 10


    ...


    2\. The virtual HCI driver ( *hci_vhci.ko*) emulates a Bluetooth interface if
    you do not have actual hardware.


    Board Rework


    Navigating board schematics and datasheets is an important debugging skill you
    need while bringing up the bootloader or kernel on embedded hardware. Understanding
    your board’s *placement* 80


