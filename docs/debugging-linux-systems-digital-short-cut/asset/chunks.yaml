    ## SECTION #1: Kernel Debuggers


    2.6 kernels emit “oops” output that can be used as is without the need of decoding
    using `ksymoops` if you enable `CONFIG_KALLSYMS` during kernel configuration.


    Looking at the preceding dump, the “oops” has occurred inside `trojan_function()`.
    Let’s use `gdb` to obtain more information. In the following invocation, `vmlinux`
    is the uncompressed kernel image, and `/proc/kcore` is the kernel address space:


    ptg5994185


    ```bash

    bash> gdb vmlinux /proc/kcore

    ```


    ```gdb

    (gdb) p xtime → Test the waters by printing a kernel variable $0 = 1113173755

    ```


    Repeated access to the same variable will not yield refreshed values due to `gdb`’s
    cached access. You can force a fresh access by rereading the core file using `gdb`’s
    core-file command. Let’s now look at the disassembly of `trojan_function()`:


    ```gdb

    (gdb) x/2i trojan_function ???? Disassemble trojan_function 0xc019d710 <trojan_function>:
    mov 0xab, %eax

    0xc019d715 <trojan_function+5>: ret

    ```


    `trojan_function()` looks laconic when seen in assembly due to compiler optimizations.
    It’s effectively copying the contents of address `0xab` to the `EAX` register,
    which holds the return value from functions on x86-based systems. But `0xab` does
    not look like a valid kernel address! Fix the bug by allocating valid memory space
    to `my_variable`, recompile, and continue your testing.


