- fmt: "\nThe RTC control register contains bits that choose the frequency of `CLK_OUT`.\
    \ While probing the chip, the driver has erroneously initialized these bits to\
    \ generate `1 KHz` on `CLK_OUT`. `RTC` registers are nonvolatile because of the\
    \ battery backup, so the control register holds this bad value across reboots.\
    \ The resulting skewed clock is sufficient to render the system unbootable. Disconnect\
    \ the `RTC`’s backup battery, drain the registers, reconnect the battery, verify\
    \ using the scope that the `32 KHz` clock is restored on `CLK_OUT`, fix your driver\
    \ code, and start afresh!\n\n### U10\nFIGURE 1.5\nU11\n\n### Debugging an I2C\
    \ RTC on an Processor embedded system\nI2C Bus\n`RTC`\nBattery\n`CLK_OUT`\nBackup\n\
    `CLK`\nGND\n`32KHz`\nScope/Multimeter\n`1KHz`\nTest Equipment\n\nIt goes without\
    \ saying that you need the full complement of relevant test equipment for device\
    \ driver debugging. If you test a modem interface in a digital-only laboratory\
    \ environment for example, you will be well served by a phone simulator. If a\
    \ high-speed serial driver is manifesting parity errors, an oscilloscope can aid\
    \ your problem analyses. If you are writing an I/O device driver, it helps if\
    \ you have the associated bus analyzer. If you are writing a network driver, the\
    \ corresponding protocol line sniffer eases your debugging effort.\n\n## SECTION\
    \ #7: Debugging Network Throughput\n\nTo obtain optimal network throughput, you\
    \ need to design your `network interface card (NIC)` driver for high performance.\
    \ Additionally, you need an in-depth understanding of the network protocol that\
    \ your driver ferries. To get a flavor of how to debug network throughput problems,\
    \ let’s examine some device driver design issues and protocol implementation characteristics\
    \ that can affect the horse power of your `NIC`.\n\n### Driver Performance\nLet’s\
    \ first take a look at some driver design issues that can affect your `NIC`’s\
    \ performance:\n\n1. Minimizing the number of instructions in the main data path\
    \ is a key criterion while designing drivers for fast `NICs`. Consider a `1 Gbps`\
    \ Ethernet adapter with `1 MB` of onboard memory. At line rate, the card memory\
    \ can hold up to `8 milliseconds` of received data. This directly translates to\
    \ the maximum allowable instruction path length. Within this path length, incoming\
    \ packets have to be reassembled, `DMA`-ed to memory, processed by the driver,\
    \ protected from concurrent access, and delivered to higher layer protocols. \n\
    2. During programmed I/O (`PIO`), data travels all the way from the device to\
    \ the CPU before it gets written to memory. Moreover, the CPU is interrupted whenever\
    \ the device needs to transfer data, and this contributes to latencies and context\
    \ switch delays. `DMAs` do not suffer from these bottlenecks but can turn out\
    \ to be more expensive than `PIOs` if the data to be transferred is less than\
    \ a threshold. This is because small `DMAs` have high relative overheads for building\
    \ descriptors and flushing corresponding processor cache lines for data coherency.\
    \ A performance-sensitive device driver might use `PIO` for small packets and\
    \ `DMA` for larger ones, after experimentally determining the threshold.\n3. For\
    \ `PCI` network cards having `DMA` mastering capability, you need to determine\
    \ the optimal `DMA` burst size, which is the time for which the card controls\
    \ the bus at one stretch. If the card bursts for a long duration, it might hog\
    \ the bus and prevent the processor from keeping up with data `DMA`-ed previously.\
    \ `PCI` drivers program the burst size via a register in the `PCI` configuration\
    \ space. Normally the `NIC`’s burst size is programmed to be the same as the cache\
    \ line size of the processor, which is the number of bytes that the processor\
    \ reads from system memory each time there is a cache miss. In practice, however,\
    \ you might need to connect a bus analyzer to determine the beneficial burst duration\
    \ because factors such as the presence of a split bus (multiple bus types like\
    \ `ISA` and `PCI`) on your system can influence the optimal value.\n4. Many high-speed\
    \ `NICs` offer the capability to offload the CPU-intensive computation of `TCP`\
    \ checksums from the protocol stack. Some support `DMA` scatter-gather. The driver\
    \ needs to leverage these capabilities to achieve the maximum practical bandwidth\
    \ that the underlying network yields.\n5. Sometimes, a driver optimization might\
    \ create unexpected speed bumps if it’s not sensitive to the implementation details\
    \ of higher protocols. Consider an `NFS`-mounted filesystem on a computer equipped\
    \ with a high-speed `NIC`. Assume that the `NIC` driver takes only occasional\
    \ transmit complete interrupts to minimize latencies but that the `NFS` server\
    \ implementation uses freeing of its transmit buffers as a flow-control mechanism.\
    \ Because the driver frees `NFS` transmit buffers only during the sparsely generated\
    \ transmit complete interrupts, file copies over `NFS` crawl, even as Internet\
    \ downloads zip along yielding maximum throughput.\n\n### Protocol Performance\n\
    Let’s now dig into some protocol-specific characteristics that can boost or hurt\
    \ network throughput:\n\n1. `TCP` window size can impact throughput. The window\
    \ size provides a measure of the amount of data that can be transmitted before\
    \ receiving an acknowledgment. For fast `NICs`, a small window size might result\
    \ in `TCP` sitting idle, waiting for acknowledgments of packets already transmitted.\
    \ Even with a large window size, a small number of lost `TCP` packets can affect\
    \ performance because lost frames can use up the window. In the case of `UDP`,\
    \ the window size is not relevant because it does not support acknowledgments.\
    \ However, a small packet loss can spiral into a big rate drop due to the absence\
    \ of flow-control mechanisms.\n2. As the block size of application data written\
    \ to `TCP` sockets increases, the number of buffers copied from user space to\
    \ kernel space decreases. This lowers the demand on processor utilization and\
    \ is good for performance. If the block size crosses the `MTU` corresponding to\
    \ the network protocol, however, processor cycles get wasted on fragmentation.\
    \ The desirable block size is thus the outgoing interface `MTU`, or the largest\
    \ packet that can be sent without fragmentation through an IP path if Path MTU\
    \ discovery mechanisms are in operation. While running `IP` over `ATM`, for example,\
    \ because the `ATM` adaptation layer has a `64K` `MTU`, there is virtually no\
    \ upper bound on block size. (RFC 1626 defaults this to `9180`). If you run `IP`\
    \ over `ATM LANE`, however, the block size should mirror the `MTU` size of the\
    \ respective LAN technology being emulated. It should be `1500` for standard Ethernet,\
    \ `8000` for jumbo Gigabit Ethernet, and `18 K` for `16 Mbps Token Ring`.\n\n\
    Several tools are available to benchmark network performance. `Netperf`, available\
    \ for free from `www.netperf.org`, can set up complex `TCP/UDP` connection scenarios.\
    \ You can use scripts to.\n"
