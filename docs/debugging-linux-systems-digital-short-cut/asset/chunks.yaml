    # SECTION #5


    ## Tracing


    Run your application that reads data from the device:


    ```bash

    ./application

    ``` → Trigger invocation of `mydriver_read()`. `mylog.txt` should now contain
    the requested trace data. The generated raw trace can be analyzed using the `tracevisualizer`
    tool. Choose the `Custom Events` option and search for `data_pkt` and `dvr_data`
    events. The output looks like this:


    ```

    ####################################################################

    Event Time SECS MICROSEC PID Length Description

    ####################################################################

    data_pkt 1,110,563,008,742,457 0 27 12 43 AB AC 00 01 0D 56

    data_pkt 1,110,563,008,743,151 0 27 01 D4 73 F1 0A CB DD 06

    dvr_data 1,110,563,008,743,684 0 25 0D EF 97 1A 3D 4C

    ...

    ```


    The last column holds the trace data. The timestamp shows the instant when the
    trace was collected. If the data looks corrupt, the device could be sending bad
    data. Otherwise, the problem must be in a higher kernel layer and can be further
    isolated by obtaining traces from a different point in the data-flow path.


    The next generation of LTT called `LTTng` is available for download from http://ltt.polymtl.ca/.
    This project also includes a post-trace analyzer called `Linux Trace Toolkit Viewer
    (LTTV)`.


    # SECTION #6


    ## Debugging Embedded Linux


    If your need is only to perform limited tracing of a user application, you can
    use the `strace` utility rather than LTT. `strace` uses the `ptrace` support in
    the kernel to intercept system calls. It prints out a list of system calls made
    by your application, along with the corresponding arguments and return values.


    From a device driver perspective, embedded software developers often face interfaces
    not commonly found on conventional computers. Figure 1.3 shows a hypothetical
    embedded device that could be a handheld, smart phone, `point-of-sale (POS)` terminal,
    kiosk, navigation system, gaming device, telemetry gadget on an automobile dashboard,
    IP phone, music player, digital set top box, or even a pacemaker programmer.


    The device is built around a System on Chip (SoC) and has some combination of
    flash memory, SDRAM, Liquid Crystal Display (LCD), serial ports, touch screen,
    Universal Serial Bus (USB), audio codec, connectivity, Secure Digital/Multimedia
    Card (SD/MMC) controller, Compact Flash, Inter-Integrated Circuit (I2C) devices,
    Serial Peripheral Interface (SPI) devices, biometrics, smart card interfaces,
    keypad, switches, and electronics specific to the industry domain.


    Modifying and debugging drivers for some of these devices can be tougher than
    usual: NAND flash drivers have to handle problems such as bad blocks and failed
    bits, unlike standard hard disk drivers. Flash-based filesystems such as `Journalling
    Flash File System (JFFS)` are more complex to debug than `EXT2` or `EXT3` filesystems.
    A USB On-The-Go (OTG) driver is more involved than a conventional USB Open Host
    Controller Interface (OHCI) driver. The SPI subsystem in the kernel is not as
    mature as the serial layer. Moreover, the industry domain using the embedded device
    might impose specific requirements such as deterministic response times or fast
    boot.


    ### Flash Memory


    Embedded devices usually boot from flash memory and have filesystem data resident
    on flash-based storage. Many devices use a small NOR flash component for the former
    and a NAND flash part for the latter. NOR memory, thus, holds the bootloader and
    the base kernel, whereas NAND storage contains filesystem partitions and device
    driver modules.


    Flash drivers are supported by the kernel’s Memory Technology Devices (MTD) subsystem.
    If you use an MTD-supported chip, you need to write only an MTD map driver to
    suitably partition the flash to hold the bootloader, kernel, and filesystem. The
    MTD subsystem resides in the `drivers/mtd/` directory in the kernel source tree.


    To debug flash-related problems, enable `CONFIG_MTD_DEBUG` (`Device Drivers` →
    `Memory Technology` → `Devices` → `Debugging`) during kernel configuration. You
    can further tune the debug verbosity level to between 0 and 3.


    The Linux MTD project page `www.linux-mtd.infradead.org/` has FAQs, various pieces
    of documentation, and a `Linux MTD JFFS HOWTO` that provides insights into JFFS2
    design. The `linux-mtd` mailing list is the place to discuss questions related
    to MTD device drivers. Look at `http://lists.infradead.org/pipermail/linux-mtd/`
    for the mailing list archives.


    ### Serial Port


    The Universal Asynchronous Receiver/Transmitter (UART) chip is responsible for
    serial communication and is an interface you are likely to find on all SoCs. UARTs
    are considered basic hardware, so the kernel contains UART drivers for all SoCs
    on which it runs. On embedded devices, UARTs are used to interface the processor
    with debug serial ports, modems, touch controllers, cellular chipsets, Bluetooth
    silicon, Global Positioning System (GPS) units, telemetry electronics, and so
    on.


    In the Linux source tree, the `drivers/serial/` directory contains the source
    code of the serial subsystem.


    If the UART is meant to be your system console, debugging it isn’t an easy job
    because you can’t invoke `printk()` from inside the driver. If you have another
    console device and an associated working driver, you can print your debug messages
    to that device, however.


    ### PCMCIA and Compact Flash

