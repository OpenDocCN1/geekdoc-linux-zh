    # 第 6 节 嵌入式 Linux 调试


    蓝牙消除了电缆，并开启了新应用的大门。*BlueZ* 蓝牙实现是主线内核的一部分，也是官方的 Linux 蓝牙栈。查看 `drivers/bluetooth/`
    以获取低级 BlueZ 驱动。


    有两个 BlueZ 工具对调试很有用：


    1. `hcidump` 拦截回流的 HCI 数据包并将其解析为人类可读的格式。


    这是一个设备查询正在进行中的转储示例：


    ```bash

    bash> hcidump -i hci0


    HCIDump - HCI packet analyzer ver 1.11

    device: hci0 snap_len: 1028 filter: 0xffffffff

    ptg5994185

    HCI Command: Inquiry (0x01|0x0001) plen 5

    HCI Event: Command Status (0x0f) plen 4

    HCI Event: Inquiry Result (0x02) plen 15

    ...

    HCI Event: Inquiry Complete (0x01) plen 1 < HCI Command:

    Remote Name Request (0x01|0x0019) plen 10

    ...

    ```


    2. 虚拟 HCI 驱动 (`hci_vhci.ko`）在你没有实际硬件时可以仿真蓝牙接口。


    ###### 电路板返修 (Board Rework)


    在嵌入式硬件上调启动引导加载程序或内核时，查看电路板原理图和数据手册是一项重要技能。理解你电路板的*布局图*（plot，即一个显示电路板上芯片位置的文件），当你使用示波器调试潜在的硬件问题，或者当你需要进行细微的板级修复时非常有帮助。*印刷电路板*（*PCBs*）通常覆盖有*丝印*（silk
    screens），丝印会在每个芯片附近打印参考标识。


    万用表和示波器是嵌入式工具箱的有力补充。作为说明，让我们考虑一个假设的情况：USB 集线器检测到了插入但无法分配端点地址。原理图显示收发器的 SPEED 和
    MODE 引脚误反连接了。检查布局图可以确定收发器在 PCB 上的位置。将 PCB 上的收发器参考标识与 PCB 上的丝印匹配，可以确定需要焊接“黄色线”来修复故障连接的地方。


    万用表和示波器是值得拥有的嵌入式工具。作为示例，让我们考虑涉及图 1.5 所示 I2C RTC 的示例。


    考虑这种场景：你为该芯片编写了一个 I2C 客户端驱动。但当你在板上运行该驱动程序时，系统无法启动。当你重置电路板时，引导加载程序没有启动，JTAG 调试器无法连接到目标。为了理解这个看似致命错误的原因，让我们查看连接图。由于
    RTC 和 CPU 都需要外部时钟，电路板使用单个 32 KHz 晶振来供应。然而，这个 32 KHz 时钟需要缓冲。RTC 为其使用进行时钟缓冲并在输出引脚上提供。该引脚
    `CLK_OUT` 为处理器提供时钟。在 `CLK_OUT` 和地之间连接示波器（或可以测量频率的万用表）以验证处理器频率。如图 1.5 所示，波器显示为
    1 KHz，而不是预期的 32 KHz！这里出了什么问题？


