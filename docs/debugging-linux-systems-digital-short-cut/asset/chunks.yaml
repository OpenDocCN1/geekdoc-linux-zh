    Kprobes


    Kprobes can save you the trouble of building and booting a debug kernel by providing
    capabilities to dynamically dump kernel data structures or insert code into a
    running kernel. You can, for example, add a few printks on-the-fly inside the
    scheduler without recompiling the kernel. You can even patch a bug on a Mars rover
    without rebooting it.


    To insert a kprobe inside a kernel function, follow these steps: 1. Turn on CONFIG_KPROBES
    ( *Instrumentation Support* → *Kprobes*) in the kernel configuration menu.


