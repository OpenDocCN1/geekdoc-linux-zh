    # Debugging Embedded Linux


    ## PCMCIA / CF


    PCMCIA (Personal Computer Memory Card International Association) or Compact Flash
    (CF) slots are common add-ons to embedded devices. The advantage of WiFi-enabling
    an embedded device using a CF card is that you don’t need to re-spin the board
    if the WiFi controller goes end of life.


    Also, because diverse technologies are available in the PCMCIA/CF form factor,
    you’ve the freedom to change the connectivity mode from WiFi to another technology
    such as Bluetooth later. The disadvantage of such a scheme is that even with mechanical
    retaining, sockets are inherently unreliable. There is the possibility of the
    card coming loose due to shock and vibe, and resulting intermittent connections.


    The kernel’s PCMCIA/CF subsystem lives in the `/drivers/pcmcia/` directory.


    To effectively debug PCMCIA/CF client drivers, you need to see debug messages
    emitted by the PCMCIA core. For this, enable `CONFIG_PCMCIA_DEBUG` (`Bus options`→`PCCARD
    support`→`Enable PCCARD`→`debugging`) during kernel configuration. Verbosity levels
    of the debug output can be controlled either via the `pcmcia_core.pc_debug` kernel-line
    argument or using the `pc_debug` module insertion parameter.


    ## PC Card Client Drivers


    Information about PC Card client drivers is available in the process filesystem
    entry, `/proc/bus/pccard/drivers`. Look at `/sys/bus/pcmcia/devices/` for card-specific
    information such as manufacturer and card IDs. Take a look inside `/proc/bus/pci/`
    to know more about your PCMCIA host controller if your system uses a PCI-to-PCMCIA
    bridge. `/proc/interrupts` lists IRQs active on your system, including those used
    by the PCMCIA layer.


    You can find a mailing list dedicated to Linux-PCMCIA at http://lists.infradead.org/mailman/listinfo/linux-pcmcia.


    ## Secure Digital Media


    Many embedded processors include controllers that communicate with SD and MMC
    media.


    SD/MMC storage is built using NAND flash memory. Like CF cards, SD/MMC cards add
    several gigabytes of memory to your device. They also offer an easy memory upgrade
    path, because the available density of SD/MMC cards is constantly increasing.


    The kernel contains an SD/MMC subsystem in `/drivers/mmc/`.


    The `hdparm` utility elicits various PATA/SATA disk parameters from the underlying
    kernel block driver. To benchmark disk read speeds on a SATA drive, for example,
    do this:


    ```bash

    hdparm -T -t /dev/sda

    ```


    ```

    /dev/sda:

    Timing cached reads: 2564 MB in 2.00 seconds = 1283.57 MB/sec

    Timing buffered disk reads: 132 MB in 3.03 seconds = 43.61 MB/sec

    ```


    For the full capabilities of `hdparm`, read the man pages.


    ## SMART


    Self-Monitoring, Analysis and Reporting Technology (SMART) is a system built into
    many modern ATA and SCSI disks to monitor failures and perform self-tests. A user
    space daemon named `smartd` collects the information gathered by SMART-capable
    disks with the help of the underlying device driver. Look at the man pages of
    `smartd`, `smartctl`, and `smartd.conf` to learn how to obtain health status from
    SMART-enabled disks.


    If your distribution doesn’t pre-package `hdparm` and SMART tools, you can download
    them from http://sourceforge.net/projects/hdparm/ and http://sourceforge.net/projects/smartmontools/
    respectively.


    ## IDE and SCSI Devices


    Files under `/proc/ide/` contain information about IDE disk drives on your system.
    To obtain the geometry of the first IDE disk, look at the contents of `/proc/ide/ide0/hda/geometry`.
    Information pertaining to SCSI devices is available under `/proc/scsi/`. You can
    gather disk partition information from `/proc/partitions`.


    The `sysfs` directory of interest for IDE devices is `/sys/bus/ide/`, whereas
    for SCSI is `/sys/bus/scsi/`.


    Additionally, each block device active on the system owns a subdirectory under
    `/sys/block/`, which contains associated request queue parameters, constituent
    partition details, and state information.


    Some kernel configuration options are available that trigger emission of debug
    output from the block subsystem. `CONFIG_BLK_DEV_IO_TRACE` provides the ability
    to trace the block layer. `CONFIG_SCSI_CONSTANTS` and `CONFIG_SCSI_LOGGING` turn
    on SCSI error reporting and logging, respectively.


    The linux-ide mailing list is the forum to discuss questions related to the Linux-IDE
    subsystem.


    Subscribe to the linux-scsc mailing list and browse through its archives for discussions
    pertaining to the Linux-SCSI subsystem.


    ## Universal Serial Bus


    Legacy computers support the USB host mode by which you can communicate with most
    classes of USB devices. Embedded systems frequently also require support for the
    USB device mode, wherein the system itself functions as a USB device and plugs
    into other host computers.


    Many modern embedded controllers support USB OTG that lets your device work either
    as a USB host or as a USB device. It enables you, for example, to connect a USB
    pen drive to your embedded device. It also enables your embedded device to itself
    function as a USB pen drive by exporting part of its local storage for external
    access. The Linux USB subsystem (residing in `/drivers/usb/`) offers drivers for
    USB OTG. For hardware that’s not compatible with OTG, the USB Gadget project (implemented
    in `/drivers/usb/gadget/`), brings USB device capability.


    A USB bus analyzer magnifies the goings-on in the bus and is useful for debugging
    low-level problems. If you can’t get hold of an analyzer, you might make do with
    the kernel’s soft USB tracer `usbmon`. This tool captures traffic between USB
    host controllers and devices. To collect a trace, read from the `debugfs` 9 file
    `/sys/kernel/debug/usbmon/Xt`, where `X` is the bus number to which your device
    is connected.


    For example, consider a USB disk connected to a PC. From the associated “T:” line
    in `/proc/bus/usb/devices`, you can see that the drive is attached to bus 1: `T:
    Bus=01 Lev=01 Prnt=01 Port=03 Cnt=01 Dev# 2 Spd=480`.


    Ensure that you have enabled debugfs (`CONFIG_DEBUG_FS`) and usbmon (`CONFIG_USB_MON`)
    support in your kernel. This is a snapshot of usbmon output while copying a file
    from the disk:


    ```bash

    mount -t debugfs none_debugs /sys/kernel/debug/

    cat /sys/kernel/debug/usbmon/1u

    ```


    ```

    ee6a5c40 3718782540 S Bi:1:002:1 -115 20480 <

    ee6a5cc0 3718782567 S Bi:1:002:1 -115 65536 <

    ee6a5d40 3718782595 S Bi:1:002:1 -115 36864 <

    ee6a5c40 3718788189 C Bi:1:002:1 0 20480 = 0f846801 118498f

    ```

