    SECTION #6


    Debugging Embedded Linux


    *plot*, which is a file that shows the position of chips on your board, is a big
    help when you debug a potential hardware problem using an oscilloscope, or when
    you need to perform minor board rework. *Reference designators* [(such as U10
    and U11 in Figure 1.5) associate each chip in the](#index_split_000.html_82)


    schematic with the placement plot. *Printed Circuit Boards* ( *PCBs*) are usually
    clothed with *silk screens* that print the reference designator near each chip.


    Consider this fictitious scenario in which USB enumeration doesn’t occur on your
    board under test. The USB hub driver detects device insertions but cannot assign
    endpoint addresses. A close look at the schematics reveals that the connections
    originating from the SPEED and MODE pins of the USB transceiver have been interchanged
    by mistake. An examination of the placement plot identifies the location of the
    transceiver on the PCB. Matching the transceiver’s reference designator on ptg5994185


    the placement plot with the silk screen on the PCB pinpoints the places where
    you have to solder


    “yellow wires” to repair the faulty connections.


    A multimeter and an oscilloscope are worthy additions to your embedded debugging
    toolkit. As an illustration, let’s consider an example situation involving the
    I2[C RTC shown in Figure 1.5.](#index_split_000.html_82)


    Consider this scenario: You have written an I2C client driver for this RTC chip.
    However, when you run your driver on the board, it renders the system unbootable.
    Neither does the bootloader come up when you reset the board, nor does your JTAG
    debugger connect to the target. To understand possible causes of this seemingly
    fatal error, let’s take a closer look at the connection diagram. Because both
    the RTC and the CPU need an external clock, the board supplies it using a single
    32 KHz crystal. This 32 KHz clock needs to be buffered, however. The RTC buffers
    the clock for its use and makes it available on an output pin for free. This pin
    CLK_OUT, feeds the clock to the processor. Connect an oscilloscope (or a multimeter
    that can measure frequency) between CLK_OUT


    and ground to verify the processor clock frequency[. As you can see in Figure
    1.5, the scope reads 1](#index_split_000.html_82)


