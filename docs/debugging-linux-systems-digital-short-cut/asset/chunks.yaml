  trans: "\n\n`-p` 选项请求 `kexec` 在发生内核恐（kernel panic）时触发重启。使用一个 `vmlinux` ELF 内核镜像作为捕获内核。由于\
    \ `vmlinux` 是一个通用的 ELF 启动镜像，且 `kexec` 在理论上与操作系统无关，因此你需要通过 `--args-linux` 选项指定以下参数必须以\
    \ Linux 特有的方式进行解释。捕获内核在内核崩溃期间异步启动，因此使用共享中断的设备驱动程序在启动过程中可能会出现致命的错误。为了友好对待此类驱动程序，请使用\
    \ `--append` 在传递给捕获内核的命令行中指定 `irqpoll`。\n\n要配合 `kdump` 使用 `kexec`，你需要一些额外的内核配置设置。捕获内核需要访问崩溃内核的内核内存以生成完整的转储（dump），因此后者不能像非\
    \ kdump 情况下 `kexec` 执行的那样直接覆盖前者。运行中的内核需要留出一个内存区域来运行捕获内核。要标记该区域：\n\n1.  使用命令行参数\
    \ `crashkernel=64M@16M`（或其他合适的 `size@start` 值）启动第一个内核。同时，通过启用配置菜单中的 `CONFIG_DEBUG_INFO`（*Kernel\
    \ Hacking* → *Compile the Kernel with Debug Info*）在内核镜像中包含调试符号。\n\n## 第 3 部分：Kexec\
    \ 和 Kdump\n\n2.  在配置捕获内核时，将 `CONFIG_PHYSICAL_START` 设置为上方分配相同起始值（在本例中为 16M）。如果你\
    \ `kexec` 进入捕获内核并查看 `/proc/meminfo`，你会发现 `size`（在本例中为 64M）是该内核可见的物理内存总量。\n\n现在你已经熟悉了\
    \ `kexec` 并从 kdump 用户的角度掌握了它，让我们让我们深入研究 kdump 并使用它来分析一些真实世界中的内核崩溃。\n\n## Kdump\n\
    \n在内核崩溃或挂起后捕获的系统内存镜像被称为 `crash dump`（崩溃转储）。分析崩溃转储可以为内核问题的事后分析提供宝贵的线索。然而，在内核崩溃后获取转储在本质上是不可靠的，因为负责将数据记录到转储设备的存储驱动程序可能处于未定义状态。\n\
    \n在 `kdump` 出现之前，`Linux Kernel Crash Dump (LKCD)` 是获取和分析转储的流行机制。`LKCD` 使用临时转储设备（如交换分区）来捕获转储。然后热重启回健康状态，并将转储从临时设备复制到持久位置。使用一个名为\
    \ `lcrash` 的工具来分析转储。`LKCD` 的缺点包括：\n\n-   即使在崩溃的内核上，将转储复制到临时设备也可能是不可靠的。\n-   转储设备的配置并不简单。\n\
    -   重启可能会很慢，因为只有在转储安全保存到持久位置后，交换空间才能被激活。\n-   `LKCD` 不是主内核的一部分，因此为你的内核版本安装适当的补丁是一个障碍。\n\
    \n`kdump` 不受这些缺陷的困扰。它通过通过 `kexec` 到健康内核后收集转储，消除了不确定性。此外，由于在 `kexec` 重启后内存状态会被保留，可以从捕获内核准确访问内存镜像。\n\
    \n让我们先完成初步的 kdump 设置：\n\n1.  让运行中的内核在遇到 panic 时请求 `kexec` 进入捕获内核。捕获内核应额外开启 `CONFIG_HIMEM`\
    \ 和 `CONFIG_CRASH_DUMP`。（这两个选项都位于内核配置菜单中的 *Processor type and Features* 内。）\n\n\
    2.  捕获内核启动后，将 `/proc/vmcore`（通过启用内核配置菜单中的 `CONFIG_PROC_VMCORE` 获取）收集到的转储信息拷贝到硬盘上的文件：\n\
    \n```bash\ncp /proc/vmcore /dump/vmcore.dump\n```\n\n你也可以通过 `/dev/oldmem` 保存其他信息，例如崩溃内核的原始内存快照。\n\
    \n3.  回到第一个内核。现在你准备好开始转储分析。\n\n让我们使用收集转储文件和 `crash` 工具分析一些示例内核崩溃。\n\n在 RTC 驱动的中断处理程序（`drivers/char/rtc.c`）中引入此\
    \ bug：\n\n```c\nirqreturn_t rtc_interrupt(int irq, void *dev_id)\n{\n    + volatile\
    \ int *integerp = 0xFF;\n    + int integerd = *integerp; /* 错误的内存引用！ */\n    spin_lock(&rtc_lock);\n\
    \    /* ... */\n}\n```\n\n通过 `hwclock` 命令启用中断来触发处理程序的执行：\n\n```bash\nhwclock\n\
    ```\n\n... → 当执行触及 `rtc_interrupt()` 时发生内核 panic，导致 `kexec` 启动进入捕获内核。\n\n将 `/proc/vmcore`\
    \ 保存到 `/dump/vmcore.dump`，重启回到第一个（崩溃的）内核，并使用 `crash` 工具开始分析。在现实情况下，转转储可能在客户现场捕获，而分析则在支持中心完成：\n\
    \n```bash\ncrash /usr/src/linux/vmlinux /dump/vmcore.dump\n```\n\n```\ncrash 4.0-2.24\n\
    ...\nKERNEL: /usr/src/linux/vmlinux\nDUMPFILE: /root/vmcore.dumpfile\nCPUS: 1\n\
    DATE: Mon Nov 26 04:15:49 2007\nUPTIME: 00:17:22\nLOAD AVERAGE: 0.82, 1.02, 0.87\n\
    TASKS: 63\n...\nPANIC: “Oops: 0000 [#1]” (查看日志获取详情)\ncrash>\n```\n\n检查堆栈跟踪以理解崩溃原因：\n\
    \n```bash\ncrash> bt\nPID: 0 TASK: c03a32e0 CPU: 0 COMMAND: “swapper”\n#0 [c0431eb8]\
    \ crash_kexec at c013a8e7\n#1 [c0431f04] die at c0103a73\n#2 [c0431f44] do_page_fault\
    \ at c0343381\n#3 [c0431f84] error_code (via page_fault) at c010312d\nEAX: 00000008\
    \ EBX: c59a5360 ECX: c03fbf90 EDX: 00000000\nEBP: 00000000\nDS: 007b ESI: 00000000\
    \ ES: 007b EDI: c03fbf90\nCS: 0060 EIP: f8a8c004 ERR: ffffffff EFLAGS: 00010092\n\
    #4 [c0431fb8] rtc_interrupt at f8a8c004\n#5 [c0431fc4] handle_IRQ_event at c013de51\n\
    #6 [c0431fdc] __do_IRQ at c013df0f\n```\n\n堆栈跟踪将怀疑指向 `rtc_interrupt()`。让我们反汇编\
    \ `rtc_interrupt()` 附近的指令：\n\n```bash\ncrash> dis 0xf8a8c000 5\n0xf8a8c000 <rtc_interrupt>:\
    \ push %ebx\n0xf8a8c001 <rtc_interrupt+1>: sub $0x4,%esp\n0xf8a8c004 <rtc_interrupt+4>:\
    \ mov 0xff,%eax\n0xf8a8c009 <rtc_interrupt+9>: mov $0xc03a6640,%eax\n0xf8a8c00e\
    \ <rtc_interrupt+14>: call 0xc0342300 <_spin_lock>\n```\n\n地址 `0xf8a8c004` 处的指令试图将\
    \ EAX 寄存器的内容移动到 `0xff`，显然是导致崩溃的无效引用。修复它并编译新内核。\n\n"
- fmt: "\nIf you use the `irq` command, you can figure out the identity of the interrupt\
    \ that was in progress during the time of the crash. In this case, the output\
    \ confirms that the RTC interrupt was indeed active:\n\n```\ncrash> irq\n\nIRQ:\
    \ 8\n\nSTATUS: 1 (IRQ_INPROGRESS)\n\n...\n\nptg5994185\n\n...\n\nhandler: f8a8c000\
    \ <rtc_interrupt>\n\nflags: 20000000 (SA_INTERRUPT)\n\nmask: 0\n\nname: f8a8c29d\
    \ “rtc”\n\ncrash> quit\n```\n\nbash>\n\nLet’s now shift gears and look at a case\
    \ where the kernel freezes, rather than generate an “oops.”\n\nConsider the following\
    \ buggy driver `init()` routine:\n\n```c\nstatic int __init myrv_init(void)\n\
    {\n    spin_lock(&mydrv_wq.lock); /* Usage before initialization! */\n    spin_lock_init(&mydrv_wq.lock);\n\
    \    /* ... */\n}\n```\n\nThe code is erroneously using a spinlock before initializing\
    \ it. Effectively, the CPU spins forever trying to acquire the lock, and the kernel\
    \ appears to hang. Let’s debug this problem using `kdump`.\n\nIn this case, there\
    \ will be no auto-trigger because there is no panic, so force a crash dump by\
    \ pressing the magic Sysrq key combination, Alt-Sysrq-c. You may need to enable\
    \ Sysrq by writing a 1 to `/proc/sys/kernel/sysrq`:\n\n```bashbash> echo 1 > /proc/sys/kernel/sysrq\n\
    bash> insmod mydrv.ko\n```\n\nThis induces the kernel to hang inside `mydrv_init()`.\
    \ Press the Alt-Sysrq-c key combination to trigger a crash dump:\n\n**Alt-Sysrq-c**\n\
    \n... → Messages announcing that a crash dump has been triggered\n\nSave the dump\
    \ to disk after `kexec` boots the capture kernel, boot back to the original kernel,\
    \ and run `crash` on the saved dump:\n\n``` evenbash> crash vmlinux vmcore.dump\n\
    ```\n\n...\n\nPANIC: “SysRq : Trigger a crashdump”\n\n```\nPID: 2115\nCOMMAND:\
    \ “insmod”\nTASK: f7c57000 [THREAD_INFO: f6170000]\nCPU: 0\nSTATE: TASK_RUNNING\
    \ (SYSRQ)\ncrash>\n```\n\nTest the waters by checking the identity of the process\
    \ that was running at the time of the crash.\n\nIn this case, it was apparently\
    \ `insmod` (of `mydrv.ko`): `crash> ps`\n\n```\n2171 2137 0 f6bb7000 IN 0.5 11728\
    \ 5352 emacs-x\n2214 1 0 f6b5b000 IN 0.1 2732 1192 login\n2230 2214 0 f6bb0550\
    \ IN 0.1 4580 1528 bash\n> 2261 2230 0 c596f550 RU 0.0 1572 370 insmod\n```\n\n\
    The stack trace doesn’t yield much information other than telling you that a Sysrq\
    \ key press was responsible for the dump:\n\n```\ncrash> bt\nPID: 2115 TASK: f7c57000\
    \ CPU: 0 COMMAND: “insmod”\n#0 [c0431e68] crash_kexec at c013a8e7\n#1 [c0431eb4]\
    \ __handle_sysrq at c0254664\n#2 [c0431edc] handle_sysrq at c0254713\n```\n\n\
    Let’s next try peeking at the log messages generated by the crashed kernel. The\
    \ `log` command reads the messages from the kernel `printk` ring buffer present\
    \ on the dump file: `crash> log`\n\n```\nBUG: soft lockup detected on CPU#0!\n\
    Pid: 2261, comm: insmod\nEIP: 0060:[<c010ec1b>] CPU: 0\nEIP is at delay_pmtmr+0xb/0x20\n\
    EFLAGS: 00000246 Tainted: P (2.6.16.16 #11)\nEAX: 5caaa48c EBX: 00000001 ECX:\
    \ 5caaa459 EDX: 00000012\nESI: 02e169c9 EDI: 00000000 EBP: 00000001 DS: 007b ES:\
    \ 007b\nCR0: 8005003b CR2: 08062017 CR3: 35e89000 CR4: 000006d0\n[<c01fede9>]\
    \ __delay+0x9/0x10\n[<c0200089>] _raw_spin_lock+0xa9/0x150\n[<f893d00d>] mydrv_init+0xd/0xb2\
    \ [wqdrv]\n[<c0136565>] sys_init_module+0x175/0x17a2\n[<c015d834>] do_sync_read+0xc4/0x100\n\
    [<c013ce4d>] audit_syscall_entry+0x13d/0x170\n[<c0105578>] do_syscall_trace+0x20/0x21a\n\
    [<c0102f05>] syscall_call+0x7/0xb\nSysRq : Trigger a crashdump\ncrash>\n```\n\n\
    The log offers two useful pieces of debug information. First, it lets you know\
    \ that a soft lockup was detected on the crashed kernel. The kernel detects soft\
    \ lockups as follows: A kernel watchdog thread runs once a second and touches\
    \ a per-CPU timestamp variable. If the CPU sits in a tight loop, the watchdog\
    \ thread cannot update this timestamp. An update check is carried out during timer\
    \ interrupts using `softlockup_tick()` (defined in `kernel/softlockup.c`). If\
    \ the watchdog timestamp is more than 10 seconds old, it concludes that a soft\
    \ lockup has occurred and emits a kernel message to that effect.\n\nSecond, the\
    \ log frowns upon `mydrv_init()+0xd` (or `0xf893d00`), so let’s look at the disassembly\
    \ of the surrounding code region:\n\n```\ncrash> dis f893d000 5\ndis: WARNING:\
    \ f893d000: no associated kernel symbol found\n0xf893d000: mov $0xf89f1208,%eax\n\
    0xf893d005: sub $0x8,%esp\n0xf893d008: call 0xc32300 <spin_lock>\n0xf893d00d:\
    \ movl $0xffffffff,0xf89f214\n0xf893d017: movl $0xffffffff\n```\n\nYou can use\
    \ `crash` to peek at data structures of interest, but be aware that memory regions\
    \ that were swapped out during the crash are not part of the dump. In the preceding\
    \ example, you can examine `mydrv_wq` as follows:\n\n```\ncrash> rd mydrv_wq 100\n\
    f892c200: 00000000 00000000 00000000 00000000\n...\nf892c230: 2e636373 00000068\
    \ 00000000 00000011\n```\n\n`gdb` is integrated with `crash`, so you can pass\
    \ commands from `crash` to `gdb` for evaluation. For example, you can use gdb’s\
    \ `p` command to print data structures.\n\n### Looking at the Sources\n\nArchitecture-dependent\
    \ portions of `kexec` reside in `arch/your-arch/kernel/machine_kexec.c` and `arch/your-arch/kernel/relocate_kernel.S`.\
    \ The generic parts live in `kernel/kexec.c` (and `include/linux/kexec.h`). Peek\
    \ inside `arch/your-arch/kernel/crash.c` and `arch/your-arch/kernel/crash_dump.c`\
    \ for the kdump implementation. `Documentation/kdump/kdump.txt` contains installation\
    \ information.\n"
