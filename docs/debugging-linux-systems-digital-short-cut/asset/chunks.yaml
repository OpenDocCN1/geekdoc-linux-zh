- fmt: "\n# Kernel Debuggers\n\nInvesting time in logic design and software engineering\
    \ before code development and staring hard at the code after development can minimize\
    \ or even eliminate bugs. But because that is easier said than done, and because\
    \ we are all humans, developers need debugging tools. In this shortcut, let’s\
    \ explore a variety of methods to debug kernel code. The techniques described\
    \ here have been stitched together from different parts of the book *Essential\
    \ Linux Device Drivers* (Prentice Hall Open Source Software Development Series,\
    \ ISBN 978-0-132-39655-4).\n\n## Reliability, Availability, Serviceability\n\n\
    Many systems, especially mission critical ones, have a need for reliability, availability,\
    \ and serviceability (RAS). The Linux RAS effort has resulted in the development\
    \ of several powerful tools.\n\nExercisers such as the Linux Test Project (LTP)\
    \ measure the reliability and robustness of your kernel port. CPU hotplugging\
    \ and the Linux High Availability (HA) project can be seen in the context of availability.\
    \ Kernel debuggers, `Kprobes`, `Kdump`, `EDAC`, and the Linux Trace Toolkit (LTT)\
    \ come under the ambit of serviceability. The line dividing these classifications\
    \ is sometimes thin; you can use any or a combination of these methods to suit\
    \ your debugging needs. For example, output from a kernel profiler such as `OProfile`\
    \ can be used either to search for potential code bottlenecks (reliability) or\
    \ to debug a field problem (serviceability).\n\n## Kernel Debuggers\n\nThe instruction-level\
    \ Kernel DeBugger(`kdb`) and the source-level Kernel GNU DeBugger(`kgdb`) are\
    \ the two main Linux kernel debuggers. Whether to include a debugger as part of\
    \ the stock kernel has been an oft-debated point in kernel mailing lists, but\
    \ a lightweight version of `kgdb` has finally been integrated with the mainline\
    \ kernel starting with the 2.6.26 release. Even if you prefer to stay away from\
    \ the seemingly esoteric operation of kernel debuggers, you can glean information\
    \ about kernel panics and peek at kernel variables via the plain GNU DeBugger(`gdb`).\
    \ JTAG debuggers use hardware-assisted debugging and are powerful but expensive.\n\
    \nKernel debuggers make kernel internals more transparent. You can single-step\
    \ through instructions, disassemble instructions, display and modify kernel variables,\
    \ and look at stack traces. In this section, let’s learn the basics of kernel\
    \ debuggers with the help of some examples.\n\n### Entering a Debugger\n\nYou\
    \ can enter a kernel debugger in multiple ways. One way is to pass command-line\
    \ arguments that ask the kernel to enter the debugger during boot. Another way\
    \ is via software or hardware breakpoints. A `breakpoint` is an address where\
    \ you want execution stopped and control transferred to the debugger. A software\
    \ breakpoint replaces the instruction at that address with something else that\
    \ causes an exception. You can set software breakpoints either using debugger\
    \ commands or by inserting them into your code. For x86-based systems, you can\
    \ set a software breakpoint in your kernel source code as follows:\n\n```\nasm(\"\
    \ int $3”);\n```\n\nAlternatively, you can invoke the `BREAKPOINT` macro, which\
    \ translates to the appropriate architecture-dependent instruction.\n\nYou can\
    \ use hardware breakpoints in place of software breakpoints if the instruction\
    \ where you need to stop is in flash memory, where it cannot be replaced by the\
    \ debugger. A hardware breakpoint needs processor support. The corresponding address\
    \ needs to be added to a debug register. You can only have as many hardware breakpoints\
    \ as the number of debug registers supported by the processor.\n\nYou can also\
    \ ask a debugger to set a `watchpoint` on a variable. The debugger stops execution\
    \ whenever an instruction modifies data at the watchpoint address.\n\nYet another\
    \ common method to enter a debugger is by pressing an attention key, but this\
    \ won’t work in many instances. If your code is sitting in a tight loop after\
    \ disabling interrupts, the kernel will not get a chance to process the attention\
    \ key and enter the debugger. For example, you can’t enter the debugger via an\
    \ attention key if your code does something like this:\n\n```c\nunsigned long\
    \ flags;\nlocal_irq_save(flags);\nwhile (1) continue;\nlocal_irq_restore(flags);\n\
    ```\n\nWhen control is transferred to the debugger, you can start your analysis\
    \ using various debugger commands.\n\n### Kernel Debugger (kdb)\n\n`Kdb` is an\
    \ instruction-level debugger used for debugging kernel code and device drivers.\
    \ Before you can use it, you need to patch your kernel sources with `kdb` support\
    \ and recompile the kernel.\n\nThe main advantage of `kdb` is that it’s easy to\
    \ set up, because you don’t need an additional machine to do the debugging (unlike\
    \ `kgdb`). The main disadvantage is that you need to correlate your sources with\
    \ disassembled code (again, unlike `kgdb`).\n\nLet’s wet our toes in `kdb` with\
    \ the help of an example. Here’s the crime scene: You have modified a kernel serial\
    \ driver to work with your x86-based hardware, but the driver isn’t working, and\
    \ you want `kdb` to help nab the culprit.\n\nLet’s start our search for fingerprints\
    \ by setting a breakpoint at the serial driver `open()` entry point.\n\nRemember,\
    \ because `kdb` is not a source-level debugger, you need to open your sources\
    \ and try to match the instructions with your C code. Let’s list the source snippet\
    \ in question:\n\n```c\ndrivers/serial/myserial.c\nstatic int rs_open(struct tty_struct\
    \ *tty, struct file *filp)\n{\n    struct async_struct *info;\n    /* ... */\n\
    \    retval = get_async_struct(line, &info);\n    if (retval) return(retval);\n\
    \    tty->driver_data = info;\n    /* Point A */\n    /* ... */\n}\n```\n\nPress\
    \ the Pause key and enter `kdb`. Let’s find out how the disassembled `rs_open()`\
    \ looks. The debug sessions shown here attach explanations using the `→` symbol.\n\
    \n```\nEntering kdb (current=0xc03f6000, pid 0) on processor 0 due to Keyboard\
    \ Entry\nkdb> id rs_open → Disassemble rs_open\n0xc01cce00 rs_open: sub $0x1c,\
    \ %esp\n0xc01cce03 rs_open+0x03: mov $ffffffed, %ecx\n...\n0xc01cce4b rs_open+0x4b:\
    \ call 0xc01ccca0, get_async_struct\n...\n0xc01cce56 rs_open+0x56: mov 0xc(%esp,1),\
    \ %eax\n0xc01cce5a rs_open+0x5a: mov %eax, 0x9a4(%ebx)\n...\n```\n\nPoint A in\
    \ the source code is a good place to attach a breakpoint because you can peek\
    \ at both the tty structure and the info structure to see what’s going on.\n"
