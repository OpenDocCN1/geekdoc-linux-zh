  trans: "\n\n# 内核探针（Kernel Probes）概述\n\n当注册一个 `kprobe` 时，它会保存被探测的指令并将其替换为一条生成断点的指令（在基于\
    \ `x86` 的系统上为 `int 0x03`）。当触发断点时，内核会生成一个 `die` 通知。`Kprobes` 到 die 通知链中，因此能够接收断点触发的通知。\n\
    \n收到通知后，`Kprobes` 执行已注册的 `pre-handler`。接下来，它单步执行被探测指令的副本。由于 `SMP` 一致性的考虑，它执行的是副本，而不是将被探测指令替换回断点指令。最后，它运行\
    \ `post-handler`。`pre-handler` 和 `post-handler` 窗口是为 Kprobes 用户注入调试代码而提供的钩子。这些处理程序可以动态注册和注销，因此可维护性不仅仅是编译时的静态状态，而是在运行时可编程的。\n\
    \n## 示例用法\n\n让我们通过一个示例来学习如何使用 `Kprobes`。考虑列表 1.2 中的代码段，这是一个内核线程，每当收到 `SIGUSR1`\
    \ 信号时，它就会向空内存池添加 `npages` 数量的页面。大部分逻辑已从列表中删除，因为它们与主题无关。假设你正在客户现场调试一个由该代码报告的问题。\n\
    \n你发现每当 `npages` 超过 10 时就会出现问题，因此你想应用一个运行时补丁将其限制为 10。\n\n### 列表 1.2：问题代码 (mydrv.c)\n\
    \n```c\nint npages=0;\n\nEXPORT_SYMBOL(npages);\n\nstatic int memwalkd(void *unused)\n\
    {\n    long curr_pfn = (64*1024*1024 >> PAGE_SHIFT);\n    struct page *curr_page;\n\
    \    /* ... */\n    daemonize(“memwalkd”); /* 内核线程 */\n    sigfillset(&current->blocked);\n\
    \    allow_signal(SIGUSR1);\n    for (;;) {\n        /* 如果有挂起的信号，则出队 */\n    \
    \    if (signal_pending(current)) {\n            sig = dequeue_signal(current,\
    \ &current->blocked, &info);\n            /* 点 A */\n            /* 当接收到 SIGUSR1\
    \ 时释放 npages 页面 */\n            if (sig == SIGUSR1) {\n                /* 点 B\
    \ */\n                /* 当 npages 在以下循环中超过 10 时，问题出现。让我们通过 Kprobes 在此处应用运行时治疗\
    \ */\n                for (i=0; i < npages; i++, curr_pfn++) {\n             \
    \       /* ... */\n                }\n            }\n            /* ... */\n \
    \       }\n    }\n}\n\n```\n\n### 列表 1.3：注册 Kprobe 处理程序\n\n```c\n#include <linux/kernel.h>\n\
    #include <linux/module.h>\n#include <linux/kprobes.h>\n#include <linux/kallsyms.h>\n\
    #include <linux/sched.h>\nextern int npages; /* 定义在列表 1.2 中 */\n\n/* 探针结构 */\n\
    static struct kprobe bandaid;\n\n/* Pre Handler：在运行被探测指令之前调用 */\nint bandaid_pre(struct\
    \ kprobe *p, struct pt_regs *regs)\n{\n    if (npages > 10) npages = 10;\n   \
    \ return 0;\n}\n\n/* Post Handler：在运行被探测指令之后调用 */\nvoid bandaid_post(struct kprobe\
    \ *p, struct pt_regs *regs, unsigned long flags)\n{\n    /* 什么都不做 */\n}\n\n/*\
    \ Fault Handler：如果 pre/post-handlers 遇到异常时调用 */\nint bandaid_fault(struct kprobe\
    \ *p, struct pt_regs *regs, int trapnr)\n{\n    return 0;\n}\n\nint init_module(void)\n\
    {\n    int retval;\n    /* 填充 kprobe 体 */\n    bandaid.pre_handler = bandaid_pre;\n\
    \    bandaid.post_handler = bandaid_post;\n    bandaid.fault_handler = bandaid_fault;\n\
    \    /* 如所述到达目标地址 */\n    bandaid.addr = (kprobe_opcode_t*)kallsyms_lookup_name(“memwalkd”)\
    \ + 0xaa;\n    if (!bandaid.addr) {\n        printk(“Bad Probe Point\\n”);\n \
    \       return -1;\n    }\n    /* 注册 kprobe */\n    if ((retval = register_kprobe(&bandaid))\
    \ < 0) {\n        printk(\"register_kprobe error, return value=%d\\n”, retval);\n\
    \        return -1;\n    }\n    return 0;\n}\n\nvoid module_cleanup(void)\n{\n\
    \    unregister_kprobe(&bandaid);\n}\nMODULE_LICENSE(“GPL”);\n```\n\n## Kprobes\
    \ 补丁分析\n\n`列表 1.3` 使用 `Kprobes` 在 `kallsyms_lookup_name(“memwalkd”) + 0xaa` 处插入补丁，将\
    \ `npages` 限制为 10。要找到到达此探针地址，请再次查看列表 1.2。你希望补丁插入在点 B。使用 `objdump` 反汇编 `mydrv.ko`\
    \ 的内容来计算点 B 的内核地址：\n\n```bash\nobjdump -D mydrv.ko\n```\n\n```text\nmydrv.ko:\
    \ file format elf32-i386\nDisassembly of section .text:\n00000000 <memwalkd>:\n\
    \  55                   push   %ebp\n  89 e5               mov    %esp,%ebp\n\
    \  ...\n  75 2b               jne    0x2d <memwalkd+50>\n  83 f8 0a          \
    \  cmp    $0xa,%eax\n  ...\n  0f 8e b5             jle    aa <memwalkd+16c>\n\
    \  81 fd 7b             cmp    $0xf6,%ebp\n  ...\n  a1 c0               mov  \
    \  %0,%eax\n```\n\n### 注意事项\n\n如果你为不同的处理器平台进行交叉编译，必须使用特定架构的 `objdump`。如果你反汇编一个为\
    \ ARM 目标设备交叉编译的二进制文件，你需要像 `arm-linux-objdump` 的工具。向 `objdump` 传递 `-S` 可以将源代码与反汇编输出混合：\n\
    \n```bash\narm-linux-objdump -d -S mydrv.ko\n```\n\n如果你尝试将列表 1.2 中的 C 代码与之前的反汇编导出进行匹配，你可以将点\
    \ A 和点 B 与显示的内核地址关联。`kallsyms_lookup_name()` 定位 `memwalkd()` 的地址，`0xaa` 是点 B 所在的偏移量，因此在\
    \ `kallsyms_lookup_name(“memwalkd”) + 0xaa` 处应用探针。\n\n注册 `kprobe` 后，`memwalkd()`\
    \ 等效看起来如下：\n\n```c\nstatic int memwalkd(void *unused)\n{\n    ...\n    for (;;)\
    \ {\n        ...\n        /* 点 A */\n        if (sig == SIGUSR1) {\n         \
    \   /* 点 B */\n            if (npages > 10) npages = 10; /* 治疗性补丁！ */\n      \
    \      ...\n        }\n    }\n}\n```\n\n你必须在内核配置期间启用 `CONFIG_KALLSYMS` 以获取此函数的服务。\n\
    \n"
- fmt: "\n# SECTION #2: Kernel Probes\n\n```c\nfor (i=0; i < npages; i++, curr_pfn++)\
    \ {\n    /* ... */\n}\n}\n/* ... */\n}\n/* ... */\n}\n```\n\nWhenever `npages`\
    \ is assigned a value greater than 10, the kprobed patch pulls it back to 10,\
    \ thus stepping around the problem. \n\nIn the next two sections, let’s look at\
    \ a couple of helper facilities that make it easier to use `Kprobes` during function\
    \ entry and exit.\n\n## Jprobes\n\nA `jprobe` is a specialized `kprobe`. It eases\
    \ the work of adding a probe when the point of investigation is at the entry to\
    \ a kernel function. The `jprobe` handler has the same prototype as the probed\
    \ function. It’s invoked with the same argument list as the probed function, so\
    \ you can easily access the function arguments from the `jprobe` handler. If you\
    \ use `Kprobes` rather than `Jprobes`, imagine the hassles your probe handler\
    \ needs to undergo, wading through the dark alleys of the function stack to extract\
    \ function arguments! And this code that delves into the stack to elicit argument\
    \ values has to be heavily function-specific, not to mention being architecture-dependent\
    \ and unportable.\n\nTo learn how to use `Jprobes`, let’s revert to an example.\
    \ Assume that you’re debugging a network device driver (that is built as part\
    \ of the kernel) by looking at the `printk()` messages it’s generating.\n\nThe\
    \ driver is emitting crucial values in octal (base 8), but to your horror, the\
    \ driver writer has introduced a typo in the print format string by coding `%O`\
    \ rather than `%o`. So, all you can see are messages such as this: `Number of\
    \ Free Receive buffers = %O.`\n\n`Jprobes` to the rescue. You can fix this in\
    \ a few seconds, without recompiling or rebooting the kernel. First, take a look\
    \ at `printk()` defined in `kernel/printk.c`:\n\n```c\nasmlinkage int printk(const\
    \ char *fmt, ...)\n{\n    va_list args;\n    int r;\n    va_start(args, fmt);\n\
    \    r = vprintk(fmt, args);\n    va_end(args);\n    return r;\n}\n```\n\nLet’s\
    \ add a simple `jprobe` at the entry to `printk()` and transform every `%O` into\
    \ `%o`. Note that the `jprobe` handler needs to have the same prototype as `printk()`.\
    \ Both functions are marked with the `asmlinkage` tag that asks them to expect\
    \ arguments from the stack, rather than from CPU registers.\n\n### LISTING 1.4:\
    \ Registering Jprobe Handlers\n\n```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n\
    #include <linux/kprobes.h>\n#include <linux/kallsyms.h>\n\n/* Jprobe the entrance\
    \ to printk */\nasmlinkage int\njprintk(const char *fmt, ...)\n{\n    for (; *fmt;\
    \ ++fmt) {\n        if ((*fmt=='%')&&(*(fmt+1) == 'O')) *(char *)(fmt+1) = 'o';\n\
    \    }\n    jprobe_return();\n    return 0;\n}\n\n/* Per-probe structure */\n\
    static struct jprobe jprobe_eg = {\n    .entry = (kprobe_opcode_t *) jprintk\n\
    };\n\nint\ninit_module(void)\n{\n    int retval;\n    jprobe_eg.kp.addr = (kprobe_opcode_t*)\n\
    \    kallsyms_lookup_name(\"printk\");\n    if (!jprobe_eg.kp.addr) {\n      \
    \  printk(\"Bad probe point\\n\");\n        return -1;\n    }\n    /* Register\
    \ the Jprobe */\n    if ((retval = register_jprobe(&jprobe_eg) < 0)) {\n     \
    \   printk(\"register_jprobe error, return value=%d\\n\", retval);\n        return\
    \ -1;\n    }\n    printk(\"Jprobe registered.\\n\");\n    return 0;\n}\n\nvoid\n\
    module_cleanup(void)\n{\n    unregister_jprobe(&jprobe_eg);\n}\nMODULE_LICENSE(\"\
    GPL\");\n```\n\nWhen LISTING 1.4 invokes `register_jprobes()` to register the\
    \ `jprobe`, a `kprobe` is inserted at the beginning of `printk()`. When this probe\
    \ is hit, `Kprobes` replaces the saved return address with that of the registered\
    \ `jprobe` handler `jprintk()`. It then copies a portion of the stack and returns,\
    \ thus passing control to `jprintk()` with `printk()`’s argument list. When `jprintk()`\
    \ calls `jprobe_return()`, the original call state is restored, and `printk()`\
    \ continues to execute normally.\n\nWhen you insert this `jprobe`, the network\
    \ driver no longer emits useless messages announcing `%O`, rather it prints saner\
    \ information such as: `Number of Free buffers = o.`\n\n## Return Probes\n\nA\
    \ `return probe` (or `kretprobe` in `Kprobes` terminology) is another specialized\
    \ `Kprobes` helper. It eases the work of inserting `kprobe` when you need to probe\
    \ a function’s return point. If you use vanilla `Kprobes` to investigate return\
    \ points, you might need to register them at multiple places because a function\
    \ can return via multiple paths. However, if you use `kretbes`, you need to insert\
    \ only one `kretprobe` to cover the associated code paths. The function `tty_open()`\
    \ defined in `drivers/char/tty_io.c` has seven return paths. The successful path\
    \ returns `0`, and others return error values such as `-ENXIO` and `-ENODEV`.\
    \ A single `kretprobe` is sufficient to alert you about failures, irrespective\
    \ of the path.\n\n### LISTING 1.5: Registering Return Probe Handlers\n\n```c\n\
    #include <linux/kernel.h>\n#include <linux/module.h>\n#include <linux/kprobes.h>\n\
    #include <linux/kallsyms.h>\n\n/* kretprobe at exit from tty_open() */\nstatic\
    \ int\nkret_tty_open(struct kretprobe_instance *kreti,\nstruct pt_regs *regs)\n\
    {\n    /* The EAX register contains the function return value on x86 systems */\n\
    \    if ((int) regs->eax) {\n        /* tty_open() failed. Announce the return\
    \ code */\n        printk(\"tty_open returned %d\\n\", (int)regs->eax);\n    }\n\
    \    return 0;\n}\n\n/* Per-probe structure */\nstatic struct kretprobe kretprobe_eg\
    \ = {\n    .handler = (kretprobe_handler_t)kret_tty_open\n};\n\nint\ninit_module(void)\n\
    {\n    int retval;\n    kretprobe_eg.kp.addr = (kprobe_opcode_t*)\n    kallsyms_lookup_name(\"\
    tty_open\");\n    if (!kretprobe_eg.kp.addr) {\n        printk(\"Bad Probe Point\\\
    n\");\n        return -1;\n    }\n    /* Register the kretprobe */\n    if ((retval\
    \ = register_kretprobe(&kretprobe_eg) < 0)) {\n        printk(\"register_kretprobe\
    \ error, return value=%d\\n\", retval);\n        return -1;\n    }\n    printk(\"\
