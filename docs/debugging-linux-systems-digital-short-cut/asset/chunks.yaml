    You need to register a *pre-handler* that Kprobes will run just before executing
    the probed instruction and a *post-handler* that Kprobes will run after executing
    the probed instruction. You can also supply a *fault-handler* that will run if
    a fault is detected while executing the pre- or post-handlers (because you don’t
    want to “oops” due to a debugging bug!).


