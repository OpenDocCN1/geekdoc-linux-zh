  trans: "\n\n# 第 1 部分：内核调试器\n\n这等同于在将目标的调试串口直接连接到主机（而不是如图 1.2 所示连接到 JTAG 盒）后运行如 `minicom`\
    \ 等仿真器，这将限制主机在物理上必须靠近目标。\n\n## 图 1.2：基于 JTAG 的远程调试设置示例\n\n-   **远程 Linux 开发主机**\n\
    \    - **VNC 会话**\n    - **终端 1 (GDB 会话)**:\n        ```bash\n        bash> gdb\
    \ vmlinux\n        gdb> target remote\n        ```\n    - **终端 2 (目标控制台)**:\n\
    \        ```bash\n        bash> telnet 10.1.1.2\n        ```\n    - **终端 3 (JTAG\
    \ 控制)**:\n        ```bash\n        bash> telnet 10.1.1.2\n        jtag>\n    \
    \    ```\n    - **终端 4 (硬复位)**\n    - **终端 5 (导出的根文件系统)**\n        ```bash\n \
    \       bash> elinks 10.1.1.4\n        bash> cat /etc/exports\n        bash> cp\
    \ testcode /path/to/exported/root\n        ```\n-   **目标硬件**\n    - **串口**\n \
    \   - **JTAG**\n-   **远程电源开关**\n\n## 内核调试器\n\n终端 3 通过 telnet 连接到 JTAG 盒并提供特定调试器的语义。例如，你可以使用它执行以下操作：\n\
    \n-   从主机通过 TFTP 传取 JTAG 定义脚本并在 JTAG 启动期间执行它。JTAG 定义脚本通常初始化处理器、时钟寄存器、片选寄存器和内存库。完成后后，JTAG\
    \ 硬件即可准备好将代码下载到目标并执行。JTAG 制造商通常为所有支持的平台提供定义文件，因此你可能为你的板卡获得一个很好的起点。\n-   从主机通过\
    \ TFTP 将你的引导加载程序、内核或独立代码下载到目标上的闪存内存或 RAM 中。JTAG 调试器通常支持 `ELF` 和 `binary` 等文件格式。\n\
    -   单步执行代码、设置断点、检查寄存器并转储内存区域。\n-   复位目标。\n\nJTAG 调试有时可能会不稳定，因此如果你正在进行远程调试，通过远程电源控制开关为目标供电是一个好主意，如图\
    \ 1.2 所示。这样，你可以使用网络浏览器从主机对目标进行硬复位，如终端 4 所示。你也可以通过远程电源开关为 JTAG 硬件供电。这允许你在没有 JTAG\
    \ 及其定义文件介入的情况下直接从闪存运行引导加载程序。\n\n如果目标板拥有网络接口，它可以通过 `NFS` 从开发主机挂载其根文件系统。主机上的终端 5\
    \ 在导出的根文件系统上本地运行。根据你的调试场景，你可能有更多这样的终端。例如，如果你使用具有远程显示功能的示波器，可以通过另一个终端上的网络浏览器来操作它。\n\
    \n如果你的团队在地理上分散分散，可以在虚拟网络计算（VNC）等环境中运行终端 1 到 5。如果你的发行版中尚未包含 VNC，可以从 `www.realvnc.com`\
    \ 下载。有了这样的设置，你可以舒适地在家里调试远程板卡上的电子信号了！某些 JTAG 供应商提供复杂的集成开发环境，涵盖了之前详细的所有功能，因此如果你在使用其中之一，就不需要管理\
    \ VNC 终端会话了。\n\n在硬件启动期间，当你将引导加载程序或其他独立代码移植到目标时，先生成一个 `ELF` 镜像并在 RAM 中对其调试，然后再从闪存运行，这是一个好主意。但是，请记住消除与\
    \ JTAG 定义脚本执行的操作重复的引导加载程序初始化。\n\nJTAG 调试器的一个优势在于，你可以使用单一工具调试构成固件解决方案的不同部分。因此，你可以使用同一个调试器在源代码级别上调试\
    \ BIOS、引导加载程序、基础内核、设备驱动模块和用户空间应用程序。\n\n### 下载\n\n-   你可以从 `http://oss.sgi.com/projects/kdb`\
    \ 下载适用于 `x86` 和 `IA64` 架构的 `kdb` 补丁。每个支持的内核版本两个补丁：一个通和一个依赖架构的。\n-   `kgdb` 项目的主页为\
    \ `http://kgdb.sourceforge.net`。该网站还有关于配置和使用 `kgdb` 的文档。\n\n# 第 2 部分：内核探针 (Kernel\
    \ Probes)\n\n如果你的 Linux 发行版尚未包含 `gdb`，可以从 `www.gnu.org/software/gdb/gdb/gdb.html`\
    \ 获取。\n\n## 内核探针\n\n内核探针可以入侵内核函数并提取调试信息或应用修复补丁。它是你调试工具箱的有用补充，用于调查客户现场无法解释的行为，特别是当你没有重启系统的这种奢侈条件时。\n\
    \nLinux 支持一种通用形式的内核探针，称为 `Kprobes`，以及两种特殊变体：`Jprobes` 和返回探针（return probes）。\n\n\
    ### Kprobes\n\nKprobes 通过提供动态转储内核结构或向运行中的内核中插入代码的能力，可以节省构建和启动调试内核的麻烦。例如，你可以在不重新编译内核的情况下，在调度程序内部动态添加几个\
    \ `printk`。你甚至可以在不重启火星车探测器的情况下修复其上的一个 bug。\n\n要在内核函数内部插入 kprobe，请遵循以下步骤：\n1. \
    \ 在内核配置菜单中开启 `CONFIG_KPROBES`（*Instrumentation Support* → *Kprobes*）。\n2.  实现一个内核模块，在感兴趣的指令处注册一个\
    \ kprobe。你需要注册一个 Kprobes 在执行被探测指令之前运行的 `pre-handler`，以及一个 Kprobes 在执行被探测指令之后运行的\
    \ `post-handler`。你还可以提供一个 `fault-handler`，当在执行 pre- 或 post-handlers 时检测到故障，它将运行（因为你不不想由于调试\
    \ bug 导致“oops”错误！）。\n\n"
- fmt: "\n# Kernel Probes Overview\n\nWhen a `kprobe` is registered, it saves the\
    \ probed instruction and replaces it with an instruction that generates a breakpoint\
    \ (`int 0x03` on `x86`-based systems). When the breakpoint is hit, the kernel\
    \ generates a `die` notification. `Kprobes` inserts itself into the die notifier\
    \ chain, so it gets notified about the breakpoint hit.\n\nWhen notified, `Kprobes`\
    \ executes the registered `pre-handler`. Next, it steps through a copy of the\
    \ probed instruction. It executes a copy instead of swapping the probed instruction\
    \ with the breakpoint instruction for reasons of `SMP` consistency. Finally, it\
    \ runs the `post-handler`. The `pre-` and `post-handler` windows are the hooks\
    \ offered to the Kprobes user to inject debug code. The handlers `pre-` and `post-handler`\
    \ windows are the hooks offered to the `Kprobes` user to inject debug code. The\
    \ handlers can be registered and unregistered on-the-fly, so serviceability is\
    \ not merely static at compile time but programmable during runtime.\n\n## Example\
    \ Usage\n\nLet's learn to use `Kprobes` with the help of an example. Consider\
    \ the code snippet in Listing 1.2, which is a kernel thread that adds `npages`\
    \ number of pages to the free memory pool, whenever a `SIGUSR1` signal is delivered\
    \ to it. Most of the logic has been scissored out of the listing because it’s\
    \ not relevant. Assume that you are at a customer site to debug a problem reported\
    \ with this code.\n\nYou notice bad things whenever `npages` crosses 10, so you\
    \ want to apply a runtime patch that limits it to 10.\n\n### LISTING 1.2: Problem\
    \ Code (mydrv.c)\n\n```c\nint npages=0;\n\nEXPORT_SYMBOL(npages);\n\nstatic int\
    \ memwalkd(void *unused)\n{\n    long curr_pfn = (64*1024*1024 >> PAGE_SHIFT);\n\
    \    struct page *curr_page;\n    /* ... */\n    daemonize(“memwalkd”); /* kernel\
    \ thread */\n    sigfillset(&current->blocked);\n    allow_signal(SIGUSR1);\n\
    \    for (;;) {\n        /* Dequeue a signal if it’s pending */\n        if (signal_pending(current))\
    \ {\n            sig = dequeue_signal(current, &current->blocked, &info);\n  \
    \          /* Point A */\n            /* Free npages pages when SIGUSR1 is received\
    \ */\n            if (sig == SIGUSR1) {\n                /* Point B */\n     \
    \           /* Problem manifests when npages crosses 10 in the following loop.\
    \ Let’s apply run time medication here via Kprobes */\n                for (i=0;\
    \ i < npages; i++, curr_pfn++) {\n                    /* ... */\n            \
    \    }\n            }\n            /* ... */\n        }\n    }\n}\n\n```\n\n###\
    \ LISTING 1.3: Registering Kprobe Handlers\n\n```c\n#include <linux/kernel.h>\n\
    #include <linux/module.h>\n#include <linux/kprobes.h>\n#include <linux/kallsyms.h>\n\
    #include <linux/sched.h>\nextern int npages; /* Defined in Listing 1.2 */\n\n\
    /* Per-probe structure */\nstatic struct kprobe bandaid;\n\n/* Pre Handler: Invoked\
    \ before running probed instruction */\nint bandaid_pre(struct kprobe *p, struct\
    \ pt_regs *regs)\n{\n    if (npages > 10) npages = 10;\n    return 0;\n}\n\n/*\
    \ Post Handler: Invoked after running probed instruction */\nvoid bandaid_post(struct\
    \ kprobe *p, struct pt_regs *regs, unsigned long flags)\n{\n    /* Nothing to\
    \ do */\n}\n\n/* Fault Handler: Invoked if the pre/post-handlers encounter a fault\
    \ */\nint bandaid_fault(struct kprobe *p, struct pt_regs *regs, int trapnr)\n\
    {\n    return 0;\n}\n\nint init_module(void)\n{\n    int retval;\n    /* Fill\
    \ the kprobe structure */\n    bandaid.pre_handler = bandaid_pre;\n    bandaid.post_handler\
    \ = bandaid_post;\n    bandaid.fault_handler = bandaid_fault;\n    /* Arrive at\
    \ the target address as explained */\n    bandaid.addr = (kprobe_opcode_t*)kallsyms_lookup_name(“memwalkd”)\
    \ + 0xaa;\n    if (!bandaid.addr) {\n        printk(“Bad Probe Point\\n”);\n \
    \       return -1;\n    }\n    /* Register the kprobe */\n    if ((retval = register_kprobe(&bandaid))\
    \ < 0) {\n        printk(“register_kprobe error, return value=%d\\n”, retval);\n\
    \        return -1;\n    }\n    return 0;\n}\n\nvoid module_cleanup(void)\n{\n\
    \    unregister_kprobe(&bandaid);\n}\nMODULE_LICENSE(“GPL”);\n```\n\n## Analysis\
    \ of the Kprobes Patch\n\n`LISTING 1.3` uses `Kprobes` to insert a patch at `kallsyms_lookup_name(“memwalkd”)\
    \ + 0xaa`, which limits `npages` to 10. To figure out how to arrive at this probe\
    \ address, take another look at Listing 1.2. You want the patch to be inserted\
    \ at Point B. To calculate the kernel address at Point B, disassemble the contents\
    \ of `mydrv.ko` using `objdump`:\n\n```bash\nobjdump -D mydrv.ko\n```\n\n```text\n\
    mydrv.ko: file format elf32-i386\nDisassembly of section .text:\n00000000 <memwalkd>:\n\
    \  55                   push   %ebp\n  89 e5               mov    %esp,%ebp\n\
    \  ...\n  75 2b               jne    0x2d <memwalkd+50>\n  83 f8 0a          \
    \  cmp    $0xa,%eax\n  ...\n  0f 8e b5             jle    aa <memwalkd+16c>\n\
    \  81 fd 7b             cmp    $0xf6,%ebp\n  ...\n  a1 c0               mov  \
    \  %0,%eax\n```\n\n### Note\n\nYou have to use an architecture-specific `objdump`\
    \ if you’re cross-compiling for a different processor platform. You need something\
