    and directly jumps to the protected mode entry point (for x86 processors). An
    important challenge to implement kexec is the interaction that happens between
    the kernel and the boot firmware (BIOS on x86-based systems, Openfirmware on POWER-based
    machines, and so on). On x86 systems, information such as the *e820* memory map
    passed to the kernel by the BIOS needs to be supplied to the kexec-ed kernel,
