  trans: "\n\n# 内核调试器\n\n在代码开发之前投入时间进行逻辑设计和软件工程，并在开发后仔细检查代码，可以最大限度地减少甚至消除错误。但由于这说起来容易做起来难，而且由于我们都是人类，开发者需要调试工具。在这个快捷指南中，我们将探索调试内核代码的各种方法。这里描述的技术汇编自书籍\
    \ *Essential Linux Device Drivers*（Prentice Hall Open Source Software Development\
    \ Series, ISBN 978-0-132-39655-4）的不同部分。\n\n## 可靠性、可用性、可维护性\n\n许多系统（尤其是任务关键系统）对可靠性、可用性和可维护性（RAS）有需求。Linux\
    \ RAS 工作已经促进了若干项强大工具的发展。\n\n如 Linux 测试项目 (LTP) 等练习工具可以衡量你内核移植的可靠性和健壮性。CPU 热插拔和\
    \ Linux 高可用性 (HA) 项目可以被视为可用性。内核调试器、`Kprobes`、`Kdump`、`EDAC` 和 Linux 跟踪工具包 (LTT)\
    \ 则属于可维护性的范畴。这些分类之间的界限有时很模糊；你可以使用这些方法中的任意一种或组合来适应你的调试需求。例如，`OProfile` 等内核剖析器的输出既可以用于寻找潜在的代码瓶颈（可靠性），也可以用于调试现场问题（可维护性）。\n\
    \n## 内核调试器\n\n指令级内核调试器(`kdb`) 和源码级内核 GNU 调试器(`kgdb`) 是 Linux 内核的两个主要调试器。是否将调试器作为标准内核的一部分一直是内核邮件列表中经常讨论的议题，但从\
    \ 2.6.26 版本开始，轻量版本的 `kgdb` 最终已集成到主线内核中。即使你倾向于避开看似深奥莫测的内核调试器操作，你也可以通过普通的 GNU 调试器(`gdb`)\
    \ 获取有关内核崩溃（kernel panics）的信息并查看内核变量。JTAG 调试器使用硬件辅助调试，功能强大但价格昂贵。\n\n内核调试器让内核内部变得更加透明。你可以单步执行指令、反汇编指令、显示并修改内核变量，以及查看栈回溯。在本节中，让我们通过一些示例学习内核调试器的基础知识。\n\
    \n### 进入调试器\n\n你可以通过多种方式进入内核调试器。一种方法是传递命令行参数，要求内核在启动期间进入调试器。另一种方法是通过软件断点或硬件断点。`breakpoint`（断点）是你希望停止执行并将控制权转移给调试器的地址。软件断点会将该地址处的指令替换为其他触发异常的指令。你可以使用调试器命令设置软件断点，也可以将其插入到你的代码中。对于基于\
    \ x86 的系统，你可以如下所示在内核源码中设置软件断点：\n\n```\nasm(\" int $3”);\n```\n\n或者，你可以调用 `BREAKPOINT`\
    \ 宏，它会被翻译为相应的依赖架构的指令。\n\n如果停止所需的指令位于闪存中（调试器无法对其替换），则可以使用硬件断点代替软件断点。硬件断点需要处理器的支持。相应的地址需要添加到调试寄存器中。拥有的硬件断点数量取决于处理器支持的调试寄存器数量。\n\
    \n你还可以请求调试器对变量设置 `watchpoint`（观察点）。每当有指令修改观察点地址处的数据时，调试器就会停止执行。\n\n另一种进入调试器的常用方法是按下中断键（attention\
    \ key），但在许多情况下这不起作用。如果你的代码在禁用中断后处于紧密循环中，内核将没有机会处理中断键并进入调试器。例如，如果你的代码执行了如下操作，你就无法通过中断键进入调试器：\n\
    \n```c\nunsigned long flags;\nlocal_irq_save(flags);\nwhile (1) continue;\nlocal_irq_restore(flags);\n\
    ```\n\n当控制权转移到调试器时，你可以使用各种调试器命令开始分析。\n\n### 内核调试器 (kdb)\n\n`Kdb` 是用于调试内核代码和设备驱动程序的指令级调试器。在使用它之前，你需要用\
    \ `kdb` 支持补丁你的内核源码并重新编译内核。\n\n`kdb` 的主要优势是易于设置，因为你不需要额外的机器来进行调试（与 `kgdb` 不同）。主要缺点是你需要将源码与反汇编后的代码进行对应（同样，与\
    \ `kgdb` 不同）。\n\n让我们通过示例来上手一下 `kdb`。这里是“案发现场”：你修改了一个内核串口驱动程序以适配你的 x86 硬件，但驱动程序无法工作，你想让\
    \ `kdb` 帮你抓到罪魁祸首。\n\n让我们通过在串口驱动的 `open()` 入口设置断点来开始寻找指纹。\n\n记住，因为 `kdb` 不是源码级调试器，你需要打开源码并尝试将指令与你的\
    \ C 代码相匹配。让我们列出相关的源码片段：\n\n```c\ndrivers/serial/myserial.c\nstatic int rs_open(struct\
    \ tty_struct *tty, struct file *filp)\n{\n    struct async_struct *info;\n   \
    \ /* ... */\n    retval = get_async_struct(line, &info);\n    if (retval) return(retval);\n\
    \    tty->driver_data = info;\n    /* Point A */\n    /* ... */\n}\n```\n\n按下暂停键（Pause）并进入\
    \ `kdb`。让我们看看反汇编后的 `rs_open()` 什么样。这里显示的调试会话使用 `→` 符号附加说明。\n\n```\nEntering kdb\
    \ (current=0xc03f6000, pid 0) on processor 0 due to Keyboard Entry\nkdb> id rs_open\
    \ → Disassemble rs_open\n0xc01cce00 rs_open: sub $0x1c, %esp\n0xc01cce03 rs_open+0x03:\
    \ mov $ffffffed, %ecx\n...\n0xc01cce4b rs_open+0x4b: call 0xc01ccca0, get_async_struct\n\
    ...\n0xc01cce56 rs_open+0x56: mov 0xc(%esp,1), %eax\n0xc01cce5a rs_open+0x5a:\
    \ mov %eax, 0x9a4(%ebx)\n...\n```\n\n源码中的 Point A 是设置断点的好位置，因为你可以查看 tty 结构体和 info\
    \ 结构体来看看发生了什么。\n\n"
- fmt: "\nLooking side by side at the source and the disassembly, `rs_open+0x5a` corresponds\
    \ to Point A. Note that correlation is easier if the kernel is compiled without\
    \ optimization flags.\n\nSet a breakpoint at `rs_open+0x5a` (which is address\
    \ `0xc01cce5a`) and continue execution by exiting the debugger:\n\n```bash\nkbd>\
    \ bp rs_open+0x5a → Set breakpoint\nkbd> go → Continue execution\n```\n\n# SECTION\
    \ #1: Kernel Debuggers\n\nNow you need to get the kernel to call `rs_open()` to\
    \ hit the breakpoint. To trigger this, execute an appropriate user-space program.\
    \ In this case, echo some characters to the corresponding serial port `/dev/ttySX`:\n\
    \n```bash\nbash> echo “Anjali loves kerala monsoons” > /dev/ttySX\n```\n\nThis\
    \ results in the invocation of `rs_open()`. The breakpoint gets hit, and `kdb`\
    \ assumes control: Entering kdb on processor 0 due to Breakpoint @ `0xc01cce5a`\n\
    \n```bash\nkdb>\n```\n\nLet’s now find out the contents of the `info` structure.\
    \ If you look at the disassembly, one instruction before the breakpoint (`rs_open+0x56`),\
    \ you see that the `EAX` register contains the address of the `info` structure.\
    \ Let’s look at the register contents:\n\n```bash\nkbd> r → Dump register contents\n\
    eax = 0xcf1ae680 ebx = 0xce03b000 ecx = 0x00000000\n```\n\nSo, `0xcf1ae680` is\
    \ the address of the `info` structure. Dump its contents using the `md` command:\n\
    \n```bash\nkbd> md 0xcf1ae680 → Memory dump\n0xcf1ae680 00005301 0000ABC 00000000\
    \ 10000400\n```\n\nTo make sense of this dump, let’s look at the corresponding\
    \ structure definition. `info` is defined as `struct async_struct` in `include/linux/serial.h`\
    \ as follows:\n\n```c\nstruct async_struct {\n    int magic; /* Magic Number */\n\
    \    unsigned long port; /* I/O Port */\n    int hub6;\n    /* ... */\n};\n```\n\
    \nIf you match the dump with the definition, `0x5301` is the magic number and\
    \ `0xABC` is the I/O port.\n\nWell, isn’t this interesting! `0xABC` doesn’t look\
    \ like a valid port. If you have done enough serial port debugging, you know that\
    \ the I/O port base addresses and IRQs are configured in `include/asm-x86/serial.h`\
    \ for x86-based hardware. Change the port definition to the correct value, recompile\
    \ the kernel, and continue your testing!\n\n## Kernel GNU Debugger (kgdb)\n\n\
    `kgdb` is a source-level debugger. It is easier to use than `kdb` because you\
    \ don’t need to spend time correlating assembly code with your sources. However,\
    \ it’s more difficult to set up because an additional machine is needed to front-end\
    \ the debugging.\n\nYou have to use `gdb` in tandem with `kgdb` to step through\
    \ kernel code. `gdb` runs on the host machine, whereas the `kgdb`-enabled kernel\
    \ runs on the target hardware. The host and the target are connected via a serial\
    \ null-modem cable. You can also launch `kgdb` debug sessions over Ethernet.\n\
    \nYou have to inform the kernel about the identity and baud rate of the serial\
    \ port via command-line arguments. Depending on the bootloader used, add the following\
    \ kernel arguments to either `syslinux.cfg`, `lilo.conf`, or `grub.conf`:\n\n\
    ```bash\nkgdbwait kgdb8250=X,115200\n```\n\n`kgdbwait` asks the kernel to wait\
    \ until a connection is established with the host-side `gdb`, `X` is the serial\
    \ port connected to the host, and `115200` is the baud rate used for communication.\n\
    \nNow configure the same baud rate on the host side:\n\n```bash\nbash> stty speed\
    \ 115200 < /dev/ttySX\n```\n\nIf your host computer is a laptop that does not\
    \ have a serial port, you can use a USB-to-serial converter for the debug session.\
    \ In that case, instead of `/dev/ttySX`, use the `/dev/ttyUSBX` node created by\
    \ the `usbserial` driver.\n\nLet’s learn kgdbdb basics using the example of a\
    \ buggy kernel module. Modules are easier to debug because the entire kernel need\
    \ not be recompiled after making code changes, but remember to compile your module\
    \ with the `-g` option to generate symbolic information. Because modules are dynamically\
    \ loaded, the debugger needs to be informed about the symbolic information that\
    \ the module contains. Listing 1.1 contains a buggy `trojan_function()`. Assume\
    \ that it’s defined in `drivers/char/my_module.c`.\n\n### Listing 1.1: Buggy Function\n\
    ```c\nchar buffer;\nint trojan_function() {\n    int *my_variable = 0xAB, i;\n\
    \    /* ... */\n    Point A:\n    i = *my_variable; /* Kernel Panic: my_variable\
    \ points to bad memory */\n    return(i);\n}\n```\n\nInsert `my_module.ko` on\
    \ the target and look inside `/sys/module/my_module/sections/` to decipher ELF\
    \ (Executable and Linking Format) section addresses. The `.text` section in ELF\
    \ files contains code, `.data` contains initialized variables, `.rodata` contains\
    \ initialized read-only variables such as strings, and `.bss` contains variables\
    \ that are not initialized during startup. The addresses of these sections are\
    \ available in the form of the files `.text`, `.data`, `.rodata`, and `.bss` in\
    \ `/sys/module/my_module/sections/` if you enable `CONFIG_KALLSYMS` during kernel\
    \ configuration. To obtain the code section address, for instance, do this:\n\n\
    ```bash\nbash> cat /sys/module/my_module/sections/.text\n0xe091a060\n```\n\nMore\
    \ module load information is available from `/proc/modules` and `/proc/kallsyms`.\n\
    \nAfter you have the section addresses, invoke `gdb` on the host-side machine:\n\
    \n```bash\nbash> gdb vmlinux → vmlinux is the uncompressed kernel (gdb) target\n\
    target remote /dev/ttySX → Connect to the target\n```\n\nIf you still use a 2.4\
    \ kernel, get the section addresses using the `-m` option to `insmod` instead:\n\
    \n```bash\nbash> insmod my_module.o –m\n```\n\nBecause you passed `kgdbwait` as\
    \ a kernel command-line argument, `gdb` gets control when the kernel boots on\
    \ the target. Now inform `gdb` about the preceding section addresses using the\
    \ `add-symbol-file` command:\n\n```bash\n(gdb) add-symbol-file drivers/char/mymodule.ko\
    \ 0xe091a060 -s .rodata 0xe091d1fc -s .data 0xe091d260 -s .bss 0xe091d2c0\n```\n"
