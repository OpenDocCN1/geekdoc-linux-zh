    测试设备


    不言而喻，调试设备驱动程序需要全套相关的测试设备。例如，如果你在纯数字实验室环境中测试调制解调器接口，手机模拟器将大有益。如果高速串口驱动程序出现奇校验错误，示波器可以帮助你分析问题。如果你正在编写
    I/O 设备驱动程序，拥有相关的总线分析仪将会有帮助。如果你正在编写网络驱动程序，相应的协议链路嗅探器将减轻你的调试工作。


    ## 第 7 节：调试网络吞吐量


    为了获得最佳的网络吞吐量，你需要为高性能设计你的 `网络接口卡 (NIC)` 驱动程序。此外，你还需要对驱动程序传输的网络协议有深入的理解。为了了解如何调试网络吞吐量问题，让我们来看一些可能影响
    `NIC` 性能的设备驱动设计问题和协议实现特性。


    ### 驱动性能

    让我们先来看一些影响你 `NIC` 性能的驱动设计问题：


    1. 在为快速 `NIC` 设计驱动程序时，尽量减少主数据路径中的指令数量是一个关键标准。考虑一个具有 `1 MB` 板载内存的 `1 Gbps` 以太网适配器。在链路速率下，卡内存可以存储多达
    `8 毫秒` 的接收数据。这直接转化为允许的最大指令路径长度。在这个长度内，传入的数据包必须经过重组、通过 `DMA` 传输到内存、由驱动程序处理、免受并发访问保护并交付给上层协议。

    2. 在程序化 I/O (`PIO`) 期间，数据从设备一路传输到 CPU 然后才写入内存。此外，每当设备需要传输数据时，CPU 都会中断，这会导致延迟和上下文切换延迟。`DMA`
    不受这些瓶颈的影响，但如果要传输的数据少于阈值，其成本可能比 `PIO` 更 高。这是因为小规模 `DMAs` 在构建描述符和为了数据一致性刷新相应的处理器缓存行方面具有较高的相对开销。性能敏感型设备驱动程序可能会在实验确定阈值后，对小包使用
    `PIO`，对大包使用 `DMA`。

    3. 对于具有 `DMA` 主控能力的 `PCI` 网卡，你需要确定最佳的 `DMA` 突发大小，即网卡连续控制总线的时间。如果卡突发持续过长，它可能会占用总线，导致处理器无法跟上之前
    `DMA` 传输的数据。`PCI` 驱动程序通过 `PCI` 配置空间中的寄存器来设置突发大小。通常，`NIC` 的突发大小被设置为与处理器的缓存行大小相同，即处理器每次发生缓存缺失时从系统内存读取的字节数。但在实践中，你可能需要连接总线分析仪来确定有益的突发时长，因为系统上是否存在分总线（如
    `ISA` 和 `PCI` 等多种总线类型）等因素会影响最优值。

    4. 许多高速 `NIC` 提供了从协议栈中卸载 CPU 密集型 `TCP` 校验计算的能力。某些支持 `DMA` 散聚集传输。驱动程序需要利用这些能力来实现底层网络所提供的最大实际带宽。

    5. 有时，如果驱动程序优化对高层协议的实现细节不敏感，可能会产生意想不到的减速。考虑在配备高速 `NIC` 的计算机上挂载 `NFS` 文件系统。假设 `NIC`
    驱动程序仅偶尔触发传输完成中断，以最小化延迟，但 `NFS` 服务器实现使用释放传输缓冲区作为流控机制。由于驱动程序只在稀疏产生的传输完成中断期间释放 `NFS`
    传输缓冲区，导致 `NFS` 文件拷贝速度缓慢，而互联网下载却能飞快地产生最大吞吐量。


    ### 协议性能

    现在让我们探讨一些可以提高或损害网络吞吐量的特定特性：


    1. `TCP` 窗口大小会影响吞吐量。窗口大小提供了在收到确认之前可以传输的数据量。对于快速 `NIC`，小的窗口大小可能导致 `TCP` 空闲等待已传输数据包的确认。即使使用大窗口大小，少量丢失的
    `TCP` 数据包也会影响性能，因为丢失的帧会占用窗口。在 `UDP` 的情况下，窗口大小是不相关的，因为它不支持确认。然而，由于缺乏流控机制，微小的丢包可能会导致速率大幅下降。

    2. 随着写入 `TCP` 套接字的应用程序数据块大小增加，从用户空间拷贝到内核空间的缓冲区数量就会减少。这降低了对处理器利用率的需求并有利于性能。然而，如果块大小超过了对应网络协议的
    `MTU`，处理器周期将浪费在分片上。因此，理想的块大小是输出接口的 `MTU`，或者是路径 MTU 发现机制运行时，通过 IP 路径无需分片发送的最大包。例如，在
    `ATM` 上运行 `IP` 时，由于 `ATM` 适配层具有 `64K` 的 `MTU`，块大小几乎没有上限限制（RFC 1626 将其置为 `9180`）。但如果你在
    `ATM LANE` 上运行 `IP`，块大小应镜像所模拟的相应 LAN 技术的 `MTU` 大小。对于标准以太网应该是 `1500`，对于巨型比特以太网应该是
    `8000`，对于 `16 Mbps 令牌环`应该是 `18 K`。


    有许多工具可用于网络性能基。从 `www.netperf.org` 免费获取的 `Netperf` 可以建立复杂的 `TCP/UDP` 连接场景。你可以使用脚本来。

