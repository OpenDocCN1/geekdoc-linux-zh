    \n## 内核 GNU 调试器 (kgdb)\n\n`kgdb` 是一个源码级调试器。它比 `kdb` 更用，因为你不需要花费时间关联汇编代码与源码。然而，它的设置更容易，因为需要额外的机器作为调试前端。\n\
