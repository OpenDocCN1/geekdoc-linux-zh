    \ `kgdb` 调试会话。\n\n你需要通过命令行参数告知内核串口的标识和波特率。根据使用的启动程序，将以下内核参数添加到 `syslinux.cfg`、`lilo.conf`\
    \ 或 `grub.conf` 中：\n\n```bash\nkgdbwait kgdb8250=X,115200\n```\n\n`kgdbwait` 要求内核等待直到主机端的\
