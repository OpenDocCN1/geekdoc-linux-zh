    \nFrom the Library of Ross Hagglund\n\nDownload at WoweBook.Com\n\n# Product Description\n\
    \n[Product Description](#index_split_000.html_1)\n\n*Debugging Linux Systems*\
    \ discusses the main tools available today to debug 2.6 Linux Kernels. We start\
    \ by exploring the seemingly esoteric operations of the Kernel Debugger (`KDB`),\
    \ Kernel GNU DeBugger (`KGDB`), the plain GNU DeBugger (`GDB`), and JTAG debuggers.\
    \ We then investigate `Kernel Probes`, a feature that lets you intrude into a\
    \ kernel function and extract debug information or apply a medicated patch. Analyzing\
    \ a crash dump can yield clues for postmortem analysis of kernel crashes or hangs,\
    \ so we take a look at `Kdump`, a serviceability tool that collects a system dump\
    \ after spawning a new kernel. Profiling points you to code regions that burn\
    \ more CPU cycles, so we learn to use the `OProfile` kernel profiler and the `gprof`\
    \ application profiler to sense the presence of code bottlenecks. Because tracing\
    \ provides insight into behavioral problems that manifest during interactions\
    \ between different code modules, we delve into the Linux Trace Toolkit, a system\
    \ designed for high-volume trace capture.\n\nThe section “Debugging Embedded Linux”\
    \ takes a tour of the I/O interfaces commonly found on embedded hardware, such\
    \ as flash memory, serial port, PCMCIA, Secure Digital media, USB, RTC, audio,\
    \ video, touch screen, and Bluetooth, and provides pointers to debug the associated\
    \ device drivers. We also pick up some board-level debugging skills with the help\
    \ of a case study. The section “Debugging Network Throughput” takes you through\
    \ some device driver design issues and protocol implementation characteristics\
    \ that can affect the horsepower of your network interface card. We end the shortcut\
    \ by examining several options available in the kernel configuration menu that\
    \ can emit valuable debug information.\n\n3\n\nDebugging Linux Systems (Digital\
    \ Shortcut)\n\n© 2010 Pearson Education. All rights reserved.\n\nby Sreekrishnan\
    \ Venkateswaran\n\nThis publication is protected by cop[yright. Please see page\
    \ 2 for more details.](#index_split_000.html_2)\n\nFrom the Library of Ross Hagglund\n\
    \nDownload at WoweBook.Com\n\n# Conventions Used\n\n[Kernel Version](#index_split_000.html_1)\n\
    \nThis shortcut is generally up to date as of the 2.6.25/26 kernel versions. Most\
    \ code listings in this shortcut were tested on a 2.6.23 kernel. If you are using\
    \ a later version, look at Linux websites such as `lwn.net` to learn about the\
    \ kernel changes made since the above releases.\n\n[Book Website](#index_split_000.html_1)\n\
    \nI’ve set up a website at `elinuxdd.com` to provide updates, errata, and other\
    \ information related to *Essential Linux Device Drivers* and this digital shortcut.\n\
    \nptg5994185\n\n[Conventions Used](#index_split_000.html_1)\n\nSource code, function\
    \ names, and shell commands, are written like this. The shell prompt used is `bash>`.\
    \ Filenames are written in italics, *like this*. Italics are also used to introduce\
    \ new terms.\n\nSome sections modify original kernel source files while implementing\
    \ code examples. To clearly point out the changes, newly inserted code lines are\
    \ prefixed with `+`, and any deleted code lines with `-`.\n\nSometimes, for simplicity,\
    \ this shortcut uses generic references. So if the text points you to the `arch/your-arch/*`\
    \ directory, it should be translated, for example, to `arch/x86/*` if you are\
    \ compiling the kernel for the x86 architecture.\n\nThe `→` symbol is sometimes\
    \ inserted between command or kernel output to attach explanations.\n\n4\n\nDebugging\
    \ Linux Systems (Digital Shortcut)\n\n© 2010 Pearson Education. All rights reserved.\n\
    \nby Sreekrishnan Venkateswaran\n\nThis publication is protected by cop[yright.\
    \ Please see page 2 for more details.](#index_split_000.html_2)\n\nFrom the Library\
    \ of Ross Hagglund\n\nDownload at WoweBook.Com\n\n# Dedication\n\nSome sections\
    \ refer you to user-space scripts or configuration files. The exact names and\
    \ locations of such files might, however, vary according to the Linux distribution\
    \ you use.\n\n[Dedication](#index_split_000.html_1)\n\n*This digital shortcut,\
    \ like* Essential Linux Device Drivers, is dedicated to the ten million visually\
    \ challenged citizens of India. All author proceeds will go to their cause.*\n\
    \n5\n\nptg5994185\n"
