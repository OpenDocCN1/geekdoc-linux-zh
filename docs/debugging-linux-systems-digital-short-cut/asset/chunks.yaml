    Entering a Debugger


    You can enter a kernel debugger in multiple ways. One way is to pass command-line
    arguments that ask the kernel to enter the debugger during boot. Another way is
    via software or hardware ptg5994185


    breakpoints. A *breakpoint* is an address where you want execution stopped and
    control transferred to the debugger. A software breakpoint replaces the instruction
    at that address with something else that causes an exception. You can set software
    breakpoints either using debugger commands or by inserting them into your code.
    For x86-based systems, you can set a software breakpoint in your kernel source
