    \ by copyright. Please see page 2 for more details. (#index_split_000.html_2)\n\
    From the Library of Ross Hagglund\nDownload at WoweBook.Com\n\n# SECTION #6\n\
    ## Debugging Embedded Linux\n\nIf you turn on `Device Drivers` → `USB support`\
    \ → `USB verbose debug messages` during kernel configuration, the kernel will\
    \ emit the contents of all `dev_dbg()` statements present in the USB subsystem.\n\
    \nYou can glean device and bus specific information from the USB filesystem (`usbfs`)\
    \ node `/proc/bus/usb/devices`. `usbfs` also lets you implement USB device drivers\
    \ in user space. Even when the final destination of your USB driver is inside\
    \ the kernel, starting with a user space driver can ease debugging and testing.\n\
    \nThe `linux-usb-devel` mailing list is the forum to discuss questions related\
    \ to USB device drivers.\n\nVisit `https://lists.sourceforge.net/lists/listinfo/linux-usb-devel`\
    \ for subscription and archive retrieval information. Read `www.linux-usb.org/usbtest`\
    \ for ideas on USB testing.\n\nThe home page of the Linux-USB project is `www.linux-usb.org/`.\
    \ You can download the USB 2.0 specification, OTG supplement, and other related\
    \ standards from `www.usb.org/developers/docs/`.\n\n## Real Time Clock\n\nMany\
    \ embedded SoCs include RTC support to keep track of wall time, but some rely\
    \ on an external RTC chip. Unlike x86-based computers where the RTC is part of\
    \ the South Bridge chipset, embedded controllers commonly interface with external\
    \ RTCs via slow serial buses such as `I2C` or `SPI`. You can drive such RTCs by\
    \ writing client drivers that use the services of the `I2C` or `SPI` core layers.\
    \ The former drivers can be found under `drivers/i2c/`, and the latter under `drivers/spi/`.\n\
    \nTo collect I2C-specific debugging messages, turn on a relevant combination of\
    \ `I2C Core` debugging messages, `I2C Algorithm` debugging messages, `I2C Bus`\
    \ debugging messages, and `I2C Chip` debugging messages under `Device Drivers`→\
    \ `I2C` support in the kernel configuration menu. Similarly, for SPI debugging,\
    \ turn on Debug Support for SPI drivers under `Device Drivers`→ `SPI` support.\n\
    \n75\n Debugging Linux Systems (Digital Shortcut)\n© 2010 Pearson Education. All\
    \ rights reserved.\nby Sreekrishnan Venkateswaran\nThis publication is protected\
    \ by copyright. Please see page 2 for more details. (#index_split_000.html_2)\n\
    From the Library of Ross Hagglund\nDownload at WoweBook.Com\n\n# SECTION #6\n\
    ## Debugging Embedded Linux\n\nTo understand the flow of I2C packets on the bus,\
    \ connect an I2C bus analyzer to your board. The `lm-sensors` package contains\
    \ a tool called `i2cdump` that dumps register contents of devices on the I2C bus.\n\
    \nYou can find a mailing list dedicated to Linux I2C at `http://lists.lm-sensors.org/mailman/listinfo/i2c`.\n\
    \n## Audio\n\nAn audio codec converts digital audio data to analog sound signals\
    \ for playback via speakers and performs the reverse operation for recording through\
    \ a microphone. The codec’s connection with the CPU depends on the digital audio\
    \ interface supported by the embedded controller. The usual way to communicate\
    \ with a codec is via the Audio Codec’97 (`AC’97`) bus or the Inter-IC Sound (`I2S`)\
    \ bus for data and `I2C` for the control interface.\n\n`Advanced Linux Sound Architecture`\
    \ (`ALSA`) is the sound framework of choice in the 2.6 kernel. ALSA obsoletes\
    \ `Open Sound System` (`OSS`), which was the sound subsystem in 2.4 kernels. The\
    \ kernel’s sound core and audio bus drivers stay inside the top-level `sound/`\
    \ directory in the kernel source tree.\n\nYou may turn on options under `Device\
    \ Drivers`→ `Sound`→ `Advanced Linux Sound Architecture` in the kernel configuration\
    \ menu to include ALSA debug code (`CONFIG_SND_DEBUG`), verbose `printk()` messages\
    \ (`CONFIG_SND_VERBOSE`), and procfs content. Procfs information pertaining to\
    \ ALSA resides in `/proc/asound/`. Look inside `/sys/class/sound/` for each sound\
    \ device.\n\n76\n Debugging Linux Systems (Digital Shortcut)\n© 2010 Pearson Education.\
    \ All rights reserved.\nby Sreekrishnan Venkateswaran\nThis publication is protected\
    \ by copyright. Please see page 2 for more details. (#index_split_000.html_2)\n\
    From the Library of Ross Hagglund\nDownload at WoweBook.Com\n\n# SECTION #6\n\
    ## Debugging Embedded Linux\n\nIf you think you have found a bug in an ALSA driver,\
    \ post it to the alsa-devel mailing list (`http://mailman.alsa-project.org/listinfo/alsa-devel`).\
    \ The `Linux Audio` `Developers` (`LAD`) list, discusses questions related to\
    \ the Linux-Sound architecture and audio applications.\n\n## Touch Screen\n\n\
    Touch is the primary input mechanism on several embedded devices. Many handhelds\
    \ offer soft keyboards for data entry.\n\nptg5994185\nThe kernel offers an `input`\
    \ subsystem for the uniform handling of functionally similar input devices even\
    \ if they are physically different. For example, all mice, whether they are PS/2,\
    \ USB, or Bluetooth, are treated alike. The kernel also provides an `event` abstraction\
    \ for dispatching input reports to user applications. Applications such as X work\
    \ seamlessly over the event interfaces exported by the input subsystem.\n\nIf\
    \ your touch controller driver conforms to the input event abstraction, it’s straightforward\
    \ to tie it with a `graphical user interface` (`GUI`).\n\nYou can use the `evbug`\
