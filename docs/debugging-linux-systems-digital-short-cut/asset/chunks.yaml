  trans: "\n\n作者 Sreekrishnan Venkateswaran\n\n本出版受版权保护。更多详情请参阅第 2 页](#index_split_000.html_2)\n\
    \n源自 Ross Hagglund 图馆\n\n在 WoweBook.Com 下载\n\n# 第 4 节 性能分析 (Profiling)\n\n缓存缺失的次数。在不支持性能计数器的系统上，`OProfile`\
    \ 通过在定时器事件期间收集数据来获取有限的信息。\n\nOProfile 包含以下部分：\n\n- 一个收集性能分析信息的内核层。若要在内核中启用 `OProfile`，请启用\
    \ `CONFIG_PROFILING`、`CONFIG_OPROFILE` 和 `CONFIG_APIC` 并重新编译。\n- `oprofiled` 守护进程。\n\
    - 一系列性能分析后工具，如 `opcontrol`、`opreport` 和 `op_help`，有助于对收集到的数据进行详细分析。这些工具包含在多个发行版中；如果你的发行版没有包含它们，你可以下载预编译的二进制文件。\n\
    \n为了说明内核性能分析的基本知识，让我们模拟文件系统层中的瓶颈，并使用 `OProfile` 来检测它。我们感兴趣的代码区域是文件系统层中读取目录的部分（`fs/readdir.c`\
    \ 中的函数 `vfs_readdir()`）。\n\n首先，使用 `opcontrol` 配置 `OProfile`：\n\n```bash\nopcontrol\
    \ --setup --vmlinux=/path/to/kernelsources/vmlinux --event=GLOBAL_POWER_EVENTS:100000:1:1:1\n\
    ```\n\n事件指定符要求 `OProfile` 在 `GLOBAL_POWER_EVENTS` 期间（处理器未停止的时间）收集样本。事件指定符旁边的数字分别表示时钟周期中的采样计数、单位掩码过滤器、内核空间计数和用户空间计数。如果你想每秒采样\
    \ `x` 次，且你的处理器运行频率为 `cpu_speed HZ`，那么你的采样计数应大约为 `(cpu_speed/x)`。计数越大，生成的性能分析报告越越精细，但也会产生更多的\
    \ CPU 开销。如果你仍在使用 2.4 内核，则需要为内核源码打上 `OProfile` 支持丁。\n\n`OProfile` 支持的事件取决于你的处理器：\n\
    \n```bash\nopcontrol -l\n```\n→ 列出 Pentium 4 CPU 上的可用事件\n\n`GLOBAL_POWER_EVENTS`:\
    \ (counter: 0, 4)\n处理器未停止的时间（最小计数: 3000）\n\n`BRANCH_RETIRED`: (counter: 3, 7)\n\
    已执行的分支（最小计数: 3000）\n\n`MISPRED_BRANCH_RETIRED`: (counter: 3, 7)\n已执行的预测错误分支（最小计数:\
    \ 3000）\n\n`BSQ_CACHE_REFERENCE`: (counter: 0, 4)\n...\n\n接下来，启动 `OProfile` 并运行基准测试工具来压力你想分析的内核部分。访问\
    \ http://lbs.sourceforge.net/ 查看 Linux 基准测试项目列表。对于此示例，让我们通过递归列出系统中的所有文件来测试虚拟文件系统\
    \ (VFS) 层：\n\n```bash\nopcontrol -start\n```\n→ 开始数据收集\n\n```bash\nls -lR /**\n\
    ```\n→ 压力测试\n\n```bash\nopcontrol -dump\n```\n→ 保存性能分析数据\n\n使用 `opreport` 查看性能分析结果。`%`\
    \ 列提供了函数对系统负载的度量：\n\n```bash\nopreport -l /path/to/kernelsources/vmlinux\n```\n\
    \nCPU: P4 / Xeon, 速度 2992.9 MHz (估计值)\n计数 `GLOBAL_POWER_EVENTS` 事件（处理器未停止的时间），单位掩码为\
    \ 0x01（当处理器活动时计算周期），计数 100000\n\nsamples % symbol name\n914506 24.2423 vgacon_scroll\
    \ → *ls* 输出打印到控制台\n406619 10.7789 do_con_write\n273023 7.2375 vgacon_cursor\n\
    206611 5.4770 __d_lookup\n...\n1380 0.0366 vfs_readdir → 我们感兴趣的程序\n...\n1 2.7e-05\
    \ vma_prio_tree_next\n\n现在，让我们通过在 `vfs_readdir()` 中引入 1 毫秒的延迟来模拟 VFS 代码中的瓶颈。这在列表\
    \ 1.6 中完成。\n\n### 列表 1.6\nvfs_readdir() 定义在 fs/read_dir.c\n```c\nint vfs_readdir(struct\
    \ file *file, filldir_t filler, void *buf)\n{\n    struct inode *inode = file->f_dentry->d_inode;\n\
    \    int res = -ENOTDIR;\n\n    /* 引入毫秒级瓶颈 */\n    /* (在此系统上 HZ 设置为 1000) */\n\
    \    unsigned long timeout = jiffies+1;\n    while (time_before(jiffies, timeout));\n\
    \    /* 瓶颈结束 */\n    /* ... */\n}\n```\n\n带有此更改编译内核并重新收集。新数据所示：\n```bash\nopreport\
    \ -l /path/to/kernelsources/vmlinux\n```\n\nCPU: P4 / Xeon, 速度 2993.08 MHz (估计值)\n\
    计数 `GLOBAL_POWER_EVENTS` 事件（处理器未停止的时间），单位掩码为 0x01（当处理器活动时计算周期），计数 100000\n\nsamples\
    \ % symbol name\n6178015 57.1640 vfs_readdir → 我们感兴趣的程序\n1065197 9.8561 vgacon_scroll\
    \ → *ls* 输出打印到控制台\n479801 4.4395 do_con_write\n...\n\n如你所见，瓶颈清晰地反映在性能数据中。`vfs_readdir()`\
    \ 现在跳到了列表顶端！\n\n你可以使用 `OProfile` 获取更多信息。例如，你可以收集数据缓存行缺失的百分比。缓存是靠近处理器的快速内存。对缓存的提取以处理器缓存行为单位进行的（Pentium\
    \ 4 为 32 字节）。如果你需要的数据不在缓存中（缓存缺失），处理器必须从主内存中提取，这会消耗更多的 CPU 周期。对该内存的后续访问（以及被调入缓存的周围字节）将更快，直到相应的缓存行失效为止。你可以配置\
    \ `OProfile` 通过对你的内核代码进行 `BSQ_CACHE_REFERENCE` 事件（针对 Pentium 4）性能分析来计算缓存缺失次数。然后你可以调整你的代码，可能通过重新对齐数据结构中的字段以实现更好的缓存利用率：\n\
    \n```bash\nopcontrol --setup --event=BSQ_CACHE_REFERENCE:50000:0x100:1:1 --vmlinux=/path/to/kernelsources/vmlinux\n\
    ```\n→ 单位掩码 0x100 表示 L2 缓存缺失\n"
- fmt: "\n# SECTION 5 Tracing\n\nIf you run `OProfile` on different kernel versions\
    \ and look at the corresponding logs, you might figure out reasons for changes\
    \ in different parts of the kernel. You have only touched the surface of what\
    \ can be accomplished using `OProfile`. For more information, visit [http://oprofile.sourceforge.net/](http://oprofile.sourceforge.net/).\n\
    \n## Application Profiling with Gprof\n\nIf you need to profile only an application\
    \ process in isolation without profiling the kernel code that might get executed\
    \ on its behalf, use `gprof` rather than OProfile. `gprof` relies on additional\
    \ code generated by the compiler to profile C, Pascal, or Fortran programs. Let’s\
    \ use `gprof` to profile the following code snippet:\n\n```c\nmain(int argc, char\
    \ *argv[]){\n    int i;\n    for (i=0; i<10; i++) {\n        if (!do_task()) {\
    \ /* Perform task */\n            do_error_handling(); /* Handle errors */\n \
    \       }\n    }\n}\n```\n\nUse the `-pg` option to ask the compiler to include\
    \ extra code that generates a call graph profile when the program runs. The `-g`\
    \ option generates symbolic information.\n\n### Running and viewing the profile\n\
    \n```bash\ngcc -pg -g -o myprog myprog.c\n```\n```bash\n./myprog\n```\n\nThis\
    \ produces `gmon.out`, which is a call graph of `myprog`. Run `gprof` to view\
    \ the profile:\n\n```bash\ngprof -p -b myprog\n```\n\n### Flat profile:\n\nEach\
    \ sample counts as 0.01 seconds.\n\n| % | cumulative | self | total calls | s/call\
    \ | name |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 65.17 | 2.75 | 2.75\
    \ | 2 | 1.38 | do_error_handling |\n| 34.83 | 4.22 | 10 | do_task |\n\nThis shows\
    \ that the error path was hit twice during execution. You can tune the code to\
    \ produce fewer traversals of the error path and rerun `gprof` to generate an\
    \ updated profile.\n\n## Tracing\n\nTracing provides insight into behavioral problems\
    \ that manifest during interactions between different code modules. A common way\
    \ to obtain execution traces is by using `printk`. Although `printk` is perhaps\
    \ the most heavily used method for kernel debugging (there are more than 62,000\
    \ `printk()` statements in the 2.6.23 source tree), it is not sophisticated enough\
    \ for high-volume tracing. Linux Trace Toolkit (LTT) is a powerful tool that lets\
    \ you obtain complex system level traces with minimum overhead.\n\n### Linux Trace\
    \ Toolkit\n\nLTT extracts execution traces that are useful for postmortem analyses\
    \ and is valuable in situations where it might not be possible to use a debugger.\
    \ Unlike OProfile, which collects data by sampling events at regular intervals,\
    \ LTT provides exact traces of events as and when they occur.\n\nLTT consists\
    \ of four components:\n\n1. A core module that provides trace services to the\
    \ rest of the kernel. The collected traces are copied to a kernel buffer.\n2.\
    \ Code that makes use of the trace services. These are inserted at points where\
    \ you want to capture trace dumps.\n3. A trace daemon that pulls trace information\
    \ from the kernel buffer to a permanent location in the filesystem.\n4. Utilities\
    \ such as `tracereader` and `tracevisualizer` that interpret raw trace data and\
    \ convert it into human-readable form. If you are developing code for an embedded\
    \ device having no GUI support, you can transparently run these tools on another\
    \ machine.\n\nLTT is not part of the mainline kernel. You might download LTT kernel\
    \ patches, trace daemon, and user-space trace utilities from [www.opersys.com/LTT.](http://www.opersys.com/LTT).\n\
    \nLet’s find out what LTT offers with the help of a simple example. Assume that\
    \ you see data corruption when your application is reading from a device. To figure\
    \ out whether LTT was introducing the corruption, first add trace hooks to the\
    \ driver. This is done in the 2.6.11 release candidate.\n\n```c\n#include <linux/trace.h>\n\
    \n/* Creating Events */\nstruct mydriver_data {\n    int i;\n};\n\nstatic struct\
    \ mydriver_data driver_data;\n\n/* Trace events */\nstatic __init void driver_trace_init(void)\
    \ {\n    /* ... */\n}\n\n/* Driver init */\nstatic __init void driver_trace_init(void)\
    \ {\n    /* ... */\n}\n\n/* Driver read method */\nssize_t mydriver_read(struct\
    \ file *file, char *buf, size_t count, loff_t *ppos) {\n    char *buffer;\n  \
    \  /* Read numbytes of data from the device into buffer */\n    /* ... */\n  \
    \  /* If you see the packet length greater than a value, use that as a filter\
    \ */\n    if (count > value) {\n        /* Dump data packets */\n        trace_raw_event(data_packet,\
    \ numbytes, buffer);\n    }\n    return 0;\n}\n\n/* Dump data structures */\n\
    if (some_other_condition) {\n    /* See Listing 1.7 for the definition of driver_data\
    \ */\n    trace_raw_event(driver_data, sizeof(driver_data), &driver_data);\n}\n\
    ```\n"
