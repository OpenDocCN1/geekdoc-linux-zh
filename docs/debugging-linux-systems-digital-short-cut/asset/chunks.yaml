    thread runs once a second and touches a per-CPU timestamp variable. If the CPU
    sits in a tight loop, the watchdog thread cannot update this timestamp. An update
    check is carried out during timer interrupts using softlockup_tick() (defined
    in *kernel/softlockup.c*). If the watchdog timestamp is more than 10 seconds old,
    it concludes that a soft lockup has occurred and emits a kernel message to that
    effect.


    Second, the log frowns upon mydrv_init()+0xd (or 0xf893d00), so let’s look at
    the disassembly of the surrounding code region:


    crash> dis f893d000 5


    dis: WARNING: f893d000: no associated kernel symbol found


    0xf893d000: mov $0xf89f1208,%eax


    ptg5994185


    0xf893d005: sub $0x8,%esp


    0xf893d008: call 0xc0342300 <_spin_lock>


    0xf893d00d: movl $0xffffffff,0xf89f1214


    0xf893d017: movl $0xffffffff,0xf89f1210


    The return address in the stack is 0xf893d00d, so the kernel is hanging inside
    the previous instruction, which is a call to spin_lock(). If you co-relate this
    with the earlier source snippet and look at it in the eye, you can see the error
    sequence, spin_lock()/spin_lock_init(), staring sorrowfully back at you. Fix the
    problem by swapping the sequence.


    You can also use crash to peek at data structures of interest, but be aware that
    memory regions that were swapped out during the crash are not part of the dump.
    In the preceding example, you can examine mydrv_wq as follows:


    53


