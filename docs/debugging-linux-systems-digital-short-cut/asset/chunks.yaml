    # 嵌入式 Linux 调试


    ## PCMCIA / CF


    PCMCIA（个人电脑内存卡国际协会）或紧凑型（CF）插槽是嵌入式设备常见的扩展。使用 CF 卡为设备启用 WiFi 的优势在于，如果 WiFi 控制器生命周期结束，你不需要重新设计电路板。


    此外，由于 PCMCIA/CF 这种形式支持多种技术，你可以自由地在以后将连接模式从 WiFi 更改为蓝牙等其他技术。这种方案的缺点是，即使有机械固定，插槽本质上也是不可靠的。卡可能会因为冲击和震动而松动，从而导致间歇性连接。


    内核的 PCMCIA/CF 子系统位于 `/drivers/pcmcia/` 目录。


    ## PC Card 客户端驱动


    PC Card 客户端驱动的信息可以在进程文件条目 `/proc/bus/pccard/drivers` 中找到。查看 `/sys/bus/pcmcia/devices/`
    可以获取特定卡的信息，例如制造商和卡 ID。如果你的系统使用 PCI 转 PCMCIA 桥器，请查看 `/proc/bus/pci/` 内部以了解更多关于你的
    PCMCIA 主控制器的信息。`/proc/interrupts` 列出了系统上活跃的 IRQ，包括 PCMCIA 层使用的 IRQ。


    你可以在这里找到 Linux-PCMCIA 邮件列表：http://lists.infradead.org/mailman/listinfo/linux-pcmcia。


    ## 数字存储媒体 (SD)


    许多嵌入式处理器包含了与 SD 和 MMC 媒体通信的控制器。


    SD/MMC 存储使用 NAND 闪存构建。与 CF 卡一样，SD/MMC 卡为你的设备增加了数 GB 的内存。它们还提供了方便的内存升级路径，因为 SD/MMC
    卡的可用密度不断增加。


    内核在 `/drivers/mmc/` 中包含一个 SD/MMC 子系统。


    `hdparm` 工具从底层内核块驱动提取各种 PATA/SATA 磁盘参数。例如，要对 SATA 驱动器的磁盘读取速度进行基，可以这样做：


    ```bash

    hdparm -T -t /dev/sda

    ```


    ```

    /dev/sda:

    Timing cached reads: 2564 MB in 2.00 seconds = 1283.57 MB/sec

    ```


    如需了解 `hdparm` 的完整功能，请阅读帮助页（man pages）。


    ## SMART


    自监控、分析和报告技术（SMART）是内置在许多现代 ATA 和 SCSI 磁盘中的系统，用于监控故障并执行自检。名为 `smartd` 的用户空间守护进程在底层设备程序的帮助下收集支持
    SMART 的磁盘收集的信息。查看 `smartd`、`smartctl` 和 `smartd.conf` 的帮助页以学习如何从支持 SMART 的磁盘获取健康状态。


    如果你的发行版没有预包 `hdparm` 和 SMART 工具，你可以分别从 http://sourceforge.net/projects/hdparm/
    和 http://sourceforge.net/projects/smartmontools/ 下载它们。


    ## IDE 和 SCSI 设备


    `/proc/ide/` 下的文件包含有关系统中 IDE 磁盘驱动器的信息。要获取第一块 IDE 磁盘的几何结构，请查看 `/proc/ide/ide0/hda/geometry`
    的内容。有关 SCSI 设备的信息位于 `/proc/scsi/` 下。你可以从 `/proc/partitions` 收集磁盘分区信息。


    IDE 设备感兴趣的 `sysfs` 目录是 `/sys/bus/ide/`，而 SCSI 是 `/sys/bus/scsi/`。


    此外，系统上激活的每个块设备在 `/sys/block/` 下都有一个子目录，其中包含相关的请求队列参数、分区详情和状态信息。


    提供了一些内核配置选项可以触发块系统发布调试输出。`CONFIG_BLK_DEV_IO_TRACE` 提供了跟踪块层的能力。`CONFIG_SCSI_CONSTANTS`
    和 `CONFIG_SCSI_LOGGING` 分别开启 SCSI 错误报告和日志记录。


    linux-ide 邮件列表是讨论 Linux-IDE 子系统相关问题的论坛。


    订阅 linux-scsi 邮件列表并浏览其存档，可以参与 Linux-SCSI 子系统的讨论。


    ## 通用串行总线 (USB)


    旧计算机支持 USB 主机模式，通过该模式你可以与大多数类型的 USB 设备通信。嵌入式系统通常还需要支持 USB 设备模式，即系统本身作为 USB 设备并插入到其他主机计算机中。


    许多现代嵌入式控制器支持 USB OTG，这让你的设备可以作为 USB 主机也可以作为 USB 设备工作。例如，它允许你将 USB 闪存盘连接到你的嵌入式设备。它还允许你的嵌入式设备通过导出部分本地存储供外部访问，使其作为
    USB 闪存盘。Linux USB 子系统（位于 `/drivers/usb/`）提供了 USB OTG 的驱动程序。对于不支持 OTG 的硬件，USB Gadget
    项目（实现在 `/drivers/usb/gadget/` 中）带来了 USB 设备能力。


    USB 总线分析仪可以放大总线上的活动，对于调试底层问题很有用。如果你无法获得分析仪，可以使用内核的软 USB 跟踪器 `usbmon`。该工具捕获 USB
    主机和设备之间的流量。要收集轨迹，请从 `debugfs` 文件 `/sys/kernel/debug/usbmon/Xt` 中读取，其中 `X` 是你的设备连接的总线号。


    例如，考虑一个连接到 PC 的 USB 磁盘。从 `/proc/bus/usb/devices` 中相关的“T:” 行，你可以看到驱动器连接到总线 1：`T:
    Bus=01 Lev=01 Prnt=01 Port=03 Cnt=01 Dev# 2 Spd=480`。


    确保你已经在内核中启用了 debugfs (`CONFIG_DEBUG_FS`) 和 usbmon (`CONFIG_USB_MON`) 支持。这是从磁盘拷贝文件时
    usbmon 的输出快照：


    ```bash

    mount -t debugfs none_debugs /sys/kernel/debug/

    cat /sys/kernel/debug/usbmon/1u

    ```


    ```

    ee6a5c40 3718782540 S Bi:1:002:1 -115 20480 <

    ee6a5cc0 3718782567 S Bi:1:002:1 -115 65536 <

    ee6a5d40 3718782595 S Bi:1:002:1 -115 36864 <

    ee6a5c40 3718788189 C Bi:1:002:1 0 20480 = 0f846801 118498f

    ```


