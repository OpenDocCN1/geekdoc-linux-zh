    \ during kernel configuration to obtain the services of this function.\n"
  raw: 'When a kprobe is registered, it saves the probed instruction and replaces
    it with an instruction that generates a breakpoint (int 0x03 on x86-based systems).
    When the breakpoint is hit, the kernel generates a *die* notification. Kprobes
    inserts itself into the die notifier chain, so it gets notified about the breakpoint
    hit.


    When notified, Kprobes executes the registered pre-handler. Next, it steps through
    a copy of the probed instruction. It executes a copy instead of swapping the probed
    instruction with the breakpoint instruction for reasons of SMP consistency. Finally,
    it runs the post-handler. The pre- and post-handler windows are the hooks offered
    to the Kprobes user to inject debug code. The handlers can be registered and unregistered
    on-the-fly, so serviceability is not merely static at compile time but programmable
    during runtime.


