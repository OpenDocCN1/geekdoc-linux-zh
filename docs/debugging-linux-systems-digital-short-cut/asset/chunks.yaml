    SECTION #7


    Debugging Network Throughput


    it helps if you have the associated bus analyzer. If you are writing a network
    driver, the corresponding protocol line sniffer eases your debugging effort.


    [Debugging Network Throughput](#index_split_000.html_1)


    To obtain optimal network throughput, you need to design your *network interface
    card (NIC)* driver for high performance. Additionally, you need an in-depth understanding
    of the network protocol that your driver ferries. To get a flavor of how to debug
    network throughput problems, let’s examine some device driver design issues and
    protocol implementation characteristics that can affect the horse power of your
    NIC.


    ptg5994185


    Driver Performance


    Let’s first take a look at some driver design issues that can affect your NIC’s
    performance:


    . Minimizing the number of instructions in the main data path is a key criterion
    while design-ing drivers for fast NICs. Consider a 1 Gbps Ethernet adapter with
    1 MB of onboard memory.


    At line rate, the card memory can hold up to 8 milliseconds of received data.
    This directly translates to the maximum allowable instruction path length. Within
    this path length, incoming packets have to be reassembled, DMA-ed to memory, processed
    by the driver, protected from concurrent access, and delivered to higher layer
    protocols.


    . During programmed I/O (PIO), data travels all the way from the device to the
    CPU before it gets written to memory. Moreover, the CPU is interrupted whenever
    the device needs to transfer data, and this contributes to latencies and context
    switch delays. DMAs do not suffer from these bottlenecks but can turn out to be
    more expensive than PIOs if the data to be transferred 83


    Debugging Linux Systems (Digital Shortcut)


    © 2010 Pearson Education. All rights reserved.


    by Sreekrishnan Venkateswaran


    This publication is protected by cop[yright. Please see page 2 for more details.](#index_split_000.html_2)


    From the Library of Ross Hagglund


    Download at WoweBook.Com


    SECTION #7


    Debugging Network Throughput


    is less than a threshold. This is because small DMAs have high relative overheads
    for building descriptors and flushing corresponding processor cache lines for
    data coherency. A performance-sensitive device driver might use PIO for small
    packets and DMA for larger ones, after experimentally determining the threshold.


    . For PCI network cards having DMA mastering capability, you need to determine
    the optimal DMA burst size, which is the time for which the card controls the
    bus at one stretch. If the card bursts for a long duration, it might hog the bus
    and prevent the processor from keeping up with data DMA-ed previously. PCI drivers
    program the burst size via a register in the PCI configuration space. Normally
    the NIC’s burst size is programmed to be the same as the cache line size of the
    processor, which is the number of bytes that the processor reads from system ptg5994185


    memory each time there is a cache miss. In practice, however, you might need to
    connect a bus analyzer to determine the beneficial burst duration because factors
    such as the presence of a split bus (multiple bus types like ISA and PCI) on your
    system can influence the optimal value.


    . Many high-speed NICs offer the capability to offload the CPU-intensive computation
    of TCP


    checksums from the protocol stack. Some support DMA scatter-gather. The driver
    needs to leverage these capabilities to achieve the maximum practical bandwidth
    that the underlying network yields.


    . Sometimes, a driver optimization might create unexpected speed bumps if it’s
    not sensitive to the implementation details of higher protocols. Consider an NFS-mounted
    filesystem on a computer equipped with a high-speed NIC. Assume that the NIC driver
    takes only occasional transmit complete interrupts to minimize latencies but that
    the NFS server implementation uses freeing of its transmit buffers as a flow-control
    mechanism. Because the driver frees NFS


    transmit buffers only during the sparsely generated transmit complete interrupts,
    file copies over NFS crawl, even as Internet downloads zip along yielding maximum
    throughput.


    84


    Debugging Linux Systems (Digital Shortcut)


    © 2010 Pearson Education. All rights reserved.


    by Sreekrishnan Venkateswaran


    This publication is protected by cop[yright. Please see page 2 for more details.](#index_split_000.html_2)


    From the Library of Ross Hagglund


    Download at WoweBook.Com


    SECTION #7


    Debugging Network Throughput


    Protocol Performance


    Let’s now dig into some protocol-specific characteristics that can boost or hurt
    network throughput:


    . TCP window size can impact throughput. The window size provides a measure of
    the amount of data that can be transmitted before receiving an acknowledgment.
    For fast NICs, a small window size might result in TCP sitting idle, waiting for
    acknowledgments of packets already transmitted. Even with a large window size,
    a small number of lost TCP packets can affect performance because lost frames
    can use up the window at line speeds. In the case of UDP, the window size is not
    relevant because it does not support acknowledgments. However, a small packet
    loss can spiral into a big rate drop due to the absence of flow-control mechanisms.


    ptg5994185


    . As the block size of application data written to TCP sockets increases, the
    number of buffers copied from user space to kernel space decreases. This lowers
    the demand on processor utilization and is good for performance. If the block
    size crosses the MTU corresponding to the network protocol, however, processor
    cycles get wasted on fragmentation. The desirable block size is thus the outgoing
    interface MTU, or the largest packet that can be sent without fragmentation through
    an IP path if Path MTU discovery mechanisms are in operation. While running IP
    over ATM, for example, because the ATM adaptation layer has a 64K MTU, there is
    virtually no upper bound on block size. (RFC 1626 defaults this to 9180.) If you
    run IP over ATM LANE, however, the block size should mirror the MTU size of the
    respective LAN technology being emulated. It should thus be 1500 for standard
    Ethernet, 8000 for jumbo Gigabit Ethernet, and 18 K for 16 Mbps Token Ring.


    Several tools are available to benchmark network performance. *Netperf*, available
    for free from


    [www.netperf.org/, can set up complex TCP/UDP connection scenarios. Y](www.netperf.org/)ou
    can use scripts to 85


