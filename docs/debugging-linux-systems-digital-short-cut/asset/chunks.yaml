    # SECTION #2: Kernel Probes


    When [When Listing 1.5 invokes]`register_kretprobes()`, a kprobe is internally
    inserted at the beginning of `tty_open()`. When this probe gets hit, this internal
    kprobe handler replaces the function return address with that of a special routine
    (called a `trampoline` in Kprobes terminology). Look at `arch/your-arch/kernel/kprobes.c`
    for the implementation of the trampoline.


    When `tty_open()` returns via any of its seven return paths, control returns to
    the trampoline instead of the caller function. The trampoline invokes the kretprobe
    handler `kret_tty_open()`, [registered by Listing 1.5, which prints the return
    value if]`tty_open()` has not returned successfully.


    ## Limitations


    Kprobes has its limitations. Some of them are obvious. You won’t, for example,
    see desired results if you insert a kprobe inside an inline function. And, of
    course, you can’t probe Kprobes code.


    Kprobes are more useful for applying probes inside the base kernel. If the subject
    code is part of a dynamically loadable module, you might as well rewrite and recompile
    your module rather than write and compile a new module to “kprobe” it. However,
    you might still want to use Kprobes if bringing down the module is not acceptable.


    There are less-obvious limitations, too. Optimizations are done at compile time,
    whereas Kprobes are inserted during runtime. So, the effect of inserting instructions
    via Kprobes is not equivalent to adding code in the original source files. For
    example, the buggy code snippet:


    ```c

    volatile int *integerp = 0xFF;

    int integerd = *integerp;

    ```


    is reduced by the compiler to:


    ```assembly

    mov 0xff, %eax

    ```


    So, you can’t easily use Kprobes if you want to sneak in between those two lines
    of C code, allocate a word of memory, point `integerp` to the allocated word,
    and circumvent a kernel crash.


    ## Note

    SystemTap (http://sourceware.org/systemtap/) is a diagnostic tool that eases the
    use of Kprobes.


    ## Looking at the Sources


    The Kprobes implementation consists of a generic portion defined in `kernel/kprobes.c`
    (and `include/linux/kprobes.h`) and an architecture-dependent part that lives
    in `arch/your-arch/kernel/kprobes.c` (and `include/asm-your-arch/kprobes.h`).


    Peek inside `Documentation/kprobes.txt` for further information about Kprobes,
    Jprobes, and Kretprobes.


    # SECTION #3: Kexec and Kdump


    Now that you have learned how to use Kprobes, let’s continue and look at more
    facets of Linux RAS. `Kexec` and `kdump` are serviceability features introduced
    in the 2.6 kernel.


    Kexec uses the image overlay philosophy of the UNIX `exec()` system call to spawn
    a new kernel over a running kernel without the overhead of boot firmware. This
    can save several seconds of reboot time because boot firmware spends cycles walking
    buses and recognizing devices. The less the reboot latency, the less the system
    downtime; so, this was one of the main motivations for developing kexec. However,
    kexec’s most popular user is kdump. Capturing a dump after a kernel crash is inherently
    unreliable because kernel code that accesses the dump device might be in an unstable
    state. Kdump circumvents this problem by collecting the dump after booting into
    a healthy kernel via kexec.


    ## Kexec


    Before you can kexec a kernel, you need to do some preparations:


    1. Compile and boot into a kernel that has kexec support. For this, turn on `CONFIG_KEXEC`
    (`Processor Type and Features` → `Kexec System Call`) in the kernel configuration
    menu. This kernel is called the first kernel or the running kernel.

    2. Prepare the kernel that is to be kexec-ed. This second kernel can be the same
    as the first kernel.

    3. Download the `kexec-tools` package source tar ball and produce the user-space
    tool called `kexec`.


    The kexec tool built in Step 3 is invoked in two stages. The first stage loads
    the second kernel image into the buffers of the running kernel, whereas the second
    stage actually overlays the running kernel:


    1. Load the second (overlay) kernel using the `kexec` command:

    ```bash

    kexec -l /path/to/kernelsources/arch/x86/boot/bzImage -append="root=/dev/hdaX"
    --initrd=/boot/myinitrd.img

    ```

    `bzImage` is the second kernel, `hdaX` is the root device, and `myinitrd.img`
    is the initial root filesystem. The kernel implementation of this stage is mostly
    architecture-independent. At the heart of this stage is the `sys_kexec()` system
    call. The `kexec` command loads the new kernel image into the running kernel’s
    buffers using the services of this system call.

    2. Boot into the second kernel:

    ```bash

    kexec -e

    ```

    ... → Kernel boot up messages


    Kexec abruptly starts the new kernel without gracefully halting the operating
    system. To shut down prior to reboot, invoke `kexec` from the bottom of the `halt`
    script (usually `/etc/rc.d/rc0.d/*S01halt`) and invoke `halt` instead.


    The implementation of the second stage is architecture-dependent. The crux of
    this stage is a `reboot_code_buffer` that contains assembly code to put the new
    kernel in place to boot.


    Kexec bypasses the initial kernel code that invokes the services of boot firmware
    and directly jumps to the protected mode entry point (for x86 processors). An
    important challenge to implement kexec is the interaction that happens between
    the kernel and the boot firmware (BIOS on x86-based systems, Openfirmware on POWER-based
    machines, and so on). On x86 systems, information such as the `e820` memory map
    passed to the kernel by the BIOS needs to be supplied to the kexec-ed kernel,
    too.


    ## Kexec with Kdump


    The kexec invocation semantics are somewhat special when it’s used in tandem with
    kdump. In this case, kexec is required to automatically boot a new kernel when
    it encounters a kernel panic.


    If the running kernel crashes, the new kernel (called the capture kernel) is booted
    to reliably collect the dump. A typical call syntax is this:


    ```bash

    kexec -p /path/to/capture-kernel-sources/vmlinux --args-linux --append="root=/dev/hdaX
    irqpoll" --initrd=/boot/myinitrd.img

    ```

