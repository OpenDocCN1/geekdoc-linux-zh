    Touch Screen


    Touch is the primary input mechanism on several embedded devices. Many handhelds
    offer soft touch keyboards for data entry.


    ptg5994185


    The kernel offers an *input* subsystem for the uniform handling of functionally
    similar input devices even if they are physically different. For example, all
    mice, whether they are PS/2, USB, or Bluetooth, are treated alike. The kernel
    also provides an *event* abstraction for dispatching input reports to user applications.
    Applications such as X Windows work seamlessly over the event interfaces exported
    by the input subsystem.


    If your touch controller driver conforms to the input event abstraction, it’s
    straightforward to tie it with a *graphical user interface* ( *GUI*).


    You can use the *evbug* module as a debugging aid if you’re developing an input
    driver. It dumps the ( *type*, *code*, *value*[) tuple corresponding to events
    generated by the input subsystem. Figure 1.4](#index_split_000.html_78)


    contains data captured by evbug while operating some input devices.


