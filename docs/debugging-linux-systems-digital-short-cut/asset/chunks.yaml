    SECTION #6


    Debugging Embedded Linux


    If you turn on *Device Drivers* → *USB support* → *USB verbose debug messages*
    during kernel configuration, the kernel will emit the contents of all dev_dbg()
    statements present in the USB subsystem.


    You can glean device and bus specific information from the USB filesystem ( *usbfs*)
    node */proc/bus/*


    *usb/devices*. usbfs also lets you implement USB device drivers in user space.
    Even when the final destination of your USB driver is inside the kernel, starting
    with a user space driver can ease debugging and testing.


    The linux-usb-devel mailing list is the forum to discuss questions related to
    USB device drivers.


    V[isit https://lists.sourceforge.net/lists/listinfo/linux-usb-devel for subscription
