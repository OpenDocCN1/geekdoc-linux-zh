    # 第 8 部分：Linux 测试项目


    控制控制特性，如协议参数、并发会话数和数据块大小。基准测试通过比较产生的吞吐量与网络技术实现的最大实际带宽来实现。例如，一个 155 Mbps 的 ATM
    适配器产生的最大 IP 吞吐量为 135 Mbps，这考虑了 ATM 单元头大小、`ATM 适配层 (AAL)` 带来的开销，以及物理 `同步光纤网络 (SONET)`
    层偶尔发送的维护单元。


    ## Linux 测试项目


    `Linux Test Project (LTP)` 托管于 http://ltp.sourceforge.net/，是一组包含约 3000 个测试套件，旨在测试内核的不同部分。大多数测试在无需用户干预的情况下运行。其他测试（如网络和存储媒体测试）需要一些手动配置。


    从 LTP 主页下载源码 tar 包，运行 `make`，并在源码树根目录下调用封装脚本 `runltp` 开始测试。要将结果捕到 `results/` 目录下的
    `logfile` 中，请执行以下操作：


    ```bash

    runltp –p –l logfile

    ```


    LTP 生成的一些错误是“预期之中”的。LTP 网站记录了针对各种内核版本的预期错误列表。网站上还包含对几个内核版本的 LTP 代码覆盖率（总体覆盖率、路径行数和命中的不同行）的有趣分析，这些分析分布在内核树的不同目录中。


    # 第 11 部分：内核破解配置选项


    ## 用户模式 Linux


    `User Mode Linux (UML)` 托管于 http://user-mode-linux.sourceforge.net/，让你你可以在不会导致机器崩溃（oops）的情况下调试内核。为了实现这一点，内核实例（称为
    `guest` 内核）作为用户模式进程运行在运行中的内核（称为 `host` 内核）之上。


    UML 的用户群非常广泛。它可以作为测试内核和应用程序代码的环境、实验不稳定内核的载体、用于托管 Web 服务器等服务的安全伪计算机，或学习 Linux 内部机制的工具。对于调试内核中与硬件无关的部分，UML
    比调试设备驱动程序更有用。


    ## 诊断工具


    `sysfsutils` 包帮助你浏览 sysfs 内部的海量数据。该工具以及其他 Linux 诊断工具（如 `sysdiag` 和 `lsvpd`）可以从
    http://linux-diag.sourceforge.net/ 下载。


    ## 内核破解配置选项


    在内核配置菜单的 `Kernel hacking` 下存在几个可以产生有价值的调试信息的选项。如果你启用某个选项，在构建内核时会编译相应的调试代码。以下是几个例子：


    1. `在 printks 上显示时间信息` (`CONFIG_PRINTK_TIME`) 为 `printk()` 输出添加计时测量，以便你可以使用 `printks`
    作为测量执行时间并识别缓慢代码区域的检查点。

    2. 使用释放的内存会导致内存中毒。`调试 slab 内存分配` (`CONFIG_DEBUG_SLAB`) 帮助你检测此类问题。

    3. `自旋锁和读写锁调试：基本检查` (`CONFIG_DEBUG_SPINLOCK`) 发现锁相关的问题，如使用未初始化的自旋锁，并帮助捕非 SMP 安全的代码。

    4. 你在学习使用 kdump 时可能已经接触过 `Magic SysRq 键` (`CONFIG_MAGIC_SYSRQ`)。如果你开启了它，即使内核在调试期间崩溃，你仍然有一些途径可循。例如，按下
    Alt-Sysrq-t 会产生当前任务的导出，而 Alt-Sysrq-p 会打印处理器寄存器的内容。

    5. `检测软锁` (`CONFIG_DETECT_SOFTLOCKUP`) 利用看门狗服务检测内核代码中持续超过 10 秒的紧循环。我们在使用 kdump
    分析内核挂起时考虑过这一点。请注意，无法通过这种方法找到硬件锁。对于这种情况，如果你的平台支持，请使用不可屏蔽中断（NMI）看门狗的服务。

    6. 如果在配置内核时启用了 `CONFIG_DEBUG_SLAB`、`CONFIG_DEBUG_HIMEM` 或 `CONFIG_DEBUG_PAGE_ALLOC`，将编译额外的错误检查代码帮助调试与内存管理相关的问题。

    7. `检查栈溢出` (`CONFIG_DEBUG_STACKOVERFLOW`) 在可用栈空间低于阈值时添加代码以发出警告。`栈空间使用率测量` (`CONFIG_DEBUG_STACK_USAGE`)
    在魔术 Sysrq 键输出中添加栈空间测量。另一个相关的选项 `CONFIG_4KSTACKS` 允许你将内核栈大小设置为 4 KB 而不是 8 KB。

    8. `详细 BUG() 报告` (`CONFIG_DEBUG_BUGVERBOSE`) 当任何内核代码调用 `BUG()` 时产生额外的调试信息，假设你在内核配置期间开启了
    `-CONFIG_BUG`。


    一些调试选项也存在于 `Kernel hacking` 子菜单之外。例如，我们我们启用了 `CONFIG_KALLSYMS` 来使用 `gdb` 调试“oops”消息并对内核模块进行
    `kprobe` 操作。该选项位于配置菜单中的 `General setup` → `Configure Standard Kernel Features
    (for small systems)` 下。


    内核破解选项会产生开销并增加内存占用，因此不要在生产级内核中开启它们。


