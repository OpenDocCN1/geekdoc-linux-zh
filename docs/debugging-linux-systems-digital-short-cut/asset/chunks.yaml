  trans: "\n\n如果你使用 `irq` 命令，可以确定崩溃发生期间正在进行的中断的标识。在这种情况下，输出证实了 RTC 中断确实处于激活状态：\n\n\
    ```\ncrash> irq\n\nIRQ: 8\n\nSTATUS: 1 (IRQ_INPROGRESS)\n\n...\n\nptg5994185\n\
    \n...\n\nhandler: f8a8c000 <rtc_interrupt>\n\nflags: 20000000 (SA_INTERRUPT)\n\
    \nmask: 0\n\nname: f8a8c29d “rtc”\n\ncrash> quit\n```\n\nbash>\n\n现在让我们转换思路，看看内核冻结而不是生成“oops”的案例。\n\
    \n考虑以下有错误的驱动 `init()` 例程：\n\n```c\nstatic int __init myrv_init(void)\n{\n    spin_lock(&mydrv_wq.lock);\
    \ /* 在初始化之前使用！ */\n    spin_lock_init(&mydrv_wq.lock);\n    /* ... */\n}\n```\n\
    \n该代码在初始化自旋锁之前错误地使用了它。从效果上说，CPU 会无限旋转尝试获取锁，内核似乎挂起了。让我们使用 `kdump` 来调试这个问题。\n\n\
    在这种情况下，不会自动触发，因为没有发生恐慌（panic），所以通过按下魔术 Sysrq 键组合 Alt-Sysrq-c 来强制执行崩溃转储。你可能需要通过向\
    \ `/proc/sys/kernel/sysrq` 写入 1 来启用 Sysrq：\n\n```bashbash> echo 1 > /proc/sys/kernel/sysrq\n\
    bash> insmod mydrv.ko\n```\n\n这会导致内核在 `mydrv_init()` 挂起。按下 Alt-Sysrq-c 键组合触发崩溃转储：\n\
    \n**Alt-Sysrq-c**\n\n... → 宣布已触发崩溃转储的消息\n\n在 `kexec` 启动捕获内核后将转储保存到磁盘，启动回原始内核，并在保存的转储上运行\
    \ `crash`：\n\n``` evenbash> crash vmlinux vmcore.dump\n```\n\n...\n\nPANIC: “SysRq\
    \ : Trigger a crashdump”\n\n```\nPID: 2115\nCOMMAND: “insmod”\nTASK: f7c57000\
    \ [THREAD_INFO: f6170000]\nCPU: 0\nSTATE: TASK_RUNNING (SYSRQ)\ncrash>\n```\n\n\
    通过检查崩溃时运行的进程标识来测试水深。\n\n在这种情况下，显然是 `insmod`（来自 `mydrv.ko`）：`crash> ps`\n\n```\n\
    2171 2137 0 f6bb7000 IN 0.5 11728 5352 emacs-x\n2214 1 0 f6b5b000 IN 0.1 2732\
    \ 1192 login\n2230 2214 0 f6bb0550 IN 0.1 4580 1528 bash\n> 2261 2230 0 c596f550\
    \ RU 0.0 1572 370 insmod\n```\n\n堆栈回溯没有提供太多信息，除了告诉你是 Sysrq 键的按下导致了转储之外：\n\n```\n\
    crash> bt\nPID: 2115 TASK: f7c57000 CPU: 0 COMMAND: “insmod”\n#0 [c0431e68] crash_kexec\
    \ at c013a8e7\n#1 [c0431eb4] __handle_sysrq at c0254664\n#2 [c0431edc] handle_sysrq\
    \ at c0254713\n```\n\n接下来让我们尝试查看由崩溃内核生成的日志消息。`log` 命令从转储文件中的内核 `printk` 环形缓冲区读取消息：`crash>\
    \ log`\n\n```\nBUG: soft lockup detected on CPU#0!\nPid: 2261, comm: insmod\n\
    EIP: 0060:[<c010ec1b>] CPU: 0\nEIP is at delay_pmtmr+0xb/0x20\nEFLAGS: 00000246\
    \ Tainted: P (2.6.16.16 #11)\nEAX: 5caaa48c EBX: 00000001 ECX: 5caaa459 EDX: 00000012\n\
    ESI: 02e169c9 EDI: 00000000 EBP: 00000001 DS: 007b ES: 007b\nCR0: 8005003b CR2:\
    \ 08062017 CR3: 35e89000 CR4: 000006d0\n[<c01fede9>] __delay+0x9/0x10\n[<c0200089>]\
    \ _raw_spin_lock+0xa9/0x150\n[<f893d00d>] mydrv_init+0xd/0xb2 [wqdrv]\n[<c0136565>]\
    \ sys_init_module+0x175/0x17a2\n[<c015d834>] do_sync_read+0xc4/0x100\n[<c013ce4d>]\
    \ audit_syscall_entry+0x13d/0x170\n[<c0105578>] do_syscall_trace+0x20/0x21a\n\
    [<c0102f05>] syscall_call+0x7/0xb\nSysRq : Trigger a crashdump\ncrash>\n```\n\n\
    日志提供了两个有用的调试信息。首先，它让你知道崩溃内核检测到了软锁（soft lockup）。内核检测软锁的方式如下：内核看门狗线程每秒运行一次并碰每个 CPU\
    \ 时间戳变量。如果 CPU 处于紧密循环中，看门狗线程无法更新此时间戳。在定时器中断期间，使用 `softlockup_tick()`（定义在 `kernel/softlockup.c`\
    \ 中）进行更新检查。如果看门狗时间戳超过 10 秒，它认为发生了软锁并发出相应的内核消息。\n\n其次，日志对 `mydrv_init()+0xd`（或\
    \ `0xf893d00`）感兴趣，因此让我们查看周围代码的汇编：\n\n```\ncrash> dis f893d00 5\ndis: WARNING:\
    \ f893d00: no associated symbol found\n0xf893d00: mov $0xf9f1208,%eax\n0xf893d05:\
    \ sub $0x8,%esp\n0xf893d08: call 0xc32300 <spin_lock>\n0xf893d0d: movl $xffffffff,0xf9f214\n\
    0xf893d17: movl $xffffffff\n```\n\n你可以使用 `crash` 查看感兴趣的数据结构，但注意崩溃期间被交换出的内存区域不是转储的一部分。在之前的示例中，你可以如下方式查看\
    \ `mydrv_wq`：\n\n```\ncrash> rd mydrv_wq 100\nf892c200: 00000000 00000000 00000000\
    \ 00000000\n...\nf892c230: 2e636373 00000068 00000000 00000011\n```\n\n`gdb` 集成了\
    \ `crash` 中，因此你可以从 `crash` 将命令传递给 `gdb` 进行评估。例如，你可以使用 gdb 的 `p` 命令打印数据结构。\n\n\
    ### 查看源码\n\n`kexec` 的体系部分位于 `arch/your-arch/kernel/machine_kexec.c` 和 `arch/your-arch/kernel/relocate_kernel.S`。通用部分位于\
    \ `kernel/kexec.c`（以及 `include/linux/kexec.h`）。查看 `arch/your-arch/kernel/crash.c`\
    \ 和 `arch/your-arch/kernel/crash_dump.c` 以了解 kdump 的实现。`Documentation/kdump/kdump.txt`\
    \ 包含了安装信息。\n\n"
- fmt: "\nby Sreekrishnan Venkateswaran\n\nThis publication is protected by cop[yright.\
    \ Please see page 2 for more details.](#index_split_000.html_2)\n\nFrom the Library\
    \ of Ross Hagglund\n\nDownload at WoweBook.Com\n\n# SECTION #4 Profiling\n\nnumber\
    \ of cache misses. On systems where the processor does not support performance\
    \ counters, `OProfile` obtains limited information by collecting data during timer\
    \ events.\n\nOProfile consists of the following:\n\n- A kernel layer that collects\
    \ profiling information. To enable `OProfile` in your kernel, enable `CONFIG_PROFILING`,\
    \ `CONFIG_OPROFILE`, and `CONFIG_APIC` and recompile.\n- The `oprofiled` daemon.\n\
    - A suite of post-profiling tools such as `opcontrol`, `opreport`, and `op_help`\
    \ that help in detailed analysis of the collected data. These tools are included\
    \ with several distributions; if your distribution doesn’t have them, however,\
    \ you can download precompiled binaries.\n\nTo illustrate the basics of kernel\
    \ profiling, let’s simulate a bottleneck in the filesystem layer and use `OProfile`\
    \ to detect it. Our code area of interest is the portion of the filesystem layer\
    \ that reads directories (function `vfs_readdir()` in `fs/readdir.c`)\n\nFirst,\
    \ use `opcontrol` to configure `OProfile`:\n\n```bash\nopcontrol --setup --vmlinux=/path/to/kernelsources/vmlinux\
    \ --event=GLOBAL_POWER_EVENTS:100000:1:1:1\n```\n\nThe event specifier asks `OProfile`\
    \ to collect samples during `GLOBAL_POWER_EVENTS` (time during which the processor\
    \ is not stopped). The numerals adjacent to the event specifier denote the sampling\
    \ count in clock cycles, unit mask filter, kernel-space counting, and user-space\
    \ counting, respectively. If you want to sample `x` times every second and your\
    \ processor is running at a frequency of `cpu_speed HZ`, your sample count should\
    \ approximately be `(cpu_speed/x)`. A larger count generates a finer profile but\
    \ also results in more CPU overhead. If you still use a 2.4 kernel, you need to\
    \ patch your kernel sources with `OProfile` support.\n\nThe events supported by\
    \ `OProfile` depend on your processor:\n\n```bash\nopcontrol -l\n```\n→ List available\
    \ events on a Pentium 4 CPU\n\n`GLOBAL_POWER_EVENTS`: (counter: 0, 4)\ntime during\
    \ which processor is not stopped (min count: 3000)\n\n`BRANCH_RETIRED`: (counter:\
    \ 3, 7)\nretired branches (min count: 3000)\n\n`MISPRED_BRANCH_RETIRED`: (counter:\
    \ 3, 7)\nretired mispredicted branches (min count: 3000)\n\n`BSQ_CACHE_REFERENCE`:\
    \ (counter: 0, 4)\n...\n\nNext, start `OProfile` and run a benchmarking tool that\
    \ stresses those parts of the kernel you would like to profile. Look at http://lbs.sourceforge.net/\
    \ for a list of benchmarking projects on Linux. For this example, let’s exercise\
    \ the `Virtual File System (VFS)` layer by recursively listing all files in the\
    \ system:\n\n```bash\nopcontrol -start\n```\n→ Start data collection\n\n```bash\n\
    ls -lR /**\n```\n→ Stress test\n\n```bash\nopcontrol -dump\n```\n→ Save profiled\
    \ data\n\nUse `opreport` to look at the profiling results. The `%` column provides\
    \ a measure of the function’s load on the system:\n\n```bash\nopreport -l /path/to/kernelsources/vmlinux\n\
    ```\n\nCPU: P4 / Xeon, speed 2992.9 MHz (estimated)\nCounted `GLOBAL_POWER_EVENTS`\
    \ events (time during which processor is not stopped) with a unit mask of 0x01\
    \ (count cycles when processor is active) count 100000\n\nsamples % symbol name\n\
    914506 24.2423 vgacon_scroll → *ls* output printed to console\n406619 10.7789\
    \ do_con_write\n273023 7.2375 vgacon_cursor\n206611 5.4770 __d_lookup\n...\n1380\
    \ 0.0366 vfs_readdir → Our routine of interest\n...\n1 2.7e-05 vma_prio_tree_next\n\
    \nLet’s now simulate a bottleneck in the VFS code by introducing a 1-millisecond\
    \ delay in `vfs_readdir()`. This is done in Listing 1.6.\n\n### LISTING 1.6\n\
    vfs_readdir() Defined in fs/read_dir.c\n```c\nint vfs_readdir(struct file *file,\
    \ filldir_t filler, void *buf)\n{\n    struct inode *inode = file->f_dentry->d_inode;\n\
    \    int res = -ENOTDIR;\n\n    /* Introduce a millisecond bottleneck */\n   \
    \ /* (HZ is set to 1000 on this system) */\n    unsigned long timeout = jiffies+1;\n\
    \    while (time_before(jiffies, timeout));\n    /* End of bottleneck */\n   \
    \ /* ... */\n}\n```\n\nCompile the kernel with this change and recollect the profile.\
    \ The new data looks like this:\n```bash\nopreport -l /path/to/kernelsources/vmlinux\n\
    ```\n\nCPU: P4 / Xeon, speed 2993.08 MHz (estimated)\nCounted `GLOBAL_POWER_EVENTS`\
    \ events (time during which processor is not stopped) with a unit mask of 0x01\
    \ (count cycles when processor is active) count 100000\n\nsamples % symbol name\n\
    6178015 57.1640 vfs_readdir → Our routine of interest\n1065197 9.8561 vgacon_scroll\
    \ → *ls* output printed to console\n479801 4.4395 do_con_write\n...\n\nAs you\
    \ can see, the bottleneck is clearly reflected in the profiled data. `vfs_readdir()`\
    \ has now jumped to the top of the list!\n\nYou can use `OProfile` to obtain a\
    \ lot more information. You can, for example, gather the percent-age of data cache\
    \ line misses. Caches are fast memory close to the processor. Fetches to cache\
    \ are done in units of the processor cache line (32 bytes for Pentium 4). If the\
    \ data you need to access is not already present in the cache (a cache miss),\
    \ the processor has to fetch it from main memory, and this burns more CPU cycles.\
    \ Subsequent accesses to that memory (and the surrounding bytes touched into the\
    \ cache) will be faster until the corresponding cache line gets invalidated. You\
    \ can configure `OProfile` to count the number of cache misses by profiling your\
    \ kernel code for the `BSQ_CACHE_REFERENCE` event (for Pentium 4). You can then\
    \ tune your code, possibly by realigning fields in data structures, to achieve\
    \ better cache utilization:\n\n```bash\nopcontrol --setup --event=BSQ_CACHE_REFERENCE:50000:0x100:1:1\
    \ --vmlinux=/path/to/kernelsources/vmlinux\n```\n→ Unit mask 0x100 denotes an\
    \ L2 cache miss\n"
