  trans: "\n\n# 第 5 节跟踪 (Tracing)\n\n如果你在不同的内核版本上运行 `OProfile` 并查看相应的日志，你可能会发现内核不同部分发生变化的原因。你仅仅触及了\
    \ `OProfile` 所能实现功能的冰角。有关更多信息，请访问 [`oprofile.sourceforge.net/`](http://oprofile.sourceforge.net/)。\n\
    \n## 使用 Gprof 进行应用分析\n\n如果你只需要独立地对应用程序进程进行分析，而不需要分析代表其执行的内核代码，请使用 `gprof` 而不是\
    \ OProfile。`gprof` 依赖于编译器生成的额外代码来对 C、Pascal 或 Fortran 程序进行分析。让我们使用 `gprof` 来分析以下代码段：\n\
    \n```c\nmain(int argc, char *argv[]){\n    int i;\n    for (i=0; i<10; i++) {\n\
    \        if (!do_task()) { /* Perform task */\n            do_error_handling();\
    \ /* Handle errors */\n        }\n    }\n}\n```\n\n使用 `-pg` 选项要求编译器包含额外的代码，以便在程序运行时生成调用图分析（call\
    \ graph profile）。`-g` 选项生成符号信息。\n\n### 运行并查看分析结果\n\n```bash\ngcc -pg -g -o myprog\
    \ myprog.c\n```\n```bash\n./myprog\n```\n\n这将产生 `gmon.out`，它是 `myprog` 的调用图。运行\
    \ `gprof` 来查看分析结果：\n\n```bash\ngprof -p -b myprog\n```\n\n### 平铺分析 (Flat profile):\n\
    \n每个样本计数为 0.01 秒。\n\n| % | cumulative | self | total calls | s/call | name |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- |\n| 65.17 | 2.75 | 2.75 | 2 | 1.38\
    \ | do_error_handling |\n| 34.83 | 4.22 | 10 | do_task |\n\n这显示执行过程中触发两次错误路径。你可以调整代码以减少对错误路径的遍历，并重新运行\
    \ `gprof` 生成更新的分析结果。\n\n## 跟踪 (Tracing)\n\n跟踪可以深入了解在不同代码模块交互期间显现的行为问题。获取执行跟踪的一种常用方法是使用\
    \ `printk`。虽然 `printk` 可能是内核调试中使用频率最高的方法（2.6.23 源码树中超过 62,000 多个 `printk()` 语句），但它对于高量跟踪来说还不够精确。Linux\
    \ Trace Toolkit (LTT) 是一个强大的工具，允许你以最小的开销获取复杂的系统级跟踪。\n\n### Linux Trace Toolkit\n\
    \nLTT 提取对事后分析有用的执行跟踪，在无法使用调试器的情况下具有重要价值。与 OProfile 通过定期间隔采样事件来收集数据不同，LTT 在事件发生时提供精确的事件跟踪。\n\
    \nLTT 由四个部分组成：\n\n1. 核心模块，为内核的其他部分提供跟踪服务。收集到的跟踪被复制到内核缓冲区。\n2. 使用跟踪服务的代码。这些代码被插入在你想要捕捉跟踪转储的地方。\n\
    3. 跟踪守护进程（trace daemon），从内核缓冲区提取跟踪信息到文件系统中的持久位置。\n4. 诸如 `tracereader` 和 `tracevisualizer`\
    \ 等工具，它们用于解释原始跟踪数据并转换为人类可读的格式。如果你正在为没有 GUI 支持的嵌入式设备开发代码，可以在另一台机器上透明地运行这些工具。\n\n\
    LTT 不是主线内核的一部分。你可以从 [www.opersys.com/LTT](http://www.opersys.com/LTT) 下载 LTT 内核补丁、跟踪守护进程和用户空间跟踪工具。\n\
    \n让我们通过一个简单的例子来看看 LTT 提供的功能。假设当应用程序从设备读取数据时发现数据损坏。为了确定是否 LTT 引入了损坏，首先在驱动程序中添加跟踪钩子。这在\
    \ 2.6.11 候选版本中完成。\n\n```c\n#include <linux/trace.h>\n\n/* 创建事件 */\nstruct mydriver_data\
    \ {\n    int i;\n};\n\nstatic struct mydriver_data driver_data;\n\n/* 跟踪事件 */\n\
    static __init void driver_trace_init(void) {\n    /* ... */\n}\n\n/* 驱动程序初始化 */\n\
    static __init void driver_trace_init(void) {\n    /* ... */\n}\n\n/* 驱动程序读取方法\
    \ */\nssize_t mydriver_read(struct file *file, char *buf, size_t count, loff_t\
    \ *ppos) {\n    char *buffer;\n    /* 从设备读取 numbytes 数据到 buffer */\n    /* ...\
    \ */\n    /* 如果你看到包长度大于某个值，使用其作为过滤器 */\n    if (count > value) {\n        /* 转储数据包\
    \ */\n        trace_raw_event(data_packet, numbytes, buffer);\n    }\n    return\
    \ 0;\n}\n\n/* 转储数据结构 */\nif (some_other_condition) {\n    /* driver_data 的定义请参阅列表\
    \ 1.7 */\n    trace_raw_event(driver_data, sizeof(driver_data), &driver_data);\n\
    }\n```\n\n"
