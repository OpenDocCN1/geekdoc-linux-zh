    \ C Bi:1:002:1 0 65536 = 118498fe 15c60500ptg5994185\n01680106 5e846801 608498fe\
    \ 6f280087 68000000 00884800\nee6a5d40 3718801001 C Bi:1:002:1 0 36864 = 13608498\
    \ fe4f4a01\n00514a01 006f2800 87680000 00008848 00000100 b7f00100\n... own```\n\
    \nEach output line starts with the URB address, followed by an event timestamp.\
    \ An `S` in the next column indicates URB submission, whereas a `C` announces\
    \ a callback. The following field has the format `URBType:Bus#:DeviceAddress:Endpoint#`.\
    \ In the preceding output, a `URBType` of `Bi` stands for a bulk URB in the IN\
    \ direction. After this, `usbmon` dumps the URB status, data length, a data tag\
    \ (`= ` or `< ` in the preceding output), and the data words (if the tag is `=`).\
    \ The last three lines in the preceding output are callbacks associated with bulk\
    \ URBs submitted in earlier lines. You can match the callbacks with the related\
    \ submissions using the URB addresses. `Documentation/usb/usbmon.txt` details\
    \ `usbmon` syntax and contains example code to parse the output into human readable\
    \ form.\n\n74\n Debugging Linux Systems (Digital Shortcut)\n© 2010 Pearson Education.\
