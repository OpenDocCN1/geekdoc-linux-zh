    ###### Board Rework


    Navigating board schematics and datasheets is an important skill while bringing
    up the bootloader or kernel on embedded hardware. Understanding your board’s *plot*,
    which is a file that shows the position of chips on your board, is a big help
    when you debug a potential hardware problem using an oscilloscope, or when you
    need to perform minor board rework. *Printed Circuit Boards* (*PCBs*) are usually
    clothed with *silk screens* that print the reference designator near each chip.


    Consider this fictitious scenario in which USB enumeration doesn’t occur on your
    board under test. The USB hub detects detects insertions but cannot assign endpoint
    addresses. A close look at the schematics reveals that the connections originating
    from the SPEED and MODE pins of the transceiver have been interchanged by mistake.
    An examination of the placement plot identifies the location of the transceiver
    on the PCB. Matching the transceiver’s reference designator on the PCB with the
    silk screen on the PCB pinpoints the places where you have to solder “yellow wires”
    to repair the faulty connections.


    A multimeter and an oscilloscope are worthy additions to your embedded toolkit.
    As an illustration, let’s consider an example situation involving the I2C RTC
    shown in Figure 1.5.


    Consider this scenario: You have written an I2C client driver for this chip. However,
    when you run your driver on the board, it renders the system unbootable. Neither
    does the bootloader come up when you reset the board, nor does your JTAG debugger
    connect to the target. To understand possible causes of this seemingly fatal error,
    let’s take a closer look at the connection diagram. Because both the RTC and the
    CPU need an external clock, the board supplies it using a single 32 KHz crystal.
