    beginning Linux driver writer

    - Covers essential information on kernel concepts, driver concepts, wireless Linux
    concepts, and embedded Linux concepts—information never before available in one
    book.

    - Includes several types of drivers not covered elsewhere such as WiFi, USB Serial
    Drivers, Sound drivers and such

    - Describes the driver development lifecycle, including detailed debugging techniques


    This book is explicitly targeted at the beginner-to-intermediate-level reader.
    Unlike Linux Device Drivers, Third Edition (ORA), it carefully introduces each
    new technology prior to embarking on a description of its respective kernel implementation.
    It presents only essential information by cutting-down/eliminating sections that
    are usually of interest only to advanced readers or sophisticated driver writers
    (for example an in-depth look into page tables and VM). And it does not dwell
    on details that

