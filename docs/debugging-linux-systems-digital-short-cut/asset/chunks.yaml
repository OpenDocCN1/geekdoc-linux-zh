    RTC 控制寄存器包含用于选择 `CLK_OUT` 频率位。在探测芯片时，驱动程序错误地初始化了这些位，导致在 `CLK_OUT` 上产生 `1 KHz`
    的信号。由于电池备份，`RTC` 寄存器是非易性的，因此控制寄存器在重启后仍保持此错误值。导致的时钟偏移足以使系统无法启动。断开 `RTC` 的备份电池，清空寄存器，重新连接电池，使用示波器验证
    `CLK_OUT` 已恢复为 `32 KHz` 时钟，修复你的驱动代码并重新开始！


