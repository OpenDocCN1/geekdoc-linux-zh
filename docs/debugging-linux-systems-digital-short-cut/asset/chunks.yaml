    ###### Video


    Some embedded systems are headless, but many have associated displays. A suitably
    oriented (landscape or portrait) LCD panel is connected to the video controller
    that’s part of the embedded SoC.


    The kernel’s frame buffer interface insulates applications from display hardware,
    so porting a compliant GUI to your device is easy if your display driver conforms
    to the kernel’s *frame buffer* abstraction. The frame buffer core layer and low-level
    frame buffer drivers reside in the `ptg5994185drivers/video/` directory.


    The virtual frame buffer driver, enabled by setting `CONFIG_FB_VIRTUAL` in the
    configuration menu, operates over a pseudo graphics adapter. You can use this
    driver’s assistance to debug the frame buffer subsystem.


    Some frame buffer drivers, such as *intelfb*, offer an additional configuration
    option that you can enable to generate driver-specific debug information.


    To discuss issues related to frame buffer drivers, subscribe to the `linux-fbdev-devel`
    mailing list,


    https://lists.sourceforge.net/lists/listinfo/linux-fbdev-devel/


