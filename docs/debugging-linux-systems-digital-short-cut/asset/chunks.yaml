    \ board.\n- Download your bootloader, kernel, or stand-alone code from the host\
    \ over TFTP, to flash memory, or RAM on the target. File formats such as `ELF`\
    \ and `binary` are usually supported by JTAG debuggers.\n- Single-step code, set\
    \ breakpoints, examine registers, and dump memory regions.\n- Reset the target.\n\
    \nJTAG debugging can be flaky at times, so if you are debugging remotely, it might\
    \ be a good idea to power the target via a remote power control switch, as shown\
    \ in Figure 1.2. That way, you can hard-reset the target from the host using a\
    \ web browser, as shown in Terminal 4. You can also choose to power the JTAG hardware\
    \ via a remote power switch. That enables you to test run a bootloader directly\
    \ from flash without the intervention of JTAG and its definition files.\n\nIf\
    \ the target board possesses a network interface, it can mount its root filesystem\
    \ over `NFS` from the development host. Terminal 5 on the host operates locally\
    \ on the exported root filesystem. You might have more such terminals depending\
    \ on your debug scenario. If you use an oscilloscope that has remote display capabilities,\
    \ for example, you can operate it via a web browser on another terminal.\n\nIf\
    \ your team is scattered geographically, run Terminals 1 through 5 within an environment\
    \ such as Virtual Network Computing (VNC). If VNC is not already part of your\
    \ distribution, download it from `www.realvnc.com`. With such a setup, you can\
    \ debug the electrons on your remote board from the comfort of your home! Some\
    \ JTAG vendors provide a sophisticated integrated development environment that\
    \ encompasses all the functionalities previously detailed, so you don’t need to\
    \ manage VNC terminal sessions if you’re using one of those.\n\nDuring hardware\
    \ bring up, when you are porting your bootloader or other stand-alone code to\
    \ the target, it’s a good idea to first generate an `ELF` image and debug it from\
    \ RAM before running it from flash. Remember, however, to eliminate bootloader\
    \ initializations that duplicate the ones performed by the JTAG definition script.\n\
    \nA key advantage of JTAG debuggers is that you can use a single tool to debug\
    \ the different pieces that constitute your firmware solution. So, you can use\
    \ the same debugger to debug the BIOS, bootloader, base kernel, device driver\
    \ modules, and user-space applications, at source level.\n\n### Downloads\n\n\
    - You can download `kdb` patches for the `x86` and `IA64` architectures from `http://oss.sgi.com/projects/kdb`.\
    \ Each supported kernel version needs two patches: a common one and an architecture-dependent\
    \ one.\n- The home page for the `kgdb` project is `http://kgdb.sourceforge.net`.\
    \ The website also has documentation on configuring and using `kgdb`.\n\n# SECTION\
    \ #2: Kernel Probes\n\nIf your Linux distribution does not already contain `gdb`,\
    \ you can obtain it from `www.gnu.org/software/gdb/gdb/gdb.html`.\n\n## Kernel\
    \ Probes\n\nKernel probes can intrude into a kernel function and extract debug\
    \ information or apply a medicated patch. It’s a useful addition to your debugging\
    \ repertoire for investigating inexplicable behavior at a customer site, especially\
    \ when you don’t have the luxury of rebooting the system.\n\nLinux supports a\
    \ generic form of kernel probes called `Kprobes` and two specialized variants,\
    \ `Jprobes` and `return probes`.\n\n### Kprobes\n\nKprobes can save you the trouble\
    \ of building and booting a debug kernel by providing capabilities to dynamically\
    \ dump kernel structures or insert code into a running kernel. You can, for example,\
    \ add a few `printk` on-the-fly inside the scheduler without recompiling the kernel.\
    \ You can even patch a bug on a Mars rover without rebooting it.\n\nTo insert\
    \ a kprobe inside a kernel function, follow these steps:\n1. Turn on `CONFIG_KPROBES`\
    \ (*Instrumentation Support* → *Kprobes*) in the kernel configuration menu.\n\
    2. Implement a kernel module that registers a kprobe at the instruction of interest.\
    \ You need to register a `pre-handler` that Kprobes will run just before executing\
    \ the probed instruction and a `post-handler` that Kprobes will run after executing\
    \ the probed instruction. You can also supply a `fault-handler` that will run\
    \ if a fault is detected while executing the pre- or post-handlers (because you\
    \ don’t want to “oops” due to a debugging bug!).\n"
