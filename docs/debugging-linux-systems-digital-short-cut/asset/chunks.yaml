    ### JTAG Debuggers


    JTAG debuggers use hardware-assist to debug code. You need specialized hardwareand
    a front-end interface (some JTAG debuggers use gdb as the front-end) to step through
    code. JTAG can also be used for purposes other than debugging, such as burning
    code onto onboard flash. JTAG connectors are common on development boards but
    are usually not part of production units.


    ptg5994185


    JTAG debuggers usually connect to target hardware via serial port, USB, or Ethernet.
    With Ethernet, you can remotely access the JTAG debugger, and therefore the target
    board, even if the board itself does not possess a network interface.


    Figure 1.2 shows a](#index_split_000.html_22AG-based remote debugging session
    in action. The JTAG debugger used in this scenario supports a gdb front end. The
    development host and the JTAG hardware are connected to an Ethernet LAN. The debug
    serial port on the target is connected to the serial port on the JTAG box.


    3 Some JTAG debuggers work with several architectures if you suitably replace
    the probe that connects the debugger to the target board.


