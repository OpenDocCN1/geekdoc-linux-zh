    # 第 2 部分：内核探测 (Kernel Probes)


    当[列表 1.5 调用`register_kretprobes()`]时，kprobe 在内部被插入到 `tty_open()` 的开头。当此探测被命中时，此内部
    kprobe 处理器会将函数返回地址替换为特殊例程的地址（在 Kprobes 术语中称为 `trampoline`）。查看 `arch/your-arch/kernel/kprobes.c`
    可了解 trampoline 的实现。


    当 `tty_open()` 通过其七条路径之一返回时，控制权返回到 trampoline 而不是调用函数。trampoline 调用 kretprobe
    处理器 `kret_tty_open()`，[该由列表 1.5 注册，如果 `tty_open()` 未成功返回，它将打印返回值]。


    ## 局限性


    Kprobes 有其局限性。其中一些是显而易见的。例如，如果你在内联函数内部插入 kprobe，将无法得到预期的结果。当然，你无法探测 Kprobes 自身的代码。


    Kprobes 更适用于在基础内核内部应用探测。如果目标代码是动态加载模块的一部分，你与其编写并编译一个新模块来“kprobe”它，不如重写并重新编译你的模块。然而，如果卸载该模块是不可接受的，你可能仍然想使用
    Kprobes。


    还存在一些不那么明显的局限性。优化是在编译时完成的，而 Kprobes 是在运行时插入的。因此，通过 Kprobes 插入指令的效果不等同于在原始源文件中添加代码。例如，这段有
    Bug 的代码段：


    ```c

    volatile int *integerp = 0xFF;

    int integerd = *integerp;

    ```


    被编译器简化为：


    ```assembly

    mov 0xff, %eax

    ```


    因此，如果你想在这两行 C 代码之间溜进去代码、分配一个字的内存、将 `integerp` 指向分配的内存并规避内核崩溃，你无法轻易使用 Kprobes。


    ## 注意事项

    SystemTap (http://sourceware.org/systemtap/) 是一种简化 Kprobes 使用的诊断工具。


    ## 查看源码


    Kprobes 的实现由定义在 `kernel/kprobes.c`（以及 `include/linux/kprobes.h`）的通用部分，以及位于 `arch/your-arch/kernel/kprobes.c`（以及
    `include/asm-your-arch/kprobes.h`）的体系相关部分组成。


    查看 `Documentation/kprobes.txt` 获取关于 Kprobes、Jprobes 和 Kretprobes 的更多信息。


    # 第 3 部分：Kexec 和 Kdump


    现在你已经学习了如何使用 Kprobes，让我们继续查看 Linux RAS 的更多方面。`Kexec` 和 `kdump` 是 2.6 内核中引入的可维护性功能。


    Kexec 使用了 UNIX `exec()` 系统调用的镜像覆盖哲学，在运行的内核之上启动一个新内核，而无需启动固件的开销。这可以节省几秒的重启时间，因为启动固件需要花费周期来遍历总线并识别设备。重启延迟越低，系统停机时间越短；因此，这是开发
    kexec 的主要动机之一。然而，kexec 最常用的用户是 kdump。在内核崩溃后捕获转储（dump）本质上是不可靠的，因为访问转储设备的内核代码可能处于不稳定状态。Kdump
    通过通过 kexec 到一个健康内核后收集转储来解决这个问题。


    ## Kexec


    在 kexec 内核之前，你需要进行一些准备工作：


    1. 编译并启动一个支持 kexec 的内核。为此，请在内核配置菜单中开启 `CONFIG_KEXEC`（`Processor Type and Features`
    → `Kexec System Call`）。此内核被称为第一个内核或运行中的内核。

    2. 准备要被 kexec 的内核。这个第二个内核可以与第一个内核相同。

    3. 下载 `kexec-tools` 包的源码 tar 包，并生成名为 `kexec` 的用户空间工具。


    在步骤 3 中构建的 `kexec` 工具分两个阶段调用。第一阶段将第二个内核镜像加载到运行内核的缓冲区中，而第二阶段实际上覆盖了运行中的内核：


    1. 使用 `kexec` 命令加载第二个（覆盖）内核：

    ```bash

    kexec -l /path/to/kernelsources/arch/x86/boot/bzImage -append="root=/dev/hdaX"
    --initrd=/boot/myinitrd.img

    ```

    `bzImage` 是第二个内核，`hdaX` 是根设备，`myinitrd.img` 是初始根文件系统。此阶段的内核实现大部分与体系无关。此阶段的核心是
    `sys_kexec()` 系统调用。`kexec` 命令通过该系统服务的服务将新内核镜像加载到运行内核的缓冲区中。

    2. 启动第二个内核：

    ```bash

    kexec -e

    ```

    ... → 内核启动消息


    Kexec 直接启动新内核，而不优雅地停止操作系统。要在重启之前关闭，请在 `halt` 脚本的底部（通常为 `/etc/rc.d/rc0.d/*S01halt`）调用
    `kexec` 并调用 `halt`。


    第二阶段的实现是体系相关的。此阶段的关键是一个 `reboot_code_buffer`，它包含了将新内核放置到位启动的汇编代码。


    Kexec 跳过了调用启动固件服务的初始内核代码，直接跳转到保护模式入口（对于 x86 处理器）。实现 kexec 的一个重要挑战是内核与启动固件（基于 x86
    系统的 BIOS、基于 POWER 的机器 Openfirmware 等）之间的交互。在 x86 系统上，BIOS 传递给内核的 `e820` 内存映射等信息也需要提供给
    kexec 内核。


    ## 带 Kdump 的 Kexec


    当 kexec 与 kdump 配合使用时，其语义有些特殊。在这种情况下，kexec 需要在遇到内核恐慌（panic）时自动启动新内核。


    如果运行的内核崩溃，将启动新内核（称为捕获内核）以可靠地收集转储。典型的调用语法如下：


    ```bash

    kexec -p /path/to/capture-kernel-sources/vmlinux --args-linux --append="root=/dev/hdaX
    irqpoll" --initrd=/boot/myinitrd.img

    ```


