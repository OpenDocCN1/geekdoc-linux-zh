  - 练习题
- - '####'
  - 3.7. 修改第 3.6.5 节中的 `ls` 命令，使其接受 `-t` 选项以按修改时间和名称排序。
- - '####'
  - 3.8. 修改第 3.6.5 节中的 `ls` 命令，使其接受额外的标准选项（由自选择）。
- - '####'
  - 3.9. 编写一个程序来复制整个目录和文件树。它应该有两个参数：树的根目录（例如 `/usr/marc/book`）和拷贝的根目录（例如 `/usr/marc/backup/book`）。不需要处理符号链接或硬链接（即创建多个副本是可以接受的），也不需要保留所有权、权限或时间。
- - '####'
  - 3.10. 与练习 3.9 相同，但尽可能在范围内保留所有权、权限和时间。使“可能的范围”取决于命令是否以超级用户（superuser）身份运行。
- - '####'
  - 3.11. 与练习 3.10 相同，但要保留符号链接和硬链接结构。
- - '####'
  - 3.12. 为什么没有 `lchmod` 系统调用？
- - '####'
  - 3.13. 将 `access` 写成一个函数。你可以使用除 `access` 外的任何系统调用。
- - '####'
  - 3.14. 使用 `lio_listio` 实现 `readv` 和 `writev`（第 2.15 节）。这样实现有什么优点？缺点呢？
- - '####'
  - 3.15. 你能对 `read`、`write`、`pread`、`pwrite`、`fsync`、`fdatasync`、`aio_read`、`aio_write`
    和 `aio_fsync` 执行上述操作吗？如果，请执行。有什么优缺点？
- - '####'
  - 3.16. 列出通过 `aio_suspend`、信号、线程启动或使用 `aio_error` 轮询检查 AIO 完成的优缺点。（需要第 5 章和第 9 章中的信息。）
