  mdcn: "\n\n## 1.5.1 DEFSTRUCT\n\nDEFSTRUCT 包装是一个结构定义工具，运行在 PDF10、Multics MacLisp\
    \ 以及 LispMachines 上。它具有 CADRS 的许多功能并且是可以扩展的。\n\n这两个包都为创建实例（instance）时所使用的底层 LISP\
    \ 结构提供了多种选择。CADRS 对列表结构的实现略为强大，因为它允许用户指定列表的精确格式（通过嵌入子列表，以及使用 `cons` 单元格的最后一个 `cdr`\
    \ 来存储值）。DEFSTRUCT 提供的选择是线性列表或平衡树。\n\n1984年7月3日\n\nDEFSTRUCT 方案的缺点是，字段（field，或者在\
    \ DEFSTRUCT 中称为槽位 slot）不能显式地声明为另一个结构的实例。这种差异在下面的示例所示。\n\n```common\n--CADRS 对\
    \ 'name' 和 'person' 的定义\n(structure name fields (last first . mi))\n(structure\
    \ person type array)\n  fields ((declare name is-name) age sex))\n\n(fetch a-person\
    \ name first)\n\n(create\n  (age . 24) (sex . 'Male)\n  ((name last) . 'Duncan)\
    \ ((name first) . 'Richard\n  ((name mi) . 'J))\n\n--DEFSTRUCT 对 'name' 和 'person'\
    \ 的定义\n(defstruct (name (type list*))\n  last first mi)\n(defstruct (person (type\
    \ array))\n  name age sex)\n\n(name (person a-person))\n\n(make-person age 24\
    \ sex 'Male name 'Duncan Richard . J)\n```\n\n访问 person 结构中不同字段/槽位（以及子字段/子槽位）的方法是相同的。问题在于，DEFSTRUCT\
    \ 无法得知 person 结构中的 `name` 槽位被定义为 `name` 结构。因此，该槽位必须初始化（使用列表），而不是初始化每个子槽位。如果 `name`\
    \ 结构的底层发生变化（例如变为 `array`），这将成为潜在的问题源。\n\n虽然两个包允许一个结构包含另一个的定义（CADRS 中的 `is-a` 结构属性和\
    \ DEFSTRUCT 中的 `include` 选项），但 DEFSTRUCT 版本灵活性小得多。`include` 选项只能用于具有特定底层类型的结构，并且只有槽位初始化表达式可以从其原始值更改。在\
    \ CADRS 中，任何结构或字段属性都可以被更改或修改，任何结构类型都可以被继承。\n\n1984年7月3日\n\nCADRS 提供的 **create**\
    \ 函数支持由 DESTRUCT¹ 定义的 `make-x` 和 **alter-x** 宏的组合功能。此外，**create** 还支持许多其他特性（为了与\
    \ INTERLISP Record Package 兼容所需的特性），例如：\n\n- **create** 可以被告知在创建实例时粉碎（类似 alter）、使用另一个结构的顶层结构，或复制另一个结构的顶层结构。\n\
    - **create** 保留了提供的任何字段初始化的求值顺序。为了说明这一点，考虑以下结构和 create 表达式：\n\n```common\n(structure\
    \ test-init fields (a b c d e f))\n(create test-init (e . 10) (f . 20) (d . 30)\
    \ (b . 40) (c . 50) (a . 60))\n```\n\n满足给定求值顺序的评估形式为：\n\n```common\n((lambda ($ss\
    \ $$f $$sd $$bb $$sc)\n(list a $$bb $$sc $$sd $$se $$ff))\n10 20 30 40 50)\n```\n\
    \n- 1. 其中 **x** 是当前定义的结构之一的。\n\n1984年7月3日\n\nCADRS 中的许多功能在 DEFSTRUCT 中无法直接使用，但理论上可以使用\
    \ DEFSTRUCT 的扩展能力来实现。这些特性列举如下：\n\n- 1. 当更改槽位值时，没有方法可以验证新的槽位值。\n- 2. 所有槽位名称必须是唯一的（即没有类型检查/typing）。\n\
    - 3. 结构创建或槽位访问没有过程化挂钩。\n- 4. 不支持虚拟字段（槽位）。\n\n## 1.5.2 INTERLISP Record Package\n\
    \n由于 CADRS 的设计基于 INTERLISP Record Package (ILRP)，这两者有许多共同点。每个包支持的底层结构类型有很大的交集¹。用于实例创建和结构访问的函数在大多数情况下是相同的。\n\
    \nILRP 可以指定局部于正在定义的结构²子结构——这种机制在 CADRS 当前版本中是不支持的。例如，可以这样定义一个消息：\n\n```common\n\
    (record msg ((from . to) mess) (record msg (header . body)))\n```\n\n这提供了一种访问整个\
    \ `mess` 字段或其组件之一的方法，而无需定义单独的 `mess` 记录（这在 CADRS 中是要求的）。此外，ILRP 允许一个字段拥有多个这样的定义。\n\
    \n- 1. 不集由无法在主机 LISP 中实现的类型组成。\n- 2. ILRP 结构被称为记录（records）。\n\n1984年7月3日\n\n这两个包都支持实例类型机制，尽管两者在实现方式上差异很大。ILRP\
    \ 使用谓词确定形式的类型，谓词检查对象是否为实例。考虑以下：\n\n```common\n(record foo (a b c d) e)\n```\n\n\
    为了确定 x 是否为的实例，基于网络使用：\n\n```common\n(and (listp x) (length x) (caddr x))\n```\n\
    \nCADRS 不具备包含另一个定义的能力。这在某种程度上可以通过使用自定义类型来实现²。\n\n- 1. INTERLISP Record Package\
    \ 是\n- is-a 在 CADRS 中\n\n1984年7月3日\n\nGLISP 对象消息功能的某些方面可以在 CADRS 中通过 **replace**\
    \ 函数结合 **to-replace** 字段属性来模拟。主要的局限性是消息只能有一个参数。运算符重载无法在重写必要的函数（以执行 GLISP 编译器的工作）。\n\
    \n## 1.5.3 GLISP\n\nGLISP 是一种基于 LISP 的强类型面向对象语言。该语言使用类似于英语的语法，并配备了启用基于对象的消息功能和路径确定能力的编译器。由于\
    \ CADRS 不是编程语言，而更像是一个工具，因此对比目的仅使用对象/结构定义。\n\n通常，CADRS 与 GLISP 对象/结构定义相比良好。一个主要区别是\
    \ GLISP 结构和对象的强类型程度（这用于编译器推理）。\n\n两者都具有构建结构类型层次的能力，并扩展结构类型的定义¹。每个都有复杂的挂钩机制，允许实现虚拟字段。\n\
    \n- 1. ACCESSFNS 记录要求所有的结构访问和创建代码由用户提供。\n2.\n\n## 1.6 CADRS 与表示方案\n\n本节将 CADRS\
    \ 与 FRL [5] 中体现的网络知识表示方案进行比较。这种比较的目的是既不是暗示 CADRS 在任何意义上都是知识表示工具，也不是提议将其此类使用。相反，目标是表征此类知识表示方案的描述能力，以洞察适用于数据结构描述的能力类型。为了方便读者进行比较，这里提供了关于网络方法的简短总结。\n\
    \n正如 Mylopoulos 在 [3] 中提到的，“对象（节点）和二元关联（标签边）来尝试描述一个世界，前者表示个体，后者表示被建模世界中的二元关系。”\n\
    \n"
