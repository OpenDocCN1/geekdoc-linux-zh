    3 July 1984


    # 7 - type and type?


    The type and type? funcions provide information about the type of a structure
    instance. While the more interesting applications of each of these is covered
    in the next chapter on Structural Inheritance, the functionality of each is covered
    here.


    # 7.1 type


    The syntax of type is:


    ```

    (type struc-inst)

    ```


    where:


    +   o struc-inst is an instance of some structure.

    The value returned by type is a list of one or more structures that struc-inst
    is an instance of. For example:


    ```

    (structure s1

    fields (a b c)

    typecheck t)


    (type create s1)) => (s1)


    (structure s2 is-a s1)


    (type create s2)) == (s2 s1)

    ```


    In order for type to be used, typechecking must be turned on for the structure.


    +   1. The different methods for doing this are covered in the chapter on Modes
    of Operation.'
  - "[PAGE 66]\n\n3 July 1984\n\nOtherwise, **type** will return the LISP type of\
    \ the argument$^1$.\n\n# 7.2 type?\n\nThe **type?** is a predicate funciton that\
    \ returns t if its first argument is an instance of one or more of the structures\
    \ in the second argument and nil otherwise.\n\nThe syntax for **type?** is:\n\n\
    ```\n(type? struc-inst struc-list)\n```\n\nwhere:\n\n+   - **struc-inst** is an\
    \ instance of some structure.\n- **struc-list** is one of:\n  - a previously defined\
    \ structure.\n  - a list of previously defined structures.\n\nIn order for **type?**\
    \ to work correctly, the one of the following must be true each member of **struc-list**\
    \ (or the single structure):\n\n+   1. Typchecking must be implicitly or explicitly\
    \ specified (using the **type?** structure attribute).\n2. A **type? form** must\
    \ have been specified. If neither of these conditions is met, the type? exception\
    \ handler will be called$^2$.\nIf a **type? form** is defined for the structure\
    \ this is used in place of the CADRS\n\n+   1. This is what type normally returns\
    \ in Franz Lisp.\n2. The type? exception handler is covered in the chapter on\
    \ Exception Handlers."
- md: "\n3 July 1984\n\ngenerated form.\n\n## 7.3 typing in general\n\nThe structure\
    \ typing performed by CADRS is straight forward. However, the mechanisms to alter\
    \ typing (the type?) structure attribute and function) provide a means to implement\
    \ a much more sophisticated notion of type.\n\nFor example, given the definition\
    \ of a person structure as:\n\n```\n(structure person\nfields ((declare name is-a\
    \ name)\nage\nsex))\n```\n\nWe could define a concept of women as:\n\n```\n(structure\
    \ women\ntype?\n(lambda (s)\n  (and (memq 'person (type s))\n    (eq (fetch s\
    \ sex) 'female))))\n```\n\nand find that:\n\n```\n(type? (create person (sex .\
    \ 'female)) (women))\n```\n\nwould in fact, return t.\n\nFurther, it is possible,\
    \ using CADRS, to define a global type handler to handle all requests to type?,\
    \ thus providing additional granularity to instance typing. This technique presented\
    \ in the chapter on Exception Handling.\n\n3 July 1984\n\n## 8 - Structural Inheritance\n\
    \nAs a preface to the following material, the manner of Structural Inheritance\
    \ presented here is not of the type found in the knowledge representations languages\
    \ (FRL, KRL, KL-ONE). This is probably obvious considering that CADRS attributes\
    \ are for the most part directive not descriptive and that the set of attributes\
    \ is fixed. On the positive side, Structural Inheritance, does go beyond the features\
    \ offered in other structure definition tools (INTERLISP Record Package, or MacLISP’s\
    \ DefStruct) in providing a means of extending and modifying structure definitions\
    \ to create new definitions which are semantically related to the parent. As an\
    \ example of the utility of such a feature, consider the following.\n\n3 July\
    \ 1984\n\nNote the following structures to deal with student and employee information:\n\
    \n```\n(structure student\n  fields ((declare name is-a name)\n    (declare address\
    \ is-a address)\n    ss-number\n    sex\n    age\n    school\n    major\n    courses\n\
    \    advisor\n    date-of-grad))\n```\n\n```\n(structure employee\n  fields ((declare\
    \ name is-a name)\n    (declare address is-a address)\n    ss-number\n    sex\n\
    \    age\n    manager\n    division\n    group\n    wage\n    hours\n    ytd-hours))\n\
    ```\n\n3 July 1984\n\nIt is apparent that there is a kernel of information which\
    \ is common to both. In a conceptual sense this is, of course, due to the fact\
    \ that both students and employees are people. To capture this relationship in\
    \ CADRS, one could define student and employee in terms of a definition of a person\
    \ such as:\n\n```\n(structure person\n  fields ((declare name is-a name)\n   \
    \ (declare address is-a address)\n      ss-number\n    sex\n    age))\n\n(structure\
    \ student is-a person\n  fields (school\n    major\n    courses\n    advisor\n\
    \    date-of-grad))\n\n(structure employee is-a person\n  fields (manager\n  \
    \  division\n    group\n    wage\n    hours\n    ytd-hours))\n```\n\nBoth methods\
    \ (with and without 'person') provide the same structure access (in terms of fetch\
    \ or replace), and in this sense, the inheritance mechanism merely provides a\
    \ convenient shorthand notation. In terms of instance typing, the second method\
    \ allows the user to check the type of person/employee instances at two levels\
    \ of granularity (e.g. if x is a person, or if x is a student).\n\nThe first half\
    \ of this chapter describes the method by which structure and field attributes\
    \ are inherited. This is followed by a discussion of the semantic notion of inheritance\
    \ with respect to instance type.\n\nThe attribute modifiers in order of decreasing\
    \ restriction are only, always and also. The effect of these on the value of an\
    \ attribute depends on the modifier that was specified on the parent level. The\
    \ following describes modifier and its effects:\n\n3 July 1984\n\n1. only. The\
    \ only modifier prohibits modification of an attribute's value by any descendant\
    \ of the structure. only may be used in a descendant provided that the attribute\
    \ in the parent structure is modified with also (i.e. if the parent attribute\
    \ is modified with either only or always an error will result). if only is used\
    \ in a descendant structure, the inherited attribute value is overridden by the\
    \ value specified and the modifier at this level becomes only.\n\n2. always. This\
    \ is the second most restrictive modifier. always can only be modified by the\
    \ also modifier. When always is inherited and modified by also, the current value\
    \ is concatenated1. When also is inherited and modified by always, the values\
    \ are concatenated and the modifier becomes always.\n\n3. also. This is the least\
    \ restrictive modifier. When the modifier is not specified for a modifiable attribute,\
    \ also is the default used. When also is inherited, the value is overridden by\
    \ only and concatenated for also and always. The modifier will become the one\
    \ specified by the descendant structure. When also is specified as a descendant\
    \ to always and also the values are concatenated and the modifier remains unchanged.\n\
    \nFinally, while a modifier need not be specified for a modifiable attribute,\
    \ an error will result if a modifier is given for an attribute that is not modifiable.\n\
    \nNote as well as unmodifiable attributes are implicitly only.\n\n+ 1. The way\
    \ in which the values are concatenated or grouped together depends on the attribute\
    \ involved. This is explained below.\n\n3 July 1984\n\nThe following diagram shows\
    \ the allowable combinations:\n\n| | only | always | also |\n| --- | --- | ---\
    \ | --- |\n| only | ERROR | ERROR | concat |\n| always | ERROR | always | concat\
    \ |\n| also | concat | concat | concat |\n\n3 July 1984\n\n## 8.1.2 Structure\
    \ Attributes\n\nThe following describes how structure attributes are inherited.\
    \ Each of structure attributes are present along with how the value is inherited.\n\
    \n3 July 1984\n\n### 8.1.2.1 type\n\nIn version 1.0 of CADRS, type is an unmodifiable\
    \ attribute, thus its restriction could be relaxed in a future version.\n\n3 July\
    \ 1984\n\n### 8.1.2.2 fields\n\nThe value of fields may be changed by a descendant,\
    \ but the way in which the values are concatenated is illustrated by the following\
    \ example. Given:\n\n```\n(structure s1\n  fields (a b))\n(structure s2\n  fields\
    \ (d e))\n```\n\nthe concatenation of fields-lists has the effect of:\n\n```\n\
    (a b d e)\n```\n\n3 July 1984\n\n## 8.1.2.3 before-creating and after-creating\n\
    \nThe before-creating and after-creating attributes both use the standard syntax\
    \ in their inheritance. The method of concatenation is to queue the forms and\
    \ insert them in order in the create expression as:\n\n```\n(structure s1\n  fields\
    \ (a b)\n  before-creating (foo)\n  after-creating (bar))\n\n(structure s2 is-a\
    \ s1\n  fields (a b)\n  before-creating (s2foo)\n  after-creating (s2bar))\n\n\
    (create s2) => (progn\n  (foo)\n  (s2foo)\n  (let ((datum (list nil nil))\n  \
    \  (bar)\n    (s2bar))\n  datum))\n```\n\n3 July 1984\n\n## 8.1.3 to-create type?\
    \ and typecheck\n\nThe to-create type? and typecheck attributes are unmodifiable.\n\
    \n## 8.1.4 Field Attributes\n\nField attribute inheritance is implemented in much\
    \ the same way as inheritance of structure attributes. The specifics of inheritance\
    \ for each field attribute are presented below.\n\n3 July 1984\n\n### 8.1.4.1\
    \ default-is-a-to-fetch-to-replace type\n\nThe default-is-a-to-fetch-to-replace\
    \ and type field attributes are unmodifiable and an error will result if a descendant\
    \ tries to change the inherited values.\n\n3 July 1984\n\n### 8.1.4.2 before/after/fetching/replacing\n\
    \nbefore-fetching, after-fetching, before-replacing, and after-replacing are modifiable\
    \ using the standard syntax. The method of concatenation is to queue the forms\
    \ and to insert them in order in the fetch/replace expression as shown:\n\n```\n\
    (structure s1\n  fields ((declare a\n    before-fetching (foo)\n    after-replacing\
    \ (bar newvalue))))\n(structure s2 is-a s1\n  fields ((declare a\n    before-fetching\
    \ (s2foo)\n    after-replacing (s2bar newvalue)))))\n(replace an-s2 10) => let\n\
    \  ((datum an-s2)\n    (newvalue 10)\n    (%ret (rplaca datum newvalue)\n    \
    \  (bar newvalue)\n      (s2barvalue))\n    %ret))\n```\n"
  mdcn: "\n\n1984年7月3日\n\n生成的表单。\n\n## 7.3 通用类型化\n\nCADRS 执行的结构类型化（structure typing）是非常直接的。然而，更改类型（type?）结构属性和函数的机制为实现更复杂的类型概念提供了手段。\n\
    \n例如，给定 person 结构的定义如下：\n\n```\n(structure person\nfields ((declare name is-a\
    \ name)\nage\nsex))\n```\n\n我们可以定义一个“女性（women）”的概念为：\n\n```\n(structure women\n\
    type?\n(lambda (s)\n  (and (memq 'person (type s))\n    (eq (fetch s sex) 'female))))\n\
    ```\n\n并发现：\n\n```\n(type? (create person (sex . 'female)) (women))\n```\n\n实际上会返回\
    \ t。\n\n此外，使用 CADRS，可以定义一个全局类型处理程序来处理所有对 `type?` 的请求，从而为实例类型化提供了额外的粒度。这种技术在“异常处理”章节中进行了介绍。\n\
    \n1984年7月3日\n\n## 8 - 结构继承\n\n作为后续内容的引言，这里介绍的结构继承方式并非知识表示语言（FRL, KRL, KL-ONE）中所那种类型。考虑到\
    \ CADRS 属性大部分程度上是指令性的而非描述性的，且属性集是固定的，这可能是显而易见的。从积极的一方面来看，结构继承确实超越了其他结构定义工具（INTERLISP\
    \ Record Package 或 MacLISP 的 DefStruct）提供的功能，它提供了一种扩展和修改结构定义的手段，以创建与父结构语义上相关的新定义。作为此类功能用性的示例，请考虑以下内容。\n\
    \n1984年7月3日\n\n注意以下用于处理学生和员工信息的结构：\n\n```\n(structure student\n  fields ((declare\
    \ name is-a name)\n    (declare address is-a address)\n    ss-number\n    sex\n\
    \    age\n    school\n    major\n    courses\n    advisor\n    date-of-grad))\n\
    ```\n\n```\n(structure employee\n  fields ((declare name is-a name)\n    (declare\
    \ address is-a address)\n    ss-number\n    sex\n    age\n    manager\n    division\n\
    \    group\n    wage\n    hours\n    ytd-hours))\n```\n\n1984年7月3日\n\n显然，两者之间存在一个共同的信息内核。在概念层面上，这无疑是因为学生和员工都是人。为了在\
    \ CADRS 中捕捉这种关系，可以根据 person 的定义来定义 student 和 employee，例如：\n\n```\n(structure person\n\
    \  fields ((declare name is-a name)\n    (declare address is-a address)\n    \
    \  ss-number\n    sex\n    age))\n\n(structure student is-a person\n  fields (school\n\
    \    major\n    courses\n    advisor\n    date-of-grad))\n\n(structure employee\
    \ is-a person\n  fields (manager\n    division\n    group\n    wage\n    hours\n\
    \    ytd-hours))\n```\n\n两种方法（带有和不带 'person'）都提供了相同的结构访问（从 fetch 或 replace 的角度来看），从这个意义上说，继承机制仅仅提供了一种方便的简写符号。在实例类型化（instance\
    \ typing）方面，第二种方法允许用户在两个粒度级别检查人/员工实例的类型（例如，x 是否是一个人，或者 x 是否是一个学生）。\n\n本章的前半部分描述了结构和字段属性被继承的方法。随后是关于实例类型继承语义概念的讨论。\n\
    \n属性修饰符按限制程度从高到低依次为：only（仅）、always（总是）和 also（也）。这些对属性值的影响取决于父级上指定的修饰符。以下描述了修饰符及其影响：\n\
    \n1984年7月3日\n\n1. only. 这种唯一修饰符禁止结构的任何后代类修改属性值。只要父结构中的属性是使用 also 修饰的，就可以在后代类中使用\
    \ only（即：如果父属性使用 only 或 always 修饰，则会导致错误）。如果后代结构中使用了 only 这种修饰符，则被继承的属性值将由指定的值覆盖，且该层级的修饰符将变为\
    \ only。\n\n2. always. 这是限制性第二大的修饰符。always 只能通过 also 修饰符进行修改。当 always 被继承并被 also\
    \ 修改时，当前值将进行拼接1。当 also 被继承并被 always 修改时，值将拼接且修饰符将变为 always。\n\n3. also. 这是限制性最低的修饰符。当一个可修改属性未指定修饰符时，默认使用\
    \ also。当 also 被继承时，其值会被 only 覆盖，并在 also 和 always 处进行拼接。修饰符将变为后代结构所指定的那个。当后代结构中对\
    \ always 和 also 的指定为 also 时，值将拼接且修饰符保持不变。\n\n最后，虽然可修改属性不一定指定修饰符，但如果为不可修改的属性给出修饰符，将会导致错误。\n\
    \n注意，不可修改的属性隐地为 only。\n\n+ 1. 值拼接或分组的方式取决于涉及的属性。下文将对此解释。\n\n1984年7月3日\n\n下面的图显示了允许的组合：\n\
    \n| | only | always | also |\n| --- | --- | --- | --- |\n| only | ERROR | ERROR\
    \ | concat |\n| always | ERROR | always | concat |\n| also | concat | concat |\
    \ concat |\n\n1984年7月3日\n\n## 8.1.2 结构属性\n\n以下描述了结构属性是如何被继承的。结构属性连同其值的继承方式如下。\n\
    \n1984年7月3日\n\n### 8.1.2.1 type\n\n在 CADRS 1.0 版本中，type 是不可修改的属性，因此在未来的版本中可能会放宽限制。\n\
    \n1984年7月3日\n\n### 8.1.2.2 fields\n\nfields 的值可以被后代类修改，其拼接方式通过以下示例说明：\n\n```\n\
    (structure s1\n  fields (a b))\n(structure s2\n  fields (d e))\n```\n\nfields\
    \ 的拼接结果为：\n\n```\n(a b d e)\n```\n\n1984年7月3日\n\n## 8.1.2.3 before-creating and\
    \ after-creating\n\n这二类属性在继承时都使用标准语法。拼接方法是将形式按顺序插入 create 表达式中：\n\n```\n(structure\
    \ s1\n  fields (a b)\n  before-creating (foo)\n  after-creating (bar))\n\n(structure\
    \ s2 is-a s1\n  fields (a b)\n  before-creating (s2foo)\n  after-creating (s2bar))\n\
    \n(create s2) => (progn\n  (foo)\n  (s2foo)\n  (let ((datum (list nil nil))\n\
    \    (bar)\n    (s2bar))\n  datum))\n```\n\n1984年7月3日\n\n## 8.1.3 to-create type?\
    \ and typecheck\n\nto-create type? 和 typecheck 属性是不可修改的。\n\n## 8.1.4 字段属性\n\n\
    字段属性的继承实现方式与结构属性的继承相似。每个字段属性的继承细节如下。\n\n1984年7月3日\n\n### 8.1.4.1 default-is-a-to-fetch-to-replace\
    \ type\n\ndefault-is-a-to-fetch-to-replace 和 type 字段属性是不可修改的，后代类尝试更改继承的值会导致错误。\n\
    \n1984年7月3日\n\n### 8.1.4.2 before/after/fetching/replacing\n\nbefore-fetching、after-fetching、before-replacing\
    \ 和 after-replacing 使用标准语法进行修改。拼接方法是将形式按顺序插入 fetch/replace 表达式中，所示：\n\n```\n(structure\
    \ s1\n  fields ((declare a\n    before-fetching (foo)\n    after-replacing (bar\
    \ newvalue))))\n(structure s2 is-a s1\n  fields ((declare a\n    before-fetching\
    \ (s2foo)\n    after-replacing (s2bar newvalue)))))\n(replace an-s2 10) => let\n\
    \  ((datum an-s2)\n    (newvalue 10)\n    (%ret (rplaca datum newvalue)\n    \
    \  (bar newvalue)\n      (s2barvalue))\n    %ret))\n```\n\n"
