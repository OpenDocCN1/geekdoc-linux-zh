    \        to-fetch\n          (* (val-of datum wage) (hours-worked))))\n```\n\n\
    # 6.2 replace/val-to\n\nreplace and val-to correspond to fetch and val-of for\
    \ storing information in a structure. The syntax for each is:\n\n```\n(replace\
    \ stru-inst path-spec new-val)\n(val-to stru-inst path-spec new-val)\n```\n\n\
    where:\n\n+   - struct-inst is the structure instance to be modified.\n\n+   -\
    \ path-spec is a list of one or more field names which explicitly determine a\
    \ unique field within the structure."
  - "[PAGE 64]\n\n3 July 1984\n\no new-val is the new value for the field.\n\nAs with\
    \ fetch and val-of, replace will use the to-replace form if one is\npresent, while\
    \ val-to will always use the CADRS generated form1. The following\nexample shows\
