    \ allows the user to check the type of peron/employee instances at two levels\
    \ of granularity (e.g. if x is a person, or if x is a student).\n\nThe first half\
    \ of this chapter describes the method by which structure and field attributes\
    \ are inherited. This is followed by a discussion of the semantic notion of inheritance\
    \ with respect to instance type."
  - '[PAGE 72]


    The attribute modifiers in order of decreasing restriction are only, always and
    also. The effect of these on the value of an attribute depends on the modifier
    that was specified on the parent level. The following describes modifier and its
    effects:'
  - '[PAGE 73]


    # 3 July 1984


    1. only. The only modifier prohibits modification of an attribute''s value by
    any descendant of the structure. only may be used in a descendant provided that
    the attribute in the parent structure is modified with also (i.e. if the parent
    attribute is modified with either only or always an error will result). if only
    is used in a descendant structure, the inherited attribute value is overridden
    by the value specified and the modifier at this level becomes only.


    2. always. This is the second most restrictive modifier. always can only be modified
    by the the also modifier. When always is inherited and modified by also, the current
    value is concatenated1. When also is inherited and modified by always, the values
    are concatenated and the modifier becomes always.


    3. also. This is the least restrictive modifier. When the modifier is not specifiedid
    for a modifiable attribute, also is the default used. When also is inherited,
    the value is overridden by only and concatenated for also and always. The modifier
    will become the one specified by the descendant structure. When also is specified
    as a descendant to always and also the values are concatenated and the modifier
    remains unchanged.


    Finally, while a modifier need not be specified for a modifiable attribute, an
    error will result if a modifier is given for an attribute that is not modifiable.


    Note as well as unmodifiable attrbutes are implicitly only.


    +   1. The way in which the values are concatenated or grouped together depends
    on the attribute involved. This is explained below.'
  - '[PAGE 74]


    # 3 July 1984


    The following diagram shows the allowable modifier combinations along with the
    resulting values and modifiers.


    | | only | always | also |

    |---|---|---|---||

    | P | only | ERROR | ERROR |

    | a | | ERROR | ERROR |

    | r | always | ERROR | val : concat |

    | e | | | mod : always |

    | n | | val:override val : concat val : concat |

    | t | also | mod : only mod : always mod : also |


    # 8.1.2 Structure Attributes


    The following describes how structure attributes are inherited. Each of the structure
    attributes are presenet along with a description of how its value is inherited
    and how the different modifiers (if any are allowed) affect this process.


    # 8.1.2.1 type


    In version 1.00 of CADRS, type is an unmodifiable attribute, and thus its value
    may not be changed. This restriction could possibly be relaxed in a future version.'
  - '[PAGE 75]


    3 July 1984


    # 8.1.2.2 fields


    The value of the fields attribute may be changed by a descendant, but the changes
    that are possible are somewhat restricted and therefore do not fall into the ''normal''
    framework. The way in which the values of the parent and descendant are concatenated
    is illustrated by the following example.


    Given the 2 structures:


    ```

    (structure s1 fields (a b c))

    (structure s2 fields (d e f))

    ```


    the concatenation of the field-lists has the effect of an order preserving union
    operation on the two values. The value resulting in:


    ```

    (a b c d e f)

    ```


    If one or more of the fields appear in both fields-lists, the values of the field
    attributes specified by the descendant field are used to modify the field attribute
    values of the parent. This operation is similar to structure attribute inheritance
    and is covered in the section on field attributes below.'
  - "[PAGE 76]\n\n3 July 1984\n\n# 8.1.2.3 before-creating and after-creating\n\n\
    The before-creating and after-creating attributes both use the standard modifier\
    \ syntax in their inheritance. The method of concatenation is to queue the forms\
    \ and to insert them in order in the create expression as shown:\n\n```\n(structure\
    \ s1\n  fields (a b c)\n  before-creating (foo)\n  after-creating (bar))\n\n(structure\
    \ s2 is-a sl\n  before-creating (s2foo)\n  after-creating (s2bar datum))\n\n(create\
    \ s2) => (progn\n  (foo)\n  (s2foo)\n  (let ((datum (list nil nil nil))\n    (bar)\n\
    \    (s2bar datum))\n  datum))\n```\n\n# 8.1.3 to-create type? and typecheck\n\
    \nThe to-create type? and typecheck attributes are unmodifiable.\n\n# 8.1.4 Field\
    \ Attributes\n\nField attribute inheritance is implemented in much the same way\
    \ as inheritance of structure attributes. The specifics of inheritance for each\
    \ field attribute are presented below."
