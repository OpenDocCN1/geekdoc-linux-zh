    \ structure^1 and returns the value as the first element in a list using ncons.\n\
    \n1. This time women is not defined as a structure\n\n3 July 1984\n\n## 11 - CADRS\
    \ Utilities\n\nThis chapter describes the utility packages provided for version\
    \ 1.00. Included are:\n\n- 1. A validation script for version 1.00 for Franz Lisp.\n\
    - 2. A reset function for CADRS.\n- 3. A syntax macro that provides an abbreviated\
    \ form of fetch and replace.\n- 4. Other useful functions.\n\n## 11.1 CADRSVAL\n\
    \nThe CADRSVAL package provides a series of functions which serve to test each\
    \ of the features of CADRS. [[not yet complete]]\n\n## 11.2\n\nThe cadrs-reset\
    \ function (currently in CADRSTS.L) will remove the definitions for all currently\
    \ defined structures. The call to the function is:\n\n```\n(cadrs-reset)\n```\n\
    \n## 11.3 RPM\n\nThe RPM package written by Tim Finin of U. of P. provides an\
    \ abbreviated form for writing fetch an replace statements. Once RPM is loaded\
    \ with CADRS, the following constructs are accepted:\n\n3 July 1984\n\n- 1. #struct.path\n\
    This expands into (fetch struct path)\n\n- 2. #struct.path=newval\nThis expands\
    \ into (replace struct path newval)\n\n## 11.4 CADRSUTIL\n\nCADRSUTIL provides\
    \ a set of functions to help with debugging and testing of CADRS structures and\
    \ functions that use them. Each function is described below:\n\n### 11.4.1 structures\n\
    \nstructures is a function of no arguments that will display a list of the currently\
    \ defined structures.\n\n### 11.4.2 dump-field\n\ndump-field will display the\
    \ current attribute values for a field as it relates to a given structure. The\
    \ format is:\n\n```\n(dump-field field struc)\n```\n\nwhere:\n\n- o field - is\
    \ the name of the field to be dumped.\n- struct - is a structure containing that\
    \ field.\n\n## 11.4.3 dump-structure\n\ndump-structure - displays all attributes\
    \ for a given structure. The format is:\n\n```\n(dump-structure struc)\n```\n\n\
    where:\n\n- o struc - is the structure to be dumped.\n\n## 11.4.4 dump-all-structures\n\
    \nThis is a function of no arguments that dumps attribute values for all currently\
    \ defined structures.\n\n## 11.4.5 edits\n\nThe edits function uses the LISP editing\
    \ functions to alter a structure definition in the LISP environment. The format\
    \ is:\n\n```\n(edits struc)\n```\n\nwhere:\n\n- o struc - is the structure to\
    \ edit.\n\n3 July 1984\n\n## 12 - Conclusions\n\n## 12.1 Concluding Remarks\n\n\
    Through the extension of the traditional structure definition formalism, CADRS\
    \ embodies many of the strengths of an object oriented system in an efficient\
    \ implementation. The package has a significant number of features not found in\
    \ other LISP-based structure definition packages, including features imported\
    \ from network representation schemes.\n\n## 12.2 Future Work\n\nThere are a number\
    \ of additions to CADRS under consideration; these being:\n\n- i. a more flexible\
    \ (English-like) structure definition language to replace the rigorous attribute/value\
    \ syntax.\n- ii. to build, in conjunction with (i), a more robust access mechanism\
    \ to handle data-path inference, run-time specifications of data-paths, and the\
    \ ability to specify a structure type as part of the path to clear up ambiguities¹.\n\
    - iii. to possibly build a typed function formalism (a la GLISP), in conjunction\
    \ with (i) and (ii).\n- iv. to build a message facility to allow more complete\
    \ object centered programming.\n\n> 1. These ambiguities currently arise when\
    \ 2 structures contain 'different' definitions of the same field'. This situation\
    \ is solved by typechecking the instance when performing the field access.\n\n\
    - v. to add a destroy function to destroy structure instances (necessary if CADRS\
    \ is to be used in database research).\n- vi. a means to redefine (in a COBOL\
    \ sense) parts of a structure.\n\n3 July 1984\n\n## References\n\n- 1. Bawden,\
    \ Alan. \"DEFSTRUCT Reference Documentation.\" Massachusetts Institute of Technology\
    \ (ALANEMC), 1980\n- 2. Birtistle, G., Dahl, O., Myhrgaard, B., and Nygaard, K.\
    \ Simula Begin. Petrocelli/Carter, 1975.\n- 3. Mylopopoulos, John. \"An Overview\
    \ of Knowledge Representation.\" The Proceedings of the Workshop on Data Abstractions,\
    \ Databases and Conceptual Modelling (SIGPLAM), January 1981.\n- 4. Novak, Gordon\
    \ S. \"CLISP User’s Manual.\" Stanford University, Stanford California, 1982.\n\
    - 5. Roberts, Bruce R., and Goldstein, Ira P. The FRL Manual. MIT AI Memo 409,\
