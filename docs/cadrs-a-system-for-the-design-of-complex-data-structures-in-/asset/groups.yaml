- md: "\n## 1.3.2 Object Oriented Data Abstraction.\n\nSIMULA67 [2] allows the definition\
    \ of a more robust structure, known as a class. Classes are defined in terms of\
    \ data primitives, procedures, functions and other classes. The definition of\
    \ a class resembles that of a procedure definition where the body of the procedure\
    \ (i.e. the class body) is the code that will initialize a new object of that\
    \ class. Assuming a PASCAL that was extended to understand CLASSES we could rewrite\
    \ the stack example as:\n\n# 3 July 1984\n\n```pascal\nprogram reverse (input,output);\n\
    \nclass stack;\n  type\n    stk_p = ^stk;\n    stk = record\n      val : integer;\n\
    \      nxt : stk_p\n    end;\n  var\n    s : stk_p;\n\nprocedure push (v : integer);\n\
    \  var\n    tmp_s : stk_p;\n  begin\n    tmp_s := s;\n    new(s);\n    s.^val\
    \ := v;\n    s.^nxt := tmp_s\n  end;\n\nfunction pop : integer;\n  begin\n   \
    \ pop := s.^val;\n    s := s.^nxt\n  end;\n\nfunction empty:boolean;\n  begin\n\
    \    empty := s = nil\n  end;\n\nbegin {stack initialization}\n  s := nil\nend;\
    \ {stack}\nnvar s : stack; i : integer;\nbegin\n  new(s);\n  write('enter value\
    \ ');\n  while not eof do\n    begin\n      readln(i);\n      s.push(i);\n   \
    \   write('enter value ')\n    end;\n  writeln('the reversed list is');\n  while\
    \ not s.empty do writeln(s.pop)\n```\n\n# 3 July 1984\n\nend.\n\nThe concept of\
    \ a stack is quite different in the two programs (albeit, they look quite similiar).\
    \ In the pure PASCAL program, we push and pop as functions that manipulate the\
    \ stack structure. In the object-oriented approach, one requests information from\
    \ the stack (s.pop) and makes requests of the stack (s.push). It is this view\
    \ of the object instance as a ‘black-box’ entity that firmly insulates the object’s\
    \ underlying structure from the program. In addition, some implementations of\
    \ class/object structures [7] can selectively limit the ‘visibility’ of the object’s\
    \ components (e.g. data-structures or functions/procedures); a feature not found\
    \ in the PASCAL like schemes.\n\n## 1.4 A Short Overview of CADRS\n\nCADRS realizes\
    \ many of the advantages of an object-oriented system even though it is not truly\
    \ object-oriented. This is accomplished through the extension of more conventional\
    \ structure definition schemes. The following summary of CADRS should illustrate\
    \ this last point, as well as aid the reader during the comparative analysis that\
    \ follows.\n\nThe structure function is used to define all CADRS structures. Its\
    \ first argument is the name of the structure to be defined. The remaining arguments\
    \ taken to be a series of attribute/attribute-value pairs which serve to instantiate\
    \ the structure definition.\n\n# 3 July 1984\n\nThe following is a list of the\
    \ valid structure attributes and a description of each:\n\n- TYPE\n- The type\
    \ attribute describes the underlying LISP structure that should be used to implement\
    \ the structure being defined. The values allowed are:\n  - list - for a list.\n\
    \  - a-list - for an association list.\n  - p-list - for a disembodied property\
    \ list.\n  - array - for a MACLisp style array.\n  - hunk - for a hunk.\n  - hash\
    \ - for a hash link.\nIf this attribute is not specified, then the value list\
    \ is assumed.\n\n- FIELDS\nThe value of the fields attribute is the list of the\
    \ data items to be defined for the structure.\n\n- TO-CREATE\nThe value of the\
    \ to-create attribute is an expression which when evaluated will create an instance\
    \ of the structure being defined. This is used to override the form computed by\
    \ CADRS.\n\n- BEFORE-CREATING\nThe value of the BEFORE-CREATING attribute is a\
    \ form to be evaluated each instance of the structure is created.\n\n# 3 July\
    \ 1984\n\n- AFTER-CREATING\nThe after-creating attribute is used to specify a\
    \ form to be evaluated after an instance of the structure is created. The atom\
    \ datum is lamdba bound to the created instance while the after-creating form\
    \ is being evaluated.\n\n- IS-A\nThe is-a attribute allows a structure to inherit\
    \ the definition of one or more previously defined structures.\n\n- TYPECHECK\n\
    The typecheck attribute is used to tell CADRS to typecheck all created instances\
    \ of the structure.\n\n- TYPE?\nThe value of the type form is taken to be a lambda\
    \ expression or the name of a function which, when evaluated against an arbitrary\
    \ form, will return t if that form is an instance of the structure and nil otherwise.\n\
    \nFields, like structures, have attributes whose values may be assigned during\
    \ the definition of the structure.1 The valid list of field attributes are:\n\n\
    - IS-A\nThe is-a field attribute defines the field as an instance of the structure\
    \ named as the value of the attribute.\n\n- TO-FETCH\nThe to-fetch attribute is\
    \ used to specify a lambda expression or 'pattern'2 that will return an expression\
    \ to fetch the value of the field from a form. This is used to override the CADRS\
    \ generated form.\n\n1. This mechanism is shown in the CADRS reference chapters.\n\
    2. For example (car) return the first element in a list.\n\n# 3 July 1984\n\n\
    - TO-REPLACE\nThe value of the to-replace attribute is a lambda expression or\
    \ 'pattern' that will return an expression to replace the value of the field from\
    \ a form. This is used to override the CADRS generated form.\n\n- DEFAULT\nThe\
    \ value of the default attribute is an expression to be evaluated to give the\
    \ field a default value. If this attribute is not specified, then the valuersDefault.\n\
    \n- TYPE\nThe type of a field defines whether the field actually takes up space,\
    \ or is defined solely in terms of function/procedure calls. If the value is physical\
    \ then a cell in the underlying structure is reserved for it. If virtual then\
    \ no space reserved.\n\n- HASH-SIZE\nThe hash-size attribute is valid only for\
    \ fields in a structure whose underlying type is hash. The value of the attribute\
    \ is used to specify the size of hash-table for this field.\n\n- BEFORE-FETCHING\n\
    This attribute is used to specify a form to be evaluated before fetching the value\
    \ of the field from a form. The symbol datum is lambda bound to the form the fetch\
    \ is performed during the evaluation.\n\n- AFTER-FETCHING\nThis attribute is used\
    \ to specify the form to be evaluated after fetching the value of the field from\
    \ a form. The symbols datum and value are lambda bound to the form the fetch is\
    \ performed on and the value respectively.\n\n- BEFORE-REPLACING\nThe value of\
    \ this attribute corresponds to that of the before-fetching attribute for the\
    \ replace operation. The symbols datum and newvalue are lambda bound to the obvious\
    \ values.\n\n# 3 July 1984\n\n- AFTER-REPLACING\nThe value of the after-replacing\
    \ attribute is a form to be evaluated after the value of the field is replaced.\
    \ The symbols datum and newvalue are lambda bound to the obvious values.\n\n-\
    \ MUST-BE\nThe value of the must-be attribute is a form that is evaluated each\
    \ time the value of field is replaced. During its evaluation, the symbols datum\
    \ and newvalue are lambda bound to the obvious values. If the form returns then\
    \ the replace is performed. If nil is returned, then an error occurs.\n\nThe create\
    \ function is used to create an instance of a structure. Among other things, create\
    \ allows the user to initialize any of the fields or sub-fields of the structure.\n\
    \nThe functions that provide access to the fields of a structure instance are\
    \ fetch and replace. fetch returns the value of field based upon the data-path\
    \ specified, and replace will replace the value of a field with a new value.\n\
    \n## 1.5 Comparative Analysis\n\nThis section seeks to compare CADRS to three\
    \ of the more popular LISP based structure definition packages. First, CADRS is\
    \ compared to the DESTRUCT package written by Alan Bawden [1]. Next it is compared\
    \ to the INTERLISP record package written by L.M. Masinter [8]. Finally is compared\
    \ to Gordon Novak's GLISP [4].\n\n- Note that this error can be trapped.\n"
  mdcn: "\n\n## 1.3.2 面向对象的数据抽象\n\nSIMULA67 [2] 允许定义一种更健壮的结构，被称为“类”（class）。类是由数据原语、过程、函数和其他类来定义的。类的定义类似于过程的定义，其中过程体（即类体）是用于初始化该类新对象的代码。假设\
    \ PASCAL 已经扩展到可以理解“类”（CLASSES），我们可以将栈的示例重写为：\n\n# 1984年7月3日\n\n```pascal\nprogram\
    \ reverse (input,output);\n\nclass stack;\n  type\n    stk_p = ^stk;\n    stk\
    \ = record\n      val : integer;\n      nxt : stk_p\n    end;\n  var\n    s :\
    \ stk_p;\n\nprocedure push (v : integer);\n  var\n    tmp_s : stk_p;\n  begin\n\
    \    tmp_s := s;\n    new(s);\n    s.^val := v;\n    s.^nxt := tmp_s\n  end;\n\
    \nfunction pop : integer;\n  begin\n    pop := s.^val;\n    s := s.^nxt\n  end;\n\
    \nfunction empty:boolean;\n  begin\n    empty := s = nil\n  end;\n\nbegin {stack\
    \ initialization}\n  s := nil\nend; {stack}\nnvar s : stack; i : integer;\nbegin\n\
    \  new(s);\n  write('enter value ');\n  while not eof do\n    begin\n      readln(i);\n\
    \      s.push(i);\n      write('enter value ')\n    end;\n  writeln('the reversed\
    \ list is');\n  while not s.empty do writeln(s.pop)\n```\n\n# 1984年7月3日\n\nend.\n\
    \n栈的概念在两个程序中非常不同（尽管它们看起来非常相似）。在纯 PASCAL 程序中，我们通过 `push`（入栈）和 `pop`（出栈）来操作栈结构。在面向对象的方法中，我们向栈请求信息（s.pop）并向栈下请求操作（s.push）。正是这种将对象实例视为“黑盒”实体的观点，牢地将对象的底层结构从程序中隔离开来。此外，类/对象结构的某些实现\
    \ [7] 可以选择性地限制对象组件的“可见性”（例如数据结构或函数/过程）；这种功能在类似 PASCAL 的方案中是找不到的。\n\n## 1.4 CADRS\
    \ 简述\n\n尽管 CADRS 并非真正的面向对象系统，但它实现了面向对象系统的许多优势。这是通过扩展更传统的结构定义方案实现的。以下对 CADRS 的总结将说明最后一点，并为读者在随后的比较分析中提供帮助。\n\
    \n`structure` 函数用于定义所有的 CADRS 结构。它的第一个参数是待定义的结构名称。剩余的参数被视为一系列属性/属性-值对，用于实例化该结构定义。\n\
    \n# 1984年7月3日\n\n以下是有效的结构属性列表及其每个属性的描述：\n\n- TYPE\n- TYPE 属性描述了应该用于实现所定义结构的底层\
    \ LISP 结构。允许的值有：\n  - list - 用于列表。\n  - a-list - 用于关联列表（association list）。\n \
    \ - p-list - 用于分离属性列表（property list）。\n  - array - 用于 MACLisp 风格的数组。\n  - hunk\
    \ - 用于块（hunk）。\n  - hash - 用于哈希链（hash link）。\n如果未指定此属性，则假设值为默认列表。\n\n- FIELDS\n\
    FIELDS 属性的值是要为该结构定义的数据项列表。\n\n- TO-CREATE\nTO-CREATE 属性的值是一个表达式，当其求值时将创建所定义结构的实例。这被用于覆盖\
    \ CADRS 计算出的格式。\n\n- BEFORE-CREATING\nBEFORE-CREATING 属性的值是在创建每个结构实例时都会被求值的形式。\n\
    \n# 1984年7月3日\n\n- AFTER-CREATING\nAFTER-CREATING 属性用于指定一个在结构实例创建后进行求值的形式。在评估\
    \ AFTER-CREATING 形式时，原子数据（atom datum）将绑定到创建的实例。\n\n- IS-A\nIS-A 属性允许结构继承一个或多个之前定义的结构的定义。\n\
    \n- TYPECHECK\nTYPECHECK 属性用于告诉 CADRS 对该结构的所有创建实例进行类型检查。\n\n- TYPE?\nTYPE 形式的值被视为一个\
    \ lambda 表达式或函数名，当对任意形式进行求值时，如果该形式是该结构的实例则返回 t，否则返回 nil。\n\n字段与结构一样，也拥有属性，其值可以在结构定义期间赋值。1\
    \ 有效的字段属性列表为：\n\n- IS-A\nIS-A 字段属性将字段定义为属性值所指的结构的实例。\n\n- TO-FETCH\nTO-FETCH 属性用于指定一个\
    \ lambda 表达式或“模式”2，该模式将返回一个表达式，用于从形式中获取字段的值。这被用于覆盖 CADRS 生成的格式。\n\n1. 这种机制在 CADRS\
    \ 参考章节中显示。\n2. 例如 `(car)` 返回列表中的第一个元素。\n\n# 1984年7月3日\n\n- TO-REPLACE\nTO-REPLACE\
    \ 属性的值是一个 lambda 表达式或“模式”，该模式将返回一个表达式，用于从形式中替换字段的值。\n\n- DEFAULT\nDEFAULT（默认）属性的值是一个用于求值的表达式，用以给字段一个默认值。如果未指定此属性，则使用\
    \ valuersDefault。\n\n- TYPE\n字段的类型定义了字段是实际占用空间，还是仅通过函数/过程定义。如果值为物理的（physical），则在底层结构中预留单元格；如果是虚拟的（virtual），则不留空间。\n\
    \n- HASH-SIZE\nHASH-SIZE 属性仅适用于底层类型为 hash 的字段。该属性的值用于指定该字段哈希表的大小。\n\n- BEFORE-FETCHING\n\
    BEFORE-FETCHING 属性用于指定在从形式中获取字段值之前求值的形式。求值期间，符号数据（symbol datum）绑定到执行 fetch的形式。\n\
    \n- AFTER-FETCHING\nAFTER-FETCHING 属性用于指定在从形式中获取字段值后求值的形式。符号数据和值分别绑定到执行 fetch的形式和对应的值。\n\
    \n- BEFORE-REPLACING\n该属性的值对应于替换操作的 BEFORE-FETCHING 属性。符号数据和新值被绑定到相应的值。\n\n# 1984年7月3日\n\
    \n- AFTER-REPLACING\nAFTER-REPLACING 属性的值是在字段值替换后求值的形式。符号数据和新值被绑定到相应的值。\n\n- MUST-BE\n\
    MUST-BE 属性的值是在每次替换字段值时都会求值的形式。在形式求值期间，符号数据和新值被绑定到相应的值。如果该形式返回，则执行替换；如果返回 nil，则发生错误。\n\
    \n`create` 函数用于创建结构的实例。除外，`create` 允许用户初始化结构的任何字段或子字段。\n\n`fetch` 和 `replace`\
    \ 函数提供了访问结构实例字段的功能。`fetch` 根据指定的路径返回字段的值，而 `replace` 将用新值替换字段的值。\n\n"
