  - "[PAGE 28]\n\n3 July 1984\n\nIn FRL (Frame Representation Language), the description\
    \ of an object, known as\nframe, bears a close resemblance to that of a CADRS\
    \ structure. The structure of a\nframe is:\n\n```\n(frame\n  (slot1\n    (facet1\n\
    \      (datum1 (label1 message1 message2 ...))\n      (label2 message1...))\n\
    \      (datum2 (label1 ...) ...) ...)\n    (facet2 ...) ...)\n  (slot2 ...) ...)\n\
    ```\n\nFrames can be related in a heirarchy as specified by the value of a frame’s\
    \ AKO (A\nKind Of) slot (e.g. the value of the AKO slot for the frame DOG might\
    \ be ANIMAL),\nand each slot may be specified as frame (e.g. the frame CAR contains\
    \ the slot\nWHEEL which is also a frame). Each slot can have a number of facets\
    \ which serve to\ndescribe it. Facets can also serve to specify the invocation\
    \ of procedures:\n\n+   - when the value of the slot is changed or accessed.\n\
    - to supply the value of a slot that has no VALUE facet.\n- to supply a default\
    \ value for a slot with no VALUE facet.\n- to validate the value of the slot.\n\
    \nA number of the ideas behind the structure of FRL frames and their associations\n\
    have been adapted for use in CADRS. The notions of generalization (AKO in FRL\
    \ and\nIS-A for CADRS structures) aggregation, the ability to define the parts\
    \ of an object\nas other objects, and procedural attachment are useful in both\
    \ types of description."
  - '[PAGE 29]


    Also of use is the ability to classify object instances with respect to their
    type.


    Many of the differences between FRL and CADRS are a result of the goals of each
    scheme. For example, the need to add new slots to a frame as knowledge of the
    object grows, has no counterpart in the structure definition domain since structures
    are typically static. Hence, CADRS does not provide a means to add new fields
    to an existing structure. Moreover, the type of inheritance supported by a structure
    definition scheme need not be as dynamic as that of a knowledge representation;
    again, due to the assumption that structure definitions are static.


    As illustrated above, each slot in an FRL frame can contain user defined facets
    in addition to those understood by the system. While CADRS attributes are restricted
    to those that are system defined, relaxing this constraint to allow information
    to be associated with a structure/field seems very worthwhile and is under consideration.'
