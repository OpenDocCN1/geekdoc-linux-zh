  - '[PAGE 27]


    # 3 July 1984


    Some of the facets of the message facility of GLISP objects can be mimicked in
    CADRS using the **replace** function in conjunction with the **to-replace** field
    attribute. The major limitation would be that the messages could only have one
    argument. The operator overloading could not be duplicated without rewriting the
    necessary functions (in effect to perform the work of the GLISP compiler).


    # 1.6 CADRS and Representation Schemes


    This section compares CADRS and network-based schemes for knowledge representation
    as embodied in FRL [5]. The purpose of such a comparision is neither to insinate
    that CADRS is, in any sense of the word, a knowledge representation tool, nor
    to propose that it be used as such. Rather, the goal is to characterize the descriptive
    capabilitales of such knowledge representation schemes to gain insight into the
    kinds of capabilities that would be applicable to the description of data structures.
    The following short summary of the network based approach is presented to aid
    the reader during the comparison.


    As stated by Mylopoulos in [3], network based knowledge representation schemes,
    "often called semantic networks, attempt to describe a world in terms of objects
    (nodes) and binary associations (labelled edges), the former denoting individuals
    and the latter binary relationships in the world being modelled." As such, the
    knowledge base can be viewed as a directed labelled graph in which the addition
    or deletion of new nodes/edges constitute the addition/deletion of knowledge about
    the world.'
- md: "\n3 July 1984\n\nIn FRL (Frame Representation Language), the description of\
    \ an object, known as frame, bears a close resemblance to that of a CADRS structure.\
    \ The structure of a frame is:\n\n```\n(frame\n  (slot1\n    (facet1\n      (datum1\
    \ (label1 message1 message2 ...))\n      (label2 message1...))\n      (datum2\
    \ (label1 ...) ...) ...)\n    (facet2 ...) ...)\n  (slot2 ...) ...)\n```\n\nFrames\
    \ can be related in a heirarchy as specified by the value of a frame’s AKO (A\
    \ Kind Of) slot (e.g. the value of the AKO slot for the frame DOG might be ANIMAL),\
    \ and each slot may be specified as frame (e.g. the frame CAR contains the slot\
    \ WHEEL which is also a frame). Each slot can have a number of facets which serve\
    \ to describe it. Facets can also serve to specify the invocation of procedures:\n\
    \n- when the value of the slot is changed or accessed.\n- to supply the value\
    \ of a slot that has no VALUE facet.\n- to supply a default value for a slot with\
    \ no VALUE facet.\n- to validate the value of the slot.\n\nA number of the ideas\
    \ behind the structure of FRL frames and their associations have been adapted\
    \ for use in CADRS. The notions of generalization (AKO in FRL and IS-A for CADRS\
    \ structures) aggregation, the ability to define the parts of an object as other\
    \ objects, and procedural attachment are useful in both types of description.\n\
    \nAlso of use is the ability to classify object instances with respect to their\
    \ type.\n\nMany of the differences between FRL and CADRS are a result of the goals\
    \ of each scheme. For example, the need to add new slots to a frame as knowledge\
    \ of the object grows, has no counterpart in the structure definition domain since\
    \ structures are typically static. Hence, CADRS does not provide a means to add\
    \ new fields to an existing structure. Moreover, the type of inheritance supported\
    \ by a structure definition scheme need not be as dynamic as that of a knowledge\
    \ representation; again, due to the assumption that structure definitions are\
    \ static.\n\nAs illustrated above, each slot in an FRL frame can contain user\
    \ defined facets in addition to those understood by the system. While CADRS attributes\
    \ are restricted to those that are system defined, relaxing this constraint to\
    \ allow information to be associated with a structure/field seems very worthwhile\
    \ and is under consideration.\n\n3 July 1984\n\n## 2 - CADRS Reference\n\n## 2.1\
    \ Introduction\n\nThe next 10 chapters are devoted to an in depth treatment of\
    \ the various features of CADRS. As mentioned, these chapters are intended to\
    \ serve as a reference manual for version 1.00 of the CADRS package and its implementation\
    \ under Franz Lisp Opus 37.\n\n3 July 1984\n\n## 3 - structure - Structure Definition\n\
    \nThe structure function is used to define CADRS structures as well as to describe\
    \ their interrelationships. As in INTERLISP (or PASCAL for that matter), structure\
    \ does not create instances of the structure being defined. As such, no relevant\
    \ value is returned. As with much of the CADRS top level, structure is implemented\
    \ as a macro, which in turn uses lower level functions to actually define the\
    \ structure.\n\n### 3.1 Syntax\n\nThe syntax for structure is:\n\n```\n(structure\
    \ attrib1 [mod1] vali attrib2 [mod2] val2 ..)\n```\n\nwhere:\n\n- o attrib1 is\
    \ one of the exceptible structure attributes (see below).\n- o modi is the optional\
    \ modifier on that attribute¹.\n- o vali is the value to be associated with that\
    \ attribute.\n\nAll of the attributes are optional.\n\n> > 1. Some attributes\
    \ take on modifiers that specify how their values will be inherited. Attribute\
    \ modifiers are covered in the chapter on Structural Inheritance.\n\n3 July 1984\n\
    \n### 3.2 Structure Attributes\n\nAlthough all structure attributes (and field\
    \ attributes for that matter) have default values, and thus, need not be specified,\
    \ the actual value that the attributes will take on depend on the \"lineage\"\
    ¹ of the structure. While this point is covered more completely in the section\
    \ on structure inheritance, it should be pointed out here that the default values\
    \ mentioned below are in fact affected by the lineage of the structure.\n\n####\
    \ 3.2.1 type\n\nThe value of the type attribute specifies the underlying LISP\
    \ structure that will be used to create an instance of this structure. The allowable\
    \ values are:\n\n- list (The default) The fields in a structure of type list are\
    \ stored as elements in a list.\n- a-list The value for a field is stored as the\
    \ value of key <field> (whatever the name of the field is in) in an association\
    \ list. For example, if a structure has the foo with the value bar and the field\
    \ dog with the value cat, the a-list might look like:\n\n```\n((foo . bar) (dog\
    \ . cat) . .)\n```\n- p-list Values are stored as the value of indicator <field>\
    \ in a disembodied property list². If the fields and values above were in a structure\
    \ of p-list, it might look like:\n\n> > 1. The lineage of a structure is the set\
    \ of structures that have been inherited, along with the lineage of each of the\
    \ respective structures in that set.\n> 2. A disembodied property list is one\
    \ which is not accessed (referenced) as the property list sub-part of a symbol.\n\
    \n3 July 1984\n\n(foo bar dog cat . ....)\n\n4. array The value of a field is\
    \ stored in the array which has been mapped to that field. Using the example,\
    \ it might look like:\n\n```\n------+-------+\n| bar |\n+-------+\n| cat |\n```\n\
    \n5. hunk The value of a field is stored in the hunk which has been mapped to\
    \ that field. Using the example, it might look like:\n\n```\n{bar}\n```\n\n6.\
    \ hash Hash structures are quite different from the other structures. A major\
    \ difference is that field values are stored in separate space. One of the most\
    \ significant uses of hash structures is to extend structures. The following example\
    \ illustrates both hash structures and the technique:\n\n> > 1. For compatibility,\
    \ hash structures are covered in detail.\n> 2. Since this example uses functions\
    \ that are described later, it might be worth your while to skip it for now, and\
    \ come back to it.\n\n3 July 1984\n\nConsider the following structure:\n\n```\n\
    (structure some-data type hunk\n  fields ((declare f1-a foo)\n  (declare f2-a\
    \ bar)\n  f3\n  f4\n  (declare f5-a foobar)\n)\n```\n\nIf we had a large network\
    \ built using instances of some-data and then discovered a need to add field f6,\
    \ the only recourse (without using hash structures) would be to start from scratch.\
    \ If we define a hash:\n\n```\n(structure add-the-field type hash\n  fields ((declare\
    \ f6 default nil)))\n```\n\nthen all of existing some-data instances will now\
    \ have a field f6 since for any-data instance sd:\n\n```\n(replace sd f6 100)\
    \ => (putash sd 100 f6)\n```\n\n(f6 is the array used).\n\n> > 1. Even if some-data\
    \ a list, it would be necessary to 'cons' on the extra space for the field.\n\n\
    3 July 1984\n\n### 3.2.2 fields\n\nThe fields attribute defines the different\
