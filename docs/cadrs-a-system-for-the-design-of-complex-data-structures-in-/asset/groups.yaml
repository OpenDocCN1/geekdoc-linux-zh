    \ 83\n\n# 1 - 引言\n\n## 1.1 引言\n\n本文描述了一个为 LISP 设计并实现数据抽象设施的项目。该项目的结果——CADRS（无结构数据访问编译器）系统，支持对混合数据/过程结构的定义、创建和高效操作，这些结构与\
    \ Simula [2] 和 Smalltalk 等语言中的类对象非常相似。\n\n## 1.2 论文概述\n\n本文旨在实现两个目的。首先是记录 CADRS\
    \ 背后的设计哲学。其次是为希望使用该软件包¹ 的人员提供 CADRS 功能的参考。\n\n本章的其余部分描述了 CADRS 的设计。讨论从对不同数据抽象形式形式的简要检查开始。接下来，简要概述了\
    \ CADRS 的功能。随后是对 CADRS 与其他 LISP 结构定义包的对比分析。本章以 CADRS 与 FRL（一种基于网络的知识表示方案）的对比结束。\n\
    \n- CADRS 目前在 Franz Lisp Opus 38 下实现，但可以很容易修改为在 MACLisp 下运行。\n\n后续章节详细介绍了 CADRS。这些章节（第\
    \ 2 到第 11 章）旨在作为 CADRS 的参考手册。软件包中的每个用户级函数都得到了描述和示例说明。\n\n最后一章给出了一些性意见和对未来工作的考虑。\n\
    \n## 1.3 数据抽象方案概述\n\n正如 Worth 在 [9] 中指出的，“……[计算机]要处理的大量信息在某种意义上代表了现实世界某部分的抽象。”\
    \ 这种处理的第一步是在计算机上开发这种抽象的表示。正如 Worth 所指出的，这种表示的最低层次（以及所有其他表示所映射的层次）是硬件（或 LISP 的虚拟机）所提供的数据结构和控制结构。高层语言中发现的数据抽象设施提供了更复杂的原语，允许在更具概念的层构建表示。\n\
    \n### 1.3.1 基础数据抽象\n\nPASCAL 提供了支持合理数据抽象的基础。首先是根据已定义的类型定义数据类型；其次是通过记录（RECORD）定义异构数据结构，允许对信息进行分组；第三是定义动态（递归）结构。\n\
    \nPASCAL 的结构定义方案并非没有局限性。作为说明，考虑以下实现反转列表栈的 PASCAL 程序：\n\n# 3 July 1984\n\n```pascal\n\
    program reverse (input,output);\ntype\n  stack = ^stk;\n  stk = record\n    val\
    \ : integer;\n    nxt : stack\n  end;\nvar\n  i : integer;\n  s : stack;\n\nprocedure\
    \ push (v : integer; var s : stack);\nvar\n  tmp_s : stack;\nbegin\n  tmp_s :=\
    \ s;\n  new(s);\n  s^.val := v;\n  s^.nxt := tmp_s\nend;\n\nfunction pop (s :\
    \ stack) : integer;\nbegin\n  pop := s^.val;\n  s := s^.nxt;\nend;\n\nfunction\
    \ empty (s : stack) : boolean;\nbegin\n  empty := s = nil\nend;\n\nbegin\n  s\
    \ := nil;\n  write('enter value ');\n  while not eof do\n  begin\n    readln(i);\n\
    \    push(i, s);\n    write('enter value ')\n  end;\n  writeln('the reversed list\
    \ is');\n  while not empty(s) do writeln(pop(s))\nend.\n```\n\n# 3 July 1984\n\
    \npush 和 pop 过程将程序员与栈的底层结构隔离开。不幸的是，直接操作结构的便利性诱使程序员偶尔这样做，而不是编写必要的函数/过程（例如使用 `s\
    \ := nil`，而不是初始化栈的函数/过程）。因此，对 `stack` 结构的更改可能会导致某些使用结构的过程失效。例如，如果我们对栈中的条目数量设置上限，可能会将底层结构改为：\n\
    \n```pascal\nstack = record\n  val : array [1..100] of integer;\n  head_num :\
    \ integer;\n  end;\n```\n\n该方案的另一个局限性是它不允许根据结构中的其他项来定义字段项。例如，最好将员工定义为：\n\n```pascal\n\
    employee = record\n  name : a name;\n  age : 1..80;\n  wage : real;\n  hours :\
    \ real;\n  pay : (wage * hours);\n  end;\n```\n\n其中 `pay` 是一个只读字段，每次被访问时都会计算。\n\
    \n"
