  - '[PAGE 31]


    3 July 1984


    # 3 - structure - Structure Definition


    The structure function is used to define CADRS structures as well as to describe
    their interrelationships. As in INTERLISP (or PASCAL for that matter), structure
    does not create instances of the structure being defined. As such, no relevant
    value is returned. As with much of the CADRS top level, structure is implemented
    as a macro, which in turn uses lower level functions to actually define the structure.


    # 3.1 Syntax


    The syntax for structure is:


    ```

    (structure attrib1 [mod1] vali attrib2 [mod2] val2 ..)

    ```


    where:


    +   o attrib1 is one of the exceptible structure attributes (see below).


    +   o modi is the optional modifier on that attribute¹.


    +   o vali is the value to be associated with that attribute.


    All of the attributes are optional.


    > 1. Some attributes take on modifiers that specify how their values will be inherited.
    Attribute modifiers are covered in the chapter on Structural Inheritance.'
  - '[PAGE 32]


    3 July 1984


    # 3.2 Structure Attributes


    Although all structure attributes (and field attributes for that matter) have
    default values, and thus, need not be specified, the actual value that the attributes
    will take on depend on the "lineage"1 of the structure. While this point is covered
    more completely in the section on structure inheritance, it should be pointed
    out here that the default values mentioned below are in fact affected by the lineage
    of the structure.


    # 3.2.1 type


    The value of the type attribute specifies the underlying LISP structure that will
    be used to create an instance of this structure. The allowable values are:


    +   - list (The default) The fields in a structure of type list are stored as
    elements in a list.


    +   - a-list The value for a field is stored as the value of key <field> (whatever
    the name of the field is in) in an association list. For example, if a structure
    has the foo with the value bar and the field dog with the value cat, the a-list
    might look like:


    ```

    ((foo . bar) (dog . cat) . .)

    ```


    +   - p-list Values are stored as the value of indicator <field> in a disembodied
    property list2. If the fields and values above were in a structure of p-list,
    it might look like:


    +   1. The lineage of a structure is the set of structures that have been inherited,
    along with the lineage of each of the respective structures in that set.

    2. A disembodied property list is one which is not accessed (referenced) as the
    property list sub-part of a symbol.


    - 24 -'
  - '[PAGE 33]


    3 July 1984


    (foo bar dog cat . . .)


    4. array The value of a field is stored in the array element which has been mapped
    to that field. Using the same example, we might have an array which looks like:


    ```

    ------+-------+

    | bar |

    +-------+

    | cat |

    +-------+-

    ```


    5. hunk The value of a field is stored in the hunk element which has been mapped
    to that field. Using the Franz notation for hunks we might have something like:


    ```

    {bar cat}

    ```


    6. hash Hash structures are quite different from the other structures supported
    by CADRS¹. A major difference is that field values are stored (hashed) in a separate
    structure in which field values are accessed using the form itself as the key.
    Thus, once a hash structure is defined, any LISP structure (lists, symbols, arrays,
    CADRS structures etc), ''have'' the field mentioned in the hash structure. Another
    difference is that hash structures can not be created (using the create function),
    since the ''creation'' is done when the structure is defined.


    One of the most significant uses of hash structures is to extend existing structures.
    The following example illustrates both hash structures and the technique for extending
    structures².


    +   1. The Franz version of CADRS provides the necessary functions to support
    the hash type. Hash structures are covered in detail below.

    2. Since this example uses functions that are described later in the manual, it
    might be worth your while to skip it for now, and come back to it later.'
  - "[PAGE 34]\n\n3 July 1984\n\nConsider the following structure:\n\n```\n(structure\
    \ some-data type hunk\n  fields ((declare f1 is-a foo)\n  (declare f2 is-a bar)\n\
    \  f3\n  f4\n  (declare f5 is-a foobar))\n)\n```\n\nIf we had a large network\
    \ built using instances of some-datas and then discovered a need to add field\
    \ f6, the only recourse (with out using hash structures) would be to unload all\
    \ of the items and start from scratch1.\nIf we define a hash structure:\n\n```\n\
    (structure add-the-field type hash\n  fields ((declare f6 default nil)))\n```\n\
    \nand then redefine the some-data structure as:\n\n```\n(structure some-data type\
    \ hunk\n  fields ((declare f1 is-a foo)\n  (declare f2 is-a bar)\n  f3\n  f4\n\
    \  (declare f5 is-a foobar)\n  (declare link is-a add-the-field))\n```\n\nthen\
    \ all of existing some-data instances will now have a field f6 since for any some-data\
    \ instance sd:\n\n```\n(replace sd link f6 100) => (putash sd 100 f6)\n```\n\n\
    (f6 is the hasharray used).\n\n+   1. Even if some-data a list, it would be necessary\
    \ to 'cons' on the extra space for the field."
  - '[PAGE 35]


    3 July 1984


    # 3.2.2 fields


    The fields attribute defines the different data items that comprise the structure
    being defined. The default for the fields attribute is nil which means ''no fields''.


    The value of fields, called the field-list, is a list of the fields in the structure.
    This list serves two purposes. The first, obviously, is to define the fields.
    The second is to define the position of the field within any structure of type
    list, array, or hunk. For list structures, this list can contain sublists which
    serve to define the embedded lists within the toplevel structure. As structure
    definitions, each of the fields have attributes with associated modifiers and
    values. The specification of these are discussed in the following chapter.


    # 3.2.2.1 examples


    The following examples show how the different field-lists are handled in different
    structures.


    +   1. (structure name type list fields (last first mi))

    If foo is an instance of a name structure then:


    ```

    (car foo) => last

    (cadr foo) => first

    (caddr foo) => mi

    ```


    +   1. For compatibility, embedded field-lists are allowed for all types. For
    other than list, the field list is processed as if it were linear.'
- md: "\n2. If the type of the name structure (in the previous example) were a-list\
    \ then:\n\n```\n(cdr assq 'last foo) => last\n(cdr assq 'first foo) => first\n\
    ```\n\n3. If name was of type hunk then:\n\n```\n(cxr 0 foo) => last\n(cxr 1 foo)\
    \ => first\n```\n\n4. (structure bar type list fields ((a b) ((c) d) . e))\nIf\
    \ foo is an instance of a bar then:\n\n```\n(caar foo) => a\n(caadr foo) => c\n\
    (cddr foo) => e\n```\n\n5. If bar were of type array then:\n\n```\n(funcall foo\
    \ 0) => a\n(funcall foo 3) => c\n(funcall foo 5) => e\n```\n\n## 3.2.3 create\
    \ related attributes\n\nThe following attributes control what happens when an\
    \ instance of the structure is created.\n\n### 3.2.3.1 to-create\n\nThe to-create\
    \ attribute is used to \"advise\" the create function of how to create an instance\
    \ of the structure being defined. The value of the attribute is a form which,\
    \ when evaluated, returns an instance of the structure. By default, the structure\
    \ function builds such a form which, in most instances, will be at least as efficient\
    \ as the user-defined form.\n\nThe following example shows how the to-create attribute\
    \ is used:\n\n```\n(structure name type list\n  fields (last first mi)\nto-create\
    \ (list nil nil nil))\n```\n\nWhen create is called to create a name, it will\
    \ evaluate the expression (list nil nil nil), which returns (nil nil nil).\n\n\
    ### 3.2.3.2 before-creating\n\nThe value of the before-creating attribute is a\
    \ form which is to be evaluated before an instance of the structure is created.\
    \ By default, no such form is generated.\n\nIf before-creating is used as in:\n\
    \n```\n(structure foo\n  fields (a b c)\n  before-creating (bar))\n```\n\nthen\
    \ create will return the result of a form similar to:\n\n3 July 1984\n\n```\n\
    (progn\n  (bar)\n  <<create-form>))\n```\n\nwhere <create-form> is the form that\
    \ will create the instance.\n\n### 3.2.3.3 after-creating\n\nThe after-creating\
    \ attribute specifies a form to be evaluated after the instance of the structure\
    \ is created. By default, no such form is generated.\n\nThe created instance is\
    \ bound to the atom *datum* which may be referenced in the form. This feature\
    \ can be useful in tracking the instance, and/or in modifying the instance after\
    \ it is created. For example, when a structure such as:\n\n```\n(structure foo\n\
    \  fields (a b c)\n    after-creating (progn\n      (print datum)\n      (terpri)))\n\
    ```\n\nis created, create will evaluate a form similar to:\n\n```\n(let ((datum\
    \ <<create-form>))\n  (progn\n    (print datum)\n    (terpri)))\n```\n\n3 July\
    \ 1984\n\n## 3.2.4 Structure typing\n\nThe following attributes control how CADRS\
    \ determines the type of a structure instance.\n\n### 3.2.4.1 type?\n\nThe **type?**\
    \ attribute is used to tell CADRS how to identify a LISP entity as being an instance\
    \ of the structure being defined. Although CADRS can do structure typing, the\
    \ feature only works with instances created using the create function. The **type?**\
    \ attribute provides greater control over how 'typing' is accomplished.\n\nThe\
    \ value of the **type?** attribute is a lambda-expression or function of one argument\
    \ which returns t if the argument is an instance of the structure being defined,\
    \ and nil otherwise. The following is an example of the use of the **type?**\n\
    \n```\n(structure name type list\nfields (last first mi)\ntype? name-type?)\n\n\
    defun name-type? (struct)\n  (and dtpr struct)\n  (eq (length struct) 3))\n```\n\
    \n### 3.2.4.2 typecheck\n\nThe **typecheck** attribute is used to direct CADRS\
    \ to typecheck all instances of the structure. By default, typechecking is only\
    \ turned on for a structure when it contains a field whose definition conflicts\
    \ with that of a field by the same name in\n\n3 July 1984\n\nanother structure.\
    \ If the value of typecheck is t, then type checking will be done by CADRS for\
    \ all instances of the structure.\n\nCADRS generated typing and a user supplied\
    \ typing form (value of type?) can both be enabled for a structure. The reason\
    \ for doing this is to allow typing to occur on more than one level. This concept\
    \ is explained in greater detail in the chapters that follow.\n\n## 3.2.5 is-a\n\
    \nThe is-a attribute allows the structure to inherit the definitions of one or\
    \ more previously defined structures. This attribute is restricted in that it\
    \ must appear as the first attribute used in the call to structure.\n\nIf the\
    \ value of the is-a attribute is an atom, the structure will inherit the definition\
    \ of the structure named by the atom. If the value is a list, then each of atoms\
    \ in the list are taken to be previously defined structures whose definitions\
    \ will be inherited in the order that they were specified.\n\nThe effect of is-a\
    \ is covered completely in the chapter on Structural Inheritance.\n\n## 4 - Field\
    \ Definition\n\nCADRS provides a high degree of control over the field level definition\
    \ of the structure using the same basic attribute/attribute value syntax as used\
    \ on the structure wide level. This chapter provides the details of field declaration\
    \ specific to the field-list (the value of the field attribute) and the mechanism\
    \ for specifying field attribute values.\n\n## 4.1 Field-list specification\n\n\
    In general a field-list is any valid list in which the following is true:\n\n\
    - Each item in the list (a field) is unique within that list (i.e. within structure).\n\
    - The list is acyclic (i.e. it terminates).\n\nThe following are examples of valid\
    \ field-lists:\n\n1. (a b c)\n2. (a . b)\n\nThe first example shows a typical\
    \ field-list. In the second example, field a would be mapped to the car of the\
