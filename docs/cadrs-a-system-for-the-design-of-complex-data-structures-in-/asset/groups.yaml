    3 July 1984


    # 2 - CADRS Reference


    # 2.1 Introduction


    The next 10 chapters are devoted to an in depth treatment of the various features
    of CADRS. As memntioned, these chapters are intended to serve as a reference manual
    for version 1.00 of the CADRS package and its implementation under Franz Lisp
