  - "[PAGE 56]\n\n# 5.3 Field Initialization\n\nWhen create encounters a (field .\
    \ expr) pair, the value of the expression is used as the initial value for the\
    \ field. Consider the following structure definition and create call:\n\n```\n\
    (structure team\n  fields (name town coach standing))\n\n(create team\n  (name\
    \ . 'Eagles)\n  (town . 'Philadelphia)\n  (coach . 'Vermeil)\n  (standing . 1))\n\
    ```\n\nThe form that create will actually evaluate is:\n\n```\n(list 'Eagles 'Philadelphia\
    \ 'Vermeil 1)\n```\n\nCADRS pays attention to the order in which field evaluations\
    \ are specified so that side effects from the evaluation of any of the expressions\
    \ will produce the 'desired' effect. Consider the following example:\n\n```\n\
    (let ((na 'Cowboys) (to nil)\n  (co 'Landry) (st 2))\n  (create team\n    (name\
    \ . prog2)\n    (coach . (setq to 'Dallas)\n      co))\n  (town to)\n  (standing\
    \ . st)))\n```"
