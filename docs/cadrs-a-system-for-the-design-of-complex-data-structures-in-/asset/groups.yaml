    # CADRS: 一种用于LISP复杂数据结构设计的系统


    # 摘要


    本论文描述了一个旨在为 LISP 设计并实现数据抽象设施的项目。该项目的成果 CADRS（一种与结构无关的数据访问编译器）系统，支持对混合数据/过程结构的定义、创建和高效操纵，这些结构非常类似于
    Simula [2] 和 Smalltalk 等语言中的类对象。


    # 注释


    宾夕法尼亚大学计算机与信息科学系技术报告编号：MS-CIS-83-19。


    # CADRS: 一种用于LISP复杂数据结构设计的系统


    Richard J. Duncan

    MS-CIS-83-19


    计算机与信息科学系

    Moore 学院/D2

    宾夕法尼亚大学

    宾夕法尼亚，宾夕法尼亚州 19104


    1984年7月


    # MS-CIS-83-19


    # 宾夕法尼亚大学

    摩尔电气工程学院

    工程与应用科学学院


    # CADRS

    一种用于LISP复杂数据结构设计的系统


    Richard J. Duncan


    宾夕法尼亚州，宾夕法尼亚


    1984年7月


    这是一篇提交给宾夕法尼亚大学工程与应用科学学院的论文，旨在满足计算机与信息科学研究生工程硕士学位的学位要求。


    Timothy W. Finin, 导师


    O. Peter Buneman, 研究生小组主席


    - 1 -


    # 致谢


    我要感谢许多人对这项工作所提供的帮助。首先，最感谢我的导师 Timothy W. Finin 博士，他在 CADRS 设计理念形成方面提供了无价的帮助，并对这项工作付出了持久的热情；感谢研究生系的教师和学生们，在需要答案时总是敞开大门，特别是
    Marty Borowski 花时间校对校稿；最后，感谢我的家人和朋友的支持。


    1984年7月3日


