    ```\n(structure person\n  fields ((declare name is-a name)\n    age\n    sex))\n\
    \n(defun type?-women (form list structure)\n  (if and\n      (eq structure 'women)\n\
    \          (memq 'person (type form))\n      then (ncons (eq (fetch form sex)\
    \ 'female))\n      else nil))\n```\n\n```\n(establish cadrs-except-type?-nostruc\
    \ 'type?-women)\n(type? (create person (sex .female) (woman)) => t\n```\n\nNote\
