    \ CADRS will lambda-bind datum and newvalue to the obvious values as shown below:\n\
    \n```lisp\n(structure str\n  fields((declare a\n    after-replacing (foo datum\
    \ newvalue)))\n\n(replace a-str a 10) =>(let\n  ((datum-str)\n  (newvalue 10)\n\
    \  (%%ret (rplaca datum newvalue))\n  (foo datum newvalue)\n  %%ret))\n```\n\n\
    ## 4.3.4 type\n\nThe value of the type attribute dictates whether or not the field\
    \ will have storage allocated for it within the structure. If the value of type\
    \ is physical (the default), then a storage cell, e.g. a list cell in a list structure),\
    \ will be allocated for the field. If the value is virtual then no storage is\
    \ allocated.\n\n3 July 1984\n\nThis feature is useful when a field is defined\
    \ in terms of other fields within the structure as in:\n\n```lisp\nstructure employee\n\
    \  fields ((declare name is-a-name)\n    wage\n    hours-worked\n    (declare\
    \ type\n      virtual))\n```\n\nIf an instance of employee, as above, has a wage\
    \ of 10 and hours-worked of 20, then the call:\n\n```lisp\n(fetch employee wage)\n\
    ```\n\nwould return 10. It is important to realize that if a field is virtual\
    \ then no storage is allocated for it.\n\n3 July 1984\n\n## 4.3.4.1 must-be\n\n\
    The value of the must-be attribute provides a means to check validity. By default\
    \ no such checking is done. The expression is evaluated within a context in which\
    \ the structure instance and the value to be checked are lambda-bound to datum\
    \ and newvalue respectively. An example of this must-be is shown below:\n\n```lisp\n\
    (structure student\nfields ((declare name is-a-name)\n  wage\n  hours-worked\n\
    \  (declare must-be\n    (check grade datum newvalue))))\n```\n\n```lisp\n(replace\
    \ student grade 99)\n  --evaluate as--\n```\n\n```lisp\n(let ((datum student)\
    \ (newvalue 99))\n  (must-be 'grade datum newvalue)\n  (rplaca datum newvalue))\n\
    ```\n\nIn the example, must-be might be considered as some function that would\
    \ record the validity of the replace.\n\n3 July 1984\n\nThe value of the hash-size\
    \ attribute specifies the size of the array CADRS will allocate for the field.\
    \ This attribute is meaningful only for fields of type hash.\n\n- 45 -\n\n## 5\
    \ create Structure Creation\n\nThe create function is used to create an instance\
    \ of a structure. It has a syntax similar to the structure function, maintaining\
    \ the same flexibility, and including the following features:\n\n- The ability\
    \ to provide an initial value for all fields.\n- The ability to create a copy\
    \ of another structure.\n- The ability to use a structure instance in the creation.\n\
    - The ability to 'reinitialize' a structure instance.\n\nAside from the above,\
    \ another reason for using create is that it allows the base type of a structure\
    \ to change (e.g. from a list to a hunk), with no change to any of the functions\
    \ that use it.\n\n### 5.1 Syntax\n\nThe syntax for create is:\n\n> 1. Obviously,\
    \ if you don't use theRS fetch, replace and/or to-fetch/to-replace expressions,\
    \ this will not be true.\n\n```lisp\n(create structure\n[cr-attrib struc-instance]\n\
    \  [(field-name1 . expr1)]\n  [(field-name2 . expr2)]\n  .\n  [(field-namen .\
    \ exprn))\n```\n\nwhere:\n\n- structure - Is the name of the structure instance\
    \ to create.\n- cr-attrib - or create attribute, is one of using, copying or smashing.\
    \ Unlike structure or field attributes, attributes for create are mutually exclusive.\
    \ That is, a create with the using attribute cannot have the copying attribute\
    \ etc.\n\nThe value of a create attribute is a structure instance to be used in\
    \ the creation process. Create attributes are discussed below.\n\n- field-namen\
    \ - Is the name of a field to be initialized to the value of exprn. Field initialization\
    \ is discussed below.\n\n### 5.2 Notes on Structure Creation\n\nThe following\
    \ should be kept in mind when structures are created:\n\n- 1. The structure being\
    \ created and the structure type of the instance 'used' must be the same. This\
    \ is a limitation of version 1.00.\n- 2. When a field is given an initial value,\
    \ it is just as if the default attribute for that field is the value specified.\
    \ Therefore, if the field has either to-fetch, before-fetching, after-fetching,\
    \ or must-be attributes, their effects are ignored at this point.\n"
  mdcn: "\n\n1984年7月3日\n\n此处正在获取的结构实例。因此，如果评估了获取 (fetch s a)，CADRS 将评估表达式 (cdr s)\
    \ 以执行获取。\n\n## 4.3.3.2 to-replace（替换）\n\nto-replace 字段属性对应于在字段中存储值时所使用的 to-fetch。与\
    \ to-fetch 类似，该属性的值可以是一个 lambda 表达式，也可以是一个表达式。然而，在这种情况下，lambda 必须接受两个参数；第一个是要执行替换的操作的形式，第二个是用于替换旧值的新值。接下来的示例展示了如何操作：\n\
    \n```lisp\nstructure struct\nfields ((declare a\n  to-fetch (lambda (form val))\n\
    \  (list 'replace form val))))\n```\n\n```lisp\n(replace a-struct-instance 'this-new-value)\n\
    \  --评估为--\n```\n\n```lisp\n(replaced a-struct-instance 'this-new-value)\n```\n\
    \n1984年7月3日\n\n与 **to-fetch** 一样，如果表达式不是 lambda，CADRS 假设它将用于“展示” CADRS 如何替换结构实例中字段的值。与之前一样，如果\
    \ CADRS 在表达式中找到原子 **datum**，它将被替换为正在执行替换的结构实例。同样，如果 CADRS 在表达式中找到原子 **newvalue**，它将被替换为调用\
    \ **replace** 时指定的值。下文展示了这是如何发生的。\n\n```lisp\n(structure struct\n  fields ((declare\
    \ a\n    to-fetch (replace datum newvalue))))\n(replace asi asi 10) => (replace\
    \ asi 10))\n```\n\n## 4.3.3.3 before-fetching（获取前处理）\n\n**before-fetching** 字段属性的值是在对字段执行获取之前要评估的形式。默认情况下，没有此类形式被评估。CADRS\
    \ 将在一个上下文中评估表达式，在该上下文中结构实例被 lambda 绑定到 **datum**。下例展示了一个示例：\n\n1984年7月3日\n\n```lisp\n\
    (structure struct\nfields ((declare a\nbefore-fetching (note-fetch 'a datum)))\n\
    \n(fetch as a)\n--将评估为 as-\n\n(let ((datum))\n(note-fetch 'a datum)\n(car datum)))\n\
    ```\n\n在示例中，note-fetch 可能被视为某个记录获取实例的函数。\n\n## 4.3.3.4 before-replacing（替换前处理）\n\
    \nbefore-replacing 字段属性的值是在对字段执行替换之前要评估的形式。默认情况下，没有此类形式被评估。该表达式在一个上下文中评估，其中结构实例和要替换当前字段的值分别被\
    \ lambda 绑定到 datum 和 newvalue。下例展示了一个示例。\n\n1984年7月3日\n\n```lisp\n(structure struct\n\
    fields ((declare a\n  before-replacing\n  (note-replace\n    'a\n    datum\n \
    \   newvalue))))\n```\n\n```lisp\n(replace asi a 10)\n\n--将评估为--\n```\n\n```lisp\n\
    (let ((datum asi) (newvalue 10))\n  (note-replace 'a datum newvalue)\n  (rplaca\
    \ datum newvalue))\n```\n\n在示例中，note-replace 可能被视为某个记录替换实例的函数。\n\n## 4.3.3.5 after-fetching（获取后处理）\n\
    \nafter-fetching 字段属性的值是在从形式中获取值后要评估的表达式。默认情况下，获取形式是最后一个被评估的表达式。CADRS 将正在执行获取的结构实例和获取到的值分别\
    \ lambda 绑定到 datum 和 value，如下所示：\n\n```lisp\n(structure str\nfields ((declare\
    \ a\n  after-fetching (foo datum value))))\n```\n\n```lisp\n(fetch a-str a) =>\
    \ (\n  ((datum a-str)\n  (value (car datum))\n  (foo datum value)\n  value))\n\
    ```\n\n- 41 -\n\n## 4.3.3.6 after-replacing（替换后处理）\n\nafter-replacing 字段属性的值是在形式中字段值替换后要评估的表达式。默认情况下，替换形式是最后一个被评估的表达式。CADRS\
    \ 将 datum 和 newvalue 绑定到显而易见的值，如下所示：\n\n```lisp\n(structure str\n  fields((declare\
    \ a\n    after-replacing (foo datum newvalue)))\n\n(replace a-str a 10) =>(let\n\
    \  ((datum-str)\n  (newvalue 10)\n  (%%ret (rplaca datum newvalue))\n  (foo datum\
    \ newvalue)\n  %%ret))\n```\n\n## 4.3.4 type（类型）\n\ntype 属性的值决定了结构内部是否为字段分配存储。如果\
    \ type 的值为 physical（物理的，默认值），则将为字段分配一个存储单元（例如列表结构中的列表单元格）。如果值为 virtual（虚拟的），则不分配存储。\n\
    \n1984年7月3日\n\n当字段根据结构内部的其他字段进行定义时，此功能非常有用，例如：\n\n```lisp\nstructure employee\n\
    \  fields ((declare name is-a-name)\n    wage\n    hours-worked\n    (declare\
    \ type\n      virtual))\n```\n\n如果如上所示的 employee 实例 wage 为 10，hours-worked 为 20，那么调用：\n\
    \n```lisp\n(fetch wage)\n```\n\n将返回 10。要注意，如果字段是 virtual，则不分配存储。\n\n## 4.3.4.1\
    \ must-be（强制检查）\n\nmust-be 属性的值提供了检查合法性的手段。默认情况下不进行此类检查。该表达式在一个上下文中评估，其中结构实例和要检查的值分别被\
    \ lambda 绑定到 datum 和 newvalue。下例展示了一个示例：\n\n```lisp\n(structure student\nfields\
    \ ((declare name is-a-name)\n  wage\n  hours-worked\n  (declare must-be\n    (check\
    \ datum newvalue))))\n```\n\n```lisp\n(replace student 99)\n  --评估为--\n```\n\n\
    ```lisp\n(let ((datum student) (newvalue 99))\n  (must-be 'grade newvalue)\n \
    \ (rplaca datum newvalue))\n```\n\n在示例中，must-be 可能被视为某个记录替换的函数。\n\n## 4.3.4.2\
    \ hash-size（哈希大小）\n\nhash-size 属性的值指定了 CADRS 为字段分配的数组。对于类型为 hash 的字段有意义。\n\n-\
    \ 45 -\n\n## 5 create 创建结构\n\ncreate 函数用于创建一个结构实例。它的语法与 structure 函数相似，保持了相同的灵活性，并包含以下功能：\n\
    \n- 为所有字段提供初始值。\n- 创建另一个结构的副本。\n- 在创建时使用结构实例。\n- “重新初始化”结构实例。\n\n除了上述之外，使用 create\
    \ 的另一个原因是允许结构的基础类型发生变化（例如变为 hunk），而无需更改任何使用它的函数。\n\n### 5.1 语法\n\ncreate 的语法为：\n\
    \n> 1. 显然，如果不使用 fetch、replace 以及 to-fetch/to-replace 表达式，这将不成立。\n\n```lisp\n(create\
    \ structure\n[cr-attrib struc-instance]\n  [(field-name1 . expr1)]\n  [(field-name2\
    \ . expr2)]\n  .\n  [(field-namen . exprn))\n```\n\n其中：\n\n- structure 是要创建的结构实例名称。\n\
    - cr-attrib 或创建属性，是 using、copying 或 smashing 之一。创建属性是互斥。也就是说，具有使用属性的 create 不能有复制属性等。\n\
    \n创建属性的值是在创建过程中使用的结构实例。创建属性见下文。\n\n- field-namen 是要初始化为 exprn 的字段名称。字段初始化见下文。\n\
    \n### 5.2 创建结构的注意事项\n\n在创建结构时，应注意以下几点：\n\n- 1. 创建的结构和被“使用”的实例结构类型必须相同。这是 1.00\
    \ 版本的局限性。\n- 2. 当字段赋予初始值时，就像该字段的默认属性是指定的值一样。因此，如果字段具有 to-fetch、before-fetching、after-fetching\
    \ 或 must-be 属性，它们的影响在此时会被忽略。\n\n"
