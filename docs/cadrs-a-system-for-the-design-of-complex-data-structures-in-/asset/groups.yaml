  - '[PAGE 21]


    # 1.5.1 DEFSTRUCT


    The DEFSTRUCT package is a structure definition tool that runs under PDF10 and
    Multics MacLisp and on LispMachines. It has many of the capabilities of CADRS
    and extendible.


    Both of the packages provide a variety of choices for the underlying LISP structure
    to be used when an instances is created. The CADRS implementation of list structures
    is slightly more powerful since it allows the user to specify the exact format
    of the list (in terms of embedded sublists and using the last cdr of a cons cell
    to hold a value). The choices provided by DEFSTRUCT are a linear list or a balanced
    tree.'
