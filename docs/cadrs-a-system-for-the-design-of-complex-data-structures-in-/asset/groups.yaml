- md: "\n## 1.5.1 DEFSTRUCT\n\nThe DEFSTRUCT package is a structure definition tool\
    \ that runs under PDF10 and Multics MacLisp and on LispMachines. It has many of\
    \ the capabilities of CADRS and extendible.\n\nBoth of the packages provide a\
    \ variety of choices for the underlying LISP structure to be used when an instances\
    \ is created. The CADRS implementation of list structures is slightly more powerful\
    \ since it allows the user to specify the exact format of the list (in terms of\
    \ embedded sublists and using the last cdr of a cons cell to hold a value). The\
    \ choices provided by DEFSTRUCT are a linear list or a balanced tree.\n\n3 July\
    \ 1984\n\nA drawback in the DEFSTRUCT scheme is that a field, or slot as it is\
    \ called in DEFSTRUCT, can not be explicitly declared to be an instance of another\
    \ structure. The difference is illustrated in the following example.\n\n```common\n\
    --CADRS definition of 'name' and 'person'\n(structure name fields (last first\
    \ . mi))\n(structure person type array)\n  fields ((declare name is-name) age\
    \ sex))\n\n(fetch a-person name first)\n\n(create\n  (age . 24) (sex . 'Male)\n\
    \  ((name last) . 'Duncan) ((name first) . 'Richard\n  ((name mi) . 'J))\n\n--DEFSTRUCT\
    \ definition of 'name' and 'person'\n(defstruct (name (type list*))\n  last first\
    \ mi)\n(defstruct (person (type array))\n  name age sex)\n\n(name (person a-person))\n\
    \n(make-person age 24 sex 'Male name 'Duncan Richard . J)\n```\n\nThe access to\
    \ the different fields/slots (and subfields/subslots) in the person structure\
    \ are identical. The problem lies in the fact that DEFSTRUCT has no way of knowing\
    \ that the name slot in the person structure is defined as a name structure. as\
    \ a result, the slot must be initialized (with a list), rather than initializing\
    \ each of the sublots. This is a potential source of problems if the underlying\
    \ structure of the name structure were to change to (array, for instance).\n\n\
    While both packages allow one structure to include another's definition (the is-a\
    \ structure attribute in CADRS and the include option in DEFSTRUCT), the DEFSTRUCT\
    \ version is much less flexible. The include option can only be used on structures\
    \ with certain underlying types and only the slot initialization expression may\
    \ be changed from their original values. In CADRS, any of the structure or field\
    \ attributes may be changed or modified, and any structure type may be inherited.\n\
    \n3 July 1984\n\nThe **create** function provided by CADRS supports the combined\
    \ functionality of the make-x and **alter-x** macros defined by DESTRUCT¹. In\
    \ addition, **create** supports many other features (needed for compatibility\
    \ with the INTERLISP Record Package) such as:\n\n- **create** can be told to smash\
    \ (like alter), use the top-level structures of, or copy the top-level structures\
    \ of another structure in the creation of an instance.\n- **create** preserves\
    \ the order of evaluation of any field initializations provided. To illustrate\
    \ this, consider the structure and create expression:\n\n```common\n(structure\
    \ test-init fields (a b c d e f))\n(create test-init (e . 10) (f . 20) (d . 30)\
    \ (b . 40) (c . 50) (a . 60))\n```\n\nThe form that would be evaluated to satisfy\
    \ the order of evaluation given be:\n\n```common\n((lambda ($ss $$f $$sd $$bb\
    \ $$sc)\n(list a $$bb $$sc $$sd $$se $$ff))\n10 20 30 40 50)\n```\n\n- 1. Where\
    \ **x** is the name of one of the structures currently defined.\n\n3 July 1984\n\
    \nA number of features in CADRS are not directly available in DEFSTRUCT, but could\
    \ conceivably be implemented using DEFSTRUCT’s extension capabilities. These features\
    \ are enumerated below:\n\n- 1. There is no way to validate a new slot value when\
    \ a slot value is changed.\n- 2. All slot names must be unique (i.e. no typing)\n\
    - 3. There is no procedural attachment for structure creation or slot access.\n\
    - 4. Virtual fields (slots) are not supported.\n\n## 1.5.2 INTERLISP Record Package\n\
    \nSince the design of CADRS is based on that of the INTERLISP Record Package (ILRP),\
    \ the two share much in common. There is a large intersection of underlying structure\
    \ types that are supported by each¹. The functions used for instance creation\
    \ and structure access are, for the most part identical.\n\nThe ILRP can specify\
    \ substructures local to the structure² being defined -- a mechanism not supported\
    \ in the current version of CADRS. For example, one could define a message as:\n\
    \n```common\n(record msg ((from . to) mess) (record msg (header . body)))\n```\n\
    \nThis provides a means of accessing either the entire mess field or one of its\
    \ components without having to define a separate mess record, as would be required\
    \ in CADRS. In addition, the ILRP allows a field to have more than one such definition.\n\
    \n- 1. The disjoint sets are composed of those types that cannot be implemented\
    \ in the host LISP.\n- 2. ILRP structure are called records.\n\n3 July 1984\n\n\
    Each of the two packages support an instances typing mechanism, albeit the two\
    \ differ greatly in how. The ILRP determines the type of form using a predicate\
    \ that checks the object was an instance. Consider the following:\n\n```common\n\
    (record foo (a b c d) e)\n```\n\nTo determine if x was an instance of, the network\
    \ based uses:\n\n```common\n(and (listp x) (length x) (caddr x)) (listp x))))\n\
    ```\n\nCADRS does not share the ability to include another's definition. This\
    \ might be accomplished to some degree through the use of user defined type².\n\
    \n- 1. The INTERLISP Record Package is somewhat\n- is-a in CADRS\n\n3 July 1984\n\
    \nSome of the facets of the message facility of GLISP objects can be mimicked\
    \ in CADRS using the **replace** function in conjunction with the **to-replace**\
    \ field attribute. The major limitation would be that the messages could only\
    \ have one argument. The operator overloading could not be duplicated without\
    \ rewriting the necessary functions (in effect to perform the work of the GLISP\
    \ compiler).\n\n## 1.5.3 GLISP\n\nGLISP is a strongly typed object oriented language\
