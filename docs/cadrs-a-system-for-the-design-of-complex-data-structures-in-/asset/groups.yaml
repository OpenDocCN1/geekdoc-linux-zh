    `before-creating` 属性的值是一个在创建结构实例之前要被求值的表达式。默认情况下，不会生成此类表达式。\n\n如果如例所示使用 `before-creating`：\n\
    \n```\n(structure foo\n  fields (a b c)\n  before-creating (bar))\n```\n\n那么 `create`\
    \ 将返回一个类似于下面的表达式的结果：\n\n1984年7月3日\n\n```\n(progn\n  (bar)\n  <<create-form>))\n\
    ```\n\n其中 `<create-form>` 是将创建实例的表达式。\n\n### 3.2.3.3 after-creating\n\n`after-creating`\
    \ 属性指定了一个在结构实例创建后求值的表达式。默认情况下，不会生成此类表达式。\n\n创建的实例将绑定到原子 *datum*，该原子可以在表达式中被引用。此功能对于跟踪实例和/或在实例创建后对其进行修改非常有用。例如，当如下所示的结构：\n\
    \n```\n(structure foo\n  fields (a b c)\n    after-creating (progn\n      (print\
    \ datum)\n      (terpri)))\n```\n\n被创建时，`create` 将求值一个类似于下面的表达式：\n\n```\n(let\
    \ ((datum <<create-form>))\n  (progn\n    (print datum)\n    (terpri)))\n```\n\
    \n1984年7月3日\n\n## 3.2.4 结构类型检查\n\n以下属性控制 CADRS 如何确定结构实例的类型。\n\n### 3.2.4.1 type?\n\
    \n**type?** 属性用于告诉 CADRS 如何识别一个 LISP 实体是否为正在定义的结构实例。尽管 CADRS 可以进行结构类型检查，但该功能仅适用于使用\
    \ `create` 函数创建的实例。**type?** 属性对如何实现“类型检查”提供了更大的控制。\n\n**type?** 属性的值是一个 lambda\
    \ 表达式或接受一个参数的函数，如果参数是正在定义的结构的实例，则返回 `t`，否则返回 `nil`。以下是 **type?** 的使用示例：\n\n```\n\
    (structure name type list\nfields (last first mi)\ntype? name-type?)\n\ndefun\
    \ name-type? (struct)\n  (and dtpr struct)\n  (eq (length struct) 3))\n```\n\n\
    ### 3.2.4.2 typecheck\n\n**typecheck** 属性用于引导 CADRS 对结构的所有实例进行类型检查。默认情况下，只有当结构包含一个字段，其定义与另一个结构中同名字段定义冲突时，才会对该结构开启类型检查。\n\
    \n1984年7月3日\n\n如果 `typecheck` 的值为 `t`，则 CADRS 将对结构的所有实例进行类型检查。\n\nCADRS 生成的类型检查和用户提供的类型检查表达式（`type?`\
    \ 的值）都可以对某个结构开启。这样做的原因是允许类型检查在多个层级上进行。这一概念在随后的章节中会有详细解释。\n\n## 3.2.5 is-a\n\n\
    `is-a` 属性允许结构继承一个或多个之前定义的结构的定义。该属性受到限制，它必须作为调用 `structure` 时第一个使用的属性。\n\n如果 `is-a`\
    \ 属性的值是一个原子，则该结构将继承由原子命名的结构的定义。如果值是一个列表，则列表中的每个原子都被视为之前定义的结构，它们的定义将按照它们指定的顺序被继承。\n\
    \n`is-a` 的作用在“结构继承”章节中得到了完全介绍。\n\n## 4 - 字段定义\n\nCADRS 使用与结构级级别相同的相同属性/属性值语法，对结构的字段级定义提供了高程度的控制。本章提供了特定于字段列表（`field`\
    \ 属性的值）的字段声明细节，以及指定字段属性的机制。\n\n## 4.1 字段列表规范\n\n通常情况下，字段列表是任何满足以下条件的有效列表：\n\n\
    - 列表中的每一项（字段）在结构内部内是唯一的。\n- 列表是非环的（即它是会终止的）。\n\n以下是有效字段列表的示例：\n\n1. (a b c)\n\
    2. (a . b)\n\n第一个示例显示了一个典型的字段列表。在第二个示例中，字段 `a` 将映射列表的 `car`（假设结构类型为列表），而字段 `b`\
    \ 将映射列表的 `cdr`。在第三个示例中，点用于在列表中预留空间（类似于 COBOL）。\n\n- 1. 与结构属性一样，某些字段属性可以指定这些属性如何被继承。字段属性在“结构继承”章节中介绍。\n\
    \n1984年7月3日\n\n(b c) . d)\n\n## 4.3 字段属性\n\n未指定属性时，属性的实际值取决于结构的血系。以下字段属性控制 CADRS\
    \ 如何执行字段访问以及对该过程的“自定义”。默认情况下，CADRS 为每个字段计算访问和存储函数。\n\n- 1. 这些函数通常与下面描述的 `to-fetch`\
    \ 和 `to-replace` 字段属性配合使用以增强过程。\n\n## 4.3.3 fetch 和 replace 定义\n\n用于返回字段值和向字段存值的\
    \ CADRS 函数分别是 `fetch` 和 `replace`。\n\n### 4.3.3.1 to-fetch\n\n`to-fetch` 字段属性的值可以是两种形式之一。如果是一个\
    \ lambda 表达式，CADRS 假设当对 fetch 中指定的结构实例进行求值时，它将返回获取字段的正确表达式，类似于宏体。默认情况下，CADRS 生成此形式：\n\
    \n```\n(structure a-structure\n    fields ((declare a\n        to-fetch (lambda\
    \ form) (list 'car form))))\n```\n\n如果调用 `fetch` 来获取结构实例 `s` 的字段，如下：\n\n```\n\
    (fetch s a)\n```\n\nlambda 将带参数 `s` 进行求值并返回：\n\n```\n(car s)\n```\n\n如果表达式不是 lambda，CADRS\
    \ 假设它被用于“展示” CADRS 如何从结构实例获取字段。例如，考虑以下结构：\n\n```\n(structure a-structure\n   \
    \ fields ((declare a to-fetch (cdr datum))))\n```\n\n`to-fetch` 字段属性值中的原子 `datum`\
    \ 指导 CADRS 插入\n\n"
