  - '[PAGE 16]


    # 3 July 1984


    end.


    The concept of a stack is quite different in the two programs (albeit, they look
    quite similiar). In the pure PASCAL program, we push and pop as functions that
    manipulate the stack structure. In the object-oriented approach, one requests
    information from the stack (s.pop) and makes requests of the stack (s.push). It
    is this view of the object instance as a ‘black-box’ entity that firmly insulates
    the object’s underlying structure from the program. In addition, some implementations
    of class/object structures [7] can selectively limit the ‘visibility’ of the object’s
    components (e.g. data-structures or functions/procedures); a feature not found
    in the PASCAL like schemes.


    # 1.4 A Short Overview of CADRS


    CADRS realizes many of the advantages of an object-oriented system even though
    it is not truly object-oriented. This is accomplished through the extension of
    more conventional structure definition schemes. The following summary of CADRS
    should illustrate this last point, as well as aid the reader during the comparative
    analysis that follows.


    The structure function is used to define all CADRS structures. Its first argument
    is the name of the structure to be defined. The remaining arguments taken to be
    a series of attribute/attribute-value pairs which serve to instantiate the structure
    definition.'
