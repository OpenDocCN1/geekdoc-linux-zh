  - '[PAGE 80]


    # 9 - Modes of Operation


    Many of the features offered by CADRS have two or more different modes of operation.
    These modes are either explicitly set by the user or are set by CADRS based on
    the relationships between the different structures being defined. This chapter
    covers the different modes of operationation, explains how they are explicitly
    set, and describes the conditions under which modes are changed by CADRS itself.


    # 9.1 Macro Replacement


    If the value of the symbol cadrsReplaceFlag is set to t, all calls to the user-level
    functions will replace themselves (using rplaca and rplacd) with their expansions
    1. By default, the value of this symbol is nil and no replacement is done.


    Of course, if efficiency is a major consideration, the best thing to do is to
    compile all functions and macros. However, since many system spend some time in
    interpretive mode before finally being compiled, this feature will result in a
    considerable amount of savings, especially when dealing with complicated structures.


    This feature must be explicitly set by the user.


    +   1. Remember that all top-level functions are written as macros.'
  - '[PAGE 81]


    3 July 1984


    # 9.2 Typing


    Normally, CADRS will generate instance typing code only in the following situations:


    +   1. When the value of the typecheck structure attribute is explicitly set to
    t in the structure definition..


    +   2. When two or more structures contain conflicting definitions of the same
    field. In this case CADRS will force the value of typecheck to t for each structure.


    Typechecking can be turned on for all structures by setting the value of the symbol
    cadrsTyping to t. The default for this symbol is nil.


    # 9.3 Path Checking


    CADRS has the ability to check the paths specified to fetch/replace type functions
    for correctness. To do this, both typing must be on (i.e. the symbol cadrsTyping
    must be set to t), and the value of the symbol cadrsPathCheck must be set to t.
    This feature must be turned on explicitly and is turned off (value of nil) by
    default.'
  - '[PAGE 82]


    3 July 1984


    # 10 - Exception Handling


    The method for handling exceptions (errors) in CADRS is similar to the method
    used in Franz Opus 37 with an INTERLISP extension which makes the job of writing
    exception-handlers less difficult¹. The exception handling algorithm is:


    +   i. Check to see if there are any exception handlers for this class of error.
    If not go to step iii.


    +   ii. Call all user specified exception handlers with the arguments for this
    class of error. If any return a non-nil list, return the first element of the
    list as the value to be used to continue processing.


    +   iii. If none of the exception handlers ''handle'' the error (or none were
    specified), call the default error handler for this class of error.


    10.1 CADRS exceptions


    The following describes the different exceptions or recoverable errors implemented
    in version 1.00 of CADRS. Each exception is presented along with the arguments
    that will be passed to any exception handling function.


    10.1.1 cadrs-except-must-be


    This exception occurs when a must-be test for a field in a structure fails.

    All exception handlers for this error must except the arguments:


    > ¹. Exception handling is not tied deeply into the Franz error handling system
    to allow portability of CADRS to other LISP systems. The Franz error system is
    used only at the lowest level to facilitate debugging of errors.


    - 74 -'
  - '[PAGE 83]


    +   1. The name of the field the exception is generated for.


    +   2. The value that caused the exception


    +   3. The lineage of the structure (i.e. the value that would be returned by
    type).


    +   4. The form that generated the error (i.e. the form that the replace/val-to
    was being performed on).


    +   5. The s-expression that failed.


    If the handler returns a non-nil list, the first value in the list is taken as
    the value to perform the replace with. Note that this value is not re-validated¹.


    10.1.2 cadrs-except-type?-nostruc


    This exception is generated when one or more of the structures listed in the second
    argument to the type? function are not defined structures. All exception handlers
    for this exception must take 3 arguments, the first two being the arguments to
    type? and the third being the structure that was undefined.


    If the handler returns a non-nil list, the first element is returned as the value
    of the call to type?


    +   1. This provides a means of overriding must-be checks'
  - '[PAGE 84]


    3 July 1984


    # 10.1.3 cadrs-except-nfft


    The ‘no field for type’ (nfft) exception occurs under the following conditions:


    +   1. A fetch/val-of or replace/val-to is being performed on a structure instance.


    +   2. Typing is turned on for this instance.


    +   3. The structure type of the instance does not contain the field in question.

    Exception handlers for this class of exception take 3 arguments; the first being
    the name of the field that caused the expention, the second instance of the structure
    involved, and the third the function being performed (either val-of or val-to).
    If the handler returns a non-nil list, the first element will be returned.


    # 10.2 Establishing an exception handler


    Exception handlers are activated, or hooked in to CADRS by means of the establish
    function. The syntax is:


    ```

    establish exception-name handler

    ```


    where:


    +   o exception-name is the name of the exception (as described above).


    +   o handler is either a lambda or a symbol whose function binding is a lambda
    that will handle this type of exception.'
  - '[PAGE 85]


    3 July 1984


    At this point, all establish does is to put the function name or lambda in the
    list that is kept as the value of the symbol exception-name. establish should
    be used to maintain the upward compatibility of the system with future versions
    of CADRS.


    # 10.3 Sample Exception Handlers


    The following demonstrates how one would write exception handlers for a few of
    the diff types of exceptions.


    # 10.3.1 cadrs-except-must-be Example'
  - "[PAGE 86]\n\n# 3 July 1984\n\nThe application is to build a structure that will\
    \ prompt for either \"yes\" or \"no\" and return t or nil respectively.\n\n```\n\
    (structure yes-no\n  fields ((declare answer\n            to-replace (memq newvalue)\n\
    \                  '(Y y yes yes YES)\n            must-be (memq newvalue)\n \
    \                 '(Y y Yes yes YES)\n                  N n ho no NO))))\n\n(defun\
    \ yes-no-handler (field value type form test)\n  (if memq 'yes-no type\n     \
    \ then do ((newvalue prog2\n                    (msg N)\n                    \"\
    Invalid answer\"\n                    N\n                    \"Answer yes or no\
    \ : \"\n                    (read))\n            ((test) (ncons newvalue))\n \
    \     (else nil))\n(establish cadr-except-must-be 'yes-no-handler)\n```\n\nNote\
    \ the following:\n\n+   1. If the exception handler is designed to handle exceptions\
    \ for a specific structure, field, or structure/field combination, it must check\
    \ the value of the first and third (field and type) arguments to determine that\
    \ the exception was generated for that type. If this is not the case, the handler\
    \ should return nil as shown.\n2. The handler must validate the value that it\
    \ returns as CADRS does not.\n3. The handler must return values as the first value\
    \ in a list (done in this example with (ncons newvalue)."
- md: "\n3 July 1984\n\n## 10.3.2 cadrs-except-type?-nostruc example\n\nHere the example\
