    # 3 July 1984


    The ILRP does not facilitate the types of procedural attachment supported by CADRS.
    Hence, the before/after creating/fetching/replacing procedural attachments could
    only be realized by the creation of a user defined record type or through the
    use of an ACCESSFNS record type^1.


    # 1.5.3 GLISP


    GLISP is a strongly typed object oriented programming language which is built
    on top of LISP. The language uses an English-like syntax, and sports a compiler
    that enables an object based message facility and the ability to determine data
    path inference through the context of a computation [4]. Since CADRS is not intended
    as a programming language, but more as a tool, only the object/structure definition
    will be used for the purpose of comparison.


    In general, CADRS compares favorably with the GLISP object/structure definition
    scheme. One major difference is the degree to which GLISP structures and objects
    are strongly typed (this is used by the compiler for inference of type computation).


    Both have the ability to build a heirarchy of structure types, and extend the
    defintions of a structure type^2. Each has a sophisticated mechanism for procedural
    attachment, allowing the implementation of virtual fields.


    +   1. ACCESSFNS records require that all of the structure access and creation
    code be supplied by the user.

    2. is-a in CADRS transparent in GLISP.


