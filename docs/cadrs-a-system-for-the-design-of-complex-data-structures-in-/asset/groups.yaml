  mdcn: "\n1984年7月3日\n\n在 FRL（帧表示语言）中，对对象的描述被称为“帧”（frame），与 CADRS 结构非常相似。帧的结构如下：\n\
    \n```\n(frame\n  (slot1\n    (facet1\n      (datum1 (label1 message1 message2\
    \ ...))\n      (label2 message1...))\n      (datum2 (label1 ...) ...) ...)\n \
    \   (facet2 ...) ...)\n  (slot2 ...) ...)\n```\n\n帧之间可以根据其 AKO（A Kind Of，一种）槽位的值按层级关系建立关联（例如，DOG\
    \ 帧的 AKO 槽值可能是 ANIMAL），并且每个槽（slot）都可以被指定为一个帧（例如，CAR 帧包含一个 WHEEL 槽，而该槽也是一个帧）。每个槽可以有若干个面（facet）来描述它。面还可以用于指定过程的调用：\n\
    \n- 当槽位的值被更改或访问时。\n- 为没有 VALUE 面的槽提供值。\n- 为没有 VALUE 面的槽提供默认值。\n- 验证槽位的值。\n\nFRL\
    \ 帧结构及其关联背后的许多思想已被引入到 CADRS 中。泛化（FRL 中的 AKO 和 CADRS 结构中的 IS-A）、聚合（将对象的各个定义为其他对象的能力）以及过程附加（procedural\
    \ attachment）的概念在这两种描述中都是非常有用的。\n\n根据类型对对象实例进行分类的能力同样有用。\n\nFRL 和 CADRS 之间的许多差异源于各自方案的目标。例如，随着对对象知识的增长而向帧中添加新槽的需要，在结构定义领域是没有对应项的，因为结构通常是静态的。因此，CADRS\
    \ 不提供向现有结构添加新字段的方法。此外，结构定义方案所支持的继承类型不需要像知识表示法那样具有动态性；这再次归因于结构定义是静态的假设。\n\n如上文所示，FRL\
    \ 帧中的每个槽除了系统理解的面之外，还可以包含用户定义的面。虽然 CADRS 属性仅限于系统定义的属性，但放宽这一限制以允许信息与结构/字段关联，似乎是非常值得的，且目前正在考虑中。\n\
    \n1984年7月3日\n\n## 2 - CADRS 参考\n\n## 2.1 引言\n\n接下来的 10 章将深入处理 CADRS 的各种特性。如所述，这些章节旨在作为\
    \ CADRS 软件包 1.00 版本及其在 Franz Lisp Opus 37 下实现的参考手册。\n\n1984年7月3日\n\n## 3 - structure\
    \ - 结构结构定义\n\n`structure` 函数用于定义 CADRS 结构以及描述它们之间的相互关系。与 INTERLISP（或者说 PASCAL）一样，`structure`\
    \ 不会创建被定义结构的实例。因此，不会返回相关值。与 CADRS 许多部分类似，`structure` 被实现为一个宏，该宏反过来使用低级函数来实际定义结构。\n\
    \n### 3.1 语法\n\n`structure` 的语法为：\n\n```\n(structure attrib1 [mod1] vali attrib2\
    \ [mod2] val2 ..)\n```\n\n其中：\n\n- o attrib1 是可接受的结构属性之一（见下文）。\n- o modi 是该属性的可选修饰符¹。\n\
    - o vali 是与该属性关联的值。\n\n所有属性都是可选的。\n\n> > 1. 某些属性带有修饰符，用于指定其值如何被继承。属性修饰符将在“结构继承”章节中介绍。\n\
    \n1984年7月3日\n\n### 3.2 结构属性\n\n尽管所有结构属性（以及字段属性）都有默认值，因此不需要指定，但属性将取的实际值取决于结构的“血缘”（lineage）¹。虽然这一点在结构继承部分有更完全的阐述，但在这里应该指出，下文提到的默认值实际上受到了结构血缘的影响。\n\
    \n#### 3.2.1 type\n\n`type` 属性的值指定了用于创建该结构实例的底层 LISP 结构。允许的值有：\n\n- list（默认值）类型为\
    \ `list` 的结构中的字段以元素的形式存储在列表中。\n- a-list 字段的值存储在关联列表（association list）中键 `<field>`\
    \ 的值中（无论字段的名称是什么）。例如，如果一个结构有一个名为 `foo` 且值为 `bar` 的字段，以及一个名为 `dog` 且值为 `cat` 的字段，那么\
    \ `a-list` 可能如下：\n\n```\n((foo . bar) (dog . cat) . .)\n```\n- p-list 值存储在离散属性列表（disembodied\
    \ property list）² 中指示符 `<field>` 的值中。如果上述字段和值在一个 `p-list` 结构中，它可能看起来如下：\n\n> >\
    \ 1. 结构的血缘是已继承的结构集合，以及该集合中每个相应结构的血缘。\n> 2. 离散属性列表是不作为符号的属性列表子部分被访问（引用）的列表。\n\n\
    1984年7月3日\n\n(foo bar dog cat . ....)\n\n4. array 字段的值存储在映射到该字段的数组中。使用示例，它可能如下：\n\
    \n```\n------+-------+\n| bar |\n+-------+\n| cat |\n```\n\n5. hunk 字段的值存储在映射到该字段的\
    \ hunk 中。使用示例，它可能如下：\n\n```\n{bar}\n```\n\n6. hash hash 结构与其他结构大不同。一个主要区别是值存储在独立的空间中。hash\
    \ 结构最重要的用途之一是扩展结构。以下示例说明了 hash 结构及其技术：\n\n> > 1. hash 结构将详细介绍。\n> 2. 由于此示例使用了稍后描述的函数，现在可能值得跳过它，以后回来。\n\
    \n1984年7月3日\n\n考虑以下结构：\n\n```\n(structure some-data type hunk\n  fields ((declare\
    \ f1-a foo)\n  (declare f2-a bar)\n  f3\n  f4\n  (declare f5-a foobar)\n)\n```\n\
    \n如果我们使用 `some-data` 实例构建了一个大型网络，然后发现需要添加字段 `f6`，不使用 hash 结构的唯一办法是从头开始。如果我们定义一个\
    \ hash：\n\n```\n(structure add-the-field type hash\n  fields ((declare f6 default\
    \ nil)))\n```\n\n那么所有的 `some-data` 实例现在都将有一个字段 `f6`，因为对于任何实例 `sd`：\n\n```\n(replace\
    \ sd f6 100) => (putash sd 100 f6)\n```\n\n（f6 是使用的数组）。\n\n> > 1. 即使 `some-data`\
    \ 是列表，也有必要为该字段 `cons` 额外的空间。\n\n1984年7月3日\n\n### 3.2.2 fields\n\n`fields` 属性定义了组成被定义结构的不同数据项。`fields`\
    \ 属性的默认值为 `nil，意味着“无字段”。\n\n`fields` 的值称为字段列表，是结构中的字段列表。该列表有两个用途。第一个显然是定义字段。第二个是定义字段在任何\
    \ `list`、`array` 或 `hunk` 结构中的位置。对于 `list` 结构，此列表可以包含子列表，用于定义顶级结构中的嵌入列表。作为结构定义，每个字段具有关联修饰符和值的属性。这些规范将在后续章节讨论。\n\
    \n#### 3.2.2.1 示例\n\n以下示例展示了不同结构如何处理不同的字段列表。\n\n- 1. (structure name type list\
    \ fields (last first mi))\n如果 `foo` 是 `name` 结构的实例，那么：\n\n```\n(car foo) => last\n\
    (cadr foo) => first\n(caddr foo) => mi\n```\n\n- 1. 为了兼容性，所有类型都允许嵌入字段列表。对于 `list`\
    \ 以外的类型，字段列表的处理方式类似于线性的。\n"
