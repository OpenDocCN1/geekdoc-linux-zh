    \ Bjarne. \"Classes: An Abstract Data Type Facility for the C Language.\" Special\
    \ Interest Group for Programming Languages (SIGPLAN) Notices. January 1982\n-\
    \ 8. Teitman, Warren. The INTERISP Reference Manual; Bolt, Beranek & Newman -\
    \ Xerox Corporation, 1978.\n- 9. Worth, Niklaus. Algorithms + Data Structures\
    \ = Programs; Prentice Hall, 1976.\n"
  mdcn: "\n1984年7月3日\n\n## 10.3.2 cadrs-except-type?-nostruc 示例\n\n这里使用异常处理程序重新回顾了关于类型和\
    \ type? 章节中的示例。\n\n```\n(structure person\n  fields ((declare name is-a name)\n\
    \    age\n    sex))\n\n(defun type?-women (form list structure)\n  (if and\n \
    \     (eq structure 'women)\n          (memq 'person (type form))\n      then\
    \ (ncons (eq (fetch form sex) 'female))\n      else nil))\n```\n\n```\n(establish\
    \ cadrs-except-type?-nostruc 'type?-women)\n(type? (create person (sex .female)\
    \ (woman)) => t\n```\n\n再次注意，type?-women 检查它正在处理的异常是否针对女性结构体^1，并使用 ncons 将该值作为列表的第一个元素返回。\n\
    \n1. 这一次 women 没有被定义为结构体\n\n1984年7月3日\n\n## 11 - CADRS 工具包\n\n本章描述了为版本 1.00 提供的工具包。包括：\n\
    \n- 1. 针对 Franz Lisp 版本 1.00 的验证脚本。\n- 2. CADRS 的重置函数。\n- 3. 一个提供 fetch 和 replace\
    \ 简写形式的语法宏。\n- 4. 其他有用函数。\n\n## 11.1 CADRSVAL\n\nCADRSVAL 包提供了一系列函数，用于测试 CADRS\
    \ 的每项功能。[[尚未完成]]\n\n## 11.2\n\ncadrs-reset 函数（目前位于 CADRSTS.L 中）将移除所有当前定义的结构。该函数的调用方式为：\n\
    \n```\n(cadrs-reset)\n```\n\n## 11.3 RPM\n\n由宾州大学的 Tim Finin 编写的 RPM 包为编写 fetch\
    \ 和 replace 语句提供了简写形式。一旦用 CADRS 加载 RPM，将接受以下构造：\n\n1984年7月3日\n\n- 1. #struct.path\n\
    这将其展开为 (fetch struct path)\n\n- 2. #struct.path=newval\n这将其展开为 (replace struct\
    \ path newval)\n\n## 11.4 CADRSUTIL\n\nCADRSUTIL 提供了一组函数，帮助对 CADRS 结构以及使用这些结构的函数进行调试和测试。每个函数描述如下：\n\
    \n### 11.4.1 structures\n\nstructures 是一个不带参数的函数，将显示当前定义的结构列表。\n\n### 11.4.2 dump-field\n\
    \ndump-field 将显示与给定结构相关的字段当前属性值。格式为：\n\n```\n(dump-field field struc)\n```\n\n\
    其中：\n\n- o field - 要转出的字段名称。\n- struct - 包含该字段的结构。\n\n## 11.4.3 dump-structure\n\
    \ndump-structure - 显示给定结构的所有属性。格式为：\n\n```\n(dump-structure struc)\n```\n\n其中：\n\
    \n- o struc - 要转出的结构。\n\n## 11.4.4 dump-all-structures\n\n这是一个不带参数的函数，它会转储所有当前定义的结构的属性值。\n\
    \n## 11.4.5 edits\n\nedits 函数使用 LISP 编辑函数来修改 LISP 环境中的结构定义。格式为：\n\n```\n(edits\
    \ struc)\n```\n\n其中：\n\n- o struc - 要编辑的结构。\n\n1984年7月3日\n\n## 12 - 结论\n\n## 12.1\
    \ 结语\n\n通过对传统结构定义形式的扩展，CADRS 在高效实现中体现了面向对象系统的许多优势。该包具有许多其他基于 LISP 的结构定义包中未发现的功能，包括从网络表示方案中引入的功能。\n\
    \n## 12.2 未来工作\n\nCADRS 正在考虑若干项新增，包括：\n\n- i. 一种更灵活的（类英语的）结构定义语言，以取代严谨的属性/值语法。\n\
    - ii. 结合 (i) 构建一种更健壮的访问机制，以处理数据路径推理、数据路径的运行时规范，以及作为路径的一部分指定结构类型以消除歧义¹。\n- iii.\
    \ 可能结合 (i) 和 (ii) 构建一个带类型的函数形式体系（类似于 GLISP）。\n- iv. 构建一个消息机制，允许更完整的以对象为中心的编程。\n\
    \n> 1. 这些歧义目前出现在当 2 个结构对同一字段有“不同”定义时。这种情况通过在执行字段访问时对实例进行类型检查来解决。\n\n- v. 添加一个销毁函数来销毁结构实例（如果\
    \ CADRS 将用于数据库研究，这是必要的）。\n- vi. 一种（COBOL 意义上的）重新定义结构部分的方法。\n\n1984年7月3日\n\n##\
