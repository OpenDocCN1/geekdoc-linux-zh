- md: "\n3 July 1984\n\n## 8.1.4.3 must-be\n\nThe must-be attribute is modifiable\
    \ using the standard syntax. The concatenation used is to queue the values and\
    \ then, at the time the replace function is generated, 'and' the values together\
    \ as shown below:\n\n```scheme\nstructure s1\n    fields ((declare a\n       \
    \ must-be (evenp newvalue)))\n\nstructure s2 is-as sl\n    fields ((declare a\n\
    \        must-be (< 10 newvalue)))\n\nreplace an-s2 a 20) => rplca\n    an-s2\n\
    \        let ((newvalue 20))\n        cond\n            ((and (evenp newvalue)\n\
    \                (< 10 newvalue))\n                newvalue)\n            (t (must-be-handler\n\
    \                a\n                    newvalue\n                    '(s1 s2)\n\
    \                an-s2))))\n```\n\n## 8.2 Inheritance and typing\n\nThe effect\
    \ Structure Inheritance has on typing pertains to what is returned by the type\
    \ function. For a top level structure such as:\n\n```scheme\n(structure level-1\
    \ ...)\n```\n\n3 July 1984\n\na call to type such as:\n\n```scheme\n(type (create\
    \ level-1))\n```\n\nreturns a list whose only member is level-1. For the next\
    \ level:\n\n```scheme\n(structure level-2 is-a level-1 ...)\n```\n\na call to\
    \ type such as:\n\n```scheme\n(type (create level-2))\n```\n\nwill return a list\
    \ of 2 elements, the first being the name of the structure that the form is an\
    \ instance of, and the second being the parent of that structure.\n\nIn general\
    \ the value returned by type is a list of structures:\n\n```scheme\n(struct1 stru2\
    \ . . strucn)\n```\n\nsuch that struct1 is the structure type of the form and\
    \ for each struci in the tail of the list, struci is the parent of some strucj,\
    \ for\n\n```\n1 <= j < i\n```\n\n## 9 - Modes of Operation\n\nMany of the features\
    \ offered by CADRS have two or more different modes of operation. These modes\
    \ are either explicitly set by the user or are set by CADRS based on the relationships\
    \ between the different structures being defined. This chapter covers the different\
    \ modes of operation, explains how they are explicitly set, and describes the\
    \ conditions under which modes are changed by CADRS itself.\n\n## 9.1 Macro Replacement\n\
    \nIf the value of the symbol cadrsReplaceFlag is set to t, all calls to the user-level\
    \ functions will replace themselves (using rplaca and rplacd) with their expansions\
    \ 1. By default, the value of this symbol is nil and no replacement is done.\n\
    \nOf course, if efficiency is a major consideration, the best thing to do is to\
    \ compile all functions and macros. However, since many system spend some time\
    \ in interpretive mode before finally being compiled, this feature will result\
    \ in a considerable amount of savings, especially when dealing with complicated\
    \ structures.\n\nThis feature must be explicitly set by the user.\n\n- 1. Remember\
    \ that all top-level functions are written as macros.\n\n## 9.2 Typing\n\nNormally,\
    \ CADRS will generate instance typing code only in the following situations:\n\
    \n- 1. When the value of the typecheck structure attribute is explicitly set to\
    \ t in the structure definition.\n\n- 2. When two or more structures contain conflicting\
    \ definitions of the same field. In this case CADRS will force the value of typecheck\
    \ to t for each structure.\n\nTypechecking can be turned on for all structures\
    \ by setting the value of the symbol cadrsTyping to t. The default for this symbol\
    \ is nil.\n\n## 9.3 Path Checking\n\nCADRS has the ability to check the paths\
    \ specified to fetch/replace type functions for correctness. To do this, both\
    \ typing must be on (i.e. the symbol cadrsTyping must be set to t), and the value\
    \ of the symbol cadrsPathCheck must be set to t. This feature must be turned on\
    \ explicitly and is turned off (value of nil) by default.\n\n## 10 - Exception\
    \ Handling\n\nThe method for handling exceptions (errors) in CADRS is similar\
    \ to the method used in Franz Opus 37 with an INTERLISP extension which makes\
    \ the job of writing exception-handlers less difficult¹. The exception handling\
    \ algorithm is:\n\n- i. Check to see if there are any exception handlers for this\
    \ class of error. If not go to step iii.\n\n- ii. Call all user specified exception\
    \ handlers with the arguments for this class of error. If any return a non-nil\
    \ list, return the first element of the list as the value to be used to continue\
    \ processing.\n\n- iii. If none of the exception handlers 'handle' the error (or\
    \ none were specified), call the default error handler for this class of error.\n\
    \n### 10.1 CADRS exceptions\n\nThe following describes the different exceptions\
    \ or recoverable errors implemented in version 1.00 of CADRS. Each exception is\
    \ presented along with the arguments that will be passed to any exception handling\
    \ function.\n\n#### 10.1.1 cadrs-except-must-be\n\nThis exception occurs when\
    \ a must-be test for a field in a structure fails. All exception handlers for\
    \ this error must accept the arguments:\n\n> ¹. Exception handling is not tied\
    \ deeply into the Franz error handling system to allow portability of CADRS to\
    \ other LISP systems. The Franz error system is used only at the lowest level\
    \ to facilitate debugging of errors.\n\n- 1. The name of the field that caused\
    \ the exception.\n- 2. The value that caused the exception\n- 3. The structure\
    \ instance.\n- 4. The function being performed (either val-of or val-to).\n- 5.\
    \ The form that failed.\n\nIf the handler returns a non-nil list, the first element\
    \ of the list is taken as the value to be used to continue processing.\n\n####\
    \ 10.1.2 cadrs-except-type\n\nThis exception is generated when one or more structures\
    \ contain conflicting definitions of the same field. In this case CADRS will force\
    \ the value of typecheck to t for each structure.\n\n- 1. The name of the field\
    \ that caused the exception.\n- 2. The value that caused the exception\n- 3. The\
    \ structure instance.\n- 4. The function being performed (either val-of or val-to).\n\
    - 5. The form that failed.\n\nIf the handler returns a non-nil list, the first\
    \ element of the list is taken as the value to be used to continue processing.\n\
    \n#### 10.1.3 cadrs-except-nfft\n\nThe nfft exception occurs under the following\
    \ conditions:\n\n- 1. A val-of or val-to is performed on a structure.\n- 2. Typing\
    \ is on.\n- 3. The structure does not contain the field.\n\nIf the handler returns\
    \ a non-nil list, the first element of the list is taken as the value to be used\
    \ to continue processing.\n\n### 10.2 Establishing an exception handler\n\nException\
    \ handlers are activated, or hooked in CADRS by means of the establish function.\
    \ The syntax is:\n\n```\nestablish exception-name handler\n```\n\nwhere:\n\n-\
    \ exception-name is the name of the exception (as described above).\n- handler\
    \ is either a lambda or a symbol whose binding is a lambda that will handle this\
    \ type.\n\nAt this point, all establish does is to put the function name or lambda\
    \ in the list that is kept as the value of exception-name. establish should be\
    \ used to maintain the upward compatibility of the system with future versions.\n\
    \n### 10.3 Sample Exception Handlers\n\nThe following demonstrates how one would\
    \ write exception handlers for a few of the types of exceptions.\n\n#### 10.3.1\
    \ cadrs-except-must-be Example\n\nThe application is to build a structure that\
    \ will prompt for either \"yes\" or \"no\" and return t or nil respectively.\n\
    \n```scheme\n(structure yes-no\n  fields ((declare answer\n            to-replace\
    \ (memq newvalue)\n                  '(Y y yes YES)\n            must-be (memq\
    \ newvalue)\n                  '(Y y Yes YES)\n                  N n ho no NO))))\n\
    \n(defun yes-no-handler (field value type form)\n  (if memq 'yes-no type\n   \
    \   then do ((newvalue prog2\n                    (msg N)\n                  \
    \  \"Invalid answer\"\n                    N\n                    \"Answer yes\
    \ or no : \"\n                    (read))\n            ((test) (ncons newvalue))\n\
    \      (else nil))\n(establish cadr-except-must-be 'yes-no-handler)\n```\n\nNote\
    \ the following:\n\n- 1. If the exception handler is designed to handle exceptions\
    \ for a specific structure, field, or structure/field combination, it must check\
    \ the value of the first and third (field and type) arguments to determine that\
    \ the exception was generated for that type. If this is not the case, the handler\
    \ should return nil as shown.\n2 The handler must validate the value that it returns\
    \ as CADRS does not.\n3. The handler must return values as the first value in\
    \ a list (done in this example with (ncons newvalue).\n"
  mdcn: "\n\n1984年7月3日\n\n## 8.1.4.3 must-be（必须满足）\n\n`must-be` 属性可以使用标准语法进行修改。使用的拼接用于将值放入队列，然后在生成\
    \ `replace` 函数时，如下所示将这些值“与”（and）逻辑连接在一起：\n\n```scheme\nstructure s1\n    fields\
    \ ((declare a\n        must-be (evenp newvalue)))\n\nstructure s2 is-as sl\n \
    \   fields ((declare a\n        must-be (< 10 newvalue)))\n\nreplace an-s2 a 20)\
    \ => rplca\n    an-s2\n        let ((newvalue 20))\n        cond\n           \
    \ ((and (evenp newvalue)\n                (< 10 newvalue))\n                newvalue)\n\
    \            (t (must-be-handler\n                a\n                    newvalue\n\
    \                '(s1 s2)\n                an-s2))))\n```\n\n## 8.2 继承与类型\n\n\
    结构继承（Structure Inheritance）对类型的影响取决于 `type` 函数的返回值。对于一个顶层结构，例如：\n\n```scheme\n\
    (structure level-1 ...)\n```\n\n1984年7月3日\n\n对 `type` 的调用如下：\n\n```scheme\n(type\
    \ (create level-1))\n```\n\n返回一个其唯一成员为 `level-1` 的列表。对于下一层：\n\n```scheme\n(structure\
    \ level-2 is-a level-1 ...)\n```\n\n对 `type` 的调用如下：\n\n```scheme\n(type (create\
    \ level-2))\n```\n\n将返回一个包含 2 个元素的列表，第一个是该形式所属的结构名称，第二个是该结构的父结构。\n\n通常，`type`\
    \ 返回的值是一个结构列表：\n\n```scheme\n(struct1 stru2 . . strucn)\n```\n\n其中 `struct1` 是该形式的结构类型，对于列表尾部的每个\
    \ `struci`，`struci` 是某些 `strucj` 的父结构，其中：\n\n```\n1 <= j < i\n```\n\n## 9 - 运行模式\n\
    \nCADRS 许多功能具有两种或两种不同的运行模式。这些模式要么由用户显式设置，要么由 CADRS 根据定义的不同结构之间的关系设置。本章将涵盖不同的运行模式，解释如何显式设置它们，并描述\
    \ CADRS 自身更改模式的条件。\n\n## 9.1 宏替换\n\n如果符号 `cadrsReplaceFlag` 的值设置为 `t`，则所有对用户级函数的调用都将使用\
    \ `rplaca` 和 `rplacd` 将自身替换为它们的展开 1。默认情况下，该符号的值为 `nil`，不进行任何替换。\n\n当然，如果效率是主要的考虑因素，最好的做法是编译所有函数和宏。然而，由于许多系统在最终编译之前会在解释模式运行一段时间，此功能将节省大量的内存，特别是在处理复杂结构时。\n\
    \n此功能必须由用户显式设置。\n\n- 1. 记住所有顶层函数都是作为宏编写的。\n\n## 9.2 类型化\n\n通常情况下，CADRS 仅在以下情况生成实例类型代码：\n\
    \n- 1. 当结构定义中 `typecheck` 结构属性的值被显式设置为 `t` 时。\n\n- 2. 当两个或多个结构包含对同一字段的冲突定义时。在这种情况下，CADRS\
    \ 将强制将每个结构的 `typecheck` 值设置为 `t`。\n\n通过将符号 `cadrsTyping` 的值设置为 `t` 可以开启所有结构的类型检查。该符号的默认值为\
    \ `nil`。\n\n## 9.3 路径检查\n\nCADRS 能够检查指定的获取/替换类型函数的路径是否正确。要做到这一点，必须同时开启类型检查（即符号\
    \ `cadrsTyping` 必须设置为 `t`），并且符号 `cadrsPathCheck` 的值必须设置为 `t`。此功能必须显式开启，且默认关闭（值为\
    \ `nil`）。\n\n## 10 - 异常处理\n\nCADRS 处理异常（错误）的方法与 Franz Opus 37 中带有 INTERLISP 扩展的方法类似，这使得编写异常处理程序的工作不那么困难¹。异常处理算法为：\n\
    \n- i. 检查是否存在针对该类错误的异常处理程序。如果没有，则跳转到步骤 iii。\n\n- ii. 使用该类错误的参数调用所有用户指定的异常处理程序。如果任何一个程序返回了非\
    \ `nil` 列表，则返回列表的第一个元素作为继续处理的值。\n\n- iii. 如果没有异常处理器“处理”该错误（或未指定任何处理器），则调用该类错误的默认错误处理程序。\n\
    \n### 10.1 CADRS 异常\n\n以下描述了 CADRS 1.00 版本中实现的不同异常或可恢复错误。每个异常都与其传递给任何异常处理函数的参数一起给出。\n\
    \n#### 10.1.1 cadrs-except-must-be\n\n当结构中字段的 `must-be` 测试失败时，发生此异常。该错误的所有异常处理程序必须接受以下参数：\n\
    \n> ¹ 异常处理没有深度绑定 Franz 错误处理系统，以便将 CADRS 移植到其他 LISP 系统。Franz 错误系统仅在最低底层使用，以便调试错误。\n\
    \n- 1. 引起异常的字段名称。\n- 2. 引起异常的值。\n- 3. 结构实例。\n- 4. 正在执行的函数（val-of 或 val-to）。\n\
    - 5. 失败的形式。\n\n如果处理程序返回了非 `nil` 列表，则取列表的第一个元素作为继续处理的值。\n\n#### 10.1.2 cadrs-except-type\n\
    \n当一个多个结构包含同一字段的冲突定义时，产生此异常。在这种情况下，CADRS 将强制将每个结构的 `typecheck` 值设置为 `t`。\n\n-\
    \ 1. 引起异常的字段。\n- 2. 引起异常的值。\n- 3. 结构实例。\n- 4. 正在执行的函数（val-of 或 val-to）。\n- 5.\
    \ 失败的形式。\n\n如果处理程序返回了非 `nil` 列表，则取列表的第一个元素作为继续处理的值。\n\n#### 10.1.3 cadrs-except-nfft\n\
    \n`nfft` 异常在以下条件下发生：\n\n- 1. 对结构执行了 `val-of` 或 `val-to`。\n- 2. 类型检查开启。\n- 3. 结构不包含该字段。\n\
    \n如果处理程序返回了非 `nil` 列表，则取列表的第一个元素作为继续处理的值。\n\n### 10.2 异常处理器\n\n通过 `establish`\
    \ 函数在 CADRS 中激活或挂载异常处理器。语法为：\n\n```\nestablish exception-name handler\n```\n\n\
    其中：\n\n- exception-name 是异常名称（如上所述）。\n- handler 是 lambda 或一个绑定为处理该类型的 lambda 的符号。\n\
    \n在此时，`establish` 只是将函数名或 lambda 放入作为 `exception-name` 值的列表中。使用 `establish` 以保持系统与未来版本的向上兼容性。\n\
    \n### 10.3 异常处理器示例\n\n以下演示了如何为某些类型的异常编写异常处理器。\n\n#### 10.3.1 cadrs-except-must-be\
    \ 示例\n\n应用是构建一个结构，它会提示 \"yes\" 或 \"no\"，并分别返回 `t` 或 `nil`。\n\n```scheme\n(structure\
    \ yes-no\n  fields ((declare answer\n            to-replace (memq newvalue)\n\
    \                  '(Y y yes YES)\n            must-be (memq newvalue)\n     \
    \             '(Y y Yes YES)\n                  N n ho no NO))))\n\n(defun yes-no-handler\
    \ (field value type)\n  (if memq 'yes-no type\n      then do ((newvalue prog2\n\
    \                    (msg N)\n                    \"Invalid answer\"\n       \
    \             N\n                    \"Answer yes or no : \"\n               \
    \     (read))\n            ((test) (ncons newvalue))\n      (else nil))\n(establish\
    \ cadr-except-must-be 'yes-no-handler)\n```\n\n注意以下点：\n\n- 1. 如果异常处理器设计用于处理特定结构、字段或结构/字段组合的异常，它必须检查第一个和第三个参数（字段和类型）的值，以确定异常是针对该类型生成的。如果不是如此，处理程序应如所示返回\
    \ `nil`。\n2 处理器必须验证其返回的值，因为 CADRS 不会这样做。\n3. 处理器必须将值作为列表的第一个元素返回（在本例中通过 `(ncons\
    \ newvalue)`）。"
