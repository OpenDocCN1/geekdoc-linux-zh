    \ 83\n\n# 1 - Introduction\n\n## 1.1 Introduction\n\nThis thesis describes a project\
    \ to design and implement a data abstraction facility for LISP. The result of\
    \ this project, the CADRS (Compiler for Access of Data Regardless of Structure)\
    \ system, supports the definition, creation, and efficient manipulation of hybrid\
    \ data / procedure structures that closely resemble class objects in languages\
    \ like Simula [2] and Smalltalk.\n\n## 1.2 An Overview of this thesis\n\nThis\
    \ thesis is intended to serve two purposes. The first is to document the design\
    \ philosophies behind CADRS. The second is to serve as a reference to the features\
    \ of CADRS for those who wish to use the package¹.\n\nThe remaining sections of\
    \ this chapter describe the design of CADRS. This discussion begins with a brief\
    \ inspection of the different data abstraction formalisms. Next a brief overview\
    \ of the features of CADRS is presented. This is followed by a comparative analysis\
    \ of CADRS and other LISP structure definition packages. The chapter is concluded\
    \ with a comparison of CADRS and FRL, a network-based knowledge representation\
    \ scheme.\n\n- CADRS is currently implemented under Franz Lisp Opus 38, but could\
    \ easily be modified to run under MACLisp.\n\nThe following chapters describe\
    \ CADRS in detail. These chapters (2 through 11) are intended to serve as the\
    \ reference manual for CADRS. Each of the user-level functions in the package\
    \ is described and illustrated.\n\nThe final chapter presents some concluding\
    \ remarks and considerations for future work.\n\n## 1.3 An Overview of Data Abstraction\
    \ Schemes\n\nAs pointed out by Worth in [9], \"... a large amount of information\
    \ that is to be processed [by a computer] in some sense represents an abstraction\
    \ of a part of the real world.\" The first step in this processing is the development\
    \ of a representation of this abstraction on the computer. As Worth points out,\
    \ the lowest level of this representation (and the one to which all others are\
    \ mapped), is that of the data and control structures offered by the hardware\
    \ (or virtual machine for LISP). The data abstraction facilities found in high-level\
    \ languages, provide more complex primitives, allowing the representation to be\
    \ constructed on a more conceptual level.\n\n### 1.3.1 Basic Data Abstraction\n\
    \nPASCAL provides the essentials necessary to support reasonable data abstraction.\
    \ The first is the ability to define data types in terms of previously defined\
    \ types. The second is its ability (through the use of RECORDS) to define heterogeneous\
    \ data structures, allowing logical grouping of information. The third is its\
    \ ability to define dynamic (recursive) structures.\n\nThe structure definition\
    \ scheme of PASCAL is not without its limitations. As an illustration, consider\
    \ the following PASCAL program that implements a stack to reverse a list of numbers:\n\
    \n# 3 July 1984\n\n```pascal\nprogram reverse (input,output);\ntype\n  stack =\
    \ ^stk;\n  stk = record\n    val : integer;\n    nxt : stack\n  end;\nvar\n  i\
    \ : integer;\n  s : stack;\n\nprocedure push (v : integer; var s : stack);\nvar\n\
    \  tmp_s : stack;\nbegin\n  tmp_s := s;\n  new(s);\n  s^.val := v;\n  s^.nxt :=\
    \ tmp_s\nend;\n\nfunction pop (s : stack) : integer;\nbegin\n  pop := s^.val;\n\
    \  s := s^.nxt;\nend;\n\nfunction empty (s : stack) : boolean;\nbegin\n  empty\
    \ := s = nil\nend;\n\nbegin\n  s := nil;\n  write('enter value ');\n  while not\
    \ eof do\n  begin\n    readln(i);\n    push(i, s);\n    write('enter value ')\n\
    \  end;\n  writeln('the reversed list is');\n  while not empty(s) do writeln(pop(s))\n\
    end.\n```\n\n# 3 July 1984\n\nThe push and pop routines insulate the programmer\
    \ from the underlying structure\nof the stack. Unfortunately, the ease with which\
    \ the structure can be directly\nmanipulated tempts the programmer to occasionally\
    \ do so rather than write the\nnecessary function / procedure (e.g. the use of\
    \ 's := nil', rather than some\nfunction/procedure to initialize the stack). Thus\
    \ a change to the underlying\nstructure of the 'stack' has the potential to render\
    \ invalid some of the procedures\nuse the structure. For instance, if we could\
    \ place an upper bound on the number\nof entries in the stack, we might change\
    \ the underlying structure to:\n\n```pascal\nstack = record\n  val : array [1..100]\
    \ of integer;\n  head_num : integer;\n  end;\n```\n\nAnother limitation of the\
    \ scheme is that it does not allow for the definition\nof a field item in terms\
    \ of other items within the structure. For example, it would\nbe desirable to\
    \ define an employee as:\n\n```pascal\nemployee = record\n  name : a name;\n \
    \ age : 1..80;\n  wage : real;\n  hours : real;\n  pay : (wage * hours);\n  end;\n\
    ```\n\nwhere pay is a read-only field that is computed each time it is accessed.\n"
