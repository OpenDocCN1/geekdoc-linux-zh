    \ the fetch (fetch s a) is evaluated, CADRS will evalute expression (cdr s) to\
    \ perform the fetch.\n\n## 4.3.3.2 to-replace\n\nThe to-replace field attribute\
    \ corresponds to the to-fetch for storing a value in a field. Like-to-fetch, the\
    \ value of the attribute can either be a lambda or an expression. In this case,\
    \ however, the lambda must accept two arguments; and the first being the form\
    \ to do replace on and the second value to replace the old value with. The following\
    \ example shows how this is done:\n\n```lisp\nstructure struct\nfields ((declare\
    \ a\n  to-fetch (lambda (form val))\n  (list 'replace form val))))\n```\n\n```lisp\n\
    (replace a-struct-instance 'this-new-value)\n  --evaluate as--\n```\n\n```lisp\n\
    (replaced a-struct-instance 'this-new-value)\n```\n\n3 July 1984\n\nAs with **to-fetch**,\
    \ if the expression is not a lambda, CADRS assumes that it is to be used to ‘show’\
    \ CADRS how to replace the value of the field from a structure instance. As before,\
    \ if CADRS finds the atom **datum**, in the expression, it will be substituted\
    \ with the instance of the structure that the replace is being performed on. Similarly,\
    \ if CADRS finds the atom **newvalue** in the expression, it is substituted with\
    \ the value specified in the call to **replace**. The following shows how this\
    \ occurs.\n\n```lisp\n(structure struct\n  fields ((declare a\n    to-fetch (replace\
    \ datum newvalue))))\n(replace asi asi 10) => (replace asi 10))\n```\n\n## 4.3.3.3\
    \ before-fetching\n\nThe value of the **before-fetching** field attribute is a\
    \ form to be evaluated before a fetch is performed on the field. By default no\
    \ such form is evaluated. CADRS will evaluate the expression within a context\
    \ in which the structure instance lambda-bound to **datum**. An example of this\
    \ is shown below:\n\n3 July 1984\n\n```lisp\n(structure struct\nfields ((declare\
    \ a\nbefore-fetching (note-fetch 'a datum)))\n\n(fetch as a)\n--will evaluate\
    \ as-\n\n(let ((datum))\n(note-fetch 'a datum)\n(car datum)))\n```\n\nIn the example,\
    \ note-fetch might be considered as some function that would record the instance\
    \ of the fetch.\n\n## 4.3.3.4 before-replacing\n\nThe value of the before-replacing\
    \ field attribute is a form to be evaluated before a replace is performed on the\
    \ field. By default no such form is evaluated. The expression is evaluated within\
    \ a context in which the structure instance and the value that is to replace the\
    \ current field value are lambda-bound to datum and newvalue respectively. An\
    \ example of this is shown below.\n\n3 July 1984\n\n```lisp\n(structure struct\n\
    fields ((declare a\n  before-replacing\n  (note-replace\n    'a\n    datum\n \
    \   newvalue))))\n```\n\n```lisp\n(replace asi a 10)\n\n--will evaluate as--\n\
    ```\n\n```lisp\n(let ((datum asi) (newvalue 10))\n  (note-replace 'a datum newvalue)\n\
    \  (rplaca datum newvalue))\n```\n\nIn the example, note-replace might be considered\
    \ as some function that would record the instance of the replace.\n\n## 4.3.3.5\
    \ after-fetching\n\nThe value of the after-fetching field attribute is an expression\
    \ to be evaluated after the value is fetched from the form. By default, the fetch\
    \ form is the last expression evaluated. CADRS will lambda-bind the structure\
    \ instance that the fetch is being performed on and the value fetched to the datum\
    \ and value respectively as shown below:\n\n```lisp\n(structure str\nfields ((declare\
    \ a\n  after-fetching (foo datum value))))\n```\n\n```lisp\n(fetch a-str a) =>\
    \ (\n  ((datum a-str)\n  (value (car datum))\n  (foo datum value)\n  value))\n\
    ```\n\n- 41 -\n\n## 4.3.3.6 after-replacing\n\nThe value of the after-replacing\
    \ field attribute is an expression to be evaluated after the field value is replaced\
