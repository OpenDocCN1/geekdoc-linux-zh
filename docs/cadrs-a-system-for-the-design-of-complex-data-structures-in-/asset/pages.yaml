    # 10.1.3 cadrs-except-nfft


    The ‘no field for type’ (nfft) exception occurs under the following conditions:


    +   1. A fetch/val-of or replace/val-to is being performed on a structure instance.


    +   2. Typing is turned on for this instance.


    +   3. The structure type of the instance does not contain the field in question.

    Exception handlers for this class of exception take 3 arguments; the first being
    the name of the field that caused the expention, the second instance of the structure
    involved, and the third the function being performed (either val-of or val-to).
    If the handler returns a non-nil list, the first element will be returned.


    # 10.2 Establishing an exception handler


    Exception handlers are activated, or hooked in to CADRS by means of the establish
    function. The syntax is:


    ```

    establish exception-name handler

    ```


    where:


    +   o exception-name is the name of the exception (as described above).


    +   o handler is either a lambda or a symbol whose function binding is a lambda
    that will handle this type of exception.'
