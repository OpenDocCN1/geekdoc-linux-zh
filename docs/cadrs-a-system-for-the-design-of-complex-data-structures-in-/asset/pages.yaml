    # 3.2.4.1 type?


    The **type?** attribute is used to tell CADRS how to identify a LISP entity as
    being an instance of the structure being defined. Although CADRS can do structure
    typing, the feature only works with instances created using the create function.
    The **type?** attribute provides greater control over how ''typing'' is accomplished.


