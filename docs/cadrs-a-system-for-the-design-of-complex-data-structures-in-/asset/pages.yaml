  md: '# 3 July 1984


    Some of the facets of the message facility of GLISP objects can be mimicked in
    CADRS using the **replace** function in conjunction with the **to-replace** field
    attribute. The major limitation would be that the messages could only have one
    argument. The operator overloading could not be duplicated without rewriting the
    necessary functions (in effect to perform the work of the GLISP compiler).


    # 1.6 CADRS and Representation Schemes


    This section compares CADRS and network-based schemes for knowledge representation
    as embodied in FRL [5]. The purpose of such a comparision is neither to insinate
    that CADRS is, in any sense of the word, a knowledge representation tool, nor
    to propose that it be used as such. Rather, the goal is to characterize the descriptive
    capabilitales of such knowledge representation schemes to gain insight into the
    kinds of capabilities that would be applicable to the description of data structures.
    The following short summary of the network based approach is presented to aid
    the reader during the comparison.


    As stated by Mylopoulos in [3], network based knowledge representation schemes,
    "often called semantic networks, attempt to describe a world in terms of objects
    (nodes) and binary associations (labelled edges), the former denoting individuals
    and the latter binary relationships in the world being modelled." As such, the
    knowledge base can be viewed as a directed labelled graph in which the addition
    or deletion of new nodes/edges constitute the addition/deletion of knowledge about
    the world.'
