  md: '# 3 July 1984


    1. only. The only modifier prohibits modification of an attribute''s value by
    any descendant of the structure. only may be used in a descendant provided that
    the attribute in the parent structure is modified with also (i.e. if the parent
    attribute is modified with either only or always an error will result). if only
    is used in a descendant structure, the inherited attribute value is overridden
    by the value specified and the modifier at this level becomes only.


    2. always. This is the second most restrictive modifier. always can only be modified
    by the the also modifier. When always is inherited and modified by also, the current
    value is concatenated1. When also is inherited and modified by always, the values
    are concatenated and the modifier becomes always.


    3. also. This is the least restrictive modifier. When the modifier is not specifiedid
    for a modifiable attribute, also is the default used. When also is inherited,
    the value is overridden by only and concatenated for also and always. The modifier
    will become the one specified by the descendant structure. When also is specified
    as a descendant to always and also the values are concatenated and the modifier
    remains unchanged.


    Finally, while a modifier need not be specified for a modifiable attribute, an
    error will result if a modifier is given for an attribute that is not modifiable.


    Note as well as unmodifiable attrbutes are implicitly only.


    +   1. The way in which the values are concatenated or grouped together depends
    on the attribute involved. This is explained below.'
