  md: '# 1 - Introduction


    # 1.1 Introduction


    This thesis describes a project to design and implement a data abstraction facility
    for LISP. The result of this project, the CADRS (Compiler for Access of Data Regardless
    of Structure) system, supports the definition, creation, and efficient manipulation
    of hybrid data / procedure structures that closely resemble class objects in languages
    like Simula [2] and Smalltalk.


    # 1.2 An Overview of this thesis


    This thesis is intended to serve two purposes. The first is to document the design
    philosophies behind CADRS. The second is to serve as a reference to to the features
    of CADRS for those who wish to use the package¹.


    The remaining sections of this chapter describe the design of CADRS. This discussion
    begins with a brief inspection of the different data abstraction formalisms. Next
    a brief overview of the features of CADRS is presented. This is followed by a
    comparative analysis of CADRS and other LISP structure definition packages. The
    chapter is concluded with a comparison of CADRS and FRL, a network-based knowledge
    representation scheme.


    +   1. CADRS is currently implemented under Franz Lisp Opus 38, but could easily
    be modified to run under MACLisp.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'The following chapters describe CADRS in detail. These chapters (2 through
    11) are intended to serve as the reference manual for CADRS. Each of the user-level
    functions in the package is described and illustrated.


    The final chapter presents some concluding remarks and considerations for future
    work.


    # 1.3 An Overview of Data Abstraction Schemes


    As pointed out by Worth in [9], "... a large amount of information that is to
    be processed [by a computer] in some sense represents an abstraction of a part
    of the real world." The first step in this processing is the development of a
    representation of this abstraction on the computer. As Worth points out, the lowest
    level of this representation (and the one to which all others are mapped), is
    that of the data and control structures offered by the hardware (or virtual machine
    for LISP). The data abstraction facilities found in high-level languages, provide
    more complex primitives, allowing the representation to be constructed on a more
    conceptual level.


    # 1.3.1 Basic Data Abstraction


    PASCAL provides the essentials necessary to support reasonable data abstraction.
    The first is the ability to define data types in terms of previously defined types.
    The second is its ability (through the use of RECORDS) to define heterogeneous
    data structures, allowing logical grouping of information. The third is its ability
    to define dynamic (recursive) structures.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'The structure definition scheme of PASCAL is not without its limitations. As
    an illustration, consider the following PASCAL program that implements a stack
    to reverse a list of numbers:'
  merge: -1
  pgno: 11
- img_proc: true
  md: "# 3 July 1984\n\n```\nprogram reverse (input,output);\ntype\n  stack = ^stk;\n\
    \  stk = record\n    val : integer;\n    nxt : stack\n  end;\nvar\n  i : integer;\n\
    \  s : stack;\n\nprocedure push (v : integer; var s : stack);\nvar\n  tmp_s :\
    \ stack;\nbegin\n  tmp_s := s;\n  new(s);\n  s^.val := v;\n  s^.nxt := tmp_s\n\
    end;\n\nfunction pop (s : stack) : integer;\nbegin\n  pop := s^.val;\n  s := s^.nxt;\n\
    end;\n\nfunction empty (s : stack) : boolean;\nbegin\n  empty := s = nil\nend;\n\
    \nbegin\n  s := nil;\n  write('enter value ');\n  while not eof do\n  begin\n\
    \    readln(i);\n    push(i, s);\n    write('enter value ')\n  end;\n  writeln('the\
    \ reversed list is');\n  while not empty(s) do writeln(pop(s))\nend.\n```"
  merge: -1
  pgno: 12
- img_proc: true
  md: "# 3 July 1984\n\nThe push and pop routines insulate the programmer from the\
    \ underlying structure\nof the stack. Unfortunately, the ease with which the structure\
    \ can be directly\nmanipulated tempts the programmer to occasionally do so rather\
    \ than write the\nnecessary function / procedure (e.g. the use of 's := nil',\
    \ rather than some\nfunction/procedure to initialize the stack). Thus a change\
    \ to the underlying\nstructure of the 'stack' has the potential to render invalid\
    \ some of the procedures\nuse the structure. For instance, if we could place an\
    \ upper bound on the number\nof entries in the stack, we might change the underlying\
    \ structure to:\n\n```\nstack = record\n  val : array [1..100] of integer;\n \
    \ head_num : integer;\n  end;\n```\n\nAnother limitation of the scheme is that\
    \ it does not allow for the definition\nof a field item in terms of other items\
    \ within the structure. For example, it would\nbe desirable to define an employee\
    \ as:\n\n```\nemployee = record\n  name : a name;\n  age : 1..80;\n  wage : real;\n\
    \  hours : real;\n  pay : (wage * hours);\n  end;\n```\n\nwhere pay is a read-only\
    \ field that is computed each time it is accessed."
  merge: -1
  pgno: 13
- img_proc: true
  md: '# 1.3.2 Object Oriented Data Abstraction.


    SIMULA67 [2] allows the definition of a more robust structure, known as a class.
    Classes are defined in terms of data primitives, procedures, functions and other
    classes. The definition of a class resembles that of is a procedure definition
    where the body of the procedure (i.e. the class body) is the code that will initialize
    a new object of that class. Assuming a PASCAL that was extended to understand
    CLASSSes we could rewrite the stack example as:'
  merge: -1
  pgno: 14
- img_proc: true
  md: "# 3 July 1984\n\n```\nprogram reverse (input,output);\n\nclass stack;\n  type\n\
    \    stk_p = ^stk;\n    stk = record\n      val : integer;\n      nxt : stk_p\n\
    \    end;\n  var\n    s : stk_p;\n\nprocedure push (v : integer);\n  var\n   \
    \ tmp_s : stk_p;\n  begin\n    tmp_s := s;\n    new(s);\n    s.^val := v;\n  \
    \  s.^nxt := tmp_s\n  end;\n\nfunction pop : integer;\n  begin\n    pop := s.^val;\n\
    \    s := s.^nxt\n  end;\n\nfunction empty:boolean;\n  begin\n    empty := s =\
    \ nil\n  end;\n\nbegin {stack initialization}\n  s := nil\nend; {stack}\nnvar\
    \ s : stack; i : integer;\nbegin\n  new(s);\n  write('enter value ');\n  while\
    \ not eof do\n    begin\n      readln(i);\n      s.push(i);\n      write('enter\
    \ value ')\n    end;\n  writeln('the reversed list is');\n  while not s.empty\
    \ do writeln(s.pop)\n```"
  merge: -1
  pgno: 15
- img_proc: true
  md: '# 3 July 1984


    end.


    The concept of a stack is quite different in the two programs (albeit, they look
    quite similiar). In the pure PASCAL program, we push and pop as functions that
    manipulate the stack structure. In the object-oriented approach, one requests
    information from the stack (s.pop) and makes requests of the stack (s.push). It
    is this view of the object instance as a ‘black-box’ entity that firmly insulates
    the object’s underlying structure from the program. In addition, some implementations
    of class/object structures [7] can selectively limit the ‘visibility’ of the object’s
    components (e.g. data-structures or functions/procedures); a feature not found
    in the PASCAL like schemes.


    # 1.4 A Short Overview of CADRS


    CADRS realizes many of the advantages of an object-oriented system even though
    it is not truly object-oriented. This is accomplished through the extension of
    more conventional structure definition schemes. The following summary of CADRS
    should illustrate this last point, as well as aid the reader during the comparative
    analysis that follows.


    The structure function is used to define all CADRS structures. Its first argument
    is the name of the structure to be defined. The remaining arguments taken to be
    a series of attribute/attribute-value pairs which serve to instantiate the structure
    definition.'
  merge: -1
  pgno: 16
- img_proc: true
  md: "3 July 1984\n\nThe following is a list of the valid structure attributes and\
    \ a description of each:\n\n+   - TYPE\n- The type attribute describes the underlying\
    \ LISP structure that should be used to implement the structure being defined.\
    \ The values allowed are:\n  - list - for a list.\n  - a-list - for an association\
    \ list.\n  - p-list - for a disembodied property list.\n  - array - for a MACLisp\
    \ style array.\n  - hunk - for a hunk.\n  - hash - for a hash link.\nIf this attribute\
    \ is not specified, then the value list is assumed.\n\n+   - FIELDS\nThe value\
    \ of the fields attribute is the list of the data items to be defined for the\
    \ structure.\n\n+   - TO-CREATE\nThe value of the to-create attribute is an expression\
    \ which when evaluated will create an instance of the structure being defined.\
    \ This is used to override the form computed by CADRS.\n\n+   - BEFORE-CREATING\n\
    The value of the BEFORE-CREATING attribute is a form to be evaluated each instance\
    \ of the structure is created."
  merge: -1
  pgno: 17
- img_proc: true
  md: '3 July 1984


    +   O AFTER-CREATING

    nThe after-creating attribute is used to specify a form to be evaluated after
    an instance of the structure is created. The atom datum is lamdba bound to the
    created instance while the after-creating form is being evaluated.


    +   O IS-A

    The is-a attribute allows a structure to inherit the definition of one or more
    previously defined structures.


    +   O TYPECHECK

    The typecheck attribute is used to tell CADRS to typecheck all created instances
    of the structure.


    +   O TYPE?

    The value of the type form is taken to be a lambda expression or the name of a
    function which, when evaluated against an arbitrary form, will return t if that
    form is an instance of the structure and nil otherwise.


    Fields, like structures, have attributes whose values may be assigned during the
    definition of the structure.1 The valid list of field attributes are:


    +   O IS-A

    The is-a field attribute defines the field as an instance of the structure named
    as the value of the attribute.


    +   O TO-FETCH

    The to-fetch attribute is used to specify a lambda expression or ''pattern''2
    that will return an expression to fetch the value of the field from a form. This
    is used to override the CADRS generated form.


    +   1. This mechanism is shown in the CADRS reference chapters.

    2. For example (car datum) if the fetch should return the first element in a list.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '3 July 1984


    +   - TO-REPLACE


    The value of the to-replace form is a lambda expression or ''pattern'' that will
    return a form to replace the field''s value in a form. This is used to override
    the CADRS generated replace expression.


    +   - DEFAULT


    The value of the default attribute is an expression to be evaluated to give the
    field a default value. If this attribute is not specified, then the default value
    of the field will be the value of the symbol cadsrsFieldDefault.


    +   - TYPE


    The type of a field defines whether the field actually takes up physical space
    in the underlying structure, or is defined solely in terms of function/procedure
    calls. If the value of type is physical then a cell in the underlying structure
    is reserved for it. If the value is virtual then no space reserved.


    +   - HASH-SIZE


    The hash-size attribute is valid only for fields in a structure whose underlying
    type is hash. The value of the attribute is used to specify the size of hash-table
    for this field.


    +   - BEFORE-FETCHING


    This attribute is used to specify a form to be evaluated before fetching the value
    of the field from a form. The symbol datum is lambda bound to the form the fetch
    is being performed during the evaluation.


    +   - AFTER-FETCHING


    This attribute is used to specify the form to be evaluated after fetching the
    value of the field from a form. The symbols datum and value are lambda bound to
    the form the fetch is being performed on and the value of the field respectively.


    +   - BEFORE-REPLACING


    The value of this attribute corresponds to that of the before-fetching attribute
    for the replace operation. The symbols datum and newvalue are lambda bound to
    the obvious values.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 3 July 1984


    +   - AFTER-REPLACING attribute


    The value of the after-replacing attribute is a form to be evaluated after the
    value of the field is replaced. The symbols datum and newvalue are lamdba bound
    to the obvious values.


    +   - MUST-BE


    The value of the must-be attribute is a form that is evaluated each time the value
    of field is replaced. During its evaluation, the symbols datum and newvalue are
    lambda bound to the obvious values. If the form returns then the replace is performed.
    If nil is returned, then an error occurs.


    The create function is used to create an instance of a structure. Among other
    things, create allows the user to initialize any of the fields or sub-fields of
    the structure.


    The functions that provide access to the fields of a structure instance are fetch
    and replace. fetch returns the value of field based upon the data-path specified,
    and replace will replace the value of a field with a new value.


    # 1.5 Comparative Analysis


    This section seeks to compare CADRS to three of the more popular LISP based structure
    definition packages. First, CADRS is compared to the DESTRUCT package written
    by Alan Bawden [1]. Next it is compared to the INTERLISP record package written
    by L.M. Masinter [8]. Finally is compared to Gordon Novak''s GLISP [4].


    +   - Note that this error can be trapped.'
