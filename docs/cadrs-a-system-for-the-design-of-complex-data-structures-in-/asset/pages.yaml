    # 8.1.2.2 fields


    The value of the fields attribute may be changed by a descendant, but the changes
    that are possible are somewhat restricted and therefore do not fall into the ''normal''
    framework. The way in which the values of the parent and descendant are concatenated
    is illustrated by the following example.


    Given the 2 structures:


    ```

    (structure s1 fields (a b c))

    (structure s2 fields (d e f))

    ```


    the concatenation of the field-lists has the effect of an order preserving union
    operation on the two values. The value resulting in:


    ```

    (a b c d e f)

    ```


    If one or more of the fields appear in both fields-lists, the values of the field
    attributes specified by the descendant field are used to modify the field attribute
    values of the parent. This operation is similar to structure attribute inheritance
    and is covered in the section on field attributes below.'
