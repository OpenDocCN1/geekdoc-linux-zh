- img_proc: true
  md: '# 1.5.1 DEFSTRUCT


    The DEFSTRUCT package is a structure definition tool that runs under PDF10 and
    Multics MacLisp and on LispMachines. It has many of the capabilities of CADRS
    and extendible.


    Both of the packages provide a variety of choices for the underlying LISP structure
    to be used when an instances is created. The CADRS implementation of list structures
    is slightly more powerful since it allows the user to specify the exact format
    of the list (in terms of embedded sublists and using the last cdr of a cons cell
    to hold a value). The choices provided by DEFSTRUCT are a linear list or a balanced
    tree.'
  merge: -1
  pgno: 21
- img_proc: true
  md: "3 July 1984\n\nA drawback in the DEFSTRUCT scheme is that a field, or slot\
    \ as it is called in\n\nDEFSTRUCT, can not be explicitly declared to be an instance\
    \ of another structure.\nThe difference is illustrated in the following example.\n\
    \n```\n--CADRS definition of 'name' and 'person'\n(structure name fields (last\
    \ first . mi))\n(structure person type array)\n  fields ((declare name is-name)\
    \ age sex))\n\n(fetch a-person name first)\n\n(create\n  (age . 24) (sex . 'Male)\n\
    \  ((name last) . 'Duncan) ((name first) . 'Richard\n  ((name mi) . 'J))\n\n--DEFSTRUCT\
    \ definition of 'name' and 'person'\n(defstruct (name (type list*))\n  last first\
    \ mi)\n(defstruct (person (type array))\n  name age sex)\n\n(name (person a-person))\n\
    \n(make-person age 24 sex 'Male name 'Duncan Richard . J)\n```\n\nThe access to\
    \ the different fields/slots (and subfields/subslots) in the person\nstructure\
    \ are identical. The problem lies in the fact that DEFSTRUCT has no way of\nknowing\
    \ that the name slot in the person structure is defined as a name structure.\n\
    as a result, the slot must be initialized (with a list), rather than initializing\n\
    each of the sublots. This is a potential source of problems if the underlying\n\
    structure of the name structure were to change to (array, for instance).\n\nWhile\
    \ both packages allow one structure to include another's definition (the\nis-a\
