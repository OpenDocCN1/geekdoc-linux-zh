  md: '# 6 - Structure Access Functions


    Described in this chapter are the fetch/val-of and replace/val-to functions which
    perform all user level structure access in CADRS. As is the case with the structure
    and create functions, all of the structure access functions are implemented as
    macros which can, in the proper mode replace themselves with the code to evaluate.


    # 6.1 fetch and val-of


    The fetch and val-of functions return the value of a field within a structure
    instance. The syntax for each is:


    ```

    (fetch stru-inst path-spec)

    (val-of stru-inst path-spec)

    ```


    where:


    +   - struct-inst is the instance of the structure to perform the fetch.

    "- path-spec is a list of one or more field names which explicitly determine a
    unique field within the structure."'
