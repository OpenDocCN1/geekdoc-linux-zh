    # 12 - Conclusions


    # 12.1 Concluding Remarks


    Through the extension of the traditional structure definition formalism, CADRS
    embodies many of the strengths of an object oriented system in an efficient implementation.
    The package has a significant number of features not found in other LISP-based
    structure definition packages, including features imported from network representation
    schemes.


    # 12.2 Future Work


    There are a number of additions to CADRS under consideration; these being:


    +   i. a more flexible (English-like) structure definition language to replace
    the rigorous attribute/value syntax.


    +   ii. to build, in conjunction with (i), a more robust access mechanism to handle
    data-path inference, run-time specifications of data-paths, and the ability to
    specify a structure type as part of the path to clear up ambiguities¹.


    +   iii. to possibly build a typed function formalism (a la GLISP), in conjunction
    with (i) and (ii).


    +   iv. to build a message facility to allow more complete object centered programming.


    > 1. These ambiguities currently arise when 2 structures contain ''different''
    definitions of the same field''. This situation is solved by typechecking the
    instance when performing the field access.'
