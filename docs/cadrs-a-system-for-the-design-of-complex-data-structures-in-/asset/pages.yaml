    The create function is used to create an instance of a structure. It has a syntax
    similiar to the INTERISP create function, maintaining the same flexibility, and
    including the following features:


    +   - The ability to provide an initial value expression for all fields and subfields.


    +   - The ability to create a copy of another structure instance.


    +   - The ability to use a current structure instance in the creation of the new
    instance.


    +   - The ability to ''reinitialize'' a current structure instance.


    Aside from the above, another reason for using create is that it allows the base
    type of a structure to change (e.g. from a list to a hunk), with no change to
    any of the functions that use these structures.


