    ## WhisperStation™\n### 酷炫……快速……安静！\n\n**适用于 64 位 HPC、游戏和图形设计应用**\nWhisperStation™\
    \ 最初为汽车行业中一群对功耗敏感且要求严苛的工程师设计的，它集成了双核 AMD Opteron™ 或 Intel® EM64T™ 处理器、超静音风扇和电源，以及内部隔音设计，打造出一个强大且安静的计算平台。WhisperStation™\
    \ 标准配有 2 GB 高速内存、NVIDIA e-Force 或 Quadro PCI Express 显卡以及 20 英 LCD 显示器。它可以根据您的确切硬件规格配置任何\
    \ Linux 发行版。还支持 RAID。当作为 Microway 集群的主节点使用时，WhisperStation™ 会让系统管理员感到非常高兴。访问 www.microway.com\
    \ 获取更多技术信息。\n\n*体验“寂静之声”。*\n立即拨打我们的技术销售团队电话 508-746-7341，设计您的定制 WhisperStation™。\n\
    \n![](img/465f773ec3a6747b5eef398f28f808b8_90_1.png)\n\n# 基于 Perl 和 Ruby 的角色单点登录\n\
    \n# 使用 Perl 和 Ruby 实现由用户指定的单点登录。\n\n俄勒冈州波特兰是一座以明智管理资源为傲的城市。因此，本文描述如何让计算机资源和旧版\
    \ CGI 脚本变得更易管理也许是理所当然。这是通过一个优雅、易于构建的系统实现的，该系统为控制不同区域的访问提供了了一种解决方案。它为后端程序员提供了便利，并为用户提供了友好的\
    \ Web 应用程序来管理访问。最后，最重要的一点是，该系统为终端用户创造了逻辑简单的体验。例如，人们在首次尝试访问受保护脚本时只需登录一次。之后，他们就可以不受干扰地访问他们想要的任何区域。\n\
    \n以下是我们可能需要这种系统的某些原因。我曾在 Wells & Clark 大学工作过，该学校坐落在 137 英亩茂密的森林中。当双叶松树在风中摇曳时，我们的\
    \ Web 应用程序已经在偏远地区使用基于 LDAP 的身份验证授权。IT 部门管理的系统允许人们从校园的多个地方使用用户名和密码登录几十个应用程序。经过良好测试的\
    \ Perl 和 PHP 脚本处理着该系统。\n\n你可能会想，问题在哪里呢？为什么不在已经运行良好的系统之上再构建一层呢？实际上，在很长一段时间里，并没有需要。设置得非常好。但随着时间的推移，我们开始从几个方面感到痛苦。\n\
    \n我们使用的旧版脚本数量一直在稳步增长。这些任务本应该只由一小组人处理。\n\n这些旧版应用是由许多不同的开发者开发的。尽管它们使用相同的 LDAP 身份认证，但处理会话和控制访问的方式各相同。\n\
    \n一组新的脚本需要对某些用户组进行受保护的访问。我们无法追踪，也无法访问\n\n作为一名开发者，我的第一个想法是创建一个不可复制的可用代码库，以避免重复。我会编写登录和会话管理的代码，并在许多地方使用它。但在我开始之前，我应该解决几个问题。\n\
    \n现有的脚本确认了两个不同的功能\n\n![](img/465f773ec3a6747b5eef398f28f808b8_91_0.png)\n\n图 1：系统架构\n\
    \n![](img/465f773ec3a6747b5eef398f28f808b8_91_1.png)\n\n图 2：数据库模式\n\n简单更好：身份验证和授权。身份验证是确定用户是否是他们所称的过程。授权是决定用户\
    \ X 是否应该执行 Y。\n\n# 构建解决方案\n\n该系统的计划包含三个独立组件：一个包含用户知识的数据库、一个使用 Perl 模块管理数据库的 Ruby\
    \ on Rails 框架，以及一组用于每个使用的编程环境的适配器。例如，我写了一个 Perl 模块将我们的旧系统连接到新框架 (1)。\n\n# 后端\n\
    \n使用 MySQL 为此项目创建一个架构知识库非常简单，任何受 Rails 和 Perl 支持的关系型数据库都可以。该模式是处理多对多关系的标准（图 2）。users\
    \ 表是简单的名称列表。permissions 表没有授予用户任何权利，它仅提供了用户与角色链接的可能。同样，roles 表列出并描述了可能分配给用户的角色。我包含了一个定义文件，以便适配器可以使用角色，角色可以是\
    \ manager 或 editors。\n\n虽然前两个表是静态的，但最后的 admin_roles_users 包含了有关分配给角色的动态信息。对于每个用户-角色关系实例，此表中都存储了角色和用户名。这种模式非常灵活，缺点是它使得几乎无法手动输入数据，编写一个应用程序来管理它也是件苦差。这正是\
    \ Ruby on Rails 发挥用场的地方。\n\n90 | 2007年7月 | www.linuxjournal.com\n\n## 前端 #1：管理应用程序\n\
    \nRuby on Rails 在提供 CRUD（创建、读取、更新、删除）功能方面表现出色。运行应用程序非常简单。重要的一点是多对多关系。完成后，如图 2\
    \ 所示。\n\n在本地实现应用程序很容易，但通过调用控制器（声明）我们想要的内容，我们可以将其简化为一行：\n\n```ruby\n$auth->require_role(:news);\n\
    ```\n\nrequire_role() 方法是进一步操作所必需，它提供了一个非常简单的保证：执行将\n\n## 前端 #2：Perl/GI 适配器\n\n\
    我是声明式而非过程式的忠实粉丝。相反，一种获取授权的方法是：\n\n```perl\n$username = $auth->current_user;\n\
    if ($username) {\n  # 处理登录表单\n} elsif ($auth->has_role($username, :editor)) {\n\
    \  # 显示错误消息并退出\n};\n```\n\n# 列出角色\n\n| 名称 | 描述 | 用户 |\n|---|---|---|\n| News |\
    \ 管理新出版物的角色。提供访问所有创建、编辑和交付内容的应用程序权限。 | cbaker bththorne |\n| Blog | 提供内部博客管理应用程序的访问。\
    \ | cbaker bththorne |\n\n## 编辑 admin_role:\n\n| 名称 | 用户 |\n|---|---|\n| News\
    \ | 管理新出版物的角色。提供访问所有创建、编辑和交付内容的应用程序权限。 | cbaker bththorne |\n| Blog | | cbaker\
    \ bththorne |\n| Edit | | cncytemo |\n| News | | jtaylor |\n\n\n"
