    # 访问 PIXEL 创始人 Pavel Kanzelsberger


    Pavel 谈到了 Pixel 的历史以及它不仅仅是 Photoshop 克隆版的命运。JAMES GRAY


    我们这些 Linux 用户一直渴望在喜爱的平台上原生运行的应用程序之一就是 Adobe Photoshop。尽管我们几乎所有人已经转向了信赖的 GIMP 进行图像处理，但主要的局限性（例如不支持
    CMYK 色彩模型）使其无法完全发挥作用，且对硬件要求较低。幸运的是，在我们的社区中，应用组合中存在一个空白，有一个拼搏、创新的开发者正在努力填补它。一个典型的例子是
    Pavel Kanzelsberger，这位来自斯洛伐克的开发者开发的 Pixel 是一个雄心勃勃的后图像处理程序。如果 Kanzelsberger 的野心得以实现，他的工作有一天甚至超越
    Photoshop。我们最近采访了 Pavel 以了解 Pixel 的情况。


    导出到 Photoshop 文件，但它使用自己的格式，因为已经有一些 Photoshop 中不具备的独特功能。


    **Lj:** 你对 Pixel 的哪些功能感到最自豪？


    **PK:** 这些 Pixel 的独特功能，例如多颜色剪贴板和通用的色彩管理。实时效果也相当难以实现，我认为它已经比 Photoshop 好了。在 Photoshop
    中，你只能使用一次效果，而且你无法控制该效果。


    **Lj:** 你的客户在更改或改进方面提出了什么要求？


    **PK:** 我收到了很多用户的请求和想法。我认为它们将以一种大型商业项目无法做到的方式影响开发。


    **Lj:** 感谢你接受与 Pavel 对话。首先，Pixel 与 Photoshop 相比如何？另外，它们在文件格式上兼容吗？功能相似吗？


    **PK:** 嗯，坦率地说，在功能上与 Photoshop 比较很困难，因为 Photoshop 有许多局限性且硬件要求较低。我目前还不会把它和 Photoshop
    比较，因为 Pixel 仍在测试阶段。我的目标是赶上行业标准的 Photoshop，然后引入更多创新、更好的功能。Pixel 将支持导入


    **Lj:** 你是否发现了许多离不开 Windows，但又发现 Pixel 是一个良好替代方案的 Linux 用户？


    **PK:** 是的，客户因为这个原因使用 Pixel。许多用户不会从 Windows 迁移，因为没有像 Photoshop 那样的应用程序。许多用户希望有一个相似的界面。到目前为止，Pixel
    是唯一支持 CMYK 和正确色彩管理的 Linux 应用程序。


    **LI:** 你能比较一下 Pixel 和 GIMP 吗？


    **PK:** 当然。相比 Pixel，GIMP 缺少许多重要功能，例如 CMYK 支持、色彩管理、图层调整等。此外，许多人对 OS X 和 Windows
    有意见。然而，这是一个开源努力，并且运行良好。我决定从头重写 Pixel 并使其不依赖平台，这样它就可以轻松移植到新的操作系统。


    **LI:** 如果我是一个图形设计师，我会用什么工具使用 Pixel？


    **PK:** 我目前不推荐它，因为它处于测试状态，但当它完成后，它将是完全可用的。所有打印工具都将在最终发布中。


    **LI:** 你有多少个客户？哪些平台最受欢迎？


    **PK:** 现在，在没有任何营销的情况下，你可以数出数百个。我希望它以后能变得更好。最受欢迎的平台是 Windows、Linux 和 Mac OS。Windows
    占了下载量的 50%，剩下的平分秋色。


    **LI:** Pixel 为什么变得受欢迎？


    **PK:** 它从 1997 年作为一个 DOS 应用程序开始，因为那时每个人都在用 Windows。之后，Pixel 的“多平台”理念源于 Be Inc.
    的请求。他们开发了所有工具并将其移植到 BeOS。


    **LI:** 我看到 Linux 和 FreeBSD 用户中存在许多严重的问题。


    **PK:** 是的，这里有很多社区帮助 Linux 新手，有各种 Linux 程序等。我知道我国家的软件开发者较少，但他们大多在游戏行业和其他项目中。


    **LI:** 你住在斯洛文尼亚。你能告诉我们一些关于开发过程吗？你亲自完成了多少，还是由你的团队？


    **PK:** Pixel 开发团队由一个人组成，一切都是由我完成的，包括 Web 支持等等。我每周只花时间在上面。![](img/465f773ec3a6747b5eef398f28f808b8_56_0.png)


    55 | 2007年7月 www.linuxjournal.com


    Pavel Kanzelsberger


    **LI:** 你在亚洲哪里工作？


    **PK:** 我在2005年于韩国首尔工作了一年。我发给你的采访照片是在日本东京的，在那里


    **LI:** 我们想更多地了解你，Pavel。你的收入如何？


    **PK:** 我过去有全职工作，但从 2006 年初开始，Pixel 是我唯一的工作。对我来说是一个非常重要的项目，所以我辞去工作专注于 Pixel。当我看到销售并赚取足够的收入时，我决定放弃
    Pixel。但现在它运行良好，我希望它以后会更好，但现在地球上这个地方的生活很便宜。


    **LI:** 什么激发了你创建 Pixel？


    **PK:** 当我学习时，有一台带有 7MHz CPU 和显卡的真实 IBM XT。计划是做一些事情，比如游戏，我从制作图像编辑器开始。我做的第一个版本是
    GFX Studio，运行在 DOS 上，分辨率为 320x250，四色。它有一个窗口界面和


    **LI:** 你用什么来开发 Pixel？


    **PK:** 我大部分开发都在 Linux 的 GNOME 桌面。我使用带有语法高亮的简单文本编辑器和一组命令行工具来编译和调试 Pixel。其中几个是编译器
    gcc、utils、gdb。


    **LI:** 你的职业生涯中还做过其他什么？


    **PK:** 我在不同的环境中工作过，使用 Linux 服务器、SQL 数据库和基于 Web 的应用程序。我做了一些，并在亚洲带领过一个移动开发者团队。


    **LI:** 我们应该在 Pixel 中寻找哪些功能？


    **PK:** 在未来，我计划改进 OS 设计并添加对 Photoshop 的完全支持。我刚刚为 Linux 的 Wine 提交了一个请求。


    **LI:** 除了照顾 Pixel，你还有什么兴趣？


    **PK:** 我的家人和我那一岁的儿子是目前的首要任务。其他时候，如果我有额外时间，我喜欢打网球或访问我们这里美丽的自然区域。


    **LI:** 感谢你，Pavel，祝你的 Pixel 进展顺利！


