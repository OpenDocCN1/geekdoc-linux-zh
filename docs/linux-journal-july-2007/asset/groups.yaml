  mdcn: "\n\n![](img/465f773ec3a6747b5eef398f28f808b8_62_0.png)\n\n![](img/465f773ec3a6747b5eef398f28f808b8_62_1.png)\n\
    \n图 3. 软阴影后的灰色背景按钮\n\n图 4. 意在软阴影后具有灰色背景的按钮。通过单位 alpha 掩码导出并叠加在不同的颜色背景上。\n\n脚本。虽然使用许多较小的脚本速度较慢，因为有额外的图像保存/加载周期影响，但这对于批量处理图像来说并不那么重要。优点是，一旦熟悉了这些小脚本，就可以从命令行和\
    \ Makefile 快速将它们组合在一起。通用实用函数已移动到 MonkeyQGIMP 模块中，以便快速创建小型图像编辑脚本。\n\n# 列表 3. MonkeyQGimp\
    \ 保存函数\n\n```perl\n#/usr/bin/perl\n\n@layers = Gimp->image_get_layers($img);\n\
    print \"layers size: \" . scalar @layers . \"\\n\";\n\npackage MonkeyQGIMP;\n\n\
    use Gimp 'auto';\nuse Gimp::Fu;\nrequire Exporter;\n\nsub imageOutput(\n    my\
    \ ($img, $outfilename) = @_;\n\n    if ($outfilename =~ /\\.xcf/) {\n        print\
    \ \"Save to xcf file $outfilename\\n\";\n        Gimp->save(0, $img, $outfilename);\n\
    \    }\n    else {\n        $layer = Gimp->image_get_active_layer($img);\n   \
    \     $layer = Gimp->image_merge_visible_layers($img, $GIMP_CLIP_MERGE_EVERYTHING);\n\
    \    }\n    Gimp->image_delete($img);\n}\n\nsub mergedLayer(\n    my ($img) =\
    \ @_;\n\n    my $existinglayer = Gimp->image_get_active_layer($img);\n    $newlayer\
    \ = Gimp->image_add_layer($img, $existinglayer, GIMP_LAYER_NORMAL, GIMP_LAYER_BEFORE,\
    \ -1);\n    Gimp->edit_fill($newlayer, GIMP_EDIT_FILL_WHITE);\n    return Gimp->image_merge_visible_layers($img,\
    \ 1);\n}\n```\n\n## 通过调整每个图层的亮度或对比度，可以实现鼠标事件预亮图像的自动化。\n\n## 带有 1 位 Alpha 通道的图像\n\
    \n作为第一个示例，假设我们有一个具有 8 位透明度的图像文件，并且想将其导入为仅包含 1 位 alpha 掩码的 GIF。为了获得最佳效果，我们应该对不完全透明或不完全透明的像素进行一些处理。半透明像素可以与设计的背景颜色混合，以便在不进行任何特殊处理的情况下呈现视觉效果。\n\
    \n图像所示（图 3），软阴影被模糊为单位 alpha 掩码，导致导出的图像看起来很差。与灰色背景的锯齿现象将合并到导入的图像中，产生锯齿边缘，如图 4 所示，这种效果并不美观。选择灰色作为背景是最佳选择，否则边缘极其锯齿，且软阴影效果会丢失。\n\
    \n在下一个代码列表 2 中，我们通过处理 GIMP 您的图像文件来转换输出路径，并创建一个适用于 1 位 alpha 掩码的图像。GIMP 的输入和输出图像可以读可写。此脚本可能读取一个\
    \ xcf 文件并写入 PNG 文件。PNG 图像稍后用 webgif 脚本进行处理以获得最终图像。\n\n列表 5. 最后，转换为用于互联网的 6 位 GIF。\n\
    \n```bash\n$ gimp-monkeyq-webgif \\\n--inputimage Button-bunicely-merged-with-green.png\
    \ \\\n--outputimage Button.gif -dither 64\n$ identify Button.gif\nButton.gif 317x213\
    \ 317x213jX+i+h=0 PseudoClass\n```\n\n列表 6. 导出带有其他选项的 GIF 图像。对于此图像我们需要这 8 位吗？\n\
    \n```perl\n$ sub_to_web {\n  my($imagename, $filename);\n  (num_cols, $use_dither)\
    \ = @;\n  $palette_type = @;\n  $image = GIMP-file_load($imagename, $filename);\n\
    \  ($image);\n  GIMP-convert_indexed($image, $use_dither);\n  ($palette_type,\
    \ $num_cols, 1);\n  GIMP-output($image, $filename);\n}\n\n{PF_STRING, \"inputimage\"\
    ,\n\"Name of image to export\", \"\",\nPF_STRING, \"outputimage\",\n\"Name of\
    \ image to save to\", \"\"\nPF_INT, \"depth\", \"depth\", \"255\"\nPF_INT, \"\
    dither\", \"dither\", \"1\"\nPF_INT, \"alpha\", \"1\"}\n```\n\n列表 4. 将背景与糟糕的灰色合并。\n\
    ```bash\n$ gimp-monkeyq \\\n--inputimage Button-with-8Bit-alpha.xcf \\\n--outputimage\
    \ Button-bunicely-merged-with-green.png \\\n--alphascolor #08ff00\n```\n\n![](img/465f773ec3a6747b5eef398f28f808b8_63_0.png)\n\
    \n让我们来看代码列表 2。导入 GIMP API，然后声明脚本的主函数，并将参数清晰地声明为变量。跳过函数后，脚本底部的结果给出了 GIMP 的元数据，以及应该显示菜单的选项以及它实际处理的参数数量和类型（这些通过对上面函数的引用）。在处理\
    \ GIMP 控制之前，只有少量的参数检查。\n\n在处理完元数据处理器后，脚本加载转换函数文件，并创建一个与图像本身尺寸相同的新图层（layer），并将用指定的背景颜色填充。然后将此新图层置于按钮上，并合并可见图层。这使得背景中的所有透明度都经过了评估。在我们背景作为背景的情况下，输入的\
    \ xcf 文件隐藏了灰色背景图层，如果使用指定的亮绿色背景颜色运行脚本，软阴影将按照规定与绿色混合。\n\n"
