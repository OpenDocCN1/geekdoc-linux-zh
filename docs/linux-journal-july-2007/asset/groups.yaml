    # HDRI: 模拟电影的高动态


    高动态范围成像（HDRI）最初是为了 3D 场景光照开发的，捕捉现实世界亮度的一种，多年来一直是真实 3D 光照工作的福音。但它还有另一个用途。通过色调，HDRI
    的宽对比度表示在 8 位空间中——保留阴影细节并尽量减少高光部分的裁剪。作为这种美学，已经开发出多种技术从数字快照创建 HDRI 并将其转换为显示器上的显示或打印。


    从数字照片创建 HDRI 需要叠曝光——拍摄一组不同曝光的照片以获得相机自然允许更宽范围（图 A）。然而，叠曝光图像被合并为单个 HDRI。虽然可以在终端中完成，但使用
    CinePaint 的插件（在软件包中）会更简单。一旦创建，HDRI 可以转换为照明 3D 场景的光探，或为显示和打印进行色调映射（图 B）。


    ![](img/465f773ec3a6747b5eef398f28f808b8_38_0.png)

    图 A。不同曝光的照片组


    出色且经常超过 GIMP 的对应品。Krita 仍处于精炼阶段，其代码没有经过优化。它有很高的系统开销——看起来很漂亮，但会消耗配置系统的资源。调整层不需要同一图像的多个副本来存储滤镜，因此负载较轻。甚至界面可能会卡顿。与
    GIMP 不同的是，Krita 没有任何动画能力来处理任何电影效果。最后，它不支持从 LDR 叠曝光到 HDR——这是一个缺点（尽管此功能在未来版本的待办清单上）。


    尽管如此，总来说，Krita 是一个优秀的软件包。它本身已经非常强大，并显示了巨大的潜力。


    ![](img/465f773ec3a6747b5eef398f28f808b8_38_1.png)

    图 B。使用叠曝光创建完美的图片。


    # 结论


    虽然 GIMP 很有用，但它已经显得老态，很快它就会适应或被更强大的工具淘汰。对于 Linux 上的摄影师以及高动态 CGI 艺术家，Krita 和 CinePaint
    都是欢迎的工具。它们在对方擅长的地方都很强大。随着我们的发展，我们可以从它们身上期待伟大的事物——它们都证明自己是能够引领团队领先的良好软件包。达尔文式的竞争与合作的混合带给了我们新一代这些工具，它们已经准备好使用了。


