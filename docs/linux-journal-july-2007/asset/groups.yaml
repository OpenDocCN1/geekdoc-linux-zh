    Sentences take different amounts of space in a graphic depending on the language
    in which they are written. We also mentioned that a big advantage of SVG is that
    it can be generated or processed automatically. Combining these two factors, it
    is easy to see that you generate and maintain, with minimum effort, many versions
    of the same banner, diagram or any graphic that includes text, each in a different
    language. The only thing to keep in mind is always enough space around that text
    to make sure it fits no matter what the language is. After that, follow the procedure
    on the "Creating Graphics" Web page (see Resources). In the near future should
    be PDF import/export and Visio support in 0.47, followed by the authority of simple
    animations in Inkscape 0.48. Version 0.50 should include SVG Mobile support. The
    plan also includes switching of the display engine to Cairo, up to the point where
    Inkscape can use the hardware-accelerated back end of. As you can see, there are
    lots of things to try and keep an eye on in the coming months.


    ## It''s XML after All


    The SVG standard is another example of XML Markup Language (XML). If you view
    a file created with Inkscape the command line or in any text editor, instead of
    incomprehensible binary code, you''ll find the following:


    ```xml

    <?xml version="1.0" encoding="UTF-8"?>

    <inkscape xmlns="http://www.inkscape.org/">

    <svg xmlns="http://www.w3.org/2000/svg">

    ```


    and others very boring, but also SVG-easily testable and still editable in an
    emergency or by a script. If you have lots of logos and clip-art files, with all
    the names and color


