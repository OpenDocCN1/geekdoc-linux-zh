    # Listing 8. Show layers that have a name matching the given expression.


    ```

    sub layers_showBy (

    my($img, $expression) = __


    @layers = Gimp->get_layers($img);

    foreach (@layers) {

    $n = Gimp->layer_get_name($layer);

    if ($n =~ /$expression/) {

    $Gimp->layer_set_visible($layer, 1);

    }

    }

