    ## 矢量图形与 Inkscape


    操作如交集、并集、差集等。只需选择要合并的对象，并从路径（Path）菜单中选择所需的操作。图 3 和图 4 显示了对象与克隆对象进行交集后的效果。


    ## 导入与导出能力


    Inkscape 可以将绘图或部分绘图转换为 PNG 图像。选择文件->导出位图（Export as Bitmap），并记得选择分辨率，默认为 90dpi。除了原生
    SVG 格式外，Inkscape 还可以将您的杰作保存为特殊格式，包括 PDF、封装的 PostScript（EPS）、Adobe Illustrator、AutoCAD
    和 OpenDocument 格式。


    ## 渐变


    可以使用实色，你觉得对吗？矢量图形是由计算机生成的并不意味着所有组件都必须是实色的。为了创建从对象一侧到另一侧的平滑过渡，克隆（clone）是一个可以移动、缩放的对象副本，你可以应用多种渐变类型并更改相应的描边——它们之间的起点和终点。渐变可以应用于任何对象，包括对侧的——已经绘制的图形——Inkscape
    的一个真正特性是能够从 LaTeX 格式生成图形。然而，你会发现使用 Inkscape 作为编辑器——作为矢量的更有用。这样做的原因是避免可能让你的工作看起来不真实的意外降级。通常情况下，如果绘图很简单，那么描摹的版本非常好。从理论上讲，接近照片的效果是可能的，但在实践中，该过程极其复杂以至于直接停止。使用
    Inkscape 追踪有许多不同的方法，包括使用路径->追踪方法（Path->Trace Method）将位图转换为矢量。在追踪路径中，你将能够生成更多的矢量路径，例如从原始图像的级别开始。


    ## 克隆一切


    Inkscape 许多许多工具来复制、粘贴和删除对象。然而，克隆之所以特殊，是因为它是一个可以移动、缩放的对象，且至少将与其保持链接；这意味着对对象的任何更改都会应用到所有克隆上。如果你使用
    Shift+Alt，克隆将与其祖先断开连接并变成一个独立对象。克隆可以平铺（编辑->平铺 Edit->Tile）以创建具有多种对称或伪随机布局的图案。反射、径向排列以及行和列移动是可用选项，如图
    5 所示。


    ## 文本与字体


    带有大写字母 A 的工具让你创建对象。非常棒的是可以让文本遵循任何线条的可能性（图 7）。使用 Shift 键同时选择文本和线条，然后在顶部菜单中选择选择->放置在路径上（Select->Put
    on Path）。至于字体，Inkscape 可以使用任何可用


    ## 历史记录工具


    Inkscape 中一个很棒的特性是撤销（Undo）。不仅是你对文件所做的任何更改，它们还处于嵌套模式，因此在图 6 中，回到你想要的点将要快得多。


    图 5. 应用到对象的填充和描边


    图 6. 综合功能让你得到脑海中的准确结果。


    ## Linux 是一颗闪亮之星


    在你的计算机上，如果你不小心，你的 SVG 文件将不具有移植性。真正的解决方案是对于你需要分发的文件，仅使用所有平台上可用的字体。当这无法实现时（例如文本是公司标志
    Logo），你可以将其转换为垂直路径（路径→对象 Path→Object）。这会增加文件大小，而且是一个单向过程。显而易见的变通方法始终保留带有实际文本的主副本，并只分发路径。


    ## 多语言图形


    句子在图形中所占的空间取决于它们所书写的语言。我们也提到过 SVG 的一个巨大优势是它可以自动生成或处理。结合这两个因素，很容易看出你可以用最少的精力生成并维护许多相同横幅、图表或任何包含文本的图形的多个，每个版本使用不同的语言。唯一需要记住的是文本周围始终有足够的空间，以确保无论什么语言都能适应。之后，请参考“创建图形”页面（见资源）。近期将包括
    PDF 导入/导出和 Visio 支持，0.47 版本将将显示引擎切换到 Cairo。版本 0.50 应该包含 SVG 移动支持。正如你所见，有许多事情需要关注。


    ## 一切都是 XML


    SVG 标准是 XML 标记语言的另一个用例。如果你在命令行或任何文本编辑器中查看由 Inkscape 创建的文件，而不是不可理解的二进制代码，你会发现以下内容：


    ```xml

    <?xml version="1.0" encoding="UTF-8"?>

    <inkscape xmlns="http://www.inkscape.org/">

    <svg xmlns="http://www.w3.org/2000/svg">

    ```


    以及其他非常内容，但 SVG 也易于测试且在紧急情况下仍可通过脚本编辑。如果你有大量的 Logo 和剪贴画文件，带有所有的名称和颜色


    图 7. 让文本轮廓线条现有线条。


    ## PGI CDK


    MPI 调试器/分析器


    - PGDBG Portland Group


    PGI Group 是 STM Technologies 的公司，PGI 和 CDK 是 STM Technologies 的商标。其他商标和名称归其所有者。


    ## 资源


    - 创建图形：inkscape.org

    - Cairo：cairographics.org

    - Libsvg：libsvg.sourceforge.net

    - Figurine：figurine.sourceforge.net

    - DNA：gome.org

