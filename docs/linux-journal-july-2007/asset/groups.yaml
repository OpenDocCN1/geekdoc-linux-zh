    # INDEPTH


    Image module:


    ```

    >>> import Image

    >>> im = Image.open(''lena.ppm'')

    ```


    The Python Imaging Library supports a wide variety of image formats. The library
    automatically determines the format based on the contents of the file or the extension.

    The next example (Listing 2) shows how the Image class contains methods to resize
    and rotate an image.


    # Color Transforms


    The Python Imaging Library allows you to convert images between different pixel
    representations using the convert function—for example


    ```

    im = Image.open(''lena.ppm'').convert(''L'')

    ```


    The library supports transformations between each supported mode and the RGB mode.
    To convert between other modes, you may have to use an intermediate image.


    # Filters


    The Image module contains a number of predefined filters that can be used with
    the filter method. For example, from the Python prompt, the following:


    ```

    >>> import ImageFilter

    >>> out = im.filter(ImageFilter.DETAIL)

    ```


    Once you have imported the module, you can use any of these filters:


    +   - ImageFilter.BLUR

    - ImageFilter.CONTOUR

    - ImageFilter.DETAIL

    - ImageFilter.EDGE_ENHANCE

    - ImageFilter.EDGE_ENHANCE_MORE

    - ImageFilter.EMBOSS

    - ImageFilter.FIND_EDGES

    - ImageFilter.SMOOTH

    - ImageFilter.SMOOTH_MORE

    - ImageFilter.SHARPEN


    # Controlling the Decoder


    Some decoders allow you to manipulate an image while reading from a file. This
    can be used to speed up decoding when converting thumbnails and printing to a
    monochrome layer. The draft method operates without yet loaded


    # Listing 3. Reading in Draft Mode


    ```

    im = Image.open(file)

    print ''original ='', im.mode, im.size

    draft(''L'', (100, 100))

    print ''draft ='', im.mode, im.size

    this prints something like:

    orignal = RGB (512, 512)

    draft = L (128, 128)

    ```


    # Listing 4. Draw a Gray Cross over an Image


    ```

    import Image, Imagedraw

    im = Image.open(''lena.ppm'')

    draw = ImageDraw.Draw(im)

    dline((0,0), im.size, fill=128)

    dline((0,im.size[1]), (im.size[0],0), fill=128)

    del draw

    im.save(sys.stdout, ''PNG'')

    ```


