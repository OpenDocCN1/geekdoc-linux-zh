  - "[PAGE 92]\n\n# # Front End #1: a Management Application\n\nRuby on Rails (RoR)\
    \ shines in the area of database applications that need to provide CRUD (Create,\
    \ Retrieve, Update, Delete) functionality. It is simple and easy to get your database\
    \ management application up and running (3). Plenty of tutorials are available\
    \ for creating a basic Web application, so in this article I will describe the\
    \ necessary considerations. As it turned out, there weren't many.\n\nOne thing\
    \ that matters is using tables and columns to comply with Ruby on Rails conventions\
    \ (2). This turned out to be a bit tricky; I couldn't find a single source for\
    \ all the conventions and implementations. In this situation with a join table\
    \ (admin_role_users), it is important to concatenate the names of tables and be\
    \ careful not to include an id column.\n\nThe main maintenance concern was to\
    \ tell Roll about the many-to-many relationship. This was accomplished with a\
    \ single line added to admin_role.\n\n```\nclass AdminRole < ActiveRecord\n  has_belongs_to_many\
    \ :admin_users\n```\n\nand an equivalent one in admin_user:\n\n```\nclass AdminUser\
    \ < ActiveRecord\n  has_belongs_to_many :admin_roles\n```\n\nWith these changes,\
    \ Roll could fetch the data correctly and maintain all the proper properties.\
    \ It was easier to display and edit the join form, but more work was required\
    \ in the view and controller classes (see Resources). When finished, I had nice\
    \ screens, as which I show in Figure 1.\n\nImplementing the application in place\
    \ is easy, but we could be populating the database. But for this information to\
    \ be used, an adapter would have to be written for our Perl/GI runtime environment.\n\
    \n# # Front End #2: a Perl/GI Adapter\n\nI'm a big fan of declaration (as opposed\
    \ to procedural), when it can be used. What does this mean? Well, one way to get\
    \ for authorization look like this:\n\n```\n$username = $auth->current_user;\n\
    if ($username) {\n  # Handle the login form\n} elsif ($auth->user_has_role($username,\
    \ $new_editor)) {\n  # Show error message and exit\n};\n```\n\nSure, that could\
    \ be a bit-for-bit, by implementing a current_role() method. But it's still procedural.\
    \ Instead, we can reduce this to one line by calling the controller (declaring)\
    \ what we want:\n\n```\n$auth->require_role(:news);\n```\n\nThis require_role()\
    \ method is required to get any further, and it gives a very simple guarantee:\
    \ execution will\n\n![](img/465f773ec3a6747b5eef398f28f808b8_92_0.png)\n\n# Listing\
    \ Admin Roles\n\n| Name | Description | Users |\n|---|---|---|\n| News | The role\
    \ for people who manage the new publications. Provides access to all applications\
    \ for creating, editing and delivering news content | admin cbaker bththorne |\n\
    | Blog | Provides access to the internal blog management applications. | cbaker\
    \ bththorne |\n\nFigure 3. Admin application, Role Listing\n\n![](img/465f773ec3a6747b5eef398f28f808b8_92_1.png)\n\
    \n# Editing admin_role:\n\n| Name | Users |\n|---|---|\n| News | The role for\
    \ people who manage the new publications. Provides access to all applications\
    \ for creating, editing and delivering news content | cbaker bththorne |\n| Blog\
    \ | | cbaker bththorne |\n| Edit | | cncytemo |\n| News | | jtaylor |\n\nFigure\
    \ 4. Admin application, Editing a Role\n\nthis point only if the user should be\
    \ able to. If (1) has already logged in and (2) has given the role, then require_role()\
    \ will simply return and the script will continue normally. Otherwise, the auth\
    \ object will take whatever steps are necessary to first authenticate and then\
    \ grant access to any de roles it wants.\n\nThis makes a lot of things easier.\
    \ For allocation programmers, they don't have to worry about how the auth object\
    \ gets their job. Nor do they have to worry about what a role is and how it is\
    \ written. If it was implemented correctly, the Auth.Pm perl module will have\
    \ so much help with little effort required by the application programmer. Figure\
    \ 5 is a flowchart that shows what happens when require_role is needed.\n\nConcurrently,\
    \ my implementation required four files:"
