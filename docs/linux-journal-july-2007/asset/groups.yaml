    ## Django 入门教程


    如果你想要的是 Python 版的 Rails，只需运行 `django django` 即可。


    REUVEN L. MERNER


    在过去的一一两年里，Rails 最大的对手之一是 Django，它是一个基于 Python 的框架，其目标与 Rails 相同。


    当我开始开发 Web 应用程序时，我的大部分工作是用 Perl 完成的，而且我的程序通过 CGI 调用。多年来，我的偏好发生了变化，转向了基于组件和模板的系统（如
    Mojo 和 Zope），然后转向了像 Rails 和 Open-Django 这样的解耦框架。最近，作为一个长期的 Perl 实践者，我一直在使用 Ruby
    on Rails；Ruby 语言和 Rails 框架都让我感到惊喜。


    代码应该像你服务器上的任何其他 Python 库和程序一样进行安装，使用标准的 Django 安装例程序：


    ```python

    python setup install

    ```


    一旦安装完成，你就可以用它来创建一个或多个 Django 项目。这些术语可能有点复杂，特别是如果你是从 Rails 转过来的话，所以要加小心。一个 Django
    项目包含一个或多个应用（applications）。每个应用都有自己自己的模型（models）、视图（views）和模板（templates）。一个应用可以在多个项目之间复用——就像
    Rails 中的插件或引擎一样。


    但当然，Ruby 并不是唯一的流行框架。在过去的一一两年里，Rails 最大的对手之一一直是 Django，它是一个基于 Python 的框架，其目标与 Rails
    相同。Django 最初由 Adrian Holovaty 在 Lawrence 担任自由职业者期间编写。当他加入《华盛顿邮报》后，他作为其他开源项目的一部分继续开发该框架。


    值得说的是，Django 是 Rails 的 Python 移植，但两者之间存在许多差异。Django 和 Rails 都使用过成功的商业项目，前者在 37
    公司，后者在一家报纸。两者都希望让 Web 开发变得快速而容易，而不是像过去那样枯燥。两者都使用 Web 控制器 MVC 模式来进行路由和创建页面。通过使用处理配置系统和文件的特定编程语言，两者都确保了它们在未来的一段时间内都足够开发。


    这意味着通过 Django，我们还没有准备好将任何代码部署到世界上。相反，我们需要创建一个项目，以及该项目至少一个应用，以便进行动态输出。


    让我们创建一个项目（在 Django 教程中命名为 misty，所以我们遵循相同的命名约定）：


    ```bash

    django-admin.py startproject misty

    ```


    当我在 Ubuntu 机器上安装 Django 时，它将管理程序 django 放置在 /usr/bin。你的系统可能将其放在不同的位置，因此你可能需要修改你的
    django-admin 以使工作能够被写入。


    启动项目会创建一个名为 misty 的目录，其中包含四个 Django 源文件，每个文件都有 py 扩展名：


    这个月，我随后进入了 Django 的世界，看看这个框架到底在哪些方面超越了所有人。如果你从未尝试过 Django，或者你不喜欢 Django 语言，我预计
    Django 有某些可以教给你，或者至少是你可能会思考的内容：


    - 一个空的 `__init__.py` 文件：它包含一个目录结构；`__init__.py` 将整个目录视为单个包。只要该文件存在，即使它是空的也可以。

    - `settings.py`：这个文件不包含可执行代码，而是 Django 实例的配置设置。例如，我们将修改此文件来识别我们正在使用的关系型数据库的位置和部分。

    - `urls.py`：这是我们将所有 URL 关联到函数的地方，使用正则表达式匹配 URL。如果你来自 Rails 世界，这在很多方面是相似的。


