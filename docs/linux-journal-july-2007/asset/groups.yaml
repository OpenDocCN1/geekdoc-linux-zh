    \ can do the trick (as qiv or other image display tools). To correct images, you\
    \ might prefer an interactive tool, like the GIMP or tgf.\n\nOther possibilities\
    \ exist, such as creating a mosaic of images with fancy fonts, but this does not\
    \ make much sense in an image gallery application.\n\nNow, let's get down to business.\n\
    \n# The Code for the Task\n\nIt is best to use bash as the programming language.\
    \ Because all the work is already done elegantly and by command-line utilities,\
    \ you only need to invoke them with the appropriate switches and generate simple\
    \ HTML, code for a google.com.\n\nThe first task is to segregate the images into\
    \ different directories, depending on the dimensions and orientation of each image.\
    \ This is easily done with the following block of code:\n\n```\n#!/bin/sh\n\n\
    # script to segregate images based on dimensions\n\nfor image in $jpg; do\n  dimension=$(identify\
    \ -format \"%Wx%h\" \"$image\")\n  # we don't want shouting at us\n  mkdir -p\
    \ $dimension 2>/dev/null\n  mv $image $dimension\ndone\n```\n\n![](img/465f773ec3a6747b5eef398f28f808b8_72_0.png)\n\
    \nFigure 1. Image with Frame\n\n+   1) Thumbnail with thickness and shadow:\n\n\
    ```\n$ convert rose.jpg -matte \\ \\\n  \\(clone -fx DarkSlateGray -repage +0+1)\
    \ \\ \\\n  \\(clone -repage +1+2) \\ \\\n  \\(clone -repage +1+3) \\ \\\n  \\\
    (clone -repage +2+4) \\ \\\n  \\(clone -repage +2+5) \\ \\\n  \\(clone -repage\
    \ +3+6) \\ \\\n  -background none -compose 0Out rose-thickness.jpg\n```\n\n+ \
    \  2) A border effect:\n\n```\n$ convert -raise 8 rose.jpg -rose-raised +0 0+\
    \ rose-raised.jpg\n```\n\n+   3) Adding a frame to the thumbnail:\n\n```\n$ convert\
    \ -mattecolor peru -frame 9x9+3 rose-frame.jpg\n```\n\nNext, let's look at other\
    \ ways to annotate images with ImageMagick:\n\n+   1) Text on the bottom-left\
    \ corner with a vertical orientation:\n\n```\n$ convert rose.jpg -font Helvetica\
    \ -fill white \\\n-pointsize 20 -gravity south -annotate \\\n270x270+15+0 \"Nice\
    \ pink rose\" rose-text.jpg\n```\n\n+   2) Text on a frame:\n\n```\n$ montage\
    \ -frame +0+0 -background white -fill \\\n-label \"Nice pink rose\" rose-jpg-text.jpg\n\
    ```\n\nNote that you can use any color to the frame and -fill switches. To find\
    \ which colors are supported by ImageMagick, type:\n\n```\n$ convert -list color\n\
    ```\n\n+   3) You can also watermark, like:\n\nNow we have all the images of identical\
    \ dimensions, nested in separate directories. Let's proceed to generate the thumbnails\
    \ for each of them. This script generates the thumbnails:\n\n```\n#!/bin/sh\n\n\
    # script to segregate images based on dimensions\n\n# os we have all the thumbnails\
    \ for each of the\n# images classified by dimensions\nmkdir thumb\nfor dir in\
    \ $(ls -F | grep / | grep '^[0-9]'); do\n  mkdir thumb/$dir 2>/dev/null\n  cd\
    \ $dir\n  width=$(identify -format \"%w\" \"*.jpg\")\n  height=$(identify -format\
    \ \"%h\" \"*.jpg\")\n  for image in *.jpg; do\n    convert -size ${width}x${height}\
    \ $image -resize 20% \\\n    ../thumb/$dir-$image\n  done\n  cd ..\ndone\n```\n\
    \nWith ImageMagick, you have several nice features available for decorating thumbnails,\
    \ and they look impressive."
