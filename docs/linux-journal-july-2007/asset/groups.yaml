    # Tumbling Dice''s Fedora colinux Tutorial


    ![](img/465f773ec3a6747b5eef398f28f808b8_33_0.png)


    The visualization scene makes you giddy, a good cuddle over Tumbling

    Dice''s new Fedora colinux, customized colinux distribution that runs Fedora

    Core virtually under Microsoft Windows. Tumbling Dice claims easier install-

    tion than the standard colinux, a complete manual, ease of use and full

    Fedora Core functionality. Target customers for the product include "analysts"

    who don''t want a dual-boot

    solution, and companies and institutions with spare computing resources

    to deploy large-scale applications (such as databases, simulations and

    forth). The software manual also available for download from the firm''s

    Web Site. Also see the colinux link for more info on the project.

    www.tumdice.co and colinux.wikia.com


    # Addison-Wesley''s

    Professional Ruby Series


    At about a one-month clip, and under the umbrella of its media-

    agnostic Professional Ruby Series, Addison-Wesley is cranking out-

    new resources for Ruby and Rails developers. One of the

    series'' new products is Rails Routing, a Digital Short Cut (PDF download)

    from author David Black on system. Another new product is RailsSpace: Building
    a

    Networking Website with Ruby on Rails, from Michael Hart and Aurelius

    Prochaska. Helps developers learn to build industrial-

