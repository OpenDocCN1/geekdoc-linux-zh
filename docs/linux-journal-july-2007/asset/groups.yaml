    **如果你运行**连接互联网的服务器，很有可能你最终会遭遇成功的攻击。去年，我发现尽管在一个测试 Web（目标）上部署了多层防御，但攻击者仍然在尝试获取访问权限的成功尝试中执行了漏洞利用。这台服务器运行着红帽企业版
    Linux (RHEL)，且 Mambo 的上下文至关重要。它配备了多项防御，包括增强安全型 Linux (SELinux)。SELinux 阻止了攻击者执行攻击的第二阶段，可能防止了被攻破。本文介绍了一次入侵案例研究，解释了入侵是如何工作的、我采取了哪些措施来识别漏洞、我是如何从攻击中恢复的，以及我在安全系统方面学到了什么。出于隐私考虑，我更改了机器名称和
