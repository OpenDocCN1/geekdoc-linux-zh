  - "[PAGE 91]\n\n# Role-Based Single Sign-on with Perl and Ruby\n\n# Single sign-on\
    \ dicated by user with Perl and Ruby.\n\nPortland, Oregon, is a city that takes\
    \ pride in managing its resources wisely. So, maybe it's natural that this article\
    \ describes how to make computer resources and legacy CGI scripts much more manageable.\
    \ This is accomplished by an elegant, easy-to-build system that provides a one-time\
    \ solution for controlling access to different areas. It gives programmers on\
    \ the back end, empowers users with a friendly Web application for managing access.\
    \ And finally, most importantly, the system creates an experience for end users\
    \ that's logical and simple. For example, people are required to log in only once\
    \ when they first attempt to access a protected script. After that, they have\
    \ uninterrupted access to any area they want.\n\nHere is a little bit of why this\
    \ kind of system we might need. I worked at Wells & Clark College, nestled in\
    \ 137 deeply wooded acres. While one of Douglas Fir trees drifted in the wind,\
    \ our Web applications were using LDAP-based authentication authorization in far-flung\
    \ locations. The system managed by IT allowed people to log in to dozens of applications,\
    \ from many places on the campus with their user name and password. The well-tested\
    \ Perl and PHP scripts handled the system.\n\nYou might be wondering, What the\
    \ problem? Why not build another layer on top of something that works? And actually,\
    \ for a long time, there was no need. The setup was just fine. But over time,\
    \ we began gaining pains, from several sources.\n\nThe legacy scripts we used\
    \ have been growing steadily. These tasks are intended to be handled by only a\
    \ small group of people.\n\nThese legacy applications were developed by many different\
    \ developers. Although they used the same LDAP-based authentication, they handled\
    \ sessions and controlled access in different ways.\n\nA new set of scripts required\
    \ protected access for certain user groups. We had no way of keeping track of\
    \ or would be able to access\n\nAs a developer, my first thought was to create\
    \ a reusable library of some code that couldn't be duplicated. I would write the\
    \ code for logging in and session management just and use it in many places. But,\
    \ before I started, there were a couple of issues I should address. \n\nThe existing\
    \ scripts confirm two distinct functions\n\n![](img/465f773ec3a6747b5eef398f28f808b8_91_0.png)\n\
    \nFigure 1: System Architecture\n\n![](img/465f773ec3a6747b5eef398f28f808b8_91_1.png)\n\
    \nFigure 2: Database Schema\n\nwould be better simple: authentication and authorization.\
    \ Authentication is the process of determining whether users are who they say\
    \ they are. Authorization is the process of deciding user X should be to do Y?\n\
    \n# Building the Solution\n\nThe plan for the system features three independent\
    \ components: a database containing knowledge of users and a Ruby on Rails framework\
    \ to use Perl modules to manage the database, and a set of adapters for each programming\
    \ environment in use. For scenario, I wrote a Perl module to connect our legacies\
    \ to the new framework (1).\n\n# The Back End\n\nIt was simple to create an architecture\
    \ knowledge base for this project using MySQL, any relational database supported\
    \ by both Rails and Perl would be fine. The schema is the standard for handling\
    \ many-to-many relationships (Figure 2). The users table is a simple list of names.\
    \ The permissions table doesn't grant a user any rights. It only provides the\
    \ possibility for user to be linked to roles. Similarly, the roles table enumerates\
    \ and describes the roles that users might be assigned. I included a definition\
    \ file so that adapters can make use of the role, a role name could be manager\
    \ or editors editors wide\n\nWhile the first two tables are static, the final,\
    \ admin_roles_users contains the dynamic information about users who have been\
    \ assigned to roles. For each instance of a user-role relationship, a role and\
    \ user name are stored in this table. This kind of schema is very flexible and\
