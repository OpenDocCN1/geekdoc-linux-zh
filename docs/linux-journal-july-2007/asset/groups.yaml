    # 梦工厂动画 (DREAMWORKS ANIMATION)

    ## 魔陆史瑞克3：Linux 为怪兽提供支持


    ## 梦工厂动画利用 Linux 推向了 CG 电影制作的极限。


    罗宾·罗威尔 (ROBIN ROWE)


    所有大型电影制厂主要使用 Linux 进行动画和视觉特效处理。也许没有商业化的 Linux 安装规模比梦工厂动画还要大，它拥有超过 1,000 台 Linux
    桌面电脑和超过 3,000 个服务器 CPU。


    “对于《史瑞克3》，我们在制作电影将消耗 2000 万小时 CPU 渲染时间，”梦工厂动画首席技术官埃德·伦纳德（Ed Leonard）表示，“我们的每一部电影都在不断突破极限，需要越来越强大的计算机。一个直接的结论是，卡通动画的
    CPU 渲染时间每一个半就会翻一倍。2001 年，原版《史瑞克》使用了约 500 万小时 CPU 渲染时间。2004 年，《史瑞克2》使用了超过 1000
    万小时的 CPU 渲染时间。而《史瑞克3》正在使用 2000 万小时 CPU 渲染时间。”


    “在任何时候，我们都在处理几十小时的电影素材，”伦纳德说，“每一部电影都有自己的创作抱负，去挑战 CG 电影制作的极限。”梦工厂动画拥有约 1,200 名员工，其中三分之二位于格伦戴尔（Glendale）工作室，其余的位于红木城（Redwood
    City）的 PDI 工作室，两地之间通过一条 2 GB 的网络连接。（注：梦工厂动画近期与华莱坞影业合并。）


    “这部电影上有许多特定的技术进步，包括发型服饰和群集技术的进步，并将次要角色动画提升到了全新的表演水平，”伦纳德说。约 350 人正在制作《史瑞克3》，其中约
    300 人在 SDI，50 人在格伦戴尔。


    ![](img/465f773ec3a6747b5eef398f28f808b8_40_0.png)


    # 特写：魔陆史瑞克3


    ## 茂盛的长发

    穿着长裙跑步


    安妮·皮尔斯（Annie Pearce）向梦工厂动画研发小组介绍了关于 PD（制作开发）的内容。“发型可能是《史瑞克3》中最大的技术进步，”皮尔斯说，“在过去的这些年里，我们从未见过如此长的头发。”


    “制作一个不带头发的《史瑞克3》花了好几个月，”Effect 说道，“头发无处不在。它聚集成一团非常容易出现但建模极其复杂的簇。头发的运动方式已经不再是自动化的，”Gman
    说，“动画师没有时间去手动修复每一根头发。”


    “对于衣服，我们有更多的交互，包括接缝的撕裂。如果我们必须对每个角色的进行单独处理，那将花费太长时间，”角色 TD 监监露西娅·莫德斯托（Lucia Modesto）说，“我们使用通用的发型并对角色进行变形处理。我们有
