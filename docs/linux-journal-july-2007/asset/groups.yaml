    Reported Apache sites hosted by OpenSourcePartnering (opensourcepackaging.com)
    Netcraft may have been running lighttdp. Says Netcraft, say Apache, have the Date
    & Server headers last, a pattern which is identical to the lighttdp response and
    entirely unlike Linux Apache. The stage is also not in Apache Format, that matches
    the lighttdp format* (www.netcraft.com/archives/2007/04/open_source_ranking.php#leaders_benefit_apache.html).


    Jan Kneesque began lighttdp in 2003, when he wanted to develop a fast and lightweight-


    Webserver has been optimized for high-performance environments. It has a very
    low memory footprint compared to other Webservers and takes care of CPU load.
    Its advanced feature (FastGI, CGI, Auth-Authentication, URL-Writing) and makes
    lighttdp the perfect Webserver for every server that suffers loads.


    Meanwhile, (in April 2007) stood at 58.6% of the Netcraft surveyed sites, running
    roughly flat until April after it dropped the same 5% that Microsoft servers gained
    in April last year. So just to see lighttdp and Apache combine to increase open-source
    market shares, while also increasing. Watch Netcraft (www.netcraft.com) for more
    developments.


