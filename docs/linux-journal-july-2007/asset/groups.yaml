    图 1。CinePaint 拥有一个类似于 GIMP 的工具，趋向于合成系统。它目前在格拉斯哥分支正在深度开发，而原始版本稳定性较低，且最近移动到了 FLTK，但那无法使用。尽管有这些不便，CinePaint
    仍然是一个不可少的工具，如果项目继续进行，希望它能变得更加实用和稳定。


    ## Krita


    Krita 是 Krita 绘画程序，它足以让人们重新审视 Krita 的设计（图 2）。起初，它看起来和 GIMP 是完全不同的东西。它不是浮动窗口，而是单面板集成视图。坦率地说，Krita
    的设计非常现代，面板可以停靠，让用户可以随心所欲地配置。


    GIMP 功能，CinePaint 拥有色彩管理系统——这种缺失使得基于 GUI 的 GIMP 支持专业和准专业工作。它还有一个用于跟踪动画更改的播放器，可以输出到
    Cinema 和 OpenXR，以及用于组装动态 GIMP 快照（这一过程称为叠曝光）的优秀插件。它是目前 Linux 上唯一支持跟踪的开源 GIMP。


    差异也让 Krita 的方法脱颖而出。GIMP 最初被设计为使用 UNIX 来处理 Web，它在面对 Krita 前面的关键任务时很吃力。另一方面，它的设计目标不同——它直接针对图形专业人士。


    Krita 从底层构建在 LCM 之上，32 位色彩管理系统由构建良好、复杂的工具所环绕。它可以在不同的颜色空间之间工作，使其能够满足广泛图形专业人士的需求（CMYK
    和 RGB 只是开始）。对于打印工作，Krita 具有类似于 GIMP 的界面，使其感觉完全不同，但其范围是专业摄影师的工具箱（图 1）。


    CinePaint 从不用于修图，因此其摄影功能集与基础功能及它的一些新功能相比非常有限。它在 GIMP 的早期失败以及本质上的不同，意味着 GIMP 用户在面对早期
    CinePaint 时，会因这种似乎功能更高的感觉而感到沮丧。它很难编译，并且在某些系统上容易崩溃，这是我们格拉斯哥工程师范围的一部分。


