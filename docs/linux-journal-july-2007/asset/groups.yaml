    # INDEPTH


    ```

    $ convert rose.jpg -font helvetica -pointsize 20 -draw \\

    "gravity south \\

    fill black text 0.12 ''Nice pink rose'' \\

    fill white text 1.11 ''Nice pink rose'' rose-text.jpg

    ```


    4) Label the image on the top like:


    ```

    $ convert rose.jpg -gravity North -background green \\

    -splice 0x1b -draw 0.0 ''Nice \

    pink rose '' rose-top.jpg

    ```


    You can create a gallery from the images using mencoder or FFmpeg. But before
    that, let''s create the horizontal and vertical mirror images of the snaps. It
    will be interesting to combine the images with mirrors while playing the:


    ```

    $convert rose.jpg -flip rose-flip.jpg

    $convert rose.jpg -flop rose-flop.jpg

    ```


    These two commands create the vertical and horizontal mirror images, respectively.

    You can combine the mirrors with the original with append switch to convert:


    ```

    $convert rose.jpg rose-flip.jpg -append rose-vertical.jpg

    ```


    Instead of append, if you use +append it creates the images side by side, which
    is what we want to do with horizontal mirror images:


    ```

    $convert rose.jpg rose-flop.jpg +append rose-horiz.jpg

    ```


    You might consider the -resize or -scale option to convert all images to identical
    dimensions:


    ```

    $ mencoder "mf=%%*.jpg" -f fps=5:type=jpg -o \

    image-video.avi -vcodec lavc -v mpeg

    ```


    This creates a video with all the images displaying one after another of an image
    if all two images have identical dimensions, but in mind this will not work.

    Now, you can create a video with file to create a gallery that is playable on
    DVD:


    ```

    $ lav2av -in image.avi -i mpeg2enc -f h -o image.mv4

    $ mplex -f audio image-video.mv4 -o final-video.mpg

    ```


    Now copy the final-video.mpg into your DVD and you are done.

    You can generate the black white equivalents of color image using this command:


    ```

    $ explode rose.jpg -dump jpeg.grayscale-bw.jpg

    ```


    # Conclusion


    To create an image gallery, you need to obtain the thumbnails, border of images,
    also for the background music and


    ![](img/465f773ec3a6747b5eef398f28f808b8_73_0.png)


    Figure 2. Image with Text


    ![](img/465f773ec3a6747b5eef398f28f808b8_73_1.png)


    Figure 3. Image with Watermarking


    the text for annotating each image. You can also give the user the opportunity
    to provide a notation annotation.

    Once you have images, you can use the command-line ImageMagick to create a gallery
    and use a simple script to link them all with HTML and produce a Web page.


    Irish Kenashvili is a cryptographer with nearly a decade of experience working
    within modern UNIX systems. He has developed IPsec from scratch on the Nucleus
    OS for a router and with the help of Apache, OpenSSL and SSH. He can be reached
    at irish729@gmail.com.


    # Resources


    ImageMagick: http://www.imagemagick.org/use

    Netbm: netbm.sourceforge.net

    tif: bourbon.usc.edu/tif

    gallery2: gallery.sourceforge.net


