    # LINUX 杂志


    ![](img/465f773ec3a6747b5eef398f28f808b8_32_0.png)


    # 1994-2006 归档


    《Linux 杂志》第 1–152 期


    www.LinuxJournal.com/ArchiveCD


    包含 1994–2006 归档 CD、过期期刊及更多！


    # 新产品


    ## Tumbling Dice 的 Fedora colinux 教程


    ![](img/465f773ec3a6747b5eef398f28f808b8_33_0.png)


    这种视觉效果让你感到眩晕，在 Tumbling Dice 新出的 Fedora colinux 上享受舒适的拥抱，这是一种定制的 colinux 发行版，几乎可以在
    Microsoft Windows 环境下虚拟运行 Fedora Core。Tumbling Dice 声称它比标准的 colinux 更容易安装、拥有完整的手册、易于使用并具备了完整的
    Fedora Core 功能。该产品的目标客户包括不想使用双启动方案的“分析师”，以及拥有空闲计算资源来部署大规模应用（如数据库、模拟等）的公司和机构。软件手册也可以从公司网站下载。更多关于项目的信息请参阅
    colinux 链接。

    www.tumdice.co 和 colinux.wikia.com


    ## Addison-Wesley 的专业 Ruby 系列


    Addison-Wesley 正以大约每月一本的速度，在其不分媒介的“专业 Ruby 系列”大伞下，不断为 Ruby 和 Rails 开发者推出新资源。该系列的新产品之一是《Rails
    路由》，这是由作者 David Black 在 system.com 上编写的一份数字快捷教程（PDF 下载）。另一个新产品是《RailsSpace: 使用
    Ruby on Rails 构建网络网站》，由 Michael Hart 和 Aurelius Prochaska 编写。它能帮助开发者通过开发一个真实的应用程序来学习使用
    Ruby 构建工业级项目：““一个类似于 MySQL、Facebook 或 Friendster 的网络 网站”。最后，RailsSpace 还包含一个名为
    RailsSpace livelessures 的视频培训产品，已于 2007 年 7 月推出。

    www.awprofessional.com/ruby


    ![](img/465f773ec3a6747b5eef398f28f808b8_33_1.png)


    ## Solid Information Technology 和 Proven Scaling 的 DorsaSource


    ![](img/465f773ec3a6747b5eef398f28f808b8_33_2.png)


    在社区停止为其流行的数据库 MySQL 提供社区版后，臃肿问题的抱怨依然存在。为了安抚数据库的忠实用户，Solid Information Technology
    和 Proven Scaling 公司创建了 DataSource，一个 MySQL 及相关产品更新数据库库，涵盖的 MySQL 平台包括 Linux、Windows
    和 Mac OS X。该网站将由社区维护和运行。

    www.dorsource.org


    ## 美国 CD 回收中心


    ![](img/465f773ec3a6747b5eef398f28f808b8_33_3.png)


    美国 CD 回收中心并不是一个新产品，而是一种将旧产品——光盘——转化为新产品的手段。该中心回收所有尺寸的 CD 和 DVD，包括外盒、纸张和说明书。我们节省了能源和土地资源并减少了污染，我们的
    CD 将成为新一代产品的材料。中心创始人 Bennett 表示：“如果一个产品需要制造成一件无法自然回收的制品，那么他就有责任尽一切办法去寻找、收集、回收和使用尽可能多的该产品。我们再无法说得更华丽了。”

    www.cdrecyclingcenter.com


    32 | 2007年7月 | www.linuxjournal.com


    ## Wolfram Research 的 Mathematica


    当你阅读这里时，我们都欠你一个在你流水的口下接杯子的人情，因为 Wolfram Research 发布了其旗舰应用 Mathematica 的 6 版本。Mathematica
    6 是一个强大的通用计算环境，适用于大规模计算、复杂编程、可视化和建模，“20 年来最重要的进展是 Wolfram”，以及一种与数据世界交互的全新方式。”关键的新进展包括：动态界面创建；自适应可视化；符号界面构建；自主数据处理的改进；整个工作过程中的最终质量呈现；可计算源内置利用；以及图形、文本和控制的统一。Mathematica
    6 提供了适用于 Linux (SUSE, Red Hat, Fedora)、UNIX、Windows 和 Mac OS X 的 32 位和 64 位编辑器。

    www.wolfram.com


    ![](img/465f773ec3a6747b5eef398f28f808b8_34_0.png)


    ## FiveRuns 的 RM-Manage 和 RM-Install


    流行系统管理应用的制造商 Firms 正通过其 Rails 企业级管理套件进入新领域；


    ## Orange-Demand


    由于在其不分媒介的专业 Ruby 系列大伞下，Addison-Wesley 正以大约每月一本的速度，不断为 Ruby 和 Rails 开发者推出新资源。该系列的新产品之一是《Rails
    路由》，这是由作者 David Black 在 system.com 上编写的一份数字快捷教程（PDF 下载）。另一个新产品是《RailsSpace: 使用
    Ruby on Rails 构建网络网站》，由 Michael Hart 和 Aurelius Prochaska 编写。它能帮助开发者通过开发一个真实的应用程序来学习使用
    Ruby 构建工业级项目：“一个一个类似于 MySQL、Facebook 或 Friendster 的网络 网站”。最后，RailsSpace 还包含一个名为
    RailsSpace livelessures 的视频培训产品，已于 2007 年 7 月推出。


