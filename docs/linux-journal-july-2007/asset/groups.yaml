    \ on frame:\n```bash\n$ montage -frame +0+0 -background white -fill -label \"\
    Nice pink rose\" rose-text.jpg\n```\n\n3) You can also watermark:\n```bash\n$\
    \ convert rose.jpg -font helvetica -pointsize 20 -draw \"gravity south\" fill\
    \ black text 0.12 'Nice pink rose' fill white text 1.11 'Nice pink rose' rose-text.jpg\n\
    ```\n\n4) Label the image on the top like:\n```bash\n$ convert rose.jpg -gravity\
    \ North -background green -splice 0x1b -draw 0.0 'Nice pink rose' rose-top.jpg\n\
    ```\n\nYou can create a gallery from the images using mencoder or FFmpeg. But\
    \ before that, let's create the horizontal and vertical mirror images of the snaps.\
    \ It will be interesting to combine the images with mirrors while playing the:\n\
    \n```bash\n$convert rose.jpg -flip rose-flip.jpg\n$convert rose.jpg -flop rose-flop.jpg\n\
    ```\n\nThese two commands create the vertical and horizontal mirror images, respectively.\
    \ You can combine the mirrors with the original with append switch to convert:\n\
    \n```bash\n$convert rose.jpg rose-flip.jpg -append rose-vertical.jpg\n```\n\n\
    Instead of append, if you use +append it creates the images side by side, which\
    \ is what we want to do with horizontal mirror images:\n\n```bash\n$convert rose.jpg\
    \ rose-flop.jpg +append rose-horiz.jpg\n```\n\nYou might consider the -resize\
    \ or -scale option to convert all images to identical dimensions:\n\n```bash\n\
    $ mencoder \"mf=%%*.jpg\" -f fps=5:type=jpg -o image-video.avi -vcodec lavc -v\
    \ mpeg\n```\n\nThis creates a video with all the images displaying one after another\
    \ of an image if all two images have identical dimensions, but in mind this will\
    \ not work. Now, you can create a video with file to create a gallery that is\
    \ playable on DVD:\n\n```bash\n$ lav2av -in image.avi -i mpeg2enc -f h -o image.mv4\n\
    $ mplex -f audio image-video.mv4 -o final-video.mpg\n```\n\nNow copy the final-video.mpg\
    \ into your DVD and you are done.\nYou can generate the black white equivalents\
    \ of color image using this command:\n\n```bash\n$ explode rose.jpg -dump jpeg.grayscale-bw.jpg\n\
    ```\n\n# Conclusion\n\nTo create an image gallery, you need to obtain the thumbnails,\
    \ border of images, also for the background music and the text for annotating\
    \ each image. You can also give the user the opportunity to provide a notation\
    \ annotation.\n\n"
