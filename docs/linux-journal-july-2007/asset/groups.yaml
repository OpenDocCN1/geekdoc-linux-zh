  - "[PAGE 75]\n\n# # Programming Python, Part II\n\n# ## Covered some advanced features\
    \ in Part I, it's time to include basics.\n\nJOSÉ P. E. “PUPENO” FERNÁNDEZ\n\n\
    The tutorial in last month's issue covered the basics of installing Python, running\
    \ and using it. Then, we moved on building a basic blog in Python. The blog was\
    \ extremely simple—only a Python list. We focused on the posts and built a Post\
    \ class:\n\nwe can't delete a post. That might be good, but the important thing\
    \ is that by defining a set of methods, we exposed the design of how the class\
    \ should be used.\n\n```\nclass Post(object):\n    def __init__(self, title, body):\n\
    \        self.title = title\n        self.body = body\n```\n\n# To or Not to Publish\n\
    \nThe method get_posts returns all the posts. When we are writing a new post,\
    \ we don't want the whole world to be able to read until it is finished. The post\
    \ doesn't need a new member to tell whether it is published. In Post initializer,\
    \ __init__, we add:\n\n```\n    def set_title(self, title):\n        self.title\
    \ = title\n```\n\n```\n    def get_title(self):\n        return self.title\n```\n\
    \n```\n    self._published = False\n```\n\nThat makes every new post private by\
    \ default. To switch states, we\n\n```\n    def set_body(self, body):\n      \
    \  self.body = body\n```\n\n```\n    def get_body(self):\n        return self.body\n\
    ```\n\n```\n    def get_publish(self):\n        self._published = True\n```\n\n\
    ```\n    def hide(self):\n        self._published = False\n```\n\n```\n    def\
    \ __repr__(self):\n        return \"Post: %s\" % self.title\n```\n\n```\n    def\
    \ is_published(self):\n        return self._published\n```\n\nIn this follow-up,\
    \ let's focus on the blog and get further.\n\nIn these methods, I introduced a\
    \ new variable—the\nbolean, which can be true or false. To use it with a that:\n\
    \n# # The Blog\n\nNow that we have the posts, we can make the blog class. An\n\
    initial implementation might look like this:\n\n```\n>>> cool = BlogPost('Cool',\
    \ 'Python is cool')\n>>> cool.is_published()\nFalse\n>>> cool.publish()\n>>> cool.is_published()\n\
    True\n>>> cool.hide()\n>>> cool.is_published()\nFalse\n```\n\n```\nclass Blog(object):\n\
    \    def __init__(self, post):\n        self.posts = [post]\n```\n\n```\n    def\
    \ add_post(self, post):\n        self.posts.append(post)\n```\n\n```\n    def\
    \ get_posts(self):\n        return self.posts\n```\n\nWe are using a list to maintain\
    \ the posts, but the interface is\ntotal abstract about a huge advantage: we could\
