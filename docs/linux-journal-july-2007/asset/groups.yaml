    # 在 Linux 上烹饪


    ![](img/465f773ec3a6747b5eef398f28f808b8_25_0.png)


    录制整个桌面——或者在 Chrono（计时）中设置录制时间限制。默认情况下，rekordmydesktop 会录制整个桌面。要选择特定窗口，点击左侧的 Grab
    window（抓取窗口），或点击你想录制的程序（音频，你甚至可以点击 rekorddesktop 开始录制）。只需点击 Record（录制）按钮。


    该程序的一个特点是，你可以暂停录制，再次更改设置，完成后再次点击，OGG 文件即可准备保存。


    还有另一点：那个三标签页的界面。在 Settings（设置）选项卡下，可以更改和调整音频及视频设置，以平衡系统性能并提供最佳录制质量。这可能包括丢帧、多通道音频或在
    Advanced Settings（高级设置）中选择更高的采样率。你还可以选择备编码器（或不使用）、更改录制格式等。如果你更改得太多了，这里有一个方便的 Default
    Settings（默认设置）按钮。


    最后，朋友们（amis），我们称之为温暖。系统时钟稳定、不撒谎，让我们保持统一，并希望你们每一个人都尝试制作自己的屏幕录制。将文件保存到你的博客、网站或 YouTube
    上。如果你在此期间发现了更多值得分享的免费开源软件，也许我们乐意再次为你满杯。下次见，请举起杯，朋友们，让我们为健康干杯。干杯！（Santé !）


    图 5：rekordmydesktop 提供了一个丰富且易用的界面来创建屏幕录制。


    第一个标签页有两个功能：它允许定义你的录制目录（默认为 tmp），并允许定义保存录制文件的位置。录制保存为 ogg 格式。随后的录制将使用 ogg 格式。如果你希望
    get-recordmydesktop 每次都覆盖文件，请勾选 files 选框。在 Sound（声音）选项卡下，你可以更改音频通道数、频率和音频设备位置。在
    Video（视频）选项卡下，你可以先视觉上调整质量。


    对于需要其他工具的用户，Andreas Meropoulos 创建了 rekordmydesktop——一个功能丰富且极佳的前端录制器。该程序是一个简单的
    Kommander 脚本，因此不需要知道如何安装。只需将文件保存到桌面（或任何位置）并点击它即可。rekordmydesktop 对话（图 5）会根据需要出现。


    如你所见，这确实增加了很大的灵活性，可以为你的 OGG 文件定义文件名和位置。你需要的一切都涵盖在 Common Settings（通用设置）选项卡中。通过三个标签页，你需要的所有都在屏幕上，从开始录制。确保你点击了
    Capture Source（采集源）按钮键。你可以为录制器指定时间限制——你可以录制 rekordmydesktop，并在配置时在需要时最小化。


    请注意，Istanbul 以 OGG 格式保存，如果你之后想使用 FFmpeg 或编码器等程序进行处理。


