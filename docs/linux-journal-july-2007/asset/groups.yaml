    \ Also, make sure it is dithered. Save the image as uncompressed TIFF, and then\
    \ you are ready to recognize.\nThe recognition part is:\n\n```\n$ tesseract image.tif\n\
    ```\n\nThe third argument is the base name of the output file. Tesseract detects\
    \ the text automatically, so this makes the result be in text.\n\nThe underlining\
    \ in this example ended up significantly affecting the OCR. A few of lines were\
    \ recognized well, but two of them were completely unreadable after processing.\
    \ This underscores the importance of using a clean source before it. Manually\
    \ removing the destructively recognized it, would take more time than simply entering\
    \ the text manually.\n\n# ## How Does Tesseract Work?\n\nI wanted to do something\
    \ that would give me an idea of the power of Tesseract. I also wanted to compare\
    \ results with another open-source OCR system:\nI started by running some tests\
    \ to see how well Tesseract would do. My initial test used 200dpi screen capture\
    \ of text that included bold and italic fonts. Obviously, the text was free from\
    \ any noise or error introduced by a physical scanner.\nTesseract performed flawlessly,\
    \ recognizing 100% of the characters. It got the spacing just right, but not as\
    \ well. It failed miserably, missed several letters. The overall recognition rate\
    \ on a perfect input was 95%.\nI wanted to do some torture tests to see how well\
    \ Tesseract would handle difficult conditions. I used Adobe OCR to scan documents,\
    \ and it returned some errors. I had to fix the tilted lines (as we did in GIMP)\
    \ and remove distortion (for example, due to bold pulling the edge of the page\
    \ from the scanner). I also scanned pages that were skewed.\nSo, I found a 72dpi\
    \ scanned image that had some glitches. 72dpi is half width. The text was dark\
    \ and bled into the letters, and the edges of the lines were bent. The original\
    \ image was not skewed.\nI image quality and contrast were poor. I used GIMP removing\
    \ the lighting variance, as described above. I did nothing to correct the lines,\
    \ nor did I increase the dpi in any way.\nTo surprise, Tesseract managed a 97%\
    \ recognition rate!\n\n| Test conditions | ocrad | Tesseract |\n| --- | --- |\
    \ --- |\n| 200dpi, clean, includes italics/bold | 95% | 100% |\n| 72dpi, black\
    \ and white | 0% | 97% |\n| 72dpi with minor distortion | 0% | 97% |\n| 72dpi,\
    \ minor linear distortion, and skewed 2 | 0% | 96% |\n\n# ## Font variants, image\
    \ problems make it extremely difficult to design an algorithm that can translate\
    \ the image of text into actual text.\n\nof the errors was missing a c (which\
    \ were for mis distorting in the original), and many of the errors were recognized\
    \ in the areas where the linear distortion occurred.\nNow, I used GIMP to rotate\
    \ the image as I could with out the text for alignment. Surprisingly, Tesseract\
    \ managed a 96% recognition rate, the inately helped with the linear distortion,\
    \ and the recognition errors were clustered than before.\nNow I was curious as\
    \ to how OCR would fare. It did not fail. In fact, miserably did more poorly on\
    \ the quality input than Tesseract did. The de-skewed text was much better. The\
    \ results and comparison are shown in Table 1.\n\n# ## Getting the Best Results\n\
    \nThe tests indicate that the recommended inputs I have for Acrobat are quite\
    \ sane. I recommend using your documents at 150dpi or higher. If you try putting\
    \ your scanner in grayscale and black and white-mode; the threshold routines in\
    \ you can actually get better results than the manually handled method described\
    \ in this article.\nTesseract does not seem to be perfect, although due to book\
    \ binding did seem to see some problems. Many professional scanning can remove\
    \ the pages from being bundled.\n\n# ## Automating the Process\n\nThe GIMP gives\
    \ you fine control over image, but if you have a consistent environment and a\
    \ lot of pages, you will want to automate the image cleanup as much as possible.\n\
    \ recommend using Netscript for this, preferably version 10.34 which comes with\
    \ a more powerful threshold filter. Unfortunately, it is not a super-stable version,\
    \ so many systems will have an older version.\nIf you are using another script,\
    \ you can get acceptable results with a pipeline of commands like:\n\n```\n$ tesseract\
    \ -config image.tif | |\npantmidithber -threshold value = 0.8 | \npantomtom >\
    \ result.tif\n```\n\n46 | July 2007 www.linuxjournal.com"
