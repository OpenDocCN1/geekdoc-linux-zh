    \ of this article.). Tesseract has radical analysis, but it means it can read\
    \ only uncompressed TIFF. This might take a little work on your scanned document\
    \ to get the best results. Frankly, the steps are automated and most of them are\
    \ worth it. This is what you need to do:\n\n- Use threshold to drop variations\
    \ and convert the image to black.\n- Erase any graphics (optional, but if you\
    \ skip this step the recognizer will give a bunch of garbled text in those areas).\n\
    - Break any columns into smaller columns.\n\n![](img/465f773ec3a6747b5eef398f28f808b8_44_0.png)\n\
    \nFigure 1. Threshold dialog in GIMP. Slide the left and right to choose which\
    \ pixels are white and which are black.\n\nI recommend using a program, such as\
    \ GIMP, to get a feel for what needs to be done. The most important step is the\
    \ first one, as it improves the accuracy of OCR. First, go to Image->Mode and\
    \ make sure the image is RGB or Grayscale mode. Threshold will not work on indexed\
    \ images. Next, use Colors->Threshold. This will allow you to drop pixels above\
    \ a specified value and convert them to black. The popup lets you get an idea\
    \ of how it affects the image. Slide the left and right to get a good-looking\
    \ result for the white and black. Then, execute the rest. Figure 2 shows a typical\
    \ result of this step. This page had handwritten notes, outlining a section of:\n\
    \n![](img/465f773ec3a6747b5eef398f28f808b8_46_1.png)\n\nFigure 2. Image preparation.\
    \ From left to: the original image, the image after threshold, and the image after\
    \ manual cleanup.\n\nwww.linuxjournal.com july 2007 | 45\n\n# Tesseract Features\n\
    \nLighting that cannot get rid of without compromising the rest of the image.\
    \ Use a brush to paint over any easy-to-fixes. I would not recommend using it\
    \ on times when the extra information (like noise and so on) has some distance\
    \ from the text. Tesseract might insert a few garbled characters, but those in\
    \ a text editor resulting image should look like the third part.\n\nNow, switch\
    \ the image to indexed mode (using the menu selection Image→Indexed), and choose\
    \ black and white (palette). Also, make sure it is dithered. Save the image as\
    \ uncompressed TIFF, and then you are ready to recognize. The recognition part\
    \ is:\n\n```bash\n$ tesseract image.tif\n```\n\nThe third argument is the base\
    \ name of the output file. Tesseract detects the text automatically, so this makes\
    \ the result better.\n\nThe underlining in this example ended up significantly\
    \ affecting the OCR. A few lines were recognized well, but two of them were completely\
    \ unreadable after processing. This underscores the importance of using a clean\
    \ source before. Manually removing the distortions would take more time than simply\
    \ entering the text manually.\n\n## How Does Tesseract Work?\n\nI wanted to do\
    \ something that would give me an idea of the power of Tesseract. I also wanted\
    \ to compare results with another open-source OCR system:\n\nI started by running\
    \ some tests to see how well Tesseract would do. My initial test used 200dpi screen\
    \ capture of text that included bold and italic fonts. Obviously, the text was\
    \ free from any noise or error introduced by a physical scanner.\n\nTesseract\
    \ performed flawlessly, recognizing 100% of the characters. It got the spacing\
    \ just right, but not as well. It miserably missed several letters. The overall\
    \ recognition rate on a perfect input was 95%.\n\nI wanted to do some torture\
    \ tests to see how well Tesseract would handle difficult conditions. I used Adobe\
    \ OCR to scan documents, and it returned some errors. I had to fix the tilted\
    \ lines (as we did in GIMP) and remove distortion (for example, due to bold pulling\
    \ the edge of the page from the scanner). I also scanned pages that were skewed.\n\
    \nSo, I found a 72dpi scanned image that had some glitches. 72dpi is half width.\
    \ The text was dark and bled into the letters, and the edges of the lines were\
    \ bent. The original image was not skewed.\n\nThe image quality and contrast were\
    \ poor. I used GIMP removing the lighting variance, as described above. I did\
    \ nothing to correct the lines, nor did I increase the dpi in any way.\nTo surprise,\
    \ Tesseract managed a 97% recognition rate!\n\n| Test conditions | ocrad | Tesseract\
    \ |\n| --- | --- | --- |\n| 200dpi, clean, includes italics/bold | 95% | 100%\
    \ |\n| 72dpi, black and white | 0% | 97% |\n| 72dpi with minor distortion | 0%\
    \ | 97% |\n| 72dpi, linear distortion, and skewed | 0% | 96% |\n\n## Getting the\
    \ Best Results\n\nThe tests indicate that the recommended inputs I have for Acrobat\
    \ are quite sane. I recommend using your documents at 150dpi or higher. If you\
    \ try putting your scanner in grayscale and black and white-mode; the threshold\
    \ routines in you actually get better results than the manually handled method\
    \ described in this article. Tesseract does not seem to be perfect, although due\
    \ to book binding did seem to see some problems. Many professional scanning can\
    \ remove the pages from being bundled.\n\n## Automating the Process\n\nThe GIMP\
    \ gives you fine control over image, but if you have a consistent environment\
    \ and a lot of pages, you will want to automate the image cleanup as much as possible.\n\
    recommend using Netscript for this, preferably version 10.34 which comes with\
    \ a more powerful threshold filter. Unfortunately, it is not a super-stable version,\
    \ so many systems will have an older version.\nIf you are using another script,\
    \ you can get acceptable results with a pipeline of commands like:\n\n```bash\n\
    $ tesseract -config image.tif | |\npantmidithber -threshold value = 0.8 | \npantomtom\
    \ > result.tif\n```\n\n46 | July 2007 www.linuxjournal.com\n"
