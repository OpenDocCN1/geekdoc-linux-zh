    # Palming Linux


    The term PDA (personal digital assistant) was coined in 1992 by Apple CEO John
    Scully to name a category for a new class of handheld devices, inaugurated by
    Apple''s Newton. Scully moved on and Newton flipped, but the category stayed.
    Starting with the Palm Pilot in 1996, the Palm brand has become synonymous with
    the PDA category, even as the company called Palm has gone through multiple incarnations
    and the most modern PDAs are also cell phones.


    From the beginning, Palm had its own operating system, called PalmOS (Garnet).
    In recent years, the company has added Windows Mobile for use of its cell-phone
    PDAs. (For example, the Palm T700 comes in Palm and Windows versions.)


    Then, at its Analyst and Investor Day in April 2007, Palm announced to merge its
    PalmOS development together with the Linux Kernel with plans to come out with
    Linux-based Palm before the end of this year.


    # Managing the Platform Transition


    ![](img/465f773ec3a6747b5eef398f28f808b8_15_0.png)


    Figure 1. Palm Linux-Based Products


    We don''t have more specifies at time, but we have a copy of visual used by Palm
    at the announcement (Figure 1).


    Looks like another example of Domination at work. Resistance is futile.


