    # COOKING WITH LINUX


    ![](img/465f773ec3a6747b5eef398f28f808b8_25_0.png)


    whole desktop—or set a time limit on the recording (in the Chrono). By default,
    rekordmydesktop captures the entire desktop. To select a window, click the Grab
    window on the left, or click on the program you want to capture (audio, you can
    even click rekorddesktop to start recording). simply click the Record button.


    One thing about this program is that you can pause a recording, change things
    again, then when you are done, click again and the OGG file is ready to save.


    There is another thing: that three-tabbed interface. Under the Settings tab, audio
    and video settings can be changed and tuned to give you a recording that balances
    your system performance to provide the best quality. This might include dropping
    frames, multichannel audio or choosing a higher sampling rate in the Advanced
    Settings. You can also select an alternate codec (or none), change the recorder
    format and more. If you''ve gone and changed things for too much, there''s a handy
    Default Settings button for here.


    And after all, amis, what we call a warm. The system clock, stable, not lying,
    and keeps us near to unity and every one of you to try your own screencasts. Save
    the file to your blogs, web sites or YouTube. If you find more free open-source
    software worth sharing in the meantime, perhaps we will be glad to refill your
    glasses once more. Until next time, please raise your glasses, we, amis, and let
    us drink a toast to another''s health. Santé !


    Figure 5: rekordmydesktop provides a rich, easy-to-use interface for creating
    screencasts.


    The Tab has two functions. It allows to define your recording directory (tmp is
    default), and lets define where you want to save files as recorded. The recordings
    are saved as ogg. Subsequent recordings will use the ogg format. If you would
    rather have get-recordmydesktop overwrite the file each time, check the box on
    the files. Under the Sound tab, you can change the number of audio channels, the
    frequency and the audio device location. Under the Video tab, you can first visually
    adjust the quality.


    For users who need other tools, Andreas Meropoulos has created rekordmydesktop—a
    feature-rich and fantastic front end recorder. This program is a simple Kommander
    script, and so that, it doesn''t require you to know how to install. Just save
    the file to your desktop (or any location) and click on it. The rekordmydesktop
    dialogue (Figure 5) appears just as needed.


    As you can see, this does add great flexibility, with a definable filename and
    location for your OGG file. Everything you need is covered in the Common Settings
    tab. From these three tabs, all of what you''ll need is on the screen to starting
    with record. To make sure you click the Capture Source button key. You can specify
    a time limit to your recorders—you can screencast rekordmydesktop, and when you
    want to minimize it when configuring


    Note that Istanbul saves in OGG format, if you want something after the fact using
    a program like FFmpeg or encoder.


