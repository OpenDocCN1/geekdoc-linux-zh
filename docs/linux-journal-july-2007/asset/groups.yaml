    作为支持 Linux、UNIX 和 Mac OS X 上 C、C++ 和 Fortran 的完整多核调试和性能工具套件的一部分，TotalView 8.1
    是你可以应对所有多核调试需求的唯一可靠解决方案。TotalView 旨在帮助调试全球最严苛的应用而开发，功能极其强大且易于使用。它以视觉为驱动，提供了增强的图形化表示，使用户能够快速识别问题并放大以识别根源。TotalView
    不需要插桩、重新链接或重新编译。TotalView 已证明可以缩短高达 80% 的调试时间。


    **立即免费试用！访问 [www.totalview.tech/command](http://www.totalview.tech/command) **为你的
    15 天试用版本升级功能，或拨打 1-800-856-3766** 获取更多信息。


    ![](img/465f773ec3a6747b5eef398f28f808b8_8_1.png)


    © 2007 TotalView Technologies, LLC TotalView 是 TotalView Technologies, LLC 的注册商标。所有其他名称均为各自持有者的商标。


    ## 信件


    ![](img/465f773ec3a6747b5eef398f28f808b8_9_0.png)


    喜欢 Ajax。我经常在 JP 中使用它。但拜托吧！它不是一项技术，但至少从 2006 年 10 月起，每一期《Linux Journal》都有它的报道。


    “At the Forge”可以涵盖哪些非 Web 开发话题？


    让我们回顾一下：


    - 2006 年 10 月：At the Forge—“JavaScript、表单与 Ajax”

    - 2006 年 11 月：At the Forge—“初识 Ajax，”——用 Aster 和 Ajax 调用它

    - 2006 年 12 月：At the Forge—“Ajax 设计”

    - 2007 年 1 月：At the Forge—“Prototype”（Ajax）；语义化网

    - 2007 年 2 月：At the Forge—“Scriptulous，”Ajax

    - 2007 年 3 月：At the Forge 带回并使用 Ajax

    - 2007 年 4 月：At the Forge—“Dojo 事件与 Ajax”

    - 2007 年 5 月：无处可见！


    Marc，我们会尽力涵盖不同的领域。然而，Ajax 是一种极其流行的方法，具有丰富的客户端体验。它的平台中立性和广泛的 Linux 工具使其成为一个令人兴奋的话题。


    ## 读者对 Ajax 的赞赏


    我想告诉你们，关于行业中 Ajax、Ruby 和编程语言的报道简直太棒了。我很兴从 ASU 州理工学院购买了订阅，我认为你们工作得非常出色。


    Karol，让我来说我喜欢 Ajax 的哪些方面。我期待每一期杂志，并享受几乎所有的内容——即使是 Marvel。


    Karol，我读你们的杂志很多年，我订阅过几个月——优秀的杂志。我不满的地方是，你们的杂志太关注 Ajax 了。不要误会我：


    ## Ajax 示例是错误的


    我尝试了 2007 年 5 月文章中的许多示例，发现所有示例都由于同一个 bug 失败了。这个问题在所有示例中都可以简化为两行。Ajax 真的是一个每期都需要涵盖的主题吗？这仍然是《Linux
    Journal》，难道没有其他……


    - 既然自: 26936

    - 维护者：Eric Durland (eric@debian.com)

    - 架构：i386

    - 版本：2.0


    从杂志来看：PS。一个小建议：如果作者们真的列出了 HTML 就好了：


    ```javascript

    http(''GET'', url = escape(zipValue));

    readystatechange = handlerResponse(http);

    ```


    ```html

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML1.0//EN" "http://www.w3.org/DTD/html-strict">

    <!-- 示例中缺少 Doctype 声明 -->

    <html xmlns="http://www.w3.org/1999/xhtml">

    <title>Ajax</title>

    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8"/>

    ```


    正确的方法：


    ```javascript

    onreadystatechange = handlerResponse(http(''GET'', url = escape(zipValue)));

    ```


    问题是在调用函数定义之前，结果将落空。调用后，脚本的控制仍然存在，在所有的示例中都缺少了属性：foo。


    除了这个根本性的变化，你还会期待什么？Linux Journal 是一本很棒的杂志。我的 OS: Debian

    - 浏览器：dpkg -s keep

    - 软件包：keep

    - 状态：已安装

    - 优先级：可选

    - 章节：web


    Michael Rasmussen，我尝试了所有事情，都成功了。但我听你的，在其他环境中出现了问题。感谢这些提示和建议。


    2007 www.linuxjournal.com


