  - "[PAGE 63]\n\n# The generation of prelight images for mouse-events can be automated\
    \ by adjusting the brightness or contrast of each layer.\n\n# Images with a 1-Bit\
    \ Alpha Channel\n\nAs a first example, suppose we have an image file that has\
    \ 8-bit transparency and we want to import this as a GIF with only one bit of\
    \ alpha mask. To make this look best, we should perform some processing on pixels\
    \ that are not fully opaque or fully transparent. Semi-transparent pixels could\
    \ be mixed with a designed background color in order to appear an appearance,\
    \ without any special treatment. Semi-transparent pixels could be mixed with a\
    \ designed background color in order to appear an appearance, without any special\
    \ treatment.\n\nThe image is shown (Figure 3) with the soft shadow blurred to\
    \ a single-bit alpha mask which is exported to an image that looks poor. Alaising\
    \ with the gray background will be merged into the imported image which has jagged\
    \ edges, and it will not give a pleasant appearance, as shown in Figure 4. The\
    \ best choice of gray as a background, the edges are extremely jagged, and the\
    \ soft shadow effect is lost.\n\nIn the next code listing 2, we take your image\
    \ file by processing the GIMP to convert output file path and create an image\
    \ that is suitable for using with a 1-bit alpha mask. The GIMP input and output\
    \ images can be read or write. This script is most likely reading an xcf file\
    \ and writing a PNG file. The PNG image is processed later with the webgif script\
    \ to obtain the final image.\n\nListing 5. Finally, convert to a 6-bit GIF for\
    \ the Internet.\n\n```\n$ gimp-monkeyq-webgif \\\n--inputimage Button-bunicely-merged-with-green.png\
    \ \\\n--outputimage Button.gif -dither 64\n$ identify Button.gif\nButton.gif 317x213\
    \ 317x213jX+i+h=0 PseudoClass\n```\n\nListing 6. Export to a GIF image with some\
    \ other options. Do we need those 8 bits for this image?\n\n```\n$ sub_to_web\
    \ {\n  my($imagename, $filename);\n  (num_cols, $use_dither) = @;\n  $palette_type\
    \ = @;\n  $image = GIMP-file_load($imagename, $filename);\n  ($image);\n  GIMP-convert_indexed($image,\
    \ $use_dither);\n  ($palette_type, $num_cols, 1);\nn  GIMP-output($image, $filename);\n\
    }\n\n{PF_STRING, \"inputimage\",\n\"Name of image to export\", \"\",\nPF_STRING,\
    \ \"outputimage\",\n\"Name of image to save to\", \"\"\nPF_INT, \"depth\", \"\
    depth\", \"255\"\nPF_INT, \"dither\", \"dither\", \"1\"\nPF_INT, \"alpha\", \"\
    1\"}\n```\n\nListing 4. Merge the background with the nasty gray color.\n$ gimp-monkeyq\
    \ \\\n--inputimage Button-with-8Bit-alpha.xcf \\\n--outputimage Button-bunicely-merged-with-green.png\
    \ \\\n--alphascolor #08ff00\n\n![](img/465f773ec3a6747b5eef398f28f808b8_63_0.png)\n\
    \nLet's walk through the code listing 2. The GIMP API is imported, and then the\
    \ main function of the script is declared with arguments clearly stated as variables.\
    \ Skipping the function then results at the bottom of the script giving metadata\
    \ for the GIMP as well as options that should show menus and the number and types\
    \ of arguments it actually does work with a reference to the function above. There\
    \ is only a bit of argument checking before handling control over the GIMP.\n\n\
    With the metadata-handler get out of the way, the script goes to convert function\
    \ file is loaded and a new layer, layer, is created with the dimensions as the\
    \ image itself, and it will be filled with the named background color. This new\
    \ layer is then put to the button, and visible layers are merged. This makes all\
    \ the transparency in the background evaluated. In the case of our background\
    \ as a background, the input xcf file has the gray background layer hidden, if\
    \ the script is run with the bright green background color nominated, the soft\
    \ drop is blended with the green in accordance each\n\n![](img/465f773ec3a6747b5eef398f28f808b8_63_1.png)"
