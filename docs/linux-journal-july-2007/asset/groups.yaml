    \n  height=$factor\necho \"$(scale=4;$height/$bc) | cut -d ' ' -f1)\"\nfi\n```\n\
    \necho \"Given $height, scaled to\"\necho \"$nw $nh\"\n\nCool. If the image is\
    \ too big, we can scale it automatically and adjust the height and width parameters\
    \ as needed. If it is small, nothing changes. A test run:\n\n+   - 161230, scaled\
    \ to 139200.\n- 268202, scaled to 200x150.\n- 567294, scaled to 200x103.\n- 358313,\
    \ scaled to 200x174.\n- 350350, scaled to 200x199.\n\n**Last Step: Aligning Lines**\n\
    With of this tucked into the script, we use a skeleton to organize lines nicely.\
    \ In a rough form, it will look like:\n\n```\n<table border=\"0\">\n  <td align=\"\
    center\"></td>\n  <td align=\"center\"></td>\n  <td align=\"center\"></td>\n</tr></table>\n\
    ```\n\nDropping it out will leave the key block that displays the image, and keeps\
    \ tracks of which when we need to produce a new row in the:\n\n```\nif [ $linecount\
    \ -eq $maxline ]; then # row of table\n```\n\n![](img/465f773ec3a6747b5eef398f28f808b8_28_0.png)\n\
    \n```\necho \"</tr></tr>\"\nlinecount++\necho \"<td align=\"center\" valign=\"\
    bottom\">\nnecho \"  <a href=\"$name\"><img src=\"$name\" border=0 width=\"$width\"\
    \ height=\"$height\"></a>\"\nnecho \"</td>\"\nnecho \"</tr></table>\"\necho \"\
    $(($linecount=$( $linecount + 1 ))\"\n```\n\nNow, I want to write a highly readable\
    \ script, it's worth noting that the top section you configure out of:\n\n```\n\
    maxsize=$1\n# thumbnail size, in pixels\nmax=$2\n# max rows per row\n```\n\nBoth\
    \ of these can be used as needed.\nThe result? See Figure 1! If you'd like to\
    \ get a copy of it, please over to my site: www.intuitive.com/wicked/image. Save\
    \ it as index.html in your directory on your Web server.\n\nDave Taylor is a 26-year\
    \ veteran of UNIX, the creator of Elm Mail System, and most recently author of\
    \ the best-selling Wicked Shell Scripts and Teach Yourself in 24 Hours, using\
    \ his 16 technical tricks. His main website is at www.intuitive.com, and he also\
    \ offers tech support at DaveTaylor.com.\n\n> Figure 1. Example\nResult from the\n\
    New Script"
