    # Incredibili Distribuzioni Gratuite intorno


    ## Racconto di un mese di frenesia tra distribuzioni gratuite.


    Ho iniziato la mia frenesia di acquisti per vedere cosa c''era in giro. Ok, è
    stata davvero una frenesia di acquisti, perché ho speso tanto tempo tra un e l''altro.
    Ma ho provato le distribuzioni per un mese per trovare un progetto in cui il gratis
    sia nel Linux oggi.


    Nonostante i rischi e quanto sia fastioso gestire la moltitudine di sistemi passando
    dall''uno all''altro, Ubuntu rimane la mia preferita. Ora faccio girare Ubuntu
    7.04 e 7.6 AM64 da molti giorni. Perché non usare qualcos''altro? Non puoi usare
    la versione AM64 solo perché ti va.


    Ubuntu, ovviamente, è il tipo di Ubuntu basata su GNOME. Sono passato a Ubuntu
    solo perché l''installazione di Ubuntu era semplice quando ho sostituito il disco
    principale del mio server. I "Happy Days" di Ubuntu e li ho usati così.


    Ubuntu ora ha più spin per gli "Happy Days". Per quelli di voi che ricordano i
    Happy Days erano uno stile americano amato, potreste capire perché faccio questo
    particolare confronto. Sebbene siano spin-off di Ubuntu, Ubuntu è solo uno dei
    molti spin-off di Debian. L''ho installato sulla sua partizione dedicata e poi
    l''ho comprato. Poiché Ubuntu misura e offre aggiornamenti più stabili, alcuni
    precedenti spin-off di Debian stanno passando a Ubuntu come base. Ma se è rassicurante
    sapere che Debian continua a migliorare lentamente ma regolarmente, io ci torno
    sempre, con grande soddisfazione. Uso il branch instabile di Debian, che è il
    nome più inappropriato che ci sia mai stato. Il branch instabile rimane stabile,
    ma la differenza di data sta diventando marcata.


    Mi piace seguire Freerespire/Linux basato su Ubuntu e il nuovo basato su Ubuntu.
    Il mio spin di Linux Ubuntu preferito è Linux Mint. Mint arriva con una molteplicità
    di scelte che quasi non dovrebbero ignorare, e quella che argomentavamo potrebbe
    essere migliore se non installate una copia di Windows 11. Se trovate problemi
    in questo pacchetto, potete installare KDE invece.


    Zandros è basato su Debian, ed è una cosa fantastica. L''unica cosa che non mi
    piace è che usa Leo invece di GRUB, il che lo rende diverso da molte distribuzioni.
    Ne ho provate molte e Knoppe, altre basate su Debian, è ancora incredibile quando
    si tratta di rilevamento''hardware. Sto perdendo interesse per Knoppe, però, Ubuntu
    è meglio.


    Fedora è anche una bella cosa, ma non posso ancora usarla. Forse sto facendo qualcosa
    di sbagliato e potete dirvelo, ma non riesco a usare i pacchetti nel tempo in
    cui usavo Yum install/update per decine di pacchetti. E, quanto riguarda l''aggiornamento
    grafico di Yum. Spesso presumo semplicemente che sia bloccato e lo uccido. E senza
    mai incontrare le distribuzioni basate sulle dipendenze, ho problemi con Fedora.


    PLLinux, una versione potenziata di Mandriva, è ottima, ma non è il momento. Forse
    parlerò del prossimo rilascio - non è un''ottima distribuzione, ma rifiuto usarla
    perché è legata a Novel e non alla sua fine. Non offre mai nulla che spinga a
    cercare alternative.


    Mi piace molto la mia vita con Gentoo finché va, ed è per la stessa causa dei
    pacchetti rotti e obsoleti. Sabayon Linux basato su Gentoo è quello che fa per
    me e mi fa ballare. Sabayon è così completo ed è l''unico che imposta automaticamente
    l''ambiente 3D senza dover fare modifiche. L''unica cosa che non è soddisfacente
    è quando provo a usare software con il sistema del progetto Gentoo. Ho appena
    configurato nuovi spin di Debian - andranno davvero a vedere se riesco a ottenere
    l''aggiornamento dei pacchetti.


    Uso Damn Linux sul mio laptop Compa con 256MB di RAM semplicemente perché non
    fa girare nulla di più pesante di così.


    Credetci o no, negli ultimi mesi ne ho provate più di queste, ma abbiamo finito
    lo spazio. Spero di provarne ancora alcune versioni di Ubuntu. Non penso che si
    possa sbagliare con nessuna di esse.


    Nicholas Riley, Direttore Editoriale


    Nicholas Petley è Direttore Editoriale di Linux e un ex programmatore, analista
    e consulente che lavora scrivendo di Linux da più di dieci anni.


    96 | Luglio 2007 www.linuxjournal.com


