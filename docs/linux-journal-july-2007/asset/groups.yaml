    # Directories of Podcasts\n\nNow, we have a directory full of xmf product images\
    \ and we want to combine all these images onto a background image and scale them\
    \ to the same size. This can be done from a Makefile as shown in List 10. The\
    \ Makefile creates a JPEG for every file in the current directory. Each JPEG targets\
    \ are processed the same way, and the JPEG is dependent on its xmf file. If we\
    \ use one of the GIMP product images (xfm), the Makefile will only extract that\
    \ xmf.\n\nA thumbnail is also created for each product. Catch is here the thumbnail\
    \ which is expected to be at a different offset on the background image. This\
    \ means the thumbnail to have all the image data shifted relative to the background\
    \ prior to scaling and saving. If many products are on a single\n\nshared MonkeyIQ/GIMP\
    \ module, so that all scripts can toggle visibility too.\nLet's look at one more\
    \ script before moving on. The generation of presets for mouse-over events can\
    \ be automated by adjusting the brightness or contrast of each layer.\nThe script\
    \ and arguments are shown in List 9. A slight brightening in brightness (by 5\
    \ or 10) is usually enough to make a quick preset image for many images.\n\n#\
    \ The dimensions of images also can be set for size in PHP Web pages.\n\n66 |\
    \ July 2007 www.linuxjournal.com"
