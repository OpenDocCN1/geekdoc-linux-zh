    A dialog labeled Save Screenc appears (Figure 2).


    On the left-hand side of that dialog, there''s a preview window showing your captured
    video. To preview it before saving it, click the Play button below the preview
    window. On the top left, you can enter a file for your video and select a format
    to save it. As you may have guessed from this dialog, it''s a Qt application,
    but it works well under KDE also.


    Note that Istanbul is saved in OGG format, if you want something else, you have
    to convert it after the fact using a program like FFmpeg or encoder. Many Linux
    distributions come with a copy of FFmpeg or provide it in their repositories.
    It is simply simple. For instance, to convert an OGG video to an AVI file, might
    use this method:


    ```

    ffmpeg -i recording.ogg newrecording.avi

    ```


    As you might expect, there''s lot more to the program, but it can be simple. For
    a whole lot about FFmpeg, check your connection online.


    ![](img/465f773ec3a6747b5eef398f28f808b8_24_0.png)


    > NOTE. Usually, the reason for doing this conversion, is to provide to friends
    who are running another operating system. Or, you could download OGG codecs instead,
    which would be easier to enjoy completely free video and audio.


