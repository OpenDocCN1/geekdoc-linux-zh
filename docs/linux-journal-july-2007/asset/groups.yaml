    # # Case studio: GRUPPO SACE


    # ## capabilities


    Implementazione del modello logico di SACE la gestione del cliente: il CRM gestisce
    la gestione automatica della fase "ciclo di vita" del cliente acquisto o previsto
    (lead and prospect) e l''allocazione del portafoglio.


    Organizzazione delle informazioni e dei contatti: attraverso CRM EasyContact puoi
    strutturare, reperire e monitorare informazioni utili all''operatività attività:


    +   - registrare contatti,

    - analizzare e selezionare la cliente,

    - recuperare e organizzare informazioni relative ai contatti, aziende, associazioni,
    minister,,este gestionali,

    - coordinare gli obiettivi di attività (inviti ad eventi, invii di newsletters,
    annual reports..)


    Gestion of Business Opportunity: il CRM gestisce in segnalazione di acquisto tutti
    i clienti potenziali le opportunità di up-sell o cross-sell su SACE o altre Controparti


    Gestione delle Pipeline: il sistema permette di gestire trattative commerciali
    (Pipeline) consultando l''avanzamento (percentuale e stato di avanzamento). Le
    informazioni relative alle trattative sono organizzate in due aree: operative
    e ''note book" disponibili solo al team richiesto.


    Acquisizione Operativa e Monitoraggio Dati Industriale: il CRM è integrato con
    il sistema industriale al fine di acquisire per i dati di sintesi delle relazioni
    dei clienti SACE, domande, promesse di garanzia, documenti dell''analisi.


    Campaign Management: State attive funzionali a supporto di Campagne Commerciali
    dei clienti referenti o opportunità attuali.


    Reporting: sono state rese disponibili funzionali per elaborare report di dettaglio
    utilizzando le varie analisi di marketing del portafoglio dei clienti e a monitorare
    l''operatività di SACE attraverso report pianificati di obiettivi, eventi, pipeline


    # ## risultati


    Il 2006 è stato per GRUPPO SACE un anno di crescita, coronato da risultati positivi:
    solo nel primo semestre, l''utile netto ha generato 542,7 milioni di Euro, nonostante
    un incremento del 15% rispetto al 2005.


    Fattori determinanti della crescita sono stati gli aumento dei premi consolidati
    (123,0 milioni di Euro, di SACE (+85% rispetto al maggio 2005), il risultato tecnico
    di (+22%), il risultato della gestione finanziaria (71,1 milioni di Euro).


    Nel 2006 SACE ha ottenuto il Moody''s rating Aa2, a pari della Repubblica Italiana.


    # ## SugarCRM


    Il più importante software "Open Source" dedicato alla gestione delle relazioni
    con la clientela CRM (customer relationship management), rappresenta uno strumento
    innovativo rispetto alle soluzioni commerciali private.


    Le limitazioni del software open source potrebbero rispondere alla mancanza di
    risorse, elevati costi, di struttura di "storgenti", elementi che hanno causato
    il fallimento del più del 70% dell''utilizzo di CRM.


    SugarCRM, rappresenta un prodotto innovativo tecnicamente avanzato: ambiente di
    sviluppo PHP, Database MySQL, server Apache e IIS, con sistemi operativi Linux.
    Supporta le piattaforme LAMP e WIMP. Windows, Linux, Integrabile, con Data Base
    (Microsoft SQL Server,


    Facile da integrare con API e dati già presenti in azienda, con sistemi VoIP (Voice
    over Internet Protocol), fornisce una piattaforma condivibile in tutto mondo in
    grado di soddisfare le esigenze della maggior parte degli utenti.


    Grazie alla grande qualità che ha reso il prodotto proposto di essere "free" (o
    "Pay for use") per ogni investimento di marketing, è possibile ottenere rapidamente
    gli incrementi dei risultati.


    # ## Mediamind


    Partner tecnologico di SugarCRM in grado di fornire supporto specializzato all''implementazione
    di metodologie di CRM, sia nel predisore e per personalizzare soluzioni su misura
    per le esigenze del cliente.


    Le competenze richieste dedicate espressamente per il supporto, l''assistenza
    e personalizzazione del prodotto SUGARCRM sono gli elementi che caratterizzano
    il prodotto Mediamind.


