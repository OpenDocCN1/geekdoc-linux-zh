    \nwww.linuxjournal.com 2007年7月 | 43\n\n# Tesseract：开源光学字符识别引擎\n\nTesseract 是一个奇特的命令行工具，表现非常出色。\n\
    \n**ANTHONY KAY**\n\n我定期摆玩开源 OCR（光学字符识别）包。我的上次尝试是几年前，当时我买了一台平板电脑，想扫描一些课程书籍，这样我只需要带一本书出门了。我尝试了我能找到的所有包，但没有一个好到可以考虑使用的程度。我最终使用了了\
    \ Adobe Acrobat 的商业版本，它允许你将扫描页面作为视觉内容（保留数学书中的方程等内容），但它为文本添加 OCR 以便你搜索。结果证明它非常方便，我无法通过任何开源方案获得结果感到遗憾。\n\
    \n诚然，问题非常困难。字体变化、图像噪声和对齐问题使得设计能够将图像转换为实际文本的算法极其困难。最近我偶然发现了名为 Tesseract 的项目。Tesseract\
    \ 是 HP 在 20 世纪 80 年代后期和 90 年代初努力的产物。HP 在 2005 年将其放置在 SourceForge 上。它目前缺乏布局识别和多组件支持；然而，最困难的部分——实际字符识别是非常出色的。\n\
    \n# 如何安装\n\n1.03 版本是本文写作时的最新版本，构建和安装过程仍然需要一些工作。此外，与 libtiff 的集成是默认配置的，但并不完善。你可能需要使用\
    \ libtiff 配置它，这将允许使用压缩 TIFF：\n\n```bash\n/configure\n```\n\n如果你以后发现它无法识别，请不带 libtiff\
    \ 进行配置：\n\n```bash\n/configure --without-libtiff\n```\n\n构建完成如下：\n\n```bash\n\
    make\n```\n\n配置 1.03 也表明 make install 失败了。我通过尝试得出了安装的基本方法：\n\n首先，将可执行文件 tesseract\
    \ 复制到路径中的目录（例如 usr/local/bin）：\n\n```bash\ncp cman/tesseract /usr/local/bin\n\
    ```\n\n然后，将 tessdata 目录及其所有内容复制到同一个地方（例如 /usr/local/bin/tessdata）：\n\n```bash\n\
    -r tessdata /usr/local/bin/tessdata\n```\n\n最后，确保你的 PATH 变量包含该路径 (/usr/local/bin)。\n\
    \n# 如何使用\n\n如果你需要访问扫描，大多数 Linux 发行版都提供了页面并具有良好的 GUI 界面。Tesseract 具有底层分析，但这意味着它只能读取未压缩\
    \ TIFF。这可能需要对你的扫描文档做一些工作以获得最佳结果。坦率地说，步骤是自动化的，大部分都是值得的。你需要做：\n\n- 使用阈值处理掉变化并将图像转换为黑色。\n\
    - 擦除任何图形（可选，但如果你跳过这一步，识别器将产生一堆乱码）。\n- 将任何列分成更小的列。\n\n![](img/465f773ec3a6747b5eef398f28f808b8_44_0.png)\n\
    \n图 1. GIMP 中的阈值对话框。左右滑动选择哪些像素是白色，哪些是黑色。\n\n我建议使用像 GIMP 这样的程序来感受需要的工作。最重要的步骤是第一步，因为它提高了\
    \ OCR 的准确性。首先，进入 Image->Mode 并确保图像是 RGB 或灰度模式。阈值对索引图像不起作用。接下来，使用 Colors->Threshold。这将允许你丢弃指定值以上的像素并转换为黑色。弹出窗口让你了解它是如何影响图像的。左右滑动以获得黑白的良好结果。然后执行其余部分。图\
    \ 2 显示了这一步的典型结果。这一页有手写笔记，概述了部分：\n\n![](img/465f773ec3a6747b5eef398f28f80b8_46_1.png)\n\
    \n图 2. 图像准备。从左到右：原始图像、阈值后的图像以及手动清理后的图像。\n\nwww.linuxjournal.com 2007年7月 | 45\n\
    \n# Tesseract 特性\n\n在不损害图像其他部分的情况下无法消除光照。使用画笔涂任何易修复的部分。我不建议在额外信息（如噪声等）与文本有一定的距离时使用它。Tesseract\
    \ 可能会插入几个乱码，但在文本编辑器中生成的图像应该像第三部分。\n\n现在，将图像切换到索引模式（使用菜单 Image→Indexed），并选择黑白（调色）。还要确保它是经过抖动处理（dithered）。将图像保存为未压缩\
    \ TIFF，然后就可以识别了。识别部分是：\n\n```bash\n$ tesseract image.tif\n```\n\n第三个参数是输出文件的文件名。Tesseract\
    \ 自动检测文本，因此使结果更好。\n\n这个例子中的下划线严重影响了 OCR。几行识别得很好，但其中两行在处理后完全不可读。这强调了在之前使用干净源的重要性。手动删除扭变花费的时间比手动输入文本更长。\n\
    \n## Tesseract 是如何工作的？\n\n我想做一些能让我了解 Tesseract 力量的事情。我也想与另一个开源 OCR 系统比较结果：\n\n\
    我开始运行一些测试，看看 Tesseract 表现如何。我的初始测试使用了 200dpi 的文本截屏，其中包含粗体和斜体字体。显然，文本没有物理扫描仪引入的任何噪声或错误。\n\
    \nTesseract 表现完美，识别了 100% 的字符。它把间距处理得恰好，但没那么好。它糟糕地错过了几个字母。完美输入下的总识别率为 95%。\n\n\
    我想做一些压力测试，看看 Tesseract 如何处理困难条件。我使用了 Adobe OCR，但它返回了一些错误。我通过 GIMP 修复倾斜的线条（正如我们所做的）。我也扫描了倾斜的页面。所以，我发现\
    \ 72dpi 的图像有一些小故障。72dpi 是半宽的。文字很深并渗入了字母，且边缘是弯曲的。令人惊讶的是，Tesseract 管理了 97% 的识别率！\n\
    \n| 测试条件 | ocrad | Tesseract |\n| --- | --- | --- |\n| 200dpi，洁净，包含斜体/粗体 | 95%\
    \ | 100% |\n| 72dpi，黑白 | 0% | 97% |\n| 72dpi 有轻微扭变 | 0% | 97% |\n| 72dpi，线性扭变且倾斜\
    \ | 0% | 96% |\n\n## 获取最佳结果\n\n测试表明，我为 Acrobat 提供的输入是合理的。我建议你的文档使用 150dpi 或更高。如果你尝试将扫描仪设置为灰度和黑白模式；阈值程序实际上让你得到比本文描述的手处理方法更好的结果。Tesseract\
    \ 并不完美，尽管由于书籍装订出现了一些问题。许多专业扫描可以移除页面中的结。\n\n## 自动化过程\n\nGIMP 提供了对图像的精细控制，但如果你有一个一致的环境和大量页面，你会希望尽可能自动化图像清理。\n\
    建议使用 Netscript 执行此，最好是 10.34 版本，它带有更强大的阈值过滤器。遗憾的是，它不是一个超级稳定的版本，因此许多系统会有旧版本。\n\
    如果你使用另一个脚本，可以通过类似的命令组合获得可以接受的结果：\n\n```bash\n$ tesseract -config image.tif | |\n\
    pantmidithber -threshold value = 0.8 | \npantomtom > result.tif\n```\n"
