    - - 20 年行业经验

    - 从未将客户视为产品

    - 工程师提供技术支持

    - 开源

    - 自定义配置和设计，价格和交付时间优

    - 大多数产品可次日发货


    查看我们的选项、外围和 x86 SBC


    # Technologic SYSTEMS


    我们使用我们的，请访问我们的 TSB 驱动的网站 www.embeddedARM.com (483) 827-support


    # 快速回顾


    与另一个并排显示——而不是一个覆盖图像部分的小窗口，就像在 GIMP 的许多预览中那样，而是一个完整的缩略图预览（3）。这种工作流非常棒，并将在其他应用中发挥重要作用，随着
    Krita 受到关注。


    Krita 在脚本化方面也表现出色；Python 和 Ruby 引擎比 GIMP 的脚本更强大且不易崩溃。作为锦上添花，Krita 有许多颜色可供选择——这在今天的图形采集中至关重要。不同的相机和图形程序使用不同的色彩配置。如果你想在现代设备上准确显示颜色，你的图形软件包必须支持多种语言：NTSC、PAL
    和 SECAM。Apple 使用 RGB，Krita 有自己的配置，Adobe 也是如此。这些在 Krita 中默认支持（4）。


    ![](img/465f773ec3a6747b5eef398f28f808b8_37_0.png)

    图 2。Krita 界面为图形专业人士设计。


    调整层终于这里了，作为分层效果——这是相对于 GIMP 范式的优势。你不再需要应用单个调整以确保正确，然后继续。通过调整层的功能，更改仅在导出时应用到图像，这使得多任务处理快得多。


    ![](img/465f773ec3a6747b5eef398f28f808b8_37_1.png)


    Krita 也有自己的一些技巧，例如笔刷滤镜直接在图像上绘制，而不是被迫重新制作详细的图层。滤镜选择的猜测也是任务的一部分。GIMP 用户可以在调整所有已安装滤镜时使用预览，包括默认的缩略图。


    ![](img/465f773ec3a6747b5eef398f28f808b8_37_2.png)

    图 3。Krita 支持缩略图预览。


    然而，这里还有许多功能——在 GIMP 的迭代版本之前，Krita 的工具在你选择时就会考虑结果。像 Paint 一样，Krita 无法使用 GIMP 滤镜，因此必须为其架构编写新插件。事实上，可以复制
    GIMP 的基础滤镜，但 Krita 做得很好且 GIMP 尚未精通。不仅通过专业方法，Krita 还显示了深厚的图形能力。Krita 允许在不需要 Wacom
    数板的情况下修复现有图层。绘画工具的数量仅受 Photoshop 限制，而在 Krita 超过 Adobe 的领域有一些巧妙的改进。


