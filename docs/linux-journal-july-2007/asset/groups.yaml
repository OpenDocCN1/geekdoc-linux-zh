    ### 循环\n\nPython 的构造之一是 `for`。它被设计用于遍历列表、集合和其他迭代对象。在这种情况下，它执行循环体。`while` 循环构造比\
    \ `for` 有用得多。但今天，有了强大的构造，如 `range` 函数，将迭代器周围的使用比 `while` 高得多。这里是为你旅程的一个例子：\n\n\
    ```python\nfor i in range(3):\n    print i\n```\n\n这更短，而且更可读。`for` 循环有什么用？它有助于知道何时停止循环。这里是一些例子：\n\
    \n- 从文件读取字符直到遇到末尾 (EOF)。\n- 从用户处读取命令直到用户按键。\n- 从传感器读取次数直到温度太高。\n- 从用户界面读取事件直到用户按下窗口底部的按钮关闭程序。\n\
    \n这里形成了一个模式——做其他事情是我们需要的。以前，当语言中没有选择时，我们使用 C 顶层的时间时间，这种构造比 `for` 有用得多。循环作为迭代器的可能性。这里是你的旅程的一个例子：\n\
    \n```python\nfor i in \"Hello World\":\n    print i\nHello World\n```\n\n### 条件\n\
    \n在某些示例代码的第四行 `if post.is_published():`，我们有了另一个新构造——`if`。这允许程序根据数据做出选择。它需要一个布尔值和一段代码。代码只有在为\
    \ `True` 时才运行。如果你提供不是真的东西，Python 会尽力将其解释为。例如，数字 0 被解释为 `False`，但所有其他数字都被解释为 `True`。这里是一些例子：\n\
    \n```python\n>>> True:\n    print \"It is true!\"\n\n>>> False:\n    print \"\
    It is false?\"\n```\n\n我们可以对不同类型的对象执行许多不同的比较。注意相等运算符是 `==`，而不是 `=`（即两个等号）：\n\n\
    ```python\n>>> a = 10\n>>> if a == 10:\n    print \"Ten!\"\n```\n\n十！还有其他比较，比如大于\
    \ (>)、小于 (<) 和不同于 (!)。你可以直接在 REPL 上实验比较：\n\n```python\n>>> a = 3\nFalse\n>>> a\
    \ != 10\nTrue\n>>> a > 1\nTrue\n```\n\n如果某事为真运行一段代码，为假运行另一段代码是常见的。例如，我们可以这样做：\n\
    \n```python\nif a == 10:\n    print \"A is ten\"\nelif a != 10:\n    print \"\
    A is not ten.\"\n```\n\n```\n这是一个问题。如果我们在第一种情况下将 `a` 改为 `b`，我们必须记得在第二种情况下也修改。以及我们做的任何其他更改。解决方案是对此的扩展：\n\
    \n```python\nif a == 10:\n    print \"A is ten\"\nelse:\n    print \"A is not\
    \ ten.\"\n```\n\n如果第一部分没有执行，将执行后面的代码。\n\n另一种常见情况是为不同情况设置条件。在这种情况下，我们可以使用一系列：\n\
    \n为了这样做，我们使用 `while`：\n\n```python\n>>> a = 0\n>>> while a < 3:\n...     print\
    \ a\n...     a = 1\n```\n\n各种任务通过循环解决。一种任务是执行三次。\n\n>>> list = [1,2,\"a\",\"b\"\
    ]\n>>> for item in list:\n...     print item\n1\n2\na\nb\n\n### 深入\n\n###继承\n\n\
    椅子是家具。桌子也是。这种相似性\n\n76 | 2007 www.linuxjournal.com\n\n"
