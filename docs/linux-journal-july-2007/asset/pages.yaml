  md: "# Do you take\n\"the computer doesn't do that\"\nasas a personal challenge?\n\
    \n# INDEPTH\n\n# So do we.\n\nListing 9. Create a quick prelight image for mouse-over\
    \ events.\n\n```\nsub monkeyiq_prelight {\nmy($inputagename,$filename);\n  $brightness,\
    \ $contrast) = @_;\n\n$img = gimp_file_load($inputagename,\n  $filename);\n\n\
    \  print(\"prelight $inputagename\":\n  print to $filename\");\n  @layers = gimp_image_layers($img);\n\
    \  foreach $1 ($layers) {\n    gimp_brightness_contrast($1,\n      $brightness,\
    \ $contrast);\n  }\n  imageOutput($img,$filename);\n}\n\n*,\n[PF_STRING, \"inputmage\"\
    ,\n \"Name of image to export\", \"\",\n PF_STRING, \"Name of image to save to\"\
    , \"\",\n PF_INT,\n  \"brightness\",\n  -127 to 127, \"\",\n PF_INT,\n  \"contrast\"\
    ,\n  -127 to 127, \"\"\n]\n```\n\npixel's old alpha values. Next, a selection\
    \ is performed using the nominated background color, and that selection is inverted.\
    \ So, the selection should contain everything in the image and effectively defining\
    \ a single-bit alpha mask for what pixels could be transparent in the image.\n\
    \nThe next block adds another layer to the image..newlayer, with a transparent\
    \ color, and it copies and pastes the selection from the above merged layer (everything\
    \ other than the back-ground) into the new layer. We don't need the old merged\
    \ layer anymore, so it is set to hidden and the new layer is shown.\n\nThe result\
    \ is that the new layer contains old image data that has partly transparent pixels\
    \ merged with the nominated background color. There is only a single color that\
    \ is transparent, and the result are fully opaque.\nTheOutput function is a little\
    \ function in the MonkeyIMP module that handles saving to native GIMP xcf files,\
