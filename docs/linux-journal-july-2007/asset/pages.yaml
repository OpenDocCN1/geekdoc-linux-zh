  md: "# Role-Based Single Sign-on with Perl and Ruby\n\n# Single sign-on dicated\
    \ by user with Perl and Ruby.\n\nPortland, Oregon, is a city that takes pride\
    \ in managing its resources wisely. So, maybe it's natural that this article describes\
    \ how to make computer resources and legacy CGI scripts much more manageable.\
    \ This is accomplished by an elegant, easy-to-build system that provides a one-time\
    \ solution for controlling access to different areas. It gives programmers on\
    \ the back end, empowers users with a friendly Web application for managing access.\
    \ And finally, most importantly, the system creates an experience for end users\
    \ that's logical and simple. For example, people are required to log in only once\
    \ when they first attempt to access a protected script. After that, they have\
    \ uninterrupted access to any area they want.\n\nHere is a little bit of why this\
    \ kind of system we might need. I worked at Wells & Clark College, nestled in\
    \ 137 deeply wooded acres. While one of Douglas Fir trees drifted in the wind,\
    \ our Web applications were using LDAP-based authentication authorization in far-flung\
    \ locations. The system managed by IT allowed people to log in to dozens of applications,\
    \ from many places on the campus with their user name and password. The well-tested\
    \ Perl and PHP scripts handled the system.\n\nYou might be wondering, What the\
    \ problem? Why not build another layer on top of something that works? And actually,\
    \ for a long time, there was no need. The setup was just fine. But over time,\
    \ we began gaining pains, from several sources.\n\nThe legacy scripts we used\
    \ have been growing steadily. These tasks are intended to be handled by only a\
    \ small group of people.\n\nThese legacy applications were developed by many different\
    \ developers. Although they used the same LDAP-based authentication, they handled\
    \ sessions and controlled access in different ways.\n\nA new set of scripts required\
    \ protected access for certain user groups. We had no way of keeping track of\
    \ or would be able to access\n\nAs a developer, my first thought was to create\
    \ a reusable library of some code that couldn't be duplicated. I would write the\
    \ code for logging in and session management just and use it in many places. But,\
    \ before I started, there were a couple of issues I should address. \n\nThe existing\
    \ scripts confirm two distinct functions\n\n![](img/465f773ec3a6747b5eef398f28f808b8_91_0.png)\n\
    \nFigure 1: System Architecture\n\n![](img/465f773ec3a6747b5eef398f28f808b8_91_1.png)\n\
    \nFigure 2: Database Schema\n\nwould be better simple: authentication and authorization.\
    \ Authentication is the process of determining whether users are who they say\
    \ they are. Authorization is the process of deciding user X should be to do Y?\n\
    \n# Building the Solution\n\nThe plan for the system features three independent\
    \ components: a database containing knowledge of users and a Ruby on Rails framework\
    \ to use Perl modules to manage the database, and a set of adapters for each programming\
    \ environment in use. For scenario, I wrote a Perl module to connect our legacies\
    \ to the new framework (1).\n\n# The Back End\n\nIt was simple to create an architecture\
    \ knowledge base for this project using MySQL, any relational database supported\
    \ by both Rails and Perl would be fine. The schema is the standard for handling\
    \ many-to-many relationships (Figure 2). The users table is a simple list of names.\
    \ The permissions table doesn't grant a user any rights. It only provides the\
    \ possibility for user to be linked to roles. Similarly, the roles table enumerates\
    \ and describes the roles that users might be assigned. I included a definition\
    \ file so that adapters can make use of the role, a role name could be manager\
    \ or editors editors wide\n\nWhile the first two tables are static, the final,\
    \ admin_roles_users contains the dynamic information about users who have been\
    \ assigned to roles. For each instance of a user-role relationship, a role and\
    \ user name are stored in this table. This kind of schema is very flexible and\
    \ flexible, the downside is that it makes nearly impossible to enter data by hand,\
    \ and what of a chore to write an application to manage it. This is where Ruby\
    \ on Rails comes in.\n\n90 | July 2007 | www.linuxjournal.com"
  merge: -1
  img_proc: true
- pgno: 92
  md: "# # Front End #1: a Management Application\n\nRuby on Rails (RoR) shines in\
    \ the area of database applications that need to provide CRUD (Create, Retrieve,\
    \ Update, Delete) functionality. It is simple and easy to get your database management\
    \ application up and running (3). Plenty of tutorials are available for creating\
    \ a basic Web application, so in this article I will describe the necessary considerations.\
    \ As it turned out, there weren't many.\n\nOne thing that matters is using tables\
    \ and columns to comply with Ruby on Rails conventions (2). This turned out to\
    \ be a bit tricky; I couldn't find a single source for all the conventions and\
    \ implementations. In this situation with a join table (admin_role_users), it\
    \ is important to concatenate the names of tables and be careful not to include\
    \ an id column.\n\nThe main maintenance concern was to tell Roll about the many-to-many\
    \ relationship. This was accomplished with a single line added to admin_role.\n\
    \n```\nclass AdminRole < ActiveRecord\n  has_belongs_to_many :admin_users\n```\n\
    \nand an equivalent one in admin_user:\n\n```\nclass AdminUser < ActiveRecord\n\
    \  has_belongs_to_many :admin_roles\n```\n\nWith these changes, Roll could fetch\
    \ the data correctly and maintain all the proper properties. It was easier to\
    \ display and edit the join form, but more work was required in the view and controller\
    \ classes (see Resources). When finished, I had nice screens, as which I show\
    \ in Figure 1.\n\nImplementing the application in place is easy, but we could\
    \ be populating the database. But for this information to be used, an adapter\
    \ would have to be written for our Perl/GI runtime environment.\n\n# # Front End\
    \ #2: a Perl/GI Adapter\n\nI'm a big fan of declaration (as opposed to procedural),\
    \ when it can be used. What does this mean? Well, one way to get for authorization\
    \ look like this:\n\n```\n$username = $auth->current_user;\nif ($username) {\n\
    \  # Handle the login form\n} elsif ($auth->user_has_role($username, $new_editor))\
    \ {\n  # Show error message and exit\n};\n```\n\nSure, that could be a bit-for-bit,\
    \ by implementing a current_role() method. But it's still procedural. Instead,\
    \ we can reduce this to one line by calling the controller (declaring) what we\
    \ want:\n\n```\n$auth->require_role(:news);\n```\n\nThis require_role() method\
    \ is required to get any further, and it gives a very simple guarantee: execution\
    \ will\n\n![](img/465f773ec3a6747b5eef398f28f808b8_92_0.png)\n\n# Listing Admin\
    \ Roles\n\n| Name | Description | Users |\n|---|---|---|\n| News | The role for\
    \ people who manage the new publications. Provides access to all applications\
    \ for creating, editing and delivering news content | admin cbaker bththorne |\n\
    | Blog | Provides access to the internal blog management applications. | cbaker\
    \ bththorne |\n\nFigure 3. Admin application, Role Listing\n\n![](img/465f773ec3a6747b5eef398f28f808b8_92_1.png)\n\
    \n# Editing admin_role:\n\n| Name | Users |\n|---|---|\n| News | The role for\
    \ people who manage the new publications. Provides access to all applications\
    \ for creating, editing and delivering news content | cbaker bththorne |\n| Blog\
    \ | | cbaker bththorne |\n| Edit | | cncytemo |\n| News | | jtaylor |\n\nFigure\
    \ 4. Admin application, Editing a Role\n\nthis point only if the user should be\
    \ able to. If (1) has already logged in and (2) has given the role, then require_role()\
    \ will simply return and the script will continue normally. Otherwise, the auth\
    \ object will take whatever steps are necessary to first authenticate and then\
    \ grant access to any de roles it wants.\n\nThis makes a lot of things easier.\
    \ For allocation programmers, they don't have to worry about how the auth object\
    \ gets their job. Nor do they have to worry about what a role is and how it is\
    \ written. If it was implemented correctly, the Auth.Pm perl module will have\
    \ so much help with little effort required by the application programmer. Figure\
    \ 5 is a flowchart that shows what happens when require_role is needed.\n\nConcurrently,\
    \ my implementation required four files:"
