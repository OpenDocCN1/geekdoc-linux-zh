    \nFigure 3. Button with a Gray Background behind a Soft Shadow\n\nFigure 4. Button\
    \ intended to have a gray background behind a soft shadow. exported with a single-bit\
    \ alpha mask and overlaid on a different color background.\n\nscript. Although\
    \ using many smaller scripts is slower, because of the extra image save/load cycles,\
    \ this is less relevant for batch processing images. The upside is that once the\
    \ little scripts are known about, they can be stung together quickly from the\
    \ command line and\n\nMakefiles. Common utility functions have been moved into\
    \ the MonkeyQGIMP module so that little image editing scripts can be created quickly.\n\
    \n# Listing 3. MonkeyQGimp Saving Functions\n\n```\n#/usr/bin/perl\n\n@layers\
    \ = Gimp->image_get_layers($img);\nprint \"layers size: \" . scalar @layers .\
    \ \"\\n\";\n\npackage MonkeyQGIMP;\n\nuse Gimp 'auto';\nuse Gimp::Fu;\nrequire\
    \ Exporter;\n\nsub imageOutput(\n    my ($img, $outfilename) = @_;\n\n    if ($outfilename\
    \ =~ /\\.xcf/) {\n        print \"Save to xcf file $outfilename\\n\";\n      \
    \  Gimp->save(0, $img, $outfilename);\n    }\n    else {\n        $layer = Gimp->image_get_active_layer($img);\n\
    \        $layer = Gimp->image_merge_visible_layers($img, $GIMP_CLIPER_MERGE_EVERYTHING);\n\
    \    }\n    Gimp->image_delete($img);\n}\n\nsub mergedLayer(\n    my ($img) =\
    \ @_;\n\n    my $existinglayer = Gimp->image_get_active_layer($img);\n    $newlayer\
    \ = Gimp->image_add_layer($img, $existinglayer, GIMP_LAYER_NORMAL, GIMP_LAYER_BEFORE,\
    \ -1);\n    Gimp->edit_fill($newlayer, GIMP_EDIT_FILL_WHITE);\n    return Gimp->image_merge_visible_layers($img,\
    \ 1);\n}\n```"
