- pgno: 61
  md: "# INDEPTH\n\nListing 1. Compile and install gimp-perl.\n\n```\nperl Makefile.PL\
    \ : make;\nsu -l;\nmake install;\n```\n\nThe scripts shown in this article tell\
    \ you how taking a single image as input and generating a single output image\
    \ to try to mimic Linux command-line pipes. Unfortunately, the scripts in this\
    \ article cannot be piped together but they rely on temporary files to save each\
    \ image modification, and the -inputoutput parameter is used to name where the\
    \ image is saved for the next script to process.\nNote that both images should\
    \ be specified using full paths to ensure the Gimp puts them where you expect.\n\
    More complex can be streamed into a single Perl\n\n# Listing 2. Exporting an x\
    \ with 8-Bit Alpha to an Image One of Pretreated Alpha\n\n```\n#!/usr/bin/perl\n\
    \nuse Gimp \"auto\";\nuse Gimp::;\nuse lib \"/usr/local/bin\";\nuse MonkeyGIMP;\n\
    \nsub monkeyio_gimp_convert {\n  my ($inputimage, $filename,\n  $aliascolor) =\
    \ @_;\n\n  Gimp::set_foreground($aliascolor);\n\n  my $img = Gimp::file_load($inputimage,\n\
    \  $filename);\n  my $layer = Gimp::layer_new(\n  $img,\n  Gimp::image_width($img),\n\
    \  Gimp::image_height($img),\n  RGBA_IMAGE,\n  \"background image\",\n  100, NORMAL_MODE);\n\
    \  Gimp::add_layer($img, $layer, 1);\n  Gimp::layer_lower($layer, 1);\n  Gimp::edit_fill($layer,\
    \ BACKGROUND_FILL);\n\n  $oldlayer = =\n  Gimp::image_merge_layers($img, EXPAND_AS_NECESSARY);\n\
    Gimp::layer_set_name($oldlayer, \"oldlayer\");\nnGimp::selection_insert($img);\n\
    \  $threshold = 1;\n  Gimp::by_color_select($oldlayer, $aliascolor,\n  $threshold,\
    \ 0, 1, 0, 0, 0);\nGimp::selection_invert($img);\n####################################\n\
    \n$newlayer = Gimp::layer_new($img,\n  Gimp::image_width($img),\n  Gimp::image_height($img),\n\
    \  \"test x1\", 100, 0);\n}\n```\n\n```\nGimp::add_layer($img, $newlayer, -1);\n\
    Gimp::edit_fill($newlayer, TRANSPARENT_FILL);\nGimp::edit_copy($layer);\nmy $floatobject\
    \ = Gimp-gimp_paste($newlayer, 0);\nGimp::layer_set_anchor($floatobject, $floatobject);\n\
    ######################################\n```\n\n# delete old background layer\n\
    Gimp::layer_set_visible($oldlayer, 0);\nGimp::layer_set_visible($newlayer, 1);\n\
    \n```\nimageOutput($img, $filename);\n\nregister monkeyio_gimp_alias;\nAlias alpha\
    \ values to a background color;\nAlias alpha values to color (and then make bits\
    \ trans);\n\"Ben Martin\", \"Ben Martin\";\n\"2007-Mar-16\";\n\"Toolbox/Xtns-Per-Lua\
    \ As X\"\n\nPF_STRING, \"Name of image\", \"\";\nPF_STRING, \"output\", \"\";nPF_STRING,\
    \ \"Name of image to save\", \"\";\nPF_COLOR, \"aliascolor\", \"\";\n\"\";\nmonkeyio_gimp_convert;\n\
    ```\n\n```\nif ($ARGV < 0) {\n  print \"Usage: $0 -inputoutput imagepath\";\n\
    \  print \" -inputoutput full_dst_path\";\n  print \" -aliascolor 0000000 \\n\"\
    ;\n  exit;\n}\n```\n\n```\n# Handle control over gimp\nexit main(0);\n```\n\n\
    40 | July 2007 - linuxjournal.org"
