  md: '# letters


    ![](img/465f773ec3a6747b5eef398f28f808b8_9_0.png)


    love Ajax. I use it in JPs all the time. But come on! It''s not a technology,
    but it gets coverage in every issue of I/ since at least October 2006.


    non-web development topics that can be covered in At the Forge?


    Let''s take a look book:


    +   - October 2006: At the Forge—“JavaScript, Forms and Ajax"

    - November 2006: At the Forge—“Beginning Ajax,”—Call it with Aster and Ajax

    - December 2006: At the Forge—“Ajax Design"

    - January 2007: At the Forge—“Prototype” (Ajax); Index—the Semantic Web

    - February 2007: At the Forge—“Scriptulous,” Ajax

    - March 2007: A march to bring back and Ajax

    - April 2007: At the Forge—“Dojo Events and Ajax"

    - May 2007: everywhere!


    Marc


    We’ll do our best to cover different ground. However, Ajax is an extremely popular
    approach to proving with a rich-client experience. Its platform-neutrality and
    the broad set of Linux tools available make it an exciting Linux topic.


    # Ajax Appreciated


    I wanted to tell you your coverage of Ajax, Ruby and programming languages, hot
    topics in the industry, just is awesome. I am glad I bought a subscription from
    you. I am a Linux developer graduating student from ASU Polytechnic and I think
    you are doing an awesome job,


    # Ajax Overdose


    Let me say what I love about Ajax. I look forward to each issue and enjoy almost
    every thing—yes, even Marvel.


    Karol


    # Don''t Just Base Me, Teach Me


    I''ve read your magazine off and for years, and I had a subscription for a few
    months—excellent magazine.


    My gripe is that your magazine focus too much on Ajax. Don''t get me wrong: I


    # Ajax Examples Are Wrong


    I have tried a number of examples from the May 2007 issue articles and discovered
    that all of the examples failed with the same bug. The problem can be reduced
    down to two lines in all examples.


    Is Ajax really a subject that needs be covered in every issue? This is still Linux
    Journal, not Ajax Journal, aren''t there other


    +   - Since: 26936

    - Maintainer: Eric Durland (eric@debian.com)

    - Architecture: i386

    - Version: 2.0.0.3


    From the magazine:


    PS. A little announce: I think it would be good if the writers actually listed
    HTML that is to validate:


    ```

    http(''GET'', url = escape(zipValue));

    readystatechange = handlerResponse(http);

    ```


    ```

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0//EN"

    n"http://www.w3.org/DTD/html-strict.dtd">

    <!-- Doctype declaration is missing in some examples -->

    <html xmlns="http://www.w3.org/1999/xhtml">

    <title>+Ajax Contact</title>

    <!-- Declaration of charset is missing in all examples -->

    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8"/>

    ```


    The right way:


    ```

    onreadystatechange = handlerResponse(http);

    http(''GET'', url = escape(zipValue));

    ```


    The problem is if you make the call to before a back-function is defined, the
    result will end up in the big void. After calling open, the script''s control
    controls will still be given again when open calls the back-function with response.


    -- missed attributes in almost all examples: foo=2nbar="3"--


    Apart this to a fundamental change, what would you expect?


    Other than that, if Linux Journal is a great magazine.


    +   - My OS: Debian Sys

    - Browser: dpkg -s keepousel

    - Package: keepousel

    - Status: install installed

    - Priority: optional

    - Section: web


    Michael Rasmussen


    All of the things I tried, myself, worked. But I''ll take your word for that they
    present problems in other environments. Thanks for the tips and suggestions—.


    8 | 2007 www.linuxjournal.com'
