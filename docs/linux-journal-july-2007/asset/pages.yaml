- pgno: 49
  md: '# # Introducing Vector Graphics and Inkscape


    Inkscape''s vector graphics open a new world for creating art.

    Marco Fioretti


    SVG (Scalable Vector Graphics) is an open W3C standard for describing two-dimensional
    graphics in a different way than traditional computer images, which are all bitmaps
    of some kind. A bitmap or raster image, by ignoring compression and other optimization
    techniques, simply one long list of all the pixels...

    Instead, a vector graphics file contains a series of pseudo-mathematical instructions—such
    as a straight line to that coordinate, a curve to rotate 45 degrees clockwise
    or fill it with red. The grandmaster of vector formats is PostScript.

    The first and main benefit of this alternative method is being completely separate
    from the capabilities of the physical display, be it a computer monitor or a piece
    of paper. More exactly, although it is still obvious to see image on a lowresolution
    monitor or printer, vector graphics has no intrinsic resolution limit to it. Vector
    graphics can be shrunk, stretched or rotated as much as you wish or many times
    without any degradation, even when printed. For an example, look at Figure 1,
    which shows two different methods of drawing side by side, a vector drawing and
    a raster much crisper than the other, isn''t?

    Another plus of vector image is that, because they are sequences of instructions,
    the size of the image does not affect the file size, space or processing or download
    time on screens.

    Last but not least, creating a "series of commands" is a task that can be delegated
    to a computer program easily and efficiently. SVG files can be mass-generated
    or modified in any way without intervention. The SVG 1.1 specification also


    ![](img/465f773ec3a6747b5eef398f28f808b8_49_0.png)


    cribes 16 primitives that make it possible to obtain very complex objects as well
    as highly realistic effects.

    The main reason the world hasn''t gone all yet is that bitmaps much better at
    reproducing the subtle differences in color and contrast that are present in photographs.
    Vector graphics, however beautiful, are "synthesized," and it often shows. In
    spite of this, they remain extremely useful and are becoming and more common among
    GNU/Linux desktops.'
