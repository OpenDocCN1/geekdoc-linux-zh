  md: "# INDEPTH\n\nwhat we Created a Chair, the method Chair__init__ was running\
    \ setting__backrest_height. Oh Nobody called Furniture__init__ which never set\
    \ material. There are two solutions to that:\n\nSetting in Chair__init__ is not\
    \ a solution. If we do that, the classes would be coupled, meaning the implementation\
    \ of one would depend on the implementation of the other. If we change the name\
    \ of __material to __materials__,mxCell Chair will stop you. If you have hundreds\
    \ of these changes to inherit is difficult. Also, Furniture will grow to have\
    \ more members, so we have to remember to set all members to the defaults in Chair__init__\
    \ I'm getting a headache thinking about it.\n\nOne real solution is calling Furniture__init__\
    \ and rewriting Chair__init__:\n\n```\ndef __init__(self):\n    Furniture__init__(self)\n\
    \    self.backrest_height = 30\n```\n\nWe had to pass self to __init__ because\
    \ we called it with the class instead of the object, it wouldn't know in which\
    \ to do its operations.\n\nI personally don't like solution, because it implies\
    \ writing the name of the class in two or more places. If you ever change\n\n\
    the name, you'll have to remember to search and replace. Another solution is more\
    \ cryptic than it should be, but it's been the problem I just mentioned:\n\n```\n\
    def __init__(self):\n    super(Chair, self), __init__()\n    self.backrest_height\
    \ = 30\n```\n\nIn this solution, passing the current class and the current object,\
    \ and it has to do with multiple inheritance. Here we have to make a call to the\
    \ parent class using the current object. Here we have a problem if we change the\
    \ name of the class, but replacing it is easy when you want a change. You'll have\
    \ to do the documentation as well. The real problem with this solution is to understand\
    \ and to explain it has to do. For more information, read \"Python's Considered\
    \ Carefully\". Personally, I've been using this second solution without any problems.\n\
    \nYou'll see that all classes inherit from object. That is the most (or root)\
    \ class. It is a good idea to make all your classes inherit from another class.\
    \ If you don't do that, your class will be an old-style class, and some things\
    \ won't work, such as super. It is important to know this, because you might encounter\
    \ old-style classes anywhere, and you should be prepared.\n\n![](img/465f773ec3a6747b5eef398f28f808b8_79_0.png)\n\
