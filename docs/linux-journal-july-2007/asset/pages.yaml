  md: '# The number of drawing tools rivaled only by Photoshop, and there are a few
    nifty enhancements in the area where Krita outdoes the venerated team from Adobe.


    # HDRI: Faking Film''s High Depth


    High Dynamic Range Imaging was originally developed for lighting 3-D scenes, as
    a way to capture the real-world radiance of luminescence, and has been a boon
    to realistic 3-D lighting work for many years.


    But, it has another use. By tone mapping, HDRI''s wide contrast range is represented
    in 8-bit space—preserving details in the shadows and minimizing clipping in highlights.
    As this aesthetic beauty, several techniques have developed to create HDRI from
    digital snapshots and convert them for display on monitors or print.


    Creating HDRI from digital photographs requires Bracketing Exposure—taking a set
    of photos with different exposures to give a wider latitude than the camera naturally
    allows (Figure A). However, the bracketed images are combined into a single HDRI.
    Although this can be done in the terminal, it is easier with CinePaint''s explanatory
    Bracket plugin (in the package). Once created, the HDRI can be turned into a light
    probe for lighting a 3-D scene or tone mapped for display and printing (Figure
    B).


    a bang-up and often eclipse the GIMP counterparts.

    Krita is still in the refinement stage, and its code is not optimized. It has
    a high system overhead—it looks pretty, but it drags on the resources of even
    a equipped system. The adjustment layers don''t require multiple copies of the
    same image in order to store filters, so the load is lighter. Even, the interface
    can lag. Unlike with GIMP and enough, Krita doesn''t have any animation capabilities,
    to do anything of a flick. Finally, it doesn''t support LDR bracketing to HDR—a
    drawback (though this feature is on the de-do list for future releases).


    Still, all told, Krita is an excellent package. It is very capable as is, and
    it shows a lot of potential.


    ![](img/465f773ec3a6747b5eef398f28f808b8_38_0.png)


    Figure A. Set of Photos with Different Exposures


    # Conclusion


    While GIMP is useful, it''s showing its age, and time is coming soon when it will
    adapt or be shifted to the wayside by more capable tools. For the photographer
    in Linux, as well as the high depth CGI artist, Krita and CinePaint are welcome
    tools. Each is strong where the other. As we develop, we can expect great things
    from them—they both proven themselves to be well-designed packages that can lead
    teams ahead. The mix of Darwinian competition and cooperation has given us a new
    generation of these tools, and they''re ready to use.


    ![](img/465f773ec3a6747b5eef398f28f808b8_38_1.png)


    Figure B. Using Bracketed Exposures to Create the Perfect Picture


    Tone mapping interpolates an HDRI into 8-bit space without clipping the high and
    low ends—it compresses the image nonlinearly to preserve the details otherwise.
    The result is a much richer image than normally could be captured by 8-bit equipment.
    In the meantime, tone mapping is not available in CinePaint (or Krita it is on
    Krita''s to-do list). Instead, a command-line set of algorithms for configuring
    the interpretation and tone, does.


