  md: '# # INTERVIEW with Pavel Kanzelsberger, Creator of PIXEL


    Pavel talks about the history of Pixel and its destiny to be much more than a
    Photoshop clone. JAMES GRAY


    One of the applications that we Linux have long to have natively on our beloved
    platform is Adobe Photoshop. Although nearly all of us have turned to the trusty
    GIMP for our image manipulation, the major limitations, such as lack of support
    for the CMYK color model, keep it from fully functional and lower hardware requirements.
    Luckily in our community, there''s a hole in the application portfolio, there
    is a scrappy, innovative dot-or or developer struggling to fill. A prime case
    in point is Pavel Kanzelsberger, the Slovak-based developer of Pixel, an ambitious
    coming-up image manipulation program. If Kanzelsberger''s ambitions are realized,
    his work might one day even out-Photoshop Photoshop. We recently caught up with
    Pavel to find out about Pixel.


