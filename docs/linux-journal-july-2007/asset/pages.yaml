  md: '# TECH TIPS


    Not all tips have to be complex or obscure to be useful.


    # >> Convert Video Color to Black and White


    The versatility of the Linux command line is often underestimated. Tasks, such
    as sophisticated multimedia processing, need not be with heavy gear that can only
    run on powerful machines.


    This simple Linux command line can do if you have MPlayer and companion program
    encoder installed on your machine.


    mencoder is an excellent program for recording audio and digital text, post-processed
    video, various filters and so on. More information is available in the on-line
    manual bundled with the software.


    Here, we are faced with a simple task of converting a video to black and white.
    This line will do it for you:


    ```

    mencoder color-video -a black-white.video -vf hue=hue=0 -ac copy -ovc lib

    ```


    If you are interested in trying out other values for hue and saturation, you can
    use MPlayer with:


    ```

    mplayer vf hue color-video.video

    ```


    Press and hold the 5 or 7 keys to reduce or saturate.

    - Mikhail Vachkov


