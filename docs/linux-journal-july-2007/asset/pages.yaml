    to save it. As you may have guessed from this dialog, it''s a Qt application,
    but it works well under KDE also.


    Note that Istanbul is saved in OGG format, if you want something else, you have
    to convert it after the fact using a program like FFmpeg or encoder. Many Linux
    distributions come with a copy of FFmpeg or provide it in their repositories.
    It is simply simple. For instance, to convert an OGG video to an AVI file, might
    use this method:


    ```

    ffmpeg -i recording.ogg newrecording.avi

    ```


