    If you want the Rails of Python instead, just dingle a django.


    REUVEN L. MERNER


    One of the biggest rivals to Rails during the last year or two has Django, a Python-based
    framework with the same goals as Rails.


    When I first began developing Web applications, I did most of my work in Perl,
    and my programs were invoked via CGI. My preferences have shifted over the years,
    toward component- and template-based systems, such as Mojo and Zope, and then
    toward de-coupling frameworks like Rails and OpenDjango. Most recently, I''ve
    been using Ruby on Rails as a longtime Perl performer; I''ve been pleasantly surprised
    by both the Ruby language and the Rails framework.


    the code should be installed like any other set of Python libraries and programs
    on your server, using the standard Django install routine:


    ```

    python setup install

    ```


    Once this installation is complete, you can use it to create one or more Django
    projects. The terminology can be a bit tricky, especially if you''re coming from
    Rails, so be careful. A Django project contains one or more applications. Each
    application has its own sets of models, views and templates. An application can
    be reused across multiple projects—much like plugins or engines in Rails.


    But of course, Ruby isn''t the only popular framework. One of the biggest rivals
    to Rails during the last year or two has been Django, a Python-based framework
    with the same goals as Rails. Django was first written by Adrian Holovaty while
    working as a freelancer in Lawrence. When he moved to the Washington Post, he
    continues to work on the framework as a host of other open-source projects.


