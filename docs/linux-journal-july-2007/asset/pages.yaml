  md: '# Writing Your Own Image Gallery Application with the UNIX Shell


    You don''t need a photo management application to create a Web-based image gallery.
    GIRISH VENKATACHATHAN


    Digital photography has become ubiquitous today that even mid-range mobile phones
    can capture photographs. Once you transfer photos to the PC, you need to be able
    to utilize the power of the Linux to share them with friends and relatives. Most
    digital cameras produce high-resolution images that make sending them directly
    to email is not convenient.


    This is when you need an on-photo-sharing Web site, such as flickr.com, to help
    share photographs by uploading them. Of course, you can tweak the header with
    tools such as jpeg.


    But, in this case, I will discuss how to utilize the Linux command line to create
    an image.


    # A Brief Survey of the Graphics Tools in Linux


    All of you have heard of the GNU Image Manipulation Program (GIMP). It is useful
    for interactive image manipulation, retouching and other editing purposes, but
    I find it quite difficult to use. There are much simpler alternatives that do
    much better for image editing. The nice about these alternatives is that you can
    run them directly from the command line, which can save time and effort, especially
    when processing many images.


    +   - q: this is the fastest of all, and it can handle a huge load of images on
    the command line. In fact, you can recreate the "persistence of vision" effect
    of video by using the frameworks Mpeg-jpeg or pg viewer and viewing them as q.
    Preserving the space gives the same effect of actually watching the video audio.


    +   - ximage: ximage, or xli, is another application for viewing images.


    +   - xv: this is now outdated, but it is worth taking a look at it. Some of the
    image processing algorithms are core.


    +   - tgif: although with dia, xfg and tifs, it is most useful for creating technical
    diagrams, drawing and logic. It is best to be really user-friendly and powerful
    when it comes to certain image processing tasks, such as generating a collage
    or mosaic of images and annotations with tgif.


    ImageMagick: this suite can be described as the all-in end-all of image processing.
    It has mind-bogging capabilities to create animations, convert file formats and,
    of course, to do highly sophisticated image processing. Go to www.imagemagick.org/Usage
    for all details on it can.


    In this article, I primarily on using the ImageMagick toolkit for the purpose
    of creating an image gallery.


    # A Basics


    Obviously, you will want the gallery to be an HTML page for sharing with others.
    These are linked to thumbnails for all the images. But before that, you need to
    take care of the images'' varying orientations. Different photographs may have
    different dimensions, and you should be able to categorize the thumbnails based
    on that. This is not hard if done this way.


    The next task is to annotate the images with text, watermarking either below or
    over the image. ImageMagick has a rich toolkit for this task as an element.


    You will also want to be able to save, and optionally display the images in the
    photos. After annotating the images, you just for better visual appeal. You will
    need to see them on a page with a white background.


    Another nice-feature is be able to generate black-and-white equivalents. In addition
    to this, if you want to download the original, pristine photo in file size it
    might be worth to provide a download link for all of the images in one single
    file.


    Now we will focus on how to do it. With Linux, you can do much much better. You
    can create a full-fledged video with sound effects. I prefer a nice TIFF UI, appropriate
    for the occasion and the mood of the show. This is just


    But here, it is a good idea to create vertical and horizontal mirror of the photos.
    For example, the video has a better flow and visual. As it is extremely difficult
    to do with the Linux command line and ImageMagick.


    You might have other requirements, such as correcting the exposure, brightness
    or contrast, cropping out parts of the image or'
