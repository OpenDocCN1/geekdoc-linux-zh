  md: '# # Mambo Exploit Blocked

    by SELinux


    A real-world case where SELinux proved its worth. RICHARDINGTON-MCGUIRE


    **If you operate** Internet-connected servers, chances are you will eventually
    have with a successful attack. Last year, I discovered despite the multilayered
    defenses in place on a Test web (target), an attacker managed to execute an exploit
    in a partially successful attempt to gain access. This server was running Red
    Hat Enterprise Linux (RHEL) and the Mambo context matters. It had several defenses
    in place, including Security-Enhanced Linux (SELinux). SELinux prevented the attacker
    from executing the second stage of the attack, possibly preventing a compromise.


    This article presents a case study of intrusion, explaining how the intrusion
    works, what I took to identify the exploit, how I recovered from the attack and
    what I learned securing my system. I changed machine names and IP addresses for
    privacy reasons.


    Computers invaded in the:


    +   - 192.168.166.155—server running RHEL 4 and Mambo


    +   - 10.9.233.25—worm attack source.


    +   - zomwebie: 17.126.31.57—Web server attack payload.


    +   - 10.200.238.39—target of stage 2 executable.


    # ## Defending Your System from Attack


    Today, modern system administrators defend with a layered security approach, using
    firewalls, automated system management tools, logs analysis and recently, SELinux
    provides additional control beyond those traditional policy-based systems. Enterprise
    Linux and Fedora Core have a SELinux policy framework called Type Enforcement.
    It is also possible to restrict the privileges of users in multiple packages to
    the minimum they require for correct operation. This can blunt an attack that
    depends on having read, write or execute access to files directories.


    # ## Discovering the Incident


    At approximately 8:00 AM on May 6, 2006, when I noticed an SELinux enforcement
    message in mail/log.


    ```

    name="cback" dev=dm_0 ino=852100

    context=user:system_r:httpd_sys_script_t

    context=user:object_r:httpd_sys_script_rw_t tclass=file

    ```


    I used to identify this back quickly:


    ```

    # locate cback

    /tmp/cback

    /usr/share/pixmaps/gnome-ccback.png

    /usr/lib/libbackback.la

    /usr/lib/libbackback.so.0.0.0

    /usr/lib/libbackback.so.0

    ```


    The command revealed the executable file type:


    ```

    # file /tmp/cback

    /tmp/cback: ELF 32-bit LSB executable, Intel 80386

    version (1), for GNU/Linux 2.2.0, dynamically

    linked (shared libs), not stripped

    ```


    The user alone owned that file, but it had a few days after the initial system
    installation on targetbox:


    ```

    # ls -l /tmp/cback

    852100 [root:root] -rw-r--r-- 1 root root 0 /tmp/cback -user:object_r:httpd_sys_script_rw_t

    852100 [root:root] -rw-xr-x-- 1 root root 138091 apache cback

    Feb 15 2005 0 /tmp/cback

    ```


    This confirmed the identity of the file in the audit message, because it had the
    number 852100.

    If I had not found the file, I would have used to find the identity by inode:


    ```

    # find -inum 852100 2>/dev/null

    /tmp/cback

    ```


    # ## Analyzing the Exploit for Clues


    Given the name of the script, it might have been identified as a callback script.
    Because the user alone owned the file, I checked the Web server logs for evidence.

    Because the attack payload was in /tmp, I saved a copy of it for posterity:


    ```

    May 4 05:37:22 targetbox cback: audit:(1167434567.0:2277):

    avc: denied (execute_no) for pid=9401 comm="sh"

    ```'
