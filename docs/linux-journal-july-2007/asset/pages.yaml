  md: '# Image Processing with Qccpack and Python


    # How to use QccPack to manipulate images with Python and code from the Python
    prompt. SUHAS A. DESAI


    Limited bandwidth and storage space are always available. Data compression is
    often the best solution. When it comes to image processing, compression techniques
    are divided into two types: lossless and lossy compression.


    Qccpack, developed by James Fowler, is an open-source collection of library routines
    using wavelet-based quantization for reliable implementations of common compression
    techniques.


    Libraries are developed. So far, libraries can be usedared without modifying the
    application code. You can link against a static-style library, libccpack.a, and
    support dynamic linking with libccpack.


    Encoding wavelet, wavelet-based band-coding, error coding, image compression and
    implementations of generic by Qccpack. Operations are available through the library
    routines and additional modules are available in the Qccpack library that you
    can add.


    QccpackSHIFT is one optional module for the Set Partitioning in Hierarchical Trees
    (SPHT) algorithm for image compression. The QccpackSHIFT module includes two utilities,
    splinterencoder and splinterdecoder perform SPHT encoding and decoding for grayscale
    images.


    Qccpack and QccpackSHIFT are available for download from the Qccpack Web page
    on Sourceforge. Red users can find source and binary RPMs at all time. Other users
    will need to compile the source code. Qccpack can be compiled successfully on
    Solaris/ARC, HP-UX, Digital Unix Alpha and Digital RS/UX.


    # Qccpack from the Python Prompt


    You can use Qccpack to train a VQ codebook and to decode the image with full-search
    VQ with arithmetic coding. Taking a 512x512 grayscale image, for example the following
    sample procedure assumes you are at the Python interpreter prompt.


    Step 1: convert the PGM image file to the DAT format by extracting four-dimensional
    (2d) vectors of pixels:


    ```

    >>> imgodtas-ts 4 lenna.pgm lenna.40.dat

    ```


    Step 2: train a 256-codeword VQ guidebook on the DAT file with gla (stopping threshold
    = 0);


    ```

    >>> gla -s 256 -t 0.81 lenna.40.dat lenna.256.ckb

    ```


    Step 3: vectorize the DAT file to produce a channel of VQ indices:


    ```

    >>> vencode -d4 lenna.40.dat lenna.40256.ckb lenna.40256.chn

    ```


    Step 4: calculate first-order entropy of VQ indices (as bits/pixel):


    ```

    >>> cherotropy -4 lenna.40256.chn First-order entropy

    of channel lenna.40256.chn is: 1.82585 (bits/symbol)

    ```


    Step 5: arithmetic-entropy channel of VQ indices:


    ```

    >>> charmeticencode -d 4 lenna.40256.chn

    enna.40256.chn

    ```


    Channel lenna.40256.chn arithmetic coded to: 1.83022


    ```

    >>> rm lenna.40256.chn

    ```


    Step 6: decode-coded channel:


    ```

    >>> charmeticdecode lenna.40256.chn lenna.40256.dat


    ```


    Step 7: inverse VQ channel to produce data:


    ```

    >>> vdecode lenna.40256.chn lenna.40256.ckb

    enna.40256.dat

    ```


    Step 8: convert DAT to PGM format:


    ```

    >>> imgist lenna.pgm lenna.402_56.ppm

    ```


    Step 9: calculate distance between original and coded indices:


    The distortion between files lenna.pgm.dat and lenna.40256.image is:


    +   - 13.841091 (MSE)

    - 22.186606 (SNR)'
