  md: '# COLUMNS


    # WORK THE SHELL


    ![](img/465f773ec3a6747b5eef398f28f808b8_27_0.png)


    # # Displaying Image Directories in Apache, Part IV


    The final steps in our thumbnail script scale and align the images within a pretty
    period.


    The last step in our script development is to let more than one image displayed
    on a line, because we can now reduce thumbnails, whether they''re wide or tall.


    This is the fourth of four columns on how to write a script to make the display
    of directories of images more useful than the default Apache-style output. In
    the first column, I explained how to drop a script in place to improve the Apache
    directory listing capability, and in the latter two columns, I showed how to work
    with images within a script to extract height and width from most image types.
    I also highlighted the fact that if you really want to work with images on the
    command line, there''s no better package than ImageMagick. You''ll want to check
    out this month''s manual (www.imagemagick.org).


    # ## Rewriting the Image Size Function


    I replaced the fixed image size function with the file command to output the file
    image size. For PNG and GIF images, it turns out that the file command output
    is not in pixels. So, we need to use the ImageMagick identify script instead.
    Here''s a sample (printed output):


    ```

    $ identify testpeg.jpg $cut -d - archos-av700.jpg

    testpeg.jpg $identify $cut -height=350 and width=350

    62.733

    hentangle-image-example.jpg GIF 358x313+0-DirectClass 256

    $ - 86.4415

    archos-av700.jpg PNG 567x294 567x0-DirectClass

    $ - 341.4865

    ```


    Notice that in all cases, the images are shown as field, in width x height format
    (example, archos-av700 is 567x294 and 516 pixels).


    We can use cut to grab only those values and cut to strip out one field and leave
    two, like this:


    ```

    width=$($identify $cut -d -f3 $cut -d -f1)

    height=$($identify $cut -d -f0 $cut -d -f2)

    ```


    If we add echo we have a resize image size shell script. With done, let''s test
    it with the Apache PNG file and the Testpeg image that this script can handle


    # ## Scaling Proportions


    The last step in our development is to let more than one image be displayed on
    a line, because we can reduce thumbnails, whether they''re wide or tall. Here,
    I have three images about, but each one has a different aspect ratio.


    To have three images in a window that''s no more than 700 pixels (for example
    on an 800px screen), we want the thumbnail images to be no more than 200 pixels.
    This means we use scale to fix each and output the reduced dimensions to fit that
    max.


    The challenge is that scale doesn''t really work with floating-point(non-integer)
    numbers, so we need to trick back into doing the work for us. Here is how if the
    image is larger:


    ```

    echo ''scale=4:$MAXSIZE/height'' | bc

    newwidth=$($echo "width * $scale" | bc)

    ```


    To figure out how to scale the image proportionally, we use MAXSIZE/actual height,
    which would be a less than 1.0, and then use that as the multiplier for the other
    dimension.


    For example, say I have an image that''s 313x358


