    \ needs a piece\nof code, is defined less than the indentation. Here's an\nexample:\n\
    \n```\n>>> list = [1,2,\"a\",\"b\"]\n>>> for item in the list:\n...     print\
    \ item\n1\n2\na\nb\n```\n\nVarious tasks are solved with a loop. One such task\
    \ is doing-\nthing for each member of a collection, like we did in the previous\n\
