  md: 'This chain of four commands reduces the color palette to black and saves the
    result as an uncompressed TIFF image. The number passed to the -value parameter
    of pamithber defaults to 0.5, and can range from 0 to 1, which corresponds to
    the colors used in GIMP. In this case, you can make the image however you want.


    Netbmp 10.3 includes a more-advanced utility, which can do a better job on images
    where the layers vary over time. In this case, the command would be:


    ```

    $ tftopnm < input.tif | \

    pamreshold -local=208 | \

    pmomotiff > result.tif

    ```


    There are several alternatives for options of threshold; the -local option allows
    you to select a rectangular area that you want to adjust around each pixel to
    detect lighting conditions in the image to adapt to changing lighting conditions.
    You may want to:


    ```

    $ tftopnm < image.tif | \

    pamreshold -threshold=8 | \

    pmomotiff > result.tif

    ```


    to get results similar to the other dither, use the Netbmp documentation for more
    details.

    If your inputs are in a format other than TIFF, you can use the appropriate Netbmp
    tool (such as jpegtopnm) in the pipeline:


    Netbmp includes tools that allow you to clip out portions of an image. Note that
    many multicumn formats are very consistent in positioning the columns, which you
    can manage using the translation of multicumn text pretty easily as well. If you
    have a two-column article at 200dpi, you can use GIMP to align the columns starts
    at about 200 and ends at 700, and the second column starts at 800 and ends at
    1200. You could also add the following to your processing pipeline:


    ```

    $ tftopnm < input.tif | \

    pamcut -left 150 -right 750 | \

    pmomotiff > output.tif

    ```


