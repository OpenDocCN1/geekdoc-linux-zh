- pgno: 60
  md: 'The GIMP is a great interactive image editor, but it also be used to automate
    the mundane tasks that are involved in creating Web sites. Commercial Web sites
    that are designed to sell products rather than deliver text content rely heavily
    on images to make users stick around. This article is about using GIMP to create
    the visuals for image-laden sites. The sites created by this article are not using
    Flashing and are expected to work cross-browser, which is possible with a single
    alpha mask.


    In this article, I generate HTML and specifications and create batch image processing
    with GIMP. The two targets that are minimally expected to work are single-alpha
    mask and JPEGs with no auxiliary alpha mask at all. However, a single-alpha mask
    cannot be used for cross-browser sites with technical audiences. Many people still
    use whatever browser came by default with their operating system, and businesses
    tend not to ignore potential customers.


    As we consider a site that wants to have a tiled-background image, oval side panel
    with a drop shadow and images that are not confined to sitting evenly inside the
    side panel. Part of the Web is about showing various products, which are not nicely
    sided and/or anchored on top of the background of the site.


    A single-alpha mask is not useful for displaying many types of images on top of
    a complex background image. This is because the edges of images needs to be blended
    explicitly to the color of the background in order to look natural. With a single-alpha
    mask the edges needs to be very stable for the entire perimeter of the image in
    order to look acceptable.


    As an example, I show how easy it is to make things, such as the composition in
    Figure 1, with the final layer as in Figure 2. This example is of a cake, placed


    # A single-alpha mask is not useful for displaying many types of images on top
    of a complex background image.


    half on the side panel and half on the page—as though the user has moved the left
    slightly aside. Now the layers can be stored in xcf files for many properties
    and maintained with the GIMP scripting into cake-jpg, which can be included by
    the Web.


    # Getting Started


    Unfortunately, some distributions no longer package gimp-perl. It is available
    GIMP 2 x from gimp.org, and once peri-PDL and the Perl bindings are installed
    with GIMP, gimp-dev and the Perl bindings for GTK+ 2x, the module can be installed
    using the classic CPAN tool shown in Listing 1.


    Start The GIMP with a GUI, ready to perform perl commands with the following:


    ```

    gimp -i b (extension-perl-server 0 0 ) &

    ```


    ![](img/465f773ec3a6747b5eef398f28f808b8_60_0.png)


    Figure 2. Composing a Cake with the Background and Side Panel'
