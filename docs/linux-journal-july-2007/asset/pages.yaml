    Before we run the application, we need to synchronize the database. This is the
    Django for creating tables that have not been created in the database. We do this
    by typing (in) after):


    ```

    python manage.py synccdb

    ```


    Now, if you''re coming from the Rails world, you might be scratching your head
    at what: What tables Django possibly need to create? Django tables or objects—what
    are you doing?


    The answer is that Rails and Django are similar in ways, but they differ significantly
    in others. One of the ways to do this with authorization. Django assumes everyone
    will want to have an authentication system. Django prompts you for user name,
    email and address of the superuser for you. It finishes with the creation of the
    administration tables.


    Now we can start our server:


    ```

    python manage.py run

    ```


    us an error message when we try to access the server. What''s happening?


    The simple answer is that we have not yet created our project with applications.
    The project exists, and the server is running, but they are basically an empty
    shell. We need to create one or more applications, or we are not going to see
    much.


    The next is the Django administrative package, which comes with the system and
    is immediately available. Well, that''s quite true, but if you explicitly modify
    the list of applications (INSTALLED_APPS) to include the package name, you can
    do that without too trouble. We go up mysettings, modify INSTALLED_APPS so that
    it includes the string:


    ```

    django.contrib.admin

    ```


    You don''t have to restart the server. Once this value has been added, you will
    be asked to log in with a user name and password. The values you entered when
    you created the administration database, and you''ll get a nicely formatted (if
    sparsely populated) administrative site with Django documentation.


    Without any applications, it might seem a bit strange for a Django administrative
    site. But, one of the things that Django provides is really an authentication
    and security system. Out of the box, Django understands that there are users and
    groups, and that they need to be assigned different permissions. You can easily
    add users, groups, giving them one or more permissions from a provided list.


    Even without applications, you can create and administer a system with users,
    groups and permissions. It would be nice if Django was to support hierarchies
