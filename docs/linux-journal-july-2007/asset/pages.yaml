  md: "# INDEPTH\n\nWith all the pieces in place, we're ready to go. Here's a simple\
    \ Perl\nGI script that we want to protect:\n\n```\n#!/usr/bin/perl\nuse CGI;\n\
    my $q = CGI->new();\nprint $q->header(\\n\nprint <<'EOF'\n<html>\n<body bgcolor=\"\
    #ee3333\">\n<p align=\"center\" style=\"color: white\">This\nis a TOP SECRET page.</p>\n\
    \n</body>\n</html>\nEOF\n```\n\nIt creates the output shown in 6. Now, let's modify\
    \ it to\n the new framework:\n\n```\n#!/usr/bin/perl\nuse CGI;\nuse Auth;\n\n\
    my $q = CGI->new();\n\nmy $a = LC::Auth->new();\n$a->require_role('top-secret',\
    \ $q);\n\nprint $q->header(\\n\nprint <<'EOF'\n<html>\n<body bgcolor=\"#ee3333\"\
    >\n<p align=\"center\" style=\"color: white\">This\nis a TOP SECRET page.</p>\n\
    \n</body>\n</html>\nEOF\n```\n\nAfter making this change, reloading the browser\
    \ now shows\nthe same URL, but instead of the content-protected page, we see a\
    \ login\nform (Figure 7). Logging in will correctly show several things in the\n\
    link: send an event to auth-login.cgi, which will verify if,\nthen store the logged-in\
    \ state in a session, redirect to the login page,\nwhich will re-execute require_role(),\
    \ now finds the session,\nrole with the MySQL database, and returns, allowing\n\
    the script to display content. But, as users are concerned, after\nubmitting the\
    \ form, their application appears simple.\n\n# Conclusion\n\nThis simple collection\
    \ of few short Web scripts provides a\narray of benefits. Logic functionality\
    \ is factored out into a\nmodule for web scripts. Roles are now handled under\
    \ the\nsystem. Authorization comes from authentication. Single sign-on\nis provided,\
    \ because session-checked by cookies. The flexible\nenvironment allows custom\
    \ templates enables seamless user experience. And,\nchanges in role assignment\
    \ take effect in real time, because the\ndatabase is queried every time a script\
    \ is loaded.\ni see this as the payoff for putting in a bit of time up front\n\
    \n![](img/465f773ec3a6747b5eef398f28f808b8_95_0.png)\n\nFigure 6. Protected -\
    \ Mozilla Firefox\n\n![](img/465f773ec3a6747b5eef398f28f808b8_95_1.png)\n\nFigure\
    \ 7. Login Form\n\ninvestigate the problem, and find a good solution. Another\
    \ factor that\ncontributed to this project's success is the use of Ruby on Rails\
    \ for\n-end data management. I envision that for the future, we'll have\nsets\
    \ of solution components that adapts to that what we need\nof users on our front\
    \ end. And handle the sessions, we'll quickly\n\n> Rob Sherrock is a software\
    \ engineer at Lewis & Clark in Portland, Oregon. He's responsible fornWeb application\
    \ development and software engineering projects. He's particularly interested\n\
    programming languages and software design. He can be reached at rob@clark.com.\n\
    \n# Resources\n\n+   A-Many-To-Ruby/Projects/rails/has_many_and_belongs_to_many.pdf\n\
    \nRails Framework Documentation: api.rubyonrails.com\n\n94 | July 2007 | www.linuxjournal.com"
