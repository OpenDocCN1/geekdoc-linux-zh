  md: "# INDEPTH\n\nwe have another new construct—an if. This allows programs to make\
    \ choices based on data. It needs a boolean value and a piece of code. The code\
    \ runs only if it is True. If you provide something that is not true, Python does\
    \ its best to interpret it as. For example, number 0 is interpreted as False,\
    \ but all the other numbers as True. Here are some examples:\n\n```\n>>> True:\n\
    \    print \"It is true!\"\n\n>>> False:\n    print \"It is false?\"\n```\n\n\
    We can perform many different types of comparisons on different kinds of objects.\
    \ Note that the equality operator is ==, not =(that is, two equals):\n\n```\n\
    >>> a = 10\n>>> if a == 10:\n    print \"Ten!\"\n```\n\nTen!\nThere are other\
    \ comparisons, such as greater (>), less (<) and different (!). You can experiment\
    \ with comparisons directly on the REPL:\n\n```\n>>> a = 3\nFalse\n>>> a != 10\n\
    True\n>>> a > 1\nTrue\n```\n\nIt is common to run a piece of code if something\
    \ is true and another piece of code if it is false. For example, we could do this:\n\
    \n```\nif a == 10:\n    print \"A is ten\"\nelif a != 10:\n    print \"A is not\
    \ ten.\"\n```\n\nThis has a problem. If we change a to b in the first case, we\
    \ have to remember to change it in the second. And, for any other changes we make.\
    \ The solution is an extension to this:\n\n```\nif a == 10:\n    print \"A is\
    \ ten\"\nelse:\n    print \"A is not ten.\"\n```\n\nThe piece of code after will\
    \ be executed if the first part\n\nwasn't executed.\n\nAnother common situation\
    \ is having conditionals for different cases. In that case, we can use a string\
    \ of:\n\n```\nif a == 10:\n    print \"A is ten.\"\\elif a == 0:\n    print \"\
    A is zero.\"\\elif a == 30:\n    print \"A is not dirty.\"\nelse:\n    print \"\
    Who cares about a b ?\"\n```\n\nelif is the construct of \"else if\", and the\
    \ previous code could be written:\n\n```\nif a == 10:\n    print \"A is ten.\"\
    \nelif a == 0:\n    print \"A is zero.\"\nelif a == 30:\n    print \"A is not\
    \ dirty.\"\nelse:\n    print \"Who cares about a ?\"\n```\n\nBut, that is ugly\
    \ and prone to errors. If you have 10 or 15 different cases, you'll need a jagged-oriented\
    \ view to justify. Not that I have anything against it. I'd like to have one.\n\
    \nIf you come from languages that have a switch or construct and are wondering\
    \ where they are in Python, I'm sorry to disappoint you. Python has no switch.\
    \ There's a proposal to include it, but it hasn't been implemented yet. Now the\
    \ solution is to use a chain of ifs and elifs. After you use it few times, it's\
    \ not so bad.\n\nNow that you know about else, there's an interesting topic for\
    \ you, inheritance. What do they do and out for yourself? While programming, you'll\
    \ need to run a lot of code to find out how many undocumented, obscure black-magic\
    \ things work, so starting with something will help you get some training.\n\n\
    # Inheritance\n\nThe short object-oriented (OOP) in Part of this article makes\
    \ OOP really easy, as OOP tries to mimic life, I explain inheritance with real-life\
    \ examples.\n\nThink about a chair. A chair is made of some kind of material,\
    \ it has two attributes, a color, a style and a warranty. Now, think about a table.\
    \ It is made of some kind of material, it has a leg in common if we want to make\
    \ the table. And Table, a lot of code would be repeated. In programming, when\
    \ you write the same line of code twice, you are programming wrong-inheritance\
    \ to the rescue.\n\nA chair is piece of furniture. So is a table. Such similarities\n\
    \n76 | July 2007 www.linuxjournal.com"
