  md: '# How Install


    Version 1.03 was the latest at the time of this writing, and the build and install
    process still needed a little work. Also, integration with libtiff (which would
    allow you to use compressed TIFF as input) was configured by default, but it was
    not properly. You might configure it with libtiff, as that would allow compressed
    TIFF image:


    ```

    # /configure

    ```


    If you later find that it doesn''t recognize text, reconfigure it without libtiff:


    ```

    # /configure --without-libtiff

    ```


    The build is done as:


    ```

    # make

    ```


    Configure for version 1.03 also indicated that make install was broken. I figured
    out the basics of installation by trial and error,


    First, copy the executable from cman/tesseract to a directory in your path (for
    example, usr/local/bin):


    ```

    # cp cman/tesseract /usr/local/bin

    ```


    Then, copy the tessdata directory and all of its contents to the same place (for
    example, /usr/local/tessdata...).


    ```

    # -r tessdata /usr/local/bin/tessdata

    ```


    Finally, make sure your PATH variable includes the path (/usr/local/bin).


    # How to Use


    If you need to access a scanner, pages are available with most Linux distributions
    and have a nice GUI interface called xane. (I discuss more near the end of this
    article.) Tesseract has radical analysis, but the better support means it can
    read only uncompressed TIFF. This might take a little work on your scanned document
    to get the best results. Fortunately, the steps are automated and most of them
    are well worth it.


    This is what you need to do:


    +   1. Use threshold to drop lighting variations and convert the image to black.


    +   2. Erase any graphics (optional, but if you skip this step the recognizer
    will give a bunch of garbled text in those areas).


    +   3. Break any multicolum into smaller-column columns.


    ![](img/465f773ec3a6747b5eef398f28f808b8_46_0.png)


    Figure 1. Threshold dialog in GIMP. Slide the triangle left and right to choose
    which pixels are white and which pixels are black.


    I recommend using a graphics program, such as GIMP to get a feel for what needs
    to be done. The most important step is the first one, as it drastically improve
    the accuracy of OCR.


    The GIMP has a great function that easily remove variations in all but the worst
    cases. First, go to Image->Mode and make sure the image is in RGB or Grayscale
    mode. Threshold will not work on indexed images. Next, use the Menu->Colors->Threshold.
    This will allow you to drop pixels above a specified value and convert them to
    black. A popup (figure 1) lets you select the threshold. Make sure image preview
    to get an idea of how it affects the image. Slide the triangle left and right
    to get a good-looking result for the white and black. Then, execute the rest of
    the transition from one part to the next. Figure 2 shows a typical result of this
    step.


    Zoom and inspect in part of the image while you are using tesseract, so you can
    see things at the pixel level. This level shows what tesseract will see and give
    you a better feel of how to get the best results. If you can''t recognize the
    characters, tesseract won''t.


    This page had handwritten notes, outlining and a section of


    ![](img/465f773ec3a6747b5eef398f28f808b8_46_1.png)


    Figure 2. Viewed of image preparation. From to left: the original image, the image
    after applying threshold, and the image after applying threshold and manual cleanup.


    www.linuxjournal.com july 2007 | 45'
