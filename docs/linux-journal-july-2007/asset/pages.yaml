    # The Pillow utility


    The Pillow tool gives you access to PIL functions from your operating system''s
    command-line interface. When called as a script, the command-line arguments are
    passed to a PIL interactive interpreter, each line which is split into space-separated
    tokens and execute the method. The Pillow tool was constructed by Eric S. Raymond.
    The Pillow follows functions from the Python prompt.


    ```

    >>> pillow program

    >>> pillow show 0 200 380 open.jpg

    >>> pillow save rotated.png 30 open test.tiff

    ```


    # The Pillow Decoder


    The Pillow module provides a single class PILDecoder: An instance of the PILDecoder
    class is essentially a software machine (Pillow-rotation interpreter) for sequencing
    image transformations. The state of the interpreter is the interpreter stack.
    The method only works after initialization is the execute method. Any method takes
    a list of tokens, pushes them onto the stack, and then clears the stack by evaluation
    of Pillow operations. Any stack not cleared off and is part of the evaluation
    content for the next call of the execute method. PillowDecoder catches any exceptions
    on the theory that actually contain information that should be interpreted by
    the calling code.


