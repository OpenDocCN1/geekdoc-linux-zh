  \ 程序的到来**。而整个第四部分的故事，就是这个 `init` 函数做的事情。\n\n虽然就一行代码，但这里的事情可多了去了，我们先看一下整体结构。我已经把单纯的日志打印和错误校验逻辑去掉了。\n\
