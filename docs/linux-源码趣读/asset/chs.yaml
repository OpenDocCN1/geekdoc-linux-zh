  \        current->executable->i_count++;\n    set_tss_desc(gdt+(nr<<1)+FIRST_TSS_ENTRY,&(p->tss));\n\
  \    set_ldt_desc(gdt+(nr<<1)+FIRST_LDT_ENTRY,&(p->ldt));\n    p->state = TASK_RUNNING;\
  \    /* do this last, just in case */\n    return last_pid;\n}\n```\n\n艾玛，这也太多了！\n\
  \n别急，大部分都是 `tss` 结构的复制，以及一些无关紧要的分支，看我简化下。\n\n```\nint copy_process(int nr, ...)\
  \ {\n    struct task_struct p =\n        (struct task_struct *) get_free_page();\n\
  \    task[nr] = p;\n    *p = *current;\n\n    p->state = TASK_UNINTERRUPTIBLE;\n\
  \    p->pid = last_pid;\n    p->counter = p->priority;\n    ..\n    p->tss.edx =\
  \ edx;\n    p->tss.ebx = ebx;\n    p->tss.esp = esp;\n    ...\n    copy_mem(nr,p);\n\
  \    ...\n    set_tss_desc(gdt+(nr<<1)+FIRST_TSS_ENTRY,&(p->tss));\n    set_ldt_desc(gdt+(nr<<1)+FIRST_LDT_ENTRY,&(p->ldt));\n\
  }\n```\n\n\n\n\n\n![](img/file184.webp \"fig:\")\n\nAfter this, it overrides the\
  \ basic information of the new process, including metadata and register information\
  \ in the `tss`.\n\n```\n[](#cb174-1)int copy_process(int nr, ...) {\n[](#cb174-2)\
  \    ...\n[](#cb174-3)    p->state = TASK_UNINTERRUPTIBLE;\n[](#cb174-4)    p->pid\
  \ = last_pid;\n[](#cb174-5)    p->counter = p->priority;\n[](#cb174-6)    ..\n[](#cb174-7)\
  \    p->tss.edx = edx;\n[](#cb174-8)    p->tss.ebx = ebx;\n[](#cb174-9)    p->tss.esp\
  \ = esp;\n[](#cb174-10)    ...\n[](#cb174-11)}\n```\n\nIt can be said that half\
  \ of the `fork` function has been explained. Today, we will expand on the other\
  \ half, which is the `copy_mem` function.\n\n```\n[](#cb175-1)int copy_process(int\
  \ nr, ...) {\n[](#cb175-2)    ...\n[](#cb175-3)    copy_mem(nr,p);\n[](#cb175-4)\
  \    ...\n[](#cb175-5)}\n```\n\nThis will determine the memory planning issues between\
  \ processes. It is very exciting, so let's begin.\n\n------\n\nThe entire function\
  \ is not long, so let's try to translate it literally first.\n\n```\n[](#cb176-1)int\
  \ copy_mem(int nr,struct task_struct * p) {\n[](#cb176-2)    // Local descriptor\
  \ table LDT assignment\n[](#cb176-3)    unsigned long old_data_base,new_data_base,data_limit;\n\
  [](#cb176-4)    unsigned long old_code_base,new_code_base,code_limit;\n[](#cb176-5)\
  \    code_limit = get_limit(0x0f);\n[](#cb176-6)    data_limit = get_limit(0x17);\n\
  [](#cb176-7)    new_code_base = nr * 0x4000000;\n[](#cb176-8)    new_data_base =\
  \ nr * 0x4000000;\n[](#cb176-9)    set_base(p->ldt[1],new_code_base);\n[](#cb176-10)\
  \    set_base(p->ldt[2],new_data_base);\n[](#cb176-11)    // Copy page tables\n\
  [](#cb176-12)    old_code_base = get_base(current->ldt[1]);\n[](#cb176-13)    old_data_base\
  \ = get_base(current->ldt[2]);\n[](#cb176-14)    copy_page_tables(old_data_base,new_data_base,data_limit);\n\
  [](#cb176-15)    return 0;\n[](#cb176-16)}\n```\n\nLook, it is actually just the\
  \ assignment of the new process's `LDT` entries and the copying of page tables.\n\
  \n### LDT Assignment\n\nLet's look at the assignment of the `LDT` entries first.\
  \ To explain the significance of this assignment, we first need to recall the problem\
  \ we mentioned in [Episode 9 | Intel Memory Management Two Axes: Segmentation and\
  \ Paging](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499821&idx=1&sn=df90a7c57607bf501b5ef535f8440d98&chksm=c2c5ba80f5b233969bf591f919107e28e7be51f066821cba1ea39bf19cc0332b95b94d29467d&scene=21#wechat_redirect)\
  \ when we set up the page tables.\n\nThe logical address provided by the programmer\
  \ is eventually converted into a physical address through these steps.\n\n![](img/file185.webp\
  \ \"fig:\")\n\nSince we have already enabled paging, the specific transformation\
  \ of the paging mechanism is as follows.\n\n![](img/file186.webp \"fig:\")\n\nBecause\
  \ of the existence of page tables, there is the concept of linear address space,\
  \ which is the address after the segmentation mechanism transformation but before\
  \ the paging mechanism transformation.\n\nIgnoring the segment limit, the 32-bit\
  \ CPU linear address space should be 4G. Now there are only four page directory\
  \ tables, which means the first 16M of linear address space is mapped one-to-one\
  \ with 16M of physical address space.\n\n![](img/file187.webp \"fig:\")\n\nRelating\
  \ this diagram to the Global Descriptor Table `GDT`, this linear address space is\
  \ the address after the segmentation mechanism (the segment could be `GDT` or `LDT`),\
  \ and it corresponds as follows.\n\n![](img/file188.webp \"fig:\")\n\nThe code segment\
  \ and data segment of `LDT` prepared for process 0 have segment bases of 0 and segment\
  \ limits of 640K. For process 1, which is the process we are currently forking,\
  \ the code segment and data segment have not been set yet.\n\nSo the first step,\
  \ the assignment of the local descriptor table `LDT`, is to assign values to those\
  \ two unset code and data segments in the figure above.\n\nAmong them, the segment\
  \ limit is taken from the segment limit set by process 0, which is 640K.\n\n```\n\
  [](#cb177-1)int copy_mem(int nr,struct task_struct * p) {\n[](#cb177-2)    ...\n\
  [](#cb177-3)    code_limit = get_limit(0x0f);\n[](#cb177-4)    data_limit = get_limit(0x17);\n\
  [](#cb177-5)    ...\n[](#cb177-6)}\n```\n\nAnd the segment base is somewhat interesting;\
  \ it depends on which process number it currently is, which is the value of `nr`.\n\
  \n```\n[](#cb178-1)int copy_mem(int nr,struct task_struct * p) {\n[](#cb178-2) \
  \   ...\n[](#cb178-3)    new_code_base = nr * 0x4000000;\n[](#cb178-4)    new_data_base\
  \ = nr * 0x4000000;\n[](#cb178-5)    ...\n[](#cb178-6)}\n```\n\nThe `0x4000000`\
  \ here is equal to 64M. This means each process gets a 64M block of linear space.\n\
  \n```\n[](#cb179-1)int copy_mem(int nr,struct task_struct * p) {\n[](#cb179-2) \
  \   ...\n[](#cb179-3)    set_base(p->ldt[1],new_code_base);\n[](#cb179-4)    set_base(p->ldt[2],new_data_base);\n\
  [](#cb179-5)    ...\n```\n\n\n\n\n这就是**写时复制（Copy-on-Write）**的基础。在 Linux 0.11 的设计中，进程\
  \ 0 创建进程 1 时，复制了 **160** 个页表项。进程 1 创建进程 2 时，复制了 **1024** 个页表项。之后进程 2 创建进程 3，进程 3\
  \ 创建进程 4，通通都是复制 1024 个页表项。\n\n![](img/file203.webp \"fig:\")\n\n\n\n\n```\nint copy_page_tables(unsigned\
  \ long from,unsigned long to,long size) {\n        ...\n        nr = (from==0)?\
  \ 4: 1024;      \n        for ( ; nr-- > 0 ; from_page_table++,to_page_table++)\
  \ {\n                ...\n        }\n        ...\n}\n```\n\n结果再次调试发现，一共只复制了 2 项页表！还是少了俩！\n\
  \n我又怀疑是不是因为触发了写时复制，页表项被改到了别的位置？但我怎么看源码，都没看到复制页表的那段代码之后，有什么操作可以导致写时复制。\n\n于是乎，我这时竟然产生了，所有\
  \ Linux `0.11` 的书上这块都写错的自信！还发到了我的操作系统催更群里求证。\n\n但就过了几秒钟，我一拍脑门，想起了问题所在。\n\n就是个非常二逼且简单的问题，**页目录项中记录的，不仅仅是页表地址**...\
  \ 它的结构是这样的。\n\n![](img/file210.webp \"fig:\")\n\n所以刚刚的页表项 `0x00ffe007` 换成二进制是\n\n\
  **00000000111111111110000000000111**\n\n对照结构分析出，页表地址为 `0x00ffe000`，存在位 `P` 为 1，读写位\
  \ `RW` 为 1，用户态内核态位 `US` 为 1。\n\n所以，看页表地址，不应该是 `0x00ffe007`，而应该是 `0x00ffe000`。\n\n\
  就这么简单个事，我画页表结构都画了无数遍了，居然实际调试的时候还是直接把页目录项的值当成页表地址...\n\n别说了，再次验证下吧。\n\n![](img/file211.webp\
  \ \"fig:\")\n\n看，这回妥妥的 160 项了，终于可以睡个好觉了！\n\n而且注意到，这里的页表都是**只读**状态，比如第一个页表项 `0x00000065`\
  \ 换成二进制是\n\n00000000000000000000000001100101\n\n对照上面的页表结构发现，**RW 位是 0**，不再是原来的 1\
  \ 了，说明从可读写，变成了只读状态。这就为之后的**写时复制**做了准备。\n\n源码中很简单，就是强行把新复制的页表的 `RW` 位置 0，毫无神秘感。\n\
  \n```\n[](#cb188-1)int copy_page_tables(unsigned long from,unsigned long to,long\
  \ size) {\n[](#cb188-2)        ... \n[](#cb188-3)        for ( ; nr-- > 0 ; from_page_table++,to_page_table++)\
  \ {\n[](#cb188-4)                ...\n[](#cb188-5)                this_page &= ~2;\n\
  [](#cb188-6)                ...\n[](#cb188-7)        }\n[](#cb188-8)        ...\n\
  [](#cb188-9)}\n```\n\n这里不展开了。\n\n本篇文章就是想说，即便是再觉得自己已经熟悉的事情，也会有脑残的时候。但这也恰恰证明了自己还不够熟悉，仅仅是记住了页表和页目录表的结构，还没有在实践中真正“玩”过它们。\n\
  \n另外大家遇到难啃的骨头，奇怪的问题时，也不要害怕，**在源码面前一切秘密都不存**在。不存在魔幻的事情，要么是你的操作有问题，要么是源码有问题，大胆去证明，去折腾，就好了。\n\
