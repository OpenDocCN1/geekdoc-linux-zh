  \n整个操作系统的编译和加载过程的全貌，就是下面这张图 media/file82.webp \"fig:\")\n\n\n\n\n\n`cs:eip` represents\
  \ the code we want to execute.\n\n`ds:xxx` represents the data we want to access.\n\
  \n`ss:esp` represents where our stack pointer address is located.\n\nThe code in\
  \ the first part also performs the following tasks:\n\n- Sets `ds` to `0x10`, pointing\
  \ to the global descriptor with index 2, which is the data segment descriptor.\n\
  - Sets `cs` to `8` via a far jump, pointing to the global descriptor with index\
  \ 1, which is the code segment descriptor.\n- Sets the `ss:esp` address to the end\
  \ of the `user_stack` array.\n\nAs you can see, segmentation, paging, and the configuration\
  \ of these registers are essentially a preliminary plan for how we will access memory\
  \ in the future—defining where to find code, where to find data, where to find the\
  \ stack, and how to convert logical addresses into final physical addresses through\
  \ segmentation and paging mechanisms.\n\nEverything mentioned above involves dealing\
  \ extensively with the Intel CPU hardware, setting up the most fundamental environment\
  \ and memory layout to fully prepare for entering the `main` function. Although\
  \ C is low-level, it has its limitations, which are handled by the assembly language\
  \ in the first part. Therefore, I call the first part **the grunt work before entering\
