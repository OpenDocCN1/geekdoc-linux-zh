  \ == 0)\n[](#cb337-8)            // 执行命令\n[](#cb337-9)            runcmd(parsecmd(buf));\n\
  [](#cb337-10)        // 等待进程\n[](#cb337-11)        wait();\n[](#cb337-12)    }\n\
  ```\n\n也就是上述函数中的 `runcmd`。首先 `parsecmd` 函数会将读取 `buf` 的字符串做解析，生成一个 `cmd` 结构的变量传入\
  \ `runcmd` 函数中。\n\n```\n[](#cb338-1)// xv6-public sh.c\n[](#cb338-2)void runcmd(struct\
  \ cmd *cmd) {\n[](#cb338-3)    ...\n[](#cb338-4)    switch(cmd->type) {\n[](#cb338-5)\
