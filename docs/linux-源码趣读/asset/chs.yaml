  \ man page 查看 `pipe` 的用法与说明。\n\n\n\n\n\n```c\n// fs/pipe.c\nint sys_pipe(unsigned\
  \ long * fildes) {\n    struct m_inode * inode;\n    struct file * f[2];\n    int\
  \ fd[2];\n\n    for(int i=0,j=0; j<2 && i<NR_FILE; i++)\n        if (!file_table[i].f_count)\n\
  \            (f[j++]=i+file_table)->f_count++;\n    ...\n    for(int i=0,j=0; j<2\
  \ && i<NR_OPEN; i++)\n        if (!current->filp[i]) {\n            current->filp[\
  \ fd[j]=i ] = f[j];\n            j++;\n        }\n    ...\n    if (!(inode=get_pipe_inode()))\
  \ {\n        current->filp[fd[0]] = current->filp[fd[1]] = NULL;\n        f[0]->f_count\
  \ = f[1]->f_count = 0;\n        return -1;\n    }\n    f[0]->f_inode = f[1]->f_inode\
  \ = inode;\n    f[0]->f_pos = f[1]->f_pos = 0;\n    f[0]->f_mode = 1;       /* read\
  \ */\n    f[1]->f_mode = 2;       /* write */\n    put_fs_long(fd[0],0+fildes);\n\
  \    put_fs_long(fd[1],1+fildes);\n    return 0;\n}\n```\n\n不出我们所料，和**进程打开一个文件**的步骤是差不多的，可以回顾下[第\
  \ 33 回 | 打开终端设备文件](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502230&idx=1&sn=44e023bf0b9b37261e35a6e3722bc57f&chksm=c2c5b33bf5b23a2d10a9dd36606c497f41a1c3dced57845ce7ef12741a348fab82beba462a8a&scene=21#wechat_redirect)这一回，下图是进程打开一个文件时的步骤。\n\
  \n![](img/file313.webp \"fig:\")\n\n而 `pipe` 方法与之相同的是，都是从进程中的**文件描述符表 `filp`**数组和系统的**文件系统表\
  \ `file_table`**数组中寻找空闲项并绑定。\n\n不同的是，打开一个文件的前提是文件已经存在了，根据文件名找到这个文件，并提取出它的 `inode`\
  \ 信息，填充好 `file` 数据。\n\n而 `pipe` 方法中并不是打开一个已存在的文件，而是**创建一个新的管道类型的文件**，具体是通过 `get_pipe_inode`\
  \ 方法，返回一个 `inode` 结构。然后，填充了两个 `file` 结构的数据，都指向了这个 `inode`，其中一个的 `f_mode` 为 1 也就是写，另一个是\
  \ 2 也就是读。（`f_mode` 为文件的操作模式属性，也就是 RW 位的值）\n\n创建管道的方法 `get_pipe_inode` 方法如下。\n\n\
  ```c\n// fs.h\n#define PIPE_HEAD(inode)  ((inode).i_zone[0])\n#define PIPE_TAIL(inode)\
  \  ((inode).i_zone[1])\n\n// inode.c\nstruct m_inode * get_pipe_inode(void) {\n\
  \    struct m_inode *inode = get_empty_inode()；\n    inode->i_size=get_free_page()；\n\
  \    inode->i_count = 2; /* sum of readers/writers */\n    PIPE_HEAD(*inode) = PIPE_TAIL(*inode)\
  \ = 0;\n    inode->i_pipe = 1;\n    return inode;\n}\n```\n\n可以看出正常文件的 `inode` 中的\
  \ `i_size` 表示文件大小，而管道类型的 `i_size` 表示管道使用的这一页内存的起始地址。OK，管道的原理在这里说完了，最终我们实现了一个进程的输出指向另一个进程的输入。\n\
  \n![](img/file314.webp \"fig:\")\n\n回到开始的 `runcmd` 方法。\n\n```c\n// xv6-public.c\n\
  void runcmd(struct cmd *cmd) {\n    switch(cmd->type) {\n        case EXEC:\n  \
  \          ecmd = (struct ecmd*)cmd;\n            exec(ecmd->argv[0], ecmd->argv);\n\
  \            ...\n        case REDIR:\n        case LIST:\n        case PIPE:\n\
  \        case BACK:\n    }\n}\n```\n\n（注：后续文本因内容乱码严重，未进行翻译）\n\n\n\n\n```c\n// read_write.c\n\
  int sys_read(unsigned int fd,char * buf,int count) {\n    struct file * file = current->filp[fd];\n\
  \    // 校验 buf 区域的内存限制\n    verify_area(buf,count);\n    struct m_inode * inode\
  \ = file->f_inode;\n    // 管道文件\n    if (inode->i_pipe)\n        return (file->f_mode&1)\
  \ ? read_pipe(inode,buf,count) : -EIO;\n    // 字符设备文件\n    if (S_ISCHR(inode->i_mode))\n\
  \        return rw_char(READ,inode->i_zone[0],buf,count,&file->f_pos);\n    // 块设备文件\n\
  \    if (S_ISBLK(inode->i_mode))\n        return block_read(inode->i_zone[0],&file->f_pos,buf,count);\n\
  \    // 目录文件或普通文件\n    if (S_ISDIR(inode->i_mode) || S_ISREG(inode->i_mode)) {\n\
  \        if (count+file->f_pos > inode->i_size)\n            count = inode->i_size\
  \ - file->f_pos;\n        if (count<=0)\n            return 0;\n        return file_read(inode,file,buf,count);\n\
  \    }\n    // 不是以上几种，就报错\n    printk(\"(Read)inode->i_mode=%06o\\n\\r\",inode->i_mode);\n\
  \    return -EINVAL;\n}\n```\n\n这样，整个的逻辑就非常清晰了。\n\n由此也可以注意到，操作系统源码的设计比我刚刚说的更通用，我刚刚只让你设计了读取硬盘的函数，但其实在\
  \ Linux 下一切皆文件，所以这个函数将`管道文件、字符设备文件、块设备文件、目录文件、普通文件`分别指向了不同的具体实现。\n\n那我们今天仅仅关注最常用的，读取目录文件或普通文件，并且不考虑读取的字节数大于文件本身大小这种不合理情况。\n\
  \n再简化下代码。\n\n```c\n// read_write.c\nint sys_read(unsigned int fd,char * buf,int\
  \ count) {\n    struct file * file = current->filp[fd];\n    struct m_inode * inode\
  \ = file->f_inode;\n    // 校验 buf 区域的内存限制\n    verify_area(buf,count);\n    // 仅关注目录文件或普通文件\n\
  \    return file_read(inode,file,buf,count);\n}\n```\n\n太棒了！没剩多少了，一个个击破！\n\n第一步，根据文件描述符\
  \ `fd`，在进程表里拿到了 `file` 信息，进而拿到了 `inode` 信息。第二步，对 `buf` 区域的内存做校验。第三步，调用具体的 `file_read`\
  \ 函数进行读操作。\n\n就这三步，很简单吧～\n\n在进程表 `filp` 中拿到 `file` 信息进而拿到 `inode` 信息这一步就不用多说了，这是在打开一个文件时，或者像管道文件一样创建出一个管道文件时，就封装好了\
  \ `file` 以及它的 `inode` 信息。\n\n我们看接下来的两步。\n\n### 对 buf 区域的内存做校验 verify_area\n\n对 `buf`\
  \ 区域的内存做校验的部分，说是校验，里面还挺有说道呢。\n\n```c\n// fork.c\nvoid verify_area(void * addr,int\
  \ size) {\n    unsigned long start;\n    start = (unsigned long) addr;\n    size\
  \ += start & 0xfff;\n    start &= 0xfffff000;\n    start += get_base(current->ldt[2]);\n\
  \    while (size>0) {\n        size -= 4096;\n        write_verify(start);\n   \
  \     start += 4096;\n    }\n}\n```\n\n`addr` 就是刚刚的 `buf`，`size` 就是刚刚的 `count`。这里又将\
  \ `addr` 赋值给了 `start`。所以代码开始，`start` 表示复制到的内存的起始地址，`size` 就是复制的字节数。\n\n这段代码很简单，但如果不了解内存的分段和分页机制，将会难以。Linux\
  \ 以 `4K` 为单位来划分内存，所以内存就是一个 `4K` 的格子。你看，假设复制到的内存的起始地址 `start` 和复制的字节数 `size` 在图中的位置。那么开始的两行代码：\n\
  \n```c\n// fork.c\nvoid verify_area(void * addr,int size) {\n    ...\n    size +=\
  \ start & 0xfff;\n    start &= 0xfffff000;\n}\n```\n\n就是将 `start` 和 `size` 按页对齐。然后由于每个进程有不同的数据段，还要加上它：\n\
  \n```c\n// fork.c\nvoid verify_area(void * addr,int size) {\n    ...\n    start\
  \ += get_base(current->ldt[2]);\n    ...\n}\n```\n\n具体来说加上当前进程的局部描述符 `LDT` 中的数据段。每个进程的\
  \ `LDT` 表由 Linux 创建时规划好了。具体来说，每个进程的线性地址范围是 `(进程号)*64M ~ `(进程号+1)*64M`。对于进程本身，以为是从零地址开始后的\
  \ `64M`，所以传入的 `start` 值是以零地址算出来的。\n\n现在经过系统调用进入 `sys_write` 后切换为内核态，内核态访问数据通过基地址为\
  \ `0` 的全局描述符来数据。所以 `start` 要加上自己的数据段，才对。之后就是这些页进行验证。\n\n```c\n// fork.c\nvoid verify_area(void\
  \ * addr,int size) {\n    ...\n    while (size>0) {\n        size -= 4096;\n   \
  \     write_verify(start);\n        start += 4096;\n    }\n}\n```\n\n也就是这些页。`write_verify`\
  \ 将会对这些页进行验证，如果页面不可写，则执行 `un_wp_page` 复制。\n\n```c\n// memory.c\nvoid write_verify(unsigned\
  \ long address) {\n    unsigned long page;\n    if (!(page = *((unsigned long *)(address>>12)\
  \ & 0xfff)))\n        return;\n    page &= 0xfffff000;\n    page += ((address>>12)\
  \ & 0xfff);\n    if ((page & 1) == 0) /* non-writeable, present */\n        un_wp_page((unsigned\
  \ long *) page);\n    return;\n}\n```\n\n看，那个 `un_wp_page` 意思就是取消页面的写保护，就是写时复制的原理。[写时复制这几行代码](http://mp.weixin.com/s?MzkMjE3NDE0Ng==mid=24750233&idx=1)讨论过了，这里就不展开。\n\
  \n### 执行读操作 file_read\n\n下面开始进入读的操作，页校验之后就可以调用 `file_read` 函数。\n\n```c\n// read_write.c\n\
  int sys_read(unsigned int fd,char * buf,int count) {\n    ...\n    return file_read(inode,buf,count);\n\
  }\n```\n\n```c\n// file_dev.c\nint file_read(struct m_inode * inode, struct file\
  \ * filp, char * buf, int count) {\n    int left,nr;\n    struct buffer_head * bh;\n\
  \    left = count;\n    while (left) {\n        if ((nr = bmap(inode,filp->f_pos)/BLOCK_SIZE))\
  \ {\n            if (!(bread(inode->i_dev,nr)))\n                break;\n      \
  \  } else\n            bh = NULL;\n        nr = filp->f_pos % BLOCK_SIZE;\n    \
  \    chars = MIN( BLOCK_SIZE, left );\n        filp->f_pos += chars;\n        left\
  \ -= chars;\n        if (bh) {\n            char * p = nr + bh->b_data;\n      \
  \      while (chars-->0)\n                put_fs_byte(*(p++),buf++);\n         \
  \   free(bh);\n        } else {\n            while (chars-->0)\n               \
  \ put_fs_byte(0,buf++);\n        }\n    }\n    inode->i_atime = CURRENT_TIME;\n\
  \    return (count-left) ? (count-left) : -ERROR;\n}\n```\n\n整体看，就是一个 `while` 循环，每次读入一个块的数据，直到入参的大小读完为止。去掉\
  \ `while`，简化起来就是：\n\n```c\n// file_dev.c\nint file_read(struct m_inode * inode,\
  \ struct file * filp, char * buf, int count) {\n    ...\n    int nr = bmap(inode,filp->f_pos)/BLOCK_SIZE;\n\
  \    struct buffer_head *bh=bread(inode->i_dev,nr);\n    ...\n    char * p = nr\
  \ + bh->b_data;\n    while (chars-->0)\n         put_fs_byte(*(p++),buf++);\n  \
  \  ...\n}\n```\n\n首先 `bmap` 获取全局数据块号，然后 `bread` 将块的数据复制到缓冲区，然后 `put_fs_byte` 再一个字节一个字节地将缓冲区数据复制到用户指定的内存中。我们一个个看。\n\
  \n### bmap：获取全局的数据块号\n\n先看第一个函数调用，`bmap`。\n\n```c\n// file_dev.c\nint file_read(struct\
  \ m_inode * inode, struct file * filp, char * buf, int count) {\n    ...\n    int\
  \ nr = bmap(inode,filp->f_pos)/BLOCK_SIZE;\n    ...\n}\n```\n\n```c\n// inode.c\
  \ \nint bmap(struct m_inode * inode,int block) {\n    return _bmap(inode,block,0);\n\
  }\n\nstatic int _bmap(struct m_inode * inode,int block,int create) {\n    ...\n\
  \    if (block<0)\n        ...\n    if (block >= 7+512+512*512)\n        ...\n \
  \   if (block<7) \n        // zone[0] 到 zone[7] 采用直接索引，可以索引小于 7 的块号\n        ...\n\
  \    if (block<512)\n        // zone[7] 是一次间接索引，可以索引小于 512 的块号\n        ...\n  \
  \  // zone[8] 是二次间接索引，可以索引大于 512 的块号\n}\n```\n\n\n\n\n我们看到整个条件判断的结构是根据 `block` 来划分的。\n\
  \n`block` 就是要读取的块号，之所以要划分，就是因为 `inode` 在记录文件所在块号时，采用了多级索引的方式。\n\n![](img/file322.webp\
  \ \"fig:\")\n\n`zone[0]` 到 `zone[7]` 采用直接索引，`zone[7]` 是一次间接索引，`zone[8]` 是二次间接索引。\n\
  \n那我们刚开始读，块号肯定从零开始，所以我们就先看 `block < 7`，通过直接索引这种最简单的方式读的代码。\n\n```c\n// inode.c\n\
  static int _bmap(struct m_inode * inode,int block,int create) {\n    ...\n    if\
  \ (block < 7) {\n        if (create && !inode->i_zone[block])\n            if (inode->i_zone[block]=new_block(inode->i_dev))\
  \ {\n                inode->i_ctime=CURRENT_TIME;\n                inode->i_dirt=1;\n\
  \            }\n        return inode->i_zone[block];\n    }\n    ...\n}\n```\n\n\
  由于 `create = 0`，也就是并不需要创建一个新的数据块，所以里面的 `if` 分支没了。\n\n```c\n// inode.c\nstatic int\
  \ _bmap(struct m_inode * inode,int block,int create) {\n    ...\n    if (block <\
  \ 7) {\n        ...\n        return inode->i_zone[block];\n    }\n    ...\n}\n```\n\
  \n可以看到，其实 `bmap` 返回的，就是要读入的块号，从全局看在块设备的哪个逻辑块号下。\n\n也就是说，假如我想要读这个文件的第一个块号的数据，该函数返回的是你这个文件的第一个块在整个硬盘中的哪个块中。\n\
  \n### bread：将 bmap 获取的数据块号读入到高速缓冲块\n\n好了，拿到这个数据块号后，回到 `file_read` 函数接着看。\n\n```c\n\
  // file_dev.c\nint file_read(struct m_inode * inode, struct file * filp, char *\
  \ buf, int count) {\n    ...\n    while (left) {\n        if (nr = bmap(inode,(filp->f_pos)/BLOCK_SIZE))\
  \ {\n            if (!(bh=bread(inode->i_dev,nr)))\n    }\n    }\n}\n```\n\n`nr`\
  \ 就是具体的数据块号，作为其中其中一个参数，传入下一个函数 `bread`。\n\n`bread` 这个方法的入参除了数据块号 `block`（就是刚刚传入的\
  \ `nr`）外，还有 `inode` 结构中的 `i_dev`，表示设备号。\n\n```c\n// buffer.c\nstruct buffer_head\
  \ * bread(int dev,int block) {\n    struct buffer_head * bh = getblk(dev,block);\n\
  \    if (bh->b_uptodate)\n        return bh;\n    ll_rw_block(READ,bh);\n    wait_on_buffer(bh);\n\
  \    if (bh->b_uptodate)\n        return bh;\n    brelse(bh);\n    return NULL;\n\
  }\n```\n\n这个 `bread` 方法就是根据一个设备号 `dev` 和一个数据块号 `block`，将这个数据块的数据，从硬盘复制到缓冲区里。\n\n\
  关于缓冲区，已经在 [第 19 回 | 缓冲区初始化 buffer_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500596&idx=1&sn=0df64f9f5133cfe8a259b8ce7b7feaeb&chksm=c2c5b999f5b2308f76095af30e8915f125f18702df9c58be7612b58e4d009c149481)\
  \ 中提到。`getblk` 方法根据设备号 `dev` 和数据块号 `block` 申请到一个缓冲块。简单说，先根据 `hash` 结构快速查找 `dev`\
  \ 和 `block` 是否存在缓冲块。如果没有，那就从之前建立的双向链表的头指针 `free_list` 开始寻找，直到找到一个可用的缓冲块。具体代码逻辑包含当缓冲块正在其他进程使用或者缓冲块对应的数据被修改时的处理，你可以一看关键流程。\n\
  \n```c\n// buffer.c\nstruct buffer_head * bread(int dev,int block) {\n    struct\
  \ buffer_head * bh = getblk(dev,block);\n    ...\n}\n\nstruct buffer_head * getblk(int\
  \ dev,int block) {\n    struct buffer_head * tmp, * bh;\n    repeat:\n    // 先从\
  \ hash 结构中找\n    if (bh = get_hash_table(dev,block))\n        return bh;\n    //\
  \ 如果没有就 free_list 开始找双向链表\n    tmp = free_list;\n    do {\n        if (tmp->b_count)\n\
  \            continue;\n        if (!bh || BAD(tmp)) {\n            bh = tmp;\n\
  \            if (!BAD(tmp))\n                break;\n        }\n    } while ((tmp->b_free)\
  \ != free_list);\n    // 如果还没找到，说明没有缓冲块可用，就阻塞等会\n    if (!bh) {\n        sleep_on(&buffer_wait);\n\
  \        goto repeat;\n    }\n    // 到这里说明申请到了缓冲块，但被其他进程上锁了\n    // 如果上锁了，就等等\n\
  \    wait_on_buffer(bh);\n    if (bh->b_count)\n        goto repeat;\n    // 到这里说明缓冲块申请到，且没有上锁\n\
  \    // 但还得看 dirt 位，也就是有没有被修改\n    // 如果被修改了，就重新从硬盘中读入新数据\n    while (bh->b_dirt)\
  \ {\n        sync_dev(bh->b_dev);\n        wait_on_buffer(bh);\n        if (bh->b_count)\n\
  \            goto repeat;\n    }\n    if (find_buffer(dev,block))\n        goto\
  \ repeat;\n    // 给刚刚获取到的缓冲头 bh 重新赋值并调整在双向链表和 hash 表中的位置\n    bh->b_count=1;\n \
  \   bh->b_dirt=0;\n    bh->b_uptodate=0;\n    remove_from_queues(bh);\n    bh->b_dev=dev;\n\
  \    bh->b_blocknr=block;\n    insert_into_queues(bh);\n    return bh;\n}\n```\n\
  \n\n\n\n```c\n// buffer.c\nstruct buffer_head * bread(int dev,int block) {\n   \
  \ ...\n    ll_rw_block(READ,bh);\n    ...\n}\n\nvoid ll_rw_block (int rw, struct\
  \ buffer_head *bh) {\n    ...\n    make_request(major, rw, bh);\n}\n\nstruct request\
  \ request[NR_REQUEST] = {0};\nstatic void make_request(int major,int rw, struct\
  \ buffer_head * bh) {\n    struct request *req; \n    ...\n    // 从 request 队列找到一个空位\n\
  \    if (rw == READ)\n        req = request+NR_REQUEST;\n    else\n        req =\
  \ request+((NR_REQUEST*2)/3);\n    while (--req >= request)\n        if (req->dev<0)\n\
  \            break;\n    ...\n    // 构造 request 结构\n    req->dev = bh->b_dev;\n\
  \    req->cmd = rw;\n    req->errors=0;\n    req->sector = bh->b_blocknr<<1;\n \
  \   req->nr_sectors = 2;\n    req->buffer = bh->b_data;\n    req->waiting = NULL;\n\
  \    req->bh = bh;\n    req->next = NULL;\n    add_request(major+blk_dev,req);\n\
  }\n\n// ll_rw_blk.c\nstatic void add_request (struct blk_dev_struct *dev, struct\
  \ request *req) {\n    struct request * tmp;\n    req->next = NULL;\n    cli();\n\
  \    // 清空 dirt 位\n    if (req->bh)\n        req->bh->b_dirt = 0;\n    // 当前请求项为空，那么立即执行当前请求项\n\
  \    if (!(tmp = dev->current_request)) {\n        dev->current_request = req;\n\
  \        sti();\n        (dev->request_fn)();\n        return;\n    }\n    // 插入到链表中\n\
  \    for ( ; tmp->next ; tmp=tmp->next)\n        if ((IN_ORDER(tmp,req) ||\n   \
  \         !IN_ORDER(tmp,tmp->next)) &&\n            IN_ORDER(req,tmp->next))\n \
  \           break;\n    req->next=tmp->next;\n    tmp->next=req;\n    sti();\n}\n\
  ```\n\n调用链很长，主线是从 `request` 数组中找到一个空位，然后作为链表项插入到 `request` 链表中。没错 `request` 是一个\
  \ 32 大小的数组，里面的每一个 `request` 结构间通过 `next` 指针相连又形成链表。\n\n如果你熟悉 [第 15 回 | 块设备请求项初始化\
  \ blk_dev_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==...21) 的内容，就会明白这个说法。\n\
  \n`request` 的具体结构如下：\n\n```c\n// blk.h\nstruct request {\n    int dev;        /*\
  \ -1 no request */\n    int cmd;        /* READ or WRITE */\n    int errors;\n \
  \   unsigned long sector;\n    unsigned long nr_sectors;\n    char * buffer;\n \
  \   struct task_struct * waiting;\n    struct buffer_head * bh;\n    struct request\
  \ * next;\n};\n```\n\n表示一个读盘的请求。有了这些参数，底层拿到这个结构之后就知道怎么样访问硬盘了。那是谁不断从 `request` 队列取出\
  \ `request` 结构并对硬盘发起请求呢？这里 Linux 有很巧妙的设计，我们看看 `add_request` 方法：\n\n```c\n// blk.h\n\
  struct blk_dev_struct {\n    void (*request_fn)(void);\n    struct request * current_request;\n\
  };\n\n// ll_rw_blk.c\nstruct blk_dev_struct blk_dev[NR_BLK_DEV] = {\n    { NULL,\
  \ NULL },     /* no_dev */\n    { NULL, NULL },     /* mem */\n    { NULL, NULL\
  \ },     /* fd */\n    { NULL, NULL },     /* hd */\n    { NULL, NULL },     /*\
  \ tty */\n    { NULL, NULL },     /* tty */\n    { NULL, NULL }      /* lp */\n\
  };\n\nstatic void make_request(int major,int rw, struct buffer_head * bh) {\n  \
  \  ...\n    add_request(major+blk_dev,req);\n}\n\nstatic void add_request (struct\
  \ blk_dev_struct *dev, struct request *req) {\n    ...\n    // 当前请求项为空，那么立即执行当前请求项\n\
  \    if (!(tmp = dev->current_request)) {\n        ...\n        (dev->request_fn)();\n\
  \        ...\n    }\n    ...\n}\n```\n\n就是当设备的当前请求项为空，也就是第一次收到硬盘请求时，会立即执行该设备的 `request_fn`\
  \ 方法，这便是整个读盘循环的最初推手。当前设备的设备号是 3，也就是硬盘，会从 `blk_dev` 数组中取索引下标为 3 的设备结构。\n\n在 [第 20\
  \ 回 | 硬盘初始化 hd_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==21) 的时候，设备号为\
  \ 3 的设备结构的 `request_fn` 被赋值为硬盘请求函数 `do_hd_request` 了。\n\n```c\n// hd.c\nvoid hd_init(void)\
  \ {\n    blk_dev[3].request_fn = do_hd_request;\n    ...\n}\n```\n\n所以，刚刚 `request_fn`\
  \ 后面的执行函数就是 `do_hd_request`。\n\n```c\n// hd.c\n#define CURRENT (blk_dev[MAJOR_NR].current_request)\n\
  void do_hd_request(void) {\n    ...\n    unsigned int dev = MINOR(CURRENT->dev);\n\
  \    unsigned int block = CURRENT->sector;\n    ...\n    nsect = CURRENT->nr_sectors;\n\
  \    ...\n    if (CURRENT->cmd == WRITE) {\n        hd_out(dev,nsect,head,cyl,write_intr);\n\
  \        ...\n    } else if (CURRENT->cmd == READ) {\n        hd_out(dev,nsect,head,cyl,read_intr);\n\
  \    } else\n        panic(\"unknown hd-command\");\n}\n```\n\n起始扇号对应硬盘的磁头 `head`、柱面\
  \ `cyl`、扇号 `sec` 等信息的代码。可以看到最终根据当前请求是 `WRITE` 还是 `READ`，在调用 `hd_out` 时传入不同的参数。`hd_out`\
  \ 就是读硬盘的最底层的函数。\n\n```c\n// hd.c\nstatic void hd_out(unsigned int drive,unsigned\
  \ int nsect,unsigned int sect,\n    unsigned int head, unsigned int cyl,\n    void\
  \ (*intr_addr)(void)) {\n    ...\n    do_hd = intr_addr;\n    outb_p(hd_info[drive].ctl,HD_CMD);\n\
  \    port=HD_DATA;\n    outb_p(hd_info[drive].wp>>2,++port);\n    outb_p(nsect,++port);\n\
  \    outb_p(sect,++port);\n    outb_p(cyl,++port);\n    outb_p(cyl>>8,++port);\n\
  \    outb_p(0xA0|(drive<<4)|head,++port);\n    outb(cmd,++port);\n}\n```\n\n可以看到，最底层的读盘请求，其实就是向一堆外设端口读写操作。这个函数实际上在\
  \ [第 17 回 | 时间初始化 time_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==21)\
  \ 为了讲解与 CMOS 外设交互方式的时候讲过了，简单说硬盘的端口表是这样的：\n\n| 端口 | 读 | 写 |\n| --- | --- | --- |\n\
  | 0x1F0 | 数据寄存器 | 数据寄存器 |\n| 0x1F1 | 错误寄存器 | 特征寄存器 |\n| 0x1F2 | 扇区计数寄存器 | 扇区计数寄存器\
  \ |\n| 0x1F3 | 扇区号或 LBA 块地址 0~7 | 扇区号或 LBA 块地址 0~7 |\n| 0x1F4 | 磁道数低 8 位或 LBA 块地址\
  \ 8~15 | 磁道数低 8 位或 LBA 块地址 8~15 |\n| 0x1F5 | 磁道数高 8 位或 LBA 块地址 16~23 | 磁道数高 8 位或\
  \ LBA 块地址 16~23 |\n| 0x1F6 | 驱动器/磁头或 LBA 块地址 24~27 | 驱动器/磁头或 LBA 块地址 24~27 |\n|\
  \ 0x1F7 | 命令寄存器 | 状态寄存器 |\n\n\n\n\n\n```\n[](#cb379-1)// system_call.s\n[](#cb379-2)_hd_interrupt:\n\
  [](#cb379-3)    ...\n[](#cb379-4)    xchgl _do_hd,%edx\n[](#cb379-5)    ...\n[](#cb379-6)\
  \    call *%edx\n[](#cb379-7)    ...\n[](#cb379-8)    iret\n```\n\n这个方法主要是调用 `do_hd`\
  \ 方法，这个方法是一个指针，就是高级语言里所谓的接口，读操作的时候，将会指向 `read_intr` 这个具体实现。\n\n```\n[](#cb380-1)//\
  \ hd.c\n[](#cb380-2)void do_hd_request(void) {\n[](#cb380-3)    ...\n[](#cb380-4)\
  \    } else if (CURRENT->cmd == READ) {\n[](#cb380-5)        hd_out(dev,nsect,sec,head,cyl,WIN_READ,&read_intr);\n\
  [](#cb380-6)    }\n[](#cb380-7)    ...\n[](#cb380-8)}\n[](#cb380-9)\n[](#cb380-10)static\
  \ void hd_out(..., void (*intr_addr)(void)) {\n[](#cb380-11)    ...\n[](#cb380-12)\
  \    do_hd = intr_addr;\n[](#cb380-13)    ...\n[](#cb380-14)}\n```\n\n看，一切都有联系的。\n\
  \n我们展开 `read_intr` 方法继续看。\n\n```\n[](#cb381-1)// hd.c\n[](#cb381-2)#define port_read(port,buf,nr)\
  \  \\\n[](#cb381-3)__asm__(\"cld;rep;insw\"::\"d\"  (port),\"D\"  (buf),\"c\"  (nr):\"\
  cx\",\"di\")\n[](#cb381-4)\n[](#cb381-5)static void read_intr(void) {\n[](#cb381-6)\
  \    ...\n[](#cb381-7)    // 从数据端口读出数据到内存\n[](#cb381-8)    port_read(HD_DATA,CURRENT->buffer,256);\n\
  [](#cb381-9)    CURRENT->errors = 0;\n[](#cb381-10)    CURRENT->buffer += 512;\n\
  [](#cb381-11)    CURRENT->sector++;\n[](#cb381-12)    // 还没有读完，则直接返回等待下次\n[](#cb381-13)\
  \    if (--CURRENT->nr_sectors) {\n[](#cb381-14)        do_hd = &read_intr;\n[](#cb381-15)\
  \        return;\n[](#cb381-16)    }\n[](#cb381-17)    // 所有扇区都读完了\n[](#cb381-18)\
  \    // 删除本次都请求项\n[](#cb381-19)    end_request(1);\n[](#cb381-20)    // 再次触发硬盘操作\n\
  [](#cb381-21)    do_hd_request();\n[](#cb381-22)}\n```\n\n这里使用了 `port_read` 宏定义的方法，从端口\
  \ `HD_DATA` 中读 256 次数据，每次读一个字，总共就是 512 字节的数据。\n\n如果没有读完发起读盘请求时所要求的字节数，那么直接返回，等待下次硬盘触发中断并执行到\
  \ `read_intr` 即可。\n\n如果已经读完了，就调用 `end_request` 方法将请求项清除掉，然后再次调用 `do_hd_request`\
  \ 方法循环往复。\n\n那重点就在于，如何结束掉本次请求的 `end_request` 方法。\n\n```\n[](#cb382-1)// blk.h\n\
  [](#cb382-2)#define CURRENT (blk_dev[MAJOR_NR].current_request)\n[](#cb382-3)\n\
  [](#cb382-4)extern inline void end_request(int uptodate) {\n[](#cb382-5)    DEVICE_OFF(CURRENT->dev);\n\
  [](#cb382-6)    if (CURRENT->bh) {\n[](#cb382-7)        CURRENT->bh->b_uptodate\
  \ = uptodate;\n[](#cb382-8)        unlock_buffer(CURRENT->bh);\n[](#cb382-9)   \
  \ }\n[](#cb382-10)    ...\n[](#cb382-11)    wake_up(&CURRENT->waiting);\n[](#cb382-12)\
  \    wake_up(&wait_for_request);\n[](#cb382-13)    CURRENT->dev = -1;\n[](#cb382-14)\
  \    CURRENT = CURRENT->next;\n[](#cb382-15)}\n```\n\n两个 `wake_up` 方法。\n\n第一个唤醒了该请求项所对应的\
  \ `CURRENT->waiting` 队列。\n\n另一个唤醒了 `wait_for_request` 队列。\n\n将 `CURRENT->dev` 置为\
  \ -1，并将 `CURRENT` 指向下一个请求项。\n\n\n\n\n\n```\n[](#cb388-1)// signal.h\n[](#cb388-2)#define\
  \ SIGHUP 1  /* 挂起 */\n[](#cb388-3)#define SIGINT 2  /* 中断 */\n[](#cb388-4)#define\
  \ SIGQUIT 3  /* 退出 */\n[](#cb388-5)#define SIGILL 4  /* 非法指令（捕获时不重置） */\n[](#cb388-6)#define\
  \ SIGTRAP 5  /* 跟踪陷阱（捕获时不重置） */\n[](#cb388-7)#define SIGABRT 6  /*  abort() */\n\
  [](#cb388-8)#define SIGPOLL 7  /* 可轮询事件 ([XSR] 生成，不支持) */\n[](#cb388-9)#define SIGIOT\
  \  SIGABRT /* 兼容性 */\n[](#cb388-10)#define SIGEMT 7  /* EMT 指令 */\n[](#cb388-11)#define\
  \ SIGFPE 8  /* 浮点异常 */\n[](#cb388-12)#define SIGKILL 9  /* kill（无法捕获或忽略） */\n[](#cb388-13)#define\
  \ SIGBUS 10  /* 总线错误 */\n[](#cb388-14)#define SIGSEGV 11  /* 段违规 */\n[](#cb388-15)#define\
  \ SIGSYS 12  /* 系统调用参数非法 */\n[](#cb388-16)#define SIGPIPE 13  /* 向无读者的管道写入 */\n\
  [](#cb388-17)#define SIGALRM 14  /* 闹钟 */\n[](#cb388-18)#define SIGTERM 15  /* 来自\
  \ kill 的软件终止信号 */\n[](#cb388-19)#define SIGURG 16  /* I/O 通道上的紧急情况 */\n[](#cb388-20)#define\
  \ SIGSTOP 17  /* 非来自 tty 的可发送停止信号 */\n[](#cb388-21)#define SIGTSTP 18  /* 来自 tty\
  \ 的停止信号 */\n[](#cb388-22)#define SIGCONT 19  /* 继续停止的进程 */\n[](#cb388-23)#define\
  \ SIGCHLD 20  /* 子进程停止或退出时通知父进程 */\n[](#cb388-24)#define SIGTTIN 21  /*后台 tty 读取时向读者进程组发送\
  \ */\n[](#cb388-25)#define SIGTTOU 22  /* 输出时类似 TTIN（如果 (tp->t_local&LTOSTOP)） */\n\
  [](#cb388-26)#define SIGIO 23  /* 输入/输出可能的信号 */\n[](#cb388-27)#define SIGXCPU 24\
  \  /* 超过 CPU 时间限制 */\n[](#cb388-28)#define SIGXFSZ 25  /* 超过文件大小限制 */\n[](#cb388-29)#define\
  \ SIGVTALRM 26  /* 虚拟时间闹钟 */\n[](#cb388-30)#define SIGPROF 27  /* 性能时间闹钟 */\n[](#cb388-31)#define\
  \ SIGWINCH 28  /* 窗口大小变化 */\n[](#cb388-32)#define SIGINFO 29  /* 信息请求 */\n[](#cb388-33)#define\
  \ SIGUSR1 30  /* 用户定义信号 1 */\n[](#cb388-34)#define SIGUSR2 31  /* 用户定义信号 2 */\n\
  ```\n\n这里我把所有 Linux 0.11 支持的信号都放在这了，有我们熟悉的按下 `CTRL+C` 时的信号 `SIGINT`，有我们通常杀死进程时 `kill\
  \ -9` 的信号 `SIGKILL`，还有 core dump 内存访问出错时经常遇到的 `SIGSEGV`。\n\n在现代 Linux 操作系统中，你输入个\
  \ `kill -l` 便可知道你所在的系统所支持的信号，下面是我购买的一台腾讯云主机上的结果。\n\n![](img/file332.webp \"fig:\"\
  )\n\nOK，这么几句话，我就说完了信号的本质，以及信号的种类。\n\n现在这个进程的 `tast_struct` 结构中的 `signal` 就有了对应信号位的值，那么在下次时钟中断到来时，便会通过\
  \ `timer_interrupt` 这个时钟中断处理函数，一路调用到 `do_signal` 方法。\n\n```\n// kernel/signal.c\n\
  void do_signal (long signr ...) {\n    ...\n    struct sigaction *sa = current->sigaction\
  \ + signr - 1;\n    sa_handler = (unsigned long) sa->sa_handler;\n    // 如果信号处理函数为空，则直接退出\n\
  \    if (!sa_handler) {\n        ...\n        do_exit (1 << (signr - 1));\n    \
  \    ...\n    }\n    // 否则就跳转到信号处理函数的地方运行\n    *(&eip) = sa_handler;\n    ...\n\
  ```\n\n时钟中断和进程调度的流程，你可以看 [第 24 回 从定时器答来看调度](https://mp.weixin.com/s?biz=Mzk0MjE30NDE==mid=2247501609&idx=1&sn=fe5bd9f69045fd706d7aea273bc&scene=21)。我们可以看到，进入\
  \ `do_signal` 函数后，如果当前信号 `signr` 对应的信号处理函数 `sa_handler` 为空，就直接调用 `do_exit` 函数，也就是我们按下\
  \ `CTRL+C` 之后退出的样子。\n\n但是，如果信号处理函数不为空，那么将 `sa_handler` 赋值给 `eip` 寄存器，也就是指令寄存器的方式，跳转到相应处理函数处。\n\
  \n怎么验证这一点？很简单，信号处理函数注册在每个进程 `task_struct` 中的 `sigaction` 数组中。\n\n```\n// signal.h\n\
  struct sigaction {\n    union __sigaction_u __sigaction_u;  /* 信号处理器 */\n    sigset_t\
  \ sa_mask;               /* 应用的信号屏蔽 */\n    int     sa_flags;               /* 见下文\
  \ */\n};\n/* 用于信号处理器的联合体 */\nunion __sigaction_u {\n    void    (*sa_handler)(int);\n\
  \    void    (*sa_sigaction)(int, struct siginfo *, void *);\n};\n// sched.h\nstruct\
  \ task_struct {\n    ...\n    struct sigaction sigaction[32];\n    ...\n};\n```\n\
  \n没错，只需要给 `sigaction` 对应位置填写上信号处理函数。那么如何注册信号处理函数呢？调用 `signal` 这个库函数即可。我们可以写一个小程序。\n\
  \n```c\n#include <stdio.h>\n#include <signal.h>\n\nvoid int_handler(int signal_num)\
  \ {\n    printf(\"signal receive %d\\n\", signal_num);\n}\n\nint main(int argc,\
  \ char ** argv) {\n    signal(SIGINT, int_handler);\n    for(;;)\n        pause();\n\
  \    return 0;\n}\n```\n\n这是个死循环的 `main` 函数，只不过，通过 `signal` 注册了 `SIGINT` 的信号处理函数，里面做的事情是打印一下信号值。\n\
  \n编译并运行它，我们会发现在按下 `CTRL+C` 之后程序退出，而是输出了我们 `printf` 的话。\n\n![](img/file333.webp \"\
  fig:\")\n\n我们多次按 `CTRL+C`，这个程序仍然退出，会一直输出上面的话。\n\n![](img/file334.webp \"fig:\")\n\
  \n这就做到了亲手捕获 `SIGINT` 这个信号。但这个程序有点不友好，永远无法 `CTRL+C` 结束了，我们优化一下代码，让第一次按下 `CTRL+C`\
  \ 后的信号处理函数，把 `SIGINT` 的处理函数重新置空。\n\n```c\n#include <stdio.h>\n#include <signal.h>\n\
  \nvoid int_handler(int signal_num) {\n    printf(\"signal receive %d\\n\", signal_num);\n\
  \    signal(SIGINT, NULL);\n}\n\nint main(int argc, char ** argv) {\n    signal(SIGINT,\
  \ int_handler);\n    for(;;)\n        pause();\n    return 0;\n}\n```\n\n我们发现，这次按下第二次\
  \ `CTRL+C` 程序就会退出了，这也间接证明了，当没有为 `SIGINT` 注册信号处理函数时，程序接收到 `CTRL+C` 的 `SIGINT`。\n\n"
