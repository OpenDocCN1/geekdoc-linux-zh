  \ = 4*1024*1024;\n    else if (memory_end > 6*1024*1024)\n        buffer_memory_end\
  \ = 2*1024*1024;\n    else\n        buffer_memory_end = 1*1024*1024;\n    main_memory_start\
  \ = buffer_memory_end;\n    ...\n}\n```\n\nIncluding the root device `ROOT_DEV`,\
  \ the device parameters `drive_info` obtained from assembly, and the calculated\
  \ memory boundaries `main_memory_start` and `buffer_memory_end`. Where are these\
  \ parameters obtained? If you read the front, you must remember this table—it is\
  \ all provided by `setup.s` calling BIOS interrupts to get device information, stored\
  \ at the agreed address `0x90000`. I won't elaborate on it here.\n\n| Memory Address\
  \ | Length (bytes) | Name |\n| :--- | :--- | :--- |\n| 0x90000 | 2 | Cursor position\
  \ |\n| 0x90002 | 2 | Extended memory count |\n| 0x90004 | 2 | Display pages |\n\
  | 0x90006 | 1 | Display mode |\n| 0x90007 | 1 | Character columns |\n| 0x90008 |\
  \ 2 | Unknown |\n| 0x9000A | 1 | Display memory |\n| 0x9000B | 1 | Display status\
  \ |\n| 0x9000C | 2 | Graphics features |\n| 0x9000E | 1 | Screen rows |\n| 0x9000F\
  \ | 1 | Screen columns |\n| 0x0080 | 16 | Disk 1 table |\n| 0x0090 | 16 | Disk 2\
  \ table |\n| 0x01FC | 2 | Root device ID |\n\nThe second part consists of various\
  \ `init` operations:\n\n```c\nvoid main(void) {\n    ...\n    mem_init(main_memory_start,memory_end);\n\
  \    trap_init();\n    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n \
  \   time_init();\n    sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\n\
  \    floppy_init();\n    ...\n}\n```\n\nIncluding memory initialization `mem_init`,\
  \ interrupt initialization `trap_init`, process scheduling initialization `sched_init`,\
  \ etc. We know that when learning an OS, it is actually divided into these blocks;\
  \ it seems it is also divided this way in the OS itself. We will savor the source\
  \ code slowly later. Right.\n\nThe third part is switching to user mode and performing\
  \ a final `init` in a new process.\n\n```c\nvoid main(void) {\n    ...\n    sti();\n\
  \    move_to_user_mode();\n    if (!fork()) {\n        init();\n    }\n    ...\n\
  }\n```\n\nThis `init` function creates a process, sets up terminal standard I/O,\
  \ and then creates another process to execute the `shell` for user commands. At\
  \ this point, the familiar screen actually appears (below is the screen when `bochs`\
  \ starts Linux).\n\n![image](img/89.webp)\n\n\n\n```c\nvoid main(void) {\n    ROOT_DEV\
  \ = ORIG_ROOT_DEV;\n    drive_info = DRIVE_INFO;\n    memory_end = (1<<20) + (EXT_MEM_K<<10);\n\
  \    memory_end &= 0xfffff000;\n    if (memory_end > 16*1024*1024)\n        memory_end\
  \ = 16*1024*1024;\n    if (memory_end > 12*1024*1024) \n        buffer_memory_end\
  \ = 4*1024*1024;\n    else if (memory_end > 6*1024*1024)\n        buffer_memory_end\
  \ = 2*1024*1024;\n    else\n        buffer_memory_end = 1*1024*1024;\n    main_memory_start\
  \ = buffer_memory_end;\n\n    mem_init(main_memory_start,memory_end);\n    trap_init();\n\
  \    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n    time_init();\n \
  \   sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n\
  \n    sti();\n    move_to_user_mode();\n    if (!fork()) {      /* we count on this\
  \ going ok */\n        init();\n    }\n\n    for(;;) pause();\n}\n```\n\n我们今天就看这第一小段。\n\
  \n首先，`ROOT_DEV` 为系统的根文件设备号，`drive_info` 为之前 `setup.s` 程序获取并存储在内存 `0x90000` 处的设备信息，我们先不管这俩，等之后用到了再说。\n\
  \n我们看后面这一坨很影响整体画风的一段代码。\n\n```c\nvoid main(void) {\n    ...\n    memory_end = (1<<20)\
  \ + (EXT_MEM_K<<10);\n    memory_end &= 0xfffff000;\n    if (memory_end > 16*1024*1024)\n\
  \        memory_end = 16*1024*1024;\n    if (memory_end > 12*1024*1024) \n     \
  \   buffer_memory_end = 4*1024*1024;\n    else if (memory_end > 6*1024*1024)\n \
  \       buffer_memory_end = 2*1024*1024;\n    else\n        buffer_memory_end =\
  \ 1*1024*1024;\n    main_memory_start = buffer_memory_end;\n    ...\n```\n\n这一坨代码和后面规整的\
  \ `xxx_init` 位置的位置，要是这么写代码，肯定被老板鄙视了。但 Linus 写的就是经典，学完事了。\n\n这一坨代码虽然乱，但仔细看就知道它为了计算三个变量。\n\
  \n`main_memory_start`\n\n`memory_end`\n\n`buffer_memory_end`\n\n而观察最后一行发现，其实两个变量是相等的，所以仅仅计算出了两个变量。\n\
  \n`main_memory_start`\n\n`memory_end`\n\n然后再具体分析这个逻辑，其实就是一堆 `if...else` 判断而已，判断都是\
  \ `memory_end` 也就是内存最大值，而这个最大值由第一行可以看出，等于 `1M + 扩展内存大小`。那 ok 了，其实只是不同的内存设置不同的边界值，为了理解它，我们完全没必要考虑这么全，就假设内存一共\
  \ 8M 大小吧。如果内存为 8M 大小，`memory_end` 就是 `8*1024*1024`，也就只会倒数第二个分支，那么 `buffer_memory_end`\
  \ 就为 `2*1024*1024`，那么 `main_memory_start` 也为 `2*1024*1024`。那这些值有什么用？一张图就明白了。你看，其实就是定了三个箭头指向的地址的三个边界变量。具体主内存区是如何管理和分配的，要看下面代码。\n\
  \n```c\nvoid main(void) {\n    ...\n    mem_init(main_memory_start, memory_end);\n\
  \    ...\n}\n```\n\n而缓冲区是如何管理和分配的，就要看：\n\n```c\nvoid main(void) {\n    ...\n   \
  \ buffer_init(buffer_memory_end);\n    ...\n}\n```\n\n是如何折腾的。那我们今天就不背这两个，仅仅知道这三个参数的计算以及后面是什么就好了，很轻松？后面再讲如何利用这三个参数来实现内存的管理，之后分解。\n\
  \n## 主内存初始化 `mem_init`\n\n原文链接：[`mp.weixin.com/s/_rTmjCV9ifoB3g`](https://mp.weixin.com/s/_rTmjCV9ifoB3g)\n\
  \n今天我们不聊具体内存管理的算法，我们就来看看操作系统是如何管理内存的。以源码为例，发现进入 `main` 函数后不久有这样的代码：\n\n```c\nvoid\
  \ main(void) {\n    ...\n    memory_end = (1<<20) + (EXT_MEM_K<<10);\n    memory_end\
  \ &= 0xfffff000;\n    if (memory_end > 16*1024*1024)\n        memory_end = 16*1024*1024;\n\
  \    if (memory_end > 12*1024*1024) \n        buffer_memory_end = 4*1024*1024;\n\
  \    else if (memory_end > 6*1024*1024)\n        buffer_memory_end = 2*1024*1024;\n\
  \    else\n        buffer_memory_end = 1*1024*1024;\n    main_memory_start = buffer_memory_end;\n\
  \    mem_init(main_memory_start,memory_end);\n    ...\n}\n```\n\n除了最后一行，前面的那一大坨的作用很简单。其实只是针对不同的内存大小设置不同的边界值。为了理解它，我们完全没必要考虑这么全，就假设总内存一共\
  \ 8M 大小吧。如果内存为 8M，`memory_end` 就是 `8*1024*1024`，也就只会倒数第二个分支，那么 `buffer_memory_end`\
  \ 就为 `2*1024*1024`，那么 `main_memory_start` 也为 `2*1024*1024`。你仔细看看代码逻辑，看是不是这样？当然，你不愿意细想也没关系，上述代码执行后就是如下效果。你看，其实就是定了三个箭头指向的地址的三个边界变量。具体主内存区是如何管理和分配的，要看\
  \ `mem_init` 里做了什么：\n\n```c\nvoid main(void) {\n    ...\n    mem_init(main_memory_start,\
  \ memory_end);\n    ...\n}\n```\n\n而缓冲区是如何管理和分配的，就要看 `buffer_init` 里干了什么：\n\n```c\n\
  void main(void) {\n    ...\n    buffer_init(buffer_memory_end);\n    ...\n}\n```\n\
  \n不过我们今天只看主内存是如何管理的，很简单，放轻松。进入 `mem_init` 函数：\n\n```c\n#define LOW_MEM 0x10000 //\
  \ 0x10000（十六进制）\n#define PAGE_SIZE 4096\n#define NUM_PAGES ((end - LOW_MEM) / PAGE_SIZE)\n\
  \nvoid mem_init(int start, int end) {\n    int i;\n    for (i = 0; i < NUM_PAGES;\
  \ i++) {\n        if (i * PAGE_SIZE + LOW_MEM < start) {\n            // skip\n\
  \        } else {\n            mem_map[i] = 1; // mark as used\n        }\n    }\n\
  }\n```\n*(注：由于原文未提供 `mem_init` 具体实现，此处根据上下文逻辑补全以示意)*\n\n\n\n\n\n```c\nunsigned long\
  \ get_free_page(void) {\n    register unsigned long __res asm(\"ax\");\n    __asm__(\n\
  \        \"std ; repne ; scasb\\n\\t\"\n        \"jne 1f\\n\\t\"\n        \"movb\
  \ $1,1(%%edi)\\n\\t\"\n        \"sall $12,%%ecx\\n\\t\"\n        \"addl %2,%%ecx\\\
  n\\t\"\n        \"movl %%ecx,%%edx\\n\\t\"\n        \"movl $1024,%%ecx\\n\\t\"\n\
  \        \"leal 4092(%%edx),%%edi\\n\\t\"\n        \"rep ; stosl\\n\\t\"\n     \
  \   \"movl %%edx,%%eax\\n\"\n        \"1:\"\n        :\"=a\" (__res)\n        :\"\
  0\" (0),\"i\" (LOW_MEM),\"c\" (PAGING_PAGES),\n        \"D\" (mem_map + PAGING_PAGES-1)\n\
  \        :\"di\",\"cx\",\"dx\");\n    return __res;\n}\n```\n\n就是选择 `mem_map` 中首个空闲页面，并标记为已使用。\n\
  \n好了，本讲就这么多，只是填写了一张大表而已，简单吧？之后的内存申请与释放等骚操作，统统是跟着张大表 `mem_map` 打交道而已，你一定要记住它哦。\n\n\
