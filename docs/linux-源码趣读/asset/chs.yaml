  \n当然不是，那我们今天就打开这个 `time_init` 函数一探究竟。\n\n打开这个函数后我又是很开心，因为很短，且没有更深入的方法调用。\n\n```\n\
  #define CMOS_READ(addr)  ({  \\\n    outb_p(0x80|addr,0x70);  \\\n    inb_p(0x71);\
  \  \\\n})\n#define BCD_TO_BIN(val)  ((val)=((val)&15)  +  ((val)>>4)*10)\n\nstatic\
  \ void time_init(void) {\n    struct tm time;\n    do {\n        time.tm_sec = CMOS_READ(0);\n\
