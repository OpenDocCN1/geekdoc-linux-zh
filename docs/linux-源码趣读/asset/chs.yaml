  struct drive_info { char dummy[32]; } drive_info;\n// drive_info = *(struct drive_info\
  \ *)0x0080;\nvoid init(void) {\n    setup((void *) &drive_info);\n    ...\n}\n```\n\
  \n先看入参。`drive_info` 是来自内存 `0x0080` 的数据，这部分是由之前[进入模式前的最后一次折腾内存](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247499558&idx=1&sn=d5057fae2fb83d38f8204c269463&chksm=c2c558bf5b209de5c31dd34fbe76f6c6da17f544518a75fc183ada)\
  \ 讲的 `setup.s` 程序将硬盘 1 的参数放在这里，包括柱面数、磁头数、扇区数等信息。\n\n`setup` 是个系统调用，会通过中断调用到 `sys_setup`\
  \ 函数。关于系统调用的原理，我们不再赘述。\n\n\n\n\n\n# File System Loading and Structure Parsing\n\n\
  Continuing from the last session, we mentioned that after all the hustle in the\
  \ `setup` function, the root file system is loaded, allowing us to find all files\
  \ through the root `inode`, laying the foundation for subsequent work.\n\n## The\
  \ Role of the `setup` function\n\nThe things inside the `setup` method are the first\
  \ methods executed by process `0`.\n\n```c\nint setup(void *) {\n    ...\n    mount_root();\n\
  }\n```\n\n## Details of the `mount_root` function\n\n`mount_root` literally translates\
  \ to \"loading the root.\" In other words, it loads the file system. With it, the\
  \ operating system can find files stored on the disk starting from the root. It\
  \ is the cornerstone of the file system and is very important.\n\nLet's take a look\
  \ at the specific implementation of `mount_root`:\n\n```c\nvoid mount_root(void)\
  \ {\n    int i, free;\n    struct super_block *p;\n    struct m_inode *mi;\n   \
  \ for (i = 0; i < 64; i++) {\n        file_table[i].f_count = 0;\n    }\n    for\
  \ (p = &super_block[0]; p < &super_block[8]; p++) {\n        p->s_dev = 0;\n   \
  \     p->s_lock = 0;\n        p->s_wait = NULL;\n    }\n    p = read_super(0);\n\
  \    mi = iget(0, 1);\n    mi->i_count += 3;\n    p->s_imount = mi;\n    current->pwd\
  \ = mi;\n    current->root = mi;\n    free = 0;\n    i = p->s_nzones;\n    while\
  \ (--i >= 0) {\n        if (!set_bit(i & 8191, p->s_zmap[i >> 13]->b_data)) {\n\
  \            free++;\n        }\n    }\n    free = 0;\n    i = p->s_ninodes + 1;\n\
  \    while (--i >= 0) {\n        if (!set_bit(i & 8191, p->s_imap[i >> 13]->b_data))\
  \ {\n            free++;\n        }\n    }\n}\n```\n\nIt's simple. Overall, it interprets\
  \ the data on the disk into the file system format and loads it into the data structures\
  \ designed in memory. This way, the operating system can access individual files\
  \ on the disk via the file system method using the data in memory.\n\n![fig]\n\n\
  Actually, you only need to understand two things:\n1. What is the format of the\
  \ file system on the disk?\n2. What data structures are used for the file system\
  \ in memory?\n\n## File System Format on Disk\n\nFirst, the file system on the disk\
  \ is simply a collection of data on the disk, which we parse according to a certain\
  \ format. The file system in Linux is the `MINIX` file system, and it looks like\
  \ this.\n\n![fig]\n\nThe size of each block structure is 1024 bytes, which is `1KB`.\
  \ The data on the disk is properly arranged according to this structure.\n\nBut\
  \ why is this information present on the disk? This is a \"chicken and egg\" problem.\
  \ You can write an operating system first, then format a disk with a certain type\
  \ of file system; that way, you get a disk with a file system. With this disk, your\
  \ operating system can boot successfully. In short, just find a way to write data\
  \ to this disk.\n\n## MINIX File System Format Description\n\nNow, let's take a\
  \ quick look at the format of the `MINIX` file system.\n\n- **Boot Block**: The\
  \ boot area mentioned at the very beginning of our series. Of course, not all disks\
  \ have a boot area, but we still must reserve this position to maintain consistency\
  \ in the format.\n- **Superblock**: Used to describe the overall information of\
  \ the entire file system. Looking at its fields, it contains information such as\
  \ the number of subsequent `inodes`, number of blocks, where the first block is\
  \ located, etc. With it, the layout of the entire disk becomes clear.\n- **Inode\
  \ Bitmap and Block Bitmap**: The basic operations and functions of bitmaps represent\
  \ the usage of `inodes` and blocks later, which is similar to the memory usage bitmap\
  \ `mem_map[]` we discussed before.\n- **inode**: Further along, `inode` stores the\
  \ metadata and index information for each file or directory. Metadata includes file\
  \ type, file size, modification time, etc.; index information is the `i_zone[9]`\
  \ block array of size 9, representing which blocks the specific data of this file\
  \ or directory occupies.\n\nAmong the block array, `0~6` represents direct indexing,\
  \ `7` represents single indirect indexing, and `8` represents double indirect indexing.\
  \ When a file is small, for example, if it only occupies 2 blocks, only `zone[0]`\
  \ and `zone[1]` direct indexes are needed.\n\n![fig]\n\nFurther back are the **blocks**\
  \ that store the actual information of specific files or directories. If an `inode`\
  \ of a normal file type points to a block, it contains binary information; if an\
  \ `inode` of a directory type points to a block, it stores indices of files and\
  \ directories under that directory, as well as file names.\n\n## Data Structures\
  \ of File System in Memory\n\nThe basic idea for fully understanding the context\
  \ of an `ext` file system is the same. Start from the code to see how this formatted\
  \ data on disk is loaded.\n\n```c\nstruct file {\n    unsigned short f_mode;\n \
  \   unsigned short f_flags;\n    unsigned short f_count;\n    struct m_inode *f_inode;\n\
  \    off_t f_pos;\n};\n\nvoid mount_root(void) {\n    for (i = 0; i < 64; i++) {\n\
  \        file_table[i].f_count = 0;\n    }\n}\n```\n\nThe `64` entries in `file_table`\
  \ have `f_count` set to 0.\n\n`file_table` refers to the file used by the process.\
  \ `f_count` is the number of times the file is referenced. The `inode` field in\
  \ the `file_table` finds the `inode` information. `inode` information includes as\
  \ follows:\n\n```bash\necho \"hello\" > 0\n```\n\nThe `0` file descriptor is which\
  \ file. Where is the `inode`? The `inode` information includes the file type, size,\
  \ and block number.\n\n```c\nstruct super_block[8];\nvoid mount_root(void) {\n \
  \   ...\n    struct super_block *p;\n    for (p = &super_block[0]; p < &super_block[8];\
  \ p++) {\n        p->s_dev = 0;\n        p->s_lock = 0;\n        p->s_wait = NULL;\n\
  \    }\n    ...\n}\n```\n\nAnother `super_block` array for clearing. The significance\
  \ of `super_block` is that when the operating system reads/writes the device as\
  \ files, it needs the device's superblock here.\n\n![fig]\n\nThrough this superblock,\
  \ one can control the global file system of the device. The next operation is to\
  \ read the disk's superblock information into memory.\n\n```c\nvoid mount_root(void)\
  \ {\n    ...\n    p = read_super(0);\n    ...\n}\n```\n\n`read_super` reads the\
  \ superblock on the disk. Next, read the `inode` information.\n\n```c\nstruct m_inode\
  \ * mi;\nvoid mount_root(void) {\n    ...\n    mi = iget(0, 1);\n    ...\n}\n```\n\
  \nThen set this `inode` as the current process's (which is process `1`) working\
  \ directory and root directory.\n\n```c\nvoid mount_root(void) {\n    ...\n    current->pwd\
  \ = mi;\n    current->root = mi;\n    ...\n}\n```\n\nRecord the block bitmap information:\n\
  \n```c\nvoid mount_root(void) {\n    ...\n    i = p->s_nzones;\n    while (--i >=\
  \ 0)\n        set_bit(i & 8191, p->s_zmap[i >> 13]->b_data);\n    ...\n}\n```\n\n\
  Finally, record the `inode` bitmap information:\n\n```c\nvoid mount_root(void) {\n\
  \    ...\n    i = p->s_ninodes + 1;\n    while (--i >= 0)\n        set_bit(i & 8191,\
  \ p->s_imap[i >> 13]->b_data);\n}\n```\n\n\n\n\n我们接下来的焦点就在这个 `open` 函数，以及它要打开的文件\
  \ `/dev/tty0`，还有后面的两个 `dup`。\n\n`open` 函数会触发 `0x80` 中断，最终调用到 `sys_open` 这个系统调用函数，相信你已经很熟悉了。\n\
  \n```c\nstruct file_table[64] = {0};\n\nint sys_open(const char * filename,int flag,int\
  \ mode) {\n    struct m_inode * inode;\n    struct file * f;\n    int i,fd;\n  \
  \  mode &= ~umask;\n\n    for(fd=0; fd<20; fd++)\n        if (!current->filp[fd])\n\
  \            break;\n    if (fd>=20)\n        return -EINVAL;\n\n    f = &file_table[i];\n\
  \    for (i=0; i<64; i++)\n        if (!f->f_count)\n            break;\n    if\
  \ (i>=64)\n        return -EINVAL;\n\n    current->filp[fd] = f;\n    f->f_count++;\n\
  \n    i = open_namei(filename,flag,&inode);\n\n    if (S_ISCHR(inode->i_mode)) {\n\
  \        if (MAJOR(inode->i_mode) == 4) {\n            if (current->tty < 0) {\n\
  \                current->tty = MINOR(inode->i_mode);\n                tty_table[current->tty].pgrp\
  \ = current->pgrp;\n            }\n        } else if (MAJOR(inode->i_mode) == 5)\
  \ {\n            if (current->tty < 0) {\n                iput(inode);\n       \
  \         current->filp[fd] = NULL;\n                return -EPERM;\n          \
  \  }\n        }\n    }\n    if (S_ISBLK(inode->i_mode)) {\n        check_disk(inode->i_mode);\n\
  \    }\n\n    f->f_mode = inode->i_mode;\n    f->f_flags = flag;\n    f->f_count\
  \ = 1;\n    f->f_inode = inode;\n    f->f_pos = 0;\n    return (fd);\n}\n```\n\n\
  这么复杂的函数，我们慢慢来分析，先用一张图来描述它的作用。\n\n![](img/file238.webp)\n\n### 第一步，在进程描述符数组 `filp`\
