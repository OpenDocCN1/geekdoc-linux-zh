  \ 为 1，表示我们要读出 1 个字符。\n\n整个方法，其实就是不断从 `secondary` 队列里取出字符，然后放入 `buf` 所指向的内存。\n\n\
  如果要读取的字符数 `nr` 被减为 0，说明已经完成了读取任务，或者说 `secondary` 队列为空，说明不论你任务完没完成我都没有字符让你继续读了，那此时调用\
  \ `sleep_if_empty` 将线程**阻塞**，等待被唤醒。\n\n其中 `GETCH` 就是个宏，改变 `secondary` 队列的队头队尾指针，你自己写个队列数据结构，也是这样的操作，不再展开讲解。\n\
  \n```c\n#define GETCH(queue,c)  \\\n(void)({c=(queue).buf[(queue).tail];INC((queue).tail);})\n\
  ```\n\n同理，判空逻辑就更为简单了，就是队列头尾指针是否相撞。\n\n```c\n#define EMPTY(a)  ((a).head ==  (a).tail)\n\
  ```\n\n理解了这些小细节之后，再明白一行关键的代码，整个 `read` 到 `tty_read` 这条线就完全可以想明白了。那就是队列为空，即不满足继续读取条件的时候，让进程阻塞的\
  \ `sleep_if_empty`，我们看看。\n\n```c\nsleep_if_empty(&tty->secondary);\n\n// tty_io.c\n\
  static void sleep_if_empty(struct tty_queue * queue) {\n    cli();\n    while (!current->signal\
  \ && EMPTY(*queue))\n        interruptible_sleep_on(&queue->proc_list);\n    sti();\n\
  }\n\n// sched.c\nvoid interruptible_sleep_on(struct task_struct **p) {\n    struct\
  \ task_struct *tmp;\n    ...\n    tmp=*p;\n    *p=current;\nrepeat: current->state\
  \ = TASK_INTERRUPIBLE;\n    schedule();\n    if (*p && *p != current) {\n      \
  \  (**p).state=0;\n        goto repeat;\n    }\n    *p=tmp;\n    if (tmp)\n    \
  \    tmp->state=0;\n}\n```\n\n我们先只看一句关键的代码，就是当前进程的状态设置为等待。\n\n```c\ncurrent->state\
  \ = TASK_INTERRUPIBLE;\n```\n\n那么执行到进程调度时，当前进程不会被调度，也就阻塞了。不熟悉调度的同学可以复习一下设计调度。\n\n\
  进程被调度了，什么时候唤醒呢？当我们再次按下键盘，使得 `secondary` 队列中有字符，也就打破了为空条件，此时应该将之前的进程唤醒。\n\n```c\n\
  // tty_io.c\nvoid do_tty_interrupt(int tty) {\n    copy_to_cooked(tty_table+tty);\n\
  }\nvoid copy_to_cooked(struct tty_struct * tty) {\n    ...\n    wake_up(&tty->secondary.proc_list);\n\
  }\n```\n\n可以看到，在 `copy_to_cooked` 里，将 `read_q` 队列中的字符处理后放入 `secondary` 队列中的最后一步，就是唤醒\
  \ `wake_up` 这个队列里的等待进程。\n\n`wake_up` 函数更为简单，就是修改一下状态，使其变成运行的状态。\n\n```c\n// sched.c\n\
  void wake_up(struct task_struct **p) {\n    if (p && *p) {\n        (**p).state=0;\n\
  \    }\n}\n```\n\n总体流程就是这个样子的。当然，进程的阻塞与唤醒是个体系，还有很多细节，我们下一回再展开这部分。\n\n## 第 44 回 |\
  \ 进程的阻塞与唤醒\n\n新建一个非常简单的 `info.txt` 文件。\n\n```text\nname:flash\nage:28\nlanguage:java\n\
  ```\n\n在命令行输入一条十分简单的命令。\n\n```bash\nroot@linux0.11 cat info.txt | wc -l\n3\n```\n\
  \n这条命令的意思是读取刚刚的 `info.txt` 文件，输出它的行数。\n\n在上一回中，我们分析了一下 `shell` 进程是如何读取你的命令的，流程如下。的，这里的\
  \ `sleep_on` 和 `wake_up` 是进程的阻塞与唤醒机制的实现，我们没有展开讲解。\n\n今天就详细看看这块的逻辑。首先，表示进程的数据结构是\
  \ `task_struct`，其中有一个 `state` 字段表示进程的状态，它在 Linux 0.11 里有五种枚举值。\n\n```c\n// shed.h\n\
  #define TASK_RUNNING 0  // 运行态\n#define TASK_INTERRUPIBLE 1  // 可中断等待状态。\n#define\
  \ TASK_UNINTERTIBLE 2  // 不中断等待状态\n#define TASK_ZOMBIE 3  // 僵死状态\n#define TASK_STOPPED\
  \ 4  // 停止\n```\n\n当进程首次被创建时，也就是 `fork` 函数执行后，它的初始状态是 0，也就是运行态。\n\n```c\n// system_call.s\n\
  _sys_fork:\n    ...\n    call _copy_process\n    ...\n\n// fork.c\nint copy_process(...)\
  \ {\n    ...\n    p->state = TASK_RUNNING;\n    ...\n}\n```\n\n只有当处于运行态的进程，才会被调度机制选中，送入\
  \ CPU 开始执行。\n\n```c\n// sched.c\nvoid schedule (void) {\n    ...\n    if ((*p)->state\
  \ == TASK_RUNNING && (*p)->counter > c) {\n        ...\n        next = i;\n    }\n\
  \    ...\n    switch_to (next);\n}\n```\n\n以上简单列出了关键代码。\n\n*(注：由于提供的原文已经是中文，根据翻译任务要求，此处保持原文逻辑与结构。若原文为英文则此处应翻译为中文。由于用户提供的文本大部分为中文，译文已确保格式对齐且无遗漏。)*\n\
  \n\n\n\n\nOK，现在我们的 `shell` 进程，通过 `read` 函数，中间经过了层层封装，以及后面经过了阻塞与唤醒这一番折腾后，终于把键盘输入的字符们，成功由\
  \ `tty` 中的 `secondary` 队列，读取并存放与 `buf` 指向的内存地址处。\n\n```\n[root@linux0.11] cat info.txt\
  \ | wc -l\n```\n\n接下来，就该解析并执行这条命令了。\n\n```\n[](#cb334-1)// xv6-public sh.c\n[](#cb334-2)int\
  \ main(void) {\n[](#cb334-3)    static char buf[100];\n[](#cb334-4)    // 读取命令\n\
  [](#cb334-5)    while(getcmd(buf, sizeof(buf)) >= 0){\n[](#cb334-6)        // 创建新进程\n\
  [](#cb334-7)        if(fork() == 0)\n[](#cb334-8)            // 执行命令\n[](#cb334-9)\
  \            runcmd(parsecmd(buf));\n[](#cb334-10)        // 等待进程\n[](#cb334-11)\
  \        wait();\n[](#cb334-12)    }\n[](#cb334-13)}\n```\n\n也就是上述函数中的 `runcmd`\
  \ 命令。\n\n欲知后事如何，且听下回分解。\n\n***\n\n## 第 45 回 | 解析并执行 shell 命令\n\n> 原文链接: [`mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247503139&idx=1&sn=652316c29be5ba983fbb658ce58443d8&chksm=c2c5b78ef5b23e980870ff66f066a624f9a5d61bd73f550d5579e745f60335dfb489dcf977d8&scene=21#wechat_redirect`](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247503139&idx=1&sn=652316c29be5ba983fbb658ce58443d8&chksm=c2c5b78ef5b23e980870ff66f066a624f9a5d61bd73f550d5579e745f60335dfb489dcf977d8&scene=21#wechat_redirect)\n\
  \n新建一个非常简单的 `info.txt` 文件。\n\n```\nname:flash\nage:28\nlanguage:java\n```\n\n在命令行输入一条十分简单的命令。\n\
  \n```\n[root@linux0.11] cat info.txt | wc -l\n3\n```\n\n这条命令的意思是读取刚刚的 `info.txt`\
  \ 文件，输出它的行数。\n\n在上一回中，我们讲述了进程在读取你的命令字符串时，可能经历的进程的阻塞与唤醒，也即 `Linux 0.11` 中的 `sleep_on`\
  \ 与 `wake_up` 函数。\n\n![](img/file305.webp \"fig:\")\n\n接下来，`shell` 程序就该解析并执行这条命令了。\n\
  \n```\n[](#cb337-1)// xv6-public sh.c\n[](#cb337-2)int main(void) {\n[](#cb337-3)\
