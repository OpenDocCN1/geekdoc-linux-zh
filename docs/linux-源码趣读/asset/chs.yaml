  \n| 内存地址 | 长度(字节) | 名称 |\n| --- | --- | --- |\n| 0x90000 | 2 | 光标位置 |\n| 0x90002\
  \ | 2 | 扩展内存数 |\n| 0x90004 | 2 | 显示 |\n| 0x90006 | 1 | 显示模式 |\n| 0x90007 | 1 | 字符列数\
  \ |\n| 0x90008 | 2 | 未知 |\n| 0x9000A | 1 | 显示内存 |\n| 0x9000B | 1 | 显示状态 |\n| 0x9000C\
