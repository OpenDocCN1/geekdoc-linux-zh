  [](#cb341-13)            close(p[1]);\n[](#cb341-14)            runcmd(pcmd->left);\n\
  [](#cb341-15)        }\n[](#cb341-16)        if(fork() == 0) {\n[](#cb341-17)  \
  \          close(0);\n[](#cb341-18)            dup(p[0]);\n[](#cb341-19)       \
