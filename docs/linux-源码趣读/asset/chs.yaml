  \    long cs;\n    long ss;\n    long ds;\n    long fs;\n    long gs;\n    long\
  \ ldt;\n    long trace_bitmap;\n    struct i387_struct i387;\n};\n```\n\n而 `LDT`\
  \ 叫**局部描述符表**，是与 `GDT` 全局描述符表相对应的，内核态的代码用 `GDT` 里的数据段和代码段，而用户进程的代码用每个用户进程自己的 `LDT`\
  \ 里的数据段和代码段。\n\n先不管它，我这里放一张超纲的图，你先找找感觉。\n\n![](img/file114.webp \"fig:\")\n\n我们接着往下看。\n\
  \n```c\nstruct desc_struct {\n    unsigned long a,b;\n}\n\nstruct task_struct *\
  \ task[64] = {&(init_task.task), };\n\nvoid sched_init(void) {\n    ...\n    int\
  \ i;\n    struct desc_struct * p;\n        p = gdt+6;\n    for(i=1;i<64;i++) {\n\
  \        task[i] = NULL;\n        p->a=p->b=0;\n        p++;\n        p->a=p->b=0;\n\
  \        p++;\n    }\n    ...\n}\n```\n\n这段代码有个循环，干了两件事。\n\n一个是给一个长度为 64，结构为 `task_struct`\
  \ 的数组 `task` 附上初始值。\n\n![](img/file115.webp \"fig:\")\n\n这个 `task_struct` 结构就是代表**每一个进程的信息**，这可是个相当相当重要的结构了，把它放在心里。\n\
  \n```c\nstruct task_struct {\n    /* these are hardcoded - don't touch */\n    long\
  \ state; /* -1 unrunnable, 0 runnable, >0 stopped */\n    long counter;\n    long\
  \ priority;\n    long signal;\n    struct sigaction sigaction[32];\n    long blocked;\
  \ /* bitmap of masked signals */\n    /* various fields */\n    int exit_code;\n\
  \    unsigned long start_code,end_code,end_data,brk,start_stack;\n    long pid,father,pgrp,session,leader;\n\
  \    unsigned short uid,euid,suid;\n    unsigned short gid,egid,sgid;\n    long\
  \ alarm;\n    long utime,stime,cutime,cstime,start_time;\n    unsigned short used_math;\n\
  \    /* file system info */\n    int tty; /* -1 if tty, so it must be signed */\n\
  \    unsigned short umask;\n    struct m_inode * pwd;\n    struct m_inode * root;\n\
  \    struct m_inode * executable;\n    unsigned long close_on_exec;\n    struct\
  \ file * filp[NR_OPEN];\n    /* ldt for task 0 - zero 1 - cs 2 - ds */\n    struct\
  \ desc_struct ldt[3];\n    /* tss for task */\n    struct tss_struct tss;\n};\n\
  ```\n\n这个循环做的另一件事，是给 `gdt` 剩下的位置填充 0，也就是把剩下的 `TSS` 和 `LDT` 的描述符都附上空。\n\n![](img/file116.webp\
  \ \"fig:\")\n\n往后展望一下，以后创建一个新进程，就会添加一组 `TSS` 和 `LDT` 表示这个进程的状态段以及描述符表。\n\n![](img/file117.webp\
  \ \"fig:\")\n\n那为什么一开始就有一组 `TSS` 和 `LDT` 呢？现在创建呀，虽然还没有建立调度机制，但我们正在运行的代码就是未来的进程指令流。也就是当调度机制建立起来，正在执行的代码就会成为进程\
  \ 0 的代码。我们需要提前把这些作为进程 0 的信息写好。如果你觉得很疑惑，别急，等调度机制建立起来，并且亲眼看到进程 0 以及进程 1 的创建，以及它们因为调度机制而切换，你就明白这一切了。\n\
  \n好，初始化了一组 `TSS` 和 `LDT` 后，再往下看。\n\n```c\n#define ltr(n) __asm__(\"ltr %%ax\":\"\
  a\" (m)(n))\n#define lld(n) __asm__(\"lld %%ax\":\"a\" (m)(n))\nvoid sched_init(void)\
  \ {\n    ...\n    ltr(0);\n    lld(0);\n    ...\n}\n```\n\n这涉及到之前的知识。还记得 `lidt`\
  \ 和 `lgdt` 指令么？一个是给 `idtr` 寄存器赋值，告诉 CPU 中断描述表 `idt` 在内存的位置；一个是给 `gdtr` 寄存器赋值，告诉\
  \ CPU 全局描述表 `gdt` 在内存的位置。\n\n![](img/file118.webp \"fig:\")\n\n那这两行和刚刚类似，`ltr` 是给\
  \ `tr` 寄存器赋值，告诉 CPU 任务状态段 `TSS` 在内存的位置；`lld` 一个是给 `ldt` 寄存器赋值，告诉 CPU 局部描述符 `LDT`\
  \ 在内存的位置。\n\n![](img/file119.webp \"fig:\")\n\n这样，CPU 之后就能通过 `tr` 寄存器找到当前进程的状态段，也就是上下文信息，以及通过\
  \ `ldt` 寄存器找到当前进程用的局部描述表。继续继续。\n\n```c\nvoid sched_init(void) {\n    ...\n    outb(0x36,0x43);\
  \ /* binary, mode 3, LSB/MSB, ch 0 */\n    outb(LATCH & 0xff, 0x40); /* LSB */\n\
  \    outb(LATCH >> 8, 0x40); /* MSB */\n    set_intr_gate(0x20,timer_interrupt);\n\
  \    outb(inb(0x21)&~0x01,0x21);\n    set_system_gate(0x80,system_call);\n    ...\n\
  }\n```\n\n\n\n\n\n想起来了吧？而且我们在 [第 13 回 | 主内存初始化 mem_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500089&idx=1&sn=9a3fd6e585b0fd1ec528599ead6677c6&scene=21#wechat_redirect)\
  \ 中，用 `mem_init` 设置好了主内存的管理结构 `mem_map`。\n\n![](img/file127.webp \"fig:\")\n\n再想不起来那就需要把前面的章节再读一读咯，不然后面越来越难。\n\
  \n前面是把主内存区管理起来了，所以今天就是把剩下的缓冲区部分也初始化管理起来。目的就是这么单纯，我们看代码。\n\n我们还是采用之前的方式，就假设内存只有 8M，把一些不相干的分支去掉，方便理解。\n\
  \n```\nextern int end;\nstruct buffer_head * start_buffer = (struct buffer_head\
  \ *) &end;\n\nvoid buffer_init(long buffer_end) {\n    struct buffer_head * h =\
  \ start_buffer;\n    void * b = (void *) buffer_end;\n    while ( (b -= 1024) >=\
  \ ((void *) (h+1)) ) {\n        h->b_dev = 0;\n        h->b_dirt = 0;\n        h->b_count\
  \ = 0;\n        h->b_lock = 0;\n        h->b_uptodate = 0;\n        h->b_wait =\
  \ NULL;\n        h->b_next = NULL;\n        h->b_prev = NULL;\n        h->b_data\
  \ = (char *) b;\n        h->b_prev_free = h-1;\n        h->b_next_free = h+1;\n\
  \        h++;\n    }\n    h--;\n    free_list = start_buffer;\n    free_list->b_prev_free\
  \ = h;\n    h->b_next_free = free_list;\n    for (int i=0;i<307;i++)\n        hash_table[i]=NULL;\n\
  }\n```\n\n虽然很长，但其实就造了两个数据结构而已。\n\n不过别急，我们先看这一行代码。\n\n```\nextern int end;\nvoid\
  \ buffer_init(long buffer_end) {\n    struct buffer_head * start_buffer = (struct\
  \ buffer_head *) &end;\n    ...\n}\n```\n\n这里有个外部变量 `end`，而我们的缓冲区开始位置 `start_buffer`\
  \ 就等于这个变量的内存地址。\n\n这个外部变量 `end` 并不是操作系统代码写就的，而是由链接器 `ld` 在链接整个程序时设置的一个外部变量，帮我们计算好了整个内核代码的末尾地址。\n\
  \n那在这之前的是内核代码区域肯定不能用，在这之后的，就给 buffer 用了。所以我们的内存分布图可以更精确一点了。\n\n![](img/file128.webp\
  \ \"fig:\")\n\n你看，之前的疑惑解决了吧？很好理解嘛，内核程序和缓冲区的划分肯定有个分界线，这个分界线就是 `end` 变量的值。\n\n这个值定多少合适呢？\n\
  \n像主内存和缓冲区的分界线，就直接代码里写死了，就是上图中的 2M。\n\n可是内核程序占多大内存在写的时候完全不知道，就算知道了如果改动一点代码也会变化，所以就由程序编译链接时由链接器程序帮我们把这个内核代码末端的地址计算出来，作为一个外部变量\
  \ `end` 我们拿来即用，就方便多了。\n\n好，回过头我们再看看，整段代码创造了哪两个管理结构？\n\n我们先看这段结构。\n\n```\nvoid buffer_init(long\
  \ buffer_end) {\n    struct buffer_head * h = start_buffer;\n    void * b = (void\
  \ *) buffer_end;\n    while ( (b -= 1024) >= ((void *) (h+1)) ) {\n        ...\n\
  \        h->b_data = (char *) b;\n        h->b_prev_free = h-1;\n        h->b_next_free\
  \ = h+1;\n        h++;\n    }\n    ...\n}\n```\n\n就俩变量。一个是 `buffer_head` 结构的 `h`，代表缓冲头，其指针值是\
  \ `start_buffer`，刚刚我们计算过了，就是图中的内核代码末端 `end`，也就是缓冲区开头。\n\n一个是 `b`，代表缓冲块，指针值是 `buffer_end`，也就是图中的\
  \ 2M，就是缓冲区结尾。\n\n缓冲区结尾的 `b` 每次循环 -1024，缓冲区结尾的 `h` 每次循环 +1（一个 `buffer_head` 大小的内存），直到一块为止。\n\
  \n![](img/file129.webp \"fig:\")\n\n可以看到，其实这个 `b` 代表缓冲块，`h` 代表缓冲头，一个从上，一个从下。在这个过程中\
  \ `h` 被附上了属性，其中比较关键的是 `buffer` 所表示的数据 `b_data`，指向了上面的缓冲块。\n\n还有这个 `buffer` 的前后指针\
  \ `b_prev_free` 和 `b_next_free`。\n\n那画成图如下。\n\n![](img/file130.webp \"fig:\")\n\n\
  当缓冲头 `h` 的所有 `next` 和 `prev` 指针都指向此时，就构成了一个双向链表。继续看。\n\n```\nvoid buffer_init(long\
  \ buffer_end) {\n    struct buffer_head * h = start_buffer;\n    void * b = (void\
  \ *) buffer_end;\n    while ( (b -= 1024) >= ((void *) (h+1)) ) {\n        ...\n\
  \        h->b_data = (char *) b;\n        h->b_prev_free = h-1;\n        h->b_next_free\
  \ = h+1;\n    }\n    h->b_next_free = free_list;\n    ...\n}\n```\n\n这三行代码结合刚刚的双向链表\
  \ `h`，画出图你就懂了。\n\n![](img/file131.webp \"fig:\")\n\n`free_list` 指向了缓冲头双向链表的第一个结构，就可以顺着这个结构，从双向表中遍历到任何一个缓冲头，而通过缓冲头找到对应的缓冲块。\n\
  \n简单说，缓冲头就是缓冲块的管理结构，`free_list` 开头的双向链表又是缓冲头的管理结构，整个管理体系建立起来了。现在，从 `free_list` 开始遍历，就可以找到这里的所有内容。\n\
  \n不过，还有最后一个事，能帮助更好管理，往下看。\n\n```\nvoid buffer_init(long buffer_end) {\n    ...\n\
  \    for (i=0;i<307;i++)\n        hash_table[i]=NULL;\n}\n```\n\n一个 307 大小的 `hash_table`\
  \ 数组，这是干嘛的？其实今天的代码在 `buffer.c` 中，而 `buffer.c` 是 `fs` 包下的，也就是文件系统下的。所以它以后为文件系统服务，内核程序如果访问块设备的数据，都需要经过缓冲区。\n\
  \n那怎么知道缓冲区已经有了要的块设备数据呢？从双向链表从头遍历可以，但是效率太低了。所以需要一个 hashmap 的结构方便查找，这就是 `hash_table`\
  \ 的的作用。\n\n```\n#define _hashfn(dev,block) (((unsigned)(dev^block))%307)\n#define\
  \ hash(dev,block) hash_table[_hashfn(dev,block)]\n\n// 搜索合适的缓冲块\nstruct buffer_head\
  \ * getblk(int dev, int block) {\n    ...\n    struct buffer_head * bh = get_hash_table(dev,block);\n\
  \    ...\n}\n\nstruct buffer_head * get_hash_table(int dev, int block) {\n    ...\n\
  \    find_buffer(dev,block);\n    ...\n}\nstatic buffer_head * find_buffer(int dev,\
  \ int block) {\n    ...\n    hash(dev,block);\n    ...\n}\n```\n\n一路下来发现，就是通过 `dev^block\
  \ % 307`（设备号^块号）找到 `hash_table` 里的下标。接下来和 Java 里的 `HashMap` 类似，如果哈希冲突形成链表，画成图就是这样。\n\
  \n![](img/file132.webp \"fig:\")\n\n哈希表 + 双向链表，如果算法多了，很容易实现 LRU 算法，之后的缓冲区使用正是这个算法发挥的作用。也就是之后在文件系统读取硬盘时，都需要使用缓冲区里的内容，缓冲区是用户进程内存和硬盘之间的桥梁。\n\
  \n好了，再多说几句文件系统读操作压力太大，本章主要就了解这个缓冲区的管理工作是如何化的，为后面做垫。回过头来看看目前的进度吧！\n\n```\nvoid main(void)\
  \ {\n    ...\n    mem_init(main_memory_start,memory_end);\n    trap_init();\n  \
  \  blk_dev_init();\n    chr_dev_init();\n    tty_init();\n    time_init();\n   \
  \ sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n\
  \    sti();\n    move_to_user_mode();\n    if (!fork()) {init();}\n    for(;;) pause();\n\
  }\n```\n\n整个化的部分，就差 `hd_init` 和 `floppy_init` 这两个块初始化还没讲。\n\n而且幸运的是，`floppy_init`\
  \ 是软盘初始化，现在软盘几乎都被淘汰了，计算机中也没有软盘驱动器，所以这个完全可以不看，那就剩下一个 `hd_init` 硬盘初始化，非常简单！\n\n还记得小时候特别收集软盘，里面分门别类存上我做的\
  \ Flash 动画，然后在软盘上的那个纸标签写上文字，表示软盘存了什么，想想看还是回忆呢。扯远了。\n\n之前的初始化工作建立的数据结构，会在后面模块发挥最核心的作用，任何操作都离不开这些初始化工作建立的数据结构，一定要把这些根搭建好，别急慌。等初始化工作全部完成，我会专门用一回梳理一下，大家就尽可能把初始化大部分的数据结构记在心里吧！\n\
  \n## 第 20 回 硬盘初始化 hd_init\n\n> 原文链接: [`mp.weixin.qq.com/s/803C9jHxe42i9zEvPA`](https://mp.weixin.qq.com/s/803C9jHxe42i9zEvPA)\n\
  \n接上回，上回咱们说到，`buffer_init` 完成了缓冲区初始化工作，内存中的缓冲区部分变成了这个样子。\n\n![](img/file133.webp\
  \ \"fig:\")\n\n而所有的缓冲头又被一个 `hash_table` 管理起来，以便查找。\n\n![](img/file134.webp \"fig:\"\
  )\n\n至于缓冲区的这种管理怎么用，那等到后面文件系统中，如何读取一个块设备的数据，再展开讲解。\n\n今天，我们看 main 函数中最后两个初始化函数！\n\
  \n```c\nvoid main(void) {\n    ...\n    mem_init(main_memory_start,memory_end);\n\
  \    trap_init();\n    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n \
  \   time_init();\n    sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\
  \ //本文重点\n    floppy_init();\n    sti();\n    move_to_user_mode();\n    if (!fork())\
  \ {init();}\n    for(;;) pause();\n}\n```\n\n\n\n\n\n```c\n//struct blk_dev_struct\
  \ {\n//    void (*request_fn)(void);\n//    struct request * current_request;\n\
  //};\nextern struct blk_dev_struct blk_dev[NR_BLK_DEV];\n\nvoid hd_init(void) {\n\
  \    blk_dev[3].request_fn = do_hd_request;\n    set_intr_gate(0x2E,&hd_interrupt);\n\
  \    outb_p(inb_p(0x21)&0xfb,0x21);\n    outb(inb_p(0xA1)&0xbf,0xA1); \n}\n```\n\
  \n就这？一共就四行代码。\n\n没错，初始化嘛，往往都比较简单，尤其是对硬件设备的初始化，大体都是：\n\n1. 往某些 IO 端口上读写一些数据，表示开启它；\n\
  2. 然后再向中断向量表中添加一个中断，使得 CPU 能够响应这个硬件设备的动作；\n3. 最后再初始化一些数据结构来管理。不过像是内存管理可能结构复杂些，外设的管理，相对就简单很多了。\n\
  \n看第一行代码：\n\n```c\nvoid hd_init(void) {\n    blk_dev[3].request_fn = do_hd_request;\n\
  \    ...\n}\n```\n\n我们把 `blk_dev` 数组索引 3 位置处的块设备管理结构 `blk_dev_struct` 的 `request_fn`\
  \ 赋值为了 `do_hd_request`，这是啥意思呢？\n\n因为有很多块设备，所以 Linux 0.11 内核用了一个 `blk_dev[]` 来进行管理，每一个索引表示一个块设备。\n\
  \n```c\nstruct blk_dev_struct blk_dev[NR_BLK_DEV] = {\n    { NULL, NULL },     /*\
  \ no_dev */\n    { NULL, NULL },     /* dev mem */\n    { NULL, NULL },     /* dev\
  \ fd */\n    { NULL, NULL },     /* dev hd */\n    { NULL, NULL },     /* dev ttyx\
  \ */\n    { NULL, NULL },     /* dev tty */\n    { NULL, NULL }      /* dev lp */\n\
  };\n\nstruct blk_dev_struct {\n    void (*request_fn)(void);  // 处理 block I/O 请求的函数\n\
  \    struct request * current_request;  // 当前正在处理的请求\n};\n```\n\n你看，索引为 3 这个位置，就表示给硬盘\
  \ `hd` 这个块设备留的位置。\n\n那么每个块设备执行读写请求都有自己的函数实现，在上层看来都是一个统一函数 `request_fn` 即可，具体实现各有不同，对于硬盘来说，这个实现就是\
  \ `do_hd_request` 函数。\n\n是不是有点像接口？这其实就是多态思想在 C 语言的体现嘛~ 用 Java 程序员熟悉的话就是，父类引用 `request_fn`\
  \ 指向子类对象 `do_hd_request` 的感觉咯。\n\n我们再看第二行。\n\n```c\nvoid hd_init(void) {\n    ...\n\
  \    set_intr_gate(0x2E,&hd_interrupt);\n    ...\n}\n```\n\n对于中断我们已经很熟悉了，这里就是又设置了一个新的中断，中断号是\
  \ `0x2E`，中断处理函数是 `hd_interrupt`，也就是说硬盘发生读写时，硬盘会发出中断信号给 CPU，之后 CPU 便会陷入中断处理程序，也就是执行\
  \ `hd_interrupt` 函数。\n\n```c\n_hd_interrupt:\n    ...\n    xchgl _do_hd,%edx\n \
  \   ...\n// 如果是读盘操作，这个 do_hd 是 read_intr\nstatic void read_intr(void) {\n    ...\n\
  \    do_hd_request();\n    ...\n}\n```\n\n好了，又多了一个中断，那我们再次理理目前开启的中断都有。\n\n| 中断号\
  \ | 中断处理函数 |\n| --- | --- |\n| 0~0x10 | `trap_init` 里设置 |\n| 0x20 | `timer_interrupt`\
  \ |\n| 0x21 | `keyboard_interrupt` |\n| 0x2E | `hd_interrupt` |\n| 0x80 | `system_call`\
  \ |\n\n其中 `0-0x10` 17 个中断是 `trap_init` 里设置的，是一些基本的中断，比如异常等。之后，在控制台初始化 `con_init`\
  \ 里，我们又设置了 `0x21` 中断，这样键盘就有反应了。之后，我们在进程调度初始化 `sched_init` 里又设置了 `0x20` 时钟中断，并且开启定时器。最后又设置了一个极为重要的\
  \ `0x80` 系统调用。现在，我们在硬盘初始化 `hd_init` 里，又设置了硬盘中断，这样硬盘读写完成后通过中断来通知 CPU。上回书我提醒大家，有没有感觉到操作系统的中断驱动的特征，那本回给大家展望一下。\n\
  \n> 看到最后，你会发现操作系统就是一个中断驱动的死循环而已，如果不发生任何中断，操作系统会一直在死循环里等待。换句话说，让操作系统工作的唯一方式，就是触发中断。\n\
  \n好了，再往下看两行。\n\n```c\nvoid hd_init(void) {\n    ...\n    outb_p(inb_p(0x21)&0xfb,0x21);\n\
  \    outb(inb_p(0xA1)&0xbf,0xA1); \n}\n```\n\n就是往几个 IO 端口上读写，其作用是允许硬盘控制器发送中断信号，仅此而已。我们向来深入硬件细节，知道这个端口里写上这些数据，导致硬盘开启了。OK，本章就结束了，仅仅看初始化的工作，太简单了，连图都不用画。当然\
  \ `hd.c` 里还有很多读写硬盘的方法，这个在之后文件系统用到时，自然会讲，这里就抛个引子，看看读硬盘最底层的操作，是怎样的。我们看硬盘端口表。\n\n|\
  \ 端口 | 读 | 写 |\n| --- | --- | --- |\n| 0x1F0 | 数据寄存器 | 数据寄存器 |\n| 0x1F1 | 错误寄存器\
  \ | 特征寄存器 |\n| 0x1F2 | 扇区计数器 | 扇区计数寄存器 |\n| 0x1F3 | 扇区号寄存器或 LBA 块地址 0~7 | 扇区号寄存器或\
  \ LBA 块地址 0~7 |\n| 0x1F4 | 磁道数低 8 位或 LBA 块地址 8~15 | 磁道数低 8 位或 LBA 块地址 8~15 |\n|\
  \ 0x1F5 | 磁道数高 8 位或 LBA 块地址 16~23 | 磁道数高 8 位或 LBA 块地址 16~23 |\n| 0x1F6 | 驱动器/磁头或\
  \ LBA 块地址 24~27 | 驱动器/磁头或 LBA 块地址 24~27 |\n| 0x1F7 | 命令寄存器或状态寄存器 | 命令寄存器 |\n\n那读硬盘就是往第一个以外的端口写数据，告诉硬盘哪个扇区，读多少。然后再从\
  \ `0x1F0` 端口一个字节一个字节的读。这就完成了一次硬盘操作。如果觉得不够具体，那来：\n\n1. 在 `0x1F2` 写入要读取的扇区数\n2. 在\
  \ `0x1F3~0x1F6` 写入好的 LBA 地址\n3. 在 `0x1F7` 处写入命令号\n4. 不断检测 `0x1F7`（此时状态寄存器含义）的忙位\n\
  5. 如果不忙，则不断从 `0x1F0` 读取数据到内存，直到读完\n\n操作系统的代码也是写的，我们看一下，不用细节。\n\n```c\nstatic void\
  \ hd_out(unsigned int drive, unsigned int nsect, unsigned int sect,\n          \
  \         unsigned int head, unsigned int cmd,\n                   void (*intr_addr)(void))\
  \ {\n    ...\n    do_hd = intr_addr;\n    outb_p(hd_info[drive].ctl,HD_CMD);\n \
  \   port = 0x1f0;\n    outb_p(hd_info[drive].wp<<2,++port);\n    outb_p(nsect,++port);\n\
  \    outb_p(sect,++port);\n    outb_p(cyl,++port);\n    outb_p(cyl>>8,++port);\n\
  \    outb_p(0xA0|(drive<<4)|head,++port);\n    outb(cmd,++port);\n}\n```\n\n看，那些\
  \ `outb_p` 方法，转换成汇编语言，就是 `out` 指令，往指定的硬盘 IO 端口上写数据，达到我们想要的读写目的。是不是很 low？但我们用户层写的各种\
  \ `read/write` 函数，即便是经过系统调用、文件系统、缓冲区管理等等过程，但只要是读写硬盘，最终都要调用这个最底层的函数，殊途同归，逃不掉的！\n\n\
  好了，至此，我们就把所有的初始化工作都讲完了！坚持到现在的，都自己鼓掌！！！下一回，我们将用整一章的篇幅，完整梳理下我们做的初始化工作，这也标志着第二大部分完结！这些初始化工作，将在后面的流程中起到至关重要的作用，直到本系列结束。\n\
  \n### 第二部分总结与回顾\n\n第二部分所讲的代码，就第二部分的目录一样规整，一个 `init` 方法对应一个章节，简单粗暴。\n\n```c\nvoid\
  \ main(void) {\n    ...\n    mem_init(main_memory_start,memory_end);\n    trap_init();\n\
  \    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n    time_init();\n \
  \   sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n\
  \    sti();\n    move_to_user_mode();\n    if (!fork()) {init();}\n    for(;;) pause();\n\
  }\n```\n\n如果坚持到这里了，先给自己鼓鼓掌！这个过程，你可能觉得无聊。\n\n### 开始\n\n电脑开机后，首先由 BIOS 将操作系统程序加载到内存，之后在进入\
  \ `main` 函数前，我们用汇编（`boot` 包下的三个汇编文件）做了好多苦力。这些苦力做好后，内存布局变成了样子。其中页表的映射关系，被成了线性地址与物理地址相同。也因为有了页表，所以多了线性空间，即经过段机制转化，分页机制前的地址，不考虑段限的话，32\
  \ 位 CPU 线性空间应为 4G。以上这些，是进入 `main` 函数之前，由 `boot` 文件夹下的三个汇编文件完成，具体可以看第一部分的总结：第一部分完结\
  \ 进入内核前的苦力活。\n\n\n\n\nSubsequently, through the `mem_init` function, the main memory\
  \ area is managed using the `mem_map[]` array. In essence, each entry represents\
  \ the reference count of a 4K memory page. From now on, allocations and deallocations\
  \ of main memory are actually operations on the `mem_map` array. This is what is\
  \ done in [Session 13 | Main Memory Initialization mem_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500089&idx=1&sn=9a3fd6e585b0fd1ec528599ead6677c3&scene=21#wechat_redirect).\n\
  \n![](img/file140.webp \"fig:\")\n\nLater, through the `buffer_init` function, the\
  \ buffer area is managed using various data structures. This includes a doubly linked\
  \ list buffer header `h` and 1024-byte buffer blocks `b` managed by each header.\
  \ This is the content of [Session 19 | Buffer Initialization buffer_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500596&idx=1&sn=0df64f9f5133cfe8a259b8ce7b7feaeb&chksm=c2c5b999f5b2308f76095af30e8915f125f18702df9c58be7612b58e4d009c14948193974f9b&scene=21#wechat_redirect).\n\
  \n![](img/file141.webp \"fig:\")\n\nSimultaneously, a `hashmap` structure is used\
  \ to index all buffer headers for fast lookup, preparing for future use of buffers\
  \ via the `LRU` algorithm.\n\n![](img/file142.webp \"fig:\")\n\nThese structures\
  \ constitute the management of the buffer section. The purpose of the buffer is\
  \ to accelerate disk I/O efficiency; when covering the full file read/write process\
  \ later, you will see it play a pivotal role throughout the process.\n\nMoving forward,\
  \ the `trap_init` function sets up default interrupts in the Interrupt Descriptor\
  \ Table (IDT). Subsequently, each module sets its own customized interrupts (such\
  \ as hard disk interrupts, timer interrupts, keyboard interrupts, etc.). This is\
  \ the content of [Session 14 | Interrupt Initialization trap_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500119&idx=1&sn=f46331f70677aba168243040a96be1c0&scene=21#wechat_redirect).\n\
  \n![](img/file143.webp \"fig:\")\n\nAfterward, `blk_dev_init` initializes the management\
  \ of block devices (such as hard drives). For instance, hard disk read/write operations\
  \ are encapsulated into a `request` structure and placed in the `request[]` array,\
  \ which is then queued for I/O using the elevator scheduling algorithm. This is\
  \ the content of [Session 15 | Block Device Request Initialization blk_dev_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500147&idx=1&sn=409f5ed34ae3822e40a6b443207d40c5&scene=21#wechat_redirect).\n\
  \n![](img/file144.webp \"fig:\")\n\nNext, `con_init` within `tty_init` implements\
  \ the functionality to output characters to the console, supporting effects like\
  \ line breaks and scrolling. Of course, keyboard interrupts are also enabled here;\
  \ if interrupts are already enabled at this point, we can use the keyboard to output\
  \ characters to the screen. This is the content of [Session 16 | Console Initialization\
  \ tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect).\n\
  \n![](img/file145.gif \"fig:\")\n\nThen, the essence of the OS—process scheduling—is\
  \ initialized. Its function `sched_init` defines the complete process management\
  \ structure array `task[64]` and assigns an initial value at index 0 as the structure\
  \ for Process 0. This is the content of [Session 18 | Process Scheduling Initialization\
  \ sched_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c68c2b03d9721ba74e949cfa8&chksm=c2c5b87df5b2316b83015afdba2df2921f38fcf1cd04e02ab104226383a3ef5&scene=21#wait,\
  \ wait,26383a3ef5&scene=21).\n\n![](img/file146.webp \"fig:\")\n\nThen, the global\
  \ descriptor table adds `TSS` and `LDT` to manage the context of Process 0 and its\
  \ memory planning.\n\n![](img/file147.webp \"fig:\")\n\nSimultaneously, these two\
  \ addresses are passed to the `tr` and `ldt` registers so the CPU can find them.\n\
  \n![](img/file148.webp \"fig:\")\n\nSubsequently, the timer is enabled and the clock\
  \ interrupt is set to respond to signals sent every 100ms.\n\n![](img/file149.gif\
  \ \"fig:\")\n\nOnce the process scheduling initialization is complete, the scheduling\
  \ starts when the timer signal determines if the current process has expired, then\
  \ searches for the next process in the `task[64]` array. This is the simple flow\
  \ of process scheduling, a highlight discussed later. Finally, a simple `hd_init`\
  \ enables interrupts and sets the disk handler functions, allowing us to interact\
  \ via the hard disk port. This is the content of [Session 20 | Hard Disk Initialization\
  \ hd_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500686&idx=1&sn=c950e586af062e16c7e13a5084ca1d1c2c52f5b230357adca1bed7682f9661a23e8).\n\
  \nHere are the interrupts set by the previous modules:\n\n| Interrupt Vector | Handler\
  \ Function |\n| :--- | :--- |\n| 0 ~ 0x10 | Set in `trap_init` |\n| 0x20 | `timer_interrupt`\
  \ |\n| 0x21 | `keyboard_interrupt` |\n| 0x2E | `hd_interrupt` |\n| 0x80 | `system_call`\
  \ |\n\nI mentioned that the OS is essentially an interrupt-driven infinite loop,\
  \ which you will experience later. Let's look further at the `main` method:\n\n\
  ```c\n#define sti() __asm (\"sti\")\nvoid main(void) {\n    ...\n    sti();\n  \
  \  ...\n}\n```\n\n`sti` is an assembly instruction that enables interrupts. Essentially,\
  \ it sets the `IF` bit in the `efl` register (since we are in 32-bit protected mode,\
  \ I have renamed the registers to 32-bit names).\n\n![](img/file150.webp \"fig:\"\
  )\n\nThis way, the CPU begins receiving and processing interrupt signals. The keyboard\
  \ works, the disk can read/write, the clock ticks, and system calls become effective!\
  \ This means the OS has console interaction, disk I/O capabilities, process scheduling\
  \ capabilities, and responds to user process system calls!\n\nAt this point, all\
  \ initialization is finished! There are a few initialization functions not discussed\
  \ that you can ignore without worry: \n\n- `chr_dev_init`: This function is empty\
  \ and does nothing.\n\n![](img/file151.webp \"fig:\")\n\n- `rs_init` within `tty_init`:\
  \ This method enables serial interrupts and sets the corresponding interrupt handlers.\
  \ Serial ports are rarely used on modern PCs, so this can be ignored.\n\n- `floppy_init`:\
  \ This is for floppy initialization. Floppies are now obsolete and there are no\
  \ longer floppy controllers on computers, so ignore this as well.\n\n![](img/file152.webp\
  \ \"fig:\")\n\nBeyond these, we have clarified all initialization! Round applause\
  \ for this stage victory!!! Meanwhile, this chapter will serve as an index later;\
  \ the data structures set during initialization are very important. If you forget\
  \ them later, you can come back and check here. Good luck to everyone. As for what\
  \ happens next, listen to the next session for details.\n\n# Part 3: The Birth of\
  \ a New Process\n\n***\n\n## Session 21: Overview of New Process Birth\n\n> Original\
  \ Link: [`mp.weixin.qq.com/s/H_OCZ2ZtGHWHge_rYKCkJw`](https://mp.weixin.qq.com/s/H_OCZ2ZtGHWHge_rYKCkJw)\n\
  \nThis article is the first of Part Three.\n\nThe birth of a new process, from the\
  \ OS source code perspective, is actually just two lines of code. The focus of process\
  \ creation is actually one line of code: the famous `fork` function.\n\nLet's look\
  \ at a diagram first to see what the OS does from power-on to idle.\n\n![](img/file153.webp\
  \ \"fig:\")\n\nAs you can see, Parts One and Two provided sufficient groundwork\
  \ for Part Three.\n\n```c\nvoid main(void) {\n    // Content from Part Two, various\
  \ initializations\n    ...\n    move_to_user_mode();\n    if (!fork()) {\n     \
  \   // What the new process does is the content of Part Four\n        init();\n\
  \    }\n    // Infinite loop, OS idles\n    for(;;) pause();\n}\n```\n\n\n\n\n整个过程被操作系统的机制拿捏的死死的，始终让用户进程处于用户态运行，必要的时候陷入一下内核态，但很快就会被返回而再次回到用户态，是不是非常无奈？这样操作系统就掌控了控制权，而用户进程再怎么折腾也无法逃出这个模式。\n\
  \n### 内核态与用户态的本质-特权级\n\n首先从一个最大的视角来看，这一切都源于 CPU 的保护机制。CPU 为了配合操作系统完成保护机制这一特性，分别设计了**分段保护机制**与**分页保护机制**。\n\
  \n当我们在 [第七回 | 六行代码就进入了保护模式](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499699&idx=1&sn=000d83798b0158dbdf48d76e49d3ff96&chksm=c2c5851ef5b20c08bc641d4b118db78a3af5a4f90a057d1ce9f9b68f04b529124f466c743bc5&scene=21#wechat_redirect)\
  \ 将 `cr0` 寄存器的 `PE` 位开启时，就开启了保护模式，也即开启了**分段保护机制**。\n\n![](img/file157.webp \"fig:\"\
  )\n\n当我们在 [第九回 | Intel 内存管理两板斧：分段与分页](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499821&idx=1&sn=df90a7c57607bf501b5ef535f8440d98&chksm=c2c5ba80f5b233969bf591f919107e28e7be51f066821cba1ea39bf19cc0332b95b94d29467d&scene=21#wechat_redirect)\
  \ 将 `cr0` 寄存器的 `PG` 位开启时，就开启了分页模式，也即开启了**分页保护机制**。\n\n![](img/file158.webp \"fig:\"\
  )\n\n有关特权级的保护，实际上属于分段保护机制的一种。具体怎么保护的呢？由于这里的细节比较繁琐，所以我举个例子简单理解下即可，实际上的特权级检查规则要比我说的多好多内容。\n\
  \n我们目前正在执行的代码地址，是通过 CPU 中的两个寄存器 `cs : eip` 指向的对吧？`cs` 寄存器是代码段寄存器，里面存的是段选择子，还记得它的结构么？\n\
  \n![](img/file159.webp \"fig:\")\n\n这里面的低端两位，此时表示 **CPL**，也就是**当前所处的特权级**。假如我们现在这个时刻，`CS`\
  \ 寄存器的后两位为 3，二进制就是 11，就表示当前处理器处于用户态这个特权级。\n\n假如我们此时要跳转到另一处内存地址执行，在最终的汇编指令层面无非就是\
  \ `jmp`、`call` 和中断。我们拿 `jmp` 跳转来举例。\n\n如果是短跳转，也就是直接 `jmp xxx`，那涉及到段的变换，也就没有特权级检查这回事了。\n\
  \n如果是长跳转，也就是 `jmp yyy : xxx`，这里的 `yyy` 就是另一个要跳转到的段的段选择子结构。\n\n![](img/file160.webp\
  \ \"fig:\")\n\n这个结构仍然是一样的段选择子结构，只不过这里的低端两位表示 **RPL**，也就是**请求特权级**，表示我想请求的特权级是什么。同时，CPU\
  \ 会拿这个段选择子去全局描述符表寻找段描述符，从中找到段基址。\n\n![](img/file161.webp \"fig:\")\n\n那还记得段描述符的样子么？\n\
  \n![](img/file162.webp \"fig:\")\n\n你看，这里面又有个 **DPL**，这表示**目标代码段特权级**，也就是即将要跳转过去的那个段的特权级。\n\
  \n好了，我们总结一下简图，就是这三个玩意的比较。\n\n![](img/file163.webp \"fig:\")\n\n这里的检查规则比较多，简单说，绝大多数情况下，**要求\
  \ CPL 必须等于 DPL**，才会跳转成功，否则就会报错。\n\n也就是说，当前代码所处段的特权级，必须要等于要跳转过去的代码所处的段的特权级，那就只能**用户态往用户态跳**，**内核态往内核态跳**，这样就防止了处于用户态的程序跳转到内核态的代码段中做坏事。\n\
  \n这只是代码段跳转时做的特权级检查，还有访问内存数据时也会有数据段的特权级检查，这里就不展开了。最终的效果是，**处于内核态的代码可以访问任何特权级的数据段，处于用户态的代码则只可以访问用户态的数据段**，这也就实现了内存数据读写的保护。\n\
  \n说了这么多，其实就是：**代码跳转只能同特权级，数据访问只能高特权级访问低特权级**。\n\n### 特权级转换的方式\n\n诶不对呀，那我们今天要讲的是从内核态转变为用户态。如果代码跳转只能同特权级，那我们如何从内核态跳转到用户态呢？特权级转换的方式有多种：**中断**和**中断返回**。\n\
  \n系统调用就是这么玩的：用户通过 `int 80` 指令触发中断，CPU 切换至内核态，执行程序，之后通过中断返回用户态。\n\n```c\nvoid main(void)\
  \ {\n    ...\n    move_to_user_mode();\n    ...\n}\n\n#define move_to_user_mode()\
  \  \n_asm {\n    _asm mov eax,esp\n    _asm push 00000017h ; 给 SS 赋值\n    _asm push\
  \ eax\n    _asm pushfd\n    _asm push 000000fh ; 给 CS 赋值\n    _asm push offset l1\n\
  \    _asm iretd /* 执行中断返回*/\n    l1: mov eax,17h\n    _asm ds,ax\n    _asm es,ax\n\
  \    _asm fs,ax\n    _asm gs,ax\n}\n```\n\n你看，这个方法里直接执行了 `iretd`。为什么之前进行了五次的压栈操作？因为中断发生时，CPU\
  \ 会自动帮我们做压栈，而中断返回时，CPU 又把这些值赋值给寄存器。\n\n![](img/file165.webp \"fig:\")\n\n执行 `iretd`\
  \ 指令时，硬件会顺序将栈中的数据分别赋值给 `SS`、`ESP`、`EFLAGS`、`CS`、`EIP` 几个寄存器。压入栈的 `CS` 和 `EIP` 表示中断前代码的位置，中断返回后继续执行；压入栈的\
  \ `SS` 和 `ESP` 表示中断发生的位置，中断返回后恢复原来的栈。其中，特权级的转换体现在 `CS` 和 `SS` 寄存器的值里。\n\n`CS` 和\
  \ `SS` 寄存器的值是段选择子，其结构上面提过，在[第六回 | 寄存器的历史](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499699&idx=1&sn=a7e2297f16d4879fa31cceaa183fc9&chksm=c2c5853ef5b20c286df28013f0fc3b033790eca4ad06ab831f6c53c0d1398893534b&scene=21#wechat_redirect)\
  \ 中专门讲了这个结构的作用。\n\n![](img/file166.webp \"fig:\")\n\n对着这个结构看代码：\n\n```c\n#define\
  \ move_to_user_mode()  \n_asm {\n    _asm mov eax,esp\n    _asm push 00000017h ;\
  \ 给 SS 赋值\n    _asm push eax\n    _asm pushfd\n    _asm push 000000fh ; 给 CS 赋值\n\
  \    _asm push offset l1\n    _asm iretd /* 执行中断返回*/\n    l1: mov eax,17h\n    _asm\
  \ ds,ax\n    _asm es,ax\n    _asm fs,ax\n    _asm gs,ax\n}\n```\n\n拿 `CS` 举例，给它赋的值\
  \ `000000fh` 用二进制表示 `0000000000001111`，最后两位 `11` 表示用户态。`CS` 寄存器里的特权级 `CPL` 即当前处理器特权级，经过\
  \ `iretd` 返回之后，`CS` 的值变了，当前处理器特权级变成了用户态。除了改变特权级还做了什么？我们关注段寄存器的部分，详细看看 `CS` 为 `0000000000001111`\
  \ 最后的含义。\n\n![](img/file167.webp \"fig:\")\n\n继续解读，倒数第三位 `TI` 表示前面的描述符是从 `GDT` 还是\
  \ `LDT` 取，`1` 表示从局部描述符取。描述符索引 `1` 表示从局部描述符取到代码段，如果你熟悉前面讲的内容将会得出上述结论。我们将 `0` 号 `LDT`\
  \ 作为当前的 `LDT` 索引，记录在了 `lldt` 寄存器中。\n\n```c\n#define lldt(n) __asm__(\"lldt %%ax\"\
  :\"a\"(LDT(n)))\nvoid sched_init(void) {\n    ...\n    lldt(0);\n    ...\n}\n```\n\
  \n整个 `GDT` 与 `LDT` 表的设计，经过[第一部分 进入内核前的准备](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0==&mid=2247499882&idx=1&sn=68fd1c5aeae15084be58af1e5bd9c66e&chksm=c2cbac7f5b2370cadce3218c5294feeeae2e4d288)\
  \ 和[第二部分 大前期的初始化工作](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0==&mid=2247500983&idx=1&sn=ad4c430823c975df7f13de3fbe8c66e&chksm=c2c5be1af5b20c286df28013f0fc3b033790eca4ad06ab831f6c53c0d1398893534b&scene=21#wechat_redirect)\
  \ 的设计后，成了这个样子。\n\n![](img/file168.webp \"fig:\")\n\n\n\n\n```\nvoid main(void) {\n\
  \    ... \n    move_to_user_mode();\n    if (!fork()) {\n        init();\n    }\n\
  \    for(;;) pause();\n}\n```\n（注：原代码中包含 HTML 锚点标签，已清理以保持代码逻辑清晰）\n\n今天，本来应该再往下讲\
  \ `fork`。\n\n但这个是创建新进程的过程，是一个很能体现操作系统设计的地方。所以我们先别急着看代码，我们今天就头脑风暴一下，就是如果让你来设计整个进程调度，你会怎么搞？\n\
  \n别告诉我你先设计锁、设计 `volatile` 啥的，这都不是进程调度本身需要关心的最根本问题。\n\n进程调度本质是什么？很简单，假如有三段代码被加载到内存中。\n\
  \n![](img/file169.webp \"fig:\")\n\n进程调度就是让 CPU 一会去程序 1 的位置处运行一段时间，一会去程序 2 的位置处运行一段时间。\n\
  \n嗯，就这么简单，别反驳我，接着往下看。\n\n### 整体流程设计\n\n如何做到刚刚说的，一会去这运行，一会去那运行？\n\n**第一种办法**就是，程序\
  \ 1 的代码里，每隔几行就写一段代码，主动放弃自己的执行权，跳转到程序 2 的地方运行。然后程序 2 也是如此。但这种依靠程序自己的办法肯定不靠谱。\n\n\
  所以**第二种办法**就是，由一个不受任何程序控制的，第三方的不可抗力，每隔一段时间就中断一下 CPU 的运行，然后跳转到一个特殊的程序那里，这个程序通过某种方式获取到\
  \ CPU 下一个要运行的程序的地址，然后跳转过去。\n\n这个每隔一段时间就中断 CPU 的不可抗力，就是由定时器触发的**时钟中断**。\n\n不知道你是否还记得，这个定时器和时钟中断，早在\
  \ [第 18 回 | 大名鼎鼎的进程调度就是从这里开始](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c68c2b03d9721ba74e949cfa8&chksm=c2c5b87df5b2316b083015a4fdba2df29211f38fcfd1cdb040e02ab410432608e26383a43ef5&scene=21#wechat_redirect)\
  \ 里讲的 `sched_init` 函数里就搞定了。\n\n![](img/file170.gif \"fig:\")\n\n而那个特殊的程序，就是具体的**进程调度函数**了。\n\
  \n好了，整个流程就这样处理完了，那么应该设计什么样的**数据结构**来支持这个流程呢？不妨假设这个结构叫 `task_struct`。\n\n```\nstruct\
  \ task_struct {\n    ?\n}\n```\n\n换句话说，你总得有一个结构来记录各个进程的信息，比如它上一次执行到哪里了，要不 CPU 就算决定好了要跳转到你这个进程上运行，具体跳到哪一行运行，总得有个地方存吧？我们一个个问题抛开来看。\n\
  \n### 上下文环境\n\n每个程序最终的本质就是执行指令。这个过程会涉及**寄存器**、**内存**和**外设端口**。内存还有可能设计成相互错开的，互不干扰，比如进程\
  \ 1 你就用 0~1K 的内存空间，进程 2 就用 1K~2K 的内存空间，咱谁也别影响谁。虽然有点浪费空间，而且对程序员十分不友好，但起起还是能实现的。不过寄存器一共就那么点，肯定做不到互不干扰，可能一个进程就把寄存器全用上了，那其他进程咋整。\n\
  \n![](img/file171.webp \"fig:\")\n\n比如程序 1 刚刚往 `eax` 写入一个值，准备用，这时切换到进程 2 了，又往 `eax`\
  \ 里写入了一个值。那么之后再切回进程 1 的时候，就出错了。\n\n所以最稳妥的做法就是，每次切换进程时，都把当前这些寄存器的值存到一个地方，以便之后切换回来的时候恢复。Linux\
  \ 0.11 就是这样做的，每个进程的结构 `task_struct` 里面，有一个叫 `tss` 的结构，存储的就是 CPU 这些**寄存器**的信息。\n\n\
  ```\nstruct task_struct {\n    ...\n    struct tss_struct tss;\n}\n\nstruct tss_struct\
  \ {\n    long    back_link;  /* 16 high bits zero */\n    long    esp0;\n    long\
  \    ss0;        /* 16 high bits zero */\n    long    esp1;\n    long    ss1;  \
  \      /* 16 high bits zero */\n    long    esp2;\n    long    ss2;        /* 16\
  \ high bits zero */\n    long    cr3;\n    long    eip;\n    long    efags;\n  \
  \  long    eax,ecx,ebx;\n    long    esp;\n    long    ebp;\n    long    esi;\n\
  \    long    edi;\n    long    es;         /* 16 high bits zero */\n    long   \
  \ cs;         /* 16 high bits zero */\n    long    ss;         /* 16 high bits zero\
  \ */\n    long    ds;         /* 16 high bits zero */\n    long    fs;         /*\
  \ 16 high bits zero */\n    long    gs;         /* 16 high bits zero */\n    long\
  \    ldt;        /* 16 high bits zero */\n    long    bitmap;   /* trace: 0 */\n\
  \    struct i387_struct i387;\n};\n```这里细节：你发现 `tss` 结构里还有 `cr3` 不？它表示 CPU 这些**寄存器**的信息。![](img/file172.webp\
  \ \"fig:\") 那么指向页表，线性地址到物理地址的映射。也就是说，在我们刚刚的理想情况下，不同程序用不同的内存可以做到。有了这个 `cr3` 字段，就完全不需要建立建立建立映射。这也可以理解为保存内存的上下文。Linux\
  \ 0.11 并不是通过替换 `cr3` 寄存器来实现互的，它的实现更为简单。\n\n### 运行时间信息\n\n如何判断一个进程该让 CPU 切换到下一个进程？总不能每次时钟中断都吧，危险。。一个好的办法就是给进程一个属性叫**剩余时间**，每次时钟来了都减\
  \ 1，如果减到 0，就触发进程的操作。\n\n```\nstruct task_struct {\n    ...\n    long counter;\n\
  \    ...\n    struct tss_struct tss;\n}\n```它的用法也非常简单，每次中断都判断一下是否到 0。\n\n```\nvoid\
  \ do_timer(long cpl) {\n    ...\n    // 当前线程还有剩余时间，直接返回\n    if ((current->counter)>0)\
  \ return;\n    // 若没有剩余时间，调度\n    schedule();\n}\n```如果还没到 0，就直接返回，相当于调度选择下一个进程并使\
  \ CPU 跳转到那里运行。进程调度的逻辑就是在 `schedule` 函数里，怎么调先不管。\n\n### 优先级\n\n上面那个 `counter` 开始的时候是多少？而且随着\
  \ `counter` 不断减，到 0 时，下一轮回中 `counter` 应该赋予什么值？其实 `counter` 的初始化问题也需要有一个属性来记录这个值。\n\
  \n往宏观想一下，这个值越大，那么 `counter` 就越大，每次轮到进程时，在 CPU 中运行的时间就越长，也就是这个进程比其他进程得到了更多 CPU 运行的时间。我们可以把这个值称为**优先级**，是不是很形象。\n\
  \n```\nstruct task_struct {\n    ...\n    long counter;\n    long priority;\n  \
  \  ...\n    struct tss_struct tss;\n}\n```每次进程初始化时，都把 `counter` 赋值为 `priority`，而且当\
  \ `counter` 减为 0 时，下一次分配时间也赋值为 `priority`。反正就叫优先级吧。\n\n### 进程状态\n\n其实有了上面三个信息就可以完成进程调度。甚至如果操作系统让所有进程都得到同样的运行，连\
  \ `counter` 和 `priority` 都不用记录，操作系统定一个固定值一直减，到 0 了切一个新进程。这样仅仅好寄存器的上下文 `tss` 就好了。但我们总要优化以适应不同的用户需求。很简单：一个进程有一个硬盘的操作，发起请求后要等久才能中断，那这个进程在占用\
  \ CPU 时就可以放弃执行权，把自己的状态标记为等待中。这个记录此时的状态叫 `state`。\n\n```\nstruct task_struct {\n\
  \    long state;\n    long counter;\n    long priority;\n    ...\n    struct tss_struct\
  \ tss;\n}\n```这个进程的 `state` 在 Linux 0.11 里有五种：\n\n```\n#define TASK_RUNNING 0\n\
  #define TASK_INTERTIBLE 1\n#define TASK_UNINTERTIBLE 2\n#define TASK_ZOMBIE 3\n\
  #define TASK_STOPPED 4\n```好了，目前这几个字段就可以完成简单的进程调度任务了。有表示状态的 `state`、表示剩余时间的 `counter`、表示优先级的\
  \ `priority` 和表示上下文信息的 `tss`。其他字段我们需要用到的时候再说，今天只是头脑风暴一下进程设计的思路。\n\n看一下 Linux 0.11\
  \ 中进程结构的全部，心里有个数，具体干嘛的先管，记住刚刚头脑风暴的那四个字段就行：\n\n```\nstruct task_struct {\n    /*\
  \ these are hardcoded - don't touch */\n    long state; /* -1 runnable, 0 runnable,\
  \ >0 stopped */\n    long counter;\n    long priority;\n    long signal;\n    struct\
  \ sigaction sigaction[32];\n    long blocked;   /* bitmap of masked signals */\n\
  \    /* various fields */\n    int exit_code;\n    unsigned long start_code,end_code,end_data,brk,start_stack;\n\
  \    long pid,father,pgrp,session,leader;\n    unsigned short uid,euid,suid;\n \
  \   unsigned short gid,egid,sgid;\n    long alarm;\n    long utime,stime,cutime,cstime,start_time;\n\
  \    unsigned short used_math;\n    /* file system info */\n    int tty;       \
  \ /* -1 if no tty, so it must be signed */\n    unsigned short umask;\n    struct\
  \ m_inode *pwd;\n    struct m_inode *root;\n    struct m_inode *executable;\n  \
  \  unsigned long close_on_exec;\n    struct file * filp[NR_OPEN];\n    /* ldt for\
  \ this task 0 - zero 1 - cs 2 - ds&ss */\n    struct desc_struct ldt[3];\n    /*\
  \ tss for this task */\n    struct tss_struct tss;\n};\n```\n\n\n\n\nDo you remember\
  \ that we started the `timer` when we were at [Episode 18 | The famous process scheduling\
  \ starts from here](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c8c2b03d9721ba74e99cfa8&chksm=c2c5b87df5b2316b083015a4fdba2df29211f38fcfd1cdb040e02ab410432608e26383a43ef5&scene=21)?\
  \ This timer sends an interrupt to the CPU at regular intervals.\n\n![](img/file173.gif)\n\
  \nThis interval is set to 10ms, which is 100Hz.\n\n```c\nschedule.c\n#define HZ\
  \ 100\n```\n\nThe triggered interrupt is called the `clock interrupt`, where the\
  \ vector number is set to `0x20`. Do you remember the interrupt handler we set in\
  \ `sched_init` for the clock interrupt?\n\n```c\nschedule.c\nset_intr_gate(0x20,\
  \ &timer_interrupt);\n```\n\nWhen clock interrupt `0x20` arrives, the CPU looks\
  \ up the address at `0x20` in the interrupt table, which is the interrupt handler\
  \ function, and jumps to execute it. This interrupt handler `timer_interrupt` is\
  \ written in assembly language.\n\n```s\nsystem_call.s\n_timer_interrupt:\n    ...\n\
  \    // Increment system ticks\n    incl jiff\n    ...\n    // Call function\n \
  \   call do_timer\n```\n\nThis function does two things: one is incrementing the\
  \ system tick variable `jiff`, and the other is calling another function `do_timer`.\n\
  \n```c\nsched.c\nvoid do_timer(long c) {\n    ...\n    // Current thread still has\
  \ time slice, return directly\n    if (--current->counter) > 0) return;\n    //\
  \ If no time slice, schedule\n    schedule();\n}\n```\n\nThe most important part\
  \ of `do_timer` is this block of code, which is very simple. First, it decrements\
  \ the process's time slice by 1, then checks if the time slice is still greater\
  \ than zero; if so, does nothing; if the time slice is zero, it calls `schedule()`,\
  \ which is the core of process scheduling.\n\n```c\nschedule.c\nvoid schedule()\
  \ {\n    int i, next, c;\n    struct task_struct *p;\n    ...\n    while (1) {\n\
  \        c = -1;\n        next = 0;\n        i = NR_TASKS;\n        p = &task[NR_TASKS];\n\
  \        while (--i) {\n            if (!*p) continue;\n            if ((*p)->state\
  \ == TASK_RUNNING && (*p)->counter > c)\n                c = (*p)->counter, next\
  \ = i;\n        }\n        if (c) break;\n        for (p = &LAST_TASK; p > &FIRST_TASK;\
  \ --p)\n            if (*p)\n                (*p)->counter = ((*p)->counter >> 1)\
  \ + (*p)->priority;\n    }\n    switch_to(next);\n}\n```\n\nDon't be intimidated\
  \ by this large block; I will make an informal simplification, and you'll understand:\n\
  \n```c\nvoid schedule() {\n    int next = get_max_counter_and_runnable_thread();\n\
  \    refresh_all_thread_counter();\n    switch_to(next);\n}\n```\n\nSee, it's that\
  \ simple. This function does three things:\n\n1. Gets the process ID `next` that\
  \ has the maximum remaining time slice (value of `counter`) and is in the `runnable`\
  \ state (`state = 0`).\n\n![](img/file174.gif)\n\n2. If the time slices of all `runnable`\
  \ processes are 0, the `counter` of all processes (not just `runnable` ones) is\
  \ reassigned (`counter = counter/2 + priority`), and step 1 is executed again.\n\
  \n3. Finally, it obtains process ID `next`, calls the `switch_to(next)` method,\
  \ and switches to that process for execution. Looking at the `switch_to` method,\
  \ it is written using inline assembly statements.\n\n```h\nsched.h\n#define switch_to(n)\
  \ { \\\n    struct {long a,b;} __tmp; \\\n    __asm__(\"cmpl %%ecx,_current\\n\\\
  t\" \\\n            \"je 1f\\n\\t\" \\\n            \"movw %%dx,%1\\n\\t\" \\\n\
  \            \"xchgl %%ecx,_current\\n\\t\" \\\n            \"ljmp %0\\n\\t\" \\\
  \n            \"cmpl %%ecx,_last_task_used_math\\n\\t\" \\\n            \"jne 1f\\\
  n\\t\" \\\n            \"clts\\n\" \\\n            \"1:\" \\\n            ::\"m\"\
  \ (*&__tmp.a),\"m\" (*&__tmp.b), \\\n            \"d\" (_TSS(n)),\"c\" ((long) task[n]));\
  \ \\\n}\n```\n\nThis passage is the absolute lowest-level code for process switching.\
  \ It's okay if you don't understand it; it mainly does one thing: `jmp` to the `tss`\
  \ segment of the new process. What does this mean? The CPU dictates that if a `jmp`\
  \ instruction is followed by a `tss` segment, the hardware will save the values\
  \ of current registers into the current process's `tss`, and load the new process's\
  \ `tss` information into the registers.\n\n![](img/file175.webp)\n\nThe image above\
  \ comes from *Linux Kernel Source Correlation*. This diagram is drawn very clearly\
  \ in the book; I will just repeat it. Simply put: save the current process context,\
  \ restore the context of the next process, and jump! Look, the `task_struct` structure\
  \ fields mentioned at the beginning of the previous lecture are all used.\n\n```c\n\
  struct task_struct {\n    long state;\n    long counter;\n    long priority;\n \
  \   ...\n    struct tss tss;\n};\n```\n\nBy here, we have traced the chain of a\
  \ process switch. Recap:\n\nThe chain starts with the culprit: that timer that triggers\
  \ every 10ms. This timer generates a clock interrupt for the CPU. This interrupt\
  \ signal makes the CPU look up the interrupt table and find the interrupt handler\
  \ `do_timer`. `do_timer` first decrements the `counter` variable of the current\
  \ process; if `counter` is still greater than 0, it ends there; if `counter = 0`,\
  \ process scheduling begins. Scheduling is finding all processes in the `RUNNABLE`\
  \ state.\n\n\n\n```\nfn_ptr sys_call_table[] = { sys_setup, sys_exit, sys_fork,\
  \ sys_read,\n  sys_write, sys_open, sys_close, sys_waitpid, sys_creat, sys_link,\n\
  \  sys_unlink, sys_execve, sys_chdir, sys_time, sys_mknod, sys_chmod,\n  sys_chown,\
  \ sys_break, sys_stat, sys_lseek, sys_getpid, sys_mount,\n  sys_umount, sys_setuid,\
  \ sys_getuid, sys_stime, sys_ptrace, sys_alarm,\n  sys_fstat, sys_pause, sys_utime,\
  \ sys_stty, sys_gtty, sys_access,\n  sys_nice, sys_ftime, sys_sync, sys_kill, sys_rename,\
  \ sys_mkdir,\n  sys_rmdir, sys_dup, sys_pipe, sys_times, sys_prof, sys_brk, sys_setgid,\n\
  \  sys_getgid, sys_signal, sys_geteuid, sys_getegid, sys_acct, sys_phys,\n  sys_lock,\
  \ sys_ioctl, sys_fcntl, sys_mpx, sys_setpgid, sys_ulimit,\n  sys_uname, sys_umask,\
  \ sys_chroot, sys_ustat, sys_dup2, sys_getppid,\n  sys_getpgrp, sys_setsid, sys_sigaction,\
  \ sys_sgetmask, sys_ssetmask,\n  sys_setreuid, sys_setregid\n};\n```\n\n看到没，就是各种函数指针组成的一个数组，说白了就是个系统调用函数表。\n\
  \n那下标 2 位置处是啥？从第零项开始数，第二项就是 `sys_fork` 函数！\n\n至此，我们终于找到了 `fork` 函数，通过系统调用这个中断，最终走到内核层面的函数是什么，就是\
  \ `sys_fork`。\n\n```\n_sys_fork:\n    call _find_empty_process\n    testl %eax,%eax\n\
  \    js 1f\n    push %gs\n    pushl %esi\n    pushl %edi\n    pushl %ebp\n    pushl\
  \ %eax\n    call _copy_process\n    addl $20,%esp\n1:  ret\n```\n\n至于这个函数是什么，我们下一讲再说。\n\
