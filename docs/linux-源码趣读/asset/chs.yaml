  [](#cb338-17)    }\n```\n\n然后如上述代码，根据 `cmd` 的 `type` 字段来判断如何执行这个命令。比如最简单的执行，即 `EXEC`。如果命令中有分号\
  \ `;` 是多条命令，那么 `LIST` 拆分成多条命令。如果命令中有竖线 `|` 是管道命令，那么 `PIPE` 拆分成并发的命令，同时通过管道输入端和输出端。这个命令显然是个管道命令。\n\
  \ncat info.txt | wc -l\n\n管道理解起来简单，但是实现却是复杂。所谓管道，上述命令中的 `|`，实现的就是将 `|` 左边的输出（`stdout`）作为\
  \ `|` 右边的输入（`stdin`），就这么简单。那我们看看它是实现的，走到 `runcmd` 方法中的 `PIPE` 分支里，也就是解析出的命令是一个管道时，应该做的。\n\
