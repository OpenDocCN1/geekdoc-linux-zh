  \ 文件，输出它的行数。\n\n我们先从最初始的状态开始说起。\n\n最初始的状态，电脑屏幕前只有这么一段话。\n\n```\n[root@linux0.11]\n\
  ```\n\n然后，我们按下按键 'c'，将会变成这样。\n\n```\n[root@linux0.11] c\n```\n\n我们再按下 'a'。\n\n```\n\
  [root@linux0.11] ca\n```\n\n接下来，我们再依次按下 't'、空格、'i' 等等等，才变成了这样。\n\n```\n[root@linux0.11]\
  \ cat info.txt | wc -l\n```\n\n我们今天就要解释这个看起来十分\"正常\"的过程。\n\n凭什么我们按下键盘后，屏幕上就会出现如此的变化呢？老天爷规定的么？\n\
  \n我们就从按下键盘上的 'c' 键开始说起。\n\n首先，得益于 [第 16 回 | 控制台初始化 tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect)\
  \ 中讲述的一行代码。\n\n```\nconsole.c\nvoid con_init(void) {\n    set_trap(0x21,&keyboard_interrupt);\n\
  }\n```\n\n我们成功将键盘中断绑定在了 `keyboard_interrupt` 这个中断函数上，也就是说当我们按下 'c' 时，CPU 的中断机制将会触发，最终执行到\
  \ `keyboard_interrupt` 函数中。\n\n我们来到 `keyboard_interrupt` 函数探究竟。\n\n```\nkeyboard.s\n\
  keyboard_interrupt:\n    // 读取扫描码\n    in $0x60,%al\n    // 调用对应按键函数\n    call *key_table,%eax\n\
  \    // 0 作为参数，调用 do_tty\n    push $0\n    call do_tty\n```\n\n很简单，首先通过 IO 端口从键盘中读取了刚刚产生的扫描码，就是按下\
  \ 'c' 的时候产生的扫描码。随后，在 `key_table` 中寻找不同按键对应的处理函数，比如普通的一个字母 'c' 的处理函数为 `do_self`，该函数会将扫描码转换为\
  \ ASCII 字符，并将自己放入一个队列里，我们稍后再说部分的细节。\n\n接下来，就是调用 `do_tty_interrupt` 函数，就是处理终端的中断处理，注意这里传递了一个参数\
  \ 0。\n\n```\ntty_io.c\nvoid do_tty_interrupt(int tty) {\n    copy_to_cooked(tty_table+tty);\n\
  }\nvoid copy_to_cooked(struct tty_struct *tty) {\n    ...\n}\n```\n\n这个函数几乎什么都没做，将\
  \ `keyboard_interrupt` 时传入的参数 0 作为 `tty_table` 的索引，找到 `tty_table` 中的第 0 项作为下一个函数的入参，仅此。\n\
  \n`tty_table` 是终端设备表，在 Linux 0.11 中定义了三项，分别是控制台、串行终端 1 和串行终端 2。\n\n```\ntty.h\n\
  struct tty_struct tty_table[] = {\n    {\n        ...},\n        0,          /*\
  \ initial pgrp */\n        0,          /* initial stopped */\n        con_write,\n\
  \        {0,0,0,\"\"},       /* console read-queue */\n        {0,0,0,\"\"},   \
  \    /* console write-queue */\n        {0,0,0,\"\"}        /* console secondary\
  \ queue */\n    },\n    {...},\n    {...}\n};\n```\n\n我们用的往屏幕输出内容的终端，就是 0 号索引处的控制台终端，所以我将另外两个终端定义的代码省略掉了。\n\
  \n`tty_table` 终端设备表中的每一项结构是 `tty_struct`，用来描述一个终端的属性。\n\n```\nstruct tty_struct\
  \ {\n    struct termios termios;\n    int pgrp;\n    int stopped;\n    void (*write)(struct\
  \ tty_struct * tty);\n    struct tty_queue read_q;\n    struct tty_queue write_q;\n\
  \    struct tty_queue secondary;\n};\n\nstruct tty_queue {\n    unsigned long data;\n\
  \    unsigned long head;\n    unsigned long tail;\n    struct task_struct * proc_list;\n\
  \    char buf[TTY_BUF_SIZE];\n};\n```\n\n说说其中关键几个：`termios` 定义了终端的各种模式，包括读模式、写模式、控制模式等；`void\
  \ (*write)(struct tty_struct * tty)` 是一个函数指针，用于实现不同终端的写入操作；`tty_queue` 则是用于缓冲输入输出的队列。\n\
  \n\n\n\n\n按下键盘后，一系列代码将我们的字符放入了 `secondary` 队列中，然后呢？\n\n这就涉及到上层进程调用终端的读函数，将这个字符取走了。\n\
  \n上层经过库函数、文件系统函数等，最终会调用到 `tty_read` 函数，将字符从 `secondary` 队列里取走。\n\n```c\n// tty_io.c\n\
  int tty_read(unsigned channel, char * buf, int nr) {\n    ...\n    GETCH(tty->secondary,c);\n\
  \    ...\n}\n```\n\n取走后要干嘛，那就是上层应用程序去决定的事情了。\n\n假如要写到控制台终端，那上层应用程序又会经过库函数、文件系统函数等层层调用，最终调用到\
  \ `tty_write` 函数。\n\n```c\n// tty_io.\nint tty_write(unsigned channel, char * buf,\
  \ int nr) {\n    ...\n    PUTCH(c,tty->write_q);\n    ...\n    tty->write(tty);\n\
  \    ...\n}\n```\n\n这个函数首先会将字符 `c` 放入 `write_q` 这个队列，然后调用 `tty` 里设定的 `write` 函数。\n\
  \n终端控制台这个 `tty` 我们之前说了，初始化的 `write` 函数是 `con_write`，也就是 `console` 的写函数。\n\n```c\n\
  // console.c\nvoid con_write(struct tty_struct * tty) {\n      ...\n}\n```\n\n这个函数在[第\
  \ 16 回 | 控制台初始化 tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect)\
  \ 提到了，最终会配合显卡，在我们的屏幕上输出我们给出的字符。\n\n![](img/file298.webp \"fig:\")\n\n那我们的图又可以补充了。\n\
  \n![](img/file299.webp \"fig:\")\n\n核心点就是三个队列 `read_q`、`secondary` 以及 `write_q`。\n\
  \n其中 `read_q` 是键盘按下按键后，进入 `keyboard_interrupt` 程序里最终通过 `putch` 函数放入 `read_q` 队列。`secondary`\
  \ 是 `read_q` 队列里的字符，通过 `copy_to_cooked` 函数经过一定的 `termios` 规范处理后，处理后的字符就是“熟”（所以叫\
  \ `cooked`，是不是形象？）。然后进程通过 `tty_read` 从 `secondary` 里读，通过 `tty_write` 写入 `write_q`，最终\
  \ `write_q` 中的字符可以通过 `con_write` 控制台函数打印在显示器上。\n\n这就完成了从键盘输入到显示器的一个循环，也就是本讲述的内容。好了，现在我们已经做到把这样一个字符串并显示在显示器上了。\n\
