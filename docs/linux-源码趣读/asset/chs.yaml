  \ 16 位的实模式转变为之后 32 位的保护模式。\n\n当然，虽说是一项非常难啃的大工程，但从代码量看，却是少得可怜，所以不必太过担心。每次讲这里都十分的麻烦，因为这是\
  \ `x86` 的历史包袱问题，现在的 CPU 几乎都是支持 32 位模式甚至 64 位模式了，很少有还停留在 16 位的实模式下的 CPU。\n\n\n\n\n\
  具体段描述符的细节还有很多，就不展开了，比如这里的高 22 位就表示它是代码段还是数据段。\n\n![](img/file39.webp \"fig:\")\n\
  \n接下来我们看看目前的内存布局，还是别管比例。\n\n![](img/file40.webp \"fig:\")\n\n这里我把 `idtr` 寄存器也画出来了，这个是**中断描述符表**，其原理和全局描述符表一样。全局描述符表是让段选择子去里面寻找段描述符用的，而中断描述符表是用来在发生中断时，CPU\
  \ 拿着中断号去中断描述符表中寻找中断处理程序的地址，找到后就跳到相应的中断程序中去执行，具体我们后面遇到了再说。\n\n好了，今天我们就讲，操作系统设置了个**全局描述符表\
  \ gdt**，为后面切换到**保护模式**后，能去那里寻找到段描述符，然后拼凑成最终的物理地址，就这个作用。当然，还有很多段描述符，作用不仅仅是转换成最终的物理地址，不过这是后话了。\n\
  \n这仅仅是进入保护模式前准备工作的其中一个，后面的路还长着呢。欲知后事如何，且听下回分解。\n\n**------- 本回扩展资料 -------**\n\n\
  保护模式下逻辑地址到线性地址（不开启分页时就是物理地址）的转化，看 Intel 手册：\n\nVolume 3 Chapter 3.4 Logical And\
  \ Linear Addresses\n\n![](img/file41.webp \"fig:\")\n\n段描述符结构和详细说明，看 Intel 手册：\n\
  \nVolume 3 Chapter 3.4.5 Segment Descriptors\n\n![](img/file42.webp \"fig:\")\n\n\
  比如文中说的数据段与代码段的划分，其实还有更细分的权限控制。\n\n![](img/file43.webp \"fig:\")\n\n* * *\n\n###\
  \ 第 7 回 六行代码就进入了保护模式\n\n> 原文链接: [`mp.weixin.qq.com/s/S5zarr9BmLhUHAmdmeNypA`](https://mp.weixin.qq.com/s/S5zarr9BmLhUHAmdmeNypA)\n\
  \n书接上回，上回书咱们说到，操作系统设置了个全局描述符表 `gdt`。\n\n![](img/file44.webp \"fig:\")\n\n为后面切换到保护模式后，能去那里寻找到段描述符，然后拼凑成最终的物理地址。\n\
  \n![](img/file45.webp \"fig:\")\n\n而此时我们的内存布局变成了这个样子。\n\n![](img/file46.webp \"\
  fig:\")\n\n这仅仅是进入保护模式前准备工作的其中一个，我们接着往下看。代码仍然是 `setup.s` 中的。\n\n```\nmov al,#0xD1\
  \        ; command write\nout #0x64,al\nmov al,#0xDF        ; A20 on\nout #0x60,al\n\
  ```\n\n这段代码的意思是，**打开 A20 地址线**。\n\n说人话就是，打开 A20 地址线。哈哈，开玩笑，到底什么是 A20 地址线呢？\n\n简单理解，这一步就是为了突破地址信号线\
  \ 20 位的宽度，变成 32 位可用。这是由于 8086 CPU 只有 20 位的地址线，所以如果程序给出 21 位的内存地址数据，那多出的一位就被忽略了，比如如果经过计算得出一个内存地址为\n\
  \n> 1 0000 00000000 00000000\n\n那实际上内存地址相当于 0，因为高位的那个 1 被忽略了，地方不够。\n\n当 CPU 到了 32\
  \ 位时代之后，由于要考虑**兼容性**，还必须保持一个只能用 20 位地址线的模式，所以如果你不手动开启的话，即使地址线已经有 32 位了，仍然会限制只能使用其中的\
  \ 20 位。\n\n简单吧？我们继续。\n\n接下来的一段代码，你完全完全不用看，但为了防止你一直记挂在心上，我给你截出来说道说道，这样以后我说完全不用看的代码时，你就真的可以放宽心完全不看了。\n\
  \n就是这一大坨，还有 Linus 自己的注释。\n\n```\n; well, that went ok, I hope. Now we have to reprogram\
  \ the interrupts :-(\n; we put them right after the intel-reserved hardware interrupts,\
  \ at\n; int 0x20-0x2F. There they won't mess up anything. Sadly IBM really\n; messed\
  \ this up with the original PC, and they haven't been able to\n; rectify it afterwards.\
  \ Thus the bios puts interrupts at 0x08-0x0f,\n; which is used for the internal\
  \ hardware interrupts as well. We just\n; have to reprogram the 8259's, and it isn't\
  \ fun.\n\n    mov al,#0x11        ; initialization sequence\n    out #0x20,al  \
  \      ; send it to 8259A-1\n    .word   0x00eb,0x00eb       ; jmp $+2, jmp $+2\n\
  \    out #0xA0,al        ; and to 8259A-2\n    .word   0x00eb,0x00eb\n    mov al,#0x20\
  \        ; start of hardware int's (0x20)\n    out #0x21,al\n    .word   0x00eb,0x00eb\n\
  \    mov al,#0x28        ; start of hardware int's (0x20)\n    out #0x21,al\n  \
  \  .word   0x00eb,0x00eb\n    mov al,#0x28        ; start of hardware int's (0x28)\n\
  \    out #0xA1,al\n    .word   0x00eb,0x00eb\n    mov al,#0x04        ; 8259-1 is\
  \ master\n    out #0x21,al\n    .word   0x00eb,0x00eb\n    mov al,#0x02        ;\
  \ 8259-2 is slave\n    out #0xA1,al\n    .word   0x00eb,0x00eb\n    mov al,#0x01\
  \        ; 8086 mode for both\n    out #0x21,al\n    .word   0x00eb,0x00eb\n   \
  \ out #0xA1,al\n    .word   0x00eb,0x00eb\n    mov al,#0xFF        ; mask all interrupts\n\
  \    out #0x21,al\n    .word   0x00eb,0x00eb\n    out #0xA1,al```这里是对**可编程控制器 8259\
  \ 芯片**进行的编程。因为中断号不能冲突，Intel 把 0 到 19 号都保留，比如 0 号中断规定为异常，自定义的中断应该放在这，但是 IBM 在 PC\
  \ 中搞砸了，跟中断号发生了，以后重新编程，不得不做，这是 Linus 在上面的注释。所以我们也不在意，只要重新编程之后，8259 芯片的引脚与中断号对应如下：\n\
  \n| 请求号 | 中断号 | 用途 |\n| --- | --- | --- |\n| --- | --- | --- |\n| IRQ0 | 0x20 |\
  \ 时钟 |\n| IRQ1 | 0x21 | 键盘 |\n| IRQ2 | 0x22 | 接器 |\n| IRQ3 | 0x23 | 串口 2 |\n| IRQ4\
  \ | 0x24 | 串口 1 |\n| IRQ5 | 0x25 | 并口 2 |\n| IRQ6 | 0x26 | 驱动器 |\n| IRQ7 | 0x27\
  \ | 并口 1 |\n| IRQ8 | 0x28 | 实时钟 |\n| IRQ9 | 0x29 | 保留 |\n| IRQ10 | 0x2a | 保留 |\n\
  | IRQ11 | 0x2b | 保留 |\n| IRQ12 | 0x2c | 鼠标 |\n| IRQ13 | 0x2d | 数学处理器 |\n| IRQ14\
  \ | 0x2e | 硬盘 |\n| IRQ15 | 0x2f | 保留 |\n\n好了，接下来的一步，就是切换模式的一步，从代码上看：\n\n```\nmov\
  \ ax,#0x001  ; protected mode (PE)\nlmsw ax      ; This is it;\njmpi 0,8     ; jmp\
  \ offset 0 of segment 8 (cs)\n```\n\n前两行，将`cr0`寄存器的位 0 置 1，从实模式切换到保护模式了。![](img/file47.webp\
  \ \"fig:\")\n\n所以真正的模式切换十分简单，重要的是之前的工作。再往后，又是一个段间跳转 `jmp`，后面的 8 表示`cs`（段寄存器）的值，0\
  \ 表示偏移。请注意，此时已经是保护模式了，之前说过，保护模式下内存寻址方式变，段寄存器里的值当作选择子。回顾下段选择子的模样。![](img/file48.webp\
  \ \"fig:\")\n\n8 用二进制表示就是\n\n> 0000001000\n\n对照上面段选择子的结构，可以知道描述符索引是 1，也就是要去全局描述符表\
  \ `gdt` 中找第一项描述符。还记得上一讲中的全局描述符的具体内容么？\n\n```\ngdt:\n    .word   0,0,0     ; dummy\n\
  \n    .word   0x07FF      ; 8Mb - limit=2047 (2048*4096=8Mb)\n    .word   0x0000\
  \      ; base address=0\n    .word   0x9A00      ; code read/exec\n    .word   0x00C0\
  \      ; granularity=4096, 386\n\n    .word   0x07FF      ; 8Mb - limit=2047 (2048*4096=8Mb)\n\
  \    .word   0x0000      ; base address=0\n    .word   0x9200      ; data read/write\n\
  \    .word   0x00C0      ; granularity=4096, 386\n```\n\n我们说了，第 0 项是空值，第一项被表示代码描述符，是个可读执行的段，第二项为数据描述符，是个可读写段，不过他们的段基址都是\
  \ 0。所以，这里取的就是这个代码描述符，段基址是 0，偏移也是 0，最终跳转指令跳转到内存地址的 0 处执行。0 地址是什么？还是之前的内存布局。![](img/file49.webp\
  \ \"fig:\")\n\n就是操作系统全部代码 `system` 模块，怎么生成的？由 Makefile 可知，是由 `head.s` 和 `main.c`\
  \ 以及其余模块合并来的，可以理解为操作系统的全部代码编译后的结果。\n\n```\ntools/system: boot/head.o init/main.o\n\
  ```\n\n接下来，我们重点阅读 `head.s`。![](img/file50.webp \"fig:\")\n\n这也是 boot 文件夹下的最后一个源代码文件，`sect.s`\
  \ 和 `setup.s`完了，而且是汇编写的代码。`head.s` 这个文件仅仅是为了顺利进入`main.c`做的准备，看完之后我们就可以进入 c 语言的世界！看到熟悉的\
  \ `main` 函数，那里才是操作系统真正操作的地方。\n\n**-------资料-------**\n\n保护模式下逻辑地址到线性地址（不开启分页时就是物理地址）的转化，看\
  \ Intel 手册：\n\nVolume 3 Chapter 3.4 Logical And Linear Addresses\n\n![](img/file51.webp\
  \ \"fig:\")\n\n段描述符结构和详细说明，看 Intel 手册：\n\nVolume 3 Chapter 3.4.5 Segment Descriptors\n\
  \n![](img/file52.webp \"fig:\")\n\n对操作系统如何编译，比如 `system`是怎么来的，尝试一下源码中的 `Makefile`，这个我就不展开了。\n\
  \n### 第 8 回 重新设置 idt 和 gdt\n\n> 原文链接: [`mp.weixin.qq.com/s/ssQKFMehxWT9i6Rtg`](https://mp.weixin.qq.com/s/ssQKFMehxWT9i6Rtg)\n\
  \n书接上回，上回书咱们说到，CPU 进入了 32 位保护模式，快速回顾一下关键的代码。首先配置了全局描述符表 `gdt` 和中断描述符表 `idt`。\n\n\
  ```\nlidt idt_48\nlgdt gdt_48\n```\n\n然后打开 A20 地址线。\n\n```\nmov al,#0xD1       \
  \ ; command write\nout #0x64,al\nmov al,#0xDF        ; A20 on\nout #0x60,al\n```\n\
  \n然后更改 `cr0`寄存器开启保护模式。\n\n```\nmov ax,#0x01\nlmsw ax\n```\n\n最后，一个干脆利落的跳转指令，跳到了内存地址\
  \ 0 处执行。\n\n```\njmpi 0,8\n```\n\n0 处存储着操作系统全部代码，是由 `head.s` 和 `main.c` 以及无数源代码文件链接而成的\
  \ `system`模块。![](img/file53.webp \"fig:\")\n\n接下来，正式进入 c 语言写的`main.c`之前的`head.s`究竟写了点啥？`head.s`文件很短，我们一点点看。\n\
  \n```\n_pg_dir:\n_startup_32:\n    mov eax,0x10\n    mov ds,ax\n    mov es,ax\n\
  \    mov fs,ax\n    mov gs,ax\n    lss esp,_stack_start\n```\n\n\n\n\n```assembly\n\
  setup_idt:\n    lea edx,ignore_int\n    mov eax,00080000h\n    mov ax,dx\n    mov\
  \ dx,8E00h\n    lea edi,_idt\n    mov ecx,256\nrp_sidt:\n    mov [edi],eax\n   \
  \ mov [edi+4],edx\n    add edi,8\n    dec ecx\n    jne rp_sidt\n    lidt fword ptr\
  \ idt_descr\n    ret\n\nidt_descr:\n    dw 256*8-1\n    dd _idt\n\n_idt:\n    DQ\
  \ 256 dup(0)\n```\n\n不用细看，我给你说最终效果。\n\n中断描述符表 `idt` 里面存储着一个个中断描述符，每一个中断号就对应着一个中断描述符。而中断描述符里面存储的主要是中断程序的地址。这样一个中断号过来后，CPU\
  \ 就会自动寻找相应的中断程序，然后去执行它。\n\n那这段程序的作用就是设置了 256 个中断描述符，并且让每一个中断描述符中的中断程序例程都指向一个 `ignore_int`\
  \ 的函数地址。这是一个默认的中断处理程序，之后会逐渐被各个具体的中断程序所覆盖。比如之后键盘模块会将自己的键盘中断处理程序覆盖过去。\n\n那现在，产生任何中断都会指向这个默认的函数\
  \ `ignore_int`，也就是说现在这个阶段你按键盘还不好使。\n\n设置中断描述符表 `setup_idt` 说完了，那接下来 `setup_gdt`\
  \ 就同理了。我们就直接看设置好后的新的全局描述符表长什么样吧？\n\n```\n_gdt:\n    DQ 0000000000000000h    ;/*\
  \ NULL descriptor */\n    DQ 00c09a0000000fffh    ;/* 16Mb */\n    DQ 00c0920000000fffh\
  \    ;/* 16Mb */\n    DQ 0000000000000000h    ;/* TEMPORARY - don't use */\n   \
  \ DQ 252 dup(0)\n```\n\n其实和我们原先设置好的 `gdt` 一模一样。\n\n也是有代码段描述符和数据段描述符，然后第四项系统段描述符并没有用到，不用管。最后还留了\
  \ 252 项的空间，这些空间后面会用来放置任务状态段描述符 `TSS` 和局部描述符 `LDT`，这个后面再说。\n\n![](img/file54.webp\
  \ \"fig:\")\n\n为什么原来已经设置过一遍了，这里又要重新设置一遍？你可千万别想有什么复杂的原因，就是因为原来设置的 `gdt` 是在 `setup`\
  \ 程序中，之后这个地方要被缓冲区覆盖掉，所以这里重新设置在 `head` 程序中。这块内存区域之后就不会被其他程序用到并且覆盖了，就这么个事。\n\n说的口干舌燥，还是来张图吧。\n\
