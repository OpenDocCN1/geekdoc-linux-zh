  fig:\")\n\n### 第 10 回 进入 main 函数前的最后一跃！\n\n> 原文链接: [`mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg`](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
  \n书接上回，上回书咱们说到，我们终于把这些杂七杂杂的 `idt`、`gdt`、页表都设置好了，并且也开启了保护模式，相当于所有苦力活都做好铺垫了，之后我们就要准备进入\
  \ `main.c`！那里是个新世界！\n\n注意不是进入，而是准备进入哦，就差一哆嗦了。\n\n由于上一讲的知识量非常大，所以这一讲将会非常简单，作为进入 `main`\
  \ 函数前的衔接，大家放宽心。\n\n这仍然要回到上一讲我们跳转到设置分页代码的那个地方（`head.s` 里），这里有个骚操作帮我们跳转到 `main.c`。\n\
  \n```\nafter_page_tables:\n    push 0\n    push 0\n    push 0\n    push L6\n   \
  \ push _main\n    jmp setup_paging\nsetup_paging:\n    ...\n    ret\n```\n\n直接解释起来非常简单。\n\
  \n`push` 指令就是**压栈**，五个 `push` 指令过去后，栈会变成这个样子。\n\n![](img/file74.webp \"fig:\")\n\
  \n然后注意，`setup_paging` 最后一个指令是 `ret`，也就是我们上一回讲的设置分页的代码的最后一个指令，形象地说它叫**返回指令**，但 CPU\
  \ 可没有那么聪明，它并不知道该返回到哪里执行，只是很机械地**把栈顶的元素值当做返回地址**，跳转去那里执行。\n\n再具体说是，把 `esp` 寄存器（栈顶地址）所指向的内存处的值，赋值给\
  \ `eip` 寄存器，而 `cs:eip` 就是 CPU 要执行的下一条指令的地址。而此时栈顶刚好是 `main.c` 里写的 `main` 函数的内存地址，是我们刚刚特意压入栈的，所以\
  \ CPU 就理所应当跳过来了。\n\n当然 Intel CPU 是设计了 `call` 和 `ret` 这一配对儿的指令，意为调用函数和返回，具体可以看后面本回扩展资料里的内容。\n\
  \n至于其他压入栈的 `L6` 是用作当 `main` 函数返回时的跳转地址，但由于在操作系统层面的设计上，`main` 是绝对不会返回的，所以也就没用了。而其他的三个压栈的\
  \ `0`，本意是作为 `main` 函数的参数，但实际上似乎也没有用到，所以也不必关心。\n\n总之，经过这一个小小的骚操作，程序终于跳转到 `main.c`\
  \ 这个由 C 语言写就的主函数 `main` 里了！我们先一睹为快一下。\n\n```c\nvoid main(void) {\n    ROOT_DEV =\
  \ ORIG_ROOT_DEV;\n    drive_info = DRIVE_INFO;\n    memory_end = (1<<20) + (EXT_MEM_K<<10);\n\
  \    memory_end &= 0xfffff000;\n    if (memory_end > 16*1024*1024)\n        memory_end\
  \ = 16*1024*1024;\n    if (memory_end > 12*1024*1024) \n        buffer_memory_end\
  \ = 4*1024*1024;\n    else if (memory_end > 6*1024*1024)\n        buffer_memory_end\
  \ = 2*1024*1024;\n    else\n        buffer_memory_end = 1*1024*1024;\n    main_memory_start\
  \ = buffer_memory_end;\n    mem_init(main_memory_start,memory_end);\n    trap_init();\n\
  \    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n    time_init();\n \
  \   sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n\
  \    sti();\n    move_to_user_mode();\n    if (!fork()) {\n        init();\n   \
  \ }\n    for(;;) pause();\n}\n```\n\n没错，这就是这个 `main` 函数的全部了。\n\n而整个操作系统也会最终停留在最后一行死循环中，永不返回，直到关机。\n\
  \n好了，至此，整个第一部分就圆满结束了，为了跳进 `main` 函数的准备工作，我称之为进入内核前的苦力活，就完成了！我们看看我们做了什么。\n\n![](img/file75.webp\
  \ \"fig:\")\n\n我把这些称为**进入内核前的苦力活**，经过这样的流程，内存被搞成了这个样子。\n\n![](img/file76.webp \"\
