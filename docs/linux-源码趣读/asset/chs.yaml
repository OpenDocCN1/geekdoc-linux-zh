  \ 系列文章的第 13 回。\n\n为了让不追更系列的读者也能很方便阅读并学到东西，我把它改造成了单独的不依赖系列上下文的文章，具体原因可以看 [坚持不下去了...](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500082&idx=1&sn=7a5b6b3e5fe1106297928196c085a50f&chksm=c2c5bb9ff5b23289d0f55888df604e21641b36759533cf510b00f7d7c27e3ebccb97121bb8a1&scene=21#wechat_redirect)\n\
  \n点击下方的**阅读原文**可以跳转到本系列的 GitHub 页，那里也有完整目录和规划，以及一些辅助的资料，欢迎提出各种问题。\n\n* *\n\n## 第\
  \ 14 回 中断初始化 trap_init\n\n> 原文链接: [`mp.weixin.qq.com/s/sFp_388qRncB-jpJeRzCGQ`](https://mp.weixin.qq.com/s/sFp_388qRncB-jpJeRzCGQ)\n\
  \n当你的计算机刚刚启动时，你按下键盘是不生效的，但是过了一段时间后，再按下键盘就有效果了。\n\n![](img/file96.gif \"fig:\")\n\
  \n那我们今天就来刨根问底一下，**到底过了多久之后，按下键盘才有效果呢？**\n\n当然首先你得知道，按下键盘后会触发中断，CPU 收到你的键盘中断后，根据中断号，寻找由操作系统写好的键盘中断处理程序。\n\
  \n中断的原理和过程不了解的，可以看我的文章，[认认真真的聊聊中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247498208&idx=1&sn=b784f8b4e627ebd1bfb9810d194fdb80&chksm=c2c5834df5b20a5bdee331002bfc61c90eb468da325bf67abeef780c303a9f51c8543e1a5981&scene=21#wechat_redirect)\n\
  \n这个中断处理程序会把你的键盘码放入一个队列中，由相应的用户程序或内核程序读取，并显示在控制台，或者其他用途，这就代表你的键盘生效了。\n\n不过放宽心，我们不展开讲这个中断处理程序以及用户程序读取键盘码后的处理细节，我们把关注点放在，究竟是**“什么时候”**，按下键盘才会有这个效果。\n\
  \n我们以 `Linux 0.11` 源码为例，发现进入内核 `main` 函数后，有这样一行。\n\n```c\nvoid main(void) {\n  \
  \  ...\n    trap_init();\n    ...\n}\n```\n\n看到这个方法的全部代码后，你可能会一笑，也一脸懵逼。\n\n```c\n\
  void trap_init() {\n    int i;\n    set_trap_gate(0,&divide_error);\n    set_trap_gate(1,&debug);\n\
  \    set_trap_gate(2,&mi);\n    set_system_gate(3,&int3);   /* int3 can be called\
  \ from all */\n    set_system_gate(4,&overflow);\n    set_system_gate(5,&bounds);\n\
  \    set_trap_gate(6,&invalid_op);\n    set_trap_gate(7,&device_not_available);\n\
  \    set_trap_gate(8,&double_fault);\n    set_trap_gate(9,&coprocessor_run);\n \
  \   set_trap_gate(10,&TSS);\n    set_trap_gate(11,&segment_not_present);\n    set_trap_gate(12,&segment);\n\
  \    set_trap_gate(13,&general_protection);\n    set_trap_gate(14,&page_fault);\n\
  \    set_trap_gate(15,&reserved);\n    set_trap_gate(16,&coprocessor_error);\n \
  \   for (i=17;i<48;i++)\n        set_trap_gate(i,&reserved);\n    set_trap_gate(45,&irq3);\n\
  \    set_trap_gate(39,&parallel_interrupt);\n}\n```\n\n这啥玩意？这么多 `set_xxx_gate`。\n\
  \n如果有密集恐惧症，绝对看不下去这段代码，所以我给他简化一下。去掉相同功能的。\n\n```c\nvoid trap_init() {\n    int i;\n\
  \    // set 了一堆 trap_gate\n    set_trap_gate(0,&divide_error);\n    ...\n    //\
  \ set 了一堆 system_gate\n    set_system_gate(45,&bounds);\n    ...\n    // 批量 set\
  \ 了一堆 trap_gate\n    for (i=17;i<48;i++)\n        set_trap_gate(i,&reserved);\n\
  \    ...\n}\n```\n\n这就简单多了，一块看。首先看 `set_trap_gate` 和 `set_system_gate` 这俩货，发现了几个宏定义。\n\
  \n```c\n#define _set_gate(gate,type,pl,addr) \\\n    __asm__ ( \\\n        \"movw\
  \ %dx,%%ax\\n\\t\" \\\n        \"movw %0,%%dx\\n\\t\" \\\n        \"movl %1,%%ax\\\
  n\\t\" \\\n        \"movl %2,%%x\\n\\t\" \\\n        \"orl (type<<8),%%ax\\n\\t\"\
  \ \\\n        \"orl (pl<<12),%%ax\\n\\t\" \\\n        \"movl %%ax,(gate)+(addr)\\\
  n\\t\" \\\n        : \\\n        : \"a\" (addr), \"0\" (gate), \"1\" (type), \"\
  2\" (pl) \\\n    )\n\n#define set_trap_gate(n,handler) _set_gate(idt,handler,0,n)\n\
  #define set_system_gate(n,handler) _set_gate(idt,handler,3,n)\n```\n\n别怕，我也看不懂。不过这俩最终指向相同的宏定义\
  \ `_set_gate`，说明是有共性的。我直接说吧，那段完全看不懂的代码是将汇编嵌入到 c 语言了，这种内联汇编格式非常恶心，所以我也不想懂，最终的效果是在中断表中插入了一个。中断表还记得\
  \ `idt`。\n\n![](img/file97.webp \"fig:\")\n\n这段代码就是往 `idt` 表里一项写东西，其中中断号就是第一个参数，中断程序就是第二个参数。产生的效果就是，之后如果来中断，CPU\
  \ 根据中断号，就可以到中找到中断程序了。比如：\n\n```c\nset_trap_gate(0,&divide_error);\n```\n\n设置 0 号中断，对应的中断程序是\
  \ `divide_error`。等 CPU 执行了一条指令的时候，会硬件层面发起 号异常，然后执行操作系统定义的 `divide_error`，执行完之后返回。再比如：\n\
  \n```c\nset_system_gate(5,&overflow);\n```\n\n设置 5 号中断，对应的中断程序是 `overflow`。`trap`\
  \ 与 `system` 的区别在于，设置的中权级不同，前者是 0（内核态），后者是 3（用户态），这块展开是非常严谨的、复杂的特权知识，不明白的话不用管，就理解为都是设置一个中断号和中断程序的对应。再往后看，批量操作。\n\
  \n```c\nvoid trap_init() {\n    ...\n    for (i=17;i<48;i++)\n        set_trap_gate(i,&reserved);\n\
  \    ...\n}\n```\n\n17 到 48 号中断都批量设置为 `reserved` 函数，这是暂时的，后面各个初始化要重新设置好中断，把暂时的覆盖掉，此时留个印象。所以整段代码执行下来，内存中\
  \ `idt` 的位置会变成如下。\n\n![](img/file98.webp \"fig:\")\n\n好了，我们看到了中断号与中断程序对应的地方，那代码过去后，键盘好使么？NO。产生产生号是\
  \ `0x21`，此时还对应着一个临中断程序 `reserved`，我们接着往后看。在这代码后几行，还有一行代码。\n\n```c\nvoid main(void)\
  \ {\n    ...\n    trap_init();\n    ...\n    tty_init();\n    ...\n    sti();\n\
  \    ...\n}\n```\n\n`sti` 最终会对应一个同名的汇编指令 `sti`。\n\n```c\nvoid tty_init() {\n   \
  \ rs_init();\n    con_init();\n}\n\nvoid con_init(void) {\n    ...\n    set_trap_gate(0x21,&keyboard_interrupt);\n\
  \    ...\n}\n```\n\n我省略了大量的代码，只保留了我们关心的。注意到 `trap_init` 后有个 `tty_init`，最后根据调用链，会调用到一行添加\
  \ 0x21 号中断处理程序的代码，就是刚刚熟悉的 `set_trap_gate`。而后面的 `keyboard_interrupt` 根据名字也可以猜出，就是键盘的中断处理程序嘛！好了，我们终于找到答案，就是从这一行代码开始，我们的键盘生效了！没错，还有点小问题，不过重要，就是我们现在的中断处于禁用状态，不论键盘中断还是其他中断，通通都不好使。而\
  \ `main` 方法继续往下读，还有一行这个东西。\n\n```c\nvoid main(void) {\n    ...\n    trap_init();\n\
  \    ...\n    tty_init();\n    ...\n    sti();\n    ...\n}\n```\n\n\n\n\n\n把读出来的数据放到内存，就涉及到内存中缓冲区的管理。\n\
  \n上面说的每一件事，都是一个十分庞大的体系，我们今天的文章一个都不展开讲，哈哈。\n\n我们就讲讲，读取块设备与内存缓冲区之间的桥梁，**块设备请求项**的初始化工作。\n\
  \n我们以 Linux 0.11 源码为例，发现进入内核的 `main` 函数后不久，有这样一行代码。\n\n```\nvoid main(void) {\n\
  \    ...\n    blk_dev_init();\n    ...\n}\n```\n\n看到这个方法的全部代码后，你可能会会心一笑，也可能一脸懵逼。\n\
  \n```\nvoid blk_dev_init(void) {\n    int i;\n    for (i=0; i<32; i++) {\n     \
  \   request[i].dev = -1;\n        request[i].next = NULL;\n    }\n}\n```\n\n这也太简单了吧？\n\
  \n就是给 `request` 这个数组的前 32 个元素的两个变量 `dev` 和 `next` 附上值，看这俩值 `-1` 和 `NULL` 也可以大概猜出，这是没有任何作用时的初始化值。\n\
  \n我们看下 `request` 结构体。\n\n```\n/*\n * Ok, this is an expanded form so that we can\
  \ use the same\n * request for paging requests when that is implemented. In\n *\
  \ paging, 'bh' is NULL, and 'waiting' is used to wait for\n * read/write completion.\n\
  \ */\nstruct request {\n    int dev;        /* -1 if no request */\n    int cmd;\
  \        /* READ or WRITE */\n    int errors;\n    unsigned long sector;\n    unsigned\
  \ long nr_sectors;\n    char * buffer;\n    struct task_struct * waiting;\n    struct\
  \ buffer_head * bh;\n    struct request * next;\n};\n```\n\n注释也附上了。\n\n哎哟，这就有点头大了，刚刚的函数虽然很短，但看到这个结构体我们知道了，重点在这呢。这也侧面说明了，学习操作系统，其实把遇到的重要数据结构牢记心中，就已经成功一半了。比如主内存管理结构\
  \ `mem_map`，知道它的数据结构是什么样子，其功能也基本就懂了。\n\n收，继续说这个 `request` 结构，这个结构就代表了一次读盘请求，其中：\n\
  \n- `dev` 表示设备号，-1 就表示空闲。\n- `cmd` 表示命令，其实就是 READ 还是 WRITE，也就表示本次操作是读还是写。\n- `errors`\
  \ 表示操作时产生的错误次数。\n- `sector` 表示起始扇区。\n- `nr_sectors` 表示扇区数。\n- `buffer` 表示数据缓冲区，也就是读盘之后的数据放在内存中的什么位置。\n\
  - `waiting` 是个 `task_struct` 结构，这可以表示一个进程，也就表示是哪个进程发起了这个请求。\n- `bh` 是缓冲区头指针，这个后面讲完缓冲区就懂了，因为这个\
  \ `request` 是需要与缓冲区挂钩的。\n- `next` 指向了下一个请求项。\n\n这里有的变量看不懂没关系。不过我们倒是可以基于现有的重点参数猜测一下，比如读请求时，`cmd`\
  \ 就是 READ，`sector` 和 `nr_sectors` 这俩就定位了所要读取的块设备（可以简单先理解为硬盘）的哪几个扇区，`buffer` 就定位了这些数据读完之后放在内存的什么位置。\n\
  \n这就够啦，想想看，这四个参数是不是就能完整描述了一个读取硬盘的需求了？而且完全没有歧义，就像下面这样。\n\n![](img/file100.webp \"\
  fig:\")\n\n而其他的参数，肯定是为了更好地配合操作系统进行读写块设备操作嘛，为了把多个读写块设备请求很好地组织起来。这个组织不但要有这个数据结构中 `bh`\
  \ 和 `next` 等变量的配合，还要有后面的电梯调度算法的配合，仅此而已，先点到为止。\n\n总之，我们这里就先明白，这个 `request` 结构可以完整描述一个读盘操作。然后那个\
  \ `request` 数组就是把它们都放在一起，并且它们又通过 `next` 指针串成链表。\n\n![](img/file101.webp \"fig:\"\
  )\n\n好，本文讲述的两行代码，其实就完成了上图所示的工作而已。但讲到这就结束的话，很多同学可能会不太甘心，那我就简单展望一下，后面读盘的全流程中，是怎么用到刚刚初始化的这个\
  \ `request[32]` 结构的。\n\n读操作的系统调用函数是 `sys_read`，源代码很长，我给简化一下，仅仅保留读取普通文件的分支，就是如下的样子。\n\
  \n```\nint sys_read(unsigned int fd, char * buf, int count) {\n    struct file *\
  \ file = current->filp[fd];\n    struct m_inode * inode = file->f_inode;\n    //\
  \ 校验 buf 区域的内存\n    verify_area(buf,count);\n    // 仅目录或普通文件\n    return file_read(inode,file,count);\n\
  }\n```\n\n看，入参 `fd` 是文件符，可以通过找到一个 `inode`，进而找到文件在硬盘中的位置。\n\n![](img/file102.webp\
  \ \"fig:\")\n\n另外入参 `buf` 就是复制到的内存中的位置，`count` 就是复制多少字节，很好理解。钻到 `file_read` 函数里继续看。\n\
  \n```\nint file_read(struct m_inode * inode, struct file * filp, char * buf, int\
  \ count) {\n    int left,nr;\n    struct buffer_head * bh;\n    left = count;\n\
  \    while (left) {\n        if (nr = bmap(inode,(filp->f_pos)/BLOCK_SIZE)) {\n\
  \            if (!(bh=bread(inode->i_dev,nr)))\n                break;\n       \
  \ } else\n            bh = NULL;\n        }\n        nr = filp->f_pos % BLOCK_SIZE;\n\
  \        chars = MIN( BLOCK_SIZE-nr, left );\n        filp->f_pos += chars;\n  \
  \      left -= chars;\n        if (bh) {\n            char * p = bh->b_data;\n \
  \           while (chars-->0)\n                put_fs_byte(p++),buf++);\n      \
  \      brelse(bh);\n        } else {\n            while (chars-->0)\n          \
  \      put_fs_byte(0,buf++);\n        }\n    }\n    inode->atime = CURRENT_TIME;\n\
  \    return (count-left)?(count-left):-ERROR;}\n\n整体看，就是一个 `while` 循环，每次读入一个块的数据，直到入参的大小读完为止。直接看\
  \ `bread` 那一行。\n\n```\nint file_read(struct m_inode * inode, struct file * filp,\
  \ char * buf, int count) {\n    ...\n    while (left) {\n        ...\n        if\
  \ (!(bh=bread(inode->i_dev,nr)))\n    }\n```\n\n这个函数就是去读某一个设备的某一个块的内容，展开进去。\n\n\
  ```\nstruct buffer_head * bread(int dev,int block) {\n    struct buffer_head * bh\
  \ = getblk(dev,block);\n    if (bh->atime)\n        return bh;\n    ll_rw_block(READ,bh);\n\
  \    wait_on_buffer(bh);\n    if (bh->atime)\n        return bh;\n    brelse(bh);\n\
  \    return NULL;}\n```\n\n其中 `getblk` 先申请了一个内存中的缓冲块，然后 `ll_rw_block` 负责把数据读入这个块，进去看。\n\
  \n```\nvoid ll_rw_block(int rw, struct buffer_head * bh) {\n    ...\n    make_request(major,rw,bh);\n\
  }\n\nstatic void make_request(int major,int rw, struct buffer_head * bh) {\n   \
  \ ...\n    if (rw == READ)\n        req = request+NR_REQUEST;\n    else\n      \
  \  req = request+((NR_REQUEST)/3);\n    /* find an empty request */\n    while (--req\
  \ >= request)\n        if (req->dev<0)\n            break;\n    /* fill up request-info,\
  \ and add it to queue */\n    req->dev = bh->b_dev;\n    req->cmd = rw;\n    req->errors=0;\n\
  \    req->sector = bh->b_block<<1;\n    req->nr_sectors = 2;\n    req->buffer =\
  \ bh->b_data;\n    req->waiting = NULL;\n    req->bh = bh;\n    req->next = NULL;\n\
  \    add_request(major+blk_dev,req);\n}\n```\n\n看，这里用到了刚刚说的结构。具体来说就是该函数往设备的请求项表\
  \ `request[32]` 中添加请求项，只要 `request[32]` 中未处理的请求项存在，都会陆续被处理，直到请求项表为空。具体怎么读盘，就是与硬盘端口交互的过程，可以继续往里看到\
  \ `hd_out` 函数为止，本讲不展开。具体读盘操作，后面会有详细的章节讲解，本讲你只需要我们在 `main` 函数的 `init` 系列函数中，通过 `blk_dev_init`\
  \ 为后面的设备提前建立了一个数据结构，作为访问块设备和内存缓冲区之间的桥梁就可以了。\n\n本文可以当作你你源码系列文章的 15。为了让不追系列的读者也能方便阅读并学到东西，我把它造成了单独的不依赖上下文的文章，具体原因可以坚持不下去了...点击下方的原文可以跳转到本系列的\
  \ GitHub 页，那里也有完整目录和规划，以及一些辅助的资料，欢迎提出各种问题。\n\n## 第 16 回 控制台初始化 tty_init\n\n原文链接:\
