  \n接下来的工作就是解析它，本质上按照指定的数据结构来解读\n\n```c\nexec.c\nint do_execve(...) {\n    ... \n\
  \    struct exec ex = *((struct exec *)bh->b_data);\n    ...\n}\n```\n先从刚刚读取文件返回的缓冲区指针取出数据，也就是文件前\
  \ 1024 个字节，还是一段二进制数据。然后按照 `exec` 这个结构体进行解析，它便有了生命。\n\n```c\nstruct exec {\n    //\
  \ 魔数\n    unsigned long a_magic;\n    // 代码长度\n    unsigned long a_text;\n    //\
  \ 数据长度\n    unsigned long a_data;\n    // 未初始化数据长度\n    unsigned long a_bss;\n \
  \   // 符号表长度\n    unsigned long a_sym;\n    // 执行地址\n    unsigned long a_entry;\n\
  \    // 代码重定位长度\n    unsigned long a_trsize;\n    // 数据重定位长度\n    unsigned long\
  \ a_drsize;\n};\n```\n上面的代码就是 `exec` 结构体，这是格式头部。现在的 Linux 已经弃用了这种老的格式改用 ELF 格式了，但大体的思想是一致的。这个结构体里的字段表示什么，等我们用到了再说，你可以通过注释体会。\n\
  \n### 判断是脚本文件还是可执行文件\n\n我们写一个 Linux 脚本的时候，通常可以看到前面有很多\n\n```\n#!/bin/sh\n#!/usr/bin/python\n\
  ```\n有没有想过我们可以直接执行这样的文件？其实逻辑就在下面代码里。\n\n```c\n// exec.c\nint do_execve(...) {\n\
  \    ...\n    if ((bh->b_data[0] == '#') && (bh->b_data[1] == '!')) {\n        ...\n\
  \    }\n    bre(bh);\n    ...\n}\n```\n可以看到，很简单粗暴地判断前面两个字符是不是 `#!`，如果是的话就走脚本执行逻辑。当然，我们现在的\
  \ `/bin/sh` 是个可执行二进制文件，不符合这样的条件，所以这个 `if` 语句里面的内容也可以不看了，直接看外面执行可执行二进制文件的逻辑。第一步就是释放缓冲区，因为已经把这个块内容解析成\
  \ `exec` 结构保存到我们程序的栈里了，那么这个缓冲区就可以释放，用于其他读取时的缓冲区。不重要，我们继续往下。\n\n### 准备参数空间\n\n我们执行\
  \ `/bin/sh` 时，还给它传了 `argc` 和 `envp` 参数，通过下面这一系列代码来实现。\n\n```c\n#define PAGE_SIZE\
  \ 4096\n#define MAX_ARG_PAGES 32\n// exec.c\nint do_execve(...) {\n    ...\n   \
  \ // p = 0x1FFFC = 128K - 4\n    unsigned long p = PAGE_SIZE * MAX_ARG_PAGES - 4;\n\
  \    ...\n    // p = 0x1FFF5 = 128K - 4 - 7\n    p = copy_strings(envc,envp,page,0);\n\
  \    // p = 0x1FFED = 128K - 4 - 7 - 8\n    p = copy_strings(argc,argv,page,0);\n\
  \    ...\n    // p = 0x3FFFFED = 64M - 4 - 7 - 8\n    p += change_ldt(ex.a_text,page);\n\
  \    // 设置栈\n    eip[0] = ex.a_entry;\n    eip[3] = p;\n}\n```\n\n\n\n\n\n```\n\
  // exec.c\nint do_execve(...) {\n    ...\n    // 设置栈指针\n    eip[3] = p;\n}\n```\n\
  \n为什么这样操作就可以达到更换栈顶指针的作用呢？那我们结合着更换代码指针 `PC` 来进行讲解。\n\n### 设置 eip 和 esp，完成摇身一变\n\n\
  下面这两行就是 `execve` 完成摇身一变的关键，解释了它为什么能做到变成一个新程序开始执行的关键密码。\n\n```c\n// exec.c\nint do_execve(unsigned\
  \ long * eip, ...) {\n    ...\n    eip[0] = ex.a_entry;\n    eip[3] = p; \n    ...\n\
  }\n```\n\n什么叫一个新程序开始执行呢？\n\n其实本质上就是，代码指针 `eip` 和栈指针 `esp` 指向了一个新的地方。\n\n代码指针 `eip`\
  \ 决定了 CPU 将执行哪一段指令，栈指针 `esp` 决定了 CPU 压栈操作的位置，以及读取栈空间数据的位置，在高级语言视角下就是局部变量以及函数调用链的栈帧。\n\
  \n所以这两行代码，第一行重新设置了代码指针 `eip` 的值，指向 `/bin/sh` 这个 `a.out` 格式文件的头结构 `exec` 中的 `a_entry`\
  \ 字段，表示该程序的入口地址。\n\n第二行重新设置了栈指针 `esp` 的值，指向了我们经过一路计算得到的 `p`，也就是图中 `sp` 的值。将这个值作为新的栈顶十分合理。\n\
  \n![](img/file256.png \"fig:\")\n\n`eip` 和 `esp` 都设置好了，那么程序摇身一变的工作自然就结束了，非常简单。\n\
  \n至于为什么往 `eip` 的 0 和 3 索引位置处写入数据，就可以达到替换 `eip` 和 `esp` 的目的，那我们就得看看这个 `eip` 变量是怎么来的了。\n\
  \n### 计算机的世界没有魔法\n\n还记得 `execve` 的调用链么？\n\n```c\nstatic char * argv_rc[] = { \"\
  /bin/sh\", NULL };\nstatic char * envp_rc[] = { \"HOME=/\", NULL };\n\n// 调用方\n\
  execve(\"/bin/sh\",argv_rc,envp_rc);\n\n// 宏定义\n_syscall3(int,execve,const char\
  \ *,file,char **,argv,char **,envp)\n\n// 通过系统调用进入到这里\nEIP = 0x1C\n_sys_execve:\n\
  \    lea EIP(%esp),%eax\n    pushl %eax\n    call _do_execve\n    addl $4,%esp\n\
  \    ret\n\n// exec.c\nint do_execve(unsigned long * eip, ...) {\n    ...\n    eip[0]\
  \ = ex.a_entry;\n    eip[3] = p; \n    ...\n}\n```\n\n千万别忘了，我们这个 `do_execve` 函数，是通过一开始的\
  \ `execve` 函数触发了系统调用来到的这里。\n\n系统调用是一种中断，前面说过，中断时 CPU 会给栈空间里压入一定的信息，这部分信息是死的，查手册可以查得到。\n\
  \n![](img/file257.webp \"fig:\")\n\n然后，进入中断以后，通过系统调用查表进入到 `_sys_execve` 这里。\n\n\
  ```asm\nEIP = 0x1C\n_sys_execve:\n    lea EIP(%esp),%eax\n    pushl %eax\n    call\
  \ _do_execve\n    addl $4,%esp\n    ret\n```\n\n看到没？在真正调用 `do_execve` 函数时，`_sys_execve`\
  \ 这段代码偷偷地插入了一个小步骤，就是把当前栈顶指针 `esp` 偏移到 `EIP` 处的地址值给当做第一个参数 `unsigned long * eip`\
  \ 传入进来了。\n\n而偏移 `EIP` 处的位置，恰好就是中断时压入的 `EIP` 值。所以 `eip[0]` 表示栈空间里的 `EIP` 位置，`eip[3]`\
  \ 表示栈空间里的 `ESP` 位置。\n\n![](img/file258.webp \"fig:\")\n\n由于我们现在处于中断，所以中断返回后也就是 `do_execve`\
  \ 函数之后就会寻找中断返回前的几个值（包括 `eip` 和 `esp`）进行恢复。这里有疑惑的同学，看我之前写的[中断](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a)和[中断（软）](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a)这两篇文章，我认为把中断的原理彻底清楚了，不过就是读手册罢了。如果我们把栈空间里的\
  \ `eip` 和 `esp` 替换成 `/bin/sh` 需要 `eip` 和 `esp`，那么中断返回的“恢复”工作犹如“跳转”到一个新一样，其实是我们欺骗了\
  \ CPU，达到了 `execve` 函数的效果。所以，计算机的世界没有魔法，通过这一点完成的，大部分人都不花时间去究。\n\n### 总结\n\n本章讲解了我\
  \ Linux 0.11 里面难理解 `execve` 函数的核心逻辑，顺下来发现它完成的事情也是简单拼凑起来的。把代码从哪里执行的 `eip` 和新的栈空间里的\
  \ `esp` 给弄好，`/bin/sh` 文件是怎么构造出来的那就是 `gcc` 编译和链接的事，而且 Linux 0.11 所用的执行文件 `a.out`\
  \ 已经被现在的 `ELF` 格式取代，那就不要在研究的范畴，不然就休止了。OK，至此，`execve` 函数就结束了。\n\n```c\nvoid init(void)\
  \ {\n    ...\n    if (!(pid=fork())) {\n        close(0);\n        open(\"/etc/rc\"\
  ,O_RDONLY,0);\n        execve(\"/bin/sh\",argv_rc,envp_rc);\n        _exit(2);\n\
  \    }\n    ...\n}\n```\n\n它的返回意味着接下来将执行 `/bin/sh` 这个执行文件。不过有两个问题：第一，`/bin/sh` 是躺在磁盘里的执行文件，并不是\
  \ Linux 内核的代码，所以我们在 Linux 0.11 源码里找不到。也就是说如果磁盘并没有 `/bin/sh` 文件，Linux 0.11 是启动不起来的在\
  \ `open` 的时候就会报错。第二，我们只将 `/bin/sh` 文件的头部加载到了内存，其他部分并没有加载，那接下来跳转到一个并没有加载 `/bin/sh`\
  \ 代码的内存时，会发生什么？\n\n带着这两个疑问，期待后续的章节吧！\n\n***\n\n## 第 36 回 | 缺页中断\n\n> 原文链接：`mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a&scene=21#wechat_redirect)接上回，咱们说到进程\
  \ 2 通过 `execve` 函数将自己摇身一变成为 `/bin/sh` 程序，也就是 `shell` 程序开始执行。\n\n```c\n// main.c\n\
  void init(void) {\n    ...\n    if (!(pid=fork())) {\n        close(0);\n      \
  \  open(\"/etc/rc\",O_RDONLY,0);\n        execve(\"/bin/sh\",argv_rc,envp_rc);\n\
  \        _exit(2);\n    }\n    ...\n}\n```\n\n那么此时进程 2 就是 `shell` 程序了。进一步讲，相当于之前的进程\
  \ 1 通过 `fork + execve` 这两个函数的组合创建了一个进程去加载并执行 `shell` 程序。我们在 Linux 里执行一个程序，比如 `./xxx`，其内部实现都是\
  \ `fork + execve`。此时我们仅仅通过 `execve` 使得下一条指令执行到 `/bin/sh` 程序所在的内存起始处，也就是 `/bin/sh`\
  \ 头部结构中 `a_entry` 所描述的地址。有个问题是，我们仅仅将 `/bin/sh` 文件的头部加载到了内存，其他部分并没有加载，那我们是怎么执行到的\
  \ `/bin/sh` 的指令呢？\n\n![`我们就带着这个问题，开始探索。### 跳转到一个不存在的地址会发生什么`/bin/sh` 文件并不是 Linux\
  \ 0.11 源码里的内容，Linux 0.11 只按照 `a.out` 格式解读它，跳转到 `a.out` 头部数据结构 `a_entry` 所指向的内存地址去指令。所以这个\
  \ `a_entry` 的值，完全取决于硬盘中 `/bin/sh` 文件是怎么构造的。我们简单点，假设它为 `0`，表示随后的 CPU 将跳转到 0 地址处执行。当然，这个\
  \ `0` 仅仅表示逻辑地址，既没有分段，也没有分页。之前说过无数次，Linux 0.11 的每个进程是通过不同的描述符在线性空间中瓜分不同的空间，一个进程占\
  \ 64M。![](img/file260.webp \"fig:\")\n\n由于我们现在所处的代码属于进程 2，所以逻辑地址 0 通过分段机制映射到线性空间就是\
  \ `0x800000`，表示 `128M` 位置处。好，`128M` 这个线性地址，随后将会通过分页机制的映射转化为物理地址，这才定位到最终的物理内存。可是，`128M`\
  \ 这个线性地址并没有页表映射，也就是上面说的，除了 `/bin/sh` 文件的加载到了内存外，其他部分并没有加载操作。\n\n**再准确说，是 0x80000\
  \ 这个线性地址的访问，遇到了页表存在 P 等于 0 的情况。**\n\n一旦遇到了这种情况，CPU 会触发一个中断：页错误（Page-Fault），这在 Intel\
  \ 手册 Volume-3 Chapter 4.7 章节里给出了这个信息。\n\n![](img/file261.webp \"fig:\")\n\n当然，Page-Fault\
  \ 在很多情况都会触发，具体是因为什么触发的，CPU 会帮我们保存在中断的出码 `Error Code` 里，这在随后的 Figure 4-12 中给出了详细的出错说明。\n\
  \n![](img/file262.webp \"fig:\")\n\n\n\n\n\n```c\n// memory.c\n// address 缺页产生的线性地址\
  \ 0x8000000\nvoid do_no_page(unsigned long error_code,unsigned long address) {\n\
  \    int nr[4];\n    unsigned long tmp;\n    unsigned long page;\n    int block,i;\n\
  \n    address &= 0xfffff000;\n    tmp = address - current->start_code;\n    if (!current->executable\
  \ || tmp >= current->end_data) {\n        get_empty_page(address);\n        return;\n\
  \    }\n    if (share_page(tmp))\n        return;\n    if (!(page = get_free_page()))\n\
  \        oom();\n    /* remember that 1 block is used for header */\n    block =\
  \ 1 + tmp/BLOCK_SIZE;\n    for (i=0 ; i<4 ; block++,i++)\n        nr[i] = bmap(current->executable,block);\n\
  \    bread_page(page,current->executable->i_dev,nr);\n    i = tmp + 4096 - current->end_data;\n\
  \    tmp = page + 4096;\n    while (i-- > 0) {\n        tmp--;\n        *(char *)tmp\
  \ = 0;\n    }\n    if (put_page(page,address))\n        return;\n    free_page(page);\n\
  \    oom();\n}\n```\n\n我们仍然是去掉一些不重要的分支，假设跳转不会超过数据末端 `end_data`，也没有共享内存页面，申请空闲内存时也不会内存不足产生\
  \ `oom` 等，将程序简化如下。\n\n```c\n// memory.c\n// address 缺页产生的线性地址 0x8000000\nvoid do_no_page(unsigned\
  \ long address) {\n    // 线性地址的页面地址 0x8000000\n    address &= 0xfffff000;\n    //\
  \ 计算相对于进程基址的偏移 0\n    unsigned long tmp = address - current->start_code;\n    //\
  \ 寻找空闲的一页内存\n    unsigned long page = get_free_page();\n    // 计算这个地址在文件中的哪个数据块\
  \ 1\n    int block = 1 + tmp/BLOCK_SIZE;\n    // 一个数据块 1024 字节，所以一页内存需要 4 个数据块\n\
  \    int nr[4];\n    for (int i=0 ; i<4 ; block++,i++)\n        nr[i] = bmap(current->executable,block);\n\
  \    bread_page(page,current->executable->i_dev,nr);\n    ...\n    // 完成页表的映射\n\
  \    put_page(page,address);\n}\n```\n\n这就简单多了，我们还是一点点看。\n\n首先，缺页产生的线性地址，之前假设过了，是\
  \ `0x8000000`，也就是进程 2 自己线性地址空间的起始处 128M 这个位置。\n\n由于我们的页表映射是以**页**为单位的，所以首先计算出 `address`\
  \ 所在的页，其实就是完成一次 **4KB 的对齐**。\n\n```c\n// memory.c\n// address 缺页产生的线性地址 0x8000000\n\
  void do_no_page(unsigned long address) {\n    // 线性地址的页面地址 0x8000000\n    address\
  \ &= 0xfffff000;\n    ...\n}\n```\n\n此时 `address` 对齐后仍然是 `0x8000000`。这个地址是整个线性空间的地址，对于进程\
  \ 2 来说，需要计算出进程 2 的偏移，也就是进程 2 的段基址。\n\n```c\n// memory.c\n// address 缺页产生的线性地址 0x800000\n\
  void do_no_page(unsigned long address) {\n    ...\n    // 计算相对于基址的偏移 0\n    unsigned\
  \ long tmp = address - current->start_code;\n    ...\n}\n```\n\n这里的 `current->start_code`\
  \ 就是进程 2 的段基址，也是 128M。\n\n所以偏移地址 `tmp` 计算等于 `0`，这和我们之前假设的 `entry = 0` 一致的。接下来很简单，就是寻找一个空页。\n\
  \n```c\n// memory.c\n// address 缺页产生的线性地址 0x800000\nvoid do_no_page(unsigned long\
  \ address) {\n    ...\n    // 寻找空闲的一页\n    unsigned long page = get_free_page();\n\
  \    ...\n}\n```\n\n这个 `get_free_page` 是汇编语言写的，其实就是去 `mem_map[]` 中寻找值为 `0` 的位置，这就找到了空闲内存。这部分忘记的同学，可以看一下[第\
  \ 13 回 | 内存初始化](https://mp.weixin.qq.com/s?__biz=Mzk0E3NDE0Ng&mid=224750089&idx=1&sn=9a3fd6e58b0fd1ec52859ead667c6&scene=21)，之前建立的一些初始化结构，就用上了。\n\
  \n找到页物理内存后，当然是把硬盘中的数据加载，下面的代码完成完成工作。\n\n```c\n// memory.c\n// address 缺页产生的线性地址\
  \ 0x800000\nvoid do_no_page(unsigned long address) {\n    ...\n    // 计算这个地址在文件中的哪个数据块\
  \ 1\n    int block = 1 + tmp/BLOCK_SIZE;\n    // 一个数据块 1024 字节，所以一页内存需要 4 个数据块\n\
  \    int nr[4];\n    for (int i=0 ; i<4 ; block++,i++)\n        nr[i] = bmap(current->executable,block);\n\
  \    bread_page(page,current->executable->i_dev,nr);\n    ...\n}\n```\n\n**从硬盘的哪个位置开始读？**首先\
  \ 0 内存地址，应该就对应着这个文件 0 号数据块，当然由于 `/bin/sh` 这个 a.out 格式的文件使用了 1 个数据块作为头部 `exec` 结构，所以我们**跳过头部**，从文件\
  \ 1 号数据块开始读。\n\n**读多少块？**因为硬盘中的 1 个数据块为 1024 字节，而一页内存为 4096 字节，所以要读 4 块，这就是 `nr[4]`\
  \ 的缘故。\n\n之后读取数据主要是两个函数，`bmap` 负责将块转换为物理块，`bread_page` 负责从硬盘读取数据到内存，最后 `put_page`\
  \ 负责建立页表映射。\n\n**从硬盘的哪个位置开始读？**首先 0 内存地址，应该就对应着这个文件 0 号数据块，当然由于 `/bin/sh` 这个 a.out\
  \ 格式的文件使用了 1 个数据块作为头部 `exec` 结构，所以我们**跳过头部**，从文件 1 号数据块开始读。\n\n**读多少块？**因为硬盘中的 1\
  \ 个数据块为 1024 字节，而一页内存为 4096 字节，所以要读 4 块，这就是 `nr[4]` 的缘故。\n\n\n\n\n\n> 原文链接: [`mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502581&idx=1&sn=df3f2c19ce511ac24145091892f47837&chksm=c2c5b058f5b2394ee095d679071b43c23853dc86d5cfd4cc961568643110ab734f635b899984&scene=21#wechat_redirect`](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502581&idx=1&sn=df3f2c19ce511ac24145091892f47837&chksm=c2c5b058f5b2394ee095d679071b43c23853dc86d5cfd4cc961568643110ab734f635b899984&scene=21#wechat_redirect)\n\
  \n书接上回，上回书咱们说到，Linux 通过缺页中断处理过程，将 `/bin/sh` 的代码从硬盘加载到了内存，此时便可以正式执行 shell 程序了。\n\n\
  这个 `shell` 程序，也就是 Linux 0.11 中要执行的这个 `/bin/sh` 程序，它的源码并没有体现在 Linux 0.11 源码中。\n\n\
  也可以说，不论这个 `/bin/sh` 是个啥文件，哪怕只是个 hello world 程序，Linux 0.11 的启动过程中也会傻傻地去执行它。\n\n但同时，`shell`\
  \ 又是一个我们再熟悉不过的东西了。在我的腾讯云服务器上（用 `Termius` 连接），它是这个样子的。\n\n![](img/file266.webp \"\
  fig:\")\n\n在我的 Ubuntu 16.04 虚拟机上，它是这个样子的。\n\n![](img/file267.webp \"fig:\")\n\n\
  在我的 mac 电脑上，它是这个样子的。\n\n![](img/file268.webp \"fig:\")\n\n没错，它就是我们通常说的那个命令行黑窗口。当然，`shell`\
  \ 只是一个标准，具体的实现可以有很多，比如在我的 Ubuntu 16.04 上，具体的 shell 实现是 `bash`。\n\n```bash\necho\
  \ $SHELL\n/bin/bash\n```\n\n而在我的 mac 上，具体的实现是 `zsh`。\n\n```bash\necho $SHELL\n/bin/zsh\n\
  ```\n\n当然，默认的 `shell` 实现也可以手动进行设置并更改。还有个有意思的事，`shell` 前面的提示符，是否可以修改呢？我的腾讯云服务器上，提示符是：\n\
  \n```bash\n[root@VM-24-11-centos ~]#\n```\n\n我的 Ubuntu 虚拟机上，提示符是：\n\n```bash\nflash:~$\n\
  ```\n\n我的 mac 电脑上更简单，提示符是：\n\n```bash\n~\n```\n\n我现在觉得我那个腾讯云服务器上的提示符太长了怎么办？我们先查看一个变量\
  \ `PS1` 的值：\n\n```bash\n[root@VM-24-11-centos ~]# echo $PS1\n[\\u@\\h \\W]\\$\n\
  ```\n\n然后，我们直接把这个值给改了。\n\n```bash\n[root@VM-24-11-centos ~]# echo $PS1\n[\\u@\\\
  h \\W]\\$\n[root@VM-24-11-centos ~]# PS1=[呵呵呵]\n[呵呵呵]\n```\n\n可以看到神奇的事情发生了，前面的提示符变成了我们自己定义的样子。其实我就想说，`shell`\
  \ 程序也仅仅是个程序而已，它的输出，它的输入，它的执行逻辑，是完全可以通过阅读程序源码来知道的，和一个普通的程序并没有任何区别。\n\n好了，接下来我们就阅读一下\
  \ shell 程序的源码，只需要找到它的一个具体实现即可。但是 `bash`、`zsh` 等实现都过于复杂，很多东西对于我们学习完全没必要。所以这里我通过一个非常非常精简的\
  \ shell 实现，即 `xv6` 里的 shell 实现为例，来进行讲解。\n\n`xv6` 是一个非常非常经典且简单的操作系统，是由麻省理工学院为操作系统工程的课程开发的一个教学目的的操作系统，所以非常适合操作系统的学习。\n\
  \n![](img/file269.webp \"fig:\")\n\n而在它的源代码中，又恰好实现了一个简单的 shell 程序，所以阅读它的代码，对我们这个系列课程来说，简直再合适不过了。\n\
  \n![](img/file270.webp \"fig:\")\n\n看到没，甚至在这么一个小小的截图里，已经可以完整展示 `sh.c` 里全部的 `main`\
  \ 方法代码了。但我仍然十分贪婪，即便是这么短的代码，我也帮你把一些多余的校验逻辑去掉，再去掉关于 `cd` 命令的特殊处理分支，来一个最干净的版本。\n\n\
  ```c\n// xv6-public sh.c\nint main(void) {\n    static char buf[100];\n    // 读取命令\n\
  \    while(getcmd(buf, sizeof(buf)) >= 0){\n        // 创建新进程\n        if(fork()\
  \ == 0)\n            // 执行命令\n            runcmd(parsecmd(buf));\n        // 等待进程退出\n\
  \        wait();\n    }\n}\n```\n\n看，shell 程序变得异常简单了！总得来说，`shell` 程序就是个死循环，它永远不会自己退出，除非我们手动终止\
  \ `shell` 进程。在死循环里面，`shell` 不断读取（`getcmd`）用户命令，创建一个新的进程（`fork()`），在新进程里执行（`runcmd`），最后等待（`wait()`）进程，再次读取下一条命令。由此你是不是感受到了\
  \ `xv6` 源码的简单美，当你走完这个 Linux 0.11 之后，再去阅读 `xv6` 源码你会觉得舒服，因为 Linux 0.11 很多地方都用了非常技巧，使得理解很困难。之前说过\
  \ `shell` 就是不断 `fork + exec` 完成一个程序的功能，那 `exec` 在哪？那我们要看执行的 `runcmd` 代码。\n\n```c\n\
  void runcmd(struct cmd *cmd) {\n    struct exe ecmd = (struct exe*)cmd;\n    exec(ecmd->argv[0],\
  \ ecmd->argv);\n}\n```\n\n## 第 38 回 操作系统完毕\n\n书接上回，上回书咱们说到，Linux 通过缺页中断处理过程，将 `/bin/sh`\
  \ 的代码从硬盘加载到了内存，此时便可以正式执行 shell 程序了。\n\n这个 `shell` 程序，也就是 Linux 0.11 中要执行的这个 `/bin/sh`\
  \ 程序，它的源码并没有体现在 Linux 0.11 源码中。\n\n也可以说，不论这个 `/bin/sh` 是个啥文件，哪怕只是个 hello world 程序，Linux\
  \ 0.11 的启动过程中也会傻傻地去执行它。\n\n但同时，`shell` 又是一个我们再熟悉不过的东西了。在我的腾讯云服务器上（用 `Termius` 连接），它是这个样子的。\n\
  \n![](img/file266.webp \"fig:\")\n\n在我的 Ubuntu 16.04 虚拟机上，它是这个样子的。\n\n![](img/file267.webp\
  \ \"fig:\")\n\n在我的 mac 电脑上，它是这个样子的。\n\n![](img/file268.webp \"fig:\")\n\n没错，它就是我们通常说的那个命令行黑窗口。当然，`shell`\
  \ 只是一个标准，具体的实现可以有很多，比如在我的 Ubuntu 16.04 上，具体的 shell 实现是 `bash`。\n\n```bash\necho\
  \ $SHELL\n/bin/bash\n```\n\n而在我的 mac 上，具体的实现是 `zsh`。\n\n```bash\necho $SHELL\n/bin/zsh\n\
  ```\n\n当然，默认的 `shell` 实现也可以手动进行设置并更改。还有个有意思的事，`shell` 前面的提示符，是否可以修改呢？我的腾讯云服务器上，提示符是：\n\
  \n```bash\n[root@VM-24-11-centos ~]#\n```\n\n我的 Ubuntu 虚拟机上，提示符是：\n\n```bash\nflash:~$\n\
  ```\n\n我的 mac 电脑上更简单，提示符是：\n\n```bash\n~\n```\n\n我现在觉得我那个腾讯云服务器上的提示符太长了怎么办？我们先查看一个变量\
  \ `PS1` 的值：\n\n```bash\n[root@VM-24-11-centos ~]# echo $PS1\n[\\u@\\h \\W]\\$\n\
  ```\n\n然后，我们直接把这个值给改了。\n\n```bash\n[root@VM-24-11-centos ~]# echo $PS1\n[\\u@\\\
  h \\W]\\$\n[root@VM-24-11-centos ~]# PS1=[呵呵呵]\n[呵呵呵]\n```\n\n可以看到神奇的事情发生了，前面的提示符变成了我们自己定义的样子。其实我就想说，`shell`\
  \ 程序也仅仅是个程序而已，它的输出，它的输入，它的执行逻辑，是完全可以通过阅读程序源码来知道的，和一个普通的程序并没有任何区别。\n\n好了，接下来我们就阅读一下\
  \ shell 程序的源码，只需要找到它的一个具体实现即可。但是 `bash`、`zsh` 等实现都过于复杂，很多东西对于我们学习完全没必要。所以这里我通过一个非常非常精简的\
  \ shell 实现，即 `xv6` 里的 shell 实现为例，来进行讲解。\n\n`xv6` 是一个非常非常经典且简单的操作系统，是由麻省理工学院为操作系统工程的课程开发的一个教学目的的操作系统，所以非常适合操作系统的学习。\n\
  \n![](img/file269.webp \"fig:\")\n\n而在它的源代码中，又恰好实现了一个简单的 shell 程序，所以阅读它的代码，对我们这个系列课程来说，简直再合适不过了。\n\
  \n![](img/file270.webp \"fig:\")\n\n看到没，甚至在这么一个小小的截图里，已经可以完整展示 `sh.c` 里全部的 `main`\
  \ 方法代码了。但我仍然十分贪婪，即便是这么短的代码，我也帮你把一些多余的校验逻辑去掉，再去掉关于 `cd` 命令的特殊处理分支，来一个最干净的版本。\n\n\
  ```c\n// xv6-public sh.c\nint main(void) {\n    static char buf[100];\n    // 读取命令\n\
  \    while(getcmd(buf, sizeof(buf)) >= 0){\n        // 创建新进程\n        if(fork()\
  \ == 0)\n            // 执行命令\n            runcmd(parsecmd(buf));\n        // 等待进程退出\n\
  \        wait();\n    }\n}\n```\n\n看，shell 程序变得异常简单了！总得来说，`shell` 程序就是个死循环，它永远不会自己退出，除非我们手动终止\
  \ `shell` 进程。在死循环里面，`shell` 不断读取（`getcmd`）用户命令，创建一个新的进程（`fork()`），在新进程里执行（`runcmd`），最后等待（`wait()`）进程，再次读取下一条命令。由此你是不是感受到了\
  \ `xv6` 源码的简单美，当你走完这个 Linux 0.11 之后，再去阅读 `xv6` 源码你会觉得舒服，因为 Linux 0.11 很多地方都用了非常技巧，使得理解很困难。之前说过\
  \ `shell` 就是不断 `fork + exec` 完成一个程序的功能，那 `exec` 在哪？那我们要看执行的 `runcmd` 代码。\n\n```c\n\
  void runcmd(struct cmd *cmd) {\n    struct exe ecmd = (struct exe*)cmd;\n    exec(ecmd->argv[0],\
  \ ecmd->argv);\n}\n```\n\nOK，上一回我留了一个问题，`shell` 程序执行了，操作系统就结束了？此时我们不妨从宏观视角来看一下当前的进度。\n\
  \n![](img/file272.webp \"fig:\")\n\n看最右边的蓝色部分的流程即可。我们先建立了建立了的一些最基本的环境与管理结构，然后由进\
  \ 0 `fork` 出处于用户态执行的进程 1，进程 1 加载了文件系统并打开终端文件，紧接着就 fork 出了进程 2，进程 2 通过我们刚刚讲述的 `execve`\
  \ 函数将自己替换成了 `shell` 程序。\n\n操作系统就是初始化了一堆数据结构进行管理，并且提供了一揽子系统接口供上层的应用程序调用，仅此而已。再多做点事就是提供常用的用户程序，但这不是必须的。\n\
  \n此时我想到了之前有人问过的问题，他说现在的电脑开机后和操作系统启动前，还隔着一段时间，这段时间运行的代码是什么？在我的继续问下才知道，他说的操作系统的开始，是我们看到了如\
  \ Windows 画面。\n\n![](img/file271.webp \"fig:\")\n\n甚至在 Linux 0.11 里根本都找不到 `shell`\
  \ 的源代码，说明 Linux 0.11 并没有认为 `shell` 是操作系统的一部分，它只是个普通的用户程序，和你在操作系统里自己写个 hello world\
  \ 编译成 `a.out` 执行一样。在执行这个 `shell` 程序前可以认为操作系统启动了。\n\n\n\n\nThis shell program will\
  \ not exit; it will continuously accept the commands we input from the keyboard\
  \ and then execute our commands through the `fork+execve` functions, which was discussed\
  \ in the previous session.\n\nOf course, if this `shell` process also exits, the\
  \ operating system will not escape this large loop but will continue to retry.\n\
  \nThe entire operating system stops here and looks exactly like this.\n\n```c\n\
  // main.c\nvoid main() {\n    // Initialize environment\n    ...\n    // Outer OS\
  \ main loop\n    while(1) {\n        // Inner shell program small loop\n       \
  \ while(1) {\n            // Read command read\n            ...\n            //\
  \ Create process fork\n            ...\n            // Execute command execve\n\
  \            ...\n        }\n    }\n}\n```\n\nOf course, this is just the surface.\n\
  \nIn addition, all keyboard inputs, system calls, and process scheduling here require\
  \ `interrupts` to drive them. As I said a long time ago, `the operating system is\
  \ an interrupt-driven infinite loop`, and that is why.\n\nOK! At this, the operating\
  \ system has finally finished booting and reached an idle state. It has set up a\
  \ series of interrupt handlers, waiting at any time for interrupts to arrive for\
  \ processing, while running a shell program to accept commands from ordinary users,\
  \ interacting in a human-friendly way.\n\nPerfect!\n\nAs for what happens next,\
  \ stay to the next chapter.\n\n***\n\n## Chapter 39 | Extra - Linux 0.11 Kernel\
  \ Debugging\n\nLinux 0.11 is the earliest code of Linux, making it very suitable\
  \ as the first code to deeply explore the principles of operating systems.\n\nBut\
  \ at the same time, due to the lack of many ancient toolchains and some outdated\
  \ file formats like `a.out`, it is extremely difficult to successfully compile and\
  \ run it, let alone perform source-level `debug`.\n\nTo successfully debug Linux\
  \ 0.11, many steps are required, and it depends on some ancient toolchains. For\
  \ us who simply use Linux 0.11 as a means to study operating systems, there is no\
  \ need to spend energy modifying it ourselves and falling into various pitfalls.\n\
  \nSo today I will share one method of mine for debugging Linux 0.11, and also for\
  \ my own convenience to follow the tutorial and set up the environment blindly when\
  \ I switch computers later. Let's begin~\n\n### Overall Idea and Effect\n\nThe method\
  \ I use is to create an Ubuntu 16.04 virtual machine on Windows, use `qemu` inside\
  \ to start a Linux 0.11 system with debugging enabled, and then use the local `vscode\
  \ remote ssh` to connect to the virtual machine, enabling `gdb` debugging. The final\
  \ effect is as follows.\n\nThis is the most comfortable way because `vscode` is\
  \ on the local machine, completely unaffected by the virtual machine; this is also\
  \ the method I prefer when debugging other code.\n\nIf you have your own deluxe\
  \ server, you can replace the virtual machine with a server. This not only makes\
  \ the compilation faster and doesn't consume your computer's performance, but also\
  \ allows you to debug at any time at home or in the office without being affected\
  \ by the terminal (convenient for slacking off~).\n\nOf course if you don't need\
  \ the intuitive `vscode`, this step can be replaced with the `gdb` command line,\
  \ simply executing `gdb` related commands directly in the virtual machine.\n\n###\
  \ Step 1: Configure the Virtual Machine\n\nThe virtual machine software I used is\
  \ `Oracle VM VirtualBox Version 6.0.8 Edition`.\n\nThe official website is: `https://ubuntu.com/`\n\
  \nThe download page is: `https://www.virtualbox.org/wiki/Download_Old_Builds_6_0`\n\
  \nThe direct link for my version is: `https://download.virtualbox.org/virtualbox/6.0.8/VirtualBox-6.0.8-130520-Win.exe`\n\
  \nThe OS image I installed is `ubuntu-16.04.7-desktop-amd64`.\n\nThe official website\
  \ is: `https://ubuntu.com/`\n\nThe download page is: `https://releases.ubuntu.com/xenial/`\n\
  \nThe direct link for my version is: `https://releases.ubuntu.com/xenial/ubuntu-16.04.7-desktop-amd64.iso`\n\
  \nI won't elaborate on this; achieving the final effect is what matters.\n\n###\
  \ Step 2: Install QEMU\n\n`qemu` is an emulator, simply similar to a virtual machine,\
  \ used to boot Linux 0.11. The official website is: `https://www.qemu.org/`\n\n\
  In the Ubuntu virtual machine we just created, we follow the tutorial to execute\
  \ `sudo apt-get install qemu`.\n\nAfter downloading, we type `qemu-` and press `tab`\
  \ to see supported architectures. Seeing `qemu-system-x86_64`, we use this to start\
  \ Linux 0.11.\n\n### Step 3: Download and Run Debuggable Linux 0.11 Source\n\nThis\
  \ step cannot be done by direct download because it depends on many ancient toolchains.\
  \ Here, we refer to the teacher's modified Linux 0.11 source code using modern toolchains,\
  \ choosing the repository: `https://github.com/yuan-xy/Linux-0.11`. Download the\
  \ source code directly, enter the root directory, and type `make start` to get Linux\
  \ 0.11 running.\n\nIf you want to debug, type `make debug`, and it will hang. At\
  \ this point, you can debug through `gdb`. Open another window, type `gdb tools/system`\
  \ and then `target remote :1234`.\n\n### Step 4: Remote Debugging via VS Code\n\n\
  Of course, you can also install the `vscode-remote-ssh` plugin in the virtual machine.\
  \ Press `ctrl + p`, type `remote-ssh`, and find `Connect to Host`. Follow the prompts\
  \ to enter your virtual machine IP and username, then enter the password to connect\
  \ to the virtual machine. Afterward, click \"Run and Debug\" in the menu bar, and\
  \ in the pop-up `launch.json`, make the following configuration:\n\n```json\n{\n\
  \    \"version\": \"0.2.0\",\n    \"configurations\": [\n        {\n           \
  \ \"name\": \"(gdb) Launch\",\n            \"type\": \"cppdbg\",\n            \"\
  request\": \"launch\",\n            \"program\": \"${workspaceFolder}/tools/system\"\
  ,\n            \"miDebuggerServerAddress\": \"127.0.0.1:1234\",\n            \"\
  args\": [],\n            \"stopAtEntry\": false,\n            \"cwd\": \"${workspaceFolder}\"\
  ,\n            \"environment\": [],\n            \"MIMode\": \"gdb\"\n        }\n\
  \    ]\n}\n```\n\nAfter configuring and saving, set a breakpoint in the `main` function,\
  \ and click \"Run and Debug\" again in the menu bar; you will find the debugging\
  \ is successful. Remember that before every `vscode` debug, run Linux 0.11 in the\
  \ virtual machine first by executing the command `make debug`.\n\n***\n\n## Chapter\
  \ 40 | Extra - Why You Can't Understand It No Matter How\n\nLinux 0.11 is the earliest\
  \ code of Linux, making it very suitable as the first code to deeply explore the\
  \ principles of operating systems.\n\nBut at the same time, due to the lack of many\
  \ ancient toolchains and some outdated file formats like `a.out`, it is extremely\
  \ difficult to successfully compile and run it, let alone perform source-level debug.\n\
  \nTo successfully debug Linux 0.11, many steps are required, and it depends on some\
  \ ancient toolchains. For us who simply use Linux 0.11 as a means to study operating\
  \ systems, there is no need to spend energy modifying it ourselves and falling into\
  \ various pitfalls.\n\n\n\n\n\n通过 [第二部分 | 大战前期的初始化工作](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500983&idx=1&sn=ad4c430823c975df97f13de3fbe8c66e&scene=21&token=1321039476&lang=zh_CN#wechat_redirect)\
  \ 完成了内核中各种管理结构的初始化，如内存管理结构初始化`mem_init`，进程调度管理结构初始化`sched_init` 等，对应 `main` 方法中的`xxx_init`\
  \ 系列方法。\n\n通过 [第三部分 | 一个新进程的诞生](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501947&idx=1&sn=cb94f53c75d674d30fb4903778c74c08&chksm=c2c5b2d6f5b23bc027d9652d3e9949e55fd3b101beb87f6f80dd77d8233c0b51bede73edad46&scene=21&token=1321039476&lang=zh_CN#wechat_redirect)\
  \ 讲述了`fork` 函数的原理，也就是进程 0 创建进程 1 的过程，对应 `main` 方法中的`fork` 函数。\n\n通过 第四部分 | shell\
  \ 程序的到来 讲述了从加载根文件系统到最终创建出与用户交互的 shell 进程的过程，对应 `main` 方法中的`init` 函数。\n\n**至此操作系统启动完毕，达到怠速状态。**\n\
  \n纵观整个操作系统的源码，前四部分对应的代码如下，这就是启动流程中的全部代码了。\n\n```\n--- 第一部分 进入内核前的苦力活 ---\nbootsect.s\n\
  setup.s\nhead.s\n\nmain.c\nvoid main(void) {\n    --- 第二部分 大战前期的初始化工作 ---\n    mem_init(main_memory_start,memory_end);\n\
  \    trap_init();\n    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n \
  \   time_init();\n    sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\n\
  \    floppy_init();\n    sti();\n    --- 第三部分 一个新进程的诞生 ---\n    move_to_user_mode();\n\
  \    if (!fork()) {\n        --- 第四部分 shell 程序的到来 ---\n        init();\n    }\n\
  \    for(;;) pause();\n}\n```\n\n------\n\n具体展开第四部分，我们首先通过 [第 31 回 | 拿到硬盘信息](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502161&idx=1&sn=219186a1e587f40308515852d293aaf4&chksm=c2c5b3fcf5b23aead170092d4042abd54b272694cbaac3f750eb3adea584ee29653c72ad2915&scene=21#wechat_redirect)\
  \ 和 [第 32 回 | 加载根文件系统](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502181&idx=1&sn=b6dcbd1d2cf930002852008a1c4e6a65&chksm=c2c5b3c8f5b23ade1532b725995dbc3b0138202555e44a6e308b84d668a2ef3041eb5cf77f86&scene=21#wechat_redirect)\
  \ 使得内核具有了以文件系统管理硬盘数据的能力。\n\n![media/file285.webp]\n\n接下来 [第 33 回 | 打开终端设备](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502230&idx=1&sn=44e023bf0b9c3726135a6e3722bc57)c2c5b3f25b23a210099601111555574114482ba42a)\
  \ 使用刚刚建立好的文件系统，打开`/dev/tty0` 这个终端文件，此时内核便具有了与外设的能力，具体体现为调用`printf` 函数往屏幕上打印。\n\n\
  ![media/file286.webp]\n\n接下来 [第 34 回 | 进程创建](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502269&idx=1&sn=19f6831de5bac8d055571571111111555511538)\
  \ 利用刚刚建立好的文件系统，以及进程 1 的外设的能力，创建出了进程 2，此时进程 2 与进程 1 一样具有与外设的能力，这为后面 shell 程序的创建好了基础。\n\
  \n![media/file287.webp]然后，进程 2 此时在 [第 35 回 | exec 加载并执行 shell](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502475&idx=1&sn=4cdbaa03bf6ac04db4013096aa3chm=c2c5b026f5b239304efca68c2df5038fa031eea79bd9ec61ec2b4a0761)\
  \ 利用`execve` 函数使自己变成了 shell 程序，配合上一回`fork` 的过程，这就是 Linux 里经典的`fork + execve` 函数。`execve`\
  \ 函数的关键就是改变了栈空间中的`EIP` 和`ESP` 值，使得中断返回后的地址到了 shell 程序加载到的内存。\n\n![media/file288.webp]此时，`execve`\
  \ 系统调用的中断返回后指向了 shell 程序所在的内存起始处，就要执行 shell 程序。但此时 shell 程序还没有从硬盘加载到内存，所以会触发缺页中断将硬盘中的\
  \ shell 程序（除头部其他部分）按需加载到内存，这就是 [第 36 回 | 缺页中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502511&idx=1&sn=eacddbb11dd240261a61f708ee045chchm=c2c5b002f5b23914ccd64d94bd590322776f41e6744fddeca2b027d12a)\
  \ 里讲述的过程。\n\n![media/file289.webp]这回终于可以开始执行`shell` 程序了。在 [第 37 回 | shell 程序跑起来](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502581&idx=1&sn=df32c9ce511ac24145091892f47837chm=c2c5b058f5b2394ee095d679071b43c23853dc86d5cf4cc961568643110ab734f63584)\
  \ 中我们以 xv6 源码中的超级简单的 shell 程序为例，讲解了 shell 程序的原理。\n\n就是不断读取用户输入的命令，创建一个新的进程并执行读取到的命令，最后等待进程退出，再次进入下一条命令的循环中。\n\
  \n```\n// xv6-public sh.c\nint main(void) {\n    static char buf[100];\n    // 读取命令\n\
  \    while(getcmd(buf, sizeof(buf)) >= 0){\n        // 创建新进程\n        if(fork()\
  \ == 0) {\n            // 执行命令\n            runcmd(parsecmd(buf));\n        }\n\
  \        // 等待进程\n        wait();\n    }\n}\n```\n\nshell 程序是个死循环，我们再回来看操作系统的循环。在\
  \ [第 38 回 | 操作系统完毕](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502613&idx=1&sn=d7e85595323dde138e5ac52bf8e1ddchm=c2c5b1b0f5b23ae8785f45bf83434968e7e5a9702d6eb5738f1a83c49f)\
  \ 给出了整个操作系统代码的鸟瞰视角。\n\n```\n// main.c\nvoid main() {\n    // 初始化环境\n    // 外层操作系统循环\n\
  \    while(1) {\n        // 内层 shell 程序循环\n        while(1) {\n            // 读取命令\n\
  \            ...\n            // 创建进程\n            ...\n            // 执行命令\n  \
  \          ...\n        }\n    }\n}\n```\n\n可以看出，不仅 shell 程序是个死循环，整个操作系统也是死循环。除此之外，这里所有的键盘输入、系统调用、进程调度，都需要`中断`来驱动，所以很久之前我说，操作系统是个中断驱动的死循环，就是这个道理。\n\
  \nOK！到此为止，操作系统终于启动完毕，达到了怠速的状态，它本身设置好堆中断处理程序，随时等待中断的到来进行处理，同时运行了一个 shell 程序用来人类友好的方式交互。\n\
  \n------\n\n我们前四部分，终于把整个启动流程清楚了，如果你头脑中已经像电影般把启动流程清晰，相信你不再恐惧操作系统源码了。\n\n\n\n\n\n\
  新建一个非常简单的 `info.txt` 文件。\n\n```\nname:flash\nage:28\nlanguage:java\n```\n\n在命令行输入一条十分简单的命令。\n\
