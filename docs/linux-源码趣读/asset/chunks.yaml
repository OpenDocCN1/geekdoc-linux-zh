  trans: "\n我们看到整个条件判断的结构是根据 `block` 来划分的。\n\n`block` 就是要读取的块号，之所以要划分，就是因为 `inode`\
    \ 在记录文件所在块号时，采用了多级索引的方式。\n\n![](img/file322.webp \"fig:\")\n\n`zone[0]` 到 `zone[7]`\
    \ 采用直接索引，`zone[7]` 是一次间接索引，`zone[8]` 是二次间接索引。\n\n那我们刚开始读，块号肯定从零开始，所以我们就先看 `block\
    \ < 7`，通过直接索引这种最简单的方式读的代码。\n\n```c\n// inode.c\nstatic int _bmap(struct m_inode\
    \ * inode,int block,int create) {\n    ...\n    if (block < 7) {\n        if (create\
    \ && !inode->i_zone[block])\n            if (inode->i_zone[block]=new_block(inode->i_dev))\
    \ {\n                inode->i_ctime=CURRENT_TIME;\n                inode->i_dirt=1;\n\
    \            }\n        return inode->i_zone[block];\n    }\n    ...\n}\n```\n\
    \n由于 `create = 0`，也就是并不需要创建一个新的数据块，所以里面的 `if` 分支没了。\n\n```c\n// inode.c\nstatic\
    \ int _bmap(struct m_inode * inode,int block,int create) {\n    ...\n    if (block\
    \ < 7) {\n        ...\n        return inode->i_zone[block];\n    }\n    ...\n\
    }\n```\n\n可以看到，其实 `bmap` 返回的，就是要读入的块号，从全局看在块设备的哪个逻辑块号下。\n\n也就是说，假如我想要读这个文件的第一个块号的数据，该函数返回的是你这个文件的第一个块在整个硬盘中的哪个块中。\n\
    \n### bread：将 bmap 获取的数据块号读入到高速缓冲块\n\n好了，拿到这个数据块号后，回到 `file_read` 函数接着看。\n\n```c\n\
    // file_dev.c\nint file_read(struct m_inode * inode, struct file * filp, char\
    \ * buf, int count) {\n    ...\n    while (left) {\n        if (nr = bmap(inode,(filp->f_pos)/BLOCK_SIZE))\
    \ {\n            if (!(bh=bread(inode->i_dev,nr)))\n    }\n    }\n}\n```\n\n`nr`\
    \ 就是具体的数据块号，作为其中其中一个参数，传入下一个函数 `bread`。\n\n`bread` 这个方法的入参除了数据块号 `block`（就是刚刚传入的\
    \ `nr`）外，还有 `inode` 结构中的 `i_dev`，表示设备号。\n\n```c\n// buffer.c\nstruct buffer_head\
    \ * bread(int dev,int block) {\n    struct buffer_head * bh = getblk(dev,block);\n\
    \    if (bh->b_uptodate)\n        return bh;\n    ll_rw_block(READ,bh);\n    wait_on_buffer(bh);\n\
    \    if (bh->b_uptodate)\n        return bh;\n    brelse(bh);\n    return NULL;\n\
    }\n```\n\n这个 `bread` 方法就是根据一个设备号 `dev` 和一个数据块号 `block`，将这个数据块的数据，从硬盘复制到缓冲区里。\n\
    \n关于缓冲区，已经在 [第 19 回 | 缓冲区初始化 buffer_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500596&idx=1&sn=0df64f9f5133cfe8a259b8ce7b7feaeb&chksm=c2c5b999f5b2308f76095af30e8915f125f18702df9c58be7612b58e4d009c149481)\
    \ 中提到。`getblk` 方法根据设备号 `dev` 和数据块号 `block` 申请到一个缓冲块。简单说，先根据 `hash` 结构快速查找 `dev`\
    \ 和 `block` 是否存在缓冲块。如果没有，那就从之前建立的双向链表的头指针 `free_list` 开始寻找，直到找到一个可用的缓冲块。具体代码逻辑包含当缓冲块正在其他进程使用或者缓冲块对应的数据被修改时的处理，你可以一看关键流程。\n\
    \n```c\n// buffer.c\nstruct buffer_head * bread(int dev,int block) {\n    struct\
    \ buffer_head * bh = getblk(dev,block);\n    ...\n}\n\nstruct buffer_head * getblk(int\
    \ dev,int block) {\n    struct buffer_head * tmp, * bh;\n    repeat:\n    // 先从\
    \ hash 结构中找\n    if (bh = get_hash_table(dev,block))\n        return bh;\n   \
    \ // 如果没有就 free_list 开始找双向链表\n    tmp = free_list;\n    do {\n        if (tmp->b_count)\n\
    \            continue;\n        if (!bh || BAD(tmp)) {\n            bh = tmp;\n\
    \            if (!BAD(tmp))\n                break;\n        }\n    } while ((tmp->b_free)\
    \ != free_list);\n    // 如果还没找到，说明没有缓冲块可用，就阻塞等会\n    if (!bh) {\n        sleep_on(&buffer_wait);\n\
    \        goto repeat;\n    }\n    // 到这里说明申请到了缓冲块，但被其他进程上锁了\n    // 如果上锁了，就等等\n\
    \    wait_on_buffer(bh);\n    if (bh->b_count)\n        goto repeat;\n    // 到这里说明缓冲块申请到，且没有上锁\n\
    \    // 但还得看 dirt 位，也就是有没有被修改\n    // 如果被修改了，就重新从硬盘中读入新数据\n    while (bh->b_dirt)\
    \ {\n        sync_dev(bh->b_dev);\n        wait_on_buffer(bh);\n        if (bh->b_count)\n\
    \            goto repeat;\n    }\n    if (find_buffer(dev,block))\n        goto\
    \ repeat;\n    // 给刚刚获取到的缓冲头 bh 重新赋值并调整在双向链表和 hash 表中的位置\n    bh->b_count=1;\n\
    \    bh->b_dirt=0;\n    bh->b_uptodate=0;\n    remove_from_queues(bh);\n    bh->b_dev=dev;\n\
    \    bh->b_blocknr=block;\n    insert_into_queues(bh);\n    return bh;\n}\n```\n"
- fmt: "\n```c\n// buffer.c\nstruct buffer_head * bread(int dev,int block) {\n   \
    \ ...\n    ll_rw_block(READ,bh);\n    ...\n}\n\nvoid ll_rw_block (int rw, struct\
    \ buffer_head *bh) {\n    ...\n    make_request(major, rw, bh);\n}\n\nstruct request\
    \ request[NR_REQUEST] = {0};\nstatic void make_request(int major,int rw, struct\
    \ buffer_head * bh) {\n    struct request *req; \n    ...\n    // 从 request 队列找到一个空位\n\
    \    if (rw == READ)\n        req = request+NR_REQUEST;\n    else\n        req\
    \ = request+((NR_REQUEST*2)/3);\n    while (--req >= request)\n        if (req->dev<0)\n\
    \            break;\n    ...\n    // 构造 request 结构\n    req->dev = bh->b_dev;\n\
    \    req->cmd = rw;\n    req->errors=0;\n    req->sector = bh->b_blocknr<<1;\n\
    \    req->nr_sectors = 2;\n    req->buffer = bh->b_data;\n    req->waiting = NULL;\n\
    \    req->bh = bh;\n    req->next = NULL;\n    add_request(major+blk_dev,req);\n\
    }\n\n// ll_rw_blk.c\nstatic void add_request (struct blk_dev_struct *dev, struct\
    \ request *req) {\n    struct request * tmp;\n    req->next = NULL;\n    cli();\n\
    \    // 清空 dirt 位\n    if (req->bh)\n        req->bh->b_dirt = 0;\n    // 当前请求项为空，那么立即执行当前请求项\n\
    \    if (!(tmp = dev->current_request)) {\n        dev->current_request = req;\n\
    \        sti();\n        (dev->request_fn)();\n        return;\n    }\n    //\
    \ 插入到链表中\n    for ( ; tmp->next ; tmp=tmp->next)\n        if ((IN_ORDER(tmp,req)\
    \ ||\n            !IN_ORDER(tmp,tmp->next)) &&\n            IN_ORDER(req,tmp->next))\n\
    \            break;\n    req->next=tmp->next;\n    tmp->next=req;\n    sti();\n\
    }\n```\n\n调用链很长，主线是从 `request` 数组中找到一个空位，然后作为链表项插入到 `request` 链表中。没错 `request`\
    \ 是一个 32 大小的数组，里面的每一个 `request` 结构间通过 `next` 指针相连又形成链表。\n\n如果你熟悉 [第15回 | 块设备请求项初始化\
    \ blk_dev_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==...21) 的内容，就会明白这个说法。\n\
    \n`request` 的具体结构如下：\n\n```c\n// blk.h\nstruct request {\n    int dev;       \
    \ /* -1 no request */\n    int cmd;        /* READ or WRITE */\n    int errors;\n\
    \    unsigned long sector;\n    unsigned long nr_sectors;\n    char * buffer;\n\
    \    struct task_struct * waiting;\n    struct buffer_head * bh;\n    struct request\
    \ * next;\n};\n```\n\n表示一个读盘的请求。有了这些参数，底层拿到这个结构之后就知道怎么样访问硬盘了。那是谁不断从 `request`\
    \ 队列取出 `request` 结构并对硬盘发起请求呢？这里 Linux 有很巧妙的设计，我们看看 `add_request` 方法：\n\n```c\n\
    // blk.h\nstruct blk_dev_struct {\n    void (*request_fn)(void);\n    struct request\
    \ * current_request;\n};\n\n// ll_rw_blk.c\nstruct blk_dev_struct blk_dev[NR_BLK_DEV]\
    \ = {\n    { NULL, NULL },     /* no_dev */\n    { NULL, NULL },     /* mem */\n\
    \    { NULL, NULL },     /* fd */\n    { NULL, NULL },     /* hd */\n    { NULL,\
    \ NULL },     /* tty */\n    { NULL, NULL },     /* tty */\n    { NULL, NULL }\
    \      /* lp */\n};\n\nstatic void make_request(int major,int rw, struct buffer_head\
    \ * bh) {\n    ...\n    add_request(major+blk_dev,req);\n}\n\nstatic void add_request\
    \ (struct blk_dev_struct *dev, struct request *req) {\n    ...\n    // 当前请求项为空，那么立即执行当前请求项\n\
    \    if (!(tmp = dev->current_request)) {\n        ...\n        (dev->request_fn)();\n\
    \        ...\n    }\n    ...\n}\n```\n\n就是当设备的当前请求项为空，也就是第一次收到硬盘请求时，会立即执行该设备的\
    \ `request_fn` 方法，这便是整个读盘循环的最初推手。当前设备的设备号是 3，也就是硬盘，会从 `blk_dev` 数组中取索引下标为 3 的设备结构。\n\
    \n在 [第20回 | 硬盘初始化 hd_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==21)\
    \ 的时候，设备号为 3 的设备结构的 `request_fn` 被赋值为硬盘请求函数 `do_hd_request` 了。\n\n```c\n// hd.c\n\
    void hd_init(void) {\n    blk_dev[3].request_fn = do_hd_request;\n    ...\n}\n\
    ```\n\n所以，刚刚 `request_fn` 后面的执行函数就是 `do_hd_request`。\n\n```c\n// hd.c\n#define\
    \ CURRENT (blk_dev[MAJOR_NR].current_request)\nvoid do_hd_request(void) {\n  \
    \  ...\n    unsigned int dev = MINOR(CURRENT->dev);\n    unsigned int block =\
    \ CURRENT->sector;\n    ...\n    nsect = CURRENT->nr_sectors;\n    ...\n    if\
    \ (CURRENT->cmd == WRITE) {\n        hd_out(dev,nsect,head,cyl,write_intr);\n\
    \        ...\n    } else if (CURRENT->cmd == READ) {\n        hd_out(dev,nsect,head,cyl,read_intr);\n\
    \    } else\n        panic(\"unknown hd-command\");\n}\n```\n\n起始扇号对应硬盘的磁头 `head`、柱面\
    \ `cyl`、扇号 `sec` 等信息的代码。可以看到最终根据当前请求是 `WRITE` 还是 `READ`，在调用 `hd_out` 时传入不同的参数。`hd_out`\
    \ 就是读硬盘的最底层的函数。\n\n```c\n// hd.c\nstatic void hd_out(unsigned int drive,unsigned\
    \ int nsect,unsigned int sect,\n    unsigned int head, unsigned int cyl, unsigned\
    \ int cmd,\n    void (*intr_addr)(void)) {\n    ...\n    do_hd = intr_addr;\n\
    \    outb_p(hd_info[drive].ctl,HD_CMD);\n    port=HD_DATA;\n    outb_p(hd_info[drive].wp>>2,++port);\n\
    \    outb_p(nsect,++port);\n    outb_p(sect,++port);\n    outb_p(cyl,++port);\n\
    \    outb_p(cyl>>8,++port);\n    outb_p(0xA0|(drive<<4)|head,++port);\n    outb(cmd,++port);\n\
    }\n```\n\n可以看到，最底层的读盘请求，其实就是向一堆外设端口做读写操作。这个函数实际上在 [第17回 | 时间初始化 time_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==21)\
    \ 为了讲解与 CMOS 外设交互方式的时候讲过了，简单说硬盘的端口表是这样的：\n\n| 端口 | 读 | 写 |\n| --- | --- | ---\
    \ |\n| 0x1F0 | 数据寄存器 | 数据寄存器 |\n| 0x1F1 | 错误寄存器 | 特征寄存器 |\n| 0x1F2 | 扇区计数寄存器 |\
    \ 扇区计数寄存器 |\n| 0x1F3 | 扇区号寄存器或 LBA 块地址 0~7 | 扇区号或 LBA 块地址 0~7 |\n| 0x1F4 | 磁道数低\
    \ 8 位或 LBA 块地址 8~15 | 磁道数低 8 位或 LBA 块地址 8~15 |\n| 0x1F5 | 磁道数高 8 位或 LBA 块地址 16~23\
    \ | 磁道数高 8 位或 LBA 块地址 16~23 |\n| 0x1F6 | 驱动器/磁头或 LBA 块地址 24~27 | 驱动器/磁头或 LBA 块地址\
    \ 24~27 |\n| 0x1F7 | 命令寄存器 | 状态寄存器 |\n"
