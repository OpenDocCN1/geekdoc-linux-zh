    \ 块设备请求项初始化 blk_dev_init\n\n> 原文链接: [https://mp.weixin.qq.com/s/pIbVY1XPCktxGogc4lI1Bw](https://mp.weixin.qq.com/s/pIbVY1XPCktxGogc4lI1Bw)\n\
