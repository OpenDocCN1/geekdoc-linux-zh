    \ near call 和 near ret\n\n![](media/file77.webp \"fig:\")\n\n以及改变段基址的 far call\
    \ 和 far ret\n\n![](media/file78.webp \"fig:\")\n\n压栈和出栈的具体过程，上面文字写的清清楚楚，下面 Intel\
    \ 手册还非常友好地放了张图。\n\n![](media/file79.webp \"fig:\")\n\n可以看到，我们本文就是左边的那一套，把 main\
    \ 函数地址值当做 Calling EIP 压入栈，仿佛是执行了 call 指令调用了一个函数一样，但实际上这是我们通过骚操作代码伪造的假象，骗了 CPU。\n\
    \n然后 ret 的时候就把栈顶的那个 Calling EIP 也就是 main 函数地址弹出栈，存入 EIP 寄存器，这样 CPU 就相当于“返回”到了\
    \ main 函数开始执行。\n\n* * *\n\n## 第一部分总结与回顾\n\n> 原文链接: [https://mp.weixin.qq.com/s/8bP3feeF_A13j7ysWur_JQ](https://mp.weixin.qq.com/s/8bP3feeF_A13j7ysWur_JQ)\n\
