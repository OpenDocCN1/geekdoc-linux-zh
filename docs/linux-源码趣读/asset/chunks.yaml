    \    { NULL, NULL },     /* dev tty */\n[](#cb119-8)    { NULL, NULL }      /*\
    \ dev lp */\n[](#cb119-9)};\n[](#cb119-10)\n[](#cb119-11)struct blk_dev_struct\
    \ {\n[](#cb119-12)    void (*request_fn)(void);  // 处理 block I/O 请求的函数\n[](#cb119-13)\
    \    struct request * current_request;  // 当前正在处理的请求\n[](#cb119-14)};\n```\n\n\
    你看，索引为 3 这个位置，就表示给硬盘 **hd** 这个块设备留的位置。\n\n那么每个块设备执行读写请求都有自己的函数实现，在上层看来都是一个统一函数\
    \ **request_fn** 即可，具体实现各有不同，对于硬盘来说，这个实现就是 **do_hd_request** 函数。\n\n是不是有点像接口？这其实就是**多态**思想在\
    \ C 语言的体现嘛~ 用 Java 程序员熟悉的话就是，父类引用 `request_fn` 指向子类对象 `do_hd_request` 的感觉咯。\n\n\
