    \n![media/file286.webp]\n\n接下来 [第 34 回 | 进程创建](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502269&idx=1&sn=19f6831de5bac8d055571571111111555511538)\
    \ 利用刚刚建立好的文件系统，以及进程 1 的外设的能力，创建出了进程 2，此时进程 2 与进程 1 一样具有与外设的能力，这为后面 shell 程序的创建好了基础。\n\
    \n![media/file287.webp]然后，进程 2 此时在 [第 35 回 | exec 加载并执行 shell](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502475&idx=1&sn=4cdbaa03bf6ac04db4013096aa3chm=c2c5b026f5b239304efca68c2df5038fa031eea79bd9ec61ec2b4a0761)\
    \ 利用`execve` 函数使自己变成了 shell 程序，配合上一回`fork` 的过程，这就是 Linux 里经典的`fork + execve` 函数。`execve`\
    \ 函数的关键就是改变了栈空间中的`EIP` 和`ESP` 值，使得中断返回后的地址到了 shell 程序加载到的内存。\n\n![media/file288.webp]此时，`execve`\
    \ 系统调用的中断返回后指向了 shell 程序所在的内存起始处，就要执行 shell 程序。但此时 shell 程序还没有从硬盘加载到内存，所以会触发缺页中断将硬盘中的\
    \ shell 程序（除头部其他部分）按需加载到内存，这就是 [第 36 回 | 缺页中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502511&idx=1&sn=eacddbb11dd240261a61f708ee045chchm=c2c5b002f5b23914ccd64d94bd590322776f41e6744fddeca2b027d12a)\
    \ 里讲述的过程。\n\n![media/file289.webp]这回终于可以开始执行`shell` 程序了。在 [第 37 回 | shell 程序跑起来](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502581&idx=1&sn=df32c9ce511ac24145091892f47837chm=c2c5b058f5b2394ee095d679071b43c23853dc86d5cf4cc961568643110ab734f63584)\
    \ 中我们以 xv6 源码中的超级简单的 shell 程序为例，讲解了 shell 程序的原理。\n\n就是不断读取用户输入的命令，创建一个新的进程并执行读取到的命令，最后等待进程退出，再次进入下一条命令的循环中。\n\
    \n```\n// xv6-public sh.c\nint main(void) {\n    static char buf[100];\n    //\
    \ 读取命令\n    while(getcmd(buf, sizeof(buf)) >= 0){\n        // 创建新进程\n        if(fork()\
    \ == 0) {\n            // 执行命令\n            runcmd(parsecmd(buf));\n        }\n\
    \        // 等待进程\n        wait();\n    }\n}\n```\n\nshell 程序是个死循环，我们再回来看操作系统的循环。在\
