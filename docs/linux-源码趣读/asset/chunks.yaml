    )\n\n这就做到了亲手捕获 `SIGINT` 这个信号。但这个程序有点不友好，永远无法 `CTRL+C` 结束了，我们优化一下代码，让第一次按下 `CTRL+C`\
    \ 后的信号处理函数，把 `SIGINT` 的处理函数重新置空。\n\n```c\n#include <stdio.h>\n#include <signal.h>\n\
    \nvoid int_handler(int signal_num) {\n    printf(\"signal receive %d\\n\", signal_num);\n\
    \    signal(SIGINT, NULL);\n}\n\nint main(int argc, char ** argv) {\n    signal(SIGINT,\
    \ int_handler);\n    for(;;)\n        pause();\n    return 0;\n}\n```\n\n我们发现，这次按下第二次\
    \ `CTRL+C` 程序就会退出了，这也间接证明了，当没有为 `SIGINT` 注册信号处理函数时，程序接收到 `CTRL+C` 的 `SIGINT`。\n\
    \n"
