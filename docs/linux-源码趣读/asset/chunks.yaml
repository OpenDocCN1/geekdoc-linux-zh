  trans: "\n\n```\nint do_execve(...) {\n    // 检查文件类型和权限等\n    ...\n    // 读取文件的第一块数据到缓冲区\n\
    \    ...\n    // 如果是脚本文件，走这里\n    if (脚本文件判断逻辑) {\n        ...\n    }\n    //\
    \ 如果是可执行文件，走这里\n    // 一堆校验可执行文件是否能执行的判断\n    ...\n    // 进程管理结构的调整\n    ...\n\
    \    // 释放进程占有的页面\n    ...\n    // 调整线性地址空间、参数列表、堆栈地址等\n    ...\n    // 设置 eip\
    \ 和 esp，这里是 execve 变身大法的关键！\n    eip[0] = ex.a_entry;\n    eip[3] = p;\n    return\
    \ 0;\n    ...\n}\n```\n\n整理起来的步骤就是。\n\n1. 检查文件类型和权限等\n2. 读取文件的第一块数据到缓冲区\n3. 脚本文件与可执行文件的判断\n\
    4. 校验可执行文件是否能执行\n5. 进程管理结构的调整\n6. 释放进程占有的页面\n7. 调整线性地址空间、参数列表、堆栈地址\n8. 设置 eip\
    \ 和 esp，完成 execve 变身\n\n如果去掉一些逻辑校验，那核心逻辑就是**加载文件**、**调整内存**、**开始执行**三个步骤，由于这些部分已经非常复杂了，我们就去掉那些逻辑校验，直接让大家认清\
    \ `execve` 的本质。走你：\n\n### 读取文件开头 KB 的数据\n\n先是根据文件名，找到并读取文件内容\n\n```\n// exec.c\n\
    int do_execve(...) {\n    ...\n    // 根据文件名 /bin/sh 获取 inode\n    struct inode\
    \ * inode = name(filename);\n    // 根据 inode 读取文件第一块数据（1024KB）\n    struct buffer_head\
    \ * bh = bread(inode->i_dev,inode->i_zone[0]);\n    ...\n}\n```\n很简单，就是读取了文件（`/bin/sh`）第一个块，也就是数据。\n\
    \n[加载根系统](http://mp.weixin.com/s?biz=Mzk0ENDE0==&mid=2247502181&idx=1&sn=b6bd1d2cf300285208a1c4e65&chksm=2c5b3c8f5b23ade1532b7295dbc3b013820255e44e308b4d66a2ef304eb5cf77f6&scene=21)\
    \ 刚好是文件开头的结构。![](img/file24.webp)\n\nOK，现在数据就已经内存中了，但还没有解析。\n\n### 解析数据为 exec\
    \ 结构\n\n接下来的工作就是解析它，本质上按照指定的数据结构来解读\n\n```c\nexec.c\nint do_execve(...) {\n  \
    \  ... \n    struct exec ex = *((struct exec *)bh->b_data);\n    ...\n}\n```\n\
    先从刚刚读取文件返回的缓冲区指针取出数据，也就是文件前 1024 个字节，还是一段二进制数据。然后按照 `exec` 这个结构体进行解析，它便有了生命。\n\
    \n```c\nstruct exec {\n    // 魔数\n    unsigned long a_magic;\n    // 代码长度\n  \
    \  unsigned long a_text;\n    // 数据长度\n    unsigned long a_data;\n    // 未初始化数据长度\n\
    \    unsigned long a_bss;\n    // 符号表长度\n    unsigned long a_sym;\n    // 执行地址\n\
    \    unsigned long a_entry;\n    // 代码重定位长度\n    unsigned long a_trsize;\n   \
    \ // 数据重定位长度\n    unsigned long a_drsize;\n};\n```\n上面的代码就是 `exec` 结构体，这是格式头部。现在的\
    \ Linux 已经弃用了这种老的格式改用 ELF 格式了，但大体的思想是一致的。这个结构体里的字段表示什么，等我们用到了再说，你可以通过注释体会。\n\n\
    ### 判断是脚本文件还是可执行文件\n\n我们写一个 Linux 脚本的时候，通常可以看到前面有很多\n\n```\n#!/bin/sh\n#!/usr/bin/python\n\
    ```\n有没有想过我们可以直接执行这样的文件？其实逻辑就在下面代码里。\n\n```c\n// exec.c\nint do_execve(...) {\n\
    \    ...\n    if ((bh->b_data[0] == '#') && (bh->b_data[1] == '!')) {\n      \
    \  ...\n    }\n    bre(bh);\n    ...\n}\n```\n可以看到，很简单粗暴地判断前面两个字符是不是 `#!`，如果是的话就走脚本执行逻辑。当然，我们现在的\
    \ `/bin/sh` 是个可执行二进制文件，不符合这样的条件，所以这个 `if` 语句里面的内容也可以不看了，直接看外面执行可执行二进制文件的逻辑。第一步就是释放缓冲区，因为已经把这个块内容解析成\
    \ `exec` 结构保存到我们程序的栈里了，那么这个缓冲区就可以释放，用于其他读取时的缓冲区。不重要，我们继续往下。\n\n### 准备参数空间\n\n\
    我们执行 `/bin/sh` 时，还给它传了 `argc` 和 `envp` 参数，通过下面这一系列代码来实现。\n\n```c\n#define PAGE_SIZE\
    \ 4096\n#define MAX_ARG_PAGES 32\n// exec.c\nint do_execve(...) {\n    ...\n \
    \   // p = 0x1FFFC = 128K - 4\n    unsigned long p = PAGE_SIZE * MAX_ARG_PAGES\
    \ - 4;\n    ...\n    // p = 0x1FFF5 = 128K - 4 - 7\n    p = copy_strings(envc,envp,page,0);\n\
    \    // p = 0x1FFED = 128K - 4 - 7 - 8\n    p = copy_strings(argc,argv,page,0);\n\
    \    ...\n    // p = 0x3FFFFED = 64M - 4 - 7 - 8\n    p += change_ldt(ex.a_text,page);\n\
    \    // 设置栈\n    eip[0] = ex.a_entry;\n    eip[3] = p;\n}\n```\n\n"
- fmt: "\n```\n// exec.c\nint do_execve(...) {\n    ...\n    // 设置栈指针\n    eip[3]\
    \ = p;\n}\n```\n\n为什么这样操作就可以达到更换栈顶指针的作用呢？那我们结合着更换代码指针 `PC` 来进行讲解。\n\n### 设置 eip\
    \ 和 esp，完成摇身一变\n\n下面这两行就是 `execve` 完成摇身一变的关键，解释了它为什么能做到变成一个新程序开始执行的关键密码。\n\n```c\n\
    // exec.c\nint do_execve(unsigned long * eip, ...) {\n    ...\n    eip[0] = ex.a_entry;\n\
    \    eip[3] = p; \n    ...\n}\n```\n\n什么叫一个新程序开始执行呢？\n\n其实本质上就是，代码指针 `eip` 和栈指针\
    \ `esp` 指向了一个新的地方。\n\n代码指针 `eip` 决定了 CPU 将执行哪一段指令，栈指针 `esp` 决定了 CPU 压栈操作的位置，以及读取栈空间数据的位置，在高级语言视角下就是局部变量以及函数调用链的栈帧。\n\
    \n所以这两行代码，第一行重新设置了代码指针 `eip` 的值，指向 `/bin/sh` 这个 `a.out` 格式文件的头结构 `exec` 中的 `a_entry`\
    \ 字段，表示该程序的入口地址。\n\n第二行重新设置了栈指针 `esp` 的值，指向了我们经过一路计算得到的 `p`，也就是图中 `sp` 的值。将这个值作为新的栈顶十分合理。\n\
    \n![](media/file256.png \"fig:\")\n\n`eip` 和 `esp` 都设置好了，那么程序摇身一变的工作自然就结束了，非常简单。\n\
    \n至于为什么往 `eip` 的 0 和 3 索引位置处写入数据，就可以达到替换 `eip` 和 `esp` 的目的，那我们就得看看这个 `eip` 变量是怎么来的了。\n\
    \n### 计算机的世界没有魔法\n\n还记得 `execve` 的调用链么？\n\n```c\nstatic char * argv_rc[] = { \"\
    /bin/sh\", NULL };\nstatic char * envp_rc[] = { \"HOME=/\", NULL };\n\n// 调用方\n\
    execve(\"/bin/sh\",argv_rc,envp_rc);\n\n// 宏定义\n_syscall3(int,execve,const char\
    \ *,file,char **,argv,char **,envp)\n\n// 通过系统调用进入到这里\nEIP = 0x1C\n_sys_execve:\n\
    \    lea EIP(%esp),%eax\n    pushl %eax\n    call _do_execve\n    addl $4,%esp\n\
    \    ret\n\n// exec.c\nint do_execve(unsigned long * eip, ...) {\n    ...\n  \
    \  eip[0] = ex.a_entry;\n    eip[3] = p; \n    ...\n}\n```\n\n千万别忘了，我们这个 `do_execve`\
    \ 函数，是通过一开始的 `execve` 函数触发了系统调用来到的这里。\n\n系统调用是一种中断，前面说过，中断时 CPU 会给栈空间里压入一定的信息，这部分信息是死的，查手册可以查得到。\n\
    \n![](media/file257.webp \"fig:\")\n\n然后，进入中断以后，通过系统调用查表进入到 `_sys_execve` 这里。\n\
    \n```asm\nEIP = 0x1C\n_sys_execve:\n    lea EIP(%esp),%eax\n    pushl %eax\n \
    \   call _do_execve\n    addl $4,%esp\n    ret\n```\n\n看到没？在真正调用 `do_execve` 函数时，`_sys_execve`\
    \ 这段代码偷偷地插入了一个小步骤，就是把当前栈顶指针 `esp` 偏移到 `EIP` 处的地址值给当做第一个参数 `unsigned long * eip`\
    \ 传入进来了。\n\n而偏移 `EIP` 处的位置，恰好就是中断时压入的 `EIP` 值。所以 `eip[0]` 表示栈空间里的 `EIP` 位置，`eip[3]`\
    \ 表示栈空间里的 `ESP` 位置。\n\n![](media/file258.webp \"fig:\")\n\n由于我们现在处于中断，所以中断返回后也就是\
    \ `do_execve` 函数之后就会寻找中断返回前的几个值（包括 `eip` 和 `esp`）进行恢复。这里有疑惑的同学，看我之前写的[中断](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a)和[中断（软）](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a)这两篇文章，我认为把中断的原理彻底清楚了，不过就是读手册罢了。如果我们把栈空间里的\
    \ `eip` 和 `esp` 替换成 `/bin/sh` 所需要的 `eip` 和 `esp`，那么中断返回的“恢复”工作就犹如“跳转”到一个新程序一样，其实是我们欺骗了\
    \ CPU，达到了 `execve` 函数的效果。所以，计算机的世界没有魔法，通过这一点细节完成的，只是大部分人都不愿意花时间去究。\n\n### 总结\n\
    \n本章讲解了我 Linux 0.11 里面难理解的 `execve` 函数的核心逻辑，其实整个顺下来你会发现它完成的事情也是一个个简单的事情拼凑起来的。无非把参数表在一个空间里折腾去构造，然后把代码从哪里执行的\
    \ `eip` 和新的栈空间应该里的 `esp` 给弄好，完成了使命。\n\n至于 `/bin/sh` 文件是怎么构造出来的，那就是 `gcc` 编译和链接的事，而且\
    \ Linux 0.11 所用的执行文件格式 `a.out` 已经被现在的 `ELF` 格式取代，那就不在我们要研究的范畴，不然就无休止了。OK，至此，`execve`\
    \ 函数就彻底结束了。\n\n```c\nvoid init(void) {\n    ...\n    if (!(pid=fork())) {\n  \
    \      close(0);\n        open(\"/etc/rc\",O_RDONLY,0);\n        execve(\"/bin/sh\"\
    ,argv_rc,envp_rc);\n        _exit(2);\n    }\n    ...\n}\n```\n\n它的返回意味着接下来将执行\
    \ `/bin/sh` 这个执行文件里的代码。不过有两个问题：\n\n第一，`/bin/sh` 是躺在磁盘里的执行文件，并不是 Linux 内核的代码，所以其实里面是什么我们在\
    \ Linux 0.11 源码里是找不到的。也就是说，如果磁盘里并没有 `/bin/sh` 文件，Linux 0.11 是启动不起来的，在 `open` 的时候就会报错宕机了。\n\
    \n第二，我们只将 `/bin/sh` 文件的头部加载到了内存，其他部分并没有任何代码完成加载这个操作，那接下来跳转到一个并没有加载 `/bin/sh` 代码的内存时，会发生什么呢？\n\
    \n带着这两个疑问，期待后续的章节吧！欲知后事如何，且听下回分解。\n\n***\n\n## 第36回 | 缺页中断\n\n> 原文链接：[https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a&scene=21#wechat_redirect)\n\
    \n接上回，咱们说到进程 2 通过 `execve` 函数将自己摇身一变成为 `/bin/sh` 程序，也就是 `shell` 程序开始执行。\n\n```c\n\
    // main.c\nvoid init(void) {\n    ...\n    if (!(pid=fork())) {\n        close(0);\n\
    \        open(\"/etc/rc\",O_RDONLY,0);\n        execve(\"/bin/sh\",argv_rc,envp_rc);\n\
    \        _exit(2);\n    }\n    ...\n}\n```\n\n那么此时进程 2 就是 `shell` 程序了。进一步讲，相当于之前的进程\
    \ 1 通过 `fork + execve` 这两个函数的组合创建了一个新的进程去加载并执行 `shell` 程序。我们在 Linux 里执行一个程序，比如\
    \ `./xxx`，其内部实现都是 `fork + execve`。此时我们仅仅通过 `execve` 使得下一条指令执行到 `/bin/sh` 程序所在的内存起始处，也就是\
    \ `/bin/sh` 头部结构中 `a_entry` 所描述的地址。有个问题是，我们仅仅将 `/bin/sh` 文件的头部加载到了内存，其他部分并没有加载，那我们是怎么执行到的\
    \ `/bin/sh` 的指令呢？\n\n![](media/file259.webp \"fig:\")\n\n我们就带着这个问题，开始探索。\n\n###\
    \ 跳转到一个不存在的地址会发生什么\n\n`/bin/sh` 文件并不是 Linux 0.11 源码里的内容，Linux 0.11 只按照 `a.out`\
    \ 格式解读它，跳转到 `a.out` 头部数据结构 `a_entry` 所指向的内存地址去指令。所以这个 `a_entry` 的值，完全取决于硬盘中 `/bin/sh`\
    \ 文件是怎么构造的。我们简单点，假设它为 `0`，表示随后的 CPU 将跳转到 0 地址处执行。当然，这个 `0` 仅仅表示逻辑地址，既没有分段，也没有分页。之前说过无数次，Linux\
    \ 0.11 的每个进程是通过不同的描述符在线性空间中瓜分不同的空间，一个进程占 64M。\n\n![](media/file260.webp \"fig:\"\
    )\n\n由于我们现在所处的代码属于进程 2，所以逻辑地址 0 通过分段机制映射到线性空间就是 `0x800000`，表示 `128M` 位置处。好，`128M`\
    \ 这个线性地址，随后将会通过分页机制的映射转化为物理地址，这才定位到最终的真实物理内存。可是，`128M` 这个线性地址并没有页表映射它，也就是上面我们说的，除了\
    \ `/bin/sh` 文件的头部加载到了内存外，其他部分并没有加载操作。\n\n**再准确点说，是 0x800000 这个线性地址的访问，遇到了页表项的存在位\
    \ P 等于 0 的情况。**\n\n一旦遇到了这种情况，CPU 会触发一个中断：页错误（Page-Fault），这在 Intel 手册 Volume-3\
    \ Chapter 4.7 章节里给出了这个信息。\n\n![](media/file261.webp \"fig:\")\n\n当然，Page-Fault\
    \ 在很多情况都会触发，具体是因为什么触发的，CPU 会帮我们保存在中断的出错码 `Error Code` 里，这在随后的 Figure 4-12 中给出了详细的出错说明。\n\
    \n![](media/file262.webp \"fig:\")\n\n这块之所以讲这么详细，因为我想让大家知道一切的原理都有一手资料的来源，这些一手资料写的都非常详细和友好，大家完全不必道听听说，也不必毫无头绪地搜索网上的博客。当然，与本文相关的，就是这个存在位\
    \ `P`。\n\n当触发这个 Page-Fault 中断后，就会进入 Linux 0.11 源码中的 `page_fault` 方法，由于 Linux 0.11\
    \ 的 `page_fault` 是汇编写的，很不直观，这里我选 Linux 1.0 的代码给大家看，逻辑是一样的。\n\n```c\nvoid do_page_fault(...,\
    \ unsigned long error_code) {\n    ... \n    if (error_code & 1)\n        do_wp_page(error_code,\
    \ address, current, user_esp);\n    else\n        do_no_page(error_code, address,\
    \ current, user_esp);\n    ...\n}\n```\n\n根据 `error_code` 的不同，有不同的逻辑。\n"
