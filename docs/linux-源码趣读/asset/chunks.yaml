    \ 给出了整个操作系统代码的鸟瞰视角。\n\n```\n// main.c\nvoid main() {\n    // 初始化环境\n    // 外层操作系统循环\n\
    \    while(1) {\n        // 内层 shell 程序循环\n        while(1) {\n            //\
    \ 读取命令\n            ...\n            // 创建进程\n            ...\n            //\
    \ 执行命令\n            ...\n        }\n    }\n}\n```\n\n可以看出，不仅 shell 程序是个死循环，整个操作系统也是死循环。除此之外，这里所有的键盘输入、系统调用、进程调度，都需要`中断`来驱动，所以很久之前我说，操作系统是个中断驱动的死循环，就是这个道理。\n\
    \nOK！到此为止，操作系统终于启动完毕，达到了怠速的状态，它本身设置好堆中断处理程序，随时等待中断的到来进行处理，同时运行了一个 shell 程序用来人类友好的方式交互。\n\
    \n------\n\n我们前四部分，终于把整个启动流程清楚了，如果你头脑中已经像电影般把启动流程清晰，相信你不再恐惧操作系统源码了。\n\n"
- fmt: "\n> 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502876&idx=1&sn=2c34491abd6ea14c9c7ccc3d2d9827c1&chksm=c2c5b6b1f5b23fa7bdf9c3e2bf811b84da937d30a2c9825ceba8a57c2c3e8e157dedae0bfc8d&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502876&idx=1&sn=2c34491abd6ea14c9c7ccc3d2d9827c1&chksm=c2c5b6b1f5b23fa7bdf9c3e2bf811b84da937d30a2c9825ceba8a57c2c3e8e157dedae0bfc8d&scene=21#wechat_redirect)\n\
    \n新建一个非常简单的 `info.txt` 文件。\n\n```\nname:flash\nage:28\nlanguage:java\n```\n\n\
    在命令行输入一条十分简单的命令。\n\n```\n[root@linux0.11] cat info.txt | wc -l\n3\n```\n\n这条命令的意思是读取刚刚的\
    \ `info.txt` 文件，输出它的行数。\n\n我们先从最初始的状态开始说起。\n\n最初始的状态，电脑屏幕前只有这么一段话。\n\n```\n[root@linux0.11]\n\
    ```\n\n然后，我们按下按键 'c'，将会变成这样。\n\n```\n[root@linux0.11] c\n```\n\n我们再按下 'a'。\n\n\
    ```\n[root@linux0.11] ca\n```\n\n接下来，我们再依次按下 't'、空格、'i' 等等等，才变成了这样。\n\n```\n[root@linux0.11]\
    \ cat info.txt | wc -l\n```\n\n我们今天就要解释这个看起来十分\"正常\"的过程。\n\n凭什么我们按下键盘后，屏幕上就会出现如此的变化呢？老天爷规定的么？\n\
    \n我们就从按下键盘上的 'c' 键开始说起。\n\n首先，得益于 [第16回 | 控制台初始化 tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect)\
    \ 中讲述的一行代码。\n\n```\nconsole.c\nvoid con_init(void) {\n    set_trap(0x21,&keyboard_interrupt);\n\
    }\n```\n\n我们成功将键盘中断绑定在了 `keyboard_interrupt` 这个中断函数上，也就是说当我们按下 'c' 时，CPU 的中断机制将会触发，最终执行到\
    \ `keyboard_interrupt` 函数中。\n\n我们来到 `keyboard_interrupt` 函数探究竟。\n\n```\nkeyboard.s\n\
    keyboard_interrupt:\n    // 读取扫描码\n    in $0x60,%al\n    // 调用对应按键函数\n    call\
    \ *key_table,%eax\n    // 0 作为参数，调用 do_tty\n    push $0\n    call do_tty\n```\n\
    \n很简单，首先通过 IO 端口从键盘中读取了刚刚产生的扫描码，就是按下 'c' 的时候产生的扫描码。随后，在 `key_table` 中寻找不同按键对应的处理函数，比如普通的一个字母\
    \ 'c' 的处理函数为 `do_self`，该函数会将扫描码转换为 ASCII 字符，并将自己放入一个队列里，我们稍后再说部分的细节。\n\n接下来，就是调用\
    \ `do_tty_interrupt` 函数，就是处理终端的中断处理，注意这里传递了一个参数 0。\n\n```\ntty_io.c\nvoid do_tty_interrupt(int\
    \ tty) {\n    copy_to_cooked(tty_table+tty);\n}\nvoid copy_to_cooked(struct tty_struct\
    \ *tty) {\n    ...\n}\n```\n\n这个函数几乎什么都没做，将 `keyboard_interrupt` 时传入的参数 0 作为 `tty_table`\
    \ 的索引，找到 `tty_table` 中的第 0 项作为下一个函数的入参，仅此。\n\n`tty_table` 是终端设备表，在 Linux 0.11\
    \ 中定义了三项，分别是控制台、串行终端 1 和串行终端 2。\n\n```\ntty.h\nstruct tty_struct tty_table[] =\
    \ {\n    {\n        ...},\n        0,          /* initial pgrp */\n        0,\
    \          /* initial stopped */\n        con_write,\n        {0,0,0,\"\"},  \
    \     /* console read-queue */\n        {0,0,0,\"\"},       /* console write-queue\
    \ */\n        {0,0,0,\"\"}        /* console secondary queue */\n    },\n    {...},\n\
    \    {...}\n};\n```\n\n我们用的往屏幕输出内容的终端，就是 0 号索引处的控制台终端，所以我将另外两个终端定义的代码省略掉了。\n\n\
    `tty_table` 终端设备表中的每一项结构是 `tty_struct`，用来描述一个终端的属性。\n\n```\nstruct tty_struct\
    \ {\n    struct termios termios;\n    int pgrp;\n    int stopped;\n    void (*write)(struct\
    \ tty_struct * tty);\n    struct tty_queue read_q;\n    struct tty_queue write_q;\n\
    \    struct tty_queue secondary;\n};\n\nstruct tty_queue {\n    unsigned long\
    \ data;\n    unsigned long head;\n    unsigned long tail;\n    struct task_struct\
    \ * proc_list;\n    char buf[TTY_BUF_SIZE];\n};\n```\n\n说说其中关键几个：`termios` 定义了终端的各种模式，包括读模式、写模式、控制模式等，之后再说。\n\
    \n`void (*write)(struct tty_struct * tty)` 是一个接口，在 `tty_table` 中也可以被定义为了 `con_write`，也就是说后续调用\
    \ 0 号终端的写操作时，调用的是 `con_write` 函数，这就是接口。还有三个队列分别为 `read_q`、`write_q` 以及辅助队列 `secondary`。这些有什么用，我们通通再说，跟着我看。\n\
    \n```\ntty_io.c\nvoid do_tty_interrupt(int tty) {\n    copy_to_cooked(tty_table+tty);\n\
    }\nvoid copy_to_cooked(struct tty_struct *tty) {\n    signed char c;\n    while\
    \ (!EMPTY(tty->read_q) && !FULL(tty->secondary)) {\n        // 从 read_q 中取出字符\n\
    \        GETCH(tty->read_q,c);\n        ...\n        // 这里省略了一坨行规则代码\n       \
    \ ...\n        // 将处理后的字符放入 secondary\n        PUTCH(c,tty->secondary);\n    }\n\
    \    wake_up(&tty->secondary.proc_list);\n}\n```\n\n展开 `copy_to_cooked` 函数我们发现，一个框架已经有了。在\
    \ `copy_to_cooked` 函数里就是循环，只要读队列 `read_q` 不为空且辅助队列 `secondary` 没有满，就不断从 `read_q`\
    \ 中取出字符，经过的处理写入 `secondary` 队列里。否则，就唤醒等待辅助队列 `secondary` 的进程，之后怎么做由进程决定。\n\n接着看，中间的处理过程做了事情？这一有很多\
    \ `if` 判断，但都是围绕着同一个目的，我们举其中一个简单的例子：\n\n```\n#define IUCLC 0001000\n#define _I_FLAG(tty,f)\
    \  ((tty)->termios.c_iflag & f)\n#define I_UCLC(tty) _I_FLAG((tty),IUCLC)\n\n\
    void copy_to_cooked(struct tty_struct * tty) {\n    ...\n    // 这里省略了一坨行规则代码\n\
    \    if (I_UCLC(tty))\n        c=tolower(c);\n    ...\n}\n```\n\n简单说，就是通过判断 `tty`\
    \ 中的 `termios`，来决定对读出的字符 `c` 做一些处理。在这里，就是判断 `termios` 中的 `c_iflag` 中的第 4 位是否为\
    \ 1，来决定是否将读出的字符 `c` 由大写变为小写。这个 `termios` 就是定义了终端的模式。\n\n```\nstruct termios {\n\
    \    unsigned long c_iflag;      /* input mode flags */\n    unsigned long c_oflag;\
    \      /* output mode flags */\n    unsigned long c_cflag;      /* control mode\
    \ flags */\n    unsigned long c_lflag;      /* local mode flags */\n    unsigned\
    \ char c_line;       /* line discipline */\n    unsigned char c_cc[NCCS];   /*\
    \ control characters */\n};\n```\n\n比如刚刚的是否要将大写变为小写，是否将回车字符替换成换行字符，是否接受键盘控制字符信号如\
    \ `ctrl + c` 等。这些模式不是 Linux 0.11 自己乱想出来的，而是实现了 `POSIX.1` 中规定的 `termios` 标准，具体可以参见：https://pubs.opengroup.org/onlinepubs/9699919799/basedefs/V1_chap11.html#\n"
  raw: "> 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502876&idx=1&sn=2c34491abd6ea14c9c7ccc3d2d9827c1&chksm=c2c5b6b1f5b23fa7bdf9c3e2bf811b84da937d30a2c9825ceba8a57c2c3e8e157dedae0bfc8d&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502876&idx=1&sn=2c34491abd6ea14c9c7ccc3d2d9827c1&chksm=c2c5b6b1f5b23fa7bdf9c3e2bf811b84da937d30a2c9825ceba8a57c2c3e8e157dedae0bfc8d&scene=21#wechat_redirect)\n\
    \n新建一个非常简单的 info.txt 文件。\n\n```\nname:flash\nage:28\nlanguage:java\n```\n\n在命令行输入一条十分简单的命令。\n\
    \n```\n[root@linux0.11] cat info.txt | wc -l\n3\n```\n\n这条命令的意思是读取刚刚的 info.txt\
    \ 文件，输出它的行数。\n\n我们先从最初始的状态开始说起。\n\n最初始的状态，电脑屏幕前只有这么一段话。\n\n```\n[root@linux0.11]\n\
    ```\n\n然后，我们按下按键 'c'，将会变成这样。\n\n```\n[root@linux0.11] c\n```\n\n我们再按下 'a'\n\n\
    ```\n[root@linux0.11] ca\n```\n\n接下来，我们再依次按下 't'、空格、'i' 等等，才变成了这样。\n\n```\n[root@linux0.11]\
    \ cat info.txt | wc -l\n```\n\n我们今天就要解释这个看起来十分\"正常\"的过程。\n\n凭什么我们按下键盘后，屏幕上就会出现如此的变化呢？老天爷规定的么？\n\
    \n我们就从按下键盘上的 'c' 键开始说起。\n\n首先，得益于 [第16回 | 控制台初始化 tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect)\
    \ 中讲述的一行代码。\n\n```\n[](#cb294-1)// console.c\n[](#cb294-2)void con_init(void)\
    \ {\n[](#cb294-3)    ...\n[](#cb294-4)    set_trap_gate(0x21,&keyboard_interrupt);\n\
    [](#cb294-5)    ...\n[](#cb294-6)}\n```\n\n我们成功将键盘中断绑定在了 **keyboard_interrupt**\
    \ 这个中断处理函数上，也就是说当我们按下键盘 'c' 时，CPU 的中断机制将会被触发，最终执行到这个 keyboard_interrupt 函数中。\n\
    \n我们来到 keyboard_interrupt 函数一探究竟。\n\n```\n[](#cb295-1)// keyboard.s\n[](#cb295-2)keyboard_interrupt:\n\
    [](#cb295-3)    ...\n[](#cb295-4)    // 读取键盘扫描码\n[](#cb295-5)    inb $0x60,%al\n\
    [](#cb295-6)    ...\n[](#cb295-7)    // 调用对应按键的处理函数\n[](#cb295-8)    call *key_table(,%eax,4)\n\
    [](#cb295-9)    ...\n[](#cb295-10)    // 0 作为参数，调用 do_tty_interrupt\n[](#cb295-11)\
    \    pushl $0\n[](#cb295-12)    call do_tty_interrupt\n[](#cb295-13)    ...\n\
    ```\n\n很简单，首先通过 IO 端口操作，从键盘中读取了刚刚产生的键盘扫描码，就是刚刚按下 'c' 的时候产生的键盘扫描码。\n\n随后，在 key_table\
    \ 中寻找不同按键对应的不同处理函数，比如普通的一个字母对应的字符 'c' 的处理函数为 do_self，该函数会将扫描码转换为 ASCII 字符码，并将自己放入一个队列里，我们稍后再说这部分的细节。\n\
    \n接下来，就是调用 **do_tty_interrupt** 函数，见名知意就是处理终端的中断处理函数，注意这里传递了一个参数 0。\n\n我们接着探索，打开\
    \ do_tty_interrupt 函数。\n\n```\n[](#cb296-1)// tty_io.c\n[](#cb296-2)void do_tty_interrupt(int\
    \ tty) {\n[](#cb296-3)    copy_to_cooked(tty_table+tty);\n[](#cb296-4)}\n[](#cb296-5)\n\
    [](#cb296-6)void copy_to_cooked(struct tty_struct * tty) {\n[](#cb296-7)    ...\n\
    [](#cb296-8)}\n```\n\n这个函数几乎什么都没做，将 keyboard_interrupt 时传入的参数 0，作为 tty_table 的索引，找到\
    \ tty_table 中的第 0 项作为下一个函数的入参，仅此而已。\n\ntty_table 是**终端设备表**，在 Linux 0.11 中定义了三项，分别是**控制台**、**串行终端\
    \ 1** 和**串行终端 2**。\n\n```\n[](#cb297-1)// tty.h\n[](#cb297-2)struct tty_struct\
    \ tty_table[] = {\n[](#cb297-3)    {\n[](#cb297-4)        {...},\n[](#cb297-5)\
    \        0,          /* initial pgrp */\n[](#cb297-6)        0,          /* initial\
    \ stopped */\n[](#cb297-7)        con_write,\n[](#cb297-8)        {0,0,0,0,\"\"\
    },       /* console read-queue */\n[](#cb297-9)        {0,0,0,0,\"\"},       /*\
    \ console write-queue */\n[](#cb297-10)        {0,0,0,0,\"\"}        /* console\
    \ secondary queue */\n[](#cb297-11)    },\n[](#cb297-12)    {...},\n[](#cb297-13)\
    \    {...}\n[](#cb297-14)};\n```\n\n我们用的往屏幕上输出内容的终端，就是 0 号索引位置处的控制台终端，所以我将另外两个终端定义的代码省略掉了。\n\
    \ntty_table 终端设备表中的每一项结构，是 tty_struct，用来描述一个终端的属性。\n\n```\n[](#cb298-1)struct\
    \ tty_struct {\n[](#cb298-2)    struct termios termios;\n[](#cb298-3)    int pgrp;\n\
    [](#cb298-4)    int stopped;\n[](#cb298-5)    void (*write)(struct tty_struct\
    \ * tty);\n[](#cb298-6)    struct tty_queue read_q;\n[](#cb298-7)    struct tty_queue\
    \ write_q;\n[](#cb298-8)    struct tty_queue secondary;\n[](#cb298-9)};\n[](#cb298-10)\n\
    [](#cb298-11)struct tty_queue {\n[](#cb298-12)    unsigned long data;\n[](#cb298-13)\
    \    unsigned long head;\n[](#cb298-14)    unsigned long tail;\n[](#cb298-15)\
    \    struct task_struct * proc_list;\n[](#cb298-16)    char buf[TTY_BUF_SIZE];\n\
    [](#cb298-17)};\n```\n\n说说其中较为关键的几个。\n\n**termios** 是定义了终端的各种模式，包括读模式、写模式、控制模式等，这个之后再说。\n\
    \n**void (*write)(struct tty_struct * tty)** 是一个接口函数，在刚刚的 tty_table 中我们也可以看出被定义为了\
    \ con_write，也就是说今后我们调用这个 0 号终端的写操作时，将会调用的是这个 con_write 函数，这不就是接口思想么。\n\n还有三个队列分别为**读队列\
    \ read_q**，**写队列 write_q** 以及一个**辅助队列 secondary**。\n\n这些有什么用，我们通通之后再说，跟着我接着看。\n\
    \n```\n[](#cb299-1)// tty_io.c\n[](#cb299-2)void do_tty_interrupt(int tty) {\n\
    [](#cb299-3)    copy_to_cooked(tty_table+tty);\n[](#cb299-4)}\n[](#cb299-5)\n\
    [](#cb299-6)void copy_to_cooked(struct tty_struct * tty) {\n[](#cb299-7)    signed\
    \ char c;\n[](#cb299-8)    while (!EMPTY(tty->read_q) && !FULL(tty->secondary))\
    \ {\n[](#cb299-9)        // 从 read_q 中取出字符\n[](#cb299-10)        GETCH(tty->read_q,c);\n\
    [](#cb299-11)        ...\n[](#cb299-12)        // 这里省略了一大坨行规则处理代码\n[](#cb299-13)\
    \        ...\n[](#cb299-14)        // 将处理过后的字符放入 secondary\n[](#cb299-15)    \
    \    PUTCH(c,tty->secondary);\n[](#cb299-16)    }\n[](#cb299-17)    wake_up(&tty->secondary.proc_list);\n\
    [](#cb299-18)}\n```\n\n展开 **copy_to_cooked** 函数我们发现，一个大体的框架已经有了。\n\n在 copy_to_cooked\
    \ 函数里就是个大循环，只要读队列 read_q 不为空，且辅助队列 secondary 没有满，就不断从 read_q 中取出字符，经过一大坨的处理，写入\
    \ secondary 队列里。\n\n![](media/file294.webp \"fig:\")\n\n否则，就唤醒等待这个辅助队列 secondary\
    \ 的进程，之后怎么做就由进程自己决定。\n\n我们接着看，中间的一大坨处理过程做了什么事情呢？\n\n这一大坨有太多太多的 if 判断，但都是围绕着同一个目的，我们举其中一个简单的例子。\n\
    \n```\n[](#cb300-1)#define IUCLC 0001000\n[](#cb300-2)#define _I_FLAG(tty,f) \
    \ ((tty)->termios.c_iflag & f)\n[](#cb300-3)#define I_UCLC(tty) _I_FLAG((tty),IUCLC)\n\
    [](#cb300-4)\n[](#cb300-5)void copy_to_cooked(struct tty_struct * tty) {\n[](#cb300-6)\
    \    ...\n[](#cb300-7)    // 这里省略了一大坨行规则处理代码\n[](#cb300-8)    if (I_UCLC(tty))\n\
    [](#cb300-9)        c=tolower(c);\n[](#cb300-10)    ...\n[](#cb300-11)}\n```\n\
    \n简单说，就是通过判断 tty 中的 termios，来决定对读出的字符 c 做一些处理。\n\n在这里，就是判断 termios 中的 c_iflag\
    \ 中的第 4 位是否为 1，来决定是否要将读出的字符 c 由大写变为小写。\n\n这个 termios 就是定义了终端的**模式**。\n\n```\n\
    [](#cb301-1)struct termios {\n[](#cb301-2)    unsigned long c_iflag;      /* input\
    \ mode flags */\n[](#cb301-3)    unsigned long c_oflag;      /* output mode flags\
    \ */\n[](#cb301-4)    unsigned long c_cflag;      /* control mode flags */\n[](#cb301-5)\
    \    unsigned long c_lflag;      /* local mode flags */\n[](#cb301-6)    unsigned\
    \ char c_line;       /* line discipline */\n[](#cb301-7)    unsigned char c_cc[NCCS];\
    \   /* control characters */\n[](#cb301-8)};\n```\n\n比如刚刚的是否要将大写变为小写，是否将回车字符替换成换行字符，是否接受键盘控制字符信号如\
    \ ctrl + c 等。\n\n这些模式不是 Linux 0.11 自己乱想出来的，而是实现了 **POSIX.1** 中规定的 **termios 标准**，具体可以参见：\n\
    \n[https://pubs.opengroup.org/onlinepubs/9699919799/basedefs/V1_chap11.html#tag_11](https://pubs.opengroup.org/onlinepubs/9699919799/basedefs/V1_chap11.html#tag_11)\n\
    \n![](media/file295.webp \"fig:\")\n\n好了，我们目前可以总结出，按下键盘后做了什么事情。\n\n![](media/file296.webp\
    \ \"fig:\")\n\n这里我们应该产生几个疑问。\n\n**一、读队列 read_q 里的字符是什么时候放进去的？**\n\n还记不记得最开始讲的\
    \ keyboard_interrupt 函数，我们有一个方法没有展开讲。\n\n```\n// keyboard.s\nkeyboard_interrupt:\n\
    \    ...\n    // 读取键盘扫描码\n    inb $0x60,%al\n    ...\n    // 调用对应按键的处理函数\n   \
    \ call *key_table(,%eax,4)\n    ...\n    // 0 作为参数，调用 do_tty_interrupt\n    pushl\
    \ $0\n    call do_tty_interrupt\n    ...\n```\n\n就是这个 **key_table**，我们将其展开。\n\n\
    ```\n// keyboard.s\nkey_table:\n    .long none,do_self,do_self,do_self  /* 00-03\
    \ s0 esc 1 2 */\n    .long do_self,do_self,do_self,do_self   /* 04-07 3 4 5 6\
    \ */\n    ...\n    .long do_self,do_self,do_self,do_self   /* 20-23 d f g h */\n\
    \    ...\n```\n\n可以看出，普通的字符 abcd 这种，对应的处理函数是 **do_self**，我们再继续展开。\n\n```\n// keyboard.s\n\
    do_self:\n    ...\n    // 扫描码转换为 ASCII 码\n    lea key_map,%ebx\n    1: movb (%ebx,%eax),%al\n\
    \    ...\n    // 放入队列\n    call put_queue\n```\n\n可以看到最后调用了 **put_queue** 函数，顾名思义**放入队列**，看来我们要找到答案了，继续展开。\n\
    \n```\n[](#cb305-1)// tty_io.c\n[](#cb305-2)struct tty_queue * table_list[]={\n\
    [](#cb305-3)    &tty_table[0].read_q, &tty_table[0].write_q,\n[](#cb305-4)   \
    \ &tty_table[1].read_q, &tty_table[1].write_q,\n[](#cb305-5)    &tty_table[2].read_q,\
    \ &tty_table[2].write_q\n[](#cb305-6)};\n[](#cb305-7)\n[](#cb305-8)// keyboard.s\n\
    [](#cb305-9)put_queue:\n[](#cb305-10)    ...\n[](#cb305-11)    movl table_list,%edx\
    \ # read-queue for console\n[](#cb305-12)    movl head(%edx),%ecx\n[](#cb305-13)\
    \    ...\n```\n\n可以看出，put_queue 正是操作了我们 tty_table 数组中的零号位置，也就是控制台终端 tty 的 **read_q\
    \ 队列**，进行入队操作。\n\n答案揭晓了，那我们的整体流程图也可以再丰富起来。\n\n![](media/file297.webp \"fig:\"\
    )\n\n**二、放入 secondary 队列之后呢？**"
