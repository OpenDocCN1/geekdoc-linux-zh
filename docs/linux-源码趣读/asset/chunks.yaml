  trans: "\nThis shell program will not exit; it will continuously accept the commands\
    \ we input from the keyboard and then execute our commands through the `fork+execve`\
    \ functions, which was discussed in the previous session.\n\nOf course, if this\
    \ `shell` process also exits, the operating system will not escape this large\
    \ loop but will continue to retry.\n\nThe entire operating system stops here and\
    \ looks exactly like this.\n\n```c\n// main.c\nvoid main() {\n    // Initialize\
    \ environment\n    ...\n    // Outer OS main loop\n    while(1) {\n        //\
    \ Inner shell program small loop\n        while(1) {\n            // Read command\
    \ read\n            ...\n            // Create process fork\n            ...\n\
    \            // Execute command execve\n            ...\n        }\n    }\n}\n\
    ```\n\nOf course, this is just the surface.\n\nIn addition, all keyboard inputs,\
    \ system calls, and process scheduling here require `interrupts` to drive them.\
    \ As I said a long time ago, `the operating system is an interrupt-driven infinite\
    \ loop`, and that is why.\n\nOK! At this, the operating system has finally finished\
    \ booting and reached an idle state. It has set up a series of interrupt handlers,\
    \ waiting at any time for interrupts to arrive for processing, while running a\
    \ shell program to accept commands from ordinary users, interacting in a human-friendly\
    \ way.\n\nPerfect!\n\nAs for what happens next, stay to the next chapter.\n\n\
    ***\n\n## Chapter 39 | Extra - Linux 0.11 Kernel Debugging\n\nLinux 0.11 is the\
    \ earliest code of Linux, making it very suitable as the first code to deeply\
    \ explore the principles of operating systems.\n\nBut at the same time, due to\
    \ the lack of many ancient toolchains and some outdated file formats like `a.out`,\
    \ it is extremely difficult to successfully compile and run it, let alone perform\
    \ source-level `debug`.\n\nTo successfully debug Linux 0.11, many steps are required,\
    \ and it depends on some ancient toolchains. For us who simply use Linux 0.11\
    \ as a means to study operating systems, there is no need to spend energy modifying\
    \ it ourselves and falling into various pitfalls.\n\nSo today I will share one\
    \ method of mine for debugging Linux 0.11, and also for my own convenience to\
    \ follow the tutorial and set up the environment blindly when I switch computers\
    \ later. Let's begin~\n\n### Overall Idea and Effect\n\nThe method I use is to\
    \ create an Ubuntu 16.04 virtual machine on Windows, use `qemu` inside to start\
    \ a Linux 0.11 system with debugging enabled, and then use the local `vscode remote\
    \ ssh` to connect to the virtual machine, enabling `gdb` debugging. The final\
    \ effect is as follows.\n\nThis is the most comfortable way because `vscode` is\
    \ on the local machine, completely unaffected by the virtual machine; this is\
    \ also the method I prefer when debugging other code.\n\nIf you have your own\
    \ deluxe server, you can replace the virtual machine with a server. This not only\
    \ makes the compilation faster and doesn't consume your computer's performance,\
    \ but also allows you to debug at any time at home or in the office without being\
    \ affected by the terminal (convenient for slacking off~).\n\nOf course if you\
    \ don't need the intuitive `vscode`, this step can be replaced with the `gdb`\
    \ command line, simply executing `gdb` related commands directly in the virtual\
    \ machine.\n\n### Step 1: Configure the Virtual Machine\n\nThe virtual machine\
    \ software I used is `Oracle VM VirtualBox Version 6.0.8 Edition`.\n\nThe official\
    \ website is: `https://ubuntu.com/`\n\nThe download page is: `https://www.virtualbox.org/wiki/Download_Old_Builds_6_0`\n\
    \nThe direct link for my version is: `https://download.virtualbox.org/virtualbox/6.0.8/VirtualBox-6.0.8-130520-Win.exe`\n\
    \nThe OS image I installed is `ubuntu-16.04.7-desktop-amd64`.\n\nThe official\
    \ website is: `https://ubuntu.com/`\n\nThe download page is: `https://releases.ubuntu.com/xenial/`\n\
    \nThe direct link for my version is: `https://releases.ubuntu.com/xenial/ubuntu-16.04.7-desktop-amd64.iso`\n\
    \nI won't elaborate on this; achieving the final effect is what matters.\n\n###\
    \ Step 2: Install QEMU\n\n`qemu` is an emulator, simply similar to a virtual machine,\
    \ used to boot Linux 0.11. The official website is: `https://www.qemu.org/`\n\n\
    In the Ubuntu virtual machine we just created, we follow the tutorial to execute\
    \ `sudo apt-get install qemu`.\n\nAfter downloading, we type `qemu-` and press\
    \ `tab` to see supported architectures. Seeing `qemu-system-x86_64`, we use this\
    \ to start Linux 0.11.\n\n### Step 3: Download and Run Debuggable Linux 0.11 Source\n\
    \nThis step cannot be done by direct download because it depends on many ancient\
    \ toolchains. Here, we refer to the teacher's modified Linux 0.11 source code\
    \ using modern toolchains, choosing the repository: `https://github.com/yuan-xy/Linux-0.11`.\
    \ Download the source code directly, enter the root directory, and type `make\
    \ start` to get Linux 0.11 running.\n\nIf you want to debug, type `make debug`,\
    \ and it will hang. At this point, you can debug through `gdb`. Open another window,\
    \ type `gdb tools/system` and then `target remote :1234`.\n\n### Step 4: Remote\
    \ Debugging via VS Code\n\nOf course, you can also install the `vscode-remote-ssh`\
    \ plugin in the virtual machine. Press `ctrl + p`, type `remote-ssh`, and find\
    \ `Connect to Host`. Follow the prompts to enter your virtual machine IP and username,\
    \ then enter the password to connect to the virtual machine. Afterward, click\
    \ \"Run and Debug\" in the menu bar, and in the pop-up `launch.json`, make the\
    \ following configuration:\n\n```json\n{\n    \"version\": \"0.2.0\",\n    \"\
    configurations\": [\n        {\n            \"name\": \"(gdb) Launch\",\n    \
    \        \"type\": \"cppdbg\",\n            \"request\": \"launch\",\n       \
    \     \"program\": \"${workspaceFolder}/tools/system\",\n            \"miDebuggerServerAddress\"\
    : \"127.0.0.1:1234\",\n            \"args\": [],\n            \"stopAtEntry\"\
    : false,\n            \"cwd\": \"${workspaceFolder}\",\n            \"environment\"\
    : [],\n            \"MIMode\": \"gdb\"\n        }\n    ]\n}\n```\n\nAfter configuring\
    \ and saving, set a breakpoint in the `main` function, and click \"Run and Debug\"\
    \ again in the menu bar; you will find the debugging is successful. Remember that\
    \ before every `vscode` debug, run Linux 0.11 in the virtual machine first by\
    \ executing the command `make debug`.\n\n***\n\n## Chapter 40 | Extra - Why You\
    \ Can't Understand It No Matter How\n\nLinux 0.11 is the earliest code of Linux,\
    \ making it very suitable as the first code to deeply explore the principles of\
    \ operating systems.\n\nBut at the same time, due to the lack of many ancient\
    \ toolchains and some outdated file formats like `a.out`, it is extremely difficult\
    \ to successfully compile and run it, let alone perform source-level debug.\n\n\
    To successfully debug Linux 0.11, many steps are required, and it depends on some\
    \ ancient toolchains. For us who simply use Linux 0.11 as a means to study operating\
    \ systems, there is no need to spend energy modifying it ourselves and falling\
    \ into various pitfalls.\n\n"
- fmt: "\n通过 [第二部分 | 大战前期的初始化工作](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500983&idx=1&sn=ad4c430823c975df97f13de3fbe8c66e&scene=21&token=1321039476&lang=zh_CN#wechat_redirect)\
    \ 完成了内核中各种管理结构的初始化，如内存管理结构初始化`mem_init`，进程调度管理结构初始化`sched_init` 等，对应 `main` 方法中的`xxx_init`\
    \ 系列方法。\n\n通过 [第三部分 | 一个新进程的诞生](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501947&idx=1&sn=cb94f53c75d674d30fb4903778c74c08&chksm=c2c5b2d6f5b23bc027d9652d3e9949e55fd3b101beb87f6f80dd77d8233c0b51bede73edad46&scene=21&token=1321039476&lang=zh_CN#wechat_redirect)\
    \ 讲述了`fork` 函数的原理，也就是进程 0 创建进程 1 的过程，对应 `main` 方法中的`fork` 函数。\n\n通过 第四部分 | shell\
    \ 程序的到来 讲述了从加载根文件系统到最终创建出与用户交互的 shell 进程的过程，对应 `main` 方法中的`init` 函数。\n\n**至此操作系统启动完毕，达到怠速状态。**\n\
    \n纵观整个操作系统的源码，前四部分对应的代码如下，这就是启动流程中的全部代码了。\n\n```\n--- 第一部分 进入内核前的苦力活 ---\nbootsect.s\n\
    setup.s\nhead.s\n\nmain.c\nvoid main(void) {\n    --- 第二部分 大战前期的初始化工作 ---\n  \
    \  mem_init(main_memory_start,memory_end);\n    trap_init();\n    blk_dev_init();\n\
    \    chr_dev_init();\n    tty_init();\n    time_init();\n    sched_init();\n \
    \   buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n    sti();\n\
    \    --- 第三部分 一个新进程的诞生 ---\n    move_to_user_mode();\n    if (!fork()) {\n   \
    \     --- 第四部分 shell程序的到来 ---\n        init();\n    }\n    for(;;) pause();\n\
    }\n```\n\n------\n\n具体展开第四部分，我们首先通过 [第31回 | 拿到硬盘信息](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502161&idx=1&sn=219186a1e587f40308515852d293aaf4&chksm=c2c5b3fcf5b23aead170092d4042abd54b272694cbaac3f750eb3adea584ee29653c72ad2915&scene=21#wechat_redirect)\
    \ 和 [第32回 | 加载根文件系统](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502181&idx=1&sn=b6dcbd1d2cf930002852008a1c4e6a65&chksm=c2c5b3c8f5b23ade1532b725995dbc3b0138202555e44a6e308b84d668a2ef3041eb5cf77f86&scene=21#wechat_redirect)\
    \ 使得内核具有了以文件系统管理硬盘数据的能力。\n\n![media/file285.webp]\n\n接下来 [第33回 | 打开终端设备](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502230&idx=1&sn=44e023bf0b9c3726135a6e3722bc57f)c2c5b3f25b23a210099601111555574114482ba42a)\
    \ 使用刚刚建立好的文件系统，打开`/dev/tty0` 这个终端文件，此时内核便具有了与外设的能力，具体体现为调用`printf` 函数往屏幕上打印。\n\
    \n![media/file286.webp]\n\n接下来 [第34回 | 进程创建](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502269&idx=1&sn=19f6831de5bac8d0a58b0757db1f4a15e9d9eefa046888573d60e75261edae53a)\
    \ 利用刚刚建立好的文件系统，以及进程 1 的外设交互的能力，创建出了进程 2，此时进程 2 与进程 1 一样具有与外设的能力，这为后面 shell 程序的创建好了基础。\n\
    \n![media/file287.webp]\n\n然后，进程 2 此时在 [第35回 | execve加载并执行 shell 程序](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502475&idx=1&sn=4fcdbaa03bf6a1c04db40133096aa3&chksm=c2c5b026f5b2393049efca68c42df5038fa0317eea79fbd9ec2c61ec12b47a0701376a21)\
    \ 利用`execve` 函数使自己变成了 shell 程序，配合上一回`fork` 的进程 2 的过程，这就是 Linux 里经典的`fork + execve`\
    \ 函数。`execve` 函数的关键其实就是改变了栈空间中的`EIP` 和`ESP` 的值，使得中断返回后的地址被程序魔改，改到了 shell 程序加载到的内存上。\n\
    \n![media/file288.webp]\n\n此时，`execve` 系统调用的中断返回后，指向了 shell 程序所在的内存地址起始处，就要开始执行\
    \ shell 程序。但此时 shell 程序还没有从硬盘加载到内存，所以此时会触发缺页中断，将硬盘中的 shell 程序（除`exec`头部的其他部分）按需加载到内存，这就是\
    \ [第36回 | 缺页中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502511&idx=1&sn=eacddbb11dd2402561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc590322776f71f41e6744fddeca2b027d12a25ecbfc8a221)\
    \ 里讲述的过程。\n\n![media/file289.webp]\n\n这回，终于可以开始执行`shell` 程序了。在 [第37回 | shell 程序跑起来了](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502581&idx=1&sn=df32c19ce511ac24145091892f47837&chksm=c2c5b058f5b2394ee095d679071b43c23853dc86d5cfd4cc961568643110ab734f635b899984&scene=21)\
    \ 中我们以 xv6 源码中的超级简单的 shell 程序源码为例，讲解了 shell 程序的原理。\n\n就是不断读取我们用户输入的命令，创建一个新的进程并执行刚刚读取到的命令，最后等待进程退出，再次进入读取下一条命令的循环中。\n\
    \n```\n// xv6-public sh.c\nint main(void) {\n    static char buf[100];\n    //\
    \ 读取命令\n    while(getcmd(buf, sizeof(buf)) >= 0){\n        // 创建新进程\n        if(fork()\
    \ == 0) {\n            // 执行命令\n            runcmd(parsecmd(buf));\n        }\n\
    \        // 等待进程\n        wait();\n    }\n}\n```\n\nshell 程序是个死循环，我们再回来看操作系统的循环。在\
    \ [第38回 | 操作系统完毕](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502613&idx=1&sn=d7e85595323dde138e5ac52bf8e1dd&chksm=c2c5b1b0f5b23ae8785f45bf83434968e7e5a9702d6eb5738f1a83c49f)\
    \ 给出了整个操作系统代码的鸟瞰视角。\n\n```\n// main.c\nvoid main() {\n    // 初始化环境\n    // 外层操作系统循环\n\
    \    while(1) {\n        // 内层 shell 程序循环\n        while(1) {\n            //\
    \ 读取命令\n            ...\n            // 创建进程\n            ...\n            //\
    \ 执行命令\n            ...\n        }\n    }\n}\n```\n\n可以看出，不仅 shell 程序是个死循环，整个操作系统也是死循环。除此之外，这里所有的键盘输入、系统调用、进程调度，统都需要`中断`来驱动，所以很久之前我说，操作系统是个中断驱动的死循环，就是这个道理。\n\
    \nOK！到此为止，操作系统终于启动完毕，达到了怠速的状态，它本身设置好堆中断处理程序，随时等待中断的到来进行处理，同时它运行了一个 shell 程序用来接受普通用户的命令，以人类友好的方式交互。\n\
    \n------\n\n我们前四个部分，终于把整个操作系统的启动流程清楚了，如果你头脑中已经像过电影般把启动流程清晰地印在脑子里，相信你已经不再恐惧操作系统源码了。\n\
    \n但理解操作系统不仅仅启动流程这个视角，还需要内存管理、文件系统、进程调度、设备管理、系统调用等操作系统提供的功能的看。启动流程是一次性的，就这么来一下子，而这些功能是持续不断的，用户程序不断通过系统调用和操作系统提供的功能，完成自己想要让计算机帮忙的事情。\n\
    \n所以接下来的第五部分，我打算用一条 shell 命令的执行过程，来把操作系统这些模块和提供的功能讲述清楚。一条 shell 命令的执行，包含了内存管理、文件系统、进程调度、设备管理、中断控制、特权级切换等等方面的内容，实在是把它们都串起来的好办法。\n\
