    这个循环做的另一件事，是给 gdt 剩下的位置填充上 0，也就是把剩下留给 TSS 和 LDT 的描述符都先附上空值。


    ![](media/file116.webp "fig:")


    往后展望一下的话，就是以后每创建一个新进程，就会在后面添加一组 TSS 和 LDT 表示这个进程的任务状态段以及局部描述符表信息。


    还记得刚刚的超纲图吧，未来整个内存的规划就是这样的，不过你先不用理解得很细。


    ![](media/file117.webp "fig:")


    那为什么一开始就先有了一组 TSS 和 LDT 呢？现在也没创建进程呀。错了，现在虽然我们还没有建立起进程调度的机制，但我们正在运行的代码就是会作为**未来的一个进程的指令流**。


    也就是当未来进程调度机制一建立起来，正在执行的代码就会化身成为**进程 0** 的代码。所以我们需要提前把这些未来会作为进程 0 的信息写好。


    如果你觉得很疑惑，别急，等后面整个进程调度机制建立起来，并且让你亲眼看到进程 0 以及进程 1 的创建，以及它们后面因为进程调度机制而切换，你就明白这一切的意义了。


    好，收回来，初始化了一组 TSS 和 LDT 后，再往下看两行。


    ```

    [](#cb106-1)#define ltr(n) __asm__("ltr %%ax"::"a"  (_TSS(n)))

    [](#cb106-2)#define lldt(n) __asm__("lldt %%ax"::"a"  (_LDT(n)))

    [](#cb106-3)

    [](#cb106-4)void sched_init(void) {

    [](#cb106-5)    ...

    [](#cb106-6)    ltr(0);

    [](#cb106-7)    lldt(0);

    [](#cb106-8)    ...

    [](#cb106-9)}

    ```


    这又涉及到之前的知识咯。


    还记得 **lidt** 和 **lgdt** 指令么？一个是给 idtr 寄存器赋值，以告诉 CPU 中断描述符表 idt 在内存的位置；一个是给 gdtr
    寄存器赋值，以告诉 CPU 全局描述符表 gdt 在内存的位置。


    ![](media/file118.webp "fig:")


    那这两行和刚刚的类似，**ltr** 是给 **tr** 寄存器赋值，以告诉 CPU 任务状态段 TSS 在内存的位置；**lldt** 一个是给 **ldt**
    寄存器赋值，以告诉 CPU 局部描述符 LDT 在内存的位置。


    ![](media/file119.webp "fig:")


    这样，CPU 之后就能通过 tr 寄存器找到当前进程的任务状态段信息，也就是上下文信息，以及通过 ldt 寄存器找到当前进程在用的局部描述符表信息。


    我们继续看。


    ```

    [](#cb107-1)void sched_init(void) {

    [](#cb107-2)    ...

    [](#cb107-3)    outb_p(0x36,0x43);      /* binary, mode 3, LSB/MSB, ch 0 */

    [](#cb107-4)    outb_p(LATCH & 0xff , 0x40);    /* LSB */

    [](#cb107-5)    outb(LATCH >> 8 , 0x40);    /* MSB */

    [](#cb107-6)    set_intr_gate(0x20,&timer_interrupt);

    [](#cb107-7)    outb(inb_p(0x21)&~0x01,0x21);

    [](#cb107-8)    set_system_gate(0x80,&system_call);

    [](#cb107-9)    ...

    [](#cb107-10)}

    ```


    四行端口读写代码，两行设置中断代码。


    端口读写我们已经很熟悉了，就是 CPU 与外设交互的一种方式，之前讲硬盘读写以及 CMOS 读写时，已经接触过了。


    而这次交互的外设是一个**可编程定时器**的芯片，这四行代码就开启了这个定时器，之后这个定时器变会**持续的、以一定频率的向 CPU 发出中断信号**。


    ![](media/file120.gif "fig:")


    而这段代码中设置的两个中断，第一个就是**时钟中断**，中断号为 **0x20**，中断处理程序为 **timer_interrupt**。那么每次定时器向
    CPU 发出中断后，便会执行这个函数。


    这个定时器的触发，以及时钟中断函数的设置，是操作系统主导进程调度的一个关键！没有他们这样的外部信号不断触发中断，操作系统就没有办法作为进程管理的主人，通过强制的手段收回进程的
    CPU 执行权限。


    第二个设置的中断叫系统调用 **system_call**，中断号是 **0x80**，这个中断又是个非常非常非常非常非常非常非常重要的中断，所有用户态程序想要调用内核提供的方法，都需要基于这个系统调用来进行。


    比如 Java 程序员写一个 read，底层会执行汇编指令 **int 0x80**，这就会触发系统调用这个中断，最终调用到 Linux 里的 sys_read
    方法。


    这个过程之后会重点讲述，现在只需要知道，在这个地方，偷偷把这个极为重要的中断，设置好了。


    所以你看这一章的内容，偷偷设置了影响进程和影响用户程序调用系统方法的两个重量级中断处理函数，不简单呀~


    到目前为止，中断已经设置了不少了，我们现在看看所设置好的中断有哪些。


    | 中断号 | 中断处理函数 |


    | --- | --- |


    | 0 ~ 0x10 | trap_init 里设置的一堆 |


    | 0x20 | timer_interrupt |


    | 0x21 | keyboard_interrupt |


    | 0x80 | system_call |


    其中 **0-0x10** 这 17 个中断是 trap_init 里初始化设置的，是一些基本的中断，比如除零异常等。这个在 [第14回 中断初始化 trap_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500119&idx=1&sn=f46331f70677aba168243040a96be1c0&scene=21#wechat_redirect)
    有讲到。


    之后，在控制台初始化 con_init 里，我们又设置了 **0x21** 键盘中断，这样按下键盘就有反应了。这个在 [第16回 控制台初始化 tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect)
    有讲到。


    现在，我们又设置了 **0x20** 时钟中断，并且开启定时器。最后又偷偷设置了一个极为重要的 **0x80** 系统调用中断。


    找到些感觉没，有没有越来越发现，操作系统有点靠中断驱动的意思，各个模块不断初始化各种中断处理函数，并且开启指定的外设开关，让操作系统自己慢慢“活”了起来，逐渐通过中断忙碌于各种事情中，无法自拔。


    恭喜你，我们已经逐渐在接近操作系统的本质了。


    回顾一下我们今天干了什么，就三件事。


    **第一**，我们往全局描述符表写了两个结构，TSS 和 LDT，作为未来进程 0 的任务状态段和局部描述符表信息。


    ![](media/file121.webp "fig:")


    **第二**，我们初始化了一个结构为 task_struct 的数组，未来这里会存放所有进程的信息，并且我们给数组的第一个位置附上了 init_task.init
    这个具体值，也是作为未来进程 0 的信息。


    ![](media/file122.webp "fig:")


    **第三**，设置了时钟中断 0x20 和系统调用 0x80，一个作为进程调度的起点，一个作为用户程序调用操作系统功能的桥梁，非常之重要。


    后面，我们将会逐渐看到，这些重要的事情，是如何紧密且精妙地结合在一起，发挥出奇妙的作用。


