    ## 第45回 | 解析并执行 shell 命令


    > 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247503139&idx=1&sn=652316c29be5ba983fbb658ce58443d8&chksm=c2c5b78ef5b23e980870ff66f066a624f9a5d61bd73f550d5579e745f60335dfb489dcf977d8&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247503139&idx=1&sn=652316c29be5ba983fbb658ce58443d8&chksm=c2c5b78ef5b23e980870ff66f066a624f9a5d61bd73f550d5579e745f60335dfb489dcf977d8&scene=21#wechat_redirect)


    新建一个非常简单的 `info.txt` 文件。


    ```

    name:flash

    age:28

    language:java

    ```


    在命令行输入一条十分简单的命令。


    ```

    [root@linux0.11] cat info.txt | wc -l

    3

    ```


    这条命令的意思是读取刚刚的 `info.txt` 文件，输出它的行数。


    在上一回中，我们讲述了进程在读取你的命令字符串时，可能经历的进程的阻塞与唤醒，也即 `Linux 0.11` 中的 `sleep_on` 与 `wake_up`
    函数。


    ![](media/file305.webp "fig:")


    接下来，`shell` 程序就该解析并执行这条命令了。


