    至此，我们就将数据从硬盘读入缓冲区，再从缓冲区读入用户内存，一个 read 函数完美谢幕！


    ![](media/file325.webp "fig:")


    首先通过 verify_area 对内存做了校验，需要写时复制的地方在这里提前进行好了。


    接下来，file_read 方法做了读盘的全部操作，通过 bmap 获取到了硬盘全局维度的数据块号，然后 bread 将数据块数据复制到缓冲区，然后 put_fs_byte
    再将缓冲区数据复制到用户内存。


