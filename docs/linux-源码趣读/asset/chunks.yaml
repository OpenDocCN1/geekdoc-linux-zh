  trans: "\n\n把读出来的数据放到内存，就涉及到内存中缓冲区的管理。\n\n上面说的每一件事，都是一个十分庞大的体系，我们今天的文章一个都不展开讲，哈哈。\n\
    \n我们就讲讲，读取块设备与内存缓冲区之间的桥梁，**块设备请求项**的初始化工作。\n\n我们以 Linux 0.11 源码为例，发现进入内核的 `main`\
    \ 函数后不久，有这样一行代码。\n\n```\nvoid main(void) {\n    ...\n    blk_dev_init();\n   \
    \ ...\n}\n```\n\n看到这个方法的全部代码后，你可能会会心一笑，也可能一脸懵逼。\n\n```\nvoid blk_dev_init(void)\
    \ {\n    int i;\n    for (i=0; i<32; i++) {\n        request[i].dev = -1;\n  \
    \      request[i].next = NULL;\n    }\n}\n```\n\n这也太简单了吧？\n\n就是给 `request` 这个数组的前\
    \ 32 个元素的两个变量 `dev` 和 `next` 附上值，看这俩值 `-1` 和 `NULL` 也可以大概猜出，这是没有任何作用时的初始化值。\n\n\
    我们看下 `request` 结构体。\n\n```\n/*\n * Ok, this is an expanded form so that we can\
    \ use the same\n * request for paging requests when that is implemented. In\n\
    \ * paging, 'bh' is NULL, and 'waiting' is used to wait for\n * read/write completion.\n\
    \ */\nstruct request {\n    int dev;        /* -1 if no request */\n    int cmd;\
    \        /* READ or WRITE */\n    int errors;\n    unsigned long sector;\n   \
    \ unsigned long nr_sectors;\n    char * buffer;\n    struct task_struct * waiting;\n\
    \    struct buffer_head * bh;\n    struct request * next;\n};\n```\n\n注释也附上了。\n\
    \n哎哟，这就有点头大了，刚刚的函数虽然很短，但看到这个结构体我们知道了，重点在这呢。这也侧面说明了，学习操作系统，其实把遇到的重要数据结构牢记心中，就已经成功一半了。比如主内存管理结构\
    \ `mem_map`，知道它的数据结构是什么样子，其功能也基本就懂了。\n\n收，继续说这个 `request` 结构，这个结构就代表了一次读盘请求，其中：\n\
    \n- `dev` 表示设备号，-1 就表示空闲。\n- `cmd` 表示命令，其实就是 READ 还是 WRITE，也就表示本次操作是读还是写。\n- `errors`\
    \ 表示操作时产生的错误次数。\n- `sector` 表示起始扇区。\n- `nr_sectors` 表示扇区数。\n- `buffer` 表示数据缓冲区，也就是读盘之后的数据放在内存中的什么位置。\n\
    - `waiting` 是个 `task_struct` 结构，这可以表示一个进程，也就表示是哪个进程发起了这个请求。\n- `bh` 是缓冲区头指针，这个后面讲完缓冲区就懂了，因为这个\
    \ `request` 是需要与缓冲区挂钩的。\n- `next` 指向了下一个请求项。\n\n这里有的变量看不懂没关系。不过我们倒是可以基于现有的重点参数猜测一下，比如读请求时，`cmd`\
    \ 就是 READ，`sector` 和 `nr_sectors` 这俩就定位了所要读取的块设备（可以简单先理解为硬盘）的哪几个扇区，`buffer` 就定位了这些数据读完之后放在内存的什么位置。\n\
    \n这就够啦，想想看，这四个参数是不是就能完整描述了一个读取硬盘的需求了？而且完全没有歧义，就像下面这样。\n\n![](img/file100.webp\
    \ \"fig:\")\n\n而其他的参数，肯定是为了更好地配合操作系统进行读写块设备操作嘛，为了把多个读写块设备请求很好地组织起来。这个组织不但要有这个数据结构中\
    \ `bh` 和 `next` 等变量的配合，还要有后面的电梯调度算法的配合，仅此而已，先点到为止。\n\n总之，我们这里就先明白，这个 `request`\
    \ 结构可以完整描述一个读盘操作。然后那个 `request` 数组就是把它们都放在一起，并且它们又通过 `next` 指针串成链表。\n\n![](img/file101.webp\
    \ \"fig:\")\n\n好，本文讲述的两行代码，其实就完成了上图所示的工作而已。但讲到这就结束的话，很多同学可能会不太甘心，那我就简单展望一下，后面读盘的全流程中，是怎么用到刚刚初始化的这个\
    \ `request[32]` 结构的。\n\n读操作的系统调用函数是 `sys_read`，源代码很长，我给简化一下，仅仅保留读取普通文件的分支，就是如下的样子。\n\
    \n```\nint sys_read(unsigned int fd, char * buf, int count) {\n    struct file\
    \ * file = current->filp[fd];\n    struct m_inode * inode = file->f_inode;\n \
    \   // 校验 buf 区域的内存\n    verify_area(buf,count);\n    // 仅目录或普通文件\n    return\
    \ file_read(inode,file,count);\n}\n```\n\n看，入参 `fd` 是文件符，可以通过找到一个 `inode`，进而找到文件在硬盘中的位置。\n\
    \n![](img/file102.webp \"fig:\")\n\n另外入参 `buf` 就是复制到的内存中的位置，`count` 就是复制多少字节，很好理解。钻到\
    \ `file_read` 函数里继续看。\n\n```\nint file_read(struct m_inode * inode, struct file\
    \ * filp, char * buf, int count) {\n    int left,nr;\n    struct buffer_head *\
    \ bh;\n    left = count;\n    while (left) {\n        if (nr = bmap(inode,(filp->f_pos)/BLOCK_SIZE))\
    \ {\n            if (!(bh=bread(inode->i_dev,nr)))\n                break;\n \
    \       } else\n            bh = NULL;\n        }\n        nr = filp->f_pos %\
    \ BLOCK_SIZE;\n        chars = MIN( BLOCK_SIZE-nr, left );\n        filp->f_pos\
    \ += chars;\n        left -= chars;\n        if (bh) {\n            char * p =\
    \ bh->b_data;\n            while (chars-->0)\n                put_fs_byte(p++),buf++);\n\
    \            brelse(bh);\n        } else {\n            while (chars-->0)\n  \
    \              put_fs_byte(0,buf++);\n        }\n    }\n    inode->atime = CURRENT_TIME;\n\
    \    return (count-left)?(count-left):-ERROR;}\n\n整体看，就是一个 `while` 循环，每次读入一个块的数据，直到入参的大小读完为止。直接看\
    \ `bread` 那一行。\n\n```\nint file_read(struct m_inode * inode, struct file * filp,\
    \ char * buf, int count) {\n    ...\n    while (left) {\n        ...\n       \
    \ if (!(bh=bread(inode->i_dev,nr)))\n    }\n```\n\n这个函数就是去读某一个设备的某一个块的内容，展开进去。\n\
    \n```\nstruct buffer_head * bread(int dev,int block) {\n    struct buffer_head\
    \ * bh = getblk(dev,block);\n    if (bh->atime)\n        return bh;\n    ll_rw_block(READ,bh);\n\
    \    wait_on_buffer(bh);\n    if (bh->atime)\n        return bh;\n    brelse(bh);\n\
    \    return NULL;}\n```\n\n其中 `getblk` 先申请了一个内存中的缓冲块，然后 `ll_rw_block` 负责把数据读入这个块，进去看。\n\
    \n```\nvoid ll_rw_block(int rw, struct buffer_head * bh) {\n    ...\n    make_request(major,rw,bh);\n\
    }\n\nstatic void make_request(int major,int rw, struct buffer_head * bh) {\n \
    \   ...\n    if (rw == READ)\n        req = request+NR_REQUEST;\n    else\n  \
    \      req = request+((NR_REQUEST)/3);\n    /* find an empty request */\n    while\
    \ (--req >= request)\n        if (req->dev<0)\n            break;\n    /* fill\
    \ up request-info, and add it to queue */\n    req->dev = bh->b_dev;\n    req->cmd\
    \ = rw;\n    req->errors=0;\n    req->sector = bh->b_block<<1;\n    req->nr_sectors\
    \ = 2;\n    req->buffer = bh->b_data;\n    req->waiting = NULL;\n    req->bh =\
    \ bh;\n    req->next = NULL;\n    add_request(major+blk_dev,req);\n}\n```\n\n\
    看，这里用到了刚刚说的结构。具体来说就是该函数往设备的请求项表 `request[32]` 中添加请求项，只要 `request[32]` 中未处理的请求项存在，都会陆续被处理，直到请求项表为空。具体怎么读盘，就是与硬盘端口交互的过程，可以继续往里看到\
    \ `hd_out` 函数为止，本讲不展开。具体读盘操作，后面会有详细的章节讲解，本讲你只需要我们在 `main` 函数的 `init` 系列函数中，通过\
    \ `blk_dev_init` 为后面的设备提前建立了一个数据结构，作为访问块设备和内存缓冲区之间的桥梁就可以了。\n\n本文可以当作你你源码系列文章的\
    \ 15。为了让不追系列的读者也能方便阅读并学到东西，我把它造成了单独的不依赖上下文的文章，具体原因可以坚持不下去了...点击下方的原文可以跳转到本系列的\
    \ GitHub 页，那里也有完整目录和规划，以及一些辅助的资料，欢迎提出各种问题。\n\n## 第 16 回 控制台初始化 tty_init\n\n原文链接:\
    \ https://mp.weixin.qq.com/s/yIrzEWUUu9OsiuU_lOaw\n\n接上回，上回咱们说到，继内存管理结构 `mem_map`\
    \ 和中断描述符表 `idt` 建立好之后，我们又在内存中倒腾出一个新的数据结构 `request`。![](img/file103.webp \"fig:\"\
    ) 并且把它们都放在了一个数组中。![](img/file104.webp \"fig:\")\n\n这是**块设备驱动程序**与**内存缓冲区**的桥梁，通过它可以完整地表示一个块设备读写操作要做的事。我们继续往下看，`tty_init`。\n\
    \n```\nvoid main(void) {\n    ...\n    mem_init(main_memory_start,memory_end);\n\
    \    trap_init();\n    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n\
    \    time_init();\n    sched_init();\n    buffer_init(buffer_memory_end);\n  \
    \  hd_init();\n    floppy_init();\n    sti();\n    move_to_user_mode();\n    if\
    \ (!fork()) {init();}\n    for(;;) pause();\n}\n```\n\n这个方法执行完成之后，我们将具备键盘输入到显示器输出字符这个最常用的功能。打开这个函数后我有点慌。\n\
    \n```\nvoid tty_init(void)\n{\n    rs_init();\n    con_init();\n}\n```\n\n看来这个方法已经多到需要拆成两个子方法了。打开第一个方法，还好。\n\
    \n"
- fmt: "\n```c\nvoid rs_init(void) {\n    set_intr_gate(0x24,rs1_interrupt);\n   \
    \ set_intr_gate(0x23,rs2_interrupt);\n    init(tty_table[1].read_q.data);\n  \
    \  init(tty_table[2].read_q.data);\n    outb(inb_p(0x21)&0xE7,0x21);\n}\n```\n\
    \n这个方法是串口中断的开启，以及设置对应的中断处理程序，串口在我们现在的 PC 机上已经很少用到了，所以这个直接忽略，要讲我也不懂。\n\n看第二个方法，这是重点。代码非常长，有点吓人，我先把大体框架写出。\n\
    \n```c\nvoid con_init(void) {\n    ...\n    if (ORIG_VIDEO_MODE == 7) {\n    \
    \    ...\n        if ((ORIG_VIDEO_EGA_BX & 0xff) != 0x10) {...}\n        else\
    \ {...}\n    } else {\n        ...\n        if ((ORIG_VIDEO_EGA_BX & 0xff) !=\
    \ 0x10) {...}\n        else {...}\n    }\n    ...\n}\n```\n\n可以看出，非常多的 if else。\n\
    \n这是为了应对不同的显示模式，来分配不同的变量值，那如果我们仅仅找出一个显示模式，这些分支就可以只看一个了。\n\n啥是显示模式呢？那我们得简单说说显示，**一个字符是如何显示在屏幕上的呢**？换句话说，如果你可以随意操作内存和\
    \ CPU 等设备，你如何操作才能使得你的显示器上，显示一个字符‘a’呢？\n\n我们先看一张图。\n\n![](media/file105.webp fig:)\n\
    \n内存中有这样一部分区域，是和显存映射的。啥意思，就是你往上图的这些内存区域中写数据，相当于写在了显存中。而往显存中写数据，就相当于在屏幕上输出文本了。\n\
    \n没错，就是这么简单。\n\n如果我们写这一行汇编语句。\n\n```asm\nmov [0xB8000],'h'\n```\n\n后面那个 `h` 相当于汇编编辑器帮我们转换成\
    \ ASCII 码的二进制数值，当然我们也可以直接写。\n\n```asm\nmov [0xB8000],0x68\n```\n\n其实就是往内存中 `0xB8000`\
    \ 这个位置写了一个值，只要一写，屏幕上就会是这样。\n\n![](media/file106.webp fig:)\n\n简单吧，具体说来，这片内存是每两个字节表示一个显示在屏幕上的字符，**第一个是字符的编码，第二个是字符的颜色**，那我们先不管颜色，如果多写几个字符就像这样。\n\
    \n```asm\nmov [0xB8000],'h'\nmov [0xB8002],'e'\nmov [0xB8004],'l'\nmov [0xB8006],'l'\n\
    mov [0xB8008],'o'\n```\n\n此时屏幕上就会是这样。\n\n![](media/file107.webp fig:)\n\n是不是贼简单？那我们回过头看刚刚的代码，我们就假设显示模式是我们现在的这种文本模式，那条件分支就可以去掉好多。\n\
    \n代码可以简化成这个样子。\n\n```c\n#define ORIG_X (*(unsigned char *)0x90000)\n#define ORIG_Y\
    \ (*(unsigned char *)0x90001)\nvoid con_init(void) {\n    register unsigned char\
    \ a;\n    // 第一部分 获取显示模式相关信息\n    video_num_columns = (((*(unsigned short *)0x90006)\
    \ & 0xff00) >> 8);\n    video_size_row = video_num_columns * 2;\n    video_num_lines\
    \ = 25;\n    video_page = (*(unsigned short *)0x90004);\n    video_erase_char\
    \ = 0x0720;\n    // 第二部分 显存映射的内存区域 \n    video_mem_start = 0xb8000;\n    video_port_reg\
    \  = 0x3d4;\n    video_port_val  = 0x3d5;\n    video_mem_end = 0xba000;\n    //\
    \ 第三部分 滚动屏幕时的信息\n    origin = video_mem_start;\n    scr_end = video_mem_start\
    \ + video_num_lines * video_size_row;\n    top = 0;\n    bottom = video_num_lines;\n\
    \    // 第四部分 定位光标并开启中断\n    gotoxy(ORIG_X, ORIG_Y);\n    set_trap_gate(0x21,keyboard_interrupt);\n\
    \    outb_p(inb_p(0x21)&0xfd,0x21);\n    a=inb_p(0x61);\n    outb_p(a|0x80,0x61);\n\
    \    outb(a,0x61);\n}\n```\n\n别看这么多，一点难。\n\n首先还记记得之前汇编的时候，存了好多以后用的数据在内存中。就在[进入模式前的最后折腾](https://mp.weixin.qq.com/s?biz=Mzk0Mj3NDE0Ng&mid=22474958&idx=1&sn=d5d05fae2fb83d8f82046)\n\
    \n| 内存地址 | 长度(字节) | 名称 |\n| :--- | :--- | :--- |\n| 0x90000 | 2 | 光标位置 |\n| 0x90002\
    \ | 2 | 扩展内存数 |\n| 0x90004 | 2 | 显示页面 |\n| 0x90006 | 1 | 显示模式 |\n| 0x90007 | 1\
    \ | 字符列数 |\n| 0x90008 | 2 | 未知 |\n| 0x9000A | 1 | 显示内存 |\n| 0x9000B | 1 | 显示状态\
    \ |\n| 0x9000C | 2 | 显卡特性参数 |\n| 0x9000E | 1 | 屏幕行数 |\n| 0x9000F | 1 | 屏幕列数 |\n\
    | 0x90080 | 16 | 硬盘参数表 |\n| 0x90090 | 16 | 硬盘参数表 |\n| 0x901FC | 2 | 根设备号 |\n\n\
    所以，**第一部分**获取 `0x90006` 地址处的数据，就是获取显示模式等相关信息。**第二部分**就是显存映射的内存地址范围，我们现在假设是 CGA\
    \ 类型的文本模式，所以映射的内存是从 `0xB8000` 到 `0xBA000`。\n\n**第三部分**是设置一些滚动屏幕需要的参数，定义顶行和底行是哪里，这里顶行就是第一行，底行就是最后一行，很合理。\n\
    \n**第四部分**是把光标定位到之前保存的光标处（取内存地址 `0x90000` 处的数据），然后设置并开启键盘中断。开启键盘中断后，键盘上敲击一个按键就会触发中断，中断程序就会读键盘码转换成\
    \ ASCII 码，然后写到光标处的内存地址，也就往显存写，于是这个键盘敲击的字符就显示在了屏幕上。\n\n![](media/file108.gif fig:)\n\
    \n这一切具体是怎么做到的呢？我们先看看我们干了什么。\n\n**1.** 我们现在根据已有信息已经可以实现往屏幕上的任意位置写字符了，而且还能指定颜色。\n\
    \n**2.** 并且，我们也能接受键盘中断，根据键盘码中断处理程序就可以得知哪个键按下了。\n\n有了这俩功能，那我们想干嘛还不是为所欲为？\n\n好，接下来我们看看代码是怎么处理的，很简单。一切的起点，就是第四步的\
    \ `gotoxy` 函数，定位当前光标。\n\n```c\n#define ORIG_X (*(unsigned char *)0x90000)\n#define\
    \ ORIG_Y (*(unsigned char *)0x90001)\nvoid con_init(void) {\n    ...\n    // 第四部分\
    \ 定位光标并开启键盘中断\n    gotoxy(ORIG_X, ORIG_Y);\n    ...\n}\n```\n\n里面干嘛了？\n\n```c\n\
    static inline void gotoxy(unsigned int new_x, unsigned int new_y) {\n    ...\n\
    \    x = new_x;\n    y = new_y;\n    pos = origin + y*video_size_row + (x<<1);\n\
    }\n```\n\n就是给 `x` `y` `pos` 这三个参数上了值。其中 `x` 表示光标在哪列，`y` 表示光标在哪一行，`pos` 表示列号和行号计算出来的指针，也就是往\
    \ `pos` 指向的地址处数据，相当于控制台 `x` 列 `y` 行处写入了，简单吧？\n\n然后，当你按下键盘后，触发键盘中断，之后的程序链是这样的。\n\
    \n```c\n_keyboard_interrupt:\n    ...\n    call _do_tty\ndo_tty(int tty) {\n \
    \   copy_to_cooked(tty_table);\n}\ncopy_to_cooked(struct tty_struct * tty) {\n\
    \    ...\n    tty->write(tty);\n}\nvoid con_write(struct tty_struct * tty) {\n\
    \    ...\n    __asm__(\"movb attr,ah\\n\"\n          \"movw %%1\\n\"\n       \
    \   ::a\" (c),\"m\" (*short *)pos)\n          :\"ax\");\n    pos += 2;\n    x++;\n\
    \    ...\n}\n```\n\n前面的过程不用管，我们看最后一个函数 `con_write` 中的关键代码。`asm` 内联汇编，把键盘输入的字符\
    \ `c` 写入 `pos` 指针的内存，相当于往屏幕输出了。之后两行 `pos+=2` 和 `x++`，就是调整所谓的光标。\n\n你看，写入一个字符，最底层，**其实就是内存的某处写个数据，然后顺便调整一下光标**。\n\
    \n由此也可以看出，光标的本质，其实就是这里的 `x` `y` `pos` 三变量而已。我们还可以做换行效果，当发现光标位置某一行的结尾时（这个应该很好算吧，我们都知道屏幕上一共有几列了），就把光标计算出一个新值，让其处于下一行的开头。\n\
    \n![](media/file109.gif fig:)\n\n就一个小公式即可搞定，仍然在 `con_write` 源码处有体现，就是判断列号 `x`\
    \ 是否大于了总列数。\n\n```c\nvoid con_write(struct tty_struct * tty) {\n    ...\n    if\
    \ (x>=video_num_columns) {\n        x -= video_num_columns;\n        pos -= video_size_row;\n\
    \        lf();\n    }\n    ...\n}\n\nstatic void lf(void) {\n    if (y+1<bottom)\
    \ {\n        y++;\n        pos += video_size_row;\n        return;\n    }\n  \
    \  ...\n}\n```\n\n相似的，我们还可以实现滚屏的效果，无非就是当检测到光标已经出现在最后一行最后一列了，那就把每一行的字符，都复制到它上一行，其实就是算好哪些内存地址上的值，拷贝到哪些内存地址，好了。\n\
    \n这里大家自己看源码寻找。\n\n所以，有了这个初始化工作，我们就可以利用这些信息，弄几个小算法，实现各种我们常见控制台的操作。或者换句话说，我们见惯不怪的控制台，**回车**、**换行**、**删除**、**滚屏**、**清屏**等操作，其实底层都要实现。\n"
  raw: "```\n[](#cb85-1)void rs_init(void)\n[](#cb85-2){\n[](#cb85-3)    set_intr_gate(0x24,rs1_interrupt);\n\
