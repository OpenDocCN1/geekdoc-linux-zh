    这里我把所有 Linux 0.11 支持的信号都放在这了，有我们熟悉的按下 `CTRL+C` 时的信号 `SIGINT`，有我们通常杀死进程时 `kill\
    \ -9` 的信号 `SIGKILL`，还有 core dump 内存访问出错时经常遇到的 `SIGSEGV`。\n\n在现代 Linux 操作系统中，你输入个\
    \ `kill -l` 便可知道你所在的系统所支持的信号，下面是我购买的一台腾讯云主机上的结果。\n\n![](media/file332.webp \"\
    fig:\")\n\nOK，这么几句话，我就说完了信号的本质，以及信号的种类。\n\n现在这个进程的 `tast_struct` 结构中的 `signal`\
    \ 就有了对应信号位的值，那么在下次时钟中断到来时，便会通过 `timer_interrupt` 这个时钟中断处理函数，一路调用到 `do_signal`\
    \ 方法。\n\n```\n// kernel/signal.c\nvoid do_signal (long signr ...) {\n    ...\n\
    \    struct sigaction *sa = current->sigaction + signr - 1;\n    sa_handler =\
    \ (unsigned long) sa->sa_handler;\n    // 如果信号处理函数为空，则直接退出\n    if (!sa_handler)\
    \ {\n        ...\n        do_exit (1 << (signr - 1));\n        ...\n    }\n  \
    \  // 否则就跳转到信号处理函数的地方运行\n    *(&eip) = sa_handler;\n    ...\n```\n\n时钟中断和进程调度的流程，你可以看\
    \ [第24回 从定时器答来看调度](https://mp.weixin.com/s?biz=Mzk0MjE30NDE==mid=2247501609&idx=1&sn=fe5bd9f69045fd706d7aea273bc&scene=21)。我们可以看到，进入\
    \ `do_signal` 函数后，如果当前信号 `signr` 对应的信号处理函数 `sa_handler` 为空，就直接调用 `do_exit` 函数，也就是我们按下\
    \ `CTRL+C` 之后退出的样子。\n\n但是，如果信号处理函数不为空，那么将 `sa_handler` 赋值给 `eip` 寄存器，也就是指令寄存器的方式，跳转到相应处理函数处。\n\
    \n怎么验证这一点？很简单，信号处理函数注册在每个进程 `task_struct` 中的 `sigaction` 数组中。\n\n```\n// signal.h\n\
    struct sigaction {\n    union __sigaction_u __sigaction_u;  /* signal handler\
    \ */\n    sigset_t sa_mask;               /* signal mask to apply */\n    int\
    \     sa_flags;               /* see signal below */\n};\n/* union for signal\
    \ handlers */\nunion __sigaction_u {\n    void    (*sa_handler)(int);\n    void\
    \    (*sa_sigaction)(int, struct siginfo *, void *);\n};\n// sched.h\nstruct task_struct\
    \ {\n    ...\n    struct sigaction sigaction[32];\n    ...\n};\n```\n\n没错，只需要给\
