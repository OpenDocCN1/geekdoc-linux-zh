    \n![](media/file68.webp \"fig:\")\n\n好了，我知道你目前可能有点晕转向，关于地址已经出现了好多词了，包括逻辑地址、线性地址、物理地址，以及本文没出现的、你可能在很多地方看到的虚拟地址。而这些地址加上“空间”两个字，似乎又成为了一个新词，比如线性地址空间、物理地址空间、虚拟地址空间等。\n\
    \n那就是时候展开一波讨论，将这块的内容梳理一番了。Intel 体系结构的内存管理可以分成两大部分，也就是标题中的两板斧：分段与分页。\n\n分段机制在之前几回已经讨论过多次了，其目的是为了为每个程序或任务提供单独的代码段（cs）、数据段（ds）、栈段（ss），使其不会相互干扰。\n\
    \n分页机制是本回讲的内容，开机后分页机制默认是关闭状态，需要我们手动开启并设置好页目录表（PDE）和页表（PTE）。其目的在于可以按需使用物理内存，也可以在多任务时起到隔离的作用。Intel\
    \ 的保护模式下，分段机制是没有开启和关闭一说的，它必须存在，而分页机制是可以开启或关闭的。所以如果有人和你说它实现了一个没有分段机制的操作系统，那一定是个外行。\n\
    \n再说说那些地址：\n\n> 逻辑地址：我们程序员写代码时给出的地址叫逻辑地址，其中包含段选择子和偏移地址两部分。\n\n> 线性地址：通过分段机制，将逻辑地址转换成的线性地址。\n\
    \n> 物理地址：不开启分页时，线性地址就是物理地址；开启分页后，线性地址再通过分页机制转换成物理地址。\n\n> 虚拟地址：开启分页机制后，线性地址空间。\n"
  raw: "```\nsetup_idt:\n    lea edx,ignore_int\n    mov eax,00080000h\n    mov ax,dx\n\
    \    mov dx,8E00h\n    lea edi,_idt\n    mov ecx,256\nrp_sidt:\n    mov [edi],eax\n\
    \    mov [edi+4],edx\n    add edi,8\n    dec ecx\n    jne rp_sidt\n    lidt fword\
    \ ptr idt_descr\n    ret\n\nidt_descr:\n    dw 256*8-1\n    dd _idt\n\n_idt:\n\
    \    DQ 256 dup(0)\n```\n\n不用细看，我给你说最终效果。\n\n中断描述符表 idt 里面存储着一个个中断描述符，每一个中断号就对应着一个中断描述符，而中断描述符里面存储着主要是中断程序的地址，这样一个中断号过来后，CPU\
    \ 就会自动寻找相应的中断程序，然后去执行它。\n\n那这段程序的作用就是，**设置了 256 个中断描述符**，并且让每一个中断描述符中的中断程序例程都指向一个\
    \ **ignore_int** 的函数地址，这个是个**默认的中断处理程序**，之后会逐渐被各个具体的中断程序所覆盖。比如之后键盘模块会将自己的键盘中断处理程序，覆盖过去。\n\
    \n那现在，产生任何中断都会指向这个默认的函数 ignore_int，也就是说现在这个阶段**你按键盘还不好使**。\n\n设置中断描述符表 setup_idt\
    \ 说完了，那接下来 **setup_gdt** 就同理了。我们就直接看设置好后的新的全局描述符表长什么样吧？\n\n```\n_gdt:\n    DQ\
    \ 0000000000000000h    ;/* NULL descriptor */\n    DQ 00c09a0000000fffh    ;/*\
    \ 16Mb */\n    DQ 00c0920000000fffh    ;/* 16Mb */\n    DQ 0000000000000000h \
    \   ;/* TEMPORARY - don't use */\n    DQ 252 dup(0)\n```\n\n其实和我们原先设置好的 gdt 一模一样。\n\
    \n也是有**代码段描述符**和**数据段描述符**，然后第四项系统段描述符并没有用到，不用管。最后还留了 252 项的空间，这些空间后面会用来放置**任务状态段描述符\
    \ TSS** 和**局部描述符 LDT**，这个后面再说。\n\n![](media/file54.webp \"fig:\")\n\n为什么原来已经设置过一遍了，这里又要重新设置一遍，你可千万别想有什么复杂的原因，就是因为原来设置的\
    \ gdt 是在 setup 程序中，之后这个地方要被缓冲区覆盖掉，所以这里重新设置在 head 程序中，这块内存区域之后就不会被其他程序用到并且覆盖了，就这么个事。\n\
    \n说的口干舌燥，还是来张图吧。\n\n![](media/file55.webp \"fig:\")\n\n如果你本文的内容完全不能理解，那就记住最后这张图就好了，本文代码就是完成了这个图中所示的一个指向转换而已，并且给所有中断设置了一个默认的中断处理程序\
    \ ignore_int，然后全局描述符表仍然只有代码段描述符和数据段描述符。\n\n好了，本文就是两个描述符表位置的变化以及重新设置，再后面一行代码就是又一个令人兴奋的功能了！\n\
    \n```\njmp after_page_tables\n...\nafter_page_tables:\n    push 0\n    push 0\n\
    \    push 0\n    push L6\n    push _main\n    jmp setup_paging\nL6:\n    jmp L6\n\
    ```\n\n那就是开启分页机制，并且跳转到 main 函数！\n\n这可太令人兴奋了！开启分页后，配合着之前讲的分段，就构成了内存管理的最最底层的机制。而跳转到\
    \ main 函数，标志着我们正式进入 c 语言写的操作系统核心代码！\n\n欲知后事如何，且听下回分解。\n\n**------- 本回扩展资料 -------**\n\
    \n保护模式下逻辑地址到线性地址（不开启分页时就是物理地址）的转化，看 Intel 手册：\n\nVolume 3 Chapter 3.4 Logical\
    \ And Linear Addresses\n\n![](media/file56.webp \"fig:\")\n\n段描述符结构和详细说明，看 Intel\
    \ 手册：\n\nVolume 3 Chapter 3.4.5 Segment Descriptors\n\n![](media/file57.webp \"\
    fig:\")\n\n对操作系统如何编译的，比如好奇那个 system 是怎么来的，可以尝试理解一下 Linux 0.11 源码中的 Makefile，这个我就不展开讲了，我们把更多经历，放在操作系统是怎么一步一步构建起来的这个过程。\n\
    \n* * *\n\n## 第9回 Intel 内存管理两板斧：分段与分页\n\n> 原文链接: [https://mp.weixin.qq.com/s/q2wU9IbX54t_GAuc9V5r7A](https://mp.weixin.qq.com/s/q2wU9IbX54t_GAuc9V5r7A)\n\
    \n书接上回，上回书咱们说到，head.s 代码在重新设置了 gdt 与 idt 后。\n\n![](media/file58.webp \"fig:\"\
    )\n\n来到了这样一段代码。\n\n```\njmp after_page_tables\n...\nafter_page_tables:\n    push\
    \ 0\n    push 0\n    push 0\n    push L6\n    push _main\n    jmp setup_paging\n\
    L6:\n    jmp L6\n```\n\n那就是开启分页机制，并且跳转到 main 函数。\n\n如何跳转到之后用 c 语言写的 main.c 里的\
    \ main 函数，是个有趣的事，也包含在这段代码里。不过我们先瞧瞧这**分页机制**是如何开启的，也就是 **setup_paging** 这个标签处的代码。\n\
    \n```\nsetup_paging:\n    mov ecx,1024*5\n    xor eax,eax\n    xor edi,edi\n \
    \   pushf\n    cld\n    rep stosd\n    mov eax,_pg_dir\n    mov [eax],pg0+7\n\
    \    mov [eax+4],pg1+7\n    mov [eax+8],pg2+7\n    mov [eax+12],pg3+7\n    mov\
    \ edi,pg3+4092\n    mov eax,00fff007h\n    std\nL3: stosd\n    sub eax,00001000h\n\
    \    jge L3\n    popf\n    xor eax,eax\n    mov cr3,eax\n    mov eax,cr0\n   \
    \ or  eax,80000000h\n    mov cr0,eax\n    ret\n```\n\n别怕，我们一点点来分析。\n\n首先要了解的就是，啥是分页机制？\n\
    \n还记不记得之前我们在代码中给出一个内存地址，在保护模式下要先经过分段机制的转换，才能最终变成物理地址，就是这样。\n\n![](media/file59.webp\
    \ \"fig:\")\n\n这是在没有开启分页机制的时候，只需要经过这一步转换即可得到最终的物理地址了，但是在开启了分页机制后，又会**多一步转换**。\n\
    \n![](media/file60.webp \"fig:\")\n\n也就是说，在没有开启分页机制时，由程序员给出的**逻辑地址**，需要先通过分段机制转换成物理地址。但在开启分页机制后，逻辑地址仍然要先通过分段机制进行转换，只不过转换后不再是最终的物理地址，而是**线性地址**，然后再通过一次分页机制转换，得到最终的物理地址。\n\
    \n分段机制我们已经清楚如何对地址进行变换了，那分页机制又是如何变换的呢？我们直接以一个例子来学习过程。\n\n比如我们的线性地址（已经经过了分段机制的转换）是\n\
    \n> 15M\n\n二进制表示就是\n\n> 0000000011_0100000000_000000000000\n\n我们看一下它的转换过程\n\n\
    ![](media/file61.webp \"fig:\")\n\n也就是说，CPU 在看到我们给出的内存地址后，首先把线性地址被拆分成\n\n**高 10\
    \ 位：中间 10 位：后 12 位**\n\n高 10 位负责在**页目录表**中找到一个**页目录项**，这个页目录项的值加上中间 10 位拼接后的地址去**页表**中去寻找一个**页表项**，这个页表项的值，再加上后\
    \ 12 位偏移地址，就是最终的物理地址。\n\n而这一切的操作，都由计算机的一个硬件叫 **MMU**，中文名字叫**内存管理单元**，有时也叫 PMMU，分页内存管理单元。由这个部件来负责将虚拟地址转换为物理地址。\n\
    \n所以整个过程我们不用操心，作为操作系统这个软件层，只需要提供好页目录表和页表即可，这种页表方案叫做**二级页表**，第一级叫**页目录表 PDE**，第二级叫**页表\
    \ PTE**。他们的结构如下。\n\n![](media/file62.webp \"fig:\")\n\n之后再开启分页机制的开关。其实就是更改 **cr0**\
    \ 寄存器中的一位即可（31 位），还记得我们开启保护模式么，也是改这个寄存器中的一位的值。\n\n![](media/file63.webp \"fig:\"\
    )\n\n然后，MMU 就可以帮我们进行分页的转换了。此后指令中的内存地址（就是程序员提供的逻辑地址），就统统要先经过分段机制的转换，再通过分页机制的转换，才能最终变成物理地址。\n\
    \n所以这段代码，就是帮我们把页表和页目录表在内存中写好，之后开启 cr0 寄存器的分页开关，仅此而已，我们再把代码贴上来。\n\n```\nsetup_paging:\n\
    \    mov ecx,1024*5\n    xor eax,eax\n    xor edi,edi\n    pushf\n    cld\n  \
    \  rep stosd\n    mov eax,_pg_dir\n    mov [eax],pg0+7\n    mov [eax+4],pg1+7\n\
    \    mov [eax+8],pg2+7\n    mov [eax+12],pg3+7\n    mov edi,pg3+4092\n    mov\
    \ eax,00fff007h\n    std\nL3: stosd\n    sub eax,00001000h\n    jge L3\n    popf\n\
    \    xor eax,eax\n    mov cr3,eax\n    mov eax,cr0\n    or  eax,80000000h\n  \
    \  mov cr0,eax\n    ret\n```\n\n我们先说这段代码最终产生的效果吧。\n\n当时 linux-0.11 认为，总共可以使用的内存不会超过\
    \ **16M**，也即最大地址空间为 **0xFFFFFF**。\n\n而按照当前的页目录表和页表这种机制，1 个页目录表最多包含 1024 个页目录项（也就是\
    \ 1024 个页表），1 个页表最多包含 1024 个页表项（也就是 1024 个页），1 页为 4KB（因为有 12 位偏移地址），因此，16M 的地址空间可以用\
    \ 1 个页目录表 + 4 个页表搞定。\n\n> 4（页表数）* 1024（页表项数） * 4KB（一页大小）= 16MB\n\n所以，上面这段代码就是，**将页目录表放在内存地址的最开头**，还记得上一讲开头让你留意的\
    \ _pg_dir 这个标签吧？\n\n```\n_pg_dir:\n_startup_32:\n    mov eax,0x10\n    mov ds,ax\n\
    \    ...\n```\n\n**之后紧挨着这个页目录表，放置 4 个页表**，代码里也有这四个页表的标签项。\n\n```\n.org 0x1000\
    \ pg0:\n.org 0x2000 pg1:\n.org 0x3000 pg2:\n.org 0x4000 pg3:\n.org 0x5000\n```\n\
    \n最终将页目录表和页表填写好数值，来覆盖整个 16MB 的内存。随后，开启分页机制。此时内存中的页表相关的布局如下。\n\n![](media/file64.webp\
    \ \"fig:\")\n\n这些页目录表和页表放到了整个内存布局中最开头的位置，就是覆盖了开头的 system 代码了，不过被覆盖的 system 代码已经执行过了，所以无所谓。\n\
    \n同时，如 idt 和 gdt 一样，我们也需要通过一个寄存器告诉 CPU 我们把这些页表放在了哪里，就是这段代码。\n\n```\nxor eax,eax\n\
    mov cr3,eax\n```\n\n你看，我们相当于告诉 cr3 寄存器，**0 地址处就是页目录表，再通过页目录表可以找到所有的页表**，也就相当于\
    \ CPU 知道了分页机制的全貌了。\n\n至此后，整个内存布局如下。\n\n![](media/file65.webp \"fig:\")\n\n那么具体页表设置好后，映射的内存是怎样的情况呢？那就要看页表的具体数据了，就是这一坨代码。\n\
    \n```\nsetup_paging:\n    ...\n    mov eax,_pg_dir\n    mov [eax],pg0+7\n    mov\
    \ [eax+4],pg1+7\n    mov [eax+8],pg2+7\n    mov [eax+12],pg3+7\n    mov edi,pg3+4092\n\
    \    mov eax,00fff007h\n    std\nL3: stosd\n    sub eax, 1000h\n    jpe L3\n \
    \   ...\n```\n\n很简单，对照刚刚的页目录表与页表结构看。\n\n![](media/file66.webp \"fig:\")\n\n前五行表示，页目录表的前\
    \ 4 个页目录项，分别指向 4 个页表。比如页目录项中的第一项 **[eax]** 被赋值为 **pg0+7**，也就是 **0x00001007**，根据页目录项的格式，表示页表地址为\
    \ **0x1000**，页属性为 **0x07** 表示改页存在、用户可读写。\n\n后面几行表示，填充 4 个页表的每一项，一共 **4*1024=4096**\
    \ 项，依次映射到内存的前 16MB 空间。\n\n画出图就是这个样子，其实刚刚的图就是。\n\n![](media/file67.webp \"fig:\"\
    )\n\n看，最终的效果就是，经过这套分页机制，**线性地址将恰好和最终转换的物理地址一样**。\n\n现在只有四个页目录项，也就是将前 16M 的线性地址空间，与\
    \ 16M 的物理地址空间一一对应起来了。\n\n![](media/file68.webp \"fig:\")\n\n好了，我知道你目前可能有点晕头转向，关于地址，我们已经出现了好多词了，包括**逻辑地址**、**线性地址**、**物理地址**，以及本文中没出现的，你可能在很多地方看到过的**虚拟地址**。\n\
    \n而这些地址后面加上空间两个字，似乎又成为了一个新词，比如**线性地址空间**、**物理地址空间**、**虚拟地址空间**等。\n\n那就是时候展开一波讨论，将这块的内容梳理一番了，且听我说。\n\
    \nIntel 体系结构的**内存管理**可以分成两大部分，也就是标题中的两板斧，**分段**和**分页**。\n\n**分段机制**在之前几回已经讨论过多次了，其目的是为了为每个程序或任务提供单独的代码段（cs）、数据段（ds）、栈段（ss），使其不会相互干扰。\n\
    \n**分页机制**是本回讲的内容，开机后分页机制默认是关闭状态，需要我们手动开启，并且设置好页目录表（PDE）和页表（PTE）。其目的在于可以按需使用物理内存，同时也可以在多任务时起到隔离的作用，这个在后面将多任务时将会有所体会。\n\
    \n在 Intel 的保护模式下，分段机制是没有开启和关闭一说的，它必须存在，而分页机制是可以选择开启或关闭的。所以如果有人和你说，它实现了一个没有分段机制的操作系统，那一定是个外行。\n\
    \n再说说那些地址：\n\n> **逻辑地址**：我们程序员写代码时给出的地址叫逻辑地址，其中包含段选择子和偏移地址两部分。\n\n> \n\n> **线性地址**：通过分段机制，将逻辑地址转换后的地址，叫做线性地址。而这个线性地址是有个范围的，这个范围就叫做线性地址空间，32\
    \ 位模式下，线性地址空间就是 4G。\n\n> \n\n> **物理地址**：就是真正在内存中的地址，它也是有范围的，叫做物理地址空间。那这个范围的大小，就取决于你的内存有多大了。\n\
    \n> \n\n> **虚拟地址**：如果没有开启分页机制，那么线性地址就和物理地址是一一对应的，可以理解为相等。如果开启了分页机制，那么线性地址将被视为虚拟地址，这个虚拟地址将会通过分页机制的转换，最终转换成物理地址。\n\
    \n![](media/file69.webp \"fig:\")\n\n但实际上，我本人是不喜欢虚拟地址这个叫法的，因为它在 Intel 标准手册上出现的次数很少，我觉得知道逻辑地址、线性地址、物理地址这三个概念就够了，逻辑地址是程序员给出的，经过分段机制转换后变成线性地址，然后再经过分页机制转换后变成物理地址，就这么简单。\n\
    \n好了，我们终于把这些杂七杂八的，idt、gdt、页表都设置好了，并且也开启了保护模式，之后我们就要做好进入 main.c 的准备了，那里是个新世界！\n\
    \n不过进入 main.c 之前还差最后一哆嗦，就是 head.s 最后的代码，也就是本文开头的那段代码。\n\n```\njmp after_page_tables\n\
    ...\nafter_page_tables:\n    push 0\n    push 0\n    push 0\n    push L6\n   \
    \ push _main\n    jmp setup_paging\nL6:\n    jmp L6\n```\n\n看到没，这里有个 push _main，把\
    \ main 函数的地址压栈了，那最终跳转到这个 main.c 里的 main 函数，一定和这个压栈有关。\n\n压栈为什么和跳转到这里还能联系上呢？留作本文思考题，下一篇将揭秘这个过程，你会发现仍然简单得要死。\n\
    \n欲知后事如何，且听下回分解。\n\n**------- 本回扩展资料 -------**\n\n关于逻辑地址-线性地址-物理地址的转换，可以参考 Intel\
    \ 手册：\n\nIntel 3A Chapter 3 Protected-Mode Memory Management\n\n![](media/file70.webp\
    \ \"fig:\")\n\n而有关这些地址的定义和说明，在本小节中也做了详细的说明，看这里的介绍是最权威也是最透彻的。相信我，它很简单。\n\n![](media/file71.webp\
    \ \"fig:\")\n\n页目录表和页表的具体结构，可以看\n\nIntel 3A Chapter 4.3 32-bit paging\n\n![](media/file72.webp\
    \ \"fig:\")"
