    \ **task_struct**，这个结构之前在 [一个新进程的诞生（三）如果让你来设计进程调度](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501576&idx=1&sn=657e1c89d1007a935820d394d64f4035&chksm=c2c5bda5f5b234b3654c5ea2113cc0d48eee854f9f035ec69ec44bf9d964ae6cd4c181ed5880&scene=21#wechat_redirect)\
    \ 也简单说过了。\n\n```\n[](#cb168-1)struct task_struct {\n[](#cb168-2)    long state;\n\
    [](#cb168-3)    long counter;\n[](#cb168-4)    long priority;\n[](#cb168-5)  \
    \  ...\n[](#cb168-6)    struct tss_struct tss;\n[](#cb168-7)}\n```\n\n这个结构各个字段具体赋什么值呢？\n\
    \n通过 **copy_process** 这个名字我们知道，就是复制原来的进程，也就是当前进程。\n\n当前只有一个进程，就是数组中位置 0 处的 **init_task.init**，也就是零号进程，那自然就复制它咯。\n\
    \n好了，以上只是我们的猜测，有了猜测再看代码会非常轻松，我们一个个函数看。\n\n先来 **find_empty_process**。\n\n```\n\
    [](#cb169-1)long last_pid = 0;\n[](#cb169-2)\n[](#cb169-3)int find_empty_process(void)\
    \ {\n[](#cb169-4)    int i;\n[](#cb169-5)    repeat:\n[](#cb169-6)        if ((++last_pid)<0)\
    \ last_pid=1;\n[](#cb169-7)        for(i=0 ; i<64 ; i++)\n[](#cb169-8)       \
    \     if (task[i] && task[i]->pid == last_pid) goto repeat;\n[](#cb169-9)    for(i=1\
    \ ; i<64; i++)\n[](#cb169-10)        if (!task[i])\n[](#cb169-11)            return\
    \ i;\n[](#cb169-12)    return -EAGAIN;\n[](#cb169-13)}\n```\n\n一共三步，很简单。\n\n**第一步**，判断\
    \ ++last_pid 是不是小于零了，小于零说明已经超过 long 的最大值了，重新赋值为 1，起到一个保护作用，这没什么好说的。\n\n**第二步**，一个\
    \ for 循环，看看刚刚的 last_pid 在所有 task[] 数组中，是否已经被某进程占用了。如果被占用了，那就重复执行，再次加一，然后再次判断，直到找到一个\
    \ pid 号没有被任何进程用为止。\n\n**第三步**，又是个 for 循环，刚刚已经找到一个可用的 pid 号了，那这一步就是再次遍历这个 task[]\
    \ 试图找到一个空闲项，找到了就返回素组索引下标。\n\n**最终，这个方法就返回 task[] 数组的索引，表示找到了一个空闲项**，之后就开始往这里塞一个新的进程吧。\n\
    \n由于我们现在只有 0 号进程，且 task[] 除了 0 号索引位置，其他地方都是空的，所以这个方法运行完，last_**pid 就是 1，也就是新进程被分配的\
    \ pid 就是 1**，然后即将要加入的 task[] 数组的索引位置，也是 1。\n\n好的，那我们接下来就看，怎么构造这个进程结构，塞到这个 1 索引位置的\
