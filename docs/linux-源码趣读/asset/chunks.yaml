    \n这张图展示了整个系列的结构\n\n![](media/file80.webp \"fig:\")\n\n那今天就来整体梳理一下第一部分的内容，看过的同学跟着我回顾一下，没看过的同学，借着这波机会上车，也是不错的选择。\n\
    \n话不多说，我们开始。\n\n当你按下开机键的那一刻，在主板上提前写死的固件程序 BIOS 会将硬盘中启动区的 512 字节的数据，原封不动复制到内存中的\
    \ 0x7c00 这个位置，并跳转到那个位置进行执行，\n\n![](media/file81.webp \"fig:\")\n\n有了这个步骤之后，我们就可以把代码写在硬盘第一扇区，让\
    \ BIOS 帮我们加载到内存并由 CPU 去执行，我们不用操心这个过程。\n\n而这一个扇区的代码，就是操作系统源码中最最最开始的部分，它可以执行一些指令，也可以把硬盘的其他部分加载到内存，其实本质上也是执行一些指令。这样，整个计算机今后如何运作，就完全交到我们自己的手中，想怎么玩就怎么玩了。\n\
    \n这是 [第一回 | 最开始的两行代码](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499226&idx=1&sn=1ff3d54a3608423b7781142ae3ac62ca&chksm=c2c58777f5b20e61664a51d31ab779bbe68c317c3459218c7cd4b9530887dbb33470628c3248&scene=21#wechat_redirect)\
    \ 讲的内容。\n\n接下来，直到 [第四回 | 把自己在硬盘里的其他部分也放到内存来](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499359&idx=1&sn=233812a464996b9566cdf3258132bc22&chksm=c2c584f2f5b20de40a7990c754cdbf3073b4652f318d479ac0c8ff686ca7aa74eef1ba7c6c2f&scene=21#wechat_redirect)，我们才讲到整个操作系统的编译和加载过程的全貌，就是下面这张图。\n\
    \n![](media/file82.webp \"fig:\")\n\n而我们整个的第一部分，其实就在讲 boot 文件夹下的三个汇编文件的内容，bootsect.s，setup.s\
    \ 以及后面要和其他全部操作系统代码做链接的 head.s。\n\n前五回的内容一直在调整内存的布局，把这块内存复制到那块，又把那块内存复制到这块，所以在\
    \ [第五回 | 进入保护模式前的最后一次折腾内存](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499558&idx=1&sn=d5d057fae2fb835d38f82804c2649463&chksm=c2c5858bf5b20c9de2db5c31dd34fbe766f6c46cda17f54f4518a75fc1838f2ada6fe5717aad&scene=21#wechat_redirect)\
    \ 的结尾，我让你记住这样一张图，在很长一段时间这个内存布局的大体框架就不会再变了，前五回的内容你也可以抛在脑后了。\n\n![](media/file83.webp\
    \ \"fig:\")\n\n从第六回开始往后，就是逐渐进入保护模式，并设置分段、分页、中断等机制的地方。最终的内存布局变成了这个样子。\n\n![](media/file84.webp\
    \ \"fig:\")\n\n你看，idtr 寄存器指向了 idt，这个就是中断的设置；gdtr 寄存器指向了 gdt，这个就是全局描述符表的设置，可以简单理解为分段机制的设置；cr3\
    \ 寄存器指向了页目录表的位置，这个就是分页机制的设置。\n\n中断的设置，就引出了 CPU 与操作系统处理中断的流程。\n\n![](media/file85.webp\
    \ \"fig:\")\n\n分段和分页的设置，引出了逻辑地址到物理地址的转换。\n\n![](media/file86.webp \"fig:\")\n\n\
    具体来说，逻辑地址到线性地址的转换，依赖 Intel 的分段机制。\n\n![](media/file87.webp \"fig:\")\n\n而线性地址到物理地址的转换，依赖\
    \ Intel 的分页机制。\n\n![](media/file88.webp \"fig:\")\n\n**分段**和**分页**，就是 Intel 管理内存的两大利器，也是内存管理最最最最底层的支撑。\n\
    \n而 Intel 本身对于访问内存就分成三类：\n\n**代码**\n\n**数据**\n\n**栈**\n\n而 Intel 也提供了三个段寄存器来分别对应着三类内存：\n\
    \n**代码段寄存器（cs）**\n\n**数据段寄存器（ds）**\n\n**栈段寄存器（ss）**\n\n具体来说："
