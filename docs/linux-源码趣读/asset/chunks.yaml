    \ * bh) {\n    ...\n    make_request(major,rw,bh);\n}\n\nstatic void make_request(int\
    \ major,int rw, struct buffer_head * bh) {\n    ...\n    if (rw == READ)\n   \
    \     req = request+NR_REQUEST;\n    else\n        req = request+((NR_REQUEST)/3);\n\
    \    /* find an empty request */\n    while (--req >= request)\n        if (req->dev<0)\n\
