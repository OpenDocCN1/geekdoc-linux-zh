    \n* * *\n\n## 第8回 烦死了又要重新设置一遍 idt 和 gdt\n\n> 原文链接: [https://mp.weixin.qq.com/s/ssQKFMehxZxWT9i6mdRtXg](https://mp.weixin.qq.com/s/ssQKFMehxZxWT9i6mdRtXg)\n\
    \n书接上回，上回书咱们说到，CPU 进入了 32 位保护模式，我们快速回顾一下关键的代码。\n\n首先配置了全局描述符表 gdt 和中断描述符表 idt。\n\
    \n```\nlidt  idt_48\nlgdt  gdt_48\n```\n\n然后打开了 A20 地址线。\n\n```\nmov al,#0xD1\
    \        ; command write\nout #0x64,al\nmov al,#0xDF        ; A20 on\nout #0x60,al\n\
    ```\n\n然后更改 cr0 寄存器开启保护模式。\n\n```\nmov ax,#0x0001\nlmsw ax\n```\n\n最后，一个干脆利落的跳转指令，跳到了内存地址\
    \ 0 处开始执行代码。\n\n```\njmpi 0,8\n```\n\n0 位置处存储着操作系统全部核心代码，是由 head.s 和 main.c 以及后面的无数源代码文件编译并链接在一起而成的\
    \ system 模块。\n\n![](media/file53.webp \"fig:\")\n\n那接下来，我们就品品，正式进入 c 语言写的 main.c\
    \ 之前的 **head.s** 究竟写了点啥？\n\nhead.s 文件很短，我们一点点品。\n\n```\n_pg_dir:\n_startup_32:\n\
    \    mov eax,0x10\n    mov ds,ax\n    mov es,ax\n    mov fs,ax\n    mov gs,ax\n\
    \    lss esp,_stack_start\n```\n\n注意到开头有个标号 **_pg_dir**。先留个心眼，这个表示**页目录**，之后在设置分页机制时，页目录会存放在这里，也会覆盖这里的代码。\n\
    \n再往下连续五个 **mov** 操作，分别给 ds、es、fs、gs 这几个段寄存器赋值为 **0x10**(0000 0000 0001 0000)，根据段描述符结构解析，表示这几个段寄存器的值为指向全局描述符表中的第二个段描述符，也就是数据段描述符。\n\
    \n最后 **lss** 指令相当于让 **ss:esp** 这个栈顶指针指向了 **_stack_start** 这个标号的位置。还记得图里的那个原来的栈顶指针在哪里吧？往上翻一下，**0x9FF00**，现在要变咯。\n\
    \n这个 stack_start 标号定义在了很久之后才会讲到的 **sched.c** 里，我们这里拿出来分析一波。\n\n```\n[](#cb35-1)long\
    \ user_stack[4096 >> 2];\n[](#cb35-2)\n[](#cb35-3)struct\n[](#cb35-4){\n[](#cb35-5)\
    \  long *a;\n[](#cb35-6)  short b;\n[](#cb35-7)}\n[](#cb35-8)stack_start = {&user_stack[4096\
    \ >> 2], 0x10};\n```\n\n这啥意思呢？\n\n首先，stack_start 结构中的高位 8 字节是 **0x10**，将会赋值给 **ss**\
    \ 栈段寄存器，低位 16 字节是 **user_stack** 这个数组的最后一个元素的地址值，将其赋值给 **esp** 寄存器。\n\n赋值给 ss\
    \ 的 0x10 仍然按照保护模式下的**段选择子**去解读，其指向的是全局描述符表中的第二个段描述符（数据段描述符），段基址是 0。\n\n赋值给 esp\
    \ 寄存器的就是 user_stack 数组的最后一个元素的内存地址值，那最终的**栈顶地址**，也指向了这里（user_stack + 0），后面的压栈操作，就是往这个新的栈顶地址处压咯。\n\
    \n继续往下看\n\n```\ncall setup_idt ;设置中断描述符表\ncall setup_gdt ;设置全局描述符表\nmov eax,10h\n\
    mov ds,ax\nmov es,ax\nmov fs,ax\nmov gs,ax\nlss esp,_stack_start\n```\n\n先设置了\
    \ **idt** 和 **gdt**，然后又重新执行了一遍刚刚执行过的代码。\n\n为什么要重新设置这些段寄存器呢？因为上面修改了 gdt，所以要重新设置一遍以刷新才能生效。那我们接下来就把目光放到设置\
    \ idt 和 gdt 上。\n\n中断描述符表 idt 我们之前没设置过，所以这里设置具体的值，理所应当。"
