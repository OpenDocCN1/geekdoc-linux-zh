    \n```\n[](#cb316-1)// char_dev.c\n[](#cb316-2)static int rw_ttyx(int rw,unsigned\
    \ minor,char * buf,int count,off_t * pos) {\n[](#cb316-3)    return ((rw==READ)?tty_read(minor,buf,count):\n\
    [](#cb316-4)        tty_write(minor,buf,count));\n[](#cb316-5)}\n```\n\n根据 **rw\
    \ == READ** 走到读操作分支 **tty_read**，这就终于快和上一讲的故事接上了。\n\n以下是 tty_read 函数，我省略了一些关于信号和超时时间等非核心的代码。"
