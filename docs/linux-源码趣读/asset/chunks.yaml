    \ {\n    struct file * file = current->filp[fd];\n    // 校验 buf 区域的内存限制\n    verify_area(buf,count);\n\
    \    struct m_inode * inode = file->f_inode;\n    // 管道文件\n    if (inode->i_pipe)\n\
    \        return (file->f_mode&1) ? read_pipe(inode,buf,count) : -EIO;\n    //\
    \ 字符设备文件\n    if (S_ISCHR(inode->i_mode))\n        return rw_char(READ,inode->i_zone[0],buf,count,&file->f_pos);\n\
    \    // 块设备文件\n    if (S_ISBLK(inode->i_mode))\n        return block_read(inode->i_zone[0],&file->f_pos,buf,count);\n\
    \    // 目录文件或普通文件\n    if (S_ISDIR(inode->i_mode) || S_ISREG(inode->i_mode)) {\n\
    \        if (count+file->f_pos > inode->i_size)\n            count = inode->i_size\
    \ - file->f_pos;\n        if (count<=0)\n            return 0;\n        return\
    \ file_read(inode,file,buf,count);\n    }\n    // 不是以上几种，就报错\n    printk(\"(Read)inode->i_mode=%06o\\\
    n\\r\",inode->i_mode);\n    return -EINVAL;\n}\n```\n\n这样，整个的逻辑就非常清晰了。\n\n由此也可以注意到，操作系统源码的设计比我刚刚说的更通用，我刚刚只让你设计了读取硬盘的函数，但其实在\
    \ Linux 下一切皆文件，所以这个函数将`管道文件、字符设备文件、块设备文件、目录文件、普通文件`分别指向了不同的具体实现。\n\n那我们今天仅仅关注最常用的，读取目录文件或普通文件，并且不考虑读取的字节数大于文件本身大小这种不合理情况。\n\
    \n再简化下代码。\n\n```c\n// read_write.c\nint sys_read(unsigned int fd,char * buf,int\
    \ count) {\n    struct file * file = current->filp[fd];\n    struct m_inode *\
    \ inode = file->f_inode;\n    // 校验 buf 区域的内存限制\n    verify_area(buf,count);\n\
    \    // 仅关注目录文件或普通文件\n    return file_read(inode,file,buf,count);\n}\n```\n\n\
    太棒了！没剩多少了，一个个击破！\n\n第一步，根据文件描述符 `fd`，在进程表里拿到了 `file` 信息，进而拿到了 `inode` 信息。第二步，对\
    \ `buf` 区域的内存做校验。第三步，调用具体的 `file_read` 函数进行读操作。\n\n就这三步，很简单吧～\n\n在进程表 `filp` 中拿到\
    \ `file` 信息进而拿到 `inode` 信息这一步就不用多说了，这是在打开一个文件时，或者像管道文件一样创建出一个管道文件时，就封装好了 `file`\
    \ 以及它的 `inode` 信息。\n\n我们看接下来的两步。\n\n### 对 buf 区域的内存做校验 verify_area\n\n对 `buf`\
    \ 区域的内存做校验的部分，说是校验，里面还挺有说道呢。\n\n```c\n// fork.c\nvoid verify_area(void * addr,int\
    \ size) {\n    unsigned long start;\n    start = (unsigned long) addr;\n    size\
    \ += start & 0xfff;\n    start &= 0xfffff000;\n    start += get_base(current->ldt[2]);\n\
    \    while (size>0) {\n        size -= 4096;\n        write_verify(start);\n \
    \       start += 4096;\n    }\n}\n```\n\n`addr` 就是刚刚的 `buf`，`size` 就是刚刚的 `count`。这里又将\
    \ `addr` 赋值给了 `start`。所以代码开始，`start` 表示复制到的内存的起始地址，`size` 就是复制的字节数。\n\n这段代码很简单，但如果不了解内存的分段和分页机制，将会难以。Linux\
    \ 以 `4K` 为单位来划分内存，所以内存就是一个 `4K` 的格子。你看，假设复制到的内存的起始地址 `start` 和复制的字节数 `size` 在图中的位置。那么开始的两行代码：\n\
    \n```c\n// fork.c\nvoid verify_area(void * addr,int size) {\n    ...\n    size\
    \ += start & 0xfff;\n    start &= 0xfffff000;\n}\n```\n\n就是将 `start` 和 `size`\
    \ 按页对齐。然后由于每个进程有不同的数据段，还要加上它：\n\n```c\n// fork.c\nvoid verify_area(void * addr,int\
    \ size) {\n    ...\n    start += get_base(current->ldt[2]);\n    ...\n}\n```\n\
    \n具体来说加上当前进程的局部描述符 `LDT` 中的数据段。每个进程的 `LDT` 表由 Linux 创建时规划好了。具体来说，每个进程的线性地址范围是\
    \ `(进程号)*64M ~ `(进程号+1)*64M`。对于进程本身，以为是从零地址开始后的 `64M`，所以传入的 `start` 值是以零地址算出来的。\n\
    \n现在经过系统调用进入 `sys_write` 后切换为内核态，内核态访问数据通过基地址为 `0` 的全局描述符来数据。所以 `start` 要加上自己的数据段，才对。之后就是这些页进行验证。\n\
    \n```c\n// fork.c\nvoid verify_area(void * addr,int size) {\n    ...\n    while\
    \ (size>0) {\n        size -= 4096;\n        write_verify(start);\n        start\
    \ += 4096;\n    }\n}\n```\n\n也就是这些页。`write_verify` 将会对这些页进行验证，如果页面不可写，则执行 `un_wp_page`\
    \ 复制。\n\n```c\n// memory.c\nvoid write_verify(unsigned long address) {\n    unsigned\
    \ long page;\n    if (!(page = *((unsigned long *)(address>>12) & 0xfff)))\n \
    \       return;\n    page &= 0xfffff000;\n    page += ((address>>12) & 0xfff);\n\
    \    if ((page & 1) == 0) /* non-writeable, present */\n        un_wp_page((unsigned\
    \ long *) page);\n    return;\n}\n```\n\n看，那个 `un_wp_page` 意思就是取消页面的写保护，就是写时复制的原理。[写时复制这几行代码](http://mp.weixin.com/s?MzkMjE3NDE0Ng==mid=24750233&idx=1)讨论过了，这里就不展开。\n\
    \n### 执行读操作 file_read\n\n下面开始进入读的操作，页校验之后就可以调用 `file_read` 函数。\n\n```c\n// read_write.c\n\
    int sys_read(unsigned int fd,char * buf,int count) {\n    ...\n    return file_read(inode,buf,count);\n\
    }\n```\n\n```c\n// file_dev.c\nint file_read(struct m_inode * inode, struct file\
    \ * filp, char * buf, int count) {\n    int left,nr;\n    struct buffer_head *\
    \ bh;\n    left = count;\n    while (left) {\n        if ((nr = bmap(inode,filp->f_pos)/BLOCK_SIZE))\
    \ {\n            if (!(bread(inode->i_dev,nr)))\n                break;\n    \
    \    } else\n            bh = NULL;\n        nr = filp->f_pos % BLOCK_SIZE;\n\
    \        chars = MIN( BLOCK_SIZE, left );\n        filp->f_pos += chars;\n   \
    \     left -= chars;\n        if (bh) {\n            char * p = nr + bh->b_data;\n\
    \            while (chars-->0)\n                put_fs_byte(*(p++),buf++);\n \
    \           free(bh);\n        } else {\n            while (chars-->0)\n     \
    \           put_fs_byte(0,buf++);\n        }\n    }\n    inode->i_atime = CURRENT_TIME;\n\
    \    return (count-left) ? (count-left) : -ERROR;\n}\n```\n\n整体看，就是一个 `while`\
    \ 循环，每次读入一个块的数据，直到入参的大小读完为止。去掉 `while`，简化起来就是：\n\n```c\n// file_dev.c\nint file_read(struct\
    \ m_inode * inode, struct file * filp, char * buf, int count) {\n    ...\n   \
    \ int nr = bmap(inode,filp->f_pos)/BLOCK_SIZE;\n    struct buffer_head *bh=bread(inode->i_dev,nr);\n\
    \    ...\n    char * p = nr + bh->b_data;\n    while (chars-->0)\n         put_fs_byte(*(p++),buf++);\n\
    \    ...\n}\n```\n\n首先 `bmap` 获取全局数据块号，然后 `bread` 将块的数据复制到缓冲区，然后 `put_fs_byte`\
    \ 再一个字节一个字节地将缓冲区数据复制到用户指定的内存中。我们一个个看。\n\n### bmap：获取全局的数据块号\n\n先看第一个函数调用，`bmap`。\n\
    \n```c\n// file_dev.c\nint file_read(struct m_inode * inode, struct file * filp,\
    \ char * buf, int count) {\n    ...\n    int nr = bmap(inode,filp->f_pos)/BLOCK_SIZE;\n\
    \    ...\n}\n```\n\n```c\n// inode.c \nint bmap(struct m_inode * inode,int block)\
    \ {\n    return _bmap(inode,block,0);\n}\n\nstatic int _bmap(struct m_inode *\
    \ inode,int block,int create) {\n    ...\n    if (block<0)\n        ...\n    if\
    \ (block >= 7+512+512*512)\n        ...\n    if (block<7) \n        // zone[0]\
    \ 到 zone[7] 采用直接索引，可以索引小于 7 的块号\n        ...\n    if (block<512)\n        // zone[7]\
    \ 是一次间接索引，可以索引小于 512 的块号\n        ...\n    // zone[8] 是二次间接索引，可以索引大于 512 的块号\n\
    }\n```\n\n"
- fmt: "\n我们看到整个条件判断的结构是根据 `block` 来划分的。\n\n`block` 就是要读取的块号，之所以要划分，就是因为 `inode` 在记录文件所在块号时，采用了多级索引的方式。\n\
    \n![](media/file322.webp \"fig:\")\n\n`zone[0]` 到 `zone[7]` 采用直接索引，`zone[7]` 是一次间接索引，`zone[8]`\
    \ 是二次间接索引。\n\n那我们刚开始读，块号肯定从零开始，所以我们就先看 `block < 7`，通过直接索引这种最简单的方式读的代码。\n\n```c\n\
    // inode.c\nstatic int _bmap(struct m_inode * inode,int block,int create) {\n\
    \    ...\n    if (block < 7) {\n        if (create && !inode->i_zone[block])\n\
    \            if (inode->i_zone[block]=new_block(inode->i_dev)) {\n           \
    \     inode->i_ctime=CURRENT_TIME;\n                inode->i_dirt=1;\n       \
    \     }\n        return inode->i_zone[block];\n    }\n    ...\n}\n```\n\n由于 `create\
    \ = 0`，也就是并不需要创建一个新的数据块，所以里面的 `if` 分支也没了。\n\n```c\n// inode.c\nstatic int _bmap(struct\
    \ m_inode * inode,int block,int create) {\n    ...\n    if (block < 7) {\n   \
    \     ...\n        return inode->i_zone[block];\n    }\n    ...\n}\n```\n\n可以看到，其实\
    \ `bmap` 返回的，就是要读入的块号，从全局看在块设备的哪个逻辑块号下。\n\n也就是说，假如我想要读这个文件的第一个块号的数据，该函数返回的是你这个文件的第一个块在整个硬盘中的哪个块中。\n\
    \n### bread：将 bmap 获取的数据块号读入到高速缓冲块\n\n好了，拿到这个数据块号后，回到 `file_read` 函数接着看。\n\n```c\n\
    // file_dev.c\nint file_read(struct m_inode * inode, struct file * filp, char\
    \ * buf, int count) {\n    ...\n    while (left) {\n        if (nr = bmap(inode,(filp->f_pos)/BLOCK_SIZE))\
    \ {\n            if (!(bh=bread(inode->i_dev,nr)))\n    }\n    }\n}\n```\n\n`nr`\
    \ 就是具体的数据块号，作为其中其中一个参数，传入下一个函数 `bread`。\n\n`bread` 这个方法的入参除了数据块号 `block`（就是刚刚传入的\
    \ `nr`）外，还有 `inode` 结构中的 `i_dev`，表示设备号。\n\n```c\n// buffer.c\nstruct buffer_head\
    \ * bread(int dev,int block) {\n    struct buffer_head * bh = getblk(dev,block);\n\
    \    if (bh->b_uptodate)\n        return bh;\n    ll_rw_block(READ,bh);\n    wait_on_buffer(bh);\n\
    \    if (bh->b_uptodate)\n        return bh;\n    brelse(bh);\n    return NULL;\n\
    }\n```\n\n这个 `bread` 方法就是根据一个设备号 `dev` 和一个数据块号 `block`，将这个数据块的数据，从硬盘复制到缓冲区里。\n\
    \n关于缓冲区，已经在 [第19回 | 缓冲区初始化 buffer_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500596&idx=1&sn=0df64f9f5133cfe8a259b8ce7b7feaeb&chksm=c2c5b999f5b2308f76095af30e8915f125f18702df9c58be7612b58e4d009c149481)\
    \ 中提到。`getblk` 方法根据设备号 `dev` 和数据块号 `block` 申请到一个缓冲块。简单说，先根据 `hash` 结构快速查找 `dev`\
    \ 和 `block` 是否存在缓冲块。如果没有，那就从之前建立的双向链表的头指针 `free_list` 开始寻找，直到找到一个可用的缓冲块。具体代码逻辑包含当缓冲块正在其他进程使用或者缓冲块对应的数据被修改时的处理，你可以一看关键流程。\n\
    \n```c\n// buffer.c\nstruct buffer_head * bread(int dev,int block) {\n    struct\
    \ buffer_head * bh = getblk(dev,block);\n    ...\n}\n\nstruct buffer_head * getblk(int\
    \ dev,int block) {\n    struct buffer_head * tmp, * bh;\n    repeat:\n    // 先从\
    \ hash 结构中找\n    if (bh = get_hash_table(dev,block))\n        return bh;\n   \
    \ // 如果没有就 free_list 开始找双向链表\n    tmp = free_list;\n    do {\n        if (tmp->b_count)\n\
    \            continue;\n        if (!bh || BAD(tmp)) {\n            bh = tmp;\n\
    \            if (!BAD(tmp))\n                break;\n        }\n    } while ((tmp->b_free)\
    \ != free_list);\n    // 如果还没找到，说明没有缓冲块可用，就阻塞等会\n    if (!bh) {\n        sleep_on(&buffer_wait);\n\
    \        goto repeat;\n    }\n    // 到这里说明申请到了缓冲块，但被其他进程上锁了\n    // 如果上锁了，就等等\n\
    \    wait_on_buffer(bh);\n    if (bh->b_count)\n        goto repeat;\n    // 到这里说明缓冲块申请到，且没有上锁\n\
    \    // 但还得看 dirt 位，也就是有没有被修改\n    // 如果被修改了，就重新从硬盘中读入新数据\n    while (bh->b_dirt)\
    \ {\n        sync_dev(bh->b_dev);\n        wait_on_buffer(bh);\n        if (bh->b_count)\n\
    \            goto repeat;\n    }\n    if (find_buffer(dev,block))\n        goto\
    \ repeat;\n    // 给刚刚获取到的缓冲头 bh 重新赋值并调整在双向链表和 hash 表中的位置\n    bh->b_count=1;\n\
    \    bh->b_dirt=0;\n    bh->b_uptodate=0;\n    remove_from_queues(bh);\n    bh->b_dev=dev;\n\
    \    bh->b_blocknr=block;\n    insert_into_queues(bh);\n    return bh;\n}\n```\n\
    \n总之，经过 `getblk` 之后，我们就在内存中找到处缓冲块用来存储数据块的数据。接下来的一步，自然就是把硬盘中的数据复制到这里，`ll_rw_block`\
    \ 就是干事的。这个方法的细节特别复杂，我看了很久才明白，会在下一回详细展开。在这一回里你已经成功把硬盘中的数据块数据复制到了刚刚申请好的缓冲区里。接下来通过\
    \ `put_fs` 方法将缓冲区里的数据复制到用户内存中。\n\n```c\n// file_dev.c\nint file_read(struct m_inode\
    \ * inode, struct file * filp, char * buf, int count) {\n    ...\n    int nr =\
    \ bmap(inode,(filp->f_pos)/BLOCK_SIZE);\n    struct buffer_head *bh=bread(inode->i_dev,nr);\n\
    \    char * p = nr + bh->b_data;\n    while (count--)\n        put_fs(*(p++),buf++);\n\
    }\n}\n```\n\n### put_fs：将 bread 读入的缓冲块数据复制到用户内存\n\n这个过程仅仅是内存之间的复制，不必紧张。\n\n```c\n\
    // segment.h\ninline void put_fs(char val, char *addr) {\n    __asm__ (\"mov %0,%%fs:%1\"\
    :\"r\"(val),\"m\"addr));\n}\n```\n\n有点难以理解，改成好看的样子（参考赵炯《Linux内核注释1.9.5》）：\n\n\
    ```c\n// segment.h\ninline void put_fs(char val, char *addr) {\n    _asm mov ebx,addr;\n\
    \    _asm mov al,val;\n    _asm mov byte ptr:[ebx],al;\n}\n```\n\n其实就是三个汇编指令的\
    \ `mov` 操作。至此，我们将数据从硬盘读入缓冲区，再从缓冲区读入用户内存，一个 `read` 函数完美谢幕！\n\n![](media/file325.webp\
    \ \"fig:\")\n\n首先通过 `verify_area` 对内存做了校验，需要写复制的地方在这里进行好了。接下来，`file_read` 方法做了读盘的全部操作，通过\
    \ `bmap` 获取到了硬盘全局的数据块号，然后 `bread` 将数据块数据复制到缓冲区，然后 `put_fs` 再将缓冲区数据复制到用户内存。\n\n\
    今天内容较多，好好消化一下，欲知后事如何，且听下回分解。\n"
