    \    return 0;\n}\n```\n\n不出我们所料，和**进程打开一个文件**的步骤是差不多的，可以回顾下[第33回 | 打开终端设备文件](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502230&idx=1&sn=44e023bf0b9b37261e35a6e3722bc57f&chksm=c2c5b33bf5b23a2d10a9dd36606c497f41a1c3dced57845ce7ef12741a348fab82beba462a8a&scene=21#wechat_redirect)这一回，下图是进程打开一个文件时的步骤。\n\
