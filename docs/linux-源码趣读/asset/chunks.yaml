    \n不过会以文章质量和准确性为主，不会带着问题强行按时更新的。\n\n本系列**完全免费**，直到所有章节全部结束，所以你们的喜欢和传播就是对我最大的支持，可以**星标**我的公众号防止错过更新提醒。\n\
    \n公众号虽然与读者距离更近，但它却是个封闭的空间，平台和搜索引擎不会主动向外扩散，所以如果没有人主动帮忙传播，会一直限制在公众号粉丝的圈子里，越到后面看的人也会越少。\n\
    \n这也是很多公众号系列中途腰斩的因素之一，所以还是希望大家喜欢这个系列的话，可以多多帮忙传播，比如**朋友圈打打卡**，或者如果你也写博客的话，**文章里提提我**，都是可以帮到这个系列活下去的重要途径，在此多谢各位捧场啦！\n\
    \n同时我也会在 **GitHub** 上进行同步，因为公众号文章发了之后就无法修改，也没法进行整体调整。感兴趣的也可以点击**阅读原文**进入 GitHub。但我同步应该不会很及时，还是以公众号为主战场，毕竟时间和精力有限。\n\
    \n那就让我们一起期待吧！\n\n# 第一部分：进入内核前的苦力活\n\n* * *\n\n## 第1回 最开始的两行代码\n\n> 原文链接: [https://mp.weixin.qq.com/s/LIsqRX51W7d_yw-HN-s2DA](https://mp.weixin.qq.com/s/LIsqRX51W7d_yw-HN-s2DA)\n\
    \n从这一篇开始，您就将跟着我一起进入这操作系统的梦幻之旅！\n\n别担心，每一章的内容会非常的少，而且你也不要抱着很大的负担去学习，只需要像读小说一样，跟着我一章一章读下去就好。\n\
    \n话不多说，直奔主题。当你按下开机键的那一刻，在主板上提前写死的固件程序 **BIOS** 会将硬盘中**启动区的 512 字节**的数据，原封不动复制到**内存中的\
    \ 0x7c00** 这个位置，并跳转到那个位置进行执行。\n\n![](media/file3.webp \"fig:\")\n\n启动区的定义非常简单，只要硬盘中的\
    \ 0 盘 0 道 1 扇区的 512 个字节的最后两个字节分别是 **0x55** 和 **0xaa**，那么 BIOS 就会认为它是个启动区。\n\n\
    所以对于我们理解操作系统而言，此时的 BIOS 仅仅就是个代码搬运工，把 512 字节的二进制数据从硬盘搬运到了内存中而已。**所以作为操作系统的开发人员，仅仅需要把操作系统最开始的那段代码，编译并存储在硬盘的\
    \ 0 盘 0 道 1 扇区即可**。之后 BIOS 会帮我们把它放到内存里，并且跳过去执行。\n\n而 Linux-0.11 的最开始的代码，就是这个用汇编语言写的\
    \ **bootsect.s**，位于 **boot** 文件夹下。\n\n![](media/file4.webp \"fig:\")\n\n通过编译，这个\
    \ bootsect.s 会被编译成二进制文件，存放在启动区的第一扇区。\n\n![](media/file5.webp \"fig:\")\n\n随后就会如刚刚所说，由\
    \ BIOS 搬运到内存的 0x7c00 这个位置，而 CPU 也会从这个位置开始，不断往后一条一条语句无脑地执行下去。\n\n那我们的梦幻之旅，就从这个文件的第一行代码开始啦！\n\
    \n```\nmov ax,0x07c0\nmov ds,ax\n```\n\n好吧，先连续看两行。\n\n这段代码是用汇编语言写的，含义是把 0x07c0\
    \ 这个值复制到 **ax 寄存器**里，再将 ax 寄存器里的值复制到 **ds 寄存器**里。那其实这一番折腾的结果就是，让 ds 这个寄存器里的值变成了\
    \ 0x07c0。\n\n![](media/file6.webp \"fig:\")\n\nds 是一个 16 位的段寄存器，具体表示数据段寄存器，在内存寻址时充当段基址的作用。啥意思呢？就是当我们之后用汇编语言写一个内存地址时，实际上仅仅是写了偏移地址，比如：\n\
    \n```\nmov ax, [0x0001]\n```\n\n实际上相当于\n\n```\nmov ax, [ds:0x0001]\n```\n\nds\
    \ 是默认加上的，表示在 ds 这个段基址处，往后再偏移 0x0001 单位，将这个位置的内存数据，复制到 ax 寄存器中。\n\n形象地比喻一下就是，你和朋友商量去哪玩比较好，你说天安门、南锣鼓巷、颐和园等等，实际上都是**偏移地址**，省略了北京市这个**基址**。\n\
    \n当然你完全可以说北京天安门、北京南锣鼓巷这样，每次都加上北京这个前缀。不过如果你事先和朋友说好，以下我说的地方都是北京市里的哈，之后你就不用每次都带着北京市这个词了，是不是很方便？\n\
    \n那 ds 这个数据段寄存器的作用就是如此，方便了描述一个内存地址时，可以省略一个基址，没什么神奇之处。\n\n> ds : 0x0001\n\n> \n\
    \n> 北京市 : 南锣鼓巷\n\n再看，这个 ds 被赋值为了 0x07c0，由于 x86 为了让自己在 16 位这个实模式下能访问到 20 位的地址线这个历史因素（不了解这个的就先别纠结为啥了），所以段基址要先左移四位。**那\
    \ 0x07c0 左移四位就是 0x7c00**，那这就刚好和这段代码被 BIOS 加载到的内存地址 0x7c00 一样了。\n\n也就是说，之后再写的代码，里面访问的数据的内存地址，都先默认加上\
    \ 0x7c00，再去内存中寻址。\n\n为啥统一加上 0x7c00 这个数呢？这很好解释，**BIOS 规定死了把操作系统代码加载到内存 0x7c00**，那么里面的各种数据自然就全都被偏移了这么多，所以把数据段寄存器\
    \ ds 设置为这个值，方便了以后通过这种基址的方式访问内存里的数据。\n\n![](media/file7.webp \"fig:\")\n\nOK，赶紧消化掉前面的知识，那本篇就到此为止，只讲了两行代码，知识量很少，我没骗你吧。\n\
    \n希望你能做到，对 BIOS 将操作系统代码加载到内存 0x7c00，以及我们通过 mov 指令将默认的数据段寄存器 ds 寄存器的值改为 0x07c0\
    \ 方便以后的基址寻址方式，这两件事在心里认可，并且没有疑惑，这才方便后面继续进行。\n\n后面的世界越来越精彩，欲知后事如何，且听下回分解。\n\n**-------\
    \ 本回扩展资料 -------**\n\n有关寄存器的详细信息，可以参考 Intel 手册：\n\nVolume 1 Chapter 3.2 OVERVIEW\
    \ OF THE BASIC EXECUTION ENVIRONMEN\n\n有关计算机启动部分的原理如果还不清楚，可以看我之前的一篇文章了解一下：\n\n\
    [计算机的启动过程](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247483867&idx=1&sn=76ece31324d32922a7cb9db129decd3f&chksm=c2c67b76f5b1f260bb459e12c029f8e6a7a813055811ab8ed794a3f36d0d7d50e66df27f4f0a&scene=21#wechat_redirect)\n\
    \n如果想了解计算机启动时详细的初始化过程，还是得参考 Intel 手册：\n\nVolume 3A Chapter 9 PROCESSOR MANAGEMENT\
    \ AND INITIALIZATION\n\n* * *\n\n## 第2回 自己给自己挪个地儿\n\n> 原文链接: [https://mp.weixin.qq.com/s/U-txDYt0YqLh5EeFOcB4NQ](https://mp.weixin.qq.com/s/U-txDYt0YqLh5EeFOcB4NQ)\n\
    \n书接上回，上回书咱们说到，CPU 执行操作系统的最开始的两行代码。\n\n```\nmov ax,0x07c0\nmov ds,ax\n```\n\n\
    将数据段寄存器 ds 的值变成了 **0x07c0**，方便了之后访问内存时利用这个**段基址**进行寻址。\n\n接下来我们带着这两行代码，继续往下看几行。\n\
    \n```\nmov ax,0x07c0\nmov ds,ax\nmov ax,0x9000\nmov es,ax\nmov cx,#256\nsub si,si\n\
    sub di,di\nrep movw\n```\n\n此时 ds 寄存器的值已经是 0x07c0 了，然后又通过同样的方式将 **es** 寄存器的值变成\
    \ **0x9000**，接着又把 **cx** 寄存器的值变成 **256**（代码里确实是用十进制表示的，与其他地方有些不一致，不过无所谓）。\n\n\
    再往下看有两个 **sub** 指令，这个 sub 指令很简单，比如\n\n```\nsub a,b\n```\n\n就表示\n\n```\n[](#cb7-1)a\
    \ = a - b\n```\n\n那么代码中的\n\n```\nsub si,si\n```\n\n就表示\n\n```\n[](#cb9-1)si =\
    \ si - si\n```\n\n所以如果 sub 后面的两个寄存器一模一样，就相当于把这个寄存器里的值**清零**，这是一个基本玩法。\n\n那就非常简单了，经过这些指令后，以下几个寄存器分别被附上了指定的值，我们梳理一下。\n\
    \n> **ds = 0x07c0**\n\n> \n\n> **es = 0x9000**\n\n> \n\n> **cx = 256**\n\n> \n\
    \n> **si = 0**\n\n> \n\n> **di = 0*\n\n还记得上一讲画的 CPU 寄存器的总图么？此时就是这样了\n\n![](media/file8.webp\
    \ \"fig:\")\n\n干嘛要给这些毫不相干的寄存器附上值呢？其实就是为下一条指令服务的，就是\n\n```\nrep movw\n```\n\n其中\
    \ **rep** 表示重复执行后面的指令。\n\n而后面的指令 **movw** 表示复制一个**字**（word 16位），那其实就是**不断重复地复制一个字**。\n\
    \n那下面自然就有三连问：\n\n**重复执行多少次呢？**是 cx 寄存器中的值，也就是 256 次。\n\n**从哪复制到哪呢？**是从 ds:si 处复制到\
    \ es:di 处。\n\n**一次复制多少呢？**刚刚说过了，复制一个字，16 位，也就是两个字节。\n\n上面是直译，那把这段话翻译成更人话的方式讲出来就是，**将内存地址\
    \ 0x7c00 处开始往后的 512 字节的数据，原封不动复制到 0x90000 处**。\n\n就是下图的第二步。\n\n![](media/file9.webp\
    \ \"fig:\")"
