  trans: "\n\n```\n// exec.c\nint do_execve(...) {\n    ...\n    // 设置栈指针\n    eip[3]\
    \ = p;\n}\n```\n\n为什么这样操作就可以达到更换栈顶指针的作用呢？那我们结合着更换代码指针 `PC` 来进行讲解。\n\n### 设置 eip\
    \ 和 esp，完成摇身一变\n\n下面这两行就是 `execve` 完成摇身一变的关键，解释了它为什么能做到变成一个新程序开始执行的关键密码。\n\n```c\n\
    // exec.c\nint do_execve(unsigned long * eip, ...) {\n    ...\n    eip[0] = ex.a_entry;\n\
    \    eip[3] = p; \n    ...\n}\n```\n\n什么叫一个新程序开始执行呢？\n\n其实本质上就是，代码指针 `eip` 和栈指针\
    \ `esp` 指向了一个新的地方。\n\n代码指针 `eip` 决定了 CPU 将执行哪一段指令，栈指针 `esp` 决定了 CPU 压栈操作的位置，以及读取栈空间数据的位置，在高级语言视角下就是局部变量以及函数调用链的栈帧。\n\
    \n所以这两行代码，第一行重新设置了代码指针 `eip` 的值，指向 `/bin/sh` 这个 `a.out` 格式文件的头结构 `exec` 中的 `a_entry`\
    \ 字段，表示该程序的入口地址。\n\n第二行重新设置了栈指针 `esp` 的值，指向了我们经过一路计算得到的 `p`，也就是图中 `sp` 的值。将这个值作为新的栈顶十分合理。\n\
    \n![](img/file256.png \"fig:\")\n\n`eip` 和 `esp` 都设置好了，那么程序摇身一变的工作自然就结束了，非常简单。\n\
    \n至于为什么往 `eip` 的 0 和 3 索引位置处写入数据，就可以达到替换 `eip` 和 `esp` 的目的，那我们就得看看这个 `eip` 变量是怎么来的了。\n\
    \n### 计算机的世界没有魔法\n\n还记得 `execve` 的调用链么？\n\n```c\nstatic char * argv_rc[] = { \"\
    /bin/sh\", NULL };\nstatic char * envp_rc[] = { \"HOME=/\", NULL };\n\n// 调用方\n\
    execve(\"/bin/sh\",argv_rc,envp_rc);\n\n// 宏定义\n_syscall3(int,execve,const char\
    \ *,file,char **,argv,char **,envp)\n\n// 通过系统调用进入到这里\nEIP = 0x1C\n_sys_execve:\n\
    \    lea EIP(%esp),%eax\n    pushl %eax\n    call _do_execve\n    addl $4,%esp\n\
    \    ret\n\n// exec.c\nint do_execve(unsigned long * eip, ...) {\n    ...\n  \
    \  eip[0] = ex.a_entry;\n    eip[3] = p; \n    ...\n}\n```\n\n千万别忘了，我们这个 `do_execve`\
    \ 函数，是通过一开始的 `execve` 函数触发了系统调用来到的这里。\n\n系统调用是一种中断，前面说过，中断时 CPU 会给栈空间里压入一定的信息，这部分信息是死的，查手册可以查得到。\n\
    \n![](img/file257.webp \"fig:\")\n\n然后，进入中断以后，通过系统调用查表进入到 `_sys_execve` 这里。\n\n\
    ```asm\nEIP = 0x1C\n_sys_execve:\n    lea EIP(%esp),%eax\n    pushl %eax\n   \
    \ call _do_execve\n    addl $4,%esp\n    ret\n```\n\n看到没？在真正调用 `do_execve` 函数时，`_sys_execve`\
    \ 这段代码偷偷地插入了一个小步骤，就是把当前栈顶指针 `esp` 偏移到 `EIP` 处的地址值给当做第一个参数 `unsigned long * eip`\
    \ 传入进来了。\n\n而偏移 `EIP` 处的位置，恰好就是中断时压入的 `EIP` 值。所以 `eip[0]` 表示栈空间里的 `EIP` 位置，`eip[3]`\
    \ 表示栈空间里的 `ESP` 位置。\n\n![](img/file258.webp \"fig:\")\n\n由于我们现在处于中断，所以中断返回后也就是\
    \ `do_execve` 函数之后就会寻找中断返回前的几个值（包括 `eip` 和 `esp`）进行恢复。这里有疑惑的同学，看我之前写的[中断](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a)和[中断（软）](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a)这两篇文章，我认为把中断的原理彻底清楚了，不过就是读手册罢了。如果我们把栈空间里的\
    \ `eip` 和 `esp` 替换成 `/bin/sh` 需要 `eip` 和 `esp`，那么中断返回的“恢复”工作犹如“跳转”到一个新一样，其实是我们欺骗了\
    \ CPU，达到了 `execve` 函数的效果。所以，计算机的世界没有魔法，通过这一点完成的，大部分人都不花时间去究。\n\n### 总结\n\n本章讲解了我\
    \ Linux 0.11 里面难理解 `execve` 函数的核心逻辑，顺下来发现它完成的事情也是简单拼凑起来的。把代码从哪里执行的 `eip` 和新的栈空间里的\
    \ `esp` 给弄好，`/bin/sh` 文件是怎么构造出来的那就是 `gcc` 编译和链接的事，而且 Linux 0.11 所用的执行文件 `a.out`\
    \ 已经被现在的 `ELF` 格式取代，那就不要在研究的范畴，不然就休止了。OK，至此，`execve` 函数就结束了。\n\n```c\nvoid init(void)\
    \ {\n    ...\n    if (!(pid=fork())) {\n        close(0);\n        open(\"/etc/rc\"\
    ,O_RDONLY,0);\n        execve(\"/bin/sh\",argv_rc,envp_rc);\n        _exit(2);\n\
    \    }\n    ...\n}\n```\n\n它的返回意味着接下来将执行 `/bin/sh` 这个执行文件。不过有两个问题：第一，`/bin/sh`\
