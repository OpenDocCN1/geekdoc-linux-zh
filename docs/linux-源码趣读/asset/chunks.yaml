    \ [第42回 | 用键盘输入一条命令](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502876&idx=1&sn=2c34491abd6ea14c9c7ccc3d2d9827c1&chksm=c2c5b6b1f5b23fa7bdf9c3e2bf811b84da937d30a2c9825ceba8a57c2c3e8e157dedae0bfc8d&scene=21#wechat_redirect)\
    \ 一讲中提到过了。\n\n```\n[](#cb322-1)// tty_io.c\n[](#cb322-2)void do_tty_interrupt(int\
    \ tty) {\n[](#cb322-3)    copy_to_cooked(tty_table+tty);\n[](#cb322-4)}\n[](#cb322-5)\n\
    [](#cb322-6)void copy_to_cooked(struct tty_struct * tty) {\n[](#cb322-7)    ...\n\
    [](#cb322-8)    wake_up(&tty->secondary.proc_list);\n[](#cb322-9)}\n```\n\n可以看到，在\
    \ copy_to_cooked 里，在将 read_q 队列中的字符处理后放入 secondary 队列中的最后一步，就是唤醒 **wake_up** 这个队列里的等待进程。\n\
    \n而 wake_up 函数更为简单，就是修改一下状态，使其变成可运行的状态。\n\n```\n[](#cb323-1)// sched.c\n[](#cb323-2)void\
    \ wake_up(struct task_struct **p) {\n[](#cb323-3)    if (p && *p) {\n[](#cb323-4)\
    \        (**p).state=0;\n[](#cb323-5)    }\n[](#cb323-6)}\n```\n\n总体流程就是这个样子的。\n\
    \n![](media/file301.webp \"fig:\")\n\n当然，进程的阻塞与唤醒是个体系，还有很多细节，我们下一回再仔细展开这部分的内容。\n\
    \n欲知后事如何，且听下回分解。\n\n* * *\n\n## 第44回 | 进程的阻塞与唤醒\n\n> 原文链接: [https://mp.weixin.qq.com/s/HFQL5d-C24DKjQbYAQfl8g](https://mp.weixin.qq.com/s/HFQL5d-C24DKjQbYAQfl8g)\n\
    \n新建一个非常简单的 info.txt 文件。\n\n```\nname:flash\nage:28\nlanguage:java\n```\n\n在命令行输入一条十分简单的命令。\n\
    \n```\n[root@linux0.11] cat info.txt | wc -l\n3\n```\n\n这条命令的意思是读取刚刚的 info.txt\
    \ 文件，输出它的行数。\n\n在上一回中，我们分析了一下 shell 进程是如何读取你的命令的，流程如下图。\n\n![](media/file302.webp\
    \ \"fig:\")\n\n当然，这里的 **sleep_on** 和 **wake_up** 是进程的阻塞与唤醒机制的实现，我们没有展开讲解。\n\n\
    那我们今天，就详细看看这块的逻辑。\n\n首先，表示进程的数据结构是 task_struct，其中有一个 **state** 字段表示进程的状态，它在 Linux\
    \ 0.11 里有五种枚举值。\n\n```\n[](#cb326-1)// shed.h\n[](#cb326-2)#define TASK_RUNNING\
    \ 0  // 运行态\n[](#cb326-3)#define TASK_INTERRUPTIBLE 1  // 可中断等待状态。\n[](#cb326-4)#define\
    \ TASK_UNINTERRUPTIBLE 2  // 不可中断等待状态\n[](#cb326-5)#define TASK_ZOMBIE 3  // 僵死状态\n\
    [](#cb326-6)#define TASK_STOPPED 4  // 停止\n```\n\n当进程首次被创建时，也就是 fork 函数执行后，它的初始状态是\
    \ 0，也就是运行态。\n\n```\n// system_call.s\n_sys_fork:\n    ...\n    call _copy_process\n\
    \    ...\n\n// fork.c\nint copy_process(...) {\n    ...\n    p->state = TASK_RUNNING;\n\
    \    ...\n}\n```\n\n只有当处于运行态的进程，才会被调度机制选中，送入 CPU 开始执行。\n\n```\n[](#cb328-1)//\
    \ sched.c\n[](#cb328-2)void schedule (void) {\n[](#cb328-3)    ...\n[](#cb328-4)\
    \    if ((*p)->state == TASK_RUNNING && (*p)->counter > c) {\n[](#cb328-5)   \
    \     ...\n[](#cb328-6)        next = i;\n[](#cb328-7)    }\n[](#cb328-8)    ...\n\
    [](#cb328-9)    switch_to (next);\n[](#cb328-10)}\n```\n\n以上我简单列出了关键代码，基本可以描绘进程调度的大体框架了，不熟悉的朋友还请回顾下\
    \ [第23回 | 如果让你来设计进程调度](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501576&idx=1&sn=657e1c89d1007a935820d394d64f4035&scene=21#wechat_redirect)。\n\
    \n所以，使得一个进程阻塞的方法非常简单，并不需要什么魔法，只需要将其 **state** 字段，变成**非 TASK_RUNNING** 也就是非运行态，即可让它暂时不被\
    \ CPU 调度，也就达到了阻塞的效果。\n\n同样，唤醒也非常简单，就是再将对应进程的 state 字段变成 TASK_RUNNING 即可。\n\n**Linux\
    \ 0.11 中的阻塞与唤醒，就是 sleep_on 和 wake_up 函数。**\n\n其中 sleep_on 函数将 state 变为 TASK_UNINTERRUPTIBLE。\n\
    \n```\n[](#cb329-1)// sched.c\n[](#cb329-2)void sleep_on (struct task_struct **p)\
    \ {\n[](#cb329-3)    struct task_struct *tmp;\n[](#cb329-4)    ...\n[](#cb329-5)\
    \    tmp = *p;\n[](#cb329-6)    *p = current;\n[](#cb329-7)    current->state\
    \ = TASK_UNINTERRUPTIBLE;\n[](#cb329-8)    schedule();\n[](#cb329-9)    if (tmp)\n\
    [](#cb329-10)        tmp->state = 0;\n[](#cb329-11)}\n```\n\n而 wake_up 函数将 state\
    \ 变回为 TASK_RUNNING，也就是 0。\n\n```\n[](#cb330-1)// sched.c\n[](#cb330-2)void wake_up\
    \ (struct task_struct **p) {\n[](#cb330-3)    (**p).state = 0;\n[](#cb330-4)}\n\
    ```\n\n是不是非常简单？\n\n当然 sleep_on 函数除了改变 state 状态之外，还有些难理解的操作，我们先试着来分析一下。\n\n当首次调用\
    \ sleep_on 函数时，比如 tty_read 在 secondary 队列为空时调用 sleep_on，传入的 *p 为 NULL，因为此时还没有等待\
    \ secondary 这个队列的任务。\n\n```\n[](#cb331-1)struct tty_queue {\n[](#cb331-2)    ...\
    \ \n[](#cb331-3)    struct task_struct * proc_list;\n[](#cb331-4)};\n[](#cb331-5)\n\
    [](#cb331-6)struct tty_struct {\n[](#cb331-7)    ...\n[](#cb331-8)    struct tty_queue\
    \ secondary;\n[](#cb331-9)};\n[](#cb331-10)\n[](#cb331-11)int tty_read(unsigned\
    \ channel, char * buf, int nr) {\n[](#cb331-12)    ...\n[](#cb331-13)    sleep_if_empty(&tty->secondary);\n\
    [](#cb331-14)    ...\n[](#cb331-15)}\n[](#cb331-16)\n[](#cb331-17)static void\
    \ sleep_if_empty(struct tty_queue * queue) {\n[](#cb331-18)    ...\n[](#cb331-19)\
    \    interruptible_sleep_on(&queue->proc_list);\n[](#cb331-20)    ... \n[](#cb331-21)}\n\
    ```\n\n通过 **tmp = *p** 和 ***p = current** 两个赋值操作，此时：\n\ntmp = NULL\n\n*p = 当前任务\n\
    \n同时也使得 proc_list 指向了当前任务的 task_struct。\n\n![](media/file303.webp \"fig:\")\n\n\
    当有另一个进程调用了 tty_read 读取了同一个 tty 的数据时，就需要再次 sleep_on，此时携带的 *p 就是一个指向了之前的\"当前任务\"\
    的结构体。\n\n那么经过 tmp = *p 和 *p = current 两个赋值操作后，会变成这个样子。\n\n![](media/file304.webp\
    \ \"fig:\")\n\n也就是说，通过每一个当前任务所在的代码块中的 tmp 变量，总能找到上一个正在同样等待一个资源的进程，因此也就形成了一个链表。\n\
    \n那么，当某进程调用了 wake_up 函数唤醒 proc_list 上指向的第一个任务时，改任务变会在 sleep_on 函数执行完 schedule()\
    \ 后被唤醒并执行下面的代码，把 tmp 指针指向的上一个任务也同样唤醒。\n\n```\n[](#cb332-1)// sched.c\n[](#cb332-2)void\
    \ sleep_on (struct task_struct **p) {\n[](#cb332-3)    struct task_struct *tmp;\n\
    [](#cb332-4)    ...\n[](#cb332-5)    tmp = *p;\n[](#cb332-6)    *p = current;\n\
    [](#cb332-7)    current->state = TASK_UNINTERRUPTIBLE;\n[](#cb332-8)    schedule();\n\
    [](#cb332-9)    if (tmp)\n[](#cb332-10)        tmp->state = 0;\n[](#cb332-11)}\n\
    ```\n\n永远记住，唤醒其实就是把 state 变成 0 而已。\n\n而上一个进程唤醒后，和这个被唤醒的进程一样，也会走过它自己的 sleep_on\
    \ 函数的后半段，把它的上一个进程，也就是上上一个进程唤醒。\n\n那么上上一个进程，又会唤醒上上上一个进程，上上上一个进程，又会...\n\n看懂了没，通过一个\
    \ wake_up 函数，以及上述这种 tmp 变量的巧妙设计，我们就能制造出唤醒的一连串连锁反应。\n\n当然，唤醒后谁能优先抢到资源，那就得看调度的时机以及调度的机制了，对我们来说相当于听天由命了。"
