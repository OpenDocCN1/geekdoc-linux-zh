    \n* * *\n\n## 第30回 番外篇 - 写时复制就这么几行代码\n\n> 原文链接: [https://mp.weixin.qq.com/s/Pdnmys_hGoToZN193rfnoQ](https://mp.weixin.qq.com/s/Pdnmys_hGoToZN193rfnoQ)\n\
    \n这里讲的是 Linux 内核里的写时复制原理。\n\n写时复制的原理网上讲述的文章很多，今天来一篇很直接的文章，通过看看 Linux 0.11 这个最简单的操作系统，从源码层面把写时复制的原理搞清楚。\n\
    \n很简单哦，你可别中途就放弃了。\n\n直接干！\n\n哦不行，干之前先来点储备知识，如果你已经有了这一 pa 可以略过，不过我估计你没有...\n\n\
    ### 储备知识\n\n坚持看完这部分，写时复制用到的这里的知识点只有其中一个位的值而已，但我把周边也给你讲讲。\n\n32 位模式下，Intel 设计了**页目录表**和**页表**两种结构，用来给程序员们提供分页机制。\n\
    \n在 Intel Volume-3 Chapter 4.3 Figure 4-4 中给出了页表和页目录表的数据结构，PDE 就是页目录表，PTE 就是页表。\n\
    \n![](media/file212.webp \"fig:\")\n\n大部分的操作系统使用的都是 4KB 的页框大小，Linux 0.11 也是，所以我们只看\
    \ 4KB 页大小时的情况即可。\n\n一个由程序员给出的逻辑地址，**要先经过分段机制的转化变成线性地址，再经过分页机制的转化变成物理地址**。\n\n\
    Figure 4-2 给出了线性地址到物理地址，也就是**分页机制**的转化过程。\n\n![](media/file213.webp \"fig:\")\n\
    \n这里的 PDE 就是页目录表，PTE 就是页表，刚刚说过了\n\n在手册接下来的 Table 4-5 和 Table 4-6 中，详细解释了页目录表和页表数据结构各字段的含义。\n\
    \nTable 4-5 是页目录表。\n\n![](media/file214.webp \"fig:\")\n\nTable 4-6 是页表。\n\n![](media/file215.webp\
    \ \"fig:\")\n\n他们几乎都是一样的含义，我们就只看页表就好了，看一些比较重要的位。\n\n**31:12 表示页的起始物理地址**，加上线性地址的后\
    \ 12 位偏移地址，就构成了最终要访问的内存的物理地址，这个就不说了。\n\n**第 0 位是 P**，表示 Present，存在位。\n\n**第 1\
    \ 位是 RW**，表示读写权限，0 表示只读，那么此时往这个页表示的内存范围内写数据，则不允许。\n\n**第 2 位是 US**，表示用户态还是内核态，0\
    \ 表示内核态，那么此时用户态的程序往这个内存范围内写数据，则不允许。\n\n在 Linux 0.11 的 head.s 里，初次为页表设置的值如下。\n\n\
    ```\nsetup_paging:\n   ...\n    movl $pg0+7,_pg_dir     /* set present bit/user\
    \ r/w */\n    movl $pg1+7,_pg_dir+4       /*  --------- \" \" --------- */\n \
    \   movl $pg2+7,_pg_dir+8       /*  --------- \" \" --------- */\n    movl $pg3+7,_pg_dir+12\
    \      /*  --------- \" \" --------- */\n    movl $pg3+4092,%edi\n    movl $0xfff007,%eax\
    \     /*  16Mb - 4096 + 7 (r/w user,p) */\n    std\n1:  stosl\n    ...\n```\n\n\
    后三位是 7，用二进制表示就是 111，即初始设置的 4 个页目录表和 1024 个页表，都是：\n\n**存在（1），可读写（1），用户态（1）**\n\n\
    好了，储备知识就到这里\n\n如果你前面没读懂，你只需要知道，页表当中有一位是表示读\\写的，而 Linux 0.11 初始化时，把它设置为了 1，表示可读写。\n\
    \n### 写时复制的本质\n\n在调用 fork() 生成新进程时，新进程与原进程会共享同一内存区。只有当其中一个进程进行写操作时，系统才会为其另外分配内存页面。\n\
    \n之前在我的[操作系统系列](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499207&idx=1&sn=f00bf7653ae57faa6266bfd18287e6bb&chksm=c2c5876af5b20e7cdf5094696d266ee3fa09514601b021ce602ecaf0ec79857045b43e286a58&scene=21#wechat_redirect)，我给过一个\
    \ Linux 0.11 进程的内存规划图。\n\n![](media/file216.webp \"fig:\")\n\n不过我们考虑写时复制并不用这么复杂，去掉些细节就是。\n\
    \n原来的进程通过自己的页表占用了一定范围的物理内存空间。\n\n![](media/file217.webp \"fig:\")\n\n调用 fork 创建新进程时，原本页表和物理地址空间里的内容，都要进行复制，因为进程的内存空间是要隔离的嘛。\n\
    \n![](media/file218.webp \"fig:\")\n\n但 fork 函数认为，复制物理地址空间里的内容，比较费时，**所以姑且先只复制页表，物理地址空间的内容先不复制**。\n\
    \n![](media/file219.webp \"fig:\")\n\n如果只有读操作，那就完全没有影响，复不复制物理地址空间里的内容就无所谓了，这就很赚。**但如果有写操作，那就不得不把物理地址空间里的值复制一份**，保证进程间的内存隔离。\n\
    \n![](media/file220.webp \"fig:\")\n\n有写操作时，再复制物理内存，就叫**写时复制**。\n\n### 看看代码咋写的\n\
    \n有上述的现象，必然是在 fork 时，对**页表**做了手脚，这回知道为啥储备知识里讲页表结构了吧？\n\n同时，只要有写操作，就会触发写时复制这个逻辑，这是咋做到的呢？答案是通过**中断**，具体是**缺页中断**。\n\
    \n好的，首先来看 fork。\n\nfork 细节很多，具体可以看 [一个新进程的诞生（六）fork 中进程基本信息的复制](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501748&idx=1&sn=2ad618817656321501b2c8e734ffefe6&chksm=c2c5bd19f5b2340f0ae684fa2a2a808a9a5210693736d21019ed542cf5351c3b65b2784d40ee&scene=21#wechat_redirect)\
    \ 和 [一个新进程的诞生（七）透过 fork 来看进程的内存规划](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501866&idx=1&sn=64adec9179345945d095a1a1bdebcdac&chksm=c2c5b287f5b23b9175d8eacf7731b22823a576f78e14d8b93b2e8c9814bcb11076967d878a12&scene=21#wechat_redirect)，这里只看其中关键的复制页表的代码。\n\
    \n```\nint copy_page_tables(...) {\n    ...\n    // 源页表和新页表一样\n    this_page =\
    \ *from_page_table;\n    ...\n    // 源页表和新页表均置为只读\n    this_page &= ~2;\n    *from_page_table\
    \ = this_page;\n    ...\n}\n```\n\n还记得知识储备当中的页表结构吧，就是把 **R/W** 位置 **0** 了。\n\n\
    ![](media/file221.webp \"fig:\")\n\n用刚刚的 fork 图表示就是。\n\n![](media/file222.webp\
    \ \"fig:\")\n\n那么此时，再次对这块物理地址空间进行写操作时，就不允许了。\n\n但不允许并不是真的不允许，Intel 会触发一个**缺页中断**，具体是\
    \ **0x14** 号中断，中断处理程序里边怎么处理，那就由 Linux 源码自由发挥了。\n\nLinux 0.11 的缺页中断处理函数的开头是用汇编写的，看着太闹心了，这里我选\
    \ Linux 1.0 的代码给大家看，逻辑是一样的。\n\n```\n[](#cb191-1)void do_page_fault(..., unsigned\
    \ long error_code) {\n[](#cb191-2)    ... \n[](#cb191-3)    if (error_code & 1)\n\
    [](#cb191-4)        do_wp_page(error_code, address, current, user_esp);\n[](#cb191-5)\
    \    else\n[](#cb191-6)        do_no_page(error_code, address, current, user_esp);\n\
    [](#cb191-7)    ...\n[](#cb191-8)}\n```\n\n可以看出，根据中断异常码 **error_code** 的不同，有不同的逻辑。\n\
    \n那触发缺页中断的异常码都有哪些呢？\n\n在 Intel Volume-3 Chapter 4.7 Figure 4-12 中给出。\n\n![](media/file223.webp\
    \ \"fig:\")\n\n可以看出，当 error_code 的第 0 位，也就是存在位为 0 时，会走 do_no_page 逻辑，其余情况，均走 do_wp_page\
    \ 逻辑。\n\n我们 fork 的时候只是将读写位变成了只读，存在位仍然是 1 没有动，所以会走 **do_wp_page** 逻辑。\n\n```\n\
    [](#cb192-1)void do_wp_page(unsigned long error_code,unsigned long address) {\n\
    [](#cb192-2)    // 后面这一大坨计算了 address 在页表项的指针\n[](#cb192-3)    un_wp_page((unsigned\
    \ long *)\n[](#cb192-4)        (((address>>10) & 0xffc) + (0xfffff000 &\n[](#cb192-5)\
    \        *((unsigned long *) ((address>>20) &0xffc)))));\n[](#cb192-6)}\n[](#cb192-7)\n\
    [](#cb192-8)void un_wp_page(unsigned long * table_entry) {\n[](#cb192-9)    unsigned\
    \ long old_page,new_page;\n[](#cb192-10)    old_page = 0xfffff000 & *table_entry;\n\
    [](#cb192-11)    // 只被引用一次，说明没有被共享，那只改下读写属性就行了\n[](#cb192-12)    if (mem_map[MAP_NR(old_page)]==1)\
