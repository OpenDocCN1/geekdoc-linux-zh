    [](#cb85-8)}\n```\n\n这个方法是串口中断的开启，以及设置对应的中断处理程序，串口在我们现在的 PC 机上已经很少用到了，所以这个直接忽略，要讲我也不懂。\n\
    \n看第二个方法，这是重点。代码非常长，有点吓人，我先把大体框架写出。\n\n```\n[](#cb86-1)void con_init(void) {\n\
    [](#cb86-2)    ...\n[](#cb86-3)    if (ORIG_VIDEO_MODE == 7) {\n[](#cb86-4)  \
    \      ...\n[](#cb86-5)        if ((ORIG_VIDEO_EGA_BX & 0xff) != 0x10) {...}\n\
    [](#cb86-6)        else {...}\n[](#cb86-7)    } else {\n[](#cb86-8)        ...\n\
    [](#cb86-9)        if ((ORIG_VIDEO_EGA_BX & 0xff) != 0x10) {...}\n[](#cb86-10)\
    \        else {...}\n[](#cb86-11)    }\n[](#cb86-12)    ...\n[](#cb86-13)}\n```\n\
    \n可以看出，非常多的 if else。\n\n这是为了应对不同的显示模式，来分配不同的变量值，那如果我们仅仅找出一个显示模式，这些分支就可以只看一个了。\n\
    \n啥是显示模式呢？那我们得简单说说显示，**一个字符是如何显示在屏幕上的呢**？换句话说，如果你可以随意操作内存和 CPU 等设备，你如何操作才能使得你的显示器上，显示一个字符‘a’呢？\n\
    \n我们先看一张图。\n\n![](media/file105.webp \"fig:\")\n\n内存中有这样一部分区域，是和显存映射的。啥意思，就是你往上图的这些内存区域中写数据，相当于写在了显存中。而往显存中写数据，就相当于在屏幕上输出文本了。\n\
    \n没错，就是这么简单。\n\n如果我们写这一行汇编语句。\n\n```\nmov [0xB8000],'h'\n```\n\n后面那个 h 相当于汇编编辑器帮我们转换成\
    \ ASCII 码的二进制数值，当然我们也可以直接写。\n\n```\nmov [0xB8000],0x68\n```\n\n其实就是往内存中 **0xB8000**\
    \ 这个位置写了一个值，只要一写，屏幕上就会是这样。\n\n![](media/file106.webp \"fig:\")\n\n简单吧，具体说来，这片内存是每两个字节表示一个显示在屏幕上的字符，**第一个是字符的编码，第二个是字符的颜色**，那我们先不管颜色，如果多写几个字符就像这样。\n\
    \n```\nmov [0xB8000],'h'\nmov [0xB8002],'e'\nmov [0xB8004],'l'\nmov [0xB8006],'l'\n\
    mov [0xB8008],'o'\n```\n\n此时屏幕上就会是这样。\n\n![](media/file107.webp \"fig:\")\n\n\
    是不是贼简单？那我们回过头看刚刚的代码，我们就假设显示模式是我们现在的这种文本模式，那条件分支就可以去掉好多。\n\n代码可以简化成这个样子。\n\n```\n\
    [](#cb90-1)#define ORIG_X (*(unsigned  char  *)0x90000)\n[](#cb90-2)#define ORIG_Y\
    \ (*(unsigned  char  *)0x90001)\n[](#cb90-3)void con_init(void) {\n[](#cb90-4)\
    \    register unsigned char a;\n[](#cb90-5)    // 第一部分 获取显示模式相关信息\n[](#cb90-6)\
    \    video_num_columns = (((*(unsigned short *)0x90006) & 0xff00) >> 8);\n[](#cb90-7)\
    \    video_size_row = video_num_columns * 2;\n[](#cb90-8)    video_num_lines =\
    \ 25;\n[](#cb90-9)    video_page = (*(unsigned short *)0x90004);\n[](#cb90-10)\
    \    video_erase_char = 0x0720;\n[](#cb90-11)    // 第二部分 显存映射的内存区域 \n[](#cb90-12)\
    \    video_mem_start = 0xb8000;\n[](#cb90-13)    video_port_reg  = 0x3d4;\n[](#cb90-14)\
    \    video_port_val  = 0x3d5;\n[](#cb90-15)    video_mem_end = 0xba000;\n[](#cb90-16)\
    \    // 第三部分 滚动屏幕操作时的信息\n[](#cb90-17)    origin  = video_mem_start;\n[](#cb90-18)\
    \    scr_end = video_mem_start + video_num_lines * video_size_row;\n[](#cb90-19)\
    \    top = 0;\n[](#cb90-20)    bottom  = video_num_lines;\n[](#cb90-21)    //\
    \ 第四部分 定位光标并开启键盘中断\n[](#cb90-22)    gotoxy(ORIG_X, ORIG_Y);\n[](#cb90-23)    set_trap_gate(0x21,&keyboard_interrupt);\n\
    [](#cb90-24)    outb_p(inb_p(0x21)&0xfd,0x21);\n[](#cb90-25)    a=inb_p(0x61);\n\
    [](#cb90-26)    outb_p(a|0x80,0x61);\n[](#cb90-27)    outb(a,0x61);\n[](#cb90-28)}\n\
    ```\n\n别看这么多，一点都不难。\n\n首先还记不记得之前汇编语言的时候做的工作，存了好多以后要用的数据在内存中。就在 [第五回 | 进入保护模式前的最后一次折腾内存](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499558&idx=1&sn=d5d057fae2fb835d38f82804c2649463&chksm=c2c5858bf5b20c9de2db5c31dd34fbe766f6c46cda17f54f4518a75fc1838f2ada6fe5717aad&scene=21#wechat_redirect)\n\
    \n| 内存地址 | 长度(字节) | 名称 |\n\n| --- | --- | --- |\n\n| 0x90000 | 2 | 光标位置 |\n\n\
    | 0x90002 | 2 | 扩展内存数 |\n\n| 0x90004 | 2 | 显示页面 |\n\n| 0x90006 | 1 | 显示模式 |\n\n\
    | 0x90007 | 1 | 字符列数 |\n\n| 0x90008 | 2 | 未知 |\n\n| 0x9000A | 1 | 显示内存 |\n\n|\
    \ 0x9000B | 1 | 显示状态 |\n\n| 0x9000C | 2 | 显卡特性参数 |\n\n| 0x9000E | 1 | 屏幕行数 |\n\
    \n| 0x9000F | 1 | 屏幕列数 |\n\n| 0x90080 | 16 | 硬盘1参数表 |\n\n| 0x90090 | 16 | 硬盘2参数表\
    \ |\n\n| 0x901FC | 2 | 根设备号 |\n\n所以，**第一部分**获取 0x90006 地址处的数据，就是获取显示模式等相关信息。\n\
    \n**第二部分**就是显存映射的内存地址范围，我们现在假设是 CGA 类型的文本模式，所以映射的内存是从 0xB8000 到 0xBA000。\n\n**第三部分**是设置一些滚动屏幕时需要的参数，定义顶行和底行是哪里，这里顶行就是第一行，底行就是最后一行，很合理。\n\
    \n**第四部分**是把光标定位到之前保存的光标位置处（取内存地址 0x90000 处的数据），然后设置并开启键盘中断。\n\n开启键盘中断后，键盘上敲击一个按键后就会触发中断，中断程序就会读键盘码转换成\
    \ ASCII 码，然后写到光标处的内存地址，也就相当于往显存写，于是这个键盘敲击的字符就显示在了屏幕上。\n\n![](media/file108.gif\
    \ \"fig:\")\n\n这一切具体是怎么做到的呢？我们先看看我们干了什么。\n\n**1.** 我们现在根据已有信息已经可以实现往屏幕上的任意位置写字符了，而且还能指定颜色。\n\
    \n**2.** 并且，我们也能接受键盘中断，根据键盘码中断处理程序就可以得知哪个键按下了。\n\n有了这俩功能，那我们想干嘛还不是为所欲为？\n\n好，接下来我们看看代码是怎么处理的，很简单。一切的起点，就是第四步的\
    \ **gotoxy** 函数，定位当前光标。\n\n```\n[](#cb91-1)#define ORIG_X (*(unsigned  char  *)0x90000)\n\
    [](#cb91-2)#define ORIG_Y (*(unsigned  char  *)0x90001)\n[](#cb91-3)void con_init(void)\
    \ {\n[](#cb91-4)    ...\n[](#cb91-5)    // 第四部分 定位光标并开启键盘中断\n[](#cb91-6)    gotoxy(ORIG_X,\
    \ ORIG_Y);\n[](#cb91-7)    ...\n[](#cb91-8)}\n```\n\n这里面干嘛了呢？\n\n```\n[](#cb92-1)static\
    \ inline void gotoxy(unsigned int new_x,unsigned int new_y) {\n[](#cb92-2)   ...\n\
    [](#cb92-3)   x = new_x;\n[](#cb92-4)   y = new_y;\n[](#cb92-5)   pos = origin\
    \ + y*video_size_row + (x<<1);\n[](#cb92-6)}\n```\n\n就是给 **x y pos** 这三个参数附上了值。\n\
    \n其中 **x** 表示光标在哪一列，**y** 表示光标在哪一行，**pos** 表示根据列号和行号计算出来的内存指针，也就是往这个 pos 指向的地址处写数据，就相当于往控制台的\
    \ x 列 y 行处写入字符了，简单吧？\n\n然后，当你按下键盘后，触发键盘中断，之后的程序调用链是这样的。\n\n```\n[](#cb93-1)_keyboard_interrupt:\n\
    [](#cb93-2)    ...\n[](#cb93-3)    call _do_tty_interrupt\n[](#cb93-4)    ...\n\
    [](#cb93-5) \n[](#cb93-6)void do_tty_interrupt(int tty) {\n[](#cb93-7)   copy_to_cooked(tty_table+tty);\n\
    [](#cb93-8)}\n[](#cb93-9)\n[](#cb93-10)void copy_to_cooked(struct tty_struct *\
    \ tty) {\n[](#cb93-11)    ...\n[](#cb93-12)    tty->write(tty);\n[](#cb93-13)\
    \    ...\n[](#cb93-14)}\n[](#cb93-15)\n[](#cb93-16)// 控制台时 tty 的 write 为 con_write\
    \ 函数\n[](#cb93-17)void con_write(struct tty_struct * tty) {\n[](#cb93-18)    ...\n\
    [](#cb93-19)    __asm__(\"movb _attr,%%ah\\n\\t\"\n[](#cb93-20)      \"movw %%ax,%1\\\
    n\\t\"\n[](#cb93-21)      ::\"a\" (c),\"m\" (*(short *)pos)\n[](#cb93-22)    \
    \  :\"ax\");\n[](#cb93-23)     pos += 2;\n[](#cb93-24)     x++;\n[](#cb93-25)\
    \    ...\n[](#cb93-26)}\n```\n\n前面的过程不用管，我们看最后一个函数 con_write 中的关键代码。\n\n**asm**\
    \ 内联汇编，就是把键盘输入的字符 **c** 写入 **pos** 指针指向的内存，相当于往屏幕输出了。\n\n之后两行 pos+=2 和 x++，就是调整所谓的**光标**。\n\
    \n你看，写入一个字符，最底层，**其实就是往内存的某处写个数据，然后顺便调整一下光标**。\n\n由此我们也可以看出，光标的本质，其实就是这里的 x y\
    \ pos 这仨变量而已。\n\n我们还可以做**换行效果**，当发现光标位置处于某一行的结尾时（这个应该很好算吧，我们都知道屏幕上一共有几行几列了），就把光标计算出一个新值，让其处于下一行的开头。\n\
    \n![](media/file109.gif \"fig:\")\n\n就一个小计算公式即可搞定，仍然在 con_write 源码处有体现，就是判断列号\
    \ x 是否大于了总列数。\n\n```\n[](#cb94-1)void con_write(struct tty_struct * tty) {\n[](#cb94-2)\
    \    ...\n[](#cb94-3)    if (x>=video_num_columns) {\n[](#cb94-4)        x -=\
    \ video_num_columns;\n[](#cb94-5)        pos -= video_size_row;\n[](#cb94-6) \
    \       lf();\n[](#cb94-7)  }\n[](#cb94-8)  ...\n[](#cb94-9)}\n[](#cb94-10)\n\
    [](#cb94-11)static void lf(void) {\n[](#cb94-12)   if (y+1<bottom) {\n[](#cb94-13)\
    \      y++;\n[](#cb94-14)      pos += video_size_row;\n[](#cb94-15)      return;\n\
    [](#cb94-16)   }\n[](#cb94-17) ...\n[](#cb94-18)}\n```\n\n相似的，我们还可以实现**滚屏**的效果，无非就是当检测到光标已经出现在最后一行最后一列了，那就把每一行的字符，都复制到它上一行，其实就是算好哪些内存地址上的值，拷贝到哪些内存地址，就好了。\n\
    \n这里大家自己看源码寻找。\n\n所以，有了这个初始化工作，我们就可以利用这些信息，弄几个小算法，实现各种我们常见控制台的操作。\n\n或者换句话说，我们见惯不怪的控制台，**回车**、**换行**、**删除**、**滚屏**、**清屏**等操作，其实底层都要实现相应的代码的。\n\
    \n所以 console.c 中的其他方法就是做这个事的，我们就不展开每一个功能的方法体了，简单看看有哪些方法。\n\n```\n[](#cb95-1)//\
    \ 定位光标的\n[](#cb95-2)static inline void gotoxy(unsigned int new_x, unsigned int\
    \ new_y){}\n[](#cb95-3)// 滚屏，即内容向上滚动一行\n[](#cb95-4)static void scrup(void){}\n\
    [](#cb95-5)// 光标同列位置下移一行\n[](#cb95-6)static void lf(int currcons){}\n[](#cb95-7)//\
    \ 光标回到第一列\n[](#cb95-8)static void cr(void){}\n[](#cb95-9)...\n[](#cb95-10)// 删除一行\n\
    [](#cb95-11)static void delete_line(void){}\n```\n\n内容繁多，但没什么难度，只要理解了基本原理即可了。\n\
    \nOK，整个 **console.c** 就讲完了，要知道这个文件可是整个内核中代码量最大的文件，可是功能特别单一，也都很简单，主要是处理键盘各种不同的按键，需要写好多\
    \ switch case 等语句，十分麻烦，我们这里就完全没必要去展开了，就是个苦力活。\n\n到这里，我们就正式讲完了 **tty_init** 的作用。\n\
    \n在此之后，内核代码就可以用它来方便地在控制台输出字符啦！这在之后内核想要在启动过程中告诉用户一些信息，以及后面内核完全建立起来之后，由用户用 shell\
    \ 进行操作时手动输入命令，都是可以用到这里的代码的！\n\n让我们继续向前进发，看下一个被初始化的倒霉鬼是什么东东。\n\n欲知后事如何，且听下回分解。\n\
    \n* * *\n\n## 第17回 时间初始化 time_init\n\n> 原文链接: [https://mp.weixin.qq.com/s/y26MMfj8pP5PmbKDZBT5-A](https://mp.weixin.qq.com/s/y26MMfj8pP5PmbKDZBT5-A)\n\
    \n书接上回，上回书咱们说到，通过初始化控制台的 tty_init 操作，内核代码可以很方便地在控制台输出字符啦！\n\n作为用户也可以通过敲击键盘，或调用诸如\
