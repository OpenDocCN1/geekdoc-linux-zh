    那其实搞清楚两个事情即可：


    **第一，硬盘中的文件系统格式是怎样的？**


    **第二，内存中用于文件系统的数据结构有哪些？**


    我们一个个来。


    ### 硬盘中的文件系统格式是怎样的


    首先硬盘中的文件系统，无非就是硬盘中的一堆数据，我们按照一定格式去解析罢了。Linux-0.11 中的文件系统是 **MINIX** 文件系统，它就长成这个样子。


    ![](media/file233.webp "fig:")


    每一个块结构的大小是 1024 字节，也就是 1KB，硬盘里的数据就按照这个结构，妥善地安排在硬盘里。


    可是硬盘中凭什么就有了这些信息呢？这就是个鸡生蛋蛋生鸡的问题了。你可以先写一个操作系统，然后给一个硬盘做某种文件系统类型的格式化，这样你就得到一个有文件系统的硬盘了，有了这个硬盘，你的操作系统就可以成功启动了。


    总之，想个办法给这个硬盘写上数据呗。


    好了，现在我们简单看看 MINIX 文件系统的格式。


    **引导块**就是我们系列最开头说的启动区，当然不一定所有的硬盘都有启动区，但我们还是得预留出这个位置，以保持格式的统一。


    **超级块**用于描述整个文件系统的整体信息，我们看它的字段就知道了，有后面的 inode 数量，块数量，第一个块在哪里等信息。有了它，整个硬盘的布局就清晰了。


    **inode 位图和块位图**，就是位图的基本操作和作用了，表示后面 inode 和块的使用情况，和我们之前讲的内存占用位图 mem_map[] 是类似的。


    再往后，**inode** 存放着每个文件或目录的元信息和索引信息，元信息就是文件类型、文件大小、修改时间等，索引信息就是大小为 9 的 i_zone[9]
    块数组，表示这个文件或目录的具体数据占用了哪些块。


    其中块数组里，0~6 表示直接索引，7 表示一次间接索引，8 表示二次间接索引。当文件比较小时，比如只占用 2 个块就够了，那就只需要 zone[0] 和
    zone[1] 两个直接索引即可。


    ![](media/file234.webp "fig:")


    再往后，就都是存放具体文件或目录实际信息的**块**了。如果是一个普通文件类型的 inode 指向的块，那里面就直接是文件的二进制信息。如果是一个目录类型的
    inode 指向的块，那里面存放的就是这个目录下的文件和目录的 inode 索引以及文件或目录名称等信息。


    好了，文件系统格式的说明，我们就简单说明完毕了，MINIX 文件系统已经过时，你可以阅读我之前写的 [图解 | 你管这破玩意叫文件系统？](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247494176&idx=1&sn=b4680b50090bb3c7b9c49379241c536c&chksm=c2c5908df5b2199b361885b32b07ab0f597ab25cd1d70bb75ca13fb897c200285685318f145f&scene=21#wechat_redirect)来全面了解一个
    ext2 文件系统的来龙去脉，基本思想都是一样的。


    ### 内存中用于文件系统的数据结构有哪些


    赶紧回过头来看我们的代码，是如何加载以这样一种格式存放在硬盘里的数据，以被我们操作系统所管控的。


    从头看。


    ```

    [](#cb208-1)struct file {

    [](#cb208-2)    unsigned short f_mode;

    [](#cb208-3)    unsigned short f_flags;

    [](#cb208-4)    unsigned short f_count;

    [](#cb208-5)    struct m_inode * f_inode;

    [](#cb208-6)    off_t f_pos;

    [](#cb208-7)};

    [](#cb208-8)

    [](#cb208-9)void mount_root(void) {

    [](#cb208-10)    for(i=0;i<64;i++)

    [](#cb208-11)        file_table[i].f_count=0;

    [](#cb208-12)    ...

    [](#cb208-13)}

    ```


    把 64 个 **file_table** 里的 f_count 清零。


    **这个 file_table 表示进程所使用的文件**，进程每使用一个文件，都需要记录在这里，包括文件类型、文件 inode 索引信息等，而这个 f_count
    表示被引用的次数，此时还没有引用，所以设置为零。


    而这个 file_table 的索引（当然准确说是进程的filp索引才是），就是我们通常说的文件描述符。比如有如下命令。


    ```

    [](#cb209-1)echo "hello" > 0

    ```


    就表示把 hello 输出到 0 号文件描述符。


    0 号文件描述符是哪个文件呢？就是 file_table[0] 所表示的文件。


    这个文件在哪里呢？注意到 file 结构里有个 f_inode 字段，通过 f_inode 即可找到它的 inode 信息，inode 信息包含了一个文件所需要的全部信息，包括文件的大小、文件的类型、文件所在的硬盘块号，这个所在硬盘块号，就是文件的位置咯。


    接着看。


    ```

    [](#cb210-1)struct super_block super_block[8];

    [](#cb210-2)void mount_root(void) {

    [](#cb210-3)    ...

    [](#cb210-4)    struct super_block * p;

    [](#cb210-5)    for(p = &super_block[0] ; p < &super_block[8] ; p++) {

    [](#cb210-6)        p->s_dev = 0;

    [](#cb210-7)        p->s_lock = 0;

    [](#cb210-8)        p->s_wait = NULL;

    [](#cb210-9)    }

    [](#cb210-10)    ...

    [](#cb210-11)}

    ```


    又是把一个数组 **super_block** 做清零工作。


    这个 super_block 存在的意义是，操作系统与一个设备以文件形式进行读写访问时，就需要把这个设备的超级块信息放在这里。


    ![](media/file235.webp "fig:")


    这样通过这个超级块，就可以掌控这个设备的文件系统全局了。


    果然，接下来的操作，就是读取硬盘的超级块信息到内存中来。


    ```

    [](#cb211-1)void mount_root(void) {

    [](#cb211-2)    ...

    [](#cb211-3)    p=read_super(0);

    [](#cb211-4)    ...

    [](#cb211-5)}

    ```


    read_super 就是读取硬盘中的超级块。


    接下来，读取根 inode 信息。


    ```

    [](#cb212-1)struct m_inode * mi;

    [](#cb212-2)void mount_root(void) {

    [](#cb212-3)    ...

    [](#cb212-4)    mi=iget(0,1);

    [](#cb212-5)    ...

    [](#cb212-6)}

    ```


    然后把该 inode 设置为当前进程（也就是进程 1）的当前工作目录和根目录。


    ```

    [](#cb213-1)void mount_root(void) {

    [](#cb213-2)    ...

    [](#cb213-3)    current->pwd = mi;

    [](#cb213-4)    current->root = mi;

    [](#cb213-5)    ...

    [](#cb213-6)}

    ```


    然后记录块位图信息。


    ```

    [](#cb214-1)void mount_root(void) {

    [](#cb214-2)    ...

    [](#cb214-3)    i=p->s_nzones;

    [](#cb214-4)    while (-- i >= 0)

    [](#cb214-5)        set_bit(i&8191, p->s_zmap[i>>13]->b_data);

    [](#cb214-6)    ...

    [](#cb214-7)}

    ```


    最后记录 inode 位图信息。


    ```

    [](#cb215-1)void mount_root(void) {

    [](#cb215-2)    ...

    [](#cb215-3)    i=p->s_ninodes+1;

    [](#cb215-4)    while (-- i >= 0)

    [](#cb215-5)        set_bit(i&8191, p->s_imap[i>>13]->b_data);

    [](#cb215-6)}

    ```


    就完事了。


    其实整体上就是把硬盘中文件系统的各个信息，搬到内存中。之前的图可以说非常直观了。


    ![](media/file236.webp "fig:")


    有了内存中的这些结构，我们就可以顺着根 inode，找到所有的文件了。


    至此，加载根文件系统的 **mount_root** 函数就全部结束了。同时，让我们回到全局视野，发现 **setup** 函数也一并结束了。


    ```

    [](#cb216-1)void main(void) {

    [](#cb216-2)    ...

    [](#cb216-3)    move_to_user_mode();

    [](#cb216-4)    if (!fork()) {

    [](#cb216-5)        init();

    [](#cb216-6)    }

    [](#cb216-7)    for(;;) pause();

    [](#cb216-8)}

    [](#cb216-9)

    [](#cb216-10)void init(void) {

    [](#cb216-11)    setup((void *) &drive_info);

    [](#cb216-12)    ...

    [](#cb216-13)}

    [](#cb216-14)

    [](#cb216-15)int sys_setup(void * BIOS) {

    [](#cb216-16)    ...

    [](#cb216-17)    mount_root();

    [](#cb216-18)}

    ```


    setup 的主要工作就是我们今天所讲的，**加载根文件系统**。


    我们继续往下看 init 函数。


    ```

    [](#cb217-1)void init(void) {

    [](#cb217-2)    setup((void *) &drive_info);

    [](#cb217-3)    (void) open("/dev/tty0",O_RDWR,0);

    [](#cb217-4)    (void) dup(0);

    [](#cb217-5)    (void) dup(0);

    [](#cb217-6)}

    ```


    看到这相信你也明白了。


    之前 setup 函数的一番折腾，加载了根文件系统，顺着根 inode 可以找到所有文件，就是为了下一行 open 函数可以通过文件路径，从硬盘中把一个文件的信息方便地拿到。


    在这里，我们 open 了一个 **/dev/tty0** 的文件，那我们接下来的焦点就在这个 /dev/tty0 是个啥？


    欲知后事如何，且听下回分解。


    * * *


    ## 第33回 | 打开终端设备文件


    > 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502230&idx=1&sn=44e023bf0b9b37261e35a6e3722bc57f&chksm=c2c5b33bf5b23a2d10a9dd36606c497f41a1c3dced57845ce7ef12741a348fab82beba462a8a&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502230&idx=1&sn=44e023bf0b9b37261e35a6e3722bc57f&chksm=c2c5b33bf5b23a2d10a9dd36606c497f41a1c3dced57845ce7ef12741a348fab82beba462a8a&scene=21#wechat_redirect)


    书接上回，上回书咱们说到， setup 函数的一番折腾，加载了根文件系统，顺着根 inode 可以找到所有文件，为后续工作奠定了基础。


    ![](media/file237.webp "fig:")


    而有了这个功能后，下一行 open 函数可以通过文件路径，从硬盘中把一个文件的信息方便地拿到。


    ```

    [](#cb218-1)void init(void) {

    [](#cb218-2)    setup((void *) &drive_info);

    [](#cb218-3)    (void) open("/dev/tty0",O_RDWR,0);

    [](#cb218-4)    (void) dup(0);

    [](#cb218-5)    (void) dup(0);

    [](#cb218-6)}

    ```'
  toc: []
  trans: "\n\n# File System Loading and Structure Parsing\n\nContinuing from the last\
    \ session, we mentioned that after all the hustle in the `setup` function, the\
    \ root file system is loaded, allowing us to find all files through the root `inode`,\
    \ laying the foundation for subsequent work.\n\n## The Role of the `setup` function\n\
    \nThe things inside the `setup` method are the first methods executed by process\
    \ `0`.\n\n```c\nint setup(void *) {\n    ...\n    mount_root();\n}\n```\n\n##\
    \ Details of the `mount_root` function\n\n`mount_root` literally translates to\
    \ \"loading the root.\" In other words, it loads the file system. With it, the\
    \ operating system can find files stored on the disk starting from the root. It\
    \ is the cornerstone of the file system and is very important.\n\nLet's take a\
    \ look at the specific implementation of `mount_root`:\n\n```c\nvoid mount_root(void)\
    \ {\n    int i, free;\n    struct super_block *p;\n    struct m_inode *mi;\n \
    \   for (i = 0; i < 64; i++) {\n        file_table[i].f_count = 0;\n    }\n  \
    \  for (p = &super_block[0]; p < &super_block[8]; p++) {\n        p->s_dev = 0;\n\
    \        p->s_lock = 0;\n        p->s_wait = NULL;\n    }\n    p = read_super(0);\n\
    \    mi = iget(0, 1);\n    mi->i_count += 3;\n    p->s_imount = mi;\n    current->pwd\
    \ = mi;\n    current->root = mi;\n    free = 0;\n    i = p->s_nzones;\n    while\
    \ (--i >= 0) {\n        if (!set_bit(i & 8191, p->s_zmap[i >> 13]->b_data)) {\n\
    \            free++;\n        }\n    }\n    free = 0;\n    i = p->s_ninodes +\
    \ 1;\n    while (--i >= 0) {\n        if (!set_bit(i & 8191, p->s_imap[i >> 13]->b_data))\
    \ {\n            free++;\n        }\n    }\n}\n```\n\nIt's simple. Overall, it\
    \ interprets the data on the disk into the file system format and loads it into\
    \ the data structures designed in memory. This way, the operating system can access\
    \ individual files on the disk via the file system method using the data in memory.\n\
    \n![fig]\n\nActually, you only need to understand two things:\n1. What is the\
    \ format of the file system on the disk?\n2. What data structures are used for\
    \ the file system in memory?\n\n## File System Format on Disk\n\nFirst, the file\
    \ system on the disk is simply a collection of data on the disk, which we parse\
    \ according to a certain format. The file system in Linux is the `MINIX` file\
    \ system, and it looks like this.\n\n![fig]\n\nThe size of each block structure\
    \ is 1024 bytes, which is `1KB`. The data on the disk is properly arranged according\
    \ to this structure.\n\nBut why is this information present on the disk? This\
    \ is a \"chicken and egg\" problem. You can write an operating system first, then\
    \ format a disk with a certain type of file system; that way, you get a disk with\
    \ a file system. With this disk, your operating system can boot successfully.\
    \ In short, just find a way to write data to this disk.\n\n## MINIX File System\
    \ Format Description\n\nNow, let's take a quick look at the format of the `MINIX`\
    \ file system.\n\n- **Boot Block**: The boot area mentioned at the very beginning\
    \ of our series. Of course, not all disks have a boot area, but we still must\
    \ reserve this position to maintain consistency in the format.\n- **Superblock**:\
    \ Used to describe the overall information of the entire file system. Looking\
    \ at its fields, it contains information such as the number of subsequent `inodes`,\
    \ number of blocks, where the first block is located, etc. With it, the layout\
    \ of the entire disk becomes clear.\n- **Inode Bitmap and Block Bitmap**: The\
    \ basic operations and functions of bitmaps represent the usage of `inodes` and\
    \ blocks later, which is similar to the memory usage bitmap `mem_map[]` we discussed\
    \ before.\n- **inode**: Further along, `inode` stores the metadata and index information\
    \ for each file or directory. Metadata includes file type, file size, modification\
    \ time, etc.; index information is the `i_zone[9]` block array of size 9, representing\
    \ which blocks the specific data of this file or directory occupies.\n\nAmong\
    \ the block array, `0~6` represents direct indexing, `7` represents single indirect\
    \ indexing, and `8` represents double indirect indexing. When a file is small,\
    \ for example, if it only occupies 2 blocks, only `zone[0]` and `zone[1]` direct\
    \ indexes are needed.\n\n![fig]\n\nFurther back are the **blocks** that store\
    \ the actual information of specific files or directories. If an `inode` of a\
    \ normal file type points to a block, it contains binary information; if an `inode`\
    \ of a directory type points to a block, it stores indices of files and directories\
    \ under that directory, as well as file names.\n\n## Data Structures of File System\
    \ in Memory\n\nThe basic idea for fully understanding the context of an `ext`\
    \ file system is the same. Start from the code to see how this formatted data\
    \ on disk is loaded.\n\n```c\nstruct file {\n    unsigned short f_mode;\n    unsigned\
    \ short f_flags;\n    unsigned short f_count;\n    struct m_inode *f_inode;\n\
    \    off_t f_pos;\n};\n\nvoid mount_root(void) {\n    for (i = 0; i < 64; i++)\
    \ {\n        file_table[i].f_count = 0;\n    }\n}\n```\n\nThe `64` entries in\
    \ `file_table` have `f_count` set to 0.\n\n`file_table` refers to the file used\
    \ by the process. `f_count` is the number of times the file is referenced. The\
    \ `inode` field in the `file_table` finds the `inode` information. `inode` information\
    \ includes as follows:\n\n```bash\necho \"hello\" > 0\n```\n\nThe `0` file descriptor\
    \ is which file. Where is the `inode`? The `inode` information includes the file\
    \ type, size, and block number.\n\n```c\nstruct super_block[8];\nvoid mount_root(void)\
    \ {\n    ...\n    struct super_block *p;\n    for (p = &super_block[0]; p < &super_block[8];\
    \ p++) {\n        p->s_dev = 0;\n        p->s_lock = 0;\n        p->s_wait = NULL;\n\
    \    }\n    ...\n}\n```\n\nAnother `super_block` array for clearing. The significance\
    \ of `super_block` is that when the operating system reads/writes the device as\
    \ files, it needs the device's superblock here.\n\n![fig]\n\nThrough this superblock,\
    \ one can control the global file system of the device. The next operation is\
    \ to read the disk's superblock information into memory.\n\n```c\nvoid mount_root(void)\
    \ {\n    ...\n    p = read_super(0);\n    ...\n}\n```\n\n`read_super` reads the\
    \ superblock on the disk. Next, read the `inode` information.\n\n```c\nstruct\
    \ m_inode * mi;\nvoid mount_root(void) {\n    ...\n    mi = iget(0, 1);\n    ...\n\
    }\n```\n\nThen set this `inode` as the current process's (which is process `1`)\
    \ working directory and root directory.\n\n```c\nvoid mount_root(void) {\n   \
    \ ...\n    current->pwd = mi;\n    current->root = mi;\n    ...\n}\n```\n\nRecord\
    \ the block bitmap information:\n\n```c\nvoid mount_root(void) {\n    ...\n  \
    \  i = p->s_nzones;\n    while (--i >= 0)\n        set_bit(i & 8191, p->s_zmap[i\
    \ >> 13]->b_data);\n    ...\n}\n```\n\nFinally, record the `inode` bitmap information:\n\
    \n```c\nvoid mount_root(void) {\n    ...\n    i = p->s_ninodes + 1;\n    while\
    \ (--i >= 0)\n        set_bit(i & 8191, p->s_imap[i >> 13]->b_data);\n}\n```\n\
    \n"
- fmt: "\n那我们接下来的焦点就在这个 `open` 函数，以及它要打开的文件 `/dev/tty0`，还有后面的两个 `dup`。\n\n`open` 函数会触发\
    \ `0x80` 中断，最终调用到 `sys_open` 这个系统调用函数，相信你已经很熟悉了。\n\n```c\nstruct file_table[64]\
    \ = {0};\n\nint sys_open(const char * filename,int flag,int mode) {\n    struct\
    \ m_inode * inode;\n    struct file * f;\n    int i,fd;\n    mode &= 0777 & ~current->umask;\n\
    \n    for(fd=0 ; fd<20; fd++)\n        if (!current->filp[fd])\n            break;\n\
    \    if (fd>=20)\n        return -EINVAL;\n    current->close_on_exec &= ~(1<<fd);\n\
    \n    f=0+file_table;\n    for (i=0 ; i<64 ; i++,f++)\n        if (!f->f_count)\
    \ break;\n    if (i>=64)\n        return -EINVAL;\n\n    (current->filp[fd]=f)->f_count++;\n\
    \n    i = open_namei(filename,flag,mode,&inode);\n\n    if (S_ISCHR(inode->i_mode))\n\
    \        if (MAJOR(inode->i_zone[0])==4) {\n            if (current->leader &&\
    \ current->tty<0) {\n                current->tty = MINOR(inode->i_zone[0]);\n\
    \                tty_table[current->tty].pgrp = current->pgrp;\n            }\n\
    \        } else if (MAJOR(inode->i_zone[0])==5)\n            if (current->tty<0)\
    \ {\n                iput(inode);\n                current->filp[fd]=NULL;\n \
    \               f->f_count=0;\n                return -EPERM;\n            }\n\
    \    if (S_ISBLK(inode->i_mode))\n        check_disk_change(inode->i_zone[0]);\n\
    \n    f->f_mode = inode->i_mode;\n    f->f_flags = flag;\n    f->f_count = 1;\n\
    \    f->f_inode = inode;\n    f->f_pos = 0;\n    return (fd);\n}\n```\n\n这么大一坨别怕，我们慢慢来分析，我先用一张图来描述这一大坨代码的作用。\n\
    \n![](media/file238.webp \"fig:\")\n\n### 第一步，在进程文件描述符数组 `filp` 中找到一个空闲项\n\n还记得进程的\
    \ `task_struct` 结构吧，其中有一个 `filp` 数组的字段，就是我们常说的文件描述符数组，这里先找到一个空闲项，将空闲地方的索引值即为 `fd`。\n\
    \n```c\nint sys_open(const char * filename,int flag,int mode) {\n    ...\n   \
    \ for(int fd=0 ; fd<20; fd++)\n        if (!current->filp[fd])\n            break;\n\
    \    if (fd>=20)\n        return -EINVAL;\n    ...\n}\n```\n由于此时当前进程（进程 1）还没有打开过文件，所以\
    \ 0 号索引处空闲的，`fd` 自然等于 0。\n\n### 第二步，在系统文件表 `file_table` 中找到一个空闲项\n\n一样的玩法。\n\n\
    ```c\nint sys_open(const char * filename,int flag,int mode) {\n    int i;\n  \
    \  ...\n    struct file * f=0+file_table;\n    for (i=0 ; i<64; i++)\n       \
    \ if (!f->f_count) break;\n    if (i>=64)\n        return -EINVAL;\n    ...\n\
    }\n```\n注意到，进程的 `filp` 数组大小是 20，系统的 `file_table` 大 64，可以得出进程最多打开 20 个文件，整个系统最多打开\
