    \ 0.11 是启动不起来的在 `open` 的时候就会报错。第二，我们只将 `/bin/sh` 文件的头部加载到了内存，其他部分并没有加载，那接下来跳转到一个并没有加载\
    \ `/bin/sh` 代码的内存时，会发生什么？\n\n带着这两个疑问，期待后续的章节吧！\n\n***\n\n## 第 36 回 | 缺页中断\n\n\
