  trans: "\n\n想起来了吧？而且我们在 [第 13 回 | 主内存初始化 mem_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500089&idx=1&sn=9a3fd6e585b0fd1ec528599ead6677c6&scene=21#wechat_redirect)\
    \ 中，用 `mem_init` 设置好了主内存的管理结构 `mem_map`。\n\n![](img/file127.webp \"fig:\")\n\n\
    再想不起来那就需要把前面的章节再读一读咯，不然后面越来越难。\n\n前面是把主内存区管理起来了，所以今天就是把剩下的缓冲区部分也初始化管理起来。目的就是这么单纯，我们看代码。\n\
    \n我们还是采用之前的方式，就假设内存只有 8M，把一些不相干的分支去掉，方便理解。\n\n```\nextern int end;\nstruct buffer_head\
    \ * start_buffer = (struct buffer_head *) &end;\n\nvoid buffer_init(long buffer_end)\
    \ {\n    struct buffer_head * h = start_buffer;\n    void * b = (void *) buffer_end;\n\
    \    while ( (b -= 1024) >= ((void *) (h+1)) ) {\n        h->b_dev = 0;\n    \
    \    h->b_dirt = 0;\n        h->b_count = 0;\n        h->b_lock = 0;\n       \
    \ h->b_uptodate = 0;\n        h->b_wait = NULL;\n        h->b_next = NULL;\n \
    \       h->b_prev = NULL;\n        h->b_data = (char *) b;\n        h->b_prev_free\
    \ = h-1;\n        h->b_next_free = h+1;\n        h++;\n    }\n    h--;\n    free_list\
    \ = start_buffer;\n    free_list->b_prev_free = h;\n    h->b_next_free = free_list;\n\
    \    for (int i=0;i<307;i++)\n        hash_table[i]=NULL;\n}\n```\n\n虽然很长，但其实就造了两个数据结构而已。\n\
    \n不过别急，我们先看这一行代码。\n\n```\nextern int end;\nvoid buffer_init(long buffer_end) {\n\
    \    struct buffer_head * start_buffer = (struct buffer_head *) &end;\n    ...\n\
    }\n```\n\n这里有个外部变量 `end`，而我们的缓冲区开始位置 `start_buffer` 就等于这个变量的内存地址。\n\n这个外部变量 `end`\
    \ 并不是操作系统代码写就的，而是由链接器 `ld` 在链接整个程序时设置的一个外部变量，帮我们计算好了整个内核代码的末尾地址。\n\n那在这之前的是内核代码区域肯定不能用，在这之后的，就给\
    \ buffer 用了。所以我们的内存分布图可以更精确一点了。\n\n![](img/file128.webp \"fig:\")\n\n你看，之前的疑惑解决了吧？很好理解嘛，内核程序和缓冲区的划分肯定有个分界线，这个分界线就是\
    \ `end` 变量的值。\n\n这个值定多少合适呢？\n\n像主内存和缓冲区的分界线，就直接代码里写死了，就是上图中的 2M。\n\n可是内核程序占多大内存在写的时候完全不知道，就算知道了如果改动一点代码也会变化，所以就由程序编译链接时由链接器程序帮我们把这个内核代码末端的地址计算出来，作为一个外部变量\
    \ `end` 我们拿来即用，就方便多了。\n\n好，回过头我们再看看，整段代码创造了哪两个管理结构？\n\n我们先看这段结构。\n\n```\nvoid\
    \ buffer_init(long buffer_end) {\n    struct buffer_head * h = start_buffer;\n\
    \    void * b = (void *) buffer_end;\n    while ( (b -= 1024) >= ((void *) (h+1))\
    \ ) {\n        ...\n        h->b_data = (char *) b;\n        h->b_prev_free =\
    \ h-1;\n        h->b_next_free = h+1;\n        h++;\n    }\n    ...\n}\n```\n\n\
    就俩变量。一个是 `buffer_head` 结构的 `h`，代表缓冲头，其指针值是 `start_buffer`，刚刚我们计算过了，就是图中的内核代码末端\
    \ `end`，也就是缓冲区开头。\n\n一个是 `b`，代表缓冲块，指针值是 `buffer_end`，也就是图中的 2M，就是缓冲区结尾。\n\n缓冲区结尾的\
    \ `b` 每次循环 -1024，缓冲区结尾的 `h` 每次循环 +1（一个 `buffer_head` 大小的内存），直到一块为止。\n\n![](img/file129.webp\
    \ \"fig:\")\n\n可以看到，其实这个 `b` 代表缓冲块，`h` 代表缓冲头，一个从上，一个从下。在这个过程中 `h` 被附上了属性，其中比较关键的是\
    \ `buffer` 所表示的数据 `b_data`，指向了上面的缓冲块。\n\n还有这个 `buffer` 的前后指针 `b_prev_free` 和 `b_next_free`。\n\
    \n那画成图如下。\n\n![](img/file130.webp \"fig:\")\n\n当缓冲头 `h` 的所有 `next` 和 `prev` 指针都指向此时，就构成了一个双向链表。继续看。\n\
    \n```\nvoid buffer_init(long buffer_end) {\n    struct buffer_head * h = start_buffer;\n\
    \    void * b = (void *) buffer_end;\n    while ( (b -= 1024) >= ((void *) (h+1))\
    \ ) {\n        ...\n        h->b_data = (char *) b;\n        h->b_prev_free =\
    \ h-1;\n        h->b_next_free = h+1;\n    }\n    h->b_next_free = free_list;\n\
    \    ...\n}\n```\n\n这三行代码结合刚刚的双向链表 `h`，画出图你就懂了。\n\n![](img/file131.webp \"fig:\"\
    )\n\n`free_list` 指向了缓冲头双向链表的第一个结构，就可以顺着这个结构，从双向表中遍历到任何一个缓冲头，而通过缓冲头找到对应的缓冲块。\n\n\
    简单说，缓冲头就是缓冲块的管理结构，`free_list` 开头的双向链表又是缓冲头的管理结构，整个管理体系建立起来了。现在，从 `free_list` 开始遍历，就可以找到这里的所有内容。\n\
    \n不过，还有最后一个事，能帮助更好管理，往下看。\n\n```\nvoid buffer_init(long buffer_end) {\n    ...\n\
    \    for (i=0;i<307;i++)\n        hash_table[i]=NULL;\n}\n```\n\n一个 307 大小的 `hash_table`\
    \ 数组，这是干嘛的？其实今天的代码在 `buffer.c` 中，而 `buffer.c` 是 `fs` 包下的，也就是文件系统下的。所以它以后为文件系统服务，内核程序如果访问块设备的数据，都需要经过缓冲区。\n\
    \n那怎么知道缓冲区已经有了要的块设备数据呢？从双向链表从头遍历可以，但是效率太低了。所以需要一个 hashmap 的结构方便查找，这就是 `hash_table`\
    \ 的的作用。\n\n```\n#define _hashfn(dev,block) (((unsigned)(dev^block))%307)\n#define\
    \ hash(dev,block) hash_table[_hashfn(dev,block)]\n\n// 搜索合适的缓冲块\nstruct buffer_head\
    \ * getblk(int dev, int block) {\n    ...\n    struct buffer_head * bh = get_hash_table(dev,block);\n\
    \    ...\n}\n\nstruct buffer_head * get_hash_table(int dev, int block) {\n   \
    \ ...\n    find_buffer(dev,block);\n    ...\n}\nstatic buffer_head * find_buffer(int\
    \ dev, int block) {\n    ...\n    hash(dev,block);\n    ...\n}\n```\n\n一路下来发现，就是通过\
    \ `dev^block % 307`（设备号^块号）找到 `hash_table` 里的下标。接下来和 Java 里的 `HashMap` 类似，如果哈希冲突形成链表，画成图就是这样。\n\
    \n![](img/file132.webp \"fig:\")\n\n哈希表 + 双向链表，如果算法多了，很容易实现 LRU 算法，之后的缓冲区使用正是这个算法发挥的作用。也就是之后在文件系统读取硬盘时，都需要使用缓冲区里的内容，缓冲区是用户进程内存和硬盘之间的桥梁。\n\
    \n好了，再多说几句文件系统读操作压力太大，本章主要就了解这个缓冲区的管理工作是如何化的，为后面做垫。回过头来看看目前的进度吧！\n\n```\nvoid\
    \ main(void) {\n    ...\n    mem_init(main_memory_start,memory_end);\n    trap_init();\n\
    \    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n    time_init();\n\
    \    sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n\
    \    sti();\n    move_to_user_mode();\n    if (!fork()) {init();}\n    for(;;)\
    \ pause();\n}\n```\n\n整个化的部分，就差 `hd_init` 和 `floppy_init` 这两个块初始化还没讲。\n\n而且幸运的是，`floppy_init`\
    \ 是软盘初始化，现在软盘几乎都被淘汰了，计算机中也没有软盘驱动器，所以这个完全可以不看，那就剩下一个 `hd_init` 硬盘初始化，非常简单！\n\n\
    还记得小时候特别收集软盘，里面分门别类存上我做的 Flash 动画，然后在软盘上的那个纸标签写上文字，表示软盘存了什么，想想看还是回忆呢。扯远了。\n\n\
    之前的初始化工作建立的数据结构，会在后面模块发挥最核心的作用，任何操作都离不开这些初始化工作建立的数据结构，一定要把这些根搭建好，别急慌。等初始化工作全部完成，我会专门用一回梳理一下，大家就尽可能把初始化大部分的数据结构记在心里吧！\n\
    \n## 第 20 回 硬盘初始化 hd_init\n\n> 原文链接: [`mp.weixin.qq.com/s/803C9jHxe42i9zEvPA`](https://mp.weixin.qq.com/s/803C9jHxe42i9zEvPA)\n\
    \n接上回，上回咱们说到，`buffer_init` 完成了缓冲区初始化工作，内存中的缓冲区部分变成了这个样子。\n\n![](img/file133.webp\
    \ \"fig:\")\n\n而所有的缓冲头又被一个 `hash_table` 管理起来，以便查找。\n\n![](img/file134.webp \"\
    fig:\")\n\n至于缓冲区的这种管理怎么用，那等到后面文件系统中，如何读取一个块设备的数据，再展开讲解。\n\n今天，我们看 main 函数中最后两个初始化函数！\n\
    \n```c\nvoid main(void) {\n    ...\n    mem_init(main_memory_start,memory_end);\n\
    \    trap_init();\n    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n\
    \    time_init();\n    sched_init();\n    buffer_init(buffer_memory_end);\n  \
    \  hd_init(); //本文重点\n    floppy_init();\n    sti();\n    move_to_user_mode();\n\
    \    if (!fork()) {init();}\n    for(;;) pause();\n}\n```\n\n"
- fmt: "\n```c\n//struct blk_dev_struct {\n//    void (*request_fn)(void);\n//   \
    \ struct request * current_request;\n//};\nextern struct blk_dev_struct blk_dev[NR_BLK_DEV];\n\
    \nvoid hd_init(void) {\n    blk_dev[3].request_fn = do_hd_request;\n    set_intr_gate(0x2E,&hd_interrupt);\n\
    \    outb_p(inb_p(0x21)&0xfb,0x21);\n    outb(inb_p(0xA1)&0xbf,0xA1); \n}\n```\n\
    \n就这？一共就四行代码。\n\n没错，初始化嘛，往往都比较简单，尤其是对硬件设备的初始化，大体都是：\n\n1. 往某些 IO 端口上读写一些数据，表示开启它；\n\
    2. 然后再向中断向量表中添加一个中断，使得 CPU 能够响应这个硬件设备的动作；\n3. 最后再初始化一些数据结构来管理。不过像是内存管理可能结构复杂些，外设的管理，相对就简单很多了。\n\
    \n看第一行代码：\n\n```c\nvoid hd_init(void) {\n    blk_dev[3].request_fn = do_hd_request;\n\
    \    ...\n}\n```\n\n我们把 `blk_dev` 数组索引 3 位置处的块设备管理结构 `blk_dev_struct` 的 `request_fn`\
    \ 赋值为了 `do_hd_request`，这是啥意思呢？\n\n因为有很多块设备，所以 Linux 0.11 内核用了一个 `blk_dev[]` 来进行管理，每一个索引表示一个块设备。\n\
    \n```c\nstruct blk_dev_struct blk_dev[NR_BLK_DEV] = {\n    { NULL, NULL },   \
    \  /* no_dev */\n    { NULL, NULL },     /* dev mem */\n    { NULL, NULL },  \
    \   /* dev fd */\n    { NULL, NULL },     /* dev hd */\n    { NULL, NULL },  \
    \   /* dev ttyx */\n    { NULL, NULL },     /* dev tty */\n    { NULL, NULL }\
    \      /* dev lp */\n};\n\nstruct blk_dev_struct {\n    void (*request_fn)(void);\
    \  // 处理 block I/O 请求的函数\n    struct request * current_request;  // 当前正在处理的请求\n\
    };\n```\n\n你看，索引为 3 这个位置，就表示给硬盘 `hd` 这个块设备留的位置。\n\n那么每个块设备执行读写请求都有自己的函数实现，在上层看来都是一个统一函数\
    \ `request_fn` 即可，具体实现各有不同，对于硬盘来说，这个实现就是 `do_hd_request` 函数。\n\n是不是有点像接口？这其实就是多态思想在\
    \ C 语言的体现嘛~ 用 Java 程序员熟悉的话就是，父类引用 `request_fn` 指向子类对象 `do_hd_request` 的感觉咯。\n\n\
    我们再看第二行。\n\n```c\nvoid hd_init(void) {\n    ...\n    set_intr_gate(0x2E,&hd_interrupt);\n\
    \    ...\n}\n```\n\n对于中断我们已经很熟悉了，这里就是又设置了一个新的中断，中断号是 `0x2E`，中断处理函数是 `hd_interrupt`，也就是说硬盘发生读写时，硬盘会发出中断信号给\
    \ CPU，之后 CPU 便会陷入中断处理程序，也就是执行 `hd_interrupt` 函数。\n\n```c\n_hd_interrupt:\n   \
    \ ...\n    xchgl _do_hd,%edx\n    ...\n// 如果是读盘操作，这个 do_hd 是 read_intr\nstatic\
    \ void read_intr(void) {\n    ...\n    do_hd_request();\n    ...\n}\n```\n\n好了，又多了一个中断，那我们再次理理目前开启的中断都有。\n\
    \n| 中断号 | 中断处理函数 |\n| --- | --- |\n| 0~0x10 | `trap_init` 里设置 |\n| 0x20 | `timer_interrupt`\
    \ |\n| 0x21 | `keyboard_interrupt` |\n| 0x2E | `hd_interrupt` |\n| 0x80 | `system_call`\
    \ |\n\n其中 `0-0x10` 17 个中断是 `trap_init` 里设置的，是一些基本的中断，比如异常等。之后，在控制台初始化 `con_init`\
    \ 里，我们又设置了 `0x21` 中断，这样键盘就有反应了。之后，我们在进程调度初始化 `sched_init` 里又设置了 `0x20` 时钟中断，并且开启定时器。最后又设置了一个极为重要的\
    \ `0x80` 系统调用。现在，我们在硬盘初始化 `hd_init` 里，又设置了硬盘中断，这样硬盘读写完成后通过中断来通知 CPU。上回书我提醒大家，有没有感觉到操作系统的中断驱动的特征，那本回给大家展望一下。\n\
    \n> 看到最后，你会发现操作系统就是一个中断驱动的死循环而已，如果不发生任何中断，操作系统会一直在死循环里等待。换句话说，让操作系统工作的唯一方式，就是触发中断。\n\
    \n好了，再往下看两行。\n\n```c\nvoid hd_init(void) {\n    ...\n    outb_p(inb_p(0x21)&0xfb,0x21);\n\
    \    outb(inb_p(0xA1)&0xbf,0xA1); \n}\n```\n\n就是往几个 IO 端口上读写，其作用是允许硬盘控制器发送中断请求信号，仅此而已。我们向来是不深入硬件细节，知道往这个端口里写上这些数据，导致硬盘开启了中断，即可。\n\
    \nOK，本章就结束了，仅仅看初始化的工作，太简单了，连图都不用画就结束了。当然 `hd.c` 里还有很多读写硬盘的方法，这个在之后文件系统用到他们时，自然会讲起，这里就抛个引子，看看读硬盘最最底层的操作流程，是怎样的。\n\
    \n我们看硬盘的端口表。\n\n| 端口 | 读 | 写 |\n| --- | --- | --- |\n| 0x1F0 | 数据寄存器 | 数据寄存器 |\n\
    | 0x1F1 | 错误寄存器 | 特征寄存器 |\n| 0x1F2 | 扇区计数寄存器 | 扇区计数寄存器 |\n| 0x1F3 | 扇区号寄存器或 LBA\
    \ 块地址 0~7 | 扇区号或 LBA 块地址 0~7 |\n| 0x1F4 | 磁道数低 8 位或 LBA 块地址 8~15 | 磁道数低 8 位或 LBA\
    \ 块地址 8~15 |\n| 0x1F5 | 磁道数高 8 位或 LBA 块地址 16~23 | 磁道数高 8 位或 LBA 块地址 16~23 |\n\
    | 0x1F6 | 驱动器/磁头或 LBA 块地址 24~27 | 驱动器/磁头或 LBA 块地址 24~27 |\n| 0x1F7 | 命令寄存器或状态寄存器\
    \ | 命令寄存器 |\n\n那读硬盘就是，往第一个以外的几个端口写数据，告诉读硬盘哪个扇区，读多少。然后再从 `0x1F0` 端口一个字节一个字节的读数据。这就完成了一次硬盘操作。如果觉得不够具体，那来具体的：\n\
    \n1. 在 `0x1F2` 写入要读取的扇区数\n2. 在 `0x1F3~0x1F6` 四四个写入计算好的 LBA 地址\n3. 在 `0x1F7` 处写入命令指令号\n\
    4. 不断检测 `0x1F7`（此时状态寄存器含义）的忙位\n5. 如果步骤不忙，则不断从 `0x1F0` 读取数据到内存，直到读完\n\n操作系统的代码也是这样写的，我们看一下，不用理解细节。\n\
    \n```c\nstatic void hd_out(unsigned int drive, unsigned int nsect, unsigned int\
    \ sect,\n                   unsigned int head, unsigned int cmd,\n           \
    \        void (*intr_addr)(void)) {\n    ...\n    do_hd = intr_addr;\n    outb_p(hd_info[drive].ctl,HD_CMD);\n\
    \    port = 0x1f0;\n    outb_p(hd_info[drive].wp<<2,++port);\n    outb_p(nsect,++port);\n\
    \    outb_p(sect,++port);\n    outb_p(cyl,++port);\n    outb_p(cyl>>8,++port);\n\
    \    outb_p(0xA0|(drive<<4)|head,++port);\n    outb(cmd,++port);\n}\n```\n\n看，那些\
    \ `outb_p` 方法，转换成汇编语言，就是 `out` 指令，往指定的硬盘 IO 端口上写数据，达到我们想要的读写的目的。是不是很 low？但我们用户层写的各种\
    \ `read/write` 函数，即便是经过系统调用、文件系统、缓冲区管理等等过程，但只要是读写硬盘，最终都要调用这个最底层的函数，殊途同归，逃不掉的！\n\
    \n好了，至此，我们就把所有的初始化工作，都讲完了！坚持到现在的，都为自己鼓掌！！！下一回，我们将用整一章的篇幅，完整梳理下我们所做的初始化工作，这也标志着第二大部分完结！这些初始化工作，将在后面的流程中，起到至关重要的作用，直到本系列结束。\n\
    \n### 第二部分总结与回顾\n\n第二部分所讲的代码，就第二部分的目录一样规整，一个 `init` 方法对应一个章节，简单粗暴。\n\n```c\nvoid\
    \ main(void) {\n    ...\n    mem_init(main_memory_start,memory_end);\n    trap_init();\n\
    \    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n    time_init();\n\
    \    sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n\
    \    sti();\n    move_to_user_mode();\n    if (!fork()) {init();}\n    for(;;)\
    \ pause();\n}\n```\n\n如果坚持到这里了，先给自己鼓鼓掌！这个过程，你可能觉得无聊。\n\n### 开始\n\n电脑开机后，首先由 BIOS\
    \ 将操作系统程序加载到内存，之后在进入 `main` 函数前，我们用汇编（`boot` 包下的三个汇编文件）做了好多苦力。这些苦力做好后，内存布局变成了样子。其中页表的映射关系，被成了线性地址与物理地址相同。也因为有了页表，所以多了线性空间，即经过段机制转化，分页机制前的地址，不考虑段限的话，32\
    \ 位 CPU 线性空间应为 4G。以上这些，是进入 `main` 函数之前，由 `boot` 文件夹下的三个汇编文件完成，具体可以看第一部分的总结：第一部分完结\
    \ 进入内核前的苦力活。\n"
