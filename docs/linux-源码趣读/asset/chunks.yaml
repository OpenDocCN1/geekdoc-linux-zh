    struct task_struct {\n    ?\n}\n```\n\n换句话说，你总得有一个结构来记录各个进程的信息，比如它上一次执行到哪里了，要不\
    \ CPU 就算决定好了要跳转到你这个进程上运行，具体跳到哪一行运行，总得有个地方存吧？我们一个个问题抛开来看。\n\n### 上下文环境\n\n每个程序最终的本质就是执行指令。这个过程会涉及**寄存器**、**内存**和**外设端口**。内存还有可能设计成相互错开的，互不干扰，比如进程\
    \ 1 你就用 0~1K 的内存空间，进程 2 就用 1K~2K 的内存空间，咱谁也别影响谁。虽然有点浪费空间，而且对程序员十分不友好，但起起还是能实现的。不过寄存器一共就那么点，肯定做不到互不干扰，可能一个进程就把寄存器全用上了，那其他进程咋整。\n\
    \n![](img/file171.webp \"fig:\")\n\n比如程序 1 刚刚往 `eax` 写入一个值，准备用，这时切换到进程 2 了，又往\
    \ `eax` 里写入了一个值。那么之后再切回进程 1 的时候，就出错了。\n\n所以最稳妥的做法就是，每次切换进程时，都把当前这些寄存器的值存到一个地方，以便之后切换回来的时候恢复。Linux\
    \ 0.11 就是这样做的，每个进程的结构 `task_struct` 里面，有一个叫 `tss` 的结构，存储的就是 CPU 这些**寄存器**的信息。\n\
    \n```\nstruct task_struct {\n    ...\n    struct tss_struct tss;\n}\n\nstruct\
    \ tss_struct {\n    long    back_link;  /* 16 high bits zero */\n    long    esp0;\n\
    \    long    ss0;        /* 16 high bits zero */\n    long    esp1;\n    long\
    \    ss1;        /* 16 high bits zero */\n    long    esp2;\n    long    ss2;\
    \        /* 16 high bits zero */\n    long    cr3;\n    long    eip;\n    long\
    \    efags;\n    long    eax,ecx,ebx;\n    long    esp;\n    long    ebp;\n  \
    \  long    esi;\n    long    edi;\n    long    es;         /* 16 high bits zero\
    \ */\n    long    cs;         /* 16 high bits zero */\n    long    ss;       \
    \  /* 16 high bits zero */\n    long    ds;         /* 16 high bits zero */\n\
    \    long    fs;         /* 16 high bits zero */\n    long    gs;         /* 16\
    \ high bits zero */\n    long    ldt;        /* 16 high bits zero */\n    long\
    \    bitmap;   /* trace: 0 */\n    struct i387_struct i387;\n};\n```这里细节：你发现 `tss`\
    \ 结构里还有 `cr3` 不？它表示 CPU 这些**寄存器**的信息。![](img/file172.webp \"fig:\") 那么指向页表，线性地址到物理地址的映射。也就是说，在我们刚刚的理想情况下，不同程序用不同的内存可以做到。有了这个\
    \ `cr3` 字段，就完全不需要建立建立建立映射。这也可以理解为保存内存的上下文。Linux 0.11 并不是通过替换 `cr3` 寄存器来实现互的，它的实现更为简单。\n\
    \n### 运行时间信息\n\n如何判断一个进程该让 CPU 切换到下一个进程？总不能每次时钟中断都吧，危险。。一个好的办法就是给进程一个属性叫**剩余时间**，每次时钟来了都减\
    \ 1，如果减到 0，就触发进程的操作。\n\n```\nstruct task_struct {\n    ...\n    long counter;\n\
    \    ...\n    struct tss_struct tss;\n}\n```它的用法也非常简单，每次中断都判断一下是否到 0。\n\n```\n\
    void do_timer(long cpl) {\n    ...\n    // 当前线程还有剩余时间，直接返回\n    if ((current->counter)>0)\
    \ return;\n    // 若没有剩余时间，调度\n    schedule();\n}\n```如果还没到 0，就直接返回，相当于调度选择下一个进程并使\
    \ CPU 跳转到那里运行。进程调度的逻辑就是在 `schedule` 函数里，怎么调先不管。\n\n### 优先级\n\n上面那个 `counter` 开始的时候是多少？而且随着\
    \ `counter` 不断减，到 0 时，下一轮回中 `counter` 应该赋予什么值？其实 `counter` 的初始化问题也需要有一个属性来记录这个值。\n\
    \n往宏观想一下，这个值越大，那么 `counter` 就越大，每次轮到进程时，在 CPU 中运行的时间就越长，也就是这个进程比其他进程得到了更多 CPU\
    \ 运行的时间。我们可以把这个值称为**优先级**，是不是很形象。\n\n```\nstruct task_struct {\n    ...\n    long\
    \ counter;\n    long priority;\n    ...\n    struct tss_struct tss;\n}\n```每次进程初始化时，都把\
    \ `counter` 赋值为 `priority`，而且当 `counter` 减为 0 时，下一次分配时间也赋值为 `priority`。反正就叫优先级吧。\n\
    \n### 进程状态\n\n其实有了上面三个信息就可以完成进程调度。甚至如果操作系统让所有进程都得到同样的运行，连 `counter` 和 `priority`\
    \ 都不用记录，操作系统定一个固定值一直减，到 0 了切一个新进程。这样仅仅好寄存器的上下文 `tss` 就好了。但我们总要优化以适应不同的用户需求。很简单：一个进程有一个硬盘的操作，发起请求后要等久才能中断，那这个进程在占用\
    \ CPU 时就可以放弃执行权，把自己的状态标记为等待中。这个记录此时的状态叫 `state`。\n\n```\nstruct task_struct {\n\
    \    long state;\n    long counter;\n    long priority;\n    ...\n    struct tss_struct\
    \ tss;\n}\n```这个进程的 `state` 在 Linux 0.11 里有五种：\n\n```\n#define TASK_RUNNING 0\n\
    #define TASK_INTERTIBLE 1\n#define TASK_UNINTERTIBLE 2\n#define TASK_ZOMBIE 3\n\
    #define TASK_STOPPED 4\n```好了，目前这几个字段就可以完成简单的进程调度任务了。有表示状态的 `state`、表示剩余时间的 `counter`、表示优先级的\
    \ `priority` 和表示上下文信息的 `tss`。其他字段我们需要用到的时候再说，今天只是头脑风暴一下进程设计的思路。\n\n看一下 Linux 0.11\
    \ 中进程结构的全部，心里有个数，具体干嘛的先管，记住刚刚头脑风暴的那四个字段就行：\n\n```\nstruct task_struct {\n    /*\
    \ these are hardcoded - don't touch */\n    long state; /* -1 runnable, 0 runnable,\
    \ >0 stopped */\n    long counter;\n    long priority;\n    long signal;\n   \
    \ struct sigaction sigaction[32];\n    long blocked;   /* bitmap of masked signals\
    \ */\n    /* various fields */\n    int exit_code;\n    unsigned long start_code,end_code,end_data,brk,start_stack;\n\
    \    long pid,father,pgrp,session,leader;\n    unsigned short uid,euid,suid;\n\
    \    unsigned short gid,egid,sgid;\n    long alarm;\n    long utime,stime,cutime,cstime,start_time;\n\
    \    unsigned short used_math;\n    /* file system info */\n    int tty;     \
    \   /* -1 if no tty, so it must be signed */\n    unsigned short umask;\n    struct\
    \ m_inode *pwd;\n    struct m_inode *root;\n    struct m_inode *executable;\n\
    \    unsigned long close_on_exec;\n    struct file * filp[NR_OPEN];\n    /* ldt\
    \ for this task 0 - zero 1 - cs 2 - ds&ss */\n    struct desc_struct ldt[3];\n\
    \    /* tss for this task */\n    struct tss_struct tss;\n};\n```\n\n"
- fmt: "\n还记得我们在 [第18回 | 大名鼎鼎的进程调度就是从这里开始的](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c8c2b03d9721ba74e99cfa8&chksm=c2c5b87df5b2316b083015a4fdba2df29211f38fcfd1cdb040e02ab410432608e26383a43ef5&scene=21)\
    \ 的时候，开启了`定时器`吧？这个定时器每一段时间就会向 CPU 发起一个中断。\n\n![](media/file173.gif)\n\n这个间隔被设置为\
    \ 10ms，也就是 100Hz。\n\n```c\nschedule.c\n#define HZ 100\n```\n\n发起的中断叫`时钟中断`，其中向量号被设置为\
    \ `0x20`。还记得我们在 `sched_init` 里设置的时钟中断对应的中断函数吧？\n\n```c\nschedule.c\nset_intr_gate(0x20,\
    \ &timer_interrupt);\n```\n\n这样当时钟中断 `0x20` 号到来，CPU 会查找中断表中 `0x20` 处的地址，即中断处理函数并跳转执行。这个中断处理函数\
    \ `timer_interrupt` 是用汇编语言写的。\n\n```s\nsystem_call.s\n_timer_interrupt:\n    ...\n\
    \    // 增加系统滴数\n    incl jiff\n    ...\n    // 调用函数\n    call do_timer\n```\n\n\
    这个函数做了两件事：一个是将系统滴数变量 `jiff` 加一，一个是调用另一个函数 `do_timer`。\n\n```c\nsched.c\nvoid do_timer(long\
    \ c) {\n    ...\n    // 当前线程还有时间片，直接返回\n    if (--current->counter) > 0) return;\n\
    \    // 若没有时间片，调度\n    schedule();\n}\n```\n\n`do_timer` 最重要的部分就是这段代码，非常简单。首先将进程的时间片减\
    \ 1，然后判断时间片仍然大于零则什么都不做；如果时间片为零则调用 `schedule()`，这就是进程调度的主干。\n\n```c\nschedule.c\n\
    void schedule() {\n    int i, next, c;\n    struct task_struct *p;\n    ...\n\
    \    while (1) {\n        c = -1;\n        next = 0;\n        i = NR_TASKS;\n\
    \        p = &task[NR_TASKS];\n        while (--i) {\n            if (!*p) continue;\n\
    \            if ((*p)->state == TASK_RUNNING && (*p)->counter > c)\n         \
    \       c = (*p)->counter, next = i;\n        }\n        if (c) break;\n     \
    \   for (p = &LAST_TASK; p > &FIRST_TASK; --p)\n            if (*p)\n        \
    \        (*p)->counter = ((*p)->counter >> 1) + (*p)->priority;\n    }\n    switch_to(next);\n\
    }\n```\n\n别看这么一大坨，我做个不严谨的简化，你就明白了：\n\n```c\nvoid schedule() {\n    int next =\
    \ get_max_counter_and_runnable_thread();\n    refresh_all_thread_counter();\n\
    \    switch_to(next);\n}\n```\n\n看到没，就这么简单。这个函数做了三件事：\n\n1. 拿到剩余时间片（`counter`的值）最大且在\
    \ `runnable` 状态（`state = 0`）的进程号 `next`。\n\n![](media/file174.gif)\n\n2. 如果所有\
    \ `runnable` 进程时间片都为 0，则所有进程（不仅仅是 `runnable` 的进程）的 `counter` 重新赋值（`counter = counter/2\
    \ + priority`），再次执行步骤 1。\n\n3. 最后得到了一个进程号 `next`，调用了 `switch_to(next)` 方法，就切换到了进程去执行。看\
    \ `switch_to` 方法，是用内联汇编语句写的。\n\n```h\nsched.h\n#define switch_to(n) { \\\n   \
    \ struct {long a,b;} __tmp; \\\n    __asm__(\"cmpl %%ecx,_current\\n\\t\" \\\n\
    \            \"je 1f\\n\\t\" \\\n            \"movw %%dx,%1\\n\\t\" \\\n     \
    \       \"xchgl %%ecx,_current\\n\\t\" \\\n            \"ljmp %0\\n\\t\" \\\n\
    \            \"cmpl %%ecx,_last_task_used_math\\n\\t\" \\\n            \"jne 1f\\\
    n\\t\" \\\n            \"clts\\n\" \\\n            \"1:\" \\\n            ::\"\
    m\" (*&__tmp.a),\"m\" (*&__tmp.b), \\\n            \"d\" (_TSS(n)),\"c\" ((long)\
    \ task[n])); \\\n}\n```\n\n这段话就是进程切换的最最最底层的代码了。看不懂没关系，其实主要就干了一件事：`jmp` 到新进程的 `tss`\
    \ 段。啥意思？CPU 规定如果 `jmp` 指令后面跟着一个 `tss` 段，那么硬件会将当前寄存器的值保存在当前进程的 `tss` 中，并将新进程的 `tss`\
    \ 信息加载到各个寄存器。\n\n![](media/file175.webp)\n\n上图来源于《Linux内核注释5.0》，这个图在书里画得非常清晰，我就重复一遍。简单说就是：保存当前进程上下文，恢复下一个进程的上下文，跳过去！看，上一讲开头提到的\
    \ `task_struct` 结构字段都用上了。\n\n```c\nstruct task_struct {\n    long state;\n   \
    \ long counter;\n    long priority;\n    ...\n    struct tss tss;\n};\n```\n\n\
    至此，我们梳理完了一个进程切换的链路。回顾一下：\n\n链路开始，罪魁祸首就是那个每 10ms 触发一次的定时器。这个定时器会给 CPU 产生一个时钟中断。这个中断信号使\
    \ CPU 查找中断表，找到中断处理函数 `do_timer`。`do_timer` 首先将当前进程的 `counter` 变量减 1，如果 `counter`\
    \ 仍然大于 0 则此结束；如果 `counter = 0` 了，就开始进程调度。调度就是找到所有 `RUNNABLE` 状态中 `counter` 值最大的进程，把它丢进\
    \ `switch_to` 函数的参数里。`switch_to` 函数保存当前进程上下文，恢复目标进程的上下文，同时 CPU 跳转到目标进程的偏移处，接着这个进程就运行了起来，等待下一次时钟中断。\n\
    \n链路结束。好了，我们自己设计了一遍进程调度，又看一次 Linux 进程调度的全过程。\n\n```c\nvoid main() {\n    ...\n\
    \    move_to_user_mode();\n    if (!fork()) {\n        init();\n    }\n    pause();\n\
    }\n```\n\n接下来知道如何调用 `fork`。\n\n### 通过 fork 看系统调用\n\n原文链接：https://mp.weixin.qq.com/s/rYHS_AZgc8knSKxA\n\
    \n接上回，咱们说到通过自己设计了一遍进程调度，又看一次 Linux 进程调度的全过程。\n\n```c\nvoid main() {\n    ...\n\
    \    move_to_user_mode();\n    if (!fork()) {\n        init();\n    }\n    pause();\n\
    }\n```\n\n也就是 `fork` 函数干了啥？这个 `fork` 函数稍微绕了点，我们看如下代码。\n\n```c\nstatic inline _syscall(int,fork)\n\
    #define _syscall(type,name) \\\ntype name(void) { \\\n    long __res; \\\n   \
    \ __asm__ volatile (\"int $0x80\" \\\n            =\":a\" (__res) \\\n       \
    \     :\"0\" (__NR_name)); \\\n    if (__res >= 0) \\\n        return (type) __res;\
    \ \\\n    errno = -__res; \\\n    return -1; \\\n}\n```\n\n别急，我把它变成稍微看得懂的样子，就是这样：\n\
    \n```c\n#define _syscall(type,name)\ntype name(void) {\n    volatile long __res;\n\
    \    _asm {\n        _asm mov eax,__NR_name\n        _asm int 80h\n        _asm\
    \ mov __res,eax\n    }\n    if (__res >= 0)\n        return (type) __res;\n  \
    \  errno = -__res;\n    return -1;\n}\n```\n\n所以，把宏定义都展开，其实就相当于定义了一个函数。\n\n```c\n\
    int fork(void) {\n    volatile long __res;\n    _asm {\n        _asm mov eax,__NR_fork\n\
    \        _asm int 80h\n        _asm mov __res,eax\n    }\n    if (__res >= 0)\n\
    \        return (void) __res;\n    errno = -__res;\n    return -1;\n}\n```\n\n\
    仅此而已。具体看一下 `fork` 函数里面的代码，又是讨厌的内联汇编，不过上面已经变成好看一点的样子了，而且不用你看懂，听我说就行。关键指令就是一个 `0x80`\
    \ 号软中断的触发，`int 80h`。\n"
