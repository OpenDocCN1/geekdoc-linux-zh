    \    mov [edi],eax\n    mov [edi+4],edx\n    add edi,8\n    dec ecx\n    jne rp_sidt\n\
    \    lidt fword ptr idt_descr\n    ret\n\nidt_descr:\n    dw 256*8-1\n    dd _idt\n\
    \n_idt:\n    DQ 256 dup(0)\n```\n\n不用细看，我给你说最终效果。\n\n中断描述符表 `idt` 里面存储着一个个中断描述符，每一个中断号就对应着一个中断描述符。而中断描述符里面存储的主要是中断程序的地址。这样一个中断号过来后，CPU\
    \ 就会自动寻找相应的中断程序，然后去执行它。\n\n那这段程序的作用就是设置了 256 个中断描述符，并且让每一个中断描述符中的中断程序例程都指向一个 `ignore_int`\
    \ 的函数地址。这是一个默认的中断处理程序，之后会逐渐被各个具体的中断程序所覆盖。比如之后键盘模块会将自己的键盘中断处理程序覆盖过去。\n\n那现在，产生任何中断都会指向这个默认的函数\
    \ `ignore_int`，也就是说现在这个阶段你按键盘还不好使。\n\n设置中断描述符表 `setup_idt` 说完了，那接下来 `setup_gdt`\
    \ 就同理了。我们就直接看设置好后的新的全局描述符表长什么样吧？\n\n```\n_gdt:\n    DQ 0000000000000000h    ;/*\
    \ NULL descriptor */\n    DQ 00c09a0000000fffh    ;/* 16Mb */\n    DQ 00c0920000000fffh\
    \    ;/* 16Mb */\n    DQ 0000000000000000h    ;/* TEMPORARY - don't use */\n \
    \   DQ 252 dup(0)\n```\n\n其实和我们原先设置好的 `gdt` 一模一样。\n\n也是有代码段描述符和数据段描述符，然后第四项系统段描述符并没有用到，不用管。最后还留了\
    \ 252 项的空间，这些空间后面会用来放置任务状态段描述符 `TSS` 和局部描述符 `LDT`，这个后面再说。\n\n![](img/file54.webp\
    \ \"fig:\")\n\n为什么原来已经设置过一遍了，这里又要重新设置一遍？你可千万别想有什么复杂的原因，就是因为原来设置的 `gdt` 是在 `setup`\
    \ 程序中，之后这个地方要被缓冲区覆盖掉，所以这里重新设置在 `head` 程序中。这块内存区域之后就不会被其他程序用到并且覆盖了，就这么个事。\n\n说的口干舌燥，还是来张图吧。\n\
    \n![](img/file55.webp \"fig:\")\n\n如果你本文的内容完全不能理解，那就记住最后这张图就好了。本文代码就是完成了这个图中所示的一个指向转换而已，并且给所有中断设置了一个默认的中断处理程序\
    \ `ignore_int`，然后全局描述符表仍然只有代码段描述符和数据段描述符。\n\n好了，本文就是两个描述符表位置的变化以及重新设置，后面一行代码就是又一个令人兴奋的功能了！\n\
    \n```\njmp after_page_tables\n...\nafter_page_tables:\n    push 0\n    push 0\n\
    \    push 0\n    push L6\n    push _main\n    jmp setup_paging\nL6:\n    jmp L6\n\
    ```\n\n那就是开启分页机制，并且跳转到 `main` 函数！\n\n这可太令人兴奋了！开启分页后，配合着之前讲的分段，就构成了内存管理的最最底层的机制。而跳转到\
    \ `main` 函数，标志着我们正式进入了 c 语言写的操作系统核心代码！\n\n欲知后事如何，且听下回分解。\n\n**------- 本回扩展资料 -------**\n\
    \n保护模式下逻辑地址到线性地址（不开启分页时就是物理地址）的转化，看 Intel 手册：\n\nVolume 3 Chapter 3.4 Logical\
    \ And Linear Addresses\n\n![](img/file56.webp \"fig:\")\n\n段描述符结构和详细说明，看 Intel\
    \ 手册：\n\nVolume 3 Chapter 3.4.5 Segment Descriptors\n\n![](img/file57.webp \"\
    fig:\")\n\n对操作系统是如何编译的，比如好奇那个 `system` 是怎么来的，可以尝试理解一下 Linux 0.11 源码中的 `Makefile`，这个我就不展开讲了，我们把更多精力放在操作系统是如何一步一步构建起来的这个过程。\n\
    \n* *\n\n## 第 9 回 Intel 内存管理两板斧：分段与分页\n\n> 原文链接: [`mp.weixin.qq.com/s/q2wU9IbX54t_GAuc9V5r7A`](https://mp.weixin.qq.com/s/q2wU9IbX54t_GAuc9V5r7A)\n\
    \n书接上回，上回书咱们说到，`head.s` 代码在重新设置了 `gdt` 与 `idt` 后。\n\n![](img/file58.webp \"fig:\"\
    )\n\n来到了这样一段代码。\n\n```\njmp after_page_tables\n...\nafter_page_tables:\n    push\
    \ 0\n    push 0\n    push 0\n    push L6\n    push _main\n    jmp setup_paging\n\
    L6:\n    jmp L6\n```\n\n那就是开启分页机制，并且跳转到 `main` 函数。\n\n如何跳转之后用 c 语言写的 `main` 函数是个有趣的事，不过我们先瞧分页机制是如何开启的，也就是\
    \ `setup_paging` 标签处的代码。\n\n```assembly\nsetup_paging:\n    mov ecx,1024*5\n \
    \   xor eax,eax\n    xor edi,edi\n    pushf\n    cld\n    rep stosd\n    mov eax,_pg_dir\n\
    \    mov [eax],pg0+7\n    mov [eax+4],pg1+7\n    mov [eax+8],pg2+7\n    mov [eax+12],pg3+7\n\
    \    mov edi,pg3+4092\n    mov eax,00fff007h\n    std\n    L3: stosd\n    sub\
    \ eax,00001000h\n    jge L3\n    popf\n    xor eax,eax\n    mov cr3,eax\n    mov\
    \ eax,cr0\n    or  eax,80000000h\n    mov cr0,eax\n    ret\n```\n\n"
- fmt: "\n![](media/file73.webp \"fig:\")\n\n# 第10回 进入 main 函数前的最后一跃！\n\n> 原文链接: [https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    \n书接上回，上回书咱们说到，我们终于把这些杂七杂八的 `idt`、`gdt`、页表都设置好了，并且也开启了保护模式，相当于所有苦力活都做好铺垫了，之后我们就要准备进入\
    \ `main.c`！那里是个新世界！\n\n注意不是进入，而是准备进入哦，就差一哆嗦了。\n\n由于上一讲的知识量非常大，所以这一讲将会非常简单，作为进入\
    \ `main` 函数前的衔接，大家放宽心。\n\n这仍然要回到上一讲我们跳转到设置分页代码的那个地方（`head.s` 里），这里有个骚操作帮我们跳转到\
    \ `main.c`。\n\n```\nafter_page_tables:\n    push 0\n    push 0\n    push 0\n \
    \   push L6\n    push _main\n    jmp setup_paging\nsetup_paging:\n    ...\n  \
    \  ret\n```\n\n直接解释起来非常简单。\n\n`push` 指令就是**压栈**，五个 `push` 指令过去后，栈会变成这个样子。\n\n\
    ![](media/file74.webp \"fig:\")\n\n然后注意，`setup_paging` 最后一个指令是 `ret`，也就是我们上一回讲的设置分页的代码的最后一个指令，形象地说它叫**返回指令**，但\
    \ CPU 可没有那么聪明，它并不知道该返回到哪里执行，只是很机械地**把栈顶的元素值当做返回地址**，跳转去那里执行。\n\n再具体说是，把 `esp`\
    \ 寄存器（栈顶地址）所指向的内存处的值，赋值给 `eip` 寄存器，而 `cs:eip` 就是 CPU 要执行的下一条指令的地址。而此时栈顶刚好是 `main.c`\
    \ 里写的 `main` 函数的内存地址，是我们刚刚特意压入栈的，所以 CPU 就理所应当跳过来了。\n\n当然 Intel CPU 是设计了 `call`\
    \ 和 `ret` 这一配对儿的指令，意为调用函数和返回，具体可以看后面本回扩展资料里的内容。\n\n至于其他压入栈的 `L6` 是用作当 `main` 函数返回时的跳转地址，但由于在操作系统层面的设计上，`main`\
    \ 是绝对不会返回的，所以也就没用了。而其他的三个压栈的 `0`，本意是作为 `main` 函数的参数，但实际上似乎也没有用到，所以也不必关心。\n\n总之，经过这一个小小的骚操作，程序终于跳转到\
    \ `main.c` 这个由 C 语言写就的主函数 `main` 里了！我们先一睹为快一下。\n\n```c\nvoid main(void) {\n  \
    \  ROOT_DEV = ORIG_ROOT_DEV;\n    drive_info = DRIVE_INFO;\n    memory_end = (1<<20)\
    \ + (EXT_MEM_K<<10);\n    memory_end &= 0xfffff000;\n    if (memory_end > 16*1024*1024)\n\
    \        memory_end = 16*1024*1024;\n    if (memory_end > 12*1024*1024) \n   \
    \     buffer_memory_end = 4*1024*1024;\n    else if (memory_end > 6*1024*1024)\n\
    \        buffer_memory_end = 2*1024*1024;\n    else\n        buffer_memory_end\
    \ = 1*1024*1024;\n    main_memory_start = buffer_memory_end;\n    mem_init(main_memory_start,memory_end);\n\
    \    trap_init();\n    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n\
    \    time_init();\n    sched_init();\n    buffer_init(buffer_memory_end);\n  \
    \  hd_init();\n    floppy_init();\n    sti();\n    move_to_user_mode();\n    if\
    \ (!fork()) {\n        init();\n    }\n    for(;;) pause();\n}\n```\n\n没错，这就是这个\
    \ `main` 函数的全部了。\n\n而整个操作系统也会最终停留在最后一行死循环中，永不返回，直到关机。\n\n好了，至此，整个第一部分就圆满结束了，为了跳进\
    \ `main` 函数的准备工作，我称之为进入内核前的苦力活，就完成了！我们看看我们做了什么。\n\n![](media/file75.webp \"fig:\"\
    )\n\n我把这些称为**进入内核前的苦力活**，经过这样的流程，内存被搞成了这个样子。\n\n![](media/file76.webp \"fig:\"\
    )\n\n之后，`main` 方法就开始执行了，靠着我们辛辛苦苦建立起来的内存布局，向崭新的未来前进！\n\n欲知后事如何，且听下回分解。\n\n## 本回扩展资料\n\
    \n关于 `ret` 指令，其实 Intel CPU 是配合 `call` 设计的，有关 `call` 和 `ret` 指令，即调用和返回指令，可以参考 Intel\
    \ 手册：Intel 1 Chapter 6.4 CALLING PROCEDURES USING CALL AND RET\n\n可以看到还分为不改变段基址的\
    \ `near call` 和 `near ret`\n\n![](media/file77.webp \"fig:\")\n\n以及改变段基址的 `far\
    \ call` 和 `far ret`\n\n![](media/file78.webp \"fig:\") 压栈和出栈的过程，上面文字清楚，下面 Intel\
    \ 手册非常友好了图![](media/file79.webp \"fig:\")可以看到我们左边的那一套把 `main` 函数地址当做 `call` 指令，实际上我们通过骚操作伪造了假象，然后\
    \ `ret` 的时候就把栈顶的 `main` 函数地址弹出存入 `eip` 寄存器，这样 CPU 就相当于“返回”到了 `main` 函数开始。\n\n\
    ## 第一部分回顾\n\n> [mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    \n第一部分共有十回，这里是目录：\n- [第一回 | 开篇](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第二回 | 自己挪个儿](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n- [第三回 | 做好最基础的工作](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第四回 | 把自己在硬盘里的其他部分放到内存来](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第五回 | 进入保护模式前的最后折腾内存](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第六回 | 先解决段寄存器的历史包袱](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n- [第七回\
    \ | 六行代码就进入了保护模式](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n- [第八回 |\
    \ 重新设置 id 和 gdt](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n- [第九回 |\
    \ 内存管理两斧：分段与分页](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n- [第十回 | 进入\
    \ main 函数前的最后一跃](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\n这张图展示了整个结构![](media/file80.webp\
    \ \"fig:\")\n\n今天就来整体理一下第一部分的内容，看过的同学回顾一下，没过的同学借着这波机会开始。话不多说，当你按下开机键的那一刻，主板上写死的固件\
    \ BIOS 将硬盘启动区的 512 字节的数据原不动复制到内存中的 `0x7c00` 位置，并跳转到那个位置执行![](media/file81.webp\
    \ \"fig:\")\n\n有了这个步骤之后，我们就可以把代码写在硬盘第一区，让 BIOS 帮我们加载到内存并由 CPU 执行，我们不用操心这个过程。这一扇区的代码就是操作系统源码中最开始的部分，它可以执行一些指令，也可以把硬盘的部分加载到内存，本质上也是执行一些指令。这样，整个计算机后续运作完全交到我们手中，想怎么玩就怎么玩。\n\
    \n整个操作系统的编译和加载过程的全貌，就是下面这张图![](media/file82.webp \"fig:\")\n\n我们整个的第一部分，其实就在讲\
    \ `boot` 文件夹下的三个汇编文件：`bootsect.s`、`setup.s` 以及后面要和其他全部操作系统代码做链接的 `head.s`。\n\n\
    前五回的内容一直在调整内存布局，把这块内存复制到那块，又把那块内存复制到这块。在第五回的结尾，我让你记住这样一张图，在很一段时间这个内存布局的大体框架就不会再变了，前五回的内容你也可以抛在脑后了![](media/file83.webp\
    \ \"fig:\")\n\n从第六回开始往后，就是逐渐进入保护模式，并设置分段、分页等机制的地方。最终的内存布局变成了这个样子![](media/file84.webp\
    \ \"fig:\")\n\n"
