    \n别怕，我也看不懂。\n\n不过这俩都是最终指向了相同的另一个宏定义 **_set_gate**，说明是有共性的。\n\n啥共性呢？我直接说吧，那段你完全看不懂的代码，是将汇编语言嵌入到\
    \ c 语言了，这种内联汇编的格式非常恶心，所以我也不想搞懂它，最终的效果就是**在中断描述符表中插入了一个中断描述符**。\n\n中断描述符表还记得吧，英文叫\
    \ idt。\n\n![](media/file97.webp \"fig:\")\n\n这段代码就是往这个 idt 表里一项一项地写东西，其对应的中断号就是第一个参数，中断处理程序就是第二个参数。\n\
    \n产生的效果就是，之后如果来一个中断后，CPU 根据其中断号，就可以到这个中断描述符表 idt 中找到对应的中断处理程序了。\n\n比如这个。\n\n```\n\
    [](#cb70-1)set_trap_gate(0,&divide_error);\n```\n\n就是设置 **0 号中断**，对应的中断处理程序是 **divide_error**。\n\
    \n等 CPU 执行了一条除零指令的时候，会从硬件层面发起一个 0 号异常中断，然后执行由我们操作系统定义的 divide_error 也就是除法异常处理程序，执行完之后再返回。\n\
    \n再比如这个。\n\n```\n[](#cb71-1)set_system_gate(5,&overflow);\n```\n\n就是设置 5 号中断，对应的中断处理程序是\
    \ overflow，是边界出错中断。\n\nTIPS：这个 trap 与 system 的区别仅仅在于，设置的中断描述符的特权级不同，前者是 0（内核态），后者是\
    \ 3（用户态），这块展开将会是非常严谨的、绕口的、复杂的特权级相关的知识，不明白的话先不用管，就理解为都是设置一个中断号和中断处理程序的对应关系就好了。\n\
    \n再往后看，批量操作这里。\n\n```\n[](#cb72-1)void trap_init(void) {\n[](#cb72-2)    ...\n\
    [](#cb72-3)    for (i=17;i<48;i++)\n[](#cb72-4)        set_trap_gate(i,&reserved);\n\
    [](#cb72-5)    ...\n[](#cb72-6)}\n```\n\n17 到 48 号中断都批量设置为了 **reserved** 函数，这是暂时的，后面各个硬件初始化时要重新设置好这些中断，把暂时的这个给覆盖掉，此时你留个印象。\n\
    \n所以整段代码执行下来，内存中那个 idt 的位置会变成如下的样子。\n\n![](media/file98.webp \"fig:\")\n\n好了，我们看到了设置中断号与中断处理程序对应的地方，那这行代码过去后，键盘好使了么？\n\
    \n**NO**\n\n键盘产生的中断的中断号是 **0x21**，此时这个中断号还仅仅对应着一个临时的中断处理程序 &reserved，我们接着往后看。\n\
    \n在这行代码往后几行，还有这么一行代码。\n\n```\n[](#cb73-1)void main(void) {\n[](#cb73-2)    ...\n\
    [](#cb73-3)    trap_init();\n[](#cb73-4)    ...\n[](#cb73-5)    tty_init();\n\
    [](#cb73-6)    ...\n[](#cb73-7)}\n[](#cb73-8)\n[](#cb73-9)void tty_init(void)\
    \ {\n[](#cb73-10)    rs_init();\n[](#cb73-11)    con_init();\n[](#cb73-12)}\n\
    [](#cb73-13)\n[](#cb73-14)void con_init(void) {\n[](#cb73-15)    ...\n[](#cb73-16)\
    \    set_trap_gate(0x21,&keyboard_interrupt);\n[](#cb73-17)    ...\n[](#cb73-18)}\n\
    ```\n\n我省略了大量的代码，只保留了我们关心的。\n\n注意到 trap_init 后有个 **tty_init**，最后根据调用链，会调用到一行添加\
    \ 0x21 号中断处理程序的代码，就是刚刚熟悉的 **set_trap_gate**。\n\n而后面的 **keyboard_interrupt** 根据名字也可以猜出，就是键盘的中断处理程序嘛！\n\
    \n好了，那我们终于找到大案了，就是从这一行代码开始，我们的键盘生效了！\n\n没错，不过还有点小问题，不过不重要，就是我们现在的中断处于**禁用状态**，不论是键盘中断还是其他中断，通通都不好使。\n\
    \n而 main 方法继续往下读，还有一行这个东西。\n\n```\n[](#cb74-1)void main(void) {\n[](#cb74-2) \
    \   ...\n[](#cb74-3)    trap_init();\n[](#cb74-4)    ...\n[](#cb74-5)    tty_init();\n\
    [](#cb74-6)    ...\n[](#cb74-7)    sti();\n[](#cb74-8)    ...\n[](#cb74-9)}\n\
    ```\n\nsti 最终会对应一个同名的汇编指令 sti，表示**允许中断**。所以这行代码之后，键盘才真正开始生效！\n\n![](media/file99.gif\
    \ \"fig:\")\n\n动画酷不酷？好啦，今天的文章就到这里了，中断的原理和细节，就看我之前的文章，[认认真真的聊聊中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247498208&idx=1&sn=b784f8b4e627ebd1bfb9810d194fdb80&chksm=c2c5834df5b20a5bdee331002bfc61c90eb468da325bf67abeef780c303a9f51c8543e1a5981&scene=21#wechat_redirect)。\n\
    \n键盘处理的具体流程，可以跟着我今天的代码深入进去看看哟，Linux 0.11 里还是很简单的。\n\n------\n\n本文可以当做 [你管这破玩意叫操作系统源码](https://mp.weixin.qq.com/mp/appmsgalbum?__biz=Mzk0MjE3NDE0Ng==&action=getalbum&album_id=2123743679373688834#wechat_redirect)\
    \ 系列文章的第 14 回。\n\n为了让不追更系列的读者也能很方便阅读并学到东西，我把它改造成了单独的不依赖系列上下文的文章，具体原因可以看 [坚持不下去了...](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500082&idx=1&sn=7a5b6b3e5fe1106297928196c085a50f&chksm=c2c5bb9ff5b23289d0f55888df604e21641b36759533cf510b00f7d7c27e3ebccb97121bb8a1&scene=21#wechat_redirect)\n\
