    \    outb(inb(0x21)&~0x01,0x21);\n    set_system_gate(0x80,system_call);\n   \
    \ ...\n}\n```\n\n"
- fmt: "\n想起来了吧？而且我们在 [第13回 | 主内存初始化 mem_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500089&idx=1&sn=9a3fd6e585b0fd1ec528599ead6677c6&scene=21#wechat_redirect)\
    \ 中，用 `mem_init` 设置好了主内存的管理结构 `mem_map`。\n\n![](media/file127.webp \"fig:\")\n\
    \n再想不起来那就需要把前面的章节再读一读咯，不然后面越来越难。\n\n前面是把主内存区管理起来了，所以今天就是把剩下的缓冲区部分，也初始化管理起来。目的就是这么单纯，我们看代码。\n\
    \n我们还是采用之前的方式，就假设内存只有 8M，把一些不相干的分支去掉，方便理解。\n\n```\nextern int end;\nstruct buffer_head\
    \ * start_buffer = (struct buffer_head *) &end;\n\nvoid buffer_init(long buffer_end)\
    \ {\n    struct buffer_head * h = start_buffer;\n    void * b = (void *) buffer_end;\n\
    \    while ( (b -= 1024) >= ((void *) (h+1)) ) {\n        h->b_dev = 0;\n    \
    \    h->b_dirt = 0;\n        h->b_count = 0;\n        h->b_lock = 0;\n       \
    \ h->b_uptodate = 0;\n        h->b_wait = NULL;\n        h->b_next = NULL;\n \
    \       h->b_prev = NULL;\n        h->b_data = (char *) b;\n        h->b_prev_free\
    \ = h-1;\n        h->b_next_free = h+1;\n        h++;\n    }\n    h--;\n    free_list\
    \ = start_buffer;\n    free_list->b_prev_free = h;\n    h->b_next_free = free_list;\n\
    \    for (int i=0;i<307;i++)\n        hash_table[i]=NULL;\n}\n```\n\n虽然很长，但其实就造了两个数据结构而已。\n\
    \n不过别急，我们先看这一行代码。\n\n```\nextern int end;\nvoid buffer_init(long buffer_end) {\n\
    \    struct buffer_head * start_buffer = (struct buffer_head *) &end;\n    ...\n\
    }\n```\n\n这里有个外部变量 `end`，而我们的缓冲区开始位置 `start_buffer` 就等于这个变量的内存地址。\n\n这个外部变量 `end`\
    \ 并不是操作系统代码写就的，而是由链接器 `ld` 在链接整个程序时设置的一个外部变量，帮我们计算好了整个内核代码的末尾地址。\n\n那在这之前的是内核代码区域肯定不能用，在这之后的，就给\
    \ buffer 用了。所以我们的内存分布图可以更精确一点了。\n\n![](media/file128.webp \"fig:\")\n\n你看，之前的疑惑解决了吧？很好理解嘛，内核程序和缓冲区的划分，肯定有个分界线，这个分界线就是\
    \ `end` 变量的值。\n\n这个值定多少合适呢？\n\n像主内存和缓冲区的分界线，就直接代码里写死了，就是上图中的 2M。\n\n可是内核程序占多大内存在写的时候完全不知道，就算知道了如果改动一点代码也会变化，所以就由程序编译链接时由链接器程序帮我们把这个内核代码末端的地址计算出来，作为一个外部变量\
    \ `end` 我们拿来即用，就方便多了。\n\n好，回过头我们再看看，整段代码创造了哪两个管理结构？\n\n我们先看这段结构。\n\n```\nvoid\
    \ buffer_init(long buffer_end) {\n    struct buffer_head * h = start_buffer;\n\
    \    void * b = (void *) buffer_end;\n    while ( (b -= 1024) >= ((void *) (h+1))\
    \ ) {\n        ...\n        h->b_data = (char *) b;\n        h->b_prev_free =\
    \ h-1;\n        h->b_next_free = h+1;\n        h++;\n    }\n    ...\n}\n```\n\n\
    就俩变量。一个是 `buffer_head` 结构的 `h`，代表缓冲头，其指针值是 `start_buffer`，刚刚我们计算过了，就是图中的内核代码末端\
    \ `end`，也就是缓冲区开头。\n\n一个是 `b`，代表缓冲块，指针值是 `buffer_end`，也就是图中的 2M，就是缓冲区结尾。\n\n缓冲区结尾的\
    \ `b` 每次循环 -1024，缓冲区结尾的 `h` 每次循环 +1（一个 `buffer_head` 大小的内存），直到一块为止。\n\n![](media/file129.webp\
    \ \"fig:\")\n\n可以看到，其实这个 `b` 代表缓冲块，`h` 代表缓冲头，一个从上，一个从下。在这个过程中 `h` 被附上了属性，其中比较关键的是\
    \ `buffer` 所表示的数据 `b_data`，指向了上面的缓冲块。\n\n还有这个 `buffer` 的前后指针 `b_prev_free` 和 `b_next_free`。\n\
    \n那画成图如下。\n\n![](media/file130.webp \"fig:\")\n\n当缓冲头 `h` 的所有 `next` 和 `prev`\
    \ 指针都指向此时，就构成了一个双向链表。继续看。\n\n```\nvoid buffer_init(long buffer_end) {\n    ...\n\
    \    free_list = start_buffer;\n    free_list->b_prev_free = h;\n    h->b_next_free\
    \ = free_list;\n    ...\n}\n```\n\n这三行代码，结合刚刚的双向链表 `h`，画出图，你就懂了。\n\n![](media/file131.webp\
    \ \"fig:\")\n\n看，`free_list` 指向了缓冲头双向链表的第一个结构，就可以顺着这个结构，从双向链表中遍历到任何一个缓冲头结构，而通过缓冲头可以找到这个缓冲头对应的缓冲块。\n\
    \n简单说，缓冲头就是具体缓冲块的管理结构，而 `free_list` 开头的双向链表又是缓冲头的管理结构，整个管理体系就这样建立起来了。\n\n现在，从\
    \ `free_list` 开始遍历，就可以找到这里的所有内容了。\n\n不过，还有最后一个事，能帮助更好管理，往下看。\n\n```\nvoid buffer_init(long\
    \ buffer_end) {\n    ...\n    for (i=0;i<307;i++)\n        hash_table[i]=NULL;\n\
    }\n```\n\n一个 307 大小的 `hash_table` 数组，这是干嘛的？\n\n其实今天的这个代码在 `buffer.c` 中，而 `buffer.c`\
    \ 是 `fs` 包下的，也就是文件系统包下的。所以它今后为文件系统而服务，具体是内核程序如果需要访问块设备中的数据，都需要经过缓冲区来接地操作。\n\n\
    也就是说，读取块设备的数据（硬盘中的数据），需要先读到缓冲区中，如果缓冲区有了，就不用从块设备读取了，直接取走。\n\n那怎么知道缓冲区已经有了要读取的块设备中的数据呢？从双向链表从头遍历当然可以，但是效率可太低了。所以需要一个\
    \ hashmap 的结构方便查找，这就是 `hash_table` 这个数组的作用。\n\n现在只是初始化 `hash_table`，还并没有地方用到了它，所以我就先简单剧透下。\n\
    \n之后当要读取某个块设备上的数据时，首先要搜索相应的缓冲块，是下面这个函数。\n\n```\n#define _hashfn(dev,block)  (((unsigned)(dev^block))%307)\n\
    #define hash(dev,block) hash_table[_hashfn(dev,block)]\n\n// 搜索合适的缓冲块 \nstruct\
    \ buffer_head * getblk(int dev,int block) {\n    ...\n    struct buffer_head bh\
    \ = get_hash_table(dev,block)；\n    ...\n}\n\nstruct buffer_head * get_hash_table(int\
    \ dev, int block) {\n    ... \n    find_buffer(dev,block);\n    ...\n}\nstatic\
    \ buffer_head * find_buffer(int dev, int block) {\n    ...\n    hash(dev,block);\n\
    \    ...\n}\n```\n\n一路下来发现，就是通过 `dev^block % 307`（设备号^块号）找到 `hash_table` 里的下标，接下来和\
    \ Java 里的 `HashMap` 类似，如果哈希冲突形成链表，画成图就是这样。\n\n![](media/file132.webp \"fig:\"\
    )\n\n哈希表 + 双向链表，如果算法多了，很容易实现 LRU 算法，之后的缓冲区使用和弃用，正是这个算法发挥了作用。也就是之后在讲文件系统来读取硬盘时，都需要使用和弃用这个缓冲区里的内容，缓冲区是用户进程的内存和硬盘之间的桥梁。\n\
    \n好了，再多说几句文件系统读操作出来了，压力太大，本章主要就了解这个缓冲区的管理工作是如何化的，为后面做垫。回过头来看看目前的进度吧！\n\n```\n\
    void main(void) {\n    ...\n    mem_init(main_memory_start,memory_end);\n    trap_init();\n\
    \    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n    time_init();\n\
    \    sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n\
    \    sti();\n    move_to_user_mode();\n    if (!fork()) {init();}\n    for(;;)\
    \ pause();\n}\n```\n\n整个化的部分，就差 `hd_init` 和 `floppy_init` 这两个块初始化还没讲。\n\n而且幸运的是，`floppy_init`\
    \ 是软盘初始化，现在软盘几乎都被淘汰了，计算机中也没有软盘驱动器了，所以这个完全可以不看，那就剩下一个 `hd_init` 硬盘初始化，非常简单！\n\n\
    还记得小时候特别喜欢收集软盘，里面分门别类存上我做的 Flash 动画，然后在软盘上的那个纸标签写上文字，表示软盘存了什么，想想看还是回忆呢。扯远了。\n\n\
    之前的初始化工作建立的数据结构，会在后面模块发挥最核心的作用，任何操作都离不开这些初始化工作建立的数据结构，一定要把这些根搭建好，别急慌。等初始化工作全部完成，我会专门用一回梳理一下，大家就尽可能把初始化大部分的数据结构记在心里吧！\n\
    \n## 第20回 硬盘初始化 hd_init\n\n> 原文链接: [https://mp.weixin.qq.com/s/803C9jHxe42i9zEvPA](https://mp.weixin.qq.com/s/803C9jHxe42i9zEvPA)\n\
    \n接上回，上回咱们说到，`buffer_init` 完成了缓冲区初始化工作，内存中的缓冲区部分变成了这个样子。\n\n![](media/file133.webp\
    \ \"fig:\")\n\n而所有的缓冲头又被一个 `hash_table` 管理起来，以便查找。\n\n![](media/file134.webp \"\
    fig:\")\n\n至于缓冲区的这种管理怎么用，那等到后面文件系统中，如何读取一个块设备的数据，再展开讲解。\n\n今天，我们看 main 函数中最后两个初始化函数！\n\
    \n```\nvoid main(void) {\n    ...\n    mem_init(main_memory_start,memory_end);\n\
    \    trap_init();\n    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n\
    \    time_init();\n    sched_init();\n    buffer_init(buffer_memory_end);\n  \
    \  hd_init(); //本文重点\n    floppy_init(); \n    sti();\n    move_to_user_mode();\n\
    \    if (!fork()) {init();}\n    for(;;) pause();\n}\n```\n"
