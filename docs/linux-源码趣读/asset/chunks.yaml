  trans: "\n\n还有一种人，就是把这几讲的内容想得特别简单，这几讲确实就是复制硬盘数据和内存数据为主，但这就是操作系统呀！它就是不断通过这样简简单单的动作，把自己一点一点搞复杂的呢。\n\
    \n首先它靠 `BIOS` 做了第一步加载动作，然后就可以用加载的这 512 字节，去加载更多在硬盘中的代码和数据，那整个过程就自己把自己加载完整了，你不觉得这个过程也很伟大和奇妙么？会不会解答了你之前一直困惑的什么东西呢？\n\
    \n多想想，多看看每回的扩展部分和延伸部分。\n\n***\n\n## 第 5 回 进入保护模式前的最后一次折腾内存\n\n> 原文链接: [`mp.weixin.qq.com/s/5s_nmrWRZbA_4mkNKOQ2Cg`](https://mp.weixin.qq.com/s/5s_nmrWRZbA_4mkNKOQ2Cg)\n\
    \n书接上回，上回书咱们说到，操作系统已经完成了各种从硬盘到内存的加载，以及内存到内存的复制。\n\n![](img/file25.webp \"fig:\"\
    )\n\n至此，整个 `bootsect.s` 的使命就完成了，也是我们品读完的第一个操作系统源码文件。之后便跳转到了 `0x90200` 这个位置开始执行，这个位置处的代码就是位于\
    \ `setup.s` 的开头，我们接着来看。\n\n```\nstart:\n    mov ax,#0x9000  ; this is done in\
    \ bootsect already, but...\n    mov ds,ax\n    mov ah,#0x03    ; read cursor pos\n\
    \    xor bh,bh\n    int 0x10        ; save it in known place, con_init fetches\n\
    \    mov [0],dx      ; it from 0x90000.\n```\n\n又有个 `int` 指令。\n\n前面的文章好好看过的话，一下就能猜出它要干嘛。还记不记得之前有个\
    \ `int 0x13` 表示触发 `BIOS` 提供的读磁盘中断程序？这个 `int 0x10` 也是一样的，它也是触发 `BIOS` 提供的显示服务中断处理程序，而\
    \ `ah` 寄存器被赋值为 `0x03` 表示显示服务里具体的读取光标位置功能。\n\n具体 `BIOS` 提供了哪些中断服务，如何去调用和获取返回值，请大家自行寻找资料，这里只说结果。\n\
    \n这个 `int 0x10` 中断程序执行完毕并返回时，`dx` 寄存器里的值表示光标的位置，具体来说其高八位 `dh` 存储了行号，低八位 `dl` 存储了列号。\n\
    \n![](img/file26.webp \"fig:\")\n\n这里说明一下：计算机在加电自检后会自动初始化到文字模式，在这种模式下，一屏幕可以显示\
    \ 25 行，每行 80 个字符，也就是 80 列。\n\n那下一步 `mov [0],dx` 就是把这个光标位置存储在 `[0]` 这个内存地址处。注意，前面我们说过，这个内存地址仅仅是偏移地址，还需要加上\
    \ `ds` 这个寄存器里存储的段基址，最终的内存地址是在 `0x90000` 处，这里存放着光标的位置，以便之后在初始化控制台的时候用到。\n\n所以从这里也可以看出，这和我们平时调用一个方法没什么区别，只不过这里的寄存器的用法相当于入参和返回值，这里的\
    \ `0x10` 中断号相当于方法名。\n\n这里又应了之前说的一句话，操作系统内核的最开始也处处都是 `BIOS` 的调包侠，有现成的就用呗。\n\n再接下来的几行代码，都是和刚刚一样的逻辑，调用一个\
    \ `BIOS` 中断获取点什么信息，然后存储在内存中某个位置，我们迅速浏览一下就好咯。\n\n```\n比如获取内存信息。\n; Get memory size\
    \ (extended mem, kB)\n    mov ah,#0x88\n    int 0x15\n    mov [2],ax\n获取显卡显示模式。\n\
    ; Get video-card data:\n    mov ah,#0x0f\n    int 0x10\n    mov [4],bx      ;\
    \ bh = display page\n    mov [6],ax      ; al = video mode, ah = window width\n\
    检查显示方式并取参数\n; check for EGA/VGA and some config parameters\n    mov ah,#0x12\n\
    \    mov bl,#0x10\n    int 0x10\n    mov [8],ax\n    mov [10],bx\n    mov [12],cx\n\
    获取第一块硬盘的信息。\n; Get hd0 data\n    mov ax,#0x0000\n    mov ds,ax\n    lds si,[4*0x41]\n\
    \    mov ax,#INITSEG\n    mov es,ax\n    mov di,#0x0080\n    mov cx,#0x10\n  \
    \  rep\n    movsb\n获取第二块硬盘的信息。\n; Get hd1 data\n    mov ax,#0x0000\n    mov ds,ax\n\
    \    lds si,[4*0x46]\n    mov ax,#INITSEG\n    mov es,ax\n    mov di,#0x0090\n\
    \    mov cx,#0x10\n    rep\n    movsb\n```\n\n以上原理都是一样的。\n\n我们就没必要细琢磨了，对操作系统的理解作用不大，只需要知道最终存储在内存中的信息是什么，在什么位置，好了，之后会用到他们的。\n\
    \n| 内存地址 | 长度(字节) | 名称 |\n| --- | --- | --- |\n| 0x90000 | 2 | 光标位置 |\n| 0x90002\
    \ | 2 | 扩展内存数 |\n| 0x90004 | 2 | 显示 |\n| 0x90006 | 1 | 显示模式 |\n| 0x90007 | 1 |\
    \ 字符列数 |\n| 0x90008 | 2 | 未知 |\n| 0x9000A | 1 | 显示内存 |\n| 0x9000B | 1 | 显示状态 |\n\
    | 0x9000C | 2 | 显卡特性参数 |\n| 0x9000E | 1 | 屏幕行数 |\n| 0x9000F | 1 | 屏幕列数 |\n| 0x90080\
    \ | 16 | 硬盘 1 参数表 |\n| 0x90090 | 16 | 硬盘 2 参数表 |\n| 0x901FC | 2 | 根设备号 |\n\n（注：此处对应原文重复的表格内容，已按要求整理翻译）\n\
    \n由于之后就会用 c 语言进行编程，虽然汇编也可以用变量进行传递，但这需要编译器链接时做额外的工作，所以这么多数据方便共同约定一个内存地址，这里存，那里取。好了，把这些信息存储好，操作系统要做什么呢？继续看。\n\
    \n```\ncli\n```\n\n一行 `cli` 表示关闭中断。因为后面我们要原本是 `BIOS` 写好的中断表给覆盖掉，也就是破坏掉了，写上自己的中断表，所以这个时候是不允许中断来的。继续看。\n\
    \n```\n; first we move the system to its rightful place\n    mov ax,#0x0000\n\
    \    cld         ; 'direction'=0, movs forward\ndo_move:\n    mov es,ax      ;\
    \ destination segment\n    add ax,#0x1000\n    cmp ax,#0x9000\n    jz  end_move\n\
    \    mov ds,ax      ; source segment\n    sub di,di\n    sub si,si\n    mov cx,#0x8000\n\
    \    rep sw\n    jmp do_move\nend_move:\n    ...\n```\n\n看到后面那个 `rep sw` 熟悉了吗？一开始把操作系统从\
    \ `0x7c00` 移动到 `0x9000` 的时候用的指令，回忆一下。\n\n![](img/file27.webp \"fig:\")\n\n同前面的原理一样，也是做了内存操作，最终的结果是把地址\
    \ `0x1000` 处往一直到 `0x9000` 的内容，统统复制到内存的最开始，大概这么效果。\n\n![](img/file28.webp \"fig:\"\
    )\n\n由于各种加载和复制导致内存看起来乱，时候进行一波整理，我们重新梳理一下此时的内存布局。栈地址不再改变。`0x90000` 开始上的位置，原来是 `bootsect`\
    \ 和 `setup` 的代码，`bootsect` 的一部分已经被操作系统为了记录内存、显卡等临时数据覆盖了。内存最开始的 `0` 到 `0x8000`\
    \ 这 512K 被 `system` 模块给占用了，之前讲过，这个 `system` 模块除了 `bootsect` 和 `setup` 之外的全部链接在一起，可以理解为操作系统的全部。现在的内存布局就是这个样子。\n\
    \n![](img/file29.webp \"fig:\")\n\n好了，记住上面的图就好了，重新清晰了吗？之前的 `0x7c00` 已经是过去式，赶紧忘掉，向前看！接下来就要进行有点的工作了，那就是模式的转换，需要从现在的\
    \ 16 位的实模式转变为之后 32 位的保护模式，这是一项大工程！也是操作系统旅程中第一个精彩的地方，大家做好准备后面的世界越来越精彩，欲如何\n\n##\
    \ 扩展与延伸\n\n尝试在文本模式下，用直接写显存的方式把名字输出在屏幕上。实验源码到 GitHub 上寻找。\n\n***\n\n## 第 6 回 先解决寄存器的包袱\n\
    \n> 原文链接: [`mp.weixin.qq.com/s/p1a6QMpJF_uBSE1Kg`](https://mp.weixin.qq.com/s/p1a6QMpJF_uBSE1Kg)\n\
    \n书接上回，上回书咱们说到，操作系统又折腾了一下内存，之后的很一段时间内存布局就不会变了，终于稳定下了，目前样子。\n\n![](img/file30.webp\
    \ \"fig:\")\n\n0 地址开始处存放着操作系统的全部代码，也就是 `system` 模块，`0x90000` 位置处往后的几十个字节存放着设备，方便以后使用。\n\
    \n| 内存地址 | 长度(字节) | 名称 |\n| --- | --- | --- |\n| 0x90000 | 2 | 光标位置 |\n| 0x90002\
    \ | 2 | 扩展内存数 |\n| 0x90004 | 2 | 显示 |\n| 0x90006 | 1 | 显示模式 |\n| 0x90007 | 1 |\
    \ 字符列数 |\n| 0x90008 | 2 | 未知 |\n| 0x9000A | 1 | 显示内存 |\n| 0x9000B | 1 | 显示状态 |\n\
    | 0x9000C | 2 | 显卡特性参数 |\n| 0x9000E | 1 | 屏幕行数 |\n| 0x9000F | 1 | 屏幕列数 |\n| 0x90080\
    \ | 16 | 硬盘 1 参数表 |\n| 0x90090 | 16 | 硬盘 2 参数表 |\n| 0x901FC | 2 | 根设备号 |\n\n是不是十分清晰？不过别高兴得太早，清爽的内存布局方便后续操作系统的大显身手！接下来就要进行真正的第一项大工程了，那就是模式的转换，需要从现在的\
    \ 16 位的实模式转变为之后 32 位的保护模式。\n\n当然，虽说是一项非常难啃的大工程，但从代码量看，却是少得可怜，所以不必太过担心。每次讲这里都十分的麻烦，因为这是\
    \ `x86` 的历史包袱问题，现在的 CPU 几乎都是支持 32 位模式甚至 64 位模式了，很少有还停留在 16 位的实模式下的 CPU。\n\n"
