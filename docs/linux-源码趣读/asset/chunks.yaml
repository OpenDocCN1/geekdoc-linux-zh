    \n```\n[](#cb201-1)struct hd_i_struct {\n[](#cb201-2)    // 磁头数、每磁道扇区数、柱面数、写前预补偿柱面号、磁头着陆区柱面号、控制字节\n\
    [](#cb201-3)    int head,sect,cyl,wpcom,lzone,ctl;\n[](#cb201-4)};\n[](#cb201-5)struct\
    \ hd_i_struct hd_info[] = {}；\n```\n\n最终效果就是这样。\n\n![](media/file227.webp \"fig:\"\
    )\n\nOK，我们继续。\n\n看第二部分，硬盘分区表的设置。\n\n```\n[](#cb202-1)static struct hd_struct {\n\
    [](#cb202-2)    long start_sect;\n[](#cb202-3)    long nr_sects;\n[](#cb202-4)}\
    \ hd[5] = {}\n[](#cb202-5)\n[](#cb202-6)int sys_setup(void * BIOS) {\n[](#cb202-7)\
    \    ...\n[](#cb202-8)    hd[0].start_sect = 0;\n[](#cb202-9)    hd[0].nr_sects\
    \ = \n[](#cb202-10)        hd_info[0].head * hd_info[0].sect * hd_info[0].cyl;\n\
    [](#cb202-11)    struct buffer_head *bh = bread(0x300, 0);\n[](#cb202-12)    struct\
    \ partition *p = 0x1BE + (void *)bh->b_data;\n[](#cb202-13)    for (int i=1;i<5;i++,p++)\
    \ {\n[](#cb202-14)        hd[i].start_sect = p->start_sect;\n[](#cb202-15)   \
    \     hd[i].nr_sects = p->nr_sects;\n[](#cb202-16)    }\n[](#cb202-17)    brelse(bh);\n\
    [](#cb202-18)    ...\n[](#cb202-19)}\n```\n\n只看最终效果，就是给 hd 数组的五项附上了值。\n\n![](media/file228.png\
    \ \"fig:\")\n\n这表示硬盘的分区信息，每个分区用 **start_sect** 和 **nr_sects**，也就是开始扇区和总扇区数来记录。\n\
    \n这些信息是从哪里获取的呢？就是在硬盘的第一个扇区的 0x1BE 偏移处，这里存储着该硬盘的分区信息，只要把这个地方的数据拿到就 OK 了。\n\n所以\
    \ bread 就是干这事的，从硬盘读取数据。\n\n```\n[](#cb203-1) struct buffer_head *bh = bread(0x300,\
    \ 0);\n```\n\n第一个参数 0x300 是第一块硬盘的主设备号，就表示要读取的块设备是硬盘一。第二个参数 0 表示读取第一个块，一个块为 1024\
    \ 字节大小，也就是连续读取硬盘开始处 0 ~ 1024 字节的数据。\n\n拿到这部分数据后，再取 0x1BE 偏移处，就得到了分区信息。\n\n```\n\
    [](#cb204-1)struct partition *p = 0x1BE + (void *)bh->b_data;\n```\n\n就这么点事。\n\
    \n![](media/file229.webp \"fig:\")\n\n至于如何从硬盘中读取指定位置（块）的数据，也就是 **bread** 函数的内部实现，那是相当复杂的，涉及到与缓冲区配合的部分，还有读写请求队列的设置，以及中断。\n\
    \n当然，这个函数就是经典的问题，**从硬盘中读取数据的原理**，但这些都不影响主流程，因为仅仅是把硬盘某位置的数据读到内存而已，先不去深入细节，细节部分将在第五部分展开说明。\n\
    \nOK，目前我们已经把硬盘的基本信息存入了 hd_info[]，把硬盘的分区信息存入了 hd[]，我们继续往下看。\n\n```\n[](#cb205-1)int\
    \ sys_setup(void * BIOS) {\n[](#cb205-2)    ...\n[](#cb205-3)    rd_load();\n\
    [](#cb205-4)    mount_root();\n[](#cb205-5)    return (0);\n[](#cb205-6)}\n```\n\
    \n就剩两个函数了。\n\n其中 **rd_load** 是当有 ramdisk 时，也就是虚拟内存盘，才会执行。虚拟内存盘是通过软件将一部分内存（RAM）模拟为硬盘来使用的一种技术，一种小玩法而已，我们就先当做没有，否则很影响看主流程的心情。\n\
    \n**mount_root** 直译过来就是**加载根**，再多说几个字是**加载根文件系统**，有了它之后，操作系统才能从一个根开始找到所有存储在硬盘中的文件，所以它是文件系统的基石，很重要。\n\
    \n为了加载根文件系统，或者说所谓的加载根文件系统，就是把硬盘中的数据加载到内存里，以文件系统的数据格式来解读这些信息。\n\n所以第一，需要硬盘本身就有文件系统的信息，硬盘不能是裸盘，这个不归操作系统管，你为了启动我的\
    \ Linux 0.11，必须拿来一块做好了文件系统的硬盘来。\n\n第二，需要读取硬盘的数据到内存，那就必须需要知道硬盘的参数信息，这就是我们本讲所做的事情的意义。\n\
    \n欲知后事如何，且听下回分解。\n\n* * *\n\n## 第32回 | 加载根文件系统"
