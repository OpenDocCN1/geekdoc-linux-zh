  trans: "\n\n按下键盘后，一系列代码将我们的字符放入了 `secondary` 队列中，然后呢？\n\n这就涉及到上层进程调用终端的读函数，将这个字符取走了。\n\
    \n上层经过库函数、文件系统函数等，最终会调用到 `tty_read` 函数，将字符从 `secondary` 队列里取走。\n\n```c\n// tty_io.c\n\
    int tty_read(unsigned channel, char * buf, int nr) {\n    ...\n    GETCH(tty->secondary,c);\n\
    \    ...\n}\n```\n\n取走后要干嘛，那就是上层应用程序去决定的事情了。\n\n假如要写到控制台终端，那上层应用程序又会经过库函数、文件系统函数等层层调用，最终调用到\
    \ `tty_write` 函数。\n\n```c\n// tty_io.\nint tty_write(unsigned channel, char *\
    \ buf, int nr) {\n    ...\n    PUTCH(c,tty->write_q);\n    ...\n    tty->write(tty);\n\
    \    ...\n}\n```\n\n这个函数首先会将字符 `c` 放入 `write_q` 这个队列，然后调用 `tty` 里设定的 `write` 函数。\n\
    \n终端控制台这个 `tty` 我们之前说了，初始化的 `write` 函数是 `con_write`，也就是 `console` 的写函数。\n\n```c\n\
    // console.c\nvoid con_write(struct tty_struct * tty) {\n      ...\n}\n```\n\n\
    这个函数在[第 16 回 | 控制台初始化 tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect)\
    \ 提到了，最终会配合显卡，在我们的屏幕上输出我们给出的字符。\n\n![](img/file298.webp \"fig:\")\n\n那我们的图又可以补充了。\n\
    \n![](img/file299.webp \"fig:\")\n\n核心点就是三个队列 `read_q`、`secondary` 以及 `write_q`。\n\
    \n其中 `read_q` 是键盘按下按键后，进入 `keyboard_interrupt` 程序里最终通过 `putch` 函数放入 `read_q` 队列。`secondary`\
    \ 是 `read_q` 队列里的字符，通过 `copy_to_cooked` 函数经过一定的 `termios` 规范处理后，处理后的字符就是“熟”（所以叫\
    \ `cooked`，是不是形象？）。然后进程通过 `tty_read` 从 `secondary` 里读，通过 `tty_write` 写入 `write_q`，最终\
    \ `write_q` 中的字符可以通过 `con_write` 控制台函数打印在显示器上。\n\n这就完成了从键盘输入到显示器的一个循环，也就是本讲述的内容。好了，现在我们已经做到把这样一个字符串并显示在显示器上了。\n\
    \n```bash\n[root@linux0.1] cat info.txt | wc -l\n```\n\n接下来，`shell` 程序是如何读入这个字符串，读入后又是怎么处理的？欲知后事分解。\n\
    \n## 第 43 回 | shell 程序读取你的命令\n\n原文链接: http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502944&idx=1&sn=cf2601b3a4bc3f89d7a517bf7fd588&chksm=c25b6cdf23fdb306af52e993bb64df01bffa3c3e6fa556b7ddd77a42fc5eb\n\
    \n新建一个非常简单的 `info.txt` 文件。\n\n```text\nname:flash\nage:28\nlanguage:java\n```\n\
    \n在命令行输入一条简单的命令。\n\n```bash\n[root@linux0.1] cat info.txt | wc -l\n3\n```\n\n\
    这条命令的意思是读取刚刚的 `info.txt` 文件，输出它的行数。[在上一回](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502876&idx=1&sn=2c3449abd6ea14c9c7ccc3d2d9827c1&chksm=c5b6b1f5b23fa7df9c3e2bf81b84da937d0a2c9825ceba8a57c23e8e157)，我们详细解读了从键盘敲击这个命令，到屏幕上显示这个命令，中间发生的事情。\n\
    \n![](img/file300.webp \"fig:\")\n\n那今天，我们接着往下走，下一步就是 `shell` 程序如何读取你输入的这条命令。这里我们需要知道两件事情：\n\
    \n1. 我们键盘输入的字符，此时已经到达了控制终端 `tty` 结构中的 `secondary` 队列里。\n2. `shell` 程序将通过上层的 `read`\
    \ 函数调用，来读取这些字符。\n\n```c\n// xv6-public sh.c\nint main(void) {\n    static char\
    \ buf[100];\n    // 读取命令\n    while(getcmd(buf, sizeof(buf)) >= 0){\n        //\
    \ 创建新进程\n        if(fork() == 0)\n            // 执行命令\n            runcmd(parsecmd(buf));\n\
    \        // 等待进程退出\n        wait();\n    }\n}\n\nint getcmd(char *buf, int nbuf)\
    \ {\n    ...\n    gets(buf, nbuf);\n    ...\n}\n\nchar* gets(char *buf, int max)\
    \ {\n    int i, cc;\n    char c;\n    for(i=0; i+1 < max; ){\n      cc = read(0,\
    \ &c, 1);\n      if(cc < 1)\n            break;\n      buf[i++] = c;\n      if(c\
    \ == '\\n' || c == '\\r')\n            break;\n    }\n    buf[i] = '\\0';\n  \
    \  return buf;\n}\n```\n\n"
- fmt: "\n```c\n// tty_io.c\n// channel=0, nr=1\nint tty_read(unsigned channel, char\
    \ * buf, int nr) {\n    struct tty_struct * t = &tty_table[channel];\n    char\
    \ c, * b=buf;\n    while (nr>0) {\n        ...\n        if (EMPTY(tty->secondary)\
    \ ...) {\n            sleep_if_empty(&tty->secondary);\n            continue;\n\
    \        }\n        do {\n            GETCH(tty->secondary,c);\n            ...\n\
    \            put_fs_byte(c,b++);\n            if (!--nr) break;\n        } while\
    \ (nr>0 && !EMPTY(tty->secondary));\n        ...\n    }\n    ...\n    return (b-buf);\n\
    }\n```\n\n入参有三个参数，非常简单。\n\n`channel` 为 0，表示 `tty_table` 里的控制台终端这个具体的设备。`buf` 是我们要读取的数据拷贝到内存的位置指针，也就是用户缓冲区指针。`nr`\
    \ 为 1，表示我们要读出 1 个字符。\n\n整个方法，其实就是不断从 `secondary` 队列里取出字符，然后放入 `buf` 所指向的内存。\n\n\
    如果要读取的字符数 `nr` 被减为 0，说明已经完成了读取任务，或者说 `secondary` 队列为空，说明不论你任务完没完成我都没有字符让你继续读了，那此时调用\
    \ `sleep_if_empty` 将线程**阻塞**，等待被唤醒。\n\n其中 `GETCH` 就是个宏，改变 `secondary` 队列的队头队尾指针，你自己写个队列数据结构，也是这样的操作，不再展开讲解。\n\
    \n```c\n#define GETCH(queue,c)  \\\n(void)({c=(queue).buf[(queue).tail];INC((queue).tail);})\n\
    ```\n\n同理，判空逻辑就更为简单了，就是队列头尾指针是否相撞。\n\n```c\n#define EMPTY(a)  ((a).head ==  (a).tail)\n\
    ```\n\n理解了这些小细节之后，再明白一行关键的代码，整个 `read` 到 `tty_read` 这条线就完全可以想明白了。那就是队列为空，即不满足继续读取条件的时候，让进程阻塞的\
    \ `sleep_if_empty`，我们看看。\n\n```c\nsleep_if_empty(&tty->secondary);\n\n// tty_io.c\n\
    static void sleep_if_empty(struct tty_queue * queue) {\n    cli();\n    while\
    \ (!current->signal && EMPTY(*queue))\n        interruptible_sleep_on(&queue->proc_list);\n\
    \    sti();\n}\n\n// sched.c\nvoid interruptible_sleep_on(struct task_struct **p)\
    \ {\n    struct task_struct *tmp;\n    ...\n    tmp=*p;\n    *p=current;\nrepeat:\
    \ current->state = TASK_INTERRUPIBLE;\n    schedule();\n    if (*p && *p != current)\
    \ {\n        (**p).state=0;\n        goto repeat;\n    }\n    *p=tmp;\n    if\
    \ (tmp)\n        tmp->state=0;\n}\n```\n\n我们先只看一句关键的代码，就是当前进程的状态设置为等待。\n\n```c\n\
    current->state = TASK_INTERRUPIBLE;\n```\n\n那么执行到进程调度时，当前进程不会被调度，也就阻塞了。不熟悉调度的同学可以复习一下设计调度。\n\
    \n进程被调度了，什么时候唤醒呢？当我们再次按下键盘，使得 `secondary` 队列中有字符，也就打破了为空条件，此时应该将之前的进程唤醒。\n\n```c\n\
    // tty_io.c\nvoid do_tty_interrupt(int tty) {\n    copy_to_cooked(tty_table+tty);\n\
    }\nvoid copy_to_cooked(struct tty_struct * tty) {\n    ...\n    wake_up(&tty->secondary.proc_list);\n\
    }\n```\n\n可以看到，在 `copy_to_cooked` 里，将 `read_q` 队列中的字符处理后放入 `secondary` 队列中的最后一步，就是唤醒\
    \ `wake_up` 这个队列里的等待进程。\n\n`wake_up` 函数更为简单，就是修改一下状态，使其变成运行的状态。\n\n```c\n// sched.c\n\
    void wake_up(struct task_struct **p) {\n    if (p && *p) {\n        (**p).state=0;\n\
    \    }\n}\n```\n\n总体流程就是这个样子的。当然，进程的阻塞与唤醒是个体系，还有很多细节，我们下一回再展开这部分。\n\n## 第44回 |\
    \ 进程的阻塞与唤醒\n\n新建一个非常简单的 `info.txt` 文件。\n\n```text\nname:flash\nage:28\nlanguage:java\n\
    ```\n\n在命令行输入一条十分简单的命令。\n\n```bash\nroot@linux0.11 cat info.txt | wc -l\n3\n```\n\
    \n这条命令的意思是读取刚刚的 `info.txt` 文件，输出它的行数。\n\n在上一回中，我们分析了一下 `shell` 进程是如何读取你的命令的，流程如下。当然，这里的\
    \ `sleep_on` 和 `wake_up` 是进程的阻塞与唤醒机制的实现，我们没有展开讲解。\n\n今天就详细看看这块的逻辑。首先，表示进程的数据结构是\
    \ `task_struct`，其中有一个 `state` 字段表示进程的状态，它在 Linux 0.11 里有五种枚举值。\n\n```c\n// shed.h\n\
    #define TASK_RUNNING 0  // 运行态\n#define TASK_INTERRUPIBLE 1  // 可中断等待状态。\n#define\
    \ TASK_UNINTERTIBLE 2  // 不中断等待状态\n#define TASK_ZOMBIE 3  // 僵死状态\n#define TASK_STOPPED\
    \ 4  // 停止\n```\n\n当进程首次被创建时，也就是 `fork` 函数执行后，它的初始状态是 0，也就是运行态。\n\n```c\n// system_call.s\n\
    _sys_fork:\n    ...\n    call _copy_process\n    ...\n\n// fork.c\nint copy_process(...)\
    \ {\n    ...\n    p->state = TASK_RUNNING;\n    ...\n}\n```\n\n只有当处于运行态的进程，才会被调度机制选中，送入\
    \ CPU 开始执行。\n\n```c\n// sched.c\nvoid schedule (void) {\n    ...\n    if ((*p)->state\
    \ == TASK_RUNNING && (*p)->counter > c) {\n        ...\n        next = i;\n  \
    \  }\n    ...\n    switch_to (next);\n}\n```\n\n以上简单列出了关键代码，可以描绘进程调度的大体框架。不熟悉的朋友请回顾设计调度。\n\
    \n使得一个进程阻塞的方法非常简单，并不需要魔法，只需要将其 `state` 字段变成非 `TASK_RUNNING` 态，即可让它暂时被 CPU 调度，达到了阻塞的效果。同样，唤醒也非常简单，将对应进程的\
    \ `state` 字段变成 `TASK_RUNNING`。Linux 0.11 中的阻塞与唤醒，就是 `sleep_on` 和 `wake_up` 函数。其中\
    \ `sleep_on` 函数将 `state` 变为 `TASK_INTERRUPIBLE`。\n\n```c\n// sched.c\nvoid sleep_on\
    \ (struct task_struct **p) {\n    struct task_struct *tmp;\n    ...\n    tmp =\
    \ *p;\n    *p = current;\n    current->state = TASK_INTERRUPIBLE;\n    schedule();\n\
    \    if (tmp)\n        tmp->state = 0;\n}\n```\n\n而 `wake_up` 函数将 `state` 变回 `TASK_RUNNING`，也就是\
    \ 0。\n\n```c\n// sched.c\nvoid wake_up(struct task_struct **p) {\n    (**p).state\
    \ = 0;\n}\n```\n\n是不是非常简单？当然 `sleep_on` 函数除了改变 `state` 之外，还有些难理解的操作，我们先分析一下。当首次调用\
    \ `sleep_on` 函数时，比如 `tty_read` 在 `secondary` 队列为空时调用 `sleep_on`，传入的 `p` 为 `NULL`，因为此时还没有等待\
    \ `secondary` 队列的任务。\n\n```c\nstruct tty_queue {\n    ...\n    struct task_struct\
    \ * proc_list;\n};\nstruct tty_struct {\n    ...\n    struct tty_queue secondary;\n\
    };\n\nint tty_read(unsigned channel, char * buf, int nr) {\n    ...\n    sleep_if_empty(&tty->secondary);\n\
    \    ...\n}\n\nstatic void sleep_if_empty(struct tty_queue * queue) {\n    ...\n\
    \    interruptible_sleep_on(&queue->proc_list);\n    ...\n}\n```\n\n通过 `tmp =\
    \ *p` 和 `*p = current` 两个赋值操作，此时：`tmp = NULL`\n`*p = 当前任务`\n同时也使得 `proc_list`\
    \ 指向了当前任务的 `task_struct`。\n\n当另一个进程调用了 `tty_read` 读取了同一个 `tty` 数据时，就需要再次 `sleep_on`，此时携带的\
    \ `*p` 就是一个指向了之前的“当前任务”的结构体。经过 `tmp = *p` 和 `*p = current` 两个赋值操作，会变成这个样子。也就是说，通过每一个当前任务所在的代码块中的\
    \ `tmp` 变量，总能找到上一个正在等待资源的进程，因此也就形成了一个链表。\n\n当某进程调用了 `wake_up` 函数唤醒 `proc_list`\
    \ 上指向的第一个任务时，该任务会在 `sleep_on` 函数执行完 `schedule()` 后被唤醒并执行下面的代码，把 `tmp` 指针指向的上一个任务同样唤醒。\n\
    \n```c\n// sched.c\nvoid sleep_on (struct task_struct **p) {\n    struct task_struct\
    \ *tmp;\n    ...\n    tmp = *p;\n    *p = current;\n    current->state = TASK_UNINTERTIBLE;\n\
    \    schedule();\n    if (tmp)\n        tmp->state = 0;\n}\n```\n\n永远记住，唤醒其实就是把\
    \ `state` 变成 0 而已。而上一个进程唤醒后，和这个被唤醒的进程一样，也会走过它自己的 `sleep_on` 函数的后半段，把它的上一个进程，也就是上上一个进程唤醒。那么上上一个进程，又会唤醒上上上一个进程，上上上一个进程，又会...看懂了没。\n"
