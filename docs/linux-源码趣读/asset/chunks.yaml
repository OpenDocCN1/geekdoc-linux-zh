    也就是上述函数中的 `runcmd`。首先 `parsecmd` 函数会将读取 `buf` 的字符串做解析，生成一个 `cmd` 结构的变量传入 `runcmd`
    函数中。


    ```

    [](#cb338-1)// xv6-public sh.c

    [](#cb338-2)void runcmd(struct cmd *cmd) {

    [](#cb338-3)    ...

    [](#cb338-4)    switch(cmd->type) {

    [](#cb338-5)        ...

    [](#cb338-6)        case EXEC:

    [](#cb338-7)        ecmd = (struct exemd*)cmd;

    [](#cb338-8)        ...

    [](#cb338-9)        exec(ecmd->argv[0], ecmd->argv);

    [](#cb338-10)        ...

    [](#cb338-11)        break;

    [](#cb338-12)        ...

    [](#cb338-13)        case REDIR:

    [](#cb338-14)        case LIST: ...

    [](#cb338-15)        case PIPE: ...

    [](#cb338-16)        case BACK: ...

    [](#cb338-17)    }

