    # 操作系统大完结


    > 原文链接: [https://mp.weixin.qq.com/s/eWrNCtkirUu-1YsetR30Kg](https://mp.weixin.qq.com/s/eWrNCtkirUu-1YsetR30Kg)


    我通过前四个部分，从计算机开机后执行的第一行代码，一直讲到整个操作系统达到怠速状态，由 shell 程序循环接收用户的命令并执行。当然，是用最简单的 Linux
    0.11 版本的源码进行的讲解。


    我又通过第五部分，以一条 shell 程序的执行过程，再次从另一条线串联起了操作系统各个模块的运作与协同。


    读完本系列，你应该有一种，**原来操作系统真的是可以这样一行代码一行代码地叠加出一个完整的体系和功能**，就像你亲眼看着一个楼房一砖一瓦地建立起来一样，有一种
    **踏实感**


    当然这个系列也有明显的不足，就是没有从宏观视角来看整个操作系统的运作，没有从抽象角度来解读操作系统各个模块的作用，更是缺少了现代操作系统的诸多思想和细节。


    但是，本系列对于达到上述那种踏实感的目的，已经足够了。


    我现在也还没有水平去抽象，因为我缺少横向和纵向的对比，横向就是除了 Linux 还有 Window，xv6 等操作系统，纵向就是高版本 Linux 系统。有了这些才有能力去从更高的，更抽象的角度来审视操作系统的思想，我的路还很长。


