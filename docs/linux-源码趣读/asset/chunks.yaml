    \ block) { \n[](#cb114-18)    ... \n[](#cb114-19)    hash(dev,block);\n[](#cb114-20)\
    \    ...\n[](#cb114-21)}\n```\n\n一路跟下来发现，就是通过\n\n**dev^block % 307**\n\n即\n\n\
    **(设备号^逻辑块号) Mod 307**\n\n找到在 hash_table 里的索引下标，接下来就和 Java 里的 HashMap 类似，如果哈希冲突就形成链表，画成图就是这样。\n\
    \n![](media/file132.webp \"fig:\")\n\n**哈希表 + 双向链表**，如果刷算法题多了，很容易想到这可以实现 **LRU\
    \ 算法**，没错，之后的缓冲区使用和弃用，正是这个算法发挥了作用。\n\n也就是之后在讲通过文件系统来读取硬盘文件时，都需要使用和弃用这个缓冲区里的内容，缓冲区即是用户进程的内存和硬盘之间的桥梁。\n\
