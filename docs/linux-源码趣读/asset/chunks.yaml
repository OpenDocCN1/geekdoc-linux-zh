    # Interesting Reading of Linux Source Code


    ## Opening Remarks


    > Original link: [`mp.weixin.qq.com/s/tvbkGLfhDq03xxM-FZ4zuA`](https://mp.weixin.qq.com/s/tvbkGLfhDq03xxM-FZ4zuA)


    Core information is summarized at the beginning to save everyone time.


    **What to do**: Write a series.


    **Purpose**: To lead everyone through digesting the Linux `0.11` core code and
    the design philosophy of operating systems.


    **What to call it**: You call this junk OS source code — Reading Linux 0.11 core
    code like a novel.


    **Posting schedule**: Every Monday and Thursday.


    **Expected chapters**: 60 parts.


    **Interaction**: WeChat group (joining method at the end of the article).


    ## Overall Series Layout


    Part 1: Drudgery before entering the kernel

    Part 2: Initialization work during the early stage of the battle

    Part 3: The birth of a new process

    Part 4: The arrival of the shell program

    Part 5: How various OS modules operate through the execution of a command

    Part 6: Operating system philosophy and ideas


    ![](img/img640 "fig:")


    OK, those are the important things to say; below is the verbose part.


    Every programmer has a dream of an operating system, and the OS is also a psychological
    knot for every programmer.


    Having a rough, superficial understanding of OS knowledge is no longer sufficient
    to satisfy the taste of today''s programmers. However, deeply analyzing an OS
    is something that most programmers find terrifying. If one were to read the entire
    OS source code, it would be absolutely life-threatening.


    In fact, OS source code isn''t that scary. But why does even Linux `0.11`, which
    has the smallest amount of code, still scare many people away?


    ## Why are people deterred?


    Actually, many excellent OS books use the classic Linux `0.11` version as the
    research object for explanation, such as *The Art of Linux Kernel Development*
    and *Linux Kernel Process*. But let''s think about this: when we read a novel,
    why can even a massive tome be read through from start to finish with such enjoyment?


    Before answering this question directly, let''s look at the very beginning of
    *Demi-God Condor and Semi-Devils*.


    > A blue light flickered as a green steel sword suddenly lunged, pointing at the
    left shoulder of the middle-aged man. The young swordsman did not wait for a move;
    his wrist shook, tilting the sword diagonally, and the blade already sliced toward
    the man''s right neck. The middle-aged man...


    Remember that feeling? Now let''s look at the beginning of *The Art of Linux Kernel
    Development*.


    > For an operating system, stable and reliable operation is the most important.
    The current technical solution is to separate user processes from each other,
    and user processes from the operating system. The OS can manage user processes,
    but user processes cannot interfere with each other...


    Alright, no need to read further. This sentence seems far-sighted and visionary
    in helping us organize the OS architecture from a macro perspective, but for someone
    who doesn''t understand the OS yet, they have no idea what it''s saying—it only
    serves as a deterrent.


    **Although ideas are important, if you force an elevation of thought without any
    accumulation of details, you won''t get anywhere; it''s better to maintain a state
    of a blank paper.**


    In contrast, the beginning of *Demi-God Condor and Semi-Devils* doesn''t even
    have the names of characters, let alone organize the entire architecture. It starts
    directly with a brilliant scene, letting you quickly enter the plot.


    But readers who have finished the entire novel can recount the characters'' details
    by heart, seeing the scenery of Dali as if they had seen it with their own eyes,
    and feeling the intensity of the conflict between the Song and Liao dynasties.


    Why is it like this? Because all love, hate, passion, and national conflicts are
    perceived by us through the portrayal of individual characters and events. **Only
    the knowledge you perceive yourself and the conclusions you summarize yourself
    truly belong to you.**


    Those attempts to try and clarify the entire outline right from the start are
    futile for beginners. Even if they memorize it by rote, it is ultimately not their
    own knowledge, and they cannot empathize with it.


    In my process of learning operating systems, I had this same feeling. I tried
    many times to view the OS knowledge system from a God''s eye view, following the
    overall logic of the OS from a macro level with massive tomes, and I found every
    time ended in failure.


    But when I put down the burden and read the Linux source code with the mindset
    of reading a novel, I found I never thought about organizing a system. However,
    starting from a single line of code, the entire structure of the OS appeared clearly
    before me. And I also clearly clearly how such a system was built up step by step.


    ## Operating System Philosophy and Ideas


    How to share it? It''s not that the book *The Art of Linux Kernel Development*
    is not good, but I want to use the mindset and method of writing a novel to tell
    the source code of Linux `0.11` from start to finish.


    You call this junk OS source code — Reading Linux 0.11 core code like a novel.


    ## Part 1: Drudgery before entering the kernel


    ### Chapter 1: The first two lines of code


    > Original link: [`mp.weixin.qq.com/s/LIsqRX51W7d_yw-HN-s2DA`](https://mp.weixin.qq.com/s/LIsqRX51W7d_yw-HN-s2DA)


    Starting from this article, the fantastic journey into the operating system begins!
    Don''t worry, the content of each chapter will be short, and don''t learn with
    a burden; just read along chapter by chapter like a novel.


    Getting straight to the point. The moment you press the power button, the `BIOS`
    on the motherboard copies the 512 bytes of the boot sector from the hard drive
    to the `0x7c00` position in memory, and jumps there.


    The definition of the boot sector is very simple: the last two bytes of the 512
    bytes on the hard drive are `0x55` and `0xaa`, so the `BIOS` considers it the
    boot sector. For OS developers, the starting code of the OS is stored in `bootsect.s`.


    Linux `0.11`''s starting code is written in assembly and is compiled into a binary
    file placed in the boot sector. Subsequently, as mentioned, the `BIOS` moves it
    to the memory address `0x7c00`, and the CPU executes from this location.


    ```

    mov ax,0x7c0

    mov ds,ax

    ```


    These two lines are written in assembly, meaning copy the value `0x7c0` into the
    `ax` register, then copy the value of the `ax` register into the `ds` register.
    The result is that the value of the `ds` register becomes `0x07c0`.


    `ds` is a 16-bit register representing a segment register, used as a base in memory
    addressing. When we write memory addresses in assembly, we are actually writing
    offsets. For example:


    ```

    mov ax, [0001]

    ```


    Equivalent to:


    ```

    mov ax, [ds:0001]

    ```


    `ds` is the default added base, and `0001` is the offset address. `ds` is assigned
    `0x07c0`, and because `x86` accesses 20-bit addresses in 16-bit real mode, the
    segment base is shifted left by four bits. `0x07c0` shifted left by four bits
    is `0x7c00`, which is exactly the same as the memory address where the code was
    loaded by the `BIOS`. That is, memory addresses accessed in the code hereafter
    default add `0x7c00` to search memory.


    Why consistently add the number `0x7c00`? This is easy to explain: the `BIOS`
    specifies loading the OS code into memory `0x7c00`, so all data within it is naturally
    offset; thus setting the segment register `ds` to this value makes it easy to
    access memory data using this base later.


    ## Chapter 2: Moving yourself around


    > Original link: [`mp.weixin.qq.com/s/U-txDYt0YqLh5EeFOcB4NQ`](https://mp.weixin.qq.com/s/U-txDYt0YqLh5EeFOcB4NQ)


    This chapter discusses how to use the `mov` instruction to change the default
    data segment register `ds` value to `0x07c0`, for the sake of base-based addressing.


