  trans: "\n\n然后 `copy_process`，就是复制进程。\n\n那妥了，这个方法的意思非常简单，因为存储进程的数据结构是一个 `task[64]`\
    \ 数组，这个是在之前 [第 18 回 | 大名鼎鼎的进程调度就是从这里开始的](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c68c2b03d9721ba74e949cfa8&chksm=c2c5b87df5b2316b083015a4fdba2df29211f38fcfd1cdb040e02ab410432608e26383a43ef5&scene=21#wechat_redirect)\
