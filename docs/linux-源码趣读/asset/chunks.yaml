- fmt: "\n```\nint do_execve(...) {\n    // 检查文件类型和权限等\n    ...\n    // 读取文件的第一块数据到缓冲区\n\
    \    ...\n    // 如果是脚本文件，走这里\n    if (脚本文件判断逻辑) {\n        ...\n    }\n    //\
    \ 如果是可执行文件，走这里\n    // 一堆校验可执行文件是否能执行的判断\n    ...\n    // 进程管理结构的调整\n    ...\n\
    \    // 释放进程占有的页面\n    ...\n    // 调整线性地址空间、参数列表、堆栈地址等\n    ...\n    // 设置 eip\
    \ 和 esp，这里是 execve 变身大法的关键！\n    eip[0] = ex.a_entry;\n    eip[3] = p;\n    return\
    \ 0;\n    ...\n}\n```\n\n整理起来的步骤就是。\n\n1. 检查文件类型和权限等\n2. 读取文件的第一块数据到缓冲区\n3. 脚本文件与可执行文件的判断\n\
    4. 校验可执行文件是否能执行\n5. 进程管理结构的调整\n6. 释放进程占有的页面\n7. 调整线性地址空间、参数列表、堆栈地址等\n8. 设置 eip\
    \ 和 esp，完成摇身一变\n\n如果去掉一些逻辑校验和判断，那核心逻辑就是**加载文件**、**调整内存**、**开始执行**三个步骤，由于这些部分的内容已经非常复杂了，所以我们就去掉那些逻辑校验的部分，直接挑主干逻辑进行讲解，以便带大家认清\
    \ `execve` 的本质。\n\n走你~\n\n### 读取文件开头 1KB 的数据\n\n先是根据文件名，找到并读取文件里的内容\n\n```\n//\
    \ exec.c\nint do_execve(...) {\n    ...\n    // 根据文件名 /bin/sh 获取 inode\n    struct\
    \ m_inode * inode = namei(filename);\n    // 根据 inode 读取文件第一块数据（1024KB）\n    struct\
    \ buffer_head * bh = bread(inode->i_dev,inode->i_zone[0]);\n    ...\n}\n```\n\
    很简单，就是读取了文件（`/bin/sh`）第一个块，也就是 1KB 的数据，\n\n在[第32回 | 加载根文件系统](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502181&idx=1&sn=b6dcbd1d2cf930002852008a1c4e6a65&chksm=c2c5b3c8f5b23ade1532b725995dbc3b0138202555e44a6e308b84d668a2ef3041eb5cf77f86&scene=21#wechat_redirect)\
    \ 里说过文件系统的结构，所以代码里 `inode -> i_zone[0]` 就刚好是文件开头的 1KB 数据。\n\n![](media/file248.webp\
    \ \"fig:\")\n\nOK，现在这 1KB 的数据，就已经在内存中了，但还没有解析。\n\n### 解析这 1KB 的数据为 exec 结构\n\n\
    接下来的工作就是解析它，本质上就是按照指定的数据结构来解读罢了。\n\n```c\nexec.c\nint do_execve(...) {\n    ...\
    \ \n    struct exec ex = *((struct exec *) bh->b_data);\n    ...\n}\n```\n\n先从刚刚读取文件返回的缓冲头指针中取出数据部分\
    \ `bh -> data`，也就是文件前 1024 个字节，此时还是一段读不懂的二进制数据。\n\n然后按照 `exec` 这个结构体对其进行解析，它便有了生命。\n\
    \n```c\nstruct exec {\n    // 魔数\n    unsigned long a_magic;\n    // 代码长度\n  \
    \  unsigned a_text;\n    // 数据长度\n    unsigned a_data;\n    // 未初始化数据长度\n    unsigned\
    \ a_bss;\n    // 符号表长度\n    unsigned a_sym;\n    // 执行地址\n    unsigned a_entry;\n\
    \    // 代码重定位长度\n    unsigned a_trsize;\n    // 数据重定位长度\n    unsigned a_drsize;\n\
    };\n```\n上面的代码就是 `exec` 结构体，这是 `a.out` 格式文件的头部。现在的 Linux 已经弃用了这种老的格式改用 ELF 格式了，但大体的思想是一致的。这个结构体里的字段表示什么，等我们用到了再说，你可以通过我的注释体会。\n\
