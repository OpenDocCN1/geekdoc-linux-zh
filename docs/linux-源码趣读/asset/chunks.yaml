    \n这个过程，你可能觉得无聊，因为全是各种数据结构、中断、外设的初始化工作，后面将会怎么用它们，并没有展开讲解。\n\n但你也可能觉得兴奋，因为后面操作系统的全部工作，都是围绕着这几个初始化了的结构展开的，而它们却都是那么的好理解。\n\
    \n其实我是蛮喜欢这个过程的，比如我看电影，其实我对高潮部分并不是很感兴趣，我就喜欢看一场大战或者一场阴谋前各部门的准备工作，看着它们为了后面一个完美的计划，所做的前期筹备，是一种享受，你懂的！\n\
    \n所以今天特地花一章的功夫，把之前的初始化工作梳理一遍，之前没仔细看的同学，这章是个重新开始的机会！\n\n------- 开始 -------\n\n\
    电脑开机后，首先由 BIOS 将操作系统程序加载到内存，之后在进入 main 函数前，我们用汇编语言（boot 包下的三个汇编文件）做了好多苦力活。\n\n\
    ![](media/file135.webp \"fig:\")\n\n这些苦力活做好后，内存布局变成了这个样子。\n\n![](media/file136.webp\
    \ \"fig:\")\n\n其中页表的映射关系，被做成了线性地址与物理地址相同。\n\n![](media/file137.webp \"fig:\")\n\
    \n也因为有了页表的存在，所以多了线性地址空间的概念，即经过分段机制转化后，分页机制转化前的地址，不考虑段限长的话，32 位的 CPU 线性地址空间应为 4G。\n\
    \n![](media/file138.webp \"fig:\")\n\n以上这些，是进入 main 函数之前的事情，由 boot 文件夹下的三个汇编文件完成，具体可以看整个第一部分的总结：[第一部分完结\
    \ 进入内核前的苦力活](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499882&idx=1&sn=68fd16c5aeae15084be58afb1e5bd9e8&chksm=c2c5bac7f5b233d1c486fa57e9e3a2bc907a92ab69ff0344babab4d50bdaf76e7766b4b42914&scene=21#wechat_redirect)\n\
    \n-------- 进入 main 函数后 ---------\n\n进入 main 函数后，首先进行了内存划分，其实就是设置几个边界值，将内核程序、缓冲区、主内存三个部分划分开界限。这就是\
    \ [第12回 | 管理内存前先划分出三个边界值](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500061&idx=1&sn=6cb3382d7ac35ebeac52bbba3a89db4e&scene=21#wechat_redirect)\
    \ 所做的事情。\n\n![](media/file139.webp \"fig:\")"
  toc: []
  trans: "\n\n```c\n//struct blk_dev_struct {\n//    void (*request_fn)(void);\n//\
    \    struct request * current_request;\n//};\nextern struct blk_dev_struct blk_dev[NR_BLK_DEV];\n\
    \nvoid hd_init(void) {\n    blk_dev[3].request_fn = do_hd_request;\n    set_intr_gate(0x2E,&hd_interrupt);\n\
    \    outb_p(inb_p(0x21)&0xfb,0x21);\n    outb(inb_p(0xA1)&0xbf,0xA1); \n}\n```\n\
    \n就这？一共就四行代码。\n\n没错，初始化嘛，往往都比较简单，尤其是对硬件设备的初始化，大体都是：\n\n1. 往某些 IO 端口上读写一些数据，表示开启它；\n\
    2. 然后再向中断向量表中添加一个中断，使得 CPU 能够响应这个硬件设备的动作；\n3. 最后再初始化一些数据结构来管理。不过像是内存管理可能结构复杂些，外设的管理，相对就简单很多了。\n\
    \n看第一行代码：\n\n```c\nvoid hd_init(void) {\n    blk_dev[3].request_fn = do_hd_request;\n\
    \    ...\n}\n```\n\n我们把 `blk_dev` 数组索引 3 位置处的块设备管理结构 `blk_dev_struct` 的 `request_fn`\
    \ 赋值为了 `do_hd_request`，这是啥意思呢？\n\n因为有很多块设备，所以 Linux 0.11 内核用了一个 `blk_dev[]` 来进行管理，每一个索引表示一个块设备。\n\
    \n```c\nstruct blk_dev_struct blk_dev[NR_BLK_DEV] = {\n    { NULL, NULL },   \
    \  /* no_dev */\n    { NULL, NULL },     /* dev mem */\n    { NULL, NULL },  \
    \   /* dev fd */\n    { NULL, NULL },     /* dev hd */\n    { NULL, NULL },  \
    \   /* dev ttyx */\n    { NULL, NULL },     /* dev tty */\n    { NULL, NULL }\
    \      /* dev lp */\n};\n\nstruct blk_dev_struct {\n    void (*request_fn)(void);\
    \  // 处理 block I/O 请求的函数\n    struct request * current_request;  // 当前正在处理的请求\n\
    };\n```\n\n你看，索引为 3 这个位置，就表示给硬盘 `hd` 这个块设备留的位置。\n\n那么每个块设备执行读写请求都有自己的函数实现，在上层看来都是一个统一函数\
    \ `request_fn` 即可，具体实现各有不同，对于硬盘来说，这个实现就是 `do_hd_request` 函数。\n\n是不是有点像接口？这其实就是多态思想在\
    \ C 语言的体现嘛~ 用 Java 程序员熟悉的话就是，父类引用 `request_fn` 指向子类对象 `do_hd_request` 的感觉咯。\n\n\
    我们再看第二行。\n\n```c\nvoid hd_init(void) {\n    ...\n    set_intr_gate(0x2E,&hd_interrupt);\n\
    \    ...\n}\n```\n\n对于中断我们已经很熟悉了，这里就是又设置了一个新的中断，中断号是 `0x2E`，中断处理函数是 `hd_interrupt`，也就是说硬盘发生读写时，硬盘会发出中断信号给\
    \ CPU，之后 CPU 便会陷入中断处理程序，也就是执行 `hd_interrupt` 函数。\n\n```c\n_hd_interrupt:\n   \
    \ ...\n    xchgl _do_hd,%edx\n    ...\n// 如果是读盘操作，这个 do_hd 是 read_intr\nstatic\
    \ void read_intr(void) {\n    ...\n    do_hd_request();\n    ...\n}\n```\n\n好了，又多了一个中断，那我们再次理理目前开启的中断都有。\n\
    \n| 中断号 | 中断处理函数 |\n| --- | --- |\n| 0~0x10 | `trap_init` 里设置 |\n| 0x20 | `timer_interrupt`\
    \ |\n| 0x21 | `keyboard_interrupt` |\n| 0x2E | `hd_interrupt` |\n| 0x80 | `system_call`\
    \ |\n\n其中 `0-0x10` 17 个中断是 `trap_init` 里设置的，是一些基本的中断，比如异常等。之后，在控制台初始化 `con_init`\
    \ 里，我们又设置了 `0x21` 中断，这样键盘就有反应了。之后，我们在进程调度初始化 `sched_init` 里又设置了 `0x20` 时钟中断，并且开启定时器。最后又设置了一个极为重要的\
    \ `0x80` 系统调用。现在，我们在硬盘初始化 `hd_init` 里，又设置了硬盘中断，这样硬盘读写完成后通过中断来通知 CPU。上回书我提醒大家，有没有感觉到操作系统的中断驱动的特征，那本回给大家展望一下。\n\
    \n> 看到最后，你会发现操作系统就是一个中断驱动的死循环而已，如果不发生任何中断，操作系统会一直在死循环里等待。换句话说，让操作系统工作的唯一方式，就是触发中断。\n\
    \n好了，再往下看两行。\n\n```c\nvoid hd_init(void) {\n    ...\n    outb_p(inb_p(0x21)&0xfb,0x21);\n\
    \    outb(inb_p(0xA1)&0xbf,0xA1); \n}\n```\n\n就是往几个 IO 端口上读写，其作用是允许硬盘控制器发送中断信号，仅此而已。我们向来深入硬件细节，知道这个端口里写上这些数据，导致硬盘开启了。OK，本章就结束了，仅仅看初始化的工作，太简单了，连图都不用画。当然\
    \ `hd.c` 里还有很多读写硬盘的方法，这个在之后文件系统用到时，自然会讲，这里就抛个引子，看看读硬盘最底层的操作，是怎样的。我们看硬盘端口表。\n\n\
    | 端口 | 读 | 写 |\n| --- | --- | --- |\n| 0x1F0 | 数据寄存器 | 数据寄存器 |\n| 0x1F1 | 错误寄存器\
    \ | 特征寄存器 |\n| 0x1F2 | 扇区计数器 | 扇区计数寄存器 |\n| 0x1F3 | 扇区号寄存器或 LBA 块地址 0~7 | 扇区号寄存器或\
    \ LBA 块地址 0~7 |\n| 0x1F4 | 磁道数低 8 位或 LBA 块地址 8~15 | 磁道数低 8 位或 LBA 块地址 8~15 |\n\
    | 0x1F5 | 磁道数高 8 位或 LBA 块地址 16~23 | 磁道数高 8 位或 LBA 块地址 16~23 |\n| 0x1F6 | 驱动器/磁头或\
    \ LBA 块地址 24~27 | 驱动器/磁头或 LBA 块地址 24~27 |\n| 0x1F7 | 命令寄存器或状态寄存器 | 命令寄存器 |\n\n\
    那读硬盘就是往第一个以外的端口写数据，告诉硬盘哪个扇区，读多少。然后再从 `0x1F0` 端口一个字节一个字节的读。这就完成了一次硬盘操作。如果觉得不够具体，那来：\n\
    \n1. 在 `0x1F2` 写入要读取的扇区数\n2. 在 `0x1F3~0x1F6` 写入好的 LBA 地址\n3. 在 `0x1F7` 处写入命令号\n\
    4. 不断检测 `0x1F7`（此时状态寄存器含义）的忙位\n5. 如果不忙，则不断从 `0x1F0` 读取数据到内存，直到读完\n\n操作系统的代码也是写的，我们看一下，不用细节。\n\
    \n```c\nstatic void hd_out(unsigned int drive, unsigned int nsect, unsigned int\
    \ sect,\n                   unsigned int head, unsigned int cmd,\n           \
    \        void (*intr_addr)(void)) {\n    ...\n    do_hd = intr_addr;\n    outb_p(hd_info[drive].ctl,HD_CMD);\n\
    \    port = 0x1f0;\n    outb_p(hd_info[drive].wp<<2,++port);\n    outb_p(nsect,++port);\n\
    \    outb_p(sect,++port);\n    outb_p(cyl,++port);\n    outb_p(cyl>>8,++port);\n\
    \    outb_p(0xA0|(drive<<4)|head,++port);\n    outb(cmd,++port);\n}\n```\n\n看，那些\
    \ `outb_p` 方法，转换成汇编语言，就是 `out` 指令，往指定的硬盘 IO 端口上写数据，达到我们想要的读写目的。是不是很 low？但我们用户层写的各种\
    \ `read/write` 函数，即便是经过系统调用、文件系统、缓冲区管理等等过程，但只要是读写硬盘，最终都要调用这个最底层的函数，殊途同归，逃不掉的！\n\
    \n好了，至此，我们就把所有的初始化工作都讲完了！坚持到现在的，都自己鼓掌！！！下一回，我们将用整一章的篇幅，完整梳理下我们做的初始化工作，这也标志着第二大部分完结！这些初始化工作，将在后面的流程中起到至关重要的作用，直到本系列结束。\n\
    \n### 第二部分总结与回顾\n\n第二部分所讲的代码，就第二部分的目录一样规整，一个 `init` 方法对应一个章节，简单粗暴。\n\n```c\nvoid\
    \ main(void) {\n    ...\n    mem_init(main_memory_start,memory_end);\n    trap_init();\n\
    \    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n    time_init();\n\
    \    sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n\
    \    sti();\n    move_to_user_mode();\n    if (!fork()) {init();}\n    for(;;)\
    \ pause();\n}\n```\n\n如果坚持到这里了，先给自己鼓鼓掌！这个过程，你可能觉得无聊。\n\n### 开始\n\n电脑开机后，首先由 BIOS\
    \ 将操作系统程序加载到内存，之后在进入 `main` 函数前，我们用汇编（`boot` 包下的三个汇编文件）做了好多苦力。这些苦力做好后，内存布局变成了样子。其中页表的映射关系，被成了线性地址与物理地址相同。也因为有了页表，所以多了线性空间，即经过段机制转化，分页机制前的地址，不考虑段限的话，32\
    \ 位 CPU 线性空间应为 4G。以上这些，是进入 `main` 函数之前，由 `boot` 文件夹下的三个汇编文件完成，具体可以看第一部分的总结：第一部分完结\
    \ 进入内核前的苦力活。\n\n"
- fmt: "\n随后，通过`mem_init` 函数，对主内存区域用 `mem_map[]` 数组管理了起来，其实就是每个位置表示一个 4K 大小的内存页的使用次数而已，今后对主内存的申请和释放，其实都是对\
    \ `mem_map` 数组的操作。这是 [第13回 | 主内存初始化 mem_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500089&idx=1&sn=9a3fd6e585b0fd1ec528599ead6677c3&scene=21#wechat_redirect)\
    \ 所做的事。\n\n![](media/file140.webp \"fig:\")\n\n后面又通过 `buffer_init` 函数，对缓冲区区域用多种数据结构管理起来。其中包括双向链表缓冲头\
    \ `h` 和每个缓冲头管理的 1024 字节大小的缓冲块 `b`。这是 [第19回 | 缓冲区初始化 buffer_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500596&idx=1&sn=0df64f9f5133cfe8a259b8ce7b7feaeb&chksm=c2c5b999f5b2308f76095af30e8915f125f18702df9c58be7612b58e4d009c14948193974f9b&scene=21#wechat_redirect)\
    \ 的内容。\n\n![](media/file141.webp \"fig:\")\n\n同时，又用一个 `hashmap` 结构，索引到所有缓冲头，方便快速查找，为之后的通过\
    \ `LRU` 算法使用缓冲区做准备。\n\n![](media/file142.webp \"fig:\")\n\n这些结构，就是缓冲区部分的管理，而缓冲区的目的是为了加速磁盘的读写效率，后面将读写文件全流程的时候，你会看到它在整个流程中起到中流砥柱的作用。\n\
    \n再往后，通过 `trap_init` 函数把中断描述符表的一些默认中断都设置好了，随后再由各个模块设置它们自己需要的个性化的中断（比如硬盘中断、时钟中断、键盘中断等）。这是\
    \ [第14回 | 中断初始化 trap_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500119&idx=1&sn=f46331f70677aba168243040a96be1c0&scene=21#wechat_redirect)\
    \ 的内容。\n\n![](media/file143.webp \"fig:\")\n\n再之后，通过 `blk_dev_init` 对读写块设备（比如硬盘）的管理进行了初始化，比如对硬盘的读写操作，都要封装为一个\
    \ `request` 结构放在 `request[]` 数组里，后面用电梯调度算法进行排队读写硬盘。这是 [第15回 | 块设备请求项初始化 blk_dev_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500147&idx=1&sn=409f5ed34ae3822e40a6b443207d40c5&scene=21#wechat_redirect)\
    \ 的内容。\n\n![](media/file144.webp \"fig:\")\n\n再往后，通过 `tty_init` 里的 `con_init`，实现了在控制台输出字符的功能，并且可以支持换行、滚屏等效果。当然此处也开启了键盘中断，如果此时中断已经处于打开状态，我们就可以用键盘往屏幕上输出字符啦。这是\
    \ [第16回 | 控制台初始化 tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect)\
    \ 的内容。\n\n![](media/file145.gif \"fig:\")\n\n再之后，整个操作系统的精髓，进程调度，其初始化函数 `sched_init`，定义好了全部进程的管理结构\
    \ `task[64]` 数组，并在索引 0 位置处赋上了初始值，作为零号进程的结构体。这是 [第18回 | 进程调度初始化 sched_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c68c2b03d9721ba74e949cfa8&chksm=c2c5b87df5b2316b083015a4fdba2df29211f38fcfd1cd040e02ab410432608e26383a43ef5&scene=21#wait,\
    \ wait,26383a43ef5&scene=21#wechat_redirect) 的内容。\n\n![](media/file146.webp \"\
    fig:\")\n\n然后又将全局描述符表增加了 `TSS` 和 `LDT`，用来管理 0 号进程的上下文以及内存规划结构具体是什么，先不用管。\n\n![](media/file147.webp\
    \ \"fig:\")\n\n同时，将这两个地址告诉 `tr` 寄存器和 `ldt` 寄存器，让 CPU 找到它们。\n\n![](media/file148.webp\
    \ \"fig:\")\n\n随后，开启定时器以及设置了时钟中断，用于响应定时器每隔100ms 发来的信号。\n\n![](media/file149.gif\
    \ \"fig:\")\n\n这样就算把进程调度的初始化完成了，之后进程调度就从定时器发出开始，先判断当前进程是不是到了，如果到了就去 `task[64]`\
    \ 数组里找下一个进程，切换。这就是进程调度的简单流程，也是后面要讲的一个精彩环节。\n\n最后，一个简单的硬盘初始化 `hd_init`，为我们开启了中断并设置了硬盘处理函数，此时我们便可以通过硬盘的端口与其交互了。这是\
    \ [第20回 | 硬盘初始化 hd_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500686&idx=1&sn=c950e586af062e16c7e13a5084ca1d1c2c5b92f5b230357ad1ca01bed76862f9661c9a23e68)\
    \ 的内容。\n\n把之前几个模块设置的中断放一块，此时的中断表看一下：\n\n| 中断号 | 中断处理函数 |\n| :--- | :--- |\n| 0\
    \ ~ 0x10 | `trap_init` 里设置的一堆 |\n| 0x20 | `timer_interrupt` |\n| 0x21 | `keyboard_interrupt`\
    \ |\n| 0x2E | `hd_interrupt` |\n| 0x80 | `system_call` |\n\n这里我又提了一嘴，操作系统本质上就是个中断驱动的死循环，后面你会慢慢体会到。我们再往下看\
    \ `main` 方法：\n\n```c\n#define sti() __asm (\"sti\")\nvoid main(void) {\n    ...\n\
    \    sti();\n    ...\n}\n```\n\n`sti` 是一个汇编指令，意思是打开中断。其本质上是将 `efl` 寄存器里的中断允许位\
    \ `IF` 位置1。（由于已经是32位保护模式了，所以我把寄存器也都换成了32位的名字）\n\n![](media/file150.webp \"fig:\"\
    )\n\n这样 CPU 就开始接收并处理中断信号了，键盘可以按了，硬盘可以读写了，时钟可以震荡了，系统调用也可以生效了！这就代表着，操作系统具有了控制台交互能力、硬盘读写能力、进程调度能力以及响应用户进程的系统调用请求！\n\
    \n至此，全部初始化工作结束了！这里有几个初始化函数没有讲，都是可以忽略的，不要担心：\n\n- `chr_dev_init`：因为这个函数里面就是空的，什么也没做。\n\
    ![](media/file151.webp \"fig:\")\n\n- `tty_init` 里的 `rs_init`：这个方法是串口中断的开启以及设置对应的中断处理程序，串口在我们现在的\
    \ PC 机上很少用到了，所以这个直接忽略。\n\n- `floppy_init`：这个是软盘的初始化，软盘现在已经被淘汰了，且电脑上也没有软盘控制器了，所以也忽略即可。\n\
    ![](media/file152.webp \"fig:\")\n\n除了这些之外，全部的初始化工作我们就梳理清楚了！再次为我们这一阶段性的胜利鼓掌！！！同时，这章也会作为之后的一个索引章节，初始化工作所设置的数据结构都十分重要，后面如果你忘了，可以常来看这里看看，祝大家好运。欲知后事如何，且听下回分解。\n\
    \n# 第三部分：一个新进程的诞生\n\n***\n\n## 第21回 新进程诞生全局概述\n\n> 原文链接: [https://mp.weixin.qq.com/s/H_OCZ2ZtGHWHge_rYKCkJw](https://mp.weixin.qq.com/s/H_OCZ2ZtGHWHge_rYKCkJw)\n\
    \n本文为整个第三部分的第一回内容。\n\n一个新进程的诞生，从操作系统的源码角度来说，其实就两行代码。而关于创建进程的重点，其实就一行代码，就是大名鼎鼎的\
    \ `fork` 函数。\n\n我们先来看一张图，看看操作系统从开机到怠速做了什么。\n\n![](media/file153.webp \"fig:\"\
    )\n\n你看，第一部分和第二部分为我们第三部分做了充足的铺垫。\n\n```c\nvoid main(void) {\n    // 第二部分的内容，各种初始化\n\
    \    ...\n    move_to_user_mode();\n    if (!fork()) {\n        // 新进程里干啥，是第四部分的内容\n\
    \        init();\n    }\n    // 死循环，操作系统怠速\n    for(;;) pause();\n}\n```\n\n至于\
    \ `fork` 出来的新进程做了什么，就是 `init` 函数里的故事，这个不在第三部分的范畴。所以你看，一共就两行代码，顶多再上最后一行的死循环，三行就把创建进程这个事搞定了。再加上新进程里要做的\
    \ `init` 函数，一共四行代码就走到了 `main` 函数的结尾，也就标志着操作系统启动完毕！\n\n但这四行代码是整个操作系统的精髓所在，也是最难的四行代码。理解了它们，你就会感叹。\n\
    \n### 第一句是 `move_to_user_mode`\n\n直译过来，就是转变为用户态。因为 Linux 将操作系统特权级分为用户态与内核态，之前都处于内核态，现在要先转变为用户态，仅此而已。\n\
    \n一旦转变为了用户态，那么之后的代码将一直处于用户态，除非发生了中断，比如用户发出了系统调用的中断，那么此时将会从用户态陷入内核态，不过当中断处理程序执行完之后，又通过中断返回指令从内核态回到用户态。\n\
    \n![](media/file154.webp \"fig:\")\n\n整个过程被操作系统的机制拿捏死死的，始终让用户进程处于用户态运行，必要的时候陷入一下内核态，但很快就会被返回再次回到用户态。\n\
    \n### 第二句是 `fork`\n\n这是一个创建一个新进程的意思，而且所有用户进程想要创建进程都需要调用这个函数。\n\n原来操作系统只有一个执行流，就是我们一直过的所有代码，就是进程0，只不过我们并没有意识到它也是一个进程。调用完\
    \ `fork` 之后，现在又多了一个进程，叫做进程1。\n\n当然，更准确的说法是，我们一路过的代码能够被自信地称作进程0的确切时刻，是我们在 `sched_init`\
    \ 里为当前执行流添加了一个进程管理结构到 `task` 数组里，同时开启了定时器以及时钟中断的那一个时刻。\n\n![](media/file155.webp\
    \ \"fig:\")\n\n因为此时时钟中断到来之后，就可以执行到我们的进程调度程序，进程调度程序才会去这个地方。\n\n### 第三句是 `init`\n\
    \n`fork` 出来的新进程做了什么，就是 `init` 函数里的故事，这个不在第三部分的范畴。所以你看，一共就两行代码，顶多再算上最后一行的死循环，三行就把创建进程这个事搞定了。再加上新进程里要做的\
    \ `init` 函数，一共四行代码就走到了 `main` 函数的结尾，也就标志着操作系统启动完毕！\n\n### 第四句是 `pause`\n\n死循环，操作系统怠速状态。\n"
  raw: "随后，通过 mem_init 函数，对主内存区域用 mem_map[] 数组管理了起来，其实就是每个位置表示一个 4K 大小的内存页的使用次数而已，今后对主内存的申请和释放，其实都是对\
    \ mem_map 数组的操作。这是 [第13回 | 主内存初始化 mem_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500089&idx=1&sn=9a3fd6e585b0fd1ec528599ead6677c6&scene=21#wechat_redirect)\
    \ 所做的事。\n\n![](media/file140.webp \"fig:\")\n\n后面又通过 buffer_init 函数，对缓冲区区域用多种数据结构管理起来。其中包括双向链表缓冲头\
    \ h 和每个缓冲头管理的 1024 字节大小的缓冲块 b。这是 [第19回 | 缓冲区初始化 buffer_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500596&idx=1&sn=0df64f9f5133cfe8a259b8ce7b7feaeb&chksm=c2c5b999f5b2308f76095af30e8915f125f18702df9c58be7612b58e4d009c14948193974f9b&scene=21#wechat_redirect)\
    \ 的内容。\n\n![](media/file141.webp \"fig:\")\n\n同时，又用一个 hashmap 结构，索引到所有缓冲头，方便快速查找，为之后的通过\
    \ LRU 算法使用缓冲区做准备。\n\n![](media/file142.webp \"fig:\")\n\n这些结构，就是缓冲区部分的管理，而缓冲区的目的是为了加速磁盘的读写效率，后面将读写文件全流程的时候，你会看到它在整个流程中起到中流砥柱的作用。\n\
    \n再往后，通过 trap_init 函数把中断描述符表的一些默认中断都设置好了，随后再由各个模块设置它们自己需要的个性化的中断（比如硬盘中断、时钟中断、键盘中断等）。这是\
    \ [第14回 | 中断初始化 trap_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500119&idx=1&sn=f46331f70677aba168243040a96be1c0&scene=21#wechat_redirect)\
    \ 的内容。\n\n![](media/file143.webp \"fig:\")\n\n再之后，通过 blk_dev_init 对读写块设备（比如硬盘）的管理进行了初始化，比如对硬盘的读写操作，都要封装为一个\
    \ request 结构放在 request[] 数组里，后面用电梯调度算法进行排队读写硬盘。这是 [第15回 | 块设备请求项初始化 blk_dev_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500147&idx=1&sn=409f5ed34ae3822e40a6b443207d40c5&scene=21#wechat_redirect)\
    \ 的内容。\n\n![](media/file144.webp \"fig:\")\n\n再往后，通过 tty_init 里的 con_init，实现了在控制台输出字符的功能，并且可以支持换行、滚屏等效果。当然此处也开启了键盘中断，如果此时中断已经处于打开状态，我们就可以用键盘往屏幕上输出字符啦。这是\
    \ [第16回 | 控制台初始化 tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect)\
    \ 的内容。\n\n![](media/file145.gif \"fig:\")\n\n再之后，整个操作系统的精髓，进程调度，其初始化函数 shed_init，定义好了全部进程的管理结构\
    \ task[64] 数组，并在索引 0 位置处赋上了初始值，作为零号进程的结构体。这是 [第18回 | 进程调度初始化 sched_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c68c2b03d9721ba74e949cfa8&chksm=c2c5b87df5b2316b083015a4fdba2df29211f38fcfd1cdb040e02ab410432608e26383a43ef5&scene=21#wechat_redirect)\
    \ 的内容。\n\n![](media/file146.webp \"fig:\")\n\n然后又将全局描述符表增添了 TSS 和 LDT，用来管理 0 号进程的上下文信息以及内存规划，结构里面具体是什么，先不用管哟。\n\
    \n![](media/file147.webp \"fig:\")\n\n同时，将这两个结构的地址，告诉 tr 寄存器和 ldt 寄存器，让 CPU 能够找到它们。\n\
    \n![](media/file148.webp \"fig:\")\n\n随后，开启定时器，以及设置了时钟中断，用于响应定时器每隔 100ms 发来的中断信号。\n\
    \n![](media/file149.gif \"fig:\")\n\n这样就算把进程调度的初始化工作完成了，之后进程调度就从定时器发出中断开始，先判断当前进程时间片是不是到了，如果到了就去\
    \ task[64] 数组里找下一个被调度的进程的信息，切换过去。\n\n这就是进程调度的简单流程，也是后面要讲的一个非常精彩的环节。\n\n最后最后，一个简单的硬盘初始化\
    \ hd_init，为我们开启了硬盘中断，并设置了硬盘中断处理函数，此时我们便可以真正通过硬盘的端口与其进行读写交互了。这是 [第20回 | 硬盘初始化 hd_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500686&idx=1&sn=c950e586af062e16c7e13a35084ca1d1&chksm=c2c5b923f5b230357ad1bca01a1b0ed76862f696681c92a232e687ab6eff5dbd3990217ac552&scene=21#wechat_redirect)\
    \ 的内容。\n\n把之前几个模块设置的中断放一块，此时的中断表我们看一下。\n\n| 中断号 | 中断处理函数 |\n\n| --- | --- |\n\n\
    | 0 ~ 0x10 | trap_init 里设置的一堆 |\n\n| 0x20 | timer_interrupt |\n\n| 0x21 | keyboard_interrupt\
    \ |\n\n| 0x2E | hd_interrupt |\n\n| 0x80 | system_call |\n\n这里我又提了一嘴，操作系统本质上就是个中断驱动的死循环，这个后面你会慢慢体会到。\n\
    \n而我们再往下看一行 main 方法。\n\n```\n[](#cb125-1)#define sti() __asm__ (\"sti\"::)\n[](#cb125-2)void\
    \ main(void) {\n[](#cb125-3)    ...\n[](#cb125-4)    sti();\n[](#cb125-5)    ...\n\
    [](#cb125-6)}\n```\n\n是一个 **sti** 汇编指令，意思是打开中断。其本质上是将 eflags 寄存器里的中断允许标志位 IF 位置\
    \ 1。（由于已经是 32 位保护模式了，所以我把寄存器也都偷偷换成了 32 位的名字）\n\n![](media/file150.webp \"fig:\"\
    )\n\n这样 CPU 就开始可以接收并处理中断信号了，键盘可以按了，硬盘可以读写了，时钟可以震荡了，系统调用也可以生效了！\n\n这就代表着，操作系统具有了控制台交互能力，硬盘读写能力，进程调度能力，以及响应用户进程的系统调用请求！\n\
    \n至此，全部初始化工作，就结束了！这里有几个初始化函数没有讲，都是可以忽略的，不要担心。\n\n一个是 chr_dev_init，因为这个函数里面本身就是空的，什么也没做。\n\
    \n![](media/file151.webp \"fig:\")\n\n一个是 tty_init 里的 rs_init，这个方法是串口中断的开启，以及设置对应的中断处理程序，串口在我们现在的\
    \ PC 机上已经很少用到了，所以这个直接忽略。\n\n还一个是 floppy_init，这个是软盘的初始化，软盘现在已经被淘汰了，且电脑上也没有软盘控制器了，所以也忽略即可。\n\
    \n![](media/file152.webp \"fig:\")\n\n除了这些之外，全部的初始化工作，我们就全部梳理清楚了！再次为我们这一阶段性的胜利，鼓掌吧！！！\n\
    \n同时，这章也会作为之后工作的一个索引章节，初始化工作所设置的所有数据结构都十分重要，后面如果你忘了，可以常来这里看看，祝大家好运。\n\n欲知后事如何，且听下回分解。我要去休假了，刚好节前把第二部分收了尾巴，等节后我们开始大战第三部分！大家给我报销个回家的路费吧～\n\
    \n# 第三部分：一个新进程的诞生\n\n* * *\n\n## 第21回 新进程诞生全局概述\n\n> 原文链接: [https://mp.weixin.qq.com/s/H_OCZ2ZtGHWHge_rYKCkJw](https://mp.weixin.qq.com/s/H_OCZ2ZtGHWHge_rYKCkJw)\n\
    \n本文为整个第三部分的第一回内容。\n\n一个新进程的诞生，从操作系统的源码角度来说，其实就两行代码。而关于创建进程的重点，其实就一行代码，就是大名鼎鼎的\
    \ fork 函数。\n\n我们先来看一张图，看看操作系统从开机到怠速都做了些什么事情。\n\n![](media/file153.webp \"fig:\"\
    )\n\n你看，第一部分和第二部分，为我们这个第三部分做了充足的铺垫工作。\n\n[第一部分 进入内核前的苦力活](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499882&idx=1&sn=68fd16c5aeae15084be58afb1e5bd9e8&chksm=c2c5bac7f5b233d1c486fa57e9e3a2bc907a92ab69ff0344babab4d50bdaf76e7766b4b42914&scene=21#wechat_redirect)\n\
    \n[第二部分 大战前期的初始化工作](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500983&idx=1&sn=ad4c430823c975df97f13de3fbe8c66e&chksm=c2c5be1af5b2370cad4ce3218c5294feee4ae2e4d28804398c1dc8ac252c8dfafbe419ccf58c&scene=21#wechat_redirect)\n\
    \n到了第三部分，简单说就是从内核态切换到用户态，然后通过 fork 创建出一个新的进程，再之后老进程进入死循环。\n\n```\n[](#cb126-1)void\
    \ main(void) {\n[](#cb126-2)    // 第二部分的内容，各种初始化工作\n[](#cb126-3)    ...\n[](#cb126-4)\
    \    // 第三部分的内容，一个新进程的诞生\n[](#cb126-5)    move_to_user_mode();\n[](#cb126-6) \
    \   if (!fork()) {\n[](#cb126-7)        // 新进程里干了啥，是第四部分的内容\n[](#cb126-8)    \
    \    init();\n[](#cb126-9)    }\n[](#cb126-10)    // 死循环，操作系统怠速状态\n[](#cb126-11)\
    \    for(;;) pause();\n[](#cb126-12)}\n```\n\n至于 fork 出来的新进程做了什么事，就是 init 函数里的故事里，这个不在第三部分的讨论范畴。\n\
    \n所以你看，一共就两行代码，顶多再算上最后一行的死循环，三行，就把创建新进程这个事搞定了。再加上新进程里要做的 init 函数，一共四行代码，就走到了 main\
    \ 函数的结尾，也就标志着操作系统启动完毕！\n\n但就是这没有多少个字母的四行代码，是整个操作系统的精髓所在，也是最难的四行代码。理解了它们，你就会有原来操作系统就是这破玩意的感叹了～\n\
    \n今天我们就总览一下这四句，很轻松。\n\n**第一句是 move_to_user_mode**\n\n直译过来即可，就是转变为用户态模式。因为 Linux\
    \ 将操作系统特权级分为用户态与内核态两种，之前都处于内核态，现在要先转变为用户态，仅此而已。\n\n一旦转变为了用户态，那么之后的代码将一直处于用户态的模式，除非发生了中断，比如用户发出了系统调用的中断指令，那么此时将会从用户态陷入内核态，不过当中断处理程序执行完之后，又会通过中断返回指令从内核态回到用户态。\n\
    \n![](media/file154.webp \"fig:\")\n\n整个过程被操作系统的机制拿捏的死死的，始终让用户进程处于用户态运行，必要的时候陷入一下内核态，但很快就会被返回而再次回到用户态，是不是非常无奈？\n\
    \n**第二句是 fork**\n\n这是创建一个新进程的意思，而且所有用户进程想要创建新的进程，都需要调用这个函数。\n\n原来操作系统只有一个执行流，就是我们一直看过来的所有代码，就是进程\
    \ 0，只不过我们并没有意识到它也是一个进程。调用完 fork 之后，现在又多了一个进程，叫做进程 1。\n\n当然，更准确的说法是，我们一路看过来的代码能够被我们自信地称作进程\
    \ 0 的确切时刻，是我们在 [第18回 | 进程调度初始化 sched_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c68c2b03d9721ba74e949cfa8&chksm=c2c5b87df5b2316b083015a4fdba2df29211f38fcfd1cdb040e02ab410432608e26383a43ef5&scene=21#wechat_redirect)\
    \ 里为当前执行流添加了一个进程管理结构到 task 数组里，同时开启了定时器以及时钟中断的那一个时刻。\n\n![](media/file155.webp\
    \ \"fig:\")\n\n因为此时时钟中断到来之后，就可以执行到我们的进程调度程序，进程调度程序才会去这个 task 数组里挑选合适的进程进行切换。所以此时，我们当前执行的代码，才真正有了一个进程的身份，才勉强得到了一个可以被称为进程\
    \ 0 的资格，毕竟还没有其他进程参与竞争。\n\n如果你觉得这些话很困惑，就对了，在理解了整个这一块的细节之后，尤其是对于进程调度这种被人赋予了好多虚头巴脑的名词的地方，你会豁然开朗的。\n\
    \n**第三句是 init**\n\n只有进程 1 会走到这个分支来执行。这里的代码可太多了，它本身需要完成如加载根文件系统的任务，同时这个方法将又会创建出一个新的进程\
    \ 2，在进程 2 里又会加载与用户交互的 shell 程序，此时操作系统就正式成为了用户可用的一个状态了。\n\n当然，当你知道了新进程诞生的过程之后，进程\
    \ 2 的创建，就和进程 1 的创建一样了，在后面的章节中你将不会再困惑创建新进程的过程，减轻了学习负担。所以这一部分，又是作为下一部分的重要基础，环环相扣。\n\
    \n我们的教育，往往是强调知识点。但我认为，整个知识都是成体系的，没有哪个地方可以单点立起整个的理解大厦，必须一环扣一环。幸运的是，每一环都是十分简单且纯粹的。\n\
    \n**第四句是 pause**\n\n当没有任何可运行的进程时，操作系统会悬停在这里，达到怠速状态。没啥好说的，我一直强调，操作系统就是由中断驱动的一个死循环。\n\
    \n一共四句话，切换到用户态，创建新进程，初始化，然后悬停怠速。\n\n乍一看，是不是特别简单？是的，不过当你展开每一段代码的细节后你会发现，一个庞大的世界让你无从下手。但当你把全部细节都捋顺了之后你又会发现，不过如此。\n\
    \n欲知后事如何，且听下回分解。\n\n* * *\n\n## 第22回 从内核态切换到用户态\n\n> 原文链接: [https://mp.weixin.qq.com/s/AVl6R2N9d_sldkhfvC6aEw](https://mp.weixin.qq.com/s/AVl6R2N9d_sldkhfvC6aEw)\n\
    \n书接上回，上回书咱们从整体上鸟瞰了一下第三部分要讲的内容，代码上就是还差四句话就走到了 main 函数的尽头。\n\n```\n[](#cb127-1)void\
    \ main(void) {\n[](#cb127-2)    ... \n[](#cb127-3)    move_to_user_mode();\n[](#cb127-4)\
    \    if (!fork()) {\n[](#cb127-5)        init();\n[](#cb127-6)    }\n[](#cb127-7)\
    \    for(;;) pause();\n[](#cb127-8)}\n```\n\n今天我们就重点讲这第一句代码，**move_to_user_mode**。\n\
    \n**让进程无法逃出用户态**\n\n这行代码的意思直接说非常简单，就是**从内核态转变为了用户态**，但要解释清楚这个意思，还需要听我慢慢道来。\n\n\
    我相信你肯定听说过操作系统的内核态与用户态，用户进程都在用户态这个特权级下运行，而有时程序想要做一些内核态才允许做的事情，比如读取硬盘的数据，就需要通过系统调用，来请求操作系统在内核态特权级下执行一些指令。\n\
    \n我们现在的代码，还是在内核态下运行，之后操作系统达到怠速状态时，是以用户态的 shell 进程运行，随时等待着来自用户输入的命令。\n\n所以，就在这一步，也就是\
    \ move_to_user_mode 这行代码，作用就是将当前代码的特权级，从内核态变为用户态。\n\n一旦转变为了用户态，那么之后的代码将一直处于用户态的模式，除非发生了中断，比如用户发出了系统调用的中断指令，那么此时将会从用户态陷入内核态，不过当中断处理程序执行完之后，又会通过中断返回指令从内核态回到用户态。\n\
    \n![](media/file156.webp \"fig:\")"
  toc: []
  trans: "\nSubsequently, through the `mem_init` function, the main memory area is\
    \ managed using the `mem_map[]` array. In essence, each entry represents the reference\
    \ count of a 4K memory page. From now on, allocations and deallocations of main\
    \ memory are actually operations on the `mem_map` array. This is what is done\
    \ in [Session 13 | Main Memory Initialization mem_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500089&idx=1&sn=9a3fd6e585b0fd1ec528599ead6677c3&scene=21#wechat_redirect).\n\
    \n![](img/file140.webp \"fig:\")\n\nLater, through the `buffer_init` function,\
    \ the buffer area is managed using various data structures. This includes a doubly\
    \ linked list buffer header `h` and 1024-byte buffer blocks `b` managed by each\
    \ header. This is the content of [Session 19 | Buffer Initialization buffer_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500596&idx=1&sn=0df64f9f5133cfe8a259b8ce7b7feaeb&chksm=c2c5b999f5b2308f76095af30e8915f125f18702df9c58be7612b58e4d009c14948193974f9b&scene=21#wechat_redirect).\n\
    \n![](img/file141.webp \"fig:\")\n\nSimultaneously, a `hashmap` structure is used\
    \ to index all buffer headers for fast lookup, preparing for future use of buffers\
    \ via the `LRU` algorithm.\n\n![](img/file142.webp \"fig:\")\n\nThese structures\
    \ constitute the management of the buffer section. The purpose of the buffer is\
    \ to accelerate disk I/O efficiency; when covering the full file read/write process\
    \ later, you will see it play a pivotal role throughout the process.\n\nMoving\
    \ forward, the `trap_init` function sets up default interrupts in the Interrupt\
    \ Descriptor Table (IDT). Subsequently, each module sets its own customized interrupts\
    \ (such as hard disk interrupts, timer interrupts, keyboard interrupts, etc.).\
    \ This is the content of [Session 14 | Interrupt Initialization trap_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500119&idx=1&sn=f46331f70677aba168243040a96be1c0&scene=21#wechat_redirect).\n\
    \n![](img/file143.webp \"fig:\")\n\nAfterward, `blk_dev_init` initializes the\
    \ management of block devices (such as hard drives). For instance, hard disk read/write\
    \ operations are encapsulated into a `request` structure and placed in the `request[]`\
    \ array, which is then queued for I/O using the elevator scheduling algorithm.\
    \ This is the content of [Session 15 | Block Device Request Initialization blk_dev_init](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500147&idx=1&sn=409f5ed34ae3822e40a6b443207d40c5&scene=21#wechat_redirect).\n\
    \n![](img/file144.webp \"fig:\")\n\nNext, `con_init` within `tty_init` implements\
    \ the functionality to output characters to the console, supporting effects like\
    \ line breaks and scrolling. Of course, keyboard interrupts are also enabled here;\
    \ if interrupts are already enabled at this point, we can use the keyboard to\
    \ output characters to the screen. This is the content of [Session 16 | Console\
    \ Initialization tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect).\n\
    \n![](img/file145.gif \"fig:\")\n\nThen, the essence of the OS—process scheduling—is\
    \ initialized. Its function `sched_init` defines the complete process management\
    \ structure array `task[64]` and assigns an initial value at index 0 as the structure\
    \ for Process 0. This is the content of [Session 18 | Process Scheduling Initialization\
    \ sched_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c68c2b03d9721ba74e949cfa8&chksm=c2c5b87df5b2316b83015afdba2df2921f38fcf1cd04e02ab104226383a3ef5&scene=21#wait,\
    \ wait,26383a3ef5&scene=21).\n\n![](img/file146.webp \"fig:\")\n\nThen, the global\
    \ descriptor table adds `TSS` and `LDT` to manage the context of Process 0 and\
    \ its memory planning.\n\n![](img/file147.webp \"fig:\")\n\nSimultaneously, these\
    \ two addresses are passed to the `tr` and `ldt` registers so the CPU can find\
    \ them.\n\n![](img/file148.webp \"fig:\")\n\nSubsequently, the timer is enabled\
    \ and the clock interrupt is set to respond to signals sent every 100ms.\n\n![](img/file149.gif\
    \ \"fig:\")\n\nOnce the process scheduling initialization is complete, the scheduling\
    \ starts when the timer signal determines if the current process has expired,\
    \ then searches for the next process in the `task[64]` array. This is the simple\
    \ flow of process scheduling, a highlight discussed later. Finally, a simple `hd_init`\
    \ enables interrupts and sets the disk handler functions, allowing us to interact\
    \ via the hard disk port. This is the content of [Session 20 | Hard Disk Initialization\
    \ hd_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500686&idx=1&sn=c950e586af062e16c7e13a5084ca1d1c2c52f5b230357adca1bed7682f9661a23e8).\n\
    \nHere are the interrupts set by the previous modules:\n\n| Interrupt Vector |\
    \ Handler Function |\n| :--- | :--- |\n| 0 ~ 0x10 | Set in `trap_init` |\n| 0x20\
    \ | `timer_interrupt` |\n| 0x21 | `keyboard_interrupt` |\n| 0x2E | `hd_interrupt`\
    \ |\n| 0x80 | `system_call` |\n\nI mentioned that the OS is essentially an interrupt-driven\
    \ infinite loop, which you will experience later. Let's look further at the `main`\
    \ method:\n\n```c\n#define sti() __asm (\"sti\")\nvoid main(void) {\n    ...\n\
    \    sti();\n    ...\n}\n```\n\n`sti` is an assembly instruction that enables\
    \ interrupts. Essentially, it sets the `IF` bit in the `efl` register (since we\
    \ are in 32-bit protected mode, I have renamed the registers to 32-bit names).\n\
    \n![](img/file150.webp \"fig:\")\n\nThis way, the CPU begins receiving and processing\
    \ interrupt signals. The keyboard works, the disk can read/write, the clock ticks,\
    \ and system calls become effective! This means the OS has console interaction,\
    \ disk I/O capabilities, process scheduling capabilities, and responds to user\
    \ process system calls!\n\nAt this point, all initialization is finished! There\
    \ are a few initialization functions not discussed that you can ignore without\
    \ worry: \n\n- `chr_dev_init`: This function is empty and does nothing.\n\n![](img/file151.webp\
    \ \"fig:\")\n\n- `rs_init` within `tty_init`: This method enables serial interrupts\
    \ and sets the corresponding interrupt handlers. Serial ports are rarely used\
    \ on modern PCs, so this can be ignored.\n\n- `floppy_init`: This is for floppy\
    \ initialization. Floppies are now obsolete and there are no longer floppy controllers\
    \ on computers, so ignore this as well.\n\n![](img/file152.webp \"fig:\")\n\n\
    Beyond these, we have clarified all initialization! Round applause for this stage\
    \ victory!!! Meanwhile, this chapter will serve as an index later; the data structures\
    \ set during initialization are very important. If you forget them later, you\
    \ can come back and check here. Good luck to everyone. As for what happens next,\
    \ listen to the next session for details.\n\n# Part 3: The Birth of a New Process\n\
    \n***\n\n## Session 21: Overview of New Process Birth\n\n> Original Link: [`mp.weixin.qq.com/s/H_OCZ2ZtGHWHge_rYKCkJw`](https://mp.weixin.qq.com/s/H_OCZ2ZtGHWHge_rYKCkJw)\n\
    \nThis article is the first of Part Three.\n\nThe birth of a new process, from\
    \ the OS source code perspective, is actually just two lines of code. The focus\
    \ of process creation is actually one line of code: the famous `fork` function.\n\
    \nLet's look at a diagram first to see what the OS does from power-on to idle.\n\
    \n![](img/file153.webp \"fig:\")\n\nAs you can see, Parts One and Two provided\
    \ sufficient groundwork for Part Three.\n\n```c\nvoid main(void) {\n    // Content\
    \ from Part Two, various initializations\n    ...\n    move_to_user_mode();\n\
    \    if (!fork()) {\n        // What the new process does is the content of Part\
    \ Four\n        init();\n    }\n    // Infinite loop, OS idles\n    for(;;) pause();\n\
    }\n```\n\n"
- fmt: "\n整个过程被操作系统的机制拿捏的死死的，始终让用户进程处于用户态运行，必要的时候陷入一下内核态，但很快就会被返回而再次回到用户态，是不是非常无奈？这样操作系统就掌控了控制权，而用户进程再怎么折腾也无法逃出这个模式。\n\
    \n### 内核态与用户态的本质-特权级\n\n首先从一个最大的视角来看，这一切都源于 CPU 的保护机制。CPU 为了配合操作系统完成保护机制这一特性，分别设计了**分段保护机制**与**分页保护机制**。\n\
    \n当我们在 [第七回 | 六行代码就进入了保护模式](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499699&idx=1&sn=000d83798b0158dbdf48d76e49d3ff96&chksm=c2c5851ef5b20c08bc641d4b118db78a3af5a4f90a057d1ce9f9b68f04b529124f466c743bc5&scene=21#wechat_redirect)\
    \ 将 `cr0` 寄存器的 `PE` 位开启时，就开启了保护模式，也即开启了**分段保护机制**。\n\n![](media/file157.webp \"\
    fig:\")\n\n当我们在 [第九回 | Intel 内存管理两板斧：分段与分页](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499821&idx=1&sn=df90a7c57607bf501b5ef535f8440d98&chksm=c2c5ba80f5b233969bf591f919107e28e7be51f066821cba1ea39bf19cc0332b95b94d29467d&scene=21#wechat_redirect)\
    \ 将 `cr0` 寄存器的 `PG` 位开启时，就开启了分页模式，也即开启了**分页保护机制**。\n\n![](media/file158.webp \"\
    fig:\")\n\n有关特权级的保护，实际上属于分段保护机制的一种的一种。具体怎么保护的呢？由于这里的细节比较繁琐，所以我举个例子简单理解下即可，实际上的特权级检查规则要比我说的多好多内容。\n\
    \n我们目前正在执行的代码地址，是通过 CPU 中的两个寄存器 `cs : eip` 指向的对吧？`cs` 寄存器是代码段寄存器，里面存着的是段选择子，还记得它的结构么？\n\
    \n![](media/file159.webp \"fig:\")\n\n这里面的低端两位，此时表示 **CPL**，也就是**当前所处的特权级**，假如我们现在这个时刻，`CS`\
    \ 寄存器的后两位为 3，二进制就是 11，就表示是当前处理器处于用户态这个特权级。\n\n假如我们此时要跳转到另一处内存地址执行，在最终的汇编指令层面无非就是\
    \ `jmp`、`call` 和中断。我们拿 `jmp` 跳转来举例。\n\n如果是短跳转，也就是直接 `jmp xxx`，那涉及到段的变换，也就没有特权级检查这回事。\n\
    \n如果是长跳转，也就是 `jmp yyy : xxx`，这里的 `yyy` 就是另一个要跳转到的段的段选择子结构。\n\n![](media/file160.webp\
    \ \"fig:\")\n\n这个结构仍然是一样的段选择子结构，只不过这里的低端两位，表示 **RPL**，也就是**请求特权级**，表示我想请求的特权级是什么。同时，CPU\
    \ 会拿这个段选择子去全局描述符表寻找段描述符，从中找到段基址。\n\n![](media/file161.webp \"fig:\")\n\n那还记得段描述符的样子么？\n\
    \n![](media/file162.webp \"fig:\")\n\n你看，这里面又有个 **DPL**，这表示**目标代码段特权级**，也就是即将要跳转过去的那个段的特权级。\n\
    \n好了，我们总结一下简图，就是这三个玩意的比较。\n\n![](media/file163.webp \"fig:\")\n\n这里的检查规则比较多，简单说，绝大多数情况下，**要求\
    \ CPL 必须等于 DPL**，才会跳转成功，否则就会报错。\n\n也就是说，当前代码所处段的特权级，必须要等于要跳转过去的代码所处的段的特权级，那就只能**用户态往用户态跳**，**内核态往内核态跳**，这样就防止了处于用户态的程序，跳转到内核态的代码段中做坏事。\n\
    \n这只是代码段跳转时所做的特权级检查，还有访问内存数据时也会有数据段的特权级检查，这里就不展开了。最终的效果是，**处于内核态的代码可以访问任何特权级的数据段，处于用户态的代码则只可以访问用户态的数据段**，这也就实现了内存数据读写的保护。\n\
    \n说了这么多，其实就是，**代码跳转只能同特权级，数据访问只能高特权级访问低特权级**。\n\n### 特权级转换的方式\n\n诶不对呀，那我们今天要讲的是，从内核态转变为用户态，那如果代码跳转只能同特权级跳，我们现在处于内核态，要才能跳转到用户态？Intel\
    \ 设计了好多种权级转换的方式，**中断**和**中断返回**就是一种。处于用户态的程序，通过触发中断可以进入内核态，之后中断返回，可以恢复为用户态。就是刚刚的图表示。\n\
    \n![](media/file164.webp \"fig:\")\n\n而系统调用就是这么玩的，用户通过 `int 80` 指令触发了中断，CPU 切换至内核态，执行中断程序，之后中断返回，从内核态切换回用户态。但有个问题是，当前的代码此时处于内核态，并不是由用户态通过中断而切换内核态，那怎么回到用户态？答案还是通过中断返回。Intel\
    \ 设计的中断返回应该是配套使用的，也可以单独使用，我们看代码。\n\n```c\nvoid main(void) {\n    ...\n    move_to_user_mode();\n\
    \    ...\n}\n\n#define move_to_user_mode()  \n_asm {\n    _asm mov eax,esp\n \
    \   _asm push 00000017h  ; 给 SS 赋值\n    _asm push eax\n    _asm pushfd\n    _asm\
    \ push 000000fh  ; 给 CS 赋值\n    _asm push offset l1\n    _asm iretd /* 执行中断返回*/\n\
    \    l1: mov eax,17h\n    _asm ds,ax\n    _asm es,ax\n    _asm fs,ax\n    _asm\
    \ gs,ax\n}\n```\n\n你看，这个方法里直接执行了中断返回 `iretd`。那么为什么之前进行了一共五次的压栈操作呢？因为中断返回理论上应该和中断配合，而此时并不是发生了中断，所以得假装发生了中断才行。怎么假装呢？其实就把栈做好，中断发生时，CPU\
    \ 会自动帮我们做如下压栈操作。而中断返回时，CPU 又帮我们把这些值赋值给寄存器。\n\n![](media/file165.webp \"fig:\"\
    )\n\n去掉错误码，刚好五个参数，所以我们在代码中模仿 CPU 进行了五次压栈操作，这样在执行 `iretd` 指令时，硬件会按顺序将压入栈中的数据，分别赋值给\
    \ `SS`、`ESP`、`EFLAGS`、`CS`、`EIP` 几个寄存器，这就感觉像是正确返回一样，让其误以为通过中断进来的。\n\n压入栈的 `CS`\
    \ 和 `EIP` 表示中断发生前代码所处的位置，这样中断返回后好继续执行。压入栈的 `SS` 和 `ESP` 表示中断发生栈的位置，这样中断返回后好恢复原来的栈。其中，特权级的转换，就体现在\
    \ `CS` 和 `SS` 寄存器的值里，都是细节！`CS` 和 `SS` 寄存器是段寄存器的一种，段寄存器里的值是段选择子，其结构上面提过两遍，在 [第六回\
    \ | 先解决寄存器的历史包袱](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499667&idx=1&sn=a7e2297f16d04879fa31cceaa183fc9&chksm=c2c5853ef5b20c286df24a28013f0fc3b033790eca4a0d06ab831f6c536c0d1398893534b&scene=21#wechat_redirect)\
    \ 中也专门讲了这个结构的作用。\n\n![](media/file166.webp \"fig:\")\n\n对着这个结构，我们看代码。\n\n```c\n\
    #define move_to_user_mode()  \n_asm {\n    _asm mov eax,esp\n    _asm push 00000017h\
    \ ; 给 SS 赋值\n    _asm push eax\n    _asm pushfd\n    _asm push 0000000fh ; 给 CS\
    \ 赋值\n    _asm push offset l1\n    _asm iretd /* 执行中断返回*/\n    l1: mov eax,17h\n\
    \    _asm ds,ax\n    _asm es,ax\n    _asm fs,ax\n    _asm gs,ax\n}\n```\n\n拿 `CS`\
    \ 举例，给它赋的值 `000000fh`，用二进制表示 `0000000000001111`，最后两位 `11` 表示用户态。`CS` 寄存器里的特权级\
    \ `CPL`，即当前处理器特权级。经过 `iretd` 返回之后，`CS` 的值变成了它，当前处理器特权级变成了用户态。除了改变特权级，还做了什么？我们关注段寄存器的部分，详细看看\
    \ `CS` 为 `0000000000001111` 最后的含义。\n\n![](media/file167.webp \"fig:\")\n\n继续解读，倒数第三位\
    \ `TI` 表示前面的描述符是从 `GDT` 还是 `LDT` 取，`1` 表示从局部描述符取。描述符索引 `1` 表示从局部描述符取到代码段，如果你熟悉前面讲的内容将会得出上述结论。我们将\
    \ `0` 号 `LDT` 作为当前的 `LDT` 索引，记录在了 `lldt` 寄存器中。\n\n```c\n#define lldt(n) __asm__(\"\
    lldt %%ax\":\"a\"(LDT(n)))\nvoid sched_init(void) {\n    ...\n    lldt(0);\n \
    \   ...\n}\n```\n\n整个 `GDT` 与 `LDT` 表的设计，经过 [第一部分 进入内核前的苦活](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499882&idx=1&sn=68fd1c5aeae15084be58af1e5bd9e8&chksm=c2cbac7f5b233d1c486fa579e3a2bc907a92ab69ff0344ab4d50bdaf76e776b4b42914&scene=21#wechat_redirect)\
    \ 和 [第二部分 大战前期的初始化工作](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0==&mid=2247500983&idx=1&sn=ad4c430823c975df7f13de3fbe8c66e&chksm=c2c5be1af5b2370cadce3218c5294feee4ae2e4d28804398c1dc8ac252c8dfafbe41ccf58c&scene=21#wechat_redirect)\
    \ 的设计后，成了这个样子。\n\n![](media/file168.webp \"fig:\")\n\n所以，一目了然。再看这行代码，把 `eip` 寄存器赋值为了那行标号的地址。\n\
    \n```c\nvoid main(void) {\n    ...\n    move_to_user_mode();\n    ...\n}\n\n#define\
    \ move_to_user_mode()  \n_asm {\n    _asm mov eax,esp\n    _asm push 00000017h\n\
    \    _asm push eax\n    _asm pushfd\n    _asm push 000000fh\n    _asm push offset\
    \ l1\n    _asm iretd\n    l1: mov eax,17h\n    _asm ds,ax\n    _asm es,ax\n  \
    \  _asm fs,ax\n    _asm gs,ax\n}\n```\n"
  raw: "整个过程被操作系统的机制拿捏的死死的，始终让用户进程处于用户态运行，必要的时候陷入一下内核态，但很快就会被返回而再次回到用户态，是不是非常无奈？这样操作系统就掌控了控制权，而用户进程再怎么折腾也无法逃出这个模式。\n\
    \n**内核态与用户态的本质-特权级**\n\n首先从一个最大的视角来看，这一切都源于 CPU 的保护机制。CPU 为了配合操作系统完成保护机制这一特性，分别设计了**分段保护机制**与**分页保护机制**。\n\
    \n当我们在 [第七回 | 六行代码就进入了保护模式](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499699&idx=1&sn=000d83798b0158dbdf48d76e49d3ff96&chksm=c2c5851ef5b20c08bc641d4b118db78a3af5a4f90a057d1ce9f9b68f04b529124f466c743bc5&scene=21#wechat_redirect)\
    \ 将 cr0 寄存器的 PE 位开启时，就开启了保护模式，也即开启了**分段保护机制**。\n\n![](media/file157.webp \"fig:\"\
    )\n\n当我们在 [第九回 | Intel 内存管理两板斧：分段与分页](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499821&idx=1&sn=df90a7c57607bf501b5ef535f8440d98&chksm=c2c5ba80f5b233969bf591f919107e28e7be51f066821cba1ea39bf19cc0332b95b94d29467d&scene=21#wechat_redirect)\
    \ 将 cr0 寄存器的 PG 位开启时，就开启了分页模式，也即开启了**分页保护机制**。\n\n![](media/file158.webp \"fig:\"\
    )\n\n有关特权级的保护，实际上**属于分段保护机制的一种**。具体怎么保护的呢？由于这里的细节比较繁琐，所以我举个例子简单理解下即可，实际上的特权级检查规则要比我说的多好多内容。\n\
    \n我们目前正在执行的代码地址，是通过 CPU 中的两个寄存器 cs : eip 指向的对吧？cs 寄存器是代码段寄存器，里面存着的是段选择子，还记得它的结构么？\n\
    \n![](media/file159.webp \"fig:\")\n\n这里面的低端两位，此时表示 **CPL**，也就是**当前所处的特权级**，假如我们现在这个时刻，CS\
    \ 寄存器的后两位为 3，二进制就是 11，就表示是当前处理器处于用户态这个特权级。\n\n假如我们此时要跳转到另一处内存地址执行，在最终的汇编指令层面无非就是\
    \ jmp、call 和中断。我们拿 jmp 跳转来举例。\n\n如果是短跳转，也就是直接 jmp xxx，那不涉及到段的变换，也就没有特权级检查这回事。\n\
    \n如果是长跳转，也就是 jmp yyy : xxx，这里的 yyy 就是另一个要跳转到的段的段选择子结构。\n\n![](media/file160.webp\
    \ \"fig:\")\n\n这个结构仍然是一样的段选择子结构，只不过这里的低端两位，表示 **RPL**，也就是**请求特权级**，表示我想请求的特权级是什么。同时，CPU\
    \ 会拿这个段选择子去全局描述符表中寻找段描述符，从中找到段基址。\n\n![](media/file161.webp \"fig:\")\n\n那还记得段描述符的样子么？\n\
    \n![](media/file162.webp \"fig:\")\n\n你看，这里面又有个 **DPL**，这表示**目标代码段特权级**，也就是即将要跳转过去的那个段的特权级。\n\
    \n好了，我们总结一下简图，就是这三个玩意的比较。\n\n![](media/file163.webp \"fig:\")\n\n这里的检查规则比较多，简单说，绝大多数情况下，**要求\
    \ CPL 必须等于 DPL**，才会跳转成功，否则就会报错。\n\n也就是说，当前代码所处段的特权级，必须要等于要跳转过去的代码所处的段的特权级，那就只能**用户态往用户态跳**，**内核态往内核态跳**，这样就防止了处于用户态的程序，跳转到内核态的代码段中做坏事。\n\
    \n这只是代码段跳转时所做的特权级检查，还有访问内存数据时也会有数据段的特权级检查，这里就不展开了。最终的效果是，**处于内核态的代码可以访问任何特权级的数据段，处于用户态的代码则只可以访问用户态的数据段**，这也就实现了内存数据读写的保护。\n\
    \n说了这么多，其实就是，**代码跳转只能同特权级，数据访问只能高特权级访问低特权级**。\n\n**特权级转换的方式**\n\n诶不对呀，那我们今天要讲的是，从内核态转变为用户态，那如果代码跳转只能同特权级跳，我们现在处于内核态，要怎么样才能跳转到用户态呢？\n\
    \nIntel 设计了好多种特权级转换的方式，**中断**和**中断返回**就是其中的一种。\n\n**处于用户态的程序，通过触发中断，可以进入内核态，之后再通过中断返回，又可以恢复为用户态**。\n\
    \n就是刚刚的图所表示的。\n\n![](media/file164.webp \"fig:\")\n\n而**系统调用**就是这么玩的，用户通过 **int\
    \ 0x80** 中断指令触发了中断，CPU 切换至内核态，执行中断处理程序，之后中断程序返回，又从内核态切换回用户态。\n\n但有个问题是，我们当前的代码，此时就是处于内核态，并不是由一个用户态程序通过中断而切换到的内核态，那怎么回到原来的用户态呢？答案还是，通过中断返回。\n\
    \n没有中断也能中断返回？可以的，Intel 设计的 CPU 就是这样不符合人们的直觉，中断和中断返回的确是应该配套使用的，但也可以单独使用，我们看代码。\n\
    \n```\n[](#cb128-1)void main(void) {\n[](#cb128-2)    ... \n[](#cb128-3)    move_to_user_mode();\n\
    [](#cb128-4)    ...\n[](#cb128-5)}\n[](#cb128-6)\n[](#cb128-7)#define move_to_user_mode()\
    \  \\\n[](#cb128-8)_asm {  \\\n[](#cb128-9) _asm mov eax,esp \\\n[](#cb128-10)\
    \ _asm push 00000017h  \\\n[](#cb128-11) _asm push eax \\\n[](#cb128-12) _asm\
    \ pushfd \\\n[](#cb128-13) _asm push 0000000fh  \\\n[](#cb128-14) _asm push offset\
    \ l1 \\\n[](#cb128-15) _asm iretd /* 执行中断返回指令*/  \\\n[](#cb128-16)_asm l1: mov\
    \ eax,17h  \\\n[](#cb128-17) _asm mov ds,ax \\\n[](#cb128-18) _asm mov es,ax \\\
    \n[](#cb128-19) _asm mov fs,ax \\\n[](#cb128-20) _asm mov gs,ax \\\n[](#cb128-21)}\n\
    ```\n\n你看，这个方法里直接就执行了中断返回指令 iretd。\n\n那么为什么之前进行了一共**五次的压栈操作呢**？因为中断返回理论上就是应该和中断配合使用的，而此时并不是真的发生了中断到这里，所以我们得**假装发生了中断**才行。\n\
    \n怎么假装呢？其实就把栈做做工作就好了，中断发生时，CPU 会自动帮我们做如下的压栈操作。而中断返回时，CPU 又会帮我们把压栈的这些值返序赋值给响应的寄存器。\n\
    \n![](media/file165.webp \"fig:\")\n\n去掉错误码，刚好是五个参数，所以我们在代码中模仿 CPU 进行了五次压栈操作，这样在执行\
    \ iretd 指令时，硬件会按顺序将刚刚压入栈中的数据，分别赋值给 SS、ESP、EFLAGS、CS、EIP 这几个寄存器，这就感觉像是正确返回了一样，让其**误以为这是通过中断进来的**。\n\
    \n压入栈的 CS 和 EIP 就表示中断发生前代码所处的位置，这样中断返回后好继续去那里执行。\n\n压入栈的 SS 和 ESP 表示中断发生前的栈的位置，这样中断返回后才好恢复原来的栈。\n\
    \n其中，特权级的转换，就体现在 CS 和 SS 寄存器的值里，都是细节！\n\nCS 和 SS 寄存器是段寄存器的一种，段寄存器里的值是段选择子，其结构上面已经提过两遍了，在\
    \ [第六回 | 先解决段寄存器的历史包袱问题](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499667&idx=1&sn=a7e2297f16d048794fa31cceaa183fc9&chksm=c2c5853ef5b20c286df24a28013f0fc3b0336790eca4a0d069ab831f6c536c03d1398893534b&scene=21#wechat_redirect)\
    \ 中也专门讲了这个结构的作用。\n\n![](media/file166.webp \"fig:\")\n\n对着这个结构，我们看代码。\n\n```\n\
    [](#cb129-1)#define move_to_user_mode()  \\\n[](#cb129-2)_asm {  \\\n[](#cb129-3)\
    \ _asm mov eax,esp \\\n[](#cb129-4) _asm push 00000017h \\ ; 给 SS 赋值\n[](#cb129-5)\
    \    _asm push eax \\\n[](#cb129-6)    _asm pushfd \\\n[](#cb129-7)    _asm push\
    \ 0000000fh \\ ; 给 CS 赋值\n[](#cb129-8)    _asm push offset l1 \\\n[](#cb129-9)\
    \    _asm iretd /* 执行中断返回指令*/ \\\n[](#cb129-10)_asm l1: mov eax,17h \\\n[](#cb129-11)\
    \    _asm mov ds,ax \\\n[](#cb129-12)    _asm mov es,ax \\\n[](#cb129-13)    _asm\
    \ mov fs,ax \\\n[](#cb129-14)    _asm mov gs,ax \\\n[](#cb129-15)}\n```\n\n拿 CS\
    \ 举例，给它赋的值是，**0000000fh**，用二进制表示为：\n\n> **0000000000001111**\n\n最后两位 11 表示特权级为\
    \ 3，即用户态。而我们刚刚说了，CS 寄存器里的特权级，表示 CPL，即当前处理器特权级。\n\n**所以经过 iretd 返回之后，CS 的值就变成了它，而当前处理器特权级，也就变成了用户态特权级。**\n\
    \n**除了改变特权级之外**\n\n除了改变了特权级之外，还做了什么事情呢？\n\n刚刚我们关注段寄存器，只关注了特权级的部分，我们再详细看看。\n\n\
    刚刚说了 CS 寄存器为 **0000000000001111**，最后两位表示用户态的含义。\n\n![](media/file167.webp \"fig:\"\
    )\n\n那继续解读，倒数第三位 TI 表示，前面的描述符索引，是从 GDT 还是 LDT 中取，1 表示 LDT，也就是从局部描述符表中取。\n\n前面的描述符索引为\
    \ 1，表示从局部描述符表中取到代码段描述符，如果你熟悉前面我讲过的内容，你将会直接得出上述结论。不过我还是帮你回忆一下。\n\n在 [第18回 | 大名鼎鼎的进程调度就是从这里开始的](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c68c2b03d9721ba74e949cfa8&chksm=c2c5b87df5b2316b083015a4fdba2df29211f38fcfd1cdb040e02ab410432608e26383a43ef5&scene=21#wechat_redirect)\
    \ 中，将 0 号 LDT 作为当前的 LDT 索引，记录在了 CPU 的 lldt 寄存器中。\n\n```\n[](#cb130-1)#define lldt(n)\
    \ __asm__(\"lldt %%ax\"::\"a\"  (_LDT(n)))\n[](#cb130-2)\n[](#cb130-3)void sched_init(void)\
    \ {\n[](#cb130-4)    ...\n[](#cb130-5)    lldt(0);\n[](#cb130-6)    ...\n[](#cb130-7)}\n\
    ```\n\n而整个 GDT 与 LDT 表的设计，经过整个 [第一部分 进入内核前的苦力活](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499882&idx=1&sn=68fd16c5aeae15084be58afb1e5bd9e8&chksm=c2c5bac7f5b233d1c486fa57e9e3a2bc907a92ab69ff0344babab4d50bdaf76e7766b4b42914&scene=21#wechat_redirect)\
    \ 和 [第二部分 大战前期的初始化工作](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500983&idx=1&sn=ad4c430823c975df97f13de3fbe8c66e&chksm=c2c5be1af5b2370cad4ce3218c5294feee4ae2e4d28804398c1dc8ac252c8dfafbe419ccf58c&scene=21#wechat_redirect)\
    \ 的设计后，成了这个样子。\n\n![](media/file168.webp \"fig:\")\n\n所以，一目了然。\n\n再看这行代码，把 EIP\
    \ 寄存器赋值为了那行标号的地址。\n\n```\n[](#cb131-1)void main(void) {\n[](#cb131-2)    ... \n\
    [](#cb131-3)    move_to_user_mode();\n[](#cb131-4)    ...\n[](#cb131-5)}\n[](#cb131-6)\n\
    [](#cb131-7)#define move_to_user_mode()  \\\n[](#cb131-8)_asm {  \\\n[](#cb131-9)\
    \ _asm mov eax,esp \\\n[](#cb131-10) _asm push 00000017h  \\\n[](#cb131-11) _asm\
    \ push eax \\\n[](#cb131-12) _asm pushfd \\\n[](#cb131-13) _asm push 0000000fh\
    \  \\\n[](#cb131-14) _asm push offset l1 \\\n[](#cb131-15) _asm iretd /* 执行中断返回指令*/\
    \  \\\n[](#cb131-16)_asm l1: mov eax,17h  \\\n[](#cb131-17) _asm mov ds,ax \\\n\
    [](#cb131-18) _asm mov es,ax \\\n[](#cb131-19) _asm mov fs,ax \\\n[](#cb131-20)\
    \ _asm mov gs,ax \\\n[](#cb131-21)}\n```\n\n这里刚好设置的是下面标号 l1 的位置，所以 iretd 之后 CPU\
    \ 就乖乖去那里执行了。所以其实从效果上看，就是顺序往下执行，只不过利用了 iretd 做了些特权级转换等工作。\n\n同理，这里的栈段 ss 和数据段 ds，都被赋值为了\
    \ 17h，大家可以展开二进制算一下，他们又是什么特权级，对应的描述符又是谁。\n\n**总结**\n\n所以其实，最终效果上看就是按顺序执行了我们所写的指令，仿佛没有经过什么中断和中断返回的过程，但却通过中断返回实现了特权级的翻转，也就是从内核态变为了用户态，顺便设置了栈段、代码段和数据段的基地址。\n\
    \n好了，我们兜兜转转终于把这个 mov_to_user_mode 讲完了，特权级这块的检查细节非常繁琐，为了理解操作系统，我们只需要暂且记住如下一句话就好了：\n\
    \n**数据访问只能高特权级访问低特权级，代码跳转只能同特权级跳转，要想实现特权级转换，可以通过中断和中断返回来实现。**\n\nOK，我们现在已经进入了用户态，也即表明了需要内核态来完成的工作已经全部安排妥当了，其实就是整个\
    \ [第一部分 进入内核前的苦力活](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499882&idx=1&sn=68fd16c5aeae15084be58afb1e5bd9e8&chksm=c2c5bac7f5b233d1c486fa57e9e3a2bc907a92ab69ff0344babab4d50bdaf76e7766b4b42914&scene=21#wechat_redirect)\
    \ 和 [第二部分 大战前期的初始化工作](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500983&idx=1&sn=ad4c430823c975df97f13de3fbe8c66e&chksm=c2c5be1af5b2370cad4ce3218c5294feee4ae2e4d28804398c1dc8ac252c8dfafbe419ccf58c&scene=21#wechat_redirect)\
    \ 的内容，对全局描述符表、中断描述符表、页表等关键内存结构进行设置，以及对 CPU 特殊寄存器如 cr0 和 cr3 的设置，还有对外设如硬盘、键盘、定时器的设置等。\n\
    \n看来我们又完成了一大堆苦力活呀，内核态做的工作也真是枯燥乏味呢。接下来只需要在用户态进行工作即可了！\n\n欲知后事如何，且听下回分解。\n\n* *\
    \ *\n\n## 第23回 如果让你来设计进程调度\n\n> 原文链接: [https://mp.weixin.qq.com/s/Sf9vV7RCnVDlBKXx5jXs1Q](https://mp.weixin.qq.com/s/Sf9vV7RCnVDlBKXx5jXs1Q)\n\
    \n书接上回，上回书咱们说到，操作系统通过 **move_to_user_mode** 方法，通过伪造一个中断和中断返回，巧妙地从内核态切换到了用户态。"
