    \n* * *\n\n## 第30回 番外篇 - 写时复制就这么几行代码\n\n> 原文链接: [https://mp.weixin.qq.com/s/Pdnmys_hGoToZN193rfnoQ](https://mp.weixin.qq.com/s/Pdnmys_hGoToZN193rfnoQ)\n\
    \n这里讲的是 Linux 内核里的写时复制原理。\n\n写时复制的原理网上讲述的文章很多，今天来一篇很直接的文章，通过看看 Linux `0.11` 这个最简单的操作系统，从源码层面把写时复制的原理搞清楚。\n\
    \n很简单哦，你可别中途就放弃了。\n\n直接干！\n\n哦不行，干之前先来点储备知识，如果你已经有了这一 pa 可以略过，不过我估计你没有...\n\n\
    ### 储备知识\n\n坚持看完这部分，写时复制用到的知识只有其中一个位，但我把周边也讲讲。32 位模式下，Intel 设计了**页目录表**和**页表**两种结构，用来程序员提供分页机制。\n\
    \n大部分的操作系统使用的 `4KB` 大小，Linux `0.11` 也是，所以我们只看。一个程序员给出的逻辑地址，先经过分段机制变成线性地址，再经过分页机制变成物理地址。\n\
    \nFigure `4-2` 给出了线性地址到物理地址。\n\n![](media/file213.webp \"fig:\")\n\n这里的 `PDE`\
    \ 就是页目录表，`PTE` 就是页表。刚刚说接下来的 `Table 5` 和 `Table 6`，详细解释了页目录表和页表字段的含义。`Table 5`\
    \ 是页目录表。\n\n![](media/file214.webp \"fig:\")\n\n`Table 6` 是页表。\n\n![](media/file215.webp\
    \ \"fig:\")\n\n他们几乎一样的含义，我们就只看页表，看一些重要的位。`31` 表示页的起始物理地址，加上线性地址的后 `12` 位偏移，就构成了最终访问的内存物理地址，这个就不说了。`0`\
    \ 位是 `P`，表示存在。第 `1` 位是 `RW`，表示读写，`0` 表示只读，那么此时往这个内存范围内写数据，不允许。第 `2` 位是 `US`，表示用户态还是内核态，`0`\
    \ 表示内核态，那么此时用户态往这个内存范围内写数据，不允许。在 Linux `0.11` 的 `head.s` 里，初次为页表设置如下：\n\n```\n\
    setup_paging:\n   ...\n    movl $pg0+7,_pg_dir     /* set present bit/user r/w\
    \ */\n    movl $pg1+7,_pg_dir+4       /*  --------- --------- */\n    movl $pg2+7,_pg_dir+8\
    \       /*  --------- --------- */\n    movl $pg3+7,_pg_dir+12      /*  ---------\
    \ --------- */\n    movl $pg3+4096,%edi\n    movl $0xfff07,%eax     /* 16Mb -\
    \ 4096 + 7 (r/w user,p) */\n    std\n1:  stosl\n    ...\n```\n\n后三位是 `7`，用二进制就是\
    \ `111`，即初始的 `4` 个页目录表和 `1024` 个页表，都是：存在（1），可读写（1），用户态（1）。好了，储备知识就到这里。如果你前面没读懂，你只需要知道，页表当中有一位表示读写的，而\
    \ Linux `0.11` 初始化时，把它设置为了 `1`，表示可读写。\n\n### 写时复制的本质\n\n在调用 `fork()` 生成新进程时，新进程与原进程会共享同一内存区。只有当其中一个进程进行写操作时，系统才会为其另外分配内存页面。之前在我的[操作系统](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247499207&idx=1&sn=f00bf7653ae57faa6266bf18287e6bb&chksm=c2c5876af5b207cdf5094696d266ee3fa09514601b021ce602ecaf0ec79857045b43e286a58&scene=21#wechat_redirect)，我给过一个\
    \ Linux `0.11` 进程的内存规划图。\n\n![](media/file216.webp \"fig:\")\n\n不过我们考虑写时复制并不用复杂，去掉些细节就是：原来的进程通过自己的页表占用了一定范围的物理内存空间。\n\
    \n![](media/file217.webp \"fig:\")\n\n调用 `fork` 创建新进程时，原本页表和物理地址空间里的内容，都要进行复制，因为进程的内存空间是要隔离的嘛。\n\
    \n![](media/file218.webp \"fig:\")\n\n但 `fork` 函数认为，复制物理地址空间里的内容比较费时，所以姑且先只复制页表，物理地址空间的内容先不复制。![](media/file219.webp\
    \ \"fig:\")\n\n如果只有读操作，那就完全没有影响，不复制物理地址空间里的内容就无所谓了，这就很赚。但如果有写操作，那就不得不把物理地址空间里的值复制一份，保证进程间的内存隔离。![](media/file220.webp\
    \ \"fig:\")\n\n有写操作时，再复制物理内存，就叫写时复制。\n\n### 看看代码咋写的\n\n有上述的现象，必然是在 `fork` 时，对页表做了手脚，这回知道为啥储备知识里讲页表结构了吧？同时，只要有写操作，就会触发写时复制逻辑，这是咋做到的？答案是通过中断，具体是缺页中断。好的首先来看\
    \ `fork`。`fork` 细节很多，具体看[一个新进程的诞生（六）进程复制](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247499207&idx=1&sn=ad61881765321501b2c8e734ff6&chksm=c2c5bd19f5b2340f0ae684fa2a208a9a21069376d2109ed542cf531b652784d0ee&scene=21)和[一个新进程的诞生（七）透过\
    \ fork 来看内存规划](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247499207&idx=1&sn=64adec917934594d095a1a1debcdacchksm=c2c5b287f5b239175d8eacf771b2223)，这里看其中关键的复制页表的代码。\n\
    \n```\nint copy_page_tables(...) {\n    ...\n    // 源页表和新页表一样\n    this_page =\
    \ *from_page_table;\n    ...\n    // 源页表和新页表均置只读\n    this_page &= ~2;\n    *from_page_table\
    \ = this_page;\n    ...\n}\n```\n\n还记得知识中的页表结构吧，就是把 `RW` 位置 0 了。![](media/file221.webp\
    \ \"fig:\") 用刚刚的 `fork` 图表示。![](media/file222.webp \"fig:\") 那么此时，再次对这块物理空间进行操作时，就不允许了。但不允许真的不允许，Intel\
    \ 会触发一个缺页中断，具体是 `0x14` 号中断，中断程序里怎么处理，由 Linux 源码发挥。\n\n```\nvoid do_page_fault(...,\
    \ unsigned long error_code) {\n    ... \n    if (error_code & 1)\n        do_wp_page(error_code,\
    \ address, user_esp);\n    else\n        do_no_page(error_code, address, user_esp);\n\
    \    ...\n}\n```\n\n可以看出，根据中断异常码 `error_code` 的不同，有不同的逻辑。那触发缺页中断的异常码都有哪些？在 Intel\
    \ `Volume-3` `Chapter 4.7` `Figure 4-12` 中给出。![](media/file223.webp \"fig:\")\
    \ 看出，当 `error_code` 的第 `0` 位，也就是存在位为 0 时，会走 `do_no_page` 逻辑，其余情况均走 `do_wp_page`\
    \ 逻辑。我们 `fork` 的时候只是将读写位变成了只读，存在位仍然是 1 没有动，所以会走 `do_wp_page` 逻辑。\n\n```\nvoid\
    \ do_wp_page(unsigned long error_code,unsigned long address) {\n    // 后面这一大坨计算了\
    \ address 在页表项的指针\n    un_wp_page((unsigned long *)\n        (((address>>10) &\
    \ 0xffc) + (0xfffff000 &\n        *((unsigned long *) ((address>>20) &0xffc))));\n\
    }\n\nvoid un_wp_page(unsigned long * table_entry) {\n    unsigned long old_page,new_page;\n\
    \    old_page = 0xfffff000 & *table_entry;\n    // 只被引用一次，说明没有被共享，那只改下读写属性就行了\n\
    \    if (mem_map[MAP_NR(old_page)]==1) {\n        *table_entry |= 2;\n       \
    \ invalidate();\n        return;\n    }\n    // 被引用多次，就需要复制页表\n    new_page=get_free_page();\n\
    \    mem_map[MAP_NR(old_page)]--;\n    *table_entry = new_page | 7;\n    invalidate();\n\
    \    copy_page(old_page,new_page);\n}\n\n// 刷新页缓冲宏\n#define invalidate()  \\\n\
    __asm__(\"movl %%eax,cr3\":\"a\"  (0))\n```"
