    \n![](img/file272.webp \"fig:\")\n\n看最右边的蓝色部分的流程即可。我们先建立了建立了的一些最基本的环境与管理结构，然后由进\
    \ 0 `fork` 出处于用户态执行的进程 1，进程 1 加载了文件系统并打开终端文件，紧接着就 fork 出了进程 2，进程 2 通过我们刚刚讲述的 `execve`\
