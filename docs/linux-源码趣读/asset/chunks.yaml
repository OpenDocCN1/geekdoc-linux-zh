  trans: "\n\n> 原文链接: [`mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502161&idx=1&sn=219186a1e587f40308515852d293aaf4&chksm=c2c5b3fcf5b23aead170092d4042abd54b272694cbaac3f750eb3adea584ee29653c72ad2915&scene=21#wechat_redirect`](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502161&idx=1&sn=219186a1e587f40308515852d293aaf4&chksm=c2c5b3fcf5b23aead170092d4042abd54b272694cbaac3f750eb3adea584ee29653c72ad2915&scene=21#wechat_redirect)\n\
    \n上一个大部分的名字叫[一个新进程的诞生](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501947&idx=1&sn=cb94f53c75d674d30fb4903778c74c08&chksm=c2c5b2d6f5b23bc027d9652d3e9949e55fd3b101beb87f6f80dd77d8233c0b51bede73edad46&scene=21#wechat_redirect)，讲述了进程\
    \ 0 调用了 `fork` 函数创建了一个新的进程 —— 进程 1，并且使其达到了可以被调度的状态，`fork` 就算正式完成了自己的使命。\n\n```c\n\
    void main(void) {\n    ...\n    move_to_user_mode();\n    if (!fork()) {\n   \
    \     init();\n    }\n    for(;;) pause();\n}\n```\n\n由于 `fork` 函数一调用，就又多出了一个进程，子进程（进程\
    \ 1）会返回 0，父进程（进程 0）返回子进程的 ID，所以 `init` 函数只有进程 1 才会执行。\n\n第三部分结束后，就到了现在的第四部分，**shell\
    \ 程序的到来**。而整个第四部分的故事，就是这个 `init` 函数做的事情。\n\n虽然就一行代码，但这里的事情可多了去了，我们先看一下整体结构。我已经把单纯的日志打印和错误校验逻辑去掉了。\n\
    \n```c\nvoid init(void) {\n    int pid,i;\n    setup((void *) &drive_info);\n\
    \    (void) open(\"/dev/tty0\",O_RDWR,0);\n    (void) dup(0);\n    (void) dup(0);\n\
    \    if (!(pid=fork())) {\n        open(\"/etc/rc\",O_RDONLY,0);\n        execve(\"\
    /bin/sh\",argv_rc,envp_rc);\n    }\n    if (pid>0)\n        while (pid != wait(&i))\n\
    \            /* nothing */;\n    while (1) {\n        if (!pid=fork()) {\n   \
    \         close(0);close(1);close(2);\n            setsid();\n            (void)\
    \ open(\"/dev/tty0\",O_RDWR,0);\n            (void) dup(0);\n            (void)\
    \ dup(0);\n            _exit(execve(\"/bin/sh\",argv,envp));\n        }\n    \
    \    while (1)\n            if (pid == wait(&i))\n                break;\n   \
    \     sync();\n    }\n    _exit(0);\n}\n```\n\n是不是看着挺复杂？不过别急，今天只讲第一行 `setup` 的一部分，硬盘信息的。\n\
    \n```c\nstruct drive_info { char dummy[32]; } drive_info;\n// drive_info = *(struct\
    \ drive_info *)0x0080;\nvoid init(void) {\n    setup((void *) &drive_info);\n\
    \    ...\n}\n```\n\n先看入参。`drive_info` 是来自内存 `0x0080` 的数据，这部分是由之前[进入模式前的最后一次折腾内存](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247499558&idx=1&sn=d5057fae2fb83d38f8204c269463&chksm=c2c558bf5b209de5c31dd34fbe76f6c6da17f544518a75fc183ada)\
    \ 讲的 `setup.s` 程序将硬盘 1 的参数放在这里，包括柱面数、磁头数、扇区数等信息。\n\n`setup` 是个系统调用，会通过中断调用到 `sys_setup`\
    \ 函数。关于系统调用的原理，我们不再赘述。\n\n"
- fmt: "\n# 文件系统加载与结构解析\n\n书接上回，上回书说到，`setup` 函数的一番折腾，加载了根文件系统，顺着根 `inode` 可以找到所有文件，为后续工作奠定了基础。\n\
    \n## setup 函数的作用\n\n`setup` 方法里的事情，也就是进程 `0` 执行的第一个方法。\n\n```c\nint setup(void\
    \ *) {\n    ...\n    mount_root();\n}\n```\n\n## mount_root 函数详解\n\n`mount_root`\
    \ 直译过来就是加载根。再说几个字就是加载文件系统，有了它之后，操作系统才能从根开始找到存储在硬盘中的文件，它是文件系统的基石，很重要。\n\n我们翻开看看，看下\
    \ `mount_root` 的具体实现：\n\n```c\nvoid mount_root(void) {\n    int i, free;\n   \
    \ struct super_block *p;\n    struct m_inode *mi;\n    for (i = 0; i < 64; i++)\
    \ {\n        file_table[i].f_count = 0;\n    }\n    for (p = &super_block[0];\
    \ p < &super_block[8]; p++) {\n        p->s_dev = 0;\n        p->s_lock = 0;\n\
    \        p->s_wait = NULL;\n    }\n    p = read_super(0);\n    mi = iget(0, 1);\n\
    \    mi->i_count += 3;\n    p->s_imount = mi;\n    current->pwd = mi;\n    current->root\
    \ = mi;\n    free = 0;\n    i = p->s_nzones;\n    while (--i >= 0) {\n       \
    \ if (!set_bit(i & 8191, p->s_zmap[i >> 13]->b_data)) {\n            free++;\n\
    \        }\n    }\n    free = 0;\n    i = p->s_ninodes + 1;\n    while (--i >=\
    \ 0) {\n        if (!set_bit(i & 8191, p->s_imap[i >> 13]->b_data)) {\n      \
    \      free++;\n        }\n    }\n}\n```\n\n很简单。从整体上说，它要把硬盘中的数据以文件系统的格式进行解读，加载到内存中设计好的数据结构，这样操作系统就可以通过内存中的数据以文件系统的方式访问硬盘中的一个个文件了。\n\
    \n![fig]\n\n其实搞清楚两个事情即可：\n1. 硬盘中的文件系统格式是怎样的？\n2. 内存中用于文件系统的数据结构有哪些？\n\n## 硬盘中的文件系统格式\n\
    \n首先，硬盘中的文件系统，无非就是硬盘中的一堆数据，我们按照一定格式去解析。Linux 中的文件系统是 `MINIX` 文件系统，它就长成这个样子。\n\n\
    ![fig]\n\n每一个块结构的大小是 1024 字节，也就是 `1KB`，硬盘里的数据就按照这个结构，妥善地安排在硬盘里。\n\n可是硬盘中凭什么就有了这些信息？这就是个鸡生蛋蛋生鸡的问题。你可以先写一个操作系统，然后给一个硬盘做某种文件系统的格式化，这样你就得到一个有文件系统的硬盘了，有了这个硬盘，你的操作系统就可以成功启动了。总之，想个办法给这个硬盘写上数据呗。\n\
    \n## MINIX 文件系统格式说明\n\n好了，现在我们简单看看 `MINIX` 文件系统的格式。\n\n- **引导块**：我们系列最开头说的启动区，当然不所有的硬盘都有启动区，但我们还是得预留出这个位置，以保持格式的统一。\n\
    - **超级块**：用于描述整个文件系统的整体信息。看它的字段就知道，有后面的 `inode` 数量、块数量、第一个块在哪里等信息。有了它，整个硬盘的布局就清晰了。\n\
    - **inode 位图和块位图**：位图的基本操作和作用表示后面 `inode` 和块的使用情况，和我们之前讲的内存占用位图 `mem_map[]` 是类似的。\n\
    - **inode**：再往后，`inode` 存放着每个文件或目录的元信息和索引信息。元信息就是文件类型、文件大小、修改时间等；索引信息就是大小为 9 的\
    \ `i_zone[9]` 块数组，表示这个文件或目录的具体数据占用了哪些块。\n\n其中块数组里，`0~6` 表示直接索引，`7` 表示一次间接索引，`8`\
    \ 表示二次间接索引。当文件比较小时，比如只占用 2 个块就够了，那就只需要 `zone[0]` 和 `zone[1]` 两个直接索引即可。\n\n![fig]\n\
    \n再往后，就都是存放具体文件或目录实际信息的**块**。如果是一个普通文件类型的 `inode` 指向的块，那里面就是二进制信息；如果是一个目录类型的 `inode`\
    \ 指向的块，那里面存放的就是目录下的文件和目录索引以及文件名称等信息。\n\n## 内存中文件系统的数据结构\n\n全面了解一个 `ext` 文件系统的脉络，基本思想都是一样的。从头来看代码是如何加载这种格式放在硬盘里的数据。\n\
    \n```c\nstruct file {\n    unsigned short f_mode;\n    unsigned short f_flags;\n\
    \    unsigned short f_count;\n    struct m_inode *f_inode;\n    off_t f_pos;\n\
    };\n\nvoid mount_root(void) {\n    for (i = 0; i < 64; i++) {\n        file_table[i].f_count\
    \ = 0;\n    }\n}\n```\n\n`64` 个 `file_table` 里的 `f_count` 清零。这个 `file_table` 表示进程使用的文件，进程使用一个文件都需要记录在这里，包括文件类型、`inode`\
    \ 索引等，而 `f_count` 表示被引用的次数。\n\n`file_table` 的索引就是我们通常说的文件描述符。比如如下：\n\n```bash\n\
    echo \"hello\" > 0\n```\n\n`0` 号描述符是哪个文件？就是 `file_table[0]`。这个文件在哪里？注意到 `file`\
    \ 结构里有个 `f_inode` 字段，通过 `f_inode` 找到它的 `inode` 信息。`inode` 信息包含了一个文件需要的全部信息，包括文件的大小、类型、所在的块号。\n\
    \n```c\nstruct super_block[8];\nvoid mount_root(void) {\n    ...\n    struct super_block\
    \ *p;\n    for (p = &super_block[0]; p < &super_block[8]; p++) {\n        p->s_dev\
    \ = 0;\n        p->s_lock = 0;\n        p->s_wait = NULL;\n    }\n    ...\n}\n\
    ```\n\n又是一个数组 `super_block` 做清零工作。`super_block` 存在的意义是，操作系统与设备以文件形式进行读写时，就需要这个设备的超级块放在这里。\n\
    \n![fig]\n\n通过这个超级块，就可以掌控这个设备的文件系统全局。接下来的操作就是读取硬盘的超级块信息到内存中。\n\n```c\nvoid mount_root(void)\
    \ {\n    ...\n    p = read_super(0);\n    ...\n}\n```\n\n`read_super` 读取硬盘中的超级块。接下来，读取根\
    \ `inode` 信息。\n\n```c\nstruct m_inode * mi;\nvoid mount_root(void) {\n    ...\n\
    \    mi = iget(0, 1);\n    ...\n}\n```\n\n然后将该 `inode` 设置为当前进程（也就是进程 `1`）的当前工作目录和根目录。\n\
    \n```c\nvoid mount_root(void) {\n    ...\n    current->pwd = mi;\n    current->root\
    \ = mi;\n    ...\n}\n```\n\n记录块位图信息：\n\n```c\nvoid mount_root(void) {\n    ...\n\
    \    i = p->s_nzones;\n    while (--i >= 0)\n        set_bit(i & 8191, p->s_zmap[i\
    \ >> 13]->b_data);\n    ...\n}\n```\n\n最后记录 `inode` 位图信息：\n\n```c\nvoid mount_root(void)\
    \ {\n    ...\n    i = p->s_ninodes + 1;\n    while (--i >= 0)\n        set_bit(i\
    \ & 8191, p->s_imap[i >> 13]->b_data);\n}\n```\n"
