    \nLinux 0.11 是 Linux 最早期的代码，非常适合作为第一款深入探索操作系统原理的代码。\n\n但同时，Linux 0.11 因为很多古老工具链的缺失，以及一些过时的文件格式比如\
    \ a.out，导致成功编译并运行它十分困难，更别说进行源码级别的 debug 调试了。\n\n要想成功调试 Linux 0.11，需要进行很多改造，并依赖一些古老的工具链，对于仅仅是将\
    \ Linux 0.11 作为研究操作系统的手段的我们，无需花费精力自己去改造它，踩各种坑。\n\n所以今天我就分享一下我调试 Linux 0.11 的一种方式，同时也为了我自己以后换电脑的时候方便照着自己的教程直接无脑搭建环境，那我们开始吧~\n\
    \n### 整体思路和效果\n\n我用的方式是，在 windows 上，搞一个 Ubuntu 16.04 的虚拟机，在里面用 qemu 启动一个开启了调试的\
    \ Linux 0.11 系统，然后用本机的 vscode remote ssh 连接到虚拟机，并开启 gdb 调试，最终的效果如下。\n\n![](media/file273.webp\
    \ \"fig:\")\n\n这是最舒服的方式，因为 vscode 是本机的，完全不受虚拟机的影响，这也是我调试其他代码时比较喜欢的方式。\n\n如果你有自己的豪华服务器，虚拟机也可以换成服务器，这样不但编译速度快，不消耗自己电脑的性能，同时也可以不受终端的影响，在家在公司都可以随时调试（方便摸鱼~）\n\
    \n当然如果你不需要这么直观 vscode 这一步也可以换成 gdb 命令行，在虚拟机里直接执行 gdb 相关命令即可。\n\n![](media/file274.webp\
    \ \"fig:\")\n\n下面我们就一步步来实现这个效果。\n\n### 第一步：配置虚拟机\n\n我用的虚拟机软件是\n\n**Oracle VM VirtualBox\
    \ Version 6.0.8 Edition**\n\n官网是：\n\n[https://ubuntu.com/](https://ubuntu.com/)\n\
    \n下载页面是：\n\n[https://www.virtualbox.org/wiki/Download_Old_Builds_6_0](https://www.virtualbox.org/wiki/Download_Old_Builds_6_0)\n\
    \n我这个版本的直接下载地址是：\n\n[https://download.virtualbox.org/virtualbox/6.0.8/VirtualBox-6.0.8-130520-Win.exe](https://download.virtualbox.org/virtualbox/6.0.8/VirtualBox-6.0.8-130520-Win.exe)\n\
    \n安装的操作系统镜像是\n\n**ubuntu-16.04.7-desktop-amd64**\n\n官网是：\n\n[https://ubuntu.com/](https://ubuntu.com/)\n\
    \n下载页面是：\n\n[https://releases.ubuntu.com/xenial/](https://releases.ubuntu.com/xenial/)\n\
    \n我这个版本的直接下载地址是：\n\n[https://releases.ubuntu.com/xenial/ubuntu-16.04.7-desktop-amd64.iso](https://releases.ubuntu.com/xenial/ubuntu-16.04.7-desktop-amd64.iso)\n\
    \n这个就不详细展开讲解了，最终达到这个效果就行。\n\n![](media/file275.webp \"fig:\")\n\n### 第二步：安装 qemu\n\
    \nqemu 是模拟器，简单理解和虚拟机一样，用来当做真机启动 Linux 0.11 的。\n\n官网是这个：\n\n[https://www.qemu.org/](https://www.qemu.org/)\n\
    \n我们在刚刚的 Ubuntu 虚拟机里直接按照官方教程下载 qemu\n\n**sudo apt-get install qemu**\n\n下载好后，我们输入\
    \ **qemu-**，按两下 tab，查看下支持的体系结构。\n\n![](media/file276.webp \"fig:\")\n\n看到有 **qemu-system-x86_64**\
    \ 即可，一会我们会用这个来模拟启动 Linux 0.11。\n\n### 第三步：下载并运行可调试的 Linux 0.11 源码\n\n这一步直接下官网上的是不行的，因为那个依赖好多古老的工具链。\n\
    \n这里一般网上都是参考了赵炯老师为我们修改好的 Linux 0.11 源码，用现代的工具链即可构建，造福了广大热爱内核的开发者，我们直接拿来主义即可。\n\
    \n在赵炯老师准备好的源码的基础上，很多人又进行了二次改造，使得其可以一键 qemu 或 bochs 启动，这里我选择了仓库：\n\n[https://github.com/yuan-xy/Linux-0.11](https://github.com/yuan-xy/Linux-0.11)\n\
    \n直接把源码下载下来，进入根目录，输入命令 **make start** 就可以把 Linux 0.11 跑起来了。\n\n![](media/file277.webp\
    \ \"fig:\")\n\n如果想 debug，那么就以 debug 形式启动，输入命令 **make debug**，它会卡住不动。\n\n![](media/file278.webp\
    \ \"fig:\")\n\n此时其实你就可以通过 gdb 进行调试了。\n\n再开一个窗口，输入命令 **gdb tools/system**\n\n然后\
    \ **target remote :1234**\n\n就可以愉快地进行 gdb 调试了\n\n![](media/file279.webp \"fig:\"\
    )\n\n具体 gdb 怎么玩，就不展开讲解了。\n\n### 第四步：通过 vscode 远程调试\n\n当然，你也可以在虚拟机里用 vscode 进行本地调试，但我觉得不爽。\n\
    \n所以，在本机的 windows 里安装好 vscode，下载 **remote-ssh** 插件。\n\n![](media/file280.webp\
    \ \"fig:\")\n\n下载好后按下 **ctrl + p**，输入 **>remote-ssh**，找到 **Connect to Host**\n\
    \n![](media/file281.webp \"fig:\")\n\n按照它提示的格式输入你的虚拟机 IP 和用户名，随后输入密码，即可远程连接到虚拟机。\n\
    \n之后点击菜单栏 **运行-启用调试**，在弹出的 **launch.json** 中做如下配置\n\n![](media/file282.webp \"\
    fig:\")\n\n```\n{\n    \"version\": \"0.2.0\",\n    \"configurations\": [\n  \
    \      {\n            \"name\": \"(gdb) Launch\",\n            \"type\": \"cppdbg\"\
    ,\n            \"request\": \"launch\",\n            \"program\": \"${workspaceFolder}/tools/system\"\
    ,\n            \"miDebuggerServerAddress\": \"127.0.0.1:1234\",\n            \"\
    args\": [],\n            \"stopAtEntry\": false,\n            \"cwd\": \"${workspaceFolder}\"\
    ,\n            \"environment\": [],\n            \"externalConsole\": false,\n\
    \            \"MIMode\": \"gdb\"\n        }\n    ]\n}\n```\n\n配置好后保存，在 main 函数里打个断点，再次点击菜单栏\
    \ **运行-启用调试**，可以发现调试成功。\n\n![](media/file283.webp \"fig:\")\n\n当然，记得每次 vscode\
    \ 调试前，在虚拟机里先把 Linux 0.11 跑起来，就是执行命令 **make debug**。\n\n这一步也可以配置到 vscode 里，但这一步没多少工作量，而且也不方便直观看到虚拟机里的行为，我就懒得弄了。\n\
    \n好了，这个教程到这里就结束了，这就是我调试 Linux 0.11 的其中一个办法，当然每个人可能都有自己喜欢的方式，只要适合自己就好。\n\n* * *\n\
    \n## 第40回 | 番外篇 - 为什么你怎么看也看不懂\n\n> 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502517&idx=1&sn=d6a20fb6ad50da584ac32e60823a1834&chksm=c2c5b018f5b2390e690c465aa35d822d14a23a2b76587303e9374aca431a718e1b104569efe4&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502517&idx=1&sn=d6a20fb6ad50da584ac32e60823a1834&chksm=c2c5b018f5b2390e690c465aa35d822d14a23a2b76587303e9374aca431a718e1b104569efe4&scene=21#wechat_redirect)\n\
    \n不知道你有没有过这样的感受，就是特别想弄懂一个技术原理，翻来覆去找了好多资料、书籍、视频，但就是怎么看也看不懂，一直在原地打转一样，非常痛苦。\n\n\
    写这篇文章是因为，之前我在根据 Linux 0.11 源码尝试弄懂 execve 的原理的时候，就是这种感受。\n\n我无数次静下心来，硬着头皮看它的源码，看讲解它的书籍，看那些用\"\
    通俗\"的语言解读它的视频。但就是一直原地打转，不知道是因为哪里卡住了，就是缕不顺它的原理。\n\n也正因为是这里的心病，我才决定写一个 Linux 0.11\
    \ 源码解读的系列，[你管这破玩意叫操作系统源码](https://mp.weixin.qq.com/mp/appmsgalbum?__biz=Mzk0MjE3NDE0Ng==&action=getalbum&album_id=2123743679373688834#wechat_redirect)，这样可以逼迫我夯实前面的细节，说不定对理解它有帮助呢。\n\
    \n历时了几个月，我终于写到了 execve 的原理，也就是 [第35回 | 扒开 execve 的皮](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502475&idx=1&sn=4fcdbaa03bf6a1ca04db4013309c6aa3&scene=21#wechat_redirect)\
    \ 这篇文章。\n\n也不知道是什么魔力，我这几个月完全没有再盯着 execve 的原理去看，但当我再次尝试理解它的时候，我已经没有之前那种障碍了，而是比较顺畅地根据源码、书籍等资料，把它的原理搞懂了。\n\
    \n------\n\n这就很奇怪了，**为什么我看专门讲它的文章和资料无法理解它，反而是看了与它不直接相关的东西使得我最终很轻松地把它弄懂了呢？**\n\n\
    现在想想看，其实 execve 本身并不复杂，它就是利用了中断、内存管理、文件系统、进程管理、可执行文件结构等多种底层知识结合起来的产物。\n\n所以，我看不懂\
    \ execve 实际上是因为我对底层的那些乱七八糟的细节不熟悉而间接导致的。\n\n比如它的 EIP 和 ESP 的重置就是利用中断返回指令的效果实现的，假如对中断压栈过程和栈空间布局不熟悉的话，那这部分的代码就跟看天书一样。但要是熟悉的话，那就跟看小儿书一样了。\n\
    \n而这些知识，和 execve 本身又无直接关系。\n\n------\n\n所以，为什么有些技术原理你怎么看也看不懂，我猜大部分情况和我这种情况是类似的。**就是和这个技术本身无关，而是支撑这个技术背后的底层技术，也就是你的内功不过关。**\n\
    \n当然，你说我就为了搞懂一个 execve，花了这么长时间把下面的东西搞清楚，是不是太浪费时间了？\n\n以前我也是这么认为的，但现在我发现，一直原地打转才是浪费时间，有些技术债是必须要\"\
    浪费\"很多时间去还的。\n\n而你花时间去搞明白了这些你觉得\"没什么用\"的底层知识后，就会发现他们真的很有用，能够帮助你秒懂好多你原来怎么看也看不懂的技术。\n\
    \n无论花多少时间在**操作系统**、**组成原理**、**数据结构**、**网络**这些地方，都不会浪费，也不会过时，放心去研究吧！\n\n当然同时也要记得实践，记得去拓宽自己的视野，这方面我这些年做的就不好，最近正在努力调整，因为其实实践和技术视野也是会反哺到你的技术原理理解上的。\n\
    \n* * *\n\n## 第四部分总结与回顾\n\n> 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502650&idx=1&sn=ad947d70d372a1bc46741c459fd0ef9a&chksm=c2c5b197f5b23881a5e61c5581300beb4b3f1db8cab79eabec22fd847f1cdc0e11d3a713fd9f&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502650&idx=1&sn=ad947d70d372a1bc46741c459fd0ef9a&chksm=c2c5b197f5b23881a5e61c5581300beb4b3f1db8cab79eabec22fd847f1cdc0e11d3a713fd9f&scene=21#wechat_redirect)\n\
    \n整个操作系统终于通过四个部分的讲解，完成了它的启动，达到了一个怠速状态，留下了一个 shell 程序等待用户指令的输入并执行。\n\n![](media/file284.webp\
    \ \"fig:\")\n\n具体来说。\n\n通过 [第一部分 | 进入内核前的苦力活](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499882&idx=1&sn=68fd16c5aeae15084be58afb1e5bd9e8&chksm=c2c5bac7f5b233d1c486fa57e9e3a2bc907a92ab69ff0344babab4d50bdaf76e7766b4b42914&scene=21&token=1321039476&lang=zh_CN#wechat_redirect)\
    \ 完成了执行 main 方法前的准备工作，如加载内核代码，开启保护模式，开启分页机制等工作，对应内核源码中 boot 文件夹里的三个汇编文件 **bootsect.s\
    \ setup.s head.s**。"
