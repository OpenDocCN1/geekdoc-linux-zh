    \n[第24回 | 从一次定时器滴答来看进程调度](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501609&idx=1&sn=fe5bd9b9f69045fd70f6d7aeaea273bc&scene=21#wechat_redirect)\n\
    \n进程调度的始作俑者，就是那个每 10ms 触发一次的定时器滴答。\n\n![](media/file173.gif \"fig:\")\n\n而这个滴答将会给\
    \ CPU 产生一个**时钟中断**信号。\n\n而这个中断信号会使 CPU 查找中断向量表，找到操作系统写好的一个时钟中断处理函数 **do_timer**。\n\
    \ndo_timer 会首先将当前进程的 **counter** 变量 -1，如果 counter 此时仍然大于 0，则就此结束。\n\n但如果 counter\
    \ = 0 了，就开始进行进程的调度。\n\n进程调度就是找到所有处于 **RUNNABLE** 状态的进程，并找到一个 counter 值最大的进程，把它丢进\
    \ **switch_to** 函数的入参里。\n\n![](media/file174.gif \"fig:\")\n\nswitch_to 这个终极函数，会保存当前进程上下文，恢复要跳转到的这个进程的上下文，同时使得\
    \ CPU 跳转到这个进程的偏移地址处。\n\n![](media/file175.webp \"fig:\")\n\n上图来源于《Linux内核完全注释V5.0》\n\
    \n接着，这个进程就舒舒服服地运行了起来，等待着下一次**时钟中断**的来临。\n\n聊完进程调度机制，我们再看看 fork 函数的原理。\n\n**fork**\n\
    \n后三回内容讲述了 fork 函数的全部细节。\n\n[第25回 | 通过 fork 看一次系统调用](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501700&idx=1&sn=1b0167cf9852f89748a337d9b06c940b&chksm=c2c5bd29f5b2343ff01c68f1cbc654fbb12148f00eff8c21bb2e725a6054a7a6fbddbc253afb&scene=21#wechat_redirect)\n\
    \n[第26回 | fork 中进程基本信息的复制](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501748&idx=1&sn=2ad618817656321501b2c8e734ffefe6&chksm=c2c5bd19f5b2340f0ae684fa2a2a808a9a5210693736d21019ed542cf5351c3b65b2784d40ee&scene=21#wechat_redirect)\n\
    \n[第27回 | 透过 fork 来看进程的内存规划](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501866&idx=1&sn=64adec9179345945d095a1a1bdebcdac&chksm=c2c5b287f5b23b9175d8eacf7731b22823a576f78e14d8b93b2e8c9814bcb11076967d878a12&scene=21#wechat_redirect)\n\
    \n用一张图来表示的话，就是。\n\n![](media/file197.webp \"fig:\")\n\n其中 **copy_process** 是复制进程的关键，总共分三步来。\n\
    \n**第一**，原封不动复制了一下 task_struct。\n\n![](media/file198.webp \"fig:\")\n\n并且覆盖了一些基本信息，包括元信息和一些寄存器的信息。其中比较重要的是将内核态堆栈栈顶指针的指向了自己进程结构所在\
    \ 4K 内存页的最顶端。\n\n![](media/file199.webp \"fig:\")\n\n**第二**，LDT 的复制和改造，使得进程 0\
    \ 和进程 1 分别映射到了不同的线性地址空间。\n\n![](media/file200.webp \"fig:\")\n\n**第三**，页表的复制，使得进程\
    \ 0 和进程 1 又从不同的线性地址空间，被映射到了相同的物理地址空间。\n\n![](media/file201.webp \"fig:\")\n\n\
    最后，将新老进程的页表都变成只读状态，为后面**写时复制**的**缺页中断**做准备。\n\n这一部分的 fork 函数只用于进程 0 创造进程 1 的过程，而之后的新进程创建，比如进程\
    \ 1 里 fork 创建进程 2，也都是这样的套路。\n\n![](media/file202.webp \"fig:\")\n\n整个核心函数 copy_process\
    \ 的代码如下。\n\n```\n[](#cb183-1)int copy_process(int nr, ...) {\n[](#cb183-2)   \
    \ struct task_struct p = \n[](#cb183-3)        (struct task_struct *) get_free_page();\n\
    [](#cb183-4)    task[nr] = p;\n[](#cb183-5)    *p = *current;\n[](#cb183-6)  \
    \  p->state = TASK_UNINTERRUPTIBLE;\n[](#cb183-7)    p->pid = last_pid;\n[](#cb183-8)\
    \    p->counter = p->priority;\n[](#cb183-9)    ..\n[](#cb183-10)    p->tss.edx\
    \ = edx;\n[](#cb183-11)    p->tss.ebx = ebx;\n[](#cb183-12)    p->tss.esp = esp;\n\
    [](#cb183-13)    ...\n[](#cb183-14)    copy_mem(nr,p);\n[](#cb183-15)    ...\n\
    [](#cb183-16)    set_tss_desc(gdt+(nr<<1)+FIRST_TSS_ENTRY,&(p->tss));\n[](#cb183-17)\
    \    set_ldt_desc(gdt+(nr<<1)+FIRST_LDT_ENTRY,&(p->ldt));\n[](#cb183-18)    p->state\
    \ = TASK_RUNNING;\n[](#cb183-19)    return last_pid;\n[](#cb183-20)}\n```\n\n\
    注意图中的两个标黄的代码。\n\n开始复制进程信息的时候，由于进程 1 的结构还没弄好，此时如果进程调度到了进程 1，那就坏事了。\n\n所以一开始把进程\
    \ 1 的状态先设置为 **TASK_UNINTERRUPTIBLE**，使得其不会被进程调度算法选中。\n\n而所有复制工作完成后，进程 1 就拥有了运行的内容，进程基本信息也有了，进程的内存规划也完成了。\n\
    \n此时就把进程设置为 **TASK_RUNNING**，允许被 CPU 调度。\n\n看到这行代码，其实我们也可以很自信地认为，**到这里进程 1 的初步建立工作已经圆满结束，可以达到运行在\
    \ CPU 上的标准了**。\n\n**第四部分的展望**\n\n那我们此时又该回到之前的 main 方法，是不是都忘了最初的目的了？哈哈。\n\n```\n\
