  trans: "\n\n```c\nunsigned long get_free_page(void) {\n    register unsigned long\
    \ __res asm(\"ax\");\n    __asm__(\n        \"std ; repne ; scasb\\n\\t\"\n  \
    \      \"jne 1f\\n\\t\"\n        \"movb $1,1(%%edi)\\n\\t\"\n        \"sall $12,%%ecx\\\
    n\\t\"\n        \"addl %2,%%ecx\\n\\t\"\n        \"movl %%ecx,%%edx\\n\\t\"\n\
    \        \"movl $1024,%%ecx\\n\\t\"\n        \"leal 4092(%%edx),%%edi\\n\\t\"\n\
    \        \"rep ; stosl\\n\\t\"\n        \"movl %%edx,%%eax\\n\"\n        \"1:\"\
    \n        :\"=a\" (__res)\n        :\"0\" (0),\"i\" (LOW_MEM),\"c\" (PAGING_PAGES),\n\
    \        \"D\" (mem_map + PAGING_PAGES-1)\n        :\"di\",\"cx\",\"dx\");\n \
    \   return __res;\n}\n```\n\n就是选择 `mem_map` 中首个空闲页面，并标记为已使用。\n\n好了，本讲就这么多，只是填写了一张大表而已，简单吧？之后的内存申请与释放等骚操作，统统是跟着张大表\
