  trans: "\n`cs:eip` represents the code we want to execute.\n\n`ds:xxx` represents\
    \ the data we want to access.\n\n`ss:esp` represents where our stack pointer address\
    \ is located.\n\nThe code in the first part also performs the following tasks:\n\
    \n- Sets `ds` to `0x10`, pointing to the global descriptor with index 2, which\
    \ is the data segment descriptor.\n- Sets `cs` to `8` via a far jump, pointing\
    \ to the global descriptor with index 1, which is the code segment descriptor.\n\
    - Sets the `ss:esp` address to the end of the `user_stack` array.\n\nAs you can\
    \ see, segmentation, paging, and the configuration of these registers are essentially\
    \ a preliminary plan for how we will access memory in the future—defining where\
    \ to find code, where to find data, where to find the stack, and how to convert\
    \ logical addresses into final physical addresses through segmentation and paging\
    \ mechanisms.\n\nEverything mentioned above involves dealing extensively with\
    \ the Intel CPU hardware, setting up the most fundamental environment and memory\
    \ layout to fully prepare for entering the `main` function. Although C is low-level,\
    \ it has its limitations, which are handled by the assembly language in the first\
    \ part. Therefore, I call the first part **the grunt work before entering the\
    \ kernel**.\n\nNext, starting from the second part, I will discuss the `main`\
    \ function in `main.c`. In just a few lines, it contains the core ideas of the\
    \ operating system.\n\n```c\nvoid main(void) {\n    ROOT_DEV = ORIG_ROOT_DEV;\n\
    \    drive_info = DRIVE_INFO;\n    memory_end = (1<<20) + (EXT_MEM_K<<10);\n \
    \   memory_end &= 0xfffff000;\n    if (memory_end > 16*1024*1024)\n        memory_end\
    \ = 16*1024*1024;\n    if (memory_end > 12*1024*1024) \n        buffer_memory_end\
    \ = 4*1024*1024;\n    else if (memory_end > 6*1024*1024)\n        buffer_memory_end\
    \ = 2*1024*1024;\n    else\n        buffer_memory_end = 1*1024*1024;\n    main_memory_start\
    \ = buffer_memory_end;\n    mem_init(main_memory_start,memory_end);\n    trap_init();\n\
    \    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n    time_init();\n\
    \    sched_init();\n    buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n\
    \    sti();\n    move_to_user_mode();\n    if (!fork()) {\n        init();\n \
    \   }\n    for(;;) pause();\n}\n```\n\nPlease look forward to it!\n\nAdditionally,\
    \ almost every chapter among the first ten has an extension section, mostly centered\
    \ around the Intel Manual, providing standard answers to knowledge points mentioned\
    \ in the text from primary sources. You can look into them more to cultivate the\
    \ habit of reading primary materials.\n\nFrom this, it is evident that most of\
    \ the grunt work in the first ten chapters involves dealing with the Intel CPU\
    \ hardware. Therefore, reading the Intel Technical Manual to understand the CPU\
    \ architecture and mechanisms is the most direct and effective way to understand\
    \ everything.\n\nBelow are all the materials I have listed for extended reading:\n\
    \n- For detailed information on registers, refer to the Intel Manual: `Volume\
    \ 1 Chapter 3.2 OVERVIEW OF THE BASIC EXECUTION ENVIRONMENT`\n- To learn about\
    \ the detailed initialization process during computer startup, refer to the Intel\
    \ Manual: `Volume 3A Chapter 9 PROCESSOR MANAGEMENT AND INITIALIZATION` \n- For\
    \ information on assembly instructions, refer to the Intel Manual: `Volume 2 Chapter\
    \ 3 ~ Chapter 5`\n- For the conversion of logical addresses to linear addresses\
    \ (which are physical addresses when paging is off), see the Intel Manual: `Volume\
    \ 3 Chapter 3.4 Logical And Linear Addresses`\n- Regarding the conversion between\
    \ logical-linear-and physical addresses, refer to the Intel Manual: `Intel 3A\
    \ Chapter 3 Protected-Mode Memory Management`\n- For segment descriptor structures\
    \ and detailed descriptions, see the Intel Manual: `Volume 3 Chapter 3.4.5 Segment\
    \ Descriptors`\n- For the specific structures of page directories and page tables,\
    \ see `Intel 3A Chapter 4.3 32-bit paging`\n- Regarding the `ret` instruction,\
    \ Intel CPUs are actually designed in conjunction with `call`. For `call` and\
    \ `ret` instructions (calls and returns), refer to the Manual: `Intel 1 Chapter\
    \ 6.4 PROCEDURES USING CALL AND RET`\n\n# Part 2: Initialization of the Great\
    \ War\n\n## Chapter 11: The 20-odd lines of the entire OS\n\n> Original link:\
    \ [`mp.weixin.qq.com/s/kYBrMgHt7C9EmwJIPI`](https://mp.weixin.qq.com/s/kYBrMgHt7C9EmwJIPI)\n\
    \nThe first part took ten chapters to complete the grunt work before entering\
    \ the `main` method. The program finally jumps to the first method written in\
    \ C, which is also the entire skeleton of the OS: the `main` function in `main.c`.\n\
    \n```c\nvoid main(void) {\n    ROOT_DEV = ORIG_ROOT_DEV;\n    drive_info = DRIVE_INFO;\n\
    \    memory_end = (1<<20) + (EXT_MEM_K<<10);\n    memory_end &= 0xfffff000;\n\
    \    if (memory_end > 16*1024*1024)\n        memory_end = 16*1024*1024;\n    if\
    \ (memory_end > 12*1024*1024) \n        buffer_memory_end = 4*1024*1024;\n   \
    \ else if (memory_end > 6*1024*1024)\n        buffer_memory_end = 2*1024*1024;\n\
    \    else\n        buffer_memory_end = 1*1024*1024;\n    main_memory_start = buffer_memory_end;\n\
    \    mem_init(main_memory_start,memory_end);\n    trap_init();\n    blk_dev_init();\n\
    \    chr_dev_init();\n    tty_init();\n    time_init();\n    sched_init();\n \
    \   buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n    sti();\n\
    \    move_to_user_mode();\n    if (!fork()) {\n        init();\n    }\n    for(;;)\
    \ pause();\n}\n```\n\nCount the lines; there are only 20-odd in total. But this\
    \ is indeed the entire secret of the OS flow. I have divided this code into several\
    \ parts.\n\nThe first part consists of the values and calculations of parameters:\n\
    \n```c\nvoid main(void) {\n    ROOT_DEV = ORIG_ROOT_DEV;\n    drive_info = DRIVE_INFO;\n\
    \    memory_end = (1<<20) + (EXT_MEM_K<<10);\n    memory_end &= 0xfffff000;\n\
    \    if (memory_end > 16*1024*1024)\n        memory_end = 16*1024*1024;\n    if\
    \ (memory_end > 12*1024*1024) \n        buffer_memory_end = 4*1024*1024;\n   \
    \ else if (memory_end > 6*1024*1024)\n        buffer_memory_end = 2*1024*1024;\n\
    \    else\n        buffer_memory_end = 1*1024*1024;\n    main_memory_start = buffer_memory_end;\n\
    \    ...\n}\n```\n\nIncluding the root device `ROOT_DEV`, the device parameters\
    \ `drive_info` obtained from assembly, and the calculated memory boundaries `main_memory_start`\
    \ and `buffer_memory_end`. Where are these parameters obtained? If you read the\
    \ front, you must remember this table—it is all provided by `setup.s` calling\
    \ BIOS interrupts to get device information, stored at the agreed address `0x90000`.\
    \ I won't elaborate on it here.\n\n| Memory Address | Length (bytes) | Name |\n\
    | :--- | :--- | :--- |\n| 0x90000 | 2 | Cursor position |\n| 0x90002 | 2 | Extended\
    \ memory count |\n| 0x90004 | 2 | Display pages |\n| 0x90006 | 1 | Display mode\
    \ |\n| 0x90007 | 1 | Character columns |\n| 0x90008 | 2 | Unknown |\n| 0x9000A\
    \ | 1 | Display memory |\n| 0x9000B | 1 | Display status |\n| 0x9000C | 2 | Graphics\
    \ features |\n| 0x9000E | 1 | Screen rows |\n| 0x9000F | 1 | Screen columns |\n\
    | 0x0080 | 16 | Disk 1 table |\n| 0x0090 | 16 | Disk 2 table |\n| 0x01FC | 2 |\
    \ Root device ID |\n\nThe second part consists of various `init` operations:\n\
    \n```c\nvoid main(void) {\n    ...\n    mem_init(main_memory_start,memory_end);\n\
    \    trap_init();\n    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n\
    \    time_init();\n    sched_init();\n    buffer_init(buffer_memory_end);\n  \
    \  hd_init();\n    floppy_init();\n    ...\n}\n```\n\nIncluding memory initialization\
    \ `mem_init`, interrupt initialization `trap_init`, process scheduling initialization\
    \ `sched_init`, etc. We know that when learning an OS, it is actually divided\
    \ into these blocks; it seems it is also divided this way in the OS itself. We\
    \ will savor the source code slowly later. Right.\n\nThe third part is switching\
    \ to user mode and performing a final `init` in a new process.\n\n```c\nvoid main(void)\
    \ {\n    ...\n    sti();\n    move_to_user_mode();\n    if (!fork()) {\n     \
    \   init();\n    }\n    ...\n}\n```\n\nThis `init` function creates a process,\
    \ sets up terminal standard I/O, and then creates another process to execute the\
    \ `shell` for user commands. At this point, the familiar screen actually appears\
    \ (below is the screen when `bochs` starts Linux).\n\n![image](img/89.webp)\n"
- fmt: "\n```c\nvoid main(void) {\n    ROOT_DEV = ORIG_ROOT_DEV;\n    drive_info =\
    \ DRIVE_INFO;\n    memory_end = (1<<20) + (EXT_MEM_K<<10);\n    memory_end &=\
    \ 0xfffff000;\n    if (memory_end > 16*1024*1024)\n        memory_end = 16*1024*1024;\n\
    \    if (memory_end > 12*1024*1024) \n        buffer_memory_end = 4*1024*1024;\n\
    \    else if (memory_end > 6*1024*1024)\n        buffer_memory_end = 2*1024*1024;\n\
    \    else\n        buffer_memory_end = 1*1024*1024;\n    main_memory_start = buffer_memory_end;\n\
    \n    mem_init(main_memory_start,memory_end);\n    trap_init();\n    blk_dev_init();\n\
    \    chr_dev_init();\n    tty_init();\n    time_init();\n    sched_init();\n \
    \   buffer_init(buffer_memory_end);\n    hd_init();\n    floppy_init();\n\n  \
    \  sti();\n    move_to_user_mode();\n    if (!fork()) {      /* we count on this\
    \ going ok */\n        init();\n    }\n\n    for(;;) pause();\n}\n```\n\n我们今天就看这第一小段。\n\
    \n首先，`ROOT_DEV` 为系统的根文件设备号，`drive_info` 为之前 `setup.s` 程序获取并存储在内存 `0x90000` 处的设备信息，我们先不管这俩，等之后用到了再说。\n\
    \n我们看后面这一坨很影响整体画风的一段代码。\n\n```c\nvoid main(void) {\n    ...\n    memory_end =\
    \ (1<<20) + (EXT_MEM_K<<10);\n    memory_end &= 0xfffff000;\n    if (memory_end\
    \ > 16*1024*1024)\n        memory_end = 16*1024*1024;\n    if (memory_end > 12*1024*1024)\
    \ \n        buffer_memory_end = 4*1024*1024;\n    else if (memory_end > 6*1024*1024)\n\
    \        buffer_memory_end = 2*1024*1024;\n    else\n        buffer_memory_end\
    \ = 1*1024*1024;\n    main_memory_start = buffer_memory_end;\n    ...\n}\n```\n\
    \n这一坨代码和后面规规整整的 `xxx_init` 平级的位置，要是我们这么写代码，肯定被老板批评，被同事鄙视了。但 Linus 写的，就是经典，学就完事了。\n\
    \n这一坨代码虽然很乱，但仔细看就知道它只是为了计算出三个变量罢了。\n\n`main_memory_start`\n\n`memory_end`\n\n\
    `buffer_memory_end`\n\n而观察最后一行代码发现，其实两个变量是相等的，所以其实仅仅计算出了两个变量。\n\n`main_memory_start`\n\
    \n`memory_end`\n\n然后再具体分析这个逻辑，其实就是一堆 `if else` 判断而已，判断的标准都是 `memory_end` 也就是内存最大值而这个内存最大值由第一行代码可以看出，是等于\
    \ `1M + 扩展内存大小`。那 ok 了，其实只是不同的内存大小设置不同的边界值罢了，为了理解它，我们完全没必要考虑这么全，就假设总内存一共 `8M`\
    \ 大小吧。如果内存为 `8M` 大小，`memory_end` 就是 `8*1024*1024`，也就只会倒数第二个分支，那么 `buffer_memory_end`\
    \ 就为 `2*1024*1024`，那么 `main_memory_start` 也为 `2*1024*1024`。那这些值有什么用呢？一张图就说明白了。你看，其实就是定了三个箭头所指向的地址的三个边界变量，具体主内存区是如何管理和分配的，要看下面代码。\n\
    \n```c\nvoid main(void) {\n    ...\n    mem_init(main_memory_start, memory_end);\n\
    \    ...\n}\n```\n\n而缓冲区是如何管理和分配的，就要看\n\n```c\nvoid main(void) {\n    ...\n  \
    \  buffer_init(buffer_memory_end);\n    ...\n}\n```\n\n是如何折腾的。那我们今天就不背这两个负担，仅仅知道这三个参数的计算以及后面是什么力就好，是不是很轻松？后面再讲如何利用这三个参数来做到内存的管理，之后会分解。\n\
    \n## 第13回 主内存初始化 `mem_init`\n\n原文链接：[https://mp.weixin.com/s/_rTmjCV9ADifo5B3g](https://mp.weixin.com/s/_rTmjCV9ADifo5B3g)\n\
    \n今天我们不聊具体内存管理的算法，我们就来看看操作系统用什么的一张表达到了管理内存的效果。我们以 Linux 0.11 源码为例，发现进入内核的 `main`\
    \ 函数后不久有这样一坨代码。\n\n```c\nvoid main(void) {\n    ...\n    memory_end = (1<<20)\
    \ + (EXT_MEM_K<<10);\n    memory_end &= 0xfffff000;\n    if (memory_end > 16*1024*1024)\n\
    \        memory_end = 16*1024*1024;\n    if (memory_end > 12*1024*1024) \n   \
    \     buffer_memory_end = 4*1024*1024;\n    else if (memory_end > 6*1024*1024)\n\
    \        buffer_memory_end = 2*1024*1024;\n    else\n        buffer_memory_end\
    \ = 1*1024*1024;\n    main_memory_start = buffer_memory_end;\n    mem_init(main_memory_start,memory_end);\n\
    \    ...\n}\n```\n\n除了最后一行，前面的那一大坨的作用很简单。其实只是针对不同的内存大小设置不同的边界值罢了，为了理解它，我们完全没必要考虑这么全，就假设总内存一共\
    \ `8M` 大小吧。如果内存为 `8M` 大小，`memory_end` 就是 `8*1024*1024`，也就只会倒数第二个分支，那么 `buffer_memory_end`\
    \ 就为 `2*1024*1024`，那么 `main_memory_start` 也为 `2*1024*1024`。你仔细看看代码逻辑，看是不是这样？当然，你不愿意细想也没关系，上述代码执行后就是如下效果而已。你看，其实就是定了三个箭头所指向的地址的三个边界变量。具体主内存区是如何管理和分配的，要看\
    \ `mem_init` 里做了什么。\n\n```c\nvoid main(void) {\n    ...\n    mem_init(main_memory_start,\
    \ memory_end);\n    ...\n}\n```\n\n而缓冲区是如何管理和分配的，就要看 `buffer_init` 里干了什么。\n\n\
    ```c\nvoid main(void) {\n    ...\n    buffer_init(buffer_memory_end);\n    ...\n\
    }\n```\n\n不过我们今天只看主内存是如何管理的，很简单，放轻松。进入 `mem_init` 函数：\n\n```c\n#define LOW_MEM\
    \ 0x10000 // 0x10000（十六进制）正好等于十进制的1048576字节，也就是1MB\n#define PAGING_MEMORY (15*1024*1024)\
    \ // 15MB\n#define PAGING_PAGES (PAGING_MEMORY>>12) // 一个页4KB（2^12），15360页\n#define\
    \ MAP_NR(addr) (((addr)-LOW_MEM)>>12) // 把物理地址转换为页号，相对于LOW_MEM（1MB）算起\n#define\
    \ USED 100\nstatic long HIGH_MEMORY = 0;\nstatic unsigned char mem_map[PAGING_PAGES]\
    \ = { 0, }; // start_mem = 2*1024*1024\nvoid mem_init(long start_mem, long end_mem)\
    \ {\n    int i;\n    HIGH_MEMORY = end_mem;\n    // 初始化：所有页标记为USED（不可用）\n    for\
    \ (i=0; i<PAGING_PAGES ; i++)\n        mem_map[i] = USED;\n    // 计算从哪里开始可用内存\n\
    \    i = MAP_NR(start_mem); // 计算start_mem对应的页号\n    end_mem -= start_mem;\n \
    \   end_mem >>= 12; // 计算可用页数量\n    // 标记可用页为0\n    while (end_mem-->0)\n    \
    \    mem_map[i++]=0;\n}\n```\n\n发现也没行，并没有更深的方法调用，看来是个简单的方法。仔细一看这个方法，其实折腾来腾去，就是给一个\
    \ `mem_map` 数组的各个位置赋了值，而且全部赋值为 `USED` 也就是100，然后对其中一部分赋值为了0。赋值为100的部分就是 `USED`，也就表示内存被占用，如果具体说是占用了100次，这个之后再说。剩下赋值为0的部分就表示未被使用，即使用次数为零。是不是很简单？就是准备了一个表，记录了哪些内存被占用了，哪些内存没占用。这就是所谓的“管理”，并没有那么神乎其异。接下来自然有两个问题：每个元素表示占用和未占用，这个表示的范围有多大？初始化时哪些地方是占用的，哪些地方又是未占用的？还一张图就明白了，我们仍然假设内存总只有8M。可以看出，初始化完成后，其实\
    \ `mem_map` 数组的每个元素都代表一个4K内存是否空闲（准确说是使用次数）。4K内存通常叫做1页内存，而这种管理方式叫分页管理，就是把内存分成一页一页（4K）的单位去管理。1M以下的内存这个数组干脆没有记录，这里的内存是无需管理的，或者换个说法是无管理的，也就是没有权利申请和释放，因为这个区域是内核代码所在的地方，不能被污染。1M到2M这个区间是缓冲区，2M是缓冲区的末端，缓冲区的开始在哪里之后再说，这些地方不是主内存区域，因此直接标记为\
    \ `USED`，产生的效果就是无法再被分配了。2M以上的空间是主内存区域，而主内存目前没有任何程序申请，所以初始化时统都是零，未来等着应用程序去申请和释放这里的内存资源。那应用程序如何申请内存呢？我们本讲不展开，不过我们简单展望一下，看看申请内存的过程中是如何使用\
    \ `mem_map` 这个结构的。在 `memory.c` 文件中有个函数 `get_free_page()`，用于在主内存区中申请一页空闲内存页，并返回物理内存页的起始地址。比如我们在\
    \ `fork` 子进程的时候，会调用 `copy_process` 函数来复制进程的结构信息，其中一个步骤就是要申请一页内存用于存放进程结构信息 `task_struct`。\n\
    \n```c\nint copy_process(...) {\n    struct task_struct *p;\n    ...\n    p =\
    \ (struct task_struct *) get_free_page();\n    ...\n}\n```\n\n我们看 `get_free_page`\
    \ 的具体实现，是内联汇编代码，看不懂不要紧，注意它里面就有 `mem_map` 结构的使用。\n"
