    \n* * *\n\n## 第 30 回 番外篇 - 写时复制就这么几行代码\n\n> 原文链接: [`mp.weixin.qq.com/s/Pdnmys_hGoToZN193rfnoQ`](https://mp.weixin.qq.com/s/Pdnmys_hGoToZN193rfnoQ)\n\
    \n这里讲的是 Linux 内核里的写时复制原理。\n\n写时复制的原理网上讲述的文章很多，今天来一篇很直接的文章，通过看看 Linux `0.11` 这个最简单的操作系统，从源码层面把写时复制的原理搞清楚。\n\
    \n很简单哦，你可别中途就放弃了。\n\n直接干！\n\n哦不行，干之前先来点储备知识，如果你已经有了这一 pa 可以略过，不过我估计你没有...\n\n\
    ### 储备知识\n\n坚持看完这部分，写时复制用到的知识只有其中一位，但我周边也讲。32 位下，Intel 设计了**页目录表**和**页表**两种结构，用来提供分页机制。大部分操作系统使用的\
    \ `4KB` 大，Linux `0.11` 也是，我们只看程序员给出的逻辑地址，先经过段机制变成线性地址，再经过分页机制变成物理地址。\n\nFigure\
    \ `4-2` 给出了线性地址到物理地址。![](img/file213.webp \"fig:\")这里的 `PDE` 就是页目录表，`PTE` 就是页表。刚刚说接下来的\
    \ `Table 5` 和 `Table 6` 解释了页目录表和页表的含义。`Table 5` 是页目录表。(media/file214.webp \"fig:\"\
    )`Table 6` 是页表。(media/file215.webp \"fig:\")几乎一样的含义，我们就只看页表，看一些重要的位。`31` 表示物理地址，加上线性地址的后\
    \ `12` 位偏移，就构成了最终访问的内存地址这个就不说了。`0` 位是 `P`，表示存在。`1` 位是 `RW`，表示读写，`0` 表示只读，那么此时往内存范围内写数据不允许。`2`\
    \ 位是 `US`，表示用户态还是内核态，`0` 表示内核态，那么此时用户态往内存范围内写数据不允许。在 Linux `0.11` 的 `head.s` 里，初始页表设置如下：\n\
    \n```\nsetup_paging:\n   ...\n    movl $pg0+7,_pg_dir     /* set present bit/user\
    \ r/w */\n    movl $pg1+7,_pg_dir       /*  --------- */\n    movl $pg2+7,_pg_dir\
    \       /*  --------- */\n    movl $pg3+7,_pg_dir      /*  --------- */\n    movl\
    \ $pg3+4096,%edi\n    movl $0xfff07,%ax     /* 16Mb - 4096 + 7 (r/w,p) */\n  \
    \  std\n1:  stos\n    ...\n```后三位是 `7`，用二进制就是 `111`，即初始的 `4` 个页目录表和 `1024` 个页表，都是：存在（1），读写（1），用户态（1）。好了，储备知识到这里。如果你前面没读懂，你只需要知道，页表中有一位表示读写的，而\
    \ Linux `0.11` 初始化时，把它设置为了 `1`，表示可读写。\n\n### 写时复制的本质\n\n调用 `fork()` 生成新进程时，新进程与原进程会共享同一内存。只有当其中一个进程进行写操作时，系统才会为其分配内存页面。之前在我的[操作系统](http://mp.weixin.qq.com/s?__biz=Mzk0ENDE0Ng&mid=2247499207&idx=1&sn=f00bf7653ae576266bf18287e6bb&chksm=c2c876af5b207cdf509469d266ee3fa09514601b021ce602ecafec79857045b43e286a58&scene=21#wechat_redirect)，我给过一个\
    \ Linux `0.11` 进程的内存规划图。(media/file216.webp \"fig:\")不过考虑写时复制并不复杂，去掉细节就是：原来的进程通过自己的页表占用了一定范围的物理内存。(media/file217.webp\
    \ \"fig:\")调用 `fork` 创建新进程时，原本页表和物理地址空间的内容，都要进行复制，因为进程的内存空间是要隔离的。(media/file218.webp\
    \ \"fig:\")但 `fork` 函数认为，复制物理地址空间的内容比较费时，所以姑先只复制页表，物理地址空间的内容不复制。(media/file219.webp\
    \ \"fig:\")如果只有读操作，那就完全没有影响，不复制物理地址空间的内容就所谓了，这就很赚。但如果有写操作，那就不得不把物理地址空间的值复制一份，保证进程间的内存隔离。(media/file220.webp\
    \ \"fig:\")有写操作时，再复制物理内存，就叫写时复制。\n\n### 看看代码咋写的\n\n有上述的现象，必然是在 `fork` 时，对页表做了手脚，这回知道为啥储备知识里讲页表结构了吧？同时，只要有写操作，就会触发写时复制逻辑，这是咋做到的？答案是通过中断，具体是缺页中断。好的首先来看\
    \ `fork`。`fork` 细节很多，具体看[一个新进程的诞生（六）进程复制](http://mp.weixin.qq.com/s?__biz=Mzk0MjENDE0Ng&mid=2247499207&idx=1&sn=ad61881765321501b2c8e734ff6&chksm=c2c876af5b207cdf509469d266ee3fa09514601b021ce602ecafec7985)\
