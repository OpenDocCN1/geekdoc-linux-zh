  trans: "\nDo you remember that we started the `timer` when we were at [Episode 18\
    \ | The famous process scheduling starts from here](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c8c2b03d9721ba74e99cfa8&chksm=c2c5b87df5b2316b083015a4fdba2df29211f38fcfd1cdb040e02ab410432608e26383a43ef5&scene=21)?\
    \ This timer sends an interrupt to the CPU at regular intervals.\n\n![](img/file173.gif)\n\
    \nThis interval is set to 10ms, which is 100Hz.\n\n```c\nschedule.c\n#define HZ\
    \ 100\n```\n\nThe triggered interrupt is called the `clock interrupt`, where the\
    \ vector number is set to `0x20`. Do you remember the interrupt handler we set\
    \ in `sched_init` for the clock interrupt?\n\n```c\nschedule.c\nset_intr_gate(0x20,\
    \ &timer_interrupt);\n```\n\nWhen clock interrupt `0x20` arrives, the CPU looks\
    \ up the address at `0x20` in the interrupt table, which is the interrupt handler\
    \ function, and jumps to execute it. This interrupt handler `timer_interrupt`\
    \ is written in assembly language.\n\n```s\nsystem_call.s\n_timer_interrupt:\n\
    \    ...\n    // Increment system ticks\n    incl jiff\n    ...\n    // Call function\n\
    \    call do_timer\n```\n\nThis function does two things: one is incrementing\
    \ the system tick variable `jiff`, and the other is calling another function `do_timer`.\n\
    \n```c\nsched.c\nvoid do_timer(long c) {\n    ...\n    // Current thread still\
    \ has time slice, return directly\n    if (--current->counter) > 0) return;\n\
    \    // If no time slice, schedule\n    schedule();\n}\n```\n\nThe most important\
    \ part of `do_timer` is this block of code, which is very simple. First, it decrements\
    \ the process's time slice by 1, then checks if the time slice is still greater\
    \ than zero; if so, does nothing; if the time slice is zero, it calls `schedule()`,\
    \ which is the core of process scheduling.\n\n```c\nschedule.c\nvoid schedule()\
    \ {\n    int i, next, c;\n    struct task_struct *p;\n    ...\n    while (1) {\n\
    \        c = -1;\n        next = 0;\n        i = NR_TASKS;\n        p = &task[NR_TASKS];\n\
    \        while (--i) {\n            if (!*p) continue;\n            if ((*p)->state\
    \ == TASK_RUNNING && (*p)->counter > c)\n                c = (*p)->counter, next\
    \ = i;\n        }\n        if (c) break;\n        for (p = &LAST_TASK; p > &FIRST_TASK;\
    \ --p)\n            if (*p)\n                (*p)->counter = ((*p)->counter >>\
    \ 1) + (*p)->priority;\n    }\n    switch_to(next);\n}\n```\n\nDon't be intimidated\
    \ by this large block; I will make an informal simplification, and you'll understand:\n\
    \n```c\nvoid schedule() {\n    int next = get_max_counter_and_runnable_thread();\n\
    \    refresh_all_thread_counter();\n    switch_to(next);\n}\n```\n\nSee, it's\
    \ that simple. This function does three things:\n\n1. Gets the process ID `next`\
    \ that has the maximum remaining time slice (value of `counter`) and is in the\
    \ `runnable` state (`state = 0`).\n\n![](img/file174.gif)\n\n2. If the time slices\
    \ of all `runnable` processes are 0, the `counter` of all processes (not just\
    \ `runnable` ones) is reassigned (`counter = counter/2 + priority`), and step\
    \ 1 is executed again.\n\n3. Finally, it obtains process ID `next`, calls the\
    \ `switch_to(next)` method, and switches to that process for execution. Looking\
    \ at the `switch_to` method, it is written using inline assembly statements.\n\
    \n```h\nsched.h\n#define switch_to(n) { \\\n    struct {long a,b;} __tmp; \\\n\
    \    __asm__(\"cmpl %%ecx,_current\\n\\t\" \\\n            \"je 1f\\n\\t\" \\\n\
    \            \"movw %%dx,%1\\n\\t\" \\\n            \"xchgl %%ecx,_current\\n\\\
    t\" \\\n            \"ljmp %0\\n\\t\" \\\n            \"cmpl %%ecx,_last_task_used_math\\\
    n\\t\" \\\n            \"jne 1f\\n\\t\" \\\n            \"clts\\n\" \\\n     \
    \       \"1:\" \\\n            ::\"m\" (*&__tmp.a),\"m\" (*&__tmp.b), \\\n   \
    \         \"d\" (_TSS(n)),\"c\" ((long) task[n])); \\\n}\n```\n\nThis passage\
    \ is the absolute lowest-level code for process switching. It's okay if you don't\
    \ understand it; it mainly does one thing: `jmp` to the `tss` segment of the new\
    \ process. What does this mean? The CPU dictates that if a `jmp` instruction is\
    \ followed by a `tss` segment, the hardware will save the values of current registers\
    \ into the current process's `tss`, and load the new process's `tss` information\
    \ into the registers.\n\n![](img/file175.webp)\n\nThe image above comes from *Linux\
    \ Kernel Source Correlation*. This diagram is drawn very clearly in the book;\
    \ I will just repeat it. Simply put: save the current process context, restore\
    \ the context of the next process, and jump! Look, the `task_struct` structure\
    \ fields mentioned at the beginning of the previous lecture are all used.\n\n\
    ```c\nstruct task_struct {\n    long state;\n    long counter;\n    long priority;\n\
    \    ...\n    struct tss tss;\n};\n```\n\nBy here, we have traced the chain of\
    \ a process switch. Recap:\n\nThe chain starts with the culprit: that timer that\
    \ triggers every 10ms. This timer generates a clock interrupt for the CPU. This\
    \ interrupt signal makes the CPU look up the interrupt table and find the interrupt\
    \ handler `do_timer`. `do_timer` first decrements the `counter` variable of the\
    \ current process; if `counter` is still greater than 0, it ends there; if `counter\
    \ = 0`, process scheduling begins. Scheduling is finding all processes in the\
    \ `RUNNABLE` state.\n"
- fmt: "\n```\nfn_ptr sys_call_table[] = { sys_setup, sys_exit, sys_fork, sys_read,\n\
    \  sys_write, sys_open, sys_close, sys_waitpid, sys_creat, sys_link,\n  sys_unlink,\
    \ sys_execve, sys_chdir, sys_time, sys_mknod, sys_chmod,\n  sys_chown, sys_break,\
    \ sys_stat, sys_lseek, sys_getpid, sys_mount,\n  sys_umount, sys_setuid, sys_getuid,\
    \ sys_stime, sys_ptrace, sys_alarm,\n  sys_fstat, sys_pause, sys_utime, sys_stty,\
    \ sys_gtty, sys_access,\n  sys_nice, sys_ftime, sys_sync, sys_kill, sys_rename,\
    \ sys_mkdir,\n  sys_rmdir, sys_dup, sys_pipe, sys_times, sys_prof, sys_brk, sys_setgid,\n\
    \  sys_getgid, sys_signal, sys_geteuid, sys_getegid, sys_acct, sys_phys,\n  sys_lock,\
    \ sys_ioctl, sys_fcntl, sys_mpx, sys_setpgid, sys_ulimit,\n  sys_uname, sys_umask,\
    \ sys_chroot, sys_ustat, sys_dup2, sys_getppid,\n  sys_getpgrp, sys_setsid, sys_sigaction,\
    \ sys_sgetmask, sys_ssetmask,\n  sys_setreuid, sys_setregid\n};\n```\n\n看到没，就是各种函数指针组成的一个数组，说白了就是个系统调用函数表。\n\
    \n那下标 2 位置处是啥？从第零项开始数，第二项就是 `sys_fork` 函数！\n\n至此，我们终于找到了 `fork` 函数，通过系统调用这个中断，最终走到内核层面的函数是什么，就是\
    \ `sys_fork`。\n\n```\n_sys_fork:\n    call _find_empty_process\n    testl %eax,%eax\n\
    \    js 1f\n    push %gs\n    pushl %esi\n    pushl %edi\n    pushl %ebp\n   \
    \ pushl %eax\n    call _copy_process\n    addl $20,%esp\n1:  ret\n```\n\n至于这个函数是什么，我们下一讲再说。\n\
    \n从这讲的探索我们也可以看出，操作系统通过**系统调用**，提供给用户态可用的功能，都暴露在 `sys_call_table` 里了。\n\n系统调用统一通过\
    \ `int 0x80` 中断来进入，具体调用这个表里的哪个功能函数，就由 `eax` 寄存器传过来，这里的值是个数组索引的下标，通过这个下标就可以找到在\
    \ `sys_call_table` 这个数组里的具体函数。\n\n同时也可以看出，用户进程调用内核的功能，可以直接通过写一句 `int 0x80` 汇编指令，并且给\
    \ `eax` 赋值，当然这样就比较麻烦。\n\n所以也可以直接调用 `fork` 这样的包装好的方法，而这个方法里本质也是 `int 0x80` 以及 `eax`\
    \ 赋值而已。\n\n![](media/file176.webp \"fig:\")\n\n本讲就借着这个机会，讲讲系统调用的玩法，你学会了么？\n\n\
    ------\n\n那我们再多说两句，刚刚定义 `fork` 的系统调用模板函数时，用的是 `syscall0`，其实这个表示参数个数为 0，也就是 `sys_fork`\
    \ 函数并不需要任何参数。\n\n所以其实，在 `unistd.h` 头文件里，还定义了 `syscall0` ~ `syscall3` 一共四个宏。\n\n\
    ```\n#define _syscall0(type,name)\n#define _syscall1(type,name,atype,a)\n#define\
    \ _syscall2(type,name,atype,a,btype,b)\n#define _syscall3(type,name,atype,a,btype,b,ctype,c)\n\
    ```\n\n看都能看出来，其实 `syscall1` 就表示有**一个参数**，`syscall2` 就表示有**两个参数**。\n\n哎，就这么简单。\n\
    \n那这些参数放在哪里了呢？总得有个约定的地方吧？\n\n我们看一个今后要讲的重点函数，`execve`，是一个通常和 `fork` 在一起配合的变身函数，在之后的进程\
    \ 1 创建进程 2 的过程中，就是这样玩的。\n\n```\nvoid init(void) {\n    ...\n    if (!(pid=fork()))\
    \ {\n        ...\n        execve(\"/bin/sh\",argv_rc,env_rc);\n        ...\n \
    \   }\n}\n```\n\n当然我们的重点不是研究这个函数，仅仅把它当做 `syscall3` 的例子，因为它的宏定义就是 `syscall3`。\n\
    \n```\nexecve(\"/bin/sh\",argv_rc,env_rc);\n_syscall3(int,execve,const char *,argv,char\
    \ **,envp)\n#define _syscall3(type,name,atype,a,btype,b,ctype,c)\ntype(atype a,btype\
    \ b,ctype c) {\n    volatile long res;\n    asm {\n        asm eax,__NR_name\n\
    \        asm mov ebx,a\n        asm mov ecx,b\n        asm mov edx,c\n       \
    \ asm int $80h\n        asm mov res,eax\n    }\n    if (res >= 0)\n        return\
    \ (type)res;\n    errno = -res;\n    return -1;\n}\n```\n\n可以看出，参数 `a` 被放在了 `ebx`\
    \ 寄存器，参数 `b` 被放在了 `ecx` 寄存器，参数 `c` 被放在了 `edx` 寄存器。\n\n我们再打开 `system_call` 的代码，刚刚只看了它的关键一行，去系统调用表找函数。\n\
    \n```\n_system_call:\n    ...\n    call [_sys_call_table + eax*4]\n    ...\n```\n\
    \n我们再看看全貌。\n\n```\n_system_call:\n    cmpl $nr_system_calls-1,%eax\n    ja bad_sys_call\n\
    \    push %ds\n    push %es\n    push %fs\n    pushl %edx\n    pushl %ecx    \
    \  # push %ebx,%ecx,%edx as parameters\n    pushl %ebx      # to the system call\n\
    \    movl $0x10,%edx     # set up ds,es to kernel space\n    mov %dx,%ds\n   \
    \ mov %dx,%es\n    movl $0x17,%edx     # fs points to local data space\n    mov\
    \ %dx,%fs\n    call _sys_call_table(,%eax,4)\n    pushl %eax\n    movl _current,%eax\n\
    \    cmpl $0,state(%eax)     # state\n    jne reschedule\n    cmpl $0,counter(%eax)\
    \       # counter\n    je reschedule\nret_from_sys_call:\n    movl _current,%eax\
    \      # task[0] cannot have signals\n    cmpl _task,%eax\n    je 3f\n    cmpw\
    \ $0x0f,CS(%esp)     # was old code segment supervisor ?\n    jne 3f\n    cmpw\
    \ $0x17,OLDSS(%esp)      # was stack segment = 0x17 ?\n    jne 3f\n    movl signal(%eax),%ebx\n\
    \    movl blocked(%eax),%ecx\n    notl %ecx\n    andl %ecx,%ecx\n    bsfl %ecx,%ecx\n\
    \    je 3f\n    bts %ecx,%ebx\n    movl %ebx,signal(%eax)\n    incl %ecx\n   \
    \ pushl %ecx\n    call _do_signal\n    popl %eax\n    popl %eax\n    popl %ebx\n\
    \    popl %ecx\n    popl %edx\n    pop %fs\n    pop %es\n    pop %ds\n    iret\n\
    ```\n\n又被吓到了？\n\n别怕，我们只关注栈的情况，还记得[一个新进程的诞生（二）从内核态到用户态](http://mp.weixin.com/s?biz=zk0Mj3NDE0Ng&mid=224701522&idx=1&sn=936f837421870a57ee2a8d74a519chks=c25bc7ff5b2356eb0b3472accf25cde25a0ff754c8056fa3e142870cf59df24&scene=21)触发中断后，CPU\
