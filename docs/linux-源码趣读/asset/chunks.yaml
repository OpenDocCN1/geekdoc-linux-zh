    \ 数组索引 3 位置处的块设备管理结构 **blk_dev_struct** 的 **request_fn** 赋值为了 **do_hd_request**，这是啥意思呢？\n\
    \n因为有很多块设备，所以 Linux 0.11 内核用了一个 **blk_dev[]** 来进行管理，每一个索引表示一个块设备。\n\n```\n[](#cb119-1)struct\
    \ blk_dev_struct blk_dev[NR_BLK_DEV] = {\n[](#cb119-2)    { NULL, NULL },    \
    \ /* no_dev */\n[](#cb119-3)    { NULL, NULL },     /* dev mem */\n[](#cb119-4)\
    \    { NULL, NULL },     /* dev fd */\n[](#cb119-5)    { NULL, NULL },     /*\
