    由于理解起来非常简单，但代码中的计算就非常绕，所以我们就不细致分析代码了，只要理解其最终的作用就好。


    ------


    OK，本章的内容就讲完了，再稍稍展开一个未来要说的东西。还记得页表的结构吧？


    ![](media/file193.webp "fig:")


    其中 RW 位表示读写状态，0 表示只读（或可执行），1表示可读写（或可执行）。当然，在内核态也就是 0 特权级时，这个标志位是没用的。


    那我们看下面的代码。


    ```

    [](#cb182-1)int copy_page_tables(unsigned long from,unsigned long to,long size)
    {

    [](#cb182-2)    ...

    [](#cb182-3)    for( ; size-->0 ; from_dir++,to_dir++) {

    [](#cb182-4)        ...

    [](#cb182-5)        for ( ; nr-- > 0 ; from_page_table++,to_page_table++) {

    [](#cb182-6)            ...

    [](#cb182-7)            this_page &= ~2;

    [](#cb182-8)            ...

    [](#cb182-9)            if (this_page > LOW_MEM) {

    [](#cb182-10)                *from_page_table = this_page;

    [](#cb182-11)                ...

    [](#cb182-12)            }

    [](#cb182-13)        }

    [](#cb182-14)    }

    [](#cb182-15)    ...

    [](#cb182-16)}

    ```


    ~2 表示取反，2 用二进制表示是 10，取反就是 01，其目的是把 this_page 也就是当前的页表的 RW 位置零，也就是是**把该页变成只读**。


    而 *from_page_table = this_page 表示**又把源页表也变成只读**。


    也就是说，经过 fork 创建出的新进程，其页表项都是只读的，而且导致源进程的页表项也变成了只读。'
