    \n* *\n\n## 第9回 Intel 内存管理两板斧：分段与分页\n\n> 原文链接: [https://mp.weixin.qq.com/s/q2wU9IbX54t_GAuc9V5r7A](https://mp.weixin.qq.com/s/q2wU9IbX54t_GAuc9V5r7A)\n\
