    \n所以这两行代码，第一行重新设置了**代码指针 eip** 的值，指向 /bin/sh 这个 a.out 格式文件的头结构 exec 中的 a_entry\
    \ 字段，表示该**程序的入口地址**。\n\n第二行重新设置了**栈指针 esp** 的值，指向了我们经过一路计算得到的 p，也就是图中 sp 的值。将这个值作为新的栈顶十分合理。\n\
    \n![](media/file256.png \"fig:\")\n\neip 和 esp 都设置好了，那么程序摇身一变的工作，自然就结束了，非常简单。\n\
    \n至于为什么往 eip 的 0 和 3 索引位置处写入数据，就可以达到替换 eip 和 esp 的目的，那我们就得看看这个 eip 变量是怎么来的了。\n\
    \n**计算机的世界没有魔法**\n\n还记得 execve 的调用链么？\n\n```\n[](#cb254-1)static char * argv_rc[]\
    \ = { \"/bin/sh\", NULL };\n[](#cb254-2)static char * envp_rc[] = { \"HOME=/\"\
    , NULL };\n[](#cb254-3)\n[](#cb254-4)// 调用方\n[](#cb254-5)execve(\"/bin/sh\",argv_rc,envp_rc);\n\
    [](#cb254-6)\n[](#cb254-7)// 宏定义\n[](#cb254-8)_syscall3(int,execve,const char\
    \ *,file,char **,argv,char **,envp)\n[](#cb254-9)\n[](#cb254-10)// 通过系统调用进入到这里\n\
    [](#cb254-11)EIP = 0x1C\n[](#cb254-12)_sys_execve:\n[](#cb254-13)    lea EIP(%esp),%eax\n\
    [](#cb254-14)    pushl %eax\n[](#cb254-15)    call _do_execve\n[](#cb254-16) \
    \   addl $4,%esp\n[](#cb254-17)    ret\n[](#cb254-18)\n[](#cb254-19)// exec.c\n\
    [](#cb254-20)int do_execve(unsigned long * eip, ...) {\n[](#cb254-21)    ...\n\
    [](#cb254-22)    eip[0] = ex.a_entry;\n[](#cb254-23)    eip[3] = p; \n[](#cb254-24)\
    \    ...\n[](#cb254-25)}\n```\n\n千万别忘了，我们这个 **do_execve** 函数，是通过一开始的 **execve**\
    \ 函数触发了**系统调用**来到的这里。\n\n系统调用是一种**中断**，前面说过，中断时 CPU 会给栈空间里压入一定的信息，这部分信息是死的，查手册可以查得到。\n\
    \n![](media/file257.webp \"fig:\")\n\n然后，进入中断以后，通过系统调用查表进入到 **_sys_execve** 这里。\n\
    \n```\n[](#cb255-1)EIP = 0x1C\n[](#cb255-2)_sys_execve:\n[](#cb255-3)    lea EIP(%esp),%eax\n\
    [](#cb255-4)    pushl %eax\n[](#cb255-5)    call _do_execve\n[](#cb255-6)    addl\
    \ $4,%esp\n[](#cb255-7)    ret\n```\n\n看到没？在真正调用 **do_execve** 函数时，**_sys_execve**\
    \ 这段代码偷偷地插入了一个小步骤，就是把当前栈顶指针 esp 偏移到 EIP 处的地址值给当做第一个参数 **unsigned long * eip**\
    \ 传入进来了。\n\n而偏移 EIP 处的位置，恰好就是中断时压入的 EIP 的值的位置，表示中断发生前的指令寄存器的值。\n\n所以 eip[0] 就表示栈空间里的\
    \ EIP 位置，eip[3] 就表示栈空间里的 ESP 位置。\n\n![](media/file258.webp \"fig:\")\n\n由于我们现在处于中断，所以**中断返回**后，也就是\
    \ do_execve 这个函数 return 之后，就会寻找中断返回前的这几个值（包括 eip 和 esp）进行恢复。\n\n这里有疑惑的同学，看下我之前写的\
    \ [认认真真的聊聊中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247498208&idx=1&sn=b784f8b4e627ebd1bfb9810d194fdb80&chksm=c2c5834df5b20a5bdee331002bfc61c90eb468da325bf67abeef780c303a9f51c8543e1a5981&scene=21#wechat_redirect)\
    \ 和 [认认真真的聊聊\"软\"中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247498246&idx=1&sn=efca37b5dcb06271eb19500b2c2597f1&chksm=c2c580abf5b209bdacd5cba9728723af1f725016960d334067f9cc979b721f29f860d612ec1b&scene=21#wechat_redirect)\
    \ 这两篇文章，我认为把中断的原理彻底讲清楚了，不过其实就是读 CPU 手册罢了。\n\n所以如果我们把这个栈空间里的 eip 和 esp 进行替换，换成执行\
    \ /bin/sh 所需要的 eip 和 esp，那么中断返回的**\"恢复\"**工作，就犹如**\"跳转\"**到一个新程序那里一样，其实是我们欺骗了\
    \ CPU，达到了 execve 这个函数的魔法效果。\n\n所以，**计算机的世界里根本没有魔法**，就是通过这一点点细节而完成的，只是大部分人都不愿意花时间去细究这些细节罢了。\n\
    \n### 累了吧，休息会\n\n本章讲解了我认为 Linux 0.11 里面最难理解的 execve 函数的核心逻辑，但其实整个顺下来你会发现，它所完成的事情也是由一个个非常简单的事情拼凑起来的。\n\
    \n无非就是把参数表在一个空间里折腾来折腾去给构造好，然后把代码应该从哪里执行的 eip 和新的栈空间应该设置在哪里的 esp 给弄好，就完成了使命。\n\n\
    至于 /bin/sh 文件是怎么构造出来的，那就是 gcc 编译和链接那些事了，而且 Linux 0.11 所用的可执行文件格式 a.out，已经被现在的\
    \ ELF 格式所取代，那就更不在我们要研究的范畴，本系列还是要划分好边界问题的，不然就无休止了。\n\nOK，至此，execve 函数就彻底结束了。\n\n\
    ```\n[](#cb256-1)void init(void) {\n[](#cb256-2)    ...\n[](#cb256-3)    if (!(pid=fork()))\
    \ {\n[](#cb256-4)        close(0);\n[](#cb256-5)        open(\"/etc/rc\",O_RDONLY,0);\n\
    [](#cb256-6)        execve(\"/bin/sh\",argv_rc,envp_rc);\n[](#cb256-7)       \
    \ _exit(2);\n[](#cb256-8)    }\n[](#cb256-9)    ...\n[](#cb256-10)}\n```\n\n他的返回意味着接下来将执行\
    \ /bin/sh 这个可执行文件里的代码。\n\n不过有两个问题：\n\n第一，**/bin/sh** 是躺在磁盘里的可执行文件，并不是 Linux 内核里的代码，所以其实那里面是什么，我们在\
    \ Linux 0.11 源码里是找不到的。也就是说，如果磁盘里并没有 /bin/sh 这个文件，Linux 0.11 是启动不起来的，在 open 的时候就会报错宕机了。\n\
    \n第二，我们只将 /bin/sh 文件的头部加载到了内存，其他部分并没有任何代码完成加载这个操作，那接下来跳转到一个并没有加载 /bin/sh 代码的内存时，会发生什么呢？\n\
    \n带着这两个疑问，期待后续的章节吧！\n\n欲知后事如何，且听下回分解。\n\n* * *\n\n## 第36回 | 缺页中断\n\n> 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a&scene=21#wechat_redirect)\n\
    \n书接上回，上回书咱们说到，进程 2 通过 **execve** 函数，将自己摇身一变成为 **/bin/sh** 程序，也就是 **shell** 程序开始执行。\n\
    \n```\n[](#cb257-1)// main.c\n[](#cb257-2)void init(void) {\n[](#cb257-3)    ...\n\
    [](#cb257-4)    if (!(pid=fork())) {\n[](#cb257-5)        close(0);\n[](#cb257-6)\
    \        open(\"/etc/rc\",O_RDONLY,0);\n[](#cb257-7)        execve(\"/bin/sh\"\
    ,argv_rc,envp_rc);\n[](#cb257-8)        _exit(2);\n[](#cb257-9)    }\n[](#cb257-10)\
    \    ...\n[](#cb257-11)}\n```\n\n那么此时进程 2 就是 shell 程序了。\n\n再进一步讲，相当于之前的进程 1 通过\
    \ **fork + execve** 这两个函数的组合，创建了一个新的进程去加载并执行了 shell 程序。\n\n我们在 Linux 里执行一个程序，比如在命令行中\
    \ ./xxx，其内部实现逻辑都是 fork + execve 这个原理。\n\n当然，此时我们仅仅是通过 execve，使得下一条 CPU 指令将会执行到\
    \ /bin/sh 程序所在的内存起始位置处，也就是 /bin/sh 头部结构中 **a_entry** 所描述的地址。\n\n但有个问题是，我们仅仅将 /bin/sh\
    \ 文件的头部加载到了内存，其他部分并没有进行加载，那我们是怎么执行到的 /bin/sh 的程序指令呢？\n\n![](media/file259.webp\
    \ \"fig:\")\n\n我们就带着这个问题，开始今天的探索。\n\n### 跳转到一个不存在的地址会发生什么\n\n/bin/sh 这个文件并不是 Linux\
    \ 0.11 源码里的内容，Linux 0.11 只管按照 a.out 这种格式去解读它，跳转到 a.out 格式头部数据结构 **exec.a_entry**\
    \ 所指向的内存地址去执行指令。\n\n所以这个 a_entry 的值是多少，就完全取决于硬盘中 /bin/sh 这个文件是怎么构造的了，我们简单点，就假设它为\
    \ **0**，这表示随后的 CPU 将跳转到 0 地址处进行执行。\n\n当然，这个 0 仅仅表示**逻辑地址**，既没有进行分段，也没有进行分页。\n\n\
    之前说过无数次了，Linux 0.11 的每个进程是通过不同的局部描述符在线性地址空间中瓜分出不同的空间，一个进程占 64M。\n\n![](media/file260.webp\
    \ \"fig:\")\n\n由于我们现在所处的代码是属于进程 2，所以逻辑地址 0 通过分段机制映射到线性地址空间，就是 **0x8000000**，表示\
    \ **128M** 位置处。\n\n好，128M 这个线性地址，随后将会通过**分页机制**的映射转化为物理地址，这才定位到最终的真实物理内存。\n\n\
    可是，128M 这个线性地址并没有页表映射它，也就是因为上面我们说的，我们除了 /bin/sh 文件的头部加载到了内存外，其他部分并没有进行加载操作。\n\n\
    **再准确点说，是 0x8000000 这个线性地址的访问，遇到了页表项的存在位 P 等于 0 的情况。**\n\n一旦遇到了这种情况，CPU 会触发一个中断：**页错误（Page-Fault）**，这在\
    \ Intel 手册 Volume-3 Chapter 4.7 章节里给出了这个信息。\n\n![](media/file261.webp \"fig:\"\
    )\n\n当然，Page-Fault 在很多情况都会触发，具体是因为什么情况触发的，CPU 会帮我们保存在中断的出错码 **Error Code** 里，这在随后的\
    \ Figure 4-12 中给出了详细的出错码说明。\n\n![](media/file262.webp \"fig:\")\n\n这块之所以讲这么详细，因为我想让大家知道一切的原理都有最一手资料的来源，这些一手资料写的都非常详细和友好，大家完全不必道听途说，也不必毫无头绪地搜索网上的博客。\n\
    \n当然，与本文相关的，就是这个**存在位 P**。\n\n当触发这个 Page-Fault 中断后，就会进入 Linux 0.11 源码中的 **page_fault**\
    \ 方法，由于 Linux 0.11 的 page_fault 是汇编写的，很不直观，这里我选 Linux 1.0 的代码给大家看，逻辑是一样的。\n\n\
    ```\n[](#cb258-1)void do_page_fault(..., unsigned long error_code) {\n[](#cb258-2)\
    \    ... \n[](#cb258-3)    if (error_code & 1)\n[](#cb258-4)        do_wp_page(error_code,\
    \ address, current, user_esp);\n[](#cb258-5)    else\n[](#cb258-6)        do_no_page(error_code,\
    \ address, current, user_esp);\n[](#cb258-7)    ...\n[](#cb258-8)}\n```\n\n根据\
    \ **error_code** 的不同，有不同的逻辑。\n\n刚刚说了，这个中断是由于 **0x8000000** 这个线性地址的访问，遇到了页表项的**存在位\
    \ P** 等于 0 的情况，所以 error_code 的第 0 位就是 0，会走 **do_no_page** 逻辑。\n\n之前在讲 [第30回 |\
    \ 番外篇 - 写时复制就这么几行代码](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502033&idx=1&sn=1acfd8b7f4c805906ecd51c33d0010eb&chksm=c2c5b27cf5b23b6a41051c7f93407afc97094a4b0a36ea050616778f4d072f074602f98983b2&scene=21#wechat_redirect)\
    \ 的时候，讲了 **do_wp_page**，这是在 P=1 时的逻辑，文章的结尾我说过，后面会把页表项的存在位 P 为 0 时触发的 do_no_page\
    \ 逻辑讲给大家，这不就来了么。\n\ndo_wp_page 叫**页写保护中断**，do_no_page 叫**缺页中断**。\n\n好了，我们用了很大篇幅，说明白了跳转到一个\
    \ P=0 的地址会发生什么，接下来就是具体看 do_no_page 函数的逻辑咯。\n\n### 缺页中断 do_no_page\n\n我们先一睹为快它的代码。"
