  trans: "\n我们接下来的焦点就在这个 `open` 函数，以及它要打开的文件 `/dev/tty0`，还有后面的两个 `dup`。\n\n`open`\
    \ 函数会触发 `0x80` 中断，最终调用到 `sys_open` 这个系统调用函数，相信你已经很熟悉了。\n\n```c\nstruct file_table[64]\
    \ = {0};\n\nint sys_open(const char * filename,int flag,int mode) {\n    struct\
    \ m_inode * inode;\n    struct file * f;\n    int i,fd;\n    mode &= ~umask;\n\
    \n    for(fd=0; fd<20; fd++)\n        if (!current->filp[fd])\n            break;\n\
    \    if (fd>=20)\n        return -EINVAL;\n\n    f = &file_table[i];\n    for\
    \ (i=0; i<64; i++)\n        if (!f->f_count)\n            break;\n    if (i>=64)\n\
    \        return -EINVAL;\n\n    current->filp[fd] = f;\n    f->f_count++;\n\n\
    \    i = open_namei(filename,flag,&inode);\n\n    if (S_ISCHR(inode->i_mode))\
    \ {\n        if (MAJOR(inode->i_mode) == 4) {\n            if (current->tty <\
    \ 0) {\n                current->tty = MINOR(inode->i_mode);\n               \
    \ tty_table[current->tty].pgrp = current->pgrp;\n            }\n        } else\
    \ if (MAJOR(inode->i_mode) == 5) {\n            if (current->tty < 0) {\n    \
    \            iput(inode);\n                current->filp[fd] = NULL;\n       \
    \         return -EPERM;\n            }\n        }\n    }\n    if (S_ISBLK(inode->i_mode))\
    \ {\n        check_disk(inode->i_mode);\n    }\n\n    f->f_mode = inode->i_mode;\n\
    \    f->f_flags = flag;\n    f->f_count = 1;\n    f->f_inode = inode;\n    f->f_pos\
    \ = 0;\n    return (fd);\n}\n```\n\n这么复杂的函数，我们慢慢来分析，先用一张图来描述它的作用。\n\n![](img/file238.webp)\n\
    \n### 第一步，在进程描述符数组 `filp` 中找到一个空闲项\n\n记得进程的 `task_struct` 结构吧，其中 `filp` 字段就是我们说的描述符数组，这里找到一个空闲项，并将索引赋值给\
    \ `fd`。\n\n```c\nint sys_open(const char * filename,int flag,int mode) {\n   \
    \ ...\n    for(int fd=0; fd<20; fd++)\n        if (!current->filp[fd])\n     \
    \       break;\n    if (fd>=20)\n        return -EINVAL;\n    ...\n}\n```\n由于当前进程（进程\
    \ 1）还没有打开过文件，所以 0 号索引处的空闲 `fd` 自然等于 0。\n\n### 第二步，在系统文件表 `file_table` 中找到一个空闲项\n\
    \n同样的逻辑。\n\n```c\nint sys_open(const char * filename,int flag,int mode) {\n  \
    \  int i;\n    ...\n    struct file * f = &file_table[i];\n    for (i=0; i<64;\
    \ i++)\n        if (!f->f_count)\n            break;\n    if (i>=64)\n       \
    \ return -EINVAL;\n    ...\n}\n```\n注意到，进程的 `filp` 数组大小是 20，系统的 `file_table` 大是\
    \ 64，可以得出进程最多打开 20 个文件，整个系统最多打开 64 个文件。\n\n### 第三步，将进程的文件描述符和系统的文件项对应起来\n\n代码中就是一个赋值操作。\n\
    \n```c\nint sys_open(const char * filename,int flag,int mode) {\n    ...\n   \
    \ current->filp[fd] = f;\n    ...\n}\n```\n\n### 第四步，根据文件名从文件系统中找到文件\n\n其实找到了这个\
    \ `tty0` 文件对应的 `inode`。\n\n```c\nint sys_open(const char * filename,int flag,int\
    \ mode) {\n    ...\n    // filename = \"/dev/tty0\"\n    // flag = O_RDWR 读写\n\
    \    // 不是新文件，所以 mode 没用\n    // 返回 inode\n    open_namei(filename,flag,&inode);\n\
    \    ...\n}\n```\n\n接下来判断 `tty0` 是否是字符设备。如果是字符设备文件，那么设备号是 4 的话，则设置当前进程的 `tty`\
    \ 号为该 `inode` 的设备号。并设置当前进程对应的 `tty` 表的父进程号。这里暂不展开。\n\n### 第五步，填充 `file` 数据\n\n\
    其实就是初始化 `f`，包括刚刚找到的 `inode` 值。最后返回给上层描述符 `fd` 的值，也就是零。\n\n```c\nint sys_open(const\
    \ char * filename,int flag,int mode) {\n    ...\n    f->f_mode = inode->i_mode;\n\
    \    f->f_flags = flag;\n    f->f_count = 1;\n    f->f_inode = inode;\n    f->f_pos\
    \ = 0;\n    return (fd);\n    ...\n}\n```\n\n最后再回过头看这张图，是不是就有感觉了？\n\n![](img/file239.webp)\n\
    \n其实打开一个文件，即刚刚的 `open` 函数，就是在上述操作后，返回一个 int 型的数值 `fd`，称作文件描述符。之后我们就可以对着这个描述符进行读写。之所以可以这么方便，是由于通过这个描述符进行交互。\n"
- fmt: "\n书接上回，上回书咱们说到，进程 1 通过 `open` 函数建立了与外设交互的能力，具体其实就是打开了 `tty0` 这个设备文件，并绑定了标准输入\
    \ `0`，标准输出 `1` 和标准错误输出 `2` 这三个文件描述符。\n\n![](media/file243.webp \"fig:\")\n\n同时我们看到源码中用\
    \ `printf` 函数，调用 `write` 函数，向 `1` 号文件描述符输出了字符串的效果。\n\n![](media/file244.webp \"\
    fig:\")\n\n到此为止，标志着进程 1 的工作基本结束了，准确说是能力建设的工作结束了，接下来就是**控制流程**和**创建新的进程**了，我们继续往下看。\n\
    \n```\n[](#cb231-1)void init(void) {\n[](#cb231-2)    ...\n[](#cb231-3)    if\
    \ (!(pid=fork())) {\n[](#cb231-4)        close(0);\n[](#cb231-5)        open(\"\
    /etc/rc\",O_RDONLY,0);\n[](#cb231-6)        execve(\"/bin/sh\",argv_rc,envp_rc);\n\
    [](#cb231-7)        _exit(2);\n[](#cb231-8)    }\n[](#cb231-9)    if (pid>0)\n\
    [](#cb231-10)        while (pid != wait(&i))\n[](#cb231-11)            /* nothing\
    \ */;\n[](#cb231-12)    while (1) {\n[](#cb231-13)        if (!(pid=fork())) {\n\
    [](#cb231-14)            close(0);close(1);close(2);\n[](#cb231-15)          \
    \  setsid();\n[](#cb231-16)            (void) open(\"/dev/tty0\",O_RDWR,0);\n\
    [](#cb231-17)            (void) dup(0);\n[](#cb231-18)            (void) dup(0);\n\
    [](#cb231-19)            _exit(execve(\"/bin/sh\",argv,envp));\n[](#cb231-20)\
    \        }\n[](#cb231-21)        while (1)\n[](#cb231-22)            if (pid ==\
    \ wait(&i))\n[](#cb231-23)                break;\n[](#cb231-24)        printf(\"\
    \\n\\rchild %d died with code %04x\\n\\r\",pid,i);\n[](#cb231-25)        sync();\n\
    [](#cb231-26)    }\n[](#cb231-27)    _exit(0);   /* NOTE! _exit, not exit() */\n\
    [](#cb231-28)}\n```\n\n别急，我们一点点看，我仍然是去掉了一些错误校验的旁路分支。\n\n```\n[](#cb232-1)void\
    \ init(void) {\n[](#cb232-2)    ...\n[](#cb232-3)    if (!(pid=fork())) {\n[](#cb232-4)\
    \        close(0);\n[](#cb232-5)        open(\"/etc/rc\",O_RDONLY,0);\n[](#cb232-6)\
    \        execve(\"/bin/sh\",argv_rc,envp_rc);\n[](#cb232-7)        _exit(2);\n\
    [](#cb232-8)    }\n[](#cb232-9)    ...\n[](#cb232-10)}\n```\n\n先看这个第一段，我们先尝试口述翻译一遍。\n\
    \n**1.** `fork` 一个新的子进程，此时就是进程 2 了。\n\n**2.** 在进程 2 里**关闭（`close`）** `0` 号文件描述符。\n\
    \n**3.** 只读形式**打开（`open`）** `rc` 文件。\n\n**4.** 然后**执行（`execve`）** sh 程序。\n\n听起来还蛮合逻辑的，创建进程（`fork`）、关闭（`close`）、打开（`open`）、执行（`execve`）四步走，接下来我们一点点拆解。\n\
    \n### `fork`\n\n`fork` 前面讲过了，就是将进程的 `task_struct` 结构进行一下复制，比如进程 0 `fork` 出进程 1\
    \ 的时候。\n\n![](media/file245.webp \"fig:\")\n\n之后，新进程再重写一些基本信息，包括元信息和 `tss` 里的寄存器信息。再之后，用\
    \ `copy_page_tables` 复制了一下页表（这里涉及到写时复制的伏笔）。\n\n比如进程 0 复制出进程 1 的时候，页表是这样复制的。\n\n\
    ![](media/file246.webp \"fig:\")\n\n而这里的进程 1 `fork` 出进程 2，也是同样的流程，不同之处在于两点细节：\n\
    \n**第一点**，进程 1 打开了三个文件描述符并指向了 `tty0`，那这个也被复制到进程 2 了，具体说来就是进程结构 `task_struct` 里的\
    \ `flip[]` 数组被复制了一份。\n\n```\n[](#cb233-1)struct task_struct {\n[](#cb233-2)  \
    \  ...\n[](#cb233-3)    struct file *filp[NR_OPEN];\n[](#cb233-4)    ...\n[](#cb233-5)};\n\
    ```\n\n而进程 0 `fork` 出进程 1 时是没有复制这部分的，因为进程 0 没有打开文件。这也是刚刚说的与外设能力的体现，即进程 0 没有外设交互的能力，进程\
    \ 1 有，哎，其实就是 `flip` 数组里有没有东西嘛\n\n**第二点**，进程 0 `fork` 出进程 1 时页表的复制只有 16 项，映射 64K，而之后进程的复制，统都是复制1024\
    \ 项，映射 4M 空间。\n\n```\n[](#cb234-1)int copy_page_tables(unsigned long from,long\
    \ size) {\n[](#cb234-2)    ...\n[](#cb234-3)    nr = (from==0)?0xA:1024;\n[](#cb234-4)\
    \    ...\n}\n```\n\n整体看如图所示。\n\n![](media/file247.webp \"fig:\")\n\n除此之外，就没有别的区别。\n\
    \n### `close`\n\n好了，我们继续看。\n\n```\n[](#cb235-1)void init(void) {\n[](#cb235-2)\
    \    ...\n[](#cb235-3)    if (!(pid=fork())) {\n[](#cb235-4)        close(0);\n\
    [](#cb235-5)        open(\"/etc/rc\",O_RDONLY,0);\n[](#cb235-6)        execve(\"\
    /bin/sh\",argv_rc,envp_rc);\n[](#cb235-7)        _exit(2);\n[](#cb235-8)    }\n\
    [](#cb235-9)    ...\n}\n```\n\n`fork` 完，后面 `if` 里面的代码都是进程 2 在执行。`close(0)` 就是关闭\
    \ `0` 号文件描述符，也就是进程 1 复制打开了 `tty0` 作为标准输入，那么此时 `0` 号文件描述符就空。下面是 `close` 对应的系统调用。\n\
    \n```\n[](#cb236-1)int sys_close(unsigned int fd) { \n[](#cb236-2)    ...\n[](#cb236-3)\
    \    current->filp[fd] = NULL;\n[](#cb236-4)    ...\n}\n```\n\n### `open`\n\n\
    接下来 `open` 函数以只读形式打开了一个 `/etc/rc` 的文件，占据了 `0` 号文件描述符。\n\n```\n[](#cb237-1)void\
    \ init(void) {\n[](#cb237-2)    ...\n[](#cb237-3)    if (!(pid=fork())) {\n[](#cb237-4)\
    \        ...\n[](#cb237-5)        open(\"/etc/rc\",O_RDONLY,0);\n[](#cb237-6)\
    \        ...\n[](#cb237-7)    }\n}\n```这个 `rc` 文件表示配置文件，具体什么内容取决于硬盘里这个位置放了什么，与内核无关，所以我们暂不用。此时，进程\
    \ 2 与进程 1 几乎一样，只不过进程 2 通过 `close` 和 `open` 操作，将原来进程 1 的标准输入的 `0` 号文件描述符重新指向了 `/etc/rc`。到目前，进程\
    \ 2 与进程 1 的区别，是将 `0` 号文件描述符重新指向了 `/etc/rc`，其他的啥区别。而这个 `rc` 文件是干嘛的，现在不用管，肯定是 sh\
    \ 程序用到的，到时候再说。\n\n### `execve`\n\n好，接下来进程 2 就将不一样了，会通过一个经典的也是最难理解的 `execve` 函数调用，使自己一变，成为\
    \ `/bin/sh` 程序继续运行，这就是下一章的重点！\n\n```\n[](#cb238-1)void init(void) {\n[](#cb238-2)\
    \    ...\n[](#cb238-3)    if (!(pid=fork())) {\n[](#cb238-4)        ...\n[](#cb238-5)\
    \        execve(\"/bin/sh\",argv_rc,envp_rc);\n[](#cb238-6)        ...\n[](#cb238-7)\
    \    }\n}\n```\n\n这里就包含了操作系统究竟是如何加载并执行一个程序的原理，包括如何从文件系统中找到文件，如何解析一个可执行文件（在现代的\
    \ Linux 里称 ELF 可执行文件），如何将可执行文件中的代码和数据加载到内存并运行。加载到内存并运行包含了虚拟内存等相关的知识。所以里面的水很深，了解了这个函数，再加上\
    \ `fork` 函数，基本就可以把操作系统全部核心逻辑都串起来了。\n\n欲知后事如何，且听下回分解。\n\n***\n"
