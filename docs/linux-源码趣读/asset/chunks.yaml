    [](#cb53-12)    floppy_init();\n[](#cb53-13)    ...\n[](#cb53-14)}\n```\n\n包括**内存初始化\
    \ mem_init**，**中断初始化 trap_init**、**进程调度初始化 sched_init** 等等。我们知道学操作系统知识的时候，其实就分成这么几块来学的，看来在操作系统源码上看，也确实是这么划分的，那我们之后照着源码慢慢品，就好了。\n\
    \n第三部分是**切换到用户态模式**，并在一个新的进程中做一个最终的初始化 init。\n\n```\n[](#cb54-1)void main(void)\
    \ {\n[](#cb54-2)    ...\n[](#cb54-3)    sti();\n[](#cb54-4)    move_to_user_mode();\n\
    [](#cb54-5)    if (!fork()) {\n[](#cb54-6)        init();\n[](#cb54-7)    }\n\
    [](#cb54-8)    ...\n[](#cb54-9)}\n```\n\n这个 init 函数里会创建出一个进程，设置终端的标准 IO，并且再创建出一个执行\
    \ shell 程序的进程用来接受用户的命令，到这里其实就出现了我们熟悉的画面（下面是 bochs 启动 Linux 0.11 后的画面）。\n\n![](media/file89.webp\
    \ \"fig:\")\n\n第四部分是个**死循环**，如果没有任何任务可以运行，操作系统会一直陷入这个死循环无法自拔。\n\n```\n[](#cb55-1)void\
    \ main(void) {\n[](#cb55-2)    ...\n[](#cb55-3)    for(;;) pause();\n[](#cb55-4)}\n\
    ```\n\nOK，不要细品每一句话，我们本回就是要你有个整体印象，之后会细细讲这里的每一个部分。\n\n这里再放上目前的内存布局图。\n\n![](media/file90.webp\
    \ \"fig:\")\n\n这个图大家一定要牢记在心，操作系统说白了就是在内存中放置各种的数据结构，来实现“管理”的功能。\n\n所以之后我们的学习过程，主心骨其实就是看看，操作系统在经过一番折腾后，又在内存中建立了什么数据结构，而这些数据结构后面又是如何用到的。\n\
    \n比如进程管理，就是在内存中建立好多复杂的数据结构用来记录进程的信息，再配合上进程调度的小算法，完成了进程这个强大的功能。\n\n为了让大家目前心里有个底，我们把前面的工作再再再再在这里做一个回顾，用一张图表示就是：\n\
    \n![](media/file91.webp \"fig:\")\n\n看到了吧，我们已经把 boot 文件夹下的三个汇编文件的全部代码都一行一行品读过了，其主要功能就是三张表的设置：全局描述符表、中断描述符表、页表。同时还设置了各种段寄存器，栈顶指针。并且，还为后续的程序提供了设备信息，保存在\
    \ 0x90000 处往后的几个位置上。\n\n最后，一个华丽的跳转，将程序跳转到了 main.c 文件里的 main 函数中。\n\n所以，本讲就是让大家深呼吸，把之前的准备工作再消化消化。如果第一部分全部认真看过的同学，必定觉得这一回是废话。\n\
    \n如果你不这样觉得，那就得再回去重新梳理一边咯，如果有不会的，赶紧查资料搞懂它，因为之后要打一系列的硬仗了！根基不稳，地动山摇！\n\n预知后事如何，且听下回分解。\n\
    \n* * *\n\n## 第12回 管理内存前先划分出三个边界值\n\n> 原文链接: [https://mp.weixin.qq.com/s/eoBFcgm0QrHOVi_WoS7PwA](https://mp.weixin.qq.com/s/eoBFcgm0QrHOVi_WoS7PwA)\n\
    \n书接上回，上回书咱们回顾了一下 main.c 函数之前我们做的全部工作，给进入 main 函数做了一个充分的准备。\n\n![](media/file92.webp\
    \ \"fig:\")\n\n那今天我们就话不多说，从 main 函数的第一行代码开始读。\n\n还是把 main 的全部代码都先写出来，很少。"
