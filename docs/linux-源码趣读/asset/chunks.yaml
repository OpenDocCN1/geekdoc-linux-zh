    \ RAM 芯片，你在开机时长按某个键就可以进入设置它的页面。\n\n![](media/file111.webp \"fig:\")\n\n那我们的代码，其实就是与它打交道，获取它的一些数据而已。\n\
    \n我们回过头看代码。\n\n```\n[](#cb99-1)static void time_init(void) {\n[](#cb99-2)    struct\
    \ tm time;\n[](#cb99-3)    do {\n[](#cb99-4)        time.tm_sec = CMOS_READ(0);\n\
    [](#cb99-5)        time.tm_min = CMOS_READ(2);\n[](#cb99-6)        time.tm_hour\
    \ = CMOS_READ(4);\n[](#cb99-7)        time.tm_mday = CMOS_READ(7);\n[](#cb99-8)\
    \        time.tm_mon = CMOS_READ(8);\n[](#cb99-9)        time.tm_year = CMOS_READ(9);\n\
    [](#cb99-10)    } while (time.tm_sec != CMOS_READ(0));\n[](#cb99-11)    BCD_TO_BIN(time.tm_sec);\n\
    [](#cb99-12)    BCD_TO_BIN(time.tm_min);\n[](#cb99-13)    BCD_TO_BIN(time.tm_hour);\n\
    [](#cb99-14)    BCD_TO_BIN(time.tm_mday);\n[](#cb99-15)    BCD_TO_BIN(time.tm_mon);\n\
    [](#cb99-16)    BCD_TO_BIN(time.tm_year);\n[](#cb99-17)    time.tm_mon--;\n[](#cb99-18)\
    \    startup_time = kernel_mktime(&time);\n[](#cb99-19)}\n```\n\n前面几个赋值语句 **CMOS_READ**\
    \ 就是通过读写 CMOS 上的指定端口，依次获取**年月日时分秒**等信息。具体咋操作代码上也写了，也是按照 CMOS 手册要求的读写指定端口就行了，我们就不展开了。\n\
    \n所以你看，其实操作系统程序，也是要依靠与一个外部设备打交道，来获取这些信息的，并不是它自己有什么魔力。操作系统最大的魅力，就在于它借力完成了一项伟大的事，借\
    \ CPU 的力，借硬盘的力，借内存的力，以及现在借 CMOS 的力。\n\n至于 CMOS 又是如何知道时间的，这个就不在我们讨论范围了。\n\n接下来\
    \ **BCD_TO_BIN** 就是 BCD 转换成 BIN，因为从 CMOS 上获取的这些年月日都是 BCD 码值，需要转换成存储在我们变量上的二进制数值，所以需要一个小算法来转换一下，没什么意思。\n\
    \n最后一步 **kernel_mktime** 也很简单，就是根据刚刚的那些时分秒数据，计算从 **1970 年 1 月 1 日 0 时**起到开机当时经过的秒数，作为开机时间，存储在\
    \ **startup_time** 这个变量里。\n\n想研究可以仔细看看这段代码，不过我觉得这种细节不必看。\n\n```\n[](#cb100-1)startup_time\
    \ = kernel_mktime(&time);\n[](#cb100-2)\n[](#cb100-3)// kernel/mktime.c\n[](#cb100-4)long\
    \ kernel_mktime(struct tm * tm)\n[](#cb100-5){\n[](#cb100-6)    long res;\n[](#cb100-7)\
    \    int year;\n[](#cb100-8)    year = tm->tm_year - 70;\n[](#cb100-9)    res\
    \ = YEAR*year + DAY*((year+1)/4);\n[](#cb100-10)    res += month[tm->tm_mon];\n\
    [](#cb100-11)    if (tm->tm_mon>1 && ((year+2)%4))\n[](#cb100-12)        res -=\
    \ DAY;\n[](#cb100-13)    res += DAY*(tm->tm_mday-1);\n[](#cb100-14)    res +=\
    \ HOUR*tm->tm_hour;\n[](#cb100-15)    res += MINUTE*tm->tm_min;\n[](#cb100-16)\
    \    res += tm->tm_sec;\n[](#cb100-17)    return res;\n[](#cb100-18)}\n```\n\n\
    就这。\n\n所以今天其实就是，计算出了一个 **startup_time** 变量而已，至于这个变量今后会被谁用，怎么用，那就是后话了。\n\n相信你逐渐也体会到了，此时操作系统好多地方都是用外设要求的方式去询问，比如硬盘信息、显示模式，以及今天的开机时间的获取等。\n\
    \n所以至少到目前来说，你还不应该感觉操作系统有多么的“高端”，很多时候都是繁琐地，读人家的硬件手册，获取到想要的的信息，拿来给自己用，或者对其进行各种设置。\n\
    \n但你一定要耐得住寂寞，真正体现操作系统的强大设计之处，还得接着往下读。\n\n欲知后事如何，且听下回分解。\n\n* * *\n\n## 第18回 进程调度初始化\
    \ sched_init\n\n> 原文链接: [https://mp.weixin.qq.com/s/j4FYWUSX_2gpDb_h4vEFqQ](https://mp.weixin.qq.com/s/j4FYWUSX_2gpDb_h4vEFqQ)\n\
    \n书接上回，上回书咱们说到，**time_init** 方法通过与 CMOS 端口进行读写交互，获取到了年月日时分秒等数据，并通过这些计算出了开机时间 **startup_time**\
    \ 变量，是从 1970 年 1 月 1 日 0 时起到开机当时经过的秒数。\n\n我们继续往下看，大名鼎鼎的进程调度初始化，**shed_init**。\n\
    \n```\n[](#cb101-1)void main(void) {\n[](#cb101-2)    ...\n[](#cb101-3)    mem_init(main_memory_start,memory_end);\n\
    [](#cb101-4)    trap_init();\n[](#cb101-5)    blk_dev_init();\n[](#cb101-6)  \
    \  chr_dev_init();\n[](#cb101-7)    tty_init();\n[](#cb101-8)    time_init();\n\
    [](#cb101-9)    sched_init();\n[](#cb101-10)    buffer_init(buffer_memory_end);\n\
    [](#cb101-11)    hd_init();\n[](#cb101-12)    floppy_init();\n[](#cb101-13) \n\
    [](#cb101-14)    sti();\n[](#cb101-15)    move_to_user_mode();\n[](#cb101-16)\
    \    if (!fork()) {init();}\n[](#cb101-17)    for(;;) pause();\n[](#cb101-18)}\n\
    ```\n\n这方法可了不起，因为它就是多进程的基石！\n\n终于来到了兴奋的时刻，是不是很激动？不过先别激动，这里只是进程调度的初始化，也就是为进程调度所需要用到的数据结构做个准备，真正的进程调度还需要调度算法、时钟中断等机制的配合。\n\
    \n当然，对于理解操作系统，流程和数据结构最为重要了，而这一段作为整个流程的起点，以及建立数据结构的地方，就显得格外重要了。\n\n我们进入这个方法，一点点往后看。\n\
    \n```\n[](#cb102-1)void sched_init(void) {\n[](#cb102-2)    set_tss_desc(gdt+4,\
    \ &(init_task.task.tss));\n[](#cb102-3)    set_ldt_desc(gdt+5, &(init_task.task.ldt));\n\
    [](#cb102-4)    ...\n[](#cb102-5)}\n```\n\n两行代码初始化了下 **TSS** 和 **LDT**。\n\n先别急问这俩结构是啥。还记得之前讲的全局描述符表\
    \ gdt 么？它在内存的这个位置，并且被设置成了这个样子。\n\n![](media/file112.webp \"fig:\")\n\n忘了的看一下[第八回\
    \ | 烦死了又要重新设置一遍 idt 和 gdt](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499734&idx=1&sn=89045b51e41d2e74754f5475d25d7b54&chksm=c2c5857bf5b20c6d1698df2abd0e1eea601e83612ee6af58dc8eb79f93c751f73d7c62e565ce&scene=21#wechat_redirect)，这就说明之前看似没用的细节有多重要了，大家一定要有耐心。\n\
    \n说回这两行代码，其实就是往后又加了两项，分别是 TSS 和 LDT。\n\n![](media/file113.webp \"fig:\")\n\n好，那再说说这俩结构是干嘛的，不过本篇先简单理解，后面会详细讲到。\n\
    \nTSS 叫**任务状态段**，就是**保存和恢复进程的上下文的**，所谓上下文，其实就是各个寄存器的信息而已，这样进程切换的时候，才能做到保存和恢复上下文，继续执行。\n\
    \n由它的数据结构你应该可以看出点意思。"
