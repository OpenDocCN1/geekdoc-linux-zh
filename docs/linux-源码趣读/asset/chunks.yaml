    \ 使得内核具有了以文件系统管理硬盘数据的能力。\n\n![media/file285.webp]\n\n接下来 [第 33 回 | 打开终端设备](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502230&idx=1&sn=44e023bf0b9c3726135a6e3722bc57)c2c5b3f25b23a210099601111555574114482ba42a)\
