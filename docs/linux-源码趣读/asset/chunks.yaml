    \ m_inode * inode;\n    struct file * f[2];\n    int fd[2];\n\n    for(int i=0,j=0;\
    \ j<2 && i<NR_FILE; i++)\n        if (!file_table[i].f_count)\n            (f[j++]=i+file_table)->f_count++;\n\
    \    ...\n    for(int i=0,j=0; j<2 && i<NR_OPEN; i++)\n        if (!current->filp[i])\
    \ {\n            current->filp[ fd[j]=i ] = f[j];\n            j++;\n        }\n\
    \    ...\n    if (!(inode=get_pipe_inode())) {\n        current->filp[fd[0]] =\
    \ current->filp[fd[1]] = NULL;\n        f[0]->f_count = f[1]->f_count = 0;\n \
    \       return -1;\n    }\n    f[0]->f_inode = f[1]->f_inode = inode;\n    f[0]->f_pos\
    \ = f[1]->f_pos = 0;\n    f[0]->f_mode = 1;       /* read */\n    f[1]->f_mode\
    \ = 2;       /* write */\n    put_fs_long(fd[0],0+fildes);\n    put_fs_long(fd[1],1+fildes);\n\
    \    return 0;\n}\n```\n\n不出我们所料，和**进程打开一个文件**的步骤是差不多的，可以回顾下[第 33 回 | 打开终端设备文件](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502230&idx=1&sn=44e023bf0b9b37261e35a6e3722bc57f&chksm=c2c5b33bf5b23a2d10a9dd36606c497f41a1c3dced57845ce7ef12741a348fab82beba462a8a&scene=21#wechat_redirect)这一回，下图是进程打开一个文件时的步骤。\n\
    \n![](img/file313.webp \"fig:\")\n\n而 `pipe` 方法与之相同的是，都是从进程中的**文件描述符表 `filp`**数组和系统的**文件系统表\
    \ `file_table`**数组中寻找空闲项并绑定。\n\n不同的是，打开一个文件的前提是文件已经存在了，根据文件名找到这个文件，并提取出它的 `inode`\
    \ 信息，填充好 `file` 数据。\n\n而 `pipe` 方法中并不是打开一个已存在的文件，而是**创建一个新的管道类型的文件**，具体是通过 `get_pipe_inode`\
    \ 方法，返回一个 `inode` 结构。然后，填充了两个 `file` 结构的数据，都指向了这个 `inode`，其中一个的 `f_mode` 为 1 也就是写，另一个是\
    \ 2 也就是读。（`f_mode` 为文件的操作模式属性，也就是 RW 位的值）\n\n创建管道的方法 `get_pipe_inode` 方法如下。\n\n\
    ```c\n// fs.h\n#define PIPE_HEAD(inode)  ((inode).i_zone[0])\n#define PIPE_TAIL(inode)\
    \  ((inode).i_zone[1])\n\n// inode.c\nstruct m_inode * get_pipe_inode(void) {\n\
    \    struct m_inode *inode = get_empty_inode()；\n    inode->i_size=get_free_page()；\n\
    \    inode->i_count = 2; /* sum of readers/writers */\n    PIPE_HEAD(*inode) =\
    \ PIPE_TAIL(*inode) = 0;\n    inode->i_pipe = 1;\n    return inode;\n}\n```\n\n\
    可以看出正常文件的 `inode` 中的 `i_size` 表示文件大小，而管道类型的 `i_size` 表示管道使用的这一页内存的起始地址。OK，管道的原理在这里说完了，最终我们实现了一个进程的输出指向另一个进程的输入。\n\
    \n![](img/file314.webp \"fig:\")\n\n回到开始的 `runcmd` 方法。\n\n```c\n// xv6-public.c\n\
    void runcmd(struct cmd *cmd) {\n    switch(cmd->type) {\n        case EXEC:\n\
    \            ecmd = (struct ecmd*)cmd;\n            exec(ecmd->argv[0], ecmd->argv);\n\
    \            ...\n        case REDIR:\n        case LIST:\n        case PIPE:\n\
    \        case BACK:\n    }\n}\n```\n\n（注：后续文本因内容乱码严重，未进行翻译）\n"
- fmt: "\n```c\n// read_write.c\nint sys_read(unsigned int fd,char * buf,int count)\
    \ {\n    struct file * file = current->filp[fd];\n    // 校验 buf 区域的内存限制\n    verify_area(buf,count);\n\
    \    struct m_inode * inode = file->f_inode;\n    // 管道文件\n    if (inode->i_pipe)\n\
    \        return (file->f_mode&1) ? read_pipe(inode,buf,count) : -EIO;\n    //\
    \ 字符设备文件\n    if (S_ISCHR(inode->i_mode))\n        return rw_char(READ,inode->i_zone[0],buf,count,&file->f_pos);\n\
    \    // 块设备文件\n    if (S_ISBLK(inode->i_mode))\n        return block_read(inode->i_zone[0],&file->f_pos,buf,count);\n\
    \    // 目录文件或普通文件\n    if (S_ISDIR(inode->i_mode) || S_ISREG(inode->i_mode)) {\n\
    \        if (count+file->f_pos > inode->i_size)\n            count = inode->i_size\
    \ - file->f_pos;\n        if (count<=0)\n            return 0;\n        return\
    \ file_read(inode,file,buf,count);\n    }\n    // 不是以上几种，就报错\n    printk(\"(Read)inode->i_mode=%06o\\\
    n\\r\",inode->i_mode);\n    return -EINVAL;\n}\n```\n\n这样，整个的逻辑就非常清晰了。\n\n由此也可以注意到，操作系统源码的设计比我刚刚说的更通用，我刚刚只让你设计了读取硬盘的函数，但其实在\
    \ Linux 下一切皆文件，所以这个函数将`管道文件、字符设备文件、块设备文件、目录文件、普通文件`分别指向了不同的具体实现。\n\n那我们今天仅仅关注最常用的，读取目录文件或普通文件，并且不考虑读取的字节数大于文件本身大小这种不合理情况。\n\
    \n再简化下代码。\n\n```c\n// read_write.c\nint sys_read(unsigned int fd,char * buf,int\
    \ count) {\n    struct file * file = current->filp[fd];\n    struct m_inode *\
    \ inode = file->f_inode;\n    // 校验 buf 区域的内存限制\n    verify_area(buf,count);\n\
    \    // 仅关注目录文件或普通文件\n    return file_read(inode,file,buf,count);\n}\n```\n\n\
    太棒了！没剩多少了，一个个击破！\n\n第一步，根据文件描述符 `fd`，在进程表里拿到了 `file` 信息，进而拿到了 `inode` 信息。第二步，对\
    \ `buf` 区域的内存做校验。第三步，调用具体的 `file_read` 函数进行读操作。\n\n就这三步，很简单吧～\n\n在进程表 `filp` 中拿到\
    \ `file` 信息进而拿到 `inode` 信息这一步就不用多说了，这是在打开一个文件时，或者像管道文件一样创建出一个管道文件时，就封装好了 `file`\
    \ 以及它的 `inode` 信息。\n\n我们看接下来的两步。\n\n### 对 buf 区域的内存做校验 verify_area\n\n对 `buf`\
    \ 区域的内存做校验的部分，说是校验，里面还挺有说道呢。\n\n```c\n// fork.c\nvoid verify_area(void * addr,int\
    \ size) {\n    unsigned long start;\n    start = (unsigned long) addr;\n    size\
    \ += start & 0xfff;\n    start &= 0xfffff000;\n    start += get_base(current->ldt[2]);\n\
    \    while (size>0) {\n        size -= 4096;\n        write_verify(start);\n \
    \       start += 4096;\n    }\n}\n```\n\n`addr` 就是刚刚的 `buf`，`size` 就是刚刚的 `count`。这里又将\
    \ `addr` 赋值给了 `start`。所以代码开始，`start` 表示复制到的内存的起始地址，`size` 就是复制的字节数。\n\n这段代码很简单，但如果不了解内存的分段和分页机制，将会难以。Linux\
    \ 以 `4K` 为单位来划分内存，所以内存就是一个 `4K` 的格子。你看，假设复制到的内存的起始地址 `start` 和复制的字节数 `size` 在图中的位置。那么开始的两行代码：\n\
    \n```c\n// fork.c\nvoid verify_area(void * addr,int size) {\n    ...\n    size\
    \ += start & 0xfff;\n    start &= 0xfffff000;\n}\n```\n\n就是将 `start` 和 `size`\
    \ 按页对齐。然后由于每个进程有不同的数据段，还要加上它：\n\n```c\n// fork.c\nvoid verify_area(void * addr,int\
    \ size) {\n    ...\n    start += get_base(current->ldt[2]);\n    ...\n}\n```\n\
    \n具体来说加上当前进程的局部描述符 `LDT` 中的数据段。每个进程的 `LDT` 表由 Linux 创建时规划好了。具体来说，每个进程的线性地址范围是\
    \ `(进程号)*64M ~ `(进程号+1)*64M`。对于进程本身，以为是从零地址开始后的 `64M`，所以传入的 `start` 值是以零地址算出来的。\n\
    \n现在经过系统调用进入 `sys_write` 后切换为内核态，内核态访问数据通过基地址为 `0` 的全局描述符来访问数据。所以 `start` 要加上自己进程的数据段，才对。之后，就是对这些页进行验证。\n\
    \n```c\n// fork.c\nvoid verify_area(void * addr,int size) {\n    ...\n    while\
    \ (size>0) {\n        size -= 4096;\n        write_verify(start);\n        start\
    \ += 4096;\n    }\n}\n```\n\n也就是这些页。`write_verify` 将会对这些页进行写验证，如果页面存在不可写，则执行 `un_wp_page`\
    \ 复制页面。\n\n```c\n// memory.c\nvoid write_verify(unsigned long address) {\n   \
    \ unsigned long page;\n    if (!( (page = *((unsigned long *) ((address>>20) &\
    \ 0xffc ))&1))\n        return;\n    page &= 0xfffff000;\n    page += ((address>>10)\
    \ & 0xffc);\n    if ((3 & *(unsigned long *) page) == 1)  /* non-writeable, present\
    \ */\n        un_wp_page((unsigned long *) page);\n    return;\n}\n```\n\n看，那个\
    \ `un_wp_page` 意思就是取消页面的写保护，就是写时复制的原理，在[第30回 | 番外篇 - 写时复制就这么几行代码](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502033&idx=1&sn=1acfd8b7f4c805906ecd51c33d010eb&chksm=c2c5b27cf5b23b6a41051c7f93407afc97094a4b0a36ea0506)\
    \ 讨论过了，这里就不展开。\n\n### 执行读操作 file_read\n\n下面开始进入读的操作题，页校验之后，就可以调用 `file_read` 函数。\n\
    \n```c\n// read_write.c\nint sys_read(unsigned int fd,char * buf,int count) {\n\
    \    ...\n    return file_read(inode,buf,count);\n}\n```\n\n```c\n// file_dev.c\n\
    int file_read(struct m_inode * inode, struct file * filp, char * buf, int count)\
    \ {\n    int left,nr;\n    struct buffer_head * bh;\n    left = count;\n    while\
    \ (left) {\n        if (nr = bmap(inode,filp->f_pos)/BLOCK_SIZE) {\n         \
    \   if (!(bread(inode->i_dev,nr)))\n                break;\n        } else\n \
    \           bh = NULL;\n        nr = filp->f_pos % BLOCK_SIZE;\n        chars\
    \ = MIN( BLOCK_SIZE, left );\n        filp->f_pos += chars;\n        left -= chars;\n\
    \        if (bh) {\n            char * p = nr + bh->b_data;\n            while\
    \ (chars-->0)\n                put_fs_byte(*(p++),buf++);\n            free(bh);\n\
    \        } else {\n            while (chars-->0)\n                put_fs_byte(0,buf++);\n\
    \        }\n    }\n    inode->i_atime = CURRENT_TIME;\n    return (count-left)\
    \ ? (count-left) : -ERROR;\n}\n```\n\n整体看，就是一个 `while` 循环，每次读入一个块的数据，直到入参要求的大小读完为止。去掉\
    \ `while`，简化起来就是：\n\n```c\n// file_dev.c\nint file_read(struct m_inode * inode,\
    \ struct file * filp, char * buf, int count) {\n    ...\n    int nr = bmap(inode,filp->f_pos)/BLOCK_SIZE;\n\
