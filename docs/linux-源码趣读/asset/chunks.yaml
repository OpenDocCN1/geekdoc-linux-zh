    \ ss** 和**栈基址寄存器 sp** 分别设置好了值，方便后续使用。\n\n再拔高一下，其实操作系统在做的事情，就是给如何访问代码，如何访问数据，如何访问栈进行了一下**内存的初步规划**。其中访问代码和访问数据的规划方式就是设置了一个**基址**而已，访问栈就是把**栈顶指针**指向了一个远离代码位置的地方而已。\n\
    \n![](media/file16.webp \"fig:\")\n\n所以，千万别多想，就这么点事儿。那再给大家留个作业，把当前的内存布局画出来，告诉我现在\
    \ **cs、ip、ds、ss、sp** 这些寄存器的值，在内存布局中的位置。\n\n好了，接下来我们应该干什么呢？我们回忆下，我们目前仅仅把硬盘中 512\
    \ 字节加载到内存中了，但操作系统还有很多代码仍然在硬盘里，不能抛下他们不管呀。\n\n所以你猜下一步要干嘛了？\n\n后面的世界越来越精彩，欲知后事如何，且听下回分解。\n\
    \n**------- 本回扩展与延伸 -------**\n\n有关段寄存器的详细信息，可以参考 Intel 手册：\n\nVolume 1 Chapter\
    \ 3.4.2 Segment Registers\n\n其中有一张图清晰地描述了三种段寄存器的作用。\n\n![](media/file17.webp \"\
    fig:\")\n\n正如我们本回所涉及到的讲述一样，**CS 是代码段寄存器**，就是执行代码的时候带着这里存的基地址。**DS 是数据段寄存器**，就是访问数据的时候带着这里的基地址。**SS\
    \ 是栈段寄存器**，就是访问栈时带着这里的基地址。\n\n![](media/file18.webp \"fig:\")\n\n所以本回的代码，正如标题所说，就是做好最最基础的准备工作。但要从更伟大的战略意义上讲，它其实是按照\
    \ Intel 手册上要求的，老老实实把这三类段寄存器的值设置好，达到了**初步规划内存**的目的。\n\n读到这里，我希望你此时已经稍稍有些，**操作系统原来就是这个破玩意**，的感觉。\n\
    \n同时也可以看出，Intel 手册对于理解底层知识非常直接有效，但却没有很好的中文翻译版本，因此让许多人望而生畏，只能去看一些错误百出的中文二手资料和博客。因此我也发起了一个\
    \ **Intel 手册翻译计划**，就在阅读原文的 GitHub 里，感兴趣的同胞们可以参与进来，我们共同完成一份伟大的事。\n\n* * *\n\n##\
    \ 第4回 把自己在硬盘里的其他部分也放到内存来\n\n> 原文链接: [https://mp.weixin.qq.com/s/hStc-y-sabP-KwJUDUesTw](https://mp.weixin.qq.com/s/hStc-y-sabP-KwJUDUesTw)\n\
    \n书接上回，上回书咱们说到，操作系统的一些最最最最基础的准备工作，已经准备好了。\n\n![](media/file13.webp \"fig:\")\n\
    \n如这张图所示，此时操作系统短短几行代码，将**数据段寄存器 ds** 和**代码段寄存器 cs** 设置为了 **0x9000**，方便代码的跳转与数据的访问。并且，将**栈顶地址\
    \ ss:sp** 设置在了离代码的位置 0x90000 足够遥远的 **0x9FF00**，保证栈向下发展不会轻易撞见代码的位置。\n\n简单说，就是设置了如何访问数据的**数据**段，如何访问代码的**代码**段，以及如何访问栈的**栈顶**指针，也即初步做了一次**内存规划**，从\
    \ CPU 的角度看，访问内存，就这么三块地方而已。\n\n![](media/file19.webp \"fig:\")\n\n做好这些基础工作后，接下来就又该新的一翻折腾了，我们接着往下看。\n\
    \n```\nload_setup:\n    mov dx,#0x0000      ; drive 0, head 0\n    mov cx,#0x0002\
    \      ; sector 2, track 0\n    mov bx,#0x0200      ; address = 512, in 0x9000\n\
    \    mov ax,#0x0200+4    ; service 2, nr of sectors\n    int 0x13            ;\
    \ read it\n    jnc ok_load_setup       ; ok - continue\n    mov dx,#0x0000\n \
    \   mov ax,#0x0000      ; reset the diskette\n    int 0x13\n    jmp load_setup\n\
    \nok_load_setup:\n    ...\n```\n\n这里有两个 **int 指令**我们还没见过。\n\n注意这个 int 是汇编指令，可不是高级语言的整型变量哟。int\
    \ 0x13 表示**发起 0x13 号中断**，这条指令上面给 dx、cx、bx、ax 赋值都是作为这个中断程序的参数。\n\n中断是啥如果你不理解，先不要管，如果你就是放不下，那可以看一眼我之前的文章：[认认真真的聊聊中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247498208&idx=1&sn=b784f8b4e627ebd1bfb9810d194fdb80&chksm=c2c5834df5b20a5bdee331002bfc61c90eb468da325bf67abeef780c303a9f51c8543e1a5981&scene=21#wechat_redirect)，里面讲得非常细致。\n\
    \n![](media/file20.webp \"fig:\")\n\n总之这个中断发起后，CPU 会通过这个**中断号**，去寻找对应的**中断处理程序的入口地址**，并**跳转**过去执行，逻辑上就相当于**执行了一个函数**。而\
    \ 0x13 号中断的处理程序是 BIOS 提前给我们写好的，是**读取磁盘**的相关功能的函数。\n\n之后真正进入操作系统内核后，中断处理程序是需要我们自己去重新写的，这个在后面的章节中，你会不断看到各个模块注册自己相关的中断处理程序，所以不要急。此时为了方便就先用\
    \ BIOS 提前给我们写好的程序了。\n\n可见即便是操作系统的源码，有时也需要去调用现成的函数方便自己，并不是造轮子的人就非得完全从头造。\n\n本段代码的注释已经写的很明确了，直接说最终的作用吧，**就是将硬盘的第\
    \ 2 个扇区开始，把数据加载到内存 0x90200 处，共加载 4 个扇区**，图示其实就是这样。\n\n![](media/file21.webp \"\
    fig:\")\n\n为了图片清晰表达意思，可能比例就不那么严谨了，大家不必纠结。\n\n可以看到，如果复制成功，就跳转到 **ok_load_setup**\
    \ 这个标签，如果失败，则会不断重复执行这段代码，也就是重试。那我们就别管重试逻辑了，直接看成功后跳转的 ok_load_setup 这个标签后的代码。\n\
    \n```\nok_load_setup:\n    ...\n    mov ax,#0x1000\n    mov es,ax       ; segment\
    \ of 0x10000\n    call read_it\n    ...\n    jmpi 0,0x9020\n```\n\n这段代码省略了很多非主逻辑的代码，比如在屏幕上输出\
    \ Loading system ... 这个字符串以防止用户等烦了。\n\n剩下的主要代码就都写在这里了，就这么几行，其作用是**把从硬盘第 6 个扇区开始往后的\
    \ 240 个扇区，加载到内存 0x10000 处**，和之前的从硬盘捣腾到内存是一个道理。\n\n![](media/file22.webp \"fig:\"\
    )\n\n至此，整个操作系统的**全部代码**，就已经全部从硬盘中，被搬迁到内存来了。\n\n然后又通过一个熟悉的段间跳转指令 jmpi 0,0x9020，跳转到\
    \ **0x90200** 处，就是硬盘第二个扇区开始处的内容。\n\n那这里的内容是什么呢？先不急，我们借这个机会把整个操作系统的编译过程说下。整个编译过程，就是通过\
    \ **Makefile** 和 **build.c** 配合完成的，最终会：\n\n***1.*** 把 bootsect.s 编译成 bootsect\
    \ 放在硬盘的 1 扇区。\n\n***2.*** 把 setup.s 编译成 setup 放在硬盘的 2~5 扇区。\n\n***3.*** 把剩下的全部代码（head.s\
    \ 作为开头）编译成 system 放在硬盘的随后 240 个扇区。\n\n所以整个路径就是这样的。\n\n![](media/file23.webp \"\
    fig:\")\n\n所以，我们即将跳转到的内存中的 **0x90200** 处的代码，就是从硬盘第二个扇区开始处加载到内存的。第二个扇区的最开始处，那也就是\
    \ setup.s 文件的第一行代码咯。\n\n![](media/file24.webp \"fig:\")\n\n那这个代码是什么呢？我们后面再说，不过先打开\
    \ setup.s 这个文件看看吧。\n\n```\nstart:\n    mov ax,#0x9000  ; this is done in bootsect\
    \ already, but...\n    mov ds,ax\n    mov ah,#0x03    ; read cursor pos\n    xor\
    \ bh,bh\n    int 0x10        ; save it in known place, con_init fetches\n    mov\
    \ [0],dx      ; it from 0x90000.\n    ...\n```\n\n好了，到目前为止，你是不是觉得，我去，这前面编译放在硬盘的位置，和后面代码写死的跳转地址，竟然如此地强耦合？那万一整错了咋办。\n\
    \n是啊，就是这样，你以为呢？**在操作系统刚刚开始建立的时候，那是完全自己安排前前后后的关系**，一个字节都不能偏，就是这么强耦合，需要小心翼翼，需要大脑时刻保持清醒，规划好自己写的代码被编译并存储在硬盘的哪个位置，而随后又会被加载到内存的哪个位置，不能错乱。\n\
    \n但这也是很有好处的，那就是在这个阶段，你完完全全知道每一步跳转，每一步数据访问都是怎么设计和规划的，不存在黑盒。\n\n不像我们在写高级语言的时候，完全不知道是怎么底层帮我们做了多少工作。虽然这解脱了程序员关心底层细节的烦恼，但在遇到问题或者想知道原理的时候，就显得很讨厌了。所以珍惜这个阶段吧！\n\
    \n而且，你在上层之所以能那么随心所欲，很多底层细节完全不用考虑，很省心，正是因为像今天这样以及之后每一章的各种底层代码小心翼翼的做了很多铺垫。\n\n好了，本文的内容就结束了。这也标志着我们走完了**第一个操作系统源码**文件\
    \ **bootsect.s**，开始向下一个文件 **setup.s** 进发了！\n\n后面的世界越来越精彩，欲知后事如何，且听下回分解。\n\n**-------\
    \ 多说两句 -------**\n\n先给大家留个课后作业，文中不是提到了 BIOS 提供了很多中断函数方便操作系统刚启动的时候调用么？这些中断都是什么？大家负责去找一份**一手资料**（注意是一手资料，不要网上整理的二手博客），并上传到我的\
    \ **GitHub** 上（文末阅读原文就是）。\n\n不知不觉已经第四回了，刚刚才把 bootsect.s 这个汇编文件讲完，它所做的事情无非就是把硬盘中的数据复制到内存，然后挪来挪去的，并且根据放置在内存中的位置，设置了各种段基址寄存器的值。\n\
    \n在解答读者疑问时，我发现有**两种特别极端的人**。\n\n**一种是把这几讲的内容想得极其复杂**，什么代码段和数据段一样会不会相互影响，这些地址是虚拟地址还是物理地址，为什么要不断从内存一个地方挪动到另一个地方，BIOS\
    \ 是怎么映射到内存的，硬盘中 512 字节是数据还是代码，等等。\n\n这样的人，我建议把你所知道的一切先忘掉，就把这几讲所说的东西理解清楚，因为它就是很简单，不涉及那么多乱七八糟的知识。你所产生的那些疑问，在这个阶段根本就不存在这些问题，现在内存就在这，你想怎么玩就怎么玩，无非就是访问数据，执行代码，自己能安排明白即可。"
