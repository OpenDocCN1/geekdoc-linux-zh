    \ 这个方法，就切换到了这个进程去执行了。\n\n看 switch_to 方法，是用内联汇编语句写的。\n\n```\n[](#cb148-1)sched.h\n\
    [](#cb148-2)\n[](#cb148-3)#define switch_to(n)  {\\\n[](#cb148-4)struct  {long\
    \ a,b;} __tmp;  \\\n[](#cb148-5)__asm__(\"cmpl %%ecx,_current\\n\\t\"  \\\n[](#cb148-6)\
    \  \"je 1f\\n\\t\"  \\\n[](#cb148-7)  \"movw %%dx,%1\\n\\t\"  \\\n[](#cb148-8)\
    \  \"xchgl %%ecx,_current\\n\\t\"  \\\n[](#cb148-9)  \"ljmp %0\\n\\t\"  \\\n[](#cb148-10)\
    \  \"cmpl %%ecx,_last_task_used_math\\n\\t\"  \\\n[](#cb148-11)  \"jne 1f\\n\\\
    t\"  \\\n[](#cb148-12)  \"clts\\n\"  \\\n[](#cb148-13)  \"1:\"  \\\n[](#cb148-14)\
    \  ::\"m\"  (*&__tmp.a),\"m\"  (*&__tmp.b),  \\\n[](#cb148-15)  \"d\"  (_TSS(n)),\"\
    c\"  ((long) task[n]));  \\\n[](#cb148-16)}\n```\n\n这段话就是进程切换的最最最最底层的代码了。\n\n\
    看不懂没关系，其实主要就干了一件事，就是 ljmp 到新进程的 tss 段处。\n\n啥意思？\n\nCPU 规定，如果 ljmp 指令后面跟的是一个 tss\
    \ 段，那么，会由硬件将当前各个寄存器的值保存在当前进程的 tss 中，并将新进程的 tss 信息加载到各个寄存器。\n\n![](media/file175.webp\
    \ \"fig:\")\n\n上图来源于《Linux内核完全注释V5.0》\n\n这个图在完全注释这本书里里画的非常清晰，我就不重复造轮子了。\n\n简单说就是，**保存当前进程上下文，恢复下一个进程的上下文，跳过去**！\n\
    \n看，不知不觉，我们上一讲和本讲开头提到的那些进程数据结构的字段，就都用上了。\n\n```\n[](#cb149-1)struct task_struct\
    \ {\n[](#cb149-2)    long state;\n[](#cb149-3)    long counter;\n[](#cb149-4)\
    \    long priority;\n[](#cb149-5)    ...\n[](#cb149-6)    struct tss_struct tss;\n\
    [](#cb149-7)}\n```\n\n至此，我们梳理完了一个进程切换的整条链路，来回顾一下。\n\n----- 流水账开始 -----\n\n罪魁祸首的，就是那个每\
    \ 10ms 触发一次的定时器滴答。\n\n而这个滴答将会给 CPU 产生一个时钟中断信号。\n\n而这个中断信号会使 CPU 查找中断向量表，找到操作系统写好的一个时钟中断处理函数\
    \ do_timer。\n\ndo_timer 会首先将当前进程的 counter 变量 -1，如果 counter 此时仍然大于 0，则就此结束。\n\n\
    但如果 counter = 0 了，就开始进行进程的调度。\n\n进程调度就是找到所有处于 RUNNABLE 状态的进程，并找到一个 counter 值最大的进程，把它丢进\
    \ switch_to 函数的入参里。\n\nswitch_to 这个终极函数，会保存当前进程上下文，恢复要跳转到的这个进程的上下文，同时使得 CPU 跳转到这个进程的偏移地址处。\n\
    \n接着，这个进程就舒舒服服地运行了起来，等待着下一次时钟中断的来临。\n\n----- 流水账结束 -----\n\n好了，这两回我们自己设计了一遍进程调度，又看了一次\
    \ Linux 0.11 的进程调度的全过程。有了这两回做铺垫，我们下一回就该非常自信地回到我们的主流程，开始看我们心心念念的 **fork** 函数！\n\
    \n```\n[](#cb150-1)void main(void) {\n[](#cb150-2)    ... \n[](#cb150-3)    move_to_user_mode();\n\
    [](#cb150-4)    if (!fork()) {\n[](#cb150-5)        init();\n[](#cb150-6)    }\n\
    [](#cb150-7)    for(;;) pause();\n[](#cb150-8)}\n```\n\n欲知后事如何，且听下回分解。\n\n* *\
    \ *\n\n## 第25回 通过 fork 看一次系统调用流程\n\n> 原文链接: [https://mp.weixin.qq.com/s/rYBSH_AZDwgc8knSKDSSxA](https://mp.weixin.qq.com/s/rYBSH_AZDwgc8knSKDSSxA)\n\
    \n书接上回，上回书咱们说到，我们通过自己设计了一遍进程调度，又看了一次 Linux 0.11 的进程调度的全过程。有了这两回做铺垫，我们下一回就该非常自信地回到我们的主流程！\n\
    \n```\n[](#cb151-1)void main(void) {\n[](#cb151-2)    ... \n[](#cb151-3)    move_to_user_mode();\n\
    [](#cb151-4)    if (!fork()) {\n[](#cb151-5)        init();\n[](#cb151-6)    }\n\
    [](#cb151-7)    for(;;) pause();\n[](#cb151-8)}\n```\n\n也就是这个 fork 函数干了啥？\n\n\
    这个 fork 函数稍稍绕了点，我们看如下代码。\n\n```\n[](#cb152-1)static _inline _syscall0(int,fork)\n\
    [](#cb152-2)\n[](#cb152-3)#define _syscall0(type,name)  \\\n[](#cb152-4)type name(void)\
    \  \\\n[](#cb152-5){  \\\n[](#cb152-6)long __res;  \\\n[](#cb152-7)__asm__ volatile\
    \  (\"int $0x80\"  \\\n[](#cb152-8)  :  \"=a\"  (__res)  \\\n[](#cb152-9)  : \
    \ \"0\"  (__NR_##name));  \\\n[](#cb152-10)if  (__res >=  0)  \\\n[](#cb152-11)\
    \  return  (type) __res;  \\\n[](#cb152-12)errno =  -__res;  \\\n[](#cb152-13)return\
    \  -1;  \\\n[](#cb152-14)}\n```\n\n别急，我把它变成稍稍能看得懂的样子，就是这样。\n\n```\n[](#cb153-1)#define\
    \ _syscall0(type,name)  \\\n[](#cb153-2)type name(void)  \\\n[](#cb153-3){  \\\
    \n[](#cb153-4)  volatile  long __res;  \\\n[](#cb153-5) _asm {  \\\n[](#cb153-6)\
    \ _asm mov eax,__NR_##name \\\n[](#cb153-7) _asm int  80h  \\\n[](#cb153-8) _asm\
    \ mov __res,eax \\\n[](#cb153-9)  }  \\\n[](#cb153-10)  if  (__res >=  0)  \\\n\
    [](#cb153-11)  return  (type) __res;  \\\n[](#cb153-12) errno =  -__res;  \\\n\
    [](#cb153-13)  return  -1;  \\\n[](#cb153-14)}\n```\n\n所以，把宏定义都展开，其实就相当于**定义了一个函数**。\n\
    \n```\n[](#cb154-1)int fork(void) {\n[](#cb154-2)     volatile long __res;\n[](#cb154-3)\
    \    _asm {\n[](#cb154-4)        _asm mov eax,__NR_fork\n[](#cb154-5)        _asm\
    \ int 80h\n[](#cb154-6)        _asm mov __res,eax\n[](#cb154-7)    }\n[](#cb154-8)\
    \    if (__res >= 0)\n[](#cb154-9)        return (void) __res;\n[](#cb154-10)\
    \    errno = -__res;\n[](#cb154-11)    return -1;\n[](#cb154-12)}\n```\n\n仅此而已。\n\
    \n具体看一下 fork 函数里面的代码，又是讨厌的内联汇编，不过上面我已经变成好看一点的样子了，而且不用你看懂，听我说就行。\n\n关键指令就是一个 0x80\
    \ 号软中断的触发，**int 80h**。\n\n其中还有一个 eax 寄存器里的参数是 **__NR_fork**，这也是个宏定义，值是 **2**。\n\
    \nOK，还记得 0x80 号中断的处理函数么？这个是我们在 [第18回 | 大名鼎鼎的进程调度就是从这里开始的](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c68c2b03d9721ba74e949cfa8&chksm=c2c5b87df5b2316b083015a4fdba2df29211f38fcfd1cdb040e02ab410432608e26383a43ef5&scene=21#wechat_redirect)\
    \ **sched_init** 里面设置的。\n\n```\n[](#cb155-1)set_system_gate(0x80, &system_call);\n\
    ```\n\n看这个 system_call 的汇编代码，我们发现这么一行。\n\n```\n[](#cb156-1)_system_call:\n[](#cb156-2)\
    \    ...\n[](#cb156-3)    call [_sys_call_table + eax*4]\n[](#cb156-4)    ...\n\
    ```\n\n刚刚那个值就用上了，eax 寄存器里的值是 2，所以这个就是在这个 **sys_call_table** 表里找下标 2 位置处的函数，然后跳转过去。\n\
    \n那我们接着看 sys_call_table 是个啥。"
