    # Linux源码趣读


    ## 开篇词


    > 原文链接: [https://mp.weixin.qq.com/s/tvbkGLfhDq03xxM-FZ4zuA](https://mp.weixin.qq.com/s/tvbkGLfhDq03xxM-FZ4zuA)


    核心信息提炼到开头，以节约大家的时间。


    **要干嘛**：写一个系列


    **啥目的**：带大家把 Linux `0.11` 核心代码与操作系统的设计思想啃下来


    **叫啥名**：你管这破玩意叫操作系统源码 — 像小说一样品读 Linux 0.11 核心代码


    **发文时间**：每周一和每周四


    **预计章节**：60 回


    **互动方式**：微信群（文末有加入方式）


    ## 系列整体布局


    第一部分：进入内核前的苦力活

    第二部分：大战前期的初始化工作

    第三部分：一个新进程的诞生

    第四部分：shell 程序的到来

    第五部分：从一个命令的执行看操作系统各模块的运作

    第六部分：操作系统哲学与思想


    ![](https:/raw.githubusercontent.com/0xHertz/img/main/img640 "fig:")


    OK，以上就是要说的重要的事，以下是啰嗦的部分。


    每个程序员都有一个操作系统梦，而操作系统也是每个程序员的心结。


    很粗糙地了解一点操作系统知识，一知半解的，已经无法满足当下程序员的口味了。但要说深入剖析操作系统，又是大部分程序员都很惶恐的一件事。那如果是要读一遍操作系统源码，那简直跟要了命一样。


    其实，操作系统的源码并没有那么可怕，可为什么即便是 Linux `0.11` 这种代码量最少的版本，仍然令很多人望而却步呢？


    ## 为什么望而却步


    其实，很多优秀的操作系统书籍都是以 Linux `0.11` 这个经典版本为研究对象进行讲解的，比如《Linux 内核设计的艺术》、《Linux 内核完全注释》等。但我们想一下，当我们读一本小说时，为什么即便是非常大部头的小说，也能酣畅淋漓从头读到尾？


    先不直接回答这个问题，我们看一下《天龙八部》的最开头。


    > 青光闪动，一柄青钢剑倏地刺出，指向中年汉子左肩，使剑少年不待剑招用老，腕抖剑斜，剑锋已削向那汉子右颈。那中年汉子...


    记住这个感觉没？我们再看一下《Linux 内核设计的艺术》的最开头。


    > 对于操作系统而言，稳定且可靠的运行是最重要的。现行技术方案是将用户进程与用户进程之间、用户进程与操作系统之间进行分离，操作系统可以管理用户进程，但是用户进程之间不能相互干预
    ...


    好了，不用读下去了，这句话看似高瞻远瞩地从宏观上帮我们梳理操作系统体系结构，但对于尚不了解操作系统的人来说，完全不知道它在说什么，只有劝退的作用。


    **虽然思想很重要，但你在没有任何细节做积累时去强行进行思想的拔高，是拔不上去的，还不如一直保持一张白纸的状态。**


    反观《天龙八部》的开头，连人物的名字都没有，更别说梳理整个体系结构了，直接上来一个精彩镜头，让你迅速进入故事情节。


    可是读完整部小说的读者，无一不对里面的人物如数家珍，对大理的风光仿佛亲眼看见了一般，对宋辽矛盾的激烈感同身受。


    为什么会这样呢？因为一切的爱恨情仇和民族矛盾，都是我们通过一个个人物和事件的刻画，感悟出来的。**只有自己感悟出来的知识和靠自己总结出来的结论，才真正属于自己。**


    而那些一上来就试图把整个脉络给你梳理清楚的尝试，对于新手来说无一不是徒劳，即便是死记硬背记住了，也终究不是属于自己的知识，无法感同身受。


    我学习操作系统的过程中，也有这样的感觉。我曾一次次试图从一个上帝视角来看操作系统的知识体系，从宏观层面跟着大部头书籍梳理操作系统的整体逻辑，我发现无一不是以失败告终。


    而当我放下包袱，用读一本小说的心态来去阅读 Linux 源代码时，我发现我从来没有想着梳理出什么体系，但从一行代码开始，整个操作系统的结构已经清晰地出现在我面前了。而且我也清晰地知道这样的体系是怎么一步步建立起来。


    ## 操作系统哲学与思想


    如何分享呢？并不是说《Linux 内核设计的艺术》这本书不好，而是想着也以写小说的心态和方式，来从头到尾讲述 Linux `0.11` 的源码。


    你管这破玩意叫操作系统源码 — 像小说一样品读 Linux 0.11 核心代码。


    ## 第一部分：进入内核前的苦力活


    ### 第1回 最开始的两行代码


    > 原文链接: [https://mp.weixin.qq.com/s/LIsqRX51W7d_yw-HN-s2DA](https://mp.weixin.qq.com/s/LIsqRX51W7d_yw-HN-s2DA)


    从这一篇开始，进入操作系统的幻之旅！别担心，每一章的内容会少，而且不要抱着负担去学习，只需要读小说一样跟着一章读下去。


    直奔主题。当你按下开机键一刻，主板上的 `BIOS` 会将硬盘中启动区的 512 字节复制到内存中的 `0x7c00` 位置，并跳转到那个位置执行。


    启动区的定义非常简单，只要硬盘中的 512 字节最后两个字节分别是 `0x55` 和 `0xaa`，那么 `BIOS` 认为它是个启动区。对于操作系统开发人员，只需要把操作系统最开始的那段代码存储在硬盘的
    `bootsect.s` 文件夹下。


    Linux `0.11` 的开始代码就是用汇编写的 `bootsect.s`，它会被编译成二进制文件存放在启动区。随后如刚刚说，由 `BIOS` 搬运到内存的
    `0x7c00` 位置，而 CPU 也从这个位置开始一条一条语句执行。


    ```

    mov ax,0x07c0

    mov ds,ax

    ```


    这两行代码是用汇编语言写的，含义是把 `0x07c0` 值复制到 `ax` 寄存器，再将 `ax` 寄存器的值复制到 `ds` 寄存器。结果就是让 `ds`
    寄存器的值变成了 `0x07c0`。


    `ds` 是一个 16 位的寄存器，具体表示段寄存器，在内存寻址时作为基址。它的作用呢？当我们用汇编语言写内存地址时，实际上是写偏移地址。比如：


    ```

    mov ax, [0x0001]

    ```


    相当于：


    ```

    mov ax, [ds:0x0001]

    ```


    `ds` 是默认加上的基址，`0x0001` 是偏移地址。`ds` 被赋值为 `0x07c0`，由于 `x86` 为了让自己在 16 位实模式下访问 20
    位地址，段基址要左移四位。`0x07c0` 左移四位就是 `0x7c00`，这刚好和代码被 `BIOS` 加载到的内存地址 `0x7c00` 一样。也就是说，之后写的代码里面访问的内存地址，都默认加上
    `0x7c00` 去内存中寻址。


    为什么统一加上 `0x7c00` 这个数？这很好解释：`BIOS` 规定把操作系统代码加载到内存 `0x7c00`，那么里面的各种数据自然全都被偏移了，所以把段寄存器
    `ds` 设置为这个值，方便以后通过这种基址访问内存里的数据。


    ## 第2回 自己给自己挪个地儿


    > 原文链接: [https://mp.weixin.qq.com/s/U-txDYt0YqLh5EeFOcB4NQ](https://mp.weixin.qq.com/s/U-txDYt0YqLh5EeFOcB4NQ)


    这一章讲的是如何通过 `mov` 指令将默认的数据段寄存器 `ds` 的值改为 `0x07c0`，方便以后的基址寻址方式。

