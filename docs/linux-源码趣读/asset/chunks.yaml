  trans: "\n\n新建一个非常简单的 `info.txt` 文件。\n\n```\nname:flash\nage:28\nlanguage:java\n\
    ```\n\n在命令行输入一条十分简单的命令。\n\n```\n[root@linux0.11] cat info.txt | wc -l\n3\n```\n\
    \n这条命令的意思是读取刚刚的 `info.txt` 文件，输出它的行数。\n\n我们先从最初始的状态开始说起。\n\n最初始的状态，电脑屏幕前只有这么一段话。\n\
    \n```\n[root@linux0.11]\n```\n\n然后，我们按下按键 'c'，将会变成这样。\n\n```\n[root@linux0.11]\
    \ c\n```\n\n我们再按下 'a'。\n\n```\n[root@linux0.11] ca\n```\n\n接下来，我们再依次按下 't'、空格、'i'\
    \ 等等等，才变成了这样。\n\n```\n[root@linux0.11] cat info.txt | wc -l\n```\n\n我们今天就要解释这个看起来十分\"\
    正常\"的过程。\n\n凭什么我们按下键盘后，屏幕上就会出现如此的变化呢？老天爷规定的么？\n\n我们就从按下键盘上的 'c' 键开始说起。\n\n首先，得益于\
    \ [第 16 回 | 控制台初始化 tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect)\
    \ 中讲述的一行代码。\n\n```\nconsole.c\nvoid con_init(void) {\n    set_trap(0x21,&keyboard_interrupt);\n\
    }\n```\n\n我们成功将键盘中断绑定在了 `keyboard_interrupt` 这个中断函数上，也就是说当我们按下 'c' 时，CPU 的中断机制将会触发，最终执行到\
    \ `keyboard_interrupt` 函数中。\n\n我们来到 `keyboard_interrupt` 函数探究竟。\n\n```\nkeyboard.s\n\
    keyboard_interrupt:\n    // 读取扫描码\n    in $0x60,%al\n    // 调用对应按键函数\n    call\
    \ *key_table,%eax\n    // 0 作为参数，调用 do_tty\n    push $0\n    call do_tty\n```\n\
    \n很简单，首先通过 IO 端口从键盘中读取了刚刚产生的扫描码，就是按下 'c' 的时候产生的扫描码。随后，在 `key_table` 中寻找不同按键对应的处理函数，比如普通的一个字母\
    \ 'c' 的处理函数为 `do_self`，该函数会将扫描码转换为 ASCII 字符，并将自己放入一个队列里，我们稍后再说部分的细节。\n\n接下来，就是调用\
    \ `do_tty_interrupt` 函数，就是处理终端的中断处理，注意这里传递了一个参数 0。\n\n```\ntty_io.c\nvoid do_tty_interrupt(int\
    \ tty) {\n    copy_to_cooked(tty_table+tty);\n}\nvoid copy_to_cooked(struct tty_struct\
    \ *tty) {\n    ...\n}\n```\n\n这个函数几乎什么都没做，将 `keyboard_interrupt` 时传入的参数 0 作为 `tty_table`\
    \ 的索引，找到 `tty_table` 中的第 0 项作为下一个函数的入参，仅此。\n\n`tty_table` 是终端设备表，在 Linux 0.11\
    \ 中定义了三项，分别是控制台、串行终端 1 和串行终端 2。\n\n```\ntty.h\nstruct tty_struct tty_table[] =\
    \ {\n    {\n        ...},\n        0,          /* initial pgrp */\n        0,\
    \          /* initial stopped */\n        con_write,\n        {0,0,0,\"\"},  \
    \     /* console read-queue */\n        {0,0,0,\"\"},       /* console write-queue\
    \ */\n        {0,0,0,\"\"}        /* console secondary queue */\n    },\n    {...},\n\
    \    {...}\n};\n```\n\n我们用的往屏幕输出内容的终端，就是 0 号索引处的控制台终端，所以我将另外两个终端定义的代码省略掉了。\n\n\
    `tty_table` 终端设备表中的每一项结构是 `tty_struct`，用来描述一个终端的属性。\n\n```\nstruct tty_struct\
    \ {\n    struct termios termios;\n    int pgrp;\n    int stopped;\n    void (*write)(struct\
    \ tty_struct * tty);\n    struct tty_queue read_q;\n    struct tty_queue write_q;\n\
    \    struct tty_queue secondary;\n};\n\nstruct tty_queue {\n    unsigned long\
    \ data;\n    unsigned long head;\n    unsigned long tail;\n    struct task_struct\
    \ * proc_list;\n    char buf[TTY_BUF_SIZE];\n};\n```\n\n说说其中关键几个：`termios` 定义了终端的各种模式，包括读模式、写模式、控制模式等；`void\
    \ (*write)(struct tty_struct * tty)` 是一个函数指针，用于实现不同终端的写入操作；`tty_queue` 则是用于缓冲输入输出的队列。\n\
    \n"
- fmt: "\n按下键盘后，一系列代码将我们的字符放入了 `secondary` 队列中，然后呢？\n\n这就涉及到上层进程调用终端的读函数，将这个字符取走了。\n\
    \n上层经过库函数、文件系统函数等，最终会调用到 `tty_read` 函数，将字符从 `secondary` 队列里取走。\n\n```\n// tty_io.c\n\
    int tty_read(unsigned channel, char * buf, int nr) {\n    ...\n    GETCH(tty->secondary,c);\n\
    \    ...\n}\n```\n\n取走后要干嘛，那就是上层应用程序去决定的事情了。\n\n假如要写到控制台终端，那上层应用程序又会经过库函数、文件系统函数等层层调用，最终调用到\
    \ `tty_write` 函数。\n\n```\n// tty_io.\nint tty_write(unsigned channel, char * buf,\
    \ int nr) {\n    ...\n    PUTCH(c,tty->write_q);\n    ...\n    tty->write(tty);\n\
    \    ...\n}\n```\n\n这个函数首先会将字符 `c` 放入 `write_q` 这个队列，然后调用 `tty` 里设定的 `write` 函数。\n\
    \n终端控制台这个 `tty` 我们之前说了，初始化的 `write` 函数是 `con_write`，也就是 `console` 的写函数。\n\n```\n\
    // console.c\nvoid con_write(struct tty_struct * tty) {\n      ...\n}\n```\n\n\
    这个函数在[第16回 | 控制台初始化 tty_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500190&idx=1&sn=b0bebe846b55f7e29fc009e1b6587214&chksm=c2c5bb33f5b23225845ab699d1b8fcee39a04ca98a48ebf0e2c22584b638fa0b0839d1212485&scene=21#wechat_redirect)\
    \ 提到了，最终会配合显卡，在我们的屏幕上输出我们给出的字符。\n\n![](media/file298.webp \"fig:\")\n\n那我们的图又可以补充了。\n\
    \n![](media/file299.webp \"fig:\")\n\n核心点就是三个队列 `read_q`、`secondary` 以及 `write_q`。\n\
    \n其中 `read_q` 是键盘按下按键后，进入 `keyboard_interrupt` 程序里最终通过 `putch` 函数放入 `read_q` 队列。`secondary`\
    \ 是 `read_q` 队列里的字符，通过 `copy_to_cooked` 函数经过一定的 `termios` 规范处理后，处理后的字符就是“熟”（所以叫\
    \ `cooked`，是不是形象？）。然后进程通过 `tty_read` 从 `secondary` 里读，通过 `tty_write` 写入 `write_q`，最终\
    \ `write_q` 中的字符可以通过 `con_write` 控制台函数打印在显示器上。\n\n这就完成了从键盘输入到显示器的一个循环，也就是本讲述的内容。好了，现在我们已经做到把这样一个字符串并显示在显示器上了。\n\
    \n```\n[root@linux0.1] cat info.txt | wc -l\n```\n\n接下来，`shell` 程序是如何读入这个字符串，读入后又是怎么处理的？欲知后事分解。\n\
    \n## 第43回 | shell 程序读取你的命令\n\n原文链接: http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502944&idx=1&sn=cf2601b3a4bc3f89d7a517bf7fd588&chksm=c25b6cdf23fdb306af52e993bb64df01bffa3c3e6fa556b7ddd77a42fc5eb\n\
    \n新建一个非常简单的 `info.txt` 文件。\n\n```\nname:flash\nage:28\nlanguage:java\n```\n\n\
    在命令行输入一条简单的命令。\n\n```\n[root@linux0.1] cat info.txt | wc -l\n3\n```\n\n这条命令的意思是读取刚刚的\
    \ `info.txt` 文件，输出它的行数。[在上一回](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502876&idx=1&sn=2c3449abd6ea14c9c7ccc3d2d9827c1&chksm=c5b6b1f5b23fa7df9c3e2bf81b84da937d0a2c9825ceba8a57c23e8e157)，我们详细解读了从键盘敲击这个命令，到屏幕上显示这个命令，中间发生的事情。\n\
    \n![](media/file300.webp \"fig:\")\n\n那今天，我们接着往下走，下一步就是 `shell` 程序如何读取你输入的这条命令。这里我们需要知道两件事情：\n\
    \n1. 我们键盘输入的字符，此时已经到达了控制终端 `tty` 结构中的 `secondary` 队列里。\n2. `shell` 程序将通过上层的 `read`\
    \ 函数调用，来读取这些字符。\n\n```\n// xv6-public sh.c\nint main(void) {\n    static char\
    \ buf[100];\n    // 读取命令\n    while(getcmd(buf, sizeof(buf)) >= 0){\n        //\
    \ 创建新进程\n        if(fork() == 0)\n            // 执行命令\n            runcmd(parsecmd(buf));\n\
    \        // 等待进程退出\n        wait();\n    }\n}\n\nint getcmd(char *buf, int nbuf)\
    \ {\n    ...\n    gets(buf, nbuf);\n    ...\n}\n\nchar* gets(char *buf, int max)\
    \ {\n    int i, cc;\n    char c;\n    for(i=0; i+1 < max; ){\n      cc = read(0,\
    \ &c, 1);\n      if(cc < 1)\n            break;\n      buf[i++] = c;\n      if(c\
    \ == '\\n' || c == '\\r')\n            break;\n    }\n    buf[i] = '\\0';\n  \
    \  return buf;\n}\n```\n\n看，`shell` 程序通过 `getcmd` 函数最终调用 `read` 函数一个字符一个字符读，直到读到了换行符（`\\\
    n` 或 `\\r`）才返回。读入的字符在 `buf` 里遇到换行符后，这些字符作为一个完整的命令，传入 `runcmd` 函数执行这个命令。那我们接下来的任务就是，看一下\
    \ `read` 函数是怎么把键盘输入并转移到 `secondary` 队列里的字符读出来的。`read` 函数是个用户态库函数，最终通过系统调用执行 `sys_read`\
    \ 函数。\n\n```\n// read_write.c\n// fd = 0, count = 1\nint sys_read(unsigned int\
    \ fd,char * buf,int count) {\n    struct file * file = current->filp[fd];\n  \
    \  // 校验 buf 区域的内存\n    verify_area(buf,count);\n    struct m_inode * inode =\
    \ file->f_inode;\n    // 管道文件\n    if (inode->i_pipe)\n        return (file->f_mode&1)?read_pipe(inode,count):-EIO;\n\
    \    // 字符设备文件\n    if (S_ISCHR(inode->i_mode))\n        return rw_char(inode->i_zone[0],buf,&file->f_pos);\n\
    \    // 块设备文件\n    if (S_ISBLK(inode->i_mode))\n        return block_read(inode->i_zone[0],&file->f_pos,count);\n\
    \    // 目录文件或普通文件\n    if (S_ISDIR(inode->i_mode) || S_ISREG(inode->i_mode)) {\n\
    \        if (count+file->f_pos > inode->i_size)\n            count = inode->i_size\
    \ - file->f_pos;\n        if (count<=0)\n            return 0;\n        return\
    \ file_read(inode,file,buf,count);\n    }\n    // 不是以上几种，就报错\n    printk(\"(Read)inode->i_mode=%0o\\\
    n\",inode->i_mode);\n    return -EINVAL;\n}\n```\n\n关键地方我已经标上了注释，整体结构不看细节的话特别清晰。这个最上层的\
    \ `sys_read`，把读取管道文件、字符设备文件、块设备文件、目录文件或普通文件，都放在了同一个方法里处理，这个方法作为所有读操作的统一入口，由此也可以看出\
    \ linux 下皆文件的思想。`read` 的第一个参数是 0，也就是 0 号文件描述符，之前我们在讲第四部分的时候说过，`shell` 进程是由进程 1\
    \ 通过 `fork` 创建出来的，而进程 1 在 `init` 的时候打开了 `/dev/tty0` 作为 0 号文件描述符。\n\n```\n// main.c\n\
    void init(void) {\n    setup((void *) &drive_info);\n    (void) open(\"/dev/tty0\"\
    ,O_RDWR,0);\n    (void) dup(0);\n    (void) dup(0);\n}\n```\n\n而这个 `/dev/tty0`\
    \ 的文件类型，其 `inode` 结构中 `i_mode` 字段表示字符设备，所以最终会走到 `rw_char` 方法，文件系统的第一层就完了。\n"
