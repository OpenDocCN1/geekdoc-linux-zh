    \ 第 14 回 中断初始化 trap_init\n\n> 原文链接: [`mp.weixin.qq.com/s/sFp_388qRncB-jpJeRzCGQ`](https://mp.weixin.qq.com/s/sFp_388qRncB-jpJeRzCGQ)\n\
    \n当你的计算机刚刚启动时，你按下键盘是不生效的，但是过了一段时间后，再按下键盘就有效果了。\n\n![](img/file96.gif \"fig:\"\
    )\n\n那我们今天就来刨根问底一下，**到底过了多久之后，按下键盘才有效果呢？**\n\n当然首先你得知道，按下键盘后会触发中断，CPU 收到你的键盘中断后，根据中断号，寻找由操作系统写好的键盘中断处理程序。\n\
    \n中断的原理和过程不了解的，可以看我的文章，[认认真真的聊聊中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247498208&idx=1&sn=b784f8b4e627ebd1bfb9810d194fdb80&chksm=c2c5834df5b20a5bdee331002bfc61c90eb468da325bf67abeef780c303a9f51c8543e1a5981&scene=21#wechat_redirect)\n\
    \n这个中断处理程序会把你的键盘码放入一个队列中，由相应的用户程序或内核程序读取，并显示在控制台，或者其他用途，这就代表你的键盘生效了。\n\n不过放宽心，我们不展开讲这个中断处理程序以及用户程序读取键盘码后的处理细节，我们把关注点放在，究竟是**“什么时候”**，按下键盘才会有这个效果。\n\
    \n我们以 `Linux 0.11` 源码为例，发现进入内核 `main` 函数后，有这样一行。\n\n```c\nvoid main(void) {\n\
    \    ...\n    trap_init();\n    ...\n}\n```\n\n看到这个方法的全部代码后，你可能会一笑，也一脸懵逼。\n\n\
    ```c\nvoid trap_init() {\n    int i;\n    set_trap_gate(0,&divide_error);\n  \
    \  set_trap_gate(1,&debug);\n    set_trap_gate(2,&mi);\n    set_system_gate(3,&int3);\
    \   /* int3 can be called from all */\n    set_system_gate(4,&overflow);\n   \
    \ set_system_gate(5,&bounds);\n    set_trap_gate(6,&invalid_op);\n    set_trap_gate(7,&device_not_available);\n\
    \    set_trap_gate(8,&double_fault);\n    set_trap_gate(9,&coprocessor_run);\n\
    \    set_trap_gate(10,&TSS);\n    set_trap_gate(11,&segment_not_present);\n  \
    \  set_trap_gate(12,&segment);\n    set_trap_gate(13,&general_protection);\n \
    \   set_trap_gate(14,&page_fault);\n    set_trap_gate(15,&reserved);\n    set_trap_gate(16,&coprocessor_error);\n\
    \    for (i=17;i<48;i++)\n        set_trap_gate(i,&reserved);\n    set_trap_gate(45,&irq3);\n\
    \    set_trap_gate(39,&parallel_interrupt);\n}\n```\n\n这啥玩意？这么多 `set_xxx_gate`。\n\
    \n如果有密集恐惧症，绝对看不下去这段代码，所以我给他简化一下。去掉相同功能的。\n\n```c\nvoid trap_init() {\n    int\
    \ i;\n    // set 了一堆 trap_gate\n    set_trap_gate(0,&divide_error);\n    ...\n\
    \    // set 了一堆 system_gate\n    set_system_gate(45,&bounds);\n    ...\n    //\
    \ 批量 set 了一堆 trap_gate\n    for (i=17;i<48;i++)\n        set_trap_gate(i,&reserved);\n\
    \    ...\n}\n```\n\n这就简单多了，一块看。首先看 `set_trap_gate` 和 `set_system_gate` 这俩货，发现了几个宏定义。\n\
    \n```c\n#define _set_gate(gate,type,pl,addr) \\\n    __asm__ ( \\\n        \"\
    movw %dx,%%ax\\n\\t\" \\\n        \"movw %0,%%dx\\n\\t\" \\\n        \"movl %1,%%ax\\\
    n\\t\" \\\n        \"movl %2,%%x\\n\\t\" \\\n        \"orl (type<<8),%%ax\\n\\\
    t\" \\\n        \"orl (pl<<12),%%ax\\n\\t\" \\\n        \"movl %%ax,(gate)+(addr)\\\
    n\\t\" \\\n        : \\\n        : \"a\" (addr), \"0\" (gate), \"1\" (type), \"\
    2\" (pl) \\\n    )\n\n#define set_trap_gate(n,handler) _set_gate(idt,handler,0,n)\n\
    #define set_system_gate(n,handler) _set_gate(idt,handler,3,n)\n```\n\n别怕，我也看不懂。不过这俩最终指向相同的宏定义\
    \ `_set_gate`，说明是有共性的。我直接说吧，那段完全看不懂的代码是将汇编嵌入到 c 语言了，这种内联汇编格式非常恶心，所以我也不想懂，最终的效果是在中断表中插入了一个。中断表还记得\
    \ `idt`。\n\n![](img/file97.webp \"fig:\")\n\n这段代码就是往 `idt` 表里一项写东西，其中中断号就是第一个参数，中断程序就是第二个参数。产生的效果就是，之后如果来中断，CPU\
    \ 根据中断号，就可以到中找到中断程序了。比如：\n\n```c\nset_trap_gate(0,&divide_error);\n```\n\n设置 0\
    \ 号中断，对应的中断程序是 `divide_error`。等 CPU 执行了一条指令的时候，会硬件层面发起 号异常，然后执行操作系统定义的 `divide_error`，执行完之后返回。再比如：\n\
    \n```c\nset_system_gate(5,&overflow);\n```\n\n设置 5 号中断，对应的中断程序是 `overflow`。`trap`\
    \ 与 `system` 的区别在于，设置的中权级不同，前者是 0（内核态），后者是 3（用户态），这块展开是非常严谨的、复杂的特权知识，不明白的话不用管，就理解为都是设置一个中断号和中断程序的对应。再往后看，批量操作。\n\
    \n```c\nvoid trap_init() {\n    ...\n    for (i=17;i<48;i++)\n        set_trap_gate(i,&reserved);\n\
    \    ...\n}\n```\n\n17 到 48 号中断都批量设置为 `reserved` 函数，这是暂时的，后面各个初始化要重新设置好中断，把暂时的覆盖掉，此时留个印象。所以整段代码执行下来，内存中\
    \ `idt` 的位置会变成如下。\n\n![](img/file98.webp \"fig:\")\n\n好了，我们看到了中断号与中断程序对应的地方，那代码过去后，键盘好使么？NO。产生产生号是\
    \ `0x21`，此时还对应着一个临中断程序 `reserved`，我们接着往后看。在这代码后几行，还有一行代码。\n\n```c\nvoid main(void)\
    \ {\n    ...\n    trap_init();\n    ...\n    tty_init();\n    ...\n    sti();\n\
    \    ...\n}\n```\n\n`sti` 最终会对应一个同名的汇编指令 `sti`。\n\n```c\nvoid tty_init() {\n \
    \   rs_init();\n    con_init();\n}\n\nvoid con_init(void) {\n    ...\n    set_trap_gate(0x21,&keyboard_interrupt);\n\
    \    ...\n}\n```\n\n我省略了大量的代码，只保留了我们关心的。注意到 `trap_init` 后有个 `tty_init`，最后根据调用链，会调用到一行添加\
    \ 0x21 号中断处理程序的代码，就是刚刚熟悉的 `set_trap_gate`。而后面的 `keyboard_interrupt` 根据名字也可以猜出，就是键盘的中断处理程序嘛！好了，我们终于找到答案，就是从这一行代码开始，我们的键盘生效了！没错，还有点小问题，不过重要，就是我们现在的中断处于禁用状态，不论键盘中断还是其他中断，通通都不好使。而\
    \ `main` 方法继续往下读，还有一行这个东西。\n\n```c\nvoid main(void) {\n    ...\n    trap_init();\n\
    \    ...\n    tty_init();\n    ...\n    sti();\n    ...\n}\n```\n\n"
- fmt: "\n把读出来的数据放到内存，就涉及到内存中缓冲区的管理。\n\n上面说的每一件事，都是一个十分庞大的体系，我们今天的文章一个都不展开讲，哈哈。\n\n\
    我们就讲讲，读取块设备与内存缓冲区之间的桥梁，**块设备请求项**的初始化工作。\n\n我们以 Linux 0.11 源码为例，发现进入内核的 `main`\
    \ 函数后不久，有这样一行代码。\n\n```\nvoid main(void) {\n    ...\n    blk_dev_init();\n   \
    \ ...\n}\n```\n\n看到这个方法的全部代码后，你可能会会心一笑，也可能一脸懵逼。\n\n```\nvoid blk_dev_init(void)\
    \ {\n    int i;\n    for (i=0; i<32; i++) {\n        request[i].dev = -1;\n  \
    \      request[i].next = NULL;\n    }\n}\n```\n\n这也太简单了吧？\n\n就是给 `request` 这个数组的前\
    \ 32 个元素的两个变量 `dev` 和 `next` 附上值，看这俩值 `-1` 和 `NULL` 也可以大概猜出，这是没有任何作用时的初始化值。\n\n\
    我们看下 `request` 结构体。\n\n```\n/*\n * Ok, this is an expanded form so that we can\
    \ use the same\n * request for paging requests when that is implemented. In\n\
    \ * paging, 'bh' is NULL, and 'waiting' is used to wait for\n * read/write completion.\n\
    \ */\nstruct request {\n    int dev;        /* -1 if no request */\n    int cmd;\
    \        /* READ or WRITE */\n    int errors;\n    unsigned long sector;\n   \
    \ unsigned long nr_sectors;\n    char * buffer;\n    struct task_struct * waiting;\n\
    \    struct buffer_head * bh;\n    struct request * next;\n};\n```\n\n注释也附上了。\n\
    \n哎哟，这就有点头大了，刚刚的函数虽然很短，但看到这个结构体我们知道了，重点在这呢。这也侧面说明了，学习操作系统，其实把遇到的重要数据结构牢记心中，就已经成功一半了。比如主内存管理结构\
    \ `mem_map`，知道它的数据结构是什么样子，其功能也基本就懂了。\n\n收，继续说这个 `request` 结构，这个结构就代表了一次读盘请求，其中：\n\
    \n- `dev` 表示设备号，-1 就表示空闲。\n- `cmd` 表示命令，其实就是 READ 还是 WRITE，也就表示本次操作是读还是写。\n- `errors`\
    \ 表示操作时产生的错误次数。\n- `sector` 表示起始扇区。\n- `nr_sectors` 表示扇区数。\n- `buffer` 表示数据缓冲区，也就是读盘之后的数据放在内存中的什么位置。\n\
    - `waiting` 是个 `task_struct` 结构，这可以表示一个进程，也就表示是哪个进程发起了这个请求。\n- `bh` 是缓冲区头指针，这个后面讲完缓冲区就懂了，因为这个\
