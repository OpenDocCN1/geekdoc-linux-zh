    \n![](media/file59.webp \"fig:\")\n\n这是在没有开启分页机制的时候，但是在开启了分页后，又要多一步转换。\n\n![](media/file60.webp\
    \ \"fig:\")\n\n也就是说，在没有开启分页机制时，程序员给出的逻辑地址需要通过分段机制转换成物理地址。但在开启分页机制后，逻辑地址仍然要通过分段机制转换，只不过转换后不再物理地址，而是线性地址，然后再通过分页机制，得到最终物理地址。\n\
