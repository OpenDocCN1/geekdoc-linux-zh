    \ mov 指令就分别给 ds、es 和 ss 寄存器赋值为了 0x9000。\n\nds 为数据段寄存器，之前我们说过了，当时它被复制为 **0x07c0**，是因为之前的代码在\
    \ 0x7c00 处，现在代码已经被挪到了 0x90000 处，所以现在自然又改赋值为 **0x9000** 了。\n\nes 是扩展段寄存器，仅仅是个扩展，不是主角，先不用理它。\n\
