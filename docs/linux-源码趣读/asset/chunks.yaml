    \        ...\n[](#cb347-9)        exec(ecmd->argv[0], ecmd->argv);\n[](#cb347-10)\
    \        ... \n[](#cb347-11)        break;\n[](#cb347-12) \n[](#cb347-13)    \
    \    case REDIR: ...\n[](#cb347-14)        case LIST: ...\n[](#cb347-15)     \
    \   case PIPE: ...\n[](#cb347-16)        case BACK: ...\n[](#cb347-17)    }\n\
    [](#cb347-18)}\n```\n\n如果展开每个 switch 分支你会发现，不论是更换当前目录的 **REDIR** 也就是 cd 命令，还是用分号分隔开的\
    \ **LIST** 命令，还是我们上面讲到的 **PIPE** 命令，最终都会被拆解成一个个可以被解析为 **EXEC** 类型的命令。\n\nEXEC\
    \ 类型会执行到 **exec** 这个方法，在 Linux 0.11 中，最终会通过系统调用执行到 **sys_execve** 方法。\n\n这个方法就是最终加载并执行具体程序的过程，在\
    \ [第35回 | execve 加载并执行 shell 程序](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502475&idx=1&sn=4fcdbaa03bf6a1ca04db4013309c6aa3&chksm=c2c5b026f5b2393049efca68c429df5038fa0f317eea79fbd9ec2c661c3ec12b47a0701376a7&scene=21#wechat_redirect)\
    \ 和 [第36回 | 缺页中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a&scene=21#wechat_redirect)，我们已经讲过如何通过\
    \ execve 加载并执行 shell 程序了，并且在加载 shell 程序时，并不会立即将磁盘中的数据加载到内存，而是会在真正执行 shell 程序时，引发缺页中断，从而按需将磁盘中的数据加载到内存。\n\
    \n这个流程在本回我们就不再赘述了，不过当初在讲这块流程以及其它需要将数据从硬盘加载到内存的逻辑时，总是跳过这一步的细节。\n\n那么我们下一回，就彻底把这个硬盘到内存的流程拆开了讲解！\n\
    \n欲知后事如何，且听下回分解。\n\n* * *\n\n## 第46回 | 读硬盘数据全流程\n\n> 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247503204&idx=1&sn=e00ee5e3584a7ecfaaec47ccf63c0555&chksm=c2c5b7c9f5b23edfd17396399772549674b5233add6062c4d236d4727650b3bd97742a202967&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247503204&idx=1&sn=e00ee5e3584a7ecfaaec47ccf63c0555&chksm=c2c5b7c9f5b23edfd17396399772549674b5233add6062c4d236d4727650b3bd97742a202967&scene=21#wechat_redirect)\n\
    \n新建一个非常简单的 info.txt 文件。\n\n```\nname:flash\nage:28\nlanguage:java\n```\n\n在命令行输入一条十分简单的命令。\n\
    \n```\n[root@linux0.11] cat info.txt | wc -l\n3\n```\n\n这条命令的意思是读取刚刚的 info.txt\
    \ 文件，输出它的行数。\n\n上一回中，我们解释了 shell 程序是如何解释并执行我们输入的命令的，并展开讲解了管道类型命令的原理。\n\n![](media/file315.webp\
    \ \"fig:\")\n\n同时也说了，在 [第35回 | execve 加载并执行 shell 程序](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502475&idx=1&sn=4fcdbaa03bf6a1ca04db4013309c6aa3&chksm=c2c5b026f5b2393049efca68c429df5038fa0f317eea79fbd9ec2c661c3ec12b47a0701376a7&scene=21#wechat_redirect)\
    \ 和 [第36回 | 缺页中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502511&idx=1&sn=eacddbb11dd2402c561a611f708ee045&chksm=c2c5b002f5b23914ccd645d94bdc59e0322776f71f41e6744fddeca2bfa027d12a25ec6bfc8a&scene=21#wechat_redirect)，我们已经讲过如何通过\
    \ execve 加载并执行 shell 程序，但略过了将数据从硬盘加载到内存的逻辑细节。\n\n那我们这一讲就把它扒开来看看。\n\n将硬盘中的数据读入内存，听起来是个很简单的事情，但操作系统要考虑的问题很多。\n\
    \n### 如果让你来设计这个函数\n\n我们先别急，一点点来，想想看，如果让你设计这个函数，你会怎么设计呢？\n\n首先我们知道，通过 [第32回 | 加载根文件系统](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502181&idx=1&sn=b6dcbd1d2cf930002852008a1c4e6a65&chksm=c2c5b3c8f5b23ade1532b725995dbc3b0138202555e44a6e308b84d668a2ef3041eb5cf77f86&scene=21#wechat_redirect)\
    \ 中文件系统的建设。\n\n![](media/file316.webp \"fig:\")\n\n以及 [第33回 | 打开终端设备文件](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502230&idx=1&sn=44e023bf0b9b37261e35a6e3722bc57f&chksm=c2c5b33bf5b23a2d10a9dd36606c497f41a1c3dced57845ce7ef12741a348fab82beba462a8a&scene=21#wechat_redirect)\
    \ 讲解的打开一个文件的操作。\n\n![](media/file317.webp \"fig:\")\n\n我们已经可以很方便地通过一个**文件描述符 fd**，寻找到存储在硬盘中的一个文件了，再具体点就是知道这个文件在硬盘中的哪几个扇区中。\n\
    \n所以，设计这个函数第一个要指定的参数就可以是 fd 了，它仅仅是个数字。当然，之所以能这样方便，就要感谢刚刚说的**文件系统建设**以及**打开文件的逻辑**这两项工作。\n\
    \n之后，我们得告诉这个函数，把这个 fd 指向的硬盘中的文件，复制到内存中的**哪个位置**，**复制多大**。\n\n那更简单了，内存中的位置，我们用一个表示地址值的参数\
    \ **buf**，复制多大，我们用 **count** 来表示，单位是字节。\n\n那这个函数就可以设计为。\n\n```\n[](#cb350-1)int\
    \ sys_read(unsigned int fd,char * buf,int count) {\n[](#cb350-2)    ...\n[](#cb350-3)}\n\
    ```\n\n是不是合情合理，无法反驳。\n\n### 鸟瞰操作系统的读操作函数\n\n实际上，你刚刚设计出来的读操作函数，这正是 Linux 0.11 读操作的系统调用入口函数，在\
    \ read_write.c 这个文件里。\n\n```\n[](#cb351-1)// read_write.c\n[](#cb351-2)int sys_read(unsigned\
    \ int fd,char * buf,int count) {\n[](#cb351-3)    struct file * file;\n[](#cb351-4)\
    \    struct m_inode * inode;\n[](#cb351-5)\n[](#cb351-6)    if (fd>=NR_OPEN ||\
    \ count<0 || !(file=current->filp[fd]))\n[](#cb351-7)        return -EINVAL;\n\
    [](#cb351-8)    if (!count)\n[](#cb351-9)        return 0;\n[](#cb351-10)    verify_area(buf,count);\n\
    [](#cb351-11)    inode = file->f_inode;\n[](#cb351-12)    if (inode->i_pipe)\n\
    [](#cb351-13)        return (file->f_mode&1)?read_pipe(inode,buf,count):-EIO;\n\
    [](#cb351-14)    if (S_ISCHR(inode->i_mode))\n[](#cb351-15)        return rw_char(READ,inode->i_zone[0],buf,count,&file->f_pos);\n\
    [](#cb351-16)    if (S_ISBLK(inode->i_mode))\n[](#cb351-17)        return block_read(inode->i_zone[0],&file->f_pos,buf,count);\n\
    [](#cb351-18)    if (S_ISDIR(inode->i_mode) || S_ISREG(inode->i_mode)) {\n[](#cb351-19)\
    \        if (count+file->f_pos > inode->i_size)\n[](#cb351-20)            count\
    \ = inode->i_size - file->f_pos;\n[](#cb351-21)        if (count<=0)\n[](#cb351-22)\
    \            return 0;\n[](#cb351-23)        return file_read(inode,file,buf,count);\n\
    [](#cb351-24)    }\n[](#cb351-25)    printk(\"(Read)inode->i_mode=%06o\\n\\r\"\
    ,inode->i_mode);\n[](#cb351-26)    return -EINVAL;\n[](#cb351-27)}\n```\n\n那我们就分析这个函数就好了。\n\
    \n不过首先我先简化一下，去掉一些错误校验逻辑等旁路分支，并添加上注释。"
