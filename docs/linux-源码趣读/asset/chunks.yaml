- fmt: "\n> 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502581&idx=1&sn=df3f2c19ce511ac24145091892f47837&chksm=c2c5b058f5b2394ee095d679071b43c23853dc86d5cfd4cc961568643110ab734f635b899984&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502581&idx=1&sn=df3f2c19ce511ac24145091892f47837&chksm=c2c5b058f5b2394ee095d679071b43c23853dc86d5cfd4cc961568643110ab734f635b899984&scene=21#wechat_redirect)\n\
    \n书接上回，上回书咱们说到，Linux 通过缺页中断处理过程，将 `/bin/sh` 的代码从硬盘加载到了内存，此时便可以正式执行 shell 程序了。\n\
    \n这个 `shell` 程序，也就是 Linux 0.11 中要执行的这个 `/bin/sh` 程序，它的源码并没有体现在 Linux 0.11 源码中。\n\
    \n也可以说，不论这个 `/bin/sh` 是个啥文件，哪怕只是个 hello world 程序，Linux 0.11 的启动过程中也会傻傻地去执行它。\n\
    \n但同时，`shell` 又是一个我们再熟悉不过的东西了。在我的腾讯云服务器上（用 `Termius` 连接），它是这个样子的。\n\n![](media/file266.webp\
    \ \"fig:\")\n\n在我的 Ubuntu 16.04 虚拟机上，它是这个样子的。\n\n![](media/file267.webp \"fig:\"\
    )\n\n在我的 mac 电脑上，它是这个样子的。\n\n![](media/file268.webp \"fig:\")\n\n没错，它就是我们通常说的那个命令行黑窗口。当然，`shell`\
    \ 只是一个标准，具体的实现可以有很多，比如在我的 Ubuntu 16.04 上，具体的 shell 实现是 `bash`。\n\n```bash\necho\
    \ $SHELL\n/bin/bash\n```\n\n而在我的 mac 上，具体的实现是 `zsh`。\n\n```bash\necho $SHELL\n\
    /bin/zsh\n```\n\n当然，默认的 `shell` 实现也可以手动进行设置并更改。还有个有意思的事，`shell` 前面的提示符，是否可以修改呢？我的腾讯云服务器上，提示符是：\n\
    \n```bash\n[root@VM-24-11-centos ~]#\n```\n\n我的 Ubuntu 虚拟机上，提示符是：\n\n```bash\n\
    flash:~$\n```\n\n我的 mac 电脑上更简单，提示符是：\n\n```bash\n~\n```\n\n我现在觉得我那个腾讯云服务器上的提示符太长了怎么办？我们先查看一个变量\
    \ `PS1` 的值：\n\n```bash\n[root@VM-24-11-centos ~]# echo $PS1\n[\\u@\\h \\W]\\$\n\
