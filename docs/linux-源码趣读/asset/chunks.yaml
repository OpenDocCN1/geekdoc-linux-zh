- fmt: "\n这个就是**写时复制**的基础，新老进程一开始共享同一个物理内存空间，如果只有读，那就相安无事，但如果任何一方有写操作，由于页面是只读的，将触发缺页中断，然后就会分配一块新的物理内存给产生写操作的那个进程，此时这一块内存就不再共享了。\n\
    \n这是后话了，这里先埋个伏笔。\n\n------\n\n好了，至此 `fork` 中的 `copy_process` 函数就全部被我们读完了，总共做了三件事，把整个进程的数据结构个性化地从进程\
    \ 0 复制给了进程 1。\n\n### 第一，原封不动复制了一下 `task_struct`。\n\n![](media/file194.webp \"\
    fig:\")\n\n### 第二，`LDT` 的复制和改造，使得进程 0 和进程 1 分别映射到了不同的线性地址空间。\n\n![](media/file195.webp\
    \ \"fig:\")\n\n### 第三，页表的复制，使得进程 0 和进程 1 又从不同的线性地址空间，被映射到了相同的物理地址空间。\n\n![](media/file196.webp\
    \ \"fig:\")\n\n### 最后，将新老进程的页表都变成只读状态，为后面写时复制的缺页中断做准备。\n\n欲知后事如何，且听下回分解。\n\n*\
    \ *\n\n## 第三部分总结与回顾\n\n> 原文链接: [https://mp.weixin.qq.com/s/V_Ryxox3iDCO994FzkSFfA](https://mp.weixin.qq.com/s/V_Ryxox3iDCO994FzkSFfA)\n\
    \n整个第三部分，我们用前四回的内容讲述了**进程调度机制**，又用后三回内容讲述了 `fork` 函数的全部细节。先看进程调度机制。\n\n#### 进程调度机制\n\
    \n前四回内容循序渐进地讲述了进程调度机制的设计思路和细节。\n\n- [第21回 | 新进程诞生全局概述](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501340&idx=1&sn=fc3ca3a7d8a206a6d82ab7199aac64f9&scene=21#wechat_redirect)\n\
    - [第22回 | 从内核态切换到用户态](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501522&idx=1&sn=936f7837421870a572ee2a82d745a519&scene=21#wechat_redirect)\n\
    - [第23回 | 如果让你来设计进程调度](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501576&idx=1&sn=657e1c89d1007a935820d394d64f4035&scene=21#wechat_redirect)\n\
    - [第24回 | 从一次定时器滴答来看进程调度](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501609&idx=1&sn=fe5bd9b9f69045fd70f6d7aeaea273bc&scene=21#wechat_redirect)\n\
    \n进程调度的始作俑者，就是那个每 10ms 触发一次的定时器滴答。\n\n![](media/file173.gif \"fig:\")\n\n而这个滴答将会给\
    \ CPU 产生一个**时钟中断**信号。\n\n而这个中断信号会使 CPU 查找中断向量表，找到操作系统写好的一个时钟中断处理函数 `do_timer`。\n\
    \n`do_timer` 会首先将当前进程的 `counter` 变量 -1，如果 `counter` 此时仍然大于 0，则就此结束。\n\n但如果 `counter\
    \ = 0` 了，就开始进行进程的调度。进程调度就是找到所有处于 **RUNNABLE** 状态的进程，并找到一个 `counter` 值最大的进程，把它丢进\
    \ `switch_to` 函数的入参里。\n\n![](media/file174.gif \"fig:\")\n\n`switch_to` 这个终极函数，会保存当前进程上下文，恢复要跳转到的这个进程的上下文，同时使得\
    \ CPU 跳转到这个进程的偏移地址处。\n\n![](media/file175.webp \"fig:\")\n\n上图来源于《Linux内核完全注释V5.0》\n\
    \n接着，这个进程就舒舒服服地运行了起来，等待着下一次**时钟中断**的来临。聊完进程调度机制，我们再看看 `fork` 函数的原理。\n\n#### fork\n\
    \n后三回内容讲述了 `fork` 函数的全部细节。\n\n- [第25回 | 通过 fork 看一次系统调用](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501700&idx=1&sn=1b0167cf9852f89748a337d9b06c940b&chksm=c2c5bd29f5b2343ff01c68f1cbc654fbb1214800eff8c1bb2e725a6054a7fbddbc25af&scene=21)\n\
    - [第26回 | fork 中进程信息的复制](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501748&idx=1&sn=2ad61881765321501b2c8e734ffefe63420193736d1019ed542cf531b65b274d0ee&scene=21)\n\
    - [第27回 | 透过 fork 来看进程的内存规划](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501866&idx=1&sn=64adec17934594d095aa1bdebacc2c5bd287f5b23b9175d8acf771b2283a576f8e14d8b932e8c9814bcb107696d87a2)\n\
    \n用一张图来表示，就是。![](media/file197.webp \"fig:\")\n\n其中 `copy_process` 是复制进程的关键，总共三步来。\n\
    \n**第一，原封不动复制了一下 `task_struct`。**![](media/file198.webp \"fig:\") 并且覆盖了一些基本信息，包括元信息和寄存器的信息。其中重要的是内核态栈顶指针的指向了自己进程结构所在\
    \ 4K 内存的最端。![](media/file199.webp \"fig:\")\n\n**第二，`LDT` 的复制和改造，使得进程 0 和进程 1\
    \ 分别映射到了不同的线性地址空间。**![](media/file200.webp \"fig:\")\n\n**第三，页表的复制，使得进程 0 和进程\
    \ 1 又从不同的线性地址空间，被映射到了相同的物理地址空间。**![](media/file201.webp \"fig:\")\n\n最后，将新老进程的页表都变成只读状态，为后面写时复制的缺页中断做准备。这一部分的\
    \ `fork` 函数只用于进程 0 创造进程 1，之后的新进程创建，比如进程 1 里 `fork` 创建进程 2，都是这样的套路。![](media/file202.webp\
    \ \"fig:\")\n\n整个核心函数 `copy_process` 的代码如下：\n\n```\nint copy_process(int nr, ...)\
    \ {\n    struct task_struct p =\n        (struct task_struct *) get_free_page();\n\
    \    task[nr] = p;\n    *p = *current;\n    p->state = TASK_UNRUPTIBLE;\n    p->pid\
    \ = last_pid;\n    p->counter = p->priority;\n    ..\n    p->tss.edx = edx;\n\
    \    p->tss.ebx = ebx;\n    p->tss.esp = esp;\n    ...\n    copy_mem(nr,p);\n\
    \    ...\n    set_tss_desc(gdt+(nr<<1)+FIRST_TSS_ENTRY,&(p->tss));\n    set_ldt_desc(gdt+(nr<<1)+FIRST_LDT_ENTRY,&(p->ldt));\n\
    \    p->state = TASK_RUNNING;\n    return last_pid;\n}\n```\n\n注意图中的两个标黄的代码。开始复制进程信息的时候，由于进程\
    \ 1 的结构还没弄好，此时如果进程调度到了进程 1，那就坏事了。所以一开始把进程 1 的状态先设置为 `TASK_UNINTERTIBLE`，使得其不会被进程调度算法选中。而所有复制工作完成后，进程\
    \ 1 就拥有了运行的内容，进程基本信息也有了，进程的内存规划也完成了。此时就把进程设置为 `TASK_RUNNING`，允许被 CPU 调度。看到这行代码，其实我们也可以很自信地认为，**到这里进程\
    \ 1 的初步建立工作已经圆满结束，可以达到运行在 CPU 上的标准了**。\n\n#### 第四部分的展望\n\n那我们此时回到之前的 `main` 方法，是不是忘了最初的目的？哈哈。\n\
    \n```\nvoid main(void) {\n    ...\n    mem_init(memory_start,memory_end);\n  \
    \  trap_init();\n    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n \
    \   time_init();\n    sched_init();\n    buffer_init(memory_end);\n    hd_init();\n\
    \    floppy_init();\n    sti();\n    move_to_user();\n    if (!fork()) {\n   \
    \     init();\n    }\n    for(;;) pause();\n}\n```\n\n看，下一行，是 `init`。`fork` 只是把进程\
    \ 1 搞成可以在 CPU 中运行的进程，之后创建进程，都可以用这个 `fork` 方法。不过进程 1 具体要做什么？那就是 `init` 函数的故事。虽然一行代码，但这里的事情多了，我们先看一下整体。我已经把单纯的日志打印和校验逻辑去掉了。\n\
    \n```\nvoid init(void) {\n    int pid,i;\n    setup((void *) &drive_info);\n \
    \   open(\"/dev/tty0\",O_RDWR,0);\n    dup(0);\n    dup(0);\n    if (!(pid=fork()))\
    \ {\n        open(\"/etc/rc\",O_RDONLY,0);\n        execve(\"/bin/sh\",argv_rc,envp_rc);\n\
    \    }\n    if (pid>0)\n        while (wait(&i))\n            /* nothing */;\n\
    \    while (1) {\n        if (!pid=fork()) {\n            close(0);close(1);close(2);\n\
    \            setsid();\n            open(\"/dev/tty0\",O_RDWR,0);\n          \
    \  dup(0);\n            dup(0);\n            _exit(execve(\"/bin/sh\",argv,envp));\n\
    \        }\n        while (1)\n            if (pid == wait(&i))\n            \
    \    break;\n            sync();\n    }\n    _exit(0);   /* NOTE! _exit, not exit()\
    \ */\n}\n```\n\n是不是看着还复杂？不过还好，我们几乎已经把计算机体系结构，和操作系统的设计思想，通过前面的源码阅读，不知不觉建立起来了。接下来的工作，就是基于这些建立好的能力，站在巨人的肩膀上，做更伟大的事情！说伟大其实也没什么伟大的，就是最终建立好一个人机交互的\
    \ shell 程序，无限等待用户输入的命令。欲知后事如何，且听第四部分的分解！\n\n# 第四部分：shell 程序的到来\n\n* *\n\n## 第28回\
