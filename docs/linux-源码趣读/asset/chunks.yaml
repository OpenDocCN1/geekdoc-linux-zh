- fmt: "\n这个 shell 程序不会退出，它会不断接受我们键盘输入的命令，然后通过 `fork+execve` 函数执行我们的命令，这在上一回讲过了。\n\
    \n当然，如果这个 `shell` 进程也退出了，那么操作系统也不会跳出这个大循环，而是继续重试。\n\n整个操作系统到此为止，看起来就是这个样子。\n\n\
    ```c\n// main.c\nvoid main() {\n    // 初始化环境\n    ...\n    // 外层操作系统大循环\n    while(1)\
    \ {\n        // 内层 shell 程序小循环\n        while(1) {\n            // 读取命令 read\n\
    \            ...\n            // 创建进程 fork\n            ...\n            // 执行命令\
    \ execve\n            ...\n        }\n    }\n}\n```\n\n当然，这只是表层的。\n\n除此之外，这里所有的键盘输入、系统调用、进程调度，统统都需要`中断`来驱动，所以很久之前我说过，`操作系统就是个中断驱动的死循环`，就是这个道理。\n\
    \nOK！到此为止，操作系统终于启动完毕，达到了怠速的状态，它本身设置好了一堆中断处理程序，随时等待着中断的到来进行处理，同时它运行了一个 shell 程序用来接受我们普通用户的命令，以同人类友好的方式进行交互。\n\
    \n完美！\n\n欲知后事如何，且听下回分解。\n\n***\n\n## 第39回 | 番外篇 - Linux 0.11 内核调试\n\nLinux 0.11\
    \ 是 Linux 最早期的代码，非常适合作为第一款深入探索操作系统原理的代码。\n\n但同时，Linux 0.11 因为很多古老工具链的缺失，以及一些过时的文件格式比如\
    \ `a.out`，导致成功编译并运行它十分困难，更别说进行源码级别的 `debug` 调试了。\n\n要想成功调试 Linux 0.11，需要进行很多，并依赖一些古老的工具链，对于仅仅是将\
    \ Linux 0.11 作为研究操作系统的手段的我们，无需花费精力自己去改造它，踩各种坑。\n\n所以今天我就分享一下我调试 Linux 0.11 的一种方式，同时也为了我自己以后换电脑的时候方便照着自己的教程直接无脑搭建环境，那我们开始吧~\n\
    \n### 整体思路和效果\n\n我用的方式是，在 windows 上，搞一个 Ubuntu 16.04 的虚拟机，在里面用 `qemu` 启动一个开启了调试的\
    \ Linux 0.11 系统，然后用本机的 `vscode remote ssh` 连接到虚拟机，并开启 `gdb` 调试，最终的效果如下。\n\n这是最舒服的方式，因为\
    \ `vscode` 是本机的，完全不受虚拟机的影响，这也是我调试其他代码时比较喜欢的方式。\n\n如果你有自己的豪华服务器，虚拟机也可以换成服务器，这样不但编译速度快，不消耗自己电脑的性能，同时也可以不受终端的影响，在家在公司都可以随时调试（方便摸鱼~）。\n\
    \n当然如果你不需要这么直观 `vscode` 这一步也可以换成 `gdb` 命令行，在虚拟机里直接执行 `gdb` 相关命令即可。\n\n### 第一步：配置虚拟机\n\
    \n我用的虚拟机软件是 `Oracle VM VirtualBox Version 6.0.8 Edition`。\n\n官网是：`https://ubuntu.com/`\n\
    \n下载页面是：`https://www.virtualbox.org/wiki/Download_Old_Builds_6_0`\n\n我这个版本的直接下载地址是：`https://download.virtualbox.org/virtualbox/6.0.8/VirtualBox-6.0.8-130520-Win.exe`\n\
    \n安装的操作系统镜像是 `ubuntu-16.04.7-desktop-amd64`。\n\n官网是：`https://ubuntu.com/`\n\n\
    下载页面是：`https://releases.ubuntu.com/xenial/`\n\n我这个版本的直接下载地址是：`https://releases.ubuntu.com/xenial/ubuntu-16.04.7-desktop-amd64.iso`\n\
    \n这个就不详细展开了，最终达到效果就行。\n\n### 第二步：安装 qemu\n\n`qemu` 是模拟器，简单理解和虚拟机一样，用来当做启动 Linux\
    \ 0.11 的。官网是：`https://www.qemu.org/`\n\n我们在刚刚的 Ubuntu 虚拟机里按照教程执行 `sudo apt-get\
    \ install qemu`。\n\n下载后，我们输入 `qemu-`，按 `tab` 查看支持的体系。看到 `qemu-system-x86_64`，我们会用这个来启动\
    \ Linux 0.11。\n\n### 第三步：下载并运行可调试的 Linux 0.11 源码\n\n这一步直接下载是不行的，因为依赖好多古老的工具链。这里参考老师修改好的\
    \ Linux 0.11 源码，用现代的工具链，选择了仓库：`https://github.com/yuan-xy/Linux-0.11` 直接把源码下来，进入根目录，输入命令\
    \ `make start` 把 Linux 0.11 跑起来。\n\n如果想 debug，输入命令 `make debug`，它会卡住。此时你就可以通过\
    \ `gdb` 进行调试了。再开一个窗口，输入命令 `gdb tools/system` 然后 `target remote :1234`。\n\n###\
    \ 第四步：通过 vscode 远程调试\n\n当然，你也可以在虚拟机 里安装 `vscode-remote-ssh` 插件。按下 `ctrl + p`，输入\
    \ `remote-ssh`，找到 `Connect to Host`。按照提示输入你的虚拟机 IP 和用户名，随后输入密码，即可连接到虚拟机。之后点击菜单栏运行-启用调试，在弹出的\
    \ `launch.json` 中做如下配置：\n\n```json\n{\n    \"version\": \"0.2.0\",\n    \"configurations\"\
    : [\n        {\n            \"name\": \"(gdb) Launch\",\n            \"type\"\
    : \"cppdbg\",\n            \"request\": \"launch\",\n            \"program\":\
    \ \"${workspaceFolder}/tools/system\",\n            \"miDebuggerServerAddress\"\
    : \"127.0.0.1:1234\",\n            \"args\": [],\n            \"stopAtEntry\"\
    : false,\n            \"cwd\": \"${workspaceFolder}\",\n            \"environment\"\
    : [],\n            \"MIMode\": \"gdb\"\n        }\n    ]\n}\n```\n\n配置好保存，在 `main`\
    \ 函数里打个断点，再次点击菜单栏运行-启用调试，可以发现调试成功。记得每次 `vscode` 调试前，在虚拟机里先把 Linux 0.11 跑起来，就是执行命令\
    \ `make debug`。\n\n***\n\n## 第40回 | 番外篇 - 为什么你怎么看也看不懂\n\nLinux 0.11 是 Linux 最早期的代码，非常适合作为第一款深入探索操作系统原理的代码。\n\
