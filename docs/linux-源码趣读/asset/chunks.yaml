  trans: "\n\n![](img/file73.webp \"fig:\")\n\n# 第 10 回 进入 main 函数前的最后一跃！\n\n> 原文链接:\
    \ [`mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg`](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    \n书接上回，上回书咱们说到，我们终于把这些杂七杂杂的 `idt`、`gdt`、页表都设置好了，并且也开启了保护模式，相当于所有苦力活都做好铺垫了，之后我们就要准备进入\
    \ `main.c`！那里是个新世界！\n\n注意不是进入，而是准备进入哦，就差一哆嗦了。\n\n由于上一讲的知识量非常大，所以这一讲将会非常简单，作为进入\
    \ `main` 函数前的衔接，大家放宽心。\n\n这仍然要回到上一讲我们跳转到设置分页代码的那个地方（`head.s` 里），这里有个骚操作帮我们跳转到\
    \ `main.c`。\n\n```\nafter_page_tables:\n    push 0\n    push 0\n    push 0\n \
    \   push L6\n    push _main\n    jmp setup_paging\nsetup_paging:\n    ...\n  \
    \  ret\n```\n\n直接解释起来非常简单。\n\n`push` 指令就是**压栈**，五个 `push` 指令过去后，栈会变成这个样子。\n\n\
    ![](img/file74.webp \"fig:\")\n\n然后注意，`setup_paging` 最后一个指令是 `ret`，也就是我们上一回讲的设置分页的代码的最后一个指令，形象地说它叫**返回指令**，但\
    \ CPU 可没有那么聪明，它并不知道该返回到哪里执行，只是很机械地**把栈顶的元素值当做返回地址**，跳转去那里执行。\n\n再具体说是，把 `esp`\
    \ 寄存器（栈顶地址）所指向的内存处的值，赋值给 `eip` 寄存器，而 `cs:eip` 就是 CPU 要执行的下一条指令的地址。而此时栈顶刚好是 `main.c`\
    \ 里写的 `main` 函数的内存地址，是我们刚刚特意压入栈的，所以 CPU 就理所应当跳过来了。\n\n当然 Intel CPU 是设计了 `call`\
    \ 和 `ret` 这一配对儿的指令，意为调用函数和返回，具体可以看后面本回扩展资料里的内容。\n\n至于其他压入栈的 `L6` 是用作当 `main` 函数返回时的跳转地址，但由于在操作系统层面的设计上，`main`\
    \ 是绝对不会返回的，所以也就没用了。而其他的三个压栈的 `0`，本意是作为 `main` 函数的参数，但实际上似乎也没有用到，所以也不必关心。\n\n总之，经过这一个小小的骚操作，程序终于跳转到\
    \ `main.c` 这个由 C 语言写就的主函数 `main` 里了！我们先一睹为快一下。\n\n```c\nvoid main(void) {\n  \
    \  ROOT_DEV = ORIG_ROOT_DEV;\n    drive_info = DRIVE_INFO;\n    memory_end = (1<<20)\
    \ + (EXT_MEM_K<<10);\n    memory_end &= 0xfffff000;\n    if (memory_end > 16*1024*1024)\n\
    \        memory_end = 16*1024*1024;\n    if (memory_end > 12*1024*1024) \n   \
    \     buffer_memory_end = 4*1024*1024;\n    else if (memory_end > 6*1024*1024)\n\
    \        buffer_memory_end = 2*1024*1024;\n    else\n        buffer_memory_end\
    \ = 1*1024*1024;\n    main_memory_start = buffer_memory_end;\n    mem_init(main_memory_start,memory_end);\n\
    \    trap_init();\n    blk_dev_init();\n    chr_dev_init();\n    tty_init();\n\
    \    time_init();\n    sched_init();\n    buffer_init(buffer_memory_end);\n  \
    \  hd_init();\n    floppy_init();\n    sti();\n    move_to_user_mode();\n    if\
    \ (!fork()) {\n        init();\n    }\n    for(;;) pause();\n}\n```\n\n没错，这就是这个\
    \ `main` 函数的全部了。\n\n而整个操作系统也会最终停留在最后一行死循环中，永不返回，直到关机。\n\n好了，至此，整个第一部分就圆满结束了，为了跳进\
    \ `main` 函数的准备工作，我称之为进入内核前的苦力活，就完成了！我们看看我们做了什么。\n\n![](img/file75.webp \"fig:\"\
    )\n\n我把这些称为**进入内核前的苦力活**，经过这样的流程，内存被搞成了这个样子。\n\n![](img/file76.webp \"fig:\")\n\
    \n之后，`main` 方法就开始执行了，靠着我们辛辛苦苦建立起来的内存布局，向崭新的未来前进！\n\n欲知后事如何，且听下回分解。\n\n## 本回扩展资料\n\
    \n关于 `ret` 指令，其实 Intel CPU 是配合 `call` 设计的，有关 `call` 和 `ret` 指令，即调用和返回指令，可以参考 Intel\
    \ 手册：Intel 1 Chapter 6.4 CALLING PROCEDURES USING CALL AND RET\n\n可以看到还分为不改变段基址的\
    \ `near call` 和 `near ret`\n\n![](img/file77.webp \"fig:\")\n\n以及改变段基址的 `far call`\
    \ 和 `far ret`\n\n![](img/file78.webp \"fig:\") 压栈和出栈的过程，上面文字清楚，下面 Intel 手册非常友好了图![](img/file79.webp\
    \ \"fig:\")可以看到我们左边的那一套把 `main` 函数地址当做 `call` 指令，实际上我们通过骚操作伪造了假象，然后 `ret` 的时候就把栈顶的\
    \ `main` 函数地址弹出存入 `eip` 寄存器，这样 CPU 就相当于“返回”到了 `main` 函数开始。\n\n## 第一部分回顾\n\n> [mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    \n第一部分共有十回，这里是目录：\n- [第一回 | 开篇](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第二回 | 启动流程](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)(https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第三回 | 内存加载](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)(https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第四回 | 硬盘分区](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)(https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第五回 | 保护模式](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)(https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第六回 | 寄存器设置](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)(https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第七回 | GDT 与任务](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)(https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第八回 | IDT 与中断](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)(https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第九回 | 分页与内存](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)(https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    - [第 10 回 | 进入 main 函数前的最后一跃！](https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)(https://mp.weixin.qq.com/s/ISyaX5zPWRw_d-9zvZUPUg)\n\
    \n这张图展示了整个结构 media/file80.webp \"fig:\")\n\n今天就来整体一下第一部分的内容，看过的同学回顾一下，没过的同学借着这波开始。话不多说，当你按下开机键的那刻，主板上写死的固件\
    \ BIOS 将启动区的 512 字节的数据原不动复制到内存中的 0x7c00 位置，并跳转到那个位置执行 media/file81.webp \"fig:\"\
    )这一扇区的代码就是操作系统源码中最开始的部分，它可以执行一些指令，也可以把硬盘的部分加载到内存，本质上也是执行一些指令。这样，整个计算机后续运作完全交到我们手中，想怎么玩。\n\
    \n整个操作系统的编译和加载过程的全貌，就是下面这张图 media/file82.webp \"fig:\")\n\n\n"
- fmt: "\n`cs:eip` 表示了我们要执行哪里的代码。\n\n`ds:xxx` 表示了我们要访问哪里的数据。\n\n`ss:esp` 表示了我们的栈顶地址在哪里。\n\
    \n而第一部分的代码，也做了如下工作：\n\n- 将 `ds` 设置为了 `0x10`，表示指向了索引值为 2 的全局描述符，即数据段描述符。\n- 将 `cs`\
    \ 通过一次长跳转指令设置为了 `8`，表示指向了索引值为 1 的全局描述符，即代码段描述符。\n- 将 `ss:esp` 这个栈顶地址设置为 `user_stack`\
    \ 数组的末端。\n\n你看，分段和分页，以及这几个寄存器的设置，其实本质上就是安排我们今后访问内存的方式，做了一个初步规划，包括去哪找代码、去哪找数据、去哪找栈，以及如何通过分段和分页机制将逻辑地址转换为最终的物理地址。\n\
    \n而所有上面说的这一切，和 Intel CPU 这个硬件打交道比较多，设置了一些最最最最基础的环境和内存布局，为之后进入 `main` 函数做了充分的准备，因为\
