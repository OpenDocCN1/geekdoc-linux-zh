    \ 32 位时代之后，由于要考虑**兼容性**，还必须保持一个只能用 20 位地址线的模式，所以如果你不手动开启的话，即使地址线已经有 32 位了，仍然会限制只能使用其中的\
    \ 20 位。\n\n简单吧？我们继续。\n\n接下来的一段代码，你完全完全不用看，但为了防止你一直记挂在心上，我给你截出来说道说道，这样以后我说完全不用看的代码时，你就真的可以放宽心完全不看了。\n\
    \n就是这一大坨，还有 Linus 自己的注释。\n\n```\n; well, that went ok, I hope. Now we have to\
    \ reprogram the interrupts :-(\n; we put them right after the intel-reserved hardware\
    \ interrupts, at\n; int 0x20-0x2F. There they won't mess up anything. Sadly IBM\
    \ really\n; messed this up with the original PC, and they haven't been able to\n\
    ; rectify it afterwards. Thus the bios puts interrupts at 0x08-0x0f,\n; which\
    \ is used for the internal hardware interrupts as well. We just\n; have to reprogram\
    \ the 8259's, and it isn't fun.\n\n    mov al,#0x11        ; initialization sequence\n\
    \    out #0x20,al        ; send it to 8259A-1\n    .word   0x00eb,0x00eb     \
    \  ; jmp $+2, jmp $+2\n    out #0xA0,al        ; and to 8259A-2\n    .word   0x00eb,0x00eb\n\
    \    mov al,#0x20        ; start of hardware int's (0x20)\n    out #0x21,al\n\
    \    .word   0x00eb,0x00eb\n    mov al,#0x28        ; start of hardware int's\
    \ 2 (0x28)\n    out #0xA1,al\n    .word   0x00eb,0x00eb\n    mov al,#0x04    \
    \    ; 8259-1 is master\n    out #0x21,al\n    .word   0x00eb,0x00eb\n    mov\
    \ al,#0x02        ; 8259-2 is slave\n    out #0xA1,al\n    .word   0x00eb,0x00eb\n\
    \    mov al,#0x01        ; 8086 mode for both\n    out #0x21,al\n    .word   0x00eb,0x00eb\n\
    \    out #0xA1,al\n    .word   0x00eb,0x00eb\n    mov al,#0xFF        ; mask off\
    \ all interrupts for now\n    out #0x21,al\n    .word   0x00eb,0x00eb\n    out\
    \ #0xA1,al\n```\n\n这里是对**可编程中断控制器 8259 芯片**进行的编程。\n\n因为中断号是不能冲突的， Intel 把 0 到\
    \ 0x19 号中断都作为**保留中断**，比如 0 号中断就规定为**除零异常**，软件自定义的中断都应该放在这之后，但是 IBM 在原 PC 机中搞砸了，跟保留中断号发生了冲突，以后也没有纠正过来，所以我们得重新对其进行编程，不得不做，却又一点意思也没有。这是\
    \ Linus 在上面注释上的原话。\n\n所以我们也不必在意，只要知道重新编程之后，8259 这个芯片的引脚与中断号的对应关系，变成了如下的样子就好。\n\
    \n| PIC 请求号 | 中断号 | 用途 |\n\n| --- | --- | --- |\n\n| IRQ0 | 0x20 | 时钟中断 |\n\n\
    | IRQ1 | 0x21 | 键盘中断 |\n\n| IRQ2 | 0x22 | 接连从芯片 |\n\n| IRQ3 | 0x23 | 串口2 |\n\n\
    | IRQ4 | 0x24 | 串口1 |\n\n| IRQ5 | 0x25 | 并口2 |\n\n| IRQ6 | 0x26 | 软盘驱动器 |\n\n\
    | IRQ7 | 0x27 | 并口1 |\n\n| IRQ8 | 0x28 | 实时钟中断 |\n\n| IRQ9 | 0x29 | 保留 |\n\n|\
    \ IRQ10 | 0x2a | 保留 |\n\n| IRQ11 | 0x2b | 保留 |\n\n| IRQ12 | 0x2c | 鼠标中断 |\n\n\
    | IRQ13 | 0x2d | 数学协处理器 |\n\n| IRQ14 | 0x2e | 硬盘中断 |\n\n| IRQ15 | 0x2f | 保留 |\n\
    \n好了，接下来的一步，就是真正切换模式的一步了，从代码上看就两行。\n\n```\nmov ax,#0x0001  ; protected mode (PE)\
    \ bit\nlmsw ax      ; This is it;\njmpi 0,8     ; jmp offset 0 of segment 8 (cs)\n\
    ```\n\n前两行，将 cr0 这个寄存器的位 0 置 1，模式就从实模式切换到保护模式了。\n\n![](media/file47.webp \"fig:\"\
    )\n\n所以真正的模式切换十分简单，重要的是之前做的准备工作。\n\n再往后，又是一个段间跳转指令 **jmpi**，后面的 8 表示 cs（代码段寄存器）的值，0\
    \ 表示偏移地址。请注意，此时已经是保护模式了，之前也说过，保护模式下内存寻址方式变了，段寄存器里的值被当做段选择子。\n\n回顾下段选择子的模样。\n\n\
    ![](media/file48.webp \"fig:\")\n\n8 用二进制表示就是\n\n> 00000,0000,0000,1000\n\n对照上面段选择子的结构，可以知道**描述符索引值是\
    \ 1**，也就是要去**全局描述符表（gdt）**中找第一项段描述符。\n\n还记得上一讲中的全局描述符的具体内容么？\n\n```\ngdt:\n  \
    \  .word   0,0,0,0     ; dummy\n\n    .word   0x07FF      ; 8Mb - limit=2047 (2048*4096=8Mb)\n\
    \    .word   0x0000      ; base address=0\n    .word   0x9A00      ; code read/exec\n\
    \    .word   0x00C0      ; granularity=4096, 386\n\n    .word   0x07FF      ;\
    \ 8Mb - limit=2047 (2048*4096=8Mb)\n    .word   0x0000      ; base address=0\n\
    \    .word   0x9200      ; data read/write\n    .word   0x00C0      ; granularity=4096,\
    \ 386\n```\n\n我们说了，第 0 项是空值，第一项被表示为**代码段描述符**，是个可读可执行的段，第二项为**数据段描述符**，是个可读可写段，不过他们的段基址都是\
    \ 0。\n\n所以，这里取的就是这个代码段描述符，**段基址是 0**，偏移也是 0，那加一块就还是 0 咯，所以最终这个跳转指令，就是跳转到内存地址的\
    \ 0 地址处，开始执行。\n\n零地址处是什么呢？还是回顾之前的内存布局图。\n\n![](media/file49.webp \"fig:\")\n\n\
    就是操作系统全部代码的 system 这个大模块，system 模块怎么生成的呢？由 Makefile 文件可知，是由 head.s 和 main.c 以及其余各模块的操作系统代码合并来的，可以理解为操作系统的全部核心代码编译后的结果。\n\
    \n```\n[](#cb29-1)tools/system: boot/head.o init/main.o \\\n[](#cb29-2)  $(ARCHIVES)\
    \  $(DRIVERS)  $(MATH)  $(LIBS)\n[](#cb29-3)  $(LD) $(LDFLAGS) boot/head.o init/main.o\
    \ \\\n[](#cb29-4)    $(ARCHIVES) \\\n[](#cb29-5)    $(DRIVERS) \\\n[](#cb29-6)\
    \    $(MATH) \\\n[](#cb29-7)    $(LIBS) \\\n[](#cb29-8)    -o tools/system > System.map\n\
