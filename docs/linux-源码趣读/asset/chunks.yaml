    \ |\n\n| 0x901FC | 2 | 根设备号 |\n\n由于之后很快就会用 c 语言进行编程，虽然汇编和 c 语言也可以用变量的形式进行传递数据，但这需要编译器在链接时做一些额外的工作，所以这么多数据更方便的还是**双方共同约定一个内存地址**，我往这里存，你从这里取，就完事了。这恐怕是最最原始和直观的变量传递的方式了。\n\
    \n把这些信息存储好之后，操作系统又要做什么呢？我们继续往下看。\n\n```\ncli         ; no interrupts allowed ;\n\
    ```\n\n就一行 cli，表示**关闭中断**的意思。\n\n因为后面我们要把原本是 BIOS 写好的中断向量表给覆盖掉，也就是给破坏掉了，写上我们自己的中断向量表，所以这个时候是不允许中断进来的。\n\
    \n继续看。\n\n```\n; first we move the system to it's rightful place\n    mov ax,#0x0000\n\
    \    cld         ; 'direction'=0, movs moves forward\ndo_move:\n    mov es,ax\
    \       ; destination segment\n    add ax,#0x1000\n    cmp ax,#0x9000\n    jz\
    \  end_move\n    mov ds,ax       ; source segment\n    sub di,di\n    sub si,si\n\
    \    mov cx,#0x8000\n    rep movsw\n    jmp do_move\n; then we load the segment\
    \ descriptors\nend_move:\n    ...\n```\n\n看到后面那个 **rep movsw** 熟不熟悉，一开始我们把操作系统代码从\
    \ **0x7c00** 移动到 **0x90000** 的时候就是用的这个指令，来图回忆一下。\n\n![](media/file27.webp \"fig:\"\
    )\n\n同前面的原理一样，也是做了个内存复制操作，最终的结果是，把内存地址 **0x10000** 处开始往后一直到 **0x90000** 的内容，统统复制到内存的最开始的\
    \ **0** 位置，大概就是这么个效果。\n\n![](media/file28.webp \"fig:\")\n\n由于之前的各种加载和复制，导致内存看起来很乱，是时候进行一波取舍和整理了，我们重新梳理一下此时的内存布局。\n\
    \n栈顶地址仍然是 **0x9FF00** 没有改变。\n\n**0x90000** 开始往上的位置，原来是 **bootsect** 和 **setup**\
    \ 程序的代码，现 bootsect 的一部分代码在已经被操作系统为了记录内存、硬盘、显卡等一些**临时存放的**数据给覆盖了一部分。\n\n内存最开始的\
    \ **0** 到 **0x80000** 这 512K 被 **system** 模块给占用了，之前讲过，这个 system 模块就是除了 bootsect\
    \ 和 setup 之外的全部程序链接在一起的结果，可以理解为**操作系统的全部**。\n\n那么现在的内存布局就是这个样子。\n\n![](media/file29.webp\
    \ \"fig:\")\n\n好了，记住上面的图就好了，这回是不是又重新清晰起来了？之前的什么 0x7c00，已经是过去式了，**赶紧忘掉它**，向前看！\n\
    \n接下来，就要进行有点技术含量的工作了，那就是**模式的转换**，需要从现在的 16 位的**实模式**转变为之后 32 位的**保护模式**，这是一项大工程！也是我认为的这趟操作系统源码旅程中，第一个颇为精彩的地方，大家做好准备\n\
    \n后面的世界越来越精彩，欲知后事如何，且听下回分解。\n\n**------- 本回扩展与延伸 -------**\n\n尝试在文本模式下，用直接写显存的方式，把自己的名字输出在屏幕上。实验源码请自行到\
    \ GitHub 上寻找。\n\n* * *\n\n## 第6回 先解决段寄存器的历史包袱问题\n\n> 原文链接: [https://mp.weixin.qq.com/s/p1a6QxYZyMpJF__uBSE1Kg](https://mp.weixin.qq.com/s/p1a6QxYZyMpJF__uBSE1Kg)\n\
    \n书接上回，上回书咱们说到，操作系统又折腾了一下内存，之后的很长一段时间内存布局就不会变了，终于稳定下来了，目前它长这个样子。\n\n![](media/file30.webp\
    \ \"fig:\")\n\n0 地址开始处存放着操作系统的全部代码吗，也就是 system 模块，0x90000 位置处往后的几十个字节存放着一些设备的信息，方便以后使用。\n\
    \n| 内存地址 | 长度(字节) | 名称 |\n\n| --- | --- | --- |\n\n| 0x90000 | 2 | 光标位置 |\n\n\
    | 0x90002 | 2 | 扩展内存数 |\n\n| 0x90004 | 2 | 显示页面 |\n\n| 0x90006 | 1 | 显示模式 |\n\n\
    | 0x90007 | 1 | 字符列数 |\n\n| 0x90008 | 2 | 未知 |\n\n| 0x9000A | 1 | 显示内存 |\n\n|\
    \ 0x9000B | 1 | 显示状态 |\n\n| 0x9000C | 2 | 显卡特性参数 |\n\n| 0x9000E | 1 | 屏幕行数 |\n\
    \n| 0x9000F | 1 | 屏幕列数 |\n\n| 0x90080 | 16 | 硬盘1参数表 |\n\n| 0x90090 | 16 | 硬盘2参数表\
    \ |\n\n| 0x901FC | 2 | 根设备号 |\n\n是不是十分清晰？不过别高兴得太早，清爽的内存布局，是方便后续操作系统的大显身手！\n\n\
    接下来就要进行真正的第一项大工程了，那就是**模式的转换**，需要从现在的 16 位的**实模式**转变为之后 32 位的**保护模式**。\n\n当然，虽说是一项非常难啃的大工程，但从代码量看，却是少得可怜，所以不必太过担心。\n\
    \n每次讲这里都十分的麻烦，因为这是 **x86 的历史包袱**问题，现在的 CPU 几乎都是支持 32 位模式甚至 64 位模式了，很少有还仅仅停留在 16\
    \ 位的实模式下的 CPU。所以我们要为了这个历史包袱，**写一段模式转换的代码**，如果 Intel CPU 被重新设计而不用考虑兼容性，那么今天的代码将会减少很多甚至不复存在。\n\
    \n所以不用担心，听懂就听懂，听不懂就拉倒，放宽心。\n\n我不打算直接说实模式和保护模式的区别，我们还是跟着代码慢慢品味，来。\n\n这里仍然是 setup.s\
    \ 文件中的代码咯。\n\n```\nlidt  idt_48      ; load idt with 0,0\nlgdt  gdt_48      ;\
    \ load gdt with whatever appropriate\n\nidt_48:\n    .word   0     ; idt limit=0\n\
    \    .word   0,0   ; idt base=0L\n```\n\n上来就是两行看不懂的指令，别急。\n\n要理解这两条指令，就涉及到实模式和保护模式的第一个区别了。我们现在还处于实模式下，这个模式的\
    \ CPU 计算物理地址的方式还记得么？不记得的话看一下 [第一回 最开始的两行代码](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499226&idx=1&sn=1ff3d54a3608423b7781142ae3ac62ca&chksm=c2c58777f5b20e61664a51d31ab779bbe68c317c3459218c7cd4b9530887dbb33470628c3248&scene=21#wechat_redirect)\n\
    \n就是段基址左移四位，再加上偏移地址。比如：\n\n![](media/file31.webp \"fig:\")\n\n是不是觉得很别扭，那更别扭的地方就要来了。当\
    \ CPU 切换到**保护模式**后，同样的代码，内存地址的计算方式还不一样，你说气不气人？\n\n变成啥样了呢？刚刚那个 ds 寄存器里存储的值，在实模式下叫做**段基址**，在保护模式下叫**段选择子**。段选择子里存储着**段描述符**的索引。\n\
    \n![](media/file32.webp \"fig:\")\n\n通过段描述符索引，可以从**全局描述符表 gdt** 中找到一个段描述符，段描述符里存储着段基址。\n\
    \n![](media/file33.webp \"fig:\")\n\n段基址取出来，再和偏移地址相加，就得到了物理地址，整个过程如下。\n\n![](media/file34.webp\
    \ \"fig:\")\n\n你就说烦不烦吧？同样一段代码，实模式下和保护模式下的结果还不同，但没办法，x86 的历史包袱我们不得不考虑，谁让我们没其他 CPU\
    \ 可选呢。\n\n总结一下就是，**段寄存器（比如 ds、ss、cs）里存储的是段选择子，段选择子去全局描述符表中寻找段描述符，从中取出段基址**。\n\n\
    好了，那问题自然就出来了，**全局描述符表（gdt）**长什么样？它在哪？怎么让 CPU 知道它在哪？\n\n长什么样先别管，一定又是一个令人头疼的数据结构，先说说它在哪？在内存中呗，那么怎么告诉\
    \ CPU 全局描述符表（gdt）在内存中的什么位置呢？答案是由操作系统把这个位置信息存储在一个叫 **gdtr** 的寄存器中。\n\n![](media/file35.webp\
    \ \"fig:\")\n\n怎么存呢？就是刚刚那条指令。\n\n```\nlgdt    gdt_48\n```\n\n其中 **lgdt** 就表示把**后面的值（gdt_48）**放在\
    \ **gdtr** 寄存器中，gdt_48 标签，我们看看它长什么样。\n\n```\ngdt_48:\n    .word   0x800      \
    \ ; gdt limit=2048, 256 GDT entries\n    .word   512+gdt,0x9 ; gdt base = 0X9xxxx\n\
    ```\n\n可以看到这个标签位置处表示一个 48 位的数据，其中高 32 位存储着的正是全局描述符表 gdt 的内存地址\n\n**0x9 << 16(0x90000)\
    \ + (512(0x200) + gdt)**\n\n**gdt** 是个标签，表示在本文件内的偏移量\n\n为什么是 **512**，本文件是 **setup.s**，编译后是放在\
    \ **0x90200** 这个内存地址的，还记得吧？所以要在 0x90000 加上 0x200 这个值。\n\n![](media/file36.webp\
    \ \"fig:\")\n\n那 gdt 这个标签处，就是全局描述符表在内存中的真正数据了。\n\n```\ngdt:\n    .word   0,0,0,0\
    \     ; dummy\n\n    .word   0x07FF      ; 8Mb - limit=2047 (2048*4096=8Mb)\n\
    \    .word   0x0000      ; base address=0\n    .word   0x9A00      ; code read/exec\n\
    \    .word   0x00C0      ; granularity=4096, 386\n\n    .word   0x07FF      ;\
    \ 8Mb - limit=2047 (2048*4096=8Mb)\n    .word   0x0000      ; base address=0\n\
    \    .word   0x9200      ; data read/write\n    .word   0x00C0      ; granularity=4096,\
    \ 386\n```\n\n具体细节不用关心，跟我看重点。\n\n根据刚刚的段描述符格式。\n\n![](media/file37.webp \"fig:\"\
    )\n\n可以看出目前全局描述符表有三个段描述符，第一个为**空**，第二个是**代码段描述符（type=code）**，第三个是**数据段描述符（type=data）**，第二个和第三个段描述符的段基址都是\
    \ 0，也就是之后在逻辑地址转换物理地址的时候，通过段选择子查找到无论是代码段还是数据段，取出的段基址都是 0，那么物理地址将直接等于程序员给出的逻辑地址（准确说是逻辑地址中的偏移地址）。先记住这点就好。\n\
    \n![](media/file38.webp \"fig:\")"
