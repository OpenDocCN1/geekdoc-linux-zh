    根据 [第42回 | 用键盘输入一条命令](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502876&idx=1&sn=2c34491abd6ea14c9c7ccc3d2d9827c1&chksm=c2c5b6b1f5b23fa7bdf9c3e2bf811b84da937d30a2c9825ceba8a57c2c3e8e157dedae0bfc8d&scene=21#wechat_redirect)
    所讲述的内容，键盘中断处理函数自然会走到处理字符的 **copy_to_cooked** 函数里。


    ```

    [](#cb386-1)#define INTMASK (1<<(SIGINT-1))

    [](#cb386-2)// kernel/chr_drv/tty_io.c

    [](#cb386-3)void copy_to_cooked (struct tty_struct *tty) {

    [](#cb386-4)    ...

    [](#cb386-5)    if (c == INTR_CHAR (tty)) {

    [](#cb386-6)        tty_intr (tty, INTMASK);

    [](#cb386-7)        continue;

    [](#cb386-8)    }

    [](#cb386-9)    ...

    [](#cb386-10)}

    ```


    这个函数里有一段上述代码，翻译起来特别简单，就是当 **INTR_CHAR** 发现字符为中断字符时（其实就是 CTRL+C），就调用 **tty_intr**
    给进程发送**信号**。


    tty_intr 函数很简单，就是给所有组号等于 tty 组号的进程，发送信号。


    ```

    [](#cb387-1)// kernel/chr_drv/tty_io.c

    [](#cb387-2)void tty_intr (struct tty_struct *tty, int mask) {

    [](#cb387-3)    int i;

    [](#cb387-4)    ...

    [](#cb387-5)    for (i = 0; i < NR_TASKS; i++) {

    [](#cb387-6)        if (task[i] && task[i]->pgrp == tty->pgrp) {

    [](#cb387-7)            task[i]->signal |= mask;

    [](#cb387-8)        }

    [](#cb387-9)    }

    [](#cb387-10)}

    ```


    而如何发送信号，在这段源码中也揭秘了，其实就是给进程 task_struct 结构中的 **signal** 的相应位置 1 而已。


    发送什么信号，在上面的宏定义中也可以看出，就是 **SIGINT** 信号。


    SIGINT 就是个数字，它是几呢？它就定义在 **signal.h** 这个头文件里。'
