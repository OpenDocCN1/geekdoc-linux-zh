    \n```\n[](#cb171-1)int copy_process(int nr, ...) {\n[](#cb171-2)    struct task_struct\
    \ p = \n[](#cb171-3)        (struct task_struct *) get_free_page();\n[](#cb171-4)\
    \    task[nr] = p;\n[](#cb171-5)    *p = *current;\n[](#cb171-6)\n[](#cb171-7)\
    \    p->state = TASK_UNINTERRUPTIBLE;\n[](#cb171-8)    p->pid = last_pid;\n[](#cb171-9)\
    \    p->counter = p->priority;\n[](#cb171-10)    ..\n[](#cb171-11)    p->tss.edx\
    \ = edx;\n[](#cb171-12)    p->tss.ebx = ebx;\n[](#cb171-13)    p->tss.esp = esp;\n\
    [](#cb171-14)    ...\n[](#cb171-15)    copy_mem(nr,p);\n[](#cb171-16)    ...\n\
    [](#cb171-17)    set_tss_desc(gdt+(nr<<1)+FIRST_TSS_ENTRY,&(p->tss));\n[](#cb171-18)\
    \    set_ldt_desc(gdt+(nr<<1)+FIRST_LDT_ENTRY,&(p->ldt));\n[](#cb171-19)    p->state\
    \ = TASK_RUNNING;\n[](#cb171-20)    return last_pid;\n[](#cb171-21)}\n```\n\n\
    这个函数本来就是 fork 的难点了，所以我们慢慢来。\n\n首先 **get_free_page** 会在主内存末端申请一个空闲页面，还记得我们之前在 [第13回\
    \ 内存初始化 mem_init](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500089&idx=1&sn=9a3fd6e585b0fd1ec528599ead6677c6&chksm=c2c5bb94f5b2328224fbc1309718ac7e022bfa32dbf3d6f593b23f2f58ffd0910fe80de05a7f&scene=21#wechat_redirect)\
    \ 里是怎么管理内存的吧？\n\n![](media/file181.webp \"fig:\")\n\n那 get_free_page 这个函数就很简单了，**就是遍历\
    \ mem_map[] 这个数组，找出值为零的项，就表示找到了空闲的一页内存**。然后把该项置为 1，表示该页已经被使用。最后，算出这个页的内存起始地址，返回。\n\
    \n然后，拿到的这个内存起始地址，就给了 task_struct 结构的 p。\n\n```\n[](#cb172-1)int copy_process(int\
    \ nr, ...) {\n[](#cb172-2)    struct task_struct p = \n[](#cb172-3)        (struct\
    \ task_struct *) get_free_page();\n[](#cb172-4)    task[nr] = p;\n[](#cb172-5)\
    \    *p = *current;\n[](#cb172-6)    ...\n[](#cb172-7)}\n```\n\n于是乎，一个进程结构 task_struct\
    \ 就在内存中有了一块空间，但此时还没有赋值具体的字段。别急。\n\n首先将这个 p 记录在进程管理结构 task[] 中。\n\n然后下一句 *p = *current\
    \ 很简单，**就是把当前进程，也就是 0 号进程的 task_struct 的全部值都复制给即将创建的进程 p**，目前它们两者就完全一样了。\n\n嗯，这就附上值了，就完全复制之前的进程的\
    \ task_struct 而已，很粗暴。\n\n最后的内存布局的效果就是这样。\n\n![](media/file182.webp \"fig:\")\n\
    \n然后，进程 1 和进程 0 目前是完全复制的关系，但有一些值是需要个性化处理的，下面的代码就是把这些不一样的值覆盖掉。\n\n```\n[](#cb173-1)int\
    \ copy_process(int nr, ...) {\n[](#cb173-2)    ...\n[](#cb173-3)    p->state =\
    \ TASK_UNINTERRUPTIBLE;\n[](#cb173-4)    p->pid = last_pid;\n[](#cb173-5)    p->counter\
    \ = p->priority;\n[](#cb173-6)    ..\n[](#cb173-7)    p->tss.edx = edx;\n[](#cb173-8)\
    \    p->tss.ebx = ebx;\n[](#cb173-9)    p->tss.esp = esp;\n[](#cb173-10)    ...\n\
    [](#cb173-11)    p->tss.esp0 = PAGE_SIZE + (long) p;\n[](#cb173-12)    p->tss.ss0\
    \ = 0x10;\n[](#cb173-13)    ...\n[](#cb173-14)}\n```\n\n不一样的值，一部分是 **state**，**pid**，**counter**\
    \ 这种**进程的元信息**，另一部分是 **tss** 里面保存的各种寄存器的信息，即**上下文**。\n\n这里有两个寄存器的值的赋值有些特殊，就是 ss0\
    \ 和 esp0，这个表示 0 特权级也就是内核态时的 ss:esp 的指向。\n\n根据代码我们得知，其含义是将代码在内核态时使用的堆栈栈顶指针指向进程\
    \ task_struct 所在的 4K 内存页的最顶端，而且之后的每个进程都是这样被设置的。\n\n![](media/file183.webp \"fig:\"\
    )\n\n好了，进程槽位的申请，以及基本信息的复制，就讲完了。\n\n今天就这么点内容，**就是内存中找个地方存一个 task_struct 结构的东东，并添加到\
    \ task[] 数组里的空闲位置处，这个东东的具体字段赋值的大部分都是复制原来进程的**。\n\n接下来将是进程页表和段表的复制，这将会决定进程之间的内存规划问题，很是精彩，也是\
    \ fork 真正的难点所在。\n\n欲知后事如何，且听下回分解。\n\n* * *\n\n## 第27回 fork 中进程内存规划的问题\n\n> 原文链接:\
    \ [https://mp.weixin.qq.com/s/d2pHFSbTLb-nv2C_RfKlVA](https://mp.weixin.qq.com/s/d2pHFSbTLb-nv2C_RfKlVA)\n\
    \n书接上回，上回书咱们说到，**fork** 函数为新的进程（进程 1）申请了槽位，并把全部 **task_struct** 结构的值都从进程零复制了过来。"
