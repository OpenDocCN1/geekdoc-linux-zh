    这里我把所有 Linux 0.11 支持的信号都放在这了，有我们熟悉的按下 CTRL+C 时的信号 **SIGINT**，有我们通常杀死进程时 kill -9
    的信号 **SIGKILL**，还有 core dump 内存访问出错时经常遇到的 **SIGSEGV**。


    在现代 Linux 操作系统中，你输入个 **kill -l** 便可知道你所在的系统所支持的信号，下面是我在我购买的一台腾讯云主机上的结果。


    ![](media/file332.webp "fig:")


    OK，这么几句话，我就说完了信号的本质，以及信号的种类。


    现在这个进程的 tast_struct 结构中的 signal 就有了对应信号位的值，那么在下次时钟中断到来时，便会通过 **timer_interrupt**
    这个时钟中断处理函数，一路调用到 **do_signal** 方法。


    ```

    [](#cb389-1)// kernel/signal.c

    [](#cb389-2)void do_signal (long signr ...) {

    [](#cb389-3)    ...

    [](#cb389-4)    struct sigaction *sa = current->sigaction + signr - 1;

    [](#cb389-5)    sa_handler = (unsigned long) sa->sa_handler;

    [](#cb389-6)    // 如果信号处理函数为空，则直接退出

    [](#cb389-7)    if (!sa_handler) {

    [](#cb389-8)        ...

    [](#cb389-9)        do_exit (1 << (signr - 1));

    [](#cb389-10)        ...

    [](#cb389-11)    }

    [](#cb389-12)    // 否则就跳转到信号处理函数的地方运行

    [](#cb389-13)    *(&eip) = sa_handler;

    [](#cb389-14)    ...

    [](#cb389-15)}

    ```


    时钟中断和进程调度的流程，你可以看 [第24回 | 从一次定时器滴答来看进程调度](https://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501609&idx=1&sn=fe5bd9b9f69045fd70f6d7aeaea273bc&scene=21#wechat_redirect)，这里不再展开。


    我们可以看到，进入 do_signal 函数后，如果当前信号 **signr** 对应的**信号处理函数 sa_handler** 为空时，就直接调用 do_exit
    函数退出，也就是我们看到的按下 CTRL+C 之后退出的样子了。


    但是，如果信号处理函数不为空，那么就通过将 sa_handler 赋值给 eip 寄存器，也就是指令寄存器的方式，**跳转到相应信号处理函数处运行**。


    怎么验证这一点呢？很简单，信号处理函数注册在每个进程 task_struct 中的 sigaction 数组中。


    ```

    [](#cb390-1)// signal.h

    [](#cb390-2)struct  sigaction {

    [](#cb390-3)    union __sigaction_u __sigaction_u;  /* signal handler */

    [](#cb390-4)    sigset_t sa_mask;               /* signal mask to apply */

    [](#cb390-5)    int     sa_flags;               /* see signal options below */

    [](#cb390-6)};

    [](#cb390-7)

    [](#cb390-8)/* union for signal handlers */

    [](#cb390-9)union __sigaction_u {

    [](#cb390-10)    void    (*__sa_handler)(int);

    [](#cb390-11)    void    (*__sa_sigaction)(int, struct __siginfo *,

    [](#cb390-12)        void *);

    [](#cb390-13)};

    [](#cb390-14)

    [](#cb390-15)// sched.h

    [](#cb390-16)struct task_struct {

    [](#cb390-17)    ...

    [](#cb390-18)    struct sigaction sigaction[32];

    [](#cb390-19)    ...

    [](#cb390-20)}

    ```


    没错，只需要给 sigaction 对应位置处填写上信号处理函数即可。


    那么如何注册这个信号处理函数呢，通过调用 signal 这个库函数即可。


    我们可以写一个小程序。


    ```

    [](#cb391-1)#include <stdio.h>

    [](#cb391-2)#include <signal.h>

    [](#cb391-3)

    [](#cb391-4)void int_handler(int signal_num) {

    [](#cb391-5)    printf("signal receive %d\n", signal_num);

    [](#cb391-6)}

    [](#cb391-7)

    [](#cb391-8)int main(int argc, char ** argv) {

    [](#cb391-9)    signal(SIGINT, int_handler);

    [](#cb391-10)    for(;;)

    [](#cb391-11)        pause();

    [](#cb391-12)    return 0;

    [](#cb391-13)}

    ```


    这是个死循环的 main 函数，只不过，通过 signal 注册了 **SIGINT** 的信号处理函数，里面做的事情仅仅是打印一下信号值。


    编译并运行它，我们会发现在按下 CTRL+C 之后程序不再退出，而是输出了我们 printf 的话。


    ![](media/file333.webp "fig:")


    我们多次按 CTRL+C，这个程序仍然不会退出，会一直输出上面的话。


    ![](media/file334.webp "fig:")


    这就做到了**亲手捕获 SIGINT 这个信号**。但这个程序有点不友好，永远无法 CTRL+C 结束了，我们优化一下代码，让第一次按下 CTRL+C 后的信号处理函数，把
    SIGINT 的处理函数重新置空。


    ```

    [](#cb392-1)#include <stdio.h>

    [](#cb392-2)#include <signal.h>

    [](#cb392-3)

    [](#cb392-4)void int_handler(int signal_num) {

    [](#cb392-5)    printf("signal receive %d\n", signal_num);

    [](#cb392-6)    signal(SIGINT, NULL);

    [](#cb392-7)}

    [](#cb392-8)

    [](#cb392-9)int main(int argc, char ** argv) {

    [](#cb392-10)    signal(SIGINT, int_handler);

    [](#cb392-11)    for(;;)

    [](#cb392-12)        pause();

    [](#cb392-13)    return 0;

    [](#cb392-14)}

    ```


    我们发现，这次按下第二次 CTRL+C 程序就会退出了，这也间接证明了，当没有为 SIGINT 注册信号处理函数时，程序接收到 CTRL+C 的 SIGINT
    信号时便会退出。


    ![](media/file335.webp "fig:")


    至此，有关信号的内容，就讲明白了。


    **信号是进程间通信的一种方式，管道也是进程间通信的一种方式**，所以通过 [第45回 | 解析并执行 shell 命令](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247503139&idx=1&sn=652316c29be5ba983fbb658ce58443d8&chksm=c2c5b78ef5b23e980870ff66f066a624f9a5d61bd73f550d5579e745f60335dfb489dcf977d8&scene=21#wechat_redirect)
    讲述的管道原理，与本回讲述的信号原理，你已经掌握了进程间通信的两种方式了。


    通过这种类似 "倒叙" 的讲述方法，希望你能明白，其实技术的本质并不复杂，只不过被抽象之后，由于你不了解下面的细节，就变得云里雾里了。


    欲知后事如何，且听下回分解。


