    \ `000000001100000000000000`。\n\n![](media/file61.webp \"fig:\")\n\n也就是说，CPU 在看到给出的内存地址后，首先把线性地址拆分成高10\
    \ 位、中间10 位、后12 位。高10 位负责在页目录表中找到一个页目录项，这个页目录项的值加上中间10 位去页表中寻找一个页表项，这个页表项的值再加上后12\
    \ 位偏移地址，就是最终物理地址。\n\n这一切的操作都由计算机的一个硬件 `MMU`，中文名字叫内存管理单元，有时叫 PMMU，分页内存单元。由这个部件来负责将虚拟地址转换为物理地址。所以整个过程我们不用操心，作为操作系统这个软件层，只需要提供页目录表和页表即可。这种页表方案叫做二级页表，第一级叫\
