- fmt: "\n然后 `copy_process`，就是复制进程。\n\n那妥了，这个方法的意思非常简单，因为存储进程的数据结构是一个 `task[64]` 数组，这个是在之前\
    \ [第18回 | 大名鼎鼎的进程调度就是从这里开始的](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247500496&idx=1&sn=3bddde6c68c2b03d9721ba74e949cfa8&chksm=c2c5b87df5b2316b083015a4fdba2df29211f38fcfd1cdb040e02ab410432608e26383a43ef5&scene=21#wechat_redirect)\
    \ `sched_init` 函数的时候设置的。\n\n![](media/file180.webp \"fig:\")\n\n就是先在这个数组中找一个空闲的位置，准备存一个新的进程的结构\
    \ `task_struct`，这个结构之前在 [一个新进程的诞生（三）如果让你来设计进程调度](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501576&idx=1&sn=657e1c89d1007a935820d394d64f4035&chksm=c2c5bda5f5b234b3654c5ea2113cc0d48eee854f9f035ec69ec44bf9d964ae6cd4c181ed5880&scene=21#wechat_redirect)\
    \ 也简单说过了。\n\n```\nstruct task_struct {\n    long state;\n    long counter;\n \
    \   long priority;\n    ...\n    struct tss_struct tss;\n}\n```\n\n这个结构各个字段具体赋什么值呢？\n\
    \n通过 `copy_process` 这个名字我们知道，就是复制原来的进程，也就是当前进程。\n\n当前只有一个进程，就是数组中位置 0 处的 `init_task.init`，也就是零号进程，那自然就复制它咯。\n\
    \n好了，以上只是我们的猜测，有了猜测再看代码会非常轻松，我们一个个函数看。\n\n先来 `find_empty_process`。\n\n```\nlong\
    \ last_pid = 0;\n\nint find_empty_process(void) {\n    int i;\n    repeat:\n \
    \       if ((++last_pid)<0) last_pid=1;\n        for(i=0 ; i<64 ; i++)\n     \
    \       if (task[i] && task[i]->pid == last_pid) goto repeat;\n    for(i=1 ; i<64;\
    \ i++)\n        if (!task[i])\n            return i;\n    return -EAGAIN;\n}\n\
    ```\n\n一共三步，很简单。\n\n**第一步**，判断 `++last_pid` 是不是小于零了，小于零说明已经超过 `long` 的最大值了，重新赋值为\
    \ 1，起到一个保护作用，这没什么好说的。\n\n**第二步**，一个 `for` 循环，看看刚刚的 `last_pid` 在所有 `task[]` 数组中，是否已经被某进程占用了。如果被占用了，那就重复执行，再次加一，然后再次判断，直到找到一个\
    \ `pid` 号没有被任何进程用为止。\n\n**第三步**，又是个 `for` 循环，刚刚已经找到一个可用的 `pid` 号了，那这一步就是再次遍历这个\
    \ `task[]` 试图找到一个空闲项，找到了就返回元素索引下标。\n\n**最终，这个方法就返回 `task[]` 数组的索引，表示找到了一个空闲项**，之后就开始往这里塞一个新的进程吧。\n\
    \n由于我们现在只有 0 号进程，且 `task[]` 除了 0 号索引位置，其他地方都是空的，所以这个方法运行完，`last_pid` 就是 1，也就是新进程被分配的\
    \ `pid` 就是 1，然后即将要加入的 `task[]` 数组的索引位置，也是 1。\n\n好的，那我们接下来就看，怎么构造这个进程结构，塞到这个 1\
    \ 索引位置的 `task[]` 中？\n\n来看 `copy_process` 方法。\n\n```\nint copy_process(int nr,long\
    \ ebp,long edi,long esi,long gs,long none,\n        long ebx,long ecx,long edx,\n\
    \        long fs,long es,long ds,\n        long eip,long cs,long eflags,long esp,long\
    \ ss)\n{\n    struct task_struct *p;\n    int i;\n    struct file *f;\n\n    p\
    \ = (struct task_struct *) get_free_page();\n    if (!p)\n        return -EAGAIN;\n\
    \    task[nr] = p;\n    *p = *current;  /* NOTE! this doesn't copy the supervisor\
    \ stack */\n    p->state = TASK_UNINTERRUPTIBLE;\n    p->pid = last_pid;\n   \
    \ p->father = current->pid;\n    p->counter = p->priority;\n    p->signal = 0;\n\
    \    p->alarm = 0;\n    p->leader = 0;      /* process doesn't inherit */\n  \
    \  p->utime = p->stime = 0;\n    p->cutime = p->cstime = 0;\n    p->start_time\
    \ = jiff;\n    p->tss.link = 0;\n    p->tss.esp0 = PAGE_SIZE + (long) p;\n   \
    \ p->tss.ss0 = 0x10;\n    p->tss.eip = eip;\n    p->tss.eflag = eflags;\n    p->tss.eax\
    \ = 0;\n    p->tss.ecx = ecx;\n    p->tss.edx = edx;\n    p->tss.ebx = ebx;\n\
    \    p->tss.esp = esp;\n    p->tss.ebp = ebp;\n    p->tss.esi = esi;\n    p->tss.edi\
    \ = edi;\n    p->tss.es = 0xffff;\n    p->tss.cs = 0xffff;\n    p->tss.ss = 0xffff;\n\
    \    p->tss.ds = 0xffff;\n    p->tss.fs = 0xffff;\n    p->tss.gs = 0xffff;\n \
    \   p->tss.ldt = _LDT(nr);\n    p->tss.trace_bitmap = 0x8000000;\n    if (last_task_used\
    \ == current)\n        __asm__(\"clts %0\":\"m\" (p->tss));\n    if (copy_mem(nr,p))\
    \ {\n        task[nr] = NULL;\n        free_page((long) p);\n        return -EAGAIN;\n\
    \    }\n    for (i=0; i<NR_OPEN;i++)\n        if (f=p->fil[i])\n            f->f_count++;\n\
    \    if (current->pwd)\n        current->pwd->i_count++;\n    if (current->root)\n\
    \        current->root->i_count++;\n    if (current->executable)\n        current->executable->i_count++;\n\
    \    set_tss_desc(gdt+(nr<<1)+FIRST_TSS_ENTRY,&(p->tss));\n    set_ldt_desc(gdt+(nr<<1)+FIRST_LDT_ENTRY,&(p->ldt));\n\
    \    p->state = TASK_RUNNING;    /* do this last, just in case */\n    return\
    \ last_pid;\n}\n```\n\n艾玛，这也太多了！\n\n别急，大部分都是 `tss` 结构的复制，以及一些无关紧要的分支，看我简化下。\n\n\
    ```\nint copy_process(int nr, ...) {\n    struct task_struct p = \n        (struct\
    \ task_struct *) get_free_page();\n    task[nr] = p;\n    *p = *current;\n\n \
    \   p->state = TASK_UNINTERRUPTIBLE;\n    p->pid = last_pid;\n    p->counter =\
    \ p->priority;\n    ..\n    p->tss.edx = edx;\n    p->tss.ebx = ebx;\n    p->tss.esp\
    \ = esp;\n    ...\n    copy_mem(nr,p);\n    ...\n    set_tss_desc(gdt+(nr<<1)+FIRST_TSS_ENTRY,&(p->tss));\n\
    \    set_ldt_desc(gdt+(nr<<1)+FIRST_LDT_ENTRY,&(p->ldt));\n}\n```\n"
