    \n上一个大部分的名字叫[一个新进程的诞生](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501947&idx=1&sn=cb94f53c75d674d30fb4903778c74c08&chksm=c2c5b2d6f5b23bc027d9652d3e9949e55fd3b101beb87f6f80dd77d8233c0b51bede73edad46&scene=21#wechat_redirect)，讲述了进程\
    \ 0 调用了 `fork` 函数创建了一个新的进程 —— 进程 1，并且使其达到了可以被调度的状态，`fork` 就算正式完成了自己的使命。\n\n```c\n\
    void main(void) {\n    ...\n    move_to_user_mode();\n    if (!fork()) {\n   \
    \     init();\n    }\n    for(;;) pause();\n}\n```\n\n由于 `fork` 函数一调用，就又多出了一个进程，子进程（进程\
    \ 1）会返回 0，父进程（进程 0）返回子进程的 ID，所以 `init` 函数只有进程 1 才会执行。\n\n第三部分结束后，就到了现在的第四部分，**shell程序的到来**。而整个第四部分的故事，就是这个\
    \ `init` 函数做的事情。\n\n虽然就一行代码，但这里的事情可多了去了，我们先看一下整体结构。我已经把单纯的日志打印和错误校验逻辑去掉了。\n\n\
    ```c\nvoid init(void) {\n    int pid,i;\n    setup((void *) &drive_info);\n  \
    \  (void) open(\"/dev/tty0\",O_RDWR,0);\n    (void) dup(0);\n    (void) dup(0);\n\
    \    if (!(pid=fork())) {\n        open(\"/etc/rc\",O_RDONLY,0);\n        execve(\"\
    /bin/sh\",argv_rc,envp_rc);\n    }\n    if (pid>0)\n        while (pid != wait(&i))\n\
    \            /* nothing */;\n    while (1) {\n        if (!pid=fork()) {\n   \
    \         close(0);close(1);close(2);\n            setsid();\n            (void)\
    \ open(\"/dev/tty0\",O_RDWR,0);\n            (void) dup(0);\n            (void)\
    \ dup(0);\n            _exit(execve(\"/bin/sh\",argv,envp));\n        }\n    \
    \    while (1)\n            if (pid == wait(&i))\n                break;\n   \
    \     sync();\n    }\n    _exit(0);\n}\n```\n\n是不是看着挺复杂？不过别急，今天只讲第一行 `setup` 的一部分，硬盘信息的。\n\
    \n```c\nstruct drive_info { char dummy[32]; } drive_info;\n// drive_info = *(struct\
    \ drive_info *)0x0080;\nvoid init(void) {\n    setup((void *) &drive_info);\n\
    \    ...\n}\n```\n\n先看入参。`drive_info` 是来自内存 `0x0080` 的数据，这部分是由之前[进入模式前的最后一次折腾内存](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247499558&idx=1&sn=d5057fae2fb83d38f8204c269463&chksm=c2c558bf5b209de5c31dd34fbe76f6c6da17f544518a75fc183ada)\
    \ 讲的 `setup.s` 程序将硬盘 1 的参数放在这里，包括柱面数、磁头数、扇区数等信息。\n\n`setup` 是个系统调用，会通过中断调用到 `sys_setup`\
    \ 函数。关于系统调用的原理，在[通过 fork 看系统调用](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng&mid=2247501700&idx=1&sn=1b016cf9852f8974a337d9b06c940b&chksm=c2c5bd29f5b234ff01c68f654bb12148f0effc21bbe725a547a6fbdd253af)\
    \ 中讲得很清楚了，此处不再赘述。\n\n所以直接看 `sys_setup` 函数，我对代码做了些许简化，去掉了日志打印和错误判断，并且当作只有硬盘，去掉了一层\
    \ `for` 循环。\n\n```c\nint sys_setup(void * BIOS) {\n    hd_info[0].cyl = *(unsigned\
    \ short *) BIOS;\n    hd_info[0].head = *(unsigned char *) (2+BIOS);\n    hd_info[0].wpcom\
    \ = *(unsigned short *) (5+BIOS);\n    hd_info[0].ctl = *(unsigned char *) (8+BIOS);\n\
    \    hd_info[0].lzone = *(unsigned short *) (12+BIOS);\n    hd_info[0].sect =\
    \ *(unsigned char *) (14+BIOS);\n    BIOS += 16;\n\n    hd[0].start_sect = 0;\n\
    \    hd[0].nr_sects = hd_info[0].head * hd_info[0].sect * hd_info[0].cyl;\n\n\
    \    struct buffer_head *bh = bread(0x300, 0);\n    struct partition *p = 0x1BE\
    \ + (void *)bh->b_data;\n    for (int i=1;i<5;i++,p++) {\n        hd[i].start_sect\
    \ = p->start_sect;\n        hd[i].nr_sects = p->nr_sects;\n    }\n    brelse(bh);\n\
    \n    rd_load();\n    mount_root();\n    return (0);\n}\n```\n\n好，我们一点点看。先看第一部分，硬盘信息的赋值的操作。\n\
    \n```c\nint sys_setup(void * BIOS) {\n    hd_info[0].cyl = *(unsigned short *)\
    \ BIOS;\n    hd_info[0].head = *(unsigned char *) (2+BIOS);\n    hd_info[0].wpcom\
    \ = *(unsigned short *) (5+BIOS);\n    hd_info[0].ctl = *(unsigned char *) (8+BIOS);\n\
    \    hd_info[0].lzone = *(unsigned short *) (12+BIOS);\n    hd_info[0].sect =\
    \ *(unsigned char *) (14+BIOS);\n    BIOS += 16;\n    ...\n}\n```\n\n刚刚说了，入参 `BIOS`\
    \ 是来自内存 `0x0080` 的数据。一开始往 `hd_info` 数组的 0 索引处存上这些信息。假设只有一块硬盘，所以这个数组只有一个元素。这个数组里的结构就是\
    \ `hd_i_struct`，表示硬盘的参数。\n\n```c\nstruct hd_i_struct {\n    // 磁头数、每磁道扇区数、柱面数、写补偿柱面号、磁头陆区柱面号、控制字节\n\
    \    int head,sect,cyl,wpcom,lzone,ctl;\n};\nstruct hd_i_struct hd_info[] = {};\n\
    ```\n\n最终效果就是这样。OK，我们继续。看第二部分，硬盘表的设置。\n\n```c\nstatic hd_struct {\n    long start_sect;\n\
    \    long nr_sects;\n} hd[5] = {}\n\nint sys_setup(void * BIOS) {\n    ...\n \
    \   hd[0].start_sect = 0;\n    hd[0].nr_sects = hd_info[0].head * hd_info[0].sect\
    \ * hd_info[0].cyl;\n    struct buffer_head *bh = bread(0x300, 0);\n    struct\
    \ partition *p = 0x1BE + (void *)bh->b_data;\n    for (int i=1;i<5;i++,p++) {\n\
    \        hd[i].start_sect = p->start_sect;\n        hd[i].nr_sects = p->nr_sects;\n\
    \    }\n    brelse(bh);\n    ...\n}\n```\n\n只看最终效果，就是给 `hd` 数组的五项附上了值。这表示硬盘的分区信息，每个分区用\
    \ `start_sect` 和 `nr_sects`，也就是开始扇区和总扇区数来记录。\n\n这些信息是从哪里获取的呢？就是在硬盘的第一个扇区的 `0x1BE`\
    \ 偏移处，这里存储着该硬盘的分区信息，只要把这个地方的数据拿到就 OK 了。所以 `bread` 就是干这事的，从硬盘读取数据。\n\n```c\nstruct\
    \ buffer_head *bh = bread(0x300, 0);\n```\n\n第一个参数 `0x300` 是第一块硬盘的主设备号，就表示要读取的块设备是硬盘一。第二个参数\
    \ 0 表示读取第一个块，一个块为 1024 字节大小，也就是连续读取第一个块。\n"
