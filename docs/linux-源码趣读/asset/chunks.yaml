  trans: '


    ![](img/file184.webp "fig:")


    After this, it overrides the basic information of the new process, including metadata
    and register information in the `tss`.


    ```

    [](#cb174-1)int copy_process(int nr, ...) {

    [](#cb174-2)    ...

    [](#cb174-3)    p->state = TASK_UNINTERRUPTIBLE;

    [](#cb174-4)    p->pid = last_pid;

    [](#cb174-5)    p->counter = p->priority;

    [](#cb174-6)    ..

    [](#cb174-7)    p->tss.edx = edx;

    [](#cb174-8)    p->tss.ebx = ebx;

    [](#cb174-9)    p->tss.esp = esp;

    [](#cb174-10)    ...

    [](#cb174-11)}

    ```


    It can be said that half of the `fork` function has been explained. Today, we
    will expand on the other half, which is the `copy_mem` function.


    ```

    [](#cb175-1)int copy_process(int nr, ...) {

    [](#cb175-2)    ...

    [](#cb175-3)    copy_mem(nr,p);

    [](#cb175-4)    ...

    [](#cb175-5)}

    ```


    This will determine the memory planning issues between processes. It is very exciting,
    so let''s begin.


    ------


    The entire function is not long, so let''s try to translate it literally first.


    ```

    [](#cb176-1)int copy_mem(int nr,struct task_struct * p) {

    [](#cb176-2)    // Local descriptor table LDT assignment

    [](#cb176-3)    unsigned long old_data_base,new_data_base,data_limit;

    [](#cb176-4)    unsigned long old_code_base,new_code_base,code_limit;

    [](#cb176-5)    code_limit = get_limit(0x0f);

    [](#cb176-6)    data_limit = get_limit(0x17);

    [](#cb176-7)    new_code_base = nr * 0x4000000;

    [](#cb176-8)    new_data_base = nr * 0x4000000;

    [](#cb176-9)    set_base(p->ldt[1],new_code_base);

    [](#cb176-10)    set_base(p->ldt[2],new_data_base);

    [](#cb176-11)    // Copy page tables

    [](#cb176-12)    old_code_base = get_base(current->ldt[1]);

    [](#cb176-13)    old_data_base = get_base(current->ldt[2]);

    [](#cb176-14)    copy_page_tables(old_data_base,new_data_base,data_limit);

    [](#cb176-15)    return 0;

    [](#cb176-16)}

    ```


    Look, it is actually just the assignment of the new process''s `LDT` entries and
    the copying of page tables.


    ### LDT Assignment


    Let''s look at the assignment of the `LDT` entries first. To explain the significance
    of this assignment, we first need to recall the problem we mentioned in [Episode
    9 | Intel Memory Management Two Axes: Segmentation and Paging](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499821&idx=1&sn=df90a7c57607bf501b5ef535f8440d98&chksm=c2c5ba80f5b233969bf591f919107e28e7be51f066821cba1ea39bf19cc0332b95b94d29467d&scene=21#wechat_redirect)
    when we set up the page tables.


    The logical address provided by the programmer is eventually converted into a
    physical address through these steps.


    ![](img/file185.webp "fig:")


    Since we have already enabled paging, the specific transformation of the paging
    mechanism is as follows.


    ![](img/file186.webp "fig:")


    Because of the existence of page tables, there is the concept of linear address
    space, which is the address after the segmentation mechanism transformation but
    before the paging mechanism transformation.


    Ignoring the segment limit, the 32-bit CPU linear address space should be 4G.
    Now there are only four page directory tables, which means the first 16M of linear
    address space is mapped one-to-one with 16M of physical address space.


    ![](img/file187.webp "fig:")


    Relating this diagram to the Global Descriptor Table `GDT`, this linear address
    space is the address after the segmentation mechanism (the segment could be `GDT`
    or `LDT`), and it corresponds as follows.


    ![](img/file188.webp "fig:")


    The code segment and data segment of `LDT` prepared for process 0 have segment
    bases of 0 and segment limits of 640K. For process 1, which is the process we
    are currently forking, the code segment and data segment have not been set yet.


    So the first step, the assignment of the local descriptor table `LDT`, is to assign
    values to those two unset code and data segments in the figure above.


    Among them, the segment limit is taken from the segment limit set by process 0,
    which is 640K.


    ```

    [](#cb177-1)int copy_mem(int nr,struct task_struct * p) {

    [](#cb177-2)    ...

    [](#cb177-3)    code_limit = get_limit(0x0f);

    [](#cb177-4)    data_limit = get_limit(0x17);

    [](#cb177-5)    ...

    [](#cb177-6)}

    ```


    And the segment base is somewhat interesting; it depends on which process number
    it currently is, which is the value of `nr`.


    ```

    [](#cb178-1)int copy_mem(int nr,struct task_struct * p) {

    [](#cb178-2)    ...

    [](#cb178-3)    new_code_base = nr * 0x4000000;

    [](#cb178-4)    new_data_base = nr * 0x4000000;

    [](#cb178-5)    ...

    [](#cb178-6)}

    ```


    The `0x4000000` here is equal to 64M. This means each process gets a 64M block
    of linear space.


    ```

    [](#cb179-1)int copy_mem(int nr,struct task_struct * p) {

    [](#cb179-2)    ...

    [](#cb179-3)    set_base(p->ldt[1],new_code_base);

    [](#cb179-4)    set_base(p->ldt[2],new_data_base);

    [](#cb179-5)    ...

    ```


