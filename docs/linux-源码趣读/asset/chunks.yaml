    [](#cb264-11)    bread_page(page,current->executable->i_dev,nr);

    [](#cb264-12)    ...

    [](#cb264-13)}

    ```


    **从硬盘的哪个位置开始读呢？**首先 0 内存地址，应该就对应着这个文件 0 号数据块，当然由于 /bin/sh 这个 a.out 格式的文件使用了 1
    个数据块作为头部 exec 结构，所以我们**跳过头部**，从文件 1 号数据块开始读。


    **读多少块呢？**因为硬盘中的 1 个数据块为 1024 字节，而一页内存为 4096 字节，所以要读 4 块，这就是 nr[4] 的缘故。


    之后读取数据主要是两个函数，**bmap** 负责将相对于文件的数据块转换为相对于整个硬盘的数据块，比如这个文件的第 1 块数据，可能对应在整个硬盘的第 24
    块的位置。


    **bread_page** 就是连续读取 4 个数据块到 1 页内存的函数，这个函数原理就复杂了，之后第五部分会讲这块的内容，但站在用户层的效果很好理解，就是把硬盘数据复制到内存罢了。


    OK，现在硬盘上所需要的内容已经被读入物理内存了。


    最后一步完成**页表的映射**。


    ```

    [](#cb265-1)// memory.c

    [](#cb265-2)// address 缺页产生的线性地址 0x8000000

    [](#cb265-3)void do_no_page(unsigned long address) {

    [](#cb265-4)    ...

    [](#cb265-5)    // 完成页表的映射

    [](#cb265-6)    put_page(page,address);

    [](#cb265-7)}

    ```


    这是因为我们此时仅仅是申请了物理内存页，并且把硬盘数据复制了进来，但我们并没有把这个物理内存页和线性地址空间的内存页进行映射，也就是没建立相关的**页表**。


    ![](media/file265.webp "fig:")


    建立页表的映射，由于 Linux 0.11 使用的是二级页表，所以实际上就是写入**页目录项**和**页表项**的过程，我把 **put_page** 函数简化了一下，只考虑页目录项还不存在的场景。


    ```

    [](#cb266-1)// memory.c

    [](#cb266-2)unsigned long put_page(unsigned long page,unsigned long address) {

    [](#cb266-3)    unsigned long tmp, *page_table;

    [](#cb266-4)    // 找到页目录项

    [](#cb266-5)    page_table = (unsigned long *) ((address>>20) & 0xffc);

    [](#cb266-6)    // 写入页目录项

    [](#cb266-7)    tmp = get_free_page();

    [](#cb266-8)    *page_table = tmp|7;

    [](#cb266-9)    // 写入页表项

    [](#cb266-10)    page_table = (unsigned long *) tmp;

    [](#cb266-11)    page_table[(address>>12) & 0x3ff] = page | 7;

    [](#cb266-12)    return page;

    [](#cb266-13)}

    ```


    大家可以结合页目录表和页表的数据结构看一下，很简单，就是个计算过程。


    关于页目录表和页表这些**分页**相关的知识，可以回顾之前的 [第9回 | Intel 内存管理两板斧：分段与分页](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247499821&idx=1&sn=df90a7c57607bf501b5ef535f8440d98&chksm=c2c5ba80f5b233969bf591f919107e28e7be51f066821cba1ea39bf19cc0332b95b94d29467d&scene=21#wechat_redirect)，这里就不再赘述。


    ### 缺页中断返回


    好了，这就是整个缺页中断处理的过程，本质上就是加载硬盘对应位置的数据，然后建立页表的过程。


    ```

    [](#cb267-1)// memory.c

    [](#cb267-2)// address 缺页产生的线性地址 0x8000000

    [](#cb267-3)void do_no_page(unsigned long address) {

    [](#cb267-4)    // 线性地址的页面地址 0x8000000

    [](#cb267-5)    address &= 0xfffff000;

    [](#cb267-6)    // 计算相对于进程基址的偏移 0

    [](#cb267-7)    unsigned long tmp = address - current->start_code;

    [](#cb267-8)    // 寻找空闲的一页内存

    [](#cb267-9)    unsigned long page = get_free_page();

    [](#cb267-10)    // 计算这个地址在文件中的哪个数据块 1

    [](#cb267-11)    int block = 1 + tmp/BLOCK_SIZE;

    [](#cb267-12)    // 一个数据块 1024 字节，所以一页内存需要读 4 个数据块

    [](#cb267-13)    int nr[4];

    [](#cb267-14)    for (int i=0 ; i<4 ; block++,i++)

    [](#cb267-15)        nr[i] = bmap(current->executable,block);

    [](#cb267-16)    bread_page(page,current->executable->i_dev,nr);

    [](#cb267-17)    ...

    [](#cb267-18)    // 完成页表的映射

    [](#cb267-19)    put_page(page,address);

    [](#cb267-20)}

    ```


    再回过头看整个代码，是不是清晰了不少？


    好，那我们再往上看，我们之前是在进程 2 里执行了 execve 函数将程序替换成 /bin/sh，也就是 shell 程序。


    ```

    [](#cb268-1)// main.c

    [](#cb268-2)void init(void) {

    [](#cb268-3)    ...

    [](#cb268-4)    if (!(pid=fork())) {

    [](#cb268-5)        close(0);

    [](#cb268-6)        open("/etc/rc",O_RDONLY,0);

    [](#cb268-7)        execve("/bin/sh",argv_rc,envp_rc);

    [](#cb268-8)        _exit(2);

    [](#cb268-9)    }

    [](#cb268-10)    ...

    [](#cb268-11)}

    ```


    execve 函数返回后，CPU 就跳转到 /bin/sh 程序的第一行开始执行，但由于跳转到的线性地址不存在，所以引发了今天我们讲的**缺页中断**，把硬盘里
    /bin/sh 所需要的内容加载到了内存，此时缺页中断返回。


    返回后，CPU 会再次尝试跳转到 0x8000000 这个线性地址，此时由于缺页中断的处理结果，**使得该线性地址已有对应的页表进行映射**，所以顺利地映射到了物理地址，也就是
    /bin/sh 的代码部分（从硬盘加载过来的），那接下来就终于可以执行 /bin/sh 程序，也就是 shell 程序了。


    那这个 shell 程序到底是啥呢？他的代码并不在 Linux 0.11 的源码里，所以我们的重点将不是分析它的源码，仅仅了解它的原理即可。


    欲知后事如何，且听下回分解。


    * * *


