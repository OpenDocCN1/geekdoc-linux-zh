    \ 8M 大小吧。如果内存为 8M，`memory_end` 就是 `8*1024*1024`，也就只会倒数第二个分支，那么 `buffer_memory_end`\
    \ 就为 `2*1024*1024`，那么 `main_memory_start` 也为 `2*1024*1024`。你仔细看看代码逻辑，看是不是这样？当然，你不愿意细想也没关系，上述代码执行后就是如下效果。你看，其实就是定了三个箭头指向的地址的三个边界变量。具体主内存区是如何管理和分配的，要看\
    \ `mem_init` 里做了什么：\n\n```c\nvoid main(void) {\n    ...\n    mem_init(main_memory_start,\
    \ memory_end);\n    ...\n}\n```\n\n而缓冲区是如何管理和分配的，就要看 `buffer_init` 里干了什么：\n\n\
    ```c\nvoid main(void) {\n    ...\n    buffer_init(buffer_memory_end);\n    ...\n\
    }\n```\n\n不过我们今天只看主内存是如何管理的，很简单，放轻松。进入 `mem_init` 函数：\n\n```c\n#define LOW_MEM\
    \ 0x10000 // 0x10000（十六进制）\n#define PAGE_SIZE 4096\n#define NUM_PAGES ((end -\
    \ LOW_MEM) / PAGE_SIZE)\n\nvoid mem_init(int start, int end) {\n    int i;\n \
    \   for (i = 0; i < NUM_PAGES; i++) {\n        if (i * PAGE_SIZE + LOW_MEM < start)\
    \ {\n            // skip\n        } else {\n            mem_map[i] = 1; // mark\
    \ as used\n        }\n    }\n}\n```\n*(注：由于原文未提供 `mem_init` 具体实现，此处根据上下文逻辑补全以示意)*\n\
    \n"
