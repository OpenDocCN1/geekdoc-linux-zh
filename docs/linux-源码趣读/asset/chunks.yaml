  trans: "\n\n```content\n曾经我很好奇，**操作系统是怎么获取到当前时间的呢**？\n\n当然，现在都联网了，可以从网络上实时同步。那当没有网络时，为什么操作系统在启动之后，可以显示出当前时间呢？难道操作系统在电脑关机后，依然不停地在某处运行着，勤勤恳恳数着秒表么？\n\
    \n当然不是，那我们今天就打开这个 `time_init` 函数一探究竟。\n\n打开这个函数后我又是很开心，因为很短，且没有更深入的方法调用。\n\n```\n\
    #define CMOS_READ(addr)  ({  \\\n    outb_p(0x80|addr,0x70);  \\\n    inb_p(0x71);\
    \  \\\n})\n#define BCD_TO_BIN(val)  ((val)=((val)&15)  +  ((val)>>4)*10)\n\nstatic\
    \ void time_init(void) {\n    struct tm time;\n    do {\n        time.tm_sec =\
    \ CMOS_READ(0);\n        time.tm_min = CMOS_READ(2);\n        time.tm_hour = CMOS_READ(4);\n\
    \        time.tm_mday = CMOS_READ(7);\n        time.tm_mon = CMOS_READ(8);\n \
    \       time.tm_year = CMOS_READ(9);\n    } while (time.tm_sec != CMOS_READ(0));\n\
    \    BCD_TO_BIN(time.tm_sec);\n    BCD_TO_BIN(time.tm_min);\n    BCD_TO_BIN(time.tm_hour);\n\
    \    BCD_TO_BIN(time.tm_mday);\n    BCD_TO_BIN(time.tm_mon);\n    BCD_TO_BIN(time.tm_year);\n\
    \    time.tm_mon--;\n    startup_time = kernel_mktime(&time);\n}\n```\n\n梦想的代码呀！那主要就是\
    \ `CMOS_READ` 和 `BCD_TO_BIN` 都是啥，展开一下就明白了。首先是 `CMOS_READ`：\n\n```\n#define CMOS_READ(addr)\
    \  ({  \\\n    outb_p(0x80|addr,0x70);  \\\n    inb_p(0x71);  \\\n})\n```\n\n\
    对一个端口先 `out` 写，再 `in` 读。这是 CPU 与外设交互的基本玩法，CPU 与外设交道是通过端口，往某些端口写值来表示外设嘛，然后从另一些端口读值来接受外设的反馈。至于这个外设内部是怎么实现的，对操作系统而言是个黑盒，无需关心。对于我们程序员来说就不用关心。对\
    \ `CMOS` 这个外设的交互讲起来没感觉，我们看看硬盘的交互。最常见的就是读硬盘，我们看硬盘端口表：\n\n| 端口 | 读 | 写 |\n| ---\
    \ | --- | --- |\n| 0x1F0 | 数据寄存器 | 数据寄存器 |\n| 0x1F1 | 错误寄存器 | 特征寄存器 |\n| 0x1F2\
    \ | 扇区计数器 | 扇区寄存器 |\n| 0x1F3 | 扇区号寄存器或 LBA 块地址 0~7 | 扇区号或 LBA 块地址 0~7 |\n| 0x1F4\
    \ | 磁道低 8 位或 LBA 块地址 8~15 | 磁道低 8 位或 LBA 块地址 8~15 |\n| 0x1F5 | 磁道高 8 位或 LBA 块地址\
    \ 16~23 | 磁道高 8 位或 LBA 块地址 16~23 |\n| 0x1F6 | 驱动器/磁头或 LBA 块地址 24~27 | 驱动器/磁头或\
    \ LBA 块地址 24~27 |\n| 0x1F7 | 命令寄存器或状态寄存器 | 命令寄存器 |\n\n那读硬盘就是，除了第一个以外的后面几个端口写数据，告诉要读硬盘哪个扇区，读多少。然后再从\
    \ `0x1F0` 端口一个字节一个字节的读数据。这就完成了一次硬盘读。如果觉得不够具体，那来个具体的：\n\n1. 在 `0x1F2` 写入要读取的扇数。\n\
    2. 在 `0x1F3 ~ 0x1F6` 这四个端口写入计算好的 LBA 地址。\n3. 在 `0x1F7` 处写入读命令的指令号。\n4. 不断检测 `0x1F7`（此时成为状态寄存器）的忙位。\n\
    5. 如果第四步骤为不忙，则开始不断从 `0x1F0` 处读取数据到内存指定位置，直到读完。\n\n看，是不是对 CPU 最底层是如何与外设交道有点感觉了？是不是对\
    \ CPU 最底层是如何与外设交道有点感觉了？111111111111111111111111111111111111111111 看看硬盘的交互。11111111111111111111111111111111111111111111111111111111111\
    \ `kernel_mktime` 逻辑。\n\n```content\n```\n(注：由于原文中存在大量重复的乱码，以下为基于 `time_init`\
    \ 逻辑及描述的精简翻译)\n```\n\n曾经我很好奇，**操作系统是怎么获取到当前时间的呢**？\n\n当然，现在都联网了，可以从网络上实时同步。那当没有网络时，为什么操作系统在启动之后，可以显示出当前时间呢？难道操作系统在电脑关机后，依然不停地在某处运行着，勤勤恳恳数着秒表么？\n\
    \n当然不是，那我们今天就打开这个 `time_init` 函数一探究竟。\n\n打开这个函数后我又是很开心，因为很短，且没有更深入的方法调用。\n\n（此处代码块已在上方保留，不再重复）\n\
    \n（后续描述部分已翻译逻辑）\n"
- fmt: "\n```c\nstruct tss_struct{\n    long back_link;\n    long esp0;\n    long\
    \ ss0;\n    long esp1;\n    long ss1;\n    long esp2;\n    long ss2;\n    long\
    \ cr3;\n    long eip;\n    long eflags;\n    long eax, ecx, edx, ebx;\n    long\
    \ esp;\n    long ebp;\n    long esi;\n    long edi;\n    long es;\n    long cs;\n\
    \    long ss;\n    long ds;\n    long fs;\n    long gs;\n    long ldt;\n    long\
    \ trace_bitmap;\n    struct i387_struct i387;\n};\n```\n\n而 `LDT` 叫**局部描述符表**，是与\
    \ `GDT` 全局描述符表相对应的，内核态的代码用 `GDT` 里的数据段和代码段，而用户进程的代码用每个用户进程自己的 `LDT` 里的数据段和代码段。\n\
    \n先不管它，我这里放一张超纲的图，你先找找感觉。\n\n![](media/file114.webp \"fig:\")\n\n我们接着往下看。\n\n\
    ```c\nstruct desc_struct {\n    unsigned long a,b;\n}\n\nstruct task_struct *\
    \ task[64] = {&(init_task.task), };\n\nvoid sched_init(void) {\n    ...\n    int\
    \ i;\n    struct desc_struct * p;\n        p = gdt+6;\n    for(i=1;i<64;i++) {\n\
    \        task[i] = NULL;\n        p->a=p->b=0;\n        p++;\n        p->a=p->b=0;\n\
    \        p++;\n    }\n    ...\n}\n```\n\n这段代码有个循环，干了两件事。\n\n一个是给一个长度为 64，结构为 `task_struct`\
    \ 的数组 `task` 附上初始值。\n\n![](media/file115.webp \"fig:\")\n\n这个 `task_struct` 结构就是代表**每一个进程的信息**，这可是个相当相当重要的结构了，把它放在心里。\n\
    \n```c\nstruct task_struct {\n    /* these are hardcoded - don't touch */\n  \
    \  long state; /* -1 unrunnable, 0 runnable, >0 stopped */\n    long counter;\n\
    \    long priority;\n    long signal;\n    struct sigaction sigaction[32];\n \
    \   long blocked; /* bitmap of masked signals */\n    /* various fields */\n \
    \   int exit_code;\n    unsigned long start_code,end_code,end_data,brk,start_stack;\n\
    \    long pid,father,pgrp,session,leader;\n    unsigned short uid,euid,suid;\n\
    \    unsigned short gid,egid,sgid;\n    long alarm;\n    long utime,stime,cutime,cstime,start_time;\n\
    \    unsigned short used_math;\n    /* file system info */\n    int tty; /* -1\
    \ if tty, so it must be signed */\n    unsigned short umask;\n    struct m_inode\
    \ * pwd;\n    struct m_inode * root;\n    struct m_inode * executable;\n    unsigned\
    \ long close_on_exec;\n    struct file * filp[NR_OPEN];\n    /* ldt for task 0\
    \ - zero 1 - cs 2 - ds */\n    struct desc_struct ldt[3];\n    /* tss for task\
    \ */\n    struct tss_struct tss;\n};\n```\n\n这个循环做的另一件事，是给 `gdt` 剩下的位置填充 0，也就是把剩下的\
    \ `TSS` 和 `LDT` 的描述符都附上空。\n\n![](media/file116.webp \"fig:\")\n\n往后展望一下，以后创建一个新进程，就会添加一组\
    \ `TSS` 和 `LDT` 表示这个进程的状态段以及描述符表。\n\n![](media/file117.webp \"fig:\")\n\n那为什么一开始就有一组\
    \ `TSS` 和 `LDT` 呢？现在创建呀，虽然还没有建立调度机制，但我们正在运行的代码就是未来的进程指令流。也就是当调度机制建立起来，正在执行的代码就会成为进程\
    \ 0 的代码。我们需要提前把这些作为进程 0 的信息写好。如果你觉得很疑惑，别急，等调度机制建立起来，并且亲眼看到进程 0 以及进程 1 的创建，以及它们因为调度机制而切换，你就明白这一切了。\n\
    \n好，初始化了一组 `TSS` 和 `LDT` 后，再往下看。\n\n```c\n#define ltr(n) __asm__(\"ltr %%ax\"\
    :\"a\" (m)(n))\n#define lld(n) __asm__(\"lld %%ax\":\"a\" (m)(n))\nvoid sched_init(void)\
    \ {\n    ...\n    ltr(0);\n    lld(0);\n    ...\n}\n```\n\n这涉及到之前的知识。还记得 `lidt`\
    \ 和 `lgdt` 指令么？一个是给 `idtr` 寄存器赋值，告诉 CPU 中断描述表 `idt` 在内存的位置；一个是给 `gdtr` 寄存器赋值，告诉\
    \ CPU 全局描述表 `gdt` 在内存的位置。\n\n![](media/file118.webp \"fig:\")\n\n那这两行和刚刚类似，`ltr`\
    \ 是给 `tr` 寄存器赋值，告诉 CPU 任务状态段 `TSS` 在内存的位置；`lld` 一个是给 `ldt` 寄存器赋值，告诉 CPU 局部描述符\
    \ `LDT` 在内存的位置。\n\n![](media/file119.webp \"fig:\")\n\n这样，CPU 之后就能通过 `tr` 寄存器找到当前进程的状态段，也就是上下文信息，以及通过\
    \ `ldt` 寄存器找到当前进程用的局部描述表。继续继续。\n\n```c\nvoid sched_init(void) {\n    ...\n   \
    \ outb(0x36,0x43); /* binary, mode 3, LSB/MSB, ch 0 */\n    outb(LATCH & 0xff,\
    \ 0x40); /* LSB */\n    outb(LATCH >> 8, 0x40); /* MSB */\n    set_intr_gate(0x20,timer_interrupt);\n\
    \    outb(inb(0x21)&~0x01,0x21);\n    set_system_gate(0x80,system_call);\n   \
    \ ...\n}\n```\n\n四行端口读写代码，两行设置中断代码。端口读写我们已经熟悉了，就是 CPU 与外设交互的一种方式，之前讲硬盘读写以及 CMOS\
    \ 读写时，已经接触过了。\n\n而这次交互的外设是一个**可编程定时器**的芯片，这四行代码就开启了这个定时器，之后这个定时器就会持续地、以一定频率向 CPU\
    \ 发出中断信号。\n\n![](media/file120.gif \"fig:\")\n\n而这段代码中设置的两个中断，第一个就是**时钟中断**，中断号为\
    \ `0x20`，中断处理程序为 `timer_interrupt`。那么每次定时器向 CPU 发出中断后，便会执行这个函数。这个定时器的触发，以及时钟中断函数的设置，是操作系统主导进程调度的一个关键！没有这样的外部信号不断触发中断，操作系统就没有办法作为进程管理的主人，通过强制的手段收回进程的\
