    这就是**写时复制（Copy-on-Write）**的基础。在 Linux 0.11 的设计中，进程 0 创建进程 1 时，复制了 **160** 个页表项。进程
    1 创建进程 2 时，复制了 **1024** 个页表项。之后进程 2 创建进程 3，进程 3 创建进程 4，通通都是复制 1024 个页表项。


