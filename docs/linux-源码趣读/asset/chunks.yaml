  trans: "\n\n没错，就是这么折腾了一下。现在，操作系统最开头的代码，已经被挪到了 `0x90000` 这个位置了。\n\n再往后是一个**跳转**指令。\n\
    \n```\njmpi go,0x9000\ngo: \n  mov ax,cs\n  mov ds,ax\n```\n\n仔细想想或许你能猜到它想干嘛。\n\
    \n`jmpi` 是一个**段间跳转指令**，表示跳转到 `0x9000:go` 处执行。\n\n还记得上一讲说的 **段基址 : 偏移地址** 这种格式的内存地址要如何计算吧？段基址仍然要先左移四位，因此结论就是跳转到\
    \ `0x90000 + go` 这个内存地址处执行。忘记的赶紧回去看看，这才过了一回哦，要稳扎稳打。\n\n再说 `go`，`go` 就是一个**标签**，最终编译成机器码的时候会被翻译成一个值，这个值就是\
    \ `go` 这个标签在文件内的偏移地址。\n\n这个偏移地址加上 `0x90000`，就是 `go` 标签后面那段代码 `mov ax,cs` 此时所在的内存地址了。\n\
    \n![](img/file10.webp \"fig:\")\n\n那假如 `mov ax,cx` 这行代码位于最终编译好后的二进制文件的 `0x08`\
    \ 处，那 `go` 就等于 `0x08`，而最终 CPU 跳转到的地址就是 `0x90008` 处。\n\n所以到此为止，前两回的内容，其实就是一段 **512**\
    \ 字节的代码和数据，从硬盘的启动区先被移动到了内存 `0x7c00` 处，然后又立刻被移动到 `0x90000` 处，并且跳转到此处往后再稍稍偏移 `go`\
    \ 这个标签所代表的偏移地址处，也就是 `mov ax,cs` 这行指令的位置。\n\n仍然是保持每回的简洁，本文就讲到这里，希望大家还跟得上，接下来的下一回，我们就把目光定位到\
    \ `go` 标签处往后的代码，看看他又要折腾些什么吧。\n\n后面的世界越来越精彩，欲知后事如何，且听下回分解。\n\n## ------- 本回扩展与延伸\
    \ -------\n\n有关**寄存器**的详细信息，可以参考 Intel 手册：\n\nVolume 1 Chapter 3.2 OVERVIEW OF\
    \ THE BASIC EXECUTION ENVIRONMEN\n\n如果想了解**汇编指令**的信息，可以参考 Intel 手册：\n\nVolume\
    \ 2 Chapter 3 ~ Chapter 5\n\n比如本文出现的 `sub` 指令，你完全没必要去百度它的用法，直接看手册。\n\n![](img/file11.webp\
    \ \"fig:\")\n\nIntel 手册对于理解底层知识非常直接有效，但却没有很好的中文翻译版本，因此让许多人望而生畏，只能去看一些错误百出的中文二手资料和博客。因此我也发起了一个\
    \ **Intel 手册翻译计划**，就在阅读原文的 GitHub 里，感兴趣的同胞们可以参与进来，我们共同完成一份伟大的事。\n\n![](img/file12.webp\
    \ \"fig:\")\n\n希望你跟完整个系列，收获的不仅仅是 Linux 0.11 源码的了解，更是自己探索问题和寻找答案的一个科学思考方式。\n\n\
    所以每次**本回扩展与延伸**这里，希望你也能每天进步一点点，实践起来，再不济，也能多学几个英语单词不是？\n\n***\n\n## 第 3 回 做好最最基础的准备工作\n\
    \n> 原文链接: [`mp.weixin.qq.com/s/90QBJ-lP_-du2qQJxNF-Fw`](https://mp.weixin.qq.com/s/90QBJ-lP_-du2qQJxNF-Fw)\n\
    \n书接上回，上回书咱们说到，操作系统的代码最开头的 512 字节的数据，从硬盘的启动区先是被移动到了内存 `0x7c00` 处，然后又立刻被移动到 `0x90000`\
    \ 处，并且跳转到此处往后再稍稍偏移 `go` 这个标签所代表的偏移地址处。\n\n![](img/file13.webp \"fig:\")\n\n那我们接下来，就继续把我们的目光放在\
    \ `go` 这个标签的位置，跟着 CPU 的步伐往后看。\n\n```\ngo: mov ax,cs\n    mov ds,ax\n    mov es,ax\n\
    \    mov ss,ax\n    mov sp,#0xFF00\n```\n\n全都是 `mov` 操作，那好办了。\n\n这段代码的直接意思很容易理解，就是把\
    \ `cs` 寄存器的值分别复制给 `ds`、`es` 和 `ss` 寄存器，然后又把 `0xFF00` 给了 `sp` 寄存器。\n\n回顾下 CPU 寄存器图。\n\
    \n![](img/file14.webp \"fig:\")\n\n`cs` 寄存器表示**代码段寄存器**，CPU 当前正在执行的代码在内存中的位置，就是由\
    \ `cs:ip` 这组寄存器配合指向的，其中 `cs` 是基址，`ip` 是偏移地址。\n\n由于之前执行过一个段间跳转指令，还记得不？\n\n```\n\
    jmpi go,0x9000\n```\n\n所以现在 `cs` 寄存器里的值就是 `0x9000`，`ip` 寄存器里的值是 `go` 这个标签的偏移地址。那这三个\
    \ `mov` 指令就分别给 `ds`、`es` 和 `ss` 寄存器赋值为了 `0x9000`。\n\n`ds` 为数据段寄存器，之前我们说过了，当时它被复制为\
    \ `0x07`，现在赋值为 `0x9000`。\n\n`ss` 寄存器赋值为 `0x9000`。\n\n`es` 是扩展段寄存器，仅仅是个扩展，不是主角，先不用它。\n\
    \n`ss` 为栈段寄存器，后面要配合 `sp` 寄存器来表示栈顶地址。而此时 `sp` 寄存器被赋值为了 `0xFF00`，所以目前的栈顶地址就是 `ss:sp`\
    \ 所指向的 `0xFF00` 处。\n\n![](img/file15.webp \"fig:\")\n\n其实到这里，操作系统的一些最最基础的工作工作就做好了。都做了些啥呢？\n\
    \n**第一**，代码从硬盘移到内存，放在 `0x90000` 处。\n\n**第二**，数据段寄存器 `ds` 和代码段寄存器 `cs` 都设置为了 `0x9000`，方便跳转和内存访问，奠定了内存基址。\n\
    \n**第三**，栈顶地址设置为了 `0xFF00`，栈段寄存器 `ss` 为 `0x9000`，栈基址寄存器 `sp` 为 `0xFF00`，这也是为什么栈顶设置为这个值的原因。\n\
    \n做好这些基础工作，总结一下，把代码段寄存器 `cs`、数据段寄存器 `ds`、栈段寄存器 `ss` 和栈基址寄存器 `sp` 分别设置好了，方便后续使用。\n\
    \n## 第 4 回 把硬盘里的部分放到内存\n\n> 原文链接: [`mp.weixin.qq.com/s/90QBJ-lP_-du2qQJxNF-Fw`](https://mp.weixin.qq.com/s/90QBJ-lP_-du2qQJxNF-Fw)\n\
    \n书接上回，上回书咱们说到，操作系统的的一些最最基础的准备工作已经准备好了。\n\n![](img/file13.webp \"fig:\")\n\n如这张图所示，此时操作系统短短行代码，将数据段寄存器\
    \ `ds` 和代码段寄存器 `cs` 设置为了 `0x9000`，方便跳转与内存访问。并且将栈顶地址 `ss:sp` 设置在了离代码 `0x90000`\
    \ 遥远的 `0xFF00` 处，保证不会冲突。简单说，就是设置了如何访问数据段，如何访问代码段，以及如何访问栈顶指针，即初步做了一次内存规划，从 CPU\
    \ 的角度看，访问内存就这么三块而已。\n\n![](img/file19.webp \"fig:\")\n\n做好这些基础工作，接下来就该折腾其他了。接着往下：\n\
    \n```\nload_setup:\n    mov dx,#0x0000      ; drive 0, head 0\n    mov cx,#0x0002\
    \      ; sector 2, track 0\n    mov bx,#0x0200      ; address = 512, in 0x9000\n\
    \    mov ax,#0x0200+4    ; service 2, nr of sectors\n    int 0x13            ;\
    \ read it\n    jnc load_setup       ; continue\n    mov dx,#0x0000      ; reset\
    \ diskette\n    mov ax,#0x0000      \n    int 0x13\n    jmp load_setup\n\nok_setup:\n\
    \    ...\n```\n\n这里有两个 `int` 指令还没见过。注意 `int` 是汇编指令，不是高级语言。`int 0x13` 表示发起 `0x13`\
    \ 号中断，这条指令上面 `dx`、`cx`、`ax` 的赋值都是这个中断程序的参数。如果你不理解，先不要管，可以看之前的文章：[认真聊中断](http://mp.weixin.qq.com/s?__biz=Mzk0MjE30==mid=224798208&idx=1&sn=784f8b4e62ebdb9810d194fdb80chksm=c25834df5b20a5dee3102bfc61c0eb46da32bfabeef780c309f1c8543e1a5981&scene=21wechat_redirect)。总之这个中断发起后，CPU\
    \ 会通过这个中断号寻找对应的中断程序入口地址并跳转过去，逻辑上相当于执行了一个函数。而 `0x13` 号中断的处理程序是 BIOS 提前写好的，是读取磁盘的相关函数。\n\
    \n之后真正进入内核后，中断处理程序是我们需要自己重新写的。在后面的章节中，你会看到各个模块注册自己的中断处理程序，所以不要急。此时为了方便先用 BIOS\
    \ 提前写好的程序。可见即便是操作系统的源码，有时也需要调用现成的函数，并不是完全从头造。本段代码的注释已经很明确了，直接说最终的作用是将硬盘的第 2 个扇区开始，把数据加载到内存\
    \ `0x90200` 处，共加载 4 个扇区，图示就是。\n\n![](img/file21.webp \"fig:\")\n\n为了图片清晰，可能就不那么严谨了，大家不必纠结。可以看到，如果复制成功，就跳转到\
    \ `ok_load_setup` 这个标签；如果失败，则会重试。\n\n"
- fmt: "\n还有一种人，就是把这几讲的内容想得特别简单，这几讲确实就是复制硬盘数据和内存数据为主，但这就是操作系统呀！它就是不断通过这样简简单单的动作，把自己一点一点搞复杂的呢。\n\
    \n首先它靠 `BIOS` 做了第一步加载动作，然后就可以用加载的这 512 字节，去加载更多在硬盘中的代码和数据，那整个过程就自己把自己加载完整了，你不觉得这个过程也很伟大和奇妙么？会不会解答了你之前一直困惑的什么东西呢？\n\
    \n多想想，多看看每回的扩展部分和延伸部分。\n\n***\n\n## 第5回 进入保护模式前的最后一次折腾内存\n\n> 原文链接: [https://mp.weixin.qq.com/s/5s_nmrWRZbA_4mkNKOQ2Cg](https://mp.weixin.qq.com/s/5s_nmrWRZbA_4mkNKOQ2Cg)\n\
    \n书接上回，上回书咱们说到，操作系统已经完成了各种从硬盘到内存的加载，以及内存到内存的复制。\n\n![](media/file25.webp \"fig:\"\
    )\n\n至此，整个 `bootsect.s` 的使命就完成了，也是我们品读完的第一个操作系统源码文件。之后便跳转到了 `0x90200` 这个位置开始执行，这个位置处的代码就是位于\
    \ `setup.s` 的开头，我们接着来看。\n\n```\nstart:\n    mov ax,#0x9000  ; this is done in\
    \ bootsect already, but...\n    mov ds,ax\n    mov ah,#0x03    ; read cursor pos\n\
    \    xor bh,bh\n    int 0x10        ; save it in known place, con_init fetches\n\
    \    mov [0],dx      ; it from 0x90000.\n```\n\n又有个 `int` 指令。\n\n前面的文章好好看过的话，一下就能猜出它要干嘛。还记不记得之前有个\
    \ `int 0x13` 表示触发 `BIOS` 提供的读磁盘中断程序？这个 `int 0x10` 也是一样的，它也是触发 `BIOS` 提供的显示服务中断处理程序，而\
    \ `ah` 寄存器被赋值为 `0x03` 表示显示服务里具体的读取光标位置功能。\n\n具体 `BIOS` 提供了哪些中断服务，如何去调用和获取返回值，请大家自行寻找资料，这里只说结果。\n\
    \n这个 `int 0x10` 中断程序执行完毕并返回时，`dx` 寄存器里的值表示光标的位置，具体说来其高八位 `dh` 存储了行号，低八位 `dl` 存储了列号。\n\
    \n![](media/file26.webp \"fig:\")\n\n这里说明一下：计算机在加电自检后会自动初始化到文字模式，在这种模式下，一屏幕可以显示\
    \ 25 行，每行 80 个字符，也就是 80 列。\n\n那下一步 `mov [0],dx` 就是把这个光标位置存储在 `[0]` 这个内存地址处。注意，前面我们说过，这个内存地址仅仅是偏移地址，还需要加上\
    \ `ds` 这个寄存器里存储的段基址，最终的内存地址是在 `0x90000` 处，这里存放着光标的位置，以便之后在初始化控制台的时候用到。\n\n所以从这里也可以看出，这和我们平时调用一个方法没什么区别，只不过这里的寄存器的用法相当于入参和返回值，这里的\
    \ `0x10` 中断号相当于方法名。\n\n这里又应了之前说的一句话，操作系统内核的最开始也处处都是 `BIOS` 的调包侠，有现成的就用呗。\n\n再接下来的几行代码，都是和刚刚一样的逻辑，调用一个\
    \ `BIOS` 中断获取点什么信息，然后存储在内存中某个位置，我们迅速浏览一下就好咯。\n\n```\n比如获取内存信息。\n; Get memory size\
    \ (extended mem, kB)\n    mov ah,#0x88\n    int 0x15\n    mov [2],ax\n获取显卡显示模式。\n\
    ; Get video-card data:\n    mov ah,#0x0f\n    int 0x10\n    mov [4],bx      ;\
    \ bh = display page\n    mov [6],ax      ; al = video mode, ah = window width\n\
    检查显示方式并取参数\n; check for EGA/VGA and some config parameters\n    mov ah,#0x12\n\
    \    mov bl,#0x10\n    int 0x10\n    mov [8],ax\n    mov [10],bx\n    mov [12],cx\n\
    获取第一块硬盘的信息。\n; Get hd0 data\n    mov ax,#0x0000\n    mov ds,ax\n    lds si,[4*0x41]\n\
    \    mov ax,#INITSEG\n    mov es,ax\n    mov di,#0x0080\n    mov cx,#0x10\n  \
    \  rep\n    movsb\n获取第二块硬盘的信息。\n; Get hd1 data\n    mov ax,#0x0000\n    mov ds,ax\n\
    \    lds si,[4*0x46]\n    mov ax,#INITSEG\n    mov es,ax\n    mov di,#0x0090\n\
    \    mov cx,#0x10\n    rep\n    movsb\n```\n\n以上原理都是一样的。\n\n我们就没必要细琢磨了，对操作系统的理解作用不大，只需要知道最终存储在内存中的信息是什么，在什么位置，好了，之后会用到他们的。\n\
    \n| 内存地址 | 长度(字节) | 名称 |\n| --- | --- | --- |\n| 0x90000 | 2 | 光标位置 |\n| 0x90002\
    \ | 2 | 扩展内存数 |\n| 0x90004 | 2 | 显示页面 |\n| 0x90006 | 1 | 显示模式 |\n| 0x90007 | 1\
    \ | 字符列数 |\n| 0x90008 | 2 | 未知 |\n| 0x9000A | 1 | 显示内存 |\n| 0x9000B | 1 | 显示状态\
    \ |\n| 0x9000C | 2 | 显卡特性参数 |\n| 0x9000E | 1 | 屏幕行数 |\n| 0x9000F | 1 | 屏幕列数 |\n\
    | 0x90080 | 16 | 硬盘1参数表 |\n| 0x90090 | 16 | 硬盘2参数表 |\n| 0x901FC | 2 | 根设备号 |\n\
    \n由于之后就会用 c 语言进行编程，虽然汇编也可以用变量进行传递，但这需要编译器链接时做一些额外的工作，所以这么多数据方便的双方共同约定一个内存地址，我这里存，你那里取。好了，把这些信息存储好之后，操作系统要做什么呢？继续看。\n\
    \n```\ncli\n```\n\n一行 `cli` 表示关闭中断。因为后面我们要把原本是 `BIOS` 写好的中断表给覆盖掉，也就是破坏掉了，写上自己的中断表，所以这个时候是不允许中断来的。继续看。\n\
    \n```\n; first we move the system to its rightful place\n    mov ax,#0x0000\n\
    \    cld         ; 'direction'=0, movs forward\ndo_move:\n    mov es,ax      ;\
    \ destination segment\n    add ax,#0x1000\n    cmp ax,#0x9000\n    jz  end_move\n\
    \    mov ds,ax      ; source segment\n    sub di,di\n    sub si,si\n    mov cx,#0x8000\n\
    \    rep movsw\n    jmp do_move\nend_move:\n    ...\n```\n\n看到后面那个 `rep movsw`\
    \ 熟悉了吗？一开始把操作系统代码从 `0x7c00` 移动到 `0x90000` 的时候用的这个指令，回忆一下。\n\n![](media/file27.webp\
    \ \"fig:\")\n\n同前面的原理一样，也是做了内存操作，最终的结果是把内存地址 `0x1000` 处往后一直到 `0x90000` 的内容，统统复制到内存的最开始，大概这么效果。\n\
    \n![](media/file28.webp \"fig:\")\n\n由于各种加载和复制导致内存看起来很乱，时候进行一波整理，我们重新梳理一下此时的内存布局。栈地址仍然是\
    \ `0xff00` 没有改变。\n\n`0x90000` 开始上的位置，原来是 `bootsect` 和 `setup` 的代码，`bootsect` 的一部分已经被操作系统为了记录内存、显卡等临时数据覆盖了一部分。内存最开始的\
    \ `0` 到 `0x80000` 这 512K 被 `system` 模块给占用了，之前讲过，这个 `system` 模块除了 `bootsect` 和\
    \ `setup` 之外的全部链接在一起，可以理解为操作系统的全部。现在的内存布局就是这个样子。\n\n![](media/file29.webp \"fig:\"\
    )\n\n好了，记住上面的图就好了，重新清晰了吗？之前的 `0x7c00` 已经是过去式了，赶紧忘掉，向前看！接下来就要进行有点含量的工作了，那就是模式的转换，需要从现在的\
    \ 16 位的实模式转变为之后 32 位的保护模式，这是一项大工程！也是操作系统旅程中第一个精彩的地方，大家做好准备后面的世界越来越精彩，欲知如何，且听分解。\n\
    \n## 扩展与延伸\n\n尝试在文本模式下，用直接写显存的方式把自己的名字输出在屏幕上。实验源码请到 GitHub 上寻找。\n\n***\n\n## 第6回\
    \ 先解决寄存器的包袱\n\n> 原文链接: [https://mp.weixin.qq.com/s/p1a6QxyMpJF_uBSE1Kg](https://mp.weixin.qq.com/s/p1a6QxyMpJF_uSESE1Kg)\n\
    \n书接上回，上回书咱们说到，操作系统又折腾了一下内存，之后的很一段时间内存布局就不会变了，终于稳定下了，目前长样子。\n\n![](media/file30.webp\
    \ \"fig:\")\n\n0 地址开始处存放着操作系统的全部代码，也就是 `system` 模块，`0x90000` 位置处往后的几十个字节存放着设备的信息，方便以后使用。\n\
    \n| 内存地址 | 长度(字节) | 名称 |\n| --- | --- | --- |\n| 0x90000 | 2 | 光标位置 |\n| 0x90002\
    \ | 2 | 扩展内存数 |\n| 0x90004 | 2 | 显示 |\n| 0x90006 | 1 | 显示模式 |\n| 0x90007 | 1 |\
    \ 字符列数 |\n| 0x90008 | 2 | 未知 |\n| 0x9000A | 1 | 显示内存 |\n| 0x9000B | 1 | 显示状态 |\n\
    | 0x9000C | 2 | 显卡特性参数 |\n| 0x9000E | 1 | 屏幕行数 |\n| 0x9000F | 1 | 屏幕列数 |\n| 0x90080\
    \ | 16 | 硬盘1参数表 |\n| 0x90090 | 16 | 硬盘2参数表 |\n| 0x901FC | 2 | 根设备号 |\n\n是不是十分清晰？不过别高兴得太早，清爽的内存布局方便后续操作系统的大显身手！接下来就要进行真正的第一项大工程了，那就是模式的转换，需要从现在的\
    \ 16 位的实模式转变为之后 32 位的保护模式。\n\n当然，虽说是一项非常难啃的大工程，但从代码量看，却是少得可怜，所以不必太过担心。每次讲这里都十分的麻烦，因为这是\
    \ `x86` 的历史包袱问题，现在的 CPU 几乎都是支持 32 位模式甚至 64 位模式了，很少有还仅仅停留在 16 位的实模式下的 CPU。所以我们要为了这个历史包袱，写一段模式转换的代码，如果\
    \ `Intel CPU` 被重新设计而不用考虑兼容性，那么今天的代码将会减少很多甚至不复存在。\n\n所以不用担心，听懂就听懂，听不懂就拉倒，放宽心。我不打算翻译，这里是模式转换的代码逻辑：\n\
    \n```\n; 这里的模式转换代码逻辑\n```\n"
