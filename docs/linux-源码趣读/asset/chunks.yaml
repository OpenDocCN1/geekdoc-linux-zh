    [](#cb236-4)    ...\n[](#cb236-5)}\n```\n\n**open**\n\n接下来 open 函数以只读形式打开了一个叫\
    \ /etc/rc 的文件，刚好占据了 0 号文件描述符的位置。\n\n```\n[](#cb237-1)void init(void) {\n[](#cb237-2)\
    \    ...\n[](#cb237-3)    if (!(pid=fork())) {\n[](#cb237-4)        ...\n[](#cb237-5)\
    \        open(\"/etc/rc\",O_RDONLY,0);\n[](#cb237-6)        ...\n[](#cb237-7)\
    \    }\n[](#cb237-8)    ...\n[](#cb237-9)}\n```\n\n这个 rc 文件表示配置文件，具体什么内容，取决于你的硬盘里这个位置处放了什么内容，与操作系统内核无关，所以我们暂且不用管。\n\
    \n此时，进程 2 与进程 1 几乎完全一样，只不过进程 2 通过 close 和 open 操作，将原来进程 1 的指向标准输入的 0 号文件描述符，重新指向了\
    \ /etc/rc 文件。\n\n到目前为止，进程 2 与进程 1 的区别，仅仅是将 0 号文件描述符重新指向了 /etc/rc 文件，其他的没啥区别。\n\
    \n而这个 rc 文件是干嘛的，现在还不用管，肯定是后面 sh 程序要用到的，到时候在说。\n\n**execve**\n\n好，接下来进程 2 就将变得不一样了，会通过一个经典的，也是最难理解的\
    \ execve 函数调用，使自己摇身一变，成为 /bin/sh 程序继续运行，这就是下一章的重点！\n\n```\n[](#cb238-1)void init(void)\
    \ {\n[](#cb238-2)    ...\n[](#cb238-3)    if (!(pid=fork())) {\n[](#cb238-4) \
    \       ...\n[](#cb238-5)        execve(\"/bin/sh\",argv_rc,envp_rc);\n[](#cb238-6)\
    \        ...\n[](#cb238-7)    }\n[](#cb238-8)    ...\n[](#cb238-9)}\n```\n\n这里就包含着操作系统究竟是如何加载并执行一个程序的原理，包括如何从文件系统中找到这个文件，如何解析一个可执行文件（在现代的\
    \ Linux 里称作 ELF 可执行文件），如何讲可执行文件中的代码和数据加载到内存并运行。\n\n加载到内存并运行又包含着虚拟内存等相关的知识。所以这里面的水很深，了解了这个函数，再加上\
    \ fork 函数，基本就可以把操作系统全部核心逻辑都串起来了。\n\n欲知后事如何，且听下回分解。\n\n* * *\n\n## 第35回 | execve\
    \ 加载并执行 shell 程序\n\n> 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502475&idx=1&sn=4fcdbaa03bf6a1ca04db4013309c6aa3&chksm=c2c5b026f5b2393049efca68c429df5038fa0f317eea79fbd9ec2c661c3ec12b47a0701376a7&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502475&idx=1&sn=4fcdbaa03bf6a1ca04db4013309c6aa3&chksm=c2c5b026f5b2393049efca68c429df5038fa0f317eea79fbd9ec2c661c3ec12b47a0701376a7&scene=21#wechat_redirect)\n\
    \n书接上回，上回书咱们说到，进程 1 再次通过 fork 函数创建了进程 2，且进程 2 通过 close 和 open 函数，将 0 号文件描述符指向的标准输入\
    \ /dev/tty0 更换为指向 /etc/rc 文件。\n\n```\n[](#cb239-1)void init(void) {\n[](#cb239-2)\
    \    ...\n[](#cb239-3)    if (!(pid=fork())) {\n[](#cb239-4)        close(0);\n\
    [](#cb239-5)        open(\"/etc/rc\",O_RDONLY,0);\n[](#cb239-6)        execve(\"\
    /bin/sh\",argv_rc,envp_rc);\n[](#cb239-7)        _exit(2);\n[](#cb239-8)    }\n\
    [](#cb239-9)    ...\n[](#cb239-10)}\n```\n\n此时进程 2 和进程 1 几乎是完全一样的。\n\n接下来进程 2\
    \ 就将变得不一样了，会通过一个经典的，也是最难理解的 **execve** 函数调用，使自己摇身一变，成为 **/bin/sh** 程序继续运行！\n\n\
    我们先打开 execve，开一下它的调用链。\n\n```\n[](#cb240-1)static char * argv_rc[] = { \"/bin/sh\"\
    , NULL };\n[](#cb240-2)static char * envp_rc[] = { \"HOME=/\", NULL };\n[](#cb240-3)\n\
    [](#cb240-4)// 调用方\n[](#cb240-5)execve(\"/bin/sh\",argv_rc,envp_rc);\n[](#cb240-6)\n\
    [](#cb240-7)// 宏定义\n[](#cb240-8)_syscall3(int,execve,const char *,file,char **,argv,char\
    \ **,envp)\n[](#cb240-9)\n[](#cb240-10)// 通过系统调用进入到这里\n[](#cb240-11)EIP = 0x1C\n\
    [](#cb240-12)_sys_execve:\n[](#cb240-13)    lea EIP(%esp),%eax\n[](#cb240-14)\
    \    pushl %eax\n[](#cb240-15)    call _do_execve\n[](#cb240-16)    addl $4,%esp\n\
    [](#cb240-17)    ret\n[](#cb240-18)\n[](#cb240-19)// 最终执行的函数\n[](#cb240-20)int\
    \ do_execve(\n[](#cb240-21)        unsigned long * eip,\n[](#cb240-22)       \
    \ long tmp,\n[](#cb240-23)        char * filename,\n[](#cb240-24)        char\
    \ ** argv,\n[](#cb240-25)        char ** envp) {\n[](#cb240-26)    ...\n[](#cb240-27)}\n\
    ```\n\n我们在 [第25回 | 通过 fork 看一次系统调用](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247501700&idx=1&sn=1b0167cf9852f89748a337d9b06c940b&chksm=c2c5bd29f5b2343ff01c68f1cbc654fbb12148f00eff8c21bb2e725a6054a7a6fbddbc253afb&scene=21#wechat_redirect)\
    \ 已经详细分析了整个调用链中的栈以及参数传递的过程。\n\n所以这里我们就不再赘述，直接把这里的参数传过来的样子写出来。\n\n**eip** 调用方触发系统调用时由\
    \ CPU 压入栈空间中的 eip 的指针 。\n\n**tmp** 是一个无用的占位参数。\n\n**filename** 是 \"/bin/sh\"\n\
    \n**argv** 是 { \"/bin/sh\", NULL }\n\n**envp** 是 { \"HOME=/\", NULL }\n\n好了，接下来我们看看整个\
    \ **do_execve** 函数，它非常非常长！我先把整个结构列出。"
