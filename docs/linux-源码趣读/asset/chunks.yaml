    h \\W]\\$\n[root@VM-24-11-centos ~]# PS1=[呵呵呵]\n[呵呵呵]\n```\n\n可以看到神奇的事情发生了，前面的提示符变成了我们自己定义的样子。其实我就想说，`shell`\
    \ 程序也仅仅是个程序而已，它的输出，它的输入，它的执行逻辑，是完全可以通过阅读程序源码来知道的，和一个普通的程序并没有任何区别。\n\n好了，接下来我们就阅读一下\
    \ shell 程序的源码，只需要找到它的一个具体实现即可。但是 `bash`、`zsh` 等实现都过于复杂，很多东西对于我们学习完全没必要。所以这里我通过一个非常非常精简的\
    \ shell 实现，即 `xv6` 里的 shell 实现为例，来进行讲解。\n\n`xv6` 是一个非常非常经典且简单的操作系统，是由麻省理工学院为操作系统工程的课程开发的一个教学目的的操作系统，所以非常适合操作系统的学习。\n\
    \n![](media/file269.webp \"fig:\")\n\n而在它的源代码中，又恰好实现了一个简单的 shell 程序，所以阅读它的代码，对我们这个系列课程来说，简直再合适不过了。\n\
    \n![](media/file270.webp \"fig:\")\n\n看到没，甚至在这么一个小小的截图里，已经可以完整展示 `sh.c` 里全部的 `main`\
    \ 方法代码了。但我仍然十分贪婪，即便是这么短的代码，我也帮你把一些多余的校验逻辑去掉，再去掉关于 `cd` 命令的特殊处理分支，来一个最干净的版本。\n\n\
    ```c\n// xv6-public sh.c\nint main(void) {\n    static char buf[100];\n    //\
    \ 读取命令\n    while(getcmd(buf, sizeof(buf)) >= 0){\n        // 创建新进程\n        if(fork()\
    \ == 0)\n            // 执行命令\n            runcmd(parsecmd(buf));\n        // 等待进程退出\n\
    \        wait();\n    }\n}\n```\n\n看，shell 程序变得异常简单了！总得来说，`shell` 程序就是个死循环，它永远不会自己退出，除非我们手动终止\
    \ `shell` 进程。在死循环里面，`shell` 不断读取（`getcmd`）用户命令，创建一个新的进程（`fork()`），在新进程里执行（`runcmd`），最后等待（`wait()`）进程，再次读取下一条命令。由此你是不是感受到了\
    \ `xv6` 源码的简单美，当你走完这个 Linux 0.11 之后，再去阅读 `xv6` 源码你会觉得舒服，因为 Linux 0.11 很多地方都用了非常技巧，使得理解很困难。之前说过\
    \ `shell` 就是不断 `fork + exec` 完成一个程序的功能，那 `exec` 在哪？那我们要看执行的 `runcmd` 代码。\n\n```c\n\
    void runcmd(struct cmd *cmd) {\n    struct exe ecmd = (struct exe*)cmd;\n    exec(ecmd->argv[0],\
    \ ecmd->argv);\n}\n```\n\n这里我又省略了很多代码，比如遇到管道 `PIPE`、遇到命令集合时的处理，我们仅仅看单纯执行一条命令的逻辑。可以看到简单调用了\
    \ `exec` 函数，这个 `exec` 是 `xv6` 代码里的名字，在 Linux 0.11 里就是我们在 `fork + exec` 加载并执行 `shell`\
    \ 程序。\n\n## 第38回 操作系统启动完毕\n\n书接上回，上回书咱们说到一个 shell 程序的执行原理，至此我们的操作系统终于将控制权交给了 `shell`，由\
    \ `shell` 程序和我们人类进行好的交互。其实到这里，操作系统的使命就基本结束了。\n\n此时我想到了之前有人问过的一个问题，他说为什么现在的电脑开机后和操作系统启动前，还隔着好一段时间，这段时间运行的代码是什么？在我的继续追问下才知道，他说的操作系统的开始部分，是我们看到了诸如\
    \ Windows 画面的时候。\n\n![](media/file271.webp \"fig:\")\n\n这个画面就和我们 Linux 0.11 里讲的这个\
    \ `shell` 程序一样，已经可以说标志着操作系统启动完毕了，通过 `shell` 不断接受用户命令并执行命令的死循环过程中。\n\n甚至在 Linux\
    \ 0.11 里根本都找不到 `shell` 的源代码，说明 Linux 0.11 并没有认为 `shell` 是操作系统的一部分，它只是个普通的用户程序，和你在操作系统里自己写个\
    \ hello world 编译成 `a.out` 执行一样。在执行这个 `shell` 程序前已经可以认为操作系统启动完毕了。\n\n操作系统就是初始化了一堆数据结构进行管理，并且提供了一揽子系统调用接口供上层的应用程序调用，仅此而已。再多做点事就是提供一些常用的用户程序，但这不是必须的。\n\
    \nOK，上一回我留了一个问题，`shell` 程序执行了，操作系统就结束了么？此时我们不妨从宏观视角来看一下当前的进度。\n\n![](media/file272.webp\
    \ \"fig:\")\n\n看最右边的蓝色部分的流程即可。我们先是建立了操作系统的一些最基本的环境与管理结构，然后由进 0 `fork` 出处于用户态执行的进程\
    \ 1，进程 1 加载了文件系统并打开终端文件，紧接着就 fork 出了进程 2，进程 2 通过我们刚刚讲述的 `execve` 函数将自己替换成了 `shell`\
    \ 程序。\n\n如果看的话，`shell` 程序执行了，操作系统就结束了？接下来有个问题，`shell` 程序执行了，操作系统就结束了？欲知后事，且听下回分解。\n"
  raw: '> 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502581&idx=1&sn=df3f2c19ce511ac24145091892f47837&chksm=c2c5b058f5b2394ee095d679071b43c23853dc86d5cfd4cc961568643110ab734f635b899984&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502581&idx=1&sn=df3f2c19ce511ac24145091892f47837&chksm=c2c5b058f5b2394ee095d679071b43c23853dc86d5cfd4cc961568643110ab734f635b899984&scene=21#wechat_redirect)


    书接上回，上回书咱们说到，Linux 通过缺页中断处理过程，将 /bin/sh 的代码从硬盘加载到了内存，此时便可以正式执行 shell 程序了。


    这个 **shell** 程序，也就是 Linux 0.11 中要执行的这个 **/bin/sh** 程序，它的源码并没有体现在 Linux 0.11 源码中。


    也可以说，不论这个 /bin/sh 是个啥文件，哪怕只是个 hello world 程序，Linux 0.11 的启动过程中也会傻傻地去执行它。


    但同时，shell 又是一个我们再熟悉不过的东西了。


    在我的腾讯云服务器上（用 Termius 连接），它是这个样子的。


    ![](media/file266.webp "fig:")


    在我的 Ubuntu 16.04 虚拟机上，它是这个样子的。


    ![](media/file267.webp "fig:")


    在我的 mac 电脑上，它是这个样子的。


    ![](media/file268.webp "fig:")


    没错，它就是我们通常说的那个命令行黑窗口。


    当然 shell 只是一个标准，具体的实现可以有很多，比如在我的 Ubuntu 16.04 上，具体的 shell 实现是 bash。


    ```

    [](#cb269-1)flash:~$ echo $SHELL

    [](#cb269-2)/bin/bash

    ```


    而在我的 mac 上，具体的实现是 zsh。


    ```

    [](#cb270-1)~ echo $SHELL

    [](#cb270-2)/bin/zsh

    ```


    当然，默认的 shell 实现也可以手动进行设置并更改。


    还有个有意思的事，shell 前面的提示符，是否可以修改呢？


    我的腾讯云服务器上，提示符是


    ```

    [](#cb271-1)[root@VM-24-11-centos ~]#

    ```


    我的 Ubuntu 虚拟机上，提示符是


    ```

    [](#cb272-1)flash:~$

    ```


    我的 mac 电脑上更简单，提示符是


    ```

    [](#cb273-1)~

    ```


    我现在觉得我那个腾讯云服务器上的提示符太长了怎么办？我们先查看一个变量 PS1 的值


    ```

    [](#cb274-1)[root@VM-24-11-centos ~]# echo $PS1

    [](#cb274-2)[\u@\h \W]\$

    ```


    然后，我们直接把这个值给改了。


    ```

    [](#cb275-1)[root@VM-24-11-centos ~]# echo $PS1

    [](#cb275-2)[\u@\h \W]\$

    [](#cb275-3)[root@VM-24-11-centos ~]# PS1=[呵呵呵]

    [](#cb275-4)[呵呵呵]

    ```


    可以看到神奇的事情发生了，前面的提示符变成了我们自己定义的样子。


    其实我就想说，shell 程序也仅仅是个程序而已，它的输出，它的输入，它的执行逻辑，是完全可以通过阅读程序源码来知道的，和一个普通的程序并没有任何区别。


    好了，接下来我们就阅读一下 shell 程序的源码，只需要找到它的一个具体实现即可。但是 bash，zsh 等实现都过于复杂，很多东西对于我们学习完全没必要。


    所以这里我通过一个非常非常精简的 shell 实现，即 **xv6** 里的 shell 实现为例，来进行讲解。


    xv6 是一个非常非常经典且简单的操作系统，是由麻省理工学院为操作系统工程的课程开发的一个**教学目的的操作系统**，所以非常适合操作系统的学习。


    ![](media/file269.webp "fig:")


    而在它的源代码中，又恰好实现了一个简单的 shell 程序，所以阅读它的代码，对我们这个系列课程来说，简直再合适不过了。


    ![](media/file270.webp "fig:")


    看到没，甚至在这么一个小小的截图里，已经可以完整展示 sh.c 里全部的 main 方法代码了。


    但我仍然十分贪婪，即便是这么短的代码，我也帮你把一些多余的校验逻辑去掉，再去掉关于 cd 命令的特殊处理分支，来一个最干净的版本。


    ```

    [](#cb276-1)// xv6-public sh.c

    [](#cb276-2)int main(void) {

    [](#cb276-3)    static char buf[100];

    [](#cb276-4)    // 读取命令

    [](#cb276-5)    while(getcmd(buf, sizeof(buf)) >= 0){

    [](#cb276-6)        // 创建新进程

    [](#cb276-7)        if(fork() == 0)

    [](#cb276-8)            // 执行命令

    [](#cb276-9)            runcmd(parsecmd(buf));

    [](#cb276-10)        // 等待进程退出

    [](#cb276-11)        wait();

    [](#cb276-12)    }

    [](#cb276-13)}

    ```


    看，shell 程序变得异常简单了！


    总得来说，shell 程序就是个死循环，它永远不会自己退出，除非我们手动终止了这个 shell 进程。


    在死循环里面，shell 就是不断读取（**getcmd**）我们用户输入的命令，创建一个新的进程（**fork**），在新进程里执行（**runcmd**）刚刚读取到的命令，最后等待（**wait**）进程退出，再次进入读取下一条命令的循环中。


    由此你是不是也感受到了 xv6 源码的简单之美，真的是见名知意，当你跟我走完这个 Linux 0.11 之旅后，再去阅读 xv6 的源码你会觉得非常舒服，因为
    Linux 0.11 很多地方都用了非常骚的编码技巧，使得理解起来很困难，谁让 Linus 这么特立独行呢。


    我们之前说过 shell 就是不断 **fork + execve** 完成执行一个新程序的功能的，那 execve 在哪呢？


    那我们就要看执行命令的 runcmd 代码了。


    ```

    [](#cb277-1)void runcmd(struct cmd *cmd) {

    [](#cb277-2)    ...

    [](#cb277-3)    struct execcmd ecmd = (struct execcmd*)cmd;

    [](#cb277-4)    ...

    [](#cb277-5)    exec(ecmd->argv[0], ecmd->argv);

    [](#cb277-6)    ...

    [](#cb277-7)}

    ```


    这里我又省略了很多代码，比如遇到管道命令 PIPE，遇到命令集合 LIST 时的处理逻辑，我们仅仅看单纯执行一条命令的逻辑。


    可以看到，就是简简单单调用了个 exec 函数，这个 exec 是 xv6 代码里的名字，在 Linux 0.11 里就是我们在 [第35回 | execve
    加载并执行 shell 程序](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502475&idx=1&sn=4fcdbaa03bf6a1ca04db4013309c6aa3&chksm=c2c5b026f5b2393049efca68c429df5038fa0f317eea79fbd9ec2c661c3ec12b47a0701376a7&scene=21#wechat_redirect)
    里讲的 execve 函数。


    shell 执行一个我们所指定的程序，就和我们在 Linux 0.11 里通过 fork + execve 函数执行了 /bin/sh 程序是一个道理。


    你看，fork 和 execve 函数你一旦懂了，shell 程序的原理你就直接秒懂了。而 fork 和 execve 函数的原理，其实如果你非常熟练地掌握中断、虚拟内存、文件系统、进程调度等更为底层的基础知识，其实也不难理解。


    所以，根基真的很重要，本回已经到操作系统启动流程的最后一哆嗦了，如果你现在感觉十分混乱，最好的办法就是，不断去啃之前那些你认为"无聊的"、"没用的"章节。


    好了，今天的 shell 就到这里了，毕竟我们是讲 Linux 0.11 核心流程的系列，不必过多深入 shell 这个应用程序。


    接下来有个问题，shell 程序执行了，操作系统就结束了么？


    欲知后事如何，且听下回分解。


    * * *


    ## 第38回 | 操作系统启动完毕


    > 原文链接: [http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502613&idx=1&sn=d7e85595323d3de138e5ac52bf8e61dd&chksm=c2c5b1b8f5b238ae8785f45bf83434839689e7e5a697026d9ebde5738f11a83c4379a16c349f&scene=21#wechat_redirect](http://mp.weixin.qq.com/s?__biz=Mzk0MjE3NDE0Ng==&mid=2247502613&idx=1&sn=d7e85595323d3de138e5ac52bf8e61dd&chksm=c2c5b1b8f5b238ae8785f45bf83434839689e7e5a697026d9ebde5738f11a83c4379a16c349f&scene=21#wechat_redirect)


    书接上回，上回书咱们说到一个 shell 程序的执行原理，至此我们的操作系统终于将控制权转交给了 shell，由 shell 程序和我们人类进行友好的交互。


    其实到这里，操作系统的使命就基本结束了。


    此时我想到了之前有人问过我的一个问题，他说为什么现在的电脑开机后和操作系统启动前，还隔着好长一段时间，这段时间运行的代码是什么？


    在我的继续追问下才知道，他说的操作系统的开始部分，是我们看到了诸如 Windows 登陆画面的时候。


    ![](media/file271.webp "fig:")


    这个登陆画面就和我们 Linux 0.11 里讲的这个 shell 程序一样，已经可以说标志着操作系统启动完毕了，通过 shell 不断接受用户命令并执行命令的死循环过程中。


    甚至在 Linux 0.11 里根本都找不到 shell 的源代码，说明 Linux 0.11 并没有认为 shell 是操作系统的一部分，它只是个普通的用户程序，和你在操作系统里自己写个
    hello world 编译成 a.out 执行一样。在执行这个 shell 程序前已经可以认为操作系统启动完毕了。


    操作系统就是初始化了一堆数据结构进行管理，并且提供了一揽子**系统调用**接口供上层的应用程序调用，仅此而已。再多做点事就是提供一些常用的用户程序，但这不是必须的。


    OK，上一回我留了一个问题，shell 程序执行了，操作系统就结束了么？


    此时我们不妨从宏观视角来看一下当前的进度。


    ![](media/file272.webp "fig:")


    看最右边的蓝色部分的流程即可。


    我们先是建立了操作系统的一些最基本的环境与管理结构，然后由进 0 fork 出处于用户态执行的进程 1，进程 1 加载了文件系统并打开终端文件，紧接着就 fork
    出了进程 2，进程 2 通过我们刚刚讲述的 execve 函数将自己替换成了 shell 程序。


    如果看代码的话，其实我们此时处于一个以 rc 为标准输入的 shell 程序。


    ```

    [](#cb278-1)// main.c

    [](#cb278-2)void main(void) {

    [](#cb278-3)    ...

    [](#cb278-4)    if (!fork()) {

    [](#cb278-5)        init();

    [](#cb278-6)    }

    [](#cb278-7)    for(;;) pause();

    [](#cb278-8)}

    [](#cb278-9)

    [](#cb278-10)void init(void) {

    [](#cb278-11)    ...

    [](#cb278-12)    // 一个以 rc 为标准输入的 shell

    [](#cb278-13)    if (!(pid=fork())) {

    [](#cb278-14)        ...

    [](#cb278-15)        open("/etc/rc",O_RDONLY,0);

    [](#cb278-16)        execve("/bin/sh",argv_rc,envp_rc);

    [](#cb278-17)    }

    [](#cb278-18)    // 等待这个 shell 结束

    [](#cb278-19)    if (pid>0)

    [](#cb278-20)        while (pid != wait(&i))

    [](#cb278-21)    ...

    [](#cb278-22)    // 大的死循环，不再退出了

    [](#cb278-23)    while (1) {

    [](#cb278-24)        // 一个以 tty0 终端为标准输入的 shell

    [](#cb278-25)        if (!(pid=fork())) {

    [](#cb278-26)            ...

    [](#cb278-27)            (void) open("/dev/tty0",O_RDWR,0);

    [](#cb278-28)            execve("/bin/sh",argv,envp);

    [](#cb278-29)        }

    [](#cb278-30)        // 这个 shell 退出了继续进大的死循环

    [](#cb278-31)        while (1)

    [](#cb278-32)            if (pid == wait(&i))

    [](#cb278-33)                break;

    [](#cb278-34)        ...

    [](#cb278-35)    }

    [](#cb278-36)}

    ```


    就是 open 了 /etc/rc 然后 execve 了 /bin/sh 的这个程序，代码中标记为蓝色的部分。


    shell 程序有个特点，就是如果标准输入为一个普通文件，比如 /etc/rc，那么文件读取后就会使得 shell 进程退出，如果是字符设备文件，比如由我们键盘输入的
    /dev/tty0，则不会使 shell 进程退出。


    这就使得标准输入为 /etc/rc 文件的 shell 进程在读取完 /etc/rc 这个文件并执行这个文件里的命令后，就退出了。


    所以，这个 /etc/rc 文件可以写一些你觉得在正式启动大死循环的 shell 程序之前，要做的一些事，比如启动一个登陆程序，让用户输入用户名和密码。


    好了，那作为这个 shell 程序的父进程，也就是进程 0，在检测到 shell 进程退出后，就会继续往下走。


    ```

    [](#cb279-1)// main.c

    [](#cb279-2)void init(void) {

    [](#cb279-3)    ...

    [](#cb279-4)    // 一个以 rc 为标准输入的 shell

    [](#cb279-5)    ...

    [](#cb279-6)    // 等待这个 shell 结束

    [](#cb279-7)    if (pid>0)

    [](#cb279-8)        while (pid != wait(&i))

    [](#cb279-9)    ...

    [](#cb279-10)    // 大的死循环，不再退出了

    [](#cb279-11)    while (1) {

    [](#cb279-12)        ...

    [](#cb279-13)    }

    [](#cb279-14)}

    ```


    下面的 **while(1)** 死循环里，是和创建第一个 shell 进程的代码几乎一样。


    ```

    [](#cb280-1)// main.c

    [](#cb280-2)void init(void) {

    [](#cb280-3)    ...

    [](#cb280-4)    // 大的死循环，不再退出了

    [](#cb280-5)    while (1) {

    [](#cb280-6)        // 一个以 tty0 终端为标准输入的 shell

    [](#cb280-7)        if (!(pid=fork())) {

    [](#cb280-8)            ...

    [](#cb280-9)            (void) open("/dev/tty0",O_RDWR,0);

    [](#cb280-10)            execve("/bin/sh",argv,envp);

    [](#cb280-11)        }

    [](#cb280-12)        // 这个 shell 退出了继续进大的死循环

    [](#cb280-13)        while (1)

    [](#cb280-14)            if (pid == wait(&i))

    [](#cb280-15)                break;

    [](#cb280-16)        ...

    [](#cb280-17)    }

    [](#cb280-18)}

    ```


    只不过它的标准输入被替换成了 **tty0**，也就是接受我们键盘的输入。'
