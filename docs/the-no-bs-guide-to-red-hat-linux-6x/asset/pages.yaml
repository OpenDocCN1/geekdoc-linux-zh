- pgno: 147
  md: 'When you installed Linux, one of the first things you did was create a file
    system. In the process, you carved out a chunk of hard disk and formatted it so
    that Linux could use it. You also created a hierarchical (treelike) structure
    for storing files, to impose some order on the file system to help both you and
    the Linux system find needed files.


    In this chapter, you’ll learn how to work with files and directories in a Linux
    system. You’ll understand how the file system is structured to separate system
    data from personal data and how to navigate through it. We’ll cover three ways
    to manipulate your files: using the command line, the Midnight Commander, and
    the graphical File Manager.


    When you’re done, you’ll be creating, deleting, copying, renaming, listing, linking,
    and protecting your files like a pro. You’ll also learn the Nine Deadly Keystrokes—or
    how to wipe out the entire file system without really trying. (But don’t worry;
    this command can affect you only if you’re logged in as root.)


    Log in as hermie and try the examples in this chapter as you read through it.
    You’ll find that the Linux file system is a lot like DOS, only more robust and
    flexible.


    # What Is a Linux File?


    We’ve created a structured file system and filled it with a whole bunch of files—without
    knowing what Linux files are. Here’s what files are in the Linux world and how
    they are named.


    # Types of Files


    In most operating systems, a file is simply a blob of data stored on disk with
    a unique name. A file could be a list of names and numbers, a cheesecake recipe,
    or an executable program. But under Linux, everything is a file. In addition to
    data and executable files, Linux treats directories and even the various components
    of your computer as files.


    This means there are files that represent your keyboard, console, printer, CD-ROM,
    and even your system’s RAM. These special files are called devices, and they are
    found in the /dev directory (see Figure 5-1). (If you look in this directory later,
    you’ll see files such as /dev/fdo'
  merge: -1
  img_proc: true
- pgno: 148
  md: '[a floppy drive], /dev/tty1 [a console], and others you may be able to identify
    by their names.) When Linux (or any Unix program) needs to talk to a physical
    hardware device, it does so by simply reading from or writing to one of these
    special files.


    # WHAT''S IN A FILE NAME?


    Linux file names can be up to 256 characters long, but you really have to enjoy
    typing to get to that extreme. You can name a file panda-corporation-financial-reports.y96
    if you wish, but you''ll probably find that shorter names (and intelligent use
    of directories) will save lots of time and keystrokes in the course of a day.


    When naming files, you can use uppercase and lowercase letters, numbers, and certain
    special characters. It''s a really good idea to stick with letters, numbers, and
    the dash, dot, and underscore characters to avoid trouble and confusion.


    NOTE: Don''t use asterisks, backslashes, or question marks in Linux file names—these
    characters have special meaning to the shell and could cause your commands to
    do something quite different from what you intended. Also avoid using a dash as
    the first character of a file name, since most Linux commands will treat it as
    a switch.


    Files starting with a dot (.) are hidden files. They behave just like any other
    file, except that the ls (list files) command will not display them unless you
    explicitly request it to do so. Your .bashrc file is an example of a hidden file.


    Also remember that Linux file names are case sensitive, which can be difficult
    to get used to if you have a DOS background. Linux allows you to have unique files
    named goodstuff, GOODSTUFF, and GoodStuff in the same directory.


    It''s best to always use lowercase in Linux unless you can think of a good reason
    to use uppercase or mixed case. Most Unix people use lowercase almost exclusively,
    but aside from this “cultural” point, there''s another good reason to use lowercase.
    If you''re sharing or accessing a DOS file system with Linux, DOS will not be
    able to see the files that have uppercase or mixed-case file names.


    Unlike under DOS, the dot character (.) has no special meaning. You''re not limited
    to the eight dot three (xxxxxxx.yyy) style of naming because Linux treats the
    dot just like any other character; you can name a file Some.Yummy.CHEESECAKE.Recipes
    if you''re so inclined.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Along these lines, Linux executables do not need or use a special extension
    such as .exe or .bat. Linux will happily run a program file named zippity just
    as readily as it will run DOODAH.EXE.

    And here''s another slight difference between Linux and DOS filesystems. Linux
    uses the forward slash (/) in path names, and DOS uses the backslash (\). Don''t
    blame this little quirk on Linux though . . . the DOS filesystem was originally
    modeled after Unix! In fact, the popular rumor is that Bill Gates and Company
    implemented the DOS filesystem just differently enough from the Unix filesystem
    to avoid being criticized for stealing the idea. The same charge is made about
    the DOS batch file (.BAT) utility since it bears striking similarities to the
    Unix shell scripting languages, but I digress. . . .


    # DIRECTORIES


    A Linux directory is a special file that acts as a container for other files and
    even other directories. You can create directories to hold groups of related files
    as an alternative to keeping all your files in one huge directory. A Linux file
    system is like a filing cabinet with a bunch of folders, each of which can contain
    subfolders and files.

    After installing Linux and creating a new hermie user account, you''ll end up
    with a file system hierarchy like the one shown here.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_149_0.png)'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'As you can see, the file system resembles an upside-down tree and is very similar
    to the treelike directory structure in DOS. The top level is denoted by a slash
    (/) and is called the root directory. Several system-related directories such
    as bin, dev, and etc appear below the root directory—here’s a summary of their
    purpose in life:


    +   /bin Contains the Linux system commands and programs (also called binaries).
    Pronounced “slash bin.”

    +   /dev Contains special device files that correspond to hardware components.
    Pronounced “slash dev.”

    +   /etc Contains configuration files for Linux and other installed software.
    Pronounced “slash et-see.”

    +   /home Contains the home directories (personal storage) foreach user on the
    system. Pronounced “slash home.”

    +   /sbin Contains more Linux binaries (special utilities not for general users).
    Pronounced “slash ess-bin.”

    +   /root The home directory for the root user; not to be confused with /. Some
    Linux systems use /home/root instead of /root. Pronounced “slash root.”

    +   /usr Contains system programs and other files for general users such as games,
    online help, and documentation. By convention, a user should not put personal
    files in this directory. Pronounced “slash user.”


    > NOTE: Unless you are an All-Knowing Linux Guru, you should never combine or
    delete any of the directories (or files therein) that appear just below the root
    directory. This could prevent your system from booting or operating properly.


    # DIRECTORY LINGO


    To navigate your Linux file system, there are several terms you should understand.


    Current directory The directory you are in at a given time, sometimes called the
    current working directory. The pwd (print working directory) command will tell
    you the name of the current directory.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Subdirectory A directory within the current directory.


    Parent directory The directory above the current one. Every directory except the
    top level has a parent. If you are in the /usr/spool directory, then /usr is the
    parent.


    Home directory A user''s personal directory. For example, if your user name is
    hermie, your home directory is /home/hermie. The user normally has complete control
    over all files stored in directories beneath the home directory, with one exception:
    If the root user copies a file to your home directory, root still owns and controls
    that file.


    Root directory The top of the file system, denoted by a slash. Only subdirectories
    appear below this directory. Don''t confuse this with /root, the home directory
    for the root user. When speaking, always refer to / as "the root directory" and
    to /root as "slash root."


    Absolute file name A file name that is valid no matter where you are in the file
    hierarchy. In practice, this means it must start with a slash and specify the
    full path to the file. For example, /home/hermie/recipes/sludge_fudge is an absolute
    file name, but sludge_fudge is not.


    Relative file name A file name that specifies a file relative to the current directory.
    For example, if you were in hermie''s home directory, /home/hermie/, you would
    reference that healthy fudge recipe as recipes/sludge_fudge.


    # TREE CLIMBING


    You can move from one directory to another using the cd command. For example,
    if you are in your home directory (/home/hermie) and want to switch to the recipes
    directory (/home/hermie/recipes), the following command does the trick:


    ```

    cd recipes

    ```


    To switch back to your home directory, you could type


    ```

    cd /home/hermie

    ```'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'but there are two shortcuts you will find useful. The first is the double-dot
    (..) notation, as in


    ```

    cd ..

    ```


    This will move you one level up, to the parent directory. You can even enter something
    like


    ```

    cd ../secrets

    ```


    to move up to the parent and then go back down to a directory that is at the same
    level as the current one. This double-dot notation is not specific to the cd command,
    though. You can use it with any Linux command that needs a file name as input.
    You might also see the single-dot (.) notation, which means “this directory.”
    It wouldn’t make much sense to enter cd . because you’d still be in the same directory,
    but there are other commands (notably, the find command, described in Chapter
    6, “Important Linux Commands”) where it’s convenient to use the single dot as
    shorthand for the current directory name.


    Another directory navigation shortcut involves using $HOME. No matter what directory
    you are in, the following command will return you to your personal recipes directory:


    ```

    cd $HOME/recipes

    ```


    And if you want to change to another user’s home directory, you can use the tilde
    (~) notation. In the following examples, the tilde character is shorthand for
    “the home directory of.” You must put the name of a user on your system immediately
    after the tilde. For example, cd ~sigmund means “change to sigmund’s home directory”;
    cd ~edbo/stuff means “change to edbo’s stuff directory”.


    The single-dot, double-dot, and tilde notations are useful in conjunction with
    the cd command, but they can also be used in any Linux command where you need
    to enter a file or directory name.


    TIP: One common mistake people make in navigating Linux directories is using a
    slash in front of file names when it is not needed. Suppose you have a bin directory
    under your home directory. If you were at /home/hermie and you entered cd /bin,
    you’d end up at the bin underneath the root directory—oops. (Linux understands
    the slash before bin as telling it to go to the root directory first and then'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'to the bin directory just below the root.) The correct way to reach the bin
    directory under /home/hermie is to type from within your home directory (/home/hermie)
    cd bin. Don’t use a leading slash unless you’re sure you want to start at the
    top (root) of the file tree.


    # LISTING FILES


    The ls command lists all the files in a directory. Here are some examples:


    +   - **ls** Lists the files in the current directory

    +   - **ls recipes** Lists the files in another directory using relative addressing

    +   - **ls /usr/bin** Lists the files in another directory using absolute addressing


    By default, ls prints a simple, columnar list of your files; but it will list
    your files in many different formats if you add one or more flags on the command
    line. To use any of them, simply type the ls command at the prompt, followed by
    a space, and then add a switch by typing a hyphen followed by the flag, like this:


    ```

    ls -F

    ```


    Here are some of the most commonly used ls flags:


    +   - **a** Lists all files, including hidden ones

    +   - **l** Displays the file list in long format, including file details like
    size, time stamp, and owner

    +   - **F** Adds a slash after the name for directories, an asterisk for executables,
    and an at sign (@) for linked files

    +   - **r** Reverses the sort order (alphabetic or time)

    +   - **t** Sorts the list by the time each file was created


    Here’s a look at the contents of a directory named animals, using some of these
    flags:


    ```

    ls -F animals

    cat_info   cow_info   dog_info

    pig_info   slugs/     zippity*

    ```'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'In this case, ls returns just the file names in columnar format, but with a
    few marks, thanks to the -F flag. The slash suffix on slugs indicates that it
    is a directory, and zippity is identified as an executable.


    ```

    ls -al animals

    -rw-r--r-- 1 hermie users 1758 Mar 17 23:17 .hoohah

    -rw-r--r-- 1 hermie users 45090 Mar 23 23:17 cat_info

    -rw-r--r-- 1 hermie users 64183 Feb 14 22:07 cow_info

