- pgno: 312
  md: '# Running Programs at Startup


    If you''re curious about exactly what happens when you boot Linux, here''s the
    story. The Linux kernel starts a program called init, which is responsible for
    initializing all the hardware components and bringing up daemons for networking,
    email, the Web server, printing, and any other services you specify in the System
    Services configurator mentioned earlier in this chapter. There are a few places
    where you can hook into the startup process, if you need to run a program at startup
    to load a special device driver or perform some other custom initialization task.


    # The rc.serial Script


    The init program runs a script called /etc/rc.d/rc.serial (if it exists), which
    is the place to put any serial port (mouse or modem) initialization commands.
    If your system is configured to autostart PPP services at boot time and you need
    to use the setserial command to get your modem working under Linux, you should
    run setserial in the rc.serial script. The rc.serial script is run early in the
    init process, so this ensures that your modem is properly initialized before the
    PPP daemon tries to dial up your ISP.


    # The rc.local Script


    The other hook into the startup process is the /etc/rc.d/rc.local script, which
    is run at the very end of the init process. By default, the rc.local script just
    prints a log-in banner with your kernel version and machine type, but you can
    add other commands if you need to initialize a device or print special instructions
    for the use of your system.


    # The .bashrc Script


    Only the root user can modify the rc.serial and rc.local scripts, since they affect
    all users on the system. If you want to run some special startup commands that
    apply only to one user account, put them in .bashrc, the Bash shell user profile
    script, located in your home'
  merge: -1
  img_proc: true
