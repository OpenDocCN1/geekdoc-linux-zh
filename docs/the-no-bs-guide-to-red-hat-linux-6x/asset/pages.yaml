- pgno: 277
  md: 'The Unix environment offers you several ways to transform your files. Depending
    on your needs, you can shrink files, smash them, or scramble them—and then return
    them to their original size and shape.


    This chapter will give you an understanding of the tools available for compressing,
    archiving, encoding, and encrypting your files and show you when to use each.


    # PUTTING ON THE SQUEEZE: COMPRESSING AND ARCHIVING


    When you compress a file, you reduce it to a fraction of its original size so
    you can more efficiently store it or transmit it to another person. Compressed
    files travel faster and take up less space in file libraries, but you can’t open
    or execute a compressed file without first decompressing it.


    When you smash a bunch of files together into a single file, you’re creating an
    archive. (You don’t necessarily compress the files, though.) Archives are useful
    because they create a package of files that belong together, which makes it easier
    to distribute a group of related files—for example, the files that make up a program.
    Because archive files are not always smaller than the sum of their parts, you
    will sometimes use a compression tool on an archive, resulting in a compressed
    archive.


    Although zip is the most common compression format under DOS and Windows, Unix
    commonly uses files created with the tar and gzip commands. You’ll certainly run
    into files with names like these:


    | Filename | Description |

    |---|---|

    | `something.tar` | An archive file created with tar |

    | `something.gz` | A compressed file created with gzip |

    | `something.tar.gz` | A compressed archive file |

    | `something.tgz` | Same as something.tar.gz |


    Although the gzip program is built into all Linux systems, it may not be part
    of some Unix systems, in which case, an older tool called compress is used. Files
    created by compress have names like this'
  merge: -1
  img_proc: true
- pgno: 278
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 279
  md: 'The `/dev/fd0` entry is Linux-ese for “floppy drive zero” (your A drive under
    DOS), and `/dev/rmt0` means “removable media tape zero,” or your primary tape
    drive. The M flag means use multiple floppy disks—when one disk is full, tar prompts
    you to insert another.


    To automatically compress the tar file as it is being created, add the z flag,
    like this:


    ```

    tar cvzf alldocs.tar.gz *.doc

    ```


    In this example, I added the .gz suffix to the archive file name, because the
    z flag tells tar to use the same compression as the gzip command.


    To list the contents of a tar file, use the t (type) flag in a command, like this:


    ```

    tar tvf alldocs.tar    List all files in alldocs.tar.

    ```


    To extract the contents of a tar file, use the x (extract) flag in a command,
    like this:


    ```

    tar xvf panda.tar    Extract files from panda.tar.

    ```


    This will copy all the files from the panda.tar file into the current directory.
    When a tar file is created, it can bundle up all the files in a directory, as
    well as any subdirectories and the files in them. So when you’re extracting a
    tar file, keep in mind that you might end up with some new subdirectories in the
    current directory.


    We’ve used several different flags in the sample tar commands so far. Here’s a
    list of the most common flags:


    +   - `c` — Create a new archive.

    +   - `t` — List the contents of an archive.

    +   - `x` — Extract the contents of an archive.

    +   - `f` — The archive file name is given on the command line (required whenever
    the tar output is going to a file).

    +   - `M` — The archive can span multiple floppies.

    +   - `v` — Print verbose output (list file names as they are processed).

    +   - `u` — Add files to the archive if they are newer than the copy in the tar
    file.

    +   - `z` — Compress or decompress files automatically.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# THE GZIP AND GUNZIP COMMANDS


    The gzip program compresses a single file. One important thing to remember about
    gzip is that, unlike tar, it replaces your original file with a compressed version.
    (The amount of compression varies with the type of data, but a typical text file
    will be reduced by 70 to 80 percent.) Say you enter this command:


    ```

    gzip cheap.suit

    ```


    You’ll end up with a compressed file named cheap.suit.gz, and cheap.suit will
    be deleted.

    To decompress the cheap.suit.gz file, enter this:


    ```

    gunzip cheap.suit.gz

    ```


    You’ll get the original cheap.suit file back, and cheap.suit.gz will be deleted.

    You can tell gzip to use different levels of compression with the -n flag, where
    n is a number from 1 to 9. The -1 flag means “fast but less efficient” compression,
    and -9 means “slow but most efficient” compression. Values of n between 1 and
    9 will trade off speed and efficiency, and the default is -6. If you want to get
    the best possible compression and you don’t mind waiting a little longer, use
    the -9 flag, like this:


    ```

    gzip -9 cheap.suit

    ```


    One other useful option is the -r flag, which tells gzip and gunzip to recursively
    compress or decompress all files in the current directory and any subdirectories.
    (Even with the -r flag, gzip still compresses one file at a time.) Here are some
    examples:


    +   gzip -r somedir    Zip all files in the somedir directory.

    +   gunzip -r somedir    Unzip all files in the somedir directory.


    # HANDLING COMPRESSED ARCHIVES


    It’s common to apply gzip to a tar file, which is why you see files with names
    like something.tar.gz on Linux systems. When you want to extract the contents
    of a gzipped tar file, you have several choices. The first is to use gunzip followed
    by tar, like this:'
  merge: -1
  img_proc: true
- pgno: 281
  md: '```

    gunzip something.tar.gz

    tar xvf something.tar

    ```


    Or you could do it all in one command, like this:


    ```

    gunzip -c something.tar.gz | tar xvf -

    ```


    The -c flag tells gunzip to decompress the file, but instead of creating a something.tar
    file, it pipes the decompressed data directly to the tar command. The tar command
    on the right side of the pipeline looks a little strange, too—instead of a file
    name after the xvf, there’s just a dash. The dash tells tar that the input is
    not an actual file on disk, but rather a stream of data from the pipeline. (Note
    that the gunzip input file is not deleted when you use the -c flag.) Here’s a
    third method of extracting the contents of a compressed tar file that’s even easier.
    Remember the z flag with the tar command? You can use it to decompress and unbundle
    a tar file, like this:


    ```

    tar xvfz something.tar.gz

    ```


    The end result is exactly the same (the files that were in the compressed tar
    file are now in your current directory), but this is much easier than issuing
    multiple commands or writing a messy-looking gunzip-tar pipeline. Note that this
    command will work on all Linux systems, but the z flag for tar is not always available
    on other flavors of Unix. (However, you can download and compile the source code
    for the GNU version of the tar command. See the note near the beginning of this
    chapter about getting the source code for the GNU utilities.)


    # THE COMPRESS, UNCOMPRESS, AND ZCAT COMMANDS


    The compress and uncompress programs work just like gzip and gunzip, but they
    use an older and less efficient compression technique. If you’re using Linux,
    you shouldn’t have to bother with compress and uncompress at all. Even if you
    come across a file created with compress (something with a .Z suffix), you can
    decompress it with gunzip, because gunzip understands both formats. Still, just
    for completeness, here’s how to use the compress and uncompress programs:'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'compress some.file    Create compressed some.file.Z

    uncompress some.file    Create decompressed some.file


    The zcat program is another Linux antique. It does the same thing as uncompress
    with the -c flag (decompresses and writes output to the pipeline), so the following
    two commands would be equivalent:


    ```

    uncompress -c something.tar.X | tar xvf -

    zcat something.tar.X | tar xvf -

    ```


    You should have to use these commands only if you''re running some version of
    Unix besides Linux. (Even then, many Unix systems will have the GNU versions of
    gzip, gunzip, and tar available.)


    # THE ZMORE AND ZLESS COMMANDS


    The zmore command is a handy utility that lets you view gzipped files one screen
    at a time (much like the more command) without first decompressing them. The zmore
    command pauses after each screenful, printing --More-- at the bottom of the screen.
    You can press ENTER to display one more line, or press the spacebar to view the
    next screen of data.


    The zless command works the same way, except the decompressed output is displayed
    by the less command for additional viewing flexibility. Keep in mind that zmore
    and zless do not modify the input file.


    # THE ZIP AND UNZIP COMMANDS


    The zip and unzip programs work almost exactly like their cousins PKZIP and PKUNZIP
    in the DOS environment. You can squash a bunch of files together into a zip file
    like this:


    ```

    zip squash.zip file1 file2 file3

    ```


    Then you can extract the original files like this:


    ```

    unzip squash.zip

    ```


    Most of the flags are the same as for PKZIP and PKUNZIP, but there are a few differences,
    so you might like to view the help with zip -h or unzip -h if you need anything
    fancier than the basic commands shown here.'
  merge: -1
  img_proc: true
- pgno: 283
