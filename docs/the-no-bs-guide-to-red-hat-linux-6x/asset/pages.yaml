- pgno: 228
  md: 'Now we''ll use the print function in awk to plug the words from each input
    line into a template, like this:


    ```

    awk ''(print "Hit the",$1,"with your",$2)'' words.data

    Hit the nail with your hammer

    Hit the pedal with your foot

    Hit the clown with your pie

    ```


    Say some of the data in your input file is numeric, as in the grades.data file
    shown here:


    ```

    Rogers 87 100 95

    Lambchop 66 89 76

    Barney 12 36 27

    ```


    You can perform calculations like this:


    ```

    awk ''(print "Avg for",$1,"is",($2+$3+$4)/3)'' grades.data

    Avg for Rogers is 94

    Avg for Lambchop is 77

    Avg for Barney is 25

    ```


    So far, we haven''t specified any value for pattern in these examples, but if
    you want to exclude lines from being processed, you can enter something like this:


    ```

    awk ''/clown/ {print "See the",$2,"at the",$3}'' words.data

    See the clown at the circus

    ```


    Here, we told awk to consider only the input lines that start with clown. Note
    also that there is no space between the pattern and the print specifier. If you
    put a space there, awk will think the input file is ''{print and will not work.
    But all this is just the tip of the awk iceberg—entire books have been written
    on this command. If you are a programmer, try the man awk command.


    # THE FIND COMMAND


    The find command locates files in many different ways. Unlike the rest of the
    commands in this chapter, find does not look at the contents of a file—it only
    helps you find files that meet certain criteria, such as name, size, age, and
    type. The general form of the find command is'
  merge: -1
  img_proc: true
- pgno: 229
  md: '```

    find <starting point> <search criteria> <action>

    ```


    The starting point is the name of the directory where find should start looking
    for files. The find command examines all files in this directory (and any subdirectories)
    to see if they meet the specified search criteria. If any do, find performs the
    specified action on each found file. Here are some of the most useful search criteria
    options:


    +   - `-name pattern` Find files with names that match the pattern.

    +   - `-size [+|-] n` Find files larger or smaller than a certain size.

    +   - `-atime [+|-] n` Find files accessed before or after a certain date.

    +   - `-mtime [+|-] n` Find files modified before or after a certain date.

    +   - `-type filetype` Find only regular files or only directories.


    And here are the actions that can be applied to found files:


    +   - `-print` Print just the names of matching files.

    +   - `-ls` Print the names, dates, sizes, and so on of matching files.

    +   - `-exec command` Execute a command with the file name as input.

    +   - `-ok command` Same as -exec, but asks for confirmation first.


    That all might look a bit confusing, so here are some examples to bring things
    down to earth. To find files (starting in the current directory) with names ending
    with .data and to print their names, try this


    ```

    find . -name "*.data" -print

    company.data

    donor.data

    grades.data

    sorted.data

    words.data

    ```


    To find files larger than 40K and print the file names and details (use a minus
    sign instead of a plus sign to find files smaller than a certain size), issue
    this command:'
  merge: -1
  img_proc: true
- pgno: 230
  md: '```

    find . -size +40k -ls

    -rw-rw-r-- hermie users 56720 Jan 16 12:42 bigfile

    -rw-rw-r-- hermie users 415206 Feb 27 21:37 largefile

    -rw-rw-r-- hermie users 315428 Jan 07 05:23 huge file

    ```


    To find files ending with .dat that are smaller than 100K, enter


    ```

    find . -name *.txt -size -100k -ls

    -rw-rw-r-- hermie users 26720 Feb 06 23:52 recipes.txt

    -rw-rw-r-- hermie users 506 Feb 18 18:45 poem.txt

    ```


    To find files that have not been accessed for over 30 days and delete them (by
    sending their names to the rm command), enter


    ```

    find . -atime +30 -exec rm {} \;

    ```


    To find directories (starting in the junk directory) and conditionally delete
    them (by sending their names to the rmdir command), enter


    ```

    find junk -type d -ok rmdir {} \;

    ```


    # PIPE FITTING


    Throughout this chapter, we''ve discussed how to manipulate a file with many different
    tools. But you can use each of these tools in a more powerful way by combining
    them into pipelines. Back in Chapter 4, "Living in a Shell," you learned how to
    pump the output from one command to another by redirecting the input or output
    of those commands.


    Following are several examples that show how to combine the power of the tools
    described in this chapter.


    +   - To find files that have not been accessed for over 30 days and print the
    first five lines of each:


    ```

    find . -atime +30 -exec head -5 {} \;

    ```


    +   - To find out if a process named netscape is running:


    ```

    ps | grep netscape

    ```'
