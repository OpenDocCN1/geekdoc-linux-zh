    # USE CAT TO JOIN FILES


    The cat command''s primary function is to concatenate, or join, files, but you
    can also use it to display a file on the screen. The cat command takes one or
    more files that you specify, smashes them together, and then sends the resulting
    file to the standard output device (without changing any of the original files).


    The standard output device is your screen, but by using the greater-than (>) operator,
    you can redirect cat''s output to another file. Here are some examples:


    | Command | Description |

    |---|---|

    | cat food | Display the food file on the screen. |

    | cat scratch fever | Join the files scratch and fever and then display the result
    on the screen. |

    | cat eats bird > DetailsAt11 | Join the files eats and bird and save them in
    the file DetailsAt11. |


    Note that the original files that cat joins are not modified. For example, say
    the file eats contained these lines:


    ```

    The Owl and the Pussy-Cat went to sea

    In a beautiful pea-green boat.

    ```


    Also say the file bird contained these lines:


    ```

    They took some honey, and plenty of money

    wrapped up in a five-pound note.

    ```'
