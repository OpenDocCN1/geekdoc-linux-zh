- pgno: 67
  md: 'The graphical user interface (GUI) for Linux systems is XFree86, a PC-based
    implementation of X Windows. Red Hat Linux version 6 adds GNOME (GNU Network Object
    Model Environment), a friendly desktop manager that makes it easy to use and configure
    X Windows and Enlightenment, a window manager that allows you to control the look
    and feel of the desktop with themes, wallpaper, sound, screensaver, and special
    effects.


    Using GNOME is a lot like using other graphical user interfaces—you can have several
    applications open in different windows on the screen, and you can move from one
    to another using your mouse. If you''re familiar with Windows 95/98 or the Macintosh,
    you''ll have no trouble adapting to GNOME. Later, you may want to check out “The
    GNOME Control Center” and “Customizing Enlightenment” in Chapter 13, “Tweaking
    Linux,” to learn how to make your desktop more fun and personal. See the sample
    GNOME desktop in Figure 2-1.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_67_0.png)


    Figure 2-1: *The GNOME desktop*'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # DESKTOP AND WINDOW MANAGERS


    One of the fundamental principles of X Windows architecture is the cooperation
    of separate components. X Windows’ client-server model of operation and the capability
    it provides that allows users to replace major pieces of functionality with alternative
    plug-in modules make it very flexible and popular in the Unix world. The most
    prominent examples of this flexible architecture are the X Server, Desktop Manager,
    and Window Manager.


    Many people are confused by these terms, and frankly, understanding the difference
    between the server, the desktop manager, and the window manager is not all that
    important to the average Linux user. If you want to think of them simply as components
    of the X Windows environment, that’s fine—you can safely ignore the rest of this
    section. If, however, you’re prone to endless tinkering with your system, you
    should read on to get a better understanding of these terms.


    The X Server is the low-level program that handles the details of writing text
    and graphics widgets to the screen with the specified size, colors, and location.
    When you ran the XConfigurator utility, it selected an X server appropriate for
    your video hardware. The server listens for the various client programs to ask
    for these widgets to be drawn. One of those client programs is the Window Manager,
    which works as a layer between the client programs and the X server. It puts borders
    around windows, resizes windows, and allows for controls to move things.


    The Desktop Manager works at an even higher level than that, giving a unified
    look and feel to programs running on the desktop and acting as an intermediary
    so that programs can interact and exchange data. The Desktop Manager also gives
    you a set of desktop applications such as a file manager, text editor, and other
    productivity tools. Your Red Hat Linux system is shipped with both GNOME and KDE
    (K Desktop Environment), the two most popular Desktop Managers. The default X
    Windows configuration for Red Hat version 6 is GNOME with the Enlightenment Window
    Manager. GNOME was selected because it’s very popular and is the only fully open
    source desktop environment. At the time Red Hat version 6 was released, Enlightenment
    was the only Window Manager that was 100 percent compliant with GNOME. For more
    information on customizing the look and feel of your GNOME desktop, see “The GNOME
    Control Center” and “Customizing Enlightenment” in Chapter 13, “Tweaking Linux.”'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Here are some other Window Managers that work with GNOME, but which may not
    be fully compliant:


    +   - **Window Maker**  http://www.windowmaker.org

    +   - **FVWM**  http://www.fvwm.org

    +   - **Icewm**  http://icewm.sourceforge.net


    See Chapter 13 for information on downloading other Window Managers and trying
    them out using the Window Manager applet in the GNOME Control Center. If you want
    to try out KDE, use the switchdesk command and select the “KDE” option. To return
    to GNOME, use the switchdesk command again and select “GNOME.”


    # Mouse and Window Conventions


    Have a close look at the windows on your GNOME X Windows desktop, and you’ll see
    some common features, namely the title bar; “System Menu” button; “Minimize,”
    “Maximize,” and “Close” buttons; and grab handles.


    Refer to Figure 2-1 as we explore some of the ways you can interact with a window.
    (I’ve used LMB and RMB as abbreviations for left mouse button and right mouse
    button in the following table.)


    | FEATURE | LOCATION | FUNCTION |

    |---|---|---|

    | System | Upper left | Click with LMB to reveal System menu or double-click to
    close. |

    | Title bar | Top middle | Click with LMB to bring window to front, or click with
    RMB to send window to rear. You can also move a window by dragging while holding
    down LMB on the title bar. |

    | Maximize | Top right (square inside button) | Click with LMB to make the window
    occupy the full screen (or its maximum size). Click again to resume former size
    |

    | Minimize | Top right (underscore inside button) | Click with LMB to send the
    window to the Pager on the bottom of the screen. Double-click an item in the Pager
    to restore it to a window. |

    | Grab handles | Corners, left, right, and bottom borders | Hold down LMB and
    drag to resize the window. |


    The left mouse button is used to mark, select, and drag items. To copy text, click
    and drag with the left mouse button across the text'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'you want to copy, move the pointer to the place you want the text placed, and
    press the middle mouse button. (If you have a two-button mouse, press the left
    and right buttons simultaneously to simulate the middle button.) Clicking the
    right mouse button will display a menu for the selected object, if one applies.


    # MAJOR FEATURES OF GNOME


    Major features of GNOME include the following:


    +   - The GNOME Panel. This is similar to the Windows 95/98 taskbar, but of course
    more fun and powerful. The GNOME Panel is used to launch applications, manage
    virtual desktops, and display the system status. The panel is the long bar located
    at the bottom of the screen.

    +   - The desktop. This is the place for data, applications, and active windows.

    +   - A set of tools and productivity applications, such as the File Manager,
    text editor, spreadsheet, calendar, and calculator.

    +   - A set of conventions that make it easy for applications to cooperate and
    be consistent with each other. This makes life easier for both programmers and
    end users.


    GNOME is part of the GNU project, so it’s free software and is open source. This
    means that the source code is available for anyone to inspect and modify. You
    can learn more about the GNOME project or get involved in the development yourself
    by visiting the GNOME Web site at http://www.gnome.org/.


    # THE GNOME PANEL


    The GNOME Panel, located at the bottom of the screen (see Figure 2-2) is the heart
    of the GNOME interface and is the place for your application launchers, applets,
    the Pager, and the main menu. The panel is also designed to be highly configurable,
    and you’ll learn how to set up the menus and applications just the way you want
    them to be.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_71_0.png)


    Using the GNOME Panel is very simple and will come easily to anyone who has used
    a GUI-based operating system. You can launch programs, add application launchers
    to the panel, add various applets (little programs that run inside the panel),
    or even create multiple panels. All of these functions and more will be described
    in this section.


    # USING THE MAIN MENU


    ![](img/3137cdda7122042e86dbeafe9840d4ed_71_1.png)


    The button on the bottom left of the panel that looks like a footprint (shown
    at the left) is the “Main menu” button, sometimes called the foot. Just click
    on the “Main menu” button and you’ll see a menu of preloaded applications and
    actions (as in Figure 2-3), including a log-out command.


    The “Main menu” button is a convenient means of starting any of the applications
    installed on your system, and it works a lot like the “Start” button on Windows
    95/98 systems. Some of the menu items on the Main menu have cascading submenus
    that appear when you click on them. If you click and hold down the left mouse
    button, you can navigate the menus just by moving the mouse. When you find the
    application you want to start, release the button.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_71_2.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'If you find that the cascading menus are a little too sensitive, click and
    release the left button to reveal a submenu; then carefully move the mouse into
    the submenu. The right mouse button has a special function in the main menu area,
    which we’ll learn about later in this section.


    # CHANGING THE MAIN MENU PROPERTIES


    The Main menu is divided into two areas: the System menus and the User menus.
    To change the properties of the Main menu, right-click on the “Main menu” button
    and select “Properties” to launch the Menu Properties dialog box (see Figure 2-4).


    The only thing you can customize here is whether the various submenus appear within
    the Main menu, in a submenu, or not at all. For example, if you change the selection
    for User menu from “On the main menu” to “In a submenu,” you will no longer see
    the items from the User menu when you first display the Main menu. You’ll have
    to click on “User menu” to make them appear.


    # CUSTOMIZING THE MAIN MENU


    If you want to add or delete items in the Main menu, use the Menu Editor. To start
    the Menu Editor, click on the “Main menu” button and select “Settings” and then
    “Menu Editor” (see Figure 2-5).


    ![](img/3137cdda7122042e86dbeafe9840d4ed_72_0.png)


    Figure 2-4: Menu Properties dialog box'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_73_0.png)


    Figure 2-5: GNOME Menu Editor


    The Menu Editor is divided into two main panels. On the left panel, you will see
    a tree-like view of your current menus. Clicking on a plus sign will expand the
    tree to reveal the items in a menu, and clicking on a minus sign will reverse
    the process. The right panel is a dialog box where you can specify the particulars
    for new applications you want to add to the menu.


    You can use the buttons at the top of the screen to add or delete items or to
    add a new submenu. The position of a menu item can be changed by pressing the
    “Move up” and “Move down” buttons on the toolbar or by dragging the item with
    the left mouse button. The Menu Editor supports drag-and-drop, which allows you
    to drag applications from other windows (such as the File Manager or the GNOME
    Panel) to the menus you want them in.


    NOTE: Any user can modify the User menus, but only the root user can modify the
    System menus.


    # THE GNOME PAGER


    The Pager (Figure 2-6) is a tool on the GNOME Panel to help you manage the applications
    currently active on your desktops. You can use it'
  merge: -1
  img_proc: true
- pgno: 74
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_74_0.png)


    Figure 2-6: The GNOME Pager


    to restore minimized applications to your desktop or to switch from one desktop
    area to another.


    The area on the left side of the Pager is the desktops view, which shows all of
    your desktops and the applications within them. Each desktop is represented by
    a small rectangle, and the applications on the desktops are outlined in miniature
    form. By default, all applications are started in the upper-left desktop, but
    if your screen gets too cluttered, switch to another desktop by clicking on one
    of the rectangles.


    The task list on the right side of the Pager displays the active applications
    on the current desktop. If you minimize an application, you can return it to your
    desktop by clicking on its entry in the task list. The arrow button in the middle
    of the Pager displays a list of all the applications active on any desktop. You
    can also restore minimized windows by clicking on this list.


    # CUSTOMIZING THE PAGER


    The Pager is very customizable. To open the Pager Properties dialog box (see Figure
    2-7) right click on "Pager" and select "Properties" from the pop-up menu. You
    can tweak the maximum width of the task list, the number of rows and columns in
    the task list, and the number


    ![](img/3137cdda7122042e86dbeafe9840d4ed_74_1.png)


    Figure 2-7: Pager Properties dialog box'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'of rows in the pager. You can also try out various options such as viewing
    all applications on all desktops (instead of just the current desktop), turn the
    task list off, turn the Pager off, or use small pagers. Try the various options
    to configure the Pager just the way you like it.


    # HIDING THE PANEL


    If the GNOME Panel is getting in your way, you have several options. You can hide
    the panel by pressing either of its “Hide” buttons. There are hide buttons on
    both sides of the Panel, so you can slide it away in either direction. Even more
    useful is the auto-hide feature, which makes the panel slide off the bottom of
    the screen. The panel springs back up when you bring the mouse into the panel
    area. To enable auto-hide, select **Panel • This Panel Properties** from the “Main
    Menu” button (see Figure 2-8).


    If you use auto-hide all the time, it might be wise to disable the “Hide” buttons,
    to regain a little extra space on the panel.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_75_0.png)


    *Figure 2-8: Panel Properties window*'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# MOVING THE PANEL


    You can also use the Panel Configuration dialog box to change the position of
    the panel on your screen. Select “Top,” “Right,” “Left,” or “Bottom”; then click
    the “Apply” button to move the panel.


    # ADDING APPLICATION LAUNCHERS


    If you want to add an Application Launcher (an icon that starts a particular application)
    to the panel, right-click the panel and select “Add New Launcher” from the pop-up
    menu. After selecting the Add New Launcher menu item, you will see a dialog box
    that enables you to set the properties for the application launcher you want to
    add.


    In the Create Launcher Applet dialog box (see Figure 2-9), you can add a name
    for your launcher, a comment, and the command line to launch the application,
    and you can define the application type. You can also click the icon button and
    choose an icon to represent the application from the icon picker. If no icon is
    chosen, a default icon will be used.


    Another, quicker method of adding an application launcher to the GNOME Panel is
    to go to the Main menu and right-click on an application menu item. You will be
    given another menu that contains the


    ![](img/3137cdda7122042e86dbeafe9840d4ed_76_0.png)'
