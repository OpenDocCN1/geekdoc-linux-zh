- pgno: 156
  md: 'program. When you start X Windows, the File Manager is already active and minimized
    on your desktop. Double-click on the folder icon at the top left of your screen
    to see the File Manager window. (Refer to Chapter 2, “GNOME: The Linux GUI,” for
    more detailed usage information.)


    # DISPLAYING FILES


    You know how to get a list of files. But what if you want to take a peek at a
    file''s contents? Several commands, including cat, more, and less, can be used
    to display files. Let''s see how they work in this example:


    ```

    cat pig_info

    Pigs make great pets, but they are not dogs or cats. Maybe

    somewhere in between. I tend to believe that they have more

    personality. They do require significant amounts of attention,

    love, and scratches. But they aren''t always snuggly in return.

    ```


    The cat command (short for concatenate) shown in this example is like the DOS
    type command. In response to the command cat pig_info, the system simply splatters
    the file on the screen. If there is more data in the file than will fit on one
    screen, the contents whiz by before you can see it. The more command solves this
    problem by displaying the file screen by screen:


    ```

    more dog_info

    Affectionately known as the “Toller,” the Nova Scotian Duck

    Tolling Retriever was once called the Little River Duck Dog,

    since it was developed in the Little River district of Yarmouth

    County, Nova Scotia. This engaging dog is a specialist with

    waterfowl. Tolling, or luring, is the practice of tricking ducks

    into gunshot range. Hunters had long observed this behavior

    --More--(0%)

    ```


    The more command pauses when the screen fills up and waits for you to press the
    spacebar before it rolls out another screenful of text. A legend at the bottom
    of the screen tells you what percentage of the file has been displayed so far.
    You can press CTRL-C to quit more before reaching the end of the file.


    The less command works like more except that it lets you move both forward and
    backward in the file while the command is running—use the B key on your keyboard
    to back up one screen and the spacebar to move forward and show the next screen.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Although all of these commands will let you view the contents of a file in
    different ways, none allow you to change the data in the file. If you want to
    view and update a file, use one of the text editors discussed in Chapter 7, "Text
    Editors."


    # DISPLAYING FILES WITH MIDNIGHT COMMANDER OR FILE MANAGER


    If you like the Midnight Commander program, you can use the built-in View function
    to look at the contents of a file. Just press the F3 key after selecting the desired
    file with the arrow keys. To exit the viewer, press F3 again. Or if you''re running
    Windows with GNOME, the File Manager also has a built-in file viewer. Right-click
    on a file and select the View option (see Figure 5-3) to launch the file viewer
    in a new window (Figure 5-4).


