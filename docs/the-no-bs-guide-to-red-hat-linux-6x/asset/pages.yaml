- pgno: 107
  md: "# USING FINGER\n\nFinger is a nifty little tool that can tell you who owns\
    \ a particular email address, or sometimes display other interesting data. As\
    \ the name implies, when you use Finger you are “pointing” at someone. When you\
    \ finger an address, you send a request to another system asking it to tell you\
    \ everything it knows (or is willing to tell) about that address. The results\
    \ of fingering vary widely from system to system, and some systems will not even\
    \ honor Finger requests at all, for privacy reasons. Still, most Finger requests\
    \ will return some limited information about the user, such as the user's real\
    \ name or the last time the user logged in to the system. To use the Finger client\
    \ from your Linux command line, enter the finger command followed by an email\
    \ address, like this:\n\n```\nfinger jsmith@hotdog.edu\n```\n\nHome: /user/jsmith\
    \    In real life: Janet Smith\nShell: /bin/csh\nNew mail received Thu May 16\
    \ 13:33:18 1996;\n unread since Tue May 14 07:50:31 1996\nJanet Smith (jsmith)\
    \ is not presently logged in.\n\nAnd as you’ll see in this next example, sometimes\
    \ people connect strange things to the Net and allow you to query them via Finger...\n\
    \n```\nfinger coke@cs.cmu.edu\n```\n\nM & M          Coke Buttons\n/------\\ \
    \       C: CCCCCCCCCCCCCCCCCCCCCCC\n[?????]        C: ............   D: ............\n\
    [?????]        C: ............   D: ............\n[?????]        C: ............\
    \   D: ............\n[?????]                     C: CCCCCCCCCC\n\\------/    \
    \                 S: CCCCCCCCCC\n|     Key:\n|     0 = warm; 9 = 90% cold; C =\
    \ cold; . = empty\n|     Beverages: C = Coke, D = Diet Coke, S = Sprite\n|   \
    \  Leftmost soda/pop will be dispensed next\n----... M&M status guessed."
  merge: -1
  img_proc: true
- pgno: 108
  md: 'This example shows how to get the status of a Coke machine, which has been
    connected to a minicomputer and wired into the Internet at Carnegie-Mellon University!


    # EMAIL HANDLING


    In Chapter 10, “Managing Your Email,” you will learn about the mail and Pine programs,
    which are text-based email handlers on your Linux system. With a SLIP or PPP connection,
    you can send email to Internet addresses, but you can’t receive Internet mail
    directly on your system without a permanent connection and a registered domain
    name. The fetchmail utility is the next best thing, though, if you don’t have
    a permanent Internet connection. Once you have established a dial-up connection
    to your ISP, the fetchmail program will transfer any new mail waiting on your
    ISP’s mail server to a local mail folder on your Linux system. You can then read
    and respond to emails using your favorite Linux email client. You may find this
    more convenient than using telnet to log in to your ISP and checking your email
    with Pine. Use the man fetchmail command for usage details.


    If you want to be able to receive mail directly on your Linux system, you’ll have
    to work with your ISP to register a domain name and get either a permanent or
    UUCP connection to the Internet. You can create a permanent connection (up to
    56 Kbps) with a modem and a dedicated phone line, or you can install some expensive
    equipment and special phone connections to forge a high-speed link.


    A UUCP connection is one where you occasionally dial up your ISP to send outgoing
    and receive incoming email messages. Any mail destined for your domain will queue
    up at your ISP until you dial in to receive it. UUCP is much less expensive than
    a dedicated phone connection to your ISP and is quite common on BBS systems in
    rural areas of the United States, and in other countries, where long-distance
    telephone costs are much higher.


    Refer to the UUCP-HOWTO file and the “Help with Linux Networking” section later
    in this chapter for more details on UUCP'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'connections. (Visit the Linux Documentation Project home page on the Web at
    http://metalab.unc.edu/LDP to find all the HOWTO files.)


    # USING PING


    Ping is a simple utility that can tell you the status of another computer on the
    Internet and the quality of the connection between your computer and the remote
    host. Ping works by throwing electronic pebbles at other computers. Every computer
    on the Internet has a little daemon just waiting for other computers to "ping"
    it, and when this happens, it tries to catch the pebbles and throw them back.
    If the network connection is sluggish, some of the pebbles might never hit their
    target, and if the other computer is slow or busy, the little daemon might miss
    or drop some pebbles.


    To use the Ping client from your Linux command line, enter the ping command followed
    by a domain name or IP address, like this (press CTRL-C to stop after a few lines
    of output):


    ```

    ping cqu.edu.au


    PING cqu.edu.au: 56 data bytes

    64 bytes from cqu.EDU.AU (138.77.1.23): icmp_seq=1 time=8100 ms

    64 bytes from cqu.EDU.AU (138.77.1.23): icmp_seq=2 time=7354 ms

    64 bytes from cqu.EDU.AU (138.77.1.23): icmp_seq=3 time=6281 ms

    ^C

    ----cqu.edu.au PING Statistics----

    13 packets transmitted, 3 packets received, 77% packet loss

    round-trip (ms) min/avg/max = 6281/7245/8100

    ```


    This output tells you three things:


    +   - The other computer (located at a university in Australia, represented by
    the "au" in its address) is running and connected to the Internet. We know this
    because we didn’t get a "no such host" or "host is not responding" message.


    +   - It has an IP address of 138.77.1.23. This is the value in parentheses on
    the second line of the output.


    +   - The connection is lousy. We can tell this because of the Statistics section
    at the end of the output. We sent out thirteen pebbles, er, packets, and only
    three were acknowledged. The "77% packet'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'loss" and the average response time of 7245 milliseconds (7.245 seconds) is
    terrible. A more reasonable Ping response time would be under 750 milliseconds.


    You can use Ping to test the speed of a connection before trying to connect via
    Telnet or FTP. Especially with FTP, you often have a choice of servers that all
    mirror the same set of files, so pick the quickest one.


    # USING TIN FOR USENET


    Tin is a text-based program you can use to read and post to Usenet newsgroups.
    From the initial menu, you can select a newsgroup to read, and Tin will display
    the current postings in that group, as shown here:


    ```

    Group Selection (news.mysserver.com $)

    1  884  alt.internet.services

    2  167  news.announce.newusers

    3  343  news.newusers.questions

    4   49  news.answers

    5  183  comp.internet.net-happenings


    <n>=set current to n, TAB=next unread, /=search pattern, c)atchup,

    g)oto, j=line down, k=line up, h)elp, m)ove, q)uit, r=toggle unread,

    s)ubscribe, S)ub pattern, u)nsubscribe, U)nsub pattern, y)ank in/out

    ```


    You do all your navigating with the cursor keys.

    To start Tin, you must first set the NNTP SERVER (Network News Transport Protocol
    Server) environment variable to the name of your ISP''s news server (usually news
    will work fine). Issue the command shown here from the prompt, and also add it
    to the /etc/bashrc file (you must log in as root) so it will be set automatically
    the next time you boot up.


    ```

    NNTP SERVER=news

    ```


    After setting the environment variable, enter one of the Tin startup commands
    shown here:


    ```

    rtin -rq      Use the first time only

    rtin -rqn     Use after the first time

    ```'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'The first time you use Tin, it will download a huge list of all available newsgroups
    from your ISP''s server, so don''t be surprised if it takes several minutes for
    the first screen to appear.

    For more information on using Tin, use the man tin command to read the excellent
    online help for this program.


    # USING LYNX


    Lynx is a text-based Web browser. You don''t get to see the graphics on a Web
    page, but for some people, that''s a plus. Many Web pages are loaded with gratuitous
    images that take forever to load and add little or no real value. So Lynx can
    usually get you to the information you''re after a lot faster than a graphical
    browser. Here''s what a Lynx screen might look like:


    ```

    Yahoo!


    [ Reuters News Headlines ] [ What''s New ] [ Cool Sites ]

    [ Write Us ] [ Add URL ] [ Random Link ] [ info ]


    Search Options


    * Arts -- Humanities, Photography, Architecture ...

    * Business and Economy [Xtra!] -- Directory, Investments ...

    * Computers and Internet [Xtra!] -- Internet, WWW, Software

    * Education -- Universities, K-12, Courses ...

    * Entertainment [Xtra!] -- TV, Movies, Music, Magazines ...

    * Government -- Politics [Xtra!], Agencies, Law, Military ...

    * Health [Xtra!] -- Medicine, Drugs, Diseases, Fitness ...

    * News [Xtra!] -- World [Xtra!], Daily, Current Events ...

    * Recreation and Sports [Xtra!] -- Sports, Games, Travel ...


    Arrow keys: Up/Down to move. Right to follow link; Left to go back.

    H)elp O)ptions P)rint G)o M)ain screen Q)uit /=search

    ```'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'In addition to displaying Web pages, Lynx can navigate FTP sites and download
    files for you. It can also send email, read or post Usenet newsgroups, and display
    information stored on gopher servers. To start the Lynx client from your Linux
    command line, enter the lynx command, optionally followed by a Web address (URL),
    like this:


    +   - `lynx` Show the default Web page.

    +   - `lynx http://www.yahoo.com` Show a specified Web page.

    +   - `lynx ftp://ftp.netscape.com` Show files at an FTP site.

    +   - `lynx gopher://cwis.usc.edu` Show files at a gopher site.

    +   - `lynx mailto:user@site.com` Prepare to send email.

    +   - `lynx news:rec.humor.funny` Show postings in a newsgroup.


    Use the help command in Lynx to learn more about navigating the Web without a
    mouse.


    # USING WHOIS


    The whois command will search the central domain registry at InterNIC and give
    you information about a domain, such as who owns it, where it is located, and
    how to contact the owners. Here''s an example of whois output:


    ```

    whois aol.com

    America Online (AOL-DOM)

    12100 Sunrise Valley Drive

    Reston, Virginia 22091 USA


    Administrative Contact:

    O''Donnell, David B (DB03) PMDatropos@AOL.COM

    703/453-4255 (FAX) 703/453-4102

    Technical Contact, Zone Contact:

    America Online (AOL-NOC) trouble@aol.net

    703-453-5862

    ```'
  merge: -1
  img_proc: true
