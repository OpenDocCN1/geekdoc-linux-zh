- pgno: 169
  md: 'Working from a Linux command line is not always intuitive, especially since
    there are hundreds of different commands with a myriad of switches and flags to
    make things even more confusing. You certainly don’t need to know all of them
    to make good use of your Linux system, but there is a certain set of indispensable
    tools with which you should be familiar.


    We’ve covered a handful of commands in previous chapters that let you work with
    the shell and your file system. The commands covered in this chapter will complement
    what you’ve learned and give you some essential tools to manage your Linux environment.
    (You’ll also be able to use these commands on other Unix-based systems.) You’ll
    pick up other important commands in Chapter 7, “Text Editors,” and Chapter 8,
    “Slicing and Dicing,” but you should first master this starter set to build the
    skills that will help you perform common Linux tasks more easily.


    # IF YOU NEED HELP, ASK THE MAN


    Assuming you can remember the right command for a particular job, it’s tougher
    still to remember all the switches associated with that command. The man command
    (short for manual) will help you on both counts by displaying pages from online
    manuals and telling you which commands may be relevant to the task at hand.


    Say you want to change your password, but you don’t know the command to do it.
    You can use the man command plus the keyword flag, -k, to search by keyword password
    for relevant commands:


    | man -k password |  |  |

    |---|---|---|

    | passwd | passwd (1) | - change login password |

    | pwck | pwck (1m) | - password/group file checkers |

    | vipw | vipw (1b) | - edit the password file |


    You can probably deduce that passwd is the correct command. But before blindly
    issuing any Linux command, you should know the proper syntax and understand what
    the command might do to you first. Using man with a command name will display
    all you need to know (probably more) about a command. For example, entering


    ```

    man passwd

    ```


    will display'
  merge: -1
  img_proc: true
- pgno: 170
  md: "passwd(1)      User Commands      passwd(1)\nNAME\n    passwd - change login\
    \ password and attributes\nSYNOPSIS\n    passwd [ name ]\n    passwd [ -d | -l\
    \ ] [ -f ] [ -n min ] [ -w warn ]\n          [ -x max ] name\n    passwd -s [\
    \ -a ]\n    passwd -s [ name ]\n\nDESCRIPTION\n    The passwd command changes\
    \ the password or lists\n    attributes associated with the user's login name.\n\
    --More--(5%)\n\n(The man command pauses after each screenful and waits for you\
    \ to press the spacebar before continuing.) The word More at the bottom of each\
    \ page indicates how much of the help has so far been displayed. The terms in\
    \ square brackets are optional parameters (-d, -l, -f, for example); vertical\
    \ bars indicate that the terms on either side are mutually exclusive—you can use\
    \ only one at a time.\n\nFor more information on getting help with Linux commands,\
    \ see the section at the end of Chapter 4, \"Living in a Shell,\" that discusses\
    \ the GNOME Help Browser. The Help Browser operates in the X Windows environment\
    \ and offers point-and-click access to several sources of help information.\n\n\
    # Use passwd to Change Your Password\n\nYou can use the passwd command to change\
    \ your log-in password, and as you can tell from the man output shown in the preceding\
    \ section, you have quite a few options. Here are some of the most common:\n\n\
    +   passwd          Change your own password\n+   passwd sleepy   Change sleepy's\
    \ password\n+   passwd -d sleepy Delete sleepy's password\n\nWhen you enter one\
    \ of these commands to change a password, you will be prompted for the old (current)\
    \ password and a new password. Your new password should be at least six characters\
    \ long and not too easy for someone else to guess. Oh, and writing it down on\
    \ a scrap of paper taped to your monitor is not recommended either. :-)"
