- pgno: 291
  md: 'Even though Linux is a very complete operating system, you will probably have
    occasion to access the programs and files you left behind in the DOS world. Fortunately,
    there are several ways to do so without shutting down Linux and booting up DOS.


    This chapter will show you how to use the MTOOLS package to read and write DOS
    floppy disks under Linux, and how to mount your DOS hard drive partition to access
    a DOS file system while running Linux. You''ll also learn about DOSemu, a DOS
    emulator that runs under Linux, as well as WINE, a Windows emulator that enables
    you to run Microsoft Windows applications in Linux''s X Windows environment.


    # ACCESSING DOS FLOPPYIES WITH MTOOLS


    Do you need to list the files on a DOS-formatted floppy disk while running Linux?
    Do you need to copy a file from a DOS disk to your Linux file system, or vice
    versa? You can use the MTOOLS commands to do these and lots of other DOS-like
    things with Linux.


    The MTOOLS package is a set of Linux commands that mimic the DOS commands DIR,
    COPY, TYPE, DEL, RENAME, and a few others. They''re called the MTOOLS because
    they all start with the letter m, and they work much like their DOS counterparts.


    Here''s a list of the MTOOLS commands and what they do:


    +   - mattrib Modify the attributes of a file.

    +   - mcd Change the current directory.

    +   - mcopy Copy a file.

    +   - mdel Delete a file.

    +   - mdir List the files in the directory.

    +   - mformat Format a disk.

    +   - mlabel Change the disk label.

    +   - mmd Make a new directory.

    +   - mrd Remove a directory.

    +   - mren Rename a file.

    +   - mtype Display the contents of a file.'
  merge: -1
  img_proc: true
- pgno: 292
  md: "Okay, pop a DOS disk in the machine and let's try some examples.\nHere we see\
    \ the mdir command in action, listing the files on a disk:\n\n```\nmdir A:\n\n\
    Volume in drive A has no label\n\nVolume Serial Number is 1205-1049\n\nDirectory\
    \ of A:\\\n\nCOMMAND COM      54,645 05-31-94  6:22a\nFORMAT  COM      22,974\
    \ 05-31-94  6:22a\nSYS     COM      9,432 05-31-94  6:22a\nMOUSE   COM      28,949\
    \ 04-02-93  4:39p\nEDIT    COM        413 05-31-94  6:22a\nFDISK   EXE      29,336\
    \ 01-01-97 12:39a\n\n              6 file(s)          145,749 bytes\n\n      \
    \                   1,311,915 bytes free\n```\n\nNow let's copy a file from Linux\
    \ to the disk, and vice versa:\n\n```\nmcopy A:pandavu.tgz /tmp\nmcopy /tmp/kornmeal.txt\
    \ A:\n```\n\nThe mcopy command figures out in which direction to perform the file\
    \ transfer by looking for the A: in either the source or the target file name.\
    \ If you have two floppy drives, you can use B: when referring to the second floppy\
    \ drive.\n\nHere's an example showing the use of the mdel command to delete a\
    \ file on the disk:\n\n```\nmdel mouse.com\n```\n\nNote that we didn't prefix\
    \ the name of the file to be deleted with A: this time. All of the MTOOLS commands\
    \ (except mcopy) assume that you're working with the A drive, so you can omit\
    \ the A: if you like, but I recommend that you don't, just for safety's sake."
