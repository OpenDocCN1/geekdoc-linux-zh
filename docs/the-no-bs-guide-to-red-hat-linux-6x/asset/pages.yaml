  md: 'selection "Add this launcher to panel." If you select this menu item, it will
    automatically add a launcher for that application to the panel in which you invoked
    the Main menu. At this point, you can right-click on the launcher and select the
    "Properties" menu item to change any options for that launcher.


    # ADDING DRAWERS AND MENUS TO THE PANEL


    If you want to group a subset of applications together, you can use a drawer.
    A drawer is simply a small menu-like button that sits on your panel that groups
    application launchers together in one place. Once you have placed a drawer on
    the panel, you can click on it to raise the menu of applications and click again
    to lower it.


    There are a couple of ways to place a drawer on your panel. First, you can right-click
    on the panel and select "Add drawer" from the pop-up menu. Second, if you want
    a whole subset of menus from the Main menu to become a drawer, you can right-click
    on the title bar of that menu and select "Add this as drawer to panel" from the
    pop-up menu. You can add menus to your panel in the same way as you add drawers.
    Menus are very similar to drawers except that they do not use large icons to represent
    application launchers. Instead, they use a style similar to the Main menu: small
    icons and the application name. You can add a menu by right-clicking on the title
    bar of a menu and selecting "Add this as menu to panel" from the pop-up menu.
    You can also add system directories to the panel as menus by dragging a directory
    out of the GNOME File Manager and dropping it on the panel. The image at the left
    shows the Menu and Drawer icons as they appear on the GNOME Panel.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_77_0.png)


    ![](img/3137cdda7122042e86dbeafe9840d4ed_77_1.png)


    ![](img/3137cdda7122042e86dbeafe9840d4ed_77_2.png)


    Clicking on a drawer or menu will open it. Figure 2-10 shows samples of an open
    drawer and menu. Note that drawers stay open after you click on one of the icons
    inside and have to be closed by clicking the down arrow. Menus automatically close
    after you make a selection.


    Figure 2-10: Open drawer (left) and menu (right)'
  merge: -1
