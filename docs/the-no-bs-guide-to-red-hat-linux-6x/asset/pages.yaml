    # SAVING YOUR WORK


    So far, so good—let''s save this little masterpiece. You''re still in Input mode,
    so press ESC to enter Command mode; then type ZZ (to put your file to sleep).
    You won''t see any Z''s on the screen, but after you''ve entered the second Z,
    your file will disappear, your Linux command prompt will return, and you''ll see
    this message, indicating that your file was successfully saved:


    ```

    "cow.joke" 6 lines, 113 characters.

    ```'
