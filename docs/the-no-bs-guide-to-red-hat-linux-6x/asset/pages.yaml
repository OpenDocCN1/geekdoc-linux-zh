- pgno: 259
  md: 'There’s a lot of hype about the multimedia aspects of the Internet, but the
    true killer app in the online world has always been email. More than anything
    else, people get online to communicate with other human beings—not other computers.
    In this chapter, you’ll get a brief introduction to Internet email and learn about
    the tools you can use on a Linux system to send and receive email.


    # EMAIL ADDRESSES


    To send email, you have to know the email address of the person who is to receive
    your message. An email address consists of two parts, a user name and a domain
    name, separated by the at (@) sign. And unlike almost everything else in the Unix
    world, email addresses are not case sensitive.


    For example, if your email address is hermie@fritz.com, then hermie is the user
    name and fritz.com is the domain name. Most domain names end in a three-letter
    code, such as com, edu, or gov, which indicates something about the user’s location
    (whether they’re at a company, university, government office, and so on):


    +   - com Company or business

    +   - edu College or university

    +   - gov Government office

    +   - mil Military institution

    +   - net Network node (usually an Internet service provider)

    +   - org Organization (professional societies, nonprofit groups, and so on)

    +   - us Usually a school, library, or local government office in the U.S.


    As this book goes to press, the domain registration process is being completely
    revamped, so you may soon see new top-level domains such as biz, web, info, and
    others.


    Here are some examples of email addresses using the various domain names:


    ICUehq.bigbro.COM

    A user at a large company (headquarters)'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'JaneDoe@CS.harvard.edu

    A computer science student at Harvard University


    Hacker7@WhiteHouse.gov

    Hackers at the White House?


    D.Nukem@ftriley.army.mil

    A user at a military site


    BobRankin@ulster.net

    Yours truly :-)


    elmo@IEEE.org

    A member of the IEEE society


    library@hometown.ny.us

    A local library somewhere in New York State in the United States


    The exceptions to this rule are non-U.S. addresses that end in a two-digit country
    code and are usually (but not always) preceded by “ac” (for a university) or “co”
    (for a company): for example,


    Peter@nms.ac.uk

    A student at a British university


    aldeana@business.ntu.edu.au

    A student at an Australian university


    zkoltz@audg.gov.ab.ca

    A government employee in Alberta, Canada


    takemori@bs.mcts.co.jp

    A user at a Japanese company


    christoph.wolfe@metronet.de

    A user at a German company


    # NETIQUETTE


    It’s sometimes so simple to communicate electronically that you forget that users
    on the other end of the wire can’t necessarily pick up on your message’s emotions
    and nuances the way they might in a hand-written letter or in spoken conversation.
    They may even misinterpret a joke as an insult—and many people do. It’s especially
    important to keep this danger in mind when you’re participating in group discussions
    such as Internet mailing lists.


    The moral? Be extra careful to make your email messages clear. If you’re telling
    a joke that could be construed as a fact or a harsh, personal comment, say so!
    Don’t use the excuse of being able to hide behind your terminal as a license to
    be rude. And be extra-sensitive to the fact that the Internet is a global audience,
    and not all users have a strong command of English.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Smileys (sometimes called emoticons), or textual representations of emotions
    that people commonly use in their email, are one way to express feelings in the
    otherwise emotionless world of email. When you see a collection of dashes, parentheses,
    and other punctuation marks (like :-) or :-(for example) that don’t seem to make
    sense, try turning your head sideways, and the meaning should come into focus
    right away.


    One final point on netiquette, DON’T SHOUT! Even though email addresses are not
    case sensitive, the people who read email often are. And the use of ALL CAPITAL
    LETTERS in email is considered shouting. It’ll also brand you (deservedly or not)
    as a clueless newbie who can’t find the right key to turn off the caps.


    # Sending Email with Linux


    The most basic way to send email on a Linux system is with the mail command. The
    mail program is a command-line interface for sending and receiving electronic
    mail. It works, but it’s not pretty. Later in this chapter, you’ll learn about
    Pine, a much friendlier email interface, but you should know how to use mail since
    it’s guaranteed to be available on any Unix system.


    Let’s say you’re logged in as root and you want to send a message to hermie. Start
    the process by typing


    ```

    mail hermie

    ```


    The system will respond with a “Subject:” prompt. Type the subject for your note,
    press ENTER, and then write your message, line by line. When you’re done with
    your missive, press ENTER to get to a blank line, then CTRL-D to send it.


    Here’s a sample mail session. (The stuff you type is shown in bold, and the system
    prompts are normal intensity.)


    ```

    # mail hermie

    Subject: Gone Fishing

    I’ve decided to kick back this afternoon and go fishing.

    So if this crazy Linux system rolls over and dies,

    I suggest you do likewise.

    ^D

    EOT

    ```'
  merge: -1
  img_proc: true
