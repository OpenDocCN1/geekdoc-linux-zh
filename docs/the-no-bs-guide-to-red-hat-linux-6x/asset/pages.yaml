- pgno: 349
  md: 'This book is not intended to be the final word on Linux. Rather, it''s meant
    to provide enough Linux knowledge to get you up and running without being too
    terribly overwhelming or geeky. By now, you''ve learned how to install Linux and
    use it productively. You know what shells are, and how to move around in the Linux
    file system. You can use a text editor or one of many Linux commands to manipulate
    the contents of a file.


    Running your favorite DOS and Windows programs under X Windows is no problem,
    and hey—you''re a programmer now! You can even connect your Linux system to the
    Internet, explore the online world, and operate your own Web site.


    But still, there''s a lot more to learn about Linux. And since Linux is constantly
    under development by a small army of volunteers all around the world, you should
    be aware of how to get the latest information. This chapter will tell you how
    to find Linux software, Web sites, FTP sites, bulletin board systems, Usenet newsgroups,
    mailing lists, news, and search engines.


    # FINDING SOFTWARE FOR LINUX


    If you''re looking for a program for a specific task, check out one of these resources:


    Freshmeat.net on the Web at http://www.freshmeat.net offers a list of new Linux
    software packages that''s updated daily. There''s a well-organized applications
    index, and a search engine to help you filter through over 4,000 packages.


    The Linux Software Map (LSM) at http://www.boutell.com/lsm. The LSM is a searchable
    database of over 2,500 noncommercial software packages available for Linux. You
    can search by keyword or title, or just browse through all the titles to see what''s
    available. Whether you''re looking for a new game or a GIF manipulator for Linux,
    this is a good place to start. If you want software written specifically for the
    GNOME GUI, visit the GNOME Software Map at http://www.gnome.org/.


    The Commercial-HOWTO file in the doc/HOWTO directory on the CD-ROM is a good place
    to look next. This file contains information on commercial software packages that
    you can buy for Linux. The categories covered include databases, CAD, application
    development, finance, mathematics, networking, and text processing. Pricing and
    contact information is supplied.'
  merge: -1
  img_proc: true
- pgno: 350
