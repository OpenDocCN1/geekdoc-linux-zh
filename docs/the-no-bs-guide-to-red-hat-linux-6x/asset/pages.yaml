- pgno: 343
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_343_0.png)


    Figure 14-5: The Dependency Problems dialog box asks for additional direction


    If the selected package requires some other package to operate correctly, GnoRPM
    will display a dialog box like the one shown in Figure 14-5. Normally, the correct
    response is to click "No" to cancel and then install the prerequisite package
    first. But in this case, I know that GNU Chess will operate in nongraphical mode
    without the xboard package, so I''m clicking "Yes" to ignore the warning and continue
    with the installation.


    # UNINSTALLING PACKAGES


    To uninstall a package, navigate to the correct folder, select the icon for that
    package, and click the "Uninstall" button in the GnoRPM main window, as shown
    in Figure 14-6. GnoRPM will prompt you for confirmation (see Figure 14-7), and
    if any packages depend on the soon-to-be-removed package, a warning dialog box
    will appear.


    # QUERYING PACKAGES


    To query a package, navigate to the correct folder, select the icon for that package,
    and click the "Query" button in the GnoRPM main window. A dialog box like the
    one shown in Figure 14-8 will display all available information and the associated
    files for the selected package. If you select multiple packages to query, you
    can find the query results for each one by clicking on the tabs near the top of
    the window.'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'Figure 14-6: Uninstall a package in GnoRPM


    Figure 14-7: Confirm package removal


    Figure 14-8: Package information and associated files'
