- pgno: 184
  md: '# USING THE GRAPHICAL FILE FINDER


    If you''re running X Windows with GNOME, you can search for files with the GNOME
    Search Tool. Choose Gnome Foot • Utilities • Gnome Search Tool to launch the Search
    tool (see Figure 6-10). Enter a start directory and a file name (with optional
    wildcards) and click "Start" to view the results.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_184_0.png)


    ![](img/3137cdda7122042e86dbeafe9840d4ed_184_1.png)


    Figure 6-10: The GNOME Search tool


    # WHAT''S THE DIFFERENCE BETWEEN TWO FILES?


    If, when you use find, you discover two files with suspiciously similar names,
    you might want to know whether they really contain the same information. The diff
    command will compare two files and give you the lowdown on just how different
    they are. Here''s an example of how you would use the diff command and the output
    you might get from it:


    ```

    diff cookies.old cookies.new

    5c5

    < One cup vanilla extract

    ---

    > One teaspoon vanilla extract

    7d6

    < Six ounces chopped liver

    21a22

    Note: The previous version of this recipe had a few errors!

    ```'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'The output is actually a description of how to transform the old file into
    the new one. Here, diff is telling you three things:


    +   - The fifth line of the file has undergone a change. The 5c5 message says
    to replace line 5 of the old file with line 5 of the new file. Both the old and
    new text are displayed, separated by a line of three dashes. (The less-than (<)
    notation means "remove this line," and the greater-than (>) sign means "add this
    line.")

    +   - Line 7 of the old file does not appear in the new file. The 7d6 message
    says to delete line 7 from the old file, and the files will then be in sync, starting
    at line 6 of the new file. The text to be deleted is displayed on the next line.

    +   - A line was added to the new file. The 21a22 message says to add a new line
    after line 21 of the old file. The text to be added is displayed on the final
    line of the output.


    Two useful flags you can specify when comparing files are -b (ignore blanks) and
    -i (ignore case). You can use them separately or in combination. The ignore blanks
    feature is especially useful when you''re comparing the source code for two programs,
    since indentation changes are rarely significant. For example, here''s how you
    might compare two program files, urzcool.c and urzcool.backup:


    ```

    diff -b -i urzcool.c urzcool.backup

    ```


    Don''t worry if you have some difficulty understanding the output of the diff
    command. It''s cryptic because it was designed to be used by computers, not humans.
    (Some source-code control systems used by programmers use diff to keep a record
    of the changes made to a program over time.)


    Do pay attention, though, to the less-than and greater-than indicators to see
    at a glance what was added or deleted; and be happy if you manage to get a general
    feeling for the ways the files differ.


    # REMIND ME AT SIX


    Linux provides a really handy way to schedule future events so they run automatically.
    You can use the at command to schedule reminders or administrative tasks or to
    run a command later when the computer'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'won''t be busy. After you specify the time (and optional date) for your event,
    at prompts you for the command to run. After entering your command, press CTRL-D
    to finish. Here are some examples:


    ```

    at 8:15am Jul 14

    echo "Remember to call Ruth about the Amalgamated Contract!"

    ^D

    at midnight Friday

    cp project/source backup

    ^D

    ```


    To find out what events you have already scheduled with at, enter the following:


    ```

    at -l


    1 1999-07-14 08:15 a

