- pgno: 351
  md: '# LINUX-SPECIFIC SEARCH ENGINES


    Several search engines are available to help you find Linux-related information.
    Here''s a list of some Web-based search tools you might find useful.


    SearchLinux.com (http://www.searchlinux.com) is a comprehensive Linux search engine.


    Linux Hardware Net (http://www.linuxhardware.net/) searches the Linux hardware
    database.includes compatibility information on hundreds of devices, along with
    user comments and ratings.


    LDP Search (http://metalab.unc.edu/mdw/search.html) searches the Linux Documentation
    Project files.


    Linux man pages (http://www.ctyme.com/linuxdoc.htm) performs an online search
    of Linux man pages.


    LSM search (http://www.boutell.com/lsm) searches the Linux Software Map.


    InterBoard (http://www.theforge.com:8090/) is a discussion board with a searchable
    question-and-answer area for both newbies and pros.


    # LINUX SUPPORT AND NEWS ON THE WEB


    There are many excellent sites on the Web where you can get information on Linux.
    One of the best is the Linux Documentation Project (LDP) (http://metalab.unc.edu/LDP/),
    which is an effort to develop reliable and freely available documents for the
    Linux operating system.


    You can find several introductory and tutorial documents as well as a complete
    and current set of Linux HOWTO files. If you''re interested in learning about
    Linux versions for Atari, Amiga, Macintosh, or DEC Alpha systems, or Linux information
    in languages other than English, this is the place to look. The LDP also has dozens
    of pointers to other Web sites with Linux information.


    The Red Hat Knowledge Base (http://www.redhat.com/knowledge-base) is a good place
    to go if you have problems before, during,'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'or after installation. Check the searchable list of Red Hat Linux Frequently
    Asked Questions to see if your problem has already been solved.


    The Red Hat Hardware Compatibility List (http://support.redhat.com/hardware) is
    a list of hardware that has been verified to be compatible with Red Hat Linux.


    The Red Hat Errata/Update Pages (http://support.redhat.com/) errata are a very
    important resource. Check in often to get the latest security patches and bug
    fixes.


    Linux Administrator''s Security Guide (https://www.seifried.org/lasg/) is a great
    place to learn about Linux security (and security holes).


    Linux Programming (http://www.linuxprogramming.com) is a site dedicated to Linux
    programming resources.


    LinuxHQ (http://www.linuxhq.com) organizes and catalogs many of the Linux kernel
    patches in one central location. Also, this site maintains an active archive of
    the linux-kernel mailing list and other useful Linux information.


    Links to Linux Users Groups (http://www.linux.org/users) is a list of Linux user
    groups, sorted by location. Find out if there are any Linux fanatics in your neighborhood!


    The Linux Journal is also an important resource. This printed publication''s mission
    is to serve the Linux community and to promote the use of Linux worldwide. It
    helps both in getting started and in staying on the cutting edge. For subscription
    information, see http://linuxjournal.com/.


    Linux Online (http://www.linux.org) is designed to act as a central clearinghouse
    for information and promotion of Linux and as a comprehensive resource for potential
    and current users of the Linux operating system.


    Linux.com''s mission is to enrich the Linux community by providing a centralized
    place for individuals of all experience levels to learn (and teach) the power
    and virtues of the Linux operating system. Nicely situated at http://www.linux.com,
    this site is operated by VA Linux Systems, a hardware vendor offering preconfigured
    Linux systems.


    Linux Today (http://www.linuxtoday.com) is a resource for business professionals
    interested in maintaining a high level of awareness of the news pertaining to
    Linux and the Open Source communities.'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'SlashDot (http://slashdot.org) is a "news for nerds" site run by a bunch of
    geeky twentysomething Linux aficionados. The site features technology news, lively
    user forums, and book reviews.

    Linux Weekly News (http://lwn.net) brings you the latest news from the Linux world.
    It''s a good place for Linux users to stay current with developments related to
    the Linux kernel, new distributions, and the open source movement.


    # LINUX NEWSGROUPS


    Usenet is another great place to ask questions and share Linux information. Here''s
    a listing of Usenet newsgroups where Linux is spoken.


    +   - **comp.os.linux.advocacy** Benefits of Linux compared to other operating
    systems.

    +   - **comp.os.linux.announce** Announcements important to the Linux community
    (moderated).

    +   - **comp.os.linux.answers** FAQs, HOWTOs, READMEs, and so on, about Linux
    (moderated).

    +   - **comp.os.linux.development.apps** Writing Linux applications, porting to
    Linux.

    +   - **comp.os.linux.development.system** Linux kernels, device drivers, modules.

    +   - **comp.os.linux.hardware** Hardware compatibility with the Linux operating
    system.

    +   - **comp.os.linux.m68k** Linux operating system on 68oXo Amiga, Atari, VME.

    +   - **comp.os.linux.misc** Linux-specific topics not covered by other groups.

    +   - **comp.os.linux.networking** Networking and communications under Linux.

    +   - **comp.os.linux.setup** Linux installation and system administration.

    +   - **comp.os.linux.x** Linux X Window servers, clients, libraries, and fonts.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# LINUX MAILING LISTS


    If you don''t have Usenet access, mailing lists are a good alternative to the
    newsgroups. To get a long list of Linux-related mailing lists, visit http://www.liszt.com
    and search for linux, or send email to lister@bluemarble.net with search linux
    in the message body.

    Another good resource is the set of support mailing lists operated by Red Hat
    Software. To subscribe to any of these lists, send email with subscribe in the
    Subject line to <list-name>-request@redhat.com, where <list-name> is one of the
    following:


    | applixware-list | Discussion of the ApplixWare suite |

    | cde-list | Discussion of the CDE desktop |

    | gnome-announce | Announcements from GNOME developers |

    | linux-alert | Linux news flashes |

    | linux-security | Discussion of Linux security |

    | redhat-announce-list | Announcements from Red Hat developers |

    | redhat-install-list | Discussion of Linux installation |

    | redhat-list | Discussion of Red Hat Linux (general) |

    | redhat-ppp-list | Discussion of Linux PPP connections |

    | rpm-list | Discussion of RPM |

    | sound-list | Discussion of sound cards and drivers |


    If you have general Linux questions, start with the redhat-list mailing list.
    It''s a fairly high-volume site, but lots of very knowledgeable people hang out
    there, and most questions do get answered by one of the readers. You can also
    search the archives of redhat-list to see if your questions have already been
    answered there. To search, visit http://www.redhat.com/support/mailing-lists/.

    Also, there are several dozen Linux mailing lists hosted by the Majordomo server
    at Rutgers University. For information, send email to majordomo@vger.rutgers.edu
    with lists in the message body.'
  merge: -1
  img_proc: true
