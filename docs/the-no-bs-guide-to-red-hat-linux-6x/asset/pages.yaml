    # THE PINE MAIL SYSTEM


    Pine is an email handler that is much friendlier than the plain ol’ mail command.
    Pine sports a full-screen interface and a context-sensitive list of commands on
    each screen. Even though it’s text-based (no GUI) it’s very easy to use and has
    enough features to satisfy almost any user. I personally use Pine in a Unix environment,
    even though I access the Internet from a Windows machine.


    In case you’re wondering why an email system would be named after a tree, here’s
    the scoop. Pine was originally based on another email program called Elm (short
    for “ELectronic Mail”), written by Internet pioneer Dave Taylor. The name Pine
    was first an acronym for “Pine Is Not Elm,” but today the official title is Program
    for Internet News and Email. (Revisionists: 1, Geeks: 0—film at 11.)'
