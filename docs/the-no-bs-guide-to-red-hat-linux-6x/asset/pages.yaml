  md: '# ENTERING COMMAND MODE


    **ESC**


    Switch from Input mode to Command mode.


    # EXITING OR SAVING YOUR FILE


    +   - `:w` — Write file to disk, without exiting editor.

    +   - `ZZ` — Save the file and exit.

    +   - `:q!` — Quit without saving.


    # TRYING OUT SOME VI COMMANDS


    Here’s another example to try out some of the vi commands. Enter the following
    command to fire up vi again, and you should see the file as we left it in Figure
    6-2:


    ```

    vi cow.joke

    ```


    # CHANGING TEXT


    Let’s change Bill’s name to Biff on the second line. To do so, use the arrow keys
    to position your cursor on the third character of line 2 (the letter “l” in Bill);
    then press x twice (to delete the two l’s). Now press i (to enter Input mode)
    and then type ff to complete the change from Bill to Biff.


    > **TIP:** Be careful about pressing the arrow keys while you’re in Input mode.
    In some versions of vi you can position the cursor only in Command mode. Yuck.


    You could also have used the R command to do this job of replacing text, so use
    it to change the other Bill now. Press ESC to enter Command mode; then type `/Bill`
    to search for the word Bill. The cursor should move to line 4, right to where
    Bill is located.


    Now position your cursor on the third character (the letter “l”), press R to replace
    the characters, and type ff. Both Bills should now be Biffs.


    # ADDING AND DELETING LINES


    Here’s how to add or delete a line. Press ESC to enter Command mode; then press
    the o key to add a new line. You’re in Input mode again, so you can type whatever
    you like on this new line. But that would ruin the joke, so delete this new line
    by pressing ESC and then entering the dd command. The line you just added should
    go away.'
