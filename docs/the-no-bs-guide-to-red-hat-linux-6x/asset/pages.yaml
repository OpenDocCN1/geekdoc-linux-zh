- pgno: 178
  md: "The lpr command makes a copy of your file and stuffs it in the system's print\
    \ queue (a process called spooling), so you can change or delete the original\
    \ file without harming your printout.\n\nThe lpr command will accept two optional\
    \ flags:\n\n+   -r Delete the file after printing.\n\n+   -s No spooling (don't\
    \ make a temporary copy for printing).\n\nThe -r flag tells the system to delete\
    \ the file after printing, and -s tells the system to print directly from the\
    \ original file instead of spooling to the print queue. Of course, if you specify\
    \ the -s flag, you can't modify or delete the original file while it's printing,\
    \ but this option can save a bit of time (since no copy is made) when the original\
    \ file is big.\n\nHere are some examples using the -r and -s flags:\n\nlpr -r\
    \ humongous    Delete the file humongous after printing.\n\nlpr -s humongous \
    \   Print the file humongous without spooling.\n\nlpr -r -s humongous    Print\
    \ the file humongous without spooling and then delete it.\n\n> NOTE: Some printers\
    \ under Linux exhibit a staircase effect as shown here, with each line starting\
    \ in the column where the last line ended, instead of starting in the first column:\n\
    \n```\nthis is line one\n    this is line two\n        this is line three\n```\n\
    \nIf this happens with your printer, see the Printing-Usage-HOWTO file in the\
    \ doc/HOWTO directory on the CD.\n\n# CUSTOMIZING YOUR PRINTOUTS\n\nThe lpr command\
    \ is a no-frills way to print your files. It doesn't do any fancy formatting;\
    \ it just dumps your file on the printer. If you'd like to format your printout\
    \ (paginate, add a title, set margins, or control the page length), you can use\
    \ the pr command in conjunction with lpr. By default, pr will add page numbers\
    \ and a title consisting of the file's"
  merge: -1
  img_proc: true
- pgno: 179
  md: 'name and the date and time it was last modified. But you can do lots of other
    fancy formatting as well. Here are some of the options that pr supports:


    +   - `-d` Double-space the printout.

    +   - `-h <my title>` Specify a title for the page header (the default is the
    file name).

    +   - `-Ln` Set the page length to n lines (the default is 66).

    +   - `-On` Set the margin to n characters (the default is 8).

    +   - `-T` Suppress the page header.

    +   - `-2 | -3 | -4` Print output in two, three, or four columns (as in a newspaper).


    Typically, the output from pr is sent only to your printer (by piping the output
    to lpr, as shown in the following examples), but if you leave off the lpr step,
    you’ll see the output on the screen instead. Here are some examples using the
    pr command to print a file named panda97.txt—for example, with no options specified,
    just adding page numbers and the default title (file name and date):


    ```

    pr panda97.txt | lpr

    ```


    Here we’ve specified a more meaningful title for the printout:


    ```

    pr -h "Financial Report" panda97.dat | lpr

    ```


    And now we’ve set the page length to 55 lines, set the margin to 5 spaces, and
    added double-spacing:


    ```

    pr -h "Financial Report" -l55 -o5 -d panda97.dat | lpr

    ```


    # STOP THE PRESSES!


    If you send a file to the printer by mistake, you might be able to snatch it from
    the print queue before it’s too late. First use lpq to find the job number:


    ```

    lpq

    Rank Owner Job Files Total Size

    1st hermie 17 really-humongous 2317678 bytes

    ```'
  merge: -1
