  md: '```

    code=$HOME/projects/src/spew

    ```


    and then, regardless of what directory you are in, you can issue


    ```

    cd $code

    ```


    to pop over quickly to the directory containing the source code for that way-cool
    spew program you''re developing. (The cd command means "change directory.")


    A variable assignment like this will work just fine, but its scope (visibility)
    is limited to the current shell. If you launch a program or enter another shell,
    that child task will not know about your environment variables unless you export
    them first.


    Unless you know for sure that an environment variable will have meaning only in
    the current shell, it''s a good idea to always use export when creating variables
    to ensure they will be global in scope—for example,


    ```

    export PS1="\u \$ "

    export code=$HOME/projects/src/spew

    ```


    And be sure to add these commands to your .bashrc file so you won''t have to retype
    them each time you log in.


    # How to Get Help


    Need help figuring out what a command is supposed to do? In an operating system
    with strange-sounding commands like awk, grep, and sed, it''s not surprising.
    The man command (short for manual) is a source of online help for most Linux commands.
    For example, you can enter


    ```

    man grep

    ```


    to learn all the secrets of the very useful grep command. (For a summary of the
    most-used Linux commands, see Chapter 6, "Important Linux Commands.")


    If man claims no knowledge of the command in which you''re interested, try help
    instead. This command will list all the built-in bash commands with a brief syntax
    summary.'
