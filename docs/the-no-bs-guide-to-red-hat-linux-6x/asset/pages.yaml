    of the screen, and the message at the bottom tells you that a new file called
    cow.joke was just created. The tilde characters in the first column are just placeholders
    for empty lines.


    Now press the letter a to enter Input mode and type the lines shown in Figure
    7-2. Press ENTER at the end of each line to go on to the next.


    ```

