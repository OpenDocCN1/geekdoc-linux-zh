  md: '# OTHER APPLICATIONS


    If you don''t find the software you need already installed on your Linux system,
    there''s a good chance you can download it for free or buy a commercial package
    that suites your needs. One good place to start is the GNOME Software Map at http://www.gnome.org,
    which lists freely available software in the categories listed here. The numbers
    in parentheses indicate the number of packages in each category, as this book
    goes to press.


    +   Core (9)

    +   Development Tools (26)

    +   Entertainment (35)

    +   Internet Tools (30)

    +   Mail Clients (6)

    +   Math and Science Tools (13)

    +   Miscellaneous (34)

    +   Network Talk Clients (IRC, ICQ, and so on) (9)

    +   Productivity (32)

    +   Sound Tools (16)

    +   System Utilities (26)

    +   Window, Session, and Desktop Managers (7)


    You can also follow the links listed here for some commercial software packages.


    # STAROFFICE


    StarOffice is a fully-integrated and Microsoft Office-compatible suite of productivity
    applications. It provides powerful Web-enabled word processing, spreadsheet, presentation
    graphics, email, news, charting, and graphics applications. The download file
    is over 70MB, and a minimal install requires about 100MB. For more information,
    see http://www.stardivision.com/office.


    # APPLIXWARE


    Applix Office is a fully-integrated, cross-platform suite of desktop productivity
    tools. Included in the suite are graphical tools for word processing and document
    publishing, spreadsheets, business graphics, graphics editing, data access, and
    email. For more information, see http://www.applix.com.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Corel WordPerfect


    Corel WordPerfect Version 8 for Linux: Personal Edition is an office solution
    that offers the same word processing capabilities as the Windows version, plus
    many features available only for Linux. It contains support for over 1,000 printers
    and is a free (24MB) download. For more information, see http://linux.corel.com.


    # AbiWord


    AbiWord is a small, fast, and full-featured word processor. It works on most Unix
    systems (including Linux) and also on Windows 95/98/NT. AbiWord can import Word97
    and RTF documents, is available for free, and is open source. The download file
    is a slim 770KB, and the installed version needs only 1.2MB of disk space.


    If you''ve ever wanted to see the source code behind a word processor, here''s
    your chance. Download the AbiWord source, make your own improvements, and you
    can build your own personal version of AbiWord. For more information, see http://www.abisource.com.


    # Development Tools


    Code Warrior by Metrowerks is a popular cross-platform development environment
    for Linux, Macintosh, and Windows 95/98/NT. For more information, see http://www.metrowerks.com.


    Code Fusion by Cygnus Solutions combines the latest open-source GNU tools (compilers,
    debuggers, libraries, and utilities) with a graphical interactive development
    environment that includes a code editor, class browsing, build, and debugging
    tools. For more information, see http://www.cygnus.com.


    KAI C++ is a cross-platform development environment designed to make C++ programmers
    more efficient. Also available is the KAI C++ debugger. For more information,
    see http://www.kai.com.'
  merge: -1
