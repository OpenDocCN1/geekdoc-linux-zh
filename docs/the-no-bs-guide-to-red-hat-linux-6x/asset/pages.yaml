  md: 'If you want to exit from Pico without saving your file, press CTRL-X and respond
    n to the Save Modified Buffer? prompt.


    # INSERTING ANOTHER FILE


    To insert another file into the one you''re currently editing, position the cursor
    where you want to insert the file, press CTRL-R, and enter the name of the file
