    # UNDERSTANDING THE PATH VARIABLE


    As in DOS, the shell uses the PATH variable to locate a command. PATH contains
    a list of directories separated by colons:


    ```

    ```bash

    echo $PATH

    /bin:/usr/bin:/usr/local/bin

    ```

    ```


    When you enter a command, the shell looks in each of the directories specified
    in PATH to try to find it. If it can’t find the command in any of those directories,
    you’ll see a “Command not found” message.


    If you decide to put your own programs in a bin directory under your home directory,
    you’ll have to modify the path to include that directory, or the system will never
    find your programs (unless you happen to be in that directory when you enter the
    command). Here’s how to change your PATH variable so it includes your personal
    bin directory:


    ```

    ```bash

    PATH=$PATH:$HOME/bin

    ```

    ```


    So if PATH was set to /bin:/usr/bin:/usr/local/bin beforehand, it would now have
    the value /bin:/usr/bin:/usr/local/bin:/home/hermie/bin.


    # CREATING YOUR OWN SHELL VARIABLES


    If you are a programmer, you’ll find it handy to create your own shell variables.
    First issue the command'
