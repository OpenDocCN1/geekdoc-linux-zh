- pgno: 266
  md: '# STARTING PINE


    To fire up the Pine program, use the following command, and you''ll see the Pine
    main menu screen:


    ```

    % pine

    PINE 4.10 MAIN MENU          Folder: INBOX  3 Messages

    ? HELP                     - Get help using Pine

    C COMPOSE MESSAGE          - Compose and send/post a message

    I MESSAGE INDEX            - View messages in current folder

    L FOLDER LIST              - Select a folder OR news group to view

    A ADDRESS BOOK             - Update address book

    S SETUP                    - Configure or update Pine

    Q QUIT                     - Exit the Pine program


    Copyright 1989-1999. PINE is a trademark of the U. of Washington


    ? Help                     P PrevCmd      R ReINotes

    0 OTHER CMDS  > [ListFldrs] N NextCmd      K KBlock

    ```


    Typically, I press I to jump right into my INBOX, but Pine also offers several
    options: pressing C to send a message, L to see a list of my saved mail folders,
    or A to manage my address book. (We''ll touch on those options later.)


    If you want to bypass this opening screen, you can add the -i flag to your pine
    command and go directly to the INBOX screen.


    # THE PINE INBOX


    The INBOX folder is where you''ll spend most of your time in Pine. Following is
    a sample screen showing three messages. Pine displays a message number, the date
    sent, the real name of the sender (if available), the size (in bytes), and the
    Subject line of each message in your INBOX.


    The first message is flagged with an A, which indicates that I''ve already read
    and answered it. The other two are each flagged with an N because they are new
    messages. Messages that have been read but not answered are blank in the flag
    column.


    So what about the plus (+) signs in front of certain messages? These tell me that
    these messages were addressed directly to me (your address appears in the To field,
    even though you don''t see that field'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'here). Email that comes from a mailing list manager or junk mail that comes
    from a spammer will typically have a generic (or bogus) To: address.


    Unlike mail, Pine doesn''t keep your incoming and previously read messages in
    totally different places. All your messages show up on this screen, whether they
    are brand-new or six months old.


    ```

    PINE 4.10 MESSAGE INDEX          Folder: INBOX Message 1 of 3


    + A 1  Feb  8  Joe Kramer        (1,116) Let''s do lunch

    N 2   Feb 10  Dave Rhodes        (7,264) MAKE MONEY FAST!!!

    + N 3  Feb 11  davey@surfer.com  (1,220) My new Toyota...


    [Folder "INBOX" opened with 3 messages]


    ? Help    < FldList   P PrevMsg   - PrevPage   D Delete   R Reply

    0 OTHER CMDS > [ViewMsg]   N NextMsg   Spc NextPage   U Undelete   F Forward

    ```


    # MANAGING YOUR MAIL WITH PINE


    You can display the current message (which is either underlined or in reverse
    video) by pressing > or the ENTER key while viewing the FOLDER INDEX screen. Here''s
    an example of what you''ll see when you view a message in Pine:


    ```

    PINE 4.10 MESSAGE TEXT          Folder: INBOX Message 1 of 3  ALL


    Date: Sat, 8 Feb 1997 13:57:22 -0800

    From: Joe Kramer <JoeK@asdf.com>

    To: hermie@fritz.com

    Subject: Let''s do lunch


    Hey, howzabout we do a "power lunch" on Monday to work out the details of that
    Amorphous contract? Call me at 555-0317...


    ? Help    < MsgIndex   P PrevMsg   - PrevPage   D Delete   R Reply

    0 OTHER CMDS > ViewAttch   N NextMsg   Spc NextPage   U Undelete   F Forward

    ```'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'From either this MESSAGE TEXT screen or the FOLDER INDEX screen, you can press
    one of the following keys to act on the current message. (Pine doesn''t care about
    upper or lower case when entering commands.)


    +   - **R** Reply to the current message.

    +   - **D** Delete a message. (Messages don''t actually go away when you ask to
    delete them—they''re just flagged with a D and expunged later when you exit Pine,
    just in case you change your mind and don''t want the message deleted.)

    +   - **U** Undelete a message (remove the D flag).


    If you press O to display more Pine commands, the legend at the bottom of the
    screen changes to the following:


    ```

    ? Help    M Main Menu    L ListFldrs    C Compose    % Print    S Save

    O OTHER CMDS    Q Quit Pine    G GotoFld    W whereIs    T TakeAddr    E Export

    ```


    From here, you can use the following:


    +   - **C** Compose a new message.

    +   - **<** Return to the FOLDER INDEX screen.

    +   - **W** Search for text in the current message.

    +   - **%** Print the message.

    +   - **T** Add the sender to your address book.

    +   - **S** Save the message in a folder.


    # PINE MAIL FOLDERS


    Folders are good for organizing your email. When you press S to save a message
    in a folder, Pine asks you to choose a folder. If that folder already exists,
    Pine copies the message to that folder and marks it as "Deleted" in your INBOX.
    If the folder doesn''t exist, Pine asks if you want to create it.

    You might want to save all messages from a mailing list in a folder with the same
    name as the list, or have a folder called URGENT for'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'high-priority items. I create folders for people with whom I communicate on
    a regular basis, so my INBOX stays uncluttered and I can still find an old message
    when I need it.


    You can use the L command to display a list of all your folders and then view
    the messages in a selected folder. The same FOLDER INDEX and MESSAGE TEXT screens
    are used whether you''re dealing with the INBOX folder or another folder that
    you created.


    # PINE FOR POWER USERS


    Pine is a great tool for managing your email because it''s fast, easy to learn,
    and easily configurable. But it also has many advanced features for power users.
    Once you''ve become proficient at basic mail handling, try some of these features.
    (All are accessed from the FOLDER INDEX screen.)


    # SEARCHING


    Use the W ("where is") command to search the FOLDER INDEX screen for messages
    with a certain word in the Subject line. You can also use the W command when you''re
    viewing a message to search for text in the message body.


    # SORTING


    Use the $ command to sort your messages in a variety of ways, including by subject,
    sender, size, and arrival time.


    # ADDRESS BOOK


    Use the T command to "take" the sender''s address and store it in your Pine address
    book. You can also assign a nickname to the address and use the nickname instead
    of the full address when composing a new message.


    # HEADERS


    Use the H command to view the normally hidden message header lines. At first glance,
    it''s a lot of gobbledygook, but the Received lines will tell you the path a message
    traveled to reach your system. This can be handy for identifying forged sender
    addresses. Press H again to turn off the display of the header lines.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# FORWARD AND BOUNCE


    The F command lets you forward messages to other users. The message composition
    screen appears as usual, with the forwarded message pasted into the message text
    area. You can add your own comments before sending.


    The B command will “bounce” a message to another user with no opportunity to add
    comments. If the recipient’s mail system complies with standards, it will appear
    as if the message came from the original sender— not from you. This is handy when
    you get mail that was obviously meant for someone else and you want to quietly
    redirect it.


    # EXPORT AND PIPE


    The E command will export a message to a file in your home directory. This is
    useful if someone sends you a file that you want to save and edit, or if you receive
    a uencoded or encrypted message. (See Chapter 11, “Compression, Encoding, and
    Encryption,” for more on decoding and decryption.)


    The | (vertical bar) command will pipe a message directly to any command or program.
    For example, you could use this feature to pipe a message to a program that strips
    off mail headers and formats notes for printing.


    # ATTACHMENTS


    Pine has excellent support for attached files. You can attach a binary file such
    as a program, image, or word processor document to an outgoing message using the
    CTRL-J command while the cursor is on the Attachment: line in the message composition
    screen. Pine encodes the attached file using MIME (Multi-purpose Internet Mail
    Enhancements), which is a widely used standard understood by most modern email
    programs.


    Pine can also decode incoming MIME-attached files and either save them to disk
    or automatically launch the appropriate viewer tools. I used Pine to send Microsoft
    Word files back and forth to my publisher in the course of writing this book.


    # ROLES


    Pine allows you to play different roles, depending on who you are replying to.
    For example, if you are replying to a message addressed to'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'sales@widgets.com, you may be acting as a customer service rep. That role may
    require that you use a different return address and/or a different signature.


    Roles are optional, but if you set up roles, they work like this: Each role has
    a set of patterns that are used to decide which role is used and a set of actions
    that are taken when that role is used. When you reply to a message, the From,
    To, and Subject fields of the original message are compared to your role patterns.
    If a match is found, the matching role''s actions are taken. These actions could
    include changing the From line, inserting a special template into the message
    body, or using an alternative signature file. There''s a comprehensive section
    in the Pine help if you''re interested in learning more about roles.


    # HTML EMAIL AND HOTLINKS


    With the most recent release of Pine, you can now view HTML email messages directly
    without exporting them to a file and viewing them with a browser. Pine does a
    pretty good job of rendering the HTML, minus the color and special fonts.


    Pine can also recognize URLs (Web hotlinks) in your email and launch a browser
    to view them, but you have to explicitly enable this feature to make it work.
    From the Pine main menu, press S (for Setup) and then C (for Config). Find the
    Viewer Preferences section and turn on these two options:


    ```

    [X] enable-msg-view-urls

    [X] enable-msg-view-hostnames

    ```


    Then go all the way down to the bottom of the Config screen and set the following:


    ```

    url-viewers = /usr/bin/lynx

    ```


    or


    ```

    url-viewers = /usr/bin/netscape

    ```


    Now when you view a message, the up and down arrow keys will highlight the URLs
    in the message. Just press ENTER, and the browser you defined will launch and
    display the Web page at the selected URL.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# HELP


    The built-in help for Pine is excellent, so if you''re interested in learning
    more, just press the ? key from any screen. You can also visit the Pine Information
    Center online at http://www.washington.edu/pine for additional help or to download
    new versions of Pine.


    # GUI EMAIL PROGRAMS FOR LINUX


    If you prefer a graphical interface to send and receive email, you have several
    options to select from while running the X Windows GUI for Linux.


    The exmh program comes with Red Hat Linux and has most of the features found in
    Pine (see Figure 10-1). It seems a bit clunky though—there are lots of unfamiliar
    terms on the screen, and it takes a while to get used to the nonstandard user
    interface.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_272_0.png)


    Figure 10-1: The exmh email client'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'The Netscape browser (see Figure 10-2) has built-in email capabilities, just
    like the Windows version. Click on “Communicator” and then select “Messenger”
    to start the email client (see Figure 10-3).


    ![](img/3137cdda7122042e86dbeafe9840d4ed_273_0.png)


    *Figure 10-2: The Netscape Messenger email client*


    ![](img/3137cdda7122042e86dbeafe9840d4ed_273_1.png)


    *Figure 10-3: Sending a message with Netscape Messenger*'
  merge: -1
