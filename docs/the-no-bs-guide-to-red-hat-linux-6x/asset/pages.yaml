- pgno: 171
  md: 'If you share your Linux system with multiple users, or if you have a dial-in
    modem attached, password security for each account is particularly important.
    But if you’re the only one who will ever lay a finger on your system, you might
    want to delete your password, thus removing the need to enter it each time you
    log in. It’s your call, but you never know when your five-year-old will wander
    by the keyboard! By the way, you might get the idea from the preceding commands
    that users can go around changing each other’s passwords at will, but that’s not
    the case. Only a superuser (such as root) can change or delete another user’s
    password.


    # SWITCH USERS WITH SU


    Even if you have no schizophrenic tendencies, sometimes you’ll want to become
    someone else while using Linux. For example, if you’re logged in as hermie and
    you need to do something quickly that requires superuser authority, just enter
    the command


    ```

    su - root

    ```


    In response to the su (switch user) command, you’ll be prompted for the root account
    password. If you enter the password correctly, your prompt will change from a
    dollar sign to a pound sign (to reflect your status as root), and you will assume
    the powers of the root user. Issue the command


    ```

    exit

    ```


    to return to your previous identity. You can also use su to become any user on
    the system, not just root. For example, to become sigmund, you would enter this
    command:


    ```

    su - sigmund

    ```


    Don’t forget the minus sign when you use su to temporarily become another user.
    Without it, the login profile for that user is not executed—so it’s not really
    the same as logging in because your environment variables and aliases would not
    change. This would be like starting DOS without running the autoexec.bat file—things
    wouldn’t work the same because your personal setup commands (PATH and so on) would
    not run.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'But why would you want to use su when you can have multiple log-ins via virtual
    consoles (see Chapter 4, "Living in a Shell")? Because it''s sometimes quicker
    or more convenient to switch between users using su, and because you may have
    no virtual consoles available—you may be using all of them or, if you''re logged
    in to the machine via a modem, virtual consoles may not be available to you.


    # TELL ME WHO IS LOGGED IN


    If you want to know which users are currently logged in to your Linux system,
    which console they''re using, and the date and time they logged in, issue the
    who command. You''ll see output something like this:


    ```

    who

    root             tty1      Nov 2 17:57

    hermie           tty3      Nov 2 18:43

    sigmund          tty2      Nov 2 18:08

    ```


    In the output shown here, the term tty stands for teletype. In the olden days
    of computing, a terminal was just a keyboard with an attached printer, so you
    read everything off the teletype.

    If you''ve logged in with multiple virtual consoles and changed your identity
    on any of them, you may have some trouble figuring out who you are—or at least
    what user is logged in to the console you''re using. If you find yourself in such
    an identity crisis, try this variant of the who command:


    ```

    who am i

    ```


    # WHAT''S TODAY''S DATE?


    Use the date command to print the current date and time. If you add the -u flag,
    the results will be for the Greenwich mean time zone. And if you log in as a superuser,
    you can even change the date or time with the -s flag. Now, that''s power! Here
    are some examples:


    ```

    date                          Print the date and time

    Sat Nov 2 20:09:43 EST 1996


    date -u                        Print the GMT date and time

    Sun Nov 3 01:09:45 GMT 1996


    date -s 0503                   Set the clock to 5:03 AM

    ```'
