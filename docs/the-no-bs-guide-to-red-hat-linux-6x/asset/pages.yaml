- pgno: 420
  md: '# DOS AND UNIX

    EQUIVALENCIES'
  merge: -1
  img_proc: true
- pgno: 421
  md: 'If you take a close look at Unix and DOS commands, you''ll find there are many
    parallels. This is true because DOS took much of its design from Unix, so if you
    have learned to use DOS, then you already know quite a bit about Unix.


    After each set of parallel commands, an example is given showing actual usage
    in both DOS and Linux. In most cases, the commands don''t do exactly the same
    thing, but are roughly equivalent. See the chapters in this book or use the man
    command to learn more about these Unix commands under Linux. Under DOS, use the
    help command.


    | DOS | UNIX | DESCRIPTION |

    |---|---|---|

    | attrib

    attrib +r file.txt | chmod

    chmod +r,-w file.txt | Change read/write permissions of a file. |

    | backup

    backup setup_file | tar

    tar -cvf backup.tar | Create a backup or archive. |

    | cd

    cd \mydir | cd

    cd /mydir | Change directory. |

    | date

    date 07/04/1999 | date

    date -s 07/04/1999 | Set system date. |

    | deltree

    deltree \temp | rm -r

    rm -r /home/temp | Remove entire directory tree (delete files and subdirectories).
    |

    | dir

    dir | du -ab | Report on disk use. |

    | fc

    fc pgm1.c pgm2.c | diff

    diff pgm1.c pgm2.c | Compare two files. |

    | copy

    copy sample.htm c:\website | cp

    cp sample.htm /home/bob/www | Copy files. |

    | time

    time 13:28 | date

    date -s 1328 | Set system clock. |

    | dir

    dir \windows | ls

    ls /root | List a directory. |

    | dir

    dir /s c:\windows\*.ini | find

    find /etc -name "*.rc" -print | Find a file. |'
  merge: -1
  img_proc: true
- pgno: 422
  md: '| DOS | UNIX | DESCRIPTION |

    |---|---|---|

    | del

    `del panda.zip` | rm

    `rm panda.zip` | Remove a file. |

    | edit

    `edit panda.txt` | pico

    `pico panda.txt` | Edit a text file. |

    | fdisk

    `fdisk` | fdisk

    `fdisk /dev/hda` | Define disk partitions. |

    | format

    `format c:` | mk2fs

    `mk2fs /dev/hda2` | Format a file system or disk. |

    | find

    `find /i "widget" *.txt` | grep

    `grep -i "widget" *.txt` | Search for text within files. |

    | help

    `help find` | man

    `man grep` | Display help for commands. |

    | md

    `md \newdir` | mkdir

    `mkdir /newdir` | Make a new directory. |

    | mode/ctty

    `mode CON LINES=43` | stty

    `stty rows=43` | Set modes on console or serial and/or printer port. |

    | more

    `more outlist.txt` | more

    `more outlist.txt` | Display output screen by screen. |

    | print

    `print autoexec.bat` | lpr

    `lpr .profile` | Print a file. |

    | rename

    `rename big.txt large.txt` | mv

    `mv big.txt large.txt` | Move or rename a file. |

    | rmdir

    `rmdir \temp` | rmdir

    `rmdir /home/temp` | Remove a directory. |

    | scandisk

    `scandisk c: /AUTOFIX` | e2fsck

    `e2fsck -p /dev/hda2` | Check file system and fix errors. |

    | sort

    `sort /+6 < number.fil` | sort

    `sort -k 6,7 number.fil` | Sort a file. |

    | type

    `type ascii.txt` | cat

    `cat ascii.txt` | Display a file on the screen. |

    | xcopy

    `xcopy /s *.ps c:\tmp` | cp -r

    `cp -x *.ps c:\` | Copy files and directories recursively. |'
  merge: -1
  img_proc: true
