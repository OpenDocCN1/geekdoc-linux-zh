    switch among them.) The “Preferences” option allows you to specify settings that
    will be applied each time the editor is started, such as toolbar appearance, fonts,
    screen colors, and autosave frequency.


    # USING GNOPED+ FOR HTML FILES


    Gnotepad+ has a special toolbar that is designed to speed up the creation of HTML
    files (the language used to code Web pages). Each button on the toolbar inserts
    HTML tag(s) in the document at the cursor


