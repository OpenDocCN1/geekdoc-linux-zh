    drwxr-xr-x 1 hermie users 1024 Feb 28 06:12 slugs

    -rwxr-xr-x 1 hermie users 45198 Jan 23 11:14 zippity

    ```


    Here, ls has displayed all files in the animals directory, including the hidden
    hoohah file. In addition to the file name, the file''s permissions, owner, group,
    size in bytes, and date and time of last modification are displayed. (More on
    permissions later in this chapter.)


    ```

    ls -lrt animals

    -rw-r--r-- 1 hermie users 115032 Jan 06 11:14 dog_info

    -rw-r--r-- 1 hermie users 248 Jan 16 09:18 pig_info

    -rwxr-xr-x 1 hermie users 45198 Jan 23 11:14 zippity

    -rw-r--r-- 1 hermie users 64183 Feb 14 22:07 cow_info

    drwxr-xr-x 1 hermie users 1024 Feb 28 06:12 slugs

    -rw-r--r-- 1 hermie users 45090 Mar 23 23:17 cat_info

    ```


    This time, the files are sorted by time stamp, in reverse order. If you have lots
    of files in a directory, this is a handy way to find out which are the oldest
    and newest. Also notice that the -l, -r, and -t switches were combined into -lrt
    in the preceding command. We could just as well have issued the command ls -l
    -r -t animals.


    # LISTING FILES WITH MIDNIGHT COMMANDER


    Red Hat Linux comes with a handy utility called Midnight Commander (see Figure
    5-1), which is a text-based utility that makes it easier to list and manipulate
    your files. To start Midnight Commander, enter the mc command. Midnight Commander
    shows you the file system tree in the left panel and the files from the selected
    directory in the right panel. Follow the prompts at the bottom of the screen to
    navigate directories, browse or edit a file, or perform other operations such
    as copy, move, and delete.'
  merge: -1
  img_proc: true
