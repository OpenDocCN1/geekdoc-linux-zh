    # PRINTING POSTSCRIPT FILES


    PostScript is a complex formatting language that certain laser printers can interpret
    to produce really nice-looking documents. But if you send a PostScript file to
    a printer that doesn’t understand the PostScript language, your printout will
    be pages of incomprehensible gibberish. And unless you shelled out megabucks for
    your laser printer, chances are it won’t print a PostScript file.


    TIP: You can tell a PostScript file by the file name and the contents. If the
    file name ends with .ps and the first line of the file starts with the percent
    sign (%), you can be sure it’s PostScript.


    It gets worse. Most of the documentation for Linux comes in PostScript format,
    which suggests that you may not be able to print it unless you have PostScript
    capability. But all is not lost. The version of Linux included with this book
    has a nifty program called Ghostscript that can read a PostScript file and either
    display it on the screen or print it on your printer, even if the printer doesn’t
    have built-in PostScript support.


    To view a PostScript file on the screen, enter a command like this (qwerty.ps
    is a sample file name):


    ```

    gv qwerty.ps

    ```


    NOTE: You must start X Windows (with the startx command) before running the gv
    command.


    Assuming you followed the preceding instructions to set up your printer, you can
    print a PostScript file with the lpr command, just like any other file. The system
    will invoke Ghostscript behind the scenes and send the file to your printer.


    # DRAG-AND-DROP PRINTING


    If you’re running X Windows with GNOME, you can print files by dragging them from
    the File Manager window to the Printer applet—but'
