    \ Since it was designed for portability to other environments (it has source code\
    \ compatibility), it is very popular with software developers.\n\nThe C compiler\
    \ that comes with Linux is the GNU C compiler, created by the Free Software Foundation.\
    \ To invoke the GNU C compiler, use the gcc command.\n\nHere’s a very simple C\
    \ program that will print Hello, World! on your screen:\n\n```\n#include <stdio.h>\n\
    main ()\n{\n    printf (\"Hello, World! \\n\");\n}\n```\n\nType those lines in\
    \ a file named hello.c and then compile it like this:\n\n```\ngcc -o hello hello.c\n\
    ```\n\nThis tells the compiler to compile hello.c and create an executable output\
    \ file named hello. To run the program, enter the command hello at the prompt.\n\
    \n# THE C++ LANGUAGE\n\nC++ is an object-oriented programming language based on\
    \ C that is fast becoming the language of choice for large software development\
    \ projects. C++ compilers are available on a great many platforms and, of course,\
    \ on Linux as well. To invoke the GNU C++ compiler, use the g++ command.\n\nIt\
    \ is far beyond the scope of this book to delve into the syntax of the C and C++\
    \ languages, but you can find stacks of C or C++ language reference books in any\
    \ computer bookstore. For more information on using C and C++ with Linux, visit\
