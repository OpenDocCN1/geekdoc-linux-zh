  md: '# QUITTING WITHOUT SAVING YOUR CHANGES


    To leave Emacs without saving your changes, press CTRL-X and then CTRL-C. A prompt
    like this will appear at the bottom of the screen:


    ```

    Save file bulb.joke (y, n, !, ., q, C-r or C-h)

    ```


    Press n and then answer yes when Emacs asks:


    ```

    Modified buffers exist; exit anyway? (yes or no)

    ```


    Your Linux prompt will return, and the bulb.joke file will be just as it was before
    you started editing.


    # PARTING WORDS ABOUT EMACS


    We haven’t even scratched the surface of what you can do with the Emacs editor.
    As its name suggests, you can write your own macros to add functionality to the
    editor or to automate repetitive editing tasks.


    Take the time to go through the Emacs tutorial (accessed by pressing CTRL-H T)
    to get an idea of all the things you can do with it. Although it’s not easy to
    learn all the various CTRL and ESC commands, if you’re a programmer (or even if
    you dabble), Emacs’ customizability makes it your best bet as a text editor.


    The Usenet newsgroup comp.emacs is a good place to discuss Emacs or ask questions.
    You can find the Emacs FAQ file online at ftp://rtfm.mit.edu/pub/usenet/comp.emacs.


    # THE PICO EDITOR


    Pico, short for Pine Composer, started life as the built-in editor for the Pine
    email program. Lots of people use Pico as a text editor because they also use
    the friendly Pine program for email.


    The Pico text editor doesn’t have a lot of fancy features, but it’s a welcome
    alternative to the vi or Emacs editors because learning it is quick and easy.
    Cursor movement and text entry are straightforward, and—best of all—you don’t
    have to learn any arcane commands: all commands are listed in a handy menu at
    the bottom of the screen.'
