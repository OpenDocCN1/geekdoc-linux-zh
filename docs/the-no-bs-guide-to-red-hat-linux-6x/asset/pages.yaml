- pgno: 284
  md: 'You might be wondering why you''d want to use shar files when tar files seem
    to serve the same purpose. The answer is that shar files are ready to send (because
    they''re plain text), whereas a tar file must be encoded first. See the next section
    for more on encoding and decoding.


    # GRAPHICAL ARCHIVING AND COMPRESSION


    If you find all those commands and flags for archiving and compressing a bit daunting,
    get a copy of gxTar—a GNOME front-end to common archive utilities under Linux
    (see Figure 11-1). The author of this program says his goal is to make it the
    WinZip of the Unix world. Currently, zip, gzip, tar, and a few other file formats
    are supported. You can create zip files and archives or add, delete, extract,
    and view files.


    Dragging and dropping from the File Manager is also supported. All those nasty
    tar, gzip, gunzip, zip, and unzip commands happen behind the pretty point-and-click
    interface. Learn more about gxTar or download it from http://gxtar.netpedia.net/
    on the Web.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_284_0.png)


    Figure 11-1: The gxTar utility'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# DECODER RINGS SOLD HERE


    When you encode a file, you translate it into a format that other types of computers
    can understand. For example, if you want to send an executable program, compressed
    files, word processor file, or any other binary data by email, you have to encode
    it in ASCII (plain text) format first, or it will most likely be unreadable on
    the receiving end. Most modern email programs can send and receive binary files,
    encoding them as MIME attachments and decoding them when they''re received. (Almost
    any Windows-based email program can handle attachments, as can Pine, Exmh, or
    Netscape Mail under Linux.) But if you''re partial to a low-tech mailer like the
    Unix mail command, or if you know that the intended recipient cannot handle attachments,
    you''ll have to uuencode your files before sending them or uudecode them after
    they arrive.


    # THE UUENCODE AND UUDECODE COMMANDS


    The uuencode program creates an encoded ASCII copy of a binary file, suitable
    for email transmission. The encoded file will be 35 percent larger than the original
    and will look something like this (with the word begin, a number, and the original
    file name on the first line, followed by a bunch of 61-character lines that all
    begin with "M"):


    ```

    begin 644 panda.tar

    M45L!"H''!g".`/6H718.S ZSFp"@?"...`$S5,25$8,34N5%AA8OI[

    MIPB;1K L,2P,)IPL.PD''?@.(16A.IP8%-6.6XPL"I@*.P4.300.XP4*.4.

    .... . . (and so on)

    ```


    By convention, uuencoded files are named with a .uue extension. To create a uuencoded
    file under Linux, enter a command like this:


    ```

    uuencode panda.tar panda.tar > panda.uue

    ```


    The first panda.tar on the preceding line is the name that appears on the "begin"
    line of the output file; the second panda.tar is the name of the file you want
    to encode. (You might want to put a name other than the actual input file name
    on the "begin" line if you''re sending the encoded file to a DOS system where
    file names are more restricted.)'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# To decode a uuencoded file, enter a command like this:


    ```

    uudecode panda.uu e

    ```


    The uudecode program will look for the “begin” line and create a decoded file
    with the name and file permissions specified there. In the example here, the panda.tar
    file will be created in the current directory with permissions set to 644 (shorthand
    notation for rw-r--r--, which equates to the following: owner: read/write; group:
    read; others: read).


    > NOTE: To calculate the numeric equivalent of a file permissions string, look
    at each triplet in the permissions. Read gets 4 points, write gets 2, and execute
    gets 1. See Chapter 5, “The Linux File System,” for more on file permissions.


    Files that are created with the tar, gzip, compress, or zip command in Linux must
    be uuencoded before they can be sent by email.


    # HANDLING ENCODED FILES AND EMAIL


    If you want to uuencode a file and email it in one step, try a command like this:


    ```

    uuencode panda.tar | mail whoever@whatever.com

    ```


    This tells uuencode to pipe the output directly to the mail program instead of
    creating a .uue file. If you want to take it one step further, you could even
    archive, encode, and mail in one command, like this:


    ```

    tar cvf - panda | uuencode | mail whoever@whatever.com

    ```


    That should all make sense if you read about pipelines in Chapter 4, “Living in
    a Shell,” and understand that the dash in the tar command means send the file
    to a pipeline instead of creating a tar file on disk. Of course you could also
    do this:


    ```

    tar cvf panda.tar panda

    uudecode panda.tar > panda.uue

    mail whoever@whatever.com < panda.uue

    rm panda.uue

    ```


    But that''s a lot more work!'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# MAKING YOUR MAIL TOP SECRET


    Internet email is about as secure as sending a postcard—any postal clerks along
    the delivery path can read your message if they wanted to since there''s no envelope
    to protect it. So if you''re concerned about your private email falling into the
    wrong hands, encryption is the solution.


    Encryption will scramble your message so that only the holder of the secret decryption
    key will be able to read it. The de facto standard for encryption is the PGP (Pretty
    Good Privacy) program, written by Phil Zimmerman. Actually pretty good privacy
    is a pretty serious understatement. If you use a sufficiently long password key,
    the computing power required to crack the code that PGP uses becomes astronomically
    large.


    # ARE YOU A CRYPTO CRIMINAL?


    PGP is such a good program that the United States government has classified it
    as a "munition" and made exporting it illegal, for reasons of national security.
    Apparently the feds are worried that the bad guys will be able to correspond in
    a way they can''t decode. Although it is not illegal to send a message that has
    been encoded by PGP, you can''t export (via email, FTP, or any other means) the
    PGP software from the United States, except to Canada (or from Canada, except
    to the United States), without a license from the federal government. The one
    strange exception to this rule is that printed books containing the PGP source
    code can be exported.


    It is also illegal to use PGP in some countries (it''s legal in the United States),
    so if you are an evil terrorist or are plotting the overthrow of your government,
    check with your local authorities first before using PGP. The Crypto Law Survey
    at http://cwis.kub.nl/~frw/people/koops/lawsurvy.htm summarizes the legalities
    of PGP around the world.


    # GETTING PGP


    If you''re interested in learning more about PGP, see the PGP FAQ at http://www.cam.ac.uk/pgp.net/pgpnet/pgp-faq/
    on the Web.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'To get a copy of the PGP software, visit http://web.mit.edu/network/pgp-form.html
    to see the PGP Distribution Authorization Form. If you are a citizen of the United
    States or Canada and promise to use it for noncommercial purposes and never export
    it to any other countries, you can download the Unix source code for PGP, which
    you will have to compile yourself. If you plan to use PGP for commercial use,
    you can purchase it from Network Associates, at http://www.nai.com.


    # COMPRESSION, ENCODING, AND ENCRYPTION UNDER DOS


    If you''re working on a DOS system and you come across a tar file, a gzip file,
    or a file that has been uuencoded, all is not lost. Fortunately, you can find
    DOS tools for dealing with compressed and encoded files at a variety of sites
    on the Internet, and most of them are free.


    Visit http://www.shareware.com or http://www.download.com and use the search engines
    there to find DOS or Windows versions of tar, gzip, uuencode, and PGP. The Wincode
    and WinZip shareware programs are very popular, so you might want to try them
    first.'
