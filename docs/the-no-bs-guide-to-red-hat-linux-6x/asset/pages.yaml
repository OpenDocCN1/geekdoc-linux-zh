- pgno: 325
  md: '# CUSTOMIZING ENLIGHTENMENT


    If you are using Enlightenment, the default Window Manager for GNOME, you can
    use a graphical configuration tool to control the behavior of your desktop, the
    number of desktops available, special effects, backgrounds, themes, and keyboard
    shortcuts. With a little fiddling, you can achieve a high degree of customization.

    Launch the Enlightenment Configuration tool from the Window Manager capplet described
    earlier in this chapter and select one of the options to configure.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_325_0.png)


    Figure 13-29: Exploring options for window and cursor appearance


    # BASIC OPTIONS


    Allows you to customize the window move methods, resize methods, and keyboard
    focus rules. These options change the way windows and the mouse pointer appear
    while you''re moving them around or resizing them. You''ll probably like the defaults
    best, but it''s fun to play with the various options, as shown in Figure 13-29.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_325_1.png)


    Figure 13-30: Setting edge flip resistance too low might prove annoying


    # DESKTOPS


    Allows you to control the number of desktop areas on the virtual desktop. The
    default is four areas in a 2-x-2 grid, but you can configure the desktop any way
    you like. If edge flip resistance is enabled, you can switch to an adjoining desktop
    by moving the mouse pointer to the edge of the screen. My experience shows that
    an edge flip resistance of less than 50 (half a second) will be annoying, resulting
    in accidental desktop area switches when the mouse moves too close to the screen
    edge, as shown in Figure 13-30.


    You can also define multiple desktops, each with its own set of desktop areas.
    Personally, I can''t imagine juggling that many desktop areas, but you may find
    a practical use for this feature.'
  merge: -1
  img_proc: true
