- pgno: 63
  md: '# ACCESSING FILES ON THE CD-ROM


    After you issue the mount command, list the files on the CD-ROM to see if the
    mount worked, using these commands:


    +   cd /mnt/cdrom    Switch to the CD directory.

    +   ls    List the files on the CD.


    If you try a device name in the mount command and get an error, or if your ls
    command doesn''t display any files, just pick another device name and try again—you
    won''t hurt anything.


    For now, just be happy if you can list the files on the CD-ROM. In Chapter 4,
    “The Linux File System,” you’ll learn more about navigating directories, as well
    as about listing and viewing files.


    # I NEED HELP!


    If the installation does not work, or if you have trouble with your system after
    installation, refer to Chapter 15, “Learning More about Linux.” You should also
    look at the Red Hat Installation manual on the CD for help with the most common
    installation problems if following the instructions in this chapter doesn’t get
    you up and running. To view the manual, start your Web browser under Windows and
    open the file:


    ```

    D:\doc\rhinst\index.htm

    ```


    You will also find lots of helpful information, including the Linux FAQ (Frequently
    Asked Questions) files and the Linux HOWTO files, in these directories on the
    CD:


    ```

    D:\doc\faq

    D:\doc\howt

    ```'
  merge: -1
