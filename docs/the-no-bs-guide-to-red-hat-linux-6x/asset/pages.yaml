  md: 'In the first case, the value of the howdy variable would probably not be what
    you wanted. The single quotation marks caused Bash to not treat $USER as a variable.
    In the second case, the results look much better. The double quotation marks allowed
    Bash to substitute the value of $USER, which is set automatically when you log
    in, in the string.


    Here''s another example that demonstrates a common error:


    ```

    costmsg="Price is $5.00"

    echo $costmsg

    Actual result: Price is .00

    ```


    We thought enough to quote the string, but the dollar sign tells Bash to use the
    value in the $5 variable, which is not what we wanted. We can easily solve the
    problem by prefixing the dollar sign with a backslash, as shown here:


    ```

    costmsg="Price is \$5.00"

    echo $costmsg

    Actual result: Price is $5.00

    ```


    # ARGUMENTS AND OTHER SPECIAL VARIABLES


    Arguments are the values you pass to a shell script. Each value on the command
    line after the name of the script will be assigned to the special variables $1,
    $2, $3, and so on. The name of the currently running script is stored in the $0
    variable.


    Here are some other special variables you will find useful in script writing:


    +   $#    The number of arguments

    +   $*    The entire argument string

    +   $?    The return code from the last command issued


    So let''s try some examples working with arguments and other special variables.
    Create an executable script called testvars containing these lines:


    ```

    echo "My name is $0"

    echo "First arg is: $1"

    echo "Second arg is: $2"

    echo "I got a total of $# arguments."

    echo "The full argument string was: $*"

    ```'
