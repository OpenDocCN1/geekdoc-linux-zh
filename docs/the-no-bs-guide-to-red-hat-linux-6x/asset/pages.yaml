- pgno: 335
  md: 'know only the package name, not the name of the original package file. Here''s
    how to remove the dogfood package:


    ```

    rpm -e dogfood

    ```


    RPM will tell you if the removal of the package will cause problems for other
    installed packages. If it will, you may see a message like this:


    ```

    removing these packages would break dependencies:

    dogfood is needed by fido-1.0-1

    ```


    If you''re sure you know what you''re doing, you can add the --nodeps flag, and
    RPM will skip the dependency checks and uninstall the package anyway.


    # UPGRADING AND FRESHENING PACKAGES


    Upgrading a package is similar to installing one, but RPM automatically uninstalls
    existing versions of the package before installing the new one. If an old version
    of the package is not found, the upgrade option will still install it. (This is
    different than the freshen option, which will install only if an old version of
    the package is found.) Note that RPM flags are case sensitive, so be sure to use
    a capital “U” when upgrading, as in this example:


    ```

    rpm -Uvh panda-2.0-1.i386.rpm

    panda

    ########################################

    ```


    Since RPM performs intelligent upgrading of packages with configuration files,
    you may see a message like this:


    ```

    saving /etc/panda.conf as /etc/panda.conf.rpmsave

    ```


    RPM is saying that it saved a copy of your original configuration file and installed
    a new one. You should use diff or a visual inspection to find any differences
    between the two files to ensure that your customizations are applied to the new
    version.


    # HEY, THAT''S A DOWNGRADE!


    If RPM thinks you are trying to upgrade to a package with an older version number,
    you will see an error message like this:'
  merge: -1
  img_proc: true
- pgno: 336
  md: '```

    rpm -Uvh panda-2.0-1.i386.rpm

    panda    package panda-3.0-1 (which is newer) is already installed

    error: panda-2.0-1.i386.rpm cannot be installed

    ```


    If you want RPM to ignore this condition, you can add the --oldpackage flag, as
    in the example here:


    ```

    rpm -Uvh --oldpackage panda-2.0-1.i386.rpm

    panda    ########################################

    ```


    # GETTING FRESH WITH LINUX


    Freshening a package is the same as upgrading, but RPM will perform the upgrade
    only if an older version of the package is already installed. Note that RPM flags
    are case sensitive, so be sure to use a capital "F" when freshening, as in this
    example:


    ```

    rpm -Fvh pinesol-3.2-1.i386.rpm

    panda    ########################################

    ```


    RPM''s freshen option is especially handy if you''ve just downloaded a bunch of
    packages, and you want to upgrade only those packages that are already installed
    on your system. Use a command like this to tell RPM to look for all package files
    in the current directory and freshen only the previously installed packages:


    ```

    rpm -Fvh *.rpm

    ```


    # QUERYING PACKAGES


    RPM has a powerful query feature that allows you to find out what packages are
    installed on your system, the files associated with a package, or the package
    that owns a particular file. Use the -q flag to tell RPM to display the package
    name, version number, and release number of a package that''s already installed,
    as in this example:


    ```

    rpm -q panda

    panda-2.0-1

    ```'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'Here are some other flags you can use to specify the packages you want to query:


    | FLAG | MEANING |

    |---|---|

    | -a | Queries all currently installed packages |

    | -f somefile | Queries the package that owns the specified file |

    | -p packagefil | Queries the specified package |


    And here are the flags you can use to control and format the information that
    your query returns:


    | FLAG | MEANING |

    |---|---|

    | -i | Displays detailed package information such as name, description, release,
    size, build date, install date, and vendor |

    | -l | Displays all files associated with the package |

    | -d | Displays documentation and help files associated with the package |

    | -c | Displays configuration files associated with the package |

    | -v | Outputs file listings in the format of the ls -l command |


    # Some Query Examples


    You can combine the flags for querying in may useful ways. Here are some examples.


    To find out which package owns a file, enter


    ```

    rpm -qf /usr/bin/panda

    panda-2.0-1

    ```


    To find the documentation that came with a package, enter


    ```

    rpm -qd hotrod

    /usr/man/man1/hotrod.1

    /usr/info/hotrod.info.gz

    /usr/doc/hotrod-1.0-1/README

    ```'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# To learn about a package before installing it, enter


    ```

    rpm -qip hotrod-1.0-1.i386.rpm

    Name         : hotrod          Distribution: Red Hat Linux

    Version      : 1.0             Vendor: Faster Software

    Release      : 1              Build Date: Sun Jul 04 14:35:27 1999

    Install date : (none)          Build Host: dev.faster.com

    Group        : Games           Source RPM: hotrod-1.0-1.src.rpm

    Size         : 3143593

    Summary      : simulated hotrod racing game for SVGA

    Description  :

    An action game that pits you against other maniacal drivers

    on the Los Angeles freeway. Experience the thrill of road

    rage as you attempt to get to work on time.

    ```


    # To see what files a package contains, enter


    ```

    rpm -qlp hotrod-1.0-1.i386.rpm

    /usr/man/man1/hotrod.1

    /usr/info/hotrod.info.gz

    /usr/doc/hotrod-1.0-1/README

    /usr/lib/games/hotrodlib/cars.dat

    /usr/lib/games/hotrodlib/drivers.dat

    /usr/lib/games/hotrodlib/weapons.dat

    /usr/lib/games/hotrodlib

    /usr/games/hotrod

    ```


    # To find all installed packages that match a specific pattern, enter


    ```

    rpm -qa | grep panda

    panda-2.0-1

    pandacalc-3.1-4

    xpanda-1.2-3

    ```


    Since the -q flag does accept a package name, you might wonder why we didn''t
    use a command like this:


    ```

    rpm -q panda*

    ```


    This won''t work because of the way the Bash shell treats wildcard characters,
    so we have to tell RPM to spit out all the installed package names and use grep
    to filter the list.

    Finally, here''s an advanced form of the query command that will tell you which
    packages are taking up the most room:


    ```

    rpm -qa --queryformat="%(SIZE) %(NAME)" | sort -n

    ```'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'This command uses the -queryformat flag to specify that only the size and name
    information are to be printed for each package. The RPM output is piped to the
    sort command, which displays the package list sorted by size, from smallest to
    largest.


    # VERIFYING PACKAGES


    RPM includes a verify feature to help you identify problems with your installed
    packages. If you''ve deleted some files by accident or you think a file may have
    been corrupted, you can use the verify feature to find and fix the problem. RPM
    will compare the size, checksum, permissions, type, owner, and group information
    from its database against the files installed on your system and report any differences.
    Remember that RPM flags are case sensitive, so be sure to use a capital "V" when
    verifying, as in the examples shown here. To verify a specific package, enter


    ```

    rpm -V panda

    ```


    To verify the package that contains a specific file, enter


    ```

    rpm -Vf /usr/games/hotrod

    ```


    To verify an installed package against the RPM package file, enter


    ```

    rpm -Vp hotrod-1.0-1.i386.rpm

    ```


    To verify all installed packages, enter


    ```

    rpm -Va

    ```


    If RPM finds no problems, there will be no output. If any problems are found,
    RPM will display a file name preceded by a string of eight characters. Each column
    of this string specifies whether or not there was a problem with a particular
    attribute of the file. If a period (.) appears in a column, there was no problem.
    If any of the characters in the following table appears, a problem related to
    that attribute occurred.'
  merge: -1
  img_proc: true
