    ```

    atrm 2

    ```


    # LINK FILES TOGETHER


    You can link files together in two ways: with hard links or symbolic links.


    # CREATING A HARD LINK


    The ln command lets a file on your disk be accessed with more than one file name
    by hard-linking a new file name to it. When you hard-link a file, you create a
    new file name and connect it with the original file. Hard-linking can let two
    users share the same file or provide a more convenient way of referencing files
    buried deep in a series of directories. Here''s an example. Suppose hermie and
    sigmund are working on the Top Secret Snowgun Project, and the formula for the
    Snowgun is stored in /home/hermie/projects/snowgun/formula.txt. Sigmund'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'doesn’t want to type that long, ugly file name every time he needs to update
    the file, so he creates a hard link to the file, like this:


    ```

    ln /home/hermie/projects/snowgun/formula.txt sgformula

    ```


    The preceding command links the file name sgformula to the file formula.txt contained
    at the end of that directory string. There’s still only one copy of the snowgun
    formula (formula.txt) on the disk, but now sigmund can access it quickly with
    the name sgformula (assuming hermie gives him write permission to the file). Interestingly,
    if hermie deletes his projects/snowgun/formula.txt file, Linux will not remove
    the file from the file system because sigmund still has a link to it.


    Think of the ln command as a way of creating a kind of nickname for a file. By
    the way, there is no parallel to this file-linking concept in the DOS world—you’d
    have to create a second copy of the file and keep the various copies in synch
    manually to get a similar result.


    # CREATING A SYMBOLIC LINK


    The type of link we just created is called a hard link. There’s another type called
    a symbolic link. Symbolic links (also called symlinks) work like hard links, but
    you can do a bit more with them. If you want to create a link to a directory (as
    opposed to a file), you must create a symlink. Symlinks are also required when
    linking to a file on a different disk partition or on a network.


    To create a symbolic link, add the -s parameter to the ln command, like this:


    ```

    ln -s /dev/fd0 A:

    ln -s /etc/httpd/conf web

    ```


    The first example allows you to access the floppy drive as drive A, just like
    in DOS, and the second creates a directory entry called web that can be used instead
    of /etc/httpd/conf.


    # WRAPPING UP


    Learning Unix would be hard if you tried to master everything it has to offer
    all at once. But then so would DOS, and especially Windows. In fact, Windows’
    configuration files are more complex than Unix’s. When'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'you first learned DOS, there were only a dozen or so commands that you needed
    to understand—you could learn the rest as needed. It''s the same with Unix. You
    need learn more only if you want to get more out of Unix.


    Also, though you may not realize it, DOS is a kind of subset of Unix. DOS adopted
    from Unix the idea of a hierarchical file system, as well as the concepts of filters
    and piping. Moreover, each command that you learned in DOS has a direct parallel
    in Unix. (See Appendix B, “DOS and Unix Equivalencies.”)


    Take a little time to play with each of the commands discussed in this chapter,
    and you''ll be well on your way to becoming a proficient Linux user. If you want
    to dig deeper, use the man command to get more detailed information on any command.
    I''ve listed the most common usage and options for these commands, but there''s
    more if you care to explore.'
  merge: -1
  img_proc: true
