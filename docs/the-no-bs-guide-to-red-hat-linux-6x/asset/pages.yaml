    you can omit the `./` before the name.


    But there''s one important thing you should know about running shell scripts this
    way. When you enter the shell script name and tell Bash to run it, a subshell
    is created for the execution of the script. This subshell inherits all the shell
    environment variables, including the current directory, but you lose any changes
    made to that environment when the script terminates.


    What''s the practical meaning of this? Well, you might expect that the current
    directory would be `/tmp` after you''ve run the `deltemp` script, but it''s not.
    You''ll still be in hermie''s home directory. And if we had set an environment
    variable inside the script, its value would be good only during the execution
    of the script. Here''s an example to demonstrate this point. Create an executable
    **setvar** script with these lines:


    ```

    PS1=''My Prompt: ''

    echo $PS1

    ```


    Now watch how the values of the current directory and the PS1 variable change:


    ```

    $ PS1=''Bash Me! ''

    $ echo $PS1

    Bash Me!

    $ setvar

    My Prompt:

    $ echo $PS1

    Bash Me!

    ```


    PS1 before setvar.

    PS1 during setvar.

    PS1 after setvar.


    It looks like this script is absolutely useless for the intended purpose of setting
    the environment variable. But a little trick will make it work the way you want.
    Run the script by prefixing the name with a dot and a space, like so:


    ```

    . setvar

    ```


    This tells Bash to run the setvar script in the current shell environment, instead
    of creating a temporary subshell. Verify for yourself that'
