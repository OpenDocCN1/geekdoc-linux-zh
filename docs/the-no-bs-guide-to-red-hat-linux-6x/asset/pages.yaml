    As in Bash scripts, Perl doesn’t require you to declare a type for your variables.
    Perl figures out by context whether the value should be treated as a number or
    a character string and will even perform character-to-numeric value conversions
    when necessary. To assign or access the value (contents) of a variable, prefix
    it with a dollar sign. Spaces before or after the equal sign are optional, but
    if you want to assign a variable that contains character data, you must put quotation
    marks around the string.


    ```

    $num=5;

    $stuff = "chocolate truffles";

    $user = $ENV{USER};

