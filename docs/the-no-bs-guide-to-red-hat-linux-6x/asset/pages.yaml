  md: '# USING GNOPAD+


    Using Gnotepad+ is very simple—just start typing. If you make a mistake, use the
    BACKSPACE or DELETE key. You can always use the mouse to position the text cursor
    or mark text for cut-and-paste operations. If you’ve used Windows Notepad or any
    graphical word processor, you will have no trouble with Gnotepad+.


    Let’s quickly run through the drop-down menus corresponding to the File, Edit,
    Window, and Options menu items.


    The File menu (see Figure 7-9) has the expected file open, close, save, and print
    functions, with a few extras. The “Open Recent” function displays a list of recently
    edited files so you can quickly reopen one of them. The “View HTML” function applies
    only to HTML source-code files; it shows you a quick-but-rough view of how the
    HTML will look as a Web page, or it launches the Netscape browser to render the
    page.


    The Edit menu (see Figure 7-10) offers all the usual cut, copy, and paste functions,
    along with unlimited Undo, Redo, and Replace options. Also of note is the “Insert
    Shell Output” option, which allows you to run a Linux command and pipe its output
    directly to the open


    ![](img/3137cdda7122042e86dbeafe9840d4ed_208_0.png)


    ![](img/3137cdda7122042e86dbeafe9840d4ed_208_1.png)'
