- pgno: 294
  md: 'would result from a `dir C:` command under DOS. You can use `cd` to see other
    directories under `/dos` and use any Linux command to slice and dice your DOS
    files.


    It’s great to have the ability to copy files back and forth between Linux and
    DOS, but you can also do some clever things if you think creatively. I find it
    particularly helpful to use the `ln` (link) command to share my Netscape bookmarks
    file between Linux and DOS, like this:


    ```

    `ln -s /dos/netscape/bookmark.htm $HOME/.netscape/bookmarks`

    ```


    By linking these files together, I need to manage just one bookmark file. Of course,
    this trick works only if both the DOS and Linux versions of a product use the
    same format for the files being shared.


    If you want your DOS partition to mount each time you boot Linux, add the line
    shown here to the `/etc/fstab` file:


    ```

    `/dev/hda1  /dos  msdos  umask=022`

    ```


    When Linux boots up, it looks in the `/etc/fstab` file and mounts all the file
    systems specified there, so you won’t have to issue the mount command manually
    to access your DOS partition. The line you just added to `/etc/fstab` has the
    same effect as the mount command shown earlier. The same caveat about FAT32 file
    systems applies here, so you may need to replace `msdos` with `vfat` in the previous
    example.


    # RUNNING DOS PROGRAMS WITH DOSEMU


    DOSemu (DOS Emulator) is a program that lets you run many of your favorite DOS
    applications under Linux. The name is a little bit misleading—it doesn’t actually
    emulate DOS; it boots DOS to a virtual machine using the special hardware features
    in Intel 80386 and higher CPUs.


    A DOSemu session looks and acts like a real DOS session, with a few limitations
    on what can be done. Not all video and sound cards are supported under DOSemu,
    and some programs that require DPMI (DOS Protected-Mode Interface) will not run.
    The most notable example of this is Windows 3.1, although some people do report
    being able to run it under DOSemu.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# SETTING UP DOSEMU


    Setting up DOSemu is not hard, but it does require a few steps to get a fully
    functional DOS session. Unfortunately, the DOSemu package is not present on the
    CD in this book, so you’ll have to download it from the DOSemu Web site—http://www.dosemu.org/.
    I recommend that you get the latest stable version (v0.98 at press time) and stay
    away from the developer versions, since they tend to be buggy.


    After downloading the RPM file for DOSemu, issue a command like the one below
    while logged in as root. The filename may be slightly different, depending on
    the version you download. (See Chapter 14, “Updating Your Linux System,” for more
    about the rpm command.


    ```

    rpm -i dosemu-0.98.6-1.i386.rpm

    ```


    Install DOSemu v0.98


    # CONFIGURING DOSEMU


    The package is now installed, but we need to tweak the DOSemu configuration file
    before using it. Edit the /etc/dosemu.conf file and modify the $_hdimage entry
    so that it reads as follows:


    ```

    $_hdimage = "hdimage.test /dev/hda1"

    ```


    The hdimage.test file resides in your /var/lib/dosemu directory and is a hard
    disk image—a special Linux file that contains a complete DOS system. The line
    you just modified tells DOSemu to treat the hdimage.test file as the C drive when
    DOSemu is started. This C drive is not your beloved DOS partition; it’s a simulated
    bootable hard-disk partition containing the FreeDOS operating system – a freeware
    clone of MS-DOS. The /dev/hda1 portion of the modified line tells DOSemu to treat
    your real DOS partition as the next drive letter, or the D drive. (You can boot
    DOSemu directly from your real DOS partition, but we’ll address that later.)


    # STARTING A DOSEMU SESSION


    Before starting a DOSemu session, which will be accessing /dev/hda1 (your MS-DOS
    partition), it’s very important to unmount the partition.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Otherwise, the DOS virtual machine and your Linux system might be trying to
    write to the disk simultaneously, with potentially disastrous results. To unmount
    the partition, issue this command:


    ```

    umount /dev/hda1

    ```


    Now we''re ready to fire up DOSemu. Issue the command shown here from your Linux
    command prompt:


    ```

    dos

    ```


    In a few seconds, you should see a DOS session start, and the familiar C:\> prompt
    will appear. Voila—you''re running DOS under Linux! Issue the dir command and
    have a look at the results. Don''t panic if the listing of files is unfamiliar.
    Remember—what you have here is a special C drive with the FreeDOS files that DOSemu
    will use to boot up (see Figure 12-1).


    You can switch to your D drive (your DOS partition) by issuing the D: command
    and then change directories, view files, execute programs, and so on. Because
    we booted from the C drive with FreeDOS, the config.sys and autoexec.bat files
    from your DOS partition were not executed. This means that your normal DOS PATH
    variable will not be set, so you may have to use cd to get to the appropriate
    directory before running a program.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_296_0.png)


    Figure 12-1: FreeDOS in a DOSemu session'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# EXITING FROM DOSEMU


    You can exit the DOSemu session by entering the following command at your C: prompt
    (note that it won’t work if you are at the D: prompt):


    ```

    exitemu

    ```


    If that doesn’t work, or if your DOSemu session is frozen, log in from another
    virtual console and then use the ps and kill commands to find and terminate the
    DOSemu task. (See Chapter 4, “Living in a Shell,” for details on killing an active
    task.) It’s a good idea to copy the exitemu.com file from the C drive to the D
    drive so you can exit from DOSemu cleanly if you later decide to run DOSemu directly
    from your “real” DOS partition. To do so, enter this command from the C: prompt:


    ```

    copy C:\exitemu D:\

    ```


    # STARTING DOSEMU WITH “REAL” DOS


    If any of your DOS programs don’t run correctly as a result of finding themselves
    on a D drive instead of a C drive, you can start a DOSemu session by booting your
    “real” DOS partition. To do so, edit the /etc/dosemu.conf file and modify the
    $_hdimage entry so that it reads like this:


    ```

    $_hdimage = "/dev/hda1"

    ```


    This tells DOSemu to treat your DOS partition as the C drive and to boot the MS-DOS
    operating system instead of FreeDOS. Upon restarting DOSemu, MS-DOS will try to
    start Windows 95/98, if you have it installed. This will surely lock up your machine,
    because DOSemu does not support Microsoft Windows. To avoid this problem, press
    the F8 key as soon as the message “Starting MS-DOS” appears and then select option
    6, “Command Prompt Only,” to boot MS-DOS without starting Windows.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# ADDITIONAL DOSEMU CONFIGURATION


    By default, DOSemu starts with text-only video support and no support for serial
    ports. So if you want to run any graphics programs or use the mouse or modem,
    exit DOSemu and continue.


    To enable support for graphics or the mouse or modem, edit the /etc/dosemu.conf
    file as described here. I recommend that you configure only the features you really
    need. Take these steps one at a time and test each new feature separately by starting
    DOSemu. That way, if a problem arises, you’ll know which feature caused it and
    you can go back to the /etc/dosemu.conf file and disable it or try an alternative.


    # SETTING UP VGA GRAPHICS


    Look for the $_graphics and $_videoportaccess entries and change them to read
    as follows:


    ```

    $_graphics = (1)

    $_videoportaccess = (1)

    ```


    Start DOSemu and test your graphics program. If it doesn’t work, see the copious
    comments in the /etc/dosemu.conf file or at the DOSemu Web site for other things
    to try.


    # SETTING UP MOUSE SUPPORT


    Look for the $_com1, $mouse, and $mouse_dev entries and change them as follows:


    ```

    $_com1 = "/dev/mouse"

    $_mouse = "microsoft"

    $_mouse_dev = "/dev/mouse"

    ```


    If your mouse is not on COM1, select the $comX entry corresponding to your mouse
    port. Set the $_mouse value according to the type of mouse you have. Most systems
    use a Microsoft mouse, but this value can be microsoft, mousesystems, logitech,
    mmseries, mouseman, hitachi, busmouse, or ps2. Start DOSemu and test your mouse
    application. Again, if you have problems getting the mouse to work, refer to the
    /etc/dosemu.conf file or the DOSemu Web site—http://www.dosemu.org/.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# ## Setting Up Modem Support


    Look for the `$_com2` entry and change it to read as follows:


    ```

    $_com2 = "/dev/modem"

    ```


    If your modem is not on COM2, select the `$comX` entry corresponding to your modem
    port. Start DOSEmu and test your modem application.


    # ## Running DOSEmu Under X Windows


    You can run a DOSEmu session under X Windows by issuing the `xdos` command from
    an xterm window. A new window titled DOS in a Box should appear on the screen.
    The xdos session should behave the same as any other DOSEmu session, except that
    it doesn’t support graphics.


    # ## Getting More Information on DOSEmu


    The volunteer developers of DOSEmu are working hard to fix bugs and resolve existing
    compatibility problems. You can visit James MacLean’s DOSEmu home page at http://www.dosemu.org
    to get the latest news on DOSEmu and download new versions as they are made available.
    If you are a programmer, you can find out how to contribute to the DOSEmu development
    effort.


    # # Running Windows Programs

    # with Wine


    Wine (Windows Emulator – or “Wine Is Not an Emulator”) is a program that allows
    you to run some Windows 3.1 and Windows 95/98 applications under Linux. Wine works
    by intercepting the internal Windows program calls and translating them into equivalent
    X Windows functions.


    Although work on Wine has come a long way, it is still considered to be alpha
    (experimental) code. Many people have reported varying degrees of success running
    some of the larger shareware and commercial programs under Wine, but some programs
    still run poorly or not at all.'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'While some time ago the Wine documentation flatly stated that 32-bit Windows
    95/98 applications would never run under Wine, today many run quite well.


    The newsgroup comp.emulators.ms-windows.wine is the best place to look for the
    latest news on Wine and occasionally has postings that tell of successes and failures
    in running various Microsoft Windows programs under Wine. The official WineHQ
    Web site maintains a searchable database of programs that have been tested under
    Wine. (See http://www.winehq.com)


    # How Do I Get a Taste of Wine?


    The Wine package is not included on the CD that comes with this book because a
    new version of Wine is distributed about twice a month. If you want to try out
    Wine, you’ll have to get the latest executable and configure the package on your
    Linux system. Look for the RPM file corresponding to the latest Wine release at
    the WineHQ Web site and download it to your system. For instance, the version
    released on May 23, 1999, was called **wine-990523-1.i386.rpm**.


    # How Do I Run Wine?


    You’ll need about 10MB of hard drive space to store Wine files, and it’s recommended
    that you have at least 16MB of RAM and a 16MB swap partition to run Wine. You’ll
    also need to have a mounted DOS partition with Microsoft Windows 3.1 or 95/98
    installed on it.


    To install Wine from the **RPM** file, issue a command like this, replacing the
    xxxx with the date stamp of the Wine file you just downloaded:


    ```

    rpm -i wine-99xxxx-1.i386.rpm

    ```


    When the installation is finished, you have just one more setup step to perform.
    Edit the /usr/local/wine.conf file and edit the Path= line in the [Drive C] section
    so that it reads Path=/dos (assuming that’s the name you assigned to your mounted
    DOS partition); then save the file. If you have an older-style FAT file system
    on your DOS partition, use msdos instead of win95 on the Filesystem line.'
  merge: -1
  img_proc: true
