    of text. Move the cursor to the end of the word giraffe on the next line—your
    file should look like Figure 7-7.


    Once you''ve marked a block of text, CTRL-K acts a bit differently from before.
    Instead of deleting the entire line where the cursor is located, it deletes the
    highlighted block. You can then use CTRL-U to paste the deleted block elsewhere.


    ```

    UW PICO(tm) 4.3                                 File: bulb.joke


    Q: How many surrealists does it take to screw in a light bulb?


