    # TIME ZONE CONFIGURATION


    ![](img/3137cdda7122042e86dbeafe9840d4ed_311_0.png)


    Figure 13-6: The Timezone configurator


    If you move your PC from one time zone to another, you should use the Timezone
    configurator (shown in Figure 13-6) to tell Linux about your new location.


    # X WINDOWS CONFIGURATION


    ![](img/3137cdda7122042e86dbeafe9840d4ed_311_1.png)


    Figure 13-7: The X configurator


    If you''re having trouble getting X Windows working, or if you want to try a different
    screen resolution, run the X Configurator (shown in Figure 13-7) again. If you
    run into trouble, try using the configuration for a Generic Multisync monitor
    at 800x600 resolution.'
