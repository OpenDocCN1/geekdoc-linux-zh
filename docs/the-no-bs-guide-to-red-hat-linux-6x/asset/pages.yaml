    If you can''t remember the name of the file to insert, press CTRL-T to display
    a list of all your files. If you ultimately decide not to insert it, press CTRL-C
    to cancel.


    # CUTTING AND PASTING WITH PICO


    If all you want to do is cut and paste a line of text, you can use CTRL-K to delete
    the current line and CTRL-U to paste it somewhere else. Pico also lets you cut
    and paste blocks of text. Put your cursor on the word light on the first line
    of the bulb.joke file and press CTRL-^ ( the circumflex is the shifted 6 key).


