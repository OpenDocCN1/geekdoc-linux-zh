    # SEARCH FOR FILES WITH FIND


    Linux’s tree-structured file system is great for organizing your files, but a
    plethora of directories and subdirectories can make it easy to lose track of specific
    files. To search for a file named cookie, you can use the find command, like this:


    ```

    find / -name "cookie" -print

    ```


    This command tells find to start looking in the root directory of the file system
    (/) for files named (-name) cookie and then to print (-print) the full name of
    each file it finds.


    Actually, you don’t need the -print flag on Red Hat Linux, but on most Unix systems,
    if you leave off the -print flag, find will merrily search and then throw the
    results in the bit bucket. (This is a fictitious device attached to all computers.
    When the operating system deletes a file or discards data, it is said to be thrown
    in the bit bucket.)


    This is a departure from the rule of thumb that Linux commands will print their
    output on the screen unless you specify otherwise.


    Starting from the root directory may take a long time, since find will search
    every single directory on the system. You can shorten the search time by telling
    find where to start searching if you know that the file you want lies along a
    certain path. Here are a few examples:


    | Command | Description |

    |---|---|

    | `find . -name "cookie" -print` | Start looking in the current directory. |

    | `find ~sigmund -name "cookie" -print` | Start looking in sigmund’s home directory.
    |

    | `find /etc -name "cookie" -print` | Start looking in the /etc directory. |'
  merge: -1
  img_proc: true
