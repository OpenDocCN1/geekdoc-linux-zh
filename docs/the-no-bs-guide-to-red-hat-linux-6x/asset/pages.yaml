- pgno: 80
  md: '# THE GNOME HELP BROWSER


    The GNOME Help Browser (Figure 2-11) is a convenient path to all the available
    help files on your system. Click on the taskbar button with the big question mark
    and you''ll launch the GNOME Help Browser. From there, you can browse a catalog
    of help information in man, info, and html format, along with special help files
    for the GNOME interface.


    # THE GNOME DESKTOP


    Outside of the panel, the rest of the screen space is called the desktop. If you
    have programs or data files that you use often, you can place them on your desktop
    and then double-click to use them. If the item is a program, the program will
    start. If it''s data, the appropriate program will start with that data loaded.
    If it''s a WWW link, the Netscape browser will start and display the Web page.
    If it''s a directory, the File Manager will start and show the contents of that
    directory.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_80_0.png)


    Figure 2-11 The GNOME Help Browser'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'The desktop supports drag-and-drop operation, so you can easily move items
    between the desktop and other windows. You can drag data files from the File Manager
    to a program icon on the desktop to launch the program with that data loaded,
    or you can drag a link from Netscape and drop it on the desktop to create a shortcut.


    # DESKTOP AREAS


    Earlier in this chapter we touched on the subject of desktop areas while discussing
    the GNOME Pager. If your screen gets too cluttered with active windows, you can
    click on the desktop switcher in the Pager to move to another desktop area and
    open more windows. If you''re a keyboard addict, you can use the ALT-F1 through
    ALT-F4 keys to switch among the desktop areas.


    If you''re wondering why they''re called desktop areas and not just desktops,
    there is a good reason: The four desktop areas actually make up one big desktop.
    You can see how this makes sense by dragging a window to the right side of the
    screen so that half of it disappears. Now move to the second desktop area and
    you''ll see that the other half of the window is there. This doesn''t make much
    practical sense, but it does illustrate the point.


    # MOVING WINDOWS BETWEEN DESKTOPS


    If you want to move a window from one desktop area to another, click on the "System
    Menu" button in the upper-left corner of the window and then select "Desktop"
    and choose the target desktop area.


    If you want a certain window to appear on all four desktop areas, click on the
    "System Menu" and select the "Stick/Unstick" option. This doesn''t mean that you''ll
    have four copies of that program running. When you move from one desktop area
    to another, this window will follow as you go.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_81_0.png)


    # FILE MANAGER


    The File Manager application (see Figure 2-12) lets you manipulate your files.
    The left side of its window shows directories, and the right side shows the selected
    directory''s contents. If you have used the File Manager application for Windows,
    you''ll be right at home. Here are some quick tips:'
  merge: -1
  img_proc: true
- pgno: 82
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_82_0.png)


    *Figure 2-12: The File Manager*


    +   - Click on a plus sign in the left panel to expand a branch of the file tree
    (to reveal subdirectories) or click on a minus sign to hide a branch of the file
    tree.

    +   - Use the “Icon,” “Brief,” “Detailed,” and “Custom” buttons to change the
    style of the file listing in the right panel.

    +   - To run a program or edit a data file, double-click it.

    +   - To move a file or directory, just drag and drop it to another folder, window
    or the desktop.

    +   - To copy a file, hold down the **CTRL** key while dragging.

    +   - Start two File Manager windows with different directories to easily move
    or copy files between directories.

    +   - To rename a file, right-click on it and select “Properties.”

    +   - To delete a file, select with a single-click and then press the **DELETE**
    key.


    # SELECTING FILES


    To select more than one item, hold down the **SHIFT** key and click on the items.
    You can also use a *rubber-band selection*, by holding down the left mouse button
    and dragging the mouse over a group of files.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'A small dotted line will show the selected files. For more flexibility in selecting
    files, use the “Select Files” option in the “Edit” menu. This will display a pop-up
    menu where you to enter criteria for your selection. For example, you could select
    all HTML files in the directory by entering *.html as the criterion.


    # FILE ACTIONS


    If you right-click on any file in the right panel, you can choose several actions
    from a pop-up menu:


    +   - Open Opens the file with the associated application. (Refer to the section
    on editing your GNOME Mime Types in Chapter 13, “Tweaking Linux”.)

    +   - Open With Opens a file with an application you select, if you don''t want
    to use the default associated application.

    +   - View Lets you view the file with a simple text browser.

    +   - Edit Opens the file in an editor associated with that file type. (Refer
    to the section on editing your GNOME Mime Types in Chapter 13, “Tweaking Linux.”)

    +   - Copy Copies the file to the clipboard so that it can be pasted elsewhere.

    +   - Delete Deletes the selected files.

    +   - Move Moves the selected files to another folder.

    +   - Properties Allows you to change the properties for the selected file. You
    can change the name of the file; the default open, view, and edit actions; and
    the read, write, and ownership permissions.


    # GAMES AND PRODUCTIVITY APPLICATIONS


    Your Red Hat Linux system comes with a set of nifty applications to boost your
    productivity or help waste time—whatever your needs may be! You can launch any
    of these applications by selecting them from the Main menu on the GNOME Panel.'
  merge: -1
  img_proc: true
