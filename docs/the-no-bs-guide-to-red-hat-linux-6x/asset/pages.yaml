    # CHOOSING INSTALL OR UPGRADE


    Press Next when you see the “Welcome to Red Hat Linux” screen (see Figure 1-7),
    and proceed to the “Install Path” screen shown in Figure 1-8.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_48_0.png)


