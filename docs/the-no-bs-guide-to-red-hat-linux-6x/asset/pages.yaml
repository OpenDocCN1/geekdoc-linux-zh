- pgno: 196
  md: '# QUITTING WITHOUT SAVING YOUR CHANGES


    Hmmm. . . . “Biff” just doesn’t have that wholesome ring to it, so let’s forget
    about all the changes we’ve made in this editing session and exit vi without saving
    the file. Make sure you’re in Command mode, enter the :q! command, and then press
    ENTER. Your Linux prompt should return, and the cow.joke file will be just as
    it was before.


    # PARTING WORDS ABOUT VI


    Using vi can be frustrating, but it really isn’t rocket science once you get used
    to the concept of the two modes and get the hang of when it’s okay to move your
    cursor or enter text. If you’re ever unsure about which mode you’re in, simply
    press ESC once or twice, and you can be sure you’re in Command mode.


    There are some powerful (but arcane) commands that diehard vi users use to get
    things done quickly in this relic-of-the-sixties text editor. The man vi command
    will tell you a lot more about vi if you decide you want to become proficient.


    The Usenet newsgroup comp.editors is a good place to discuss vi or ask questions.
    You can find the vi FAQ (Frequently Asked Questions) file on the Web at http://www.faqs.org/faqs/editor-faq/vi/.


    # THE EMACS EDITOR


    The Emacs editor is not part of Linux, but since it is one of the GNU utilities,
    it’s on the CD that comes with this book. If you selected all the suggested packages
    when you installed Linux, Emacs should already be on your system. If not, you
    can install it by mounting the CD and running the gnorp m command after starting
    X Windows.


    The Emacs editor is a lot easier to use than vi. There are no silly modes to trip
    you up—when you want to enter text, you just position the cursor and type. Gee,
    what a great idea. It also has built-in help.


    But while Emacs is a vast improvement over vi, you’ll still have to remember quite
    a few commands to be productive, and you’ll probably get a little lost. If vi
    is a relic of the sixties, Emacs sports the cutting-edge technology of the early
    eighties. If you get into a situation where Emacs seems to be stuck, or if you
    don’t know what to do, press CTRL-G and things will return to normal. (The CTRL-G
    key cancels'
