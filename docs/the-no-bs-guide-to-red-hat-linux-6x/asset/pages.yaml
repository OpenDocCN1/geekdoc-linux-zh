- pgno: 331
  md: 'Installing, uninstalling, and upgrading the software packages on your computer
    is an important part of keeping up with the latest technology, improving your
    productivity, and efficiently managing your hard disk space. These skills are
    especially important when you run Linux since it is constantly evolving and improving.
    From time to time, you may want to upgrade certain components of your Linux system
    or install useful new packages as you learn about them.


    Linux has an excellent utility called RPM (Red Hat Package Manager) that makes
    it painless to install, uninstall, and upgrade software packages. Software distributed
    in an RPM package comes as a compressed archive, with a special header file that
    gives information about the package, such as its name, description, version number,
    size, and author.


    Although RPM was created by Red Hat Software, it is available for anyone to use
    and works on other Linux and Unix systems. The RPM package format has become widely
    used in recent years and is now the de facto standard for software distribution
    in the Linux arena.


    # RPM FEATURES


    Here are some of the features that make RPM so useful and popular:


    # INTELLIGENT UPGRADES


    RPM makes it possible to upgrade individual components of your system without
    completely reinstalling everything. For example, when a new version of the Red
    Hat Linux operating system is released, you don’t have to reinstall the entire
    system as you do with most other operating systems. Since RPM maintains a database
    of all the software installed on your system, it can perform intelligent upgrades
    of your system, replacing old packages with updated versions and removing obsolete
    ones. Your configuration files are preserved in the process so you won’t lose
    your customizations.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# PACKAGE QUERYING


    RPM has many powerful querying options so you can easily search to find out what
    software is installed on your system or what package a file belongs to or to get
    a list of files that belong to a certain package.


    # SYSTEM VERIFICATION


    If you think you may have accidentally deleted a file belonging to a certain package,
    you can use RPM to verify the package. If RPM finds anything amiss, you can reinstall
    the package without disturbing any configuration files that you have modified.


    # WHY USE RPM?


    Before RPM was developed, most Unix software packages were distributed as compressed
    tar files, and this arrangement is still fairly common. But if you install software
    that comes packaged this way, you run certain risks and lose some potential benefits:


    +   - What if the new package overlays certain files that other packages depend
    upon, and the new version is not compatible with the old one? You could end up
    rendering one or more packages useless.

    +   - What happens if you want to remove the package from your system? It can
    be a real nuisance to find all the files associated with a package and manually
    remove them without affecting other software that shares common files.

    +   - What if the new version of PandaCalc replaces all your customization files
    with default versions? You’ll have to do all that work again.


    RPM solves all these problems — by warning you when new packages may affect existing
    ones, by providing an intelligent uninstall feature, and by preserving your customization
    files during upgrades. If you’re thinking of downloading and installing some new
    software, always check to see if an RPM version is available first, and you’ll
    save yourself some trouble later on.


    In this chapter, you’ll learn about the command-line interface to RPM and a graphical
    front-end called GnoRPM. They both get the job done, so it’s up to you to decide
    which one to use.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# RPM: THE COMMAND-LINE INTERFACE


    It''s easy to use RPM from the command line. Using the rpm command, you can install,
    uninstall, upgrade, query, or verify any package with a single command. This section
    contains an overview and examples of each type of RPM operation.


    > NOTE: If you want to install, upgrade, or uninstall packages, you must be logged
    in as root. Any user can use the query and verify options.


    # INSTALLING PACKAGES


    Before we talk about how to install a new package with RPM, let''s look at the
    file name of a typical RPM package. If the file is named panda-2.0-1.i386.rpm,
    then the package name is panda, the version number is 2.0, the release number
    is 1, and the format is i386 (Intel compatible). The file name of an RPM package
    doesn''t have to be in this format, but this is the convention that is commonly
    used.


    To install the panda package, you enter the command


    ```

    rpm -ivh panda-2.0-1.i386.rpm

    panda  ########################################

    ```


    In response, RPM prints the name of the package, followed by a bunch of pound
    signs as the package is installed, to let you know something is happening.


    # PACKAGE ALREADY INSTALLED?


    If the package is already installed, RPM will quit and print an error message
    like this:


    ```

    panda          package panda-2.0-1 is already installed

    error: panda-2.0-1.i386.rpm cannot be installed

    ```


    If you want to ignore the error and install the package anyway, add the --replacepkgs
    flag to the RPM command line, as in this example:


    ```

    rpm -ivh --replacepkgs panda-2.0-1.i386.rpm

    panda  ########################################

    ```'
  merge: -1
  img_proc: true
- pgno: 334
