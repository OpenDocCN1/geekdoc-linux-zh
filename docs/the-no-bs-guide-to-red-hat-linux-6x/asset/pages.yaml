  md: '# LINUX PROBLEM SOLVER


    by BRIAN WARD


    A must-have for intermediate to advanced users who already have Linux up and running.
    Solves technical problems related to printing, networking, backup, crash recovery,
    and compiling or upgrading a kernel. Quick and concise in approach, with over
    100 problem boxes that help to solve specific problems in addition to those discussed
    throughout the book.


    +   - Hands-on, practical guide solves kernel issues

    +   - Helps solve hundreds of problems


    CD-ROM: Supports the book''s contents with configuration files and numerous programs
    not included in many Linux distributions.


    BRIAN WARD is a Unix systems programmer, and is the author of the “Linux Kernel
    HOWTO”, widely circulated on the Internet. A Unix network administrator, he has
    worked with Linux since 1993. He is currently pursuing a Ph.D. in computer science
    at the University of Chicago.


    350 pp. w/CD-ROM, $34.95 ($54.00CDN)

    ISBN 1-886411-35-2, Item #352


    ![](img/3137cdda7122042e86dbeafe9840d4ed_464_0.png)


    # LINUX MUSIC & SOUND


    by DAVE PHILLIPS


    Linux Music & Sound offers in-depth instruction on recording, storing, playing,
    and editing music and sound under Linux. The author, a programmer and performing
    musician, discusses the basics of sound and digital audio, and covers specific
    software and hardware issues specific to Linux, including:


    ![](img/3137cdda7122042e86dbeafe9840d4ed_464_1.png)'
  merge: -1
  img_proc: true
- pgno: 465
  md: '+   - A clear introduction to the fundamental concepts of digital sound

    +   - Linux-specific issues including available toolkits, GUI libraries, and driver
    support

    +   - Reviews of available software with recommendations

    +   - Recommended components for building a complete system including a digital
    audio player/recorder, soundfile editor, MIDI recorder/player/editor, and software
    mixer

    +   - Coverage of hard disk recording, advanced MIDI support, network audio, and
    MP3

    +   - A complete bibliography and an extensive list of Internet resources

    +   - A CD-ROM with dozens of software packages


    A performing musician for over 30 years, DAVE PHILLIPS became interested in computers
    as a means for playing, editing, and recording music. He is an expert in MIDI,
    Csound, and Linux. He currently maintains several educational Web sites on these
    topics.


    300 pp., paperback, $39.95 w/CD-ROM

    ISBN 1-886411-34-4


    ![](img/3137cdda7122042e86dbeafe9840d4ed_465_0.png)


    # APPLE CONFIDENTIAL:

    THE REAL STORY OF APPLE COMPUTER, INC.


    by OWEN W. LINZMAYER


    > "The Apple story . . . in all its drama." — The New York Times Book Review


    > "Written with humor, respect, and care, it absolutely is a must-read for every
    Apple fan." — InfoWorld


    > "An irreverent work that captures the essence of that which is Apple."

    > — Gil Amelio, former Apple CEO


    In Apple Confidential, journalist and Mac guru Owen Linzmayer traces the history
    of Apple Computer from its legendary founding to its recent return to profitability.
    Backed by exhaustive research, the book debunks many of the myths and half-truths
    surrounding Apple, the Macintosh, and its creators. With facts, photos, timelines,
    and quotes, every page brings a new discovery about this fascinating company,
    including:'
