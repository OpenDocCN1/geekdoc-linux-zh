- pgno: 217
  md: 'One of the nice things about Linux is that it comes with a bunch of tools to
    help you manipulate files and data without writing programs. For example, if you
    want to search inside a bunch of files, pull out all lines that contain a certain
    keyword, sort those lines, eliminate duplicates, and then print just the third
    column of each line, it''s really not much trouble using the tools described in
    this chapter.


    Writing a C program to do that would not be a trivial exercise, even for an experienced
    programmer. But you can use these slicing-and-dicing tools like building blocks
    to manipulate data and produce reports without a computer science degree.


    Following is a description of how each tool works, and at the end of the chapter,
    you''ll find some tips on how to combine them into even more powerful commands.


    # THE HEAD COMMAND


    The head command displays the first few lines at the top of a file. It can be
    useful when you want a quick peek at a large file, as an alternative to opening
    the file with a text editor. By default, head will show the first ten lines of
    a file, but you can also tell it how many lines to display. Here are a couple
    of examples:


    ```

    head some.file    Show first ten lines of some.file

    head -5 some.file    Show first five lines of some.file

    ```


    # THE TAIL COMMAND


    The tail command displays the last few lines of a file. Like head, it can save
    you time because it''s a lot quicker than calling up a file with a text editor
    and scrolling all the way down to the bottom. By default, tail will show the last
    ten lines of a file, but you can also tell it how many lines to display:


    ```

    tail some.file    Show last ten lines of some.file

    tail -3 some.file    Show last three lines of some.file

    ```'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Here''s a practical example of how to use the tail command. Many Linux programs
    put diagnostic messages in the /var/syslog/messages file when they run, so this
    file can get pretty large after a while. To see if your most recent command issued
    any messages, look at the tail end of this file by entering the tail /var/syslog/messages
    command.


    # THE SORT COMMAND


    The sort command sorts a file according to fields—the individual pieces of data
    on each line. By default, sort assumes that the fields are just words separated
    by blanks, but you can specify an alternative field delimiter if you want (such
    as commas or colons). Output from sort is printed to the screen, unless you redirect
    it to a file. If you had a file like the one shown here containing information
    on people who contributed to your presidential reelection campaign, for example,
    you might want to sort it by last name, donation amount, or location. (Using a
    text editor, enter those three lines into a file and save it with donor.data as
    the file name.)


    ```

    Bay Ching 500000 China

    Jack Arta 250000 Indonesia

    Cruella Lumper 725000 Malaysia

    ```


    Let''s take this sample donors file and sort it according to the donation amount.
    The following shows the command to sort the file on the second field (last name)
    and the output from the command:


    ```

    sort +1 -2 donors.data

    Jack Arta 250000 Indonesia

    Bay Ching 500000 China

    Cruella Lumper 725000 Malaysia

    ```


    The syntax of the sort command is pretty strange, but if you study the following
    examples, you should be able to adapt one of them for your own use. The general
    form of the sort command is


    ```

    sort <flags> <sort fields> <file name>

    ```'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'The most common flags are as follows:


    +   - **-f** Make all lines uppercase before sorting (so “Bill” and “bill” are
    treated the same).

    +   - **-r** Sort in reverse order (so “Z” starts the list instead of “A”).

    +   - **-n** Sort a column in numerical order.

    +   - **-t x** Use x as the field delimiter (replace x with a comma or other character).

    +   - **-u** Suppress all but one line in each set of lines with equal sort fields
    (so if you sort on a field containing last names, only one “Smith” will appear
    even if there are several).


    Specify the sort keys like this:


    +   - **+m** Start at the first character of the m+1th field.

    +   - **-n** End at the last character of the nth field (if -N omitted, assume
    the end of the line).


    Looks weird, huh? Let’s look at a few more examples with the sample company.data
    file shown here, and you’ll get the hang of it. (Each line of the file contains
    four fields: first name, last name, serial number, and department name.)


    Jan Itorre 406378 Sales

    Jim Nasium 031762 Marketing

    Mel Ancholie 636496 Research

    Ed Jucacion 396082 Sales


    To sort the file on the third field (serial number) in reverse order and save
    the results in sorted.data, use this command:


    ```

    sort -r +2 -3 company.data > sorted.data

    ```


    Mel Ancholie 636496 Research

    Jan Itorre 406378 Sales

    Ed Jucacion 396082 Sales

    Jim Nasium 031762 Marketing


    Now let’s look at a situation where the fields are separated by colons instead
    of spaces. In this case, we will use the -t: flag to tell the sort command how
    to find the fields on each line. Let’s start with this file:'
  merge: -1
  img_proc: true
- pgno: 220
  md: '```

    Ito­re, Jan:406378:Sales

    Nasium, Jim:03762:Marketing

    Ancholie, Mel:636496:Research

    Jucacion, Ed:396082:Sales

    ```


    To sort the file on the second field (serial number), use this command:


    ```

    sort -t: +1 -2 company.data

    Nasium, Jim:03762:Marketing

    Jucacion, Ed:396082:Sales

    Itore, Jan:406378:Sales

    Ancholie, Mel:636496:Research

    ```


    To sort the file on the third field (department name) and suppress the duplicates,
    use this command:


    ```

    sort -t: -u +2 company.data

    Nasium, Jim:03762:Marketing

    Ancholie, Mel:636496:Research

    Itore, Jan:406378:Sales

    ```


    (Note that the line for Ed Jucacion did not print because he’s in Sales and we
    asked the command (with the -u flag) to suppress lines that were the same in the
    sort field.)


    There are lots of fancy (and a few obscure) things you can do with the sort command.
    If you need to do any sorting that’s not quite as straightforward as these examples,
    try the man sort command for more information.


    # THE UNIQ COMMAND


    The uniq command reads the input file and compares adjacent lines. Any line that
    is the same as the one before it will be discarded. In other words, duplicates
    are discarded, leaving only the unique lines in the file.


    Let’s say you’re a publisher with an inventory of all your books in the my.books
    file shown here:


    ```

    Atopic Dermatitis for Dummies

    Atopic Dermatitis for Dummies

    Chronic Rhinitis Unleashed

    Chronic Rhinitis Unleashed

    Chronic Rhinitis Unleashed

    Learn Nasal Endoscopy in 21 Days

    ```'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'To remove all the duplicates from the list of books, use this command:


    ```

    uniq my.books

    Atopic Dermatitis for Dummies

    Chronic Rhinitis Unleashed

    Learn Nasal Endoscopy in 21 Days

    ```


    If you want to print only the book titles that are not duplicated (to find out
    which books you have one copy of), add the -u flag, like this:


    ```

    uniq -u my.books

    Learn Nasal Endoscopy in 21 Days

    ```


    Conversely, you might want to exclude the titles that appear only once. If so,
    add the -d flag, like this:


    ```

    uniq -d my.books

    Atopic Dermatitis for Dummies

    Chronic Rhinitis Unleashed

    ```


    Now let’s take inventory. To summarize the list of books and add a count of the
    number of times each one appears in the list, add the -c flag, like this:


    ```

    uniq -c my.books

    2 Atopic Dermatitis for Dummies

    3 Chronic Rhinitis Unleashed

    1 Learn Nasal Endoscopy in 21 Days

    ```


    Note that the uniq command does not sort the input file, so you may want to use
    the sort command to prepare the data for uniq in advance. (See the end of this
    chapter for an example.)

    Here’s a recap of the flags you can use with the uniq command:


    +   - `-u` Print only lines that appear once in the input file.

    +   - `-d` Print only the lines that appear more than once in the input file.

    +   - `-c` Precede each output line with a count of the number of times it was
    found.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# The cut Command


    The cut command takes a vertical slice of a file, printing only the specified
    columns or fields. Like the sort command, the cut command defines a field as a
    word set off by blanks, unless you specify your own delimiter. It’s easiest to
    think of a column as just the nth character on each line. In other words, “column
    5” consists of the fifth character of each line.


    Consider a slight variation on the company.data file we’ve been playing with in
    this chapter:


    ```

    406378:Sales:Itorre:Jan

    031762:Marketing:Nasium:Jim

    636496:Research:Ancholie:Mel

    396082:Sales:Jucacion:Ed

    ```


    If you want to print just columns 1 to 6 of each line (the employee serial numbers),
    use the -c1-6 flag, as in this command:


    ```

    cut -c1-6 company.data

    406378

    031762

    636496

    396082

    ```


    If you want to print just columns 4 and 8 of each line (the first letter of the
    department and the fourth digit of the serial number), use the -c4,8 flag, as
    in this command:


    ```

    cut -c4,8 company.data

    3S

    7M

    4R

    0S

    ```


    And since this file obviously has fields delimited by colons, we can pick out
    just the last names by specifying the -d: and -f3 flags, like this:


    ```

    cut -d: -f3 company.data

    Itorre

    Nasium

    Ancholie

    Jucacion

    ```'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Here is a summary of the most common flags for the cut command:


    +   - **-c [n | n,m | n-m]** Specify a single column, multiple columns (separated
    by a comma), or range of columns (separated by a dash).

    +   - **-f [n | n,m | n-m]** Specify a single field, multiple fields (separated
    by a comma), or range of fields (separated by a dash).

    +   - **-d c** Specify the field delimiter.

    +   - **-s** Suppress (don''t print) lines not containing the delimiter.


    # THE GREP COMMAND


    The grep command selects and prints lines from a file (or a bunch of files) that
    match a pattern. Let''s say your friend Bill sent you an email recently with his
    phone number, and you want to call him ASAP to order some books. Instead of launching
    your email program and sifting through all the messages, you can scan your in-box
    file, like this:


    ```

    grep `number` /var/mail/hermie

    can call No Starch Press at 800/420-7240. Office hours are

    noted that recently, an alarming number of alien spacecrafts

    among colleagues at a number of different organizations

    ```


    Here, grep has pulled out just the lines that contain the word number. The first
    line is obviously what you were after, while the others just happened to match
    the pattern. The general form of the grep command is this:


    ```

    grep <flags> <pattern> <files>

    ```


    The most useful grep flags are shown here:


    +   - **-i** Ignore uppercase and lowercase when comparing.

    +   - **-v** Print only lines that do not match the pattern.

    +   - **-c** Print only a count of the matching lines.

    +   - **-n** Display the line number before each matching line.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'When grep performs its pattern matching, it expects you to provide a regular
    expression for the pattern. Regular expressions can be very simple or quite complex,
    so we won’t get into a lot of details here. Here are the most common types of
    regular expressions:


    +   - **abc** Match lines containing the string “abc” anywhere.

    +   - **^abc** Match lines starting with “abc.”

    +   - **abc$** Match lines ending with “abc.”

    +   - **a..c** Match lines containing “a” and “c” separated by any two characters
    (the dot matches any single character).

    +   - **a.*c** Match lines containing “a” and “c” separated by any number of characters
    (the dot-asterisk means match zero or more characters).


    Regular expressions also come into play when using vi, sed, awk, and other Unix
    commands. If you want to master Unix, take the time to understand regular expressions.

    Here is a sample poem.txt file and some grep commands to demonstrate regular-expression
    pattern matching:


    ```

    Mary had a little lamb

    Mary fried a lot of spam

    Jack ate a Spam sandwich

    Jill had a lamb spamwich

    ```


    To print all lines containing spam (respecting uppercase and lowercase), enter


    ```

    grep ''spam'' poem.txt

    Mary fried a lot of spam

    Jill had a lamb spamwich

    ```


    To print all lines containing spam (ignoring uppercase and lowercase), enter


    ```

    grep -i ''spam'' poem.txt

    Mary fried a lot of spam

    Jack ate a Spam sandwich

    Jill had a lamb spamwich

    ```


    To print just the number of lines containing the word spam (ignoring uppercase
    and lowercase), enter'
  merge: -1
  img_proc: true
- pgno: 225
  md: '```

    grep -i ''spam'' poem.txt

    3

    ```


    To print all lines not containing spam (ignoring uppercase and lowercase), enter


    ```

    grep -i -v ''spam'' poem.tx

    Mary had a little lamb

    ```


    To print all lines starting with Mary, enter


    ```

    grep ''^Mary'' poem.txt

    Mary had a little lamb

    Mary fried a lot of spam

    ```


    To print all lines ending with ich, enter


    ```

    grep ''ich$'' poem.txt

    Jack ate a spam sandwich

    Jill had a lamb spamwich

    ```


    To print all lines containing had followed by lamb, enter


    ```

    grep ''had.*lamb'' poem.txt

    Mary had a little lamb

    Jill had a lamb spamwich

    ```


    If you want to learn more about regular expressions, start with the man regexp
    command. There''s also a good book called Mastering Regular Expressions, by Jeffrey
    Friedl, published by O''Reilly & Associates.


    # THE SED COMMAND


    You can use the sed command to change all occurrences of one string to another
    within a file, just like the search-and-replace feature of your word processor.
    The sed command can also delete a range of lines from a file. Since sed is a stream
    editor, it takes the file given as input and sends the output to the screen, unless
    you redirect output to a file. In other words, sed does not change the input file.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'The general forms of the sed command are as follows:


    **Substitution**   sed ''s/<oldstring>/<newstring>/g'' <file>

    **Deletion**       sed ''<start>,<end>d'' <file>


    Let’s start with a substitution example. If you want to change all occurrences
    of lamb to ham in the poem.txt file in the grep example, enter this:


    ```

    sed ''s/lamb/ham/g'' poem.txt

    Mary had a little ham

    Mary fried a lot of spam

    Jack ate a Spam sandwich

    Jill had a ham spamwich

    ```


    In the quoted string, the “s” means substitute, and the “g” means make a global
    change. You can also leave off the “g” (to change only the first occurrence on
    each line) or specify a number instead (to change the first n occurrences on each
    line).


    Now let’s try an example involving deletion of lines. The values for start and
    end can be either a line number or a pattern to match. All lines from the start
    line to the end line are removed from the output. This example will delete starting
    at line 2, up to and including line 3:


    ```

    sed ''2,3d'' poem.txt

    Mary had a little lamb

    Jill had a lamb spamwich

    ```


    This example will delete starting at line 1, up to and including the next line
    containing Jack:


    ```

    sed ''1,/Jack/d'' poem.txt

    Jill had a lamb spamwich

    ```


    The most common use of sed is to change one string of text to another string of
    text. But I should mention that the strings that sed uses for search and delete
    are actually regular expressions. This means you can use pattern matching, just
    as with grep. Although you’ll probably never need to do anything like this, here’s
    an example anyway. To change any occurrences of lamb at the end of a line to ham,
    and save the results in a new file, enter this:'
  merge: -1
  img_proc: true
- pgno: 227
