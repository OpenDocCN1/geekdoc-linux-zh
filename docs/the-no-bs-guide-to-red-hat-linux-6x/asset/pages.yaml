- pgno: 47
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_47_0.png)


    Figure 1-5: Configuring the mouse


    ![](img/3137cdda7122042e86dbeafe9840d4ed_47_1.png)


    Figure 1-6: Selecting a mouse port


    or Windows uses for the mouse. If the mouse doesn''t work after installation,
