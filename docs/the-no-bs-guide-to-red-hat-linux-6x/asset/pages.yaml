    \ of Life** — Simulates the *Life* game in a tiny window.\n+   - **SlashApp**\
    \ — Displays a ticker with Linux news from SlashDot.Org.\n\n+   **MONITORING APPLETS**\n\
    +   \n+   - **Battery Monitor** — Shows how much time you have left on your laptop\
    \ battery.\n+   - **Battery Charge Monitor** — Shows how much your battery has\
    \ been charged and how much time is needed to complete the task.\n+   - **CPU/MEM\
    \ Usage Monitor** — Shows current use of the CPU, memory, and swap space.\n+ \
    \  - **CPULoad** — Displays a graph that shows your current CPU use.\n+   - **MEMLoad**\
    \ — Displays a graph that shows your current memory use.\n+   - **SWAPLoad** —\
