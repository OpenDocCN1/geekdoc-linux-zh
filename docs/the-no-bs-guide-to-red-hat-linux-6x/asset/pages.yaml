- pgno: 118
  md: '# OPERATING AN INTERNET SITE


    If you plan to run a public Web site from a Linux system, you will have to register
    a domain name and make arrangements to connect your computer permanently (24 hours
    a day) to the Internet.


    # REGISTERING YOUR DOMAIN NAME


    To register a domain name, contact InterNIC (keepers of the central name registry
    for the Internet) at http://rs.internic.net. Complete details and online registration
    forms are available at this site. After you register your domain name, you will
    have to update the /etc/hosts and /etc/HOSTNAME files to reflect the new domain
    name. You''ll have to work with your ISP to get the domain registered and operational.
    The InterNIC fee for domain-name registration is currently $70 for the first two
    years, and $35 per year thereafter. Your ISP will probably charge an additional
    $50 to $100 to set things up locally.


    NOTE: As an alternative to registering your own domain name with InterNIC, there
    are some programs for people with dynamic IP addresses (as with a typical dial-up
    connection) to have static domain names. Ask your ISP if they provide this service,
    or visit Domain Host Services at http://www.dhs.org for more information on their
    free services.


    # GETTING YOURSELF CONNECTED


    You have a number of options for full-time connectivity, depending on the expected
    traffic at your site and the amount of money in your budget. You''ll have to pay
    the telephone company for installation and monthly use, and your ISP will charge
    a monthly connection fee, too.


    Depending on the type of connection you choose and the local telephone company
    rates, your monthly connectivity bill could range from several hundred to several
    thousand dollars. The following sections summarize the types of connections possible.
    In addition, the book How to Build an Internet Service Company by Charles Burke
    (see http://www.index.mis.net/kanti) offers a wealth of information on this subject.
    You should also get a copy of Boardwatch magazine''s Directory of Internet Service
    Providers (see http://www.boardwatch.com) to'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'help you find a quality Internet service provider in your area. The Unix BBS
    FAQ at http://www.dsnet.com/unixbbsfaq may also provide some helpful information.


    # DIAL-UP MODEM LINE


    A dial-up modem line is the least expensive option because it uses a regular phone
    line and a standard modem. But your visitors are limited to a maximum connection
    speed of 33.6 Kbps (even if you have a 56K modem), which would service only three
    or four visitors at once. This approach is recommended for hobby use only.


    # 56K LEASED LINE


    As the name implies, a 56K leased line is a line you lease from the phone company
    with a maximum speed of 56 Kbps. It will handle seven or eight concurrent users.
    It requires the installation of a router (about $1000), and it''s upgradable to
    T1 speeds.


    # ISDN


    A digital phone service available in many areas, with a top speed of 128 Kbps,
    ISDN will handle about 15 concurrent users. It requires an ISDN adapter, which
    costs about $500. ISDN is a good choice for many startups but it cannot be upgraded
    to higher speeds.


    # ADSL AND CABLE


    In some areas, high-speed ADSL or cable modem connections are available and rates
    tend to be less than ISDN services. An ADSL connection allows you to serve data
    at about 1000Kbps, and cable modem throughput can be even higher. Check with your
    phone company or cable provider to see if they offer these services.


    # T1 CONNECTION


    A T1 connection is a high-speed (1544 Kbps) and expensive digital connection that
    can handle 300 or more concurrent users—sufficient for all but the busiest sites.
    You can also get fractional T1 service, which provides either 256 or 512 Kbps
    for less than the cost of a full T1 connection. T1 connections typically require
    the installation of a router (a piece of hardware that the T1 line plugs into).


    One alternative to a router is the RISCom/N2 adapter card from SDL Communications
    (http://www.sdlcomm.com), which allows you to plug a full or fractional T1 line
    directly into a Linux box. This card is much cheaper than other alternatives and
    has great performance.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# ONSITE ISP CONNECTION


    An onsite ISP connection requires no phone line, because your computer resides
    at your ISP''s place of business. In this case, your Linux system is cabled directly
    into the ISP''s ethernet network, and you have T1 access. The downside is that
    you don''t have physical access to your computer, so you have to log in via Telnet.


    # SETTING UP YOUR WEB SITE


    Red Hat Linux comes with the very popular Apache Web (httpd) server. Prior to
    the Red Hat 6.1 release, Apache was included in the default set of packages selected
    by the install program. But in the current version you have to explicitly install
    it from the CD. Refer to Chapter 14, "Updating Your Linux System," for help on
    using GNOPRM to install Apache. After installing, you must logout and login again
    to get the Apache server running. To test Apache, start the Lynx browser and display
    the default Web page, which is stored as index.html in the /home/httpd/html directory.
    Of course, you''ll want to create your own home page, so edit the index.html file
    to suit your needs, and you''re in business.


    If you want other Internet users to connect to your Web server, you''ll have to
    provide them with your IP address and tell them to connect with a URL like this:


    http://205.161.119.112


    The IP address comes from the ifconfig command, but remember that it changes each
    time you connect to your ISP, unless you''ve arranged for a static IP address
    or obtained your own domain name, as discussed earlier.


    The default Apache configuration files in the /etc/httpd/conf directory will work
    fine for most people, but if you''re curious about ways to change the behavior
    of the server, have a look at the other files in this directory. Refer to the
    Apache home page at http://www.apache.org for help.


    # HELP WITH LINUX NETWORKING


    If you run into trouble establishing your dial-up connection, or if you have questions
    about Linux networking, visit the Linux Documentation Project home page on the
    Web at http://sunsite.unc.edu/mdw/linux.html to find the Net-2-HOWTO, PPP-HOWTO,
    and Serial-HOWTO files.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'This site is also home to a very comprehensive document called the Linux Network
    Administrator''s Guide, which goes into great detail on SLIP and PPP connections,
    setting up your system to allow others to dial in, and security-related procedures
    you should follow.

    You may also find some helpful tips in the "PPP Setup Tips" document from Red
    Hat, at http://support.redhat.com/docs/PPP-Client-Tips/PPP-Client-Tips.html.

    These documents will be useful in answering any questions you may have about Linux
    networking, and I highly recommend them if you have trouble making a PPP connection,
    or if you plan to allow others to make PPP connections to your Linux machine.'
  merge: -1
