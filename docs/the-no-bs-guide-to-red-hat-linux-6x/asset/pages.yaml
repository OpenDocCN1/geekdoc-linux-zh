    \ the “Main Menu” button and then select Panel ▸ Add New Panel. You can add either\
    \ an Edge panel or a Corner panel. Edge panels stretch the full length of the\
    \ screen edge where they are placed, and Corner panels stretch only far enough\
    \ to hold the applets they contain. Having a second panel can be useful if you\
    \ want to try out some panel applets, but you have limited space on the main panel.\n\
    \n# PANEL APPLETS\n\nApplets are tiny programs that run inside the panel. The\
    \ clock on the right side of the panel is one example, but there are lots of optional\
    \ applets you can add to your panel. To access these applets, right-click on the\
    \ panel and select “Add new applet” from the pop-up menu. Here are some of the\
    \ applets you can run:\n\n+   **AMUSEMENT APPLETS**\n+   \n+   - **Fifteen** —\
