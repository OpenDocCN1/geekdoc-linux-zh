- pgno: 35
  md: 'Now that you’ve had a bit of history, it’s time for the real fun—installing
    the Linux operating system on your own personal computer. This chapter assumes
    that you have a PC currently running some version of DOS, but installing Linux
    is going to be very different from installing a new DOS or Windows software package.
    And most important, when you’re done, you’ll be booting up something entirely
    different from the DOS-based system you’ve grown to know and, uh, tolerate.


    # ABOUT THE CD-ROM


    The version of Linux provided on the CD accompanying this book is Red Hat Linux
    version 6.2. There are many distributions of Linux available, but I chose Red
    Hat because it’s very stable and extremely popular with Linux aficionados. Red
    Hat is also known for its add-ons that make installing, configuring, and running
    Linux much easier. The new graphical installation program in version 6.2 makes
    setting up Linux easier than ever, and does a much better job of autodetecting
    your hardware. If your DOS system is properly configured, Red Hat Linux installs
    directly from the CD-ROM with one simple command—and when you’re done, you have
    a fully functioning Internet-ready Linux system with a graphical user interface.
    All the arcane file system and graphical user interface (GUI) setup and network
    configuration is done automatically—not the case with other Linux versions.


    # SAYONARA, DOS?


    You’ll be running Linux (Unix for your PC), but you can take comfort in the knowledge
    that your DOS system is still available in case you ever want to return from the
    Land of Grep and Awk. (These are two Linux commands that sound weird, but are
    quite useful. You’ll learn about them in Chapter 5, “Important Linux Commands”.)


    In fact, you can even access your DOS files directly from Linux, and in some cases
    you can run DOS or Windows programs under Linux. In Chapter 12, “Linux Does DOS
    and Windows,” I’ll show you how to keep in touch with DOS and even boot up Windows
    95/98 while running Linux.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# What Hardware Will I Need?


    You don’t need an expensive state-of-the-art monster machine to run Linux. Almost
    any PC with a 386, 486, or Pentium processor will do nicely. That’s because Linux,
    unlike Microsoft Windows and other Unix flavors, is not a disk-chomping, memory-swilling
    CPU hog. A bare-bones Linux installation will run quite happily on a 386SX with
    16MB of memory and a 150MB hard drive. Of course, it will run faster on an 800-MHz
    Pentium III with 128MB of RAM and a 10GB hard drive, but that’s your choice—you
    can get to work in a Yugo or a Cadillac.


    It’s a pretty safe bet that your PC will run Linux if you already have Windows
    95 installed and working, but not every piece of hardware is supported by Linux.
    Here are the major system components, in terms of compatibility and requirements:


    +   - **CPU:** Intel 80386, 80486, Pentium, or the AMD/Cyrix variants (that is,
    almost any 386 or better); Linux will emulate a math coprocessor if one is not
    present.

    +   - **Video:** Almost any VGA/SVGA card that works with DOS is acceptable.

    +   - **Floppy drive:** A 3.5-inch floppy drive is required.

    +   - **Hard disk:** Most MFM, RLL, IDE and SCSI drives/controllers are supported;
    a minimum of 800MB of free space is required for the installation detailed here,
    but 1,600MB is more reasonable for serious use.

    +   - **Memory:** Minimum 16MB of RAM is recommended, but more memory dramatically
    improves performance; 48MB or more is recommended if the user wishes to use the
    GNOME GUI; mixing RAM of various speeds (that is, 60 ns, 70 ns) can cause problems.

    +   - **CD-ROM:** Almost any IDE- or SCSI-based CD-ROM drive will work.

    +   - **Modem:** Required if you want to connect to or host Internet services;
    the faster the better, but 33.6 Kbps or better is recommended.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '> NOTE: The most recent list of hardware supported by Red Hat Linux can be
    found at Red Hat''s Web site at http://support.redhat.com/hardware. It''s a good
    idea to check your hardware against this list before proceeding.


    # TAKING INVENTORY


    Not sure what hardware lurks in the heart of your computer? If you are running
    Windows 95/98, hold down the ALT key and click on the My Computer icon. A pop-up
    menu (Figure 1-1) should appear, showing the type of processor and the amount
    of installed RAM.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_37_0.png)


    Figure 1-1: Windows 95 System Properties


    Next, click on the Device Manager tab (Figure 1-2). The System Properties window
    will show a list of your computer''s hardware components. (Make sure the View
    devices by type button is selected.)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_38_0.png)


    # Figure 1-2: Windows 95 Device Manager


    At this point, you can double-click on any of the icons to learn more about the
    component and how it''s configured. You can also print a summary by clicking on
    the Print button. When prompted, choose the All Devices and System Summary report.


    You should also check your computer''s BIOS (use the SETUP feature at boot time)
    to determine if your hard drive uses LBA (large block access). You''ll need to
    know this to answer one of the questions during the installation process.


    Don''t forget you can also learn a lot about your hardware components by reading
    the documentation that came with them! If you don''t have a spare PC lying dormant
    in the closet that fits the bill for your Linux machine, the type of machine you
    should get depends on whether you want to run Linux for business or pleasure.
    If you''re just experimenting with Linux for fun, you can probably find an old
    486 system in the classifieds for a few hundred dollars. If you''re planning on
    running a busy Web site, a high-end Pentium will set you back about $2000.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'The important thing to remember when choosing your Unix machine is that the
    more RAM you have, the better your system''s performance will be. And since memory
    and hard disk prices have fallen so much recently, don''t skimp. My personal Linux
    machine has an Intel Celeron 300A processor, 64MB of RAM, 2.5GB hard disk, S3/Virge
    video card, no-name 24X CD-ROM, and US Robotics 56K modem. That''s by no means
    a hotrod, but it runs Linux very nicely.


    # THE INSTALLATION AT A GLANCE


    That''s it for the preliminaries. Here''s an overview of the installation process
    you will follow to get up and running with Linux on your PC. It''s a good idea
    to understand what''s coming and to know about the possible gotchas before you
    start anything so drastic as installing a new operating system, so please read
    through to the end of this chapter before you begin the process. Trust me—you''ll
    be glad you did!


    Here are the steps in brief:


    +   Step 1: Repartition your hard disk with FDISK or FIPS.

    +   Step 2: Create a Linux boot floppy (optional).

    +   Step 3: Start the installation program.

    +   Step 4: Answer a few simple questions about your hardware.

    +   Step 5: Create Linux disk partitions (optional).

    +   Step 6: Configure the system clock.

    +   Step 7: Choose a root password.

    +   Step 8: Configure your video hardware for Linux.

    +   Step 9: Copy the Linux files from the CD-ROM to the hard drive.

    +   Step 10: Shut down and reboot.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '> NOTE: You may run into a number of pitfalls during your installation due
    to quirky hardware, careless keystrokes, or failure to follow these instructions
    closely. But you can’t really hurt anything if the installation isn’t successful.
    If you have trouble with your installation, you can always start over and try
    it again. If you get really stuck, see Appendix B, “Troubleshooting Installation
    Problems,” or Chapter 15, “Learning More about Linux,” which lists people and
    places on the Internet that you can turn to for help.


    # REPARTITION YOUR HARD DISK?


    Since you’re running DOS, it’s a given that your hard disk has at least one partition.
    (A partition is simply a division of your hard disk.) And unless you’re very adventurous,
    it’s almost a sure bet that your hard disk has a single DOS partition that occupies
    the entire disk.


    Normally you need a separate partition for each operating system installed on
    a hard disk, but the latest version of Red Hat Linux offers you the option of
    installing Linux into your existing DOS partition. This partitionless installation
    method lets you avoid the hassle of creating disk partitions, but it brings a
    performance penalty. Linux will run a bit slower on a DOS partition than on a
    native Linux partition, and you’ll have to boot up Linux from a floppy disk.


    If getting Linux up and running with a minimum of fuss is more important than
    optimal system performance, you should consider using the partitionless installation
    method. If speed is everything and disk partitioning doesn’t sound like a big
    deal, then you’ll probably want to do a traditional installation. I recommend
    that you read the next section and then decide which path to follow.


    # DISK REPARTITIONING


    If you want a traditional Linux installation, you’ll have to change the current
    partitioning of your disk so that there is room for a new partition (or two) for
    Linux. Note that in this step you will not be creating any Linux partitions, though
    you will use a DOS utility to reduce the size of an existing partition. (You’ll
    use a Linux utility later to create the Linux partitions.)'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'You have a choice of several tools to reduce the size of your DOS partition.
    Which one you choose depends on how much you value the existing data on your DOS
    disk, and whether or not you''re a gambler at heart.


    The FDISK command, which comes with DOS, is the official disk partitioning tool.
    But since it can''t change the size of a partition, it makes you delete your existing
    partition before it will re-create it as a smaller one. Unfortunately, this means
    you lose all the data on the disk, so you''ll need to perform a full backup and
    restore operation (along with reinstalling DOS) if you use FDISK. FDISK is a nuisance,
    but it works.


    If you''re willing to spend a bit of money, you can purchase the Partition Magic
    software from Power Quest (www.powerquest.com). Partition Magic can safely resize
    an existing DOS partition without data loss, and is very easy to use.


    Another option, FIPS (a freeware utility program you''ll find in the DOSUTILS
    directory on the CD), can resize an existing partition without deleting it, but
    it''s a "use at your own risk" program. Have a look at the FIPS documentation
    and give it a try if you feel comfortable with it. Hundreds of thousands of people
    have used FIPS, which has been around for several years, and it''s said to be
    very reliable, but don''t call me if you choose to use FIPS and something screws
    up.


    Regardless of the utility you choose, the amount of space you leave for your Linux
    partitions will depend on the size of your hard disk, how much space is currently
    occupied, and how you intend to use Linux. I recommend that you devote 600MB or
    more to Linux.


    NOTE: The installation outlined in this chapter requires about 800MB of hard disk
    space and is the basis of future chapters, so I recommend you follow it pretty
    closely. If you don''t have that much space available, you can omit certain components
    with a Custom Install, but that''s recommended only for users already familiar
    with Linux.


    In the example that follows, we''ll start with a 3.2GB (3,200MB) hard disk, reduce
    the DOS partition to 1,600MB, and use the remaining 1,600MB for Linux.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'If you choose to use FDISK, do this:


    **NOTE:** This process assumes that you are starting with only one partition.
    If you have multiple partitions, keep in mind that you don’t necessarily have
    to delete and re-create all of them. If you have two partitions, you can probably
    whack a piece off the second one and leave the primary partition untouched. You
    should leave the unallocated space at the end of your disk for use by Linux.


    +   1. Back up your hard drive. (A tape drive is preferable to dozens of floppies.)

    +   2. Create a bootable DOS floppy with the **FORMAT A: /S** command and copy
    **FDISK.EXE** and **FORMAT.COM** to it. Follow the instructions for your backup
    program to ensure that you have the restore software available on floppy disk,
    too.

    +   3. Insert the floppy disk and restart your system. The computer should boot
    from the floppy instead of the hard disk. If it doesn’t, you may have to fiddle
    with your machine’s CMOS parameters so that it will boot from the floppy first.
    Typically, you can change these settings by pressing the **DEL** key just after
    turning on your machine. (See your system manual for help.)

    +   4. Use the **FDISK** utility to delete the existing partition and create a
    smaller one. (FDISK is pretty straightforward, but you should refer to your DOS
    manual if you’ve never used it before.)

    +   5. Use the **FORMAT C: /S** command to format the new partition.

    +   6. Finally, restore your hard drive using the backup from step 1. (You did
    make a backup, right?)


    # THE LINUX INSTALLATION PROCESS


    If you’ve decided what to do about hard disk partitioning, then you’re ready to
    begin the Red Hat Linux installation process. As I mentioned earlier in this chapter,
    it’s possible to run the install program directly'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'from the CD—but only if your system supports it. If not, don’t worry—just follow
    the simple instructions provided later to create a Linux boot floppy.


    If you have a newer system that supports bootable CDs, you can pop in the Red
    Hat Linux CD and reboot your computer, and the installation program will start
    automatically. Give it a try! (You may need to change an option in your computer’s
    BIOS settings so it will recognize the CD as a boot device.) If your computer
    ignores the CD and boots DOS or Windows as usual, you still might be able to avoid
    creating the boot floppy.


    To try this alternative method, get yourself to a “real” DOS prompt. (An MS-DOS
    prompt running under Windows is not going to work!) If your CD-ROM drive is accessible
    from outside the Windows environment, you can use the AUTOBOOT program to start
    the Linux install process from the CD-ROM. You’ll need to do one of these things
    to get to a real DOS prompt:


    +   - Shut down Windows 95/98 and choose the Restart in MS-DOS Mode option.

    +   - Exit from Windows 3.1 to the DOS command prompt.

    +   - Reboot your computer with a DOS boot floppy.


    At the DOS prompt, enter the following command (assuming your CD-ROM drive is
    drive D):


    ```

    D:

    ```


    If you don’t get an error such as “Invalid drive specification,” continue with
    the following commands to start the installation program:


    ```

    cd \dosutils

    autoboot.bat

    ```


    If your CD-ROM drive is available, the installation program will start, and you
    can skip the next section dealing with the boot floppy.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# CREATE A LINUX BOOT FLOPPY


    If it turns out you can''t boot directly from the CD or access the CD-ROM drive
    from the DOS prompt, you must create a Linux boot floppy. To do so, return to
    Windows and start a DOS prompt. Insert a formatted diskette into drive A and enter
    these commands:


    ```

    D:

    cd \dosutils

    rawrite -f \images\boot.img -d A:

    ```


    When the rawrite program finishes, leave the floppy in the A drive and reboot
    your computer. The installation program will start, and the CD-ROM whirs into
    action. When you see the boot: prompt, just press ENTER to continue.


    # WHAT IF MY CD-ROM DOESN’T WHIR?


    The Linux installation program may not detect some older or nonstandard CD-ROM
    drives automatically. If your CD-ROM drive plugs into a sound card or a special
    interface card that came with the drive, you may run into this trouble. If you
    get a message indicating that Linux could not detect your CD-ROM, start over and
    enter a parameter from the table below at the boot: prompt. (If your model doesn’t
    appear in the table, try searching for information at the Red Hat Web site, http://support.redhat.com/hardware/.)


    | CD-ROM TYPE | PARAMETER |

    |---|---|

    | Aztech CD268-0A, Orchid CD-3110 | aztcd=\<io_port\> |

    | Goldstar R420 CD-ROM | gscd=\<io_port\> |

    | Mitsumi CD-ROM | mcd=\<io_port\>,\<IRQ\> |

    | Philips/LMS CDROM drive 206 | cm206=\<io_port\>,\<IRQ\> |

    | Sony CDU 31A or 33A CD-ROM | cdu31a=\<io_port\>,\<IRQ\> |

    | Sony CDU-535 and 531 | sonycd535=\<io_port\> |

    | SoundBlaster Compatible | sbpcd=\<io_port\>, SoundBlaster |'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Replace <io_port> and <IRQ> with the correct values for your hardware, as shown
    in the examples that follow:


    Sony CDU 31A/33A          cdu31a=0x220,5

    SoundBlaster Compatible   sbpcd=0x320,SoundBlaster


    # START THE LINUX INSTALL PROGRAM


    When Linux starts, a whole bunch of stuff will flash across the screen. Unless
    you did really well in that Evelyn Wood speed reading program, you won''t be able
    to read much of it, but that''s okay. Don''t be alarmed if your screen goes blank
    for a little while. After a few moments, you''ll be greeted by a series of screens
    that will guide you through the installation process. On each screen, you''ll
    make a choice and then select Next to continue. You can use your mouse or the
    TAB and arrow keys to navigate and make selections. The install program will ask
    you some questions about your hardware in this start-up phase—here''s how to respond.


    # SELECTING A LANGUAGE


    If you are asked to choose a language (Figure 1-3), English is probably your best
    bet, unless you happen to be more comfortable with German or Turkish. Select the
    appropriate language, then press Next, tab to the OK button, and press ENTER or
    F12 to continue.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_45_0.png)


    Figure 1-3: Choosing a language'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# SELECTING A KEYBOARD TYPE


    Next, you’ll need to tell Linux about your keyboard (Figure 1-4). In most cases,
    the install program will autodetect your hardware, so selecting the default is
