- pgno: 95
  md: 'Linux is an excellent platform for exploring the online world and for providing
    Internet services of your own. As a personal “surfboard,” Red Hat Linux comes
    with everything you need to connect to an Internet service provider (ISP), including
    TCP/IP software; client programs such as FTP, Telnet, Finger, Mail, Ping, Lynx,
    and Netscape.


    Linux also makes it easy to set up your own servers so you can operate FTP or
    Web sites and even provide Telnet or dial-up access to your system. If you have
    dreams of becoming an ISP, the Red Hat Linux product is an excellent platform
    to build on. The really nice thing is that TCP/IP and all the popular network
    services are installed automatically and preconfigured for you. If you’ve ever
    tried to configure a Unix network, set up email delivery, or get a Web server
    running, you will really appreciate this feature. (In technical terms, it means
    that local loopback, sendmail, inetd, httpd, and several other network daemons
    are configured and running when you boot up Red Hat Linux.)

    In this chapter, you’ll learn the following:


    +   - How to connect your Linux system to the Internet with a dial-up PPP connection

    +   - What tools are available for Internet access (text and graphical)

    +   - How to operate your own Internet site

    +   - Where to get more information on Linux networking


    # SETTING UP YOUR SERIAL PORT TO WORK WITH YOUR MODEM


    By default, Red Hat Linux is configured to run your serial (modem) port at a speed
    of 9600 bps. But faster modems, with speeds of 33.6 and 56 Kbps, for instance,
    are quite common now. It would be a shame to spend money on a fast modem and not
    use it to the fullest, so to get the best performance, you’ll have to tweak your
    serial port settings.


    Unless you have a very slow modem (9600 bps or less), you should use the setserial
    command to enable Linux to make a high-speed connection. Depending on your modem
    speed, at the command prompt'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'enter one of the commands shown here. It would also be a good idea to log in
    as root and put the same command in your /etc/bashrc file so you don''t have to
    enter it each time you boot up Linux.


    ```

    setserial /dev/modem spd_hi    For a 14.4 Kbps modem

    setserial /dev/modem spd_vhi    For a 28.8 Kbps or faster modem

    ```


    Since modems have built-in compression capabilities, you can transfer data at
    speeds up to 57.6 Kbps with a 14.4 Kbps modem, or 115.2 Kbps with a 28.8 Kbps
    modem. (Compression enables a theoretical data rate of four times the speed of
    your modem). But if you don''t issue the setserial command, your maximum data
    rate will be four times 9600 bps, or 38.4 Kbps.


    # MODEM SETUP UNDER LINUX


    In a DOS environment, a modem is assigned to a COM (communications) port, an IRQ
    (interrupt request) number, and an I/O (input/output) address. Here are the most
    common configurations:


    | PORT | IRQ | ADDRESS | LINUX DEVICE NAME |

    |------|-----|---------|-------------------|

    | COM1 | 4 | 3F8 | /dev/ttyS0 |

    | COM2 | 3 | 2F8 | /dev/ttyS1 |

    | COM3 | 4 | 3E8 | /dev/ttyS2 |

    | COM4 | 3 | 2E8 | /dev/ttyS3 |


    You can find out your settings under DOS by using the MSD command. Under Windows
    95/98, hold down the ALT key, double-click on the "My Computer" icon, and then
    click on the "Device Manager" tab to find the settings. If your modem is configured
    like one of the entries in the preceding table, Linux should automatically detect
    and configure your modem just fine.


    After booting up Linux, make sure that your modem was detected properly. Since
    Linux knows the modem by the generic name /dev/modem, you can use the ls command
    to verify that it exists and is assigned to the correct COM port. Try this command:


    ```

    ls -al /dev/modem

    ```'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'The response should look something like the output shown here.

    For now, ignore everything except the rightmost columns of output.


    ```

    lwxrwxrwx 1 root root 5 Feb 19 22:19 /dev/modem -> /dev/ttyS1

    ```


    In this case, the modem device /dev/modem is assigned to /dev/ttyS1, which corresponds
    to COM2. If the assignment is wrong, or if you get a “No such file” error message,
    you can fix it with one of these commands:


    +   ln -s /dev/ttyS0 /dev/modem    For a modem on COM1


    +   ln -s /dev/ttyS1 /dev/modem    For a modem on COM2


    +   ln -s /dev/ttyS2 /dev/modem    For a modem on COM3


    +   ln -s /dev/ttyS3 /dev/modem    For a modem on COM4


    # VERIFYING THE MODEM SETUP


    Okay—you think your modem is ready to roll? Let’s test it using Minicom, the basic
    communications software that comes with Linux. Enter the command


    ```

    minicom

    ```


    to start the program and wait for the OK response to appear on the screen. Then
    enter the command ATDT NNN-NNNN (where NNN-NNNN is your Internet service provider’s
    dial-up number, the access number of a BBS, or some other local number). If you
    get a dial tone and the modem begins to make dialing noises, you’re in business
    (see Figure 3-1).


    We really don’t need to do anything online just yet, so press CTRL-A, then Z,
    and then X to hang up the modem and exit Minicom. If you didn’t get an OK response,
    or if the modem wouldn’t dial out, read the next section. Otherwise, skip to “Making
    a Dial-Up Connection to the Internet.”


    # IF YOU HAVE TROUBLE CONNECTING


    Under certain uncommon circumstances (for instance, if you have nonstandard IRQs
    or multiple I/O cards in your computer), you may'
  merge: -1
  img_proc: true
- pgno: 98
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_98_0.png)


    *Figure 3-1: The minicom opening screen*


    need to set some special options of the setserial command to use your modem with
    Linux. Something else that might cause trouble is a plug-and-play modem. Linux
    has very limited support for plug-and-play devices, so if you have one, it probably
    won’t work without some fiddling.


    If you have trouble dialing out with your modem, there are two things you can
    try to solve the problem. The first is to issue the **man setserial** command
    for information on how to set your serial port for nonstandard IRQ or COM port
    configurations. The second option is to rearrange your computer’s hardware settings
    so that the modem can operate on one of the standard configurations.


    In my case, I had a US Robotics plug-and-play modem on COM3 and IRQ5 that Linux
    could not detect. Using the manufacturer’s instructions, I disabled the plug-and-play
    feature on the modem, changed the computer’s BIOS settings to disable the built-in
    COM2 port, and then set the modem to operate on COM2 and IRQ3. After rebooting
    and verifying that Windows was able to successfully run the modem with these settings,
    I had no trouble getting it to work under Linux.'
  merge: -1
