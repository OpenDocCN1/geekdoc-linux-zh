- pgno: 307
  md: 'Installing a new operating system on your computer sets you apart from the
    great unwashed masses. Getting it to do what you want elevates you to near-guru
    status. This chapter will show you how to tweak the Red Hat startup process and
    configure all your Linux hardware and software settings to your liking. If you’re
    the type of person who can’t keep your hands off the autoexec.bat and config.sys
    files under DOS, or if you derive hours of pleasure fooling with the Windows Device
    Manager, you’ll appreciate what follows.

    We’ll start by exploring the Setup utility, Linuxconf, the GNOME Control Center,
    and a few other customization tricks to help you gain the upper hand in controlling
    the way your Linux system operates.


    # USING THE SETUP UTILITY


    The Setup utility is a simple menu that makes it easy to launch six different
    system configuration tools. You can use it to configure your keyboard, mouse,
    system services, sound card, time zone, and X Windows. You could try to remember
    the commands kbdconfig, mouseconfig, ntsysv, sndconfig, timeconfig, and Xconfigurator
    to perform these tasks, but it’s easier to type setup at the command prompt and
    then use the arrow keys to select the tool you want to use (see Figure 13-1).
    Each of these tools should look familiar, because the


    ![](img/3137cdda7122042e86dbeafe9840d4ed_307_0.png)'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'installation program used them, too. If you made a mistake during installation,
    or if you want to change the way any of these components is set up, Setup provides
    the solution. Or maybe you''ve put in a new mouse, sound card, or video adapter.
    If so, you will need to run the appropriate configuration utility so Linux will
    properly detect and interface with the device.


    # KEYBOARD CONFIGURATION


    The keyboard configurator (see Figure 13-2) isn''t very exciting. Just tell Linux
    what type of keyboard you have and select OK to exit. If you live in the U.S.A.
    and speak English, you probably have a U.S.-style keyboard.


    # MOUSE CONFIGURATION


    If your mouse isn''t working properly, use the Mouse configurator (see Figure
    13-3) to check things out. If you have a brand-name mouse that appears in the
    list, select it. Most PCs come with a cheap, no-name mouse, so it''s likely that
    one of the “Generic” options will work. If you have a trackball instead of a mouse,
    or a laptop with a built-in pointing device (like the “fuzzy red button” on the
    IBM laptops), try configuring the device as a PS/2 mouse.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_308_0.png)


    Figure 13-2: *Configuring the keyboard*'
  merge: -1
  img_proc: true
- pgno: 309
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_309_0.png)


    Figure 13-3: Configuring the mouse


    If you have a two-button mouse, check the “Emulate 3 Buttons?” box, and you’ll
    be able to simulate the middle button by pressing both buttons at once. Also check
    that your mouse is configured for the same serial port it used under DOS. If you
    think you did everything right and the mouse still doesn’t work, sometimes whacking
    it on a hard surface while shouting, “You stupid mouse,” works wonders.


    At startup, Red Hat Linux loads a program called gpm that enables cut-and-paste
    operations at a text-mode command prompt. Hold down the left button and drag to
    mark the text; then press the middle button to paste the text at any text-mode
    prompt. In some cases, the gpm program interferes with X Windows, so if you get
    a “device busy” error message when starting X Windows, disable gpm with this command:


    ```

    gpm -k

    ```


    # SYSTEM SERVICES CONFIGURATION


    Use the System Services configurator (shown in Figure 13-4) to specify which services
    should be automatically started at boot time. Unless you’re really sure you know
    what you’re doing, you shouldn’t mess with the defaults here. One possible exception
    is the gpm service, which provides support for the mouse and cut-and-paste operations
    in text-based applications.'
  merge: -1
  img_proc: true
