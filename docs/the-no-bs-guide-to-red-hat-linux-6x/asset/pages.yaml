- pgno: 341
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_341_0.png)


    Figure 14-1: Main window of the GnoRPM interface


    Let''s take a quick tour of the GnoRPM interface, starting with the main window
    as shown in Figure 14-1. The Package panel on the left side of the window shows
    the packages installed on your system. You can navigate the tree-like structure
    by clicking on the plus (+) and minus (-) signs. Clicking on a folder icon will
    display the packages from that category in the Display panel, to the right of
    the Package panel. The toolbar provides buttons for the most common RPM operations,
    such as "Install," "Uninstall," "Query," and "Verify." Generally, you select one
    or more icons in the Display panel and then press one of the buttons on the toolbar
    to act on them.


    # INSTALLING PACKAGES


    To install a new package, click the "Install" button on the toolbar, and an Install
    dialog box like the one shown in Figure 14-2 will appear.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_341_1.png)


    Figure 14-2: GnoRPM''s Install dialog box'
  merge: -1
  img_proc: true
- pgno: 342
  md: <!-- no content -->
