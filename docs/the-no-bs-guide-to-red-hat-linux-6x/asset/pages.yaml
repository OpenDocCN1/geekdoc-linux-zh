  md: "# Flow Control\n\nA Perl script that's just a sequence of commands executed\
    \ one after the other isn't very exciting. Let's look at how to use if/then/else\
    \ logic and looping constructs to control the flow of a Perl program.\n\n# CONDITIONAL\
    \ OPERATIONS\n\nThe general form of an if/then/else construct is shown here, with\
    \ the actual syntax shown in boldface and the parts you must supply in normal\
    \ type:\n\n```\nif ( condition is true ) {\n    execute these commands\n}\nelse\
    \ {\n    execute those commands\n}\n```\n\nThe else clause is optional, but you\
    \ can also have nested if clauses by using the elsif construct like this:\n\n\
    ```\nif ( condition is true ) { execute these commands }\nelsif { execute those\
    \ commands }\nelsif { execute those commands }\nelse { execute those commands\
    \ }\n```\n\nSo what kind of conditions can we test for? For number and string\
    \ comparisons, here are the conditional expressions you can use. In other words,\
    \ any of these expressions can go inside the parentheses of the if or elsif statement:\n\
    \n| NUMBERS | STRINGS | RESULT |\n|---|---|---|\n| $a == $b | $a eq $b | True\
    \ if $a is equal to $b. |\n| $a != $b | $a ne $b | True if $a is not equal to\
    \ $b. |\n| $a > $b | $a gt $b | True if $a is greater than $b. |\n| $a < $b |\
    \ $a lt $b | True if $a is less than $b. |\n| $a >= $b | $a ge $b | True if $a\
    \ is greater than or equal to $b. |\n| $a <= $b | $a le $b | True if $a is less\
    \ than or equal to $b. |\n\nUsing the wrong comparison operator is a common Perl\
    \ coding error, and is frustrating to debug. For example, if you use the == operator\
    \ to compare two strings, you will not get the expected result."
  merge: -1
  img_proc: true
- pgno: 251
  md: 'To test certain file conditions (whether or not files exist, the type of file,
    and so on), use these conditional expressions:


    | CONDITIONAL EXPRESSION | RESULT |

    |------------------------|--------|

    | -e $somefile | True if somefile exists. |

    | -f $somefile | True if somefile exists and is a plain file. |

    | -d $somefile | True if somefile exists and is a directory. |

    | -s $somefile | True if somefile contains data (the size is not zero). |

    | -r $somefile | True if somefile is readable. |

    | -w $somefile | True if somefile is writable. |

    | -x $somefile | True if somefile is executable. |


    And finally, here are the logical operators, for performing tests that involve
    and, or, and not conditions:


    | OPERATOR | RESULT |

    |----------|--------|

    | $a && $b | True if both $a and $b are true. |

    | $a and $b | Same as above. |

    | $a || $b | True if either $a or $b is true. |

    | $a or $b | Same as above. |

    | ! $a | True if $a is false. |

    | not $a | Same as above. |


    # SOME IF/THEN/ELSE EXAMPLES


    Here are some examples using the conditional expressions just listed. Note that
    the spaces on either side of the parentheses and braces are optional, and the
    placement of them is largely a matter of style.


    ```

    if ( $carprice > 20000 )

    { print ''Too rich for my blood.''; }

    else

    { print "Can you get that model in blue?"; }


    if ( $maker eq "Buick" )

    { print ''Have you driven a Ford lately?''; }


    if ( -r $myfile && -s $myfile )

    {

    print "The $myfile file is readable and contains data."

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 252
  md: "# The Case Statement\n\nMost languages provide a case or switch statement that\
    \ lets you compare a string with several possible values and execute a block of\
    \ code when a match is found. Perl does not, but it does provide a way to implement\
    \ this procedure. Here’s an example of the SWITCH construct, with the syntax shown\
    \ in boldface and the parts you would supply in normal type:\n\n```\nSWITCH: {\n\
    \  if ( $A eq \"ls\" )  { system(\"ls\"); last SWITCH; }\n  if ( $A eq \"pwd\"\
    \ ) { system(\"pwd\"); last SWITCH; }\n  if ( $A eq \"date\" ) { system(\"date\"\
    ); last SWITCH; }\n  print \"none of the args were very interesting. \\n\";\n\
    }\n```\n\nIn this example, if the value of $A was ls, the first block of commands\
    \ would execute. If the value of $A was pwd, the second block of commands would\
    \ execute. Otherwise, the rest of the commands in the SWITCH clause would execute.\
    \ The last SWITCH command tells Perl to short-circuit the rest of the stuff in\
    \ the SWITCH clause, so as soon as one of the conditions is satisfied, the others\
    \ are ignored.\n\n# LOOPING\n\nShell scripts written in Bash can implement looping,\
    \ or iteration, with the while, until, and for constructs. In each case, a block\
    \ of code is executed repeatedly until a loop exit condition is satisfied. The\
    \ script then continues on from that point.\n\n# The While Statement\n\nIn a while\
    \ loop, the block of code between the { and } braces is executed so long as the\
    \ conditional expression is true. Think of it as saying, “Execute while this condition\
    \ remains true.” Here’s an example:\n\n```\nwhile ($ARG) {\n  print \"ARG: $ARGV[0]\
    \ \\n\";\n  shift $ARGV;\n}\n```\n\nThis trivial example prints the value of each\
    \ argument passed to the shell script. Translated to English, the while condition\
    \ says to continue so long as the input argument string is not null. You might\
    \ think that this loop would continue to print the first argument $ARGV[0] forever\
    \ and ever, since you don’t expect the value of the @ARGV variable (the"
  merge: -1
  img_proc: true
- pgno: 253
  md: "list of arguments from the command line) to change during the course of running\
    \ the script. You'd be right, except that I slipped the shift command into the\
    \ body of the loop.\n\nWhat shift does is discard the first argument and reassign\
    \ all the $ARG variables—so the new $ARGV[0] gets the value that used to be in\
    \ $ARGV[1] and so on. Accordingly, the value in @ARGV gets shorter and shorter\
    \ each time through the loop, and when it finally becomes null, the loop is done.\n\
    \n# THE UNTIL STATEMENT\n\nThe until construct works almost exactly the same as\
    \ while. The only difference is that until executes the body of the loop so long\
    \ as the conditional expression is false, whereas while executes the body of the\
    \ loop so long as the conditional expression is true. Think of it as saying, “Execute\
    \ until this condition becomes true.”\n\nLet's code the previous example using\
    \ an until loop this time and make it a little fancier by adding a counter variable:\n\
    \n```\n$count=1;\nuntil ( ! @ARGV ) {\n    print \"Argument number $count : $ARGV[0]\
    \ \\n\";\n    shift;\n    $count++;\n}\n```\n\nThe only new concept here is the\
    \ strange-looking line that increments the counter. The $count++ syntax is equivalent\
    \ to $count=$count+1, but the former is more common in Perl and C language programming.\
    \ You can also decrement a value using the $count-- syntax.\n\n# THE FOREACH STATEMENT\n\
    \nThe foreach statement provides yet another way to implement a loop in a Perl\
    \ script. The general form of the for construct is shown here:\n\n```\nforeach\
    \ $item ( in-some-array )\n{\n    do something with $item\n}\n```"
  merge: -1
  img_proc: true
- pgno: 254
  md: 'Each time through the loop, the value of the $item variable is assigned to
    the next item in the array. When you''ve processed all the items in the array,
    the loop is done. Here''s an example similar to the until and while loops you
    saw earlier in this chapter:


    ```

    foreach $var (@ARGV)

    {

    print "NEXT ARG: $var \n";

    }

    ```


    # DEALING WITH FILES


    One common operation in Perl is to open a text file and process it line by line.
    You might be creating a report or just sifting through the file to find certain
    strings. This example opens a file whose name is stored the $file variable and
    then prints each line that starts with the pound sign:


    ```

    open MYFILE, $file or die "Can''t open $file: $! \n";

    while (<MYFILE>) {

    if (/^#/) { print "MATCH: $_;" }

    }

    ```


    A few things may need explaining here. The open command assigns a file handle
    (in this case, MYFILE) to the file named in the $file variable. You can use any
    file handle or variable names you like in the open command. If the file cannot
    be opened for some reason (it doesn''t exist, it isn''t readable, and so on),
    then the program will terminate (courtesy of the die command) with a message like
    this:


    ```

    Can''t open panda.txt: No such file or directory

    ```


    The special variable $! contains the reason for the failure and was substituted
    into the error message. If the file is opened successfully, the program continues,
    and the <MYFILE> construct will return the next line from the file in the $_ variable.
    (You''ll find that a lot of Perl functions use this special $_ variable.) When
    the end of the file is reached, <MYFILE> will return a null value, causing the
    loop to terminate.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# PATTERN MATCHING IN PERL


    One mystery remains: What’s this (/^#/) stuff all about? Remember the grep command,
    back in Chapter 8, “Slicing and Dicing,” and the discussion of regular expressions?
    If you think about it, the little Perl program in the previous example acts a
    lot like grep, since it sifts through each line and prints it if a pattern is
    matched.


    In Perl, the forward slashes indicate that a pattern match is to be performed.
    The regular expression inside the slashes defines the search pattern, and $_ is
    the variable that the search is performed on. In our case, the ^# inside the slashes
    means to match only lines that begin with the pound sign.


    So if we make the previous example a bit more generic, allowing it to get the
    search pattern and file name from the command line, it will behave almost exactly
    like the grep utility:


    ```

    open MYFILE, $ARGV[1] or die "Can''t open $ARGV[1]: $!\n";

    while (<MYFILE>) {

    if (/$ARGV[0]/) { print "MATCH: $_"; }

    }

    ```


    # LEARN MORE ABOUT PERL


    We’ve barely scratched the surface of what you can do with the Perl language.
    Try the man perl command to get more information on Perl, read Programming Perl
    by Larry Wall (O’Reilly & Associates), the inventor of the Perl language, or visit
    the Perl Institute Web site at http://www.perl.org.


    # OTHER LINUX PROGRAMMING LANGUAGES


    Shell scripts are fine for many tasks, but if you need to do lots of number crunching,
    string manipulation, or complicated logic flow, look into one of the other languages
    briefly mentioned in this section.


    # THE C LANGUAGE


    C is a general-purpose programming language originally written to help in the
    development of Unix. Most of the Linux operating system is written in C.'
  merge: -1
