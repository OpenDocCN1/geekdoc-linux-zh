- pgno: 320
  md: '# LEARNING MORE ABOUT LINUXCONF


    The best place to learn more Linuxconf is the Linuxconf Project home page at http://www.solucorp.qc.ca/linuxconf/.
    This site is maintained by the developer of Linuxconf and includes detailed usage
    instructions along with information on the most recent release.


    # THE GNOME CONTROL CENTER


    The GNOME Control Center is a graphical tool that helps you customize your GNOME
    desktop using a set of tools called capplets. Click on the taskbar button with
    the toolbox icon, and you’ll launch the GNOME Control Center. Select an item from
    the menu on the left and double-click on it to modify that part of the system.
    Desktop capplets enable you to modify the appearance and behavior of the desktop’s
    background, screensavers, themes, and Window Manager.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_320_0.png)


    # BACKGROUND SETTINGS


    Use this selection to modify the desktop’s background color or wallpaper (see
    Figure 13-20).


    Figure 13-20: Modifying background settings'
  merge: -1
  img_proc: true
- pgno: 321
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_321_0.png)


    # SCREENSAVER SETTINGS


    Use this selection to choose a screensaver that will run after a specified period
    of idle time (see Figure 13-21). I think you''ll find this set of screensavers
    much more interesting than the ones shipped with Microsoft Windows.


    # Figure 13-21: Adjusting screensaver settings


    ![](img/3137cdda7122042e86dbeafe9840d4ed_321_1.png)


    # THEME SELECTOR


    Use this selection to modify your GNOME theme settings (see Figure 13-22) and
    customize the look and feel of your desktop. For a look similar to Windows 95,
    try the Redmond95 theme.


    Changing GNOME themes affects only applications that use the GTK libraries, such
    as GNOME, Linuxconf, and others written specifically for GNOME. You can find more
    themes on the Web at http://gtk.themes.org/. After downloading a new theme, press
    the button labeled “Install new theme.” Find the new theme in the file browser,
    press OK, and the theme will appear in the Available Themes list.


    # Figure 13-22: Choosing your GNOME theme'
