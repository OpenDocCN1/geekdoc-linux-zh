- pgno: 345
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_345_0.png)


    Figure 14-9: Verify output for packages


    # VERIFYING PACKAGES


    To verify a package, navigate to the correct folder, select the icon for that
    package, and click the "Verify" button in the GnoRPM main window. A dialog box
    like the one shown in Figure 14-9 will display the verification output for the
    selected package.


    # FINDING PACKAGES


    If you find it a bit frustrating to point and click your way through the folders
    to find a package, use the "Find" button in the GnoRPM main window. A dialog box
    like the one shown in Figure 14-10 will help you find a package, if you know the
    name of a file in it. You can use the "Query," "Uninstall," and "Verify" buttons
    in the Find dialog box to act on a package.


    # USING WEB FIND


    The Web Find option (Figure 14-11) will search the Internet for new packages that
    may be of interest to you. By default, it will connect to the redhat.com site
    and display a list of packages. You can enter a search word at the top of the
    screen to narrow the list of packages. Select a package from the list on the left
    to view its details and then click the "Install" or "Upgrade" button if you want
    to download and install the package.'
  merge: -1
  img_proc: true
