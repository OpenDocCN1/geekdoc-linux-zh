    # VARIABLES AND QUOTING


    A variable in a shell script is a means of referencing a numeric or character
    value. And unlike formal programming languages, a shell script doesn''t require
    you to declare a type for your variables. Thus, you could assign a number to the
    variable stuff and then use it again in the same script to hold a string of characters.
    To access the value (contents) of a variable, prefix it with a dollar sign.


    ```

    stuff=5

    stuff=''chocolate truffles''

    ```


    Don’t put any spaces before or after the equal sign, or you’ll get an error. And
    if you want to assign a string that contains spaces, you will need to put quotation
    marks around the string.


    This is a good time to note that there are several distinct ways to use quotations
    marks in a shell script. Let’s look at the differences among single quotation
    marks, double quotation marks, and the backslash character and then follow up
    with some examples.


    +   - Single quotation marks, as in the preceding example, will always get you
    exactly what’s inside the quotation marks—any characters that might otherwise
    have special meaning to the shell (like the dollar sign or the backslash) are
    treated literally.


    +   - Use double quotation marks when you want to assign a string that contains
    special characters the shell should act on.


    +   - The backslash is used to escape (treat literally) a single character (such
    as $ or *) that might otherwise be treated as a special character by the shell.


    Now let’s look at some examples that show when to use each method of quoting.


    ```

    howdy=''Good Morning $USER !''

    echo $howdy

    Good Morning $USER !

    howdy="Good Morning $USER !"

    echo $howdy

    Good Morning hermie !

    ```'
