    a file. If Pico doesn’t find any dubious words in the current document, nothing
    much happens except that the message “Done checking spelling” appears at the bottom
    of the screen.


    And if you’d like to know exactly where you are within a file (on which line and
    at which character), or if you’d like a quick character or line count, press CTRL-C
    and look in the message area at the bottom of the screen for something like this:


