- pgno: 471
  md: "# RED HAT LINUX 6.x\nNO NONSENSE. NO TRIVIA. NO B.S.\n\n> PRAISE FOR BOB RANKIN’S\
    \ *THE NO B.S. GUIDE TO LINUX:*\n> \n> “An excellent, humorous, and effective\
    \ primer for any user.”\n> —*SysAdmin Magazine*\n> \n> “One of the best books\
    \ that we have ever seen for beginners who already know DOS.”\n> —*The Linux Newsletter*\n\
    \nThe No B.S. Guide to Red Hat Linux 6.x tells you what you need to know to install,\
    \ run, and use Red Hat. It’s written for people who want to get Red Hat Linux\
    \ up and running on their PC or server fast. You’ll find straightforward instructions\
    \ on:\n\n+   - New in Red Hat 6.2 — Partitionless install makes it easier than\
    \ ever to install Linux!\n+   - Configuring GNOME, the new Linux GUI!\n+   - Using\
    \ the Bash shell\n+   - Linux commands like grep and awk\n+   - Connecting to\
    \ the Internet with PPP\n+   - Running the Apache Web server\n+   - Writing your\
    \ own Bash or Perl scripts\n+   - Accessing DOS files and running Windows programs\
    \ under Linux\n\nIf you’re interested in exploring Red Hat Linux’s capabilities\
    \ and features, and not just reading (and reading, and reading) about them, then\
    \ *The No B.S. Guide to Red Hat Linux* is the book for you.\n\n# ABOUT THE CD-ROM\n\
    \nThe CD-ROM contains Red Hat Linux 6.2—the most popular Linux distribution available.\
    \ You’ll be up and running in a snap!\n\n![](img/3137cdda7122042e86dbeafe9840d4ed_471_0.png)\n\
    \nDistributed by Publishers Group West\n\n![](img/3137cdda7122042e86dbeafe9840d4ed_471_1.png)\n\
    \n# INCLUDES RED HAT LINUX 6.2"
  merge: -1
  img_proc: true
