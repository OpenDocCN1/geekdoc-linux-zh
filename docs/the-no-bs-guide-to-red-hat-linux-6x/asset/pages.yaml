- pgno: 91
  md: '# LOGGING OUT OF GNOME


    To log out from GNOME, select the “Logout” menu item found in the Main menu. For
    convenience, you can also add a Logout button to the GNOME Panel by right-clicking
    on the Panel and then selecting “Add logout button” from the pop-up menu.


    After you select the Logout menu item or clicking the Logout button, a dialog
    box will prompt you to confirm the log-out (see the image below). Click “Yes,”
    and your GNOME session will end. Depending on your system configuration, you’ll
    return to a text-mode shell prompt or the graphical log-in screen. If you decide
    not to log out, click the “No” button.


    There are a few selections you can make in the GNOME Logout dialog box. If you
    check the “Save current setup” box, your next GNOME session will start with the
    same settings and active applications. In other words, if you exit GNOME with
    the File Manager and Netscape windows on your screen, they’ll start again when
    you come back to GNOME.


    Also, in the Action panel, you can select “Logout,” “Halt,” or “Reboot.” Logout
    will end your GNOME session, Halt will shut down your computer (in preparation
    for a power-off), and Reboot will restart the machine.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_91_0.png)'
  merge: -1
  img_proc: true
