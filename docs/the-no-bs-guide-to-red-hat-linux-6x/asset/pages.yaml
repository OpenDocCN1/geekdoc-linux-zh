  img_proc: true
- pgno: 143
  md: 'Another help format called info is more powerful, since it provides hypertext
    links to make reading large documents much easier, but not all documentation is
    available in info format. There are some very complete info documents on various
    aspects of Red Hat (especially the portions from the GNU project).

    To try it out, use the info command without any arguments. It will present you
    with a list of available documentation. Press h to read the help for first-time
    users, or use the TAB key to move the cursor to a topic link and then press ENTER
    to follow the link. Pressing p returns you to the previous page, n moves you to
    the next page, and u goes up one level of documentation. To exit info, press q.


    # THE GNOME HELP BROWSER


    If you''re running X Windows with the GNOME interface (the default when you install
    Red Hat Linux), you can access the man and info pages much more easily. Just click
    on the taskbar button with the big question mark (see Figure 4-4), and you''ll
    launch the GNOME Help Browser (Figure 4-5). From there, you can browse a catalog
    of man or info pages, along with special help files for the GNOME interface.


