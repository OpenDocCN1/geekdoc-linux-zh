- pgno: 263
  md: 'Let''s look at what just happened. After you entered the mail command, the
    system informed you of the version of the mail program that is running and told
    you how to get help for it.


    The next line tells you that there is one new message in your mailbox, and that
    your incoming mail is stored in the file /var/spool/mail/hermie. (Each user on
    the system has a mail file in the /var/spool/mail directory.) When new mail arrives,
    Linux tacks it onto the end of the recipient''s mail file.


    > NOTE: You should never directly edit your mail file—always use mail or another
    email program to handle your mail. (If you''re editing your mail file when a new
    message arrives, it will be lost.) But it''s quite all right to scan your mail
    file with grep or some other utility that doesn''t try to modify it. (You might
    want to apply grep to your mail to find a particular string, such as the email
    address of a person who has corresponded with you.)


    The next line,


    ```

    >N 1 root@fritz.com Mon Feb 10 14:58 "Gone Fishing"

    ```


    is referred to as a header line, and it tells you a number of things. The > tells
    you which message is the current one—the one you''re working with.


    The N 1 indicates that you''re dealing with message 1 and that it''s flagged as
    a new message. (Later, the flag could be U for unread or O for an old message.)
    The rest of the line tells you who the message is from, when it was sent, and
    the Subject line.


    The ampersand (&) on the following line is the mail prompt. In this example, we
    entered a 1 to display the first message, and the message text is shown on the
    lines that follow. Unfortunately, we can''t tell from the context whether to roll
    over and die or just go fishing.


    # Exiting the Mail Program


    The q command entered at the next mail prompt ends the session and returns you
    to the shell prompt. But take note of the messages that were printed on your way
    out: namely, "Saved 1 message in /home/hermie/mbox" and "Held 2 messages in /var/mail/spool/hermie."
    For some odd reason, mail does not think it''s a good idea to'
  merge: -1
