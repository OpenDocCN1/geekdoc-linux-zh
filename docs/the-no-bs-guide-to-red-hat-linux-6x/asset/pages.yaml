- pgno: 424
  md: '# GLOSSARY'
  merge: -1
  img_proc: true
- pgno: 425
  md: 'This glossary will help as you explore Linux. You''ll no doubt encounter many
    of these terms in your travels about Unix and the Internet, so bone up now on
    your geekspeak, and you''ll be prepared when the acronyms start flying.


    **Anonymous FTP** A public archive of files that anyone can access without a user
    ID or password.


    **Archie** Internet-based software used to search for files at anonymous FTP sites.


    **Article** A message posted to a Usenet newsgroup; see *post*.


    **ASCII (American Standard Code for Information Interchange)** A set of 128 standard
    characters guaranteed to be displayed the same way on any computer. The ASCII
    character set consists of numbers, letters, and other special characters that
    you can find on a standard U.S. keyboard. Examples of non-ASCII characters are
    ü, é, å, and £.


    **Attachment** A file attached to an email message. Attachments are often graphics,
    compressed documents, or programs.


    **Bash** Acronym for Bourne Again Shell, the default Linux shell.


    **Background** A task that runs behind the scenes, allowing no user interaction.
    See also *Foreground*.


    **Bandwidth** A measure of the amount of data a network can send or receive at
    one time. Think of bandwidth as the size of the pipe through which data flows
    from one computer to another.


    **BBS (bulletin board system)** A computer you can dial to access files and participate
    in electronic discussions. Unlike the Internet, BBSs are not always networked
    and often require that you have a password or membership before you can access
    them.


    **Binary file** A file containing items other than plain text (ASCII characters),
    such as a program or graphics.


    **Bit** The basic unit of data a computer processes. A bit can have a value of
    1 or 0.


    **Bounce** An email message that could not be delivered and is returned is said
    to have bounced.'
  merge: -1
  img_proc: true
- pgno: 426
  md: 'Browser As in World Wide Web browser; a piece of software like Netscape, Mosaic,
    or Lynx that displays World Wide Web documents.


    Client Also called client software. Software that connects your computer to another
    (server) computer.


    Compression The compacting of files to save storage space and reduce transfer
    time. Common compression tools for Unix are gzip and zip. You will often find
    software packages distributed as compressed files on the Internet.


    Copyleft The idea that anyone who redistributes a piece of software, with or without
    changes, must pass along the freedom to further copy and change it.


    Cross-posting Posting the same message to several Usenet newsgroups.


    Current directory The directory in which you are currently working. You display
    its value with the pwd command.


    Cyberspace A term coined by William Gibson in the science-fiction novel Neuromancer.
    Though commonly used to refer to the Internet, it describes the virtual space
    one occupies when participating on any computer network.


    Daemon A background process that takes a predefined action when a certain event
    occurs. An example is the printer daemon, which manages the print queue. (Pronounced
    like demon.)


    Directory A place where related files are grouped. Directories may contain files
    or subdirectories (directories below the first level), resulting in a tree-like
    organization of files.


    Domain name The name assigned to a computer on the Internet (for example, http://www.snarch.com).
    The suffix on the domain name tells you the type of organization that operates
    the system (for example, com = business, edu = university, gov = government, mil
    = military, org = organization). Sometimes the organization type is followed by
    a two-character country code (au = Australia, for example, as in outback.edu.au).


    Download What you do when you transfer a file from another computer to your own.
    Common usage implies moving a file from a public library to one''s personal space.'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'Email (electronic mail) Electronic messages sent or received over the Internet,
    other online services, or computer networks.


    Encryption Scrambling a file so that it can''t be read without special decoding
    software and a password. PGP is the most commonly used encryption software.


    Enlightenment A window manager for GNOME that lets you control the look and feel
    of the desktop.


    FAQ (frequently asked questions) A document that provides answers to frequently
    asked questions on a specific topic. (It is pronounced like fact without the final
    consonant.)


    File permissions A set of permissions associated with a file or directory that
    tells who can read, write, or execute the file or directory.


    File system A chunk of hard disk formatted so that Linux can use it, with a hierarchical
    (tree-like) structure for storing files. This might be a hard disk drive or a
    partition on a disk drive.


    Filter A program in a pipeline that reads a stream of data, performs some operation
    on each line, and sends out the modified lines.


    Finger A program that displays information about another user on the network.


    Flame Expression of a strong opinion or criticism, usually in an email message
    or Usenet posting.


    Foreground A program running in the foreground is one you can interact with. See
    also Background.


    Free software Software that is covered under the GNU Public License (see Appendix
    B). Free, in this context, refers to freedom and not cost. Not to be confused
    with Freeware or Shareware.


    Freeware Software that is free of charge. Not to be confused with Free software
    or Shareware.


    FTP (File Transfer Protocol or File Transfer Program) A means of transferring
    files between computers on the Internet.


    Geek Someone who enjoys being with computers as much as or more than being with
    people.'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'GIF (Graphic Interchange Format) A graphics file format used on the World Wide
    Web. See also JPEG.


    GNOME The GNU Network Object Model Environment, a contrived acronym for a nifty
    graphical user interface for Linux.


    GNU An acronym for GNU''s Not Unix. The GNU project''s goal is to provide a complete
    set of free Unix software.


    Gopher A menu-based interface to collections of information on the Internet.


    Header The lines in an email message that precede the message body. These lines
    identify the sender, the recipient, and the path traveled by the message.


    Home page A World Wide Web document that is the online home of a person, business,
    or organization; the first in a series of Web documents.


    Host A computer on a network that provides access to files or information. See
    also Server.


    HTML (Hypertext Markup Language) The language used to create and format documents
    for display by a World Wide Web browser.


    HTTP (Hypertext Transfer Protocol) The way the computers on the World Wide Web
    communicate. When you type http:// into a URL, you''re telling your browser that
    the file you want resides on a Web server (as opposed to a gopher or FTP server).


    Hypertext A way to link documents so they can be explored by selecting highlighted
    words or phrases (hypertext links) in Web documents. These links, in turn, are
    linked to other documents, which are displayed as you select each link.


    Internet The set of networks that connects over a million computers and an estimated
    40 million people worldwide.


    IP (Internet protocol) The rules that govern the way computers communicate on
    the Internet. Internet protocol allows large chunks of data to travel in small
    packets across computer networks before they''re reassembled at their destination.


    IRC (Internet Relay Chat) A multiuser system that allows people to chat live with
    other internet users.'
  merge: -1
  img_proc: true
- pgno: 429
  md: 'ISP (Internet service provider) A company that provides Internet access and
    services.


    JPEG (Joint Photographic Experts Group) An acronym for a file format that compresses
    graphics files to reduce their size. JPEG files are commonly found on the World
    Wide Web. See also GIF.


    Kbps (kilobits per second) A measure of the speed at which data moves across a
    network or modem. A kilobit is equal to 1024 bits, or 128 bytes. The higher the
    number, the faster the transfer.


    KDE The K Desktop Environment is the desktop manager for X Windows. KDE can be
    used instead of GNOME.


    LILO An acronym for Linux Loader. LILO is a boot manager that allows you to select
    which operating system to load at startup.


    Listserv Software that distributes email to groups of mailing list subscribers.
    Majordomo and Listproc are similar programs.


    Mailing list An email discussion group. Mailing list subscribers automatically
    receive members’ postings. Mailing lists are usually managed by automated software
    like Listserv or Majordomo.


    Man page A page from an online Unix manual.


    MIME (Multipurpose Internet Mail Extension) A format for encoding and attaching
    binary files to email messages. You must have special MIME-decoding software (or
    a mail reader that supports MIME) to decode a MIME-encoded attachment.


    Modem Hardware your computer uses to communicate with another computer over a
    telephone line. Modems convert analog telephone signals to digital signals (a
    form your computer can process) and vice versa. Modem speeds are measured in bits
    per second (bps). The higher the bps value, the faster the modem can send or receive
    data.


    Mount Making another file system available. One can mount a floppy disk, a CD-ROM,
    a partition on a hard drive, or a directory on a remote machine.


    Name server A networked computer that tracks the relationships between Internet
    domain names and their actual addresses. For example, a name server will know
    that the domain name xyz.com has the address 193.252.47.19.'
  merge: -1
  img_proc: true
- pgno: 430
  md: '**Nerd** A socially inept person, slavishly devoted to intellectual or academic
    pursuits—pocket protectors, taped glasses, and plaid shirts are optional.


    **Netiquette** Internet etiquette; a set of generally agreed upon rules for proper
    behavior on the Internet.


    **Newsgroup** A Usenet discussion group.


    **Newsreader** Software that reads and posts Usenet messages. Tin is commonly
    used on Unix for this purpose.


    **NNTP** (Network News Transport Protocol)  The communication method used to distribute
    Usenet postings.


    **Packet** A small chunk of data sent over a network. Packets include the message,
    the sender’s and receiver’s identities, and some error-control information.


    **Pager** A tool on the Gnome Panel to help you manage the applications currently
    active on your desktop.


    **Perl** A popular interpreted programming language widely used for writing shell
    scripts.


    **Pipeline** A sequence of programs through which a stream of data passes. Each
    stage or filter performs some operation on the data.


    **POP** (Post Office Protocol)  A communication method used by SLIP/PPP software
    to send and receive email. POP also stands for Point of Presence—a computer system
    that accepts local dial-ins for a large regional network.


    **Post** What you do when you send a message or article to a network newsgroup.


    **Postmaster** The person who administers the email system on a network and responds
    to users’ questions and complaints.


    **PPP** (Point-to-Point Protocol)  A communication method that allows a personal
    computer to connect directly to the Internet using a standard telephone line.
    PPP is gradually replacing the older SLIP technology.


    **Protocol** A prescribed method of communication allowing different types of
    computers to exchange information over a network.'
  merge: -1
  img_proc: true
- pgno: 431
  md: 'Recursion See Recursion.


    Redirection Piping the output of a command to a file or another program, instead
    of having it displayed on the screen.


    Regular expression A text string that includes special characters for pattern
    matching.


    RFC (Request for Comments) The standards that define the Internet and how it works.
    RFC also refers to the way these documents are discussed and approved by the Internet
    community.


    Root directory The directory located at the top of the Linux file system, represented
    by the forward slash character.


    RPM (Red Hat Package Management) A utility that helps you install and uninstall
    software packages on a Linux system.


    Server A computer that responds to requests from a client computer. See also Host.


    Shareware Software you can try for free before buying it. See also Freeware and
    Free software.


    Shar file A shell archive file; a bunch of program source code files bundled together
    so they can be easily transmitted by email.


    Shell A program that acts an intermediary between the user and the operating system.
    Commands entered by the user are passed from the shell to the operating system
    for execution.


    Shell account A type of Internet account where you dial in to a service provider''s
    system and use Unix commands there to access email and Internet resources.


    Shell prompt A character at the start of the command line that indicates that
    the shell is ready to receive your commands. In the Bash shell, the prompt is
    a percent sign for normal users and a pound sign for superusers.


    Shell script A short program written in an interpreted language to automate routine
    command-line tasks.


    Signature A brief, personal message or tag line at the end of an email or Usenet
    message. A signature should generally not exceed five lines.'
  merge: -1
  img_proc: true
- pgno: 432
  md: '**SLIP (Serial Line Internet Protocol)** A communication method that allows
    a personal computer to connect directly to the Internet using a standard telephone
    line. See also PPP.


    **Standard input** The source of input for a program. This is assumed to be the
    keyboard unless input is redirected from a file or another program.


    **Standard output** The destination for output from a program. This is assumed
    to be the screen unless output is redirected to a file or another program.


    **Talk** A program for online chats between two users.


    **Tar file** A file created by the tar (tape archive) command, which bundles a
    bunch of files together and creates an archive (commonly called a tar file) on
    a tape, hard disk, or floppy disk. The most common use is to package multiple
    files or directories into a single file for easy transfer or archiving.


    **TCP/IP (Transmission Control Protocol/Internet Protocol)** A set of rules that
    enables different types of computers to communicate over a network; the basis
    for all Internet communications.


    **Telnet** Software that allows Internet users to log into another computer remotely.


    **UNIX** An operating system developed by AT&T''s Bell Labs, later sold to Novell,
    and now owned by SCO. UNIX is a trademarked name, whereas Unix is a generic term.


    **Unix** A generic term for any UNIX-like operating system. Linux is an implementation
    of Unix.


    **Upload** What you do when you transfer a file from your computer to another.


    **URL (universal resource locator)** The assortment of colons, slashes, and other
    funny characters that make up the address of a Web document—for example, http://www.xyz.com/welcome.html.


    **Usenet** An electronic conferencing system that enables millions of Internet
    users to wallow in dung. Also a place where you can post messages or read the
    messages posted on various topics by other users.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '**UUencoding** A means of converting binary files to ASCII format so they can
    be emailed to other Internet users. The uuencode program converts the binary file
    to ASCII format, and the uudecode program returns the file to its original form.
    See also *MIME*.


    **VT100** A standard terminal type supported by many computer systems. Telnet
    programs emulate this type of terminal in order to connect to many Internet sites.


    **Web** A common abbreviation for the World Wide Web.


    **World Wide Web** Originally designed as a means for researchers to share documents,
    the World Wide Web (commonly referred to as the Web or WWW) has become the Internet''s
    primary tool for storing, presenting, and researching information. The Web is
    a collection of electronic documents linking together documents, images, and sound
    files located on the Internet.


    **WWW** A common abbreviation for the World Wide Web.'
  merge: -1
  img_proc: true
