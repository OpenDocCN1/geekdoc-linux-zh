- pgno: 158
  md: '# COPYING FILES


    Copying files under Linux is similar to copying files under DOS. Here’s an example
    using the cp (copy) command:


    ```

    cp goulash recipes/hungarian

    cp stuff stuff.bak

    ```


    The first example copies the goulash file from the current directory and stores
    it in your recipes/hungarian directory. The second example creates a file called
    stuff.bak in the current directory that is identical to the source file stuff.


    > ▪ **NOTE:** The cp command will overwrite files with the same name without warning.
    To be prompted before overwriting, use the -i flag, like so:


    ```

    cp -i goulash recipes/hungarian

    cp: overwrite recipes/hungarian/goulash (y/n)?

    ```


    # RENAMING FILES


    Use the mv command to rename a file or move it to another directory, like so:


    ```

    mv stuff junk

    mv junk trashcan

    ```


    The first example renames the file stuff as junk, and the second moves the file
    junk into a directory called trashcan.


    > ▪ **NOTE:** The mv command will wipe out files without warning. To be prompted
    before overwriting, use the -i flag, like so:


    ```

    mv -i stuff junk

    mv: overwrite junk (y/n)?

    ```'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# CREATING FILES


    If you want to create a new file rather than copy an existing one, use the touch
    command:


    ```

    touch new.file

    ```


    This creates a new, empty file.

    If you issue the ls -l new.file command, you can verify that the file has a size
    of zero bytes. It might seem silly to create an empty file, but you can use them
    to verify that you have permission to create files in a certain directory, and
    some programs insist upon a control or log file even if it''s empty. (The touch
    command will also update the time and date stamp on an existing file.)

    If you''d rather create a new file with data in it—for example, a line of text—use
    the echo command:


    ```

    echo "Remember to buy oatmeal raisin cookies." > reminder

    ```


    This will create a file named reminder with just one line in it (the text in quotation
    marks). The echo command normally just prints a line to the screen, but here we''ve
    directed the output to a file. (This command also works in DOS.)

    If you want to create a multiline file, use the cat command (similar to the DOS
    type command):


    ```

    cat > fox.socks

    Through three cheese trees three free fleas flew.

    While these fleas flew, freezy breeze blew.

    Freezy breeze made these three trees freeze.

    Freezy trees made these trees'' cheese freeze.

    That''s what made these three free fleas sneeze.

    ^D

    ```


    The first line in this example tells Linux what to name the new file (fox.socks).
    The typed lines that follow will become the contents of this new file. Pressing
    CTRL-D tells Linux that the file is done, and the cat command transfers your typing
    to the new file.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# DELETING FILES


    Ready to do a little damage? The rm command removes a file (assuming you have
    permission to do so) without even saying hasta la vista. Be sure you really want
    to delete your files before you use rm, because once the files are gone, they''re
    not coming back. For example,


    ```

    rm wallet

    ```


    immediately deletes the file named wallet in the current directory without prompting.
    If you want to be prompted before the deletion, use the -i flag.


    > NOTE: There is one little safety feature in rm—it won’t delete a directory (unless
    you use the -r flag).


    One other rm flag is -f, which translates roughly to “Don’t ask me any questions—just
    delete the files.” While rm normally asks for confirmation before deleting a write-protected
    file, the -f (force) flag overrides this prompt.


    Be careful with the rm command, since the multiuser nature of Linux does not allow
    for undelete as in DOS. As soon as you let go of the space occupied by a file,
    the operating system is likely to use it for something else.


    # CREATING DIRECTORIES


    If you have a bunch of related files scattered in your home directory, why not
    create a directory for them? Use the mkdir command as follows:


    ```

    mkdir cooking

    ```


    This creates a new directory named cooking in the current directory, into which
    you can move all those recipes for easy retrieval.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# DELETING DIRECTORIES


    If you created a directory named spelunking six months ago, and now you’re not
    so keen on crawling through slimy caves, the rmdir command may be able to help:


    ```

    rmdir spelunking

    ```


    This command removes the specified directory, but only if it’s empty. If the directory
    contains files or subdirectories, you’ll have to delete them using rm first.


    One alternative to painstakingly removing all the contents of a directory that
    you just want to make disappear is to use the rm -r command. The -r flag gives
    rm license to kill directories, their files, and even their subdirectories. Be
    very sure you understand what’s about to happen before using a command like this:


    ```

    rm -r spelunking

    ```


    Let’s just say that careless use of the -r flag might end your spelunking hobby
    prematurely.


    # USING WILDCARDS


    Wildcards come in quite handy when you want to operate on more than one file at
    a time. You can use wildcards with any of the commands in this chapter to list,
    copy, rename, or delete groups of files or directories.


    The asterisk (*) character will match any number of characters in a file name,
    so consider these examples in light of the animals directory we used earlier.


    ```

    ls -l c*

    -rw-r--r-- 1 hermie users 45090 Mar 23 23:17 cat_info

    -rw-r--r-- 1 hermie users 64183 Feb 14 22:07 cow_info

    mv *inf* ../docs

    rm -f *

    ```


    The first command lists only those files that begin with the letter “c.” The second
    will move files with the term inf anywhere in the name'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'to another directory. The third command will delete all (nonhidden) files from
    the current directory.


    ■ NOTE: The expansion of the wildcard is done by the shell, not the command you
    are running. This means that when you enter the command


    ```

    rm -f *

    ```


    the shell expands the wildcard by replacing it with all files that match and actually
    ends up executing this command:


    ```

    rm -f cat_info cow_info dog_info pig_info slugs zippity

    ```


    This might seem a bit arcane, but it’s actually important. Since the shell handles
    the wildcards in Linux, you don’t have to worry about which commands accept wildcards
    and which don’t. This is quite different from DOS, where only certain commands
    work with wildcards.


    Here’s a little pop quiz: What will be left in the animals directory if you execute
    the rm command in the preceding example? Try it and then use the ls -al command—you
    may be surprised at the answer.


    # DON’T TRY THIS AT HOME


    At the beginning of this chapter, I promised to reveal the Nine Deadly Keystrokes
    that could wipe out your entire file system. Given what you know now about the
    rm command and the structure of the Linux file system, perhaps you can see that
    the command


    ```

    rm -rf /

    ```


    would be something to avoid at all costs if you were logged in as root. But don’t
    let this scare you—it’s just a reminder to be careful when deleting files. You
    can avoid nasty surprises like this by running the pwd and ls commands before
    you delete anything. (Use ls on the same file or directory that you’re going to
    delete.) Then you’ll always be sure what directory you’re in and what files are
    about to be deleted.


    And in general, it’s a good idea to log in as root only when you’re performing
    system administration tasks such as adding new users or installing software. Create
    another account and use it for all your normal, everyday Linux tasks.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Controlling Access to Your Files with Permissions and Owners


    If you share a Linux (or Unix) system, you will undoubtedly have private files
    that you want to keep private, as well as files that you want to be public. You
    can control access to your files by setting the permission flags and ownership
    for your files.


    # How to Tell What Access Your Files Have


    When we discussed using the ls command, you may have been wondering about that
    gibberish in the first few columns of the ls -l command (stuff like -rw, r--,
    and so on). Here''s an example of output from the ls -l command showing the contents
    of a directory:


    | Permissions | User | Group | Size | Date | Name |

    | -rw-r----- | 1 hermie | users | 64183 | Feb 14 22:07 | cow_info |

    | -rw-r----- | 1 hermie | users | 115032 | Jan 06 11:14 | dog_info |

    | -rw-r--r-- | 1 hermie | users | 248 | Jan 16 09:18 | pig_info |

    | -rw-r--r-- | 1 hermie | users | 45090 | Mar 23 23:17 | cat_info |

    | -rwx--x--- | 1 hermie | users | 45198 | Jan 23 11:14 | zippty |

    | drwxr-x--- | 1 hermie | friends | 1024 | Feb 28 06:12 | slugs |


    For each file you see listed a set of permissions; the owning user; a group name;
    and the size, creation date, and name of the file. We''ll focus on the permission
    first by dissecting the file-access permissions for the cow_info file. Specifically,
    these permissions are shown in the string of characters preceding the file in
    the first column: -rw-r----. Note that the permissions data is made up of ten
    characters, each of which has meaning.


    To understand how to read file permissions, let''s start by splitting apart those
    ten characters for cow_info:


    | Directory? | User''s Access | Group Access | Others'' Access |

    | - | r w - | r - - | - - - |

    |  | | | |

    | Readable ----> | | | | | +---- Not executable |

    | Writable ------> | | | +------ Not writable |

    | Not executable --------> | | +-------- Readable |'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'The character in the first position, a hyphen (-), indicates that this is a
    file and not a directory. Directories are marked with a d, as in drwxr-x-- (this
    precedes the directory slugs)


    The next three characters (rw-) tell us whether the file''s owner (hermie) can
    read, write, and execute the file. An r in the first position means that the file
    can be read; a w in the second position means that the file can be written to
    (updated); and an x in the third position means that the file can be executed
    (run). In all three cases, if a hyphen appears in place of an r, w, or x, that
    specific privilege is removed. For example, rw- means that the file can be read
    and written to, but not executed.


    The next sets of three characters define read, write, and execute access for the
    users in a particular group (the users group, in this case), along the same lines
    as above. For example, the characters r-- that appear in these positions for cow_info
    tell us that the users group can read this file but can''t write to or execute
    it.


    The final set of three characters—all hyphens, in this case—defines access for
    those who are not the owner or in the listed group. This one''s easy: No one outside
    the listed group has any kind of access to this file.


    > NOTE: Groups are a convenient way to give a set of users the same access to
    a bunch of files. Only a superuser can add to or remove users from groups. To
    find out what groups you belong to, use the groups command.


    In sum, access to the cow_info file is controlled like so: The user (hermie) can
    read and update the file, but cannot execute it. People in the users group can
    only read the file, and everybody else on the system gets no access at all.


    Here''s another example:


    ```

    -rwx--x--- 1 hermie users 45198 Jan 23 11:14 zippity

    ```


    The characters that precede the file name zippity tell us that this file is readable,
    writable, and executable by hermie; only members of the users group can execute
    it; and others outside the users group have no access to it.


    > NOTE: You can give execute permission to any file, but it doesn''t make sense
    to do so unless the file is actually a program.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Look at the listing for slugs:


    ```

    drwxr-x--- 1 hermie friends 1024 Feb 28 06:12 slugs

    ```


    You can see first that it’s a directory (signified by the d in the first position).
    User hermie has read and write access, which in the case of a directory translates
    into the ability to list files and to create and delete files. Hermie also has
    execute access, which in the case of a directory means the ability to use cd to
    change to it. Those in the friends group can list files in the directory and use
    cd to make it the current directory, but others have no access whatsoever to the
    directory.


    > **NOTE:** Unless you are administering a large Unix system with lots of users,
    groups are not very important. In these examples, users is just the name of a
    group that all users belong to by default in a Linux system. If your primary group
    is users, all files you create will show that as the group name, unless you use
    the chgrp command to change it. If you’re curious, use the man chgrp command to
    find out more.


    # USING CHMOD TO CHANGE A FILE’S PERMISSIONS


    Fine; you can decipher the permissions for a file or directory, but what if you
    want to change them? Maybe you’ve decided that the pig_info file is a little too
    sensitive for just anybody to view, or that you should allow all users to execute
    the zippy program. The chmod (change mode) command can take care of that.

    The general form of the chmod command is


    ```

    chmod <permission flags> <file or directory name(s)>

    ```


    To tell chmod the new permissions for a file, you can use any combination of these
    permission flag characters:


    | WHO IT APPLIES TO | ACCESS CHANGE | ACCESS TYPE |

    |---|---|---|

    | (Pick One or More) | (Pick One) | (Pick One or More) |

    | u For the owner | + Grant access | r For read access |

    | g For the owner | - Deny access | w For write access |

    | g For the group |  | x For execute access |

    | o For all others |  |  |'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Here are some examples:


    chmod o-r pig_info    Remove read access from all others

    chmod g+rw pig_info   Grant read and write access to group

    chmod ugo+x zippity   Grant execute access to everybody


    In effect, you''re saying “change the mode for these people by adding/removing
    their access to read/write/execute the file named whatever.” Just pick the proper
    combination of flags in each of the three columns, depending on what type of access
    you want for the file.


    > NOTE: If you give chmod a directory name instead of a file name, the permissions
    have slightly different meanings. For a directory, read access means that you
    can list the files with the ls command; write access allows you to create or delete
    files; and execute access gives you the ability to change to that directory with
    the cd command.


    # TRANSFERRING OWNERSHIP OF A FILE USING CHOWN


    If you are logged in as root, you can transfer ownership of a file or directory
    (if you move it into another user''s directory) using the chown command.


    To tell chown what to do, just give it the new owner and the file name, like this:


    ```

    chown sigmund zippity

    ```


    This will make sigmund the owner of zippity. Once you''ve transferred ownership,
    sigmund will be able to set the file''s permissions (with chmod) if he wants to.'
  merge: -1
  img_proc: true
