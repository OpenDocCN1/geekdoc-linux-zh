- pgno: 114
  md: '# USING MINICOM


    Minicom is a communications program, similar to Telix or Procomm. It’s not really
    an Internet tool, but you can use it to dial in to your shell account or access
    a bulletin board system. Use the **minicom** command to start this program.


    # GRAPHICAL INTERNET TOOLS FOR X WINDOWS


    For those who prefer point and click to hunt and peck, Red Hat Linux provides
    you with graphical tools to handle your email and explore the Web. This section
    introduces you to some graphical tools for email, Web browsing, FTP, and IRC.
    All of these are free and already installed on your system.


    # USING EXMH


    The exmh program is a full-featured email client for the X Windows environment,
    similar to the popular Eudora mail program (see Figure 3-8). It sends, receives,
    and stores mail in folders. Just as with


    ![](img/3137cdda7122042e86dbeafe9840d4ed_114_0.png)


    *Figure 3-8: The exmh email client*'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'the text-based mail clients, you can’t receive Internet mail directly on your
    system without a permanent (or UUCP) connection and a registered domain name.

    For more information on using exmh, use its help facility, available via the “Help”
    button.


    # USING NETSCAPE


    Red Hat Linux comes with Netscape Navigator version 4 (see figure 3-9). It’s an
    excellent browser, works well with FTP sites, and comes with a built-in email
    client and Usenet newsgroup reader, making it the Swiss army knife of Internet
    tools.

    If you’re already using Netscape Communicator’s email client on Windows, I recommend
    that you use it on Linux also, instead of exmh, so you won’t have to learn another
    program (see Figure 3-10).


    ![](img/3137cdda7122042e86dbeafe9840d4ed_115_0.png)


    *Figure 3-9: The Netscape Navigator browser*'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_116_0.png)


    Figure 3-10: *The Netscape Communicator email client*


    # FILE TRANSFER WITH GFTP


    If you download often from FTP sites, you can use the gFTP program under X Windows
    to make things a little nicer (see Figure 3-11). This client allows you to store
    the addresses of frequently used FTP sites so you can connect quickly and features
    point-and-click file transfer from remote sites to your hard drive, or vice versa.


    # IRC CHAT WITH X-CHAT


    You can interact live with other Internet users around the world using IRC—Internet
    Relay Chat (see Figure 3-12). Using IRC is similar to being in a chat room on
    commercial services such as America Online and CompuServe. IRC can be compared
    to a CB radio—you tune in to a specific chat channel, give yourself a *handle*
    (nickname), and participate in a live conversation with one or more people by
    typing messages back and forth. Anyone connected to the same channel can read
    your messages.


    A detailed discussion of IRC is beyond the scope of this book, but you can find
    a good IRC tutorial online at http://www.irchelp.org/.'
  merge: -1
  img_proc: true
