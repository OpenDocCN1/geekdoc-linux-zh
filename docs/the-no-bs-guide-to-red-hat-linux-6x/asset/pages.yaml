    Figure 5-1: The Midnight Commander program


    # LISTING FILES WITH FILE MANAGER


    If you''re running X Windows with GNOME, the File Manager (Figure 5-2) is highly
    recommended over the shell prompt commands or Midnight Commander. File Manager,
    also known as GNOME Midnight Commander, is a graphical version of the text-based
