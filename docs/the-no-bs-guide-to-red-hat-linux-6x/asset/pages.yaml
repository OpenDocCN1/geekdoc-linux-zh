- pgno: 101
  md: '# DEFINING A PPP CONNECTION


    After setting up the name server, you can start the PPP configuration to connect
    to your ISP from Linux.

    From the linuxconf main menu, choose Config • Networking • Client Tasks • PPP/SLIP/PLIP.
    Then click the Add button (see Figure 3-4).

    Select the PPP option and then click Accept to continue (see Figure 3-5).


    ![](img/3137cdda7122042e86dbeafe9840d4ed_101_0.png)


    Figure 3-4: Adding a new connection


    ![](img/3137cdda7122042e86dbeafe9840d4ed_101_1.png)


    Figure 3-5: Adding a PPP interface


    Enter your ISP''s dial-up access number, your PPP log-in name, and your password
    (see Figure 3-6). If your ISP uses PAP Authentication, be sure to check the Use
    PAP Authentication box. In most cases, this completes the PPP connection setup.


    NOTE: A new feature in the Red Hat version 6 release is a graphical PPP configurator,
    which can be accessed by clicking on Gnome Foot • Internet • Dialup Config Tool.
    You can use this as an alternative to the Linuxconf method, but I found in my
    testing that it had some bugs, so I don''t recommend it.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_101_2.png)


    Figure 3-6: Defining a PPP interface


    Your ISP''s terminal server may present a dialog box with prompts like this (many
    do):


    ```

    Welcome to Ed''s Garage Internet Services


    Please enter your login: <your login here>

    Please enter your password: <your password here>

    Starting PPP ...

    ```'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'The PPP setup just defined will work without any changes. The default behavior
    of the PPP connection process is to wait for the login: prompt, enter the log-in
    name you provide, wait for the password: prompt, and enter the password you provide.
    If your screen looks like this, click Accept to complete the PPP setup and exit
    all the way out of linuxconf to the command prompt.


    # CUSTOMIZING PPP CONNECTION PROMPTS


    It''s quite common for ISP terminal servers to operate in the manner just described,
    but let''s assume the dialog box looks like the one shown here instead, where
    you have to supply a command to enter PPP mode first and then supply a log-in
    name and password. And just for fun, let''s assume the ISP sends a username: prompt
    instead of a login: prompt.


    ```

    Welcome to the CyberSurf Domain, Dude!


    Options Menu


    1 - Display Help

    2 - Account Information and Rates

    3 - Online signup form

    PPP - Start a PPP connection


    Enter command: PPP


    Please enter your username: <your login here>

    Please enter your password: <your password here>


    Starting PPP ...

    ```


    You will need to change your PPP setup so that the order of the Expect and Send
    prompts matches the order and spelling of the terminal server''s prompts. In this
    case, click the Customize button and scroll down to the "Chat" section of the
    page. An example that will work for the terminal dialog box that expects you to
    respond to the command:, username:, and password: prompts, in that order is shown
    in Figure 3-7.


    Your goal is to match the command prompts presented by your ISP''s terminal server
    by filling in the Expect and Send prompts on this screen accordingly. Click Accept
    to complete the PPP setup and exit all the way out of linuxconf to the command
    prompt.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Figure 3-7a: The Waiting... dialog


    ![](img/3137cdda7122042e86dbeafe9840d4ed_103_0.png)


    # Figure 3-7: Customizing a PPP log-in screen


    ![](img/3137cdda7122042e86dbeafe9840d4ed_103_1.png)


    # Figure 3-7b: The Network Monitor


    ![](img/3137cdda7122042e86dbeafe9840d4ed_103_2.png)


    # STARTING PPP


    Once your setup is complete, you can make a PPP connection to the Internet by
    clicking on Gnome Foot • Internet • RH PPP Dialer.


    When the Waiting... dialog (Figure 3-7a) is replaced by the Network Monitor (Figure
    3-7b), you should be connected and ready to launch your browser, email, or other
    Internet applications. To verify that your Internet connection was successful,
    examine the output of the ifconfig command (issue it with your connection up and
    running), which might look like this:


    ```

    loo

    Link encap: Local Loopback

    inet addr:127.0.0.1 Bcast:127.255.255.255

    UP BROADCAST LOOPBACK RUNNING MTU:2000 Metric:1


    ppp0

    Link encap: Point-Point Protocol

    inet addr:205.161.119.112 P-t-P:205.161.119.3

    UP POINTOPOINT RUNNING MTU:1500 Metric:1

    ```


    The first few lines show the status of loo, your local loopback interface. The
    local loopback is like your intranet—a local network that allows you to exchange
    email with other users on your system, access files on the local Web server, and
    so on. The loo device will always have an IP address of 127.0.0.1, and the status
    line should say UP and RUNNING.


    If you see a ppp0 device listed in the ifconfig output, you have an active PPP
    connection to the Internet. Your computer is now a peer to'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'all the other computers on the Internet, with its very own IP address (205.161.119.112
    in this example). In fact, anyone on the Internet could connect to this address
    via Telnet, FTP, or a Web browser! But be aware that this IP address is dynamically
    assigned from a pool of addresses that your ISP makes available for dial-up users.
    Next time you connect, you will likely get a different IP address.


    Your ISP can probably assign you a permanent IP address (for a fee) if you like,
    but that would require some changes to your PPP connection setup. Refer to the
    PPP-HOWTO file for information on how to specify a permanent IP address for use
    with pppd. (Visit the Linux Documentation Project home page on the Web at http://sunsite.unc.edu/mdw/linux.html
    to find all the HOWTO files.)


    # STOPPING PPP


    To hang up the modem and terminate a PPP connection, click on the Network Monitor,
    select Disconnect, and then confirm you want to stop the connection.


    # HELP—IT DIDN’T WORK!


    If you hear the modem hang up unexpectedly while trying to dial in to the Internet,
    or if you never get a PPP connection, look in the /var/log/messages file for any
    message that might help you identify the problem. You should be able to modify
    your setup to correct the problem by following the interplay of prompts and commands
    and making corrections to fix any glitches. It may also be helpful to use Minicom
    to dial up your ISP and write down exactly the prompts and the correct responses
    to get connected. Minicom can’t actually make a PPP connection, but it may help
    you clearly see what needs to be done in terms of prompts and responses.


    # TEXT-BASED INTERNET TOOLS


    Believe it or not, the Internet existed prior to the advent of the graphical Web
    browser. Before the invention of Mosaic in 1990, netizens were emailing, transferring
    files, logging into remote machines, and even surfing the Web using text-based
    tools from a Unix command line.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Many users actually prefer to use text-based clients (tools that enable end
    users to connect to various types of Internet servers) because the graphical environment
    adds a lot of overhead, slowing things down. And some people just prefer the keyboard
    to a mouse.


    > NOTE: It’s important to know the basics of using the Net from a command line,
    since you might not want (or have the hardware) to run X Windows on your system.
    These same techniques will come in handy if you have a Unix shell account through
    your ISP.


    # USING FTP


    FTP (which stands for file transfer program or file transfer protocol, depending
    on how many pencils you wear in your pocket protector) is the Internet file mover.
    You use it to transfer files from one computer to another. Most often, you’ll
    be using it to download software to your computer, so try that now. To start a
    text-based FTP client from your Linux command line, enter the ftp command followed
    by a site name, like this:


    ```

    ftp ftp.devolution.com

    ```


    When prompted, specify anonymous as the log-in name and your email address as
    the password. You’ll be connected to devolution.com’s FTP site, where you can
    download Maelstrom—a cool Asteroids-like game for X Windows. After getting logged
    in to the server, you can enter these commands to download the compressed binary
    file for Maelstrom:


    ```

    bin

    cd /pub/maelstrom/Maelstrom-binaries/linux-x86/

    get Maelstrom.tar.gz

    quit

    ```


    Use the help command if you’re not familiar with FTP. After the get command is
    finished, quit will return you to the Linux command prompt, and you’ll have a
    file named Maelstrom.tar.gz in the current directory. To uncompress the file and
    create the executable on your system, enter this:


    ```

    tar xvfz Maelstrom.tar.gz

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: "Refer to Chapter 11, “Compression, Encoding, and Encryption,” for more information\
    \ on handling compressed files.\n\n# USING TELNET\n\nTelnet is a tool that lets\
    \ you log in to other computers on the Internet. Why would you want to do that?\
    \ Simple: to access the interesting stuff on those other computers, such as databases,\
    \ games, card catalogs, and information services. If you have a shell account\
    \ with your ISP, you might want to telnet there from your Linux system and check\
    \ your email with Pine.\n\nTelnet is strictly text-based—you can’t point or click\
    \ on anything. Whether you telnet from a command line or from a GUI, your Telnet\
    \ session will look pretty much the same, and all your navigation in a Telnet\
    \ session is via the keyboard. To start a text-based Telnet client from your Linux\
    \ command line, enter the telnet command followed by a site name (and, sometimes,\
    \ a port number), like this:\n\n```\ntelnet cybersurf.com\n```\n\nThis is a fictitious\
    \ example that shows how you might log in to a shell account on your ISP’s system.\
    \ Here’s a real example that will connect you to the Ham Radio Call Book database\
    \ at the University of Buffalo (commands you enter are shown in boldface):\n\n\
    ```\ntelnet electra.cs.buffalo.edu 2000\n```\n\n```\nConnected to electra.cs.buffalo.edu.\n\
    Callbook v1.3 -- Type 'help' for help\n>> help\nAvailable commands:\n    call\
    \ [filters] callsign    - lookup callsign\n    city [filters] city        - lookup\
    \ city\n    name [filters] surname     - lookup last name\n    quit          \
    \             - exit the server\n    zip [filters] zipcode      - lookup zip code\n\
    > city Tillson\nCall-Sign: WA2TNW            Class: GENERAL\nReal Name: DONALD\
    \ G WOOD     Birthday: OCT 31, 1919\nMailing Address: BOX 873 ROSE AVE, TILLSON,\
    \ NY 12486\nValid From: DEC 29, 1987     To: DEC 29, 1997\n>> quit\n```"
