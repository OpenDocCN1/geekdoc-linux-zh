- pgno: 58
  md: '# SHUT DOWN AND REBOOT


    When you see the **Congratulations** screen, you''re almost at the finish line.
    If you chose the partitionless install method, leave the boot disk in the floppy
    drive—otherwise remove it now. Press the **Exit** button to continue, and a bunch
    of messages will show various systems shutting down. Then you''ll boot up into
    your grand and glorious new Linux system. You must **remove the installation CD**
    before the system reboots, or you may find yourself rerunning the install.


    If you chose the text-mode shell prompt for your bootup option, a prompt like
    this will greet you:


    ```

    [root@localhost /root] #

    ```


    If you''re familiar with Linux commands, you can enter them at the pound sign
    (#) prompt. Otherwise, use the **startx** command to start the GNOME graphical
    interface, and proceed to Chapter 2, "The Linux GUI."


    # POST INSTALLATION: CONFIGURATION


    After a successful Linux install, you need to take a few steps to get all your
    hardware working properly with Linux. In this section, you''ll learn how to configure
    your printer, sound card, and CD-ROM drive.


    # CONFIGURING A PRINTER


    To configure a printer, enter the **printtool** command from a shell prompt, or
    click on **Gnome Foot • System • Control Panel**, then select the printer icon.
    When the **Print System Manager** window appears, click the **Add** button (Figure
    1-16).


    Linux will ask how the printer connects to your computer; the most likely response
    is **Local Printer**, which means it plugs directly into the'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'back of your computer. If your printer is on a network, ask the administrator
    for the information needed to configure it for Linux. Press **OK** to continue.


    On the **Edit Local Printer Entry** screen (Figure 1-17), leave the default values,
    and press the **Select** button to continue.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_59_0.png)


    *Figure 1-16: Adding a printer definition*


    ![](img/3137cdda7122042e86dbeafe9840d4ed_59_1.png)


    *Figure 1-17: Configuring a printer*'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'On the Configure Filter screen (Figure 1-18), select the printer that most
    closely matches yours, then choose the appropriate paper size and resolution.


    ![](img/3137cdda7122042e86dbeafe9840d4ed_60_0.png)


    Figure 1-18: Specifying printer model and specs


    Press OK twice to return to the Print System Manager window, then select lpd •
    Restart lpd to activate your printer. When finished, select PrintTool • Quit to
    exit.


    # CONFIGURING A SOUND CARD


    To configure a sound card, enter the sndconfig command from a shell prompt. When
    the Sound Configuration Utility screen appears (Figure 1-19), press OK to probe
    your system. If the probe finds a sound card it can autoconfigure, it will do
    so. Otherwise you must select your sound card from a list and enter the port,
    IRQ, and DMA information. The information you got from the Windows Device Manager
    will help you here. After making your selections, sndconfig will play sound and
    music clips and ask if you could hear them. If not, go back and try different
    settings.'
  merge: -1
  img_proc: true
