- pgno: 302
  md: 'Microsoft Windows—such as File Manager, Clock, Calculator, Notepad, WordPad,
    and Paintbrush—will work fine, as will most of the games in the Microsoft Entertainment
    pack. However, larger and more complex programs such as Microsoft Word for Windows
    may run poorly, or sometimes not at all.


    If you''re intoxicated by the mere thought of learning more about Wine, the best
    source of up-to-date information is the comp.emulators.ms-windows.wine newsgroup.
    You can also find lots of information online at the WineHQ Web site.


    # RUNNING VMWARE: INDUSTRIAL-STRENGTH VIRTUAL WINDOWS


    VMware is a very cool software package that enables multiple operating systems
    and associated applications to run concurrently on a single machine, without disk
    partitioning or rebooting. In practical terms, that means you can boot up Windows
    95/98 under Linux and run both at the same time!


    This is not emulation—you actually boot Windows from your DOS partition and run
    the Windows desktop right along with your windowed Linux applications (see Figure
    2-3). You can even cut and paste between Linux and Windows applications. Right
    now, I''m writing this with Windows 95 and Microsoft Word in a VMware window,
    while Netscape for Linux and a bunch of other Linux stuff is happily running on
    my X Windows desktop.


    VMware works wonderfully and is an indispensable tool for anyone who wants to
    run Linux full-time but can''t live without certain Windows software packages.
    The only drawback is that VMware isn''t free. Students, hobbyists, and home users
    can buy the noncommercial version for $99, which includes all the powerful capabilities
    of the VMware commercial product but with minimal support. For more information,
    visit the VMware Web site at http://www.vmware.com/.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '![](img/3137cdda7122042e86dbeafe9840d4ed_303_0.png)


    Figure 12-3: Running Microsoft Windows on the X Windows desktop


    # MORE LINUX COMPATIBILITY TOOLS


    If you''re a Macintosh user, you might want to check out the Executor 2 product
    from ARDI, which is a Macintosh emulator for Linux. Not only does it read and
    write Macintosh-format files on floppies and hard drives, but it also runs many
    Macintosh applications flawlessly.

    And if you have multiple computers running a mixture of Windows and Linux, you
    should have Samba. Samba gives you an easy way to share disks and printers between
    the two systems, and best of all, it''s free. You can learn more about Samba on
    the Web at http://www.samba.org/.'
  merge: -1
  img_proc: true
