    # PROGRAMMING SCRIPTS WITH PERL


    Perl is an interpreted language that is very popular in the Unix community because
    it has a rich and powerful feature set, but is still easy to use. Perl borrows
    heavily from other languages such as C and awk and is especially useful for processing
    text, generating reports, and handling Common Gateway Interface (CGI) requests
    submitted via Web browsers.


    Perl has been ported to many non-Unix environments, including DOS, OS/2, Macintosh,
    VMS, and Windows NT. The fact that a Perl program can run with little or no modification
    on many different platforms is another reason for its popularity. In this section,
    I''ll introduce you to basics of Perl and point you to some resources where you
    can learn more.


    # PERL BASICS


    To create a Perl script, use a text editor to enter Perl commands, save the file
    with a .pl extension (such as sample.pl), and then use chmod to mark the file
    as executable. The extension is not required, but it''s a common Unix convention
    and will help you identify your Perl source files without looking inside.'
