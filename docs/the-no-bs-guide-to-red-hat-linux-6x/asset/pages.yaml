    Changes happen fast in the Linux world, but we’ll do our best to keep you posted
    about anything that affects the content of this book after press time. Visit http://www.nostarch.com/rhl_updates.htm
    for more information.


    # WHERE AM I?


    In this introduction to Linux, you’ve learned the basic tasks of an operating
    system and how it differs from application software. You’re now an expert on Unix
    history, you understand that Linux is a version of Unix for ordinary PCs, and
    you can even pronounce the name correctly. You don’t have a clue about hardware
    requirements or installation, but that’s coming next.'
