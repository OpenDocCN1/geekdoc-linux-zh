  md: '# BASIC LINUX COMMANDS


    Linux Shell or “Terminal”


    So, basically, a shell is a program that receives commands from the user and gives
    it to the OS to process, and it shows the output. Linux''s shell is its main part.
    Its distros come in GUI (graphical user interface), but basically, Linux has a
    CLI (command line interface). In this tutorial, we are going to cover the basic
    commands that we use in the shell of Linux.


    To open the terminal, press Ctrl+Alt+T in Ubuntu, or press'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'Alt+F2, type in gnome-terminal, and press enter. In Raspberry Pi, type in lxterminal.
    There is also a GUI way of taking it, but this is better!


    # Linux Commands and their corresponding Basic Commands


    +   1. pwd — When you first open the terminal, you are in the home directory of
    your user. To know which directory you are in, you can use the “pwd” command.
    It gives us the absolute path, which means the path that starts from the root.
    The root is the base of the Linux file system. It is'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'denoted by a forward slash( / ). The user directory is usually something like
    "/home/username".


    +   2. Is — Use the "ls" command to know what files are in the directory you are
    in. You can see all the hidden files by using the command "ls -a".


    +   3. cd — Use the "cd" command to go to a directory. For example, if you are
    in the home folder, and you want to go to the downloads folder, then you can type
    in "cd Downloads". Remember, this command is case sensitive, and you have to type
    in the the'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'name of the folder exactly as it is. But there is a a problem with these commands.
    Imagine you have a folder named “Raspberry Pi”. In this case, when you type in
    “cd Raspberry Pi”, the shell will take the second argument of the command as a
    different one, so you will get an error saying that the directory does not exist.
    Here, you can use a backward slash. That is, you can use “cd Raspberry\ Pi” in
    this case. Spaces are denoted like this: If you just type “cd” and press enter,
    it takes you to the home directory. To go back from'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'a folder to the folder before that, you can type "cd .." . The two dots represent
    back.


    +   4. mkdir & rmdir — Use the mkdir command when you need to create a folder
    or a directory. For example, if you want to make a directory called "DIY", then
    you can type "mkdir DIY". Remember, as told before, if you want to create a directory
    named "DIY Hacking", then you can type "mkdir DIY\ Hacking". Use rmdir to delete
    a directory. But rmdir can only be used to delete an empty directory.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'To delete a directory containing files,

    use rm.


    +   5. rm - Use the rm command to delete files and directories. Use "rm - r" to
    delete just the directory. It deletes both the folder and the files it contains
    when using only the rm command.


    +   6. touch — The touch command is used to create a file. It can be anything,
    from an empty txt file to an empty zip file. For example, "touch new.txt".'
  merge: -1
