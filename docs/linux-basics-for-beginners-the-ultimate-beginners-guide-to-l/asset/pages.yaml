- img_proc: true
  md: '# INTRODUCTION: A BEGINNERS


    # GUIDE TO LINUX


    Linux offers a different take on desktop computing than Windows and macOS


    The Linux operating system offers a rich mix of features and security that make
    it a great free and (mostly) open-source alternative to macOS and Microsoft Windows.
    Because it''s different "under the hood," consider some of the big-picture aspects
    of Linux and how it compares to the'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'other desktop operating systems before you take the plunge.


    # What Is Linux?


    Linux powers a variety of computer systems from light bulbs to guns, laptops to
    large computer centers.


    Linux powers everything from your phone to your smart refrigerator.


    In desktop computing, Linux provides an alternative to commercial operating systems
    such as Windows and macOS.


    Linux sources from some of the earliest computer operating systems'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'from the 1960s and 1970s, and so it retains its root philosophies of strong
    user-level security, customization, and system stability.


    For those in the know, you understand that Linux is actually everywhere. It’s
    in your phones, in your cars, in your refrigerators, your Roku devices. It runs
    most of the Internet, the supercomputers making scientific breakthroughs, and
    the world’s stock exchanges. But before Linux became the platform to run desktops,
    servers, and embedded systems across the globe, it was (and'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'still is) one of the most reliable, secure, and worry-free operating systems
    available.


    Just like Windows XP, Windows 7, Windows 8, and Mac OS X, Linux is an operating
    system. An operating system is software that manages all of the hardware resources
    associated with your desktop or laptop. To put it simply – the operating system
    manages the communication between your software and your hardware. Without the
    operating system (often referred to as the “OS”), the software wouldn’t function.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'The OS is comprised of a number of pieces:


    The Bootloader: The software that manages the boot process of your computer. For
    most users, this will simply be a splash screen that pops up and eventually goes
    away to boot into the operating system.


    The kernel: This is the one piece of the whole that is actually called “Linux”.
    The kernel is the core of the system and manages the CPU, memory, and peripheral
    devices. The kernel is the “lowest” level of the OS.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Daemons: These are background services (printing, sound, scheduling, etc) that
    either start up during boot, or after you log into the desktop.


    The Shell: You’ve probably heard mention of the Linux command line. This is the
    shell – a command process that allows you to control the computer via commands
    typed into a text interface. This is what, at one time, scared people away from
    Linux the most (assuming they had to learn a seemingly archaic command line structure
    to make Linux work). This is no longer the case. With modern'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'desktop Linux, there is no need to ever touch the command line.


    Graphical Server: This is the subsystem that displays the graphics on your monitor.
    It is commonly referred to as the X server or just "X".


    Desktop Environment: This is the piece of the puzzle that the users actually interact
    with. There are many desktop environments to choose from (Unity, GNOME, Cinnamon,
    Enlightenment, KDE, XFCE, etc). Each desktop environment includes built-in applications
    (such as file managers,'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'configuration tools, web browsers,

    games, etc).


    Applications: Desktop environments

    do not offer the full array of apps.

    Just like Windows and Mac, Linux

    offers thousands upon thousands of

    high-quality software titles that can

    be easily found and installed. Most

    modern Linux distributions (more on

    this in a moment) include App Store-

    like tools that centralize and simplify

    application installation. For example:

    Ubuntu Linux has the Ubuntu

    Software Center (Figure 1) which

    allows you to quickly search among'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'the thousands of apps and install them from one centralized location.


    # Why Use Linux Instead of

    Windows or macOS?


    There are many reasons why you would use Linux instead of Windows or macOS and
    here are just a few of them:


    Windows 10 Is Slow on Older Hardware


    If you use Windows XP, Vista, or an older Windows 7 PC, chances are your computer
    isn''t powerful enough to run Windows 8 or Windows 10. You have'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'two choices. You can either buy a computer running Windows 10 or run Linux.


    Certain Linux distributions don''t provide much of a performance boost as their
    desktop environments use a decent amount of memory. However, some versions of
    Linux work brilliantly on older hardware.


    For newer hardware, try Linux Mint with the Cinnamon Desktop Environment or Ubuntu.
    For hardware that is two to four years old, try Linux Mint but use the MATE or
    XFCE'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'desktop environment, which provides a lighter footprint. For older hardware,
    go for AntiX, Q4OS, Xubuntu, or Lubuntu...


    # You Don''t Like the Windows 10 User Interface


    Most people become disorient when they first use a new operating system, especially
    if the user interface has changed in any way. However, when they get used to a
    new way of doing things, they end up liking the new interface more than the old
    one.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'If you can''t get to grips with the way Windows 10 does things, you might prefer
    things to look like Windows 7, or you might decide to try something different.


    Linux Mint provides a modern look and feel, but with menus and toolbars working
    the way they always have. The learning curve to Linux Mint is no more difficult
    than upgrading from Windows 7 to Windows 10.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# # The Size of the Windows 10


    # ## Download Is Huge


    If you use Windows 7 or Windows 8 and are thinking about upgrading to Windows
    10, the download for Windows 10 is very large.


    Do you have a download limit with your broadband provider? Most Linux distributions
    can be downloaded in under 2 gigabytes. If you are tight on bandwidth, some can
    be installed for around 600 megabytes. Some are smaller than that.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'You can buy the Windows 10 USB drive, but it costs a decent sum of money.


    # Linux Is Free


    The free upgrade that Microsoft offered a couple of years ago has run out. This
    means you now have to pay for it.


    Many manufacturers ship computers with Windows 10 installed. If you are happy
    with your current computer, the only way to get a new operating system is to pay
    for the latest version'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'of Windows or download and install Linux for free.


    Linux has all the features you need in an operating system and is fully hardware
    compatible. Some people say that you get what you pay for, but this is one example
    where that doesn''t ring true.


    If Linux is good enough for the top companies in the tech industry, then it''s
    good enough to run on a home computer.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Linux Has More Free Applications


    Windows has a few flagship products such as Microsoft Office and Visual Studio,
    which make some people feel locked in. You can, however, run Microsoft Office
    on Linux using virtualization software or running the online versions.


    Most software development is web-based, and there are many good IDEs available
    for Linux. With the advance of .NET Core, you can create APIs to use with JavaScript
    web applications. Python is also a major programming language that can be'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'used cross-platform on Windows, Linux, and Macs. The PyCharm IDE is as good
    as Visual Studio. The point here is that Visual Studio isn''t the only option.


    Linux has a great set of applications that, for most people, provide all the features
    they need. For example, the LibreOffice suite is great for 99.9% of the average
    person''s needs. The Rhythmbox audio player is better than anything Windows offers,
    VLC is a great video player, the Chrome browser is available, Evolution is a a'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'great email client, and GIMP is a brilliant image editor.


    There are free applications on popular Windows download sites such as CNET, but
    you must know how to safely download and install software because bad things can
    happen when you use those sites.


    # Security


    While no operating system is completely risk-free, Windows is a big target for
    developers of viruses and malware. There is little that Microsoft can do about
    this issue. As such, you'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'must install an antivirus application and firewall software which eats into
    your memory and CPU usage as the constant stream of downloads required to keep
    this software up to date.


    With Linux, you only need to be clever, stick to trusted software repositories,
    and avoid using risky programs such as Adobe Flash.


    Linux is more secure than Windows because of the way it''s designed and handles
    user permissions. This is one'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'reason why most of the web runs on Linux.


    # Performance


    Linux, even with all the effects and shiny features of modern desktop environments,
    runs faster than Windows 8.1 and Windows 10.


    Users are becoming less reliant on the desktop and more reliant on the web. Do
    you need all your processing power taken up with the operating system, or do you
    want something with a lighter footprint, letting you get on with your work and
    play?'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Privacy


    The Windows 10 privacy policy has been well-documented in the press. It isn''t
    as bad as some people would have you believe, and Microsoft isn''t doing anything
    that Facebook, Google, Amazon, and others haven''t been doing for years.


    For instance, the voice control system Cortana learns the way you talk and gets
    better as it goes along by sending usage data to Microsoft. Microsoft uses this
    data to improve the way Cortana works. Cortana sends targeted advertisements,
    but'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Google already does this, and it is a part of modern life.


    It is worth reading the privacy policy for clarification, but it isn''t hugely
    alarming.


    Most Linux distributions don''t collect your data. You can remain hidden away
    from Big Brother (as long as you never use the internet).


    # Reliability


    Windows is not as reliable as Linux. How many times have you, as a Windows user,
    had a program hang, and when you try to close it from the'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Task Manager (assuming you can get it to open), it remains open, and it takes
    several attempts to close the offending program?


    With Linux, each application is self-contained, and you can kill any application
    with the XKill command.


    Aside from all that, Linux applications tend to lock up less frequently. Because
    Linux and many of its applications are open-source, anyone can look at, review,
    and improve the underlying code. This leads to a'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'stable system with quick fixes for bugs and security issues.


    # Updates


    It can be frustrating when you want to print theater tickets, cinema tickets,
    or directions to a venue and you turn on your computer to see the following message:


    "Installing Update 1 of 356"


    Even more annoying is that Windows chooses when to install updates, and it displays
    a message saying that your computer is going to be rebooted. As a user, it should
    be up to you when to'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'install updates, and updates shouldn''t be forced on you or you should, at
    least, get a notice.


    Another downside is that Windows often needs to be rebooted to install updates.


    Linux operating systems need to be updated. There is no getting around that security
    holes are patched all the time. You get to choose when those updates are applied,
    and in most cases, the updates can be applied without rebooting the operating
    system.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Linux distributions are highly customizable. You can completely change the
    look and feel and adjust nearly every part of it so that it works the way you
    want.


    Windows has a limited set of tweaks available, but Linux lets you alter absolutely
    everything.


    Support


    Microsoft has a lot of documentation, but when you get stuck, you may need to
    search their forums, and'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'other people may have asked a question that has no good answers.


    It isn''t that Microsoft''s support is bad; on the contrary, it is in-depth and
    good. The truth is, however, that they employ people to offer support, and there
    is only so much money that is budgeted for this support, and the wealth of knowledge
    is spread thinly.


    Linux support is easier to find, and there are dozens of forums, hundreds of chat
    rooms, and even more websites dedicated to helping people learn and understand
    Linux.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Unlike Microsoft support, which is likely coming from an employee, Linux support
    generally comes from enethusiasts. These people genuinely enjoy working with their
    operating system and probably do so professionally. In some cases, you can talk
    with the developer that wrote the piece of software that you need assistance with.


    # Prerequisite for studying Linux


    To get started with Linux, you need to have basic computer skills. That means
    if you know how to operate a'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'computer and its components, you are good to go.


    Anyone with the knowledge on how to browse the web can successfully go through
    the Linux learning resources.


    The requirements are also low when it comes to hardware. Any basic machine with
    single-core CPU, 128 MB of memory and few GBs of harddisk can run Linux.


    However, we recommend having at least dual-core machine, 15 GB hard disk and 2
    GB of RAM for optimal learning performance.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'In short, you need minimal things to get started with Linux. Also, you need
    one Linux distro copy.


    # Which Linux Distribution Should You Use?


    The Linux kernel is like an engine. A distribution is an actual vehicle that houses
    the engine.


    So which Linux distribution should you choose? Linux supports several hundred
    distributions, each optimized for some specific use case:


    Linux Mint: Requires low computer expertise, easy to install, easy to use'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'and has a familiar-looking desktop for Windows users.


    Debian: For those seeking a truly free Linux distribution with no proprietary
    drivers, firmware or software, then Debian is for you.


    Ubuntu: A modern Linux distribution that is easy to install and easy to use.


    openSUSE: A stable and powerful Linux distribution. Not as easy to install as
    Mint and Ubuntu but a good alternative nonetheless.


    Fedora: The most up-to-date Linux distribution with all new concepts'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'incorporated at the earliest possible opportunity.


    Mageia: Rose from the ashes of the formerly great Mandriva Linux. Easy to install
    and easy to use.


    CentOS: As with Fedora, CentOS is based on the commercial Linux distribution,
    Red Hat Linux. Unlike Fedora, it is built for stability.


    Manjaro: Based on Arch Linux, Manjaro provides a great balance between ease of
    use and up to date software.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'LXLE: Based on the lightweight Lubuntu distribution this provides a fully-featured
    Linux distribution for older hardware.


    Arch: A rolling release distribution, meaning that you don''t have to install
    new versions of the operating system at any point because it updates itself. More
    difficult for the new user to get to grips with but very powerful.


    Elementary: Linux for people who like a Mac-style interface.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# HOW TO RUN LINUX FROM A DVD OR USB


    A live Linux DVD or USB lets you run Linux without installing it to your hard
    drive. This basically lets you test drive Linux before committing to it and is
    also good for the occasional user.


    Most distributions use a live loader to both test and install the distribution.
    Ubuntu Linux, a common choice for new Linux hobbyists, offers an excellent live
    environment.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# How to Install Linux


    Each Linux distribution relies upon a different installer, which is a program
    that guides you through configuring Linux. In most cases, you''re free to install
    Linux as the new operating system on a computer or as a separate OS that doesn''t
    overwrite Windows.


    # What Is a Desktop Environment?


    A typical Linux distribution includes several different components.'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'A display manager logs you in while a window manager governs windows, panel,
    menus, dash interfaces and core applications. Many of these items are bundled
    together to make a desktop environment.


    Some Linux distributions ship with just one desktop environment (although others
    are available in the software repositories), while others offer different versions
    of the distribution fine-tuned for different desktop environments.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'Common desktop environments include Cinnamon, GNOME, Unity, KDE, Enlightenment,
    XFCE, LXDE and MATE.


    Cinnamon is a more conventional desktop environment that looks much like Windows
    7, with a panel at the bottom, a menu, system tray icons, and quick launch icons.


    GNOME and Unity are fairly similar. They are modern desktop environments that
    use the concept of launcher icons and a dashboard-style display for picking applications.
    There'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'are also core applications that integrate well with the overall theme of the
    desktop environment.


    KDE is a classic-style desktop environment with many custom features and a core
    set of applications that are all highly customizable.


    Enlightenment, XFCE, LXDE, and MATE are lightweight desktop environments with
    panels and menus.


    # Are There Any Decent Office Suites for Linux?


    For personal use and for small- to medium-sized businesses, LibreOffice'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'presents a strong alternative to Microsoft Office, for free.


    LibreOffice comes with a word processor with the majority of the features you
    expect from a word processor. It also features a decent spreadsheet tool that
    is full-featured and includes a basic programming engine, although it isn''t compatible
    with Excel VBA.


    Other tools include the presentation, maths, database, and drawing packages which
    are all good.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# HOW TO INSTALL SOFTWARE


    # USING LINUX


    Linux does not install software the same way that Windows does. A package manager
    accesses repositories that archive various software applications that work on
    a given distribution. The package management tool provides a mechanism to search
    for software, install software, keep the software up to date, and remove the software.


    Each distribution provides its own graphical tool. There are common'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'command-line tools used by many different distributions.


    For example, Ubuntu, Linux Mint, and Debian all use the apt-get package manager.
    Fedora and CentOS use the yum package manager. Arch and Manjaro use Pacman.


    # The Linux Command Line


    Given its long heritage and the diversity of approach of modern desktop environments,
    a lot of Linux still works from a shell session. In the macOS world, these sessions
    are'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'called the terminal; in Windows, the Command Prompt.


    Although the graphical user interface of modern Linux DEs can do just about everything,
    much online education about Linux relies on the shell because it''s not tied to
    the peculiarities of a given distribution or window manager. People new to Linux
    can get away with rarely or never working from the shell, but people who grow
    to love Linux often go to the shell first because of how easy it is to type one
    command instead of'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'clicking through many different menus.


