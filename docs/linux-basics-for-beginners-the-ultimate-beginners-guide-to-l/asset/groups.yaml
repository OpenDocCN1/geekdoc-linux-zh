    # 引言：Linux 初学者指南


    Linux 提供了与 Windows 和 macOS不同的桌面计算理念。


    Linux 操作系统提供了丰富的特性和安全性，使其成为 macOS 和微软 Windows 的极佳免费且（大部分）开源的替代方案。由于它在“底层”与众不同，在投入使用之前，请考虑
    Linux 的一些宏观方面以及它与其他桌面操作系统的对比。


    # 什么是 Linux？


    Linux 驱动着从灯泡到枪支、从笔记本电脑到大型计算机中心的各种计算机系统。


    Linux 驱动着从你的手机到智能冰箱的一切设备。


    在桌面计算中，Linux 是 Windows 和 macOS 等商业操作系统的替代方案。


    Linux 源自 20 世纪 60 年代最早的计算机操作系统之一。在桌面计算中，Linux 提供了 Windows 和 macOS 这种商业操作系统的替代方案。Linux
    提供了丰富的丰富的特性和安全性。对于了解情况的人来说，你明白 Linux 无处不在。它运行在你的手机、汽车、冰箱、Roku 设备、超级计算机以及全球范围内。它保留了强大的安全性、定制化和系统稳定性的哲学。在
    Linux 成为运行桌面、服务器和嵌入式系统的平台之前，它一直是（目前仍然是）最可靠、安全且无后顾的操作系统之一。


    就像 Windows XP、Windows 7、Windows 8 和 Mac OS X 一样，Linux 是一个操作系统。操作系统是管理你的桌面或笔记本电脑相关硬件资源的软件。简单来说——操作系统（通常称为
    OS）管理软件与硬件之间的通信。如果没有操作系统，软件将无法运行。


    操作系统由许多部分组成：


    - 引导加载程序：管理计算机启动过程的软件。对于大多数用户来说，这只是一个弹出来并最终进入操作系统的启动界面。

    - 内核：这是整个系统中唯一被称为“Linux”的部分。内核是系统的核心，管理 CPU、内存和外围设备。内核是操作系统的最低层。

    - 守护进程：这些是后台服务（打印、声音、调度等），在启动期间或登录桌面后启动。

    - Shell：你可能听说过命令行。这就是 Shell —— 允许你通过文本界面输入命令来控制计算机的过程。这曾是让人们最远离 Linux 的原因（假设必须学习古老的命令结构来让
    Linux 工作）。现在不再是了。有了现代桌面 Linux，你根本不需要接触命令行。

    - 图形服务器：这是在你的显示器上显示图形的子系统。通常被称为 X 服务器或简单的“X”。

    - 桌面环境：这是用户实际交互的部分。有很多桌面环境可以选择（Unity、GNOME、Cinnamon、Enlightenment、KDE、XFCE 等）。每个桌面环境都包含内置应用程序（如文件管理器、配置工具、浏览器、游戏等）。

    - 应用：桌面环境并不提供所有的应用。就像 Windows 和 Mac 一样，Linux 提供了成千上万高质量的软件，可以很容易地找到并安装。大多数现代 Linux
    发行版（稍后会介绍）包含类似应用商店的工具，可以集中并简化应用程序安装。例如：Ubuntu Linux 拥有 Ubuntu 软件中心（图 1），允许你从一个中心位置快速搜索并安装数千个应用。


    # 为什么使用 Linux 而不是 Windows 或 macOS？


    有许多你选择 Linux 而不是 Windows 或 macOS 的原因，以下是其中几个：


    Windows 10 在旧硬件上运行缓慢


