    # INTRODUCTION: A BEGINNERS GUIDE TO LINUX


    Linux offers a different take on desktop computing than Windows and macOS.


    The Linux operating system offers a rich mix of features and security that make
    it a great free and (mostly) open-source alternative to macOS and Microsoft Windows.
    Because it''s different "under the hood," consider some of the big-picture aspects
    of Linux and how it compares to the other desktop operating systems before you
    take the plunge.


    # What Is Linux?


    Linux powers a variety of computer systems from light bulbs to guns, laptops to
    large computer centers.


    Linux powers everything from your phone to your smart refrigerator.


    In desktop computing, Linux provides an alternative to commercial operating systems
    such as Windows and macOS.


    Linux sources from some of the earliest computer operating systems from the 1960s
    and 1970s, and so it retains its root philosophies of strong user-level security,
    customization, and system stability.


    For those in the know, you understand that Linux is actually everywhere. It’s
    in your phones, in your cars, in your refrigerators, your Roku devices. It runs
    most of the Internet, the supercomputers making scientific breakthroughs, and
    the world’s stock exchanges. But before Linux became the platform to run desktops,
    servers, and embedded systems across the globe, it was (and still is) one of the
    most reliable, secure, and worry-free operating systems available.


    Just like Windows XP, Windows 7, Windows 8, and Mac OS X, Linux is an operating
    system. An operating system is software that manages all of the hardware resources
    associated with your desktop or laptop. To put it simply – the operating system
    manages the communication between your software and your hardware. Without the
    operating system (often referred to as the “OS”), the software wouldn’t function.


    The OS is comprised of a number of pieces:


    - The Bootloader: The software that manages the boot process of your computer.
    For most users, this will simply be a splash screen that pops up and eventually
    goes away to boot into the operating system.

    - The kernel: This is the one piece of the whole that is actually called “Linux”.
    The kernel is the core of the system and manages the CPU, memory, and peripheral
    devices. The kernel is the “lowest” level of the OS.

    - Daemons: These are background services (printing, sound, scheduling, etc) that
    either start up during boot, or after you log into the desktop.

    - The Shell: You’ve probably heard mention of the command line. This is the shell
    – a command process that allows you to control the computer via commands typed
    into a text interface. This is what, at one time, scared people away from Linux
    the most (assuming they had to learn a seemingly archaic command structure to
    make Linux work). This is no longer the case. With modern desktop Linux, there
    is no need to ever touch the command line.

    - Graphical Server: This is the subsystem that displays the graphics on your monitor.
    It is commonly referred to as the X server or just "X".

    - Desktop Environment: This is the piece of the puzzle the users actually interact
    with. There are many desktop environments to choose from (Unity, GNOME, Cinnamon,
    Enlightenment, KDE, XFCE, etc). Each desktop environment includes built-in applications
    (such as file managers, configuration tools, web browsers, games, etc).

    - Applications: Desktop environments do not offer the full array of apps. Just
    like Windows and Mac, Linux offers thousands upon thousands of high-quality software
    titles that can be easily found and installed. Most modern Linux distributions
    (more on this in a moment) include App Store-like tools that centralize and simplify
    application installation. For example: Ubuntu Linux has the Ubuntu Software Center
    (Figure 1) which allows you to quickly search among the thousands of apps and
    install them from one centralized location.


