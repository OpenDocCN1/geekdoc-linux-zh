    it displays your hostname and IP address. Just typing "hostname" gives the output.
    Typing in "hostname -I" gives you your IP address in your network.'
  - '[PAGE 71]


    13. ping — Use ping to check your connection to a server. Wikipedia says, "Ping
    is a computer network administration software utility used to test the reachability
    of a host on an Internet Protocol (IP) network". Simply, when you type in, for
    example, "ping google.com", it checks if it can connect to the server and come
    back. It measures this round-trip time and gives you the details about it. The
    use of this command for simple users like us is to check your internet connection.
    If it pings the Google server (in this case), you can'
  - '[PAGE 72]


    confirm that your internet connection is active!'
  - '[PAGE 73]


    # # TIPS AND TRICKS FOR USING

    # LINUX COMMAND LINE


    You can use the clear command to clear the terminal if it gets filled up with
    too many commands.


    TAB can be used to fill up in terminal.

    For example, You just need to type “cd Doc” and then TAB and the terminal fills
    the rest up and makes it “cd Documents".


    Ctrl+C can be used to stop any command in terminal safely. If it doesn''t stop
    with that, then Ctrl+Z can be used to force stop it.'
  - '[PAGE 74]


    You can exit from the terminal by using the exit command.


    You can power off or reboot the computer by using the command sudo halt and sudo
    reboot.


    # Advantages of Linux


    Let us now discuss some advantages of Linux in brief:


    +   1. Open Source


    One of the main advantages of Linux is that it is an open source operating system
    i.e. its source code is easily available for everyone. Anyone capable of coding
    can contribute,'
  - '[PAGE 75]


    modify, enhance and distribute the code to anyone and for any purpose.


    # 2. Security


    Linux is more secure in comparison to other operating systems such as Windows.
    Linux is not completely secure as there is some malware for it also but it is
    less vulnerable than others. Every program in Linux whether an application or
    a virus needs authorization from the administrator in the form of a password.
    Unless the password is typed virus won’t execute. There is no'
  - '[PAGE 76]


    In Linux you encounter a larger number of software updates. These'
  - '[PAGE 77]


    software updates are much faster than updates in any other operating system. Updates
    in Linux can be done easily without facing any major issue or concern.


    # 5. Customization


    A feature that gives a major advantage over other operating systems is customization.
    You can customize any feature, add or delete any feature according to your need
    as it is an open source operating system. Not only this, various wallpapers and
    attractive icon themes can be'
  - '[PAGE 78]


    installed to give an amazing look to your system.


    # 6. Various Distributions


    There are many distributions available also called distros of Linux. It provides
    various choices or flavors to the users. You can select any bistros according
    to your needs. Some bistros of Linux are Fedora, Ubuntu, Arch Linux, Debian, Linux
    Mint and many more. If you are a beginner you can use Ubuntu or Linux Mint. If
    you are a good programmer you may use Debian or Fedora.'
  - '[PAGE 79]


    +   7. Free to use (Low Cost)


    Linux is freely available on the web to download and use. You do not need to buy
    the license for it as Linux and many of its software come with GNU General Public
    License. This proved to be one of the major advantages Linux faces over Windows
    and other operating systems. You need to spend a huge amount to buy the license
    of Windows which is not the case with Linux.'
  - '[PAGE 80]


    # 8. Large Community Support


    Forums by excited users are made on the web to help and solve the problem any
    other user is facing.


    There are a lot of dedicated programmers there to help you out whenever and wherever
    possible.


    # 9. Stability (Reliability)


    Linux provides high stability also this is good advantage i.e. it does not need
    to be rebooted after a short period of time. Your Linux system rarely slows down
    or freezes. As in windows, you need to reboot your'
  - '[PAGE 81]


    system after installing or uninstalling

    an application or updating your

    software but this is not the case with

    Linux. You can work without any

    disturbance on your Linux systems.


    # 10. Privacy


    Linux ensures the privacy of user’s

    data as it never collects much data

    from the user while using its

    distributions or software but this is

    not true for many other operating

    systems.'
  - '[PAGE 82]


    # 11. Performance


    Linux provides high performance on various networks and workstations. It allows
    a large number of users to work simultaneously and handles them efficiently.


    # 12. Network Support


    Linux gives support for network functionality as it was written by programmers
    over the internet. Linux helps you to set up client and server systems on your
    computer systems easily and in a fast manner.'
  - '[PAGE 83]


    # 13. Flexibility


    Linux provides a high range of flexibility as you can install only required components.
    There is no need to install a full or complete suite. You can also keep Linux
    file under multiple partitions so if one of them corrupts then there is no major
    loss. You only need to repair that particular partition, not the complete file
    which is not the case with other operating systems.'
  - '[PAGE 84]


    # 14. Compatibility


    Linux runs or executes all possible file formats and is compatible with a large
    number of file formats.


    # 15. Fast and easy installation


    Linux can be easily installed from the web and does not require any prerequisites
    as it can run on any hardware, even on your oldest systems.


    # 16. Proper use of Hard Disk


    Linux performs all the tasks efficiently even after the hard disk is almost full.
    This increases the performance of the'
  - '[PAGE 85]


    Linux hence Linux provides high performance also.


    # 17. Multitasking


    Linux is a multitasking operating system as it can perform many tasks simultaneously
    without any decrease in its speed such as downloading a large file would not slow
    down the system.


    # 18. Run multiple desktops


    Linux provides various desktop environments to make it easy to use. While installing
    Linux you can choose any desktop environment according to'
  - '[PAGE 86]


    your wishes such as KDE (K Desktop Environment) or GNOME (GNU Network Object Model
    Environment).


    # What are the Disadvantages of Using Linux?


    There’s no standard edition of Linux. Whereas Microsoft offers several different
    editions of each version of Windows, there are countless variations of Linux.
    For a new user it can be confusing to work out which is best for you.


    Linux has patchier support for drivers (the software which coordinates your'
  - '[PAGE 87]


    hardware and your operating system). This means you''ll sometimes find it trickier
    to get a new device set up.


    Linux is, for new users at least, not as easy to use as Windows. That''s largely
    because Linux gives you more control, but does mean you''ll have to spend some
    time getting used to the way it works.


    Because Linux is neither as popular as Windows, nor a commercial product, support
    works in a different way. You may have to look harder to find the'
  - '[PAGE 88]


    answer to a problem and, while Linux supporters are more likely to offer help,
    it may not always match your own level of technical understanding.


    Many of the programs you are used to in Windows will only run in Linux through
    a complicated emulator. These programs aren’t guaranteed to work perfectly, and
    in some cases may be noticeably slower.


    While Linux can be suitable for an individual user, its small market share means
    it’s much harder to introduce in a corporate setting. With most'
  - '[PAGE 89]


    office workers already familiar with Windows and Microsoft programs, there’ll
    likely be a notable time cost in converting staff to using a Linux system.


    While there are perfectly passable alternatives to many Windows programs (such
    as the various Office components), some high-end applications such as Photoshop
    don’t have as close equivalents in Linux.


    Fans of PC gaming may find Linux offers them a much more limited range. That’s
    partially because the'
