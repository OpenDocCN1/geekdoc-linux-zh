    latest games are nearly always a commercial operation and much harder to reproduce
    in Linux because they are much more individual than, for example, office software.


    While there’s no specific reason why this should be the case, in practice quite
    a few users report finding printing can be troublesome to set up in Linux.


    Because Linux is a free, open source system, there are no legal comebacks if you
    find software isn’t up to scratch or if it causes a problem. While there’s no
    guarantee you’d win, you do at least have some right of complaint with commercial
    products such as Windows.


    ## MOST ESSENTIAL LINUX APPLICATIONS AND TOOLS


    ## Antivirus Tools


    - ClamAV – an open-source antivirus for fending off malware, viruses, and Trojans,
    among other malicious threats.

    - ClamTk – A lightweight graphical front-end for the popular command-line based
    ClamAV.

    - ChkrootKit – A free and open-source lightweight toolkit to locally check for
    signs of a rootkit.

    - RootKit Hunter – A remarkable lightweight, open-source security monitoring and
    analyzing tool.

    - Comodo – a powerful cross-platform anti-virus and email filtering software.


    ## Audio Players


    - Audacious – a multi-platform, lightweight, free GTK-based music player focused
    on outstanding audio quality and multiple codec support.

    - Clementine – a multi-platform Amarok-inspired music player that delivers an
    efficient user flow and outstanding UI.

    - Google Play Music – an unofficial but modern cross-platform Desktop client for
    Google Play Music.

    - Lollypop – a modern, lightweight, material design-inspired music player built
    to work wonderfully on the GNOME desktop environment.

    - Museek – a cross-platform open-source music player application developed to
    be simple and yet, efficient.


    ## Artificial Intelligence


    - Deeplearning4j - A Java library and computing framework containing a variety
    of deep learning algorithms.

    - Caffe - a speed, expression, and modularity-focused framework for deep learning.

    - H2O - an open-source platform for in-memory, distributed, and scalable predictive
    analysis and machine learning.

    - Mllib - a Spark’s scalable machine learning library consisting of common learning
    algorithms and utilities.

    - Apache Mahout - an open-source project primarily used for creating machine learning
    algorithms that are scalable.


    ## Backup Utilities


    - Rsync - a user-favourite command for syncing files locally and remotely on Unix
    and Linux computers.

    - Fwbackups - a feature-rich, free and open-source cross-platform backup application.

    - Bacula - An open-source data backup and recovery software that was made to be
    enterprise-ready features such as backup configuration, remote backing up and
    many more.

    - backupninja - a backup tool that allows users to perform secure and remote backups
    over a network. It lets users design backup activity configuration files.

    - sbackup - a backup suite for gnome desktops where users can access all configuration
    through the Gnome interface.


    ## Boot Loaders


    - GRUB - It is the most commonly used bootloader.

    - LILO - It is a simple and powerful Linux bootloader.

    - BURG – it a new kind of bootloader which ships with features such as support
    for multiple platforms like Linux and Mac OS X.

    - Syslinux - a lightweight bootloader with the ability to work from a CD-ROM,
    over a network, etc.


    ## Calendar Apps


    - Korganizer - a calendar application for scheduling with many rich features like
    supporting multiple calendars and todo lists.

    - Evolution – a Gnome personal management tool consisting of a calendar, address
    book, and an email client.

    - California – a relatively new calendar software for Gnome desktops.

    - Day Planner – a free open-source calendar software developed for Linux users
    to plan easily and manage their time.

    - Lightning – a calendar app used to easily organize schedules and events. It
    has an extension for the Thunderbird email client.


    ## Clipboard Managers


    - CopyQ - a smart clipboard manager that allows you to edit your system’s clipboard
    content.

    - Indicator Bulletin - an applet that allows you intelligently search for and
    edit your clipboard content using regular expressions.

    - Clipboard Anywhere - a free, lightweight, and cloud-enabled clipboard application
    with which you can copy to and paste from its clipboard.

    - GPaste – a powerful clipboard manager for Gnome-based systems.

    - Klipper – a clipboard app for KDE desktops.


    ## Chat Clients


    - Chatty – a Twitch chat client for everyone who appreciates a dedicated desktop
    application.

    - Caprine – a sleek Facebook Messenger client for desktops.

    - Cutagram – a user-friendly, free and open-source telegram client.

    - Ghetto Skype - an electron-built Skype client for Linux desktops via Skype Web.

    - Messenger for Desktop - an unofficial client for Facebook messenger.

    - Telegram - a messaging app with a focus on speed and security, it is super fast,
    simple and free.


    ## Cloud Storage Tools


    - Dropbox - a cloud storage that provides real-time data synchronization across
    multiple devices.

    - OwnCloud - a suite of client-server software for creating file hosting services
    and using them.

    - nextCloud - an actively maintained fork of ownCloud, a suite of client-server
    software for creating and using file hosting services.

    - Seafile - an open-source synchronization and sharing platform with a focus on
    performance and privacy.

    - Pydio - a powerful open-source cloud storage app with file sharing and synchronization
    just like the others.


    ## Communication Apps


    - Skype – a VoIP service for free calls and messages.

    - Pidgin – An instant messaging client with support for all chat services.

    - Empathy – a messaging platform with text, video chat, and file transfer.

    - Viber – With Viber, you can send free calls and messages.

    - Slack - A real-time messaging, archiving and search for modern teams — all protected
    with end-to-end encryption.


    ## Firewalls


    - Iptables - a popular command-line utility for configuring Linux kernel firewall.

    - Firewalld - a firewall which changes can be applied instantly without the need
    for a restart.

    - Shorewall - An open-source gateway/firewall configuration tool for GNU/Linux.

    - UFW - An easy to use firewall for Ubuntu and Debian distributions.

    - Vuurmuur - a powerful firewall manager built on top of iptables.


    ## Games


    - Steam - a cross-platform gaming platform that opens the gates to many games.

    - Wine ("Wine Is Not an Emulator") is a compatibility layer capable of running
    Windows applications and games on Linux.

    - PlayOnLinux - a graphical front-end for the Wine compatibility layer which allows
    Linux users to install Windows-based games.

    - RetroArch - a frontend for emulators, game engines and media players.

    - Itch.io - a simple way to find and share indie games online for free.


    ## Git Clients


    - GitKraken - a powerful GUI app which users interact better with their repositories.

    - Git-cola - a powerful and highly configurable GUI Git client.

    - SmartGit - a cross-platform GUI based Git client.

    - Giggle - a free Linux based GUI git client that uses GTK+ toolkit.

    - Gitg - a Gnome app for viewing Git repositories.

    - Git GUI - a cross-platform GUI platform that focuses on commit generation.


    ## Graphics


    - GIMP - an open-source GNU image manipulation program.

    - Aftershot - a powerful, fast and highly customizable photo management app.

    - Agave - a very simple application for the GNOME desktop that allows you to generate
    a variety of colour-schemes from a single starting colour.

    - Blender - a 3D creation suite with support for all the 3D pipelines.

    - Digikam - an open-source photo editing app meant for photographers.


    ## Hacking & Penetration Tools


    - Aircrack-ng - a complete suite of tools to assess WiFi network security.

    - THC Hydra - a parallelized login cracker which supports numerous protocols to
    attack.

    - John the Ripper - a free password cracking software tool.

    '
  mdcn: '

    最新的游戏几乎总是商业化运营，而且在 Linux 中重现要困难得多，因为它们比办公软件等更具个人化。


    虽然没有特定理由说明这种情况是必然，但在实践中，许多用户报告说，在 Linux 中设置打印功能可能会非常麻烦。


    由于 Linux 是一个免费的开源系统，如果你发现软件不符合标准或导致了问题，并没有法律上的追回手段。虽然不能保证你一定获胜，但对于像 Windows 这样的商业产品，你至少拥有某些投诉权。


    ## 核心 Linux 应用程序与工具


    ## 杀病毒工具


    - ClamAV – 一种用于防御恶意软件、病毒和木马等其他恶意威胁的开源杀毒软件。

    - ClamTk – 一个为流行的命令行 ClamAV 提供的轻量级图形界面。

    - ChkrootKit – 一个免费且开源的轻量级工具包，用于本地检查 rootkit 迹象。

    - RootKit Hunter – 一个卓越的轻量级开源安全监控与分析工具。

    - Comodo – 一款强大的跨平台杀病毒和邮件过滤软件。


    ## 音频播放器


    - Audacious – 一个多平台、轻量级、基于 GTK 的免费音乐播放器，专注于卓越的音质和对多种编码的支持。

    - Clementine – 一个受 Amarok 启发的多平台音乐播放器，提供高效的用户流和出色的 UI。

    - Google Play Music – 一个非官方但现代的 Google Play Music 跨平台桌面客户端。

    - Lollypop – 一款现代、轻量级、受 Material 设计启音乐播放器，旨在 GNOME 桌面环境中完美运行。

    - Museek – 一款跨平台开源音乐播放器应用，开发目标是简单且高效。


    ## 人工智能


    - Deeplearning4j - 一个 Java 库和计算框架，包含多种深度学习算法。

    - Caffe - 一个专注于速度、表达式和模块化的深度学习框架。

    - H2O - 一个用于内存中、分布式和可扩展预测性分析及机器学习的开源平台。

    - Mllib - Spark 的可扩展机器学习库，由常用的学习算法和工具组成。

    - Apache Mahout - 一个主要用于创建可扩展机器学习算法的开源项目。


    ## 备份实用


    - Rsync - 用户喜爱的命令，用于在 Unix 和 Linux 计算机上同步本地和远程文件。

    - Fwbackups - 一款功能丰富、免费开源的跨平台备份应用。

    - Bacula - 一款开源数据备份和恢复软件，专为企业级设计，支持备份配置、远程备份等。

    - backupninja - 一种备份工具，允许用户通过网络执行安全的远程备份。它允许用户设计备份活动配置文件。

    - sbackup - 一套针对 gnome 桌面的备份套件，用户可以通过 Gnome 界面访问所有配置。


    ## 引导加载程序


    - GRUB - 它是最常用的引导加载程序。

    - LILO - 这是一个简单且强大的 Linux 引导程序。

    - BURG – 一种新的引导程序，带有支持 Linux 和 Mac OS X 等多个平台的功能。

    - Syslinux - 一个轻量级引导程序，能够通过 CD-ROM、网络等工作。


    ## 日历应用


    - Korganizer - 一个用于日程管理的日历应用，具有许多丰富功能，如支持多个日历和待办列表。

    - Evolution – Gnome 个人管理工具，由日历、地址录和邮件客户端组成。

    - California – 针对 Gnome 桌面的较新的日历软件。

    - Day Planner – 为 Linux 用户开发的免费开源日历软件，方便用户轻松规划和管理时间。

    - Lightning – 一个用于方便组织日程和事件的日历应用。它拥有 Thunderbird 邮件客户端的扩展。


    ## 剪贴板管理器


    - CopyQ - 一个智能剪贴板管理器，允许你编辑系统的剪贴板内容。

    - Indicator Bulletin - 一个小组件，允许你使用正则表达式智能地搜索和编辑剪贴板内容。

    - Clipboard Anywhere - 一个允许你跨设备同步剪贴板内容的应用程序。

    - GPaste - 针对 Gnome 的剪贴板管理器。

    - Klipper - 针对 KDE 的剪贴板应用。


    ## 聊天客户端


    - Chatty – 一个 Telegram 客户端。

    - Caprine – 一个专注于 Telegram 的桌面客户端。

    - Empathy – 一个支持所有聊天服务的即时消息软件。

    - Telegram – 一个带有端到端加密的 Viber 平台。

    - Viber – 一个提供免费通话和消息的服务。

    - Slack - 团队实时消息、存档和搜索工具。


    ## 云存储工具


    - Dropbox - 一个用于跨设备数据同步的工具。

    - OwnCloud - 一套用于文件共享的服务器软件。

    - nextCloud - 一个专注于性能和隐私的同步平台。

    - Seafile - 一个用于文件共享的开源软件。

    - Pydio - 一套用于文件共享的服务。


    ## 防火墙


    - Iptables - 用于配置 Linux 内核防火墙的流行命令行。

    - Firewalld - 一个无需重启即可应用更改的防火墙。

    - Shorewall - 用于 GNU/Linux 的工具。

    - UFW - 用于 Ubuntu 和 Debian 的易用防火墙。

    - Vuurmuur - 构建在 iptables 之上的强大防火墙管理器。

    '
