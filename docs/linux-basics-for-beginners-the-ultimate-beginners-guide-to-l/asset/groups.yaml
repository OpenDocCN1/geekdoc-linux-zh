    performance and privacy.


    Pydio - A powerful open-source cloud storage app with file sharing and synchronization
    just like the others.'
  - '[PAGE 104]


    # Communication Apps


    Skype – A VoIP service for free calls and messages as well as cheap internet calls.


    Pidgin – An instant messaging client with support for all chat services including
    Yahoo, Google Talk, and Aim.


    Empathy – A messaging platform with text, voice, video chat, and file transfer
    support.


    Viber – With Viber, you can send free calls and messages to other Viber users
    anywhere in the world.'
  - '[PAGE 105]


    Wire - A best instant messaging app that provides business chats, one-click voice
    and video conference calls and shared documents — all protected with end-to-end
    encryption.


    Slack - A real-time messaging, archiving and search for modern teams.


    # Firewalls


    Iptables - A popular command-line utility for configuring Linux kernel firewall.'
  - '[PAGE 106]


    Firewalld - A firewall which changes can be applied instantly without the need
    for a restart.


    Shorewall - An open-source gateway/firewall configuration tool for GNU/Linux.


    UFW - An easy to use firewall for configuring and managing a firewall on Ubuntu
    and Debian distributions.


    Vuurmuur - A powerful firewall manager built on top of iptables on Linux.'
  - '[PAGE 107]


    # Games


